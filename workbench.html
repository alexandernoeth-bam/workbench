<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F2">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Workbench 0.8.2</title>
<script>
/* Muss vor dem Rendern stehen, sonst springt das Layout beim ersten Zeichnen. */
(function () {
  function hoehe() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
  }
  hoehe();
  window.addEventListener('resize', hoehe);
  window.addEventListener('orientationchange', hoehe);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --papier:#F6F5F2;
  --karte:#FFFFFF;
  --tinte:#2E2C29;
  --grau:#645F58;
  --grau-hell:#8A857D;
  --linie:#D4D0C8;
  --weinrot:#8A0B22;
  --petrol:#19525A;
  --fs:17.6px;
  --app-h:100%;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--papier);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--tinte);font-size:var(--fs);line-height:1.45;
  display:flex;flex-direction:column;height:var(--app-h);overflow:hidden;
}

/* ---------- Kopf ---------- */
.kopf{padding:14px 20px 0;flex:0 0 auto}
.kopf-zeile{display:flex;align-items:baseline;gap:9px}
.kopf-titel{font-size:calc(var(--fs)*1.25);font-weight:600;letter-spacing:-.01em}
.kopf-version{font-size:calc(var(--fs)*0.78);color:var(--grau)}
.kopf-linie{height:2px;background:var(--weinrot);margin-top:11px}

/* ---------- Bildschirme ---------- */
.schirm{display:none !important;flex:1 1 auto;overflow-y:auto;padding:6px 20px 24px}
.schirm.aktiv{display:flex !important;flex-direction:column}

.abschnitt-titel{font-size:calc(var(--fs)*0.78);font-weight:500;color:var(--grau);
  display:flex;align-items:center;gap:8px;margin:16px 0 7px}
.abschnitt-titel::after{content:"";flex:1;height:1px;background:var(--linie)}

.zeile{display:flex;align-items:baseline;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--linie)}
.zeile-name{flex:1;min-width:0;font-size:calc(var(--fs)*0.85)}
.zeile-wert{flex:0 0 auto;font-size:calc(var(--fs)*0.85);font-variant-numeric:tabular-nums;
  text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile-wert.ja{color:var(--petrol)}
.zeile-wert.nein{color:var(--weinrot)}
.zeile-wert.grau{color:var(--grau)}

.knopfreihe{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.knopfreihe button{flex:1 1 44%;font:inherit;font-size:calc(var(--fs)*0.82);padding:10px;
  border:1px solid var(--linie);border-radius:6px;background:var(--karte);
  color:var(--tinte);cursor:pointer}
.knopfreihe button.stark{border-color:var(--weinrot);color:var(--weinrot);font-weight:500}
.knopfreihe button:disabled{color:var(--grau-hell);cursor:default}

.melder{margin-top:14px;font-size:calc(var(--fs)*0.8);padding:9px 11px;border-radius:6px;
  background:var(--karte);border:1px solid var(--linie);color:var(--grau);
  white-space:pre-wrap;line-height:1.5}
.melder.warn{border-color:var(--weinrot);color:var(--weinrot)}
.melder.gut{border-color:var(--petrol);color:var(--petrol)}

input[type=file]{font:inherit;font-size:calc(var(--fs)*0.82);width:100%;
  border:1px solid var(--linie);border-radius:6px;padding:9px;background:var(--karte);
  color:var(--tinte);margin-bottom:4px}
.platzhalter{color:var(--grau-hell);font-size:calc(var(--fs)*0.85);padding:18px 0}


/* ---------- Tagesplan ---------- */
#schirmTag{padding:0}
.tagkopf{flex:0 0 auto;padding:14px 20px 0}
.tk-zeile{display:flex;align-items:baseline;gap:10px}
.tk-zahl{font-size:calc(var(--fs)*2.3);font-weight:600;letter-spacing:-.02em;line-height:1}
.tk-text{display:flex;flex-direction:column;gap:1px}
.tk-wochentag{font-size:calc(var(--fs)*1.0);font-weight:500;line-height:1.1}
.tk-monat{font-size:calc(var(--fs)*0.8);color:var(--grau);line-height:1.1}
.tk-form{margin-left:auto;align-self:center;font-size:calc(var(--fs)*0.74);font-weight:500;
  color:var(--weinrot);border:1px solid var(--weinrot);border-radius:3px;padding:3px 8px;
  white-space:nowrap}
.tk-form.frei{color:var(--petrol);border-color:var(--petrol)}
.tk-blaettern{display:flex;gap:6px;margin-top:10px}
.tk-ganztags{display:none;font-size:calc(var(--fs)*0.76);color:var(--petrol);
  margin-top:7px;line-height:1.4}
.tk-ganztags.sichtbar{display:block}
.tk-ganztags b{font-weight:500}
.tk-stand{font-size:calc(var(--fs)*0.72);color:var(--grau);margin-top:6px;
  white-space:pre-wrap;line-height:1.4}
.tk-stand.warn{color:var(--weinrot)}
.tk-blaettern button{font:inherit;font-size:calc(var(--fs)*0.8);padding:3px 12px;
  border:1px solid var(--linie);border-radius:5px;background:var(--karte);
  color:var(--grau);cursor:pointer}

.eingabe-zone{flex:0 0 auto;background:var(--karte);border-top:1px solid var(--linie);
  border-bottom:1px solid var(--linie);margin-top:12px}
.eingabe-feld{width:100%;border:0;background:transparent;font:inherit;
  font-size:calc(var(--fs)*0.95);color:var(--tinte);padding:13px 20px;outline:none}
.eingabe-feld::placeholder{color:var(--grau-hell)}
.eingabe-vorschau{display:none;padding:0 20px 11px;font-size:calc(var(--fs)*0.76);color:var(--grau)}
.eingabe-vorschau.sichtbar{display:block}
.eingabe-vorschau b{font-weight:500;color:var(--tinte)}

.tagblatt{flex:1 1 auto;overflow-y:auto;padding:0 20px 20px}
.tabschnitt{padding-top:16px}
.tabschnitt-titel{font-size:calc(var(--fs)*0.78);font-weight:500;color:var(--grau);
  display:flex;align-items:center;gap:8px;margin-bottom:7px}
.tabschnitt-titel::after{content:"";flex:1;height:1px;background:var(--linie)}

.tzeile{display:flex;align-items:flex-start;gap:11px;padding:8px 0 8px 11px;
  border-left:2px solid var(--weinrot);margin-bottom:2px}
.tzeile.privat{border-left-color:var(--petrol)}
.tzeile.kompakt{padding:6px 0 6px 11px;margin-bottom:0}
.tkasten{flex:0 0 17px;height:17px;margin-top:2px;border:1.5px solid var(--grau);
  border-radius:2px;background:transparent;cursor:pointer;padding:0;position:relative}
.tkasten.an{background:var(--tinte);border-color:var(--tinte)}
.tkasten.an::after{content:"";position:absolute;left:4.5px;top:1px;width:5px;height:9px;
  border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(42deg)}
.ttext{flex:1;min-width:0}
.ttitel{font-size:calc(var(--fs)*0.92);line-height:1.3}
.tzeile.erledigt .ttitel{color:var(--grau);text-decoration:line-through}
.tmeta{font-size:calc(var(--fs)*0.75);color:var(--grau);margin-top:1px}
.tmeta .eilig{color:var(--weinrot);font-weight:500}

.tverlauf{display:flex;gap:0;align-items:stretch}
.tv-zeit{flex:0 0 52px;text-align:right;padding:8px 10px 8px 0;
  font-size:calc(var(--fs)*0.82);font-variant-numeric:tabular-nums}
.tv-schiene{flex:0 0 1px;background:var(--linie);position:relative}
.tv-schiene::before{content:"";position:absolute;left:-3px;top:12px;width:7px;height:7px;
  background:var(--papier);border:1.5px solid var(--grau);border-radius:50%}
.tverlauf.fest .tv-schiene::before{background:var(--weinrot);border-color:var(--weinrot)}
.tverlauf.aufgabe .tv-schiene::before{display:none}
.tverlauf.privat .tv-schiene{background:var(--petrol)}
.tv-inhalt{flex:1;padding:8px 0 8px 12px;min-width:0}
.tv-reihe{display:flex;align-items:flex-start;gap:10px}
.tverlauf.erledigt .ttitel{color:var(--grau);text-decoration:line-through}

.tfalt{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;
  padding:7px 0 7px 11px;margin-bottom:2px;font:inherit;font-size:calc(var(--fs)*0.8);
  color:var(--grau);cursor:pointer;text-align:left}
.tfalt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tfalt svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .15s ease}
.tfalt svg.auf{transform:rotate(180deg)}
.tleer{font-size:calc(var(--fs)*0.8);color:var(--grau-hell);padding:2px 0 0 11px}

.streifen{display:none;flex:0 0 auto;align-items:center;gap:8px;padding:9px 20px;
  background:var(--papier);border:0;border-top:1px solid var(--linie);
  font:inherit;font-size:calc(var(--fs)*0.8);color:var(--weinrot);cursor:pointer;
  width:100%;text-align:left}
.streifen.sichtbar{display:flex}
#streifenText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.streifen svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}



/* ---------- Aufgabenfläche ---------- */
#schirmAufgaben{padding:0}
.leisten{display:flex;flex-wrap:wrap;gap:8px;padding:11px 20px 0;flex:0 0 auto;align-items:center}
.gruppe{display:inline-flex;border:1px solid var(--linie);border-radius:6px;overflow:hidden;
  background:var(--karte)}
.gruppe button{font:inherit;font-size:calc(var(--fs)*0.72);padding:5px 10px;border:0;
  background:var(--karte);color:var(--grau);cursor:pointer}
.gruppe button+button{border-left:1px solid var(--linie)}
.gruppe button.aktiv{background:var(--tinte);color:#fff}
.pillen{display:flex;gap:5px;margin-left:auto}
.pillen button{font:inherit;font-size:calc(var(--fs)*0.72);padding:5px 11px;
  border:1px solid var(--linie);border-radius:20px;background:var(--karte);
  color:var(--grau);cursor:pointer}
.pillen button.aktiv{border-color:var(--tinte);color:var(--tinte);font-weight:500}

.aufblatt{flex:1 1 auto;overflow-y:auto;padding:8px 20px 24px}
.gruppenkopf{font-size:calc(var(--fs)*0.78);font-weight:500;color:var(--grau);
  display:flex;align-items:center;gap:8px;margin:14px 0 5px}
.gruppenkopf::after{content:"";flex:1;height:1px;background:var(--linie)}
.gruppenkopf.warn{color:var(--weinrot)}
.marke{flex:0 0 auto;width:12px;height:12px;stroke:var(--grau);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.ttitel{display:flex;align-items:center;gap:6px}
.planungsknopf{flex:0 0 auto;font:inherit;font-size:calc(var(--fs)*0.72);
  padding:3px 10px;border-radius:20px;cursor:pointer;margin-top:2px;
  border:1px solid var(--linie);background:var(--papier);color:var(--grau);white-space:nowrap}
.planungsknopf.tag{border-color:var(--weinrot);color:var(--weinrot);font-weight:500}
.planungsknopf.woche{border-color:var(--tinte);color:var(--tinte)}

.plusknopf{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));
  width:54px;height:54px;border-radius:50%;border:0;background:var(--weinrot);
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.22);z-index:4}
.plusknopf svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round}
@media (min-width:760px){
  .plusknopf{bottom:calc(84px + env(safe-area-inset-bottom))}
}

/* ---------- Detailfläche ---------- */
.d-feld{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--linie)}
.d-name{flex:0 0 86px;font-size:calc(var(--fs)*0.78);color:var(--grau)}
.d-wert{flex:1;min-width:0;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.d-wert input,.d-wert select{font:inherit;font-size:calc(var(--fs)*0.82);
  border:1px solid var(--linie);border-radius:5px;padding:4px 7px;background:var(--papier);
  color:var(--tinte);max-width:100%}
.d-wahl{font:inherit;font-size:calc(var(--fs)*0.74);padding:4px 11px;border-radius:20px;
  border:1px solid var(--linie);background:var(--papier);color:var(--grau);cursor:pointer}
.d-wahl.an{border-color:var(--tinte);color:var(--tinte);font-weight:500}
.d-tag{font:inherit;font-size:calc(var(--fs)*0.74);padding:4px 0;width:32px;text-align:center;
  border-radius:5px;border:1px solid var(--linie);background:var(--papier);
  color:var(--grau);cursor:pointer}
.d-tag.an{border-color:var(--tinte);color:var(--tinte);font-weight:500;background:var(--karte)}
.d-text{width:100%;font:inherit;font-size:calc(var(--fs)*0.85);line-height:1.45;
  border:1px solid var(--linie);border-radius:5px;padding:7px 8px;margin-top:10px;
  background:var(--papier);color:var(--tinte);outline:none;resize:vertical;min-height:60px}
.d-hinweis{font-size:calc(var(--fs)*0.72);color:var(--grau);padding:7px 0 0;text-align:right}
.d-plus{flex:0 0 auto;font:inherit;font-size:calc(var(--fs)*0.78);padding:4px 10px;
  border:1px solid var(--linie);border-radius:5px;background:var(--papier);
  color:var(--grau);cursor:pointer}
.d-neu{display:none;padding-top:8px}
.d-neu.auf{display:block}
.d-neu input{width:100%;font:inherit;font-size:calc(var(--fs)*0.85);margin-bottom:6px;
  border:1px solid var(--linie);border-radius:5px;padding:6px 8px;background:var(--papier);
  color:var(--tinte);outline:none}
.d-reihe{display:flex;gap:8px;margin-top:12px}
.d-reihe button{flex:1;font:inherit;font-size:calc(var(--fs)*0.82);padding:9px;
  border:1px solid var(--linie);border-radius:6px;background:var(--papier);
  color:var(--tinte);cursor:pointer}
.d-reihe button.gefahr{border-color:var(--weinrot);color:var(--weinrot)}
.d-hist{font-size:calc(var(--fs)*0.74);color:var(--grau);padding:11px 0 0}

/* ---------- Aktionsfläche und Rückgängig ---------- */
.aktion-hg{position:absolute;inset:0;background:rgba(46,44,41,.42);display:none;z-index:5}
.aktion-hg.auf{display:block}
.aktion-sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;
  width:100%;max-width:440px;background:var(--karte);
  border-radius:14px 14px 0 0;padding:16px 20px 22px;display:none;z-index:6;
  box-shadow:0 -6px 24px rgba(0,0,0,.14)}
@media (min-width:760px){
  .aktion-sheet{bottom:18px;border-radius:12px}
}
.aktion-sheet.auf{display:block}
.as-griff{width:36px;height:4px;border-radius:2px;background:var(--linie);margin:0 auto 12px}
.as-titel{font-size:calc(var(--fs)*1.0);font-weight:600;line-height:1.3}
.as-titelfeld{width:100%;font:inherit;font-size:calc(var(--fs)*1.0);font-weight:600;
  line-height:1.3;border:1px solid var(--linie);border-radius:6px;padding:8px 10px;
  background:var(--papier);color:var(--tinte);outline:none}
.as-titelfeld:focus{border-color:var(--weinrot);background:var(--karte)}
.as-meta{font-size:calc(var(--fs)*0.76);color:var(--grau);margin-top:2px}
.as-linie{height:2px;background:var(--weinrot);margin:11px 0 4px}
.as-linie.privat{background:var(--petrol)}
.as-knopf{width:100%;font:inherit;font-size:calc(var(--fs)*0.88);padding:11px;margin-top:8px;
  border:1px solid var(--linie);border-radius:6px;background:var(--papier);
  color:var(--tinte);cursor:pointer;text-align:left}
.as-knopf.gefahr{border-color:var(--weinrot);color:var(--weinrot)}
.as-hinweis{font-size:calc(var(--fs)*0.74);color:var(--grau);padding-top:10px;line-height:1.5}

.rueckstreifen{display:none;flex:0 0 auto;align-items:center;gap:10px;padding:9px 20px;
  max-width:760px;margin:0 auto;
  background:var(--tinte);border:0;font:inherit;font-size:calc(var(--fs)*0.8);
  color:#fff;cursor:pointer;width:100%;text-align:left}
.rueckstreifen.sichtbar{display:flex}
#rueckText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rueck-wort{flex:0 0 auto;font-weight:500;text-decoration:underline}
.ttext{cursor:pointer}

.anmeldestreifen{display:none;flex:0 0 auto;align-items:center;gap:10px;padding:11px 20px;
  background:var(--weinrot);border:0;font:inherit;font-size:calc(var(--fs)*0.84);
  color:#fff;cursor:pointer;width:100%;text-align:left}
.anmeldestreifen.sichtbar{display:flex}
#anmeldeText{flex:1;min-width:0}
.anmelde-wort{flex:0 0 auto;font-weight:600;text-decoration:underline;white-space:nowrap}
.neustreifen{display:none;flex:0 0 auto;align-items:center;gap:10px;padding:10px 20px;
  background:var(--petrol);border:0;font:inherit;font-size:calc(var(--fs)*0.82);
  color:#fff;cursor:pointer;width:100%;text-align:left}
.neustreifen.sichtbar{display:flex}
#neuText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neu-wort{flex:0 0 auto;font-weight:500;text-decoration:underline}

/* ---------- Fussleiste ---------- */
.fuss{flex:0 0 auto;display:flex;background:var(--karte);border-top:1px solid var(--linie);
  padding-bottom:env(safe-area-inset-bottom)}
.fuss button{flex:1;background:none;border:0;padding:11px 0 12px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font:inherit;font-size:calc(var(--fs)*0.68);color:var(--grau);cursor:pointer}
.fuss button.aktiv{color:var(--weinrot)}
.fuss svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.fuss button span{display:none}
@media (min-width:760px){
  .fuss button span{display:inline}
  .schirm{padding-left:32px;padding-right:32px}
}
</style>
</head>
<body>

<div class="kopf">
  <div class="kopf-zeile">
    <div class="kopf-titel" id="kopfTitel">Tag</div>
    <div class="kopf-version" id="kopfVersion"></div>
  </div>
  <div class="kopf-linie"></div>
</div>

<div class="schirm aktiv" id="schirmTag">
  <div class="tagkopf">
    <div class="tk-zeile">
      <div class="tk-zahl" id="tkZahl">–</div>
      <div class="tk-text">
        <div class="tk-wochentag" id="tkWochentag"></div>
        <div class="tk-monat" id="tkMonat"></div>
      </div>
      <div class="tk-form" id="tkForm"></div>
    </div>
    <div class="tk-blaettern">
      <button type="button" onclick="tagBlaettern(-1)">‹</button>
      <button type="button" onclick="tagHeute()">Heute</button>
      <button type="button" onclick="tagBlaettern(1)">›</button>
      <button type="button" id="tkAbgleich" onclick="abgleichenJetzt()">Abgleichen</button>
    </div>
    <div class="tk-ganztags" id="tkGanztags"></div>
    <div class="tk-stand" id="tkStand"></div>
  </div>

  <div class="eingabe-zone">
    <input class="eingabe-feld" id="schnellFeld" type="text" autocomplete="off"
           placeholder="Was steht an?  (! = Aufgabe, p = privat)"
           oninput="schnellVorschau()" onkeydown="schnellTaste(event)">
    <div class="eingabe-vorschau" id="schnellVorschauZeile"></div>
  </div>

  <div class="tagblatt" id="tagBlatt" onscroll="streifenPruefen()"></div>

  <button class="streifen" id="streifen" type="button" onclick="zumOffenen()">
    <span id="streifenText"></span>
    <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>
  </button>

</div>


<div class="schirm" id="schirmDiagnose">
  <div class="abschnitt-titel"><span>Speicher</span></div>
  <div id="speicherListe"></div>

  <div class="knopfreihe">
    <button type="button" id="knopfDatei" onclick="dateiWaehlen()">Datei öffnen</button>
    <button type="button" id="knopfNeu" onclick="dateiAnlegen()">Datei anlegen</button>
    <button type="button" id="knopfRecht" onclick="zugriffErlauben()">Zugriff erlauben</button>
    <button type="button" onclick="speichernJetzt()">Jetzt speichern</button>
    <button type="button" onclick="ladenJetzt()">Neu laden</button>
    <button type="button" onclick="versionPruefen(true)">Auf neue Fassung prüfen</button>
    <button type="button" class="stark" onclick="handleVergessen()">Datei lösen</button>
  </div>

<script>
'use strict';

/* ============================================================
   Grunddaten
   ============================================================ */

var APP_VERSION = '0.8.2';
var DATEINAME   = 'workbench.json';
var IDB_NAME    = 'workbench-speicher';
var IDB_STORE   = 'handles';
var IDB_KEY     = 'datendatei';
var LS_KEY      = 'workbench-daten';
var OPFS_NAME   = 'workbench.json';
var CLIENT_ID   = '347268246401-9ktgd8q5caq6v5nma36i3e38u9c37bre.apps.googleusercontent.com';
var REDIRECT_URI = 'https://alexandernoeth-bam.github.io/workbench/workbench.html';
var SCOPES = 'https://www.googleapis.com/auth/drive.file '
           + 'https://www.googleapis.com/auth/calendar.readonly';
var GIS_URL   = 'https://accounts.google.com/gsi/client';
var TOKEN_KEY = 'workbench-zugriff';
var ANMELDE_MERKER = 'workbench-war-angemeldet';
var ABGLEICH_VERZUG  = 4000;    /* so lange nach der letzten Änderung wird gewartet */
var ABGLEICH_MINDEST = 20000;   /* nicht öfter als alle 20 Sekunden von selbst */
var ABGLEICH_TAKT    = 30000;   /* alle 30 Sekunden bei Drive nachsehen */
var DRIVE_DATEI = 'workbench.json';
var VORLAUF_MS = 5 * 60 * 1000;   /* so lange vor Ablauf wird still erneuert */
var GRABSTEIN_TAGE = 180;         /* so lange bleibt ein Löschvermerk erhalten */

var SAMMLUNGEN = ['aufgaben','ziele','themen','projekte','ablaeufe','durchlaeufe',
                  'jahrestermine','kalenderzuordnung','termine'];

function leereDatenbank() {
  return {
    version:           APP_VERSION,
    aufgaben:          [],
    ziele:             [],
    themen:            [],
    projekte:          [],
    ablaeufe:          [],
    durchlaeufe:       [],
    jahrestermine:     [],
    kalenderzuordnung: {},
    termine:           [],
    grabsteine:        [],
    einstellungen: {
      clientId:      CLIENT_ID,
      redirectUri:   REDIRECT_URI,
      kalender:      [],
      ferienZeigen:  true,
      gespeichert:   null,
      stempel:       0
    }
  };
}

var DB = leereDatenbank();
var speicherWeg = 'keiner';
var dateiHandle = null;
var dateiName = '';
var rechteStand = 'unbekannt';
var letzterSchreibvorgang = null;
var schirmOffen = 'Tag';

/* Der Zugriffsschlüssel wird bewusst nie in DB geschrieben. Er lebt im
   Arbeitsspeicher und in sessionStorage, damit ein Neuladen ihn nicht verliert. */
var tokenClient = null;
var zugriffToken = null;
var tokenAblauf = 0;
var erneuerungsUhr = null;
var gisBereit = false;
var driveDateiId = '';
var driveStand = '';
var letzteUebertragung = null;
var letzterAbgleich = null;
var letzterBericht = null;
var abgleichUhr = null;
var abgleichLaeuft = false;
var abgleichZuletztMs = 0;
var abgleichFehler = '';
var lokalOffen = false;
var taktUhr = null;

/* ============================================================
   Kleine Helfer
   ============================================================ */

function zwei(n) { return (n < 10 ? '0' : '') + n; }

/* Bewusst lokal gerechnet. toISOString() verschiebt um die Zeitzone
   und liefert am spaeten Abend den falschen Tag. */
function isoDatum(d) {
  var x = d || new Date();
  return x.getFullYear() + '-' + zwei(x.getMonth() + 1) + '-' + zwei(x.getDate());
}

function isoZeit(d) {
  var x = d || new Date();
  return isoDatum(x) + ' ' + zwei(x.getHours()) + ':' + zwei(x.getMinutes()) + ':' + zwei(x.getSeconds());
}

function melde(text, art) {
  var stellen = ['melder', 'migMelder', 'aufMelder'];
  var i;
  for (i = 0; i < stellen.length; i++) {
    var el = document.getElementById(stellen[i]);
    if (!el) { continue; }
    el.textContent = text;
    el.className = 'melder' + (art ? ' ' + art : '');
  }
}

function fsApiDa()   { return (typeof window.showOpenFilePicker === 'function'); }
function opfsDa()    { return !!(navigator.storage && navigator.storage.getDirectory); }
function idbDa()     { return !!window.indexedDB; }
function localDa() {
  try {
    window.localStorage.setItem('__probe__', '1');
    window.localStorage.removeItem('__probe__');
    return true;
  } catch (e) {
    return false;
  }
}

/* ============================================================
   IndexedDB: bewahrt den Datei-Handle ueber Sitzungen hinweg
   ============================================================ */

function idbOeffnen() {
  return new Promise(function (fertig, fehler) {
    if (!idbDa()) { fehler(new Error('IndexedDB nicht verfügbar')); return; }
    var anfrage = window.indexedDB.open(IDB_NAME, 1);
    anfrage.onupgradeneeded = function () {
      var db = anfrage.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) { db.createObjectStore(IDB_STORE); }
    };
    anfrage.onsuccess = function () { fertig(anfrage.result); };
    anfrage.onerror   = function () { fehler(anfrage.error); };
  });
}

function idbSchreiben(schluessel, wert) {
  return idbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(IDB_STORE, 'readwrite');
      t.objectStore(IDB_STORE).put(wert, schluessel);
      t.oncomplete = function () { db.close(); fertig(true); };
      t.onerror    = function () { db.close(); fehler(t.error); };
    });
  });
}

function idbLesen(schluessel) {
  return idbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(IDB_STORE, 'readonly');
      var a = t.objectStore(IDB_STORE).get(schluessel);
      a.onsuccess = function () { db.close(); fertig(a.result || null); };
      a.onerror   = function () { db.close(); fehler(a.error); };
    });
  });
}

function idbLoeschen(schluessel) {
  return idbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(IDB_STORE, 'readwrite');
      t.objectStore(IDB_STORE).delete(schluessel);
      t.oncomplete = function () { db.close(); fertig(true); };
      t.onerror    = function () { db.close(); fehler(t.error); };
    });
  });
}

/* ============================================================
   Berechtigungen — nur auf ausdrueckliche Geste anfragen
   ============================================================ */

function rechtePruefen(handle) {
  if (!handle || typeof handle.queryPermission !== 'function') {
    return Promise.resolve('unbekannt');
  }
  return handle.queryPermission({ mode: 'readwrite' })
    .then(function (stand) { return stand; })
    .catch(function () { return 'unbekannt'; });
}

function rechteAnfragen(handle) {
  if (!handle || typeof handle.requestPermission !== 'function') {
    return Promise.resolve('unbekannt');
  }
  return handle.requestPermission({ mode: 'readwrite' })
    .then(function (stand) { return stand; })
    .catch(function () { return 'denied'; });
}

/* ============================================================
   Speicherwege
   ============================================================ */

function dateiSchreiben(handle, text) {
  return handle.createWritable().then(function (strom) {
    return strom.write(text).then(function () { return strom.close(); });
  });
}

function dateiLesen(handle) {
  return handle.getFile().then(function (f) { return f.text(); });
}

function opfsHandle(anlegen) {
  return navigator.storage.getDirectory().then(function (ordner) {
    return ordner.getFileHandle(OPFS_NAME, { create: !!anlegen });
  });
}

function opfsSchreiben(text) {
  return opfsHandle(true).then(function (h) { return dateiSchreiben(h, text); });
}

function opfsLesen() {
  return opfsHandle(false).then(function (h) { return dateiLesen(h); });
}

function localSchreiben(text) {
  window.localStorage.setItem(LS_KEY, text);
  return Promise.resolve(true);
}

function localLesen() {
  return Promise.resolve(window.localStorage.getItem(LS_KEY));
}

/* ============================================================
   Datensätze: Kennung, Stempel, Grabsteine

   Der Änderungsstempel ist eine Zahl in Millisekunden seit 1970.
   Ein Datumstext wäre je nach Zeitzone unterschiedlich lang und
   ließe sich zwischen zwei Geräten nicht sicher vergleichen.
   ============================================================ */

function jetzt() { return Date.now(); }

function neueKennung() {
  return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function stempeln(satz) {
  if (!satz.id) { satz.id = neueKennung(); }
  satz.geaendert = jetzt();
  return satz;
}

/* Ältere Bestände tragen weder Kennung noch Stempel. Beides wird
   einmalig nachgetragen, ohne Inhalte anzufassen. */
function bestandStempeln(db) {
  var i, s, k;
  var nachgetragen = 0;
  for (i = 0; i < SAMMLUNGEN.length; i++) {
    s = SAMMLUNGEN[i];
    if (s === 'kalenderzuordnung') {
      var z = db[s] || {};
      for (k in z) {
        if (!Object.prototype.hasOwnProperty.call(z, k)) { continue; }
        if (typeof z[k] === 'string') { z[k] = { art: z[k], geaendert: 0 }; nachgetragen++; }
        else if (!z[k].geaendert) { z[k].geaendert = 0; nachgetragen++; }
      }
      continue;
    }
    var liste = db[s] || [];
    var j;
    for (j = 0; j < liste.length; j++) {
      if (!liste[j].id) { liste[j].id = neueKennung(); nachgetragen++; }
      if (typeof liste[j].geaendert !== 'number') { liste[j].geaendert = 0; nachgetragen++; }
    }
  }
  if (!Array.isArray(db.grabsteine)) { db.grabsteine = []; }

  /* Aus dem Altbestand tragen wiederkehrende Aufgaben teils den Status
     „erledigt". Das ist keine Eigenschaft, die es bei ihnen gibt — sie
     würden sonst nie wieder erscheinen. */
  var aufg = db.aufgaben || [];
  var w;
  for (w = 0; w < aufg.length; w++) {
    if (aufg[w].wiederholung && aufg[w].frist) {
      aufg[w].frist = '';
      nachgetragen++;
    }
    if (aufg[w].wiederholung && aufg[w].status === 'erledigt') {
      aufg[w].status = 'offen';
      if (!aufg[w].zuletztErledigt && aufg[w].erledigtAm) {
        aufg[w].zuletztErledigt = aufg[w].erledigtAm;
      }
      aufg[w].erledigtAm = null;
      nachgetragen++;
    }
  }
  return nachgetragen;
}

function grabsteinSetzen(sammlung, id) {
  if (!Array.isArray(DB.grabsteine)) { DB.grabsteine = []; }
  var i;
  for (i = 0; i < DB.grabsteine.length; i++) {
    if (DB.grabsteine[i].s === sammlung && DB.grabsteine[i].id === id) {
      DB.grabsteine[i].z = jetzt();
      return DB.grabsteine[i];
    }
  }
  var g = { s: sammlung, id: id, z: jetzt() };
  DB.grabsteine.push(g);
  return g;
}

function grabsteinZeit(steine, sammlung, id) {
  var i;
  for (i = 0; i < steine.length; i++) {
    if (steine[i].s === sammlung && steine[i].id === id) { return steine[i].z || 0; }
  }
  return 0;
}

function grabsteineAufraeumen(steine) {
  var grenze = jetzt() - (GRABSTEIN_TAGE * 24 * 60 * 60 * 1000);
  var frisch = [];
  var i;
  for (i = 0; i < steine.length; i++) {
    if ((steine[i].z || 0) >= grenze) { frisch.push(steine[i]); }
  }
  return frisch;
}

/* ============================================================
   Zusammenführen zweier Bestände

   Regel: Der jüngere Stempel gewinnt. Ein Löschvermerk gewinnt
   gegen jede Änderung, die älter ist als er selbst. Reine Funktion,
   damit sie außerhalb des Browsers geprüft werden kann.
   ============================================================ */

function zusammenfuehren(lokal, fremd) {
  var bericht = { neu: 0, ersetzt: 0, behalten: 0, entfernt: 0, konflikte: [] };
  var ergebnis = leereDatenbank();

  var steine = grabsteineAufraeumen(
    (Array.isArray(lokal.grabsteine) ? lokal.grabsteine : [])
      .concat(Array.isArray(fremd.grabsteine) ? fremd.grabsteine : [])
  );
  /* Doppelte Vermerke auf den jüngsten zusammenziehen */
  var karteS = {};
  var i, s, k;
  for (i = 0; i < steine.length; i++) {
    var sl = steine[i].s + '|' + steine[i].id;
    if (!karteS[sl] || (steine[i].z || 0) > karteS[sl].z) {
      karteS[sl] = { s: steine[i].s, id: steine[i].id, z: steine[i].z || 0 };
    }
  }
  var steineFrisch = [];
  for (k in karteS) {
    if (Object.prototype.hasOwnProperty.call(karteS, k)) { steineFrisch.push(karteS[k]); }
  }
  ergebnis.grabsteine = steineFrisch;

  for (i = 0; i < SAMMLUNGEN.length; i++) {
    s = SAMMLUNGEN[i];

    if (s === 'kalenderzuordnung') {
      var a = lokal[s] || {};
      var b = fremd[s] || {};
      var alle = {};
      for (k in a) { if (Object.prototype.hasOwnProperty.call(a, k)) { alle[k] = true; } }
      for (k in b) { if (Object.prototype.hasOwnProperty.call(b, k)) { alle[k] = true; } }
      for (k in alle) {
        if (!Object.prototype.hasOwnProperty.call(alle, k)) { continue; }
        var wa = a[k] || null;
        var wb = b[k] || null;
        var tot = grabsteinZeit(steineFrisch, s, k);
        var neuster = Math.max(wa ? (wa.geaendert || 0) : 0, wb ? (wb.geaendert || 0) : 0);
        if (tot && tot >= neuster) { bericht.entfernt++; continue; }
        if (wa && wb) {
          if ((wb.geaendert || 0) > (wa.geaendert || 0)) {
            ergebnis[s][k] = wb; bericht.ersetzt++;
            if (wa.art !== wb.art) { bericht.konflikte.push({ s: s, id: k, gewaehlt: 'fremd' }); }
          } else {
            ergebnis[s][k] = wa; bericht.behalten++;
            if (wa.art !== wb.art) { bericht.konflikte.push({ s: s, id: k, gewaehlt: 'lokal' }); }
          }
        } else if (wb) {
          ergebnis[s][k] = wb; bericht.neu++;
        } else {
          ergebnis[s][k] = wa; bericht.behalten++;
        }
      }
      continue;
    }

    var listeA = Array.isArray(lokal[s]) ? lokal[s] : [];
    var listeB = Array.isArray(fremd[s]) ? fremd[s] : [];
    var karte = {};
    var j;
    for (j = 0; j < listeA.length; j++) { karte[listeA[j].id] = { a: listeA[j], b: null }; }
    for (j = 0; j < listeB.length; j++) {
      if (karte[listeB[j].id]) { karte[listeB[j].id].b = listeB[j]; }
      else { karte[listeB[j].id] = { a: null, b: listeB[j] }; }
    }

    var kennung;
    for (kennung in karte) {
      if (!Object.prototype.hasOwnProperty.call(karte, kennung)) { continue; }
      var paar = karte[kennung];
      var za = paar.a ? (paar.a.geaendert || 0) : 0;
      var zb = paar.b ? (paar.b.geaendert || 0) : 0;
      var totZeit = grabsteinZeit(steineFrisch, s, kennung);

      if (totZeit && totZeit >= Math.max(za, zb)) { bericht.entfernt++; continue; }

      if (paar.a && paar.b) {
        if (zb > za) {
          ergebnis[s].push(paar.b); bericht.ersetzt++;
          if (za > 0 && zb > 0) { bericht.konflikte.push({ s: s, id: kennung, gewaehlt: 'fremd' }); }
        } else if (za > zb) {
          ergebnis[s].push(paar.a); bericht.behalten++;
          if (zb > 0) { bericht.konflikte.push({ s: s, id: kennung, gewaehlt: 'lokal' }); }
        } else {
          ergebnis[s].push(paar.a); bericht.behalten++;
        }
      } else if (paar.b) {
        ergebnis[s].push(paar.b); bericht.neu++;
      } else {
        ergebnis[s].push(paar.a); bericht.behalten++;
      }
    }
  }

  var ea = (lokal.einstellungen && lokal.einstellungen.stempel) || 0;
  var eb = (fremd.einstellungen && fremd.einstellungen.stempel) || 0;
  var quelle = (eb > ea) ? fremd.einstellungen : lokal.einstellungen;
  if (quelle) {
    var e;
    for (e in quelle) {
      if (Object.prototype.hasOwnProperty.call(quelle, e)) { ergebnis.einstellungen[e] = quelle[e]; }
    }
  }
  ergebnis.einstellungen.clientId = CLIENT_ID;
  ergebnis.einstellungen.redirectUri = REDIRECT_URI;
  ergebnis.version = APP_VERSION;

  return { db: ergebnis, bericht: bericht };
}

/* ============================================================
   Speichern und Laden
   ============================================================ */

function alsText() {
  DB.version = APP_VERSION;
  if (!DB.einstellungen) { DB.einstellungen = leereDatenbank().einstellungen; }
  DB.einstellungen.gespeichert = isoZeit();
  if (!DB.einstellungen.stempel) { DB.einstellungen.stempel = jetzt(); }
  if (!Array.isArray(DB.grabsteine)) { DB.grabsteine = []; }
  return JSON.stringify(DB, null, 2);
}

function uebernehmen(text) {
  if (!text) { return false; }
  var gelesen;
  try {
    gelesen = JSON.parse(text);
  } catch (e) {
    melde('Die Datei enthält kein gültiges JSON: ' + e.message, 'warn');
    return false;
  }
  if (!gelesen || typeof gelesen !== 'object') { return false; }

  var frisch = leereDatenbank();
  var i;
  for (i = 0; i < SAMMLUNGEN.length; i++) {
    var name = SAMMLUNGEN[i];
    if (name === 'kalenderzuordnung') {
      if (gelesen[name] && typeof gelesen[name] === 'object') { frisch[name] = gelesen[name]; }
    } else if (Array.isArray(gelesen[name])) {
      frisch[name] = gelesen[name];
    }
  }
  if (gelesen.einstellungen && typeof gelesen.einstellungen === 'object') {
    var e;
    for (e in gelesen.einstellungen) {
      if (Object.prototype.hasOwnProperty.call(gelesen.einstellungen, e)) {
        frisch.einstellungen[e] = gelesen.einstellungen[e];
      }
    }
  }
  if (Array.isArray(gelesen.grabsteine)) { frisch.grabsteine = gelesen.grabsteine; }
  frisch.einstellungen.clientId    = CLIENT_ID;
  frisch.einstellungen.redirectUri = REDIRECT_URI;
  bestandStempeln(frisch);
  DB = frisch;
  return true;
}

function speichern() {
  var text = alsText();

  if (speicherWeg === 'datei' && dateiHandle) {
    return dateiSchreiben(dateiHandle, text).then(function () {
      letzterSchreibvorgang = isoZeit();
      return 'datei';
    }).catch(function (f) {
      melde('Schreiben in die Datei fehlgeschlagen, weiche auf den Notweg aus.\n' + f.message, 'warn');
      return notwegSchreiben(text);
    });
  }
  return notwegSchreiben(text);
}

function notwegSchreiben(text) {
  if (opfsDa()) {
    return opfsSchreiben(text).then(function () {
      speicherWeg = 'opfs';
      letzterSchreibvorgang = isoZeit();
      return 'opfs';
    }).catch(function () {
      return localNotweg(text);
    });
  }
  return localNotweg(text);
}

function localNotweg(text) {
  if (!localDa()) {
    speicherWeg = 'keiner';
    return Promise.reject(new Error('Kein Speicherweg verfügbar'));
  }
  return localSchreiben(text).then(function () {
    speicherWeg = 'local';
    letzterSchreibvorgang = isoZeit();
    return 'local';
  });
}

function laden() {
  if (dateiHandle) {
    return rechtePruefen(dateiHandle).then(function (stand) {
      rechteStand = stand;
      if (stand !== 'granted') { return null; }
      return dateiLesen(dateiHandle).then(function (text) {
        if (uebernehmen(text)) { speicherWeg = 'datei'; return 'datei'; }
        return null;
      });
    }).then(function (ergebnis) {
      if (ergebnis) { return ergebnis; }
      return notwegLesen();
    }).catch(function () {
      return notwegLesen();
    });
  }
  return notwegLesen();
}

function notwegLesen() {
  if (opfsDa()) {
    return opfsLesen().then(function (text) {
      if (uebernehmen(text)) { speicherWeg = 'opfs'; return 'opfs'; }
      return localNotwegLesen();
    }).catch(function () {
      return localNotwegLesen();
    });
  }
  return localNotwegLesen();
}

function localNotwegLesen() {
  if (!localDa()) { speicherWeg = 'keiner'; return Promise.resolve(null); }
  return localLesen().then(function (text) {
    if (uebernehmen(text)) { speicherWeg = 'local'; return 'local'; }
    speicherWeg = localDa() ? 'local' : 'keiner';
    return null;
  });
}

/* ============================================================
   Google: Anmeldung
   ============================================================ */

function gisLaden() {
  if (gisBereit) { return Promise.resolve(true); }
  if (window.google && window.google.accounts && window.google.accounts.oauth2) {
    gisBereit = true;
    return Promise.resolve(true);
  }
  return new Promise(function (fertig, fehler) {
    var vorhanden = document.getElementById('gisSkript');
    if (vorhanden) {
      vorhanden.addEventListener('load', function () { gisBereit = true; fertig(true); });
      return;
    }
    var s = document.createElement('script');
    s.id = 'gisSkript';
    s.src = GIS_URL;
    s.async = true;
    s.onload = function () { gisBereit = true; fertig(true); };
    s.onerror = function () { fehler(new Error('Die Anmeldebibliothek ließ sich nicht laden.')); };
    document.head.appendChild(s);
  });
}

function tokenMerken(token, gueltigSek) {
  zugriffToken = token;
  tokenAblauf = Date.now() + (gueltigSek * 1000);
  try {
    window.sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ t: token, a: tokenAblauf }));
  } catch (e) {
    /* ohne sessionStorage lebt der Schlüssel nur bis zum Neuladen */
  }
  erneuerungPlanen();
}

function tokenAusSitzung() {
  try {
    var roh = window.sessionStorage.getItem(TOKEN_KEY);
    if (!roh) { return false; }
    var w = JSON.parse(roh);
    if (!w || !w.t || !w.a || w.a <= Date.now()) { return false; }
    zugriffToken = w.t;
    tokenAblauf = w.a;
    erneuerungPlanen();
    return true;
  } catch (e) {
    return false;
  }
}

function tokenVergessen() {
  zugriffToken = null;
  tokenAblauf = 0;
  if (erneuerungsUhr) { window.clearTimeout(erneuerungsUhr); erneuerungsUhr = null; }
  try { window.sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* egal */ }
}

function tokenGueltig() {
  return !!zugriffToken && tokenAblauf > Date.now();
}

function restMinuten() {
  if (!tokenGueltig()) { return 0; }
  return Math.max(0, Math.round((tokenAblauf - Date.now()) / 60000));
}

/* Still erneuern, bevor die Stunde um ist. Ohne das reißt jede laufende
   Arbeit nach 60 Minuten ab — genau der bekannte Knackpunkt. */
function erneuerungPlanen() {
  if (erneuerungsUhr) { window.clearTimeout(erneuerungsUhr); erneuerungsUhr = null; }
  if (!tokenAblauf) { return; }
  var wartezeit = tokenAblauf - Date.now() - VORLAUF_MS;
  if (wartezeit < 1000) { wartezeit = 1000; }
  erneuerungsUhr = window.setTimeout(function () {
    anmelden(true);
  }, wartezeit);
}

function klientVorbereiten() {
  if (tokenClient) { return Promise.resolve(tokenClient); }
  return gisLaden().then(function () {
    tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: function () { /* wird je Anfrage überschrieben */ }
    });
    return tokenClient;
  });
}

function anmelden(still) {
  return klientVorbereiten().then(function (klient) {
    return new Promise(function (fertig) {
      klient.callback = function (antwort) {
        if (antwort && antwort.access_token) {
          tokenMerken(antwort.access_token, Number(antwort.expires_in) || 3600);
          try { window.localStorage.setItem(ANMELDE_MERKER, '1'); } catch (e) { /* egal */ }
          abgleichPlanen(true);
          termineHolen(false);
          anmeldeStreifenPruefen();
          if (!still) { melde('Angemeldet. Gültig für ' + restMinuten() + ' Minuten.', 'gut'); }
          zeichne();
          fertig(true);
          return;
        }
        var grund = (antwort && antwort.error) ? antwort.error : 'unbekannt';
        if (still) {
          melde('Die stille Erneuerung ist fehlgeschlagen (' + grund + ').\n'
              + 'Bitte einmal auf „Anmelden" tippen.', 'warn');
        } else {
          melde('Anmeldung nicht abgeschlossen (' + grund + ').', 'warn');
        }
        zeichne();
        fertig(false);
      };
      klient.requestAccessToken({ prompt: still ? '' : 'consent' });
    });
  }).catch(function (f) {
    melde('Anmeldung nicht möglich.\n' + (f ? f.message : ''), 'warn');
    zeichne();
    return false;
  });
}

function abmelden() {
  var alt = zugriffToken;
  try { window.localStorage.removeItem(ANMELDE_MERKER); } catch (e) { /* egal */ }
  tokenVergessen();
  driveDateiId = '';
  driveStand = '';
  if (alt && window.google && window.google.accounts && window.google.accounts.oauth2) {
    try { window.google.accounts.oauth2.revoke(alt, function () { return null; }); }
    catch (e) { /* Widerruf ist Beiwerk */ }
  }
  melde('Abgemeldet. Die lokalen Daten bleiben erhalten.', null);
  anmeldeStreifenPruefen();
  zeichne();
}

/* ============================================================
   Google Drive
   ============================================================ */

function driveKopf(zusatz) {
  var k = { 'Authorization': 'Bearer ' + zugriffToken };
  if (zusatz) {
    var n;
    for (n in zusatz) {
      if (Object.prototype.hasOwnProperty.call(zusatz, n)) { k[n] = zusatz[n]; }
    }
  }
  return k;
}

function dienstAusAdresse(url) {
  var text = String(url || '');
  if (text.indexOf('/calendar/') >= 0) { return 'Der Kalender'; }
  if (text.indexOf('/drive/') >= 0 || text.indexOf('/upload/drive/') >= 0) { return 'Drive'; }
  return 'Google';
}

function antwortPruefen(a) {
  if (a.ok) { return a; }
  var dienst = dienstAusAdresse(a.url);
  if (a.status === 401) {
    tokenVergessen();
    throw new Error('Der Zugriff ist abgelaufen. Bitte neu anmelden.');
  }
  return a.text().then(function (t) {
    /* Eine nicht freigeschaltete Schnittstelle sieht aus wie ein
       Rechtefehler, ist aber eine Einstellung im Google-Projekt. */
    if (a.status === 403 && /has not been used|is disabled|SERVICE_DISABLED/i.test(t)) {
      throw new Error(dienst + ' ist im Google-Projekt noch nicht freigeschaltet.\n'
        + 'Cloud Console öffnen, Projekt wählen, unter „APIs & Dienste – Bibliothek" '
        + 'die passende Schnittstelle aktivieren und ein bis zwei Minuten warten.');
    }
    if (a.status === 403) {
      throw new Error(dienst + ' verweigert den Zugriff (403).\n' + t.slice(0, 200));
    }
    throw new Error(dienst + ' antwortete mit ' + a.status + ': ' + t.slice(0, 200));
  });
}

function driveSuchen() {
  var url = 'https://www.googleapis.com/drive/v3/files'
          + '?q=' + encodeURIComponent("name='" + DRIVE_DATEI + "' and trashed=false")
          + '&fields=' + encodeURIComponent('files(id,name,modifiedTime)')
          + '&pageSize=10';
  return window.fetch(url, { headers: driveKopf() })
    .then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      var liste = (d && d.files) ? d.files : [];
      if (!liste.length) { return null; }
      driveDateiId = liste[0].id;
      driveStand = liste[0].modifiedTime || '';
      return liste[0];
    });
}

function driveAnlegen() {
  return window.fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: driveKopf({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ name: DRIVE_DATEI, mimeType: 'application/json' })
  }).then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      driveDateiId = d.id;
      return d.id;
    });
}

function driveHochladen() {
  var text = alsText();
  var los = driveDateiId ? Promise.resolve(driveDateiId)
                         : driveSuchen().then(function (t) { return t ? t.id : driveAnlegen(); });
  return los.then(function (id) {
    return window.fetch('https://www.googleapis.com/upload/drive/v3/files/' + id
                        + '?uploadType=media&fields=id,modifiedTime', {
      method: 'PATCH',
      headers: driveKopf({ 'Content-Type': 'application/json' }),
      body: text
    });
  }).then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      driveStand = d.modifiedTime || '';
      letzteUebertragung = isoZeit();
      return true;
    });
}

function driveHerunterladen() {
  var los = driveDateiId ? Promise.resolve(driveDateiId)
                         : driveSuchen().then(function (t) { return t ? t.id : null; });
  return los.then(function (id) {
    if (!id) { return null; }
    return window.fetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media', {
      headers: driveKopf()
    }).then(antwortPruefen)
      .then(function (a) { return a.text(); });
  });
}

/* ============================================================
   Abgleich: herunterladen, zusammenführen, zurückschreiben
   ============================================================ */

function textZuBestand(text) {
  var gelesen;
  try {
    gelesen = JSON.parse(text);
  } catch (e) {
    return null;
  }
  if (!gelesen || typeof gelesen !== 'object') { return null; }
  var frisch = leereDatenbank();
  var i, name;
  for (i = 0; i < SAMMLUNGEN.length; i++) {
    name = SAMMLUNGEN[i];
    if (name === 'kalenderzuordnung') {
      if (gelesen[name] && typeof gelesen[name] === 'object') { frisch[name] = gelesen[name]; }
    } else if (Array.isArray(gelesen[name])) {
      frisch[name] = gelesen[name];
    }
  }
  if (Array.isArray(gelesen.grabsteine)) { frisch.grabsteine = gelesen.grabsteine; }
  if (gelesen.einstellungen && typeof gelesen.einstellungen === 'object') {
    var e;
    for (e in gelesen.einstellungen) {
      if (Object.prototype.hasOwnProperty.call(gelesen.einstellungen, e)) {
        frisch.einstellungen[e] = gelesen.einstellungen[e];
      }
    }
  }
  bestandStempeln(frisch);
  return frisch;
}

function berichtText(b) {
  if (!b) { return 'kein Abgleich gelaufen'; }
  var t = b.neu + ' neu · ' + b.ersetzt + ' ersetzt · ' + b.behalten + ' behalten · '
        + b.entfernt + ' entfernt';
  if (b.konflikte.length) { t += ' · ' + b.konflikte.length + ' Konflikt(e)'; }
  return t;
}

function abgleichen() {
  if (!tokenGueltig()) { return Promise.reject(new Error('Nicht angemeldet.')); }
  bestandStempeln(DB);
  return driveHerunterladen().then(function (text) {
    var fremd = text ? textZuBestand(text) : null;
    if (!fremd) {
      letzterBericht = { neu: 0, ersetzt: 0, behalten: 0, entfernt: 0, konflikte: [] };
      return driveHochladen();
    }
    var ergebnis = zusammenfuehren(DB, fremd);
    DB = ergebnis.db;
    letzterBericht = ergebnis.bericht;
    return speichern().then(function () { return driveHochladen(); });
  }).then(function () {
    letzterAbgleich = isoZeit();
    return letzterBericht;
  });
}

/* Der Abgleich läuft von selbst: kurz nach einer Änderung, beim
   Zurückkehren zur App und nach der Anmeldung. Ohne das bleibt die
   Arbeit auf dem Gerät liegen, auf dem sie entstanden ist. */
function abgleichPlanen(sofort) {
  if (!tokenGueltig()) { return; }
  if (abgleichUhr) { window.clearTimeout(abgleichUhr); }
  abgleichUhr = window.setTimeout(abgleichStill, sofort ? 300 : ABGLEICH_VERZUG);
}

function abgleichStill() {
  abgleichUhr = null;
  if (!tokenGueltig() || abgleichLaeuft) { return; }
  abgleichLaeuft = true;
  standSetzen('Abgleich läuft …', false);
  abgleichen().then(function (b) {
    abgleichZuletztMs = Date.now();
    abgleichFehler = '';
    lokalOffen = false;
    if (b && (b.neu || b.ersetzt || b.entfernt)) {
      melde('Abgeglichen: ' + berichtText(b), 'gut');
    }
    tagZeichnen();
    zeichne();
  }).catch(function (f) {
    abgleichFehler = f ? f.message : 'unbekannter Fehler';
    standZeichnen();
    return null;
  }).then(function () {
    abgleichLaeuft = false;
    standZeichnen();
  });
}

function standSetzen(text, warnen) {
  var el = document.getElementById('tkStand');
  if (!el) { return; }
  el.textContent = text;
  el.className = 'tk-stand' + (warnen ? ' warn' : '');
}

/* Ohne Anmeldung läuft nichts nach Drive und kein Kalender kommt an.
   Das muss auf jedem Bildschirm sichtbar sein, nicht nur in der Diagnose. */
function anmeldeStreifenPruefen() {
  var streifen = document.getElementById('anmeldeStreifen');
  var text = document.getElementById('anmeldeText');
  if (!streifen || !text) { return; }
  if (tokenGueltig()) { streifen.classList.remove('sichtbar'); return; }
  text.textContent = warAngemeldet()
    ? 'Die Anmeldung bei Google ist abgelaufen. Ohne sie wird nur lokal gespeichert.'
    : 'Noch nicht bei Google angemeldet — es wird nur lokal gespeichert.';
  streifen.classList.add('sichtbar');
}

function standZeichnen() {
  anmeldeStreifenPruefen();
  if (!tokenGueltig()) {
    standSetzen('Nicht angemeldet — es wird nur lokal gespeichert.', true);
    return;
  }
  if (abgleichLaeuft) { standSetzen('Abgleich läuft …', false); return; }
  if (abgleichFehler) {
    standSetzen('Letzter Abgleich fehlgeschlagen: ' + abgleichFehler, true);
    return;
  }
  if (kalenderFehler) {
    standSetzen('Termine: ' + kalenderFehler, true);
    return;
  }
  var teile = [];
  teile.push(letzterAbgleich ? ('Abgeglichen ' + letzterAbgleich) : 'Noch nicht abgeglichen');
  if (letzterBericht) { teile.push(berichtText(letzterBericht)); }
  teile.push((DB.grabsteine || []).length + ' Löschvermerke');
  if (lokalOffen) { teile.push('lokale Änderung wartet'); }
  teile.push(ABGLEICH_TAKT < 60000
    ? ('prüft alle ' + Math.round(ABGLEICH_TAKT / 1000) + ' Sekunden')
    : ('prüft alle ' + Math.round(ABGLEICH_TAKT / 60000) + ' Minuten'));
  standSetzen(teile.join(' · '), false);
}

/* Eine Seite, die nur offen liegt, bekommt sonst nie mit, dass ein
   anderes Gerät etwas geändert hat. Deshalb wird regelmäßig nachgesehen —
   erst nur der Stand bei Drive, und nur bei Abweichung der volle Abgleich. */
function taktPruefen() {
  if (document.hidden) { return; }
  anmeldeStreifenPruefen();
  if (!tokenGueltig() || abgleichLaeuft) { return; }
  if (lokalOffen) { abgleichStill(); return; }
  var vorher = driveStand;
  driveSuchen().then(function (treffer) {
    if (treffer && treffer.modifiedTime && treffer.modifiedTime !== vorher) {
      abgleichStill();
    }
  }).catch(function () {
    return null;
  });
}

function taktStarten() {
  if (taktUhr) { window.clearInterval(taktUhr); }
  taktUhr = window.setInterval(taktPruefen, ABGLEICH_TAKT);
}

function rueckkehrPruefen() {
  if (document.hidden) { return; }
  if (!tokenGueltig()) { return; }
  if (Date.now() - abgleichZuletztMs < ABGLEICH_MINDEST) { return; }
  abgleichPlanen(true);
}

function abgleichenJetzt() {
  if (!tokenGueltig()) { melde('Bitte zuerst anmelden.', 'warn'); return; }
  melde('Abgleich läuft …', null);
  abgleichen().then(function (b) {
    var art = (b && b.konflikte.length) ? null : 'gut';
    melde('Abgleich fertig.\n' + berichtText(b), art);
    zeichne();
  }).catch(function (f) {
    abgleichFehler = f ? f.message : 'unbekannter Fehler';
    melde('Abgleich fehlgeschlagen.\n' + abgleichFehler, 'warn');
    standZeichnen();
    zeichne();
  });
}

function driveLadenJetzt() {
  if (!tokenGueltig()) { melde('Bitte zuerst anmelden.', 'warn'); return; }
  driveHerunterladen().then(function (text) {
    if (!text) {
      melde('Bei Drive liegt noch keine ' + DRIVE_DATEI + '.', null);
      zeichne();
      return null;
    }
    if (!uebernehmen(text)) { zeichne(); return null; }
    letzteUebertragung = isoZeit();
    return speichern().then(function () {
      melde('Von Drive geladen und lokal gesichert.', 'gut');
      zeichne();
    });
  }).catch(function (f) {
    melde('Laden von Drive fehlgeschlagen.\n' + (f ? f.message : ''), 'warn');
    zeichne();
  });
}

function driveSpeichernJetzt() {
  if (!tokenGueltig()) { melde('Bitte zuerst anmelden.', 'warn'); return; }
  driveHochladen().then(function () {
    melde('Zu Drive gesichert: ' + DRIVE_DATEI + '\n' + letzteUebertragung, 'gut');
    zeichne();
  }).catch(function (f) {
    melde('Sichern zu Drive fehlgeschlagen.\n' + (f ? f.message : ''), 'warn');
    zeichne();
  });
}
