<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F2">
<title>Workbench 0.5.1</title>
<script>
/* Muss vor dem Rendern stehen, sonst springt das Layout beim ersten Zeichnen. */
(function () {
  function hoehe() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
  }
  hoehe();
  window.addEventListener('resize', hoehe);
  window.addEventListener('orientationchange', hoehe);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --papier:#F6F5F2;
  --karte:#FFFFFF;
  --tinte:#2E2C29;
  --grau:#8A857D;
  --linie:#DEDBD4;
  --weinrot:#900C24;
  --petrol:#1F5B63;
  --fs:16px;
  --app-h:100%;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--papier);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--tinte);font-size:var(--fs);line-height:1.45;
  display:flex;flex-direction:column;height:var(--app-h);overflow:hidden;
}

/* ---------- Kopf ---------- */
.kopf{padding:14px 20px 0;flex:0 0 auto}
.kopf-zeile{display:flex;align-items:baseline;gap:9px}
.kopf-titel{font-size:calc(var(--fs)*1.25);font-weight:600;letter-spacing:-.01em}
.kopf-version{font-size:calc(var(--fs)*0.78);color:var(--grau)}
.kopf-linie{height:2px;background:var(--weinrot);margin-top:11px}

/* ---------- Bildschirme ---------- */
.schirm{display:none !important;flex:1 1 auto;overflow-y:auto;padding:6px 20px 24px}
.schirm.aktiv{display:flex !important;flex-direction:column}

.abschnitt-titel{font-size:calc(var(--fs)*0.78);font-weight:500;color:var(--grau);
  display:flex;align-items:center;gap:8px;margin:16px 0 7px}
.abschnitt-titel::after{content:"";flex:1;height:1px;background:var(--linie)}

.zeile{display:flex;align-items:baseline;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--linie)}
.zeile-name{flex:1;min-width:0;font-size:calc(var(--fs)*0.85)}
.zeile-wert{flex:0 0 auto;font-size:calc(var(--fs)*0.85);font-variant-numeric:tabular-nums;
  text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile-wert.ja{color:var(--petrol)}
.zeile-wert.nein{color:var(--weinrot)}
.zeile-wert.grau{color:var(--grau)}

.knopfreihe{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.knopfreihe button{flex:1 1 44%;font:inherit;font-size:calc(var(--fs)*0.82);padding:10px;
  border:1px solid var(--linie);border-radius:6px;background:var(--karte);
  color:var(--tinte);cursor:pointer}
.knopfreihe button.stark{border-color:var(--weinrot);color:var(--weinrot);font-weight:500}
.knopfreihe button:disabled{color:#B3AEA6;cursor:default}

.melder{margin-top:14px;font-size:calc(var(--fs)*0.8);padding:9px 11px;border-radius:6px;
  background:var(--karte);border:1px solid var(--linie);color:var(--grau);
  white-space:pre-wrap;line-height:1.5}
.melder.warn{border-color:var(--weinrot);color:var(--weinrot)}
.melder.gut{border-color:var(--petrol);color:var(--petrol)}

input[type=file]{font:inherit;font-size:calc(var(--fs)*0.82);width:100%;
  border:1px solid var(--linie);border-radius:6px;padding:9px;background:var(--karte);
  color:var(--tinte);margin-bottom:4px}
.platzhalter{color:#B3AEA6;font-size:calc(var(--fs)*0.85);padding:18px 0}


/* ---------- Tagesplan ---------- */
#schirmTag{padding:0}
.tagkopf{flex:0 0 auto;padding:14px 20px 0}
.tk-zeile{display:flex;align-items:baseline;gap:10px}
.tk-zahl{font-size:calc(var(--fs)*2.3);font-weight:600;letter-spacing:-.02em;line-height:1}
.tk-text{display:flex;flex-direction:column;gap:1px}
.tk-wochentag{font-size:calc(var(--fs)*1.0);font-weight:500;line-height:1.1}
.tk-monat{font-size:calc(var(--fs)*0.8);color:var(--grau);line-height:1.1}
.tk-form{margin-left:auto;align-self:center;font-size:calc(var(--fs)*0.74);font-weight:500;
  color:var(--weinrot);border:1px solid var(--weinrot);border-radius:3px;padding:3px 8px;
  white-space:nowrap}
.tk-form.frei{color:var(--petrol);border-color:var(--petrol)}
.tk-blaettern{display:flex;gap:6px;margin-top:10px}
.tk-blaettern button{font:inherit;font-size:calc(var(--fs)*0.8);padding:3px 12px;
  border:1px solid var(--linie);border-radius:5px;background:var(--karte);
  color:var(--grau);cursor:pointer}

.eingabe-zone{flex:0 0 auto;background:var(--karte);border-top:1px solid var(--linie);
  border-bottom:1px solid var(--linie);margin-top:12px}
.eingabe-feld{width:100%;border:0;background:transparent;font:inherit;
  font-size:calc(var(--fs)*0.95);color:var(--tinte);padding:13px 20px;outline:none}
.eingabe-feld::placeholder{color:#B3AEA6}
.eingabe-vorschau{display:none;padding:0 20px 11px;font-size:calc(var(--fs)*0.76);color:var(--grau)}
.eingabe-vorschau.sichtbar{display:block}
.eingabe-vorschau b{font-weight:500;color:var(--tinte)}

.tagblatt{flex:1 1 auto;overflow-y:auto;padding:0 20px 20px}
.tabschnitt{padding-top:16px}
.tabschnitt-titel{font-size:calc(var(--fs)*0.78);font-weight:500;color:var(--grau);
  display:flex;align-items:center;gap:8px;margin-bottom:7px}
.tabschnitt-titel::after{content:"";flex:1;height:1px;background:var(--linie)}

.tzeile{display:flex;align-items:flex-start;gap:11px;padding:8px 0 8px 11px;
  border-left:2px solid var(--weinrot);margin-bottom:2px}
.tzeile.privat{border-left-color:var(--petrol)}
.tzeile.kompakt{padding:6px 0 6px 11px;margin-bottom:0}
.tkasten{flex:0 0 17px;height:17px;margin-top:2px;border:1.5px solid var(--grau);
  border-radius:2px;background:transparent;cursor:pointer;padding:0;position:relative}
.tkasten.an{background:var(--tinte);border-color:var(--tinte)}
.tkasten.an::after{content:"";position:absolute;left:4.5px;top:1px;width:5px;height:9px;
  border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(42deg)}
.ttext{flex:1;min-width:0}
.ttitel{font-size:calc(var(--fs)*0.92);line-height:1.3}
.tzeile.erledigt .ttitel{color:var(--grau);text-decoration:line-through}
.tmeta{font-size:calc(var(--fs)*0.75);color:var(--grau);margin-top:1px}
.tmeta .eilig{color:var(--weinrot);font-weight:500}

.tverlauf{display:flex;gap:0;align-items:stretch}
.tv-zeit{flex:0 0 52px;text-align:right;padding:8px 10px 8px 0;
  font-size:calc(var(--fs)*0.82);font-variant-numeric:tabular-nums}
.tv-schiene{flex:0 0 1px;background:var(--linie);position:relative}
.tv-schiene::before{content:"";position:absolute;left:-3px;top:12px;width:7px;height:7px;
  background:var(--papier);border:1.5px solid var(--grau);border-radius:50%}
.tverlauf.fest .tv-schiene::before{background:var(--weinrot);border-color:var(--weinrot)}
.tverlauf.aufgabe .tv-schiene::before{display:none}
.tverlauf.privat .tv-schiene{background:var(--petrol)}
.tv-inhalt{flex:1;padding:8px 0 8px 12px;min-width:0}
.tv-reihe{display:flex;align-items:flex-start;gap:10px}
.tverlauf.erledigt .ttitel{color:var(--grau);text-decoration:line-through}

.tfalt{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;
  padding:7px 0 7px 11px;margin-bottom:2px;font:inherit;font-size:calc(var(--fs)*0.8);
  color:var(--grau);cursor:pointer;text-align:left}
.tfalt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tfalt svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .15s ease}
.tfalt svg.auf{transform:rotate(180deg)}
.tleer{font-size:calc(var(--fs)*0.8);color:#B3AEA6;padding:2px 0 0 11px}

.streifen{display:none;flex:0 0 auto;align-items:center;gap:8px;padding:9px 20px;
  background:var(--papier);border:0;border-top:1px solid var(--linie);
  font:inherit;font-size:calc(var(--fs)*0.8);color:var(--weinrot);cursor:pointer;
  width:100%;text-align:left}
.streifen.sichtbar{display:flex}
#streifenText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.streifen svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- Fussleiste ---------- */
.fuss{flex:0 0 auto;display:flex;background:var(--karte);border-top:1px solid var(--linie);
  padding-bottom:env(safe-area-inset-bottom)}
.fuss button{flex:1;background:none;border:0;padding:11px 0 12px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font:inherit;font-size:calc(var(--fs)*0.68);color:var(--grau);cursor:pointer}
.fuss button.aktiv{color:var(--weinrot)}
.fuss svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.fuss button span{display:none}
@media (min-width:760px){
  .fuss button span{display:inline}
  .schirm{padding-left:32px;padding-right:32px}
}
</style>
</head>
<body>

<div class="kopf">
  <div class="kopf-zeile">
    <div class="kopf-titel" id="kopfTitel">Tag</div>
    <div class="kopf-version" id="kopfVersion"></div>
  </div>
  <div class="kopf-linie"></div>
</div>

<div class="schirm aktiv" id="schirmTag">
  <div class="tagkopf">
    <div class="tk-zeile">
      <div class="tk-zahl" id="tkZahl">–</div>
      <div class="tk-text">
        <div class="tk-wochentag" id="tkWochentag"></div>
        <div class="tk-monat" id="tkMonat"></div>
      </div>
      <div class="tk-form" id="tkForm"></div>
    </div>
    <div class="tk-blaettern">
      <button type="button" onclick="tagBlaettern(-1)">‹</button>
      <button type="button" onclick="tagHeute()">Heute</button>

    </div>
  </div>

  <div class="eingabe-zone">
    <input class="eingabe-feld" id="schnellFeld" type="text" autocomplete="off"
           placeholder="Was steht an?  (! = Aufgabe, p = privat)"
           oninput="schnellVorschau()" onkeydown="schnellTaste(event)">
    <div class="eingabe-vorschau" id="schnellVorschauZeile"></div>
  </div>

  <div class="tagblatt" id="tagBlatt" onscroll="streifenPruefen()"></div>

  <button class="streifen" id="streifen" type="button" onclick="zumOffenen()">
    <span id="streifenText"></span>
    <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>
  </button>
</div>


<div class="schirm" id="schirmDiagnose">
  <div class="abschnitt-titel"><span>Speicher</span></div>
  <div id="speicherListe"></div>

  <div class="knopfreihe">
    <button type="button" id="knopfDatei" onclick="dateiWaehlen()">Datei öffnen</button>
    <button type="button" id="knopfNeu" onclick="dateiAnlegen()">Datei anlegen</button>
    <button type="button" id="knopfRecht" onclick="zugriffErlauben()">Zugriff erlauben</button>
    <button type="button" onclick="speichernJetzt()">Jetzt speichern</button>
    <button type="button" onclick="ladenJetzt()">Neu laden</button>
    <button type="button" class="stark" onclick="handleVergessen()">Datei lösen</button>
  </div>

  <div class="melder" id="melder">Bereit.</div>

  <div class="abschnitt-titel"><span>Google</span></div>
  <div id="googleListe"></div>

  <div class="knopfreihe">
    <button type="button" id="knopfAnmelden" onclick="anmelden()">Anmelden</button>
    <button type="button" id="knopfAbmelden" onclick="abmelden()">Abmelden</button>
    <button type="button" id="knopfDriveLaden" onclick="driveLadenJetzt()">Von Drive laden</button>
    <button type="button" id="knopfDriveSpeichern" onclick="driveSpeichernJetzt()">Zu Drive sichern</button>
    <button type="button" id="knopfAbgleich" class="stark" onclick="abgleichenJetzt()">Abgleichen</button>
  </div>

  <div class="abschnitt-titel"><span>Datenbestand</span></div>
  <div id="bestandListe"></div>

  <div class="abschnitt-titel"><span>Umgebung</span></div>
  <div id="umgebungListe"></div>
</div>

<div class="schirm" id="schirmMigration">
  <div class="abschnitt-titel"><span>Quelldateien</span></div>
  <input type="file" id="migDateien" multiple accept=".json,application/json"
         onchange="migDateienGewaehlt(event)">
  <div id="migQuellen"></div>

  <div class="knopfreihe">
    <button type="button" onclick="migVorschau()">Vorschau berechnen</button>
    <button type="button" id="knopfMigUebernehmen" class="stark"
            onclick="migUebernehmen()">Übernehmen</button>
  </div>

  <div class="melder" id="migMelder">Bereit.</div>

  <div class="abschnitt-titel"><span>Vorschau</span></div>
  <div id="migBericht"></div>
</div>

<div class="fuss">
  <button type="button" id="navTag" class="aktiv" onclick="zeigeSchirm('Tag')">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect>
      <path d="M3 10h18M8 3v4M16 3v4M8 15h8"></path></svg><span>Tag</span>
  </button>
  <button type="button" id="navMigration" onclick="zeigeSchirm('Migration')">
    <svg viewBox="0 0 24 24"><path d="M4 17V7a2 2 0 0 1 2-2h7l3 3h2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path>
      <path d="M9 13h6M12 10v6"></path></svg><span>Migration</span>
  </button>
  <button type="button" id="navDiagnose" onclick="zeigeSchirm('Diagnose')">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"></path></svg><span>Diagnose</span>
  </button>

<script>
'use strict';

/* ============================================================
   Grunddaten
   ============================================================ */

var APP_VERSION = '0.5.1';
var DATEINAME   = 'workbench.json';
var IDB_NAME    = 'workbench-speicher';
var IDB_STORE   = 'handles';
var IDB_KEY     = 'datendatei';
var LS_KEY      = 'workbench-daten';
var OPFS_NAME   = 'workbench.json';
var CLIENT_ID   = '347268246401-9ktgd8q5caq6v5nma36i3e38u9c37bre.apps.googleusercontent.com';
var REDIRECT_URI = 'https://alexandernoeth-bam.github.io/workbench/workbench.html';
var SCOPES = 'https://www.googleapis.com/auth/drive.file '
           + 'https://www.googleapis.com/auth/calendar.readonly';
var GIS_URL   = 'https://accounts.google.com/gsi/client';
var TOKEN_KEY = 'workbench-zugriff';
var ANMELDE_MERKER = 'workbench-war-angemeldet';
var ABGLEICH_VERZUG  = 4000;    /* so lange nach der letzten Änderung wird gewartet */
var ABGLEICH_MINDEST = 30000;   /* nicht öfter als alle 30 Sekunden von selbst */
var DRIVE_DATEI = 'workbench.json';
var VORLAUF_MS = 5 * 60 * 1000;   /* so lange vor Ablauf wird still erneuert */
var GRABSTEIN_TAGE = 180;         /* so lange bleibt ein Löschvermerk erhalten */

var SAMMLUNGEN = ['aufgaben','ziele','themen','projekte','ablaeufe','durchlaeufe',
                  'jahrestermine','kalenderzuordnung','termine'];

function leereDatenbank() {
  return {
    version:           APP_VERSION,
    aufgaben:          [],
    ziele:             [],
    themen:            [],
    projekte:          [],
    ablaeufe:          [],
    durchlaeufe:       [],
    jahrestermine:     [],
    kalenderzuordnung: {},
    termine:           [],
    grabsteine:        [],
    einstellungen: {
      clientId:      CLIENT_ID,
      redirectUri:   REDIRECT_URI,
      kalender:      [],
      ferienZeigen:  true,
      gespeichert:   null,
      stempel:       0
    }
  };
}

var DB = leereDatenbank();
var speicherWeg = 'keiner';
var dateiHandle = null;
var dateiName = '';
var rechteStand = 'unbekannt';
var letzterSchreibvorgang = null;
var schirmOffen = 'Tag';

/* Der Zugriffsschlüssel wird bewusst nie in DB geschrieben. Er lebt im
   Arbeitsspeicher und in sessionStorage, damit ein Neuladen ihn nicht verliert. */
var tokenClient = null;
var zugriffToken = null;
var tokenAblauf = 0;
var erneuerungsUhr = null;
var gisBereit = false;
var driveDateiId = '';
var driveStand = '';
var letzteUebertragung = null;
var letzterAbgleich = null;
var letzterBericht = null;
var abgleichUhr = null;
var abgleichLaeuft = false;
var abgleichZuletztMs = 0;

/* ============================================================
   Kleine Helfer
   ============================================================ */

function zwei(n) { return (n < 10 ? '0' : '') + n; }

/* Bewusst lokal gerechnet. toISOString() verschiebt um die Zeitzone
   und liefert am spaeten Abend den falschen Tag. */
function isoDatum(d) {
  var x = d || new Date();
  return x.getFullYear() + '-' + zwei(x.getMonth() + 1) + '-' + zwei(x.getDate());
}

function isoZeit(d) {
  var x = d || new Date();
  return isoDatum(x) + ' ' + zwei(x.getHours()) + ':' + zwei(x.getMinutes()) + ':' + zwei(x.getSeconds());
}

function melde(text, art) {
  var stellen = ['melder', 'migMelder'];
  var i;
  for (i = 0; i < stellen.length; i++) {
    var el = document.getElementById(stellen[i]);
    if (!el) { continue; }
    el.textContent = text;
    el.className = 'melder' + (art ? ' ' + art : '');
  }
}

function fsApiDa()   { return (typeof window.showOpenFilePicker === 'function'); }
function opfsDa()    { return !!(navigator.storage && navigator.storage.getDirectory); }
function idbDa()     { return !!window.indexedDB; }
function localDa() {
  try {
    window.localStorage.setItem('__probe__', '1');
    window.localStorage.removeItem('__probe__');
    return true;
  } catch (e) {
    return false;
  }
}

/* ============================================================
   IndexedDB: bewahrt den Datei-Handle ueber Sitzungen hinweg
   ============================================================ */

function idbOeffnen() {
  return new Promise(function (fertig, fehler) {
    if (!idbDa()) { fehler(new Error('IndexedDB nicht verfügbar')); return; }
    var anfrage = window.indexedDB.open(IDB_NAME, 1);
    anfrage.onupgradeneeded = function () {
      var db = anfrage.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) { db.createObjectStore(IDB_STORE); }
    };
    anfrage.onsuccess = function () { fertig(anfrage.result); };
    anfrage.onerror   = function () { fehler(anfrage.error); };
  });
}

function idbSchreiben(schluessel, wert) {
  return idbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(IDB_STORE, 'readwrite');
      t.objectStore(IDB_STORE).put(wert, schluessel);
      t.oncomplete = function () { db.close(); fertig(true); };
      t.onerror    = function () { db.close(); fehler(t.error); };
    });
  });
}

function idbLesen(schluessel) {
  return idbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(IDB_STORE, 'readonly');
      var a = t.objectStore(IDB_STORE).get(schluessel);
      a.onsuccess = function () { db.close(); fertig(a.result || null); };
      a.onerror   = function () { db.close(); fehler(a.error); };
    });
  });
}

function idbLoeschen(schluessel) {
  return idbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(IDB_STORE, 'readwrite');
      t.objectStore(IDB_STORE).delete(schluessel);
      t.oncomplete = function () { db.close(); fertig(true); };
      t.onerror    = function () { db.close(); fehler(t.error); };
    });
  });
}

/* ============================================================
   Berechtigungen — nur auf ausdrueckliche Geste anfragen
   ============================================================ */

function rechtePruefen(handle) {
  if (!handle || typeof handle.queryPermission !== 'function') {
    return Promise.resolve('unbekannt');
  }
  return handle.queryPermission({ mode: 'readwrite' })
    .then(function (stand) { return stand; })
    .catch(function () { return 'unbekannt'; });
}

function rechteAnfragen(handle) {
  if (!handle || typeof handle.requestPermission !== 'function') {
    return Promise.resolve('unbekannt');
  }
  return handle.requestPermission({ mode: 'readwrite' })
    .then(function (stand) { return stand; })
    .catch(function () { return 'denied'; });
}

/* ============================================================
   Speicherwege
   ============================================================ */

function dateiSchreiben(handle, text) {
  return handle.createWritable().then(function (strom) {
    return strom.write(text).then(function () { return strom.close(); });
  });
}

function dateiLesen(handle) {
  return handle.getFile().then(function (f) { return f.text(); });
}

function opfsHandle(anlegen) {
  return navigator.storage.getDirectory().then(function (ordner) {
    return ordner.getFileHandle(OPFS_NAME, { create: !!anlegen });
  });
}

function opfsSchreiben(text) {
  return opfsHandle(true).then(function (h) { return dateiSchreiben(h, text); });
}

function opfsLesen() {
  return opfsHandle(false).then(function (h) { return dateiLesen(h); });
}

function localSchreiben(text) {
  window.localStorage.setItem(LS_KEY, text);
  return Promise.resolve(true);
}

function localLesen() {
  return Promise.resolve(window.localStorage.getItem(LS_KEY));
}

/* ============================================================
   Datensätze: Kennung, Stempel, Grabsteine

   Der Änderungsstempel ist eine Zahl in Millisekunden seit 1970.
   Ein Datumstext wäre je nach Zeitzone unterschiedlich lang und
   ließe sich zwischen zwei Geräten nicht sicher vergleichen.
   ============================================================ */

function jetzt() { return Date.now(); }

function neueKennung() {
  return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function stempeln(satz) {
  if (!satz.id) { satz.id = neueKennung(); }
  satz.geaendert = jetzt();
  return satz;
}

/* Ältere Bestände tragen weder Kennung noch Stempel. Beides wird
   einmalig nachgetragen, ohne Inhalte anzufassen. */
function bestandStempeln(db) {
  var i, s, k;
  var nachgetragen = 0;
  for (i = 0; i < SAMMLUNGEN.length; i++) {
    s = SAMMLUNGEN[i];
    if (s === 'kalenderzuordnung') {
      var z = db[s] || {};
      for (k in z) {
        if (!Object.prototype.hasOwnProperty.call(z, k)) { continue; }
        if (typeof z[k] === 'string') { z[k] = { art: z[k], geaendert: 0 }; nachgetragen++; }
        else if (!z[k].geaendert) { z[k].geaendert = 0; nachgetragen++; }
      }
      continue;
    }
    var liste = db[s] || [];
    var j;
    for (j = 0; j < liste.length; j++) {
      if (!liste[j].id) { liste[j].id = neueKennung(); nachgetragen++; }
      if (typeof liste[j].geaendert !== 'number') { liste[j].geaendert = 0; nachgetragen++; }
    }
  }
  if (!Array.isArray(db.grabsteine)) { db.grabsteine = []; }
  return nachgetragen;
}

function grabsteinSetzen(sammlung, id) {
  if (!Array.isArray(DB.grabsteine)) { DB.grabsteine = []; }
  var i;
  for (i = 0; i < DB.grabsteine.length; i++) {
    if (DB.grabsteine[i].s === sammlung && DB.grabsteine[i].id === id) {
      DB.grabsteine[i].z = jetzt();
      return DB.grabsteine[i];
    }
  }
  var g = { s: sammlung, id: id, z: jetzt() };
  DB.grabsteine.push(g);
  return g;
}

function grabsteinZeit(steine, sammlung, id) {
  var i;
  for (i = 0; i < steine.length; i++) {
    if (steine[i].s === sammlung && steine[i].id === id) { return steine[i].z || 0; }
  }
  return 0;
}

function grabsteineAufraeumen(steine) {
  var grenze = jetzt() - (GRABSTEIN_TAGE * 24 * 60 * 60 * 1000);
  var frisch = [];
  var i;
  for (i = 0; i < steine.length; i++) {
    if ((steine[i].z || 0) >= grenze) { frisch.push(steine[i]); }
  }
  return frisch;
}

/* ============================================================
   Zusammenführen zweier Bestände

   Regel: Der jüngere Stempel gewinnt. Ein Löschvermerk gewinnt
   gegen jede Änderung, die älter ist als er selbst. Reine Funktion,
   damit sie außerhalb des Browsers geprüft werden kann.
   ============================================================ */

function zusammenfuehren(lokal, fremd) {
  var bericht = { neu: 0, ersetzt: 0, behalten: 0, entfernt: 0, konflikte: [] };
  var ergebnis = leereDatenbank();

  var steine = grabsteineAufraeumen(
    (Array.isArray(lokal.grabsteine) ? lokal.grabsteine : [])
      .concat(Array.isArray(fremd.grabsteine) ? fremd.grabsteine : [])
  );
  /* Doppelte Vermerke auf den jüngsten zusammenziehen */
  var karteS = {};
  var i, s, k;
  for (i = 0; i < steine.length; i++) {
    var sl = steine[i].s + '|' + steine[i].id;
    if (!karteS[sl] || (steine[i].z || 0) > karteS[sl].z) {
      karteS[sl] = { s: steine[i].s, id: steine[i].id, z: steine[i].z || 0 };
    }
  }
  var steineFrisch = [];
  for (k in karteS) {
    if (Object.prototype.hasOwnProperty.call(karteS, k)) { steineFrisch.push(karteS[k]); }
  }
  ergebnis.grabsteine = steineFrisch;

  for (i = 0; i < SAMMLUNGEN.length; i++) {
    s = SAMMLUNGEN[i];

    if (s === 'kalenderzuordnung') {
      var a = lokal[s] || {};
      var b = fremd[s] || {};
      var alle = {};
      for (k in a) { if (Object.prototype.hasOwnProperty.call(a, k)) { alle[k] = true; } }
      for (k in b) { if (Object.prototype.hasOwnProperty.call(b, k)) { alle[k] = true; } }
      for (k in alle) {
        if (!Object.prototype.hasOwnProperty.call(alle, k)) { continue; }
        var wa = a[k] || null;
        var wb = b[k] || null;
        var tot = grabsteinZeit(steineFrisch, s, k);
        var neuster = Math.max(wa ? (wa.geaendert || 0) : 0, wb ? (wb.geaendert || 0) : 0);
        if (tot && tot >= neuster) { bericht.entfernt++; continue; }
        if (wa && wb) {
          if ((wb.geaendert || 0) > (wa.geaendert || 0)) {
            ergebnis[s][k] = wb; bericht.ersetzt++;
            if (wa.art !== wb.art) { bericht.konflikte.push({ s: s, id: k, gewaehlt: 'fremd' }); }
          } else {
            ergebnis[s][k] = wa; bericht.behalten++;
            if (wa.art !== wb.art) { bericht.konflikte.push({ s: s, id: k, gewaehlt: 'lokal' }); }
          }
        } else if (wb) {
          ergebnis[s][k] = wb; bericht.neu++;
        } else {
          ergebnis[s][k] = wa; bericht.behalten++;
        }
      }
      continue;
    }

    var listeA = Array.isArray(lokal[s]) ? lokal[s] : [];
    var listeB = Array.isArray(fremd[s]) ? fremd[s] : [];
    var karte = {};
    var j;
    for (j = 0; j < listeA.length; j++) { karte[listeA[j].id] = { a: listeA[j], b: null }; }
    for (j = 0; j < listeB.length; j++) {
      if (karte[listeB[j].id]) { karte[listeB[j].id].b = listeB[j]; }
      else { karte[listeB[j].id] = { a: null, b: listeB[j] }; }
    }

    var kennung;
    for (kennung in karte) {
      if (!Object.prototype.hasOwnProperty.call(karte, kennung)) { continue; }
      var paar = karte[kennung];
      var za = paar.a ? (paar.a.geaendert || 0) : 0;
      var zb = paar.b ? (paar.b.geaendert || 0) : 0;
      var totZeit = grabsteinZeit(steineFrisch, s, kennung);

      if (totZeit && totZeit >= Math.max(za, zb)) { bericht.entfernt++; continue; }

      if (paar.a && paar.b) {
        if (zb > za) {
          ergebnis[s].push(paar.b); bericht.ersetzt++;
          if (za > 0 && zb > 0) { bericht.konflikte.push({ s: s, id: kennung, gewaehlt: 'fremd' }); }
        } else if (za > zb) {
          ergebnis[s].push(paar.a); bericht.behalten++;
          if (zb > 0) { bericht.konflikte.push({ s: s, id: kennung, gewaehlt: 'lokal' }); }
        } else {
          ergebnis[s].push(paar.a); bericht.behalten++;
        }
      } else if (paar.b) {
        ergebnis[s].push(paar.b); bericht.neu++;
      } else {
        ergebnis[s].push(paar.a); bericht.behalten++;
      }
    }
  }

  var ea = (lokal.einstellungen && lokal.einstellungen.stempel) || 0;
  var eb = (fremd.einstellungen && fremd.einstellungen.stempel) || 0;
  var quelle = (eb > ea) ? fremd.einstellungen : lokal.einstellungen;
  if (quelle) {
    var e;
    for (e in quelle) {
      if (Object.prototype.hasOwnProperty.call(quelle, e)) { ergebnis.einstellungen[e] = quelle[e]; }
    }
  }
  ergebnis.einstellungen.clientId = CLIENT_ID;
  ergebnis.einstellungen.redirectUri = REDIRECT_URI;
  ergebnis.version = APP_VERSION;

  return { db: ergebnis, bericht: bericht };
}

/* ============================================================
   Speichern und Laden
   ============================================================ */

function alsText() {
  DB.version = APP_VERSION;
  if (!DB.einstellungen) { DB.einstellungen = leereDatenbank().einstellungen; }
  DB.einstellungen.gespeichert = isoZeit();
  if (!DB.einstellungen.stempel) { DB.einstellungen.stempel = jetzt(); }
  if (!Array.isArray(DB.grabsteine)) { DB.grabsteine = []; }
  return JSON.stringify(DB, null, 2);
}

function uebernehmen(text) {
  if (!text) { return false; }
  var gelesen;
  try {
    gelesen = JSON.parse(text);
  } catch (e) {
    melde('Die Datei enthält kein gültiges JSON: ' + e.message, 'warn');
    return false;
  }
  if (!gelesen || typeof gelesen !== 'object') { return false; }

  var frisch = leereDatenbank();
  var i;
  for (i = 0; i < SAMMLUNGEN.length; i++) {
    var name = SAMMLUNGEN[i];
    if (name === 'kalenderzuordnung') {
      if (gelesen[name] && typeof gelesen[name] === 'object') { frisch[name] = gelesen[name]; }
    } else if (Array.isArray(gelesen[name])) {
      frisch[name] = gelesen[name];
    }
  }
  if (gelesen.einstellungen && typeof gelesen.einstellungen === 'object') {
    var e;
    for (e in gelesen.einstellungen) {
      if (Object.prototype.hasOwnProperty.call(gelesen.einstellungen, e)) {
        frisch.einstellungen[e] = gelesen.einstellungen[e];
      }
    }
  }
  if (Array.isArray(gelesen.grabsteine)) { frisch.grabsteine = gelesen.grabsteine; }
  frisch.einstellungen.clientId    = CLIENT_ID;
  frisch.einstellungen.redirectUri = REDIRECT_URI;
  bestandStempeln(frisch);
  DB = frisch;
  return true;
}

function speichern() {
  var text = alsText();

  if (speicherWeg === 'datei' && dateiHandle) {
    return dateiSchreiben(dateiHandle, text).then(function () {
      letzterSchreibvorgang = isoZeit();
      return 'datei';
    }).catch(function (f) {
      melde('Schreiben in die Datei fehlgeschlagen, weiche auf den Notweg aus.\n' + f.message, 'warn');
      return notwegSchreiben(text);
    });
  }
  return notwegSchreiben(text);
}

function notwegSchreiben(text) {
  if (opfsDa()) {
    return opfsSchreiben(text).then(function () {
      speicherWeg = 'opfs';
      letzterSchreibvorgang = isoZeit();
      return 'opfs';
    }).catch(function () {
      return localNotweg(text);
    });
  }
  return localNotweg(text);
}

function localNotweg(text) {
  if (!localDa()) {
    speicherWeg = 'keiner';
    return Promise.reject(new Error('Kein Speicherweg verfügbar'));
  }
  return localSchreiben(text).then(function () {
    speicherWeg = 'local';
    letzterSchreibvorgang = isoZeit();
    return 'local';
  });
}

function laden() {
  if (dateiHandle) {
    return rechtePruefen(dateiHandle).then(function (stand) {
      rechteStand = stand;
      if (stand !== 'granted') { return null; }
      return dateiLesen(dateiHandle).then(function (text) {
        if (uebernehmen(text)) { speicherWeg = 'datei'; return 'datei'; }
        return null;
      });
    }).then(function (ergebnis) {
      if (ergebnis) { return ergebnis; }
      return notwegLesen();
    }).catch(function () {
      return notwegLesen();
    });
  }
  return notwegLesen();
}

function notwegLesen() {
  if (opfsDa()) {
    return opfsLesen().then(function (text) {
      if (uebernehmen(text)) { speicherWeg = 'opfs'; return 'opfs'; }
      return localNotwegLesen();
    }).catch(function () {
      return localNotwegLesen();
    });
  }
  return localNotwegLesen();
}

function localNotwegLesen() {
  if (!localDa()) { speicherWeg = 'keiner'; return Promise.resolve(null); }
  return localLesen().then(function (text) {
    if (uebernehmen(text)) { speicherWeg = 'local'; return 'local'; }
    speicherWeg = localDa() ? 'local' : 'keiner';
    return null;
  });
}

/* ============================================================
   Google: Anmeldung
   ============================================================ */

function gisLaden() {
  if (gisBereit) { return Promise.resolve(true); }
  if (window.google && window.google.accounts && window.google.accounts.oauth2) {
    gisBereit = true;
    return Promise.resolve(true);
  }
  return new Promise(function (fertig, fehler) {
    var vorhanden = document.getElementById('gisSkript');
    if (vorhanden) {
      vorhanden.addEventListener('load', function () { gisBereit = true; fertig(true); });
      return;
    }
    var s = document.createElement('script');
    s.id = 'gisSkript';
    s.src = GIS_URL;
    s.async = true;
    s.onload = function () { gisBereit = true; fertig(true); };
    s.onerror = function () { fehler(new Error('Die Anmeldebibliothek ließ sich nicht laden.')); };
    document.head.appendChild(s);
  });
}

function tokenMerken(token, gueltigSek) {
  zugriffToken = token;
  tokenAblauf = Date.now() + (gueltigSek * 1000);
  try {
    window.sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ t: token, a: tokenAblauf }));
  } catch (e) {
    /* ohne sessionStorage lebt der Schlüssel nur bis zum Neuladen */
  }
  erneuerungPlanen();
}

function tokenAusSitzung() {
  try {
    var roh = window.sessionStorage.getItem(TOKEN_KEY);
    if (!roh) { return false; }
    var w = JSON.parse(roh);
    if (!w || !w.t || !w.a || w.a <= Date.now()) { return false; }
    zugriffToken = w.t;
    tokenAblauf = w.a;
    erneuerungPlanen();
    return true;
  } catch (e) {
    return false;
  }
}

function tokenVergessen() {
  zugriffToken = null;
  tokenAblauf = 0;
  if (erneuerungsUhr) { window.clearTimeout(erneuerungsUhr); erneuerungsUhr = null; }
  try { window.sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* egal */ }
}

function tokenGueltig() {
  return !!zugriffToken && tokenAblauf > Date.now();
}

function restMinuten() {
  if (!tokenGueltig()) { return 0; }
  return Math.max(0, Math.round((tokenAblauf - Date.now()) / 60000));
}

/* Still erneuern, bevor die Stunde um ist. Ohne das reißt jede laufende
   Arbeit nach 60 Minuten ab — genau der bekannte Knackpunkt. */
function erneuerungPlanen() {
  if (erneuerungsUhr) { window.clearTimeout(erneuerungsUhr); erneuerungsUhr = null; }
  if (!tokenAblauf) { return; }
  var wartezeit = tokenAblauf - Date.now() - VORLAUF_MS;
  if (wartezeit < 1000) { wartezeit = 1000; }
  erneuerungsUhr = window.setTimeout(function () {
    anmelden(true);
  }, wartezeit);
}

function klientVorbereiten() {
  if (tokenClient) { return Promise.resolve(tokenClient); }
  return gisLaden().then(function () {
    tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: function () { /* wird je Anfrage überschrieben */ }
    });
    return tokenClient;
  });
}

function anmelden(still) {
  return klientVorbereiten().then(function (klient) {
    return new Promise(function (fertig) {
      klient.callback = function (antwort) {
        if (antwort && antwort.access_token) {
          tokenMerken(antwort.access_token, Number(antwort.expires_in) || 3600);
          try { window.localStorage.setItem(ANMELDE_MERKER, '1'); } catch (e) { /* egal */ }
          abgleichPlanen(true);
          if (!still) { melde('Angemeldet. Gültig für ' + restMinuten() + ' Minuten.', 'gut'); }
          zeichne();
          fertig(true);
          return;
        }
        var grund = (antwort && antwort.error) ? antwort.error : 'unbekannt';
        if (still) {
          melde('Die stille Erneuerung ist fehlgeschlagen (' + grund + ').\n'
              + 'Bitte einmal auf „Anmelden" tippen.', 'warn');
        } else {
          melde('Anmeldung nicht abgeschlossen (' + grund + ').', 'warn');
        }
        zeichne();
        fertig(false);
      };
      klient.requestAccessToken({ prompt: still ? '' : 'consent' });
    });
  }).catch(function (f) {
    melde('Anmeldung nicht möglich.\n' + (f ? f.message : ''), 'warn');
    zeichne();
    return false;
  });
}

function abmelden() {
  var alt = zugriffToken;
  try { window.localStorage.removeItem(ANMELDE_MERKER); } catch (e) { /* egal */ }
  tokenVergessen();
  driveDateiId = '';
  driveStand = '';
  if (alt && window.google && window.google.accounts && window.google.accounts.oauth2) {
    try { window.google.accounts.oauth2.revoke(alt, function () { return null; }); }
    catch (e) { /* Widerruf ist Beiwerk */ }
  }
  melde('Abgemeldet. Die lokalen Daten bleiben erhalten.', null);
  zeichne();
}

/* ============================================================
   Google Drive
   ============================================================ */

function driveKopf(zusatz) {
  var k = { 'Authorization': 'Bearer ' + zugriffToken };
  if (zusatz) {
    var n;
    for (n in zusatz) {
      if (Object.prototype.hasOwnProperty.call(zusatz, n)) { k[n] = zusatz[n]; }
    }
  }
  return k;
}

function antwortPruefen(a) {
  if (a.ok) { return a; }
  if (a.status === 401) {
    tokenVergessen();
    throw new Error('Der Zugriff ist abgelaufen. Bitte neu anmelden.');
  }
  return a.text().then(function (t) {
    throw new Error('Drive antwortete mit ' + a.status + ': ' + t.slice(0, 200));
  });
}

function driveSuchen() {
  var url = 'https://www.googleapis.com/drive/v3/files'
          + '?q=' + encodeURIComponent("name='" + DRIVE_DATEI + "' and trashed=false")
          + '&fields=' + encodeURIComponent('files(id,name,modifiedTime)')
          + '&pageSize=10';
  return window.fetch(url, { headers: driveKopf() })
    .then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      var liste = (d && d.files) ? d.files : [];
      if (!liste.length) { return null; }
      driveDateiId = liste[0].id;
      driveStand = liste[0].modifiedTime || '';
      return liste[0];
    });
}

function driveAnlegen() {
  return window.fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: driveKopf({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ name: DRIVE_DATEI, mimeType: 'application/json' })
  }).then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      driveDateiId = d.id;
      return d.id;
    });
}

function driveHochladen() {
  var text = alsText();
  var los = driveDateiId ? Promise.resolve(driveDateiId)
                         : driveSuchen().then(function (t) { return t ? t.id : driveAnlegen(); });
  return los.then(function (id) {
    return window.fetch('https://www.googleapis.com/upload/drive/v3/files/' + id
                        + '?uploadType=media&fields=id,modifiedTime', {
      method: 'PATCH',
      headers: driveKopf({ 'Content-Type': 'application/json' }),
      body: text
    });
  }).then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      driveStand = d.modifiedTime || '';
      letzteUebertragung = isoZeit();
      return true;
    });
}

function driveHerunterladen() {
  var los = driveDateiId ? Promise.resolve(driveDateiId)
                         : driveSuchen().then(function (t) { return t ? t.id : null; });
  return los.then(function (id) {
    if (!id) { return null; }
    return window.fetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media', {
      headers: driveKopf()
    }).then(antwortPruefen)
      .then(function (a) { return a.text(); });
  });
}

/* ============================================================
   Abgleich: herunterladen, zusammenführen, zurückschreiben
   ============================================================ */

function textZuBestand(text) {
  var gelesen;
  try {
    gelesen = JSON.parse(text);
  } catch (e) {
    return null;
  }
  if (!gelesen || typeof gelesen !== 'object') { return null; }
  var frisch = leereDatenbank();
  var i, name;
  for (i = 0; i < SAMMLUNGEN.length; i++) {
    name = SAMMLUNGEN[i];
    if (name === 'kalenderzuordnung') {
      if (gelesen[name] && typeof gelesen[name] === 'object') { frisch[name] = gelesen[name]; }
    } else if (Array.isArray(gelesen[name])) {
      frisch[name] = gelesen[name];
    }
  }
  if (Array.isArray(gelesen.grabsteine)) { frisch.grabsteine = gelesen.grabsteine; }
  if (gelesen.einstellungen && typeof gelesen.einstellungen === 'object') {
    var e;
    for (e in gelesen.einstellungen) {
      if (Object.prototype.hasOwnProperty.call(gelesen.einstellungen, e)) {
        frisch.einstellungen[e] = gelesen.einstellungen[e];
      }
    }
  }
  bestandStempeln(frisch);
  return frisch;
}

function berichtText(b) {
  if (!b) { return 'kein Abgleich gelaufen'; }
  var t = b.neu + ' neu · ' + b.ersetzt + ' ersetzt · ' + b.behalten + ' behalten · '
        + b.entfernt + ' entfernt';
  if (b.konflikte.length) { t += ' · ' + b.konflikte.length + ' Konflikt(e)'; }
  return t;
}

function abgleichen() {
  if (!tokenGueltig()) { return Promise.reject(new Error('Nicht angemeldet.')); }
  bestandStempeln(DB);
  return driveHerunterladen().then(function (text) {
    var fremd = text ? textZuBestand(text) : null;
    if (!fremd) {
      letzterBericht = { neu: 0, ersetzt: 0, behalten: 0, entfernt: 0, konflikte: [] };
      return driveHochladen();
    }
    var ergebnis = zusammenfuehren(DB, fremd);
    DB = ergebnis.db;
    letzterBericht = ergebnis.bericht;
    return speichern().then(function () { return driveHochladen(); });
  }).then(function () {
    letzterAbgleich = isoZeit();
    return letzterBericht;
  });
}

/* Der Abgleich läuft von selbst: kurz nach einer Änderung, beim
   Zurückkehren zur App und nach der Anmeldung. Ohne das bleibt die
   Arbeit auf dem Gerät liegen, auf dem sie entstanden ist. */
function abgleichPlanen(sofort) {
  if (!tokenGueltig()) { return; }
  if (abgleichUhr) { window.clearTimeout(abgleichUhr); }
  abgleichUhr = window.setTimeout(abgleichStill, sofort ? 300 : ABGLEICH_VERZUG);
}

function abgleichStill() {
  abgleichUhr = null;
  if (!tokenGueltig() || abgleichLaeuft) { return; }
  abgleichLaeuft = true;
  abgleichen().then(function (b) {
    abgleichZuletztMs = Date.now();
    if (b && (b.neu || b.ersetzt || b.entfernt)) {
      melde('Abgeglichen: ' + berichtText(b), 'gut');
    }
    tagZeichnen();
    zeichne();
  }).catch(function () {
    return null;
  }).then(function () {
    abgleichLaeuft = false;
  });
}

function rueckkehrPruefen() {
  if (document.hidden) { return; }
  if (!tokenGueltig()) { return; }
  if (Date.now() - abgleichZuletztMs < ABGLEICH_MINDEST) { return; }
  abgleichPlanen(true);
}

function abgleichenJetzt() {
  if (!tokenGueltig()) { melde('Bitte zuerst anmelden.', 'warn'); return; }
  melde('Abgleich läuft …', null);
  abgleichen().then(function (b) {
    var art = (b && b.konflikte.length) ? null : 'gut';
    melde('Abgleich fertig.\n' + berichtText(b), art);
    zeichne();
  }).catch(function (f) {
    melde('Abgleich fehlgeschlagen.\n' + (f ? f.message : ''), 'warn');
    zeichne();
  });
}

function driveLadenJetzt() {
  if (!tokenGueltig()) { melde('Bitte zuerst anmelden.', 'warn'); return; }
  driveHerunterladen().then(function (text) {
    if (!text) {
      melde('Bei Drive liegt noch keine ' + DRIVE_DATEI + '.', null);
      zeichne();
      return null;
    }
    if (!uebernehmen(text)) { zeichne(); return null; }
    letzteUebertragung = isoZeit();
    return speichern().then(function () {
      melde('Von Drive geladen und lokal gesichert.', 'gut');
      zeichne();
    });
  }).catch(function (f) {
    melde('Laden von Drive fehlgeschlagen.\n' + (f ? f.message : ''), 'warn');
    zeichne();
  });
}

function driveSpeichernJetzt() {
  if (!tokenGueltig()) { melde('Bitte zuerst anmelden.', 'warn'); return; }
  driveHochladen().then(function () {
    melde('Zu Drive gesichert: ' + DRIVE_DATEI + '\n' + letzteUebertragung, 'gut');
    zeichne();
  }).catch(function (f) {
    melde('Sichern zu Drive fehlgeschlagen.\n' + (f ? f.message : ''), 'warn');
    zeichne();
  });
}


/* ============================================================
   Migration der Altbestände

   Läuft nur auf ausdrücklichen Anstoß, zeigt erst eine Vorschau
   und ist wiederholbar: Kennungen werden aus dem Altbestand
   abgeleitet, dieselbe Datei zweimal ergibt keine Dubletten.
   ============================================================ */

var migQuellen = [];
var migErgebnis = null;

/* Was aus welchem Bereich wird. Unbekannte werden Thema und im
   Bericht ausgewiesen. */
var BEREICH_ZUORDNUNG = {
  'Organisatorische Aufgaben':                'thema',
  'User Journey QS - Allgemeines':            'thema',
  'Organisation und Personal':                'thema',
  'Last- und Performance - Messungen online': 'thema',
  'übergreifende QS Online + Hybrd':          'thema',
  'Hybride Tests':                            'thema',
  'Reisen 2026':                              'thema',
  'Mindset und Planung':                      'thema',
  'Update-Termine 2026: Auslieferungen':      'projekt',
  'SMAX: Gitlab Ablöse des ALM-Support-Issue-Trackers': 'projekt',
  'Auslieferungen 20.0x':                     'projekt',
  'Einführung Windows 11 26H2':               'projekt',
  'F TO Analyse und Design eines hybriden Workflowtests (hWFT)': 'projekt',
  'Garage erstellen lassen':                  'projekt',
  'Ernährung und Gewicht':                    'ziel',
  'übergreifende Qualitätssicherung OnPremise': 'weg',
  'Sonstiges (Einzelaufgaben)':               'weg'
};

var PLAN_ZUORDNUNG = {
  'Projektplan SMAX':                      'projekt',
  'Workflowtest Testdurchführung':         'vorlage',
  'Kreta: Akklimatisieren und Schwimmen':  'aufgabe',
  'Mein Tag':                              'weg'
};

var ZIEL_ANGABEN = {
  'Ernährung und Gewicht': { name: 'Gewicht auf 73 kg', zieltermin: '2027-04-30' }
};

/* Kurze, gleichbleibende Kennung aus einem Text. Damit ergibt ein
   zweiter Durchlauf dieselben Kennungen. */
function schluesselId(vorsatz, text) {
  var h = 5381;
  var i;
  for (i = 0; i < text.length; i++) {
    h = ((h * 33) ^ text.charCodeAt(i)) >>> 0;
  }
  return vorsatz + '-' + h.toString(36);
}

/* Alt: 1 = Montag bis 7 = Sonntag. Neu: 0 = Sonntag bis 6 = Samstag. */
function wochentagUmrechnen(alt) {
  var n = Number(alt);
  if (!(n >= 1 && n <= 7)) { return -1; }
  return (n === 7) ? 0 : n;
}

function wiederholungUmschreiben(alt, faellig) {
  if (!alt || !alt.typ) { return null; }
  var intervall = Number(alt.intervall) || 1;
  if (intervall < 1) { intervall = 1; }
  if (intervall > 4) { intervall = 4; }

  if (alt.typ === 'woechentlich') {
    var tage = [];
    var roh = Array.isArray(alt.wochentage) ? alt.wochentage : [];
    var i;
    for (i = 0; i < roh.length; i++) {
      var t = wochentagUmrechnen(roh[i]);
      if (t >= 0 && tage.indexOf(t) < 0) { tage.push(t); }
    }
    /* Ohne Wochentag trifft die Regel nie zu — dann gibt es sie nicht. */
    if (!tage.length) { return null; }
    tage.sort(function (a, b) { return a - b; });
    return { takt: 'woche', intervall: intervall, tage: tage, tag: 1 };
  }

  if (alt.typ === 'monatlich') {
    var tag = 1;
    if (faellig && faellig.length >= 10) { tag = Number(faellig.slice(8, 10)) || 1; }
    return { takt: 'monat', intervall: intervall, tage: [], tag: tag };
  }
  return null;
}

function quelleInhalt(quelle) {
  var d = quelle.daten || {};
  var teile = [];
  function zaehl(feld, wort) {
    if (Array.isArray(d[feld]) && d[feld].length) { teile.push(d[feld].length + ' ' + wort); }
  }
  zaehl('bereiche', 'Bereiche');
  zaehl('aufgaben', 'Aufgaben');
  zaehl('plaene', 'Pläne');
  zaehl('jahrestermine', 'Jahrestermine');
  zaehl('ziele', 'Ziele');
  zaehl('aktivitaeten', 'Aktivitäten');
  if (!teile.length) { return 'nichts Verwertbares gefunden'; }
  return teile.join(' · ');
}

function quelleErkennen(name, daten) {
  if (daten && Array.isArray(daten.aktivitaeten) && Array.isArray(daten.gruppen)) {
    return 'timeassist';
  }
  if (daten && Array.isArray(daten.bereiche) && Array.isArray(daten.aufgaben)) {
    return 'workassist';
  }
  if (daten && Array.isArray(daten.aufgaben)) { return 'backlog'; }
  return 'unbekannt';
}

function kontextRaten(name) {
  return (/privat/i.test(name)) ? 'privat' : 'beruflich';
}

/* ------------------------------------------------------------
   Der eigentliche Rechenschritt. Reine Funktion, damit sie
   außerhalb des Browsers geprüft werden kann.
   ------------------------------------------------------------ */
function migrationRechnen(quellen) {
  var ziel = leereDatenbank();
  var bericht = {
    themen: 0, projekte: 0, ziele: 0, aufgaben: 0, ablaeufe: 0, durchlaeufe: 0,
    jahrestermine: 0, verworfen: 0, zusammengezogen: 0, regelnAus: 0,
    unbekannteBereiche: [], verworfeneArten: {}, hinweise: []
  };

  var themenNachAlt = {};    /* alte bereichId -> neue themaId */
  var projekteNachAlt = {};  /* alte bereichId -> neue projektId */
  var zielNachAlt = {};
  var jtGesehen = {};
  var wdhGesehen = {};       /* kontext|titel -> Aufgabe */

  var q, i, j;

  /* --- Durchgang 1: Bereiche ------------------------------- */
  for (q = 0; q < quellen.length; q++) {
    var quelle = quellen[q];
    if (quelle.art !== 'workassist') { continue; }
    var bereiche = quelle.daten.bereiche || [];
    for (i = 0; i < bereiche.length; i++) {
      var b = bereiche[i];
      var name = (b.name || '').trim();
      if (!name) { continue; }
      var wohin = BEREICH_ZUORDNUNG[name];
      if (!wohin) {
        wohin = 'thema';
        if (bericht.unbekannteBereiche.indexOf(name) < 0) {
          bericht.unbekannteBereiche.push(name);
        }
      }
      if (wohin === 'weg') { bericht.verworfen++; continue; }

      if (wohin === 'thema') {
        var tid = schluesselId('th', quelle.kontext + '|' + name);
        if (!themenNachAlt[b.id]) {
          themenNachAlt[b.id] = tid;
          ziel.themen.push(stempelnMit({ id: tid, name: name, kontext: quelle.kontext }));
          bericht.themen++;
        }
      } else if (wohin === 'projekt') {
        var pid = schluesselId('pj', quelle.kontext + '|' + name);
        if (!projekteNachAlt[b.id]) {
          projekteNachAlt[b.id] = pid;
          ziel.projekte.push(stempelnMit({
            id: pid, name: name, kontext: quelle.kontext, beschreibung: '',
            start: '', ende: '', status: 'laufend',
            meilensteine: [], zielzustaende: [], anlagen: []
          }));
          bericht.projekte++;
        }
      } else if (wohin === 'ziel') {
        var angabe = ZIEL_ANGABEN[name] || { name: name, zieltermin: '' };
        var zid = schluesselId('zl', quelle.kontext + '|' + name);
        if (!zielNachAlt[b.id]) {
          zielNachAlt[b.id] = zid;
          ziel.ziele.push(stempelnMit({
            id: zid, name: angabe.name, kontext: quelle.kontext, beschreibung: '',
            zieltermin: angabe.zieltermin, status: 'laufend',
            zielzustaende: [], einzahler: []
          }));
          bericht.ziele++;
        }
      }
    }
  }

  /* --- Durchgang 2: Aufgaben ------------------------------- */
  for (q = 0; q < quellen.length; q++) {
    var qa = quellen[q];
    if (qa.art !== 'workassist' && qa.art !== 'backlog') { continue; }
    var aufgaben = qa.daten.aufgaben || [];
    for (i = 0; i < aufgaben.length; i++) {
      var a = aufgaben[i];
      var titel = (a.titel || '').trim();
      if (!titel) { bericht.verworfen++; continue; }

      var regel = wiederholungUmschreiben(a.wiederholung, a.faellig);
      if (a.wiederholung && !regel) { bericht.regelnAus++; }

      /* Wiederkehrendes lag im Altbestand als Reihe von Instanzen vor.
         Daraus wird eine Aufgabe mit Regel und dem jüngsten Erledigtdatum. */
      if (a.wiederholung) {
        var wschluessel = qa.kontext + '|' + titel;
        var schon = wdhGesehen[wschluessel];
        if (schon) {
          bericht.zusammengezogen++;
          if (a.erledigtAm && (!schon.zuletztErledigt || a.erledigtAm > schon.zuletztErledigt)) {
            schon.zuletztErledigt = a.erledigtAm;
          }
          continue;
        }
      }

      var neu = stempelnMit({
        id: schluesselId('au', qa.kontext + '|' + (a.id || titel + '|' + i)),
        titel: titel,
        beschreibung: a.notiz || '',
        kontext: qa.kontext,
        themaId: themenNachAlt[a.bereichId] || null,
        projektId: projekteNachAlt[a.bereichId] || null,
        frist: a.faellig || '',
        planung: 'backlog',
        uhrzeit: a.uhrzeit || '',
        art: 'haupt',
        wiederholung: regel,
        status: (a.status === 'erledigt') ? 'erledigt' : 'offen',
        erledigtAm: a.erledigtAm || null,
        zuletztErledigt: a.erledigtAm || null,
        ablaufSchritt: null
      });
      if (a.wiederholung) {
        neu.id = schluesselId('au', qa.kontext + '|wdh|' + titel);
        wdhGesehen[qa.kontext + '|' + titel] = neu;
      }
      ziel.aufgaben.push(neu);
      bericht.aufgaben++;
    }
  }

  /* --- Durchgang 3: Pläne ---------------------------------- */
  for (q = 0; q < quellen.length; q++) {
    var qp = quellen[q];
    if (qp.art !== 'workassist') { continue; }
    var plaene = qp.daten.plaene || [];
    for (i = 0; i < plaene.length; i++) {
      var pl = plaene[i];
      var ptitel = (pl.titel || '').trim();
      if (!ptitel) { bericht.verworfen++; continue; }
      var wohinP = PLAN_ZUORDNUNG[ptitel] || 'durchlauf';
      var schritte = Array.isArray(pl.schritte) ? pl.schritte : [];

      if (wohinP === 'weg') { bericht.verworfen++; continue; }

      if (wohinP === 'aufgabe') {
        ziel.aufgaben.push(stempelnMit({
          id: schluesselId('au', qp.kontext + '|plan|' + ptitel),
          titel: ptitel, beschreibung: pl.notiz || '', kontext: qp.kontext,
          themaId: themenNachAlt[pl.bereichId] || null,
          projektId: projekteNachAlt[pl.bereichId] || null,
          frist: '', planung: 'backlog', uhrzeit: '', art: 'haupt',
          wiederholung: null, status: 'offen', erledigtAm: null,
          zuletztErledigt: null, ablaufSchritt: null
        }));
        bericht.aufgaben++;
        continue;
      }

      if (wohinP === 'projekt') {
        var meilen = [];
        for (j = 0; j < schritte.length; j++) {
          meilen.push({
            id: schluesselId('ms', ptitel + '|' + j),
            titel: (schritte[j].titel || schritte[j].t || ('Schritt ' + (j + 1))),
            datum: '', erreicht: !!schritte[j].erledigt
          });
        }
        ziel.projekte.push(stempelnMit({
          id: schluesselId('pj', qp.kontext + '|plan|' + ptitel),
          name: ptitel, kontext: qp.kontext, beschreibung: pl.notiz || '',
          start: '', ende: '', status: 'laufend',
          meilensteine: meilen, zielzustaende: [], anlagen: []
        }));
        bericht.projekte++;
        continue;
      }

      var stufen = [];
      for (j = 0; j < schritte.length; j++) {
        stufen.push({
          titel: (schritte[j].titel || schritte[j].t || ('Schritt ' + (j + 1))),
          auf: !!schritte[j].alsAufgabe,
          fertig: !!schritte[j].erledigt,
          planung: 'backlog'
        });
      }

      if (wohinP === 'vorlage') {
        var vschritte = [];
        for (j = 0; j < stufen.length; j++) {
          vschritte.push({ id: schluesselId('sc', ptitel + '|' + j),
                           titel: stufen[j].titel, auf: stufen[j].auf });
        }
        ziel.ablaeufe.push(stempelnMit({
          id: schluesselId('ab', qp.kontext + '|' + ptitel),
          name: ptitel, kontext: qp.kontext, schritte: vschritte, zuletzt: null
        }));
        bericht.ablaeufe++;
      } else {
        ziel.durchlaeufe.push(stempelnMit({
          id: schluesselId('dl', qp.kontext + '|' + ptitel),
          ablaufId: null, name: ptitel, kontext: qp.kontext,
          start: isoDatum(), frist: '', schritte: stufen
        }));
        bericht.durchlaeufe++;
      }
    }
  }

  /* --- Durchgang 4: Jahrestermine -------------------------- */
  for (q = 0; q < quellen.length; q++) {
    var qj = quellen[q];
    var jt = qj.daten.jahrestermine || [];
    for (i = 0; i < jt.length; i++) {
      var e = jt[i];
      var etitel = (e.t || e.titel || '').trim();
      var art = e.art || 'sonstiges';
      if (art === 'feiertag' || art === 'ferien') {
        bericht.verworfen++;
        bericht.verworfeneArten[art] = (bericht.verworfeneArten[art] || 0) + 1;
        continue;
      }
      if (!etitel) { bericht.verworfen++; continue; }
      var schluessel = etitel + '|' + (e.von || '') + '|' + (e.bis || '');
      if (jtGesehen[schluessel]) { bericht.zusammengezogen++; continue; }
      jtGesehen[schluessel] = true;
      ziel.jahrestermine.push(stempelnMit({
        id: schluesselId('jt', schluessel),
        titel: etitel, art: art,
        von: e.von || '', bis: e.bis || e.von || '',
        jaehrlich: !!e.jaehrlich
      }));
      bericht.jahrestermine++;
    }
  }

  /* --- Durchgang 5: Ziele aus TimeAssist ------------------- */
  for (q = 0; q < quellen.length; q++) {
    var qz = quellen[q];
    if (qz.art !== 'timeassist') { continue; }
    var zl = qz.daten.ziele || [];
    for (i = 0; i < zl.length; i++) {
      var z = zl[i];
      var zname = (z.t || z.titel || '').trim();
      if (!zname || z.archiviert) { bericht.verworfen++; continue; }
      var zkontext = gruppenKontext(qz.daten, z.sphaere) || qz.kontext;
      ziel.ziele.push(stempelnMit({
        id: schluesselId('zl', 'ta|' + zname),
        name: zname, kontext: zkontext, beschreibung: '',
        zieltermin: deutschZuIso(z.frist), status: 'laufend',
        zielzustaende: [], einzahler: []
      }));
      bericht.ziele++;
    }
  }

  if (bericht.zusammengezogen) {
    bericht.hinweise.push(bericht.zusammengezogen
      + ' Einträge waren Dubletten oder erzeugte Wiederholungen und wurden zusammengezogen.');
  }
  if (bericht.regelnAus) {
    bericht.hinweise.push(bericht.regelnAus
      + ' Wiederholungsregeln ohne Wochentag wurden abgeschaltet.');
  }
  if (bericht.unbekannteBereiche.length) {
    bericht.hinweise.push('Nicht zugeordnete Bereiche wurden Themen: '
      + bericht.unbekannteBereiche.join(', '));
  }

  return { ziel: ziel, bericht: bericht };
}

function stempelnMit(satz) {
  satz.geaendert = jetzt();
  return satz;
}

/* TimeAssist führt den Kontext als Gruppe, nicht im Dateinamen. */
function gruppenKontext(daten, sphaere) {
  var gruppen = (daten && daten.gruppen) || [];
  var i;
  for (i = 0; i < gruppen.length; i++) {
    if (gruppen[i].id === sphaere) {
      var name = String(gruppen[i].name || '').toLowerCase();
      if (name.indexOf('privat') >= 0) { return 'privat'; }
      if (name.indexOf('beruf') >= 0) { return 'beruflich'; }
    }
  }
  return '';
}

/* TimeAssist speichert TT.MM.JJJJ */
function deutschZuIso(text) {
  if (!text) { return ''; }
  var m = String(text).match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (!m) { return String(text); }
  return m[3] + '-' + m[2] + '-' + m[1];
}

/* ------------------------------------------------------------
   Bedienung
   ------------------------------------------------------------ */

function migDateienGewaehlt(ereignis) {
  var dateien = ereignis && ereignis.target ? ereignis.target.files : null;
  if (!dateien || !dateien.length) { return; }
  migQuellen = [];
  migErgebnis = null;
  var offen = dateien.length;
  var i;
  for (i = 0; i < dateien.length; i++) {
    (function (datei) {
      var leser = new window.FileReader();
      leser.onload = function () {
        var daten = null;
        try { daten = JSON.parse(leser.result); } catch (e) { daten = null; }
        if (daten) {
          migQuellen.push({
            name: datei.name,
            art: quelleErkennen(datei.name, daten),
            kontext: kontextRaten(datei.name),
            daten: daten
          });
        } else {
          migQuellen.push({ name: datei.name, art: 'unlesbar', kontext: '', daten: {} });
        }
        offen--;
        if (offen === 0) { migFertigGelesen(); }
      };
      leser.onerror = function () {
        migQuellen.push({ name: datei.name, art: 'unlesbar', kontext: '', daten: {} });
        offen--;
        if (offen === 0) { migFertigGelesen(); }
      };
      leser.readAsText(datei);
    })(dateien[i]);
  }
}

function migFertigGelesen() {
  migZeichne();
  var gut = 0;
  var i;
  for (i = 0; i < migQuellen.length; i++) {
    if (migQuellen[i].art !== 'unlesbar' && migQuellen[i].art !== 'unbekannt') { gut++; }
  }
  melde(migQuellen.length + ' Datei(en) gelesen, davon ' + gut + ' verwertbar.\n'
      + 'Jetzt „Vorschau berechnen" antippen.', gut ? 'gut' : 'warn');
}

function migVorschau() {
  var brauchbar = [];
  var i;
  for (i = 0; i < migQuellen.length; i++) {
    if (migQuellen[i].art !== 'unlesbar' && migQuellen[i].art !== 'unbekannt') {
      brauchbar.push(migQuellen[i]);
    }
  }
  if (!migQuellen.length) {
    melde('Es ist noch keine Datei gewählt. Bitte oben die JSON-Dateien auswählen.', 'warn');
    return;
  }
  if (!brauchbar.length) {
    melde('Die gewählten Dateien wurden nicht erkannt.\n'
        + 'Erwartet werden WorkAssist- oder TimeAssist-Sicherungen.', 'warn');
    return;
  }
  try {
    migErgebnis = migrationRechnen(brauchbar);
  } catch (f) {
    migErgebnis = null;
    migZeichne();
    melde('Die Vorschau ist gescheitert.\n' + (f ? (f.message + '\n' + (f.stack || '')) : ''), 'warn');
    return;
  }
  migZeichne();
  var b = migErgebnis.bericht;
  melde('Vorschau aus ' + brauchbar.length + ' Datei(en) berechnet.\n'
      + b.aufgaben + ' Aufgaben · ' + b.themen + ' Themen · ' + b.projekte + ' Projekte · '
      + b.ziele + ' Ziele · ' + b.jahrestermine + ' Jahrestermine\n'
      + 'Es wurde noch nichts übernommen.', 'gut');
}

function migUebernehmen() {
  if (!migErgebnis) { melde('Bitte zuerst die Vorschau berechnen.', 'warn'); return; }
  var neu = migErgebnis.ziel;
  var zusammen = zusammenfuehren(DB, neu);
  DB = zusammen.db;
  bestandStempeln(DB);
  speichern().then(function () {
    melde('Übernommen und lokal gesichert.\n' + berichtText(zusammen.bericht)
        + '\nDer Altbestand bleibt unverändert.', 'gut');
    migErgebnis = null;
    migZeichne();
    zeichne();
  }).catch(function (f) {
    melde('Übernahme fehlgeschlagen.\n' + (f ? f.message : ''), 'warn');
  });
}

function migZeichne() {
  var qziel = document.getElementById('migQuellen');
  if (qziel) {
    var h = '';
    var i;
    if (!migQuellen.length) {
      h = '<div class="platzhalter">Noch keine Datei gewählt.</div>';
    }
    for (i = 0; i < migQuellen.length; i++) {
      var s = migQuellen[i];
      var brauchbarS = (s.art !== 'unlesbar' && s.art !== 'unbekannt');
      h += zeile(s.name, s.art + (s.kontext ? ' · ' + s.kontext : ''),
                 brauchbarS ? 'ja' : 'nein');
      h += zeile('&nbsp;&nbsp;enthält', quelleInhalt(s), 'grau');
    }
    qziel.innerHTML = h;
  }

  var bziel = document.getElementById('migBericht');
  if (bziel) {
    if (!migErgebnis) {
      bziel.innerHTML = '<div class="platzhalter">Noch keine Vorschau berechnet.</div>';
    } else {
      var b = migErgebnis.bericht;
      var t = '';
      t += zeile('Themen', String(b.themen), b.themen ? '' : 'grau');
      t += zeile('Projekte', String(b.projekte), b.projekte ? '' : 'grau');
      t += zeile('Ziele', String(b.ziele), b.ziele ? '' : 'grau');
      t += zeile('Aufgaben', String(b.aufgaben), b.aufgaben ? '' : 'grau');
      t += zeile('Ablauf-Vorlagen', String(b.ablaeufe), b.ablaeufe ? '' : 'grau');
      t += zeile('Einmalige Abläufe', String(b.durchlaeufe), b.durchlaeufe ? '' : 'grau');
      t += zeile('Jahrestermine', String(b.jahrestermine), b.jahrestermine ? '' : 'grau');
      t += zeile('Zusammengezogen', String(b.zusammengezogen), b.zusammengezogen ? '' : 'grau');
      t += zeile('Verworfen', String(b.verworfen), b.verworfen ? 'nein' : 'grau');
      t += zeile('Regeln abgeschaltet', String(b.regelnAus), b.regelnAus ? 'nein' : 'grau');
      var k;
      for (k in b.verworfeneArten) {
        if (Object.prototype.hasOwnProperty.call(b.verworfeneArten, k)) {
          t += zeile('davon Art „' + k + '"', String(b.verworfeneArten[k]), 'grau');
        }
      }
      var j;
      for (j = 0; j < b.hinweise.length; j++) {
        t += '<div class="melder">' + b.hinweise[j] + '</div>';
      }
      bziel.innerHTML = t;
    }
  }

  var ku = document.getElementById('knopfMigUebernehmen');
  if (ku) { ku.disabled = !migErgebnis; }
}


/* ============================================================
   Tagesplan
   ============================================================ */

var tagOffen = '';
var erledigtOffen = false;
var wartende = {};
var WARTEZEIT = 4000;
var speicherUhr = null;

var WOCHENTAGE_LANG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MONATE_LANG = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
                   'September','Oktober','November','Dezember'];

/* ------------------------------------------------------------
   Datum
   ------------------------------------------------------------ */

function ausIso(is) {
  var p = String(is).split('-');
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}

function tagePlus(is, n) {
  var d = ausIso(is);
  d.setDate(d.getDate() + n);
  return isoDatum(d);
}

/* Nie date(jahr, monat+1, 1) rechnen — der Monatsletzte kommt hierher. */
function monatsende(jahr, monat) {
  return new Date(jahr, monat, 0).getDate();
}

function kalenderwoche(is) {
  var d = ausIso(is);
  var ziel = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  ziel.setDate(ziel.getDate() + 3 - ((ziel.getDay() + 6) % 7));
  var ersterDonnerstag = new Date(ziel.getFullYear(), 0, 4);
  ersterDonnerstag.setDate(ersterDonnerstag.getDate() + 3 - ((ersterDonnerstag.getDay() + 6) % 7));
  return 1 + Math.round((ziel - ersterDonnerstag) / (7 * 86400000));
}

function ostern(j) {
  var a = j % 19, b = Math.floor(j / 100), c = j % 100;
  var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  var g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  var m = Math.floor((a + 11 * h + 22 * l) / 451);
  var monat = Math.floor((h + l - 7 * m + 114) / 31);
  var tag = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(j, monat - 1, tag);
}

function feiertageVon(jahr) {
  var o = ostern(jahr);
  function verschoben(n) {
    var d = new Date(o.getFullYear(), o.getMonth(), o.getDate() + n);
    return isoDatum(d);
  }
  var liste = {};
  liste[jahr + '-01-01'] = 'Neujahr';
  liste[jahr + '-01-06'] = 'Heilige Drei Könige';
  liste[verschoben(-2)] = 'Karfreitag';
  liste[verschoben(1)]  = 'Ostermontag';
  liste[jahr + '-05-01'] = 'Tag der Arbeit';
  liste[verschoben(39)] = 'Christi Himmelfahrt';
  liste[verschoben(50)] = 'Pfingstmontag';
  liste[verschoben(60)] = 'Fronleichnam';
  liste[jahr + '-08-15'] = 'Mariä Himmelfahrt';
  liste[jahr + '-10-03'] = 'Tag der Deutschen Einheit';
  liste[jahr + '-11-01'] = 'Allerheiligen';
  liste[jahr + '-12-25'] = '1. Weihnachtstag';
  liste[jahr + '-12-26'] = '2. Weihnachtstag';
  return liste;
}

var feiertagJahr = 0;
var feiertagListe = {};

function feiertagAn(is) {
  var jahr = Number(String(is).slice(0, 4));
  if (jahr !== feiertagJahr) {
    feiertagJahr = jahr;
    feiertagListe = feiertageVon(jahr);
  }
  return feiertagListe[is] || '';
}

function urlaubAn(is) {
  var jt = DB.jahrestermine || [];
  var i;
  for (i = 0; i < jt.length; i++) {
    if (jt[i].art !== 'urlaub') { continue; }
    if (is >= jt[i].von && is <= (jt[i].bis || jt[i].von)) { return jt[i].titel || 'Urlaub'; }
  }
  return '';
}

function tagesform(is) {
  var wt = ausIso(is).getDay();
  var fei = feiertagAn(is);
  var url = urlaubAn(is);
  if (wt === 0 || wt === 6) { return { form: 'Freizeittag', grund: 'Wochenende' }; }
  if (fei) { return { form: 'Freizeittag', grund: fei }; }
  if (url) { return { form: 'Freizeittag', grund: url }; }
  return { form: 'Arbeitstag', grund: '' };
}

/* ------------------------------------------------------------
   Wiederholungsregel: trifft sie an diesem Tag zu?
   ------------------------------------------------------------ */

function wochenIndex(is) {
  var d = ausIso(is);
  var tage = Math.floor(d.getTime() / 86400000);
  return Math.floor((tage + 3) / 7);   /* Woche beginnt am Montag */
}

function monatsIndex(is) {
  return Number(String(is).slice(0, 4)) * 12 + Number(String(is).slice(5, 7)) - 1;
}

function faelligAn(regel, is) {
  if (!regel) { return false; }
  var intervall = Number(regel.intervall) || 1;

  if (regel.takt === 'woche') {
    var tage = Array.isArray(regel.tage) ? regel.tage : [];
    if (!tage.length) { return false; }
    var wt = ausIso(is).getDay();
    if (tage.indexOf(wt) < 0) { return false; }
    if (intervall <= 1) { return true; }
    return (wochenIndex(is) % intervall) === 0;
  }

  if (regel.takt === 'monat') {
    var jahr = Number(String(is).slice(0, 4));
    var monat = Number(String(is).slice(5, 7));
    var tag = Number(String(is).slice(8, 10));
    var wunsch = Number(regel.tag) || 1;
    var letzter = monatsende(jahr, monat);
    if (wunsch > letzter) { wunsch = letzter; }
    if (tag !== wunsch) { return false; }
    if (intervall <= 1) { return true; }
    return (monatsIndex(is) % intervall) === 0;
  }
  return false;
}

/* ------------------------------------------------------------
   Auswahl der Einträge eines Tages
   ------------------------------------------------------------ */

function istErledigtAn(a, is) {
  if (a.wiederholung) { return a.zuletztErledigt === is; }
  return a.status === 'erledigt' && (!a.erledigtAm || a.erledigtAm === is);
}

function tagesEintraege(is) {
  var aufgaben = DB.aufgaben || [];
  var verlauf = [], wieder = [], haupt = [], klein = [], fertig = [];
  var i;

  for (i = 0; i < aufgaben.length; i++) {
    var a = aufgaben[i];
    var erledigt = istErledigtAn(a, is);

    if (a.wiederholung) {
      if (!faelligAn(a.wiederholung, is)) { continue; }
      if (erledigt) { fertig.push({ art: 'aufgabe', a: a }); }
      else { wieder.push(a); }
      continue;
    }

    if (a.status === 'erledigt') {
      if (a.erledigtAm === is) { fertig.push({ art: 'aufgabe', a: a }); }
      continue;
    }
    if (a.planung !== is) { continue; }

    if (a.uhrzeit) { verlauf.push({ art: 'aufgabe', zeit: a.uhrzeit, a: a }); }
    else if (a.art === 'klein') { klein.push(a); }
    else { haupt.push(a); }
  }

  var termine = DB.termine || [];
  for (i = 0; i < termine.length; i++) {
    if (termine[i].datum !== is) { continue; }
    verlauf.push({ art: 'termin', zeit: termine[i].von || '00:00', t: termine[i] });
  }

  verlauf.sort(function (x, y) { return (x.zeit < y.zeit) ? -1 : ((x.zeit > y.zeit) ? 1 : 0); });
  return { verlauf: verlauf, wieder: wieder, haupt: haupt, klein: klein, fertig: fertig };
}

/* ------------------------------------------------------------
   Zeichnen
   ------------------------------------------------------------ */

function tagKopfZeichnen(is) {
  var d = ausIso(is);
  var f = tagesform(is);
  var z = document.getElementById('tkZahl');
  var w = document.getElementById('tkWochentag');
  var m = document.getElementById('tkMonat');
  var fo = document.getElementById('tkForm');
  if (z) { z.textContent = d.getDate(); }
  if (w) { w.textContent = WOCHENTAGE_LANG[d.getDay()]; }
  if (m) { m.textContent = MONATE_LANG[d.getMonth()] + ' ' + d.getFullYear()
                          + ' · KW ' + kalenderwoche(is); }
  if (fo) {
    fo.textContent = f.form;
    fo.className = 'tk-form' + (f.form === 'Freizeittag' ? ' frei' : '');
    fo.title = f.grund || '';
  }
}

function esc(text) {
  return String(text === null || text === undefined ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function metaZeile(a, is) {
  var teile = [];
  if (a.frist) {
    var eilig = a.frist <= is;
    teile.push('<span class="' + (eilig ? 'eilig' : '') + '">Frist '
               + esc(kurzDatum(a.frist)) + '</span>');
  }
  var pj = projektName(a.projektId);
  if (pj) { teile.push(esc(pj)); }
  var th = themaName(a.themaId);
  if (th) { teile.push(esc(th)); }
  return teile.join(' · ');
}

function kurzDatum(is) {
  if (!is) { return ''; }
  var d = ausIso(is);
  return ['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.';
}

function projektName(id) {
  if (!id) { return ''; }
  var p = DB.projekte || [];
  var i;
  for (i = 0; i < p.length; i++) { if (p[i].id === id) { return p[i].name; } }
  return '';
}

function themaName(id) {
  if (!id) { return ''; }
  var t = DB.themen || [];
  var i;
  for (i = 0; i < t.length; i++) { if (t[i].id === id) { return t[i].name; } }
  return '';
}

function zeileHtml(a, is, kompakt) {
  var erledigt = istErledigtAn(a, is);
  var meta = metaZeile(a, is);
  var wdh = a.wiederholung ? ('zuletzt ' + (a.zuletztErledigt ? kurzDatum(a.zuletztErledigt) : 'nie')) : '';
  if (wdh) { meta = meta ? (meta + ' · ' + wdh) : wdh; }
  var h = '<div class="tzeile' + (kompakt ? ' kompakt' : '')
        + (a.kontext === 'privat' ? ' privat' : '')
        + (erledigt ? ' erledigt' : '') + '">';
  h += '<button class="tkasten' + (erledigt ? ' an' : '') + '" type="button" '
     + 'onclick="aufgabeHaken(\'' + esc(a.id) + '\')"></button>';
  h += '<div class="ttext"><div class="ttitel">' + esc(a.titel) + '</div>';
  if (meta) { h += '<div class="tmeta">' + meta + '</div>'; }
  h += '</div></div>';
  return h;
}

function verlaufHtml(eintrag, is) {
  if (eintrag.art === 'termin') {
    var t = eintrag.t;
    var h = '<div class="tverlauf fest">';
    h += '<div class="tv-zeit">' + esc(t.von || '') + '</div><div class="tv-schiene"></div>';
    h += '<div class="tv-inhalt"><div class="ttitel">' + esc(t.titel) + '</div>';
    var unten = [];
    if (t.bis) { unten.push(esc(t.von) + '–' + esc(t.bis)); }
    if (t.ort) { unten.push(esc(t.ort)); }
    if (unten.length) { h += '<div class="tmeta">' + unten.join(' · ') + '</div>'; }
    h += '</div></div>';
    return h;
  }
  var a = eintrag.a;
  var erledigt = istErledigtAn(a, is);
  var v = '<div class="tverlauf aufgabe' + (a.kontext === 'privat' ? ' privat' : '')
        + (erledigt ? ' erledigt' : '') + '">';
  v += '<div class="tv-zeit">' + esc(a.uhrzeit) + '</div><div class="tv-schiene"></div>';
  v += '<div class="tv-inhalt"><div class="tv-reihe">';
  v += '<button class="tkasten' + (erledigt ? ' an' : '') + '" type="button" '
     + 'onclick="aufgabeHaken(\'' + esc(a.id) + '\')"></button>';
  v += '<div class="ttitel">' + esc(a.titel) + '</div></div></div></div>';
  return v;
}

function tagZeichnen() {
  if (!tagOffen) { tagOffen = isoDatum(); }
  var is = tagOffen;
  tagKopfZeichnen(is);

  var blatt = document.getElementById('tagBlatt');
  if (!blatt) { return; }
  var e = tagesEintraege(is);
  var h = '';
  var i;

  h += '<div class="tabschnitt" data-kurz="Tagesverlauf"><div class="tabschnitt-titel">'
     + '<span>Tagesverlauf</span></div>';
  if (!e.verlauf.length) { h += '<div class="tleer">Nichts mit fester Zeit.</div>'; }
  for (i = 0; i < e.verlauf.length; i++) { h += verlaufHtml(e.verlauf[i], is); }
  h += '</div>';

  h += '<div class="tabschnitt" data-kurz="Wiederkehrend"><div class="tabschnitt-titel">'
     + '<span>Wiederkehrend</span></div>';
  if (!e.wieder.length) { h += '<div class="tleer">Heute nichts fällig.</div>'; }
  for (i = 0; i < e.wieder.length; i++) { h += zeileHtml(e.wieder[i], is, false); }
  h += '</div>';

  h += '<div class="tabschnitt" data-kurz="Aufgaben"><div class="tabschnitt-titel">'
     + '<span>Aufgaben</span></div>';
  if (!e.haupt.length) { h += '<div class="tleer">Für heute nichts eingeplant.</div>'; }
  for (i = 0; i < e.haupt.length; i++) { h += zeileHtml(e.haupt[i], is, false); }
  h += '</div>';

  h += '<div class="tabschnitt" data-kurz="Kleinigkeiten"><div class="tabschnitt-titel">'
     + '<span>Kleinigkeiten &amp; Kontakte</span></div>';
  if (!e.klein.length) { h += '<div class="tleer">Nichts offen.</div>'; }
  for (i = 0; i < e.klein.length; i++) { h += zeileHtml(e.klein[i], is, true); }
  h += '</div>';

  if (e.fertig.length) {
    h += '<div class="tabschnitt" data-kurz="Erledigt">';
    h += '<button class="tfalt" type="button" onclick="erledigtUm()">'
       + '<span>Erledigt · ' + e.fertig.length + '</span>'
       + '<svg class="' + (erledigtOffen ? 'auf' : '') + '" viewBox="0 0 24 24">'
       + '<path d="M6 9l6 6 6-6"></path></svg></button>';
    if (erledigtOffen) {
      for (i = 0; i < e.fertig.length; i++) { h += zeileHtml(e.fertig[i].a, is, true); }
    }
    h += '</div>';
  }

  blatt.innerHTML = h;
  streifenPruefen();
}

function erledigtUm() {
  erledigtOffen = !erledigtOffen;
  tagZeichnen();
}

/* ------------------------------------------------------------
   Lotsenstreifen
   ------------------------------------------------------------ */

function offeneImAbschnitt(abschnitt) {
  var zeilen = abschnitt.querySelectorAll('.tzeile, .tverlauf.aufgabe');
  var n = 0;
  var i;
  for (i = 0; i < zeilen.length; i++) {
    if (!zeilen[i].classList.contains('erledigt')) { n++; }
  }
  return n;
}

function angeschnittene() {
  var treffer = [];
  var blatt = document.getElementById('tagBlatt');
  if (!blatt) { return treffer; }
  var unten = blatt.getBoundingClientRect().bottom;
  var abschnitte = blatt.querySelectorAll('.tabschnitt');
  var i;
  for (i = 0; i < abschnitte.length; i++) {
    if (abschnitte[i].getBoundingClientRect().top > unten - 40) { treffer.push(abschnitte[i]); }
  }
  return treffer;
}

function streifenPruefen() {
  var streifen = document.getElementById('streifen');
  var text = document.getElementById('streifenText');
  if (!streifen || !text) { return; }
  var treffer = angeschnittene();
  var summe = 0;
  var namen = [];
  var i;
  for (i = 0; i < treffer.length; i++) {
    var n = offeneImAbschnitt(treffer[i]);
    if (n > 0) {
      summe += n;
      namen.push(treffer[i].dataset.kurz || 'Weiter unten');
    }
  }
  if (summe < 1) { streifen.classList.remove('sichtbar'); return; }
  text.textContent = namen.join(', ') + ' · ' + summe + ' offen';
  streifen.classList.add('sichtbar');
}

function zumOffenen() {
  var treffer = angeschnittene();
  if (treffer.length < 1) { return; }
  treffer[0].scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ------------------------------------------------------------
   Ändern
   ------------------------------------------------------------ */

function aufgabeFinden(id) {
  var a = DB.aufgaben || [];
  var i;
  for (i = 0; i < a.length; i++) { if (a[i].id === id) { return a[i]; } }
  return null;
}

function spaeterSichern() {
  if (speicherUhr) { window.clearTimeout(speicherUhr); }
  speicherUhr = window.setTimeout(function () {
    speicherUhr = null;
    speichern().then(function () {
      zeichne();
      abgleichPlanen(false);
    }).catch(function () { return null; });
  }, 1500);
}

function aufgabeHaken(id) {
  var a = aufgabeFinden(id);
  if (!a) { return; }
  var is = tagOffen;

  if (a.wiederholung) {
    a.zuletztErledigt = (a.zuletztErledigt === is) ? null : is;
  } else if (a.status === 'erledigt') {
    a.status = 'offen';
    a.erledigtAm = null;
  } else {
    a.status = 'erledigt';
    a.erledigtAm = is;
  }
  a.geaendert = jetzt();

  /* Vier Sekunden Bedenkzeit: der Eintrag bleibt stehen und wandert
     erst danach in den Erledigt-Block. */
  if (wartende[id]) { window.clearTimeout(wartende[id]); }
  wartende[id] = window.setTimeout(function () {
    delete wartende[id];
    tagZeichnen();
  }, WARTEZEIT);

  zeileZustandSetzen(id, istErledigtAn(a, is));
  streifenPruefen();
  spaeterSichern();
}

function zeileZustandSetzen(id, erledigt) {
  var blatt = document.getElementById('tagBlatt');
  if (!blatt) { return; }
  var knoepfe = blatt.querySelectorAll('.tkasten');
  var i;
  for (i = 0; i < knoepfe.length; i++) {
    var auf = knoepfe[i].getAttribute('onclick') || '';
    if (auf.indexOf("'" + id + "'") < 0) { continue; }
