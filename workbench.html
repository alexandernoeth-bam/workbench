<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F5F2">
<title>Workbench 0.2.0</title>
<link rel="manifest" href="workbench.webmanifest?v=0.2.0">
<link rel="icon" type="image/png" sizes="192x192" href="workbench-192.png?v=0.2.0">
<link rel="apple-touch-icon" href="workbench-192.png?v=0.2.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{
  --lcd:#F6F5F2;--weiss:#FFFFFF;--px:#2E2C29;--mitte:#645F58;--zart:#B9B4AB;
  --rot:#8A0B22;--rahmen:#D4D0C8;--karo:#E7E3DB;--gelb:#F4EDB4;--teal:#19525A;
  --grund:#E4E1DA;--gruen:#2F6B3C;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--grund);font-family:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
     font-size:16px;line-height:1.45;color:var(--px);overflow:hidden}
button{font:inherit;color:inherit}

/* ---------- Rahmen ---------- */
.rahmen{height:100%;display:flex;flex-direction:column;background:var(--lcd)}
.titel{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--weiss);
       border-bottom:1px solid var(--rahmen);font-size:15px;flex:0 0 auto}
.titel .marke{font-weight:600;font-size:16px;white-space:nowrap}
.titel .marke small{font-weight:400;font-size:15px;color:var(--zart)}
.titel .hin{color:var(--zart);font-size:14px}
.titel .r{margin-left:auto;color:var(--mitte);font-size:14.5px;white-space:nowrap}
.welt{display:flex;border:1px solid var(--px);border-radius:12px;overflow:hidden;font-size:14.5px;flex:0 0 auto}
.welt button{background:none;border:0;padding:1px 11px}
.welt button.an{background:var(--rot);color:#fff}

.koerper{flex:1;display:flex;min-height:0}
.arbeit{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--rahmen)}
.flaeche{flex:1;margin:12px 12px 0;background:var(--weiss);border:1px solid var(--rahmen);overflow:auto}
.mini{display:flex;gap:7px;padding:9px 12px;align-items:center;flex:0 0 auto;color:var(--mitte);font-size:14px;min-height:40px}

.leiste{width:330px;flex:0 0 330px;display:flex;flex-direction:column;background:var(--lcd);min-height:0}
.lkopf{display:flex;border-bottom:2px solid var(--rot);background:var(--weiss);flex:0 0 auto}
.lkopf button{flex:1;background:none;border:0;padding:7px 0;color:var(--mitte);
              border-bottom:2px solid transparent;margin-bottom:-2px;font-size:15px}
.lkopf button.an{color:var(--px);font-weight:600;border-bottom-color:var(--rot)}
.lkopf button em{display:block;font-style:normal;font-size:12px;color:var(--rot);font-weight:400}
.lkopf button.misch em{color:var(--zart)}
.linhalt{flex:1;overflow:auto;min-height:0}
.lfuss{display:flex;gap:7px;padding:8px 10px;border-top:1px solid var(--rahmen);background:var(--weiss);flex:0 0 auto;flex-wrap:wrap}

/* ---------- Bausteine ---------- */
.kn{background:none;border:1px solid var(--px);border-radius:12px;padding:2px 12px;font-size:15px}
.kn.voll{background:var(--px);color:#fff}
.kn.rot{background:var(--rot);color:#fff;border-color:var(--rot)}
.kn:disabled{opacity:.4}
.bal{background:var(--px);color:var(--lcd);padding:3px 10px;font-size:14px;display:flex;justify-content:space-between}
.leise{color:var(--mitte);padding:12px 14px;font-size:15px}

/* Wissensbaum: der Name öffnet, das Zeichen rechts pflegt */
.baum .bz{display:flex;align-items:center;border-bottom:1px solid #F0EDE8;padding-right:4px}
.baum .nmk{flex:1;min-width:0;display:flex;gap:8px;align-items:center;text-align:left;
           background:none;border:0;padding:5px 4px 5px 10px;font-size:15px}
.baum .e1{font-weight:600;background:var(--weiss)}
.baum .e2 .nmk{padding-left:26px}
.baum .gew{background:var(--px);color:var(--lcd)}
.baum .gew .zahl{color:var(--zart)}
.baum .arch{opacity:.52}
.baum .arch .nmk{font-style:italic}
.baum .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.baum .zahl{color:var(--mitte);font-size:14px;flex:0 0 auto;padding:0 2px}
.baum .stift{background:none;border:0;padding:4px 6px;color:var(--mitte);font-size:15px;flex:0 0 auto}
.baum .gew .stift{color:var(--zart)}
.baum .pkt{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.baum .pkt.aktiv{background:var(--rot)}
.baum .pkt.ruht{border:1.5px solid var(--zart)}

/* Fachansicht */
.fachkopf{padding:10px 16px;border-bottom:2px solid var(--px);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fachkopf b{font-size:19px;font-weight:600}
.fachkopf span{color:var(--mitte);font-size:14.5px}
.ziel{padding:12px 16px;background:#FBFAF7;border-bottom:1px solid var(--rahmen);font-size:15px}
.ziel u{display:block;font-weight:600;text-decoration:none;margin-bottom:4px;font-size:14px;
        text-transform:uppercase;letter-spacing:.05em;color:var(--mitte)}
.ziel p{margin:0 0 6px}
.ziel p b{font-weight:600}
.start{padding:26px 30px;max-width:620px}
.start h2{font-size:19px;font-weight:600;margin:0 0 8px}
.start p{color:var(--mitte);margin:0 0 14px}
.start ol{color:var(--mitte);margin:0 0 14px;padding-left:20px}
.start li{margin-bottom:6px}

/* Bestände */
.best{border-bottom:1px solid #EAE7E2;padding:7px 10px;font-size:15px;display:flex;gap:8px;align-items:flex-start}
.best .nm{flex:1;min-width:0}
.best small{display:block;color:var(--mitte);font-size:14px}
.best .ampel{width:10px;height:10px;border-radius:50%;flex:0 0 auto;margin-top:6px;background:var(--zart)}
.best .ampel.da{background:var(--gruen)}
.best .ampel.weg{background:var(--rot)}

/* Aufklapp und Dialoge */
.aufklapp{position:fixed;inset:0;background:rgba(32,30,28,.35);display:flex;align-items:center;justify-content:center;z-index:40}
.aufklapp.zu{display:none}
.dlg{width:min(680px,92vw);max-height:88vh;overflow:auto;background:var(--lcd);border:1px solid var(--px);box-shadow:0 8px 26px rgba(0,0,0,.32)}
.dlgkopf{background:var(--rot);color:#fff;padding:8px 14px;font-weight:600;font-size:17px}
.dlgleib{padding:14px}
.feld{margin-bottom:12px}
.feld label{display:block;font-size:14px;color:var(--mitte);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.feld input,.feld textarea,.feld select{width:100%;font:inherit;font-size:16px;background:var(--weiss);
        border:1px solid var(--px);padding:6px 9px;border-radius:0}
.feld textarea{min-height:62px;resize:vertical}
.feld .zwei{display:flex;gap:10px}
.dlgfuss{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--rahmen);background:var(--weiss);flex-wrap:wrap}
.dlgfuss .r{margin-left:auto;display:flex;gap:8px}

/* Meldung */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(560px,92vw);
       background:var(--px);color:var(--lcd);padding:9px 14px;font-size:15px;white-space:pre-line;
       box-shadow:0 3px 12px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .18s;z-index:60}
.toast.an{opacity:1}
.toast.warn{background:var(--rot)}

@media (max-width:900px){
  .leiste{width:290px;flex-basis:290px}
}
</style>
</head>
<body>

<div class="rahmen">
  <div class="titel">
    <span class="marke">Workbench <small id="fassung">0.2.0</small></span>
    <span class="welt" id="weltSchalter"></span>
    <span class="hin">— gilt für Block und Wissen</span>
    <span class="r" id="stand">…</span>
  </div>
  <div class="koerper">
    <div class="arbeit">
      <div class="flaeche" id="flaeche"></div>
      <div class="mini" id="mini"></div>
    </div>
    <div class="leiste">
      <div class="lkopf" id="lkopf"></div>
      <div class="linhalt" id="linhalt"></div>
      <div class="lfuss" id="lfuss"></div>
    </div>
  </div>
</div>

<div class="aufklapp zu" id="aufklapp"></div>
<div class="toast" id="toast"></div>

<script>
var WB_FASSUNG = '0.2.0';

/* ===== wb_daten.js ===== */
/* ============================================================
   wb_daten.js — die drei Bestände und ihre Wege
   ------------------------------------------------------------
   DH-01  Es gibt drei getrennte Bestände: privates Wissen,
          berufliches Wissen, Aufgaben.
   DH-02  Das berufliche Wissen wird ausschließlich im
          Firmenspeicher gelesen und geschrieben.
   DH-05  Privates Wissen und Aufgaben gehen über Google Drive.
   DH-06  Skizzen und PDFs liegen als Dateien im Ordner ihrer
          Welt, nicht in der Datendatei.

   Der Weg eines Bestandes steht in WB_BESTAENDE und nirgends
   sonst. Jeder Schreibvorgang geht durch wbSichern(), und das
   fragt diese eine Tabelle. Ein zweiter Weg zum Schreiben
   würde DH-02 aushebeln, deshalb gibt es keinen.
   ============================================================ */

var WB_BESTAENDE = [
  { id: 'aufgaben',  name: 'Aufgaben',           weg: 'drive', datei: 'workbench.json',                  welt: '' },
  { id: 'privat',    name: 'Privates Wissen',    weg: 'drive', datei: 'workbench-wissen.json',           welt: 'privat' },
  { id: 'beruflich', name: 'Berufliches Wissen', weg: 'datei', datei: 'workbench-wissen-beruflich.json', welt: 'beruflich' }
];

var WB_IDB_NAME  = 'workbench-neu';
var WB_IDB_STORE = 'handles';
var WB_CLIENT_ID = '347268246401-9ktgd8q5caq6v5nma36i3e38u9c37bre.apps.googleusercontent.com';
var WB_SCOPES    = 'https://www.googleapis.com/auth/drive.file';
var WB_GIS_URL   = 'https://accounts.google.com/gsi/client';
var WB_TOKEN_KEY = 'workbench-neu-zugriff';

/* Was im Speicher liegt. Je Bestand: der Inhalt, woher er kam,
   ob er seit dem Laden verändert wurde, und der letzte Fehler. */
var wbDaten  = { aufgaben: null, privat: null, beruflich: null };
var wbStand  = {
  aufgaben:  { geladen: false, schmutzig: false, fehler: '', quelle: '', zeit: '' },
  privat:    { geladen: false, schmutzig: false, fehler: '', quelle: '', zeit: '' },
  beruflich: { geladen: false, schmutzig: false, fehler: '', quelle: '', zeit: '' }
};
var wbHandles  = { beruflich: null };   /* Ordner- oder Dateihandle je Welt */
var wbDriveId  = {};                    /* Dateiname -> Drive-Id */
var wbToken    = '';
var wbTokenBis = 0;
var wbKlient   = null;

/* ---------- kleine Helfer ---------- */

function wbBestand(id) {
  var i;
  for (i = 0; i < WB_BESTAENDE.length; i += 1) {
    if (WB_BESTAENDE[i].id === id) { return WB_BESTAENDE[i]; }
  }
  return null;
}

/* Der Wächter zu DH-02: nur diese Funktion entscheidet, was zu Drive darf. */
function wbDarfZuDrive(id) {
  var b = wbBestand(id);
  return !!b && b.weg === 'drive';
}

function wbIsoZeit() {
  return new Date().toISOString();
}

function wbId(vorsatz) {
  return String(vorsatz || 'x') + '-' + Date.now().toString(36)
    + '-' + Math.random().toString(36).slice(2, 8);
}

function wbEsc(t) {
  return String(t === null || t === undefined ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

var wbToastUhr = 0;
function melde(text, art) {
  var el = (typeof document !== 'undefined') ? document.getElementById('toast') : null;
  if (!el) { return; }
  el.textContent = String(text || '');
  el.className = 'toast an' + (art === 'warn' ? ' warn' : '');
  if (wbToastUhr) { window.clearTimeout(wbToastUhr); }
  wbToastUhr = window.setTimeout(function () {
    var e2 = document.getElementById('toast');
    if (e2) { e2.className = 'toast' + (art === 'warn' ? ' warn' : ''); }
    wbToastUhr = 0;
  }, (art === 'warn') ? 7000 : 4000);
}

function wbFsApiDa()  { return (typeof window !== 'undefined' && typeof window.showOpenFilePicker === 'function'); }
function wbOrdnerApiDa() { return (typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function'); }
function wbIdbDa()    { return (typeof window !== 'undefined' && !!window.indexedDB); }

/* ---------- IndexedDB: bewahrt den Handle über Sitzungen ---------- */

function wbIdbOeffnen() {
  return new Promise(function (fertig, fehler) {
    if (!wbIdbDa()) { fehler(new Error('IndexedDB nicht verfügbar')); return; }
    var a = window.indexedDB.open(WB_IDB_NAME, 1);
    a.onupgradeneeded = function () {
      var db = a.result;
      if (!db.objectStoreNames.contains(WB_IDB_STORE)) { db.createObjectStore(WB_IDB_STORE); }
    };
    a.onsuccess = function () { fertig(a.result); };
    a.onerror   = function () { fehler(a.error); };
  });
}

function wbIdbSchreiben(schluessel, wert) {
  return wbIdbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(WB_IDB_STORE, 'readwrite');
      t.objectStore(WB_IDB_STORE).put(wert, schluessel);
      t.oncomplete = function () { db.close(); fertig(true); };
      t.onerror    = function () { db.close(); fehler(t.error); };
    });
  });
}

function wbIdbLesen(schluessel) {
  return wbIdbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(WB_IDB_STORE, 'readonly');
      var a = t.objectStore(WB_IDB_STORE).get(schluessel);
      a.onsuccess = function () { db.close(); fertig(a.result || null); };
      a.onerror   = function () { db.close(); fehler(a.error); };
    });
  });
}

/* ---------- Rechte am Handle: nur auf ausdrückliche Geste fragen ---------- */

function wbRechtePruefen(handle) {
  if (!handle || typeof handle.queryPermission !== 'function') { return Promise.resolve('unbekannt'); }
  return handle.queryPermission({ mode: 'readwrite' }).catch(function () { return 'unbekannt'; });
}

function wbRechteAnfragen(handle) {
  if (!handle || typeof handle.requestPermission !== 'function') { return Promise.resolve('unbekannt'); }
  return handle.requestPermission({ mode: 'readwrite' }).catch(function () { return 'denied'; });
}

/* ---------- Dateien über die Dateischnittstelle ---------- */

function wbDateiSchreiben(handle, text) {
  return handle.createWritable().then(function (strom) {
    return strom.write(text).then(function () { return strom.close(); });
  });
}

function wbDateiLesen(handle) {
  return handle.getFile().then(function (f) { return f.text(); });
}

/* Aus einem Ordnerhandle die Datendatei holen; ohne Ordner ist der
   Handle selbst schon die Datei (Rückfallweg, wenn der Firmenlaptop
   keinen Ordner wählen lässt). */
function wbDateiAusHandle(handle, name, anlegen) {
  if (!handle) { return Promise.reject(new Error('Kein Speicherort gewählt.')); }
  if (handle.kind === 'file') { return Promise.resolve(handle); }
  return handle.getFileHandle(name, { create: !!anlegen });
}

/* DH-06: neben der Datendatei liegt ein Ordner für Skizzen und PDFs.
   Er entsteht erst, wenn er gebraucht wird, und nie in der Datendatei. */
function wbDateiOrdner(welt, anlegen) {
  var h = wbHandles[welt];
  if (!h || h.kind !== 'directory') { return Promise.resolve(null); }
  return h.getDirectoryHandle('dateien', { create: !!anlegen }).catch(function () { return null; });
}

function wbOrtWaehlen(welt) {
  var versprechen;
  if (wbOrdnerApiDa()) {
    versprechen = window.showDirectoryPicker({ mode: 'readwrite', id: 'wb-' + welt });
  } else if (wbFsApiDa()) {
    versprechen = window.showOpenFilePicker({
      multiple: false,
      types: [{ description: 'Workbench-Daten', accept: { 'application/json': ['.json'] } }]
    }).then(function (liste) { return liste[0]; });
  } else {
    return Promise.reject(new Error('Dieser Browser kann keine Ordner oder Dateien öffnen.'));
  }
  return versprechen.then(function (handle) {
    wbHandles[welt] = handle;
    return wbIdbSchreiben('ort-' + welt, handle).then(function () { return handle; });
  });
}

function wbOrtLaden(welt) {
  return wbIdbLesen('ort-' + welt).then(function (handle) {
    if (!handle) { return null; }
    wbHandles[welt] = handle;
    return wbRechtePruefen(handle).then(function (stand) {
      return (stand === 'granted') ? handle : null;
    });
  }).catch(function () { return null; });
}

/* ---------- Google Drive ---------- */

function wbGisLaden() {
  if (window.google && window.google.accounts && window.google.accounts.oauth2) {
    return Promise.resolve(true);
  }
  return new Promise(function (fertig, fehler) {
    var s = document.createElement('script');
    s.src = WB_GIS_URL;
    s.async = true;
    s.onload = function () { fertig(true); };
    s.onerror = function () { fehler(new Error('Google-Anmeldung nicht erreichbar.')); };
    document.head.appendChild(s);
  });
}

function wbTokenGueltig() {
  return !!wbToken && wbTokenBis > Date.now() + 60000;
}

function wbTokenMerken(token, sekunden) {
  wbToken = String(token || '');
  wbTokenBis = Date.now() + (Number(sekunden || 3600) * 1000);
  try {
    window.localStorage.setItem(WB_TOKEN_KEY, JSON.stringify({ t: wbToken, bis: wbTokenBis }));
  } catch (e) { /* ohne Merken geht es auch, nur kürzer */ }
}

function wbTokenHolen() {
  try {
    var r = JSON.parse(window.localStorage.getItem(WB_TOKEN_KEY) || 'null');
    if (r && r.t && Number(r.bis) > Date.now() + 60000) {
      wbToken = r.t;
      wbTokenBis = Number(r.bis);
    }
  } catch (e) { /* kaputter Eintrag: einfach neu anmelden */ }
  return wbTokenGueltig();
}

function wbTokenVergessen() {
  wbToken = '';
  wbTokenBis = 0;
  try { window.localStorage.removeItem(WB_TOKEN_KEY); } catch (e) { /* egal */ }
}

function wbAnmelden(still) {
  if (wbTokenGueltig()) { return Promise.resolve(true); }
  return wbGisLaden().then(function () {
    if (!wbKlient) {
      wbKlient = window.google.accounts.oauth2.initTokenClient({
        client_id: WB_CLIENT_ID,
        scope: WB_SCOPES,
        callback: function () { /* je Anfrage gesetzt */ }
      });
    }
    return new Promise(function (fertig) {
      var fertigEinmal = function (gut) { if (fertig) { var f = fertig; fertig = null; f(gut); } };
      wbKlient.callback = function (antwort) {
        if (antwort && antwort.access_token) {
          wbTokenMerken(antwort.access_token, antwort.expires_in);
          fertigEinmal(true);
          return;
        }
        fertigEinmal(false);
      };
      wbKlient.error_callback = function () { fertigEinmal(false); };
      try {
        wbKlient.requestAccessToken({ prompt: still ? 'none' : '' });
      } catch (e) {
        fertigEinmal(false);
      }
      window.setTimeout(function () { fertigEinmal(false); }, still ? 8000 : 120000);
    });
  }).catch(function () { return false; });
}

function wbDriveKopf(zusatz) {
  var k = { Authorization: 'Bearer ' + wbToken };
  var n;
  if (zusatz) {
    for (n in zusatz) {
      if (Object.prototype.hasOwnProperty.call(zusatz, n)) { k[n] = zusatz[n]; }
    }
  }
  return k;
}

function wbAntwortPruefen(a) {
  if (a.ok) { return a; }
  if (a.status === 401) {
    wbTokenVergessen();
    throw new Error('Der Zugriff ist abgelaufen. Bitte neu anmelden.');
  }
  return a.text().then(function (t) {
    throw new Error('Drive antwortete mit ' + a.status + ': ' + String(t).slice(0, 200));
  });
}

function wbDriveSuchen(name) {
  if (wbDriveId[name]) { return Promise.resolve(wbDriveId[name]); }
  var url = 'https://www.googleapis.com/drive/v3/files'
          + '?q=' + encodeURIComponent("name='" + name + "' and trashed=false")
          + '&fields=' + encodeURIComponent('files(id,name,modifiedTime)') + '&pageSize=10';
  return window.fetch(url, { headers: wbDriveKopf() })
    .then(wbAntwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      var liste = (d && d.files) ? d.files : [];
      if (!liste.length) { return ''; }
      wbDriveId[name] = liste[0].id;
      return liste[0].id;
    });
}

function wbDriveAnlegen(name) {
  return window.fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: wbDriveKopf({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ name: name, mimeType: 'application/json' })
  }).then(wbAntwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) { wbDriveId[name] = d.id; return d.id; });
}

function wbDriveLesen(name) {
  return wbDriveSuchen(name).then(function (id) {
    if (!id) { return null; }
    return window.fetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media',
      { headers: wbDriveKopf() })
      .then(wbAntwortPruefen)
      .then(function (a) { return a.text(); });
  });
}

function wbDriveSchreiben(name, text) {
  return wbDriveSuchen(name).then(function (id) {
    return id || wbDriveAnlegen(name);
  }).then(function (id) {
    return window.fetch('https://www.googleapis.com/upload/drive/v3/files/' + id
      + '?uploadType=media&fields=id,modifiedTime', {
      method: 'PATCH',
      headers: wbDriveKopf({ 'Content-Type': 'application/json' }),
      body: text
    });
  }).then(wbAntwortPruefen).then(function () { return true; });
}

/* ---------- Die Bestände selbst ---------- */

function wbLeeresWissen(welt) {
  return { fassung: 1, welt: welt, faecher: [], zweige: [], grabsteine: [], geaendert: wbIsoZeit() };
}

/* Ein geladener Wissensbestand wird nur ergänzt, nie ersetzt: unbekannte
   Schlüssel aus einer neueren Fassung bleiben erhalten. */
function wbWissenOrdnen(roh, welt) {
  var w = (roh && typeof roh === 'object') ? roh : {};
  w.fassung  = Number(w.fassung) || 1;
  w.welt     = welt;
  w.faecher  = Array.isArray(w.faecher) ? w.faecher : [];
  w.zweige   = Array.isArray(w.zweige) ? w.zweige : [];
  w.grabsteine = Array.isArray(w.grabsteine) ? w.grabsteine : [];
  return w;
}

function wbLaden(id) {
  var b = wbBestand(id);
  var s = wbStand[id];
  if (!b) { return Promise.reject(new Error('Unbekannter Bestand: ' + id)); }
  s.fehler = '';
  /* Ohne Weg wird nichts geladen — und nichts angelegt. Ein leerer
     Bestand, der nach „neu angelegt" aussieht, obwohl nur die
     Verbindung fehlt, ist die gefährlichste Anzeige, die es hier
     geben kann: wer darauf Fächer anlegt, schreibt ins Nichts. */
  var weglos = (b.weg === 'drive') ? !wbTokenGueltig() : !wbHandles[b.welt];
  var holen;
  if (weglos) {
    s.geladen = false;
    s.quelle = 'ohne';
    s.fehler = (b.weg === 'drive') ? 'Nicht bei Google angemeldet.' : 'Kein Speicherort gewählt.';
    wbDaten[id] = null;
    return Promise.resolve(null);
  }
  if (b.weg === 'drive') {
    holen = wbDriveLesen(b.datei);
  } else {
    holen = wbDateiAusHandle(wbHandles[b.welt], b.datei, false).then(wbDateiLesen).catch(function () { return null; });
  }
  return holen.then(function (text) {
    var roh = null;
    if (text) {
      try { roh = JSON.parse(text); } catch (e) { throw new Error(b.name + ': die Datei ist kein gültiges JSON.'); }
    }
    if (id === 'aufgaben') {
      /* Der Aufgabenbestand gehört auch CLIE. Fremde Schlüssel bleiben,
         wie sie sind — wir fassen nur an, was uns gehört. */
      wbDaten.aufgaben = (roh && typeof roh === 'object') ? roh : { aufgaben: [] };
      if (!Array.isArray(wbDaten.aufgaben.aufgaben)) { wbDaten.aufgaben.aufgaben = []; }
    } else {
      wbDaten[id] = wbWissenOrdnen(roh, b.welt) ;
      if (!roh) { wbDaten[id] = wbLeeresWissen(b.welt); }
    }
    s.geladen = true;
    s.schmutzig = false;
    s.quelle = text ? b.weg : 'neu';
    s.zeit = wbIsoZeit();
    return wbDaten[id];
  }).catch(function (f) {
    s.fehler = f && f.message ? f.message : String(f);
    s.geladen = false;
    return null;
  });
}

function wbSichern(id) {
  var b = wbBestand(id);
  var s = wbStand[id];
  if (!b) { return Promise.reject(new Error('Unbekannter Bestand: ' + id)); }
  if (!wbDaten[id]) { return Promise.resolve(false); }
  var text = JSON.stringify(wbDaten[id], null, 1);

  if (b.weg === 'drive') {
    /* Der Wächter zu DH-02. Er kann hier nie zuschlagen, solange die
       Tabelle stimmt — und genau deshalb steht er hier: wer die Tabelle
       ändert, merkt es sofort. */
    if (!wbDarfZuDrive(id)) {
      return Promise.reject(new Error(b.name + ' darf nicht zu Drive.'));
    }
    if (!wbTokenGueltig()) { return Promise.reject(new Error('Nicht bei Google angemeldet.')); }
    return wbDriveSchreiben(b.datei, text).then(function () {
      s.schmutzig = false;
      s.zeit = wbIsoZeit();
      return true;
    });
  }

  if (!wbHandles[b.welt]) { return Promise.reject(new Error(b.name + ': kein Speicherort gewählt.')); }
  return wbDateiAusHandle(wbHandles[b.welt], b.datei, true)
    .then(function (h) { return wbDateiSchreiben(h, text); })
    .then(function () {
      s.schmutzig = false;
      s.zeit = wbIsoZeit();
      return true;
    });
}

function wbSchmutzig(id) {
  if (wbStand[id]) { wbStand[id].schmutzig = true; }
  if (wbDaten[id] && id !== 'aufgaben') { wbDaten[id].geaendert = wbIsoZeit(); }
}

/* ---------- Fächer und Zweige ---------- */

function wbWissen(welt) {
  return wbDaten[welt] || null;
}

function wbNachRang(a, b) {
  return (Number(a.rang || 0) - Number(b.rang || 0))
      || String(a.name || '').localeCompare(String(b.name || ''), 'de');
}

/* Archiviertes ist nicht gelöscht, nur aus dem Weg. Ohne das zweite
   Argument sieht man es nirgends — auch nicht in den Auswahllisten. */
function wbFaecher(welt, auchArchiv) {
  var w = wbWissen(welt);
  if (!w) { return []; }
  return w.faecher.filter(function (f) { return auchArchiv || !f.archiv; }).sort(wbNachRang);
}

function wbZweige(welt, fachId, auchArchiv) {
  var w = wbWissen(welt);
  if (!w) { return []; }
  return w.zweige.filter(function (z) {
    return z.fachId === fachId && (auchArchiv || !z.archiv);
  }).sort(wbNachRang);
}

function wbFachFinden(welt, id) {
  var w = wbWissen(welt);
  var i;
  if (!w) { return null; }
  for (i = 0; i < w.faecher.length; i += 1) { if (w.faecher[i].id === id) { return w.faecher[i]; } }
  return null;
}

function wbZweigFinden(welt, id) {
  var w = wbWissen(welt);
  var i;
  if (!w) { return null; }
  for (i = 0; i < w.zweige.length; i += 1) { if (w.zweige[i].id === id) { return w.zweige[i]; } }
  return null;
}

function wbFachAnlegen(welt, name) {
  var w = wbWissen(welt);
  var f;
  if (!w || !String(name || '').trim()) { return null; }
  f = { id: wbId('fa'), name: String(name).trim(), rang: w.faecher.length,
        ziel: { richtung: '', hinein: '', nicht: '', offen: '' }, geaendert: wbIsoZeit() };
  w.faecher.push(f);
  wbSchmutzig(welt);
  return f;
}

function wbZweigAnlegen(welt, fachId, name, art) {
  var w = wbWissen(welt);
  var z;
  if (!w || !wbFachFinden(welt, fachId) || !String(name || '').trim()) { return null; }
  z = { id: wbId('zw'), fachId: fachId, name: String(name).trim(),
        art: (art === 'vorhaben') ? 'vorhaben' : 'unterfach',
        zustand: 'aktiv', ruhtBis: '', rang: wbZweige(welt, fachId).length, geaendert: wbIsoZeit() };
  w.zweige.push(z);
  wbSchmutzig(welt);
  return z;
}

/* FA-02: die Zahl der offenen Aufgaben. Eine Aufgabe gehört über
   wbZweig zu einem Zweig oder über wbFach direkt zu einem Fach. */
function wbOffeneAufgaben(welt, fachId, zweigId) {
  var d = wbDaten.aufgaben;
  var liste = (d && Array.isArray(d.aufgaben)) ? d.aufgaben : [];
  var zweige = zweigId ? [zweigId] : wbZweige(welt, fachId).map(function (z) { return z.id; });
  return liste.filter(function (a) {
    if (!a || a.status === 'erledigt') { return false; }
    if (zweigId) { return a.wbZweig === zweigId; }
    if (a.wbFach === fachId) { return true; }
    return zweige.indexOf(a.wbZweig) >= 0;
  }).length;
}

/* WO-03 vorbereitet: ein ruhendes Vorhaben mit Datum gilt ab diesem Tag
   wieder als aktiv. Hier nur die Auskunft, die Wochenansicht kommt später. */
function wbZweigZustand(z, heute) {
  if (!z) { return ''; }
  if (z.art !== 'vorhaben') { return ''; }
  if (z.zustand !== 'ruhend') { return 'aktiv'; }
  if (z.ruhtBis && String(z.ruhtBis) <= String(heute || '')) { return 'aktiv'; }
  return 'ruhend';
}


/* ============================================================
   Den Baum umbauen
   ------------------------------------------------------------
   Umbenennen, verschieben, ordnen, archivieren, löschen. Die
   Kennung bleibt bei allem erhalten — an ihr hängen die Aufgaben
   im gemeinsamen Bestand. Wer sie austauscht, lässt sie verwaisen.
   ============================================================ */

function wbSatz(welt, art, id) {
  return (art === 'fach') ? wbFachFinden(welt, id) : wbZweigFinden(welt, id);
}

function wbUmbenennen(welt, art, id, name) {
  var o = wbSatz(welt, art, id);
  var n = String(name || '').trim();
  if (!o || !n) { return false; }
  o.name = n;
  o.geaendert = wbIsoZeit();
  wbSchmutzig(welt);
  return true;
}

/* Ein Zweig zieht in ein anderes Fach um. Seine Aufgaben ziehen mit,
   weil sie am Zweig hängen und nicht am Fach. */
function wbZweigUmhaengen(welt, id, fachId) {
  var z = wbZweigFinden(welt, id);
  if (!z || !wbFachFinden(welt, fachId)) { return false; }
  if (z.fachId === fachId) { return true; }
  z.fachId = fachId;
  z.rang = wbZweige(welt, fachId, true).length;
  z.geaendert = wbIsoZeit();
  wbSchmutzig(welt);
  return true;
}

function wbArtSetzen(welt, id, art) {
  var z = wbZweigFinden(welt, id);
  if (!z || (art !== 'unterfach' && art !== 'vorhaben')) { return false; }
  z.art = art;
  if (art === 'unterfach') { z.zustand = 'aktiv'; z.ruhtBis = ''; }
  z.geaendert = wbIsoZeit();
  wbSchmutzig(welt);
  return true;
}

/* WO-03: ruhend, wahlweise mit Datum. Ohne Datum ruht es, bis du es
   selbst weckst; mit Datum weckt es sich. */
function wbZustandSetzen(welt, id, zustand, ruhtBis) {
  var z = wbZweigFinden(welt, id);
  if (!z || z.art !== 'vorhaben') { return false; }
  z.zustand = (zustand === 'ruhend') ? 'ruhend' : 'aktiv';
  z.ruhtBis = (z.zustand === 'ruhend') ? String(ruhtBis || '') : '';
  z.geaendert = wbIsoZeit();
  wbSchmutzig(welt);
  return true;
}

/* Die Reihenfolge wird über den Rang geführt, nicht über die Lage im
   Feld — sonst dreht der Abgleich zwischen zwei Geräten sie wieder um. */
function wbRangSchieben(welt, art, id, richtung) {
  var o = wbSatz(welt, art, id);
  var geschwister;
  var i;
  var nachbar;
  if (!o) { return false; }
  geschwister = (art === 'fach') ? wbFaecher(welt, true) : wbZweige(welt, o.fachId, true);
  for (i = 0; i < geschwister.length; i += 1) {
    if (geschwister[i].id === id) { break; }
  }
  nachbar = geschwister[i + (richtung < 0 ? -1 : 1)];
  if (!nachbar) { return false; }
  geschwister.forEach(function (g, k) { g.rang = k; });
  i = o.rang;
  o.rang = nachbar.rang;
  nachbar.rang = i;
  o.geaendert = wbIsoZeit();
  nachbar.geaendert = wbIsoZeit();
  wbSchmutzig(welt);
  return true;
}

function wbArchivieren(welt, art, id, an) {
  var o = wbSatz(welt, art, id);
  if (!o) { return false; }
  if (an) { o.archiv = true; } else { delete o.archiv; }
  o.geaendert = wbIsoZeit();
  /* Ein archiviertes Fach nimmt seine Zweige mit — sonst stünden sie
     ohne sichtbares Fach im Baum. */
  if (art === 'fach') {
    wbZweige(welt, id, true).forEach(function (z) {
      if (an) { z.archiv = true; } else { delete z.archiv; }
      z.geaendert = wbIsoZeit();
    });
  }
  wbSchmutzig(welt);
  return true;
}

/* Gelöscht wird nur, was nichts mehr trägt. Alles andere wird
   archiviert — Aufgaben, die ins Leere zeigen, sind unsichtbar
   und damit verloren, und das ist keine Löschung, sondern ein Verlust. */
function wbLoeschbar(welt, art, id) {
  var o = wbSatz(welt, art, id);
  var zweige;
  if (!o) { return { geht: false, grund: 'Gibt es nicht.' }; }
  if (art === 'fach') {
    zweige = wbZweige(welt, id, true);
    if (zweige.length) {
      return { geht: false, grund: 'Darin liegen noch ' + zweige.length
        + ' Unterfächer oder Vorhaben. Erst die, dann das Fach.' };
    }
    if (wbOffeneAufgaben(welt, id, '') > 0) {
      return { geht: false, grund: 'Daran hängen noch offene Aufgaben.' };
    }
    return { geht: true, grund: '' };
  }
  if (wbAufgabenAm(id).length) {
    return { geht: false, grund: 'Daran hängen noch ' + wbAufgabenAm(id).length
      + ' Aufgaben — auch erledigte. Archivieren lässt sie stehen.' };
  }
  return { geht: true, grund: '' };
}

/* Alle Aufgaben an einem Zweig, offen wie erledigt. Erledigtes zählt
   mit: es ist die Geschichte des Vorhabens. */
function wbAufgabenAm(zweigId) {
  var d = wbDaten.aufgaben;
  var liste = (d && Array.isArray(d.aufgaben)) ? d.aufgaben : [];
  return liste.filter(function (a) { return a && a.wbZweig === zweigId; });
}

/* Der Grabstein: ohne ihn holt das andere Gerät den Satz beim nächsten
   Abgleich zurück, weil es ihn hat und wir nicht. */
function wbLoeschen(welt, art, id) {
  var w = wbWissen(welt);
  var pruefung = wbLoeschbar(welt, art, id);
  var feld;
  if (!w || !pruefung.geht) { return false; }
  feld = (art === 'fach') ? 'faecher' : 'zweige';
  w[feld] = w[feld].filter(function (o) { return o.id !== id; });
  w.grabsteine.push({ id: id, art: art, zeit: wbIsoZeit() });
  wbSchmutzig(welt);
  return true;
}


/* ===== wb_app.js ===== */
/* ============================================================
   wb_app.js — Gerüst, Weltenschalter, Leiste, Wissensbaum
   ------------------------------------------------------------
   FA-01  Baum aus Bereichen, Fächern, Unterfächern, Vorhaben.
   FA-02  Hinter jedem Eintrag die Zahl offener Aufgaben.
   FA-03  Vorhaben zeigen aktiv oder ruhend.
   FA-04  Ein Klick auf ein Fach öffnet es links, Zielseite vorn.
   FA-07  Es gibt keine Schlagwörter.

   Der Bereich ist kein eigener Satz, sondern der Schalter oben:
   jede Welt hat ihren eigenen Bestand, also ist die oberste Ebene
   des Baums schon das Fach. Der Schalter regiert links (Block und
   Fächer) und den Reiter Wissen; Tag und Aufgaben bleiben gemischt.
   ============================================================ */

var WB_WELT_KEY = 'workbench-neu-welt';
var WB_WELTEN = [['beruflich', 'Beruflich'], ['privat', 'Privat']];
var WB_REITER = [['wissen', 'Wissen'], ['tag', 'Tag'], ['aufgaben', 'Aufgaben']];

var wb = { welt: 'beruflich', reiter: 'wissen', fach: '', dialog: null, laeuft: false, archiv: false };

function wbHeute() {
  var d = new Date();
  var z = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
}

function wbWeltName(w) {
  var i;
  for (i = 0; i < WB_WELTEN.length; i += 1) { if (WB_WELTEN[i][0] === w) { return WB_WELTEN[i][1]; } }
  return '';
}

function wbWeltLaden() {
  var w = '';
  try { w = window.localStorage.getItem(WB_WELT_KEY) || ''; } catch (e) { w = ''; }
  wb.welt = (w === 'privat') ? 'privat' : 'beruflich';
}

function wbWeltSetzen(w) {
  if (w !== 'privat' && w !== 'beruflich') { return; }
  if (wb.welt === w) { return; }
  wb.welt = w;
  wb.fach = '';
  try { window.localStorage.setItem(WB_WELT_KEY, w); } catch (e) { /* nur für jetzt */ }
  wbZeichne();
}

function wbReiterSetzen(r) {
  wb.reiter = r;
  wbZeichne();
}

/* ---------- Zeichnen ---------- */

function wbZeichne() {
  wbTitelZeichnen();
  wbFlaecheZeichnen();
  wbLeisteZeichnen();
  wbMiniZeichnen();
}

function wbTitelZeichnen() {
  var el = document.getElementById('weltSchalter');
  var st = document.getElementById('stand');
  if (el) {
    el.innerHTML = WB_WELTEN.map(function (w) {
      return '<button type="button"' + (wb.welt === w[0] ? ' class="an"' : '')
        + ' onclick="wbWeltSetzen(\'' + w[0] + '\')">' + wbEsc(w[1]) + '</button>';
    }).join('');
  }
  if (st) { st.textContent = wbStandText(); }
}

function wbStandText() {
  var b = wbStand.beruflich;
  var p = wbStand.privat;
  var a = wbStand.aufgaben;
  var teile = [];
  teile.push(wbTokenGueltig() ? 'Drive verbunden' : 'Drive getrennt');
  teile.push(wbHandles.beruflich ? 'Firmenspeicher verbunden' : 'Firmenspeicher fehlt');
  if (a.schmutzig || p.schmutzig || b.schmutzig) { teile.push('ungesichert'); }
  return teile.join(' · ');
}

function wbFlaecheZeichnen() {
  var el = document.getElementById('flaeche');
  if (!el) { return; }
  el.innerHTML = wb.fach ? wbFachHtml() : wbStartHtml();
}

function wbMiniZeichnen() {
  var el = document.getElementById('mini');
  if (!el) { return; }
  /* Der Block kommt in Stufe 2 — bis dahin steht hier, was gilt. */
  el.textContent = wb.fach
    ? ('Fach geöffnet · ' + wbWeltName(wb.welt))
    : ('Der Block kommt in Stufe 2 · ' + wbWeltName(wb.welt));
}

function wbLeisteZeichnen() {
  var kopf = document.getElementById('lkopf');
  var inhalt = document.getElementById('linhalt');
  var fuss = document.getElementById('lfuss');
  if (!kopf || !inhalt || !fuss) { return; }
  kopf.innerHTML = WB_REITER.map(function (r) {
    var misch = (r[0] !== 'wissen');
    var unten = misch ? 'beides' : wbWeltName(wb.welt).toLowerCase();
    return '<button type="button" class="' + (wb.reiter === r[0] ? 'an' : '') + (misch ? ' misch' : '')
      + '" onclick="wbReiterSetzen(\'' + r[0] + '\')">' + wbEsc(r[1])
      + '<em>' + wbEsc(unten) + '</em></button>';
  }).join('');
  if (wb.reiter === 'wissen') {
    inhalt.innerHTML = wbBaumHtml();
    fuss.innerHTML = '<button type="button" class="kn voll" onclick="wbFachNeuFragen()">Neues Fach</button>'
      + '<button type="button" class="kn" onclick="wbZweigNeuFragen()">Unterfach oder Vorhaben…</button>'
      + '<button type="button" class="kn' + (wb.archiv ? ' voll' : '') + '" onclick="wbArchivUm()">'
      + (wb.archiv ? 'Archiv verbergen' : 'Archiv zeigen') + '</button>';
  } else {
    inhalt.innerHTML = wbSpaeterHtml(wb.reiter);
    fuss.innerHTML = '<button type="button" class="kn" disabled>Kommt in Stufe 4</button>';
  }
}

function wbSpaeterHtml(reiter) {
  var was = (reiter === 'tag')
    ? 'Die Tagesseite mit Hauptaufgabe, Routinen und Kleinigkeiten'
    : 'Die Aufgaben aller Fächer, nach beruflich und privat filterbar';
  return '<p class="leise">' + wbEsc(was) + ' entsteht in Stufe 4.<br><br>'
    + 'Bis dahin führst du deine Aufgaben weiter in CLIE — es ist derselbe Bestand '
    + '(workbench.json), und diese Leiste zeigt ihn, sobald sie gebaut ist.</p>';
}

/* ---------- Der Wissensbaum ---------- */

function wbBaumHtml() {
  var welt = wb.welt;
  var w = wbWissen(welt);
  var heute = wbHeute();
  var h = '';
  if (!w) {
    return '<p class="leise">' + wbEsc(wbWeltName(welt)) + ': noch nicht geladen.<br><br>'
      + (welt === 'beruflich'
        ? 'Wähle links den Ordner auf dem Firmenspeicher.'
        : 'Melde dich links bei Google an.') + '</p>';
  }
  var faecher = wbFaecher(welt, wb.archiv);
  if (!faecher.length) {
    return '<p class="leise">Noch kein Fach in dieser Welt.<br><br>'
      + 'Ein Fach ist ein Bereich deiner Arbeit, der Bestand hat — '
      + 'beruflich etwa „Quality Management", privat „Haus".</p>';
  }
  h += '<div class="baum">';
  faecher.forEach(function (f) {
    h += wbZeileHtml('e1' + (wb.fach === f.id ? ' gew' : '') + (f.archiv ? ' arch' : ''),
      'wbFachOeffnen(\'' + wbEsc(f.id) + '\')', '', f.name,
      wbOffeneAufgaben(welt, f.id, ''), 'wbFachFragen(\'' + wbEsc(f.id) + '\')');
    wbZweige(welt, f.id, wb.archiv).forEach(function (z) {
      var zustand = wbZweigZustand(z, heute);
      h += wbZeileHtml('e2' + (z.archiv ? ' arch' : ''),
        'wbFachOeffnen(\'' + wbEsc(f.id) + '\')',
        zustand ? '<span class="pkt ' + (zustand === 'aktiv' ? 'aktiv' : 'ruht') + '"></span>' : '',
        z.name, wbOffeneAufgaben(welt, f.id, z.id), 'wbZweigFragen(\'' + wbEsc(z.id) + '\')');
    });
  });
  h += '</div>';
  return h;
}

/* Eine Baumzeile: der Name öffnet, das Zeichen rechts pflegt.
   Zwei Knöpfe nebeneinander, nicht ineinander — verschachtelte
   Knöpfe sind kein gültiges HTML und reagieren unzuverlässig. */
function wbZeileHtml(klasse, aufKlick, punkt, name, zahl, aufStift) {
  return '<div class="bz ' + klasse + '">'
    + '<button type="button" class="nmk" onclick="' + aufKlick + '">'
    + punkt + '<span class="nm">' + wbEsc(name) + '</span></button>'
    + '<span class="zahl">' + zahl + '</span>'
    + '<button type="button" class="stift" title="Bearbeiten" onclick="' + aufStift + '">✎</button></div>';
}

function wbArchivUm() {
  wb.archiv = !wb.archiv;
  wbZeichne();
}

function wbFachOeffnen(id) {
  wb.fach = id;
  wbZeichne();
}

function wbFachHtml() {
  var f = wbFachFinden(wb.welt, wb.fach);
  var zweige;
  var h;
  if (!f) {
    wb.fach = '';
    return wbStartHtml();
  }
  zweige = wbZweige(wb.welt, wb.fach);
  h = '<div class="fachkopf"><b>' + wbEsc(f.name) + '</b>'
    + '<span>' + wbEsc(wbWeltName(wb.welt)) + ' · ' + zweige.length + ' Unterfächer und Vorhaben · '
    + wbOffeneAufgaben(wb.welt, f.id, '') + ' offene Aufgaben</span></div>';
  h += '<div class="ziel"><u>Zielseite</u>';
  if (f.ziel && (f.ziel.richtung || f.ziel.hinein || f.ziel.nicht || f.ziel.offen)) {
    if (f.ziel.richtung) { h += '<p><b>Richtung:</b> ' + wbEsc(f.ziel.richtung) + '</p>'; }
    if (f.ziel.hinein)   { h += '<p><b>Gehört hinein:</b> ' + wbEsc(f.ziel.hinein) + '</p>'; }
    if (f.ziel.nicht)    { h += '<p><b>Nicht hinein:</b> ' + wbEsc(f.ziel.nicht) + '</p>'; }
    if (f.ziel.offen)    { h += '<p><b>Offen:</b> ' + wbEsc(f.ziel.offen) + '</p>'; }
  } else {
    h += '<p>Noch keine Zielseite. Sie lohnt sich erst für große Fächer — '
      + 'eine halbe Seite: Richtung in ein bis zwei Jahren, was hineingehört und was nicht, offene Fragen.</p>';
  }
  h += '<p><button type="button" class="kn" onclick="wbZielFragen()">Zielseite bearbeiten</button></p></div>';
  h += '<div class="start"><h2>Blätter</h2><p>Die Ernteblätter dieses Fachs erscheinen hier, '
    + 'sobald der Block (Stufe 2) und die Ernte (Stufe 3) stehen.</p></div>';
  return h;
}

/* ---------- Die Startfläche: die drei Bestände ---------- */

function wbStartHtml() {
  var h = '<div class="start"><h2>Die drei Bestände</h2>'
    + '<p>Berufliches Wissen liegt ausschließlich im Firmenspeicher und verlässt ihn nie. '
    + 'Privates Wissen und die Aufgaben liegen in Google Drive — die Aufgaben in derselben '
    + 'Datei, die auch CLIE benutzt.</p></div>';
  h += WB_BESTAENDE.map(function (b) {
    var s = wbStand[b.id];
    /* Grau heißt: noch keine Verbindung. Rot heißt: Verbindung da, aber
       etwas ging schief. Grün heißt: der Bestand liegt wirklich vor. */
    var zustand = s.geladen ? 'da' : (s.quelle === 'ohne' ? '' : (s.fehler ? 'weg' : ''));
    var text;
    if (s.geladen) {
      text = b.datei + ' · ' + (s.quelle === 'neu' ? 'neu angelegt' : 'geladen') + (s.schmutzig ? ' · ungesichert' : '');
    } else if (s.fehler) {
      text = s.fehler;
    } else {
      text = b.datei + ' · noch nicht geladen';
    }
    return '<div class="best"><span class="ampel ' + zustand + '"></span>'
      + '<span class="nm">' + wbEsc(b.name)
      + '<small>' + wbEsc(text) + '</small></span></div>';
  }).join('');
  h += '<div class="start">'
    + '<p><button type="button" class="kn voll" onclick="wbAnmeldenKlick()">'
    + (wbTokenGueltig() ? 'Bei Google neu anmelden' : 'Bei Google anmelden') + '</button> '
    + '<button type="button" class="kn" onclick="wbOrtKlick()">'
    + (wbHandles.beruflich ? 'Firmenspeicher neu wählen' : 'Ordner auf dem Firmenspeicher wählen') + '</button> '
    + '<button type="button" class="kn" onclick="wbAllesLaden()">Neu laden</button> '
    + '<button type="button" class="kn rot" onclick="wbAllesSichern()">Sichern</button></p>'
    + '<h2>Was als Nächstes kommt</h2><ol>'
    + '<li>Stufe 2 — der Block: feste Seiten, Tagesnotizseite, Denkseiten, Miniaturstreifen</li>'
    + '<li>Stufe 3 — Ernte und Post-its</li>'
    + '<li>Stufe 4 — Aufgaben und Tagesseite, dann füllen sich die Reiter rechts</li>'
    + '</ol></div>';
  return h;
}

/* ---------- Handlungen ---------- */

function wbAnmeldenKlick() {
  melde('Anmeldung läuft…', null);
  wbAnmelden(false).then(function (gut) {
    if (!gut) { melde('Die Anmeldung hat nicht geklappt.', 'warn'); wbZeichne(); return null; }
    melde('Angemeldet.', null);
    return wbAllesLaden();
  });
}

function wbOrtKlick() {
  wbOrtWaehlen('beruflich').then(function () {
    melde('Firmenspeicher gewählt.', null);
    return wbLaden('beruflich');
  }).then(function () {
    wbZeichne();
  }).catch(function (f) {
    melde('Kein Speicherort gewählt.\n' + (f && f.message ? f.message : ''), 'warn');
  });
}

function wbAllesLaden() {
  if (wb.laeuft) { return Promise.resolve(false); }
  wb.laeuft = true;
  return Promise.all(WB_BESTAENDE.map(function (b) { return wbLaden(b.id); })).then(function () {
    wb.laeuft = false;
    wbZeichne();
    return true;
  }).catch(function () {
    wb.laeuft = false;
    wbZeichne();
    return false;
  });
}

function wbAllesSichern() {
  var offen = WB_BESTAENDE.filter(function (b) { return wbStand[b.id].schmutzig; });
  if (!offen.length) { melde('Nichts zu sichern.', null); return Promise.resolve(true); }
  return Promise.all(offen.map(function (b) {
    return wbSichern(b.id).catch(function (f) { return f; });
  })).then(function (erg) {
    var schlecht = erg.filter(function (e) { return e instanceof Error; });
    melde(schlecht.length ? ('Nicht alles gesichert:\n' + schlecht[0].message)
                          : (offen.length + ' Bestand/Bestände gesichert.'),
          schlecht.length ? 'warn' : null);
    wbZeichne();
    return !schlecht.length;
  });
}

/* ---------- Dialoge ---------- */

function wbDialogZu() {
  var el = document.getElementById('aufklapp');
  wb.dialog = null;
  if (el) { el.className = 'aufklapp zu'; el.innerHTML = ''; }
}

function wbDialogAuf(titel, leib, fuss) {
  var el = document.getElementById('aufklapp');
  if (!el) { return; }
  el.className = 'aufklapp';
  el.innerHTML = '<div class="dlg"><div class="dlgkopf">' + wbEsc(titel) + '</div>'
    + '<div class="dlgleib">' + leib + '</div><div class="dlgfuss">' + fuss + '</div></div>';
}

function wbFachNeuFragen() {
  if (!wbWissen(wb.welt)) { melde('Diese Welt ist noch nicht geladen.', 'warn'); return; }
  wb.dialog = 'fach';
  wbDialogAuf('Neues Fach in ' + wbWeltName(wb.welt),
    '<div class="feld"><label>Name des Fachs</label><input id="dlgName" type="text" placeholder="Quality Management"></div>'
    + '<p class="leise" style="padding:0">Ein Fach hat Bestand. Was ein Ziel und ein Ende hat, '
    + 'wird kein Fach, sondern ein Vorhaben darin.</p>',
    '<span class="r"><button type="button" class="kn" onclick="wbDialogZu()">Abbrechen</button>'
    + '<button type="button" class="kn rot" onclick="wbFachNeuFertig()">Anlegen</button></span>');
  var el = document.getElementById('dlgName');
  if (el && el.focus) { el.focus(); }
}

function wbFachNeuFertig() {
  var el = document.getElementById('dlgName');
  var name = el ? String(el.value || '').trim() : '';
  var f;
  if (!name) { melde('Ohne Namen geht es nicht.', 'warn'); return; }
  f = wbFachAnlegen(wb.welt, name);
  wbDialogZu();
  if (f) { wb.fach = f.id; }
  wbZeichne();
  melde('Fach „' + name + '" angelegt — noch ungesichert.', null);
}

function wbZweigNeuFragen() {
  var faecher = wbFaecher(wb.welt);
  if (!faecher.length) { melde('Erst ein Fach anlegen.', 'warn'); return; }
  wb.dialog = 'zweig';
  wbDialogAuf('Unterfach oder Vorhaben',
    '<div class="feld"><label>Fach</label><select id="dlgFach">'
    + faecher.map(function (f) {
      return '<option value="' + wbEsc(f.id) + '"' + (f.id === wb.fach ? ' selected' : '') + '>' + wbEsc(f.name) + '</option>';
    }).join('') + '</select></div>'
    + '<div class="feld"><label>Name</label><input id="dlgName" type="text" placeholder="Migration Altsystem"></div>'
    + '<div class="feld"><label>Art</label><select id="dlgArt">'
    + '<option value="unterfach">Unterfach — ein Dauerthema</option>'
    + '<option value="vorhaben">Vorhaben — hat ein Ziel und ein Ende</option></select></div>',
    '<span class="r"><button type="button" class="kn" onclick="wbDialogZu()">Abbrechen</button>'
    + '<button type="button" class="kn rot" onclick="wbZweigNeuFertig()">Anlegen</button></span>');
  var el = document.getElementById('dlgName');
  if (el && el.focus) { el.focus(); }
}

function wbZweigNeuFertig() {
  var fach = document.getElementById('dlgFach');
  var name = document.getElementById('dlgName');
  var art = document.getElementById('dlgArt');
  var n = name ? String(name.value || '').trim() : '';
  var z;
  if (!n) { melde('Ohne Namen geht es nicht.', 'warn'); return; }
  z = wbZweigAnlegen(wb.welt, fach ? fach.value : '', n, art ? art.value : 'unterfach');
  wbDialogZu();
  if (z) { wb.fach = z.fachId; }
  wbZeichne();
  melde(z ? ('„' + n + '" angelegt — noch ungesichert.') : 'Das hat nicht geklappt.', z ? null : 'warn');
}

function wbZielFragen() {
  var f = wbFachFinden(wb.welt, wb.fach);
  if (!f) { return; }
  if (!f.ziel) { f.ziel = { richtung: '', hinein: '', nicht: '', offen: '' }; }
  wb.dialog = 'ziel';
  wbDialogAuf('Zielseite — ' + f.name,
    '<div class="feld"><label>Richtung in ein bis zwei Jahren</label>'
    + '<textarea id="zRichtung">' + wbEsc(f.ziel.richtung) + '</textarea></div>'
    + '<div class="feld"><label>Gehört hinein</label><textarea id="zHinein">' + wbEsc(f.ziel.hinein) + '</textarea></div>'
    + '<div class="feld"><label>Gehört nicht hinein</label><textarea id="zNicht">' + wbEsc(f.ziel.nicht) + '</textarea></div>'
    + '<div class="feld"><label>Offene Fragen</label><textarea id="zOffen">' + wbEsc(f.ziel.offen) + '</textarea></div>',
    '<span class="r"><button type="button" class="kn" onclick="wbDialogZu()">Abbrechen</button>'
    + '<button type="button" class="kn rot" onclick="wbZielFertig()">Übernehmen</button></span>');
}

function wbZielFertig() {
  var f = wbFachFinden(wb.welt, wb.fach);
  var hol = function (id) {
    var el = document.getElementById(id);
    return el ? String(el.value || '').trim() : '';
  };
  if (!f) { wbDialogZu(); return; }
  f.ziel = { richtung: hol('zRichtung'), hinein: hol('zHinein'), nicht: hol('zNicht'), offen: hol('zOffen') };
  f.geaendert = wbIsoZeit();
  wbSchmutzig(wb.welt);
  wbDialogZu();
  wbZeichne();
  melde('Zielseite übernommen — noch ungesichert.', null);
}

/* ---------- Start ---------- */

function wbStart() {
  wbWeltLaden();
  wbTokenHolen();
  wbZeichne();
  wbOrtLaden('beruflich').then(function () {
    if (wbTokenGueltig()) { return wbAnmelden(true); }
    return false;
  }).then(function () {
    return wbAllesLaden();
  }).then(function () {
    wbZeichne();
  });
}

/* ---------- Den Baum pflegen ---------- */

function wbFachFragen(id) {
  var f = wbFachFinden(wb.welt, id);
  var pruefung;
  if (!f) { return; }
  pruefung = wbLoeschbar(wb.welt, 'fach', id);
  wb.dialog = 'fachAendern:' + id;
  wbDialogAuf('Fach bearbeiten',
    '<div class="feld"><label>Name</label><input id="dlgName" type="text" value="' + wbEsc(f.name) + '"></div>'
    + '<div class="feld"><label>Reihenfolge</label>'
    + '<button type="button" class="kn" onclick="wbSchieben(\'fach\',\'' + wbEsc(id) + '\',-1)">▲ nach oben</button> '
    + '<button type="button" class="kn" onclick="wbSchieben(\'fach\',\'' + wbEsc(id) + '\',1)">▼ nach unten</button></div>'
    + '<div class="feld"><label>Archiv</label>'
    + '<button type="button" class="kn" onclick="wbArchivSetzen(\'fach\',\'' + wbEsc(id) + '\',' + (f.archiv ? 'false' : 'true') + ')">'
    + (f.archiv ? 'Aus dem Archiv holen' : 'Ins Archiv legen — mit allem darin') + '</button></div>'
    + (pruefung.geht ? '' : '<p class="leise" style="padding:0">Löschen geht nicht: ' + wbEsc(pruefung.grund) + '</p>'),
    '<button type="button" class="kn rot" onclick="wbLoeschenKlick(\'fach\',\'' + wbEsc(id) + '\')"'
    + (pruefung.geht ? '' : ' disabled') + '>Löschen</button>'
    + '<span class="r"><button type="button" class="kn" onclick="wbDialogZu()">Abbrechen</button>'
    + '<button type="button" class="kn voll" onclick="wbFachAendernFertig(\'' + wbEsc(id) + '\')">Übernehmen</button></span>');
}

function wbFachAendernFertig(id) {
  var el = document.getElementById('dlgName');
  var name = el ? String(el.value || '').trim() : '';
  if (!name) { melde('Ohne Namen geht es nicht.', 'warn'); return; }
  wbUmbenennen(wb.welt, 'fach', id, name);
  wbDialogZu();
  wbZeichne();
  melde('Übernommen — noch ungesichert.', null);
}

function wbZweigFragen(id) {
  var z = wbZweigFinden(wb.welt, id);
  var faecher;
  var pruefung;
  var ruht;
  if (!z) { return; }
  faecher = wbFaecher(wb.welt, true);
  pruefung = wbLoeschbar(wb.welt, 'zweig', id);
  ruht = (z.art === 'vorhaben' && z.zustand === 'ruhend');
  wb.dialog = 'zweigAendern:' + id;
  wbDialogAuf((z.art === 'vorhaben' ? 'Vorhaben' : 'Unterfach') + ' bearbeiten',
    '<div class="feld"><label>Name</label><input id="dlgName" type="text" value="' + wbEsc(z.name) + '"></div>'
    + '<div class="feld"><label>Liegt im Fach</label><select id="dlgFach">'
    + faecher.map(function (f) {
      return '<option value="' + wbEsc(f.id) + '"' + (f.id === z.fachId ? ' selected' : '') + '>'
        + wbEsc(f.name) + (f.archiv ? ' (Archiv)' : '') + '</option>';
    }).join('') + '</select></div>'
    + '<div class="feld"><label>Art</label><select id="dlgArt">'
    + '<option value="unterfach"' + (z.art === 'unterfach' ? ' selected' : '') + '>Unterfach — ein Dauerthema</option>'
    + '<option value="vorhaben"' + (z.art === 'vorhaben' ? ' selected' : '') + '>Vorhaben — hat ein Ziel und ein Ende</option>'
    + '</select></div>'
    + '<div class="feld"><label>Zustand (nur für Vorhaben)</label><div class="zwei">'
    + '<select id="dlgZustand"><option value="aktiv"' + (ruht ? '' : ' selected') + '>aktiv</option>'
    + '<option value="ruhend"' + (ruht ? ' selected' : '') + '>ruhend</option></select>'
    + '<input id="dlgRuhtBis" type="date" value="' + wbEsc(z.ruhtBis || '') + '"></div></div>'
    + '<p class="leise" style="padding:0">Ein ruhendes Vorhaben mit Datum wacht an diesem Tag von selbst auf. '
    + 'Ohne Datum ruht es, bis du es weckst.</p>'
    + '<div class="feld"><label>Reihenfolge und Archiv</label>'
    + '<button type="button" class="kn" onclick="wbSchieben(\'zweig\',\'' + wbEsc(id) + '\',-1)">▲</button> '
    + '<button type="button" class="kn" onclick="wbSchieben(\'zweig\',\'' + wbEsc(id) + '\',1)">▼</button> '
    + '<button type="button" class="kn" onclick="wbArchivSetzen(\'zweig\',\'' + wbEsc(id) + '\',' + (z.archiv ? 'false' : 'true') + ')">'
    + (z.archiv ? 'Aus dem Archiv holen' : 'Ins Archiv') + '</button></div>'
    + (pruefung.geht ? '' : '<p class="leise" style="padding:0">Löschen geht nicht: ' + wbEsc(pruefung.grund) + '</p>'),
    '<button type="button" class="kn rot" onclick="wbLoeschenKlick(\'zweig\',\'' + wbEsc(id) + '\')"'
    + (pruefung.geht ? '' : ' disabled') + '>Löschen</button>'
    + '<span class="r"><button type="button" class="kn" onclick="wbDialogZu()">Abbrechen</button>'
    + '<button type="button" class="kn voll" onclick="wbZweigAendernFertig(\'' + wbEsc(id) + '\')">Übernehmen</button></span>');
}

function wbZweigAendernFertig(id) {
  var hol = function (n) {
    var el = document.getElementById(n);
    return el ? String(el.value || '').trim() : '';
  };
  var name = hol('dlgName');
  if (!name) { melde('Ohne Namen geht es nicht.', 'warn'); return; }
  wbUmbenennen(wb.welt, 'zweig', id, name);
  wbZweigUmhaengen(wb.welt, id, hol('dlgFach'));
  wbArtSetzen(wb.welt, id, hol('dlgArt'));
  wbZustandSetzen(wb.welt, id, hol('dlgZustand'), hol('dlgRuhtBis'));
  wbDialogZu();
  wbZeichne();
  melde('Übernommen — noch ungesichert.', null);
}

function wbSchieben(art, id, richtung) {
  if (!wbRangSchieben(wb.welt, art, id, richtung)) {
    melde('Weiter geht es in diese Richtung nicht.', null);
    return;
  }
  wbZeichne();
  if (art === 'fach') { wbFachFragen(id); } else { wbZweigFragen(id); }
}

function wbArchivSetzen(art, id, an) {
  wbArchivieren(wb.welt, art, id, an);
  if (an && art === 'fach' && wb.fach === id) { wb.fach = ''; }
  wbDialogZu();
  wbZeichne();
  melde(an ? 'Ins Archiv gelegt — noch ungesichert.' : 'Aus dem Archiv geholt — noch ungesichert.', null);
}

function wbLoeschenKlick(art, id) {
  var o = wbSatz(wb.welt, art, id);
  var pruefung = wbLoeschbar(wb.welt, art, id);
  if (!o) { return; }
  if (!pruefung.geht) { melde(pruefung.grund, 'warn'); return; }
  wb.dialog = 'loeschen';
  wbDialogAuf('Wirklich löschen?',
    '<p>„' + wbEsc(o.name) + '" wird gelöscht und auch auf deinen anderen Geräten verschwinden. '
    + 'Das lässt sich nicht zurückholen.</p>'
    + '<p class="leise" style="padding:0">Soll es nur aus dem Weg: Abbrechen und stattdessen ins Archiv legen.</p>',
    '<span class="r"><button type="button" class="kn" onclick="wbDialogZu()">Abbrechen</button>'
    + '<button type="button" class="kn rot" onclick="wbLoeschenFertig(\'' + art + '\',\'' + wbEsc(id) + '\')">Löschen</button></span>');
}

function wbLoeschenFertig(art, id) {
  var gut = wbLoeschen(wb.welt, art, id);
  if (gut && art === 'fach' && wb.fach === id) { wb.fach = ''; }
  wbDialogZu();
  wbZeichne();
  melde(gut ? 'Gelöscht — noch ungesichert.' : 'Das ging nicht.', gut ? null : 'warn');
}


if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', wbStart);
} else {
  wbStart();
}
</script>
</body>
</html>
