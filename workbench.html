/* Kurze, gleichbleibende Kennung aus einem Text. Damit ergibt ein
   zweiter Durchlauf dieselben Kennungen. */
function schluesselId(vorsatz, text) {
  var h = 5381;
  var i;
  for (i = 0; i < text.length; i++) {
    h = ((h * 33) ^ text.charCodeAt(i)) >>> 0;
  }
  return vorsatz + '-' + h.toString(36);
}

/* Alt: 1 = Montag bis 7 = Sonntag. Neu: 0 = Sonntag bis 6 = Samstag. */
function wochentagUmrechnen(alt) {
  var n = Number(alt);
  if (!(n >= 1 && n <= 7)) { return -1; }
  return (n === 7) ? 0 : n;
}

function wiederholungUmschreiben(alt, faellig) {
  if (!alt || !alt.typ) { return null; }
  var intervall = Number(alt.intervall) || 1;
  if (intervall < 1) { intervall = 1; }
  if (intervall > 4) { intervall = 4; }

  if (alt.typ === 'woechentlich') {
    var tage = [];
    var roh = Array.isArray(alt.wochentage) ? alt.wochentage : [];
    var i;
    for (i = 0; i < roh.length; i++) {
      var t = wochentagUmrechnen(roh[i]);
      if (t >= 0 && tage.indexOf(t) < 0) { tage.push(t); }
    }
    /* Ohne Wochentag trifft die Regel nie zu — dann gibt es sie nicht. */
    if (!tage.length) { return null; }
    tage.sort(function (a, b) { return a - b; });
    return { takt: 'woche', intervall: intervall, tage: tage, tag: 1 };
  }

  if (alt.typ === 'monatlich') {
    var tag = 1;
    if (faellig && faellig.length >= 10) { tag = Number(faellig.slice(8, 10)) || 1; }
    return { takt: 'monat', intervall: intervall, tage: [], tag: tag };
  }
  return null;
}

function quelleInhalt(quelle) {
  var d = quelle.daten || {};
  var teile = [];
  function zaehl(feld, wort) {
    if (Array.isArray(d[feld]) && d[feld].length) { teile.push(d[feld].length + ' ' + wort); }
  }
  zaehl('bereiche', 'Bereiche');
  zaehl('aufgaben', 'Aufgaben');
  zaehl('plaene', 'Pläne');
  zaehl('jahrestermine', 'Jahrestermine');
  zaehl('ziele', 'Ziele');
  zaehl('aktivitaeten', 'Aktivitäten');
  if (!teile.length) { return 'nichts Verwertbares gefunden'; }
  return teile.join(' · ');
}

function quelleErkennen(name, daten) {
  if (daten && Array.isArray(daten.aktivitaeten) && Array.isArray(daten.gruppen)) {
    return 'timeassist';
  }
  if (daten && Array.isArray(daten.bereiche) && Array.isArray(daten.aufgaben)) {
    return 'workassist';
  }
  if (daten && Array.isArray(daten.aufgaben)) { return 'backlog'; }
  return 'unbekannt';
}

function kontextRaten(name) {
  return (/privat/i.test(name)) ? 'privat' : 'beruflich';
}

/* ------------------------------------------------------------
   Der eigentliche Rechenschritt. Reine Funktion, damit sie
   außerhalb des Browsers geprüft werden kann.
   ------------------------------------------------------------ */
function migrationRechnen(quellen) {
  var ziel = leereDatenbank();
  var bericht = {
    themen: 0, projekte: 0, ziele: 0, aufgaben: 0, ablaeufe: 0, durchlaeufe: 0,
    jahrestermine: 0, verworfen: 0, zusammengezogen: 0, regelnAus: 0,
    unbekannteBereiche: [], verworfeneArten: {}, hinweise: []
  };

  var themenNachAlt = {};    /* alte bereichId -> neue themaId */
  var projekteNachAlt = {};  /* alte bereichId -> neue projektId */
  var zielNachAlt = {};
  var jtGesehen = {};
  var wdhGesehen = {};       /* kontext|titel -> Aufgabe */

  var q, i, j;

  /* --- Durchgang 1: Bereiche ------------------------------- */
  for (q = 0; q < quellen.length; q++) {
    var quelle = quellen[q];
    if (quelle.art !== 'workassist') { continue; }
    var bereiche = quelle.daten.bereiche || [];
    for (i = 0; i < bereiche.length; i++) {
      var b = bereiche[i];
      var name = (b.name || '').trim();
      if (!name) { continue; }
      var wohin = BEREICH_ZUORDNUNG[name];
      if (!wohin) {
        wohin = 'thema';
        if (bericht.unbekannteBereiche.indexOf(name) < 0) {
          bericht.unbekannteBereiche.push(name);
        }
      }
      if (wohin === 'weg') { bericht.verworfen++; continue; }

      if (wohin === 'thema') {
        var tid = schluesselId('th', quelle.kontext + '|' + name);
        if (!themenNachAlt[b.id]) {
          themenNachAlt[b.id] = tid;
          ziel.themen.push(stempelnMit({ id: tid, name: name, kontext: quelle.kontext }));
          bericht.themen++;
        }
      } else if (wohin === 'projekt') {
        var pid = schluesselId('pj', quelle.kontext + '|' + name);
        if (!projekteNachAlt[b.id]) {
          projekteNachAlt[b.id] = pid;
          ziel.projekte.push(stempelnMit({
            id: pid, name: name, kontext: quelle.kontext, beschreibung: '',
            start: '', ende: '', status: 'laufend',
            meilensteine: [], zielzustaende: [], anlagen: []
          }));
          bericht.projekte++;
        }
      } else if (wohin === 'ziel') {
        var angabe = ZIEL_ANGABEN[name] || { name: name, zieltermin: '' };
        var zid = schluesselId('zl', quelle.kontext + '|' + name);
        if (!zielNachAlt[b.id]) {
          zielNachAlt[b.id] = zid;
          ziel.ziele.push(stempelnMit({
            id: zid, name: angabe.name, kontext: quelle.kontext, beschreibung: '',
            zieltermin: angabe.zieltermin, status: 'laufend',
            zielzustaende: [], einzahler: []
          }));
          bericht.ziele++;
        }
      }
    }
  }

  /* --- Durchgang 2: Aufgaben ------------------------------- */
  for (q = 0; q < quellen.length; q++) {
    var qa = quellen[q];
    if (qa.art !== 'workassist' && qa.art !== 'backlog') { continue; }
    var aufgaben = qa.daten.aufgaben || [];
    for (i = 0; i < aufgaben.length; i++) {
      var a = aufgaben[i];
      var titel = (a.titel || '').trim();
      if (!titel) { bericht.verworfen++; continue; }

      var regel = wiederholungUmschreiben(a.wiederholung, a.faellig);
      if (a.wiederholung && !regel) { bericht.regelnAus++; }

      /* Wiederkehrendes lag im Altbestand als Reihe von Instanzen vor.
         Daraus wird eine Aufgabe mit Regel und dem jüngsten Erledigtdatum. */
      if (a.wiederholung) {
        var wschluessel = qa.kontext + '|' + titel;
        var schon = wdhGesehen[wschluessel];
        if (schon) {
          bericht.zusammengezogen++;
          if (a.erledigtAm && (!schon.zuletztErledigt || a.erledigtAm > schon.zuletztErledigt)) {
            schon.zuletztErledigt = a.erledigtAm;
          }
          continue;
        }
      }

      var neu = stempelnMit({
        id: schluesselId('au', qa.kontext + '|' + (a.id || titel + '|' + i)),
        titel: titel,
        beschreibung: a.notiz || '',
        kontext: qa.kontext,
        themaId: themenNachAlt[a.bereichId] || null,
        projektId: projekteNachAlt[a.bereichId] || null,
        /* Bei wiederkehrenden Aufgaben war „faellig" das nächste
           Vorkommen der Instanz, keine Frist. Die Regel entscheidet. */
        frist: a.wiederholung ? '' : (a.faellig || ''),
        planung: 'backlog',
        uhrzeit: a.uhrzeit || '',
        art: 'haupt',
        wiederholung: regel,
        status: (a.wiederholung || a.status !== 'erledigt') ? 'offen' : 'erledigt',
        erledigtAm: a.erledigtAm || null,
        zuletztErledigt: a.erledigtAm || null,
        ablaufSchritt: null
      });
      if (a.wiederholung) {
        neu.id = schluesselId('au', qa.kontext + '|wdh|' + titel);
        wdhGesehen[qa.kontext + '|' + titel] = neu;
      }
      ziel.aufgaben.push(neu);
      bericht.aufgaben++;
    }
  }

  /* --- Durchgang 3: Pläne ---------------------------------- */
  for (q = 0; q < quellen.length; q++) {
    var qp = quellen[q];
    if (qp.art !== 'workassist') { continue; }
    var plaene = qp.daten.plaene || [];
    for (i = 0; i < plaene.length; i++) {
      var pl = plaene[i];
      var ptitel = (pl.titel || '').trim();
      if (!ptitel) { bericht.verworfen++; continue; }
      var wohinP = PLAN_ZUORDNUNG[ptitel] || 'durchlauf';
      var schritte = Array.isArray(pl.schritte) ? pl.schritte : [];

      if (wohinP === 'weg') { bericht.verworfen++; continue; }

      if (wohinP === 'aufgabe') {
        ziel.aufgaben.push(stempelnMit({
          id: schluesselId('au', qp.kontext + '|plan|' + ptitel),
          titel: ptitel, beschreibung: pl.notiz || '', kontext: qp.kontext,
          themaId: themenNachAlt[pl.bereichId] || null,
          projektId: projekteNachAlt[pl.bereichId] || null,
          frist: '', planung: 'backlog', uhrzeit: '', art: 'haupt',
          wiederholung: null, status: 'offen', erledigtAm: null,
          zuletztErledigt: null, ablaufSchritt: null
        }));
        bericht.aufgaben++;
        continue;
      }

      if (wohinP === 'projekt') {
        var meilen = [];
        for (j = 0; j < schritte.length; j++) {
          meilen.push({
            id: schluesselId('ms', ptitel + '|' + j),
            titel: (schritte[j].titel || schritte[j].t || ('Schritt ' + (j + 1))),
            datum: '', erreicht: !!schritte[j].erledigt
          });
        }
        ziel.projekte.push(stempelnMit({
          id: schluesselId('pj', qp.kontext + '|plan|' + ptitel),
          name: ptitel, kontext: qp.kontext, beschreibung: pl.notiz || '',
          start: '', ende: '', status: 'laufend',
          meilensteine: meilen, zielzustaende: [], anlagen: []
        }));
        bericht.projekte++;
        continue;
      }

      var stufen = [];
      for (j = 0; j < schritte.length; j++) {
        stufen.push({
          titel: (schritte[j].titel || schritte[j].t || ('Schritt ' + (j + 1))),
          auf: !!schritte[j].alsAufgabe,
          fertig: !!schritte[j].erledigt,
          planung: 'backlog'
        });
      }

      if (wohinP === 'vorlage') {
        var vschritte = [];
        for (j = 0; j < stufen.length; j++) {
          vschritte.push({ id: schluesselId('sc', ptitel + '|' + j),
                           titel: stufen[j].titel, auf: stufen[j].auf });
        }
        ziel.ablaeufe.push(stempelnMit({
          id: schluesselId('ab', qp.kontext + '|' + ptitel),
          name: ptitel, kontext: qp.kontext, schritte: vschritte, zuletzt: null
        }));
        bericht.ablaeufe++;
      } else {
        ziel.durchlaeufe.push(stempelnMit({
          id: schluesselId('dl', qp.kontext + '|' + ptitel),
          ablaufId: null, name: ptitel, kontext: qp.kontext,
          start: isoDatum(), frist: '', schritte: stufen
        }));
        bericht.durchlaeufe++;
      }
    }
  }

  /* --- Durchgang 4: Jahrestermine -------------------------- */
  for (q = 0; q < quellen.length; q++) {
    var qj = quellen[q];
    var jt = qj.daten.jahrestermine || [];
    for (i = 0; i < jt.length; i++) {
      var e = jt[i];
      var etitel = (e.t || e.titel || '').trim();
      var art = e.art || 'sonstiges';
      if (art === 'feiertag' || art === 'ferien') {
        bericht.verworfen++;
        bericht.verworfeneArten[art] = (bericht.verworfeneArten[art] || 0) + 1;
        continue;
      }
      if (!etitel) { bericht.verworfen++; continue; }
      var schluessel = etitel + '|' + (e.von || '') + '|' + (e.bis || '');
      if (jtGesehen[schluessel]) { bericht.zusammengezogen++; continue; }
      jtGesehen[schluessel] = true;
      ziel.jahrestermine.push(stempelnMit({
        id: schluesselId('jt', schluessel),
        titel: etitel, art: art,
        von: e.von || '', bis: e.bis || e.von || '',
        jaehrlich: !!e.jaehrlich
      }));
      bericht.jahrestermine++;
    }
  }

  /* --- Durchgang 5: Ziele aus TimeAssist ------------------- */
  for (q = 0; q < quellen.length; q++) {
    var qz = quellen[q];
    if (qz.art !== 'timeassist') { continue; }
    var zl = qz.daten.ziele || [];
    for (i = 0; i < zl.length; i++) {
      var z = zl[i];
      var zname = (z.t || z.titel || '').trim();
      if (!zname || z.archiviert) { bericht.verworfen++; continue; }
      var zkontext = gruppenKontext(qz.daten, z.sphaere) || qz.kontext;
      ziel.ziele.push(stempelnMit({
        id: schluesselId('zl', 'ta|' + zname),
        name: zname, kontext: zkontext, beschreibung: '',
        zieltermin: deutschZuIso(z.frist), status: 'laufend',
        zielzustaende: [], einzahler: []
      }));
      bericht.ziele++;
    }
  }

  if (bericht.zusammengezogen) {
    bericht.hinweise.push(bericht.zusammengezogen
      + ' Einträge waren Dubletten oder erzeugte Wiederholungen und wurden zusammengezogen.');
  }
  if (bericht.regelnAus) {
    bericht.hinweise.push(bericht.regelnAus
      + ' Wiederholungsregeln ohne Wochentag wurden abgeschaltet.');
  }
  if (bericht.unbekannteBereiche.length) {
    bericht.hinweise.push('Nicht zugeordnete Bereiche wurden Themen: '
      + bericht.unbekannteBereiche.join(', '));
  }

  return { ziel: ziel, bericht: bericht };
}

function stempelnMit(satz) {
  satz.geaendert = jetzt();
  return satz;
}

/* TimeAssist führt den Kontext als Gruppe, nicht im Dateinamen. */
function gruppenKontext(daten, sphaere) {
  var gruppen = (daten && daten.gruppen) || [];
  var i;
  for (i = 0; i < gruppen.length; i++) {
    if (gruppen[i].id === sphaere) {
      var name = String(gruppen[i].name || '').toLowerCase();
      if (name.indexOf('privat') >= 0) { return 'privat'; }
      if (name.indexOf('beruf') >= 0) { return 'beruflich'; }
    }
  }
  return '';
}

/* TimeAssist speichert TT.MM.JJJJ */
function deutschZuIso(text) {
  if (!text) { return ''; }
  var m = String(text).match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (!m) { return String(text); }
  return m[3] + '-' + m[2] + '-' + m[1];
}

/* ------------------------------------------------------------
   Bedienung
   ------------------------------------------------------------ */

function migDateienGewaehlt(ereignis) {
  var dateien = ereignis && ereignis.target ? ereignis.target.files : null;
  if (!dateien || !dateien.length) { return; }
  migQuellen = [];
  migErgebnis = null;
  var offen = dateien.length;
  var i;
  for (i = 0; i < dateien.length; i++) {
    (function (datei) {
      var leser = new window.FileReader();
      leser.onload = function () {
        var daten = null;
        try { daten = JSON.parse(leser.result); } catch (e) { daten = null; }
        if (daten) {
          migQuellen.push({
            name: datei.name,
            art: quelleErkennen(datei.name, daten),
            kontext: kontextRaten(datei.name),
            daten: daten
          });
        } else {
          migQuellen.push({ name: datei.name, art: 'unlesbar', kontext: '', daten: {} });
        }
        offen--;
        if (offen === 0) { migFertigGelesen(); }
      };
      leser.onerror = function () {
        migQuellen.push({ name: datei.name, art: 'unlesbar', kontext: '', daten: {} });
        offen--;
        if (offen === 0) { migFertigGelesen(); }
      };
      leser.readAsText(datei);
    })(dateien[i]);
  }
}

function migFertigGelesen() {
  migZeichne();
  var gut = 0;
  var i;
  for (i = 0; i < migQuellen.length; i++) {
    if (migQuellen[i].art !== 'unlesbar' && migQuellen[i].art !== 'unbekannt') { gut++; }
  }
  melde(migQuellen.length + ' Datei(en) gelesen, davon ' + gut + ' verwertbar.\n'
      + 'Jetzt „Vorschau berechnen" antippen.', gut ? 'gut' : 'warn');
}

function migVorschau() {
  var brauchbar = [];
  var i;
  for (i = 0; i < migQuellen.length; i++) {
    if (migQuellen[i].art !== 'unlesbar' && migQuellen[i].art !== 'unbekannt') {
      brauchbar.push(migQuellen[i]);
    }
  }
  if (!migQuellen.length) {
    melde('Es ist noch keine Datei gewählt. Bitte oben die JSON-Dateien auswählen.', 'warn');
    return;
  }
  if (!brauchbar.length) {
    melde('Die gewählten Dateien wurden nicht erkannt.\n'
        + 'Erwartet werden WorkAssist- oder TimeAssist-Sicherungen.', 'warn');
    return;
  }
  try {
    migErgebnis = migrationRechnen(brauchbar);
  } catch (f) {
    migErgebnis = null;
    migZeichne();
    melde('Die Vorschau ist gescheitert.\n' + (f ? (f.message + '\n' + (f.stack || '')) : ''), 'warn');
    return;
  }
  migZeichne();
  var b = migErgebnis.bericht;
  melde('Vorschau aus ' + brauchbar.length + ' Datei(en) berechnet.\n'
      + b.aufgaben + ' Aufgaben · ' + b.themen + ' Themen · ' + b.projekte + ' Projekte · '
      + b.ziele + ' Ziele · ' + b.jahrestermine + ' Jahrestermine\n'
      + 'Es wurde noch nichts übernommen.', 'gut');
}

function migUebernehmen() {
  if (!migErgebnis) { melde('Bitte zuerst die Vorschau berechnen.', 'warn'); return; }
  var neu = migErgebnis.ziel;
  var zusammen = zusammenfuehren(DB, neu);
  DB = zusammen.db;
  bestandStempeln(DB);
  speichern().then(function () {
    melde('Übernommen und lokal gesichert.\n' + berichtText(zusammen.bericht)
        + '\nDer Altbestand bleibt unverändert.', 'gut');
    migErgebnis = null;
    migZeichne();
    zeichne();
  }).catch(function (f) {
    melde('Übernahme fehlgeschlagen.\n' + (f ? f.message : ''), 'warn');
  });
}

function migZeichne() {
  var qziel = document.getElementById('migQuellen');
  if (qziel) {
    var h = '';
    var i;
    if (!migQuellen.length) {
      h = '<div class="platzhalter">Noch keine Datei gewählt.</div>';
    }
    for (i = 0; i < migQuellen.length; i++) {
      var s = migQuellen[i];
      var brauchbarS = (s.art !== 'unlesbar' && s.art !== 'unbekannt');
      h += zeile(s.name, s.art + (s.kontext ? ' · ' + s.kontext : ''),
                 brauchbarS ? 'ja' : 'nein');
      h += zeile('&nbsp;&nbsp;enthält', quelleInhalt(s), 'grau');
    }
    qziel.innerHTML = h;
  }

  var bziel = document.getElementById('migBericht');
  if (bziel) {
    if (!migErgebnis) {
      bziel.innerHTML = '<div class="platzhalter">Noch keine Vorschau berechnet.</div>';
    } else {
      var b = migErgebnis.bericht;
      var t = '';
      t += zeile('Themen', String(b.themen), b.themen ? '' : 'grau');
      t += zeile('Projekte', String(b.projekte), b.projekte ? '' : 'grau');
      t += zeile('Ziele', String(b.ziele), b.ziele ? '' : 'grau');
      t += zeile('Aufgaben', String(b.aufgaben), b.aufgaben ? '' : 'grau');
      t += zeile('Ablauf-Vorlagen', String(b.ablaeufe), b.ablaeufe ? '' : 'grau');
      t += zeile('Einmalige Abläufe', String(b.durchlaeufe), b.durchlaeufe ? '' : 'grau');
      t += zeile('Jahrestermine', String(b.jahrestermine), b.jahrestermine ? '' : 'grau');
      t += zeile('Zusammengezogen', String(b.zusammengezogen), b.zusammengezogen ? '' : 'grau');
      t += zeile('Verworfen', String(b.verworfen), b.verworfen ? 'nein' : 'grau');
      t += zeile('Regeln abgeschaltet', String(b.regelnAus), b.regelnAus ? 'nein' : 'grau');
      var k;
      for (k in b.verworfeneArten) {
        if (Object.prototype.hasOwnProperty.call(b.verworfeneArten, k)) {
          t += zeile('davon Art „' + k + '"', String(b.verworfeneArten[k]), 'grau');
        }
      }
      var j;
      for (j = 0; j < b.hinweise.length; j++) {
        t += '<div class="melder">' + b.hinweise[j] + '</div>';
      }
      bziel.innerHTML = t;
    }
  }

  var ku = document.getElementById('knopfMigUebernehmen');
  if (ku) { ku.disabled = !migErgebnis; }
}


/* ============================================================
   Tagesplan
   ============================================================ */

var tagOffen = '';
var erledigtOffen = false;
var wartende = {};
var WARTEZEIT = 4000;
var speicherUhr = null;

var WOCHENTAGE_LANG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MONATE_LANG = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
                   'September','Oktober','November','Dezember'];

/* ------------------------------------------------------------
   Datum
   ------------------------------------------------------------ */

function ausIso(is) {
  var p = String(is).split('-');
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}

function tagePlus(is, n) {
  var d = ausIso(is);
  d.setDate(d.getDate() + n);
  return isoDatum(d);
}

/* Nie date(jahr, monat+1, 1) rechnen — der Monatsletzte kommt hierher. */
function monatsende(jahr, monat) {
  return new Date(jahr, monat, 0).getDate();
}

function kalenderwoche(is) {
  var d = ausIso(is);
  var ziel = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  ziel.setDate(ziel.getDate() + 3 - ((ziel.getDay() + 6) % 7));
  var ersterDonnerstag = new Date(ziel.getFullYear(), 0, 4);
  ersterDonnerstag.setDate(ersterDonnerstag.getDate() + 3 - ((ersterDonnerstag.getDay() + 6) % 7));
  return 1 + Math.round((ziel - ersterDonnerstag) / (7 * 86400000));
}

function ostern(j) {
  var a = j % 19, b = Math.floor(j / 100), c = j % 100;
  var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  var g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  var m = Math.floor((a + 11 * h + 22 * l) / 451);
  var monat = Math.floor((h + l - 7 * m + 114) / 31);
  var tag = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(j, monat - 1, tag);
}

function feiertageVon(jahr) {
  var o = ostern(jahr);
  function verschoben(n) {
    var d = new Date(o.getFullYear(), o.getMonth(), o.getDate() + n);
    return isoDatum(d);
  }
  var liste = {};
  liste[jahr + '-01-01'] = 'Neujahr';
  liste[jahr + '-01-06'] = 'Heilige Drei Könige';
  liste[verschoben(-2)] = 'Karfreitag';
  liste[verschoben(1)]  = 'Ostermontag';
  liste[jahr + '-05-01'] = 'Tag der Arbeit';
  liste[verschoben(39)] = 'Christi Himmelfahrt';
  liste[verschoben(50)] = 'Pfingstmontag';
  liste[verschoben(60)] = 'Fronleichnam';
  liste[jahr + '-08-15'] = 'Mariä Himmelfahrt';
  liste[jahr + '-10-03'] = 'Tag der Deutschen Einheit';
  liste[jahr + '-11-01'] = 'Allerheiligen';
  liste[jahr + '-12-25'] = '1. Weihnachtstag';
  liste[jahr + '-12-26'] = '2. Weihnachtstag';
  return liste;
}

var feiertagJahr = 0;
var feiertagListe = {};

function feiertagAn(is) {
  var jahr = Number(String(is).slice(0, 4));
  if (jahr !== feiertagJahr) {
    feiertagJahr = jahr;
    feiertagListe = feiertageVon(jahr);
  }
  return feiertagListe[is] || '';
}

function urlaubAn(is) {
  var jt = DB.jahrestermine || [];
  var i;
  for (i = 0; i < jt.length; i++) {
    if (jt[i].art !== 'urlaub') { continue; }
    if (is >= jt[i].von && is <= (jt[i].bis || jt[i].von)) { return jt[i].titel || 'Urlaub'; }
  }
  return '';
}

function tagesform(is) {
  var wt = ausIso(is).getDay();
  var fei = feiertagAn(is);
  var url = urlaubAn(is);
  if (wt === 0 || wt === 6) { return { form: 'Freizeittag', grund: 'Wochenende' }; }
  if (fei) { return { form: 'Freizeittag', grund: fei }; }
  if (url) { return { form: 'Freizeittag', grund: url }; }
  return { form: 'Arbeitstag', grund: '' };
}

/* ------------------------------------------------------------
   Wiederholungsregel: trifft sie an diesem Tag zu?
   ------------------------------------------------------------ */

function wochenIndex(is) {
  var d = ausIso(is);
  var tage = Math.floor(d.getTime() / 86400000);
  return Math.floor((tage + 3) / 7);   /* Woche beginnt am Montag */
}

function monatsIndex(is) {
  return Number(String(is).slice(0, 4)) * 12 + Number(String(is).slice(5, 7)) - 1;
}

function faelligAn(regel, is) {
  if (!regel) { return false; }
  var intervall = Number(regel.intervall) || 1;

  if (regel.takt === 'woche') {
    var tage = Array.isArray(regel.tage) ? regel.tage : [];
    if (!tage.length) { return false; }
    var wt = ausIso(is).getDay();
    if (tage.indexOf(wt) < 0) { return false; }
    if (intervall <= 1) { return true; }
    return (wochenIndex(is) % intervall) === 0;
  }

  if (regel.takt === 'monat') {
    var jahr = Number(String(is).slice(0, 4));
    var monat = Number(String(is).slice(5, 7));
    var tag = Number(String(is).slice(8, 10));
    var wunsch = Number(regel.tag) || 1;
    var letzter = monatsende(jahr, monat);
    if (wunsch > letzter) { wunsch = letzter; }
    if (tag !== wunsch) { return false; }
    if (intervall <= 1) { return true; }
    return (monatsIndex(is) % intervall) === 0;
  }
  return false;
}

/* ------------------------------------------------------------
   Auswahl der Einträge eines Tages
   ------------------------------------------------------------ */

function istErledigtAn(a, is) {
  if (a.wiederholung) { return a.zuletztErledigt === is; }
  return a.status === 'erledigt' && (!a.erledigtAm || a.erledigtAm === is);
}

function tagesEintraege(is) {
  var aufgaben = DB.aufgaben || [];
  var verlauf = [], wieder = [], haupt = [], klein = [], fertig = [];
  var i;

  for (i = 0; i < aufgaben.length; i++) {
    var a = aufgaben[i];
    var erledigt = istErledigtAn(a, is);

    if (a.wiederholung) {
      if (!faelligAn(a.wiederholung, is)) { continue; }
      if (erledigt) { fertig.push({ art: 'aufgabe', a: a }); }
      else { wieder.push(a); }
      continue;
    }

    if (a.status === 'erledigt') {
      if (a.erledigtAm === is) { fertig.push({ art: 'aufgabe', a: a }); }
      continue;
    }
    if (a.planung !== is) { continue; }

    if (a.uhrzeit) { verlauf.push({ art: 'aufgabe', zeit: a.uhrzeit, a: a }); }
    else if (a.art === 'klein') { klein.push(a); }
    else { haupt.push(a); }
  }

  var termine = DB.termine || [];
  for (i = 0; i < termine.length; i++) {
    if (termine[i].datum !== is) { continue; }
    verlauf.push({ art: 'termin', zeit: termine[i].von || '00:00', t: termine[i] });
  }

  /* Aus Google gelesen, nicht gespeichert. */
  var ausGoogle = termineFuerTag(is);
  for (i = 0; i < ausGoogle.zeit.length; i++) {
    var g = ausGoogle.zeit[i];
    verlauf.push({ art: 'termin', zeit: g.zeit || '00:00',
                   t: { titel: g.titel, von: g.zeit, bis: g.bis, ort: g.ort,
                        quelle: g.quelle, extern: true } });
  }

  verlauf.sort(function (x, y) { return (x.zeit < y.zeit) ? -1 : ((x.zeit > y.zeit) ? 1 : 0); });
  return { verlauf: verlauf, wieder: wieder, haupt: haupt, klein: klein, fertig: fertig };
}

/* ------------------------------------------------------------
   Zeichnen
   ------------------------------------------------------------ */

function ganztagsZeichnen(is) {
  var el = document.getElementById('tkGanztags');
  if (!el) { return; }
  var g = termineFuerTag(is).ganztags;
  if (!g.length) { el.classList.remove('sichtbar'); el.innerHTML = ''; return; }
  var namen = [];
  var i;
  for (i = 0; i < g.length; i++) { namen.push(esc(g[i].titel)); }
  el.innerHTML = '<b>Ganztägig:</b> ' + namen.join(' · ');
  el.classList.add('sichtbar');
}

function tagKopfZeichnen(is) {
  var d = ausIso(is);
  var f = tagesform(is);
  var z = document.getElementById('tkZahl');
  var w = document.getElementById('tkWochentag');
  var m = document.getElementById('tkMonat');
  var fo = document.getElementById('tkForm');
  if (z) { z.textContent = d.getDate(); }
  if (w) { w.textContent = WOCHENTAGE_LANG[d.getDay()]; }
  if (m) { m.textContent = MONATE_LANG[d.getMonth()] + ' ' + d.getFullYear()
                          + ' · KW ' + kalenderwoche(is); }
  if (fo) {
    fo.textContent = f.form;
    fo.className = 'tk-form' + (f.form === 'Freizeittag' ? ' frei' : '');
    fo.title = f.grund || '';
  }
}

function esc(text) {
  return String(text === null || text === undefined ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function metaZeile(a, is) {
  var teile = [];
  if (a.frist && !a.wiederholung) {
    var eilig = a.frist <= is;
    teile.push('<span class="' + (eilig ? 'eilig' : '') + '">Frist '
               + esc(kurzDatum(a.frist)) + '</span>');
  }
  var pj = projektName(a.projektId);
  if (pj) { teile.push(esc(pj)); }
  var th = themaName(a.themaId);
  if (th) { teile.push(esc(th)); }
  return teile.join(' · ');
}

function kurzDatum(is) {
  if (!is) { return ''; }
  var d = ausIso(is);
  return ['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.';
}

function projektName(id) {
  if (!id) { return ''; }
  var p = DB.projekte || [];
  var i;
  for (i = 0; i < p.length; i++) { if (p[i].id === id) { return p[i].name; } }
  return '';
}

function themaName(id) {
  if (!id) { return ''; }
  var t = DB.themen || [];
  var i;
  for (i = 0; i < t.length; i++) { if (t[i].id === id) { return t[i].name; } }
  return '';
}

function zeileHtml(a, is, kompakt) {
  var erledigt = istErledigtAn(a, is);
  var meta = metaZeile(a, is);
  var wdh = a.wiederholung ? ('zuletzt ' + (a.zuletztErledigt ? kurzDatum(a.zuletztErledigt) : 'nie')) : '';
  if (wdh) { meta = meta ? (meta + ' · ' + wdh) : wdh; }
  var h = '<div class="tzeile' + (kompakt ? ' kompakt' : '')
        + (a.kontext === 'privat' ? ' privat' : '')
        + (erledigt ? ' erledigt' : '') + '">';
  h += '<button class="tkasten' + (erledigt ? ' an' : '') + '" type="button" '
     + 'onclick="aufgabeHaken(\'' + esc(a.id) + '\')"></button>';
  h += '<div class="ttext" onclick="aufgabeAktionen(\'' + esc(a.id) + '\')">'
     + '<div class="ttitel">' + esc(a.titel) + '</div>';
  if (meta) { h += '<div class="tmeta">' + meta + '</div>'; }
  h += '</div></div>';
  return h;
}

function verlaufHtml(eintrag, is) {
  if (eintrag.art === 'termin') {
    var t = eintrag.t;
    var h = '<div class="tverlauf fest">';
    h += '<div class="tv-zeit">' + esc(t.von || '') + '</div><div class="tv-schiene"></div>';
    h += '<div class="tv-inhalt"><div class="ttitel">' + esc(t.titel) + '</div>';
    var unten = [];
    if (t.bis) { unten.push(esc(t.von) + '–' + esc(t.bis)); }
    if (t.ort) { unten.push(esc(t.ort)); }
    if (t.quelle) { unten.push(esc(t.quelle)); }
    if (unten.length) { h += '<div class="tmeta">' + unten.join(' · ') + '</div>'; }
    h += '</div></div>';
    return h;
  }
  var a = eintrag.a;
  var erledigt = istErledigtAn(a, is);
  var v = '<div class="tverlauf aufgabe' + (a.kontext === 'privat' ? ' privat' : '')
        + (erledigt ? ' erledigt' : '') + '">';
  v += '<div class="tv-zeit">' + esc(a.uhrzeit) + '</div><div class="tv-schiene"></div>';
  v += '<div class="tv-inhalt"><div class="tv-reihe">';
  v += '<button class="tkasten' + (erledigt ? ' an' : '') + '" type="button" '
     + 'onclick="aufgabeHaken(\'' + esc(a.id) + '\')"></button>';
  v += '<div class="ttext" onclick="aufgabeAktionen(\'' + esc(a.id) + '\')">'
     + '<div class="ttitel">' + esc(a.titel) + '</div></div>';
  v += '</div></div></div>';
  return v;
}

function tagZeichnen() {
  if (!tagOffen) { tagOffen = isoDatum(); }
  var is = tagOffen;
  tagKopfZeichnen(is);

  var blatt = document.getElementById('tagBlatt');
  if (!blatt) { return; }
  var e = tagesEintraege(is);
  var h = '';
  var i;

  h += '<div class="tabschnitt" data-kurz="Tagesverlauf"><div class="tabschnitt-titel">'
     + '<span>Tagesverlauf</span></div>';
  if (!e.verlauf.length) { h += '<div class="tleer">Nichts mit fester Zeit.</div>'; }
  for (i = 0; i < e.verlauf.length; i++) { h += verlaufHtml(e.verlauf[i], is); }
  h += '</div>';

  h += '<div class="tabschnitt" data-kurz="Wiederkehrend"><div class="tabschnitt-titel">'
     + '<span>Wiederkehrend</span></div>';
  if (!e.wieder.length) { h += '<div class="tleer">Heute nichts fällig.</div>'; }
  for (i = 0; i < e.wieder.length; i++) { h += zeileHtml(e.wieder[i], is, false); }
  h += '</div>';

  h += '<div class="tabschnitt" data-kurz="Aufgaben"><div class="tabschnitt-titel">'
     + '<span>Aufgaben</span></div>';
  if (!e.haupt.length) { h += '<div class="tleer">Für heute nichts eingeplant.</div>'; }
  for (i = 0; i < e.haupt.length; i++) { h += zeileHtml(e.haupt[i], is, false); }
  h += '</div>';

  h += '<div class="tabschnitt" data-kurz="Kleinigkeiten"><div class="tabschnitt-titel">'
     + '<span>Kleinigkeiten &amp; Kontakte</span></div>';
  if (!e.klein.length) { h += '<div class="tleer">Nichts offen.</div>'; }
  for (i = 0; i < e.klein.length; i++) { h += zeileHtml(e.klein[i], is, true); }
  h += '</div>';

  if (e.fertig.length) {
    h += '<div class="tabschnitt" data-kurz="Erledigt">';
    h += '<button class="tfalt" type="button" onclick="erledigtUm()">'
       + '<span>Erledigt · ' + e.fertig.length + '</span>'
       + '<svg class="' + (erledigtOffen ? 'auf' : '') + '" viewBox="0 0 24 24">'
       + '<path d="M6 9l6 6 6-6"></path></svg></button>';
    if (erledigtOffen) {
      for (i = 0; i < e.fertig.length; i++) { h += zeileHtml(e.fertig[i].a, is, true); }
    }
    h += '</div>';
  }

  blatt.innerHTML = h;
  ganztagsZeichnen(is);
  streifenPruefen();
  standZeichnen();
}

function erledigtUm() {
  erledigtOffen = !erledigtOffen;
  tagZeichnen();
}

/* ------------------------------------------------------------
   Lotsenstreifen
   ------------------------------------------------------------ */

function offeneImAbschnitt(abschnitt) {
  var zeilen = abschnitt.querySelectorAll('.tzeile, .tverlauf.aufgabe');
  var n = 0;
  var i;
  for (i = 0; i < zeilen.length; i++) {
    if (!zeilen[i].classList.contains('erledigt')) { n++; }
  }
  return n;
}

function angeschnittene() {
  var treffer = [];
  var blatt = document.getElementById('tagBlatt');
  if (!blatt) { return treffer; }
  var unten = blatt.getBoundingClientRect().bottom;
  var abschnitte = blatt.querySelectorAll('.tabschnitt');
  var i;
  for (i = 0; i < abschnitte.length; i++) {
    if (abschnitte[i].getBoundingClientRect().top > unten - 40) { treffer.push(abschnitte[i]); }
  }
  return treffer;
}

function streifenPruefen() {
  var streifen = document.getElementById('streifen');
  var text = document.getElementById('streifenText');
  if (!streifen || !text) { return; }
  var treffer = angeschnittene();
  var summe = 0;
  var namen = [];
  var i;
  for (i = 0; i < treffer.length; i++) {
    var n = offeneImAbschnitt(treffer[i]);
    if (n > 0) {
      summe += n;
      namen.push(treffer[i].dataset.kurz || 'Weiter unten');
    }
  }
  if (summe < 1) { streifen.classList.remove('sichtbar'); return; }
  text.textContent = namen.join(', ') + ' · ' + summe + ' offen';
  streifen.classList.add('sichtbar');
}

function zumOffenen() {
  var treffer = angeschnittene();
  if (treffer.length < 1) { return; }
  treffer[0].scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ------------------------------------------------------------
   Ändern
   ------------------------------------------------------------ */

function aufgabeFinden(id) {
  var a = DB.aufgaben || [];
  var i;
  for (i = 0; i < a.length; i++) { if (a[i].id === id) { return a[i]; } }
  return null;
}

function spaeterSichern() {
  if (speicherUhr) { window.clearTimeout(speicherUhr); }
  speicherUhr = window.setTimeout(function () {
    speicherUhr = null;
    lokalOffen = true;
    speichern().then(function () {
      zeichne();
      abgleichPlanen(false);
    }).catch(function () { return null; });
  }, 1500);
}

function aufgabeHaken(id) {
  var a = aufgabeFinden(id);
  if (!a) { return; }
  var is = tagOffen;

  if (a.wiederholung) {
    a.zuletztErledigt = (a.zuletztErledigt === is) ? null : is;
  } else if (a.status === 'erledigt') {
    a.status = 'offen';
    a.erledigtAm = null;
  } else {
    a.status = 'erledigt';
    a.erledigtAm = is;
  }
  a.geaendert = jetzt();

  /* Vier Sekunden Bedenkzeit: der Eintrag bleibt stehen und wandert
     erst danach in den Erledigt-Block. */
  if (wartende[id]) { window.clearTimeout(wartende[id]); }
  wartende[id] = window.setTimeout(function () {
    delete wartende[id];
    tagZeichnen();
  }, WARTEZEIT);

  zeileZustandSetzen(id, istErledigtAn(a, is));
  streifenPruefen();
  spaeterSichern();
}

function zeileZustandSetzen(id, erledigt) {
  var blatt = document.getElementById('tagBlatt');
  if (!blatt) { return; }
  var knoepfe = blatt.querySelectorAll('.tkasten');
  var i;
  for (i = 0; i < knoepfe.length; i++) {
    var auf = knoepfe[i].getAttribute('onclick') || '';
    if (auf.indexOf("'" + id + "'") < 0) { continue; }
    var zeile = knoepfe[i].closest('.tzeile') || knoepfe[i].closest('.tverlauf');
    if (erledigt) {
      knoepfe[i].classList.add('an');
      if (zeile) { zeile.classList.add('erledigt'); }
    } else {
      knoepfe[i].classList.remove('an');
      if (zeile) { zeile.classList.remove('erledigt'); }
    }
  }
}

/* ------------------------------------------------------------
   Aktionen an einer Aufgabe
   ------------------------------------------------------------ */

var aktionFuer = '';
var titelVorher = '';
var frischAngelegt = '';
var zurueckHolen = null;
var rueckUhr = null;
var RUECK_ZEIT = 8000;

function titelAendern(wert) {
  var a = aufgabeFinden(aktionFuer);
  if (!a) { return; }
  a.titel = wert;
  a.geaendert = jetzt();
  spaeterSichern();
}

function titelTaste(ereignis) {
  if (!ereignis || ereignis.key !== 'Enter') { return; }
  aktionenSchliessen();
}

function aktionenSchliessen() {
  var a = aufgabeFinden(aktionFuer);

  /* Eine gerade angelegte Aufgabe ohne Titel verschwindet wieder. */
  if (a && aktionFuer === frischAngelegt && String(a.titel).trim().length === 0) {
    var stelle = DB.aufgaben.indexOf(a);
    if (stelle >= 0) { DB.aufgaben.splice(stelle, 1); }
    grabsteinSetzen('aufgaben', a.id);
    a = null;
    spaeterSichern();
  }
  frischAngelegt = '';

  /* Ein leer geräumter Titel bei einer bestehenden Aufgabe fällt auf
     den Stand von vor dem Öffnen zurück. */
  if (a && String(a.titel).trim().length === 0) {
    a.titel = titelVorher;
    a.geaendert = jetzt();
    spaeterSichern();
  } else if (a) {
    var sauber = String(a.titel).trim();
    if (sauber !== a.titel) { a.titel = sauber; a.geaendert = jetzt(); spaeterSichern(); }
  }

  var sheet = document.getElementById('aktionSheet');
  var hg = document.getElementById('aktionHg');
  if (sheet) { sheet.classList.remove('auf'); }
  if (hg) { hg.classList.remove('auf'); }
  aktionFuer = '';
  titelVorher = '';
  tagZeichnen();
  aufZeichnen();
}

function aufgabeSchieben(n) {
  var a = aufgabeFinden(aktionFuer);
  if (!a) { return; }
  if (a.wiederholung) {
    melde('Eine wiederkehrende Aufgabe lässt sich nicht verschieben.', 'warn');
    aktionenSchliessen();
    return;
  }
  a.planung = tagePlus(a.planung && a.planung.length === 10 ? a.planung : tagOffen, n);
  a.geaendert = jetzt();
  aktionenSchliessen();
  spaeterSichern();
}

function aufgabeInsBacklog() {
  var a = aufgabeFinden(aktionFuer);
  if (!a) { return; }
  a.planung = 'backlog';
  a.geaendert = jetzt();
  aktionenSchliessen();
  spaeterSichern();
}

function aufgabeLoeschen() {
  var id = aktionFuer;
  var a = aufgabeFinden(id);
  if (!a) { return; }
  var stelle = DB.aufgaben.indexOf(a);
  if (stelle < 0) { return; }

  zurueckHolen = { satz: a, stelle: stelle };
  DB.aufgaben.splice(stelle, 1);
  grabsteinSetzen('aufgaben', id);

  aktionenSchliessen();
  zeichne();
  rueckZeigen(a.titel);
  spaeterSichern();
}

function rueckZeigen(titel) {
  var streifen = document.getElementById('rueckStreifen');
  var text = document.getElementById('rueckText');
  if (!streifen || !text) { return; }
  text.textContent = 'Gelöscht: ' + titel;
  streifen.classList.add('sichtbar');
  if (rueckUhr) { window.clearTimeout(rueckUhr); }
  rueckUhr = window.setTimeout(rueckVerbergen, RUECK_ZEIT);
}

function rueckVerbergen() {
  if (rueckUhr) { window.clearTimeout(rueckUhr); rueckUhr = null; }
  zurueckHolen = null;
  var streifen = document.getElementById('rueckStreifen');
  if (streifen) { streifen.classList.remove('sichtbar'); }
}

function rueckgaengig() {
  if (!zurueckHolen) { rueckVerbergen(); return; }
  var satz = zurueckHolen.satz;
  var stelle = zurueckHolen.stelle;
  if (stelle < 0 || stelle > DB.aufgaben.length) { stelle = DB.aufgaben.length; }
  DB.aufgaben.splice(stelle, 0, satz);

  /* Der Löschvermerk muss weg, sonst entfernt ihn der nächste Abgleich erneut. */
  var steine = DB.grabsteine || [];
  var i;
  for (i = steine.length - 1; i >= 0; i--) {
    if (steine[i].s === 'aufgaben' && steine[i].id === satz.id) { steine.splice(i, 1); }
  }
  satz.geaendert = jetzt();

  rueckVerbergen();
  tagZeichnen();
  aufZeichnen();
  zeichne();
  spaeterSichern();
  melde('Wiederhergestellt: ' + satz.titel, 'gut');
}


/* ============================================================
   Detailfläche einer Aufgabe

   Sie wird aus dem Tag und aus der Aufgabenfläche geöffnet und
   trägt alle Felder. Änderungen wirken sofort auf den Bestand.
   ============================================================ */

var TAKTE_TAGE = [[1, 'Mo'], [2, 'Di'], [3, 'Mi'], [4, 'Do'], [5, 'Fr'], [6, 'Sa'], [0, 'So']];
var TEILE = [];

function neueRegel(takt) {
  return { takt: takt, intervall: 1, tage: [1], tag: 1 };
}

function aufgabeAktionen(id) {
  var a = aufgabeFinden(id);
  if (!a) { return; }
  aktionFuer = id;
  titelVorher = a.titel;
  TEILE = [''];
  var sheet = document.getElementById('aktionSheet');
  var hg = document.getElementById('aktionHg');
  if (!sheet || !hg) { return; }
  sheet.innerHTML = detailHtml(a);
  sheet.classList.add('auf');
  hg.classList.add('auf');
}

function detailHtml(a) {
  var h = '<div class="as-griff"></div>';
  h += '<input class="as-titelfeld" id="asTitel" type="text" value="' + esc(a.titel) + '" '
     + 'oninput="titelAendern(this.value)" onkeydown="titelTaste(event)">';
  h += '<div class="as-linie' + (a.kontext === 'privat' ? ' privat' : '') + '"></div>';

  h += '<div class="d-feld"><div class="d-name">Kontext</div><div class="d-wert">';
  h += '<button class="d-wahl' + (a.kontext === 'beruflich' ? ' an' : '') + '" type="button" '
     + 'onclick="dKontext(\'beruflich\')">Beruflich</button>';
  h += '<button class="d-wahl' + (a.kontext === 'privat' ? ' an' : '') + '" type="button" '
     + 'onclick="dKontext(\'privat\')">Privat</button>';
  h += '</div></div>';

  h += '<div class="d-feld"><div class="d-name">Art</div><div class="d-wert">';
  h += '<button class="d-wahl' + (a.art !== 'klein' ? ' an' : '') + '" type="button" '
     + 'onclick="dArt(\'haupt\')">Aufgabe</button>';
  h += '<button class="d-wahl' + (a.art === 'klein' ? ' an' : '') + '" type="button" '
     + 'onclick="dArt(\'klein\')">Kleinigkeit</button>';
  h += '</div></div>';

  h += '<div class="d-feld"><div class="d-name">Thema</div><div class="d-wert">';
  h += '<select onchange="dThema(this.value)"><option value="">kein Thema</option>';
  var themen = themenFuer(a.kontext);
  var i;
  for (i = 0; i < themen.length; i++) {
    h += '<option value="' + esc(themen[i].id) + '"'
       + (a.themaId === themen[i].id ? ' selected' : '') + '>' + esc(themen[i].name) + '</option>';
  }
  h += '</select>';
  h += '<button class="d-plus" type="button" onclick="themaNeuZeigen()">Neu</button>';
  h += '</div></div>';
  h += '<div class="d-neu" id="themaNeu">';
  h += '<input type="text" id="themaNeuName" placeholder="Name des Themas">';
  h += '<div class="d-reihe"><button type="button" onclick="themaAnlegen()">Anlegen</button></div>';
  h += '</div>';

  h += '<div class="d-feld"><div class="d-name">Projekt</div><div class="d-wert">';
  h += '<select onchange="dProjekt(this.value)"><option value="">kein Projekt</option>';
  var projekte = projekteFuer(a.kontext);
  for (i = 0; i < projekte.length; i++) {
    h += '<option value="' + esc(projekte[i].id) + '"'
       + (a.projektId === projekte[i].id ? ' selected' : '') + '>'
       + esc(projekte[i].name) + '</option>';
  }
  h += '</select></div></div>';

  if (a.wiederholung) {
    h += '<div class="d-feld"><div class="d-name">Frist</div><div class="d-wert">';
    h += '<span class="d-hinweis">entscheidet die Regel</span>';
    h += '</div></div>';
  } else {
    h += '<div class="d-feld"><div class="d-name">Frist</div><div class="d-wert">';
    h += '<input type="date" value="' + esc(a.frist || '') + '" onchange="dFrist(this.value)">';
    h += '</div></div>';
  }

  var istTag = a.planung && a.planung !== 'backlog' && a.planung !== 'woche';
  h += '<div class="d-feld"><div class="d-name">Planung</div><div class="d-wert">';
  h += '<button class="d-wahl' + ((!a.planung || a.planung === 'backlog') ? ' an' : '')
     + '" type="button" onclick="dPlanung(\'backlog\')">Backlog</button>';
  h += '<button class="d-wahl' + (a.planung === 'woche' ? ' an' : '')
     + '" type="button" onclick="dPlanung(\'woche\')">Woche</button>';
  h += '<input type="date" value="' + esc(istTag ? a.planung : '') + '" '
     + 'onchange="dPlanung(this.value)">';
  h += '</div></div>';

  h += '<div class="d-feld"><div class="d-name">Uhrzeit</div><div class="d-wert">';
  h += '<input type="time" value="' + esc(a.uhrzeit || '') + '" onchange="dZeit(this.value)">';
  h += '</div></div>';

  var w = a.wiederholung;
  h += '<div class="d-feld"><div class="d-name">Wiederholt</div><div class="d-wert">';
  h += '<button class="d-wahl' + (w ? '' : ' an') + '" type="button" '
     + 'onclick="dWdh(\'\')">nein</button>';
  h += '<button class="d-wahl' + ((w && w.takt === 'woche') ? ' an' : '') + '" type="button" '
     + 'onclick="dWdh(\'woche\')">wöchentlich</button>';
  h += '<button class="d-wahl' + ((w && w.takt === 'monat') ? ' an' : '') + '" type="button" '
     + 'onclick="dWdh(\'monat\')">monatlich</button>';
  h += '</div></div>';

  if (w) {
    var einheit = (w.takt === 'woche') ? 'Woche' : 'Monat';
    h += '<div class="d-feld"><div class="d-name">Intervall</div><div class="d-wert">';
    var n;
    for (n = 1; n <= 4; n++) {
      var wort = (n === 1) ? ('jede' + (einheit === 'Monat' ? 'n' : '')) : (n + '.');
      h += '<button class="d-wahl' + (Number(w.intervall) === n ? ' an' : '') + '" type="button" '
         + 'onclick="dWdhIntervall(' + n + ')">' + wort + '</button>';
    }
    h += '</div></div>';

    if (w.takt === 'woche') {
      h += '<div class="d-feld"><div class="d-name">Wochentage</div><div class="d-wert">';
      var t;
      for (t = 0; t < TAKTE_TAGE.length; t++) {
        var nr = TAKTE_TAGE[t][0];
        h += '<button class="d-tag' + ((w.tage || []).indexOf(nr) >= 0 ? ' an' : '')
           + '" type="button" onclick="dWdhTag(' + nr + ')">' + TAKTE_TAGE[t][1] + '</button>';
      }
      h += '</div></div>';
    } else {
      h += '<div class="d-feld"><div class="d-name">Tag im Monat</div><div class="d-wert">';
      h += '<input type="number" min="1" max="31" value="' + esc(String(w.tag))
         + '" onchange="dWdhMonatstag(this.value)"></div></div>';
      if (Number(w.tag) > 28) {
        h += '<div class="d-hinweis">In kürzeren Monaten am Monatsletzten.</div>';
      }
    }
    h += '<div class="d-hinweis">' + esc(regelText(w)) + '</div>';
  }

  h += '<textarea class="d-text" placeholder="Beschreibung …" '
     + 'oninput="dBeschreibung(this.value)">' + esc(a.beschreibung || '') + '</textarea>';

  h += '<div class="d-reihe">';
  h += '<button type="button" onclick="aufgabeSchieben(1)">Auf morgen</button>';
  h += '<button type="button" onclick="aufgabeInsBacklog()">Ins Backlog</button>';
  h += '</div>';
  h += '<div class="d-reihe">';
  h += '<button type="button" onclick="teilenZeigen()">Aufteilen</button>';
  h += '<button type="button" class="gefahr" onclick="aufgabeLoeschen()">Löschen</button>';
  h += '</div>';

  h += '<div class="d-neu" id="teilen">';
  h += '<div id="teilfelder"><input type="text" placeholder="Erste Aufgabe" '
     + 'oninput="teilenTippen(0,this.value)"></div>';
  h += '<div class="d-reihe"><button type="button" onclick="teilenUebernehmen()">'
     + 'Übernehmen</button></div>';
  h += '</div>';

  var hist = [];
  if (a.zuletztErledigt) { hist.push('zuletzt erledigt ' + kurzDatum(a.zuletztErledigt)); }
  if (a.erledigtAm) { hist.push('erledigt am ' + kurzDatum(a.erledigtAm)); }
  if (hist.length) { h += '<div class="d-hist">' + esc(hist.join(' · ')) + '</div>'; }
  return h;
}

function detailNeuZeichnen() {
  var a = aufgabeFinden(aktionFuer);
  var sheet = document.getElementById('aktionSheet');
  if (!a || !sheet) { return; }
  sheet.innerHTML = detailHtml(a);
}

function detailGeaendert(neuZeichnen) {
  var a = aufgabeFinden(aktionFuer);
  if (!a) { return; }
  a.geaendert = jetzt();
  spaeterSichern();
  if (neuZeichnen) { detailNeuZeichnen(); }
}

function dKontext(wert) {
  var a = aufgabeFinden(aktionFuer);
  if (!a) { return; }
  a.kontext = wert;
  /* Thema und Projekt gehören zu genau einem Kontext. */
  if (a.themaId && themaKontext(a.themaId) !== wert) { a.themaId = null; }
  if (a.projektId && projektKontext(a.projektId) !== wert) { a.projektId = null; }
  detailGeaendert(true);
}

function themaKontext(id) {
  var t = DB.themen || [];
  var i;
  for (i = 0; i < t.length; i++) { if (t[i].id === id) { return t[i].kontext; } }
  return '';
}

function projektKontext(id) {
  var p = DB.projekte || [];
  var i;
  for (i = 0; i < p.length; i++) { if (p[i].id === id) { return p[i].kontext; } }
  return '';
}

function dArt(wert)          { var a = aufgabeFinden(aktionFuer); if (a) { a.art = wert; detailGeaendert(true); } }
function dThema(wert)        { var a = aufgabeFinden(aktionFuer); if (a) { a.themaId = wert || null; detailGeaendert(false); } }
function dProjekt(wert)      { var a = aufgabeFinden(aktionFuer); if (a) { a.projektId = wert || null; detailGeaendert(false); } }
function dFrist(wert)        { var a = aufgabeFinden(aktionFuer); if (a) { a.frist = wert || ''; detailGeaendert(false); } }
function dZeit(wert)         { var a = aufgabeFinden(aktionFuer); if (a) { a.uhrzeit = wert || ''; detailGeaendert(false); } }
function dBeschreibung(wert) { var a = aufgabeFinden(aktionFuer); if (a) { a.beschreibung = wert; detailGeaendert(false); } }

function dPlanung(wert) {
  var a = aufgabeFinden(aktionFuer);
  if (!a || !wert) { return; }
  a.planung = wert;
  detailGeaendert(true);
}

function dWdh(takt) {
  var a = aufgabeFinden(aktionFuer);
  if (!a) { return; }
  if (!takt) { a.wiederholung = null; }
  else if (a.wiederholung) { a.wiederholung.takt = takt; }
  else { a.wiederholung = neueRegel(takt); }
  if (a.wiederholung) { a.frist = ''; }
  detailGeaendert(true);
}

function dWdhIntervall(n) {
  var a = aufgabeFinden(aktionFuer);
  if (!a || !a.wiederholung) { return; }
  a.wiederholung.intervall = n;
  detailGeaendert(true);
}

function dWdhTag(nr) {
  var a = aufgabeFinden(aktionFuer);
  if (!a || !a.wiederholung) { return; }
  var tage = a.wiederholung.tage || [];
  var i = tage.indexOf(nr);
  if (i >= 0) { tage.splice(i, 1); } else { tage.push(nr); }
  a.wiederholung.tage = tage;
  /* Eine Regel ohne Wochentag träfe nie zu — dann gibt es sie nicht. */
  if (a.wiederholung.takt === 'woche' && tage.length === 0) { a.wiederholung = null; }
  detailGeaendert(true);
}

function dWdhMonatstag(wert) {
  var a = aufgabeFinden(aktionFuer);
  if (!a || !a.wiederholung) { return; }
  var n = Number(wert);
  if (!(n >= 1 && n <= 31)) { return; }
  a.wiederholung.tag = n;
  detailGeaendert(true);
}

function themaNeuZeigen() {
  var f = document.getElementById('themaNeu');
  if (f) { f.classList.toggle('auf'); }
}

function themaAnlegen() {
  var el = document.getElementById('themaNeuName');
  var a = aufgabeFinden(aktionFuer);
  if (!el || !a) { return; }
  var name = el.value.trim();
  if (name.length === 0) { return; }
  var vorhanden = themenFuer(a.kontext);
  var i;
  for (i = 0; i < vorhanden.length; i++) {
    if (vorhanden[i].name === name) { a.themaId = vorhanden[i].id; detailGeaendert(true); return; }
  }
  var neu = { id: neueKennung(), name: name, kontext: a.kontext, geaendert: jetzt() };
  DB.themen.push(neu);
  a.themaId = neu.id;
  detailGeaendert(true);
}

function teilenZeigen() {
  var t = document.getElementById('teilen');
  if (t) { t.classList.toggle('auf'); }
}

function teilenTippen(i, wert) {
  TEILE[i] = wert;
  if (i !== TEILE.length - 1) { return; }
  if (String(wert).trim().length === 0) { return; }
  TEILE.push('');
  var behaelter = document.getElementById('teilfelder');
  if (!behaelter) { return; }
  var feld = document.createElement('input');
  feld.type = 'text';
  feld.placeholder = 'Weitere Aufgabe';
  feld.setAttribute('oninput', 'teilenTippen(' + (TEILE.length - 1) + ',this.value)');
  behaelter.appendChild(feld);
}

function teilenUebernehmen() {
  var vorlage = aufgabeFinden(aktionFuer);
  if (!vorlage) { return; }
  var neue = [];
  var i;
  for (i = 0; i < TEILE.length; i++) {
    var wert = TEILE[i] ? String(TEILE[i]).trim() : '';
    if (wert.length === 0) { continue; }
    neue.push({
      id: neueKennung(), titel: wert, beschreibung: '', kontext: vorlage.kontext,
      themaId: vorlage.themaId, projektId: vorlage.projektId, frist: vorlage.frist,
      planung: vorlage.planung, uhrzeit: '', art: vorlage.art, wiederholung: null,
      status: 'offen', erledigtAm: null, zuletztErledigt: null, ablaufSchritt: null,
      geaendert: jetzt()
    });
  }
  if (!neue.length) { return; }

  var stelle = DB.aufgaben.indexOf(vorlage);
  if (stelle >= 0) { DB.aufgaben.splice(stelle, 1); }
  grabsteinSetzen('aufgaben', vorlage.id);
  DB.aufgaben = DB.aufgaben.concat(neue);

  aktionenSchliessen();
  aufZeichnen();
  zeichne();
  spaeterSichern();
  melde('Aus einer Aufgabe wurden ' + neue.length + '.', 'gut');
}

/* ------------------------------------------------------------
   Schnelleingabe
   ------------------------------------------------------------ */

function eingabeDeuten(text) {
  var roh = String(text).trim();
  var haupt = false;
  var privat = false;
  if (roh.charAt(0) === '!') { haupt = true; roh = roh.slice(1).trim(); }
  var worte = roh.split(/\s+/);
  var letztes = worte.length ? worte[worte.length - 1].toLowerCase() : '';
  if (letztes === 'p' || letztes === 'privat') {
    privat = true;
    worte.pop();
    roh = worte.join(' ');
  }
  return {
    titel: roh,
    art: haupt ? 'haupt' : 'klein',
    kontext: privat ? 'privat' : 'beruflich'
  };
}

function schnellVorschau() {
  var feld = document.getElementById('schnellFeld');
  var box = document.getElementById('schnellVorschauZeile');
  if (!feld || !box) { return; }
  var wert = feld.value.trim();
  if (wert.length === 0) { box.classList.remove('sichtbar'); box.innerHTML = ''; return; }
  var d = eingabeDeuten(wert);
  box.innerHTML = 'wird angelegt als <b>' + (d.art === 'haupt' ? 'Aufgabe' : 'Kleinigkeit')
                + '</b> · <b>' + esc(kurzDatum(tagOffen)) + '</b> · <b>' + d.kontext + '</b>';
  box.classList.add('sichtbar');
}

function schnellTaste(ereignis) {
  if (!ereignis || ereignis.key !== 'Enter') { return; }
  schnellAnlegen();
}

function schnellAnlegen() {
  var feld = document.getElementById('schnellFeld');
  if (!feld) { return; }
  var wert = feld.value.trim();
  if (wert.length === 0) { return; }
  var d = eingabeDeuten(wert);
  if (!d.titel) { return; }
  DB.aufgaben.push({
    id: neueKennung(),
    titel: d.titel,
    beschreibung: '',
    kontext: d.kontext,
    themaId: null,
    projektId: null,
    frist: '',
    planung: tagOffen,
    uhrzeit: '',
    art: d.art,
    wiederholung: null,
    status: 'offen',
    erledigtAm: null,
    zuletztErledigt: null,
    ablaufSchritt: null,
    geaendert: jetzt()
  });
  feld.value = '';
  schnellVorschau();
  tagZeichnen();
  zeichne();
  spaeterSichern();
}

/* ------------------------------------------------------------
   Blättern
   ------------------------------------------------------------ */

function tagBlaettern(n) {
  tagOffen = tagePlus(tagOffen || isoDatum(), n);
  erledigtOffen = false;
  tagZeichnen();
}

function tagHeute() {
  tagOffen = isoDatum();
  erledigtOffen = false;
  tagZeichnen();
}

/* ============================================================
   Bedienung
   ============================================================ */

function dateiWaehlen() {
  if (!fsApiDa()) {
    melde('Dieser Browser kennt die Datei-Schnittstelle nicht. '
        + 'Es wird ' + (opfsDa() ? 'der geräteeigene Speicher' : 'der lokale Speicher') + ' benutzt.', 'warn');
    return;
  }
  window.showOpenFilePicker({
    multiple: false,
    types: [{ description: 'Workbench-Daten', accept: { 'application/json': ['.json'] } }]
  }).then(function (liste) {
    dateiHandle = liste[0];
    dateiName = dateiHandle.name;
    return rechteAnfragen(dateiHandle);
  }).then(function (stand) {
    rechteStand = stand;
    if (stand !== 'granted') {
      melde('Zugriff auf die Datei wurde nicht erteilt.', 'warn');
      zeichne();
      return null;
    }
    return idbSchreiben(IDB_KEY, dateiHandle).then(function () { return laden(); });
  }).then(function (weg) {
    if (weg) {
      melde('Datei geöffnet und gelesen: ' + dateiName + '\nSpeicherweg: ' + wegText(weg), 'gut');
    }
    zeichne();
  }).catch(function (f) {
    if (f && f.name === 'AbortError') { melde('Auswahl abgebrochen.'); return; }
    melde('Datei konnte nicht geöffnet werden.\n' + (f ? f.message : ''), 'warn');
  });
}

function dateiAnlegen() {
  if (typeof window.showSaveFilePicker !== 'function') {
    melde('Dieser Browser kann keine Datei anlegen. Es wird intern gespeichert.', 'warn');
    return;
  }
  window.showSaveFilePicker({
    suggestedName: DATEINAME,
    types: [{ description: 'Workbench-Daten', accept: { 'application/json': ['.json'] } }]
  }).then(function (handle) {
    dateiHandle = handle;
    dateiName = handle.name;
    return rechteAnfragen(dateiHandle);
  }).then(function (stand) {
    rechteStand = stand;
    if (stand !== 'granted') {
      melde('Schreibrecht wurde nicht erteilt.', 'warn');
      zeichne();
      return null;
    }
    speicherWeg = 'datei';
    return idbSchreiben(IDB_KEY, dateiHandle).then(function () { return speichern(); });
  }).then(function (weg) {
    if (weg) { melde('Datei angelegt: ' + dateiName, 'gut'); }
    zeichne();
  }).catch(function (f) {
    if (f && f.name === 'AbortError') { melde('Anlegen abgebrochen.'); return; }
    melde('Datei konnte nicht angelegt werden.\n' + (f ? f.message : ''), 'warn');
  });
}

function zugriffErlauben() {
  if (!dateiHandle) { melde('Es ist keine Datei hinterlegt.', 'warn'); return; }
  rechteAnfragen(dateiHandle).then(function (stand) {
    rechteStand = stand;
    if (stand === 'granted') {
      speicherWeg = 'datei';
      return laden().then(function () {
        melde('Zugriff erteilt, Datei gelesen.', 'gut');
      });
    }
    melde('Zugriff wurde abgelehnt.', 'warn');
    return null;
  }).then(zeichne);
}

function speichernJetzt() {
  speichern().then(function (weg) {
    melde('Gespeichert über: ' + wegText(weg) + '\n' + letzterSchreibvorgang, 'gut');
    zeichne();
  }).catch(function (f) {
    melde('Speichern fehlgeschlagen.\n' + (f ? f.message : ''), 'warn');
    zeichne();
  });
}

function ladenJetzt() {
  laden().then(function (weg) {
    if (weg) { melde('Gelesen über: ' + wegText(weg), 'gut'); }
    else { melde('Nichts zu lesen — der Bestand ist leer.', null); }
    zeichne();
  }).catch(function (f) {
    melde('Laden fehlgeschlagen.\n' + (f ? f.message : ''), 'warn');
    zeichne();
  });
}

function handleVergessen() {
  dateiHandle = null;
  dateiName = '';
  rechteStand = 'unbekannt';
  speicherWeg = opfsDa() ? 'opfs' : (localDa() ? 'local' : 'keiner');
  idbLoeschen(IDB_KEY).catch(function () { return null; }).then(function () {
    melde('Die Verbindung zur Datei wurde gelöst. Die Daten bleiben erhalten.', null);
    zeichne();
  });
}

function zeigeSchirm(name) {
  schirmOffen = name;
  var alle = ['Tag', 'Aufgaben', 'Migration', 'Diagnose'];
  var i;
  for (i = 0; i < alle.length; i++) {
    var s = document.getElementById('schirm' + alle[i]);
    var n = document.getElementById('nav' + alle[i]);
    if (s) {
      if (alle[i] === name) { s.classList.add('aktiv'); } else { s.classList.remove('aktiv'); }
    }
    if (n) {
      if (alle[i] === name) { n.classList.add('aktiv'); } else { n.classList.remove('aktiv'); }
    }
  }
  var titel = document.getElementById('kopfTitel');
  if (titel) { titel.textContent = name; }
  if (name === 'Migration') { migZeichne(); }
  if (name === 'Tag') { tagZeichnen(); }
  if (name === 'Aufgaben') { aufZeichnen(); }
  if (name !== 'Aufgaben') { zeichne(); }
}
