/* ============================================================
   Google Kalender — nur lesen

   Termine gehören Google. Die App holt sie in ein Fenster um den
   heutigen Tag und hält sie nur im Arbeitsspeicher: Sie werden nie
   in die eigene Datei geschrieben, sonst gäbe es zwei Wahrheiten.
   ============================================================ */

var KAL_VOR = 21;      /* Tage rückwärts */
var KAL_NACH = 120;    /* Tage vorwärts */
var KAL_TAKT = 10 * 60 * 1000;

var kalenderListe = [];      /* {id, name, farbe} */
var termineNachTag = {};     /* iso -> [{zeit, bis, titel, ort, ganztags, quelle, id}] */
var kalenderStand = '';
var kalenderFehler = '';
var kalenderLaeuft = false;
var kalenderUhr = null;

function kalenderAktiv() {
  var gewaehlt = (DB.einstellungen && DB.einstellungen.kalender) || [];
  if (!gewaehlt.length) { return kalenderListe; }
  var aus = [];
  var i, j;
  for (i = 0; i < kalenderListe.length; i++) {
    for (j = 0; j < gewaehlt.length; j++) {
      if (gewaehlt[j].id === kalenderListe[i].id && gewaehlt[j].aktiv !== false) {
        aus.push(kalenderListe[i]);
      }
    }
  }
  return aus;
}

function kalenderGewaehlt(id) {
  var gewaehlt = (DB.einstellungen && DB.einstellungen.kalender) || [];
  var i;
  for (i = 0; i < gewaehlt.length; i++) {
    if (gewaehlt[i].id === id) { return gewaehlt[i].aktiv !== false; }
  }
  return true;   /* noch nie entschieden: lesen */
}

function kalenderUm(id, name) {
  if (!DB.einstellungen.kalender) { DB.einstellungen.kalender = []; }
  var liste = DB.einstellungen.kalender;
  var i;
  for (i = 0; i < liste.length; i++) {
    if (liste[i].id === id) {
      liste[i].aktiv = (liste[i].aktiv === false);
      DB.einstellungen.stempel = jetzt();
      spaeterSichern();
      termineHolen(true);
      zeichne();
      return;
    }
  }
  liste.push({ id: id, name: name || '', aktiv: false });
  DB.einstellungen.stempel = jetzt();
  spaeterSichern();
  termineHolen(true);
  zeichne();
}

function kalenderListeHolen() {
  if (!tokenGueltig()) { return Promise.resolve([]); }
  var adresse = 'https://www.googleapis.com/calendar/v3/users/me/calendarList'
              + '?fields=' + encodeURIComponent('items(id,summary,backgroundColor,selected)')
              + '&maxResults=50';
  return window.fetch(adresse, { headers: driveKopf() })
    .then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      var roh = (d && d.items) ? d.items : [];
      kalenderListe = [];
      var i;
      for (i = 0; i < roh.length; i++) {
        kalenderListe.push({
          id: roh[i].id,
          name: roh[i].summary || roh[i].id,
          farbe: roh[i].backgroundColor || ''
        });
      }
      return kalenderListe;
    });
}

function zeitAusEintrag(wert) {
  /* Google liefert dateTime mit Zeitzone. Die lokale Uhrzeit ist das,
     was auf dem Blatt stehen soll. */
  if (typeof wert !== 'string' || wert.length === 0) { return ''; }
  var d = new Date(wert);
  if (isNaN(d.getTime())) { return ''; }
  return zwei(d.getHours()) + ':' + zwei(d.getMinutes());
}

function tagAusEintrag(wert) {
  if (typeof wert !== 'string' || wert.length === 0) { return ''; }
  var d = new Date(wert);
  if (isNaN(d.getTime())) { return ''; }
  return isoDatum(d);
}

function eintraegeEinsortieren(eintraege, quelle) {
  var i;
  for (i = 0; i < eintraege.length; i++) {
    var e = eintraege[i];
    if (e.status === 'cancelled') { continue; }
    var titel = e.summary || '(ohne Titel)';

    if (e.start && e.start.date) {
      /* Ganztägig: das Ende ist bei Google der Folgetag. */
      var von = e.start.date;
      var bis = e.end && e.end.date ? tagePlus(e.end.date, -1) : von;
      var lauf = von;
      var schutz = 0;
      while (lauf <= bis && schutz < 400) {
        merkeTermin(lauf, { id: e.id, titel: titel, zeit: '', bis: '',
                            ort: e.location || '', ganztags: true, quelle: quelle });
        lauf = tagePlus(lauf, 1);
        schutz++;
      }
      continue;
    }

    if (!e.start || !e.start.dateTime) { continue; }
    var tag = tagAusEintrag(e.start.dateTime);
    if (!tag) { continue; }
    merkeTermin(tag, {
      id: e.id, titel: titel,
      zeit: zeitAusEintrag(e.start.dateTime),
      bis: e.end && e.end.dateTime ? zeitAusEintrag(e.end.dateTime) : '',
      ort: e.location || '', ganztags: false, quelle: quelle
    });
  }
}

function merkeTermin(tag, satz) {
  if (!termineNachTag[tag]) { termineNachTag[tag] = []; }
  var vorhanden = termineNachTag[tag];
  var i;
  for (i = 0; i < vorhanden.length; i++) {
    if (vorhanden[i].id === satz.id) { return; }
  }
  vorhanden.push(satz);
}

function termineHolen(laut) {
  if (!tokenGueltig()) { return Promise.resolve(false); }
  if (kalenderLaeuft) { return Promise.resolve(false); }
  kalenderLaeuft = true;
  kalenderFehler = '';

  var heute = isoDatum();
  var von = tagePlus(heute, -KAL_VOR);
  var bis = tagePlus(heute, KAL_NACH);

  var vorbereitung = kalenderListe.length ? Promise.resolve(kalenderListe)
                                          : kalenderListeHolen();

  return vorbereitung.then(function () {
    var aktive = [];
    var i;
    for (i = 0; i < kalenderListe.length; i++) {
      if (kalenderGewaehlt(kalenderListe[i].id)) { aktive.push(kalenderListe[i]); }
    }
    termineNachTag = {};
    var reihe = Promise.resolve(true);
    aktive.forEach(function (kal) {
      reihe = reihe.then(function () { return einenKalenderHolen(kal, von, bis); });
    });
    return reihe;
  }).then(function () {
    kalenderStand = isoZeit();
    if (!kalenderFehler && laut) {
      melde('Termine geholt: ' + termineZahl() + ' im Fenster.', 'gut');
    } else if (kalenderFehler && laut) {
      melde('Termine teilweise geholt.\n' + kalenderFehler, 'warn');
    }
    tagZeichnen();
    zeichne();
    return true;
  }).catch(function (f) {
    kalenderFehler = f ? f.message : 'unbekannter Fehler';
    if (laut) { melde('Termine konnten nicht geholt werden.\n' + kalenderFehler, 'warn'); }
    zeichne();
    return false;
  }).then(function (wert) {
    kalenderLaeuft = false;
    return wert;
  });
}

function einenKalenderHolen(kal, von, bis) {
  var adresse = 'https://www.googleapis.com/calendar/v3/calendars/'
              + encodeURIComponent(kal.id) + '/events'
              + '?singleEvents=true&orderBy=startTime&maxResults=250'
              + '&timeMin=' + encodeURIComponent(von + 'T00:00:00Z')
              + '&timeMax=' + encodeURIComponent(bis + 'T23:59:59Z')
              + '&fields=' + encodeURIComponent('items(id,summary,location,status,start,end)');
  return window.fetch(adresse, { headers: driveKopf() })
    .then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      eintraegeEinsortieren((d && d.items) ? d.items : [], kal.name);
      return true;
    }).catch(function (f) {
      /* Ein einzelner Kalender darf nicht die anderen verhindern. */
      kalenderFehler = kal.name + ': ' + (f ? f.message : 'Fehler');
      return true;
    });
}

function termineZahl() {
  var n = 0;
  var k;
  for (k in termineNachTag) {
    if (Object.prototype.hasOwnProperty.call(termineNachTag, k)) {
      n += termineNachTag[k].length;
    }
  }
  return n;
}

function termineFuerTag(is) {
  var liste = termineNachTag[is] || [];
  var zeit = [], ganztags = [];
  var i;
  for (i = 0; i < liste.length; i++) {
    if (liste[i].ganztags) { ganztags.push(liste[i]); }
    else { zeit.push(liste[i]); }
  }
  zeit.sort(function (x, y) { return (x.zeit < y.zeit) ? -1 : ((x.zeit > y.zeit) ? 1 : 0); });
  return { zeit: zeit, ganztags: ganztags };
}

function kalenderTaktStarten() {
  if (kalenderUhr) { window.clearInterval(kalenderUhr); }
  kalenderUhr = window.setInterval(function () {
    if (document.hidden) { return; }
    if (!tokenGueltig()) { return; }
    termineHolen(false);
  }, KAL_TAKT);
}

/* ============================================================
   Aufgabenfläche
   ============================================================ */

var aufGruppe = 'planung';
var aufFilter = 'alle';
var aufErledigtAuf = false;
var ERLEDIGT_ZEIGEN = 50;
var THEMEN_LEER = { beruflich: [], privat: [] };

function themenFuer(kontext) {
  var liste = [];
  var t = DB.themen || [];
  var i;
  for (i = 0; i < t.length; i++) {
    if (t[i].kontext === kontext) { liste.push(t[i]); }
  }
  liste.sort(function (a, b) { return (a.name < b.name) ? -1 : 1; });
  return liste;
}

function projekteFuer(kontext) {
  var liste = [];
  var p = DB.projekte || [];
  var i;
  for (i = 0; i < p.length; i++) {
    if (p[i].kontext === kontext && p[i].status !== 'abgeschlossen') { liste.push(p[i]); }
  }
  liste.sort(function (a, b) { return (a.name < b.name) ? -1 : 1; });
  return liste;
}

/* Setzt die Markierung auf genau einem Knopf einer Gruppe. */
function markiere(paare, aktiv) {
  var i;
  for (i = 0; i < paare.length; i++) {
    var el = document.getElementById(paare[i][1]);
    if (!el) { continue; }
    if (paare[i][0] === aktiv) { el.classList.add('aktiv'); }
    else { el.classList.remove('aktiv'); }
  }
}

function setAufGruppe(art) {
  aufGruppe = art;
  markiere([['planung', 'gPlanung'], ['thema', 'gThema'],
            ['projekt', 'gProjekt'], ['frist', 'gFrist']], art);
  aufZeichnen();
}

function setAufFilter(art) {
  aufFilter = art;
  markiere([['alle', 'fAlle'], ['beruflich', 'fBeruf'], ['privat', 'fPrivat']], art);
  aufZeichnen();
}

function wochenEnde(is) {
  var d = ausIso(is);
  var bis = (d.getDay() === 0) ? 0 : (7 - d.getDay());
  return tagePlus(is, bis);
}

function planungText(a) {
  if (!a.planung || a.planung === 'backlog') { return 'Backlog'; }
  if (a.planung === 'woche') { return 'Woche'; }
  return kurzDatum(a.planung);
}

function planungKlasse(a) {
  if (!a.planung || a.planung === 'backlog') { return ''; }
  if (a.planung === 'woche') { return ' woche'; }
  return ' tag';
}

function gruppeVonPlanung(a) {
  var heute = isoDatum();
  if (!a.planung || a.planung === 'backlog') { return 'Backlog'; }
  if (a.planung === 'woche') { return 'Diese Woche'; }
  if (a.planung === heute) { return 'Heute'; }
  if (a.planung < heute) { return 'Liegengeblieben'; }
  return 'Fest geplant';
}

function gruppeVonFrist(a) {
  var heute = isoDatum();
  if (a.wiederholung) { return 'Wiederkehrend'; }
  if (!a.frist) { return 'Ohne Frist'; }
  if (a.frist < heute) { return 'Überfällig'; }
  if (a.frist <= wochenEnde(heute)) { return 'Diese Woche fällig'; }
  return 'Später fällig';
}

function aufGruppeVon(a) {
  if (aufGruppe === 'planung') { return gruppeVonPlanung(a); }
  if (aufGruppe === 'frist') { return gruppeVonFrist(a); }
  if (aufGruppe === 'thema') { return themaName(a.themaId) || 'Ohne Thema'; }
  return projektName(a.projektId) || 'Ohne Projekt';
}

function aufReihenfolge(sichtbar) {
  if (aufGruppe === 'planung') {
    return ['Liegengeblieben', 'Heute', 'Fest geplant', 'Diese Woche', 'Backlog'];
  }
  if (aufGruppe === 'frist') {
    return ['Überfällig', 'Diese Woche fällig', 'Später fällig', 'Ohne Frist', 'Wiederkehrend'];
  }
  var ohne = (aufGruppe === 'thema') ? 'Ohne Thema' : 'Ohne Projekt';
  var namen = [];
  var i;
  for (i = 0; i < sichtbar.length; i++) {
    var n = aufGruppeVon(sichtbar[i]);
    if (n !== ohne && namen.indexOf(n) < 0) { namen.push(n); }
  }
  namen.sort();
  namen.push(ohne);
  return namen;
}

function aufMetaText(a) {
  var teile = [];
  var heute = isoDatum();
  if (a.frist && !a.wiederholung) {
    var eilig = a.frist <= wochenEnde(heute);
    var wort = (a.frist < heute) ? 'überfällig seit ' : 'Frist ';
    teile.push('<span class="' + (eilig ? 'eilig' : '') + '">' + wort
               + esc(kurzDatum(a.frist)) + '</span>');
  }
  var th = themaName(a.themaId);
  if (th && aufGruppe !== 'thema') { teile.push(esc(th)); }
  var pj = projektName(a.projektId);
  if (pj && aufGruppe !== 'projekt') { teile.push(esc(pj)); }
  if (a.wiederholung) { teile.push(esc(regelText(a.wiederholung))); }
  return teile.join(' · ');
}

function regelText(w) {
  if (!w) { return ''; }
  if (w.takt === 'woche') {
    var kopf = (Number(w.intervall) === 1) ? 'jede Woche' : ('jede ' + w.intervall + '. Woche');
    var kuerzel = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
    var namen = [];
    var i;
    for (i = 1; i <= 7; i++) {
      var nr = (i === 7) ? 0 : i;
      if ((w.tage || []).indexOf(nr) >= 0) { namen.push(kuerzel[nr]); }
    }
    return namen.length ? (kopf + ' · ' + namen.join(' ')) : kopf;
  }
  var kopfM = (Number(w.intervall) === 1) ? 'jeden Monat' : ('jeden ' + w.intervall + '. Monat');
  return kopfM + ' · am ' + w.tag + '.';
}

function aufZeichnen() {
  var blatt = document.getElementById('aufBlatt');
  if (!blatt) { return; }

  var sichtbar = [];
  var alle = DB.aufgaben || [];
  var i;
  for (i = 0; i < alle.length; i++) {
    if (!alle[i].wiederholung && alle[i].status === 'erledigt') { continue; }
    if (aufFilter !== 'alle' && alle[i].kontext !== aufFilter) { continue; }
    sichtbar.push(alle[i]);
  }

  var namen = aufReihenfolge(sichtbar);
  var h = '';
  var g, j;
  for (g = 0; g < namen.length; g++) {
    var name = namen[g];
    var drin = [];
    for (j = 0; j < sichtbar.length; j++) {
      if (aufGruppeVon(sichtbar[j]) === name) { drin.push(sichtbar[j]); }
    }
    if (!drin.length) { continue; }
    drin.sort(function (x, y) {
      var fx = x.frist || '9999-12-31';
      var fy = y.frist || '9999-12-31';
      if (fx !== fy) { return (fx < fy) ? -1 : 1; }
      return (x.titel < y.titel) ? -1 : 1;
    });

    var warn = (name === 'Überfällig' || name === 'Liegengeblieben') ? ' warn' : '';
    h += '<div class="gruppenkopf' + warn + '"><span>' + esc(name) + ' · ' + drin.length
       + '</span></div>';

    var k;
    for (k = 0; k < drin.length; k++) {
      var a = drin[k];
      var meta = aufMetaText(a);
      var marken = '';
      if (a.beschreibung) {
        marken += '<svg class="marke" viewBox="0 0 24 24">'
                + '<path d="M5 6h14M5 12h14M5 18h9"></path></svg>';
      }
      if (a.wiederholung) {
        marken += '<svg class="marke" viewBox="0 0 24 24">'
                + '<path d="M20 11a8 8 0 0 0-13.7-5.6L3 8M3 4v4h4M4 13a8 8 0 0 0 13.7 5.6L21 16'
                + 'M21 20v-4h-4"></path></svg>';
      }
      h += '<div class="tzeile' + (a.kontext === 'privat' ? ' privat' : '') + '">';
      h += '<button class="tkasten" type="button" onclick="aufgabeErledigen(\'' + esc(a.id) + '\')"></button>';
      h += '<div class="ttext" onclick="aufgabeAktionen(\'' + esc(a.id) + '\')">';
      h += '<div class="ttitel">' + esc(a.titel) + marken + '</div>';
      if (meta) { h += '<div class="tmeta">' + meta + '</div>'; }
      h += '</div>';
      h += '<button class="planungsknopf' + planungKlasse(a) + '" type="button" '
         + 'onclick="planungWeiter(\'' + esc(a.id) + '\')">' + esc(planungText(a)) + '</button>';
      h += '</div>';
    }
  }

  if (!h) { h = '<div class="tleer">Keine Aufgaben in dieser Auswahl.</div>'; }
  h += erledigtBlockHtml();
  blatt.innerHTML = h;

  var zahl = document.getElementById('kopfVersion');
  if (zahl) { zahl.textContent = sichtbar.length + ' offen · v' + APP_VERSION; }
}

/* Erledigtes steht am Ende, eingeklappt. Es gehört nicht in die
   Arbeitsliste, aber es soll auch nicht spurlos verschwinden. */
function erledigteSammeln() {
  var liste = [];
  var alle = DB.aufgaben || [];
  var i;
  for (i = 0; i < alle.length; i++) {
    var a = alle[i];
    if (a.wiederholung) { continue; }
    if (a.status !== 'erledigt') { continue; }
    if (aufFilter !== 'alle' && a.kontext !== aufFilter) { continue; }
    liste.push(a);
  }
  liste.sort(function (x, y) {
    var dx = x.erledigtAm || '';
    var dy = y.erledigtAm || '';
    if (dx !== dy) { return (dx > dy) ? -1 : 1; }
    return (x.titel < y.titel) ? -1 : 1;
  });
  return liste;
}

function erledigtBlockHtml() {
  var liste = erledigteSammeln();
  if (!liste.length) { return ''; }

  var h = '<button class="tfalt" type="button" onclick="aufErledigtUm()">'
        + '<span>Erledigt · ' + liste.length + '</span>'
        + '<svg class="' + (aufErledigtAuf ? 'auf' : '') + '" viewBox="0 0 24 24">'
        + '<path d="M6 9l6 6 6-6"></path></svg></button>';
  if (!aufErledigtAuf) { return h; }

  var i;
  var bis = Math.min(liste.length, ERLEDIGT_ZEIGEN);
  for (i = 0; i < bis; i++) {
    var a = liste[i];
    var meta = a.erledigtAm ? ('erledigt ' + kurzDatum(a.erledigtAm)) : 'erledigt';
    var th = themaName(a.themaId);
    if (th) { meta += ' · ' + esc(th); }
    h += '<div class="tzeile kompakt erledigt' + (a.kontext === 'privat' ? ' privat' : '') + '">';
    h += '<button class="tkasten an" type="button" onclick="aufgabeWiederOeffnen(\'' + esc(a.id) + '\')"></button>';
    h += '<div class="ttext" onclick="aufgabeAktionen(\'' + esc(a.id) + '\')">';
    h += '<div class="ttitel">' + esc(a.titel) + '</div>';
    h += '<div class="tmeta">' + meta + '</div></div></div>';
  }
  if (liste.length > bis) {
    h += '<div class="tleer">… und ' + (liste.length - bis) + ' weitere, ältere.</div>';
  }
  return h;
}

function aufErledigtUm() {
  aufErledigtAuf = !aufErledigtAuf;
  aufZeichnen();
}

function aufgabeWiederOeffnen(id) {
  var a = aufgabeFinden(id);
  if (!a) { return; }
  a.status = 'offen';
  a.erledigtAm = null;
  a.geaendert = jetzt();
  aufZeichnen();
  spaeterSichern();
}

function aufgabeErledigen(id) {
  var a = aufgabeFinden(id);
  if (!a) { return; }
  if (a.wiederholung) {
    a.zuletztErledigt = isoDatum();
  } else {
    a.status = 'erledigt';
    a.erledigtAm = isoDatum();
  }
  a.geaendert = jetzt();
  aufZeichnen();
  spaeterSichern();
}

/* Backlog → Diese Woche → Heute → Backlog */
function planungWeiter(id) {
  var a = aufgabeFinden(id);
  if (!a) { return; }
  var jetztWert = a.planung || 'backlog';
  if (jetztWert === 'backlog') { a.planung = 'woche'; }
  else if (jetztWert === 'woche') { a.planung = isoDatum(); }
  else { a.planung = 'backlog'; }
  a.geaendert = jetzt();
  aufZeichnen();
  spaeterSichern();
}

/* Der Plusknopf legt eine leere Aufgabe an und öffnet gleich die
   Detailfläche. Bleibt der Titel leer, wird sie beim Schließen
   wieder entfernt — eine namenlose Aufgabe soll nicht entstehen. */
function aufgabeNeu() {
  var kontext = (aufFilter === 'privat') ? 'privat' : 'beruflich';
  var neu = {
    id: neueKennung(), titel: '', beschreibung: '', kontext: kontext,
    themaId: null, projektId: null, frist: '', planung: 'backlog', uhrzeit: '',
    art: 'haupt', wiederholung: null, status: 'offen', erledigtAm: null,
    zuletztErledigt: null, ablaufSchritt: null, geaendert: jetzt()
  };
  DB.aufgaben.push(neu);
  frischAngelegt = neu.id;
  aufgabeAktionen(neu.id);
  var feld = document.getElementById('asTitel');
  if (feld && feld.focus) { feld.focus(); }
}

/* ============================================================
   Als App: Service Worker und Versionsprüfung

   Der Service Worker holt alles zuerst aus dem Netz. Eine neue
   Fassung kommt damit von selbst an — ohne Deinstallieren.
   Zusätzlich fragt die App aktiv nach, damit ein laufendes Fenster
   nicht tagelang auf einem alten Stand bleibt.
   ============================================================ */

var VERSION_TAKT = 15 * 60 * 1000;
var neueVersion = '';
var versionUhr = null;

function swAnmelden() {
  if (!('serviceWorker' in navigator)) { return Promise.resolve(false); }
  return navigator.serviceWorker.register('./sw.js').then(function () {
    return true;
  }).catch(function () {
    return false;
  });
}

function versionPruefen(laut) {
  var adresse = './workbench.html?stand=' + Date.now();
  return window.fetch(adresse, { cache: 'no-store' }).then(function (a) {
    if (!a.ok) { throw new Error('Abruf mit Status ' + a.status); }
    return a.text();
  }).then(function (text) {
    var treffer = text.match(/APP_VERSION\s*=\s*'([\d.]+)'/);
    if (!treffer) { throw new Error('Im Abruf steht keine Versionsnummer.'); }
    var dort = treffer[1];
    if (dort !== APP_VERSION) {
      neueVersion = dort;
      neuStreifenZeigen(dort);
      if (laut) { melde('Neue Fassung ' + dort + ' gefunden.', 'gut'); }
    } else {
      neueVersion = '';
      neuStreifenVerbergen();
      if (laut) { melde('Die laufende Fassung ' + APP_VERSION + ' ist die neueste.', 'gut'); }
    }
    zeichne();
    return dort;
  }).catch(function (f) {
    if (laut) { melde('Versionsprüfung nicht möglich.\n' + (f ? f.message : ''), 'warn'); }
    return null;
  });
}

function neuStreifenZeigen(dort) {
  var streifen = document.getElementById('neuStreifen');
  var text = document.getElementById('neuText');
  if (!streifen || !text) { return; }
  text.textContent = 'Neue Fassung ' + dort + ' verfügbar (läuft: ' + APP_VERSION + ')';
  streifen.classList.add('sichtbar');
}

function neuStreifenVerbergen() {
  var streifen = document.getElementById('neuStreifen');
  if (streifen) { streifen.classList.remove('sichtbar'); }
}

/* Vor dem Neuladen wird alles Wartende gesichert, sonst geht die
   letzte Änderung beim Austausch verloren. */
function neuLaden() {
  neuStreifenVerbergen();
  melde('Neue Fassung wird geladen …', null);
  speichern().catch(function () { return null; }).then(function () {
    if (!('serviceWorker' in navigator)) { return null; }
    return navigator.serviceWorker.getRegistration().then(function (anmeldung) {
      if (!anmeldung) { return null; }
      if (anmeldung.waiting) { anmeldung.waiting.postMessage('sofort-uebernehmen'); }
      return anmeldung.update().catch(function () { return null; });
    }).catch(function () { return null; });
  }).then(function () {
    window.setTimeout(function () {
      window.location.reload();
    }, 600);
  });
}

function versionTaktStarten() {
  if (versionUhr) { window.clearInterval(versionUhr); }
  versionUhr = window.setInterval(function () {
    if (document.hidden) { return; }
    versionPruefen(false);
  }, VERSION_TAKT);
}

/* ============================================================
   Start
   ============================================================ */

function warAngemeldet() {
  try { return window.localStorage.getItem(ANMELDE_MERKER) === '1'; }
  catch (e) { return false; }
}

function starten() {
  if (tokenAusSitzung()) {
    melde('Anmeldung aus dieser Sitzung übernommen, noch ' + restMinuten() + ' Minuten gültig.', null);
  } else if (warAngemeldet()) {
    /* Google kann den Zugriff ohne Nachfrage erneuern, solange die
       Sitzung im Browser besteht. Erst wenn das misslingt, fragen wir. */
    anmelden(true).then(function (gut) {
      if (gut) {
        melde('Anmeldung im Hintergrund erneuert.', 'gut');
        abgleichPlanen(true);
      } else {
        melde('Die Anmeldung ließ sich nicht im Hintergrund erneuern.\n'
            + 'Bitte oben auf „Anmelden" tippen.', 'warn');
      }
      zeichne();
    });
  }
  document.addEventListener('visibilitychange', rueckkehrPruefen);
  taktStarten();
  kalenderTaktStarten();
  swAnmelden().then(function () { return versionPruefen(false); });
  versionTaktStarten();
  zeichne();
  if (!idbDa()) {
    speicherWeg = opfsDa() ? 'opfs' : (localDa() ? 'local' : 'keiner');
    ladenJetzt();
    return;
  }
  idbLesen(IDB_KEY).then(function (handle) {
    if (!handle) {
      speicherWeg = opfsDa() ? 'opfs' : (localDa() ? 'local' : 'keiner');
      return null;
    }
    dateiHandle = handle;
    dateiName = handle.name || DATEINAME;
    return rechtePruefen(handle);
  }).then(function (stand) {
    if (stand) { rechteStand = stand; }
    return laden();
  }).then(function (weg) {
    if (weg === 'datei') {
      melde('Datei gefunden und gelesen: ' + dateiName, 'gut');
    } else if (rechteStand === 'prompt') {
      melde('Eine Datei ist hinterlegt, der Zugriff muss aber bestätigt werden.\n'
          + 'Bitte „Zugriff erlauben" antippen.', 'warn');
    } else if (weg) {
      melde('Gelesen über: ' + wegText(weg), null);
    } else {
      melde('Noch kein Bestand vorhanden. Lege eine Datei an oder öffne eine.', null);
    }
    bestandStempeln(DB);
    tagOffen = isoDatum();
    tagZeichnen();
    zeigeSchirm('Tag');
    zeichne();
    if (tokenGueltig()) {
      abgleichen().then(function (b) {
        melde('Beim Start abgeglichen.\n' + berichtText(b), 'gut');
        tagZeichnen();
        zeichne();
      }).catch(function () {
        melde('Der Abgleich beim Start ist ausgefallen. Die App arbeitet lokal weiter.', null);
        zeichne();
      });
    }
  }).catch(function (f) {
    melde('Start unvollständig.\n' + (f ? f.message : ''), 'warn');
    zeichne();
  });
}

window.addEventListener('load', starten);
