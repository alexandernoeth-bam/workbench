<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f3ef">
<title>Workbench 0.6.0</title>
<link rel="manifest" href="workbench.webmanifest?v=0.6.0">
<link rel="icon" type="image/png" sizes="192x192" href="workbench-192.png?v=0.6.0">
<link rel="apple-touch-icon" href="workbench-192.png?v=0.6.0">
<style>
:root{
  --bg:#f4f3ef;--ink:#222222;--muted:#8a8984;--line:#dcdad3;--karo:#ecebe6;--aus:#b9b7af;
  --gelb:#fbe9a6;--gruen:#cdeec0;--blau:#c6e2f7;--rosa:#f8cfe0;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;
     font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}

/* ---------- Rahmen ---------- */
.kopf{display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:11px 22px;border-bottom:1px solid var(--line)}
.kopf nav{display:flex;gap:26px}
.kopf nav button{background:none;border:0;font-size:16px;color:var(--muted);
                 padding:3px 0;border-bottom:2px solid transparent}
.kopf nav button.an{color:var(--ink);border-bottom-color:var(--ink)}
.kopf .rechts{display:flex;align-items:center;gap:12px;margin-left:auto}
.kopf .stand{font-size:13px;color:var(--muted);white-space:nowrap}
.geist{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 12px;
       font-size:13px;color:var(--muted)}
.geist:disabled{opacity:.45}

.haupt{position:absolute;top:50px;bottom:51px;left:0;right:0;overflow:auto;padding:22px}
#flaeche{max-width:1180px;margin:0 auto;height:100%;display:flex;justify-content:center}
.fuss{position:absolute;left:0;right:0;bottom:0;height:51px;border-top:1px solid var(--line);
      padding:9px 22px;display:flex;align-items:center;justify-content:space-between;
      gap:12px;font-size:14px;color:var(--muted);background:var(--bg)}
.fuss .mitte{display:flex;gap:9px}
.fuss .blaettern{background:none;border:0;color:var(--muted);font-size:14px;padding:4px 2px;white-space:nowrap}
.fuss .blaettern:disabled{opacity:.4}
.kn{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 14px;font-size:14px}
.kn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.kn:disabled{opacity:.45}

/* ---------- Der Block ---------- */
/* Die Seite steht mittig, aber mit Platz rechts: dort hängen die Post-its
   über den Rand, und sie dürfen nicht unter den Stapel geraten. */
.sicht{display:flex;flex-direction:column;align-items:center;width:100%;padding-right:150px}
/* Die Seite steht zwischen den Stapeln und bekommt ihre Breite von der Zeile,
   nicht von ihrem eigenen Inhalt — sonst schrumpft sie auf die Textbreite. */
.blatt{display:flex;align-items:stretch;width:min(860px,100%)}
/* Feste Seitenhöhe: die Tinte liegt in Seitenkoordinaten, und die dürfen sich
   nicht verschieben, wenn der getippte Text wächst. Passt etwas nicht mehr
   drauf, beginnt eine neue Seite — so ist ein Block nun einmal. */
.seite{height:1080px}
.werkzeug{display:flex;gap:7px;align-items:center;margin-bottom:10px;font-size:13.5px;color:var(--muted);width:min(860px,100%)}
.werkzeug span{margin-left:auto;text-align:right}
.werkzeug button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13.5px}
.werkzeug button.an{background:var(--ink);color:#fff;border-color:var(--ink)}
.werkzeug .dick{display:inline-block;width:16px;background:currentColor;border-radius:3px}
.tinte{position:absolute;inset:0;touch-action:none;pointer-events:none;z-index:3}
.tinte.an{pointer-events:auto;cursor:crosshair}
.regal,.fv,.start{width:100%;align-self:flex-start}
.sicht .stapel{min-height:1080px}
.stapel{align-self:stretch;margin:6px 0;flex:0 0 auto;min-height:220px}
.stapel.l{background:repeating-linear-gradient(90deg,#fff 0 2px,var(--line) 2px 3px);border-radius:6px 0 0 6px}
.stapel.r{background:repeating-linear-gradient(90deg,var(--line) 0 1px,#fff 1px 3px);border-radius:0 6px 6px 0}
.seite{position:relative;background:#fff;border:1px solid var(--line);border-radius:4px;
       flex:1 1 auto;min-width:0;padding:30px 40px;
       background-image:linear-gradient(var(--karo) 1px,transparent 1px),
                        linear-gradient(90deg,var(--karo) 1px,transparent 1px);
       background-size:24px 24px}
.datum{font-size:13px;color:var(--muted);margin-bottom:6px}
.stitel{display:block;width:70%;font-size:21px;font-weight:500;background:none;border:0;
        border-bottom:1px solid transparent;padding:0 0 3px;margin:0 0 14px}
.stitel:focus{outline:none;border-bottom-color:var(--line)}
.stitel::placeholder{color:var(--aus)}
.skizze{min-height:150px;border:1.5px dashed var(--aus);border-radius:8px;display:flex;
        align-items:center;justify-content:center;color:var(--muted);margin-bottom:16px;
        background:#fff;width:70%;font-size:14px;overflow:hidden;position:relative}
.skizze img{max-width:100%;display:block}
.skizze .weg{position:absolute;top:5px;right:5px;background:#fff;border:1px solid var(--line);
             border-radius:5px;font-size:12px;padding:1px 7px;color:var(--muted)}
.stext{display:block;width:70%;height:620px;font-size:16px;line-height:24px;background:rgba(255,255,255,.85);
       border:0;resize:none;padding:0;margin:0}
.stext:focus{outline:none}
.stext::placeholder{color:var(--aus)}
.zettel{position:absolute;top:30px;right:-26px;display:flex;flex-direction:column;gap:12px;width:176px}
.pi{padding:9px 11px;font-size:14px;line-height:1.45;box-shadow:0 1px 2px rgba(0,0,0,.09);position:relative}
.pi:nth-child(odd){transform:rotate(1.8deg)}
.pi:nth-child(even){transform:rotate(-1.4deg)}
.pi textarea{width:100%;background:none;border:0;resize:none;font-size:14px;line-height:1.45;padding:0 14px 0 0;min-height:76px;overflow:hidden}
.pi textarea:focus{outline:none}
.pi .weg{position:absolute;top:1px;right:4px;background:none;border:0;color:rgba(0,0,0,.38);font-size:15px;padding:0 3px}
.gelb{background:var(--gelb)} .gruen{background:var(--gruen)} .blau{background:var(--blau)} .rosa{background:var(--rosa)}
.neuz{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:2px}
.neuz button{width:19px;height:19px;border-radius:3px;border:1px solid rgba(0,0,0,.12);padding:0}

/* ---------- Fächer ---------- */
.regal{width:min(820px,100%)}
.welt{font-size:13px;color:var(--muted);margin:18px 0 7px;display:flex;align-items:baseline;gap:9px}
.regal > .welt:first-child{margin-top:0}
.fach,.unter{background:#fff;border:1px solid var(--line);border-radius:6px;
             display:flex;align-items:center;gap:10px;margin-bottom:7px}
.fach{padding:0 6px 0 0}
.unter{margin-left:26px;padding:0 6px 0 0;font-size:14.5px}
.fach .nmk,.unter .nmk{flex:1;min-width:0;text-align:left;background:none;border:0;padding:11px 15px}
.unter .nmk{padding:8px 15px;color:#444}
.fach small,.unter small{color:var(--muted);font-size:13px;white-space:nowrap}
.mehr{background:none;border:0;color:var(--muted);font-size:16px;letter-spacing:2px;padding:4px 6px}
.leerwelt{border:1.5px dashed var(--line);border-radius:6px;padding:13px 16px;color:var(--muted);
          font-size:14.5px;display:flex;align-items:center;justify-content:space-between;gap:14px}

/* ---------- Fachansicht ---------- */
.fv{width:min(960px,100%)}
.zur{background:none;border:0;font-size:14px;color:var(--muted);padding:0 0 8px}
.fv h1{font-size:21px;font-weight:500;margin:0 0 4px}
.fvweg{font-size:13px;color:var(--muted);margin-bottom:13px}
.uflaste{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.uflaste button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:3px 12px;
                font-size:13.5px;color:#444}
.uflaste button.an{background:var(--ink);color:#fff;border-color:var(--ink)}
.gitter{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start}
.kiste{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin-bottom:14px}
.kiste h3{font-size:13.5px;font-weight:500;color:var(--muted);margin:0 0 7px}
.kiste h3 em{font-style:normal;font-weight:400}
.ding{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #eee;font-size:15px}
.ding:last-child{border-bottom:0}
.ding .tx{flex:1;min-width:0}
.ding.weg .tx{color:var(--muted);text-decoration:line-through}
.ding .q{display:flex;gap:8px;flex:0 0 auto}
.ding .q button{background:none;border:0;font-size:12.5px;color:var(--muted);padding:0;white-space:nowrap}
.mini{display:flex;gap:9px;flex-wrap:wrap}
.mp{width:86px;height:114px;background:#fff;border:1px solid var(--line);border-radius:3px;
    padding:7px;font-size:11px;color:var(--muted);text-align:left;line-height:1.3;overflow:hidden;
    background-image:linear-gradient(var(--karo) 1px,transparent 1px);
    background-size:100% 11px;background-position:0 34px}
.leise{color:var(--muted);font-size:14.5px}
.start{width:min(820px,100%)}
.start h2{font-size:18px;font-weight:500;margin:22px 0 8px}
.start p{color:var(--muted);margin:0 0 12px}
.best{background:#fff;border:1px solid var(--line);border-radius:6px;padding:11px 15px;margin-bottom:8px;
      display:flex;gap:11px;align-items:flex-start}
.best .ampel{width:9px;height:9px;border-radius:50%;background:var(--aus);flex:0 0 auto;margin-top:7px}
.best .ampel.da{background:#5f8f5f}
.best .ampel.weg{background:#a85a5a}
.best .nm{flex:1}
.best small{display:block;color:var(--muted);font-size:13.5px}

/* ---------- Dialog und Meldung ---------- */
.dlgbg{position:fixed;inset:0;background:rgba(0,0,0,.24);display:flex;align-items:center;justify-content:center;z-index:40}
.dlgbg.zu{display:none}
.dlg{background:#fff;border-radius:8px;width:min(480px,92vw);max-height:88vh;overflow:auto;
     padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.22)}
.dlg h2{font-size:18px;font-weight:500;margin:0 0 12px}
.dlg label{display:block;font-size:13px;color:var(--muted);margin:11px 0 4px}
.dlg input,.dlg textarea,.dlg select{width:100%;border:1px solid var(--line);border-radius:6px;
                                     padding:8px;font-size:14px;background:#fff}
.dlg textarea{min-height:48px;resize:vertical}
.dlg p{color:var(--muted);font-size:14px;margin:10px 0 0}
.zeile{display:flex;gap:9px;margin-top:17px;align-items:center;flex-wrap:wrap}
.zeile .r{margin-left:auto;display:flex;gap:9px}
.zeile button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 14px;font-size:14px}
.zeile button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.zeile button.gefahr{color:#a3384a}
.toast{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);background:var(--ink);color:#fff;
       padding:8px 15px;border-radius:6px;font-size:14px;max-width:min(560px,92vw);white-space:pre-line;
       opacity:0;pointer-events:none;transition:opacity .18s;z-index:60}
.toast.an{opacity:1}
.toast.warn{background:#7d3340}

@media (max-width:1100px){
  .sicht{padding-right:0}
  .zettel{position:static;width:auto;flex-direction:row;flex-wrap:wrap;margin-top:16px}
  .pi{width:176px}
}
@media (max-width:860px){
  .gitter{grid-template-columns:1fr}
  .stitel,.stext,.skizze{width:100%}
}
</style>
</head>
<body>

<div class="kopf">
  <nav id="reiter"></nav>
  <span class="rechts"><span class="stand" id="stand"></span><button type="button" class="geist" id="linkKnopf" onclick="wbLinkKopieren()">Link kopieren</button></span>
</div>
<div class="haupt" id="haupt"><div id="flaeche"></div></div>
<div class="fuss" id="fuss"></div>

<input type="file" id="dateiWahl" accept="image/*" style="display:none">
<div class="dlgbg zu" id="aufklapp"></div>
<div class="toast" id="toast"></div>

<script>
var WB_FASSUNG = '0.6.0';

/* ===== wb_daten.js ===== */
/* ============================================================
   wb_daten.js — die drei Bestände und ihre Wege
   ------------------------------------------------------------
   Eine Datendatei je Welt: beruflich nur im Firmenspeicher,
   privat über Google Drive. Gleiche App, getrennte Inhalte.
   Aufgaben kommen hier nicht vor — geplant und abgehakt wird
   in CLIE, verbunden sind beide nur über einen Link je Seite.
   Skizzen liegen als Bilddateien im Ordner ihrer Welt.

   Der Weg eines Bestandes steht in WB_BESTAENDE und nirgends
   sonst. Jeder Schreibvorgang geht durch wbSichern(), und das
   fragt diese eine Tabelle. Ein zweiter Weg zum Schreiben
   würde DH-02 aushebeln, deshalb gibt es keinen.
   ============================================================ */

var WB_BESTAENDE = [
  { id: 'beruflich', name: 'Beruflich', weg: 'datei', datei: 'workbench-beruflich.json', welt: 'beruflich' },
  { id: 'privat',    name: 'Privat',    weg: 'drive', datei: 'workbench-privat.json',    welt: 'privat' }
];

var WB_IDB_NAME  = 'workbench-neu';
var WB_IDB_STORE = 'handles';
var WB_CLIENT_ID = '347268246401-9ktgd8q5caq6v5nma36i3e38u9c37bre.apps.googleusercontent.com';
var WB_SCOPES    = 'https://www.googleapis.com/auth/drive.file';
var WB_GIS_URL   = 'https://accounts.google.com/gsi/client';
var WB_TOKEN_KEY = 'workbench-neu-zugriff';

/* Was im Speicher liegt. Je Bestand: der Inhalt, woher er kam,
   ob er seit dem Laden verändert wurde, und der letzte Fehler. */
var wbDaten  = { beruflich: null, privat: null };
var wbStand  = {
  beruflich: { geladen: false, schmutzig: false, fehler: '', quelle: '', zeit: '' },
  privat:    { geladen: false, schmutzig: false, fehler: '', quelle: '', zeit: '' }
};
var wbHandles  = { beruflich: null };   /* Ordner- oder Dateihandle je Welt */
var wbDriveId  = {};                    /* Dateiname -> Drive-Id */
var wbToken    = '';
var wbTokenBis = 0;
var wbKlient   = null;

/* ---------- kleine Helfer ---------- */

function wbBestand(id) {
  var i;
  for (i = 0; i < WB_BESTAENDE.length; i += 1) {
    if (WB_BESTAENDE[i].id === id) { return WB_BESTAENDE[i]; }
  }
  return null;
}

/* Der Wächter zu DH-02: nur diese Funktion entscheidet, was zu Drive darf. */
function wbDarfZuDrive(id) {
  var b = wbBestand(id);
  return !!b && b.weg === 'drive';
}

function wbIsoZeit() {
  return new Date().toISOString();
}

function wbId(vorsatz) {
  return String(vorsatz || 'x') + '-' + Date.now().toString(36)
    + '-' + Math.random().toString(36).slice(2, 8);
}

function wbEsc(t) {
  return String(t === null || t === undefined ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

var wbToastUhr = 0;
function melde(text, art) {
  var el = (typeof document !== 'undefined') ? document.getElementById('toast') : null;
  if (!el) { return; }
  el.textContent = String(text || '');
  el.className = 'toast an' + (art === 'warn' ? ' warn' : '');
  if (wbToastUhr) { window.clearTimeout(wbToastUhr); }
  wbToastUhr = window.setTimeout(function () {
    var e2 = document.getElementById('toast');
    if (e2) { e2.className = 'toast' + (art === 'warn' ? ' warn' : ''); }
    wbToastUhr = 0;
  }, (art === 'warn') ? 7000 : 4000);
}

function wbFsApiDa()  { return (typeof window !== 'undefined' && typeof window.showOpenFilePicker === 'function'); }
function wbOrdnerApiDa() { return (typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function'); }
function wbIdbDa()    { return (typeof window !== 'undefined' && !!window.indexedDB); }

/* ---------- IndexedDB: bewahrt den Handle über Sitzungen ---------- */

function wbIdbOeffnen() {
  return new Promise(function (fertig, fehler) {
    if (!wbIdbDa()) { fehler(new Error('IndexedDB nicht verfügbar')); return; }
    var a = window.indexedDB.open(WB_IDB_NAME, 1);
    a.onupgradeneeded = function () {
      var db = a.result;
      if (!db.objectStoreNames.contains(WB_IDB_STORE)) { db.createObjectStore(WB_IDB_STORE); }
    };
    a.onsuccess = function () { fertig(a.result); };
    a.onerror   = function () { fehler(a.error); };
  });
}

function wbIdbSchreiben(schluessel, wert) {
  return wbIdbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(WB_IDB_STORE, 'readwrite');
      t.objectStore(WB_IDB_STORE).put(wert, schluessel);
      t.oncomplete = function () { db.close(); fertig(true); };
      t.onerror    = function () { db.close(); fehler(t.error); };
    });
  });
}

function wbIdbLesen(schluessel) {
  return wbIdbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(WB_IDB_STORE, 'readonly');
      var a = t.objectStore(WB_IDB_STORE).get(schluessel);
      a.onsuccess = function () { db.close(); fertig(a.result || null); };
      a.onerror   = function () { db.close(); fehler(a.error); };
    });
  });
}

/* ---------- Rechte am Handle: nur auf ausdrückliche Geste fragen ---------- */

function wbRechtePruefen(handle) {
  if (!handle || typeof handle.queryPermission !== 'function') { return Promise.resolve('unbekannt'); }
  return handle.queryPermission({ mode: 'readwrite' }).catch(function () { return 'unbekannt'; });
}

function wbRechteAnfragen(handle) {
  if (!handle || typeof handle.requestPermission !== 'function') { return Promise.resolve('unbekannt'); }
  return handle.requestPermission({ mode: 'readwrite' }).catch(function () { return 'denied'; });
}

/* ---------- Dateien über die Dateischnittstelle ---------- */

function wbDateiSchreiben(handle, text) {
  return handle.createWritable().then(function (strom) {
    return strom.write(text).then(function () { return strom.close(); });
  });
}

function wbDateiLesen(handle) {
  return handle.getFile().then(function (f) { return f.text(); });
}

/* Aus einem Ordnerhandle die Datendatei holen; ohne Ordner ist der
   Handle selbst schon die Datei (Rückfallweg, wenn der Firmenlaptop
   keinen Ordner wählen lässt). */
function wbDateiAusHandle(handle, name, anlegen) {
  if (!handle) { return Promise.reject(new Error('Kein Speicherort gewählt.')); }
  if (handle.kind === 'file') { return Promise.resolve(handle); }
  return handle.getFileHandle(name, { create: !!anlegen });
}

/* DH-06: neben der Datendatei liegt ein Ordner für Skizzen und PDFs.
   Er entsteht erst, wenn er gebraucht wird, und nie in der Datendatei. */
function wbDateiOrdner(welt, anlegen) {
  var h = wbHandles[welt];
  if (!h || h.kind !== 'directory') { return Promise.resolve(null); }
  return h.getDirectoryHandle('dateien', { create: !!anlegen }).catch(function () { return null; });
}

function wbOrtWaehlen(welt) {
  var versprechen;
  if (wbOrdnerApiDa()) {
    versprechen = window.showDirectoryPicker({ mode: 'readwrite', id: 'wb-' + welt });
  } else if (wbFsApiDa()) {
    versprechen = window.showOpenFilePicker({
      multiple: false,
      types: [{ description: 'Workbench-Daten', accept: { 'application/json': ['.json'] } }]
    }).then(function (liste) { return liste[0]; });
  } else {
    return Promise.reject(new Error('Dieser Browser kann keine Ordner oder Dateien öffnen.'));
  }
  return versprechen.then(function (handle) {
    wbHandles[welt] = handle;
    return wbIdbSchreiben('ort-' + welt, handle).then(function () { return handle; });
  });
}

function wbOrtLaden(welt) {
  return wbIdbLesen('ort-' + welt).then(function (handle) {
    if (!handle) { return null; }
    wbHandles[welt] = handle;
    return wbRechtePruefen(handle).then(function (stand) {
      return (stand === 'granted') ? handle : null;
    });
  }).catch(function () { return null; });
}

/* ---------- Google Drive ---------- */

function wbGisLaden() {
  if (window.google && window.google.accounts && window.google.accounts.oauth2) {
    return Promise.resolve(true);
  }
  return new Promise(function (fertig, fehler) {
    var s = document.createElement('script');
    s.src = WB_GIS_URL;
    s.async = true;
    s.onload = function () { fertig(true); };
    s.onerror = function () { fehler(new Error('Google-Anmeldung nicht erreichbar.')); };
    document.head.appendChild(s);
  });
}

function wbTokenGueltig() {
  return !!wbToken && wbTokenBis > Date.now() + 60000;
}

function wbTokenMerken(token, sekunden) {
  wbToken = String(token || '');
  wbTokenBis = Date.now() + (Number(sekunden || 3600) * 1000);
  try {
    window.localStorage.setItem(WB_TOKEN_KEY, JSON.stringify({ t: wbToken, bis: wbTokenBis }));
  } catch (e) { /* ohne Merken geht es auch, nur kürzer */ }
}

function wbTokenHolen() {
  try {
    var r = JSON.parse(window.localStorage.getItem(WB_TOKEN_KEY) || 'null');
    if (r && r.t && Number(r.bis) > Date.now() + 60000) {
      wbToken = r.t;
      wbTokenBis = Number(r.bis);
    }
  } catch (e) { /* kaputter Eintrag: einfach neu anmelden */ }
  return wbTokenGueltig();
}

function wbTokenVergessen() {
  wbToken = '';
  wbTokenBis = 0;
  try { window.localStorage.removeItem(WB_TOKEN_KEY); } catch (e) { /* egal */ }
}

function wbAnmelden(still) {
  if (wbTokenGueltig()) { return Promise.resolve(true); }
  return wbGisLaden().then(function () {
    if (!wbKlient) {
      wbKlient = window.google.accounts.oauth2.initTokenClient({
        client_id: WB_CLIENT_ID,
        scope: WB_SCOPES,
        callback: function () { /* je Anfrage gesetzt */ }
      });
    }
    return new Promise(function (fertig) {
      var fertigEinmal = function (gut) { if (fertig) { var f = fertig; fertig = null; f(gut); } };
      wbKlient.callback = function (antwort) {
        if (antwort && antwort.access_token) {
          wbTokenMerken(antwort.access_token, antwort.expires_in);
          fertigEinmal(true);
          return;
        }
        fertigEinmal(false);
      };
      wbKlient.error_callback = function () { fertigEinmal(false); };
      try {
        wbKlient.requestAccessToken({ prompt: still ? 'none' : '' });
      } catch (e) {
        fertigEinmal(false);
      }
      window.setTimeout(function () { fertigEinmal(false); }, still ? 8000 : 120000);
    });
  }).catch(function () { return false; });
}

function wbDriveKopf(zusatz) {
  var k = { Authorization: 'Bearer ' + wbToken };
  var n;
  if (zusatz) {
    for (n in zusatz) {
      if (Object.prototype.hasOwnProperty.call(zusatz, n)) { k[n] = zusatz[n]; }
    }
  }
  return k;
}

function wbAntwortPruefen(a) {
  if (a.ok) { return a; }
  if (a.status === 401) {
    wbTokenVergessen();
    throw new Error('Der Zugriff ist abgelaufen. Bitte neu anmelden.');
  }
  return a.text().then(function (t) {
    throw new Error('Drive antwortete mit ' + a.status + ': ' + String(t).slice(0, 200));
  });
}

function wbDriveSuchen(name) {
  if (wbDriveId[name]) { return Promise.resolve(wbDriveId[name]); }
  var url = 'https://www.googleapis.com/drive/v3/files'
          + '?q=' + encodeURIComponent("name='" + name + "' and trashed=false")
          + '&fields=' + encodeURIComponent('files(id,name,modifiedTime)') + '&pageSize=10';
  return window.fetch(url, { headers: wbDriveKopf() })
    .then(wbAntwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      var liste = (d && d.files) ? d.files : [];
      if (!liste.length) { return ''; }
      wbDriveId[name] = liste[0].id;
      return liste[0].id;
    });
}

function wbDriveAnlegen(name) {
  return window.fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: wbDriveKopf({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ name: name, mimeType: 'application/json' })
  }).then(wbAntwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) { wbDriveId[name] = d.id; return d.id; });
}

function wbDriveLesen(name) {
  return wbDriveSuchen(name).then(function (id) {
    if (!id) { return null; }
    return window.fetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media',
      { headers: wbDriveKopf() })
      .then(wbAntwortPruefen)
      .then(function (a) { return a.text(); });
  });
}

/* Die einzige Tür zu Drive. Jeder Schreibzugriff geht hier durch und nennt
   seine Welt; was nicht zu Drive darf, kommt nicht vorbei. Ein zweiter Weg
   am Wächter vorbei würde DH-02 aushebeln, ohne dass im Betrieb etwas auffällt
   — deshalb zählt ein Test nach, dass wbDriveSchreiben nur von hier gerufen wird. */
function wbNachDrive(welt, name, text) {
  if (!wbDarfZuDrive(welt)) {
    return Promise.reject(new Error(wbBestand(welt) ? (wbBestand(welt).name + ' darf nicht zu Drive.')
                                                    : 'Unbekannte Welt darf nicht zu Drive.'));
  }
  if (!wbTokenGueltig()) { return Promise.reject(new Error('Nicht bei Google angemeldet.')); }
  return wbDriveSchreiben(name, text);
}

function wbDriveSchreiben(name, text) {
  return wbDriveSuchen(name).then(function (id) {
    return id || wbDriveAnlegen(name);
  }).then(function (id) {
    return window.fetch('https://www.googleapis.com/upload/drive/v3/files/' + id
      + '?uploadType=media&fields=id,modifiedTime', {
      method: 'PATCH',
      headers: wbDriveKopf({ 'Content-Type': 'application/json' }),
      body: text
    });
  }).then(wbAntwortPruefen).then(function () { return true; });
}


/* ============================================================
   Das Modell: Fächer, Unterfächer, Seiten, Einträge
   ------------------------------------------------------------
   Eine Seite liegt entweder im Block (ohne Fach) oder in einem
   Fach — nie in beidem. Das Ablegen setzt das Fach, und damit
   ist die Seite aus dem Block verschwunden wie herausgetrennt;
   es bleibt kein Verweis zurück.

   Ein Eintrag (Erkenntnis, offene Frage, Aufgabe) zeigt immer
   auf die Seite, aus der er stammt. Aufgaben sind hier nur eine
   Sammelstelle: getan wird in CLIE, übernommen wird mit Link.
   ============================================================ */

var WB_FARBEN = [['gelb', 'Gelb'], ['gruen', 'Grün'], ['blau', 'Blau'], ['rosa', 'Rosa']];
var WB_ARTEN  = [['erkenntnis', 'Erkenntnisse'], ['frage', 'Offene Fragen'], ['aufgabe', 'Aufgaben']];

function wbLeeresWissen(welt) {
  return {
    fassung: 2, welt: welt,
    faecher: [], unterfaecher: [], seiten: [], eintraege: [], grabsteine: [],
    geaendert: wbIsoZeit()
  };
}

/* Ein geladener Bestand wird nur ergänzt, nie ersetzt: unbekannte Schlüssel
   aus einer neueren Fassung bleiben erhalten. */
function wbWissenOrdnen(roh, welt) {
  var w = (roh && typeof roh === 'object') ? roh : {};
  w.fassung = Number(w.fassung) || 2;
  w.welt = welt;
  ['faecher', 'unterfaecher', 'seiten', 'eintraege', 'grabsteine'].forEach(function (feld) {
    if (!Array.isArray(w[feld])) { w[feld] = []; }
  });
  return w;
}

function wbWissen(welt) { return wbDaten[welt] || null; }

function wbWelten() {
  return WB_BESTAENDE.map(function (b) { return b.welt; });
}

function wbSchmutzig(welt) {
  if (wbStand[welt]) { wbStand[welt].schmutzig = true; }
  if (wbDaten[welt]) { wbDaten[welt].geaendert = wbIsoZeit(); }
}

/* ---------- Laden und Sichern ---------- */

function wbLaden(id) {
  var b = wbBestand(id);
  var s = wbStand[id];
  if (!b) { return Promise.reject(new Error('Unbekannter Bestand: ' + id)); }
  s.fehler = '';
  /* Ohne Weg wird nichts geladen — und nichts angelegt. Ein leerer Bestand,
     der nach „neu angelegt" aussieht, obwohl nur die Verbindung fehlt, ist
     die gefährlichste Anzeige: wer darauf schreibt, schreibt ins Nichts. */
  if ((b.weg === 'drive') ? !wbTokenGueltig() : !wbHandles[b.welt]) {
    s.geladen = false;
    s.quelle = 'ohne';
    s.fehler = (b.weg === 'drive') ? 'Google Drive ist an diesem Gerät nicht verbunden.'
                                   : 'Kein Ordner auf dem Firmenspeicher gewählt.';
    wbDaten[id] = null;
    return Promise.resolve(null);
  }
  var holen = (b.weg === 'drive')
    ? wbDriveLesen(b.datei)
    : wbDateiAusHandle(wbHandles[b.welt], b.datei, false).then(wbDateiLesen).catch(function () { return null; });
  return holen.then(function (text) {
    var roh = null;
    if (text) {
      try { roh = JSON.parse(text); } catch (e) { throw new Error(b.name + ': die Datei ist kein gültiges JSON.'); }
    }
    wbDaten[id] = roh ? wbWissenOrdnen(roh, b.welt) : wbLeeresWissen(b.welt);
    s.geladen = true;
    s.schmutzig = false;
    s.quelle = text ? b.weg : 'neu';
    s.zeit = wbIsoZeit();
    return wbDaten[id];
  }).catch(function (f) {
    s.fehler = f && f.message ? f.message : String(f);
    s.geladen = false;
    return null;
  });
}

function wbSichern(id) {
  var b = wbBestand(id);
  var s = wbStand[id];
  if (!b) { return Promise.reject(new Error('Unbekannter Bestand: ' + id)); }
  if (!wbDaten[id]) { return Promise.resolve(false); }
  var text = JSON.stringify(wbDaten[id], null, 1);
  if (b.weg === 'drive') {
    return wbNachDrive(id, b.datei, text).then(function () {
      s.schmutzig = false; s.zeit = wbIsoZeit(); return true;
    });
  }
  if (!wbHandles[b.welt]) { return Promise.reject(new Error(b.name + ': kein Speicherort gewählt.')); }
  return wbDateiAusHandle(wbHandles[b.welt], b.datei, true)
    .then(function (h) { return wbDateiSchreiben(h, text); })
    .then(function () { s.schmutzig = false; s.zeit = wbIsoZeit(); return true; });
}

/* ---------- Fächer und Unterfächer ---------- */

function wbNachRang(a, b) {
  return (Number(a.rang || 0) - Number(b.rang || 0))
      || String(a.name || '').localeCompare(String(b.name || ''), 'de');
}

function wbFaecher(welt, auchArchiv) {
  var w = wbWissen(welt);
  if (!w) { return []; }
  return w.faecher.filter(function (f) { return auchArchiv || !f.archiv; }).sort(wbNachRang);
}

function wbUnterfaecher(welt, fachId, auchArchiv) {
  var w = wbWissen(welt);
  if (!w) { return []; }
  return w.unterfaecher.filter(function (u) {
    return u.fachId === fachId && (auchArchiv || !u.archiv);
  }).sort(wbNachRang);
}

function wbFachFinden(welt, id) {
  var w = wbWissen(welt);
  var i;
  if (!w) { return null; }
  for (i = 0; i < w.faecher.length; i += 1) { if (w.faecher[i].id === id) { return w.faecher[i]; } }
  return null;
}

function wbUnterfachFinden(welt, id) {
  var w = wbWissen(welt);
  var i;
  if (!w) { return null; }
  for (i = 0; i < w.unterfaecher.length; i += 1) { if (w.unterfaecher[i].id === id) { return w.unterfaecher[i]; } }
  return null;
}

function wbSatz(welt, art, id) {
  return (art === 'fach') ? wbFachFinden(welt, id) : wbUnterfachFinden(welt, id);
}

function wbFachAnlegen(welt, name) {
  var w = wbWissen(welt);
  var f;
  if (!w || !String(name || '').trim()) { return null; }
  f = { id: wbId('fa'), name: String(name).trim(), rang: w.faecher.length, geaendert: wbIsoZeit() };
  w.faecher.push(f);
  wbSchmutzig(welt);
  return f;
}

function wbUnterfachAnlegen(welt, fachId, name) {
  var w = wbWissen(welt);
  var u;
  if (!w || !wbFachFinden(welt, fachId) || !String(name || '').trim()) { return null; }
  u = { id: wbId('uf'), fachId: fachId, name: String(name).trim(),
        rang: wbUnterfaecher(welt, fachId, true).length, geaendert: wbIsoZeit() };
  w.unterfaecher.push(u);
  wbSchmutzig(welt);
  return u;
}

function wbUmbenennen(welt, art, id, name) {
  var o = wbSatz(welt, art, id);
  var n = String(name || '').trim();
  if (!o || !n) { return false; }
  o.name = n;
  o.geaendert = wbIsoZeit();
  wbSchmutzig(welt);
  return true;
}

/* Ein Unterfach zieht um — seine Seiten und Einträge ziehen mit, weil sie an
   der Kennung hängen und nicht am Fach. */
function wbUmhaengen(welt, id, fachId) {
  var u = wbUnterfachFinden(welt, id);
  var w = wbWissen(welt);
  if (!u || !wbFachFinden(welt, fachId)) { return false; }
  if (u.fachId === fachId) { return true; }
  u.fachId = fachId;
  u.rang = wbUnterfaecher(welt, fachId, true).length;
  u.geaendert = wbIsoZeit();
  w.seiten.forEach(function (s) { if (s.unterfachId === id) { s.fachId = fachId; } });
  w.eintraege.forEach(function (e) { if (e.unterfachId === id) { e.fachId = fachId; } });
  wbSchmutzig(welt);
  return true;
}

/* Die Reihenfolge steht als Rang in den Daten, nicht in der Lage im Feld —
   sonst dreht der Abgleich zwischen zwei Geräten sie wieder um. */
function wbRangSchieben(welt, art, id, richtung) {
  var o = wbSatz(welt, art, id);
  var geschwister;
  var i;
  var nachbar;
  var merk;
  if (!o) { return false; }
  geschwister = (art === 'fach') ? wbFaecher(welt, true) : wbUnterfaecher(welt, o.fachId, true);
  for (i = 0; i < geschwister.length; i += 1) { if (geschwister[i].id === id) { break; } }
  nachbar = geschwister[i + (richtung < 0 ? -1 : 1)];
  if (!nachbar) { return false; }
  geschwister.forEach(function (g, k) { g.rang = k; });
  merk = o.rang;
  o.rang = nachbar.rang;
  nachbar.rang = merk;
  o.geaendert = wbIsoZeit();
  nachbar.geaendert = wbIsoZeit();
  wbSchmutzig(welt);
  return true;
}

function wbArchivieren(welt, art, id, an) {
  var o = wbSatz(welt, art, id);
  if (!o) { return false; }
  if (an) { o.archiv = true; } else { delete o.archiv; }
  o.geaendert = wbIsoZeit();
  /* Ein archiviertes Fach nimmt seine Unterfächer mit — sonst stünden sie
     ohne sichtbares Fach in der Liste. */
  if (art === 'fach') {
    wbUnterfaecher(welt, id, true).forEach(function (u) {
      if (an) { u.archiv = true; } else { delete u.archiv; }
      u.geaendert = wbIsoZeit();
    });
  }
  wbSchmutzig(welt);
  return true;
}

/* Gelöscht wird nur, was nichts mehr trägt. Was Seiten hält, wird archiviert —
   eine Seite ohne Fach wäre aus dem Block verschwunden und nirgends zu sehen. */
function wbLoeschbar(welt, art, id) {
  var o = wbSatz(welt, art, id);
  var kinder;
  var seiten;
  if (!o) { return { geht: false, grund: 'Gibt es nicht.' }; }
  if (art === 'fach') {
    kinder = wbUnterfaecher(welt, id, true);
    if (kinder.length) {
      return { geht: false, grund: 'Darin liegen noch ' + kinder.length + ' Unterfächer. Erst die, dann das Fach.' };
    }
  }
  seiten = wbSeitenIn(welt, art === 'fach' ? id : '', art === 'fach' ? '' : id, false);
  if (seiten.length) {
    return { geht: false, grund: 'Darin liegen noch ' + seiten.length
      + ' Seiten. Ins Archiv legen lässt sie stehen.' };
  }
  return { geht: true, grund: '' };
}

/* Der Grabstein: ohne ihn holt das andere Gerät den Satz beim nächsten
   Abgleich zurück, weil es ihn hat und wir nicht. */
function wbLoeschen(welt, art, id) {
  var w = wbWissen(welt);
  var pruefung = wbLoeschbar(welt, art, id);
  var feld;
  if (!w || !pruefung.geht) { return false; }
  feld = (art === 'fach') ? 'faecher' : 'unterfaecher';
  w[feld] = w[feld].filter(function (o) { return o.id !== id; });
  w.grabsteine.push({ id: id, art: art, zeit: wbIsoZeit() });
  wbSchmutzig(welt);
  return true;
}

/* ---------- Seiten ---------- */

function wbSeiteFinden(welt, id) {
  var w = wbWissen(welt);
  var i;
  if (!w) { return null; }
  for (i = 0; i < w.seiten.length; i += 1) { if (w.seiten[i].id === id) { return w.seiten[i]; } }
  return null;
}

/* Eine Seite in irgendeiner geladenen Welt — für den Link aus CLIE,
   der nur die Kennung trägt und nicht weiß, in welcher Welt sie liegt. */
function wbSeiteSuchen(id) {
  var gefunden = null;
  wbWelten().forEach(function (welt) {
    var s = gefunden ? null : wbSeiteFinden(welt, id);
    if (s) { gefunden = { welt: welt, seite: s }; }
  });
  return gefunden;
}

/* Der Block: alle Seiten ohne Fach, in der Reihenfolge, in der sie
   entstanden sind. Die neueste liegt hinten — wie in einem Block,
   den man nach vorn durchschreibt. */
function wbBlock(welt) {
  var w = wbWissen(welt);
  if (!w) { return []; }
  return w.seiten.filter(function (s) { return !s.fachId; }).sort(function (a, b) {
    return (Number(a.nr || 0) - Number(b.nr || 0)) || String(a.id).localeCompare(String(b.id));
  });
}

function wbSeitenIn(welt, fachId, unterfachId, mitUnterfaechern) {
  var w = wbWissen(welt);
  if (!w) { return []; }
  return w.seiten.filter(function (s) {
    if (unterfachId) { return s.unterfachId === unterfachId; }
    if (!fachId) { return false; }
    if (s.fachId !== fachId) { return false; }
    return mitUnterfaechern ? true : !s.unterfachId;
  }).sort(function (a, b) { return String(b.abgelegtAm || '').localeCompare(String(a.abgelegtAm || '')); });
}

/* Die Zahl am Fach zählt die Unterfächer mit — das ist die Zahl, die man
   beim Blick auf die Liste wissen will. */
function wbSeitenZahl(welt, fachId, unterfachId) {
  return wbSeitenIn(welt, fachId, unterfachId, true).length;
}

function wbSeiteNeu(welt) {
  var w = wbWissen(welt);
  var hoechste = 0;
  var s;
  if (!w) { return null; }
  w.seiten.forEach(function (x) { hoechste = Math.max(hoechste, Number(x.nr || 0)); });
  s = { id: wbId('se'), nr: hoechste + 1, datum: wbHeuteIso(), titel: '', text: '',
        skizze: '', fachId: '', unterfachId: '', abgelegtAm: '', zettel: [], geaendert: wbIsoZeit() };
  w.seiten.push(s);
  wbSchmutzig(welt);
  return s;
}

function wbSeiteAendern(welt, id, felder) {
  var s = wbSeiteFinden(welt, id);
  var n;
  if (!s) { return false; }
  for (n in felder) {
    if (Object.prototype.hasOwnProperty.call(felder, n)) { s[n] = felder[n]; }
  }
  s.geaendert = wbIsoZeit();
  wbSchmutzig(welt);
  return true;
}

function wbSeiteLoeschen(welt, id) {
  var w = wbWissen(welt);
  var s = wbSeiteFinden(welt, id);
  if (!w || !s) { return false; }
  if (s.fachId) { return false; }   /* Abgelegtes wird nicht nebenbei gelöscht */
  w.seiten = w.seiten.filter(function (x) { return x.id !== id; });
  w.eintraege = w.eintraege.filter(function (e) { return e.seiteId !== id; });
  w.grabsteine.push({ id: id, art: 'seite', zeit: wbIsoZeit() });
  wbSchmutzig(welt);
  return true;
}

function wbSeiteTitel(s) {
  if (!s) { return ''; }
  if (String(s.titel || '').trim()) { return String(s.titel).trim(); }
  return 'Ohne Titel';
}

function wbHeuteIso() {
  var d = new Date();
  var z = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
}

/* ---------- Post-its ---------- */

function wbZettelNeu(welt, seiteId, farbe) {
  var s = wbSeiteFinden(welt, seiteId);
  var z;
  if (!s) { return null; }
  if (!Array.isArray(s.zettel)) { s.zettel = []; }
  z = { id: wbId('zt'), farbe: wbFarbeGueltig(farbe), text: '', geaendert: wbIsoZeit() };
  s.zettel.push(z);
  s.geaendert = wbIsoZeit();
  wbSchmutzig(welt);
  return z;
}

function wbFarbeGueltig(farbe) {
  var i;
  for (i = 0; i < WB_FARBEN.length; i += 1) { if (WB_FARBEN[i][0] === farbe) { return farbe; } }
  return 'gelb';
}

function wbZettelAendern(welt, seiteId, zettelId, text) {
  var s = wbSeiteFinden(welt, seiteId);
  var i;
  if (!s || !Array.isArray(s.zettel)) { return false; }
  for (i = 0; i < s.zettel.length; i += 1) {
    if (s.zettel[i].id === zettelId) {
      s.zettel[i].text = String(text === null || text === undefined ? '' : text);
      s.zettel[i].geaendert = wbIsoZeit();
      s.geaendert = wbIsoZeit();
      wbSchmutzig(welt);
      return true;
    }
  }
  return false;
}

function wbZettelWeg(welt, seiteId, zettelId) {
  var s = wbSeiteFinden(welt, seiteId);
  if (!s || !Array.isArray(s.zettel)) { return false; }
  s.zettel = s.zettel.filter(function (z) { return z.id !== zettelId; });
  s.geaendert = wbIsoZeit();
  wbSchmutzig(welt);
  return true;
}

/* ---------- Ablegen ---------- */

function wbEintragNeu(welt, art, text, seiteId, fachId, unterfachId) {
  var w = wbWissen(welt);
  var e;
  if (!w || !String(text || '').trim()) { return null; }
  e = { id: wbId('ei'), art: art, text: String(text).trim(), seiteId: seiteId,
        fachId: fachId, unterfachId: unterfachId || '', uebernommen: false, geaendert: wbIsoZeit() };
  w.eintraege.push(e);
  wbSchmutzig(welt);
  return e;
}

/* Die Seite wandert aus dem Block ins Fach, wie herausgetrennt: sie bekommt
   ein Fach und ist damit aus wbBlock() verschwunden. Kein Verweis bleibt. */
function wbAblegen(welt, seiteId, fachId, unterfachId, antworten) {
  var s = wbSeiteFinden(welt, seiteId);
  var a = antworten || {};
  var uf = unterfachId || '';
  var ziel = uf ? wbUnterfachFinden(welt, uf) : wbFachFinden(welt, fachId);
  if (!s || !ziel) { return false; }
  if (uf) { fachId = ziel.fachId; }
  s.fachId = fachId;
  s.unterfachId = uf;
  s.abgelegtAm = wbIsoZeit();
  s.geaendert = wbIsoZeit();
  wbEintragNeu(welt, 'erkenntnis', a.erkenntnis, seiteId, fachId, uf);
  wbEintragNeu(welt, 'frage', a.frage, seiteId, fachId, uf);
  wbEintragNeu(welt, 'aufgabe', a.aufgabe, seiteId, fachId, uf);
  wbSchmutzig(welt);
  return true;
}

function wbEintraege(welt, art, fachId, unterfachId, mitUnterfaechern) {
  var w = wbWissen(welt);
  if (!w) { return []; }
  return w.eintraege.filter(function (e) {
    if (e.art !== art) { return false; }
    if (unterfachId) { return e.unterfachId === unterfachId; }
    if (e.fachId !== fachId) { return false; }
    return mitUnterfaechern ? true : !e.unterfachId;
  }).sort(function (a, b) {
    return (a.uebernommen === b.uebernommen) ? 0 : (a.uebernommen ? 1 : -1);
  });
}

function wbEintragFinden(welt, id) {
  var w = wbWissen(welt);
  var i;
  if (!w) { return null; }
  for (i = 0; i < w.eintraege.length; i += 1) { if (w.eintraege[i].id === id) { return w.eintraege[i]; } }
  return null;
}

function wbEintragHaken(welt, id) {
  var e = wbEintragFinden(welt, id);
  if (!e) { return false; }
  e.uebernommen = !e.uebernommen;
  e.geaendert = wbIsoZeit();
  wbSchmutzig(welt);
  return true;
}

function wbEintragWeg(welt, id) {
  var w = wbWissen(welt);
  if (!w || !wbEintragFinden(welt, id)) { return false; }
  w.eintraege = w.eintraege.filter(function (e) { return e.id !== id; });
  w.grabsteine.push({ id: id, art: 'eintrag', zeit: wbIsoZeit() });
  wbSchmutzig(welt);
  return true;
}

/* ---------- Der Link für CLIE ---------- */

/* Nur die Kennung, kein Titel und keine Welt — so verrät ein Link auf eine
   berufliche Seite im privaten Aufgabensystem nichts über ihren Inhalt. */
function wbLink(seiteId) {
  var ort = (typeof window !== 'undefined' && window.location) ? String(window.location.href) : '';
  return ort.split('#')[0] + '#s=' + String(seiteId || '');
}

function wbLinkZiel() {
  var h = (typeof window !== 'undefined' && window.location) ? String(window.location.hash || '') : '';
  var t = h.match(/^#s=([\w-]+)$/);
  return t ? t[1] : '';
}

/* ---------- Skizzen als Dateien, nicht in der Datendatei ---------- */

var wbBildCache = {};   /* Kennung -> Objekt-URL, nur für diese Sitzung */

/* Die Kennung sagt, wo das Bild liegt: „ordner:<name>" im Dateiordner der
   Welt, „drive:<id>" in Google Drive. In der Datendatei steht nur sie. */
function wbBildAblegen(welt, datei) {
  var b = wbBestand(welt);
  var name;
  if (!b || !datei) { return Promise.reject(new Error('Kein Bild.')); }
  if (b.weg === 'drive') {
    if (!wbDarfZuDrive(welt)) { return Promise.reject(new Error(b.name + ' darf nicht zu Drive.')); }
    if (!wbTokenGueltig()) { return Promise.reject(new Error('Nicht bei Google angemeldet.')); }
    return wbDriveBildHoch(datei).then(function (id) { return 'drive:' + id; });
  }
  name = wbId('bi') + wbEndung(datei);
  return wbDateiOrdner(welt, true).then(function (ordner) {
    if (!ordner) { throw new Error('Der Dateiordner lässt sich nicht anlegen.'); }
    return ordner.getFileHandle(name, { create: true });
  }).then(function (h) {
    return h.createWritable().then(function (strom) {
      return strom.write(datei).then(function () { return strom.close(); });
    });
  }).then(function () { return 'ordner:' + name; });
}

/* Die Endung kommt aus dem Namen; hat die Datei keinen — etwa weil sie beim
   Umzug in die andere Welt nur ein Blob ist —, entscheidet ihr Typ. */
function wbEndung(datei) {
  var name = (datei && datei.name) ? String(datei.name) : String(datei || '');
  var t = name.match(/(\.[a-z0-9]{1,5})$/i);
  var typ = (datei && datei.type) ? String(datei.type) : '';
  if (t) { return t[1].toLowerCase(); }
  if (/jpe?g/.test(typ)) { return '.jpg'; }
  if (/webp/.test(typ)) { return '.webp'; }
  if (/gif/.test(typ)) { return '.gif'; }
  return '.png';
}

function wbDriveBildHoch(datei) {
  var grenze = 'wbgrenze' + Date.now().toString(36);
  var kopf = '--' + grenze + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'
    + JSON.stringify({ name: 'workbench-skizze-' + wbId('bi') + wbEndung(datei),
                       mimeType: datei.type || 'image/png' })
    + '\r\n--' + grenze + '\r\nContent-Type: ' + (datei.type || 'image/png') + '\r\n\r\n';
  var fuss = '\r\n--' + grenze + '--';
  var leib = new Blob([kopf, datei, fuss], { type: 'multipart/related; boundary=' + grenze });
  return window.fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: wbDriveKopf({ 'Content-Type': 'multipart/related; boundary=' + grenze }),
    body: leib
  }).then(wbAntwortPruefen).then(function (a) { return a.json(); }).then(function (d) { return d.id; });
}

function wbBildHolen(welt, kennung) {
  var schluessel = welt + '|' + kennung;
  if (wbBildCache[schluessel]) { return Promise.resolve(wbBildCache[schluessel]); }
  var hol;
  if (String(kennung).indexOf('drive:') === 0) {
    if (!wbTokenGueltig()) { return Promise.resolve(''); }
    hol = window.fetch('https://www.googleapis.com/drive/v3/files/'
        + String(kennung).slice(6) + '?alt=media', { headers: wbDriveKopf() })
      .then(wbAntwortPruefen).then(function (a) { return a.blob(); });
  } else {
    hol = wbDateiOrdner(welt, false).then(function (ordner) {
      if (!ordner) { throw new Error('kein Ordner'); }
      return ordner.getFileHandle(String(kennung).slice(7), { create: false });
    }).then(function (h) { return h.getFile(); });
  }
  return hol.then(function (blob) {
    var url = window.URL.createObjectURL(blob);
    wbBildCache[schluessel] = url;
    return url;
  }).catch(function () { return ''; });
}

/* ============================================================
   Tinte: Handschrift als eigene Datei je Seite
   ------------------------------------------------------------
   Die Striche stehen nicht in der Datendatei. Eine beschriebene
   Seite sind schnell 80 Kilobyte Punkte; bei hundert Seiten wäre
   jedes Sichern ein Upload von Megabyte. Also je Seite eine
   eigene Datei, geschrieben, wenn die Seite verlassen wird.
   ============================================================ */

var wbTinte = {};        /* welt|seiteId -> [{breite, punkte:[x,y,druck,…]}] */
var wbTinteOffen = {};   /* welt|seiteId -> true, wenn ungesichert */

function wbTinteSchluessel(welt, seiteId) { return welt + '|' + seiteId; }

function wbTinteName(seiteId) { return 'tinte-' + String(seiteId) + '.json'; }

function wbTinteVon(welt, seiteId) {
  var k = wbTinteSchluessel(welt, seiteId);
  return Array.isArray(wbTinte[k]) ? wbTinte[k] : [];
}

function wbTinteSetzen(welt, seiteId, striche) {
  var k = wbTinteSchluessel(welt, seiteId);
  wbTinte[k] = Array.isArray(striche) ? striche : [];
  wbTinteOffen[k] = true;
  var s = wbSeiteFinden(welt, seiteId);
  if (s && !!s.tinte !== !!wbTinte[k].length) {
    s.tinte = wbTinte[k].length ? wbTinteName(seiteId) : '';
    s.geaendert = wbIsoZeit();
    wbSchmutzig(welt);
  }
}

function wbTinteLaden(welt, seiteId) {
  var k = wbTinteSchluessel(welt, seiteId);
  var s = wbSeiteFinden(welt, seiteId);
  if (wbTinte[k]) { return Promise.resolve(wbTinte[k]); }
  if (!s || !s.tinte) { wbTinte[k] = []; return Promise.resolve([]); }
  return wbDateiLesenAus(welt, wbTinteName(seiteId)).then(function (text) {
    var d = null;
    try { d = JSON.parse(text || 'null'); } catch (e) { d = null; }
    wbTinte[k] = (d && Array.isArray(d.striche)) ? d.striche : [];
    return wbTinte[k];
  }).catch(function () { wbTinte[k] = []; return []; });
}

function wbTinteSichern(welt, seiteId) {
  var k = wbTinteSchluessel(welt, seiteId);
  if (!wbTinteOffen[k]) { return Promise.resolve(true); }
  return wbDateiSchreibenIn(welt, wbTinteName(seiteId),
      JSON.stringify({ fassung: 1, striche: wbTinteVon(welt, seiteId) }))
    .then(function () { wbTinteOffen[k] = false; return true; });
}

function wbTinteAlleOffen() {
  return Object.keys(wbTinteOffen).filter(function (k) { return wbTinteOffen[k]; })
    .map(function (k) { return { welt: k.split('|')[0], seiteId: k.split('|')[1] }; });
}

/* ---------- eine kleine Datei je Welt lesen und schreiben ---------- */

function wbDateiLesenAus(welt, name) {
  var b = wbBestand(welt);
  if (!b) { return Promise.reject(new Error('Unbekannte Welt')); }
  if (b.weg === 'drive') { return wbDriveLesen(name); }
  if (!wbHandles[welt]) { return Promise.reject(new Error('Kein Speicherort')); }
  return wbDateiAusHandle(wbHandles[welt], name, false).then(wbDateiLesen);
}

function wbDateiSchreibenIn(welt, name, text) {
  var b = wbBestand(welt);
  if (!b) { return Promise.reject(new Error('Unbekannte Welt')); }
  if (b.weg === 'drive') { return wbNachDrive(welt, name, text); }
  if (!wbHandles[welt]) { return Promise.reject(new Error('Kein Speicherort gewählt.')); }
  return wbDateiAusHandle(wbHandles[welt], name, true).then(function (h) {
    return wbDateiSchreiben(h, text);
  });
}

/* ============================================================
   Eine Seite verschieben — auch in die andere Welt
   ------------------------------------------------------------
   Innerhalb einer Welt wechselt nur das Fach. Über die Welten
   hinweg zieht die Seite wirklich um: Satz, Einträge, Skizze und
   Tinte wandern in den anderen Bestand, hier bleibt ein Grabstein.
   Von Beruflich nach Privat heißt das, Inhalt aus dem Firmen-
   speicher nach Drive zu tragen — davor warnt die Oberfläche.
   ============================================================ */

function wbVerschiebenImGleichen(welt, seiteId, fachId, unterfachId) {
  var w = wbWissen(welt);
  var s = wbSeiteFinden(welt, seiteId);
  var uf = unterfachId || '';
  var ziel = uf ? wbUnterfachFinden(welt, uf) : wbFachFinden(welt, fachId);
  if (!w || !s || !ziel) { return false; }
  s.fachId = uf ? ziel.fachId : fachId;
  s.unterfachId = uf;
  s.geaendert = wbIsoZeit();
  w.eintraege.forEach(function (e) {
    if (e.seiteId !== seiteId) { return; }
    e.fachId = s.fachId;
    e.unterfachId = uf;
    e.geaendert = wbIsoZeit();
  });
  wbSchmutzig(welt);
  return true;
}

function wbVerschiebenInWelt(vonWelt, seiteId, nachWelt, fachId, unterfachId) {
  var vw = wbWissen(vonWelt);
  var nw = wbWissen(nachWelt);
  var s = wbSeiteFinden(vonWelt, seiteId);
  var uf = unterfachId || '';
  var ziel = uf ? wbUnterfachFinden(nachWelt, uf) : wbFachFinden(nachWelt, fachId);
  var kopie;
  var eintraege;
  if (!vw || !nw || !s || !ziel) { return Promise.resolve(false); }
  kopie = JSON.parse(JSON.stringify(s));
  eintraege = vw.eintraege.filter(function (e) { return e.seiteId === seiteId; })
    .map(function (e) { return JSON.parse(JSON.stringify(e)); });
  kopie.fachId = uf ? ziel.fachId : fachId;
  kopie.unterfachId = uf;
  kopie.geaendert = wbIsoZeit();
  /* Zuerst die Dateien — scheitern sie, bleibt alles, wie es war. */
  return wbDateienUmziehen(vonWelt, nachWelt, s).then(function (neu) {
    kopie.skizze = neu.skizze;
    kopie.tinte = neu.tinte;
    nw.seiten.push(kopie);
    eintraege.forEach(function (e) {
      e.fachId = kopie.fachId;
      e.unterfachId = uf;
      e.geaendert = wbIsoZeit();
      nw.eintraege.push(e);
    });
    vw.seiten = vw.seiten.filter(function (x) { return x.id !== seiteId; });
    vw.eintraege = vw.eintraege.filter(function (e) { return e.seiteId !== seiteId; });
    vw.grabsteine.push({ id: seiteId, art: 'seite', zeit: wbIsoZeit() });
    delete wbTinte[wbTinteSchluessel(vonWelt, seiteId)];
    delete wbTinteOffen[wbTinteSchluessel(vonWelt, seiteId)];
    wbSchmutzig(vonWelt);
    wbSchmutzig(nachWelt);
    return true;
  });
}

/* Skizze und Tinte wandern mit — ohne sie wäre die Seite drüben halb. */
function wbDateienUmziehen(vonWelt, nachWelt, s) {
  var aus = { skizze: '', tinte: '' };
  var schritte = Promise.resolve();
  if (s.skizze) {
    schritte = schritte.then(function () {
      return wbBildHolenRoh(vonWelt, s.skizze).then(function (blob) {
        if (!blob) { return null; }
        return wbBildAblegen(nachWelt, blob).then(function (k) { aus.skizze = k; });
      });
    });
  }
  if (s.tinte) {
    schritte = schritte.then(function () {
      return wbDateiLesenAus(vonWelt, wbTinteName(s.id)).then(function (text) {
        if (!text) { return null; }
        return wbDateiSchreibenIn(nachWelt, wbTinteName(s.id), text).then(function () {
          aus.tinte = wbTinteName(s.id);
        });
      }).catch(function () { return null; });
    });
  }
  return schritte.then(function () { return aus; });
}

function wbBildHolenRoh(welt, kennung) {
  if (String(kennung).indexOf('drive:') === 0) {
    if (!wbTokenGueltig()) { return Promise.resolve(null); }
    return window.fetch('https://www.googleapis.com/drive/v3/files/'
        + String(kennung).slice(6) + '?alt=media', { headers: wbDriveKopf() })
      .then(wbAntwortPruefen).then(function (a) { return a.blob(); }).catch(function () { return null; });
  }
  return wbDateiOrdner(welt, false).then(function (ordner) {
    if (!ordner) { return null; }
    return ordner.getFileHandle(String(kennung).slice(7), { create: false }).then(function (h) {
      return h.getFile();
    });
  }).catch(function () { return null; });
}


/* ===== wb_app.js ===== */
/* ============================================================
   wb_app.js — Notizen und Fächer
   ------------------------------------------------------------
   Zwei Bereiche auf einer Fläche. Leitsatz: zuerst das Papier,
   alles andere erst, wenn man es braucht.

   Es gibt keinen Weltenschalter. Der Block zeigt die Seiten
   aller Welten, deren Speicher gerade erreichbar ist — am
   Arbeits-PC ist das der Firmenspeicher, zu Hause Google Drive.
   In der Fächerliste stehen beide Welten als Überschrift, auch
   die unverbundene: so siehst du, dass es sie gibt, und
   verwechselst „nicht verbunden" nicht mit „nichts drin".
   ============================================================ */

var wb = {
  reiter: 'notizen',   /* notizen | faecher */
  seite: '',           /* offene Seite im Block */
  welt: '',            /* Welt der offenen Seite bzw. des offenen Fachs */
  fach: '', unterfach: '',
  sicht: 'fach',       /* fach | unterfach | alles */
  archiv: false,
  dialog: null,
  laeuft: false,
  bilder: {},          /* Kennung -> Objekt-URL, schon geholt */
  stift: 'stift',      /* stift | radierer */
  breite: 2,           /* 1 fein · 2 mittel · 3 kräftig */
  zeichnen: false,     /* mit Maus oder Finger zeichnen statt tippen */
  strich: null,        /* der Strich, der gerade entsteht */
  zurueck: []          /* Rückgängig-Stapel der laufenden Sitzung */
};
var WB_BREITEN = [[1, 'fein', 1.4], [2, 'mittel', 2.6], [3, 'kräftig', 4.4]];

var WB_REITER = [['notizen', 'Notizen'], ['faecher', 'Fächer']];
var WB_MONATE = ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sep.', 'Okt.', 'Nov.', 'Dez.'];
var WB_TAGE = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

function wbDatumText(is) {
  var t = String(is || '').split('-');
  var d;
  if (t.length !== 3) { return ''; }
  d = new Date(Number(t[0]), Number(t[1]) - 1, Number(t[2]));
  return WB_TAGE[d.getDay()] + ', ' + Number(t[2]) + '. ' + WB_MONATE[Number(t[1]) - 1];
}

function wbGeladeneWelten() {
  return wbWelten().filter(function (w) { return wbStand[w] && wbStand[w].geladen; });
}

/* ---------- Zeichnen ---------- */

function wbZeichne() {
  wbReiterZeichnen();
  wbFlaecheZeichnen();
  wbFussZeichnen();
  wbBilderNachladen();
}

function wbReiterZeichnen() {
  var nav = document.getElementById('reiter');
  var stand = document.getElementById('stand');
  var knopf = document.getElementById('linkKnopf');
  if (nav) {
    nav.innerHTML = WB_REITER.map(function (r) {
      return '<button type="button"' + (wb.reiter === r[0] ? ' class="an"' : '')
        + ' onclick="wbReiterSetzen(\'' + r[0] + '\')">' + wbEsc(r[1]) + '</button>';
    }).join('');
  }
  if (stand) { stand.textContent = wbStandText(); }
  if (knopf) {
    knopf.disabled = !(wb.reiter === 'notizen' && wb.seite);
    knopf.style.visibility = (wb.reiter === 'notizen') ? 'visible' : 'hidden';
  }
}

function wbStandText() {
  return WB_BESTAENDE.map(function (b) {
    var s = wbStand[b.id];
    return b.name + ': ' + (s.geladen ? (s.schmutzig ? 'ungesichert' : 'verbunden') : 'getrennt');
  }).join(' · ');
}

function wbReiterSetzen(r) {
  wb.reiter = r;
  if (r === 'faecher') { wb.fach = ''; wb.unterfach = ''; }
  wbZeichne();
}

function wbFlaecheZeichnen() {
  var el = document.getElementById('flaeche');
  if (!el) { return; }
  if (wb.reiter === 'faecher') {
    el.innerHTML = wb.fach ? wbFachHtml() : wbRegalHtml();
    return;
  }
  el.innerHTML = wbBlockHtml();
  if (wb.seite) { wbTinteAnbinden(); }
}

/* ---------- Der Block ---------- */

/* Alle Seiten im Block, über die geladenen Welten hinweg, in der Reihenfolge
   ihrer Entstehung. Auf einem Gerät ist meist nur eine Welt erreichbar. */
function wbBlockAlle() {
  var alle = [];
  wbGeladeneWelten().forEach(function (welt) {
    wbBlock(welt).forEach(function (s) { alle.push({ welt: welt, seite: s }); });
  });
  return alle.sort(function (a, b) {
    return String(a.seite.datum).localeCompare(String(b.seite.datum))
        || (Number(a.seite.nr || 0) - Number(b.seite.nr || 0));
  });
}

function wbBlockIndex() {
  var alle = wbBlockAlle();
  var i;
  for (i = 0; i < alle.length; i += 1) {
    if (alle[i].seite.id === wb.seite && alle[i].welt === wb.welt) { return i; }
  }
  return alle.length ? alle.length - 1 : -1;
}

function wbSeiteJetzt() {
  var alle = wbBlockAlle();
  var i = wbBlockIndex();
  return (i >= 0 && alle[i]) ? alle[i] : null;
}

function wbBlaettern(richtung) {
  var alle = wbBlockAlle();
  var i = wbBlockIndex() + (richtung < 0 ? -1 : 1);
  var vorherWelt = wb.welt;
  var vorherSeite = wb.seite;
  if (i < 0 || i >= alle.length) { return; }
  wb.seite = alle[i].seite.id;
  wb.welt = alle[i].welt;
  wbZeichne();
  /* Die verlassene Seite schreibt ihre Handschrift weg — sie liegt in einer
     eigenen Datei, und ungesicherte Tinte zwei Seiten weiter ist verloren. */
  if (vorherSeite) {
    wbTinteSichern(vorherWelt, vorherSeite).catch(function () {
      melde('Die Handschrift der vorigen Seite konnte nicht gesichert werden.', 'warn');
    });
  }
}

function wbBlockHtml() {
  var jetzt = wbSeiteJetzt();
  var alle = wbBlockAlle();
  var i = wbBlockIndex();
  if (!wbGeladeneWelten().length) { return wbStartHtml(); }
  if (!jetzt) {
    return '<div class="start"><h2>Der Block ist leer</h2>'
      + '<p>„Neue Seite" unten legt die erste an. Sie trägt das heutige Datum, '
      + 'der Titel ergibt sich beim Schreiben.</p></div>';
  }
  wb.seite = jetzt.seite.id;
  wb.welt = jetzt.welt;
  return '<div class="sicht">' + wbWerkzeugHtml()
    + '<div class="blatt">'
    + '<div class="stapel l" style="width:' + Math.min(4 + i * 2, 30) + 'px"></div>'
    + wbSeiteHtml(jetzt.welt, jetzt.seite)
    + '<div class="stapel r" style="width:' + Math.min(4 + (alle.length - 1 - i) * 2, 30) + 'px"></div>'
    + '</div></div>';
}

function wbSeiteHtml(welt, s) {
  var bild = s.skizze ? (wb.bilder[welt + '|' + s.skizze] || '') : '';
  var h = '<div class="seite">'
    + '<div class="datum">' + wbEsc(wbDatumText(s.datum))
    + (wbGeladeneWelten().length > 1 ? ' · ' + wbEsc(wbBestand(welt).name) : '') + '</div>'
    + '<input class="stitel" type="text" placeholder="Titel" value="' + wbEsc(s.titel)
    + '" oninput="wbFeldTippen(\'titel\', this.value)">';
  h += '<div class="skizze">';
  if (s.skizze && bild) {
    h += '<img src="' + wbEsc(bild) + '" alt="Skizze">'
      + '<button type="button" class="weg" onclick="wbSkizzeWeg()">entfernen</button>';
  } else if (s.skizze) {
    h += 'Skizze wird geladen…';
  } else {
    h += '<button type="button" class="kn" onclick="wbSkizzeWaehlen()">Skizze einfügen</button>';
  }
  h += '</div>';
  h += '<textarea class="stext" placeholder="Schreiben…" oninput="wbFeldTippen(\'text\', this.value)">'
    + wbEsc(s.text) + '</textarea>';
  h += '<canvas class="tinte' + (wb.zeichnen ? ' an' : '') + '" id="tinte"></canvas>';
  h += '<div class="zettel">';
  (Array.isArray(s.zettel) ? s.zettel : []).forEach(function (z) {
    h += '<div class="pi ' + wbEsc(z.farbe) + '">'
      + '<button type="button" class="weg" title="Weg" onclick="wbZettelWegKlick(\'' + wbEsc(z.id) + '\')">×</button>'
      + '<textarea oninput="wbZettelTippen(\'' + wbEsc(z.id) + '\', this.value)" placeholder="Notiz">'
      + wbEsc(z.text) + '</textarea></div>';
  });
  h += '<div class="neuz">Neu:' + WB_FARBEN.map(function (f) {
    return '<button type="button" class="' + f[0] + '" title="' + wbEsc(f[1])
      + '" onclick="wbZettelNeuKlick(\'' + f[0] + '\')"></button>';
  }).join('') + '</div>';
  h += '</div></div>';
  return h;
}

function wbFeldTippen(feld, wert) {
  var felder = {};
  if (!wb.seite) { return; }
  felder[feld] = wert;
  wbSeiteAendern(wb.welt, wb.seite, felder);
  wbReiterZeichnen();
}

function wbZettelTippen(id, wert) {
  wbZettelAendern(wb.welt, wb.seite, id, wert);
  wbReiterZeichnen();
}

function wbZettelNeuKlick(farbe) {
  if (!wb.seite) { return; }
  wbZettelNeu(wb.welt, wb.seite, farbe);
  wbZeichne();
}

function wbZettelWegKlick(id) {
  wbZettelWeg(wb.welt, wb.seite, id);
  wbZeichne();
}

function wbSeiteNeuKlick() {
  var geladen = wbGeladeneWelten();
  var s;
  if (!geladen.length) { melde('Erst eine Welt verbinden.', 'warn'); return; }
  if (geladen.length > 1) { wbWeltFragen(); return; }
  s = wbSeiteNeu(geladen[0]);
  if (!s) { return; }
  wb.welt = geladen[0];
  wb.seite = s.id;
  wb.reiter = 'notizen';
  wbZeichne();
}

function wbWeltFragen() {
  wb.dialog = 'welt';
  wbDialogAuf('Neue Seite — in welcher Welt?',
    '<p>Beide Speicher sind verbunden. Die Seite gehört in genau einen.</p>'
    + wbGeladeneWelten().map(function (w) {
      return '<p><button type="button" class="kn" onclick="wbSeiteNeuIn(\'' + w + '\')">'
        + wbEsc(wbBestand(w).name) + '</button></p>';
    }).join(''),
    '<span class="r"><button type="button" onclick="wbDialogZu()">Abbrechen</button></span>');
}

function wbSeiteNeuIn(welt) {
  var s = wbSeiteNeu(welt);
  wbDialogZu();
  if (!s) { return; }
  wb.welt = welt;
  wb.seite = s.id;
  wbZeichne();
}

/* Ein schlichtes Dateifeld statt des modernen Dialogs: den kennt Safari
   weder am iPad noch am Mac, und dort soll die Skizze gerade funktionieren. */
function wbSkizzeWaehlen() {
  var feld = document.getElementById('dateiWahl');
  if (!feld) { melde('Das Dateifeld fehlt.', 'warn'); return; }
  feld.value = '';
  feld.onchange = function () {
    var datei = (feld.files && feld.files[0]) ? feld.files[0] : null;
    feld.onchange = null;
    if (!datei) { return; }
    wbSkizzeUebernehmen(datei);
  };
  feld.click();
}

function wbSkizzeUebernehmen(datei) {
  Promise.resolve(datei).then(function (datei) {
    melde('Skizze wird abgelegt…', null);
    return wbBildAblegen(wb.welt, datei);
  }).then(function (kennung) {
    wbSeiteAendern(wb.welt, wb.seite, { skizze: kennung });
    wbZeichne();
    melde('Skizze eingefügt — noch ungesichert.', null);
  }).catch(function (f) {
    if (f && /abort/i.test(String(f.name || ''))) { return; }
    melde('Die Skizze ließ sich nicht ablegen.\n' + (f && f.message ? f.message : ''), 'warn');
  });
}

function wbSkizzeWeg() {
  wbSeiteAendern(wb.welt, wb.seite, { skizze: '' });
  wbZeichne();
}

/* Bilder werden nach dem Zeichnen nachgeholt und dann einmal neu gezeichnet. */
function wbBilderNachladen() {
  var s = wb.seite ? wbSeiteFinden(wb.welt, wb.seite) : null;
  var schluessel;
  if (!s || !s.skizze) { return; }
  schluessel = wb.welt + '|' + s.skizze;
  if (wb.bilder[schluessel] !== undefined) { return; }
  wb.bilder[schluessel] = '';
  wbBildHolen(wb.welt, s.skizze).then(function (url) {
    wb.bilder[schluessel] = url;
    if (url) { wbFlaecheZeichnen(); }
  });
}

function wbLinkKopieren() {
  var text = wbLink(wb.seite);
  var fertig = function () { melde('Link kopiert — in CLIE einfügen.', null); };
  if (!wb.seite) { return; }
  if (window.navigator && window.navigator.clipboard && window.navigator.clipboard.writeText) {
    window.navigator.clipboard.writeText(text).then(fertig, function () { wbLinkZeigen(text); });
    return;
  }
  wbLinkZeigen(text);
}

function wbLinkZeigen(text) {
  wb.dialog = 'link';
  wbDialogAuf('Link zur Seite',
    '<p>Das Kopieren hat der Browser nicht erlaubt. Markiere ihn und kopiere ihn von Hand.</p>'
    + '<label>Link</label><input type="text" value="' + wbEsc(text) + '" readonly>'
    + '<p>Er trägt nur die Kennung der Seite — keinen Titel, keine Welt.</p>',
    '<span class="r"><button type="button" class="pri" onclick="wbDialogZu()">Schließen</button></span>');
}

/* ---------- Ablegen ---------- */

function wbAblegenFragen() {
  var s = wb.seite ? wbSeiteFinden(wb.welt, wb.seite) : null;
  if (!s) { return; }
  if (!wbFaecher(wb.welt).length) {
    melde('In dieser Welt gibt es noch kein Fach. Lege eines unter „Fächer" an.', 'warn');
    return;
  }
  wb.dialog = 'ablegen';
  wbDialogAuf('Ablegen',
    '<label>Wohin</label><select id="dlgZiel">' + wbZielListeHtml(wb.welt) + '</select>'
    + '<label>Was hast du verstanden? → Erkenntnis</label><textarea id="dlgErk" placeholder="optional"></textarea>'
    + '<label>Was ist noch offen? → Offene Frage</label><textarea id="dlgFra" placeholder="optional"></textarea>'
    + '<label>Was ist der nächste Schritt? → Aufgabe</label><textarea id="dlgAuf" placeholder="optional"></textarea>'
    + '<p>Die Seite wandert danach aus dem Block ins Fach, wie herausgetrennt.</p>',
    '<button type="button" onclick="wbFachNeuFragen(\'' + wb.welt + '\')">+ Neues Fach</button>'
    + '<button type="button" onclick="wbUnterfachNeuFragen(\'' + wb.welt + '\',\'\')">+ Neues Unterfach</button>'
    + '<span class="r"><button type="button" onclick="wbDialogZu()">Abbrechen</button>'
    + '<button type="button" class="pri" onclick="wbAblegenFertig()">Ablegen</button></span>');
}

function wbZielListeHtml(welt) {
  var h = '';
  wbFaecher(welt).forEach(function (f) {
    h += '<option value="f:' + wbEsc(f.id) + '">' + wbEsc(f.name) + '</option>';
    wbUnterfaecher(welt, f.id).forEach(function (u) {
      h += '<option value="u:' + wbEsc(u.id) + '">   ' + wbEsc(f.name) + ' › ' + wbEsc(u.name) + '</option>';
    });
  });
  return h;
}

function wbAblegenFertig() {
  var wahl = document.getElementById('dlgZiel');
  var hol = function (id) {
    var el = document.getElementById(id);
    return el ? String(el.value || '').trim() : '';
  };
  var wert = wahl ? String(wahl.value || '') : '';
  var istUnter = wert.indexOf('u:') === 0;
  var ziel = wert.slice(2);
  var gut;
  if (!ziel) { melde('Bitte ein Fach wählen.', 'warn'); return; }
  gut = wbAblegen(wb.welt, wb.seite,
    istUnter ? '' : ziel, istUnter ? ziel : '',
    { erkenntnis: hol('dlgErk'), frage: hol('dlgFra'), aufgabe: hol('dlgAuf') });
  wbDialogZu();
  if (!gut) { melde('Das hat nicht geklappt.', 'warn'); return; }
  wb.fach = istUnter ? wbUnterfachFinden(wb.welt, ziel).fachId : ziel;
  wb.unterfach = istUnter ? ziel : '';
  wb.sicht = istUnter ? 'unterfach' : 'fach';
  wb.seite = '';
  wb.reiter = 'faecher';
  wbZeichne();
  melde('Abgelegt — noch ungesichert.', null);
}

/* ---------- Fächer ---------- */

function wbRegalHtml() {
  var h = '<div class="regal">';
  WB_BESTAENDE.forEach(function (b) {
    var s = wbStand[b.id];
    h += '<div class="welt">' + wbEsc(b.name) + (s.geladen ? '' : ' <small>— nicht verbunden</small>') + '</div>';
    if (!s.geladen) {
      h += '<div class="leerwelt"><span>' + wbEsc(s.fehler || 'Dieser Speicher ist an diesem Gerät nicht verbunden.')
        + ' Deine Fächer liegen dort und werden hier nicht angezeigt.</span>'
        + '<button type="button" class="kn" onclick="' + (b.weg === 'drive' ? 'wbAnmeldenKlick()' : 'wbOrtKlick()')
        + '">Verbinden…</button></div>';
      return;
    }
    if (!wbFaecher(b.welt, wb.archiv).length) {
      h += '<div class="leerwelt"><span>Noch kein Fach. Ein Fach ist ein Bereich, der Bestand hat.</span>'
        + '<button type="button" class="kn" onclick="wbFachNeuFragen(\'' + b.welt + '\')">Neues Fach</button></div>';
      return;
    }
    wbFaecher(b.welt, wb.archiv).forEach(function (f) {
      h += '<div class="fach"><button type="button" class="nmk" onclick="wbFachOeffnen(\''
        + b.welt + '\',\'' + wbEsc(f.id) + '\',\'\')">' + wbEsc(f.name)
        + (f.archiv ? ' <small>(Archiv)</small>' : '') + '</button>'
        + '<small>' + wbSeitenZahl(b.welt, f.id, '') + ' Seiten</small>'
        + '<button type="button" class="mehr" title="Mehr" onclick="wbMehrFragen(\''
        + b.welt + '\',\'fach\',\'' + wbEsc(f.id) + '\')">⋯</button></div>';
      wbUnterfaecher(b.welt, f.id, wb.archiv).forEach(function (u) {
        h += '<div class="unter"><button type="button" class="nmk" onclick="wbFachOeffnen(\''
          + b.welt + '\',\'' + wbEsc(f.id) + '\',\'' + wbEsc(u.id) + '\')">' + wbEsc(u.name)
          + (u.archiv ? ' <small>(Archiv)</small>' : '') + '</button>'
          + '<small>' + wbSeitenZahl(b.welt, '', u.id) + ' Seiten</small>'
          + '<button type="button" class="mehr" title="Mehr" onclick="wbMehrFragen(\''
          + b.welt + '\',\'unterfach\',\'' + wbEsc(u.id) + '\')">⋯</button></div>';
      });
    });
  });
  h += '</div>';
  return h;
}

function wbFachOeffnen(welt, fachId, unterfachId) {
  wb.welt = welt;
  wb.fach = fachId;
  wb.unterfach = unterfachId || '';
  wb.sicht = unterfachId ? 'unterfach' : 'fach';
  wb.reiter = 'faecher';
  wbZeichne();
}

function wbFachZu() {
  wb.fach = '';
  wb.unterfach = '';
  wbZeichne();
}

function wbSichtSetzen(sicht, unterfachId) {
  wb.sicht = sicht;
  wb.unterfach = unterfachId || '';
  wbZeichne();
}

function wbFachHtml() {
  var welt = wb.welt;
  var f = wbFachFinden(welt, wb.fach);
  var unterfaecher;
  var h;
  if (!f) { wb.fach = ''; return wbRegalHtml(); }
  unterfaecher = wbUnterfaecher(welt, f.id);
  h = '<div class="fv"><button type="button" class="zur" onclick="wbFachZu()">← Fächer</button>'
    + '<h1>' + wbEsc(f.name) + '</h1>'
    + '<div class="fvweg">' + wbEsc(wbBestand(welt).name) + ' · ' + wbSeitenZahl(welt, f.id, '')
    + ' Seiten · ' + unterfaecher.length + ' Unterfächer</div>';
  h += '<div class="uflaste">'
    + '<button type="button" class="' + (wb.sicht === 'fach' ? 'an' : '')
    + '" onclick="wbSichtSetzen(\'fach\',\'\')">Dieses Fach</button>'
    + unterfaecher.map(function (u) {
      return '<button type="button" class="' + (wb.sicht === 'unterfach' && wb.unterfach === u.id ? 'an' : '')
        + '" onclick="wbSichtSetzen(\'unterfach\',\'' + wbEsc(u.id) + '\')">'
        + wbEsc(u.name) + ' · ' + wbSeitenZahl(welt, '', u.id) + '</button>';
    }).join('')
    + '<button type="button" class="' + (wb.sicht === 'alles' ? 'an' : '')
    + '" onclick="wbSichtSetzen(\'alles\',\'\')">Alles zusammen</button></div>';

  var fachId = f.id;
  var unterId = (wb.sicht === 'unterfach') ? wb.unterfach : '';
  var mit = (wb.sicht === 'alles');
  h += '<div class="gitter"><div>';
  WB_ARTEN.forEach(function (a) {
    var liste = wbEintraege(welt, a[0], fachId, unterId, mit);
    h += '<div class="kiste"><h3>' + wbEsc(a[1])
      + (a[0] === 'aufgabe' ? ' <em>— Sammelstelle</em>' : '') + '</h3>';
    if (!liste.length) {
      h += '<p class="leise">Noch nichts. Einträge entstehen beim Ablegen einer Seite.</p>';
    }
    liste.forEach(function (e) {
      h += '<div class="ding' + (e.uebernommen ? ' weg' : '') + '">'
        + '<span class="tx">' + wbEsc(e.text) + '</span><span class="q">'
        + (a[0] === 'aufgabe'
            ? '<button type="button" onclick="wbEintragLinkKlick(\'' + wbEsc(e.id) + '\')">Link</button>'
              + '<button type="button" onclick="wbEintragHakenKlick(\'' + wbEsc(e.id) + '\')">'
              + (e.uebernommen ? 'in CLIE ✓' : 'übernommen?') + '</button>'
            : '')
        + '<button type="button" onclick="wbZurSeite(\'' + wbEsc(e.seiteId) + '\')">Seite →</button>'
        + '<button type="button" onclick="wbEintragWegKlick(\'' + wbEsc(e.id) + '\')" title="Löschen">×</button>'
        + '</span></div>';
    });
    h += '</div>';
  });
  h += '</div><div class="kiste"><h3>Seiten</h3><div class="mini">';
  var seiten = wbSeitenIn(welt, unterId ? '' : fachId, unterId, mit);
  if (!seiten.length) { h += '<p class="leise">Noch keine Seite abgelegt.</p>'; }
  seiten.forEach(function (s) {
    h += '<button type="button" class="mp" onclick="wbZurSeite(\'' + wbEsc(s.id) + '\')">'
      + wbEsc(wbSeiteTitel(s)) + '</button>';
  });
  h += '</div></div></div></div>';
  return h;
}

/* Eine abgelegte Seite wird im Block nicht mehr gezeigt — sie ist heraus-
   getrennt. Sie öffnet sich als Blatt im Fach, mit Weg zurück. */
function wbZurSeite(id) {
  var s = wbSeiteFinden(wb.welt, id);
  if (!s) { melde('Diese Seite liegt in einer Welt, die gerade nicht verbunden ist.', 'warn'); return; }
  wb.dialog = 'seite';
  wbDialogAuf(wbSeiteTitel(s),
    '<p>' + wbEsc(wbDatumText(s.datum)) + '</p>'
    + (s.text ? '<p style="color:var(--ink);white-space:pre-line">' + wbEsc(s.text) + '</p>'
              : '<p>Diese Seite trägt keinen Text.</p>')
    + ((Array.isArray(s.zettel) && s.zettel.length)
        ? s.zettel.map(function (z) {
            return '<p class="pi ' + wbEsc(z.farbe) + '" style="color:var(--ink)">' + wbEsc(z.text) + '</p>';
          }).join('')
        : ''),
    '<button type="button" onclick="wbVerschiebenFragen(\'' + wbEsc(id) + '\')">Verschieben…</button>'
    + '<span class="r"><button type="button" class="pri" onclick="wbDialogZu()">Schließen</button></span>');
}

function wbEintragHakenKlick(id) {
  wbEintragHaken(wb.welt, id);
  wbZeichne();
}

function wbEintragWegKlick(id) {
  wbEintragWeg(wb.welt, id);
  wbZeichne();
}

function wbEintragLinkKlick(id) {
  var e = wbEintragFinden(wb.welt, id);
  if (!e) { return; }
  wb.seite = e.seiteId;
  wbLinkKopieren();
}

/* ---------- Fächer pflegen ---------- */

function wbMehrFragen(welt, art, id) {
  var o = wbSatz(welt, art, id);
  var pruefung;
  if (!o) { return; }
  wb.welt = welt;
  pruefung = wbLoeschbar(welt, art, id);
  wb.dialog = 'mehr';
  wbDialogAuf((art === 'fach' ? 'Fach' : 'Unterfach') + ' — ' + o.name,
    '<label>Name</label><input id="dlgName" type="text" value="' + wbEsc(o.name) + '">'
    + (art === 'unterfach'
        ? '<label>Liegt im Fach</label><select id="dlgFach">'
          + wbFaecher(welt, true).map(function (f) {
            return '<option value="' + wbEsc(f.id) + '"' + (f.id === o.fachId ? ' selected' : '') + '>'
              + wbEsc(f.name) + '</option>';
          }).join('') + '</select>'
        : '')
    + '<label>Reihenfolge und Archiv</label>'
    + '<div class="zeile" style="margin-top:0">'
    + '<button type="button" onclick="wbSchieben(\'' + art + '\',\'' + wbEsc(id) + '\',-1)">▲</button>'
    + '<button type="button" onclick="wbSchieben(\'' + art + '\',\'' + wbEsc(id) + '\',1)">▼</button>'
    + '<button type="button" onclick="wbArchivSetzen(\'' + art + '\',\'' + wbEsc(id) + '\','
    + (o.archiv ? 'false' : 'true') + ')">' + (o.archiv ? 'Aus dem Archiv' : 'Ins Archiv') + '</button></div>'
    + (pruefung.geht ? '' : '<p>Löschen geht nicht: ' + wbEsc(pruefung.grund) + '</p>'),
    '<button type="button" class="gefahr" onclick="wbLoeschenKlick(\'' + art + '\',\'' + wbEsc(id) + '\')"'
    + (pruefung.geht ? '' : ' disabled') + '>Löschen</button>'
    + '<span class="r"><button type="button" onclick="wbDialogZu()">Abbrechen</button>'
    + '<button type="button" class="pri" onclick="wbMehrFertig(\'' + art + '\',\'' + wbEsc(id) + '\')">Übernehmen</button></span>');
}

function wbMehrFertig(art, id) {
  var name = document.getElementById('dlgName');
  var fach = document.getElementById('dlgFach');
  var n = name ? String(name.value || '').trim() : '';
  if (!n) { melde('Ohne Namen geht es nicht.', 'warn'); return; }
  wbUmbenennen(wb.welt, art, id, n);
  if (art === 'unterfach' && fach) { wbUmhaengen(wb.welt, id, fach.value); }
  wbDialogZu();
  wbZeichne();
  melde('Übernommen — noch ungesichert.', null);
}

function wbSchieben(art, id, richtung) {
  if (!wbRangSchieben(wb.welt, art, id, richtung)) { melde('Weiter geht es nicht.', null); return; }
  wbZeichne();
  wbMehrFragen(wb.welt, art, id);
}

function wbArchivSetzen(art, id, an) {
  wbArchivieren(wb.welt, art, id, an);
  if (an && art === 'fach' && wb.fach === id) { wb.fach = ''; }
  wbDialogZu();
  wbZeichne();
  melde(an ? 'Ins Archiv gelegt.' : 'Aus dem Archiv geholt.', null);
}

function wbLoeschenKlick(art, id) {
  var o = wbSatz(wb.welt, art, id);
  var pruefung = wbLoeschbar(wb.welt, art, id);
  if (!o) { return; }
  if (!pruefung.geht) { melde(pruefung.grund, 'warn'); return; }
  wb.dialog = 'loeschen';
  wbDialogAuf('Wirklich löschen?',
    '<p style="color:var(--ink)">„' + wbEsc(o.name) + '" wird gelöscht und verschwindet auch auf '
    + 'deinen anderen Geräten. Das lässt sich nicht zurückholen.</p>'
    + '<p>Soll es nur aus dem Weg: abbrechen und ins Archiv legen.</p>',
    '<span class="r"><button type="button" onclick="wbDialogZu()">Abbrechen</button>'
    + '<button type="button" class="pri" onclick="wbLoeschenFertig(\'' + art + '\',\'' + wbEsc(id) + '\')">Löschen</button></span>');
}

function wbLoeschenFertig(art, id) {
  var gut = wbLoeschen(wb.welt, art, id);
  if (gut && art === 'fach' && wb.fach === id) { wb.fach = ''; }
  wbDialogZu();
  wbZeichne();
  melde(gut ? 'Gelöscht — noch ungesichert.' : 'Das ging nicht.', gut ? null : 'warn');
}

function wbFachNeuFragen(welt) {
  wb.welt = welt || wb.welt;
  if (!wbWissen(wb.welt)) { melde('Diese Welt ist nicht verbunden.', 'warn'); return; }
  wb.dialog = 'fachNeu';
  wbDialogAuf('Neues Fach in ' + wbBestand(wb.welt).name,
    '<label>Name</label><input id="dlgName" type="text" placeholder="Qualitätsmanagement">'
    + '<p>Ein Fach ist ein Bereich, der Bestand hat.</p>',
    '<span class="r"><button type="button" onclick="wbDialogZu()">Abbrechen</button>'
    + '<button type="button" class="pri" onclick="wbFachNeuFertig()">Anlegen</button></span>');
}

function wbFachNeuFertig() {
  var el = document.getElementById('dlgName');
  var name = el ? String(el.value || '').trim() : '';
  var f;
  if (!name) { melde('Ohne Namen geht es nicht.', 'warn'); return; }
  f = wbFachAnlegen(wb.welt, name);
  wbDialogZu();
  wbZeichne();
  melde(f ? ('Fach „' + name + '" angelegt.') : 'Das ging nicht.', f ? null : 'warn');
}

function wbUnterfachNeuFragen(welt, fachId) {
  var faecher;
  wb.welt = welt || wb.welt;
  faecher = wbFaecher(wb.welt);
  if (!faecher.length) { melde('Erst ein Fach anlegen.', 'warn'); return; }
  wb.dialog = 'unterfachNeu';
  wbDialogAuf('Neues Unterfach',
    '<label>Im Fach</label><select id="dlgFach">'
    + faecher.map(function (f) {
      return '<option value="' + wbEsc(f.id) + '"' + (f.id === (fachId || wb.fach) ? ' selected' : '') + '>'
        + wbEsc(f.name) + '</option>';
    }).join('') + '</select>'
    + '<label>Name</label><input id="dlgName" type="text" placeholder="Testmanagement">',
    '<span class="r"><button type="button" onclick="wbDialogZu()">Abbrechen</button>'
    + '<button type="button" class="pri" onclick="wbUnterfachNeuFertig()">Anlegen</button></span>');
}

function wbUnterfachNeuFertig() {
  var fach = document.getElementById('dlgFach');
  var name = document.getElementById('dlgName');
  var n = name ? String(name.value || '').trim() : '';
  var u;
  if (!n) { melde('Ohne Namen geht es nicht.', 'warn'); return; }
  u = wbUnterfachAnlegen(wb.welt, fach ? fach.value : '', n);
  wbDialogZu();
  wbZeichne();
  melde(u ? ('Unterfach „' + n + '" angelegt.') : 'Das ging nicht.', u ? null : 'warn');
}
