    var zeile = knoepfe[i].closest('.tzeile') || knoepfe[i].closest('.tverlauf');
    if (erledigt) {
      knoepfe[i].classList.add('an');
      if (zeile) { zeile.classList.add('erledigt'); }
    } else {
      knoepfe[i].classList.remove('an');
      if (zeile) { zeile.classList.remove('erledigt'); }
    }
  }
}

/* ------------------------------------------------------------
   Schnelleingabe
   ------------------------------------------------------------ */

function eingabeDeuten(text) {
  var roh = String(text).trim();
  var haupt = false;
  var privat = false;
  if (roh.charAt(0) === '!') { haupt = true; roh = roh.slice(1).trim(); }
  var worte = roh.split(/\s+/);
  var letztes = worte.length ? worte[worte.length - 1].toLowerCase() : '';
  if (letztes === 'p' || letztes === 'privat') {
    privat = true;
    worte.pop();
    roh = worte.join(' ');
  }
  return {
    titel: roh,
    art: haupt ? 'haupt' : 'klein',
    kontext: privat ? 'privat' : 'beruflich'
  };
}

function schnellVorschau() {
  var feld = document.getElementById('schnellFeld');
  var box = document.getElementById('schnellVorschauZeile');
  if (!feld || !box) { return; }
  var wert = feld.value.trim();
  if (wert.length === 0) { box.classList.remove('sichtbar'); box.innerHTML = ''; return; }
  var d = eingabeDeuten(wert);
  box.innerHTML = 'wird angelegt als <b>' + (d.art === 'haupt' ? 'Aufgabe' : 'Kleinigkeit')
                + '</b> · <b>' + esc(kurzDatum(tagOffen)) + '</b> · <b>' + d.kontext + '</b>';
  box.classList.add('sichtbar');
}

function schnellTaste(ereignis) {
  if (!ereignis || ereignis.key !== 'Enter') { return; }
  schnellAnlegen();
}

function schnellAnlegen() {
  var feld = document.getElementById('schnellFeld');
  if (!feld) { return; }
  var wert = feld.value.trim();
  if (wert.length === 0) { return; }
  var d = eingabeDeuten(wert);
  if (!d.titel) { return; }
  DB.aufgaben.push({
    id: neueKennung(),
    titel: d.titel,
    beschreibung: '',
    kontext: d.kontext,
    themaId: null,
    projektId: null,
    frist: '',
    planung: tagOffen,
    uhrzeit: '',
    art: d.art,
    wiederholung: null,
    status: 'offen',
    erledigtAm: null,
    zuletztErledigt: null,
    ablaufSchritt: null,
    geaendert: jetzt()
  });
  feld.value = '';
  schnellVorschau();
  tagZeichnen();
  zeichne();
  spaeterSichern();
}

/* ------------------------------------------------------------
   Blättern
   ------------------------------------------------------------ */

function tagBlaettern(n) {
  tagOffen = tagePlus(tagOffen || isoDatum(), n);
  erledigtOffen = false;
  tagZeichnen();
}

function tagHeute() {
  tagOffen = isoDatum();
  erledigtOffen = false;
  tagZeichnen();
}

/* ============================================================
   Bedienung
   ============================================================ */

function dateiWaehlen() {
  if (!fsApiDa()) {
    melde('Dieser Browser kennt die Datei-Schnittstelle nicht. '
        + 'Es wird ' + (opfsDa() ? 'der geräteeigene Speicher' : 'der lokale Speicher') + ' benutzt.', 'warn');
    return;
  }
  window.showOpenFilePicker({
    multiple: false,
    types: [{ description: 'Workbench-Daten', accept: { 'application/json': ['.json'] } }]
  }).then(function (liste) {
    dateiHandle = liste[0];
    dateiName = dateiHandle.name;
    return rechteAnfragen(dateiHandle);
  }).then(function (stand) {
    rechteStand = stand;
    if (stand !== 'granted') {
      melde('Zugriff auf die Datei wurde nicht erteilt.', 'warn');
      zeichne();
      return null;
    }
    return idbSchreiben(IDB_KEY, dateiHandle).then(function () { return laden(); });
  }).then(function (weg) {
    if (weg) {
      melde('Datei geöffnet und gelesen: ' + dateiName + '\nSpeicherweg: ' + wegText(weg), 'gut');
    }
    zeichne();
  }).catch(function (f) {
    if (f && f.name === 'AbortError') { melde('Auswahl abgebrochen.'); return; }
    melde('Datei konnte nicht geöffnet werden.\n' + (f ? f.message : ''), 'warn');
  });
}

function dateiAnlegen() {
  if (typeof window.showSaveFilePicker !== 'function') {
    melde('Dieser Browser kann keine Datei anlegen. Es wird intern gespeichert.', 'warn');
    return;
  }
  window.showSaveFilePicker({
    suggestedName: DATEINAME,
    types: [{ description: 'Workbench-Daten', accept: { 'application/json': ['.json'] } }]
  }).then(function (handle) {
    dateiHandle = handle;
    dateiName = handle.name;
    return rechteAnfragen(dateiHandle);
  }).then(function (stand) {
    rechteStand = stand;
    if (stand !== 'granted') {
      melde('Schreibrecht wurde nicht erteilt.', 'warn');
      zeichne();
      return null;
    }
    speicherWeg = 'datei';
    return idbSchreiben(IDB_KEY, dateiHandle).then(function () { return speichern(); });
  }).then(function (weg) {
    if (weg) { melde('Datei angelegt: ' + dateiName, 'gut'); }
    zeichne();
  }).catch(function (f) {
    if (f && f.name === 'AbortError') { melde('Anlegen abgebrochen.'); return; }
    melde('Datei konnte nicht angelegt werden.\n' + (f ? f.message : ''), 'warn');
  });
}

function zugriffErlauben() {
  if (!dateiHandle) { melde('Es ist keine Datei hinterlegt.', 'warn'); return; }
  rechteAnfragen(dateiHandle).then(function (stand) {
    rechteStand = stand;
    if (stand === 'granted') {
      speicherWeg = 'datei';
      return laden().then(function () {
        melde('Zugriff erteilt, Datei gelesen.', 'gut');
      });
    }
    melde('Zugriff wurde abgelehnt.', 'warn');
    return null;
  }).then(zeichne);
}

function speichernJetzt() {
  speichern().then(function (weg) {
    melde('Gespeichert über: ' + wegText(weg) + '\n' + letzterSchreibvorgang, 'gut');
    zeichne();
  }).catch(function (f) {
    melde('Speichern fehlgeschlagen.\n' + (f ? f.message : ''), 'warn');
    zeichne();
  });
}

function ladenJetzt() {
  laden().then(function (weg) {
    if (weg) { melde('Gelesen über: ' + wegText(weg), 'gut'); }
    else { melde('Nichts zu lesen — der Bestand ist leer.', null); }
    zeichne();
  }).catch(function (f) {
    melde('Laden fehlgeschlagen.\n' + (f ? f.message : ''), 'warn');
    zeichne();
  });
}

function handleVergessen() {
  dateiHandle = null;
  dateiName = '';
  rechteStand = 'unbekannt';
  speicherWeg = opfsDa() ? 'opfs' : (localDa() ? 'local' : 'keiner');
  idbLoeschen(IDB_KEY).catch(function () { return null; }).then(function () {
    melde('Die Verbindung zur Datei wurde gelöst. Die Daten bleiben erhalten.', null);
    zeichne();
  });
}

function zeigeSchirm(name) {
  schirmOffen = name;
  var alle = ['Tag', 'Migration', 'Diagnose'];
  var i;
  for (i = 0; i < alle.length; i++) {
    var s = document.getElementById('schirm' + alle[i]);
    var n = document.getElementById('nav' + alle[i]);
    if (s) {
      if (alle[i] === name) { s.classList.add('aktiv'); } else { s.classList.remove('aktiv'); }
    }
    if (n) {
      if (alle[i] === name) { n.classList.add('aktiv'); } else { n.classList.remove('aktiv'); }
    }
  }
  var titel = document.getElementById('kopfTitel');
  if (titel) { titel.textContent = name; }
  if (name === 'Migration') { migZeichne(); }
  if (name === 'Tag') { tagZeichnen(); }
}

/* ============================================================
   Darstellung
   ============================================================ */

function wegText(weg) {
  if (weg === 'datei') { return 'Datei auf dem Gerät'; }
  if (weg === 'opfs')  { return 'geräteeigener Speicher'; }
  if (weg === 'local') { return 'lokaler Browserspeicher'; }
  return 'keiner';
}

function rechteText(stand) {
  if (stand === 'granted') { return 'erteilt'; }
  if (stand === 'prompt')  { return 'muss bestätigt werden'; }
  if (stand === 'denied')  { return 'abgelehnt'; }
  return 'unbekannt';
}

function zeile(name, wert, art) {
  return '<div class="zeile"><div class="zeile-name">' + name + '</div>'
       + '<div class="zeile-wert ' + (art || '') + '">' + wert + '</div></div>';
}

function jaNein(bedingung) {
  return bedingung
    ? { t: 'vorhanden', k: 'ja' }
    : { t: 'fehlt', k: 'nein' };
}

function zeichneSpeicher() {
  var ziel = document.getElementById('speicherListe');
  if (!ziel) { return; }
  var h = '';
  h += zeile('Aktiver Weg', wegText(speicherWeg), speicherWeg === 'keiner' ? 'nein' : 'ja');
  h += zeile('Datei', dateiName || '—', dateiName ? '' : 'grau');
  h += zeile('Berechtigung', rechteText(rechteStand),
             rechteStand === 'granted' ? 'ja' : (rechteStand === 'denied' ? 'nein' : 'grau'));
  h += zeile('Zuletzt geschrieben', letzterSchreibvorgang || 'noch nie',
             letzterSchreibvorgang ? '' : 'grau');
  ziel.innerHTML = h;

  var kr = document.getElementById('knopfRecht');
  if (kr) { kr.disabled = !dateiHandle || rechteStand === 'granted'; }
  var kd = document.getElementById('knopfDatei');
  if (kd) { kd.disabled = !fsApiDa(); }
  var kn = document.getElementById('knopfNeu');
  if (kn) { kn.disabled = (typeof window.showSaveFilePicker !== 'function'); }
}

function zeichneGoogle() {
  var ziel = document.getElementById('googleListe');
  if (!ziel) { return; }
  var an = tokenGueltig();
  var h = '';
  h += zeile('Anmeldung', an ? 'aktiv' : 'nicht angemeldet', an ? 'ja' : 'grau');
  h += zeile('Gültig noch', an ? (restMinuten() + ' Minuten') : '—', an ? '' : 'grau');
  h += zeile('Stille Erneuerung', erneuerungsUhr ? 'geplant' : 'nicht geplant',
             erneuerungsUhr ? 'ja' : 'grau');
  h += zeile('Drive-Datei', driveDateiId ? DRIVE_DATEI : 'noch nicht gesucht',
             driveDateiId ? '' : 'grau');
  h += zeile('Stand bei Drive', driveStand || '—', driveStand ? '' : 'grau');
  h += zeile('Letzte Übertragung', letzteUebertragung || 'noch nie',
             letzteUebertragung ? '' : 'grau');
  h += zeile('Rechte', 'drive.file · calendar.readonly', 'grau');
  h += zeile('Letzter Abgleich', letzterAbgleich || 'noch nie', letzterAbgleich ? '' : 'grau');
  h += zeile('Ergebnis', berichtText(letzterBericht),
             (letzterBericht && letzterBericht.konflikte.length) ? 'nein' : 'grau');
  h += zeile('Löschvermerke', String((DB.grabsteine || []).length),
             (DB.grabsteine || []).length ? '' : 'grau');
  h += zeile('Automatischer Abgleich', an ? 'aktiv' : 'ruht (nicht angemeldet)',
             an ? 'ja' : 'grau');
  h += zeile('Anmeldung gemerkt', warAngemeldet() ? 'ja' : 'nein',
             warAngemeldet() ? 'ja' : 'grau');
  ziel.innerHTML = h;

  var ka = document.getElementById('knopfAnmelden');
  var kb = document.getElementById('knopfAbmelden');
  var kl = document.getElementById('knopfDriveLaden');
  var ks = document.getElementById('knopfDriveSpeichern');
  if (ka) { ka.textContent = an ? 'Erneut anmelden' : 'Anmelden'; }
  if (kb) { kb.disabled = !an; }
  if (kl) { kl.disabled = !an; }
  if (ks) { ks.disabled = !an; }
  var kg = document.getElementById('knopfAbgleich');
  if (kg) { kg.disabled = !an; }
}

function zeichneBestand() {
  var ziel = document.getElementById('bestandListe');
  if (!ziel) { return; }
  var namen = {
    aufgaben: 'Aufgaben', ziele: 'Ziele', themen: 'Themen', projekte: 'Projekte',
    ablaeufe: 'Abläufe', durchlaeufe: 'Durchläufe', jahrestermine: 'Jahrestermine',
    kalenderzuordnung: 'Kalenderzuordnungen', termine: 'Berufliche Termine'
  };
  var h = '';
  var i;
  for (i = 0; i < SAMMLUNGEN.length; i++) {
    var s = SAMMLUNGEN[i];
    var wert = DB[s];
    var zahl = Array.isArray(wert) ? wert.length : Object.keys(wert || {}).length;
    h += zeile(namen[s] || s, String(zahl), zahl ? '' : 'grau');
  }
  var g = (DB.grabsteine || []).length;
  h += zeile('Löschvermerke', String(g), g ? '' : 'grau');
  ziel.innerHTML = h;
}

function zeichneUmgebung() {
  var ziel = document.getElementById('umgebungListe');
  if (!ziel) { return; }
  var pwa = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  var a = jaNein(fsApiDa());
  var b = jaNein(opfsDa());
  var c = jaNein(idbDa());
  var d = jaNein(localDa());
  var h = '';
  h += zeile('Version', APP_VERSION, '');
  h += zeile('Datei-Schnittstelle', a.t, a.k);
  h += zeile('Geräteeigener Speicher', b.t, b.k);
  h += zeile('IndexedDB', c.t, c.k);
  h += zeile('Lokaler Speicher', d.t, d.k);
  h += zeile('Als App installiert', pwa ? 'ja' : 'nein', pwa ? 'ja' : 'grau');
  h += zeile('Fensterhöhe', window.innerHeight + ' px', 'grau');
  h += zeile('Heute', isoDatum(), 'grau');
  ziel.innerHTML = h;
}

function zeichne() {
  var v = document.getElementById('kopfVersion');
  if (v) { v.textContent = 'v' + APP_VERSION; }
  zeichneSpeicher();
  zeichneGoogle();
  zeichneBestand();
  zeichneUmgebung();
}

/* ============================================================
   Start
   ============================================================ */

function warAngemeldet() {
  try { return window.localStorage.getItem(ANMELDE_MERKER) === '1'; }
  catch (e) { return false; }
}

function starten() {
  if (tokenAusSitzung()) {
    melde('Anmeldung aus dieser Sitzung übernommen, noch ' + restMinuten() + ' Minuten gültig.', null);
  } else if (warAngemeldet()) {
    /* Google kann den Zugriff ohne Nachfrage erneuern, solange die
       Sitzung im Browser besteht. Erst wenn das misslingt, fragen wir. */
    anmelden(true).then(function (gut) {
      if (gut) {
        melde('Anmeldung im Hintergrund erneuert.', 'gut');
        abgleichPlanen(true);
      } else {
        melde('Die Anmeldung ließ sich nicht im Hintergrund erneuern.\n'
            + 'Bitte unter Diagnose einmal „Anmelden" antippen.', 'warn');
      }
      zeichne();
    });
  }
  document.addEventListener('visibilitychange', rueckkehrPruefen);
  zeichne();
  if (!idbDa()) {
    speicherWeg = opfsDa() ? 'opfs' : (localDa() ? 'local' : 'keiner');
    ladenJetzt();
    return;
  }
  idbLesen(IDB_KEY).then(function (handle) {
    if (!handle) {
      speicherWeg = opfsDa() ? 'opfs' : (localDa() ? 'local' : 'keiner');
      return null;
    }
    dateiHandle = handle;
    dateiName = handle.name || DATEINAME;
    return rechtePruefen(handle);
  }).then(function (stand) {
    if (stand) { rechteStand = stand; }
    return laden();
  }).then(function (weg) {
    if (weg === 'datei') {
      melde('Datei gefunden und gelesen: ' + dateiName, 'gut');
    } else if (rechteStand === 'prompt') {
      melde('Eine Datei ist hinterlegt, der Zugriff muss aber bestätigt werden.\n'
          + 'Bitte „Zugriff erlauben" antippen.', 'warn');
    } else if (weg) {
      melde('Gelesen über: ' + wegText(weg), null);
    } else {
      melde('Noch kein Bestand vorhanden. Lege eine Datei an oder öffne eine.', null);
    }
    bestandStempeln(DB);
    tagOffen = isoDatum();
    tagZeichnen();
    zeigeSchirm('Tag');
    zeichne();
    if (tokenGueltig()) {
      abgleichen().then(function (b) {
        melde('Beim Start abgeglichen.\n' + berichtText(b), 'gut');
        tagZeichnen();
        zeichne();
      }).catch(function () {
        melde('Der Abgleich beim Start ist ausgefallen. Die App arbeitet lokal weiter.', null);
        zeichne();
      });
    }
  }).catch(function (f) {
    melde('Start unvollständig.\n' + (f ? f.message : ''), 'warn');
    zeichne();
  });
}

window.addEventListener('load', starten);
</script>
