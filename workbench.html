/* ---------- Verbinden und Sichern ---------- */

function wbStartHtml() {
  var h = '<div class="start"><h2>Noch nichts verbunden</h2>'
    + '<p>Berufliches liegt ausschließlich im Firmenspeicher und verlässt ihn nie. '
    + 'Privates liegt in Google Drive. Gleiche App, getrennte Inhalte.</p>';
  h += WB_BESTAENDE.map(function (b) {
    var s = wbStand[b.id];
    return '<div class="best"><span class="ampel ' + (s.geladen ? 'da' : (s.quelle === 'ohne' ? '' : (s.fehler ? 'weg' : ''))) + '"></span>'
      + '<span class="nm">' + wbEsc(b.name) + '<small>' + wbEsc(s.geladen
        ? (b.datei + ' · ' + (s.quelle === 'neu' ? 'neu angelegt' : 'geladen'))
        : (s.fehler || (b.datei + ' · noch nicht geladen'))) + '</small></span></div>';
  }).join('');
  h += '<p><button type="button" class="kn" onclick="wbOrtKlick()">Firmenspeicher wählen</button> '
    + '<button type="button" class="kn" onclick="wbAnmeldenKlick()">Bei Google anmelden</button></p></div>';
  return h;
}

function wbAnmeldenKlick() {
  melde('Anmeldung läuft…', null);
  wbAnmelden(false).then(function (gut) {
    if (!gut) { melde('Die Anmeldung hat nicht geklappt.', 'warn'); wbZeichne(); return null; }
    return wbAllesLaden();
  });
}

function wbOrtKlick() {
  wbOrtWaehlen('beruflich').then(function () {
    return wbLaden('beruflich');
  }).then(function () {
    wbZeichne();
    melde('Firmenspeicher verbunden.', null);
  }).catch(function (f) {
    if (f && /abort/i.test(String(f.name || ''))) { return; }
    melde('Kein Speicherort gewählt.\n' + (f && f.message ? f.message : ''), 'warn');
  });
}

function wbAllesLaden() {
  if (wb.laeuft) { return Promise.resolve(false); }
  wb.laeuft = true;
  return Promise.all(WB_BESTAENDE.map(function (b) { return wbLaden(b.id); })).then(function () {
    wb.laeuft = false;
    wbZielAnspringen();
    wbZeichne();
    return true;
  }).catch(function () {
    wb.laeuft = false;
    wbZeichne();
    return false;
  });
}

function wbAllesSichern() {
  var offen = WB_BESTAENDE.filter(function (b) { return wbStand[b.id].schmutzig; });
  var tinte = wbTinteAlleOffen();
  if (!offen.length && !tinte.length) { melde('Nichts zu sichern.', null); return Promise.resolve(true); }
  /* Die Handschrift liegt je Seite in einer eigenen Datei und geht mit. */
  return Promise.all(tinte.map(function (t) {
    return wbTinteSichern(t.welt, t.seiteId).catch(function (f) { return f; });
  }).concat(offen.map(function (b) {
    return wbSichern(b.id).catch(function (f) { return f; });
  }))).then(function (erg) {
    var schlecht = erg.filter(function (e) { return e instanceof Error; });
    melde(schlecht.length ? ('Nicht alles gesichert:\n' + schlecht[0].message)
            : ('Gesichert' + (tinte.length ? ', samt Handschrift.' : '.')),
          schlecht.length ? 'warn' : null);
    wbZeichne();
    return !schlecht.length;
  });
}

/* Ein Link aus CLIE: #s=<Kennung>. Er trägt nicht, in welcher Welt die Seite
   liegt — gesucht wird in allen, die verbunden sind. */
function wbZielAnspringen() {
  var id = wbLinkZiel();
  var treffer = id ? wbSeiteSuchen(id) : null;
  if (!id) { return false; }
  if (!treffer) {
    melde('Die verlinkte Seite liegt in einer Welt, die hier nicht verbunden ist.', 'warn');
    return false;
  }
  wb.welt = treffer.welt;
  if (treffer.seite.fachId) {
    wb.reiter = 'faecher';
    wb.fach = treffer.seite.fachId;
    wb.unterfach = treffer.seite.unterfachId || '';
    wb.sicht = wb.unterfach ? 'unterfach' : 'fach';
  } else {
    wb.reiter = 'notizen';
    wb.seite = treffer.seite.id;
  }
  return true;
}

/* ---------- Fußleiste ---------- */

function wbFussZeichnen() {
  var el = document.getElementById('fuss');
  var alle;
  var i;
  var links;
  var rechts;
  if (!el) { return; }
  if (wb.reiter === 'faecher') {
    el.innerHTML = '<span></span><span class="mitte">'
      + '<button type="button" class="kn" onclick="wbFachNeuFragen(\'\')">Neues Fach</button>'
      + '<button type="button" class="kn" onclick="wbUnterfachNeuFragen(\'\',\'\')">Neues Unterfach</button>'
      + '<button type="button" class="kn" onclick="wbArchivUm()">'
      + (wb.archiv ? 'Archiv verbergen' : 'Archiv zeigen') + '</button>'
      + '<button type="button" class="kn" onclick="wbAllesSichern()">Sichern</button>'
      + '</span><span></span>';
    return;
  }
  alle = wbBlockAlle();
  i = wbBlockIndex();
  links = (i > 0) ? i : 0;
  rechts = (i >= 0) ? (alle.length - 1 - i) : 0;
  el.innerHTML = '<button type="button" class="blaettern" onclick="wbBlaettern(-1)"'
    + (links ? '' : ' disabled') + '>← ' + wbEsc(wbSeitenWort(links, 'davor')) + '</button>'
    + '<span class="mitte">'
    + '<button type="button" class="kn" onclick="wbSeiteNeuKlick()">Neue Seite</button>'
    + '<button type="button" class="kn pri" onclick="wbAblegenFragen()"'
    + (wb.seite ? '' : ' disabled') + '>Ablegen</button>'
    + '<button type="button" class="kn" onclick="wbAllesSichern()">Sichern</button>'
    + '</span>'
    + '<button type="button" class="blaettern" onclick="wbBlaettern(1)"'
    + (rechts ? '' : ' disabled') + '>' + wbEsc(wbSeitenWort(rechts, 'danach')) + ' →</button>';
}

function wbSeitenWort(n, wohin) {
  if (!n) { return 'keine Seite ' + wohin; }
  return (n === 1 ? '1 Seite ' : n + ' Seiten ') + wohin;
}

function wbArchivUm() {
  wb.archiv = !wb.archiv;
  wbZeichne();
}

/* ---------- Dialoge ---------- */

function wbDialogZu() {
  var el = document.getElementById('aufklapp');
  wb.dialog = null;
  if (el) { el.className = 'dlgbg zu'; el.innerHTML = ''; }
}

function wbDialogAuf(titel, leib, fuss) {
  var el = document.getElementById('aufklapp');
  var erstes;
  if (!el) { return; }
  el.className = 'dlgbg';
  el.innerHTML = '<div class="dlg"><h2>' + wbEsc(titel) + '</h2>' + leib
    + '<div class="zeile">' + fuss + '</div></div>';
  erstes = el.querySelector('input, textarea, select');
  if (erstes && erstes.focus) { erstes.focus(); }
}

/* ---------- Start ---------- */

function wbStart() {
  wbTokenHolen();
  wbZeichne();
  wbOrtLaden('beruflich').then(function () {
    if (wbTokenGueltig()) { return wbAnmelden(true); }
    return false;
  }).then(function () {
    return wbAllesLaden();
  });
}

/* ============================================================
   Tinte: schreiben mit dem Stift
   ------------------------------------------------------------
   Der Apple Pencil meldet sich als eigener Zeigertyp. Deshalb
   braucht es am iPad keinen Umschalter: der Stift zeichnet immer,
   Finger und Maus tippen weiter. Nur wer ohne Stift zeichnen
   will — am PC —, schaltet „Zeichnen" ein.
   ============================================================ */

function wbWerkzeugHtml() {
  return '<div class="werkzeug">'
    + '<button type="button" class="' + (wb.stift === 'stift' && !wb.zeichnen ? '' : (wb.stift === 'stift' ? 'an' : ''))
    + '" onclick="wbZeichnenUm()">' + (wb.zeichnen ? 'Zeichnen: an' : 'Zeichnen: aus') + '</button>'
    + WB_BREITEN.map(function (b) {
      return '<button type="button" class="' + (wb.breite === b[0] && wb.stift === 'stift' ? 'an' : '')
        + '" title="' + b[1] + '" onclick="wbStiftSetzen(' + b[0] + ')">'
        + '<span class="dick" style="height:' + b[2] + 'px"></span></button>';
    }).join('')
    + '<button type="button" class="' + (wb.stift === 'radierer' ? 'an' : '')
    + '" onclick="wbRadiererUm()">Radierer</button>'
    + '<button type="button" onclick="wbTinteZurueck()">Rückgängig</button>'
    + '<span>Der Pencil schreibt immer — auch wenn „Zeichnen" aus ist.</span>'
    + '</div>';
}

function wbZeichnenUm() {
  wb.zeichnen = !wb.zeichnen;
  wbFlaecheZeichnen();
  wbTinteAnbinden();
}

function wbStiftSetzen(b) {
  wb.breite = b;
  wb.stift = 'stift';
  wbFlaecheZeichnen();
  wbTinteAnbinden();
}

function wbRadiererUm() {
  wb.stift = (wb.stift === 'radierer') ? 'stift' : 'radierer';
  wbFlaecheZeichnen();
  wbTinteAnbinden();
}

function wbTinteZurueck() {
  var striche = wbTinteVon(wb.welt, wb.seite).slice();
  if (!striche.length) { melde('Nichts rückgängig zu machen.', null); return; }
  wb.zurueck.push(striche[striche.length - 1]);
  striche.pop();
  wbTinteSetzen(wb.welt, wb.seite, striche);
  wbTinteMalen();
  wbReiterZeichnen();
}

/* Die Leinwand hängt an der Seite und hört auf Zeigerereignisse. Sie läuft
   in Seitenkoordinaten, damit die Striche unabhängig vom Bildschirm sitzen. */
function wbTinteAnbinden() {
  var leinwand = document.getElementById('tinte');
  var seite = leinwand ? leinwand.parentNode : null;
  if (!leinwand || !seite || !wb.seite) { return; }
  wbTinteMassSetzen(leinwand, seite);
  wbTinteLaden(wb.welt, wb.seite).then(function () { wbTinteMalen(); });

  var punktVon = function (e) {
    var k = leinwand.getBoundingClientRect();
    return [Math.round((e.clientX - k.left) * 10) / 10,
            Math.round((e.clientY - k.top) * 10) / 10,
            Math.round((e.pressure || 0.5) * 100) / 100];
  };
  var malt = function (e) { return e.pointerType === 'pen' || wb.zeichnen; };

  seite.onpointerdown = function (e) {
    if (!malt(e)) { return; }
    e.preventDefault();
    if (wb.stift === 'radierer') { wbRadieren(punktVon(e)); return; }
    wb.strich = { breite: WB_BREITEN[wb.breite - 1][2], punkte: punktVon(e) };
    if (seite.setPointerCapture) { seite.setPointerCapture(e.pointerId); }
  };
  seite.onpointermove = function (e) {
    if (!malt(e)) { return; }
    if (wb.stift === 'radierer' && e.buttons) { wbRadieren(punktVon(e)); return; }
    if (!wb.strich) { return; }
    e.preventDefault();
    wb.strich.punkte = wb.strich.punkte.concat(punktVon(e));
    wbTinteMalen();
  };
  seite.onpointerup = function () {
    var striche;
    if (!wb.strich) { return; }
    if (wb.strich.punkte.length >= 6) {
      striche = wbTinteVon(wb.welt, wb.seite).concat([wb.strich]);
      wbTinteSetzen(wb.welt, wb.seite, striche);
    }
    wb.strich = null;
    wbTinteMalen();
    wbReiterZeichnen();
  };
  seite.onpointercancel = seite.onpointerup;
}

function wbTinteMassSetzen(leinwand, seite) {
  var dicht = window.devicePixelRatio || 1;
  leinwand.width = Math.round(seite.clientWidth * dicht);
  leinwand.height = Math.round(seite.clientHeight * dicht);
  leinwand.style.width = seite.clientWidth + 'px';
  leinwand.style.height = seite.clientHeight + 'px';
}

function wbTinteMalen() {
  var leinwand = document.getElementById('tinte');
  var ct;
  var dicht = window.devicePixelRatio || 1;
  if (!leinwand || !leinwand.getContext) { return; }
  ct = leinwand.getContext('2d');
  ct.setTransform(dicht, 0, 0, dicht, 0, 0);
  ct.clearRect(0, 0, leinwand.width, leinwand.height);
  ct.lineCap = 'round';
  ct.lineJoin = 'round';
  ct.strokeStyle = '#222222';
  wbTinteVon(wb.welt, wb.seite).concat(wb.strich ? [wb.strich] : []).forEach(function (st) {
    wbStrichMalen(ct, st);
  });
}

function wbStrichMalen(ct, st) {
  var p = st.punkte;
  var i;
  if (!p || p.length < 3) { return; }
  for (i = 0; i + 5 < p.length; i += 3) {
    ct.beginPath();
    ct.lineWidth = st.breite * (0.55 + Number(p[i + 2] || 0.5));
    ct.moveTo(p[i], p[i + 1]);
    ct.lineTo(p[i + 3], p[i + 4]);
    ct.stroke();
  }
}

/* Der Radierer nimmt ganze Striche weg, nicht Teile davon — das ist bei
   Handschrift fast immer das Gemeinte und viel ruhiger zu bedienen. */
function wbRadieren(punkt) {
  var striche = wbTinteVon(wb.welt, wb.seite);
  var behalten = striche.filter(function (st) {
    var p = st.punkte;
    var i;
    for (i = 0; i + 2 < p.length; i += 3) {
      if (Math.abs(p[i] - punkt[0]) < 11 && Math.abs(p[i + 1] - punkt[1]) < 11) { return false; }
    }
    return true;
  });
  if (behalten.length === striche.length) { return; }
  wbTinteSetzen(wb.welt, wb.seite, behalten);
  wbTinteMalen();
  wbReiterZeichnen();
}

/* ============================================================
   Eine Seite verschieben
   ============================================================ */

function wbVerschiebenFragen(seiteId) {
  var s = wbSeiteFinden(wb.welt, seiteId);
  var welten = wbGeladeneWelten();
  if (!s) { return; }
  wb.dialog = 'verschieben:' + seiteId;
  wbDialogAuf('Seite verschieben',
    '<p style="color:var(--ink)">„' + wbEsc(wbSeiteTitel(s)) + '"</p>'
    + '<label>Wohin</label><select id="dlgZiel" onchange="wbVerschiebenPruefen()">'
    + welten.map(function (w) {
      var inhalt = wbZielListeHtml(w);
      return inhalt
        ? '<optgroup label="' + wbEsc(wbBestand(w).name) + '">'
          + inhalt.split('value="').join('value="' + w + ':') + '</optgroup>'
        : '';
    }).join('') + '</select>'
    + '<p id="dlgWarnung"></p>',
    '<span class="r"><button type="button" onclick="wbDialogZu()">Abbrechen</button>'
    + '<button type="button" class="pri" onclick="wbVerschiebenFertig(\'' + wbEsc(seiteId) + '\')">Verschieben</button></span>');
  wbVerschiebenPruefen();
}

function wbVerschiebenZiel() {
  var el = document.getElementById('dlgZiel');
  var teile = el ? String(el.value || '').split(':') : [];
  if (teile.length < 3) { return null; }
  return { welt: teile[0], art: teile[1], id: teile[2] };
}

/* Die Warnung steht im Dialog, nicht erst danach: von Beruflich nach Privat
   wandert Inhalt aus dem Firmenspeicher nach Google Drive. */
function wbVerschiebenPruefen() {
  var el = document.getElementById('dlgWarnung');
  var z = wbVerschiebenZiel();
  if (!el) { return; }
  if (z && wb.welt === 'beruflich' && z.welt === 'privat') {
    el.innerHTML = '<b style="color:#a3384a">Achtung:</b> Diese Seite liegt im Firmenspeicher. '
      + 'Nach Privat verschoben wird ihr Inhalt — Text, Skizze und Handschrift — nach Google Drive '
      + 'kopiert und verlässt damit den Firmenspeicher.';
    return;
  }
  el.innerHTML = (z && z.welt !== wb.welt)
    ? 'Die Seite zieht mit Skizze und Handschrift in die andere Welt um.'
    : 'Die Seite wechselt das Fach.';
}

function wbVerschiebenFertig(seiteId) {
  var z = wbVerschiebenZiel();
  var vonWelt = wb.welt;
  var fertig = function (gut) {
    wbDialogZu();
    if (!gut) { melde('Das hat nicht geklappt.', 'warn'); return; }
    wb.welt = z.welt;
    wb.fach = (z.art === 'u') ? wbUnterfachFinden(z.welt, z.id).fachId : z.id;
    wb.unterfach = (z.art === 'u') ? z.id : '';
    wb.sicht = wb.unterfach ? 'unterfach' : 'fach';
    wbZeichne();
    melde('Verschoben — noch ungesichert.', null);
  };
  if (!z) { melde('Bitte ein Ziel wählen.', 'warn'); return; }
  if (z.welt === vonWelt) {
    fertig(wbVerschiebenImGleichen(vonWelt, seiteId,
      z.art === 'f' ? z.id : '', z.art === 'u' ? z.id : ''));
    return;
  }
  melde('Die Seite zieht um…', null);
  wbVerschiebenInWelt(vonWelt, seiteId, z.welt,
    z.art === 'f' ? z.id : '', z.art === 'u' ? z.id : '')
    .then(fertig)
    .catch(function (f) {
      wbDialogZu();
      melde('Der Umzug ist gescheitert, es wurde nichts verändert.\n'
        + (f && f.message ? f.message : ''), 'warn');
    });
}


if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', wbStart);
} else {
  wbStart();
}
</script>
