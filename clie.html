}

function schachFussHtml() {
  var s = cl.sch;
  var k = function (text, aufruf, voll, aus) {
    return '<button type="button" class="knopf' + (voll ? ' voll' : '') + '" onclick="' + aufruf + '"' + (aus ? ' disabled' : '') + '>' + text + '</button>';
  };
  if (s.bereich === 'partien' && s.pv.id) {
    return k('Ab hier spielen', 'schAbHier()', true) + k('Analyse', 'schAnalysieren()', false, s.pv.laeuft) + k('Mehr…', 'schMehrOeffnen()') + k('Fertig', 'schEbeneHoch()');
  }
  if ((s.bereich === 'schule' || s.bereich === 'eroeffnungen') && s.ue) {
    var typ = s.ue.a.typ || 'zug';
    if (s.ue.ok === true) {
      return s.ue.art === 'ueben' ? k('Nochmal', 'schEroeffnungUeben()', true) + k('Fertig', 'schEbeneHoch()')
        : k('Nächste', 'schUeWeiter()', true) + k('Fertig', 'schEbeneHoch()');
    }
    if (typ === 'endspiel') { return k('↶ Zurück', 'schUeZurueck()') + k('Tipp', 'schUeHilfe()') + k('Neu starten', 'schUeNeu()') + k('Fertig', 'schEbeneHoch()'); }
    return k('Tipp', 'schUeHilfe()') + k('Lösung', 'schUeLoesung()') + k('Fertig', 'schEbeneHoch()');
  }
  if (s.bereich === 'schule' && s.sv.lektion) {
    var l = schLektionFinden(s.sv.lektion);
    var hat = l && l.aufgaben && l.aufgaben.length;
    return (hat ? k('Zur Aufgabe', 'schAufgabeOeffnen(0)', true) : '') + k('Fertig', 'schEbeneHoch()');
  }
  if (s.bereich === 'schule') { return (s.sv.kapitel ? '' : k('Weiterlernen', 'schWeiterlernen()', true)) + (s.sv.kapitel ? k('Fertig', 'schEbeneHoch()') : ''); }
  if (s.bereich === 'eroeffnungen' && s.ev.id) { return k('Üben', 'schEroeffnungUeben()', true) + k('Fertig', 'schEbeneHoch()'); }
  if (s.bereich === 'spielen') {
    return k('Neu…', 'schNeuOeffnen()') + k('↶ Zurück', 'schZurueckNehmen()', false, !(s.zuege.length && !s.denkt))
      + k('Tipp', 'schTippZeigen()', false, !!(s.ende || s.denkt)) + k('⇅ Drehen', 'schDrehen()');
  }
  return '';
}

/* Eine Ebene zurück (Fertig-Knopf und Android-Zurück). true = etwas getan */
function schEbeneHoch() {
  var s = cl.sch;
  if (s.fenster === 'neu' || s.fenster === 'umwandeln' || s.fenster === 'speichern' || s.fenster === 'mehr') { schFensterZu(); return true; }
  if (s.bereich === 'partien' && s.pv.id) { s.pv.id = ''; schZeichnen(); return true; }
  if (s.ue) { s.ue = null; s.sv.aufgabe = -1; schZeichnen(); return true; }
  if (s.bereich === 'schule' && s.sv.lektion) { s.sv.lektion = ''; schZeichnen(); return true; }
  if (s.bereich === 'schule' && s.sv.kapitel) { s.sv.kapitel = ''; schZeichnen(); return true; }
  if (s.bereich === 'eroeffnungen' && s.ev.id) { s.ev.id = ''; schZeichnen(); return true; }
  return false;
}

function schZeichnen() {
  if (cl.app !== 'schach') { return; }
  inhaltZeichnen();
  fussZeichnen();
  kopfZeichnen();
}

function schKopfStufe() {
  return (SCH_STUFEN.filter(function (x) { return x[0] === cl.sch.stufe; })[0] || ['', 'Mittel'])[1];
}

function schKopfText() {
  if (!cl.sch.p) { schLaden(); }
  var s = cl.sch;
  if (s.bereich === 'partien') { return s.pv.id ? 'Nachspielen' : String(schPartienLesen().length); }
  if (s.bereich === 'schule') {
    var st = schStand();
    var alle = schLektionenAlle();
    return alle.filter(function (l) { return schLektionFertig(l, st); }).length + ' / ' + alle.length;
  }
  if (s.bereich === 'eroeffnungen') { return (typeof SCH_EROEFFNUNGEN !== 'undefined' ? SCH_EROEFFNUNGEN.length : 0) + ' Eröffnungen'; }
  return s.gegner === 'zwei' ? '2 Spieler' : schKopfStufe();
}

/* ---------- Lernkartei (seit 0.23) ----------

   Karteikarten nach dem Fächer-Prinzip (Leitner): Fach 1 täglich, dann
   2, 4, 8 und 16 Tage. Gewusst → ein Fach weiter, Teilweise → bleibt,
   Nicht gewusst → zurück in Fach 1 (und heute noch einmal).
   Rückseiten mit Absätzen, Aufzählungen und **fett**; Listen lassen sich
   Punkt für Punkt aufdecken. Kästen entstehen von Hand, aus eingefügtem
   Text, aus einem Memo oder aus einem Kartenpaket (JSON-Datei).

   Seit 0.24 liegen Kästen und Lernstand in der workbench.json (Bereiche
   „lernkaesten“ und „lernstand“, Workbench 6.3.2) — so lernen Pixel und
   iPad mit demselben Stand. Der Lernstand ist je Karte ein Eintrag, beim
   Abgleich gewinnt je Karte der jüngere. Die Texte der Kartenpakete sind
   groß und bleiben auf dem Gerät (LK_PAKETE_KEY); jedes Gerät lädt ein
   Paket einmal. Eigene Karten und bearbeitete Paketkarten stehen im
   Kasten selbst und reisen mit. */

var LK_KEY = 'clie-lernkartei';                 /* nur noch für die Übernahme aus 0.23 */
var LK_PAKETE_KEY = 'clie-lernkartei-pakete';
var LK_INTERVALL = [0, 1, 2, 4, 8, 16];
var LK_RICHTUNGEN = [['vor', 'Vorder → Rück'], ['rueck', 'Rück → Vorder'], ['gemischt', 'Gemischt']];

cl.lk = { ansicht: 'liste', id: '', fenster: '', karte: '', suche: '', sitzung: null, paket: null, ziel: '', rolle: null };

var lkPaketeZwischen = { roh: null, daten: {} };

/* Paketinhalte dieses Geräts: { paketId: { version, name, karten: [{id, v, r, w}] } } */
function lkPakete() {
  var roh = null;
  try { roh = window.localStorage.getItem(LK_PAKETE_KEY); } catch (e) { roh = null; }
  if (roh !== lkPaketeZwischen.roh) {
    var d = null;
    try { d = JSON.parse(roh || 'null'); } catch (e) { d = null; }
    lkPaketeZwischen = { roh: roh, daten: (d && typeof d === 'object') ? d : {} };
  }
  return lkPaketeZwischen.daten;
}

function lkPaketeSichern(p) {
  var roh = JSON.stringify(p);
  try { window.localStorage.setItem(LK_PAKETE_KEY, roh); }
  catch (e) { melde('Speichern ging nicht — der Speicher dieses Geräts ist voll.', 'warn'); return false; }
  lkPaketeZwischen = { roh: roh, daten: p };
  return true;
}

/* Arbeitsansicht: Kästen mit allen Karten und ihrem Lernstand —
   gebaut aus der Datenbank und den Paketen dieses Geräts */
function lkDaten() {
  var pakete = lkPakete();
  var stand = {};
  (Array.isArray(DB.lernstand) ? DB.lernstand : []).forEach(function (s) { if (s && s.id) { stand[s.id] = s; } });
  var kaesten = (Array.isArray(DB.lernkaesten) ? DB.lernkaesten : []).filter(function (k) { return k && k.id; }).map(function (k) {
    var eigen = {};
    (k.karten || []).forEach(function (c) { if (c && c.id) { eigen[c.id] = c; } });
    var weg = {};
    (k.weg || []).forEach(function (x) { weg[x] = 1; });
    var p = (k.paket && k.paket.id) ? pakete[k.paket.id] : null;
    var karte = function (x, ausPaket, istEigen) {
      var s = stand[k.id + '|' + x.id] || {};
      return { id: x.id, v: String(x.v || ''), r: String(x.r || ''), w: x.w ? String(x.w) : '', p: ausPaket, eigen: istEigen,
               fach: Number(s.f) || 0, faellig: s.d || '', e: s.e || '', gesehen: Number(s.n) || 0 };
    };
    var karten = [];
    var imPaket = {};
    if (p && Array.isArray(p.karten)) {
      p.karten.forEach(function (x) {
        imPaket[x.id] = 1;
        if (!weg[x.id]) { karten.push(eigen[x.id] ? karte(eigen[x.id], true, true) : karte(x, true, false)); }
      });
    }
    (k.karten || []).forEach(function (c) { if (c && c.id && !imPaket[c.id] && !weg[c.id]) { karten.push(karte(c, false, true)); } });
    return { id: k.id, name: String(k.name || 'Kasten'), paket: k.paket ? { id: k.paket.id, version: Number(k.paket.version) || 1 } : null,
             neuProTag: (typeof k.neuProTag === 'number') ? k.neuProTag : 20, richtung: k.richtung || 'vor', angelegt: k.angelegt || '',
             weg: (k.weg || []).slice(), fehlt: !!(k.paket && k.paket.id && !p), karten: karten };
  });
  return { kaesten: kaesten };
}

/* Schreibt die Arbeitsansicht zurück: nur was sich geändert hat,
   jeweils mit Zeitstempel; Gelöschtes bekommt einen Grabstein */
function lkSichern(d) {
  if (!Array.isArray(DB.lernkaesten)) { DB.lernkaesten = []; }
  if (!Array.isArray(DB.lernstand)) { DB.lernstand = []; }
  var z = jetzt();
  var anders = false;
  var ansicht = {};
  d.kaesten.forEach(function (k) { ansicht[k.id] = k; });
  DB.lernkaesten = DB.lernkaesten.filter(function (k) {
    if (k && ansicht[k.id]) { return true; }
    if (k && k.id) { grabsteinSetzen('lernkaesten', k.id); }
    anders = true;
    return false;
  });
  /* Lernstand: zu gelöschten Kästen und — wenn die Karten bekannt sind — zu gelöschten Karten weg */
  var bekannt = {};
  d.kaesten.forEach(function (k) { if (!k.fehlt) { k.karten.forEach(function (c) { bekannt[k.id + '|' + c.id] = 1; }); } });
  DB.lernstand = DB.lernstand.filter(function (s) {
    if (!s || !s.id) { anders = true; return false; }
    var k = ansicht[s.k];
    if (k && (k.fehlt || bekannt[s.id])) { return true; }
    grabsteinSetzen('lernstand', s.id);
    anders = true;
    return false;
  });
  var stand = {};
  DB.lernstand.forEach(function (s) { stand[s.id] = s; });
  d.kaesten.forEach(function (k) {
    var satz = DB.lernkaesten.filter(function (x) { return x.id === k.id; })[0];
    var neu = { id: k.id, name: k.name, paket: k.paket, neuProTag: k.neuProTag, richtung: k.richtung, angelegt: k.angelegt, weg: k.weg,
                karten: k.karten.filter(function (c) { return c.eigen; }).map(function (c) { return { id: c.id, v: c.v, r: c.r, w: c.w || '' }; }) };
    if (!satz) {
      neu.geaendert = z;
      DB.lernkaesten.push(neu);
      anders = true;
    } else {
      var alt = JSON.stringify([satz.name, satz.paket || null, satz.neuProTag, satz.richtung, satz.weg || [], satz.karten || []]);
      if (alt !== JSON.stringify([neu.name, neu.paket || null, neu.neuProTag, neu.richtung, neu.weg, neu.karten])) {
        satz.name = neu.name; satz.paket = neu.paket; satz.neuProTag = neu.neuProTag; satz.richtung = neu.richtung;
        satz.weg = neu.weg; satz.karten = neu.karten; satz.geaendert = z;
        anders = true;
      }
    }
    k.karten.forEach(function (c) {
      var id = k.id + '|' + c.id;
      var s = stand[id];
      var f = Number(c.fach) || 0;
      var faellig = c.faellig || '';
      var e = c.e || '';
      var n = Number(c.gesehen) || 0;
      if (!s) {
        if (!f && !n && !e) { return; }
        s = { id: id, k: k.id, f: f, d: faellig, e: e, n: n, geaendert: z };
        DB.lernstand.push(s);
        stand[id] = s;
        anders = true;
      } else if (s.f !== f || (s.d || '') !== faellig || (s.e || '') !== e || (Number(s.n) || 0) !== n) {
        s.f = f; s.d = faellig; s.e = e; s.n = n; s.geaendert = z;
        anders = true;
      }
    });
  });
  if (anders) { spaeterSichern(); }
  return true;
}

/* Einmalig: den Stand aus 0.23 (nur auf diesem Gerät) in die Datenbank übernehmen */
function lkAltUebernehmen() {
  var alt = null;
  try { alt = JSON.parse(window.localStorage.getItem(LK_KEY) || 'null'); } catch (e) { alt = null; }
  if (!alt || !Array.isArray(alt.kaesten) || !alt.kaesten.length) { return 0; }
  var pakete = lkPakete();
  var vorhanden = lkDaten();
  var d = { kaesten: vorhanden.kaesten.slice() };
  alt.kaesten.forEach(function (k) {
    if (!k || !k.id) { return; }
    /* Paketkästen: gibt es den Kasten (von einem anderen Gerät) schon, wird er ergänzt */
    var ziel = (k.paket && k.paket.id) ? d.kaesten.filter(function (x) { return x.paket && x.paket.id === k.paket.id; })[0] : null;
    if (k.paket && k.paket.id) {
      var vorher = pakete[k.paket.id];
      if (!vorher || (Number(vorher.version) || 0) < (Number(k.paket.version) || 1)) {
        pakete[k.paket.id] = { version: Number(k.paket.version) || 1, name: String(k.name || ''),
          karten: (k.karten || []).filter(function (c) { return c && c.q; }).map(function (c) { return { id: c.q, v: c.v, r: c.r, w: c.w || '' }; }) };
      }
    }
    if (!ziel) {
      ziel = { id: k.id, name: String(k.name || 'Kasten'), paket: k.paket ? { id: k.paket.id, version: Number(k.paket.version) || 1 } : null,
               neuProTag: (typeof k.neuProTag === 'number') ? k.neuProTag : 20, richtung: k.richtung || 'vor', angelegt: k.angelegt || isoDatum(),
               weg: [], fehlt: false, karten: [] };
      d.kaesten.push(ziel);
    }
    var hier = {};
    ziel.karten.forEach(function (c) { hier[c.id] = c; });
    (k.karten || []).forEach(function (c) {
      if (!c || !c.id) { return; }
      var schluessel = c.q || c.id;
      var x = hier[schluessel];
      if (!x) {
        x = { id: schluessel, v: c.v, r: c.r, w: c.w || '', p: !!c.q, eigen: !c.q, fach: 0, faellig: '', e: '', gesehen: 0 };
        ziel.karten.push(x);
        hier[schluessel] = x;
      }
      /* Der weiter fortgeschrittene Stand bleibt */
      if ((Number(c.fach) || 0) > (Number(x.fach) || 0)) { x.fach = Number(c.fach) || 0; x.faellig = c.faellig || ''; x.gesehen = Number(c.gesehen) || 0; }
    });
  });
  lkPaketeSichern(pakete);
  lkSichern(d);
  try { window.localStorage.setItem(LK_KEY + '-alt', JSON.stringify(alt)); window.localStorage.removeItem(LK_KEY); } catch (e) { /* egal */ }
  return alt.kaesten.length;
}

function lkKasten(d, id) {
  return d.kaesten.filter(function (k) { return k.id === id; })[0] || null;
}

/* Wie viele neue Karten heute noch dazukommen dürfen — gezählt über alle Geräte */
function lkNeuFrei(d, k) {
  var heute = isoDatum();
  var schon = k.karten.filter(function (c) { return c.e === heute; }).length;
  var neu = k.karten.filter(function (c) { return !c.fach; }).length;
  return Math.max(0, Math.min(neu, (Number(k.neuProTag) || 0) - schon));
}

function lkFaellig(k) {
  var heute = isoDatum();
  return k.karten.filter(function (c) { return c.fach >= 1 && (!c.faellig || c.faellig <= heute); });
}

function lkHeuteZahl(d, k) {
  return lkFaellig(k).length + lkNeuFrei(d, k);
}

function lkAlleHeute() {
  var d = lkDaten();
  return d.kaesten.reduce(function (n, k) { return n + lkHeuteZahl(d, k); }, 0);
}

/* ---- Text der Karten: Absätze, Aufzählungen, fett ---- */

function lkListenZeile(z) {
  return /^\s*([•\-*]|\d{1,2}[.)])\s+/.test(z);
}

/* k = wie viele Listenpunkte schon aufgedeckt sind (-1 = alle) */
function lkTextHtml(t, k) {
  var n = 0;
  return String(t || '').split('\n').map(function (z) {
    var fett = function (x) { return esc(x).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); };
    if (lkListenZeile(z)) {
      var m = z.match(/^\s*([•\-*]|\d{1,2}[.)])\s+(.*)$/);
      var zeichen = /\d/.test(m[1]) ? m[1].replace(')', '.') : '•';
      var zu = k >= 0 && n >= k;
      n++;
      return '<div class="lk-punkt' + (zu ? ' zu' : '') + '"><span>' + esc(zeichen) + '</span><span>' + (zu ? '…………' : fett(m[2])) + '</span></div>';
    }
    return z.trim() ? '<div class="lk-zeile">' + fett(z) + '</div>' : '<div class="lk-leer"></div>';
  }).join('');
}

function lkPunkte(t) {
  return String(t || '').split('\n').filter(lkListenZeile).length;
}

/* ---- Lernen ---- */

function lkMischen(l) {
  var i;
  for (i = l.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = l[i]; l[i] = l[j]; l[j] = t; }
  return l;
}

/* Sitzung: fällige Karten (gemischt) und die neuen für heute — aus einem Kasten oder allen */
function lkLernen(kastenId) {
  var d = lkDaten();
  var schlange = [];
  d.kaesten.forEach(function (k) {
    if (kastenId && k.id !== kastenId) { return; }
    var faellig = lkMischen(lkFaellig(k).slice());
    var neu = k.karten.filter(function (c) { return !c.fach; }).slice(0, lkNeuFrei(d, k));
    faellig.concat(neu).forEach(function (c) {
      var r = k.richtung === 'rueck' || (k.richtung === 'gemischt' && Math.random() < 0.5);
      schlange.push({ k: k.id, c: c.id, r: r });
    });
  });
  if (!schlange.length) { melde('Heute ist nichts fällig. Gut gemacht!', 'gut'); return; }
  cl.lk.sitzung = { schlange: schlange, i: 0, um: false, auf: 0, stat: { g: 0, t: 0, n: 0 }, wieder: {} };
  cl.lk.ansicht = 'lernen';
  cl.lk.fenster = '';
  lkZeichnen();
}

function lkAktuell() {
  var s = cl.lk.sitzung;
  if (!s || s.i >= s.schlange.length) { return null; }
  var e = s.schlange[s.i];
  var d = lkDaten();
  var k = lkKasten(d, e.k);
  var c = k ? k.karten.filter(function (x) { return x.id === e.c; })[0] : null;
  return c ? { d: d, k: k, c: c, e: e } : null;
}

/* Frage und Antwort je nach Richtung */
function lkSeiten(c, rueck) {
  if (!rueck) { return { frage: c.v, antwort: c.r }; }
  return { frage: c.w || String(c.r || '').split('\n')[0], antwort: c.v + (c.w ? '\n' + c.r : '') };
}

function lkUmdrehen() {
  var s = cl.lk.sitzung;
  if (!s) { return; }
  s.um = true;
  s.auf = 0;
  lkZeichnen();
}

function lkNaechsterPunkt() {
  var s = cl.lk.sitzung;
  var a = lkAktuell();
  if (!s || !a) { return; }
  s.auf = Math.min(lkPunkte(lkSeiten(a.c, a.e.r).antwort), s.auf + 1);
  lkZeichnen();
}

function lkAllesZeigen() {
  var s = cl.lk.sitzung;
  if (!s) { return; }
  s.auf = -1;
  lkZeichnen();
}

/* Bewertung: g = gewusst, t = teilweise, n = nicht gewusst */
function lkBewerten(was) {
  var s = cl.lk.sitzung;
  var a = lkAktuell();
  if (!s || !a || ['g', 't', 'n'].indexOf(was) < 0) { return; }
  var c = a.c;
  var heute = isoDatum();
  if (!c.fach) { c.e = heute; c.fach = 1; }
  if (was === 'g') { c.fach = Math.min(5, c.fach + 1); c.faellig = tagePlus(heute, LK_INTERVALL[c.fach]); }
  else if (was === 't') { c.faellig = tagePlus(heute, 1); }
  else {
    c.fach = 1;
    c.faellig = heute;
    /* heute noch einmal — aber nur einmal */
    if (!s.wieder[c.id]) { s.wieder[c.id] = 1; s.schlange.push({ k: a.e.k, c: c.id, r: a.e.r }); }
  }
  c.gesehen = (Number(c.gesehen) || 0) + 1;
  s.stat[was]++;
  lkSichern(a.d);
  s.i++;
  s.um = false;
  s.auf = 0;
  lkZeichnen();
}

/* ---- Kästen und Karten ---- */

function lkKastenNeu(name) {
  var d = lkDaten();
  var k = { id: neueKennung(), name: String(name || 'Neuer Kasten').slice(0, 80), paket: null, karten: [], weg: [], neuProTag: 20, richtung: 'vor', angelegt: isoDatum(), fehlt: false };
  d.kaesten.push(k);
  lkSichern(d);
  return k.id;
}

function lkKartenAusText(t) {
  return String(t || '').replace(/\r/g, '').split(/\n\s*\n/).map(function (b) {
    var z = b.split('\n').filter(function (x, i) { return i > 0 || x.trim(); });
    var v = (z.shift() || '').trim();
    return v ? { id: neueKennung(), v: v.slice(0, 500), r: z.join('\n').trim().slice(0, 4000), w: '', p: false, eigen: true, fach: 0, faellig: '', e: '', gesehen: 0 } : null;
  }).filter(function (c) { return !!c; });
}

/* Memo: jede Überschrift (#) wird eine Karte, der Text darunter die Rückseite */
function lkKartenAusMemo(text) {
  var karten = [];
  var akt = null;
  String(text || '').split('\n').forEach(function (z) {
    var m = z.match(/^\s*#{1,3}\s+(.*)$/);
    if (m) { akt = { id: neueKennung(), v: m[1].trim().slice(0, 500), r: '', w: '', p: false, eigen: true, fach: 0, faellig: '', e: '', gesehen: 0 }; karten.push(akt); return; }
    if (akt) { akt.r += (akt.r ? '\n' : '') + z.replace(/^\s*\[[ xX-]?\]\s*/, '- '); }
  });
  karten.forEach(function (c) { c.r = c.r.trim(); });
  return karten.filter(function (c) { return c.v && c.r; });
}

function lkFensterAuf(f) {
  cl.lk.fenster = f;
  lkZeichnen();
}

function lkFensterZu() {
  cl.lk.fenster = '';
  cl.lk.karte = '';
  cl.lk.paket = null;
  lkZeichnen();
}

function lkKastenOeffnen(id) {
  cl.lk.rolle = null;
  cl.lk.id = id;
  cl.lk.ansicht = 'kasten';
  cl.lk.fenster = '';
  lkZeichnen();
}

function lkNeuerKastenOk() {
  var f = document.getElementById('lkName');
  var name = String((f && f.value) || '').trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  cl.lk.fenster = '';
  lkKastenOeffnen(lkKastenNeu(name));
}

/* Text einfügen: in den gewählten Kasten (oder einen neuen) */
function lkEinfuegenOk() {
  var t = document.getElementById('lkText');
  var n = document.getElementById('lkName');
  var karten = lkKartenAusText(t && t.value);
  if (!karten.length) { melde('Keine Karte erkannt — erste Zeile Vorderseite, Leerzeile trennt Karten.', 'warn'); return; }
  var d = lkDaten();
  var k = cl.lk.id ? lkKasten(d, cl.lk.id) : null;
  if (!k) {
    var name = String((n && n.value) || '').trim() || 'Meine Karten';
    lkKastenNeu(name);
    d = lkDaten();
    k = d.kaesten[d.kaesten.length - 1];
  }
  k.karten = k.karten.concat(karten);
  lkSichern(d);
  melde(karten.length + ' Karten in „' + k.name + '“ übernommen.', 'gut');
  cl.lk.fenster = '';
  lkKastenOeffnen(k.id);
}

function lkMemoUebernehmen(seiteId) {
  var s = kpSeiteFinden(seiteId);
  var karten = s ? lkKartenAusMemo(s.text) : [];
  if (!karten.length) { melde('In diesem Memo gibt es keine Überschrift mit Text darunter.', 'warn'); return; }
  var d = lkDaten();
  var k = cl.lk.id ? lkKasten(d, cl.lk.id) : null;
  if (!k) { lkKastenNeu(s.titel); d = lkDaten(); k = d.kaesten[d.kaesten.length - 1]; }
  k.karten = k.karten.concat(karten);
  lkSichern(d);
  melde(karten.length + ' Karten aus „' + s.titel + '“ übernommen.', 'gut');
  cl.lk.fenster = '';
  lkKastenOeffnen(k.id);
}

/* Karte bearbeiten / neu */
function lkKarteOeffnen(id) {
  cl.lk.karte = id || '';
  lkFensterAuf('karte');
}

function lkKarteSpeichern() {
  var v = String((document.getElementById('lkV') || {}).value || '').trim();
  var r = String((document.getElementById('lkR') || {}).value || '').trim();
  if (!v) { melde('Die Vorderseite ist leer.', 'warn'); return; }
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k) { lkFensterZu(); return; }
  var c = cl.lk.karte ? k.karten.filter(function (x) { return x.id === cl.lk.karte; })[0] : null;
  if (!c) { c = { id: neueKennung(), w: '', p: false, fach: 0, faellig: '', e: '', gesehen: 0 }; k.karten.push(c); }
  /* Auch eine bearbeitete Paketkarte steht dann im Kasten selbst und reist mit */
  c.eigen = true;
  c.v = v.slice(0, 500);
  c.r = r.slice(0, 4000);
  lkSichern(d);
  lkFensterZu();
}

function lkKarteLoeschen() {
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k) { lkFensterZu(); return; }
  var c = k.karten.filter(function (x) { return x.id === cl.lk.karte; })[0];
  /* Paketkarten bleiben im Paket — der Kasten merkt sich, dass sie weg sind */
  if (c && c.p && k.weg.indexOf(c.id) < 0) { k.weg.push(c.id); }
  k.karten = k.karten.filter(function (x) { return x.id !== cl.lk.karte; });
  lkSichern(d);
  lkFensterZu();
}

/* Während des Lernens: die aktuelle Karte bearbeiten */
function lkAktuelleBearbeiten() {
  var a = lkAktuell();
  if (!a) { return; }
  cl.lk.id = a.k.id;
  lkKarteOeffnen(a.c.id);
}

/* Details eines Kastens */
function lkDetailsSpeichern() {
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k) { lkFensterZu(); return; }
  var n = String((document.getElementById('lkName') || {}).value || '').trim();
  var t = Math.round(Number((document.getElementById('lkNeuTag') || {}).value));
  if (n) { k.name = n.slice(0, 80); }
  if (t >= 0 && t <= 200) { k.neuProTag = t; }
  lkSichern(d);
  lkFensterZu();
}

function lkRichtung(r) {
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k || !LK_RICHTUNGEN.some(function (x) { return x[0] === r; })) { return; }
  k.richtung = r;
  lkSichern(d);
  lkZeichnen();
}

function lkZuruecksetzen() {
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k) { return; }
  k.karten.forEach(function (c) { c.fach = 0; c.faellig = ''; c.e = ''; });
  lkSichern(d);
  melde('Alle Karten sind wieder neu.', null);
  lkFensterZu();
}

function lkKastenLoeschen() {
  var d = lkDaten();
  d.kaesten = d.kaesten.filter(function (k) { return k.id !== cl.lk.id; });
  lkSichern(d);
  cl.lk.id = '';
  cl.lk.ansicht = 'liste';
  lkFensterZu();
}

/* ---- Kartenpakete (JSON-Dateien) ---- */

function lkPaketWaehlen() {
  var f = document.getElementById('lkDatei');
  if (f && f.click) { f.value = ''; f.click(); }
}

function lkPaketGewaehlt(feld) {
  var datei = feld && feld.files && feld.files[0];
  if (!datei || typeof window.FileReader !== 'function') { return; }
  var leser = new window.FileReader();
  leser.onload = function () { lkPaketPruefen(String(leser.result || ''), datei.name); };
  leser.readAsText(datei);
}

/* Prüft und zeigt ein Paket vor dem Übernehmen */
function lkPaketPruefen(text, dateiname) {
  var p = null;
  try { p = JSON.parse(text); } catch (e) { p = null; }
  if (!p || p.format !== 'clie-lernkartei' || !p.paket || !p.paket.id || !Array.isArray(p.karten)) {
    melde('Das ist kein Kartenpaket für CLIE.', 'warn');
    return false;
  }
  var karten = p.karten.filter(function (c) { return c && c.id && c.v; });
  cl.lk.paket = { id: String(p.paket.id), name: String(p.paket.name || dateiname || 'Paket'), version: Number(p.paket.version) || 1,
                  beschreibung: String(p.paket.beschreibung || ''), richtung: p.paket.richtung, datei: dateiname || '',
                  karten: karten.map(function (c) { return { id: String(c.id), v: String(c.v).slice(0, 500), r: String(c.r || '').slice(0, 4000), w: c.w ? String(c.w).slice(0, 200) : '' }; }) };
  cl.lk.fenster = 'paket';
  lkZeichnen();
  return true;
}

/* Übernehmen: Inhalt auf diesem Gerät, Kasten in der Datenbank —
   gibt es den Kasten schon (auch von einem anderen Gerät), bleibt der Lernstand */
function lkPaketUebernehmen() {
  var p = cl.lk.paket;
  if (!p) { return; }
  var pakete = lkPakete();
  var vorher = pakete[p.id];
  var alt = {};
  if (vorher && Array.isArray(vorher.karten)) { vorher.karten.forEach(function (x) { alt[x.id] = x; }); }
  var neu = 0;
  var geaendert = 0;
  p.karten.forEach(function (x) {
    var a = alt[x.id];
    if (!a) { neu++; } else if (a.v !== x.v || a.r !== x.r || (a.w || '') !== (x.w || '')) { geaendert++; }
  });
  var kopie = {};
  Object.keys(pakete).forEach(function (id) { kopie[id] = pakete[id]; });
  kopie[p.id] = { version: p.version, name: p.name, karten: p.karten };
  if (!lkPaketeSichern(kopie)) { return; }
  var d = lkDaten();
  var k = d.kaesten.filter(function (x) { return x.paket && x.paket.id === p.id; })[0];
  var hatteKasten = !!k;
  if (!k) {
    k = { id: neueKennung(), name: p.name, paket: null, karten: [], weg: [], neuProTag: 20, angelegt: isoDatum(), fehlt: false,
          richtung: ['vor', 'rueck', 'gemischt'].indexOf(p.richtung) >= 0 ? p.richtung : 'vor' };
    d.kaesten.push(k);
  }
  k.paket = { id: p.id, version: Math.max(p.version, k.paket ? k.paket.version : 0) };
  lkSichern(d);
  melde('„' + k.name + '“: ' + (hatteKasten && !vorher ? 'Inhalt auf diesem Gerät geladen, Lernstand übernommen.'
    : neu + ' neue' + (geaendert ? ', ' + geaendert + ' aktualisierte' : '') + ' Karten.'), 'gut');
  cl.lk.paket = null;
  cl.lk.fenster = '';
  lkKastenOeffnen(k.id);
}

/* ---- Zeichnen ---- */

function lkFaecher(k) {
  var f = [0, 0, 0, 0, 0, 0];
  k.karten.forEach(function (c) { f[Math.max(0, Math.min(5, Number(c.fach) || 0))]++; });
  return f;
}

function lkFaecherHtml(k) {
  var f = lkFaecher(k);
  var max = Math.max(1, f[1], f[2], f[3], f[4], f[5]);
  var h = '<div class="lk-faecher">';
  var i;
  for (i = 1; i <= 5; i++) {
    h += '<div><span class="lk-saeule"><i style="height:' + Math.round(f[i] * 100 / max) + '%"></i></span><b>' + f[i] + '</b><small>Fach ' + i + '</small></div>';
  }
  return h + '</div>';
}

function lkListeHtml() {
  var d = lkDaten();
  if (!d.kaesten.length) {
    return '<p>Noch keine Lernkartei.</p><p class="leise">Mit „Neu…“ legst du einen Kasten an, fügst Karten als Text ein, übernimmst ein Memo oder lädst ein Kartenpaket.</p>';
  }
  return d.kaesten.map(function (k) {
    var heute = lkHeuteZahl(d, k);
    var neu = k.karten.filter(function (c) { return !c.fach; }).length;
    return '<button type="button" class="lk-kasten" onclick="lkKastenOeffnen(\'' + esc(k.id) + '\')"><span class="lk-k1"><span>' + esc(k.name) + '</span><b>'
      + (heute ? heute + ' fällig' : '—') + '</b></span><small>' + (k.fehlt ? '⚠ Paket auf diesem Gerät noch laden · ' : (k.paket ? 'Paket · ' : '')) + k.karten.length + ' Karten'
      + (neu ? ' · ' + neu + ' neu' : '') + ' · ' + lkFaecher(k)[5] + ' in Fach 5</small></button>';
  }).join('');
}

function lkKastenHtml() {
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k) { cl.lk.ansicht = 'liste'; return lkListeHtml(); }
  var faellig = lkFaellig(k).length;
  var neu = lkNeuFrei(d, k);
  return '<div class="lk-titel">' + esc(k.name) + '</div>'
    + (k.fehlt ? '<div class="lk-hinweis">Die Karten dieses Pakets sind auf diesem Gerät noch nicht geladen. Dein Lernstand ist schon da — lade die Paketdatei einmal, dann geht es weiter.'
        + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="lkPaketWaehlen()">Paket laden …</button></div></div>' : '')
    + lkFaecherHtml(k)
    + '<div class="lk-info">' + faellig + ' fällig · ' + neu + ' neue für heute · ' + k.karten.filter(function (c) { return !c.fach; }).length + ' noch nicht gelernt</div>'
    + '<div class="lk-info leise">Abfrage: ' + esc((LK_RICHTUNGEN.filter(function (x) { return x[0] === (k.richtung || 'vor'); })[0] || ['', ''])[1])
    + ' · bis zu ' + (Number(k.neuProTag) || 20) + ' neue pro Tag' + (k.paket ? ' · Paket v' + k.paket.version : '') + '</div>';
}

function lkKartenHtml() {
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k) { return ''; }
  var q = suNorm(cl.lk.suche || '');
  var l = k.karten.filter(function (c) { return !q || suNorm(c.v + ' ' + c.r + ' ' + (c.w || '')).indexOf(q) >= 0; });
  return '<div class="su-feld"><span>⌕</span><input id="lkSuche" type="search" autocomplete="off" placeholder="In den Karten suchen …" value="' + esc(cl.lk.suche) + '" oninput="lkSucheGetippt()"></div>'
    + '<div id="lkKartenListe">' + lkKartenListeHtml(l) + '</div>';
}

function lkKartenListeHtml(l) {
  return l.slice(0, 300).map(function (c) {
    return '<button type="button" class="lk-karte-zeile" onclick="lkKarteOeffnen(\'' + esc(c.id) + '\')"><span>' + esc(c.v)
      + '<small>' + esc(String(c.w || c.r || '').split('\n')[0].replace(/\*\*/g, '').slice(0, 70)) + '</small></span><b>' + (c.fach ? 'F' + c.fach : 'neu') + '</b></button>';
  }).join('') + (l.length > 300 ? '<p class="leise">… und ' + (l.length - 300) + ' weitere — die Suche grenzt ein.</p>' : '') + (l.length ? '' : '<p class="leise">Keine Karte gefunden.</p>');
}

function lkSucheGetippt() {
  var f = document.getElementById('lkSuche');
  cl.lk.suche = f ? String(f.value || '') : '';
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  var ziel = document.getElementById('lkKartenListe');
  if (!k || !ziel) { return; }
  var q = suNorm(cl.lk.suche);
  ziel.innerHTML = lkKartenListeHtml(k.karten.filter(function (c) { return !q || suNorm(c.v + ' ' + c.r + ' ' + (c.w || '')).indexOf(q) >= 0; }));
}

function lkLernenHtml() {
  var s = cl.lk.sitzung;
  var a = lkAktuell();
  if (!s || !a) {
    var st = s ? s.stat : { g: 0, t: 0, n: 0 };
    return '<div class="lk-titel">Geschafft!</div><p>' + (st.g + st.t + st.n) + ' Karten gelernt: ' + st.g + ' gewusst, ' + st.t + ' teilweise, ' + st.n + ' nicht gewusst.</p>'
      + '<p class="leise">Nicht Gewusstes kommt morgen wieder, Gewusstes rückt ein Fach weiter.</p>';
  }
  var seite = lkSeiten(a.c, a.e.r);
  var punkte = lkPunkte(seite.antwort);
  var h = '<div class="lk-kopfzeile"><span>' + esc(a.k.name) + '</span><span>' + (s.i + 1) + ' / ' + s.schlange.length + '</span></div>'
    + '<button type="button" class="lk-seite vorn" onclick="lkUmdrehen()"><small>' + (a.e.r ? 'Rückseite → Vorderseite' : 'Vorderseite') + ' · ' + (a.c.fach ? 'Fach ' + a.c.fach : 'neu') + '</small>'
    + lkTextHtml(seite.frage, -1) + '</button>';
  if (!s.um) { return h + '<p class="leise lk-mitte">Erst selbst überlegen — dann umdrehen.</p>'; }
  var k = (punkte && s.auf >= 0) ? s.auf : -1;
  h += '<div class="lk-seite hinten"><small>Antwort' + (k >= 0 ? ' · ' + k + ' von ' + punkte + ' aufgedeckt' : '') + '</small>' + lkTextHtml(seite.antwort, k) + '</div>';
  if (k >= 0 && k < punkte) {
    h += '<div class="knoepfe lk-mitte"><button type="button" class="knopf voll" onclick="lkNaechsterPunkt()">Nächster Punkt</button>'
       + '<button type="button" class="knopf" onclick="lkAllesZeigen()">Alles zeigen</button></div>';
  }
  return h + '<div class="lk-bewerten"><button type="button" class="knopf" onclick="lkBewerten(\'n\')">✗ Nicht</button>'
    + '<button type="button" class="knopf" onclick="lkBewerten(\'t\')">~ Teilweise</button>'
    + '<button type="button" class="knopf voll" onclick="lkBewerten(\'g\')">✓ Gewusst</button></div>';
}

function lkFensterHtml() {
  var f = cl.lk.fenster;
  if (!f) { return ''; }
  var kopf = function (t) { return '<div class="fenster lk-fenster"><div class="titel">' + t + '</div><div class="rumpf">'; };
  var zu = '</div></div>';
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (f === 'neu') {
    return kopf('Neu') + '<button type="button" class="wahl" onclick="lkFensterAuf(\'kasten\')">Neuer Kasten …</button>'
      + '<button type="button" class="wahl" onclick="lkFensterAuf(\'einfuegen\')">Karten als Text einfügen …</button>'
      + '<button type="button" class="wahl" onclick="lkFensterAuf(\'memo\')">Aus einem Memo übernehmen …</button>'
      + '<button type="button" class="wahl" onclick="lkPaketWaehlen()">Kartenpaket laden …</button>'
      + '<div class="knoepfe"><button type="button" class="knopf" onclick="lkFensterZu()">Abbrechen</button></div>' + zu;
  }
  if (f === 'kasten') {
    return kopf('Neuer Kasten') + '<label for="lkName">Name:</label><input id="lkName" class="eingabe" type="text" autocomplete="off" value="">'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="lkNeuerKastenOk()">Anlegen</button><button type="button" class="knopf" onclick="lkFensterZu()">Abbrechen</button></div>' + zu;
  }
  if (f === 'einfuegen') {
    return kopf('Karten einfügen') + (k ? '<p class="leise">In den Kasten „' + esc(k.name) + '“.</p>'
        : '<label for="lkName">Neuer Kasten:</label><input id="lkName" class="eingabe" type="text" autocomplete="off" value="Meine Karten">')
      + '<label for="lkText">Leerzeile trennt Karten · 1. Zeile = Vorderseite · Rest = Rückseite (Listen mit • - 1. erlaubt)</label>'
      + '<textarea id="lkText" class="eingabe lk-feld" spellcheck="true"></textarea>'

  if (cl.lk.ansicht === 'lernen') { cl.lk.sitzung = null; cl.lk.ansicht = cl.lk.id ? 'kasten' : 'liste'; lkZeichnen(); return true; }

/* Fenster stehen oben im Inhalt: Beim Öffnen nach oben rollen, damit sie
   sichtbar sind, beim Schließen wieder dorthin, wo man war (seit 0.24.1) */
function lkZeichnen() {
  if (cl.app !== 'lernkartei') { return; }
  var el = document.getElementById('inhalt');
  var offen = !!cl.lk.fenster;
  if (offen && cl.lk.rolle === null) { cl.lk.rolle = el ? (Number(el.scrollTop) || 0) : 0; }
  inhaltZeichnen();
  fussZeichnen();
  kopfZeichnen();
  if (el) {
    if (offen) { el.scrollTop = 0; }
    else if (cl.lk.rolle !== null) { el.scrollTop = cl.lk.rolle; }
  }
  if (!offen) { cl.lk.rolle = null; }
}

/* ---------- Vorlesen (seit 0.26) ----------

   PDFs, Memos und eingefügter Text werden mit einer deutschen Stimme des
   Geräts vorgelesen (Sprachausgabe des Browsers). Der Text eines PDFs wird
   mit pdf.js herausgelesen und aufbereitet: Silbentrennung zusammengefügt,
   Kopf-/Fußzeilen und Seitenzahlen weggelassen, Absätze erkannt, in Sätze
   geteilt. Der aufbereitete Text bleibt auf dem Gerät (IndexedDB), die
   Lesestelle steht in der workbench.json (Bereich „vorlesen“, Workbench
   6.3.3) — so geht es auf dem anderen Gerät an derselben Stelle weiter.
   Die Kennung eines Dokuments wird aus seinem Text berechnet: Dasselbe PDF
   ergibt auf jedem Gerät dieselbe Kennung.

   Während des Vorlesens bleibt der Bildschirm an (sonst stoppt der Browser
   die Stimme). „Sperren“ legt eine schwarze Fläche darüber, die Berührungen

var VL_PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';

var VL_ABKUERZUNGEN = ['z', 'B', 'd', 'h', 'u', 'a', 'usw', 'bzw', 'ca', 'Dr', 'Prof', 'Nr', 'S', 'Kap', 'vgl', 'etc', 'evtl', 'ggf', 'inkl', 'Mio',
  'Mrd', 'bspw', 'sog', 'ä', 'o', 'Abb', 'Tab', 'St', 'Hr', 'Fr', 'Jh', 'v', 'Chr', 'n', 'Std', 'Min', 'max', 'min', 'zzgl', 'Bd', 'Aufl', 'Hrsg',
  'f', 'ff', 'z.B', 'd.h', 'u.a', 'i', 'e', 'Mr', 'Mrs', 'Ms', 'vs', 'insb', 'allg', 'Tel', 'Str', 'gem', 'lt', 'rd', 'jew', 'al', 'Vgl', 'Ggf', 'Bzw'];

cl.vl = { ansicht: 'liste', id: '', doc: null, i: 0, laeuft: false, fenster: '', gesperrt: false, gen: 0, laden: null,
          timerBis: 0, timerKapitel: -1, wach: null, gemerkt: 0, ziel: '', bis: -1, runde: [], marke: null, druck: 0 };

/* ---- Text aufbereiten (rein, ohne Browser — geprüft in den Tests) ---- */

/* Zeilen einer Seite aus den Textstücken von pdf.js: {str, transform:[a,b,c,d,x,y], height} */
function vlZeilenAusStuecken(stuecke) {
  /* Schräg oder senkrecht gesetzter Text (Wasserzeichen, Randvermerke) bleibt weg */
  var l = (stuecke || []).filter(function (s) {
    return s && typeof s.str === 'string' && s.transform && Math.abs(Number(s.transform[1]) || 0) < 0.01 && Math.abs(Number(s.transform[2]) || 0) < 0.01;
  }).map(function (s) {
    return { t: s.str, x: Number(s.transform[4]) || 0, y: Number(s.transform[5]) || 0, h: Math.abs(Number(s.height) || Number(s.transform[3]) || 10) };
  });
  /* Erst nach Höhe gruppieren (fett/kursiv/hochgestellt liegt oft minimal versetzt), dann je Zeile von links nach rechts
     — seit 0.27 in zwei Schritten, vorher zerriss ein unbeständiger Vergleich manche Zeile in zwei */
  l.sort(function (a, b) { return b.y - a.y; });
  var gruppen = [];
  l.forEach(function (s) {
    var g = gruppen[gruppen.length - 1];
    if (g && Math.abs(g.y - s.y) <= Math.max(2, Math.max(g.h, s.h) * 0.5)) { g.stuecke.push(s); if (s.h > g.h) { g.h = s.h; g.y = s.y; } }
    else { gruppen.push({ y: s.y, h: s.h, stuecke: [s] }); }
  });
  var zeilen = gruppen.map(function (g) {
    g.stuecke.sort(function (a, b) { return a.x - b.x; });
    var t = '';
    var ende = -1e9;
    var hauptH = 0;
    g.stuecke.forEach(function (s) { if (s.t.trim().length > 2 && s.h > hauptH) { hauptH = s.h; } });
    g.stuecke.forEach(function (s) {
      /* Hochgestellte Fußnotenziffern (kleiner gesetzt) nicht mitlesen (seit 0.27) */
      if (hauptH && s.h < hauptH * 0.8 && /^\s*\d{1,3}\*?\s*$/.test(s.t)) { return; }
      var luecke = s.x - ende;
      t += (t && luecke > s.h * 0.15 && !/\s$/.test(t) && !/^\s/.test(s.t) ? ' ' : '') + s.t;
      ende = Math.max(ende, s.x + s.t.length * s.h * 0.45);
      if (s.t.trim().length > 2 && s.h > hauptH) { hauptH = s.h; }
    });
    return { t: t.replace(/\s+/g, ' ').trim(), y: g.y, h: hauptH || g.h };
  });
  return zeilen.filter(function (z) { return z.t; });
}

function vlSchluesselZeile(t) {
  return String(t).toLowerCase().replace(/\d+/g, '#').replace(/\s+/g, ' ').trim();
}

/* Seiten [{zeilen:[{t,y,h}]}] → { saetze:[], seite:[], absatz:[] } */
function vlAufbereiten(seiten) {
  var n = seiten.length;
  /* Wiederkehrende Zeilen (Kopf, Fuß, Wasserzeichen) zählen */
  var zaehl = {};
  seiten.forEach(function (s) {
    var gesehen = {};
    s.zeilen.forEach(function (z) { var k = vlSchluesselZeile(z.t); if (!gesehen[k]) { gesehen[k] = 1; zaehl[k] = (zaehl[k] || 0) + 1; } });
  });
  /* Am Rand (Kopf/Fuß) reicht dreimal — laufende Kolumnentitel wiederholen sich je Kapitel */
  var oft = function (k, rand) { return n >= 4 && zaehl[k] >= (rand ? 3 : Math.max(3, n * 0.5)); };
  /* Erst filtern, dann Zeilenabstand und Zeilenlänge über das ganze Dokument bestimmen */
  var gefiltert = seiten.map(function (s) {
    return s.zeilen.filter(function (z, zi) {
      var k = vlSchluesselZeile(z.t);
      var rand = zi < 2 || zi >= s.zeilen.length - 2;
      if (/^[#\s.\-–—|]*$/.test(k) && z.t.length <= 12) { return false; }           /* nur Seitenzahl */
      if (rand && /^[ivxlc]+$/.test(k)) { return false; }                            /* römische Seitenzahl */
      return !oft(k, rand);

  });
  var alleAbst = [];
  var alleLaengen = [];
  gefiltert.forEach(function (zeilen) {
    var i;
    for (i = 1; i < zeilen.length; i++) { var d = Math.abs(zeilen[i - 1].y - zeilen[i].y); if (d > 0) { alleAbst.push(d); } }
    zeilen.forEach(function (z) { alleLaengen.push(z.t.length); });
  });
  alleAbst.sort(function (x, y) { return x - y; });
  alleLaengen.sort(function (x, y) { return x - y; });
  var mitte = alleAbst.length ? alleAbst[Math.floor(alleAbst.length / 2)] : 0;
  var voll = alleLaengen[Math.floor(alleLaengen.length * 0.8)] || 60;
  var absaetze = [];
  var akt = null;
  gefiltert.forEach(function (zeilen, si) {
    if (!zeilen.length) { return; }
    var abst = [];
    var i;
    for (i = 1; i < zeilen.length; i++) { abst.push(Math.abs(zeilen[i - 1].y - zeilen[i].y)); }
    zeilen.forEach(function (z, zi) {

      } else if (akt) {
        var luecke = abst[zi - 1];
        var vorher = zeilen[zi - 1];

        neu = (mitte > 0 && luecke > mitte * 1.45) || (/[.!?:…"“”»]$/.test(vorher.t) && vorher.t.length < voll * 0.7)
          || (vorher.t.length < voll * 0.5 && !/[,;\-]$/.test(vorher.t) && Math.abs(vorher.h - z.h) > Math.min(vorher.h, z.h) * 0.12)
          /* allein stehende kurze Zeile ohne Satzzeichen = Zwischenüberschrift */
          || (akt.zeilen === 1 && vorher.t.length < voll * 0.6 && !/[.!?:…,;\-"“”»)]$/.test(vorher.t) && /^[A-ZÄÖÜ„"»]/.test(z.t));
      }
      if (neu) { akt = { text: z.t, seite: si + 1, letzte: z.t, letzteKurz: z.t.length < voll * 0.7, h: z.h, letzteH: z.h, zeilen: 1 }; absaetze.push(akt); return; }

      else { akt.text += ' ' + z.t; }

    }

  });
  absaetze = zusammen;
  var aus = { saetze: [], seite: [], absatz: [] };
  absaetze.forEach(function (a, ai) {
    vlSaetze(a.text).forEach(function (s) { aus.saetze.push(s); aus.seite.push(a.seite); aus.absatz.push(ai); });
  });

/* Text in Sätze teilen — Abkürzungen, Ordnungszahlen und Aufzählungen bleiben heil */
function vlSaetze(text) {

        || vorher.length < 3;
      /* Original-Abstand behalten: „2.2.2“ bleibt „2.2.2“ */
      if (anhaengen) { roh[roh.length - 1] += st; return; }
    }
    roh.push(st);
  });
  var saetze = roh.map(function (s) { return s.trim(); }).filter(function (s) { return s; });
  /* Sehr lange Sätze an Satzzeichen teilen — die Stimme bricht sonst manchmal ab */
  var aus = [];
  saetze.forEach(function (s) {
    while (s.length > 280) {
      var schnitt = -1;
      var muster = [/; /g, /: /g, /, /g, / – /g, / /g];
      var m;
      for (m = 0; m < muster.length && schnitt < 0; m++) {
        var r;
        var best = -1;
        muster[m].lastIndex = 0;
        while ((r = muster[m].exec(s)) !== null) { if (r.index > 80 && r.index < 260) { best = r.index + 1; } }
        schnitt = best;
      }
      if (schnitt < 0) { schnitt = 260; }
      aus.push(s.slice(0, schnitt).trim());
      s = s.slice(schnitt).trim();
    }
    if (s) { aus.push(s); }
  });
  return aus;
}

/* Kennung aus dem Text — dasselbe Dokument ergibt überall dieselbe */
function vlKennung(saetze) {
  var probe = saetze.length + '|' + saetze.slice(0, 60).join(' ').slice(0, 4000);
  var h1 = 5381;
  var h2 = 52711;
  var i;
  for (i = 0; i < probe.length; i++) {
    var c = probe.charCodeAt(i);
    h1 = ((h1 * 33) ^ c) >>> 0;
    h2 = ((h2 * 31) + c) >>> 0;
  }
  return 'vl-' + h1.toString(36) + h2.toString(36);
}

/* Memo-Text: Überschriften, Kästchen und Aufzählungszeichen weg, jede Zeile ein Absatz */
function vlAusText(text) {
  var aus = { saetze: [], seite: [], absatz: [] };
  String(text || '').replace(/\r/g, '').split('\n').forEach(function (z, ai) {
    var t = z.replace(/^\s*#{1,6}\s+/, '').replace(/^\s*[-*•]\s*\[[ xX-]?\]\s*/, '').replace(/^\s*\[[ xX-]?\]\s*/, '')
      .replace(/^\s*[-*•]\s+/, '').replace(/\*\*([^*]+)\*\*/g, '$1').trim();
    if (!t) { return; }
    vlSaetze(t).forEach(function (s) { aus.saetze.push(s); aus.seite.push(1); aus.absatz.push(ai); });
  });
  return aus;
}

/* ---- Datenbank: Dokumente und Lesestelle ---- */

function vlDokumente() {
  return (Array.isArray(DB.vorlesen) ? DB.vorlesen : []).filter(function (d) { return d && d.id; }).slice().sort(function (a, b) {
    return String(b.zuletzt || '').localeCompare(String(a.zuletzt || '')) || String(a.titel).localeCompare(String(b.titel));
  });
}

function vlDokument(id) {
  return (Array.isArray(DB.vorlesen) ? DB.vorlesen : []).filter(function (d) { return d && d.id === id; })[0] || null;
}

function vlGeraet() {
  var n = window.navigator || {};
  var u = n.userAgent || '';
  if (/iPad/.test(u) || (/Macintosh/.test(u) && n.maxTouchPoints > 1)) { return 'iPad'; }
  return /Android/.test(u) ? 'Pixel' : 'PC';
}

/* Neues oder vorhandenes Dokument in der Datenbank (Lesestelle bleibt) */
function vlEintragen(feld) {
  if (!Array.isArray(DB.vorlesen)) { DB.vorlesen = []; }
  var d = vlDokument(feld.id);
  if (!d) {
    d = { id: feld.id, titel: feld.titel, art: feld.art, satz: 0, saetze: feld.saetze, seiten: feld.seiten || 1, fertig: false,
          zuletzt: '', geraet: '', geaendert: jetzt() };
    DB.vorlesen.push(d);
  }
  if (feld.drive) { d.drive = feld.drive; }
  if (feld.memo) { d.memo = feld.memo; }
  d.saetze = feld.saetze;
  d.seiten = feld.seiten || d.seiten || 1;
  d.geaendert = jetzt();
  spaeterSichern();
  return d;
}

/* Lesestelle merken — beim Lesen höchstens alle 30 Sekunden, sonst sofort */
function vlStelleMerken(sofort) {
  var d = vlDokument(cl.vl.id);
  if (!d || !cl.vl.doc) { return; }
  var z = jetzt();
  if (!sofort && z - cl.vl.gemerkt < 30000) { return; }
  cl.vl.gemerkt = z;
  var fertig = cl.vl.i >= cl.vl.doc.saetze.length - 1 && !cl.vl.laeuft && cl.vl.i > 0;
  if (d.satz === cl.vl.i && d.fertig === fertig && d.geraet === vlGeraet()) { return; }
  d.satz = cl.vl.i;
  d.seite = cl.vl.doc.seite[cl.vl.i] || 1;
  d.fertig = fertig;
  var jz = new Date();
  d.zuletzt = isoDatum(jz) + 'T' + zwei(jz.getHours()) + ':' + zwei(jz.getMinutes());
  d.geraet = vlGeraet();
  d.geaendert = z;
  spaeterSichern();
}

/* Welche Dokumente liegen auf diesem Gerät? (für die Liste ohne Warten auf IndexedDB) */
function vlLokal() {
  var l = null;
  try { l = JSON.parse(window.localStorage.getItem(VL_LOKAL_KEY) || 'null'); } catch (e) { l = null; }
  return (l && typeof l === 'object') ? l : {};
}

function vlLokalSetzen(id, da) {
  var l = vlLokal();
  if (da) { l[id] = 1; } else { delete l[id]; }
  try { window.localStorage.setItem(VL_LOKAL_KEY, JSON.stringify(l)); } catch (e) { /* egal */ }
}

/* Text eines Dokuments: Memo live, sonst aus IndexedDB */
function vlTextHolen(d) {
  if (d.art === 'memo') {
    var s = kpSeiteFinden(d.memo);
    if (!s) { return Promise.resolve(null); }
    var t = vlAusText(s.titel + '\n' + s.text);
    t.kapitel = [];
    t.titel = s.titel;
    return Promise.resolve(t);
  }
  if (!idbDa()) { return Promise.resolve(null); }
  return idbLesen('vl-text-' + d.id).catch(function () { return null; });
}

/* ---- Laden: PDF, Text, Memo, Drive ---- */

function vlPdfJs() {
  if (window.pdfjsLib) { return Promise.resolve(window.pdfjsLib); }
  return new Promise(function (fertig, fehler) {
    var s = document.createElement('script');
    s.src = VL_PDFJS;
    s.onload = function () {
      if (!window.pdfjsLib) { fehler(new Error('PDF-Baustein fehlt')); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = VL_PDFJS_WORKER;
      fertig(window.pdfjsLib);
    };
    s.onerror = function () { fehler(new Error('Der PDF-Baustein ließ sich nicht laden — ist das Gerät online?')); };
    document.head.appendChild(s);
  });
}

function vlDateiWaehlen() {
  var f = document.getElementById('vlDatei');
  if (f && f.click) { f.value = ''; f.click(); }
}

/* Dateiname als Titel: ohne Endung, Unterstriche als Leerzeichen */
function vlDateiTitel(name) {
  return String(name || 'Dokument').replace(/\.pdf$/i, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120) || 'Dokument';
}

function vlDateiGewaehlt(feld) {
  var datei = feld && feld.files && feld.files[0];
  if (!datei || typeof window.FileReader !== 'function') { return; }
  var leser = new window.FileReader();
  leser.onload = function () { vlPdfVerarbeiten(leser.result, vlDateiTitel(datei.name), {}); };
  leser.readAsArrayBuffer(datei);
}

/* Inhaltsverzeichnis des PDFs → Kapitel mit Seitenzahl */
function vlGliederung(pdf) {
  return pdf.getOutline().then(function (o) {
    var flach = [];
    (o || []).forEach(function (e) {
      flach.push({ t: e.title, dest: e.dest, ebene: 0 });
      (e.items || []).forEach(function (u) { flach.push({ t: u.title, dest: u.dest, ebene: 1 }); });
    });
    return Promise.all(flach.slice(0, 200).map(function (e) {
      var d = (typeof e.dest === 'string') ? pdf.getDestination(e.dest) : Promise.resolve(e.dest);
      return d.then(function (ziel) { return (ziel && ziel[0]) ? pdf.getPageIndex(ziel[0]) : -1; })
        .then(function (i) { return { t: String(e.t || '').trim(), seite: i + 1, ebene: e.ebene }; })
        .catch(function () { return null; });
    }));
  }).then(function (l) { return (l || []).filter(function (x) { return x && x.t && x.seite > 0; }); }).catch(function () { return []; });
}

function vlPdfVerarbeiten(puffer, titel, quelle) {
  cl.vl.laden = { titel: titel, seite: 0, seiten: 0 };
  cl.vl.fenster = 'laden';
  vlZeichnen();
  var pdf = null;
  return vlPdfJs().then(function (lib) {
    return lib.getDocument({ data: new Uint8Array(puffer) }).promise;
  }).then(function (p) {
    pdf = p;
    cl.vl.laden.seiten = pdf.numPages;
    var seiten = [];
    var nr = 1;
    var naechste = function () {
      if (nr > pdf.numPages) { return Promise.resolve(seiten); }
      return pdf.getPage(nr).then(function (seite) { return seite.getTextContent(); }).then(function (inhalt) {
        seiten.push({ zeilen: vlZeilenAusStuecken(inhalt.items) });
        cl.vl.laden.seite = nr;
        if (nr % 5 === 0) { vlZeichnen(); }
        nr++;
        return naechste();
      });
    };
    return naechste();
  }).then(function (seiten) {
    var t = vlAufbereiten(seiten);
    var zeichen = t.saetze.join('').length;
    if (zeichen < Math.max(200, seiten.length * 40)) {
      cl.vl.laden = null;
      cl.vl.fenster = '';
      melde('In diesem PDF steht kaum Text — wohl ein Scan. Vorlesen geht nur mit echtem Text.', 'warn');
      vlZeichnen();
      return null;
    }
    return pdf.getMetadata().then(function (m) {
      var mt = m && m.info && typeof m.info.Title === 'string' ? m.info.Title.trim() : '';
      if (mt.length > 3 && !/^(untitled|unbenannt|microsoft|document|dokument)/i.test(mt) && !/\.(docx?|pdf|indd)$/i.test(mt)) { titel = mt; }
    }).catch(function () { return null; }).then(function () { return vlGliederung(pdf); }).then(function (gl) {
      t.kapitel = gl.map(function (k) {
        var i = t.seite.indexOf(t.seite.filter(function (s) { return s >= k.seite; })[0]);
        return { t: k.t, i: i, ebene: k.ebene };
      }).filter(function (k) { return k.i >= 0; });
      t.titel = titel;
      t.seiten = seiten.length;
      /* Fingerabdruck der Datei — gleich auf jedem Gerät und in jeder CLIE-Fassung (seit 0.28.1) */
      var fpRoh = (pdf.fingerprints && pdf.fingerprints[0]) || pdf.fingerprint || '';
      t.fp = fpRoh ? vlHash(String(fpRoh)) : '';
      return vlUebernehmen(t, 'pdf', quelle);
    });
  }).catch(function (f) {
    cl.vl.laden = null;
    cl.vl.fenster = '';
    melde('PDF ließ sich nicht lesen: ' + (f && f.message ? f.message : 'unbekannter Fehler'), 'warn');
    vlZeichnen();
    return null;
  });
}

/* Aufbereiteten Text speichern, Dokument eintragen und öffnen */
/* Dasselbe Dokument finden: gleicher Fingerabdruck, gleiche Drive-Datei oder (für ältere Einträge)
   gleicher Titel mit gleicher Seitenzahl. Behalten wird der mit der weitesten Lesestelle,
   die übrigen verschwinden auf allen Geräten (seit 0.28.1 — vorher hing die Kennung am
   ausgelesenen Text und änderte sich mit jeder besseren Aufbereitung). */
function vlGleiche(t, art, quelle, id) {
  var norm = function (s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); };
  return (Array.isArray(DB.vorlesen) ? DB.vorlesen : []).filter(function (d) {
    if (!d || !d.id) { return false; }
    if (d.id === id) { return true; }
    if (t.fp && d.fp === t.fp) { return true; }
    if (quelle && quelle.drive && d.drive === quelle.drive) { return true; }
    return art === 'pdf' && d.art === 'pdf' && !!t.titel && norm(d.titel) === norm(t.titel) && Number(d.seiten) === Number(t.seiten || 1);
  }).sort(function (a, b) {
    return (Number(b.seite) || 1) - (Number(a.seite) || 1) || String(b.zuletzt || '').localeCompare(String(a.zuletzt || ''));
  });
}

function vlHash(s) {
  var h1 = 5381;
  var h2 = 52711;
  var i;
  for (i = 0; i < s.length; i++) { var c = s.charCodeAt(i); h1 = ((h1 * 33) ^ c) >>> 0; h2 = ((h2 * 31) + c) >>> 0; }
  return h1.toString(36) + h2.toString(36);
}

function vlUebernehmen(t, art, quelle) {
  var neuId = t.fp ? 'vl-f' + vlHash(t.fp + '|' + (t.seiten || 1)) : vlKennung(t.saetze);
  var gleiche = vlGleiche(t, art, quelle, neuId);
  var vorher = gleiche[0] || null;
  var id = vorher ? vorher.id : neuId;
  t.id = id;
  /* Doppelte zusammenführen */
  gleiche.slice(1).forEach(function (x) {
    DB.vorlesen = DB.vorlesen.filter(function (d) { return d !== x; });
    grabsteinSetzen('vorlesen', x.id);
    vlLokalSetzen(x.id, false);
    if (idbDa()) { idbLoeschen('vl-text-' + x.id).catch(function () { return null; }); }
  });
  /* Hat sich die Satzzahl geändert (bessere Aufbereitung), gilt die gemerkte Seite */
  if (vorher && Number(vorher.saetze) !== t.saetze.length && vorher.seite) {
    var j = 0;
    while (j < t.seite.length - 1 && t.seite[j] < Number(vorher.seite)) { j++; }
    vorher.satz = j;
  }
  var speichern = idbDa() ? idbSchreiben('vl-text-' + id, t) : Promise.resolve(false);
  return speichern.catch(function () { return false; }).then(function (ok) {
    if (!ok) { melde('Der Text ließ sich auf diesem Gerät nicht speichern.', 'warn'); }
    vlLokalSetzen(id, true);
    var d = vlEintragen({ id: id, titel: vorher ? vorher.titel : t.titel, art: art, saetze: t.saetze.length, seiten: t.seiten || 1,
                          drive: quelle && quelle.drive, memo: quelle && quelle.memo });
    if (t.fp) { d.fp = t.fp; }
    cl.vl.laden = null;
    cl.vl.fenster = '';
    melde(vorher ? '„' + d.titel + '“ ist jetzt auf diesem Gerät — weiter bei Seite ' + (t.seite[d.satz] || 1) + '.'
      + (gleiche.length > 1 ? ' ' + (gleiche.length - 1) + (gleiche.length > 2 ? ' doppelte Einträge' : ' doppelter Eintrag') + ' zusammengeführt.' : '')
      : '„' + d.titel + '“: ' + t.saetze.length + ' Sätze bereit.', 'gut');
    return vlOeffnen(id, t);
  });
}

function vlTextOk() {
  var titel = String((document.getElementById('vlTitel') || {}).value || '').trim() || 'Text vom ' + isoDatum();
  var text = String((document.getElementById('vlText') || {}).value || '');
  var t = vlAusText(text);
  if (!t.saetze.length) { melde('Bitte Text einfügen.', 'warn'); return; }
  t.titel = titel.slice(0, 120);
  t.kapitel = [];
  t.seiten = 1;
  vlUebernehmen(t, 'text', {});
}

function vlMemoWaehlen(id) {
  var s = kpSeiteFinden(id);
  if (!s) { return; }
  var did = 'vl-memo-' + s.id;
  var t = vlAusText(s.titel + '\n' + s.text);
  if (!t.saetze.length) { melde('Dieses Memo ist leer.', 'warn'); return; }
  vlEintragen({ id: did, titel: s.titel, art: 'memo', saetze: t.saetze.length, seiten: 1, memo: s.id });
  cl.vl.fenster = '';
  t.kapitel = [];
  t.titel = s.titel;
  vlOeffnen(did, t);
}

/* Drive: braucht das Recht, Dateiinhalte zu lesen */
function vlDriveGewuenscht() {
  try { return window.localStorage.getItem(VL_DRIVE_KEY) === 'an'; } catch (e) { return false; }
}

function vlDriveRechtPruefen() {
  if (!tokenGueltig() || typeof fetch !== 'function') { return Promise.resolve(false); }
  return fetch(DRV_TOKENINFO + encodeURIComponent(zugriffToken)).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    var rechte = (j && typeof j.scope === 'string') ? j.scope.split(' ') : [];
    return rechte.indexOf(VL_DRIVE_SCOPE) >= 0 || rechte.indexOf('https://www.googleapis.com/auth/drive') >= 0;
  }).catch(function () { return false; });
}

function vlDriveErlauben() {
  try { window.localStorage.setItem(VL_DRIVE_KEY, 'an'); } catch (e) { /* nur für jetzt */ }
  cl.vl.fenster = '';
  anmeldeVersuch(false, 'consent').then(function () {
    if (cl.vl.ziel) { var z = cl.vl.ziel; cl.vl.ziel = ''; vlAusDrive(z.id, z.name); }
  });
}

function vlAusDriveZeile(i) {
  var z = cl.drv.zeilen[i];
  if (z) { vlAusDrive(z.id, z.name); }
}

function vlAusDrive(dateiId, name) {
  var vorhanden = (Array.isArray(DB.vorlesen) ? DB.vorlesen : []).filter(function (d) { return d.drive === dateiId; })[0];
  if (vorhanden && vlLokal()[vorhanden.id]) { oeffne('vorlesen'); vlOeffnen(vorhanden.id); return; }
  if (!tokenGueltig()) { melde('Für Drive braucht CLIE die Verbindung zu Google.', 'warn'); return; }
  oeffne('vorlesen');
  cl.vl.laden = { titel: name, seite: 0, seiten: 0 };
  cl.vl.fenster = 'laden';
  vlZeichnen();
  vlDriveRechtPruefen().then(function (ja) {
    if (!ja) {
      cl.vl.laden = null;
      cl.vl.ziel = { id: dateiId, name: name };
      cl.vl.fenster = 'recht';
      vlZeichnen();
      return null;
    }
    return fetch(DRV_API + '/' + encodeURIComponent(dateiId) + '?alt=media', { headers: driveKopf() }).then(function (r) {
      if (!r.ok) { throw new Error('Drive antwortet mit ' + r.status + '.'); }
      return r.arrayBuffer();
    }).then(function (puffer) {
      return vlPdfVerarbeiten(puffer, vlDateiTitel(name), { drive: dateiId });
    });
  }).catch(function (f) {
    cl.vl.laden = null;
    cl.vl.fenster = '';
    melde('Laden aus Drive ging nicht: ' + (f && f.message ? f.message : ''), 'warn');
    vlZeichnen();
  });
}

/* ---- Öffnen und Vorlesen ---- */

function vlOeffnen(id, text) {
  var d = vlDokument(id);
  if (!d) { return Promise.resolve(null); }
  if (cl.vl.id !== id) { vlAnhalten(); }
  cl.vl.id = id;
  cl.vl.ansicht = 'lesen';
  cl.vl.fenster = '';
  var weiter = function (t) {
    if (!t || !Array.isArray(t.saetze) || !t.saetze.length) {
      cl.vl.doc = null;
      vlLokalSetzen(id, false);
      vlZeichnen();
      return null;
    }
    cl.vl.doc = t;
    vlMarkenAnpassen(d, t);
    cl.vl.i = Math.max(0, Math.min(t.saetze.length - 1, Number(d.satz) || 0));
    if (d.fertig) { cl.vl.i = 0; }
    vlZeichnen();
    vlAktuellZeigen();
    return t;
  };
  if (text) { return Promise.resolve(weiter(text)); }
  cl.vl.doc = null;
  vlZeichnen();
  return vlTextHolen(d).then(weiter);
}

function vlEinstellungen() {
  var e = null;
  try { e = JSON.parse(window.localStorage.getItem(VL_STIMME_KEY) || 'null'); } catch (x) { e = null; }
  e = (e && typeof e === 'object') ? e : {};
  return { stimme: e.stimme || '', tempo: Number(e.tempo) || 1, hoehe: Number(e.hoehe) || 1, timer: (typeof e.timer === 'number') ? e.timer : 0 };
}

function vlEinstellungenSichern(e) {
  try { window.localStorage.setItem(VL_STIMME_KEY, JSON.stringify(e)); } catch (x) { /* nur für jetzt */ }
}

function vlStimmen() {
  var s = window.speechSynthesis;
  if (!s || typeof s.getVoices !== 'function') { return []; }
  return s.getVoices().filter(function (v) { return /^de/i.test(v.lang || ''); });
}

function vlStimme() {
  var e = vlEinstellungen();
  var l = vlStimmen();
  return l.filter(function (v) { return v.voiceURI === e.stimme; })[0] || l.filter(function (v) { return /de-DE/i.test(v.lang); })[0] || l[0] || null;
}

/* Für die Stimme: WÖRTER IN GROSSBUCHSTABEN normal schreiben (sonst buchstabiert sie),
   zerlegte Initialen („E S IST“) zusammenfügen. Echte Abkürzungen bleiben. (seit 0.27) */
function vlSprechText(text) {
  var t = String(text || '');
  var buchst = t.replace(/[^A-Za-zÄÖÜäöüß]/g, '');
  var gross = t.replace(/[^A-ZÄÖÜ]/g, '').length;
  var meistGross = buchst.length >= 6 && gross / buchst.length > 0.6;
  if (meistGross) {
    /* Initiale am Satzanfang („E S IST“ → „ES IST“), dann Kapitälchen-Anfänge („C HARAKTER“ → „CHARAKTER“) */
    t = t.replace(/^([„"»(]?)([A-ZÄÖÜ]) (?=[A-ZÄÖÜ])/, '$1$2');
  }
  t = t.replace(/(^|[\s„"»(])([B-DF-HJ-NP-TV-ZÄÖÜ]) (?=[A-ZÄÖÜ]{4,})/g, '$1$2');
  var grossWoerter = (t.match(/\b[A-ZÄÖÜ]{3,}\b/g) || []).length;
  return t.replace(/[A-ZÄÖÜ][A-ZÄÖÜß]+/g, function (w, pos) {
    var ganz = !/[A-Za-zÄÖÜäöüß]/.test(t.charAt(pos - 1) || ' ') && !/[a-zäöüß]/.test(t.charAt(pos + w.length) || ' ');
    if (!ganz) { return w; }
    if (w.length >= 6 || (w.length >= 3 && grossWoerter >= 2) || meistGross) { return w.charAt(0) + w.slice(1).toLowerCase(); }
    return w;
  });
}

function vlSprechen(text, fertig) {
  var s = window.speechSynthesis;
  if (!s || typeof window.SpeechSynthesisUtterance !== 'function') { melde('Dieses Gerät kann nicht vorlesen (keine Sprachausgabe).', 'warn'); return false; }
  var e = vlEinstellungen();
  var u = new window.SpeechSynthesisUtterance(vlSprechText(text));
  var v = vlStimme();
  u.lang = v ? v.lang : 'de-DE';
  if (v) { u.voice = v; }
  u.rate = e.tempo;
  u.pitch = e.hoehe;
  if (fertig) {
    u.onend = function () { fertig(true); };
    u.onerror = function (x) { fertig(!(x && (x.error === 'interrupted' || x.error === 'canceled'))); };
  }
  s.cancel();
  s.speak(u);
  return true;
}

/* Ende des Kapitels, in dem Satz i steht */
function vlKapitelEnde(i) {
  var k = (cl.vl.doc && cl.vl.doc.kapitel) || [];
  var n = k.filter(function (x) { return x.i > i; }).map(function (x) { return x.i; }).sort(function (a, b) { return a - b; })[0];
  return (typeof n === 'number') ? n : -1;
}

function vlStarten() {
  if (!cl.vl.doc) { return; }
  if (cl.vl.i >= cl.vl.doc.saetze.length) { cl.vl.i = 0; }
  var e = vlEinstellungen();
  cl.vl.laeuft = true;
  cl.vl.timerBis = e.timer > 0 ? jetzt() + e.timer * 60000 : 0;
  cl.vl.timerKapitel = e.timer === -1 ? vlKapitelEnde(cl.vl.i) : -1;
  if (e.timer === -1 && cl.vl.timerKapitel < 0) { cl.vl.timerKapitel = cl.vl.doc.saetze.length; }
  vlWachHalten(true);
  vlStelleMerken(true);
  vlSatzSprechen();
  vlZeichnen();
}

function vlSatzSprechen() {
  if (!cl.vl.laeuft || !cl.vl.doc) { return; }
  var g = ++cl.vl.gen;
  var ok = vlSprechen(cl.vl.doc.saetze[cl.vl.i], function (normal) {
    if (g !== cl.vl.gen || !cl.vl.laeuft) { return; }
    if (!normal) { vlAnhalten(); return; }
    vlNaechster();
  });
  if (!ok) { cl.vl.laeuft = false; vlZeichnen(); }
}

/* Nach einem Satz: weiter, außer Ende, Schlaftimer oder Kapitelende */
function vlNaechster() {
  var doc = cl.vl.doc;
  if (!doc) { return; }
  if (cl.vl.i >= doc.saetze.length - 1) {
    cl.vl.laeuft = false;
    vlWachHalten(false);
    vlStelleMerken(true);
    var d = vlDokument(cl.vl.id);
    if (d) { d.fertig = true; d.geaendert = jetzt(); spaeterSichern(); }
    melde('Fertig vorgelesen.', 'gut');
    vlZeichnen();
    return;
  }
  /* Ein Lesezeichen anhören: am Ende des Stücks zum nächsten der Runde oder anhalten (seit 0.29) */
  if (cl.vl.bis >= 0 && cl.vl.i >= cl.vl.bis) {
    var naechste = cl.vl.runde.shift();
    if (naechste) {
      cl.vl.i = naechste.von;
      cl.vl.bis = naechste.bis;
      vlStelleMerken(false);
      vlAktuellZeigen();
      vlSatzSprechen();
      return;
    }
    vlAnhalten();
    melde('Lesezeichen zu Ende.', null);
    return;
  }
  cl.vl.i++;
  if ((cl.vl.timerBis && jetzt() >= cl.vl.timerBis) || (cl.vl.timerKapitel >= 0 && cl.vl.i >= cl.vl.timerKapitel)) {
    vlAnhalten();
    melde('Schlaftimer: angehalten.', null);
    return;
  }
  vlStelleMerken(false);
  vlAktuellZeigen();
  vlSatzSprechen();
}

function vlAnhalten() {
  cl.vl.gen++;
  cl.vl.bis = -1;
  cl.vl.runde = [];
  var war = cl.vl.laeuft;
  cl.vl.laeuft = false;
  if (window.speechSynthesis && typeof window.speechSynthesis.cancel === 'function') { window.speechSynthesis.cancel(); }
  vlWachHalten(false);
  if (war) { vlStelleMerken(true); }
  if (cl.vl.gesperrt) { vlSperreZeichnen(); }
  vlZeichnen();
}

function vlUm() {
  if (cl.vl.laeuft) { vlAnhalten(); } else { vlStarten(); }
}

/* Springen: Satz (±1), Absatz (±2), oder direkt auf Satz i */
function vlGehe(i) {
  var doc = cl.vl.doc;
  if (!doc) { return; }
  cl.vl.i = Math.max(0, Math.min(doc.saetze.length - 1, i));
  vlStelleMerken(true);
  if (cl.vl.laeuft) { vlSatzSprechen(); }
  vlAktuellZeigen();
}

function vlSchritt(was) {
  var doc = cl.vl.doc;
  if (!doc) { return; }
  var i = cl.vl.i;
  if (was === 'satz+') { vlGehe(i + 1); return; }
  if (was === 'satz-') { vlGehe(i - 1); return; }
  var a = doc.absatz[i];
  if (was === 'absatz+') {
    while (i < doc.saetze.length - 1 && doc.absatz[i] === a) { i++; }
    vlGehe(i);
    return;
  }
  /* Absatz zurück: an den Anfang des Absatzes, steht man dort schon, an den Anfang des vorigen */
  var anfang = i;
  while (anfang > 0 && doc.absatz[anfang - 1] === a) { anfang--; }
  if (anfang === i && anfang > 0) { anfang--; a = doc.absatz[anfang]; while (anfang > 0 && doc.absatz[anfang - 1] === a) { anfang--; } }
  vlGehe(anfang);
}

function vlSatzTipp(i) {
  vlGehe(i);
  if (!cl.vl.laeuft) { vlStarten(); }
}

/* Bildschirm wach halten, solange vorgelesen wird */
function vlWachHalten(an) {
  var n = window.navigator;
  if (!an) {
    if (cl.vl.wach && typeof cl.vl.wach.release === 'function') { cl.vl.wach.release().catch(function () { return null; }); }
    cl.vl.wach = null;
    return;
  }
  if (cl.vl.wach || !n || !n.wakeLock || typeof n.wakeLock.request !== 'function') { return; }
  n.wakeLock.request('screen').then(function (w) {
    if (!cl.vl.laeuft) { w.release(); return; }
    cl.vl.wach = w;
    w.addEventListener('release', function () { if (cl.vl.wach === w) { cl.vl.wach = null; } });
  }).catch(function () { return null; });
}

/* Zurück aus dem Hintergrund: Wachhalten erneuern (der Browser gibt es beim Wechsel frei) */
function vlSichtbarkeit() {
  if (document.visibilityState === 'visible' && cl.vl.laeuft) { vlWachHalten(true); }
  if (document.visibilityState === 'hidden' && cl.vl.laeuft) { vlStelleMerken(true); }
}

/* ---- Sperre ---- */

function vlSperren() {
  cl.vl.gesperrt = true;
  vlSperreZeichnen();
}

function vlSperreZeichnen() {
  var el = document.getElementById('vlSperre');
  if (!cl.vl.gesperrt) { if (el && el.parentNode) { el.parentNode.removeChild(el); } return; }
  if (!el) {
    el = document.createElement('div');
    el.id = 'vlSperre';
    el.className = 'vl-sperre';
    var schlucken = function (e) { if (!e.target || !e.target.closest || !e.target.closest('.vl-wisch')) { e.preventDefault(); e.stopPropagation(); } };
    ['touchstart', 'touchmove', 'touchend', 'click', 'mousedown', 'contextmenu'].forEach(function (art) { el.addEventListener(art, schlucken, { passive: false }); });
    document.body.appendChild(el);
  }
  var d = vlDokument(cl.vl.id);
  var rest = cl.vl.timerBis ? Math.max(0, Math.ceil((cl.vl.timerBis - jetzt()) / 60000)) : 0;
  el.innerHTML = '<div class="vl-lauf">' + (cl.vl.laeuft ? '▶ liest vor …' : '⏸ angehalten') + '<br>' + esc(d ? d.titel : '')
    + (cl.vl.doc ? ' · Seite ' + (cl.vl.doc.seite[cl.vl.i] || 1) : '') + (rest ? '<br>◔ noch ' + rest + ' Min.' : '') + '</div>'
    + '<div class="vl-entsperren">Zum Entsperren wischen<div class="vl-wisch" id="vlWisch"><i id="vlKnauf">»</i></div></div>';
  vlWischAnbinden();
}

function vlWischAnbinden() {
  var bahn = document.getElementById('vlWisch');
  var knauf = document.getElementById('vlKnauf');
  if (!bahn || !knauf || !bahn.addEventListener) { return; }
  var start = null;
  var breite = function () { return Math.max(1, (bahn.clientWidth || 200) - (knauf.clientWidth || 30)); };
  var x = function (e) { var p = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e; return Number(p.clientX) || 0; };
  var an = function (e) { start = x(e); e.preventDefault(); };
  var zieh = function (e) {
    if (start === null) { return; }
    e.preventDefault();
    var dx = Math.max(0, Math.min(breite(), x(e) - start));
    knauf.style.transform = 'translateX(' + dx + 'px)';
    if (dx >= breite() * 0.85) { start = null; vlEntsperren(); }
  };
  var los = function () { start = null; knauf.style.transform = ''; };
  bahn.addEventListener('touchstart', an, { passive: false });
  bahn.addEventListener('touchmove', zieh, { passive: false });
  bahn.addEventListener('touchend', los);
  bahn.addEventListener('mousedown', an);
  bahn.addEventListener('mousemove', zieh);
  bahn.addEventListener('mouseup', los);
}

function vlEntsperren() {
  cl.vl.gesperrt = false;
  vlSperreZeichnen();
  vlZeichnen();
}

/* ---- Zeichnen ---- */

function vlRestText(ab) {
  var doc = cl.vl.doc;
  if (!doc) { return ''; }
  var zeichen = 0;
  var i;
  for (i = ab; i < doc.saetze.length; i++) { zeichen += doc.saetze[i].length + 1; }
  var min = Math.round(zeichen / (VL_ZEICHEN_JE_SEKUNDE * vlEinstellungen().tempo) / 60);
  return min >= 60 ? 'noch ' + Math.floor(min / 60) + ' Std. ' + (min % 60) + ' Min.' : 'noch ' + Math.max(1, min) + ' Min.';
}

function vlKapitelVon(i) {
  var k = ((cl.vl.doc && cl.vl.doc.kapitel) || []).filter(function (x) { return x.i <= i; });
  return k.length ? k[k.length - 1].t : '';
}

function vlListeHtml() {
  var l = vlDokumente();
  var lokal = vlLokal();
  var h = '';
  if (cl.vl.laeuft && vlDokument(cl.vl.id)) {
    h += '<div class="vl-laeuft"><span>▶ ' + esc(vlDokument(cl.vl.id).titel) + '</span><button type="button" class="knopf" onclick="vlAnhalten()">⏸ Anhalten</button></div>';
  }
  if (!l.length) {
    return h + '<p>Noch nichts zum Vorlesen.</p><p class="leise">„+ PDF…“ lädt eine PDF-Datei, „+ Text…“ liest ein Memo oder eingefügten Text vor. In der Drive-App gibt es bei PDFs „🔊“.</p>';
  }
  var zeile = function (d) {
    var pz = d.saetze ? Math.round((d.fertig ? d.saetze : (Number(d.satz) || 0)) * 100 / d.saetze) : 0;
    var da = d.art === 'memo' || lokal[d.id];
    var art = d.art === 'memo' ? 'Memo' : (d.art === 'text' ? 'Text' : 'PDF' + (d.drive ? ' · aus Drive' : ''));
    var info = art + (d.art === 'pdf' && d.seiten > 1 ? ' · Seite ' + (d.seite || 1) + ' von ' + d.seiten : '')
      + (d.zuletzt ? ' · zuletzt ' + (d.geraet ? d.geraet + ', ' : '') + kurzDatum(d.zuletzt.slice(0, 10)) : '');
    return '<button type="button" class="vl-doc" onclick="vlOeffnen(\'' + esc(d.id) + '\')"><span class="vl-t"><span>' + esc(d.titel) + '</span><b>'
      + (d.fertig ? 'fertig' : (pz ? pz + ' %' : 'neu')) + '</b></span><small>' + esc(info) + '</small>'
      + (da ? '' : '<small class="vl-fehlt">⚠ ' + (d.drive ? 'Tippen lädt das PDF aus Drive' : 'PDF auf diesem Gerät noch laden') + '</small>')
      + '<span class="vl-balken"><i style="width:' + Math.min(100, pz) + '%"></i></span></button>';
  };
  var weiter = l.filter(function (d) { return !d.fertig && d.zuletzt; })[0];
  if (weiter) { h += '<div class="abschnitt">Weiterhören</div>' + zeile(weiter); }
  h += '<div class="abschnitt">Alle</div>' + l.filter(function (d) { return d !== weiter; }).map(zeile).join('');
  return h;
}

function vlLesenHtml() {
  var d = vlDokument(cl.vl.id);
  var doc = cl.vl.doc;
  if (!d) { cl.vl.ansicht = 'liste'; return vlListeHtml(); }
  if (!doc) {
    if (d.art === 'memo') { return '<p class="leise">Das Memo gibt es nicht mehr.</p>'; }
    if (!vlLokal()[d.id]) {
      return '<div class="lk-titel">' + esc(d.titel) + '</div><div class="lk-hinweis">Der Text ist auf diesem Gerät noch nicht da. Deine Lesestelle (Seite '
        + (d.seite || 1) + ') ist schon da — lade das PDF einmal' + (d.drive ? ' aus Drive' : '') + ', dann geht es dort weiter.'
        + '<div class="knoepfe">' + (d.drive ? '<button type="button" class="knopf voll" onclick="vlAusDrive(\'' + esc(d.drive) + '\', \'' + esc(d.titel) + '\')">Aus Drive laden</button>'
          : '<button type="button" class="knopf voll" onclick="vlDateiWaehlen()">PDF laden …</button>') + '</div></div>';
    }
    return '<p class="leise">Lade den Text …</p>';
  }
  var seite = doc.seite[cl.vl.i];
  var h = '<div class="vl-kopf leise">' + esc(d.titel) + (vlKapitelVon(cl.vl.i) ? ' · ' + esc(vlKapitelVon(cl.vl.i)) : '') + '</div><div class="vl-text" id="vlText">';
  var absatz = -1;
  var i;
  for (i = 0; i < doc.saetze.length; i++) {
    if (doc.seite[i] !== seite) { if (doc.seite[i] > seite) { break; } continue; }
    if (doc.absatz[i] !== absatz) {
      var mk = vlMarkeBei(i, doc);
      h += (absatz >= 0 ? '</p>' : '') + '<p' + (mk ? ' class="vl-mark"' : '') + '>'
        + (mk ? '<button type="button" class="vl-markknopf" onclick="vlMarkeOeffnen(\'' + esc(mk.id) + '\')" aria-label="Lesezeichen">🔖</button>' : '');
      absatz = doc.absatz[i];
    }
    h += '<span id="vls' + i + '" class="vl-s' + (i < cl.vl.i ? ' gelesen' : (i === cl.vl.i ? ' akt' : '')) + '" onclick="vlSatzTipp(' + i + ')">' + esc(doc.saetze[i]) + ' </span>';
  }
  h += (absatz >= 0 ? '</p>' : '') + '</div>';
  var e = vlEinstellungen();
  var stimme = vlStimme();
  var rest = cl.vl.timerBis ? Math.max(0, Math.ceil((cl.vl.timerBis - jetzt()) / 60000)) : 0;
  var timer = cl.vl.laeuft ? (rest ? rest + ' Min.' : (cl.vl.timerKapitel >= 0 ? 'Kapitel' : 'aus')) : (VL_TIMER.filter(function (t) { return t[0] === e.timer; })[0] || [0, 'aus'])[1] + (e.timer > 0 ? ' Min.' : '');
  return h + '<div class="vl-status"><span id="vlStand">Satz ' + (cl.vl.i + 1) + ' von ' + doc.saetze.length + '</span><span id="vlRest">' + vlRestText(cl.vl.i) + '</span></div>'
    + '<div class="vl-steuer"><button type="button" onclick="vlSchritt(\'absatz-\')" aria-label="Absatz zurück">⏮</button>'
    + '<button type="button" onclick="vlSchritt(\'satz-\')" aria-label="Satz zurück">◀</button>'
    + '<button type="button" class="gross" onclick="vlUm()" aria-label="' + (cl.vl.laeuft ? 'Anhalten' : 'Vorlesen') + '">' + (cl.vl.laeuft ? '⏸' : '▶') + '</button>'
    + '<button type="button" onclick="vlSchritt(\'satz+\')" aria-label="Satz vor">▶</button>'
    + '<button type="button" onclick="vlSchritt(\'absatz+\')" aria-label="Absatz vor">⏭</button></div>'
    + '<div class="vl-chips"><button type="button" class="knopf" onclick="vlFensterAuf(\'stimme\')">' + String(e.tempo).replace('.', ',') + '×</button>'
    + '<button type="button" class="knopf" onclick="vlFensterAuf(\'stimme\')">' + esc(stimme ? stimme.name.replace(/\s*\(.*\)$/, '').slice(0, 14) : 'Stimme') + '</button>'
    + '<button type="button" class="knopf" onclick="vlFensterAuf(\'stimme\')">◔ ' + esc(timer) + '</button>'
    + '<button type="button" class="knopf" onpointerdown="vlMerkenDruck()" onclick="vlMerkenTipp()">🔖 Merken</button>'
    + '<button type="button" class="knopf" onclick="vlSperren()">🔒 Sperren</button></div>';
}

/* Nur die Markierung nachziehen; auf einer neuen Seite alles neu zeichnen */
function vlAktuellZeigen() {
  if (cl.app !== 'vorlesen' || cl.vl.ansicht !== 'lesen') { if (cl.vl.gesperrt) { vlSperreZeichnen(); } return; }
  var el = document.getElementById('vls' + cl.vl.i);
  if (!el || !el.classList) { vlZeichnen(); el = document.getElementById('vls' + cl.vl.i); }
  else {
    var alt = document.querySelectorAll ? document.querySelectorAll('#vlText .vl-s') : [];
    var k;
    for (k = 0; k < alt.length; k++) {
      var n = Number(String(alt[k].id).slice(3));
      alt[k].className = 'vl-s' + (n < cl.vl.i ? ' gelesen' : (n === cl.vl.i ? ' akt' : ''));
    }
    var st = document.getElementById('vlStand');
    if (st) { st.textContent = 'Satz ' + (cl.vl.i + 1) + ' von ' + cl.vl.doc.saetze.length; }
    var re = document.getElementById('vlRest');
    if (re) { re.textContent = vlRestText(cl.vl.i); }
    kopfZeichnen();
  }
  vlTextRollen(el);
  if (cl.vl.gesperrt) { vlSperreZeichnen(); }
}

/* Der Text rollt in seinem eigenen Kasten — die Knöpfe darunter bleiben sichtbar */
function vlTextRollen(el) {
  var kasten = document.getElementById('vlText');
  if (!el || !kasten || typeof el.offsetTop !== 'number') { return; }
  /* Lage über die Bildschirm-Rechtecke — unabhängig davon, worauf sich offsetTop bezieht (seit 0.27) */
  var re = el.getBoundingClientRect ? el.getBoundingClientRect() : null;
  var rk = kasten.getBoundingClientRect ? kasten.getBoundingClientRect() : null;
  if (!re || !rk) { return; }
  var ziel = kasten.scrollTop + (re.top - rk.top) - Math.max(0, (kasten.clientHeight - re.height) / 2);
  if (typeof kasten.scrollTo === 'function') { kasten.scrollTo({ top: Math.max(0, ziel), behavior: 'smooth' }); } else { kasten.scrollTop = Math.max(0, ziel); }
}

function vlFensterAuf(f) {
  cl.vl.fenster = f;
  vlZeichnen();
}

function vlFensterZu() {

}

      }).join('') : '<p class="leise">Keine deutsche Stimme gefunden — die Liste kommt manchmal erst nach einem Moment.</p>')
      + '<label for="vlTempo">Tempo: <span id="vlTempoWert">' + String(e.tempo).replace('.', ',') + '×</span></label>'
      + '<input id="vlTempo" class="vl-regler" type="range" min="0.7" max="2" step="0.1" value="' + e.tempo + '" oninput="vlReglerGeaendert()">'
      + '<label for="vlHoehe">Tonhöhe</label><input id="vlHoehe" class="vl-regler" type="range" min="0.5" max="1.5" step="0.1" value="' + e.hoehe + '" oninput="vlReglerGeaendert()">'

  if (f === 'kapitel' && cl.vl.doc) {

    }).join('') : '<p class="leise">Dieses PDF bringt kein Inhaltsverzeichnis mit — „Seite…“ geht immer.</p>')
      + '<div class="knoepfe"><button type="button" class="knopf" onclick="vlFensterZu()">Schließen</button></div>' + zu;
  }
  if (f === 'marke' && cl.vl.marke) {
    var m = cl.vl.marke;

    var vorschau = cl.vl.doc ? cl.vl.doc.saetze.slice(ber.von, ber.bis + 1).join(' ') : '';
    return kopf(m.id ? 'Lesezeichen' : 'Neues Lesezeichen') + '<label>Was soll gemerkt werden?</label><div class="wahlreihe">'
      + [['satz', 'dieser Satz'], ['absatz', 'Absatz'], ['davor', '+ die 2 davor']].map(function (u) {

      + '<p class="leise">„' + esc(vorschau.slice(0, 160)) + (vorschau.length > 160 ? ' …' : '') + '“ · S. ' + ((cl.vl.doc && cl.vl.doc.seite[ber.von]) || 1) + '</p>'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="vlMarkeSpeichern()">Merken</button><button type="button" class="knopf" onclick="vlFensterZu()">Abbrechen</button>'
      + (m.id ? '<button type="button" class="knopf" onclick="vlMarkeLoeschen()">Löschen</button>' : '') + '</div>' + zu;
  }
  if (f === 'details') {
    var d = vlDokument(cl.vl.id);
    if (!d) { return ''; }
    return kopf('Dokument') + '<label for="vlName">Titel:</label><input id="vlName" class="eingabe" type="text" autocomplete="off" value="' + esc(d.titel) + '">'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="vlUmbenennen()">OK</button><button type="button" class="knopf" onclick="vlFensterZu()">Abbrechen</button></div>'
      + '<div class="knoepfe"><button type="button" class="knopf" onclick="vlVonVorn()">Von vorn</button><button type="button" class="knopf" onclick="vlFensterAuf(\'entfernen\')">Entfernen…</button></div>' + zu;
