    h += '<button type="button" onclick="listeBearbeiten()">„' + esc(liste.titel) + '“ bearbeiten …</button>'
       + '<button type="button" onclick="listeAlsText()">„' + esc(liste.titel) + '“ als Text bearbeiten …</button>';
  }
  return h + '<div class="trenn"></div><button type="button" onclick="aufErlUm()">' + (cl.auf.erlZeigen ? '■' : '▢') + ' Erledigte zeigen</button></div>';
}

function aufFilter(f) {
  if (f !== 'alle' && f !== 'beruflich' && f !== 'privat') { return; }
  cl.filter = f;
  try { window.localStorage.setItem(CL_FILTER_KEY, f); } catch (e) { /* nur für jetzt */ }
  zeichne();
}

/* Vollständige Auswahl. „filter“: nur Seiten mit offenen Aufgaben,
   „aufgabe“ (für Neu/Details): alle laufenden, auch ohne. */
function listenwahlOeffnen(wofuer) {
  if (wofuer === 'aufgabe') { aufFensterLesen(); }
  cl.auf.wahlFuer = (wofuer === 'aufgabe') ? 'aufgabe' : 'filter';
  cl.aufklapp = 'listenwahl';
  aufklappNeu();
}

function listenwahlHtml() {
  var fuerAufgabe = cl.auf.wahlFuer === 'aufgabe';
  var seiten = aufWaehlbar(fuerAufgabe);
  var ids = seiten.map(function (s) { return s.id; });
  var zuletzt = zuletztListe().filter(function (id) { return ids.indexOf(id) >= 0; }).slice(0, ZULETZT_ZAHL);
  var zeile = function (s) {
    var leer = kpOffeneZahl(s) === 0;
    return '<button type="button" class="wahl' + (leer ? ' leise' : '') + '" onclick="listeGewaehlt(\'' + esc(s.id) + '\')">'
      + clSeitenZeichen(s) + ' ' + esc(s.titel) + (leer ? ' (keine offenen)' : '') + '</button>';
  };
  var h = '<div class="fenster"><div class="titel">Liste wählen · ' + esc(katName(cl.filter)) + '</div><div class="rumpf">';
  if (zuletzt.length) { h += '<div class="gruppe">Zuletzt benutzt</div>' + zuletzt.map(function (id) { return zeile(kpSeiteFinden(id)); }).join(''); }
  var projekte = seiten.filter(function (s) { return s.art === 'vorhaben'; });
  var listen = seiten.filter(function (s) { return s.art === 'liste'; });
  if (projekte.length) { h += '<div class="gruppe">Projekte</div>' + projekte.map(zeile).join(''); }
  if (listen.length) { h += '<div class="gruppe">Listen</div>' + listen.map(zeile).join(''); }
  if (!seiten.length) { h += '<p class="leise">Keine passenden Listen.</p>'; }
  return h + '<div class="knoepfe"><button type="button" class="knopf" onclick="neueListeOeffnen()">Neue Liste …</button>'
    + '<button type="button" class="knopf" onclick="listenwahlZurueck()">Abbrechen</button></div></div></div>';
}

function listeGewaehlt(id) {
  if (cl.auf.wahlFuer === 'aufgabe' && cl.auf.fenster) {
    cl.auf.fenster.seite = id;
    cl.aufklapp = 'aufgabe';
    aufklappNeu();
    return;
  }
  aufListeSetzen(id);
}

function listenwahlZurueck() {
  if (cl.auf.wahlFuer === 'aufgabe' && cl.auf.fenster) { cl.aufklapp = 'aufgabe'; aufklappNeu(); return; }
  aufklappZu();
}

/* ---- Neue Liste / Liste bearbeiten (seit 0.6 — Listen stehen nicht mehr im Memo) ---- */

function neueListeOeffnen() {
  cl.auf.neueListe = { id: '', titel: '', kontext: (cl.filter === 'beruflich') ? 'beruflich' : 'privat' };
  cl.aufklapp = 'liste-neu';
  aufklappNeu();
}

function listeBearbeiten() {
  var s = aufListe();
  if (!s || s.art !== 'liste') { return; }
  cl.auf.wahlFuer = 'filter';
  cl.auf.neueListe = { id: s.id, titel: s.titel, kontext: s.kontext === 'beruflich' ? 'beruflich' : 'privat' };
  cl.aufklapp = 'liste-neu';
  aufklappNeu();
}

/* Seit 0.15.0: die ganze Listenseite als Text — Aufgaben und freie Zeilen
   (z. B. eigene Schritte unter einer Aufgabe). Geschrieben wird im
   Schreibfeld des Memo; „Fertig“ und Zurück führen wieder zur Liste. */
function listeAlsText() {
  var s = aufListe();
  if (!s || s.art !== 'liste') { return; }
  cl.aufklapp = '';
  cl.app = 'memo';
  cl.memo.id = s.id;
  cl.memo.hervor = '';
  cl.memo.ausListe = s.id;
  cl.memo.schreiben = true;
  zeichne();
  var f = document.getElementById('memoFeld');
  if (f && f.focus) { f.focus(); }
}

function listeTextFertig() {
  var id = cl.memo.ausListe;
  cl.memo.id = '';
  cl.memo.schreiben = false;
  cl.memo.hervor = '';
  cl.memo.ausListe = '';
  cl.app = 'aufgaben';
  aufListeSetzen(id);
}

function neueListeKontext(k) {
  var n = cl.auf.neueListe;
  var t = document.getElementById('listeTitel');
  if (!n || (k !== 'beruflich' && k !== 'privat')) { return; }
  if (t && typeof t.value === 'string') { n.titel = t.value; }
  n.kontext = k;
  aufklappNeu();
}

function neueListeHtml() {
  var n = cl.auf.neueListe;
  if (!n) { return ''; }
  return '<div class="fenster"><div class="titel">' + (n.id ? 'Liste bearbeiten' : 'Neue Liste') + '</div><div class="rumpf">'
    + '<label for="listeTitel">Name:</label><input id="listeTitel" class="eingabe" type="text" autocomplete="off" value="' + esc(n.titel) + '">'
    + '<label>Kategorie:</label><div class="wahlreihe">' + [['beruflich', 'Beruf'], ['privat', 'Privat']].map(function (k) {
        return '<button type="button"' + (n.kontext === k[0] ? ' class="an"' : '') + ' onclick="neueListeKontext(\'' + k[0] + '\')">' + k[1] + '</button>';
      }).join('') + '</div>'
    + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="neueListeSpeichern()">OK</button>'
    + '<button type="button" class="knopf" onclick="listenwahlZurueck()">Abbrechen</button></div></div></div>';
}

function neueListeSpeichern() {
  var n = cl.auf.neueListe;
  var t = document.getElementById('listeTitel');
  if (!n) { return; }
  if (t && typeof t.value === 'string') { n.titel = t.value; }
  var titel = String(n.titel || '').trim();
  if (!titel) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  var s;
  if (n.id) {
    s = kpSeiteFinden(n.id);
    if (!s) { aufklappZu(); return; }
    s.titel = titel.slice(0, 200);
    s.kontext = n.kontext;
    s.geaendert = jetzt();
  } else {
    s = kpSeiteAnlegen('liste', titel, n.kontext, '');
    if (!s) { melde('Die Liste ließ sich nicht anlegen.', 'warn'); return; }
  }
  cl.auf.neueListe = null;
  zuletztMerken(s.id);
  spaeterSichern();
  /* Neu aus dem Aufgaben-Fenster: dort gleich gewählt */
  if (!n.id && cl.auf.wahlFuer === 'aufgabe' && cl.auf.fenster) {
    cl.auf.fenster.seite = s.id;
    cl.aufklapp = 'aufgabe';
    aufklappNeu();
    return;
  }
  aufListeSetzen(s.id);
}

/* ---------- Memo (seit 0.3) ----------

   Alle Seiten der Workbench als Memos: Projekte, Ziele, Listen und
   Notizen. Lesen, abhaken, schreiben, Details. Gerade laufende Seiten;
   Ruhendes und Erledigtes bleibt der Workbench. */

/* Seit 0.6 ohne Listen — die sind Kategorien der Aufgaben. */
/* Seit 0.12.2 auch ruhende und abgeschlossene Projekte und Ziele —
   die Liste gruppiert sie (Ruhend, Abgeschlossen eingeklappt). */
function memoSeiten() {
  return kpNachRang(kpSeitenAlle().filter(function (s) {
    if (s.art === 'liste') { return false; }
    if (s.art === 'notiz' && s.__satz && s.__satz.checkliste) { return false; }
    return kpPasstFilter(s, cl.filter);
  }));
}

function memoListeHtml() {
  var seiten = memoSeiten();
  var gruppe = function (titel, l) {
    if (!l.length) { return ''; }
    return '<div class="gruppe">' + titel + '</div>' + l.map(function (s) {
      var n = kpOffeneZahl(s);
      return '<button type="button" class="memo-zeile" onclick="memoOeffnen(\'' + esc(s.id) + '\')"><span class="mz">' + clSeitenZeichen(s) + '</span>'
        + '<span class="tx">' + esc(s.titel) + '</span><span class="q">' + (n ? n : '') + '</span></button>';
    }).join('');
  };
  var laeuft = function (s) { return s.art === 'vorhaben' && s.zustand === 'laeuft'; };
  var fertig = seiten.filter(function (s) { return s.art === 'vorhaben' && s.zustand === 'erledigt'; });
  var h = gruppe('Projekte', seiten.filter(function (s) { return laeuft(s) && s.typ !== 'ziel'; }))
        + gruppe('Ziele', seiten.filter(function (s) { return laeuft(s) && s.typ === 'ziel'; }))
        + gruppe('Ruhend', seiten.filter(function (s) { return s.art === 'vorhaben' && s.zustand === 'ruht'; }))
        + gruppe('Notizen', seiten.filter(function (s) { return s.art === 'notiz'; }));
  /* Abgeschlossenes eingeklappt ganz unten */
  if (fertig.length) {
    h += '<button type="button" class="gruppe klapp" onclick="memoFertigUm()">' + (cl.memo.fertigAuf ? '▾' : '›') + ' Abgeschlossen · ' + fertig.length + '</button>';
    if (cl.memo.fertigAuf) { h += gruppe('', fertig).replace('<div class="gruppe"></div>', ''); }
  }
  return h || '<p class="leise">Noch keine Seiten.</p>';
}

/* Eine Seite lesen: Überschriften, Text, Aufgaben zum Abhaken */
function memoSeiteHtml(s) {
  var h = '';
  if (s.art === 'vorhaben') {
    var zt = s.termin ? (s.typ === 'ziel' ? 'Zieltermin ' : 'Ende ') + clKurzDatum(s.termin) + s.termin.slice(0, 4) : '';
    h += '<div class="memo-kopf leise">' + (s.typ === 'ziel' ? 'Ziel' : 'Projekt') + (zt ? ' · ' + esc(zt) : '') + '</div>';
  }
  if (cl.memo.schreiben) {
    return h + '<div class="schreibleiste">'
      + '<button type="button" onmousedown="event.preventDefault()" onclick="memoZeichen(\'kasten\')" aria-label="Aufgabe">[ ]</button>'
      + '<button type="button" onmousedown="event.preventDefault()" onclick="memoZeichen(\'h\')" aria-label="Überschrift">H</button>'
      + '<button type="button" onmousedown="event.preventDefault()" onclick="memoZeichen(\'punkt\')" aria-label="Aufzählung">•</button></div>'
      + '<textarea id="memoFeld" class="memo-feld" spellcheck="true" oninput="memoTextGetippt()">' + esc(s.text) + '</textarea>';
  }
  var zeilen = String(s.text || '').split('\n');
  if (!zeilen.join('').trim()) { return h + '<p class="leise">Noch leer — „Schreiben“ tippen.</p>'; }
  var tabelle = [];
  var tabelleAus = function () {
    if (!tabelle.length) { return; }
    h += memoTabelleHtml(tabelle);
    tabelle = [];
  };
  zeilen.forEach(function (z, nr) {
    /* Tabellen: aufeinanderfolgende Zeilen mit | */
    if (/^\s*\|.*\|\s*$/.test(z)) { tabelle.push(z); return; }
    tabelleAus();
    var a = kpAufgabe(z);
    var hervor = (cl.memo.hervor && a && a.text === cl.memo.hervor) ? ' hervor' : '';
    if (a) {
      h += '<div class="aufg' + (a.erledigt ? ' erl' : '') + hervor + '" id="memoZ' + nr + '">'
         + clKastenHtml(a.erledigt, 'memoHaken(\'' + esc(s.id) + '\',' + nr + ')')
         + '<button type="button" class="tx umbruch" onclick="aufDetails(\'' + esc(s.id) + '\',' + nr + ')">' + (clPrioHtml(a.text) || ' ') + '</button>'
         + clPlanMarke(s, a) + '</div>';
      return;
    }
    var m = z.match(/^\s*(#{1,3})\s+(.*)$/);
    if (m) { h += '<div class="memo-h' + m[1].length + '">' + kpAuszeichnen(m[2]) + '</div>'; return; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(z)) { h += '<div class="memo-trenn"></div>'; return; }
    var p = z.match(/^(\s*)[-•*]\s+(.*)$/);
    if (p) { h += '<div class="memo-punkt" style="padding-left:' + Math.min(4, Math.floor(p[1].length / 2)) * 16 + 'px">▪ ' + kpAuszeichnen(p[2]) + '</div>'; return; }
    var n = z.match(/^(\s*)(\d{1,3})[.)]\s+(.*)$/);
    if (n) { h += '<div class="memo-punkt" style="padding-left:' + Math.min(4, Math.floor(n[1].length / 2)) * 16 + 'px"><span class="nr">' + n[2] + '.</span> ' + kpAuszeichnen(n[3]) + '</div>'; return; }
    h += z.trim() ? '<div class="memo-text">' + kpAuszeichnen(z) + '</div>' : '<div class="memo-leer"></div>';
  });
  tabelleAus();
  return h;
}

/* Eine Tabelle aus |-Zeilen; die Trennzeile |---|---| fällt weg */
function memoTabelleHtml(zeilen) {
  var trenn = function (z) { return /^\s*\|?[\s:|-]+\|?\s*$/.test(z) && /-{2,}/.test(z); };
  var zellen = function (z) { return z.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); }); };
  var kopf = (zeilen.length > 1 && trenn(zeilen[1])) ? zellen(zeilen[0]) : null;
  var reihen = zeilen.slice(kopf ? 2 : 0).filter(function (z) { return !trenn(z); }).map(zellen);
  return '<div class="memo-tabelle"><table>'
    + (kopf ? '<tr>' + kopf.map(function (c) { return '<th>' + kpAuszeichnen(c) + '</th>'; }).join('') + '</tr>' : '')
    + reihen.map(function (row) { return '<tr>' + row.map(function (c) { return '<td>' + kpAuszeichnen(c) + '</td>'; }).join('') + '</tr>'; }).join('')
    + '</table></div>';
}

/* Verweise [[projekt:…|Titel]] im Text: ein Tipp öffnet die Seite.
   (Der Kern ruft diesen Namen; titel kommt schon maskiert.) */
function kpVerweisHtml(art, id, titel) {
  var kennung = String(id).replace(/^g:/, '');
  var s = kpSeiteFinden(kennung);
  if (!s) { return '<span class="verweis tot">' + titel + '</span>'; }
  return '<button type="button" class="verweis" onclick="memoVerweis(\'' + esc(s.id) + '\')">' + titel + '</button>';
}

function memoVerweis(id) {
  var s = kpSeiteFinden(id);
  if (!s) { return; }
  /* Listen stehen in den Aufgaben, alles andere im Memo */
  if (s.art === 'liste') { cl.app = 'aufgaben'; aufListeSetzen(s.id); return; }
  cl.app = 'memo';
  memoOeffnen(s.id);
}

/* Für wann die Aufgabe eingeplant ist: „heute“, Uhrzeit oder Tag */
function clPlanMarke(s, a) {
  if (a.erledigt || !a.text) { return ''; }
  var g = aufGeplant(s, a.text);
  return g ? '<span class="plan-marke">' + esc(clPlanText(g.datum, g.zeit)) + '</span>' : '';
}

function memoFertigUm() {
  cl.memo.fertigAuf = !cl.memo.fertigAuf;
  inhaltZeichnen();
}

function memoHtml() {
  var s = cl.memo.id ? kpSeiteFinden(cl.memo.id) : null;
  return s ? memoSeiteHtml(s) : memoListeHtml();
}

function memoFussHtml() {
  var s = cl.memo.id ? kpSeiteFinden(cl.memo.id) : null;
  if (!s) { return '<button type="button" class="knopf" onclick="memoNeu()">Neu</button>'; }
  if (cl.memo.schreiben) { return '<button type="button" class="knopf voll" onclick="memoSchreibenUm()">Fertig</button>'; }
  return '<button type="button" class="knopf" onclick="memoZurListe()">Fertig</button>'
    + '<button type="button" class="knopf" onclick="memoSchreibenUm()">Schreiben</button>'
    + '<button type="button" class="knopf" onclick="memoDetails()">Details…</button>';
}

function memoOeffnen(id) {
  cl.memo.id = id;
  cl.memo.schreiben = false;
  cl.memo.hervor = '';
  var el = document.getElementById('inhalt');
  if (el) { el.scrollTop = 0; }
  zeichne();
}

function memoZurListe() {
  if (cl.memo.ausListe) { listeTextFertig(); return; }
  cl.memo.id = '';
  cl.memo.schreiben = false;
  cl.memo.hervor = '';
  zeichne();
}

/* Aus den Aufgaben: die Seite öffnen, die Zeile hervorheben */
function memoZeile(seiteId, nr) {
  var s = kpSeiteFinden(seiteId);
  if (!s) { return; }
  var a = kpAufgabe(String(s.text || '').split('\n')[nr] || '');
  aufklappZu();
  /* Listen stehen seit 0.6 nicht im Memo: dann die Liste in den Aufgaben */
  if (s.art === 'liste') { cl.app = 'aufgaben'; aufListeSetzen(s.id); return; }
  cl.app = 'memo';
  cl.memo.id = s.id;
  cl.memo.schreiben = false;
  cl.memo.hervor = a ? a.text : '';
  zeichne();
  var z = document.getElementById('memoZ' + nr);
  if (z && z.scrollIntoView) { z.scrollIntoView({ block: 'center' }); }
}

function memoHaken(id, nr) {
  var s = kpSeiteFinden(id);
  if (!s || !kpSeiteKastenUmKern(s, nr)) { return; }
  spaeterSichern();
  zeichne();
}

function memoSchreibenUm() {
  /* Aus den Aufgaben als Text geöffnet: „Fertig“ führt zurück zur Liste */
  if (cl.memo.schreiben && cl.memo.ausListe) { listeTextFertig(); return; }
  cl.memo.schreiben = !cl.memo.schreiben;
  zeichne();
  if (cl.memo.schreiben) {
    var f = document.getElementById('memoFeld');
    if (f && f.focus) { f.focus(); }
  }
}

function memoTextGetippt() {
  var s = cl.memo.id ? kpSeiteFinden(cl.memo.id) : null;
  var f = document.getElementById('memoFeld');
  if (!s || !f) { return; }
  s.text = String(f.value);
  s.geaendert = jetzt();
  spaeterSichern();
}

/* Kleine Leiste: Zeile zur Aufgabe, Überschrift oder Aufzählung machen */
function memoZeichen(was) {
  var f = document.getElementById('memoFeld');
  if (!f) { return; }
  var v = String(f.value);
  var pos = f.selectionStart || 0;
  var anfang = v.lastIndexOf('\n', pos - 1) + 1;
  var zeile = v.slice(anfang).split('\n')[0];
  var ohne = zeile.replace(/^\s*(\[[ xX-]?\]|#{1,3}|[-•*])\s*/, '');
  var vorne = (was === 'kasten') ? '[] ' : ((was === 'h') ? '## ' : '- ');
  var neu = (zeile.indexOf(vorne.trim()) === 0) ? ohne : vorne + ohne;
  f.value = v.slice(0, anfang) + neu + v.slice(anfang + zeile.length);
  var ende = anfang + neu.length;
  if (f.setSelectionRange) { f.setSelectionRange(ende, ende); }
  if (cl.app === 'checklisten') { clsTextGetippt(); } else { memoTextGetippt(); }
}

/* ---- Memo: Details und Neu ---- */

function memoDetails() {
  var s = cl.memo.id ? kpSeiteFinden(cl.memo.id) : null;
  if (!s) { return; }
  cl.memo.fenster = { modus: 'details', titel: s.titel, kontext: s.kontext || 'beruflich', zustand: s.zustand || '', termin: s.termin || '' };
  cl.aufklapp = 'memo';
  aufklappNeu();
}

function memoNeu() {
  cl.memo.fenster = { modus: 'neu', art: 'notiz', titel: '', kontext: (cl.filter === 'alle' ? 'privat' : cl.filter) };
  cl.aufklapp = 'memo';
  aufklappNeu();
}

function memoFensterLesen() {
  var f = cl.memo.fenster;
  if (!f) { return null; }
  var t = document.getElementById('memoTitel');
  var d = document.getElementById('memoTermin');
  if (t && typeof t.value === 'string') { f.titel = t.value; }
  if (d && typeof d.value === 'string') { f.termin = d.value; }
  return f;
}

function memoWahl(feld, wert) {
  var f = memoFensterLesen();
  if (!f || ['art', 'kontext', 'zustand'].indexOf(feld) < 0) { return; }
  f[feld] = wert;
  aufklappNeu();
}

function memoWahlReihe(feld, werte, an) {
  return '<div class="wahlreihe">' + werte.map(function (w) {
    return '<button type="button"' + (w[0] === an ? ' class="an"' : '') + ' onclick="memoWahl(\'' + feld + '\',\'' + w[0] + '\')">' + w[1] + '</button>';
  }).join('') + '</div>';
}

function memoFensterHtml() {
  var f = cl.memo.fenster;
  if (!f) { return ''; }
  var s = (f.modus === 'details' && cl.memo.id) ? kpSeiteFinden(cl.memo.id) : null;
  var h = '<div class="fenster"><div class="titel">' + (f.modus === 'neu' ? 'Neues Memo' : 'Details') + '</div><div class="rumpf">';
  if (f.modus === 'neu') {
    h += '<label>Art:</label>' + memoWahlReihe('art', [['notiz', '✎ Notiz'], ['projekt', '◎ Projekt'], ['ziel', '◇ Ziel']], f.art);
  }
  h += '<label for="memoTitel">Name:</label><input id="memoTitel" class="eingabe" type="text" autocomplete="off" value="' + esc(f.titel) + '">'
     + '<label>Kategorie:</label>' + memoWahlReihe('kontext', [['beruflich', 'Beruf'], ['privat', 'Privat']], f.kontext);
  if (s && s.art === 'vorhaben') {
    h += '<label>Zustand:</label>' + memoWahlReihe('zustand', KP_ZUSTAENDE, f.zustand)
       + '<label for="memoTermin">' + (s.typ === 'ziel' ? 'Zieltermin:' : 'Ende:') + '</label>'
       + '<input id="memoTermin" class="eingabe" type="date" value="' + esc(f.termin) + '">';
  }
  return h + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="memoSpeichern()">OK</button>'
    + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button></div></div></div>';
}

function memoSpeichern() {
  var f = memoFensterLesen();
  if (!f) { return; }
  var titel = String(f.titel || '').trim();
  if (!titel) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  if (f.modus === 'neu') {
    var art = (f.art === 'projekt' || f.art === 'ziel') ? 'vorhaben' : f.art;
    var s = kpSeiteAnlegen(art, titel, f.kontext, f.art === 'ziel' ? 'ziel' : '');
    if (!s) { melde('Das Memo ließ sich nicht anlegen.', 'warn'); return; }
    spaeterSichern();
    aufklappZu();
    cl.memo.id = s.id;
    cl.memo.schreiben = true;
    zeichne();
    return;
  }
  var seite = cl.memo.id ? kpSeiteFinden(cl.memo.id) : null;
  if (!seite) { aufklappZu(); return; }
  seite.titel = titel.slice(0, 200);
  if (f.kontext === 'beruflich' || f.kontext === 'privat') { seite.kontext = f.kontext; }
  if (seite.art === 'vorhaben') {
    if (['laeuft', 'ruht', 'erledigt'].indexOf(f.zustand) >= 0) { seite.zustand = f.zustand; }
    seite.termin = /^\d{4}-\d{2}-\d{2}$/.test(String(f.termin || '')) ? f.termin : '';
  }
  seite.geaendert = jetzt();
  spaeterSichern();
  aufklappZu();
  /* Ruht oder erledigt: gehört nicht mehr in die Liste der laufenden */
  if (seite.art === 'vorhaben' && seite.zustand !== 'laeuft') { memoZurListe(); }
}

/* ---------- Checklisten (seit 0.4) ----------

   Vorlagen zum Wiederverwenden und laufende Checklisten, die aus einer
   Vorlage gestartet werden (oder einmalig sind). Gespeichert als Notizen
   der workbench.json mit dem Kennzeichen „checkliste“:
     'vorlage'  — eine Vorlage; benutzt = wie oft gestartet
     'lauf'     — eine laufende Checkliste; vorlage = Kennung, gestartet = Datum
     'fertig'   — abgeschlossen; abgeschlossen = Datum
   Der Text folgt derselben Schreibweise wie überall: [] Punkt, ## Überschrift.
   So gehen Checklisten ohne Umbau der Workbench durch den Abgleich. */

cl.cls = { id: '', schreiben: false, fertigAuf: false, fenster: null };

function clsAlle(art) {
  return kpNachRang((DB.gedanken || []).filter(function (g) {
    return g && g.checkliste === art && kpPasstFilter(g, cl.filter);
  }));
}

function clsFinden(id) {
  var l = DB.gedanken || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i] && l[i].id === id && l[i].checkliste) { return l[i]; } }
  return null;
}

/* Fortschritt: erledigte (auch [-]) von allen Punkten */
function clsStand(g) {
  var n = 0, f = 0;
  String((g && g.text) || '').split('\n').forEach(function (z) {
    var a = kpAufgabe(z);
    if (a && a.text) { n++; if (a.erledigt) { f++; } }
  });
  return { alle: n, fertig: f };
}

/* Alle Kästchen leer — für Starten, Zurücksetzen, Vorlage aus Lauf */
function clsLeeren(text) {
  return String(text || '').split('\n').map(function (z) {
    return z.replace(/^(\s*)\[[ xX-]?\]/, '$1[]');
  }).join('\n');
}

function clsNeuerSatz(art, titel, text, kontext) {
  if (!Array.isArray(DB.gedanken)) { DB.gedanken = []; }
  var g = { id: neueKennung(), titel: String(titel || '').slice(0, 200), text: String(text || ''),
            kontext: (kontext === 'beruflich' || kontext === 'privat') ? kontext : (cl.filter === 'alle' ? 'privat' : cl.filter),
            ordnung: kpNaechsterRang(), checkliste: art, geaendert: jetzt() };
  if (art === 'vorlage') { g.benutzt = 0; }
  if (art === 'lauf') { g.gestartet = isoDatum(); }
  DB.gedanken.push(g);
  return g;
}

function clsBalkenHtml(st) {
  var p = st.alle ? Math.round(st.fertig * 100 / st.alle) : 0;
  return '<span class="balken"><i style="width:' + p + '%"></i></span><span class="cls-zahl">' + st.fertig + '/' + st.alle + '</span>';
}

function checklistenListeHtml() {
  var laufend = clsAlle('lauf');
  var vorlagen = clsAlle('vorlage');
  var fertig = clsAlle('fertig');
  var h = '<div class="gruppe">Laufend</div>';
  h += laufend.length ? laufend.map(function (g) {
    return '<button type="button" class="cls-zeile" onclick="clsOeffnen(\'' + esc(g.id) + '\')"><span class="tx">' + esc(g.titel)
      + '<small>seit ' + esc(clKurzDatum(g.gestartet || isoDatum())) + '</small></span>' + clsBalkenHtml(clsStand(g)) + '</button>';
  }).join('') : '<p class="leise">Keine laufende Checkliste.</p>';
  h += '<div class="gruppe">Vorlagen</div>';
  h += vorlagen.length ? vorlagen.map(function (g) {
    var st = clsStand(g);
    return '<div class="cls-zeile"><button type="button" class="tx" onclick="clsOeffnen(\'' + esc(g.id) + '\')">' + esc(g.titel)
      + '<small>' + st.alle + ' Punkte' + (g.benutzt ? ' · ' + g.benutzt + '× benutzt' : '') + '</small></button>'
      + '<button type="button" class="knopf" onclick="clsStarten(\'' + esc(g.id) + '\')">Starten</button></div>';
  }).join('') : '<p class="leise">Noch keine Vorlage — „Neu“ tippen.</p>';
  if (fertig.length) {
    h += '<button type="button" class="gruppe klapp" onclick="clsFertigUm()">' + (cl.cls.fertigAuf ? '▾' : '›') + ' Erledigt · ' + fertig.length + '</button>';
    if (cl.cls.fertigAuf) {
      h += fertig.map(function (g) {
        return '<button type="button" class="cls-zeile erl" onclick="clsOeffnen(\'' + esc(g.id) + '\')"><span class="tx">' + esc(g.titel)
          + '<small>abgeschlossen ' + esc(clKurzDatum(g.abgeschlossen || g.gestartet || isoDatum())) + '</small></span></button>';
      }).join('');
    }
  }
  return h;
}

/* Eine Checkliste oder Vorlage anzeigen */
function checklisteHtml(g) {
  if (cl.cls.schreiben) {
    return '<div class="schreibleiste">'
      + '<button type="button" onmousedown="event.preventDefault()" onclick="memoZeichen(\'kasten\')" aria-label="Punkt">[ ]</button>'
      + '<button type="button" onmousedown="event.preventDefault()" onclick="memoZeichen(\'h\')" aria-label="Überschrift">H</button></div>'
      + '<textarea id="memoFeld" class="memo-feld" spellcheck="true" oninput="clsTextGetippt()">' + esc(g.text) + '</textarea>';
  }
  var vorlage = g.checkliste === 'vorlage';
  var st = clsStand(g);
  var h = '<div class="cls-kopf leise">' + (vorlage ? 'Vorlage · ' + st.alle + ' Punkte'
        : (g.checkliste === 'fertig' ? 'Abgeschlossen ' + clKurzDatum(g.abgeschlossen || '') : 'Gestartet ' + clKurzDatum(g.gestartet || '')))
        + (vorlage ? '' : ' · ' + clsBalkenHtml(st)) + '</div>';
  var zeilen = String(g.text || '').split('\n');
  if (!zeilen.join('').trim()) { return h + '<p class="leise">Noch leer — „Schreiben“ tippen.</p>'; }
  zeilen.forEach(function (z, nr) {
    var a = kpAufgabe(z);
    if (a) {
      if (vorlage) {
        /* Abstand zum Stichtag (seit 0.16) als Marke statt im Text */
        var ab = clsAbstand(a.text);
        h += '<div class="aufg"><span class="k"></span><span class="tx">' + esc(ab ? ab.text : a.text) + '</span>'
           + (ab ? '<span class="plan-marke">' + esc(clsAbstandText(ab)) + '</span>' : '') + '</div>';
        return;
      }
      var lauf = g.checkliste === 'lauf';
      h += '<div class="aufg' + (a.erledigt ? ' erl' : '') + '">' + clKastenHtml(a.erledigt, 'clsHaken(\'' + esc(g.id) + '\',' + nr + ')')
         + (lauf ? '<button type="button" class="tx umbruch" onclick="clsPlanOeffnen(\'' + esc(g.id) + '\',' + nr + ')">' + esc(a.text) + '</button>'
                 : '<span class="tx">' + esc(a.text) + '</span>')
         + (lauf ? clPlanMarke(kpSeiteFinden(g.id), a) : '') + '</div>';
      return;
    }
    var m = z.match(/^\s*(#{1,3})\s+(.*)$/);
    if (m) { h += '<div class="memo-h2">' + esc(m[2]) + '</div>'; return; }
    h += z.trim() ? '<div class="memo-text">' + esc(z) + '</div>' : '';
  });
  if (g.checkliste === 'lauf' && st.alle && st.fertig === st.alle) {
    h += '<div class="knoepfe"><span class="leise">Alles erledigt.</span>'
       + '<button type="button" class="knopf voll" onclick="clsAbschliessen()">Abschließen</button></div>';
  }
  return h;
}

function checklistenHtml() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  return g ? checklisteHtml(g) : checklistenListeHtml();
}

function checklistenFussHtml() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g) { return '<button type="button" class="knopf" onclick="clsNeu()">Neu</button>'; }
  if (cl.cls.schreiben) { return '<button type="button" class="knopf voll" onclick="clsSchreibenUm()">Fertig</button>'; }
  return '<button type="button" class="knopf" onclick="clsZurListe()">Fertig</button>'
    + (g.checkliste === 'vorlage' ? '<button type="button" class="knopf voll" onclick="clsStarten(\'' + esc(g.id) + '\')">Starten</button>' : '')
    + '<button type="button" class="knopf" onclick="clsSchreibenUm()">Schreiben</button>'
    + '<button type="button" class="knopf" onclick="clsDetails()">Details…</button>';
}

function clsReiter() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g) { return 'Checklisten'; }
  return (g.checkliste === 'vorlage' ? 'Vorlage: ' : '') + g.titel;
}

/* ---- Bedienen ---- */

function clsOeffnen(id) {
  if (!clsFinden(id)) { return; }
  cl.cls.id = id;
  cl.cls.schreiben = false;
  var el = document.getElementById('inhalt');
  if (el) { el.scrollTop = 0; }
  zeichne();
}

function clsZurListe() {
  cl.cls.id = '';
  cl.cls.schreiben = false;
  zeichne();
}

function clsFertigUm() {
  cl.cls.fertigAuf = !cl.cls.fertigAuf;
  inhaltZeichnen();
}

function clsHaken(id, nr) {
  var g = clsFinden(id);
  if (!g || g.checkliste === 'vorlage') { return; }
  /* Seit 0.16 über den Kern: eingeplante Punkte in Tag und Woche ziehen mit */
  if (!kpSeiteKastenUmKern(kpSeiteFinden(g.id), nr)) { return; }
  spaeterSichern();
  zeichne();
}

function clsStarten(id) {
  var v = clsFinden(id);
  if (!v || v.checkliste !== 'vorlage') { return; }
  /* Mit Abständen (@-1 …): erst nach dem Stichtag fragen */
  if (clsPlanVorschau(v.text, isoDatum()).length) {
    cl.cls.fenster = { modus: 'start', vorlage: v.id, titel: v.titel, stichtag: isoDatum() };
    cl.aufklapp = 'checkliste';
    aufklappNeu();
    return;
  }
  clsStartenMit(v, v.titel, '');
}

/* Startet eine Vorlage; mit Stichtag werden die @-Punkte eingeplant */
function clsStartenMit(v, titel, stichtag) {
  var plan = stichtag ? clsPlanVorschau(v.text, stichtag) : [];
  var g = clsNeuerSatz('lauf', titel, clsOhneAbstand(clsLeeren(v.text)), v.kontext);
  var seite = kpSeiteFinden(g.id);
  plan.forEach(function (p) { aufPlanAnwenden(seite, p.nr, p.datum, p.zeit); });
  if (stichtag) { g.stichtag = stichtag; }
  g.vorlage = v.id;
  v.benutzt = (Number(v.benutzt) || 0) + 1;
  v.geaendert = jetzt();
  spaeterSichern();
  melde('„' + g.titel + '“ gestartet' + (plan.length ? ' — ' + plan.length + ' Punkte eingeplant.' : '.'), 'gut');
  aufklappZuStill();
  clsOeffnen(g.id);
}

function clsStartOk(mitTerminen) {
  var f = clsFensterLesen();
  var v = f ? clsFinden(f.vorlage) : null;
  if (!f || !v) { aufklappZu(); return; }
  var titel = String(f.titel || '').trim();
  if (!titel) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  if (mitTerminen && !/^\d{4}-\d{2}-\d{2}$/.test(String(f.stichtag || ''))) { melde('Bitte einen Stichtag wählen.', 'warn'); return; }
  clsStartenMit(v, titel.slice(0, 200), mitTerminen ? f.stichtag : '');
}

/* ---- Termine an Checklisten-Punkten (seit 0.16) ----
   Stufe 1: Punkte einer laufenden Checkliste einplanen — derselbe Weg
   wie bei Aufgaben (Tag der Workbench), also in Heute und Kalender.
   Stufe 2: In der Vorlage steht hinter einem Punkt „@-1“, „@0 07:00“
   oder „@+2“ — der Abstand zum Stichtag, der beim Start erfragt wird. */
var CLS_ABSTAND = /^(.*\S)\s+@([+-]?\d{1,3})(?:\s+(\d{1,2}):(\d{2}))?\s*$/;

/* „Koffer packen @-1 18:00“ → { text, tage: -1, zeit: '18:00' } — sonst null */
function clsAbstand(text) {
  var m = String(text || '').match(CLS_ABSTAND);
  if (!m) { return null; }
  var tage = Number(m[2]);
  var zeit = m[3] ? (m[3].length < 2 ? '0' + m[3] : m[3]) + ':' + m[4] : '';
  if (Math.abs(tage) > 365 || (zeit && !/^([01]\d|2[0-3]):[0-5]\d$/.test(zeit))) { return null; }
  return { text: m[1], tage: tage, zeit: zeit };
}

function clsAbstandText(ab) {
  var t = ab.tage === 0 ? 'Stichtag' : (ab.tage > 0 ? '+' : '−') + Math.abs(ab.tage) + ' T.';
  return t + (ab.zeit ? ' ' + clZeitText(ab.zeit) : '');
}

/* Die Zeilen ohne „@…“ — für die laufende Checkliste */
function clsOhneAbstand(text) {
  return String(text || '').split('\n').map(function (z) {
    var a = kpAufgabe(z);
    var ab = a ? clsAbstand(a.text) : null;
    if (!ab) { return z; }
    var vorne = z.match(/^(\s*\[[ xX-]?\]\s*)/);
    return (vorne ? vorne[1] : '[] ') + ab.text;
  }).join('\n');
}

/* Was beim Start wohin kommt; Vergangenes landet auf heute */
function clsPlanVorschau(text, stichtag) {
  var heute = isoDatum();
  var aus = [];
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(stichtag || ''))) { return aus; }
  String(text || '').split('\n').forEach(function (z, nr) {
    var a = kpAufgabe(z);
    var ab = a ? clsAbstand(a.text) : null;
    if (!ab) { return; }
    var d = tagePlus(stichtag, ab.tage);
    aus.push({ nr: nr, text: ab.text, datum: d < heute ? heute : d, zeit: ab.zeit });
  });
  return aus;
}

/* Stufe 1: Fenster „Punkt einplanen“ */
function clsPlanOeffnen(id, nr) {
  var g = clsFinden(id);
  var seite = kpSeiteFinden(id);
  var a = g ? kpAufgabe(String(g.text || '').split('\n')[nr] || '') : null;
  if (!g || g.checkliste !== 'lauf' || !a || !a.text) { return; }
  var p = a.erledigt ? null : aufGeplant(seite, a.text);
  cl.cls.fenster = { modus: 'plan', punkt: nr, alt: a.text, erledigt: a.erledigt,
                     datum: p ? p.datum : '', mitZeit: !!(p && p.zeit), zeit: p ? p.zeit : '' };
  cl.aufklapp = 'checkliste';
  aufklappNeu();
}

function clsPlanZeitUm() {
  var f = clsFensterLesen();
  if (!f) { return; }
  f.mitZeit = !f.mitZeit;
  if (f.mitZeit && !f.datum) { f.datum = isoDatum(); }
  aufklappNeu();
}

function clsPlanWeg() {
  var f = clsFensterLesen();
  if (!f) { return; }
  f.datum = '';
  f.mitZeit = false;
  aufklappNeu();
}

function clsPlanOk() {
  var f = clsFensterLesen();
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!f || !g) { aufklappZu(); return; }
  var seite = kpSeiteFinden(g.id);
  var nr = aufZeileNr(seite, f.punkt, f.alt);
  if (nr < 0) { melde('Der Punkt hat sich inzwischen geändert.', 'warn'); aufklappZu(); return; }
  var datum = String(f.datum || '');
  var zeit = f.mitZeit ? String(f.zeit || '') : '';
  if (datum && (!/^\d{4}-\d{2}-\d{2}$/.test(datum) || datum < isoDatum())) { melde('Bitte heute oder einen späteren Tag wählen.', 'warn'); return; }
  if (f.mitZeit && !/^\d{2}:\d{2}$/.test(zeit)) { melde('Bitte eine Uhrzeit wählen.', 'warn'); return; }
  aufPlanAnwenden(seite, nr, datum, zeit);
  spaeterSichern();
  aufklappZu();
}

function clsSchreibenUm() {
  cl.cls.schreiben = !cl.cls.schreiben;
  zeichne();
  if (cl.cls.schreiben) {
    var f = document.getElementById('memoFeld');
    if (f && f.focus) { f.focus(); }
  }
}

function clsTextGetippt() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  var f = document.getElementById('memoFeld');
  if (!g || !f) { return; }
  g.text = String(f.value);
  g.geaendert = jetzt();
  spaeterSichern();
}

function clsAbschliessen() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g || g.checkliste !== 'lauf') { return; }
  g.checkliste = 'fertig';
  g.abgeschlossen = isoDatum();
  g.geaendert = jetzt();
  spaeterSichern();
  melde('„' + g.titel + '“ abgeschlossen.', 'gut');
  aufklappZuStill();
  clsZurListe();
}

/* Schließt ein offenes Fenster, ohne gleich alles neu zu zeichnen */
function aufklappZuStill() {
  cl.aufklapp = '';
  cl.cls.fenster = null;
}

/* ---- Fenster: Neu und Details ---- */

function clsNeu() {
  cl.cls.fenster = { modus: 'neu' };
  cl.aufklapp = 'checkliste';
  aufklappNeu();
}

function clsDetails() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g) { return; }
  cl.cls.fenster = { modus: 'details', titel: g.titel, kontext: g.kontext || 'privat' };
  cl.aufklapp = 'checkliste';
  aufklappNeu();
}

function clsFensterLesen() {
  var f = cl.cls.fenster;
  var t = document.getElementById('clsTitel');
  if (f && t && typeof t.value === 'string') { f.titel = t.value; }
  var d = document.getElementById('clsDatum');
  var z = document.getElementById('clsZeit');
  var st = document.getElementById('clsStichtag');
  if (f && f.modus === 'plan' && d && typeof d.value === 'string') { f.datum = d.value; }
  if (f && f.modus === 'plan' && f.mitZeit && z && typeof z.value === 'string') { f.zeit = z.value; }
  if (f && f.modus === 'start' && st && typeof st.value === 'string') { f.stichtag = st.value; }
  return f;
}

/* Neuer Stichtag: die Vorschau neu zeichnen */
function clsStartVorschau() {
  if (!clsFensterLesen()) { return; }
  aufklappNeu();
}

function clsKontext(k) {
  var f = clsFensterLesen();
  if (!f || (k !== 'beruflich' && k !== 'privat')) { return; }
  f.kontext = k;
  aufklappNeu();
}

function clsFensterSchritt(modus) {
  if (['neu', 'kopie', 'memo', 'loeschen', 'details'].indexOf(modus) < 0 || !cl.cls.fenster) { return; }
  clsFensterLesen();
  cl.cls.fenster.modus = modus;
  aufklappNeu();
}

function clsFensterHtml() {

      + '<button type="button" class="wahl" onclick="clsFensterSchritt(\'memo\')">Aus einem Memo übernehmen …</button>'
      + '<button type="button" class="wahl" onclick="clsAnlegen(\'einmalig\',\'\')">Einmalige Checkliste (ohne Vorlage)</button>'

      return '<button type="button" class="wahl" onclick="clsAnlegen(\'memo\',\'' + esc(x.id) + '\')">' + clSeitenZeichen(x) + ' ' + esc(x.titel) + '</button>';
    }).join('') : '<p class="leise">Kein Memo mit Punkten.</p>') + abbrechen;
  }
  if (f.modus === 'plan' && g) {
    return kopf('Punkt einplanen') + '<p>' + esc(f.alt) + '</p>'

      + (f.datum ? '<button type="button" class="knopf" onclick="clsPlanWeg()" aria-label="nicht einplanen">✕</button>' : '') + '</div>'
      + '<div class="zeitpaar"><button type="button" class="knopf' + (f.mitZeit ? ' voll' : '') + '" onclick="clsPlanZeitUm()">Uhrzeit</button>'
      + (f.mitZeit ? '<input id="clsZeit" class="eingabe zeitfeld" type="time" value="' + esc(f.zeit) + '" aria-label="Uhrzeit">' : '') + '</div>'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="clsPlanOk()">OK</button>'
      + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button></div>'
      + '<p class="leise">Erscheint dann in „Heute“, im Kalender und im Tag der Workbench. ✕ nimmt ihn wieder heraus.</p></div></div>');
  }

    var v = clsFinden(f.vorlage);

    return kopf('„' + esc(v.titel) + '“ starten')
      + '<label for="clsTitel">Name:</label><input id="clsTitel" class="eingabe" type="text" autocomplete="off" value="' + esc(f.titel) + '">'
      + '<label for="clsStichtag">Stichtag:</label><input id="clsStichtag" class="eingabe" type="date" value="' + esc(f.stichtag) + '" onchange="clsStartVorschau()">'
      + '<label>Wird eingeplant (' + plan.length + ' von ' + alle + '):</label><div class="cls-vorschau">'
      + plan.map(function (p) { return '<div><b>' + esc(clPlanText(p.datum, p.zeit)) + '</b>' + esc(p.text) + '</div>'; }).join('') + '</div>'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="clsStartOk(true)">Starten</button>'
      + '<button type="button" class="knopf" onclick="clsStartOk(false)">Ohne Termine</button>'
      + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button></div>'

    + '<label for="clsTitel">Name:</label><input id="clsTitel" class="eingabe" type="text" autocomplete="off" value="' + esc(f.titel) + '">'
    + '<label>Kategorie:</label><div class="wahlreihe">'
    + [['beruflich', 'Beruf'], ['privat', 'Privat']].map(function (k) {
        return '<button type="button"' + (f.kontext === k[0] ? ' class="an"' : '') + ' onclick="clsKontext(\'' + k[0] + '\')">' + k[1] + '</button>';
      }).join('') + '</div>'
    + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="clsSpeichern()">OK</button>'
    + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button></div><div class="knoepfe">';

}

/* Neu: leer, als Kopie, aus einem Memo oder einmalig */
function clsAnlegen(wie, quelleId) {
  var g = null;
  if (wie === 'leer') { g = clsNeuerSatz('vorlage', 'Neue Vorlage', '[] ', ''); }
  else if (wie === 'einmalig') { g = clsNeuerSatz('lauf', 'Checkliste ' + clKurzDatum(isoDatum()), '[] ', ''); }
  else if (wie === 'kopie') {
    var v = clsFinden(quelleId);
    if (v) { g = clsNeuerSatz('vorlage', 'Kopie von ' + v.titel, clsLeeren(v.text), v.kontext); }
  } else if (wie === 'memo') {
    var s = kpSeiteFinden(quelleId);
    if (s) {
      /* Nur Punkte und Überschriften — der übrige Text bleibt im Memo */
      var text = String(s.text || '').split('\n').filter(function (z) { return kpAufgabe(z) || /^\s*#{1,3}\s/.test(z); }).join('\n');
      g = clsNeuerSatz('vorlage', s.titel, clsLeeren(text), s.kontext);
    }
  }
  if (!g) { melde('Das ließ sich nicht anlegen.', 'warn'); return; }
  spaeterSichern();
  aufklappZuStill();
  cl.cls.id = g.id;
  cl.cls.schreiben = (wie === 'leer' || wie === 'einmalig');
  zeichne();
  /* Gleich den Namen vergeben */
  if (wie === 'leer' || wie === 'einmalig') { clsDetails(); }
}

function clsSpeichern() {
  var f = clsFensterLesen();
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!f || !g) { aufklappZu(); return; }
  var titel = String(f.titel || '').trim();
  if (!titel) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  g.titel = titel.slice(0, 200);
  if (f.kontext === 'beruflich' || f.kontext === 'privat') { g.kontext = f.kontext; }
  g.geaendert = jetzt();
  spaeterSichern();
  aufklappZu();
}

function clsKopieren() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g) { return; }
  clsAnlegen('kopie', g.id);
  melde('Kopie angelegt.', 'gut');
}

function clsZuruecksetzen() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g || g.checkliste === 'vorlage') { return; }
  /* Erst über den Kern zurück auf offen — eingeplante Punkte ziehen mit */
  var seite = kpSeiteFinden(g.id);
  String(g.text || '').split('\n').forEach(function (z, nr) {
    var a = kpAufgabe(z);
    if (a && a.erledigt) { kpSeiteKastenUmKern(seite, nr); }
  });
  g.text = clsLeeren(g.text);
  g.geaendert = jetzt();
  spaeterSichern();
  aufklappZu();
}

function clsAlsVorlage() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g || g.checkliste === 'vorlage') { return; }
  var v = clsNeuerSatz('vorlage', g.titel, clsLeeren(g.text), g.kontext);
  spaeterSichern();
  aufklappZu();
  melde('Als Vorlage „' + v.titel + '“ gespeichert.', 'gut');
}

function clsWiederOeffnen() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g || g.checkliste !== 'fertig') { return; }
  g.checkliste = 'lauf';
  delete g.abgeschlossen;
  g.geaendert = jetzt();
  spaeterSichern();
  aufklappZu();
}

function clsLoeschen() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g) { aufklappZu(); return; }
  /* Eingeplante Punkte erst aus Tag und Woche nehmen */
  String(g.text || '').split('\n').forEach(function (z) {
    var a = kpAufgabe(z);
    if (a && a.text) { kpEintraegeFinden(g.id, a.text).forEach(function (x) { kpAusplanenKern(x.woche.id, x.eintrag.id); }); }
  });
  DB.gedanken = (DB.gedanken || []).filter(function (x) { return x !== g; });
  grabsteinSetzen('gedanken', g.id);
  spaeterSichern();
  melde('„' + g.titel + '“ gelöscht.', null);
  aufklappZuStill();
  clsZurListe();
}
