function saSortOeffnen() {
  cl.aufklapp = (cl.aufklapp === 'sasort') ? '' : 'sasort';
  aufklappZeichnen();
}

function saSortSetzen(feld) {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return; }
  var so = s.sort || {};
  s.sort = (so.feld === feld) ? { feld: feld, ab: !so.ab } : { feld: feld, ab: false };
  saGeaendert(s);
  spaeterSichern();
  cl.aufklapp = '';
  zeichne();
}

function saFeldSchieben(i, r) {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s || !s.felder[i] || !s.felder[i + r]) { return; }
  var f = s.felder[i];
  s.felder[i] = s.felder[i + r];
  s.felder[i + r] = f;
  saGeaendert(s);
  spaeterSichern();
  zeichne();
}

/* ---- Fenster ----
   Ein Fenster für alles: neue Sammlung, Eintrag, Feld, Filter,
   Kopieren, Details. Eingaben werden erst beim Speichern gelesen. */

function saFensterAuf(f) {
  cl.sa.fenster = f;
  cl.aufklapp = 'sa';
  aufklappNeu();
}

function saFeldWert(id) {
  var el = document.getElementById(id);
  return (el && typeof el.value === 'string') ? el.value : '';
}

function saNeu() { saFensterAuf({ modus: 'neu', quelle: '', name: '' }); }

function saNeuWahl(quelle) {
  var f = cl.sa.fenster;
  if (!f) { return; }
  f.name = saFeldWert('saName') || f.name;
  f.quelle = quelle;
  if (!f.name) {
    var v = SA_VORLAGEN[quelle] || saFinden(quelle);
    f.name = v && quelle !== 'frei' ? v.name : '';
  }
  aufklappNeu();
}

function saEintrag(id) {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return; }
  if (id && !saSatzFinden(id)) { return; }
  saFensterAuf({ modus: 'eintrag', id: id });
}

function saFeldOeffnen(id) { saFensterAuf({ modus: 'feld', id: id }); }
function saFeldNeu() { saFensterAuf({ modus: 'feld', id: '' }); }
function saFilterOeffnen(id) { saFensterAuf({ modus: 'filter', id: id }); }
function saWertOeffnen(id) { saFensterAuf({ modus: 'wert', id: id }); }

function saWertArt(art) {
  var f = cl.sa.fenster;
  if (!f || (art !== 'zahl' && art !== 'datum')) { return; }
  f.name = saFeldWert('saWertName');
  f.art = art;
  aufklappNeu();
}
function saKopierenOeffnen() { saFensterAuf({ modus: 'kopie', als: 'vorlage', mit: 'geruest' }); }
function saDetailsOeffnen() {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return; }
  var kz = s.kennzahl || {};
  saFensterAuf({ modus: 'details', name: s.name, kontext: s.kontext || 'privat', gruppe: s.gruppeName || '',
                 kzArt: kz.art || '', kzFeld: kz.feld || ((s.felder || [])[0] || {}).id || '', kzWert: kz.wert || ((s.werte || [])[0] || {}).id || '',
                 kz2Art: (s.kennzahl2 || {}).art || '', kz2Feld: (s.kennzahl2 || {}).feld || ((s.felder || [])[0] || {}).id || '',
                 kz2Wert: (s.kennzahl2 || {}).wert || ((s.werte || [])[0] || {}).id || '' });
}

/* Getipptes und Gewähltes ins Fenster-Objekt, bevor neu gezeichnet wird */
function saDetailsLesen(f) {
  var el = document.getElementById('saName');
  if (el && typeof el.value === 'string') { f.name = el.value; }
  ['saGruppe:gruppe', 'saKzArt:kzArt', 'saKzFeld:kzFeld', 'saKzWert:kzWert', 'saKz2Art:kz2Art', 'saKz2Feld:kz2Feld', 'saKz2Wert:kz2Wert'].forEach(function (x) {
    var t = x.split(':');
    var e = document.getElementById(t[0]);
    if (e && typeof e.value === 'string') { f[t[1]] = e.value; }
  });
  return f;
}

function saFensterSchritt(modus) {
  var f = cl.sa.fenster;
  if (!f || ['loeschen', 'eintrag', 'feld', 'feld-loeschen', 'filter', 'details', 'sammlung-loeschen', 'vorlage-loeschen'].indexOf(modus) < 0) { return; }
  f.modus = modus;
  aufklappNeu();
}

function saKopieWahl(feld, wert) {
  var f = cl.sa.fenster;
  if (!f || (feld !== 'als' && feld !== 'mit')) { return; }
  f.name = saFeldWert('saName') || f.name;
  f[feld] = wert;
  aufklappNeu();
}

function saKnoepfe(innen) {
  return '<div class="knoepfe">' + innen + '</div></div></div>';
}

function saEingabeHtml(f, w) {
  var id = 'saF_' + f.id;
  var wert = (w === null || w === undefined) ? '' : w;
  if (f.typ === 'auswahl') {
    var werte = (f.werte || []).slice();
    if (wert && werte.indexOf(wert) < 0) { werte.push(wert); }
    return '<select id="' + id + '" class="eingabe"><option value=""></option>' + werte.map(function (x) {
      return '<option' + (x === wert ? ' selected' : '') + '>' + esc(x) + '</option>';
    }).join('') + '</select>';
  }
  if (f.typ === 'bewertung') {
    return '<select id="' + id + '" class="eingabe"><option value="0">—</option>' + [1, 2, 3, 4, 5].map(function (n) {
      return '<option value="' + n + '"' + (Number(wert) === n ? ' selected' : '') + '>' + saSterne(n) + '</option>';
    }).join('') + '</select>';
  }
  if (f.typ === 'janein') {
    return '<select id="' + id + '" class="eingabe"><option value="">nein</option><option value="1"' + (wert ? ' selected' : '') + '>ja</option></select>';
  }
  if (f.typ === 'datum') { return '<input id="' + id + '" class="eingabe" type="date" value="' + esc(wert) + '">'; }
  if (f.typ === 'link') {
    return '<div class="sa-linkzeile"><input id="' + id + '" class="eingabe" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://…" value="' + esc(wert) + '">'
      + '<button type="button" class="knopf" onclick="saFormLinkOeffnen(\'' + esc(f.id) + '\')">↗ Öffnen</button></div>';
  }
  if (f.typ === 'betrag' || f.typ === 'zahl') {
    /* Beträge mit Cent zweistellig (14,90), ohne Tausenderpunkte — leichter zu ändern */
    var t = (wert === '') ? '' : ((f.typ === 'betrag' && Number(wert) % 1) ? Number(wert).toFixed(2) : String(wert)).replace('.', ',');
    return '<input id="' + id + '" class="eingabe" type="text" inputmode="decimal" autocomplete="off" value="' + esc(t) + '">';
  }
  return '<input id="' + id + '" class="eingabe" type="text" autocomplete="off" value="' + esc(wert) + '">';
}

function saFensterHtml() {
  var f = cl.sa.fenster;
  if (!f) { return ''; }
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  var kopf = function (t) { return '<div class="fenster" id="saFenster"><div class="titel">' + esc(t) + '</div><div class="rumpf">'; };
  var abbrechen = '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button>';

  if (f.modus === 'neu') {
    var h = kopf('Neue Sammlung') + '<div class="gruppe">Vorlagen</div>';
    ['budget', 'abos', 'buecher', 'training', 'frei'].forEach(function (k) {
      h += '<button type="button" class="wahl' + (f.quelle === k ? ' sa-gewaehlt' : '') + '" onclick="saNeuWahl(\'' + k + '\')">' + (f.quelle === k ? '● ' : '○ ') + esc(SA_VORLAGEN[k].name) + '</button>';
    });
    var eigene = saAlle(true);
    if (eigene.length) {
      h += '<div class="gruppe">Meine Vorlagen</div>';
      eigene.forEach(function (v) {
        h += '<div class="sa-vzeile"><button type="button" class="wahl' + (f.quelle === v.id ? ' sa-gewaehlt' : '') + '" onclick="saNeuWahl(\'' + esc(v.id) + '\')">'
           + (f.quelle === v.id ? '● ' : '○ ') + esc(v.name) + '</button>'
           + '<button type="button" class="knopf" onclick="saVorlageVerwalten(\'' + esc(v.id) + '\')" aria-label="Vorlage bearbeiten">✎</button></div>';
      });
    }
    h += '<label for="saName">Name:</label><input id="saName" class="eingabe" type="text" autocomplete="off" value="' + esc(f.name || '') + '">';
    return h + saKnoepfe('<button type="button" class="knopf voll" onclick="saAnlegen()"' + (f.quelle ? '' : ' disabled') + '>Anlegen</button>' + abbrechen);
  }

  if (f.modus === 'vorlage') {
    var v = saFinden(f.id);
    if (!v) { return ''; }
    return kopf('Vorlage') + '<label for="saName">Name:</label><input id="saName" class="eingabe" type="text" autocomplete="off" value="' + esc(v.name) + '">'
      + '<p class="leise">' + (v.felder || []).length + ' Felder · ' + (v.saetze || []).length + ' Einträge</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saVorlageSpeichern()">OK</button>'
        + '<button type="button" class="knopf" onclick="saFensterSchritt(\'vorlage-loeschen\')">Löschen…</button>'
        + '<button type="button" class="knopf" onclick="saNeu()">Zurück</button>');
  }
  if (f.modus === 'vorlage-loeschen') {
    var vl = saFinden(f.id);
    return kopf('Vorlage löschen') + '<p>Vorlage „' + esc(vl ? vl.name : '') + '“ löschen? Sammlungen daraus bleiben.</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saVorlageLoeschen()">Löschen</button><button type="button" class="knopf" onclick="saNeu()">Abbrechen</button>');
  }

  if (!s) { return ''; }

  if (f.modus === 'eintrag') {
    var d = f.id ? saSatzFinden(f.id) : null;
    /* Neu: mit den Standardwerten der Felder vorbelegt (seit 0.8) */
    var werte = d ? (d.werte || {}) : saStandardWerte(s);
    var e = kopf(d ? s.name : 'Neu · ' + s.name);
    (s.felder || []).forEach(function (fe) {
      if (fe.typ === 'formel') {
        /* Formeln tippt man nicht ein — sie werden gerechnet */
        if (d) { e += reihe('→ ' + fe.name, saWertText(fe, saRoh(s, d, fe)) || '—'); }
        return;
      }
      e += '<label for="saF_' + esc(fe.id) + '">' + esc(fe.name) + ':</label>' + saEingabeHtml(fe, werte[fe.id]);
    });
    if (s.art === 'abos' && d) {
      var kb = saAboKuendbar(s, d);
      var mo = saAboMonat(s, d);
      if (kb) { e += reihe('→ kündbar bis', saDatumText(kb)); }
      if (mo !== null) { e += reihe('→ pro Monat', saZahlText(mo, 2) + ' €'); }
    }
    return e + saKnoepfe('<button type="button" class="knopf voll" onclick="saEintragSpeichern()">Fertig</button>' + abbrechen
      + (d ? '<button type="button" class="knopf" onclick="saEintragKopieren()">Kopieren</button>'
           + '<button type="button" class="knopf" onclick="saFensterSchritt(\'loeschen\')">Löschen…</button>' : ''));
  }

  if (f.modus === 'loeschen') {
    return kopf('Löschen') + '<p>Diesen Eintrag wirklich löschen?</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saEintragLoeschen()">Löschen</button>'
        + '<button type="button" class="knopf" onclick="saFensterSchritt(\'eintrag\')">Abbrechen</button>');
  }

  if (f.modus === 'feld') {
    var fe2 = f.id ? saFeld(s, f.id) : null;
    var x = fe2 || { name: '', typ: 'text', spalte: false, summe: '', werte: [] };
    var spalten = (s.felder || []).filter(function (y) { return y.spalte && y !== fe2; }).length;
    var g = kopf(fe2 ? 'Feld „' + fe2.name + '“' : 'Neues Feld')
      + '<label for="saFeldName">Name:</label><input id="saFeldName" class="eingabe" type="text" autocomplete="off" value="' + esc(x.name) + '">'
      + '<label for="saFeldTyp">Typ:</label><select id="saFeldTyp" class="eingabe">' + SA_TYPEN.map(function (t) {
          return '<option value="' + t[0] + '"' + (t[0] === x.typ ? ' selected' : '') + '>' + t[1] + '</option>';
        }).join('') + '</select>'
      + '<label for="saFeldWerte">Werte (nur bei Auswahl, je Zeile einer):</label>'
      + '<textarea id="saFeldWerte" class="eingabe" rows="3">' + esc((x.werte || []).join('\n')) + '</textarea>'
      + '<label class="haken"><input id="saFeldSpalte" type="checkbox"' + (x.spalte ? ' checked' : '') + (!x.spalte && spalten >= SA_SPALTEN_MAX ? ' disabled' : '') + '> als Spalte in der Liste' + (!x.spalte && spalten >= SA_SPALTEN_MAX ? ' (schon ' + SA_SPALTEN_MAX + ')' : '') + '</label>'
      + '<label class="haken"><input id="saFeldGruppe" type="checkbox"' + (fe2 && s.gruppe === fe2.id ? ' checked' : '') + '> danach gruppieren</label>'
      + '<label for="saFeldSumme">Darunter (bei Zahlen):</label><select id="saFeldSumme" class="eingabe">' + SA_SUMMEN.map(function (t) {
          return '<option value="' + t[0] + '"' + (t[0] === (x.summe || '') ? ' selected' : '') + '>' + t[1] + '</option>';
        }).join('') + '</select>'
      /* Formel (seit 0.8) */
      + '<label for="saFeldFormel">Formel (nur bei Typ Formel):</label>'
      + '<input id="saFeldFormel" class="eingabe sa-formel" type="text" autocomplete="off" spellcheck="false" value="' + esc(x.formel || '') + '">'
      + '<p class="leise sa-formel">Erlaubt: + − × ÷ ( ) und Zahlen. Namen: ' + esc(saFormelNamen(s, fe2).join(' '))
      + '. vorher[Name] = Wert im vorigen Eintrag, z. B. [kg] - vorher[kg]. Daten zählen in Tagen, heute = heutiges Datum, z. B. [Ziel] - heute</p>'
      + (saVerweisListe(s).length ? '<p class="leise sa-formel">Aus anderen Sammlungen (Stand zum Datum des Eintrags): '
          + esc(saVerweisListe(s).slice(0, 24).map(function (x) { return '[' + x + ']'; }).join(' ')) + '</p>' : '')
      + '<label for="saFeldDez">Nachkommastellen:</label><select id="saFeldDez" class="eingabe">' + [0, 1, 2, 3].map(function (n) {
          return '<option value="' + n + '"' + (n === ((x.dez >= 0 && x.dez <= 3) ? x.dez : 2) ? ' selected' : '') + '>' + n + '</option>';
        }).join('') + '</select>'
      + '<label class="haken"><input id="saFeldVz" type="checkbox"' + (x.vorzeichen ? ' checked' : '') + '> mit Vorzeichen (+2,6)</label>'
      + '<label class="haken"><input id="saFeldTrend" type="checkbox"' + (x.trend ? ' checked' : '') + '> als Trend ▲ ▼ ►</label>'
      /* Standardwert bei Neu (seit 0.8) */
      + '<label for="saFeldStd">Bei Neu:</label><select id="saFeldStd" class="eingabe">'
      + [['', 'leer'], ['heute', 'heute (nur Datum)'], ['fest', 'fester Wert'], ['zuletzt', 'wie zuletzt']].map(function (t) {
          return '<option value="' + t[0] + '"' + (t[0] === (x.standard || '') ? ' selected' : '') + '>' + t[1] + '</option>';
        }).join('') + '</select>'
      + '<label for="saFeldStdWert">Fester Wert bei Neu:</label>'
      + '<input id="saFeldStdWert" class="eingabe" type="text" autocomplete="off" value="' + esc(x.standardWert || '') + '">';
    return g + saKnoepfe('<button type="button" class="knopf voll" onclick="saFeldSpeichern()">OK</button>' + abbrechen
      + (fe2 ? '<button type="button" class="knopf" onclick="saFensterSchritt(\'feld-loeschen\')">Feld löschen…</button>' : ''));
  }

  if (f.modus === 'wert') {
    var fw = null;
    (s.werte || []).forEach(function (y) { if (y.id === f.id) { fw = y; } });
    var wv = fw || { name: '', wert: '', einheit: '' };
    /* Art: Zahl oder Datum (seit 0.13) — die Wahl im Fenster gilt vor dem Gespeicherten */
    var art = f.art || (wv.typ === 'datum' ? 'datum' : 'zahl');
    var name = (f.name !== undefined) ? f.name : wv.name;
    return kopf(fw ? 'Fester Wert' : 'Neuer fester Wert')
      + '<label for="saWertName">Name:</label><input id="saWertName" class="eingabe" type="text" autocomplete="off" value="' + esc(name) + '">'
      + '<label>Art:</label><div class="wahlreihe">'
      + [['zahl', 'Zahl'], ['datum', 'Datum']].map(function (a) {
          return '<button type="button"' + (art === a[0] ? ' class="an"' : '') + ' onclick="saWertArt(\'' + a[0] + '\')">' + a[1] + '</button>';
        }).join('') + '</div>'
      + (art === 'datum'
        ? '<label for="saWertDatum">Datum:</label><input id="saWertDatum" class="eingabe" type="date" value="' + esc(wv.typ === 'datum' ? wv.wert : '') + '">'
          + '<p class="leise sa-formel">In Formeln zählt ein Datum in Tagen: [' + esc(name || 'Datum') + '] - heute = Tage bis dahin.</p>'
        : '<label for="saWertZahl">Wert:</label><input id="saWertZahl" class="eingabe" type="text" inputmode="decimal" autocomplete="off" value="'
          + esc((wv.wert === '' || wv.typ === 'datum') ? '' : String(wv.wert).replace('.', ',')) + '">'
          + '<label for="saWertEinheit">Einheit (z. B. kg, €):</label><input id="saWertEinheit" class="eingabe" type="text" autocomplete="off" value="' + esc(wv.einheit || '') + '">')
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saWertSpeichern()">OK</button>' + abbrechen
        + (fw ? '<button type="button" class="knopf" onclick="saWertLoeschen()">Löschen</button>' : ''));
  }

  if (f.modus === 'kopf') {
    var kw = (f.nr >= 0 && s.kopfwerte) ? s.kopfwerte[f.nr] : null;
    var kv = kw || { name: '', art: 'letzter', feld: ((s.felder || [])[0] || {}).id, zeitraum: '' };
    var wahl = function (id, an, liste) {
      return '<select id="' + id + '" class="eingabe">' + liste.map(function (x) {
        return '<option value="' + esc(x[0]) + '"' + (x[0] === an ? ' selected' : '') + '>' + esc(x[1]) + '</option>';
      }).join('') + '</select>';
    };
    return kopf(kw ? 'Kopfwert' : 'Neuer Kopfwert')
      + '<label for="saKwName">Bezeichnung (leer = automatisch):</label><input id="saKwName" class="eingabe" type="text" autocomplete="off" value="' + esc(kv.name || '') + '">'
      + '<label for="saKwArt">Art:</label>' + wahl('saKwArt', kv.art, SA_KW_ARTEN.filter(function (a) { return (a[0] !== 'wert' || (s.werte || []).length) && (a[0] !== 'fremd' || saVerweisListe(s).length); }))
      + '<label for="saKwFeld">… von Feld:</label>' + wahl('saKwFeld', kv.feld || '', (s.felder || []).map(function (x) { return [x.id, x.name]; }))
      + ((s.werte || []).length ? '<label for="saKwWert">… fester Wert:</label>' + wahl('saKwWert', kv.wert || '', s.werte.map(function (x) { return [x.id, x.name]; })) : '')
      + (saVerweisListe(s).length ? '<label for="saKwRef">… aus anderer Sammlung:</label>' + wahl('saKwRef', kv.ref || '', saVerweisListe(s).map(function (x) { return [x, x]; })) : '')
      + '<label for="saKwZr">Zeitraum:</label>' + wahl('saKwZr', kv.zeitraum || '', SA_ZEITRAEUME)
      + '<p class="leise">Der Zeitraum richtet sich nach dem ersten Datumsfeld, ohne Datumsfeld nach dem Anlegen.</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saKopfSpeichern()">OK</button>' + abbrechen
        + (kw ? '<button type="button" class="knopf" onclick="saKopfLoeschen()">Löschen</button>' : ''));
  }

  if (f.modus === 'feld-loeschen') {
    var fl = saFeld(s, f.id);
    return kopf('Feld löschen') + '<p>Feld „' + esc(fl ? fl.name : '') + '“ löschen? Die Werte darin sind dann nicht mehr zu sehen.</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saFeldLoeschen()">Löschen</button>'
        + '<button type="button" class="knopf" onclick="saFensterSchritt(\'feld\')">Abbrechen</button>');
  }

  if (f.modus === 'filter') {
    var fi = null;
    (s.filter || []).forEach(function (y) { if (y.id === f.id) { fi = y; } });
    var z = fi || { name: '', feld: (s.felder[0] || {}).id, op: 'gleich', wert: '' };
    return kopf(fi ? 'Filter „' + fi.name + '“' : 'Neuer Filter')
      + '<label for="saFiName">Name:</label><input id="saFiName" class="eingabe" type="text" autocomplete="off" value="' + esc(z.name) + '">'
      + '<label for="saFiFeld">Feld:</label><select id="saFiFeld" class="eingabe">' + (s.felder || []).map(function (y) {
          return '<option value="' + esc(y.id) + '"' + (y.id === z.feld ? ' selected' : '') + '>' + esc(y.name) + '</option>';
        }).join('') + '</select>'
      + '<label for="saFiOp">Bedingung:</label><select id="saFiOp" class="eingabe">' + SA_BEDINGUNGEN.map(function (y) {
          return '<option value="' + y[0] + '"' + (y[0] === z.op ? ' selected' : '') + '>' + y[1] + '</option>';
        }).join('') + '</select>'
      + '<label for="saFiWert">Wert (bei „ist“, „ist nicht“, „enthält“):</label><input id="saFiWert" class="eingabe" type="text" autocomplete="off" value="' + esc(z.wert || '') + '">'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saFilterSpeichern()">OK</button>' + abbrechen
        + (fi ? '<button type="button" class="knopf" onclick="saFilterLoeschen()">Löschen</button>' : ''));
  }

  if (f.modus === 'kopie') {
    var wahl = function (feld, wert, text) {
      return '<button type="button" class="wahl' + (f[feld] === wert ? ' sa-gewaehlt' : '') + '" onclick="saKopieWahl(\'' + feld + '\',\'' + wert + '\')">' + (f[feld] === wert ? '● ' : '○ ') + text + '</button>';
    };
    return kopf(s.name + ' kopieren')
      + wahl('als', 'sammlung', 'als neue Sammlung') + wahl('als', 'vorlage', 'als Vorlage')
      + '<label for="saName">Name:</label><input id="saName" class="eingabe" type="text" autocomplete="off" value="' + esc(f.name || (f.als === 'vorlage' ? s.name + ' (Vorlage)' : 'Kopie von ' + s.name)) + '">'
      + '<div class="gruppe">Mitnehmen</div>'
      + wahl('mit', 'nichts', 'nur Felder, Gruppen und Filter')
      + wahl('mit', 'geruest', 'dazu die Einträge ohne Zahlen und Daten')
      + wahl('mit', 'alle', 'dazu alle Einträge mit allen Werten')
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saKopieren()">Speichern</button>' + abbrechen);
  }

  if (f.modus === 'details') {
    var feldWahl = function (id, an, liste) {
      return '<select id="' + id + '" class="eingabe">' + liste.map(function (x) {
        return '<option value="' + esc(x[0]) + '"' + (x[0] === an ? ' selected' : '') + '>' + esc(x[1]) + '</option>';
      }).join('') + '</select>';
    };
    var kzArten = [['', 'wie die Vorlage (' + saKennzahlStandard(s) + ')'], ['anzahl', 'Anzahl der Einträge'], ['letzter', 'letzter Wert eines Felds'],
                   ['summe', 'Summe eines Felds'], ['schnitt', 'Ø eines Felds'], ['min', 'Min eines Felds'], ['max', 'Max eines Felds']];
    if ((s.werte || []).length) { kzArten.push(['wert', 'ein fester Wert']); }
    return kopf('Sammlung') + '<label for="saName">Name:</label><input id="saName" class="eingabe" type="text" autocomplete="off" value="' + esc(f.name) + '">'
      + '<label>Kategorie:</label><div class="wahlreihe">'
      + [['beruflich', 'Beruf'], ['privat', 'Privat']].map(function (k) {
          return '<button type="button"' + (f.kontext === k[0] ? ' class="an"' : '') + ' onclick="saKontext(\'' + k[0] + '\')">' + k[1] + '</button>';
        }).join('') + '</div>'
      /* Gruppe und Kennzahl in der Liste der Sammlungen (seit 0.8.1) */
      + '<label for="saGruppe">Gruppe in der Liste (leer = ' + esc(saGruppeStandard(s)) + '):</label>'
      + '<input id="saGruppe" class="eingabe" type="text" autocomplete="off" list="saGruppen" value="' + esc(f.gruppe) + '">'
      + '<datalist id="saGruppen">' + saGruppenNamen().map(function (g) { return '<option value="' + esc(g) + '">'; }).join('') + '</datalist>'
      + '<label for="saKzArt">Kennzahl rechts in der Liste:</label>' + feldWahl('saKzArt', f.kzArt, kzArten)
      + '<label for="saKzFeld">… von Feld:</label>' + feldWahl('saKzFeld', f.kzFeld, (s.felder || []).map(function (x) { return [x.id, x.name]; }))
      + ((s.werte || []).length ? '<label for="saKzWert">… fester Wert:</label>' + feldWahl('saKzWert', f.kzWert, s.werte.map(function (x) { return [x.id, x.name]; })) : '')
      /* Kennzahl 2 (seit 0.11.1): klein unter der ersten */
      + '<label for="saKz2Art">Kennzahl 2 (darunter, klein):</label>' + feldWahl('saKz2Art', f.kz2Art, [['', 'keine']].concat(kzArten.slice(1)))
      + '<label for="saKz2Feld">… von Feld:</label>' + feldWahl('saKz2Feld', f.kz2Feld, (s.felder || []).map(function (x) { return [x.id, x.name]; }))
      + ((s.werte || []).length ? '<label for="saKz2Wert">… fester Wert:</label>' + feldWahl('saKz2Wert', f.kz2Wert, s.werte.map(function (x) { return [x.id, x.name]; })) : '')
      + '<p class="leise">Jetzt: ' + esc(saKennzahl(s)) + ' · ' + saSaetze(s).length + ' Einträge · ' + (s.felder || []).length + ' Felder</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saDetailsSpeichern()">OK</button>' + abbrechen
        + '<button type="button" class="knopf" onclick="saFensterSchritt(\'sammlung-loeschen\')">Löschen…</button>');
  }

  if (f.modus === 'sammlung-loeschen') {
    return kopf('Sammlung löschen') + '<p>„' + esc(s.name) + '“ mit allen ' + saSaetze(s).length + ' Einträgen löschen?</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saSammlungLoeschen()">Löschen</button>'
        + '<button type="button" class="knopf" onclick="saFensterSchritt(\'details\')">Abbrechen</button>');
  }
  return '';
}

/* ---- Anlegen, Speichern, Löschen ---- */

function saNaechsterRang() {
  return (DB.sammlungen || []).reduce(function (n, s) { return Math.max(n, s.ordnung || 0); }, 0) + 1;
}

/* Eine Sammlung (oder Vorlage) aus einer Vorlage bauen */
function saAusVorlage(v, name, alsVorlage, saetze) {
  if (!Array.isArray(DB.sammlungen)) { DB.sammlungen = []; }
  if (!Array.isArray(DB.datensaetze)) { DB.datensaetze = []; }
  var s = { id: neueKennung(), name: String(name || v.name).slice(0, 120), art: v.art || 'frei', vorlage: !!alsVorlage,
            kontext: (cl.filter === 'beruflich' || cl.filter === 'privat') ? cl.filter : (v.kontext || 'privat'),
            felder: saKopie(v.felder || []), rollen: saKopie(v.rollen || {}), filter: saKopie(v.filter || []),
            gruppe: v.gruppe || '', gruppenAn: !!v.gruppenAn, sort: saKopie(v.sort || {}), werte: saKopie(v.werte || []),
            kopfwerte: saKopie(v.kopfwerte || []),
            ordnung: saNaechsterRang(), geaendert: jetzt() };
  if (alsVorlage) { s.saetze = saKopie(saetze || []); }
  DB.sammlungen.push(s);
  if (!alsVorlage) {
    (saetze || []).forEach(function (w) {
      DB.datensaetze.push({ id: neueKennung(), sammlung: s.id, werte: saKopie(w), angelegt: jetzt(), geaendert: jetzt() });
    });
  }
  return s;
}

function saAnlegen() {
  var f = cl.sa.fenster;
  if (!f || !f.quelle) { melde('Bitte eine Vorlage wählen.', 'warn'); return; }
  var name = String(saFeldWert('saName') || '').trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  var v = SA_VORLAGEN[f.quelle] || saFinden(f.quelle);
  if (!v) { return; }
  var s = saAusVorlage(v, name, false, v.saetze || []);
  spaeterSichern();
  cl.aufklapp = '';
  cl.sa.fenster = null;
  melde('„' + s.name + '“ angelegt.', 'gut');
  saOeffnen(s.id);
}

/* Die Formularwerte eines Eintrags lesen */
function saWerteLesen(s) {
  var w = {};
  (s.felder || []).forEach(function (f) {
    if (f.typ === 'formel') { return; }
    var t = saFeldWert('saF_' + f.id);
    if (f.typ === 'betrag' || f.typ === 'zahl') {
      var n = saZahlLesen(t);
      if (n !== null) { w[f.id] = n; }
    } else if (f.typ === 'bewertung') {
      if (Number(t) > 0) { w[f.id] = Number(t); }
    } else if (f.typ === 'janein') {
      if (t) { w[f.id] = true; }
    } else if (String(t).trim()) {
      w[f.id] = String(t).trim().slice(0, 500);
    }
  });
  return w;
}

function saEintragSpeichern() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  var werte = saWerteLesen(s);
  if (!Object.keys(werte).length) { melde('Der Eintrag ist leer.', 'warn'); return; }
  var falsch = (s.felder || []).filter(function (fe) { return fe.typ === 'link' && werte[fe.id] && !saLinkGueltig(werte[fe.id]); })[0];
  if (falsch) { melde('„' + falsch.name + '“ ist keine gültige Adresse.\nSie muss mit http:// oder https:// beginnen.', 'warn'); return; }
  var d = f.id ? saSatzFinden(f.id) : null;
  if (d) {
    /* Werte unbekannter (gelöschter) Felder bleiben erhalten */
    (s.felder || []).forEach(function (fe) { delete d.werte[fe.id]; });
    Object.keys(werte).forEach(function (k) { d.werte[k] = werte[k]; });
    d.geaendert = jetzt();
  } else {
    if (!Array.isArray(DB.datensaetze)) { DB.datensaetze = []; }
    DB.datensaetze.push({ id: neueKennung(), sammlung: s.id, werte: werte, angelegt: jetzt(), geaendert: jetzt() });
  }
  spaeterSichern();
  aufklappZu();
}

function saEintragKopieren() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  var d = (f && f.id) ? saSatzFinden(f.id) : null;
  if (!s || !d) { return; }
  var neu = { id: neueKennung(), sammlung: s.id, werte: saWerteLesen(s), angelegt: jetzt(), geaendert: jetzt() };
  DB.datensaetze.push(neu);
  spaeterSichern();
  melde('Kopie angelegt.', 'gut');
  cl.sa.fenster = { modus: 'eintrag', id: neu.id };
  zeichne();
  aufklappNeu();
}

function saEintragLoeschen() {
  var f = cl.sa.fenster;
  var d = (f && f.id) ? saSatzFinden(f.id) : null;
  if (!d) { aufklappZu(); return; }
  DB.datensaetze = (DB.datensaetze || []).filter(function (x) { return x !== d; });
  grabsteinSetzen('datensaetze', d.id);
  spaeterSichern();
  aufklappZu();
}

function saFeldSpeichern() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  var name = String(saFeldWert('saFeldName') || '').trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  if (/[\[\]]/.test(name)) { melde('Der Name darf keine eckigen Klammern enthalten.', 'warn'); return; }
  var fe = f.id ? saFeld(s, f.id) : null;
  var typ = saFeldWert('saFeldTyp');
  typ = SA_TYPEN.some(function (t) { return t[0] === typ; }) ? typ : 'text';
  var formel = String(saFeldWert('saFeldFormel') || '').trim();
  if (typ === 'formel') {
    var fehler = saFormelPruefen(s, formel, fe);
    if (fehler) { melde('Die Formel stimmt nicht: ' + fehler, 'warn'); return; }
  }
  if (!fe) {
    fe = { id: 'f' + neueKennung() };
    s.felder.push(fe);
  }
  fe.name = name.slice(0, 60);
  fe.typ = typ;
  fe.werte = String(saFeldWert('saFeldWerte') || '').split('\n').map(function (x) { return x.trim(); }).filter(function (x) { return x; });
  if (fe.typ !== 'auswahl') { delete fe.werte; }
  var sp = document.getElementById('saFeldSpalte');
  var gr = document.getElementById('saFeldGruppe');
  fe.spalte = !!(sp && sp.checked);
  var summe = saFeldWert('saFeldSumme');
  fe.summe = (saRechts(fe) || summe === 'anzahl') ? summe : '';
  if (gr && gr.checked) { s.gruppe = fe.id; }
  else if (s.gruppe === fe.id) { s.gruppe = ''; s.gruppenAn = false; }
  /* Formel und Standardwert (seit 0.8) */
  if (fe.typ === 'formel') {
    var vz = document.getElementById('saFeldVz');
    var dez = Number(saFeldWert('saFeldDez'));
    fe.formel = formel.slice(0, 200);
    fe.dez = (dez >= 0 && dez <= 3) ? dez : 2;
    fe.vorzeichen = !!(vz && vz.checked);
    var tr = document.getElementById('saFeldTrend');
    fe.trend = !!(tr && tr.checked);
    delete fe.standard;
    delete fe.standardWert;
  } else {
    delete fe.formel;
    delete fe.dez;
    delete fe.vorzeichen;
    delete fe.trend;
    var std = saFeldWert('saFeldStd');
    if (std === 'heute' && fe.typ !== 'datum') { std = ''; }
    if (['heute', 'fest', 'zuletzt'].indexOf(std) < 0) { std = ''; }
    fe.standard = std;
    fe.standardWert = (std === 'fest') ? String(saFeldWert('saFeldStdWert') || '').trim().slice(0, 200) : '';
    if (!std) { delete fe.standard; delete fe.standardWert; }
  }
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

/* Die Namen, die eine Formel verwenden darf — ohne das Feld selbst */
function saFormelNamen(s, ohne) {
  var n = (s.felder || []).filter(function (f) { return f !== ohne; }).map(function (f) { return '[' + f.name + ']'; });
  return n.concat((s.werte || []).map(function (w) { return '[' + w.name + ']'; }));
}

/* Prüft die Schreibweise und ob es alle Namen gibt. Ergebnis: Fehlertext oder '' */
function saFormelPruefen(s, formel, ohne) {
  var namen = saFormelNamen(s, ohne).map(function (x) { return x.toLowerCase(); });
  var alleFelder = saFormelNamen(s, null).map(function (x) { return x.toLowerCase(); });
  try {
    saFormelAuswerten(formel, function (name, vorher) {
      /* vorher[…] darf auch das Feld selbst meinen (etwa den vorigen Trend) */
      if ((vorher ? alleFelder : namen).indexOf('[' + String(name).toLowerCase() + ']') >= 0) { return 1; }
      if (saVerweisTeilen(name) && saVerweisBekannt(name, s)) { return 1; }
      throw new Error('[' + name + '] gibt es nicht');
    });
  } catch (e) {
    return e.message;
  }
  return '';
}

/* Die Vorbelegung bei Neu: heute, ein fester Wert oder wie im jüngsten Eintrag */
function saStandardWerte(s) {
  var w = {};
  var letzter = null;
  saSaetze(s).forEach(function (d) {
    if (!letzter || (d.angelegt || d.geaendert || 0) > (letzter.angelegt || letzter.geaendert || 0)) { letzter = d; }
  });
  (s.felder || []).forEach(function (f) {
    if (f.standard === 'heute' && f.typ === 'datum') { w[f.id] = isoDatum(); }
    else if (f.standard === 'fest' && String(f.standardWert || '') !== '') {
      var t = String(f.standardWert);
      if (f.typ === 'betrag' || f.typ === 'zahl') { var n = saZahlLesen(t); if (n !== null) { w[f.id] = n; } }
      else if (f.typ === 'bewertung') { w[f.id] = Number(t) || 0; }
      else if (f.typ === 'janein') { w[f.id] = /^(ja|1|x)$/i.test(t); }
      else { w[f.id] = t; }
    } else if (f.standard === 'zuletzt' && letzter && (letzter.werte || {})[f.id] !== undefined) {
      w[f.id] = letzter.werte[f.id];
    }
  });
  return w;
}

function saFeldLoeschen() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  s.felder = (s.felder || []).filter(function (x) { return x.id !== f.id; });
  s.filter = (s.filter || []).filter(function (x) { return x.feld !== f.id; });
  if (s.gruppe === f.id) { s.gruppe = ''; s.gruppenAn = false; }
  if (s.sort && s.sort.feld === f.id) { s.sort = {}; }
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

function saFilterSpeichern() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  var name = String(saFeldWert('saFiName') || '').trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  var op = saFeldWert('saFiOp');
  var feld = saFeldWert('saFiFeld');
  if (!saFeld(s, feld) || !SA_BEDINGUNGEN.some(function (b) { return b[0] === op; })) { melde('Bitte Feld und Bedingung wählen.', 'warn'); return; }
  var fi = null;
  (s.filter || []).forEach(function (y) { if (y.id === f.id) { fi = y; } });
  if (!fi) {
    fi = { id: 'x' + neueKennung() };
    if (!Array.isArray(s.filter)) { s.filter = []; }
    s.filter.push(fi);
  }
  fi.name = name.slice(0, 40);
  fi.feld = feld;
  fi.op = op;
  fi.wert = String(saFeldWert('saFiWert') || '').trim();
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

function saWertSpeichern() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  var name = String(saFeldWert('saWertName') || '').trim();
  var vorher = null;
  (s.werte || []).forEach(function (y) { if (y.id === f.id) { vorher = y; } });
  var art = f.art || ((vorher && vorher.typ === 'datum') ? 'datum' : 'zahl');
  var zahl = (art === 'datum') ? null : saZahlLesen(saFeldWert('saWertZahl'));
  var datum = (art === 'datum') ? String(saFeldWert('saWertDatum') || '') : '';
  if (!name || /[\[\]]/.test(name)) { melde('Bitte einen Namen ohne eckige Klammern eingeben.', 'warn'); return; }
  if (art === 'zahl' && zahl === null) { melde('Bitte eine Zahl eingeben, z. B. 82,5.', 'warn'); return; }
  if (art === 'datum' && saTagNr(datum) === null) { melde('Bitte ein Datum wählen.', 'warn'); return; }
  var doppelt = (s.felder || []).concat(s.werte || []).some(function (y) { return y.id !== f.id && String(y.name).toLowerCase() === name.toLowerCase(); });
  if (doppelt) { melde('Den Namen „' + name + '“ gibt es in dieser Sammlung schon.', 'warn'); return; }
  if (!Array.isArray(s.werte)) { s.werte = []; }
  var w = null;
  s.werte.forEach(function (y) { if (y.id === f.id) { w = y; } });
  if (!w) { w = { id: 'w' + neueKennung() }; s.werte.push(w); }
  w.name = name.slice(0, 40);
  if (art === 'datum') {
    w.typ = 'datum';
    w.wert = datum;
    delete w.einheit;
  } else {
    delete w.typ;
    w.wert = zahl;
    w.einheit = String(saFeldWert('saWertEinheit') || '').trim().slice(0, 12);
  }
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

function saWertLoeschen() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  s.werte = (s.werte || []).filter(function (y) { return y.id !== f.id; });
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

function saFilterLoeschen() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  s.filter = (s.filter || []).filter(function (x) { return x.id !== f.id; });
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

/* Einträge für eine Kopie: nichts, Gerüst (ohne Zahlen und Daten) oder alles */
function saKopieSaetze(s, mit) {
  if (mit === 'nichts') { return []; }
  return saSaetze(s).map(function (d) {
    var w = saKopie(d.werte || {});
    if (mit === 'geruest') {
      (s.felder || []).forEach(function (f) {
        if (['betrag', 'zahl', 'datum', 'bewertung', 'janein'].indexOf(f.typ) >= 0) { delete w[f.id]; }
      });
    }
    return w;
  }).filter(function (w) { return Object.keys(w).length; });
}

function saKopieren() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  var name = String(saFeldWert('saName') || '').trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  var neu = saAusVorlage(s, name, f.als === 'vorlage', saKopieSaetze(s, f.mit));
  neu.kontext = s.kontext || neu.kontext;
  spaeterSichern();
  cl.aufklapp = '';
  cl.sa.fenster = null;
  if (f.als === 'vorlage') {
    melde('Vorlage „' + neu.name + '“ gespeichert — zu finden unter „Neu…“.', 'gut');
    zeichne();
  } else {
    melde('„' + neu.name + '“ angelegt.', 'gut');
    saOeffnen(neu.id);
  }
}

function saKontext(k) {
  var f = cl.sa.fenster;
  if (!f || (k !== 'beruflich' && k !== 'privat')) { return; }
  saDetailsLesen(f);
  f.kontext = k;
  aufklappNeu();
}

function saDetailsSpeichern() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  saDetailsLesen(f);
  var name = String(f.name || '').trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  s.name = name.slice(0, 120);
  if (f.kontext === 'beruflich' || f.kontext === 'privat') { s.kontext = f.kontext; }
  var gruppe = String(f.gruppe || '').trim().slice(0, 40);
  if (gruppe && gruppe !== saGruppeStandard(s)) { s.gruppeName = gruppe; } else { delete s.gruppeName; }
  var kz1 = saKennzahlWahl(f.kzArt, f.kzFeld, f.kzWert);
  var kz2 = saKennzahlWahl(f.kz2Art, f.kz2Feld, f.kz2Wert);
  if (kz1) { s.kennzahl = kz1; } else { delete s.kennzahl; }
  if (kz2) { s.kennzahl2 = kz2; } else { delete s.kennzahl2; }
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

/* Aus der Wahl im Fenster eine gespeicherte Kennzahl; null = keine */
function saKennzahlWahl(art, feld, wert) {
  if (['anzahl', 'letzter', 'summe', 'schnitt', 'min', 'max', 'wert'].indexOf(art) < 0) { return null; }
  var kz = { art: art };
  if (art === 'wert') { kz.wert = wert; } else if (art !== 'anzahl') { kz.feld = feld; }
  return kz;
}

function saSammlungLoeschen() {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { aufklappZu(); return; }
  saSaetze(s).forEach(function (d) { grabsteinSetzen('datensaetze', d.id); });
  DB.datensaetze = (DB.datensaetze || []).filter(function (d) { return d.sammlung !== s.id; });
  DB.sammlungen = (DB.sammlungen || []).filter(function (x) { return x !== s; });
  grabsteinSetzen('sammlungen', s.id);
  spaeterSichern();
  melde('„' + s.name + '“ gelöscht.', null);
  cl.aufklapp = '';
  cl.sa.fenster = null;
  saZurListe();
}

function saVorlageVerwalten(id) {
  if (!saFinden(id)) { return; }
  saFensterAuf({ modus: 'vorlage', id: id });
}

function saVorlageSpeichern() {
  var f = cl.sa.fenster;
  var v = f ? saFinden(f.id) : null;
  var name = String(saFeldWert('saName') || '').trim();
  if (!v || !name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  v.name = name.slice(0, 120);
  saGeaendert(v);
  spaeterSichern();
  saNeu();
}

function saVorlageLoeschen() {
  var f = cl.sa.fenster;
  var v = f ? saFinden(f.id) : null;
  if (v) {
    DB.sammlungen = (DB.sammlungen || []).filter(function (x) { return x !== v; });
    grabsteinSetzen('sammlungen', v.id);
    spaeterSichern();
  }
  saNeu();
}

/* ---------- Routinen (seit 0.5) ----------

   Routinen pflegen wie in der Workbench — dieselben Sätze in
   DB.aufgaben mit „wiederholung“: wöchentlich an Tagen oder monatlich
   an einem Tag, alle n Wochen/Monate, mit Uhrzeit, Start und Pause.
   Fällig, erledigt, auslassen und verlegen kommen wörtlich aus der
   Workbench. Das 14-Tage-Raster bleibt dort. */

cl.rt = { wahl: '', pausiertAuf: false, fenster: null };
var RT_WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

function rtAlle() {
  return (DB.aufgaben || []).filter(function (a) {
    return a && a.wiederholung && (cl.filter === 'alle' || !a.kontext || a.kontext === cl.filter);
  }).sort(function (x, y) { return String(x.titel || '').localeCompare(String(y.titel || ''), 'de'); });
}

function rtFinden(id) {
  var l = DB.aufgaben || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i] && l[i].id === id && l[i].wiederholung) { return l[i]; } }
  return null;
}

/* Die nächste offene Ausführung — heute, wenn fällig, sonst die nächste */
function rtDiesmalTag(a) {
  var d = isoDatum();
  var i;
  for (i = 0; i < 400; i++) {
    if (aufgabeFaelligAn(a, d) && !istErledigtAn(a, d)) { return d; }
    d = tagePlus(d, 1);
  }
  return '';
}

function routinenHtml() {
  var heute = isoDatum();
  var alle = rtAlle();
  var faellig = clRoutinenAm(heute).sort(function (x, y) {
    var zx = aufgabeZeitAn(x, heute) || '99:99';
    var zy = aufgabeZeitAn(y, heute) || '99:99';
    return zx < zy ? -1 : (zx > zy ? 1 : 0);
  });
  var h = '<div class="gruppe">Heute</div>';
  h += faellig.length ? faellig.map(function (a) {
    var erl = istErledigtAn(a, heute);
    var zt = aufgabeZeitAn(a, heute);
    return '<div class="aufg' + (erl ? ' erl' : '') + '">' + clKastenHtml(erl, 'clRoutineUm(\'' + esc(a.id) + '\',\'' + heute + '\')')
      + '<span class="tx">' + esc(a.titel) + '</span>' + (zt ? '<span class="zeit">' + esc(clZeitText(zt)) + '</span>' : '') + '</div>';
  }).join('') : '<p class="leise">Heute keine Routine.</p>';
  var zeile = function (a) {
    var rhythmus = kpFrequenz(a.wiederholung) + (a.uhrzeit ? ' · ' + clZeitText(a.uhrzeit) : '');
    var ab = (a.ab && a.ab > heute) ? ' · ab ' + clKurzDatum(a.ab) : '';
    return '<button type="button" class="rt-zeile' + (cl.rt.wahl === a.id ? ' gewaehlt' : '') + (a.pausiert ? ' pause' : '')
      + '" onclick="rtTippen(\'' + esc(a.id) + '\')"><span class="tx">' + esc(a.titel || 'Routine') + '<small>' + esc(rhythmus + ab) + '</small></span>'
      + (cl.filter === 'alle' && a.kontext === 'beruflich' ? '<span class="marke">Beruf</span>' : '') + '</button>';
  };
  var laufend = alle.filter(function (a) { return !a.pausiert; });
  var pausiert = alle.filter(function (a) { return a.pausiert; });
  h += '<div class="gruppe">Alle Routinen</div>' + (laufend.length ? laufend.map(zeile).join('') : '<p class="leise">Noch keine Routine — „Neu“ tippen.</p>');
  if (pausiert.length) {
    h += '<button type="button" class="gruppe klapp" onclick="rtPausiertUm()">' + (cl.rt.pausiertAuf ? '▾' : '›') + ' Pausiert · ' + pausiert.length + '</button>';
    if (cl.rt.pausiertAuf) { h += pausiert.map(zeile).join(''); }
  }
  return h;
}

function routinenFussHtml() {
  return '<button type="button" class="knopf" onclick="rtNeu()">Neu</button>'
    + '<button type="button" class="knopf" onclick="rtDetailsGewaehlt()">Details…</button>'
    + '<button type="button" class="knopf" onclick="rtDiesmal()">Nur diesmal…</button>';
}

function rtPausiertUm() {
  cl.rt.pausiertAuf = !cl.rt.pausiertAuf;
  inhaltZeichnen();
}

function rtTippen(id) {
  if (cl.rt.wahl === id) { rtDetails(id); return; }
  cl.rt.wahl = id;
  inhaltZeichnen();
}

function rtDetailsGewaehlt() {
  if (!rtFinden(cl.rt.wahl)) { melde('Erst eine Routine antippen, dann „Details…“.', null); return; }
  rtDetails(cl.rt.wahl);
}

/* ---- Fenster: Neu, Details, Löschen ---- */

function rtNeu() {
  var heute = isoDatum();
  cl.rt.fenster = { modus: 'neu', id: '', titel: '', takt: 'woche', intervall: 1, tage: [ausIso(heute).getDay()],
                    tag: Number(heute.slice(8, 10)), uhrzeit: '', ab: heute, pausiert: false,
                    kontext: (cl.filter === 'beruflich') ? 'beruflich' : 'privat' };
  cl.aufklapp = 'routine';
  aufklappNeu();
}

function rtDetails(id) {
  var a = rtFinden(id);
  if (!a) { return; }
  var w = a.wiederholung || {};
  cl.rt.wahl = id;
  cl.rt.fenster = { modus: 'details', id: a.id, titel: a.titel || '', takt: (w.takt === 'monat') ? 'monat' : 'woche',
                    intervall: Math.max(1, Number(w.intervall) || 1), tage: Array.isArray(w.tage) ? w.tage.slice() : [],
                    tag: Number(w.tag) || 1, uhrzeit: a.uhrzeit || '', ab: a.ab || '', pausiert: !!a.pausiert,
                    kontext: a.kontext === 'beruflich' ? 'beruflich' : 'privat' };
  cl.aufklapp = 'routine';
  aufklappNeu();
}

function rtFensterLesen() {
  var f = cl.rt.fenster;
  if (!f) { return null; }
  var wert = function (id) { var e = document.getElementById(id); return (e && typeof e.value === 'string') ? e.value : null; };
  var t = wert('rtName'); if (t !== null) { f.titel = t; }
  var n = wert('rtIntervall'); if (n !== null) { f.intervall = n; }
  var d = wert('rtTag'); if (d !== null) { f.tag = d; }
  var z = wert('rtZeit'); if (z !== null) { f.uhrzeit = z; }
  var ab = wert('rtAb'); if (ab !== null) { f.ab = ab; }
  return f;
}

function rtWahl(feld, wert) {
  var f = rtFensterLesen();
  if (!f) { return; }
  if (feld === 'takt' && (wert === 'woche' || wert === 'monat')) { f.takt = wert; }
  else if (feld === 'kontext' && (wert === 'beruflich' || wert === 'privat')) { f.kontext = wert; }
  else if (feld === 'pausiert') { f.pausiert = !f.pausiert; }
  else if (feld === 'tag') {
    var t = Number(wert);
    if (t >= 0 && t <= 6) {
      var i = f.tage.indexOf(t);
      if (i >= 0) { f.tage.splice(i, 1); } else { f.tage.push(t); f.tage.sort(); }
    }
  } else { return; }
  aufklappNeu();
}

function rtFensterHtml() {
  var f = cl.rt.fenster;
  if (!f) { return ''; }
  var a = f.id ? rtFinden(f.id) : null;
  if (f.modus === 'loeschen' && a) {
    return '<div class="fenster"><div class="titel">Routine löschen</div><div class="rumpf">'
      + '<p>„' + esc(a.titel) + '“ wirklich löschen? Auch ihre erledigten Tage verschwinden.</p>'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="rtLoeschen()">Löschen</button>'
      + '<button type="button" class="knopf" onclick="rtDetails(\'' + esc(a.id) + '\')">Abbrechen</button></div></div></div>';
  }
  if (f.modus === 'diesmal' && a) {
    var tag = rtDiesmalTag(a);
    if (!tag) {
      return '<div class="fenster"><div class="titel">Nur diesmal · ' + esc(a.titel) + '</div><div class="rumpf">'
        + '<p class="leise">Keine offene Ausführung gefunden.</p>'
        + '<div class="knoepfe"><button type="button" class="knopf" onclick="aufklappZu()">OK</button></div></div></div>';
    }
    return '<div class="fenster"><div class="titel">Nur diesmal · ' + esc(a.titel) + '</div><div class="rumpf">'
      + '<p class="leise">Betrifft nur die Ausführung am ' + esc(clWt(tag) + ' ' + clKurzDatum(tag))
      + (aufgabeZeitAn(a, tag) ? ' um ' + esc(clZeitText(aufgabeZeitAn(a, tag))) : '') + ' — die Regel bleibt.</p>'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="rtAuslassen(\'' + tag + '\')">Auslassen</button></div>'
      + '<label>Oder verlegen auf:</label><div class="zeitpaar">'
      + '<input id="rtZu" class="eingabe" type="date" value="' + esc(tagePlus(tag, 1)) + '" aria-label="Tag">'
      + '<input id="rtZuZeit" class="eingabe" type="time" value="' + esc(aufgabeZeitAn(a, tag)) + '" aria-label="Uhrzeit"></div>'
      + '<div class="knoepfe"><button type="button" class="knopf" onclick="rtVerlegen(\'' + tag + '\')">Verlegen</button>'
      + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button></div></div></div>';
  }
  var reihe = function (feld, werte, an) {
    return '<div class="wahlreihe">' + werte.map(function (w) {
      return '<button type="button"' + (w[0] === an ? ' class="an"' : '') + ' onclick="rtWahl(\'' + feld + '\',\'' + w[0] + '\')">' + w[1] + '</button>';
    }).join('') + '</div>';
  };
  var h = '<div class="fenster"><div class="titel">' + (f.modus === 'neu' ? 'Neue Routine' : 'Routine') + '</div><div class="rumpf">'
    + '<label for="rtName">Name:</label><input id="rtName" class="eingabe" type="text" autocomplete="off" value="' + esc(f.titel) + '">'
    + '<label>Rhythmus:</label>' + reihe('takt', [['woche', 'wöchentlich'], ['monat', 'monatlich']], f.takt);
  if (f.takt === 'woche') {
    h += '<div class="wahlreihe tage">' + [1, 2, 3, 4, 5, 6, 0].map(function (t) {
      return '<button type="button"' + (f.tage.indexOf(t) >= 0 ? ' class="an"' : '') + ' onclick="rtWahl(\'tag\',\'' + t + '\')">' + RT_WT[t] + '</button>';
    }).join('') + '</div>'
      + '<div class="zeitpaar"><span>alle</span><input id="rtIntervall" class="eingabe zahlfeld" type="number" min="1" max="52" inputmode="numeric" value="' + esc(String(f.intervall)) + '"><span>Woche(n)</span></div>';
  } else {
    h += '<div class="zeitpaar"><span>am</span><input id="rtTag" class="eingabe zahlfeld" type="number" min="1" max="31" inputmode="numeric" value="' + esc(String(f.tag)) + '"><span>. · alle</span>'
       + '<input id="rtIntervall" class="eingabe zahlfeld" type="number" min="1" max="24" inputmode="numeric" value="' + esc(String(f.intervall)) + '"><span>Monat(e)</span></div>';
  }
  h += '<label for="rtZeit">Uhrzeit (frei lassen = ohne):</label><input id="rtZeit" class="eingabe zeitfeld" type="time" value="' + esc(f.uhrzeit) + '">'
     + '<label for="rtAb">Ab:</label><input id="rtAb" class="eingabe" type="date" value="' + esc(f.ab) + '">'
     + '<label>Kategorie:</label>' + reihe('kontext', [['beruflich', 'Beruf'], ['privat', 'Privat']], f.kontext)
     + '<div class="wahlreihe"><button type="button"' + (f.pausiert ? ' class="an"' : '') + ' onclick="rtWahl(\'pausiert\',\'\')">' + (f.pausiert ? '■' : '▢') + ' pausiert</button></div>'
     + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="rtSpeichern()">OK</button>'
     + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button>'
     + (a ? '<button type="button" class="knopf" onclick="rtLoeschenFragen()">Löschen…</button>' : '') + '</div></div></div>';
  return h;
}

function rtSpeichern() {
  var f = rtFensterLesen();
  if (!f) { return; }
  var titel = String(f.titel || '').trim();
  var intervall = Math.round(Number(f.intervall));
  var tag = Math.round(Number(f.tag));
  if (!titel) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  if (f.takt === 'woche' && !f.tage.length) { melde('Bitte mindestens einen Wochentag wählen.', 'warn'); return; }
  if (!(intervall >= 1 && intervall <= (f.takt === 'woche' ? 52 : 24))) { melde('„alle …“ bitte als Zahl ab 1.', 'warn'); return; }
  if (f.takt === 'monat' && !(tag >= 1 && tag <= 31)) { melde('Der Tag im Monat muss zwischen 1 und 31 liegen.', 'warn'); return; }
  if (f.uhrzeit && !/^([01]\d|2[0-3]):[0-5]\d$/.test(f.uhrzeit)) { melde('Die Uhrzeit ist ungültig.', 'warn'); return; }
  if (f.ab && !/^\d{4}-\d{2}-\d{2}$/.test(f.ab)) { melde('Das Startdatum ist ungültig.', 'warn'); return; }
  var a = f.id ? rtFinden(f.id) : null;
  if (!a) {
    /* Dieselbe Gestalt wie eine neue Routine in der Workbench */
    a = { id: neueKennung(), titel: '', beschreibung: '', kontext: f.kontext, themaId: null, projektId: null, frist: '',
          planung: 'backlog', uhrzeit: '', art: 'haupt', wiederholung: null, status: 'offen', erledigtAm: null,
          zuletztErledigt: null, ablaufSchritt: null, ab: '', geaendert: jetzt() };
    if (!Array.isArray(DB.aufgaben)) { DB.aufgaben = []; }
    DB.aufgaben.push(a);
  }
  a.titel = titel.slice(0, 200);
  a.wiederholung = { takt: f.takt, intervall: intervall, tage: (f.takt === 'woche') ? f.tage.slice() : [],
                     tag: (f.takt === 'monat') ? tag : ((a.wiederholung && a.wiederholung.tag) || Number(isoDatum().slice(8, 10))) };
  a.uhrzeit = f.uhrzeit || '';
  a.ab = f.ab || '';
  a.kontext = f.kontext;
  if (f.pausiert) { a.pausiert = true; } else { delete a.pausiert; }
  a.geaendert = jetzt();
  cl.rt.wahl = a.id;
  spaeterSichern();
  aufklappZu();
}

function rtLoeschenFragen() {
  rtFensterLesen();
  if (cl.rt.fenster) { cl.rt.fenster.modus = 'loeschen'; aufklappNeu(); }
}

function rtLoeschen() {
  var a = cl.rt.fenster ? rtFinden(cl.rt.fenster.id) : null;
  if (!a) { aufklappZu(); return; }
  DB.aufgaben.splice(DB.aufgaben.indexOf(a), 1);
  grabsteinSetzen('aufgaben', a.id);
  cl.rt.wahl = '';
  spaeterSichern();
  aufklappZu();
  melde('Routine gelöscht.', null);
}

/* ---- Nur diesmal ---- */

function rtDiesmal() {
  var a = rtFinden(cl.rt.wahl);
  if (!a) { melde('Erst eine Routine antippen, dann „Nur diesmal…“.', null); return; }
  cl.rt.fenster = { modus: 'diesmal', id: a.id };
  cl.aufklapp = 'routine';
  aufklappNeu();
}

function rtAuslassen(tag) {
  var a = cl.rt.fenster ? rtFinden(cl.rt.fenster.id) : null;
  if (!a || !ausfuehrungAuslassen(a, tag)) { melde('Das ließ sich nicht auslassen.', 'warn'); return; }
  aufklappZu();
  melde('Am ' + clKurzDatum(tag) + ' ausgelassen.', 'gut');
}

function rtVerlegen(von) {
  var a = cl.rt.fenster ? rtFinden(cl.rt.fenster.id) : null;
  var zu = (document.getElementById('rtZu') || {}).value || '';
  var zeit = (document.getElementById('rtZuZeit') || {}).value || '';
  if (!a) { aufklappZu(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(zu))) { melde('Bitte einen Tag wählen.', 'warn'); return; }
  if (!ausfuehrungVerlegen(a, von, zu, zeit)) { melde('Das ließ sich nicht verlegen.', 'warn'); return; }
  aufklappZu();
  melde('Verlegt auf ' + clWt(zu) + ' ' + clKurzDatum(zu) + (zeit ? ' ' + clZeitText(zeit) : '') + '.', 'gut');
}

/* ---------- Einkauf: die geteilte Google-Keep-Notiz ----------

   Google lässt normale Konten nicht an Keep heran. Die Liste bleibt
   deshalb in Keep — geteilt mit der Familie — und CLIE öffnet nur
   die gewählte Notiz. Der Link liegt in den Einstellungen der
   workbench.json und kommt so auf alle Geräte. */

function einkaufLink() {
  return String((DB.einstellungen && DB.einstellungen.clieEinkauf) || '');
}

/* Nur Links zu Google Keep — keine fremden Adressen. */
function einkaufLinkGueltig(link) {
  return /^https:\/\/keep\.google\.com\/[^\s"'<>]*$/.test(String(link || '').trim());
}

function einkaufOeffnen() {
  var link = einkaufLink();
  if (!einkaufLinkGueltig(link)) { cl.aufklapp = 'einkauf'; kopfZeichnen(); aufklappZeichnen(); return; }
  /* Ohne „noopener“ im Aufruf: Damit liefert window.open immer null,
     und CLIE würde sich selbst durch Keep ersetzen. Die Verbindung zum
     neuen Fenster wird stattdessen danach gekappt. */
  var fenster = window.open(link, '_blank');
  if (fenster) {
    try { fenster.opener = null; } catch (e) { /* fremdes Fenster */ }
  } else {
    melde('Keep ließ sich nicht öffnen.\nBitte Pop-ups für CLIE erlauben.', 'warn');
  }
}

function einkaufDialogHtml() {
  return '<div class="fenster"><div class="titel">Einkauf verknüpfen</div><div class="rumpf">'
    + '<label for="einkaufFeld">Link deiner Keep-Notiz:</label>'
    + '<input id="einkaufFeld" class="eingabe" type="url" inputmode="url" autocomplete="off" placeholder="https://keep.google.com/…" value="'
    + esc(einkaufLink()) + '">'
    + '<p class="leise">In Keep: Notiz öffnen → ⋮ → „Link kopieren“, hier einfügen.</p>'
    + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="einkaufSpeichern()">OK</button>'
    + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button>'
    + (einkaufLink() ? '<button type="button" class="knopf" onclick="einkaufLoesen()">Lösen</button>' : '')
    + '</div></div></div>';
}

function einkaufSetzen(link) {
  DB.einstellungen.clieEinkauf = link;
  DB.einstellungen.stempel = jetzt();
  spaeterSichern();
}

function einkaufSpeichern() {
  var feld = document.getElementById('einkaufFeld');
  var link = String((feld && feld.value) || '').trim();
  if (!einkaufLinkGueltig(link)) {
    melde('Das ist kein Link zu Google Keep.\nEr beginnt mit https://keep.google.com/', 'warn');
    return;
  }
  einkaufSetzen(link);
  aufklappZu();
  melde('Einkauf ist mit deiner Keep-Notiz verknüpft.', 'gut');
}

function einkaufLoesen() {
  einkaufSetzen('');
  aufklappZu();
  melde('Die Verknüpfung zu Keep ist gelöst.', null);
}

/* ---------- Drive (seit 0.19) ----------

   Deine Dokumente in Google Drive: Ordner durchblättern, die zuletzt
   geänderten Dateien, Favoriten und Suche in den Dateinamen. Ein Tipp
   öffnet die Datei in der passenden Google-App bzw. im Viewer des
   Handys. CLIE sieht dafür nur die Dateiliste (drive.metadata.readonly)
   und liest keine Inhalte. Das Recht wird erst angefragt, wenn du es in
   der App erlaubst. Favoriten liegen in der workbench.json
   (Bereich „drivefavoriten“, seit Workbench 6.3.1). */

var DRV_SCOPE = 'https://www.googleapis.com/auth/drive.metadata.readonly';
var DRV_RECHT_KEY = 'clie-drive-recht';
var DRV_API = 'https://www.googleapis.com/drive/v3/files';
var DRV_FELDER = 'files(id,name,mimeType,modifiedTime,webViewLink)';
var DRV_ORDNER = 'application/vnd.google-apps.folder';
var DRV_TABS = [['ordner', 'Ordner'], ['zuletzt', 'Zuletzt'], ['favoriten', '★ Favoriten']];

cl.drv = { tab: 'ordner', stapel: [{ id: 'root', name: 'Meine Ablage' }], vorher: 'ordner', q: '',
           cache: {}, laedt: '', fehler: '', zeilen: [], recht: { token: '', stand: '' } };

/* Seit 0.19.1: Ohne das Listenrecht meldet Drive keinen Fehler, sondern
   liefert nur die Dateien, die CLIE/Workbench selbst angelegt haben.
   Darum fragen wir Google, welche Rechte der Schlüssel wirklich hat. */
var DRV_TOKENINFO = 'https://oauth2.googleapis.com/tokeninfo?access_token=';

/* Stand des Rechts für den aktuellen Schlüssel: '' (offen), 'pruefe', 'ja', 'nein', 'fehler' */
function drvRechtStand() {
  return (cl.drv.recht.token === zugriffToken) ? cl.drv.recht.stand : '';
}

function drvRechtPruefen() {
  if (!tokenGueltig() || typeof fetch !== 'function' || drvRechtStand()) { return; }
  var token = zugriffToken;
  cl.drv.recht = { token: token, stand: 'pruefe' };
  fetch(DRV_TOKENINFO + encodeURIComponent(token)).then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (j) {
    var rechte = (j && typeof j.scope === 'string') ? j.scope.split(' ') : null;
    cl.drv.recht = { token: token, stand: rechte ? (rechte.indexOf(DRV_SCOPE) >= 0 ? 'ja' : 'nein') : 'fehler' };
  }).catch(function () {
    cl.drv.recht = { token: token, stand: 'fehler' };
  }).then(function () {
    if (cl.app === 'drive') { drvZeichnen(); }
  });
}

function drvRechtGewuenscht() {
  try { return window.localStorage.getItem(DRV_RECHT_KEY) === 'an'; } catch (e) { return false; }
}

/* Art einer Datei: Zeichen und Name */
function drvArt(mime) {
  var m = String(mime || '');
  if (m === DRV_ORDNER) { return ['▤', 'Ordner']; }
  if (m === 'application/vnd.google-apps.document') { return ['✎', 'Google Docs']; }
  if (m === 'application/vnd.google-apps.spreadsheet') { return ['▦', 'Google Tabellen']; }
  if (m === 'application/vnd.google-apps.presentation') { return ['▭', 'Google Präsentationen']; }
  if (m === 'application/pdf') { return ['≣', 'PDF']; }
  if (m.indexOf('image/') === 0) { return ['▣', 'Bild']; }
  return ['▫', 'Datei'];
}

function drvDatum(zeit) {
  var d = String(zeit || '').slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { return ''; }
  if (d === isoDatum()) { return 'heute'; }
  if (d === tagePlus(isoDatum(), -1)) { return 'gestern'; }
  return clKurzDatum(d);
}

/* Anfragen an die Drive-API: Ordner, Zuletzt, Suche */
function drvAdresse(schluessel) {
  var q;
  var sort;
  if (schluessel === 'zuletzt') {
    q = "trashed=false and mimeType!='" + DRV_ORDNER + "'";
    sort = 'modifiedTime desc';
    return DRV_API + '?pageSize=20&orderBy=' + encodeURIComponent(sort) + '&q=' + encodeURIComponent(q) + '&fields=' + encodeURIComponent(DRV_FELDER);
  }
  if (schluessel.indexOf('q:') === 0) {
    q = "trashed=false and name contains '" + schluessel.slice(2).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
    sort = 'folder,modifiedTime desc';
    return DRV_API + '?pageSize=50&orderBy=' + encodeURIComponent(sort) + '&q=' + encodeURIComponent(q) + '&fields=' + encodeURIComponent(DRV_FELDER);
  }
  q = "'" + schluessel.replace(/'/g, '') + "' in parents and trashed=false";
  return DRV_API + '?pageSize=200&orderBy=' + encodeURIComponent('folder,name') + '&q=' + encodeURIComponent(q) + '&fields=' + encodeURIComponent(DRV_FELDER);
}

function drvSchluessel() {
  if (cl.drv.tab === 'zuletzt') { return 'zuletzt'; }
  if (cl.drv.tab === 'suche') { return cl.drv.q ? 'q:' + cl.drv.q : ''; }
  if (cl.drv.tab === 'ordner') { return cl.drv.stapel[cl.drv.stapel.length - 1].id; }
  return '';
}

/* Holt eine Liste (einmal je Sitzung, „Aktualisieren“ holt neu) */
function drvLaden(schluessel) {
  if (!schluessel || cl.drv.cache[schluessel] || cl.drv.laedt === schluessel || !tokenGueltig()) { return; }
  if (typeof fetch !== 'function') { return; }
  cl.drv.laedt = schluessel;
  cl.drv.fehler = '';
  fetch(drvAdresse(schluessel), { headers: driveKopf() }).then(function (r) {
    if (r.status === 403) { cl.drv.fehler = 'recht'; return null; }
    if (r.status === 401) { cl.drv.fehler = 'anmeldung'; return null; }
    if (!r.ok) { cl.drv.fehler = 'Drive antwortet mit ' + r.status + '.'; return null; }
    return r.json();
  }).then(function (j) {
    if (j) { cl.drv.cache[schluessel] = Array.isArray(j.files) ? j.files : []; }
  }).catch(function (f) {
    cl.drv.fehler = 'Keine Verbindung zu Drive.' + (f && f.message ? ' (' + f.message + ')' : '');
  }).then(function () {
    cl.drv.laedt = '';
    if (cl.app === 'drive') { drvZeichnen(); }
  });
}

/* ---- Favoriten (in der workbench.json) ---- */

function drvFavoriten() {
  return (DB.drivefavoriten || []).filter(function (f) { return f && f.datei; }).slice().sort(function (a, b) {
    var oa = a.mime === DRV_ORDNER ? 0 : 1;
    var ob = b.mime === DRV_ORDNER ? 0 : 1;
    return (oa - ob) || String(a.name || '').localeCompare(String(b.name || ''), 'de');
  });
}

function drvFavorit(datei) {
  var l = DB.drivefavoriten || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i] && l[i].datei === datei) { return l[i]; } }
  return null;
}

function drvPfadText() {
  return cl.drv.stapel.map(function (s) { return s.name; }).join(' › ');
}

/* Stern an einer Zeile: Favorit an oder aus */
function drvFavUm(i) {
  var z = cl.drv.zeilen[i];
  if (!z) { return; }
  var f = drvFavorit(z.id);
  if (f) {
    DB.drivefavoriten = DB.drivefavoriten.filter(function (x) { return x !== f; });
    grabsteinSetzen('drivefavoriten', f.id);
  } else {
    if (!Array.isArray(DB.drivefavoriten)) { DB.drivefavoriten = []; }
    DB.drivefavoriten.push({ id: neueKennung(), datei: z.id, name: String(z.name || '').slice(0, 200), mime: z.mimeType || '',
                             link: z.webViewLink || '', pfad: z.pfad || (cl.drv.tab === 'ordner' ? drvPfadText() : ''), geaendert: jetzt() });
  }
  spaeterSichern();
  drvZeichnen();
}

/* Tipp auf eine Zeile: Ordner öffnen oder Datei in der Google-App */
function drvOeffnen(i) {
  var z = cl.drv.zeilen[i];
  if (!z) { return; }
  if (z.mimeType === DRV_ORDNER) {
    if (cl.drv.tab === 'ordner') { cl.drv.stapel.push({ id: z.id, name: z.name }); }
    else { cl.drv.stapel = [{ id: 'root', name: 'Meine Ablage' }, { id: z.id, name: z.name }]; }
    cl.drv.tab = 'ordner';
    drvZeichnen();
    return;
  }
  var link = z.webViewLink || ('https://drive.google.com/file/d/' + encodeURIComponent(z.id) + '/view');
  /* Ohne „noopener“ — sonst liefert window.open null (siehe Einkauf) */
  var w = null;
  try { w = window.open(link, '_blank'); } catch (e) { w = null; }
  if (!w) { melde('Die Datei ließ sich nicht öffnen.\nBitte Pop-ups für CLIE erlauben.', 'warn'); }
}

function drvHoch() {
  if (cl.drv.stapel.length > 1) { cl.drv.stapel.pop(); drvZeichnen(); }
}

function drvTab(t) {
  if (['ordner', 'zuletzt', 'favoriten'].indexOf(t) < 0) { return; }
  cl.drv.tab = t;
  var el = document.getElementById('inhalt');
  if (el) { el.scrollTop = 0; }
  drvZeichnen();
}

function drvSucheOeffnen() {
  if (cl.drv.tab !== 'suche') { cl.drv.vorher = cl.drv.tab; }
  cl.drv.tab = 'suche';
  zeichne();
  var f = document.getElementById('drvFeld');
  if (f && f.focus) { f.focus(); }
}

function drvSucheZu() {
  cl.drv.tab = cl.drv.vorher || 'ordner';
  zeichne();
}

function drvSuchen() {
  var f = document.getElementById('drvFeld');
  var q = f ? String(f.value || '').trim() : '';
  cl.drv.q = q.slice(0, 80);
  drvZeichnen();
}

function drvSuchTaste(e) {
  if (e && e.key === 'Enter') { drvSuchen(); }
}

function drvAktualisieren() {
  cl.drv.cache = {};
  cl.drv.fehler = '';
  cl.drv.recht = { token: '', stand: '' };
  drvZeichnen();
}

/* Das Recht „Dateiliste sehen“ erbitten — Google fragt einmal nach */
function drvErlauben() {
  try { window.localStorage.setItem(DRV_RECHT_KEY, 'an'); } catch (e) { /* dann nur für jetzt */ }
  cl.drv.fehler = '';
  cl.drv.cache = {};
  cl.drv.recht = { token: '', stand: '' };
  anmeldeVersuch(false, 'consent').then(function () { if (cl.app === 'drive') { drvZeichnen(); } });
}

/* ---- Zeichnen ---- */

function drvZeileHtml(z, i, mitPfad) {
  var art = drvArt(z.mimeType);
  var fav = !!drvFavorit(z.id);
  var unter = art[1] + (mitPfad && z.pfad ? ' · ' + z.pfad : (z.modifiedTime && z.mimeType !== DRV_ORDNER ? ' · ' + drvDatum(z.modifiedTime) : ''));
  var name = esc(z.name || '(ohne Namen)');
  if (cl.drv.tab === 'suche' && cl.drv.q) { name = suMarkiert(z.name || '', cl.drv.q, false); }
  return '<div class="drv-zeile"><button type="button" class="drv-n" onclick="drvOeffnen(' + i + ')"><span class="drv-sym">' + art[0] + '</span>'
    + '<span class="tx">' + name + '<small>' + esc(unter) + '</small></span></button>'
    /* PDFs lassen sich vorlesen (seit 0.26) */
    + (z.mimeType === 'application/pdf' ? '<button type="button" class="drv-stern" onclick="vlAusDriveZeile(' + i + ')" aria-label="Vorlesen">🔊</button>' : '')
    + '<button type="button" class="drv-stern' + (fav ? ' an' : '') + '" onclick="drvFavUm(' + i + ')" aria-label="Favorit">' + (fav ? '★' : '☆') + '</button></div>';
}

function drvListeHtml() {
  if (cl.drv.tab === 'favoriten') {
    cl.drv.zeilen = drvFavoriten().map(function (f) {
      return { id: f.datei, name: f.name, mimeType: f.mime, webViewLink: f.link, pfad: f.pfad };
    });
    if (!cl.drv.zeilen.length) { return '<p class="leise">Noch keine Favoriten — ☆ an einer Datei oder einem Ordner tippen.</p>'; }
    return cl.drv.zeilen.map(function (z, i) { return drvZeileHtml(z, i, true); }).join('')
      + '<p class="leise">Favoriten werden mit der Workbench abgeglichen — sie sind auf allen Geräten gleich.</p>';
  }
  if (!tokenGueltig()) {
    return '<p>Für Drive braucht CLIE die Verbindung zu Google.</p>'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="anmelden(false)">Verbinden</button></div>';
  }
  /* Erst das Recht, dann die Liste (seit 0.19.1) */
  var stand = drvRechtGewuenscht() ? drvRechtStand() : 'nie';
  if (stand === '' || stand === 'pruefe') { drvRechtPruefen(); return '<p class="leise">Prüfe die Berechtigung …</p>'; }
  if (stand === 'fehler') {
    return '<p class="warn">Google ließ sich nicht nach der Berechtigung fragen.</p>'
      + '<div class="knoepfe"><button type="button" class="knopf" onclick="drvAktualisieren()">Nochmal</button></div>';
  }
  if (stand === 'nie' || stand === 'nein' || cl.drv.fehler === 'recht') {
    return '<p>CLIE darf deine Drive-Liste noch nicht sehen.</p>'
      + '<p class="leise">Mit „Erlauben“ fragt Google einmal nach dem Recht, die Dateiliste zu sehen (nur Namen und Ordner, keine Inhalte).</p>'
      + (stand === 'nein' ? '<p class="leise">Google hat das Recht bisher nicht erteilt. Bitte im Zustimmungsfenster das Häkchen bei „Drive-Dateien ansehen“ setzen. '
           + 'Fragt Google gar nicht, fehlt das Recht noch in der Cloud Console (drive.metadata.readonly).</p>' : '')
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="drvErlauben()">Erlauben</button></div>';
  }
  if (cl.drv.fehler === 'anmeldung') {
    return '<p>Die Anmeldung ist abgelaufen.</p><div class="knoepfe"><button type="button" class="knopf voll" onclick="anmelden(false)">Verbinden</button></div>';
  }
  if (cl.drv.fehler) {
    return '<p class="warn">' + esc(cl.drv.fehler) + '</p><div class="knoepfe"><button type="button" class="knopf" onclick="drvAktualisieren()">Nochmal</button></div>';
  }
  var k = drvSchluessel();
  if (!k) { return '<p class="leise">Sucht in den Dateinamen der ganzen Drive — Begriff eingeben, dann ⌕.</p>'; }
  var l = cl.drv.cache[k];
  if (!l) { drvLaden(k); return '<p class="leise">Wird geholt …</p>'; }
  var pfad = cl.drv.tab === 'ordner' ? drvPfadText() : '';
  cl.drv.zeilen = l.map(function (f) {
    return { id: f.id, name: f.name, mimeType: f.mimeType, modifiedTime: f.modifiedTime, webViewLink: f.webViewLink, pfad: pfad };
  });
  var h = '';
  if (cl.drv.tab === 'ordner' && cl.drv.stapel.length > 1) {
    h += '<button type="button" class="drv-hoch" onclick="drvHoch()">‹ zurück zu „' + esc(cl.drv.stapel[cl.drv.stapel.length - 2].name) + '“</button>';
  }
  if (!l.length) {
    return h + '<p class="leise">' + (cl.drv.tab === 'suche' ? 'Nichts gefunden.' : (cl.drv.tab === 'zuletzt' ? 'Keine Dateien.' : 'Dieser Ordner ist leer.')) + '</p>';
  }
  return h + cl.drv.zeilen.map(function (z, i) { return drvZeileHtml(z, i, false); }).join('')
    + (cl.drv.tab === 'ordner' && l.length >= 200 ? '<p class="leise">Nur die ersten 200 Einträge.</p>' : '')
    + (cl.drv.tab === 'suche' ? '<p class="leise">Sucht in den Dateinamen. Den Inhalt der Dateien liest CLIE nicht.</p>' : '');
}

function driveHtml() {
  var h = '';
  if (cl.drv.tab === 'suche') {
    h += '<div class="su-feld"><span>⌕</span><input id="drvFeld" type="search" autocomplete="off" placeholder="Dateiname …" value="' + esc(cl.drv.q) + '"'
       + ' onkeydown="drvSuchTaste(event)"><button type="button" class="knopf" onclick="drvSuchen()">Suchen</button></div>';
  } else {
    h += '<div class="auf-leiste"><div class="schalter">' + DRV_TABS.map(function (t) {
        return '<button type="button"' + (t[0] === cl.drv.tab ? ' class="an"' : '') + ' onclick="drvTab(\'' + t[0] + '\')">' + t[1] + '</button>';
      }).join('') + '</div></div>';
    if (cl.drv.tab === 'ordner') { h += '<div class="drv-pfad">' + esc(drvPfadText()) + '</div>'; }
  }
  return h + '<div id="drvListe">' + drvListeHtml() + '</div>';
}

/* Beim Suchen bleibt das Feld stehen — nur die Liste kommt neu */
function drvZeichnen() {
  if (cl.app !== 'drive') { return; }
  var el = document.getElementById('inhalt');
  var l = document.getElementById('drvListe');
  if (cl.drv.tab === 'suche' && el && l && el.innerHTML.indexOf('drvFeld') >= 0) { l.innerHTML = drvListeHtml(); return; }
  if (el) { el.innerHTML = driveHtml(); }
}

function driveFussHtml() {
  if (cl.drv.tab === 'suche') { return '<button type="button" class="knopf voll" onclick="drvSucheZu()">Fertig</button>'; }
  return '<button type="button" class="knopf" onclick="drvSucheOeffnen()">Suchen</button>'
    + '<button type="button" class="knopf" onclick="drvAktualisieren()">Aktualisieren</button>';
}
