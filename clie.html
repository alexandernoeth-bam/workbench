/* Die Schreibleiste (seit 0.38): [Kennung, Beschriftung, Name] */
var MEMO_LEISTE = [['kasten', '[ ]', 'Aufgabe'], ['nicht', '[–]', 'nicht relevant'], ['punkt', '•', 'Aufzählung'], ['zahl', '1.', 'Nummerierung'],
                   ['ein', '→', 'einrücken'], ['aus', '←', 'ausrücken'], ['h', 'H', 'Überschrift'], ['fett', '<b>F</b>', 'fett'],
                   ['unter', '<u>U</u>', 'unterstrichen'], ['durch', '<s>S</s>', 'durchgestrichen'], ['link', '🔗', 'Link'],
                   ['trenner', '—', 'Trenner'], ['tabelle', '⊞', 'Tabelle']];

/* Zeichen an der Schreibstelle: Zeilenanfang, Auszeichnung um die Auswahl oder ein Block */
function memoZeichen(was) {
  var f = document.getElementById('memoFeld');
  if (!f) { return; }
  var v = String(f.value);
  var pos = f.selectionStart || 0;
  var bis = (typeof f.selectionEnd === 'number' && f.selectionEnd >= pos) ? f.selectionEnd : pos;
  var anfang = v.lastIndexOf('\n', pos - 1) + 1;
  var zeile = v.slice(anfang).split('\n')[0];
  var neuWert = null;
  var a = 0;
  var e = 0;
  var paare = { fett: '**', unter: '__', durch: '~~' };
  if (paare[was]) {
    var p = paare[was];
    var mitte = v.slice(pos, bis);
    neuWert = v.slice(0, pos) + p + mitte + p + v.slice(bis);
    a = pos + p.length;
    e = a + mitte.length;
  } else if (was === 'link') {
    var text = v.slice(pos, bis) || 'Link';
    neuWert = v.slice(0, pos) + '[' + text + '](https://)' + v.slice(bis);
    a = pos + text.length + 3;
    e = a + 8;
  } else if (was === 'trenner' || was === 'tabelle') {
    var ende = anfang + zeile.length;
    var block = (was === 'trenner') ? '---' : '| Spalte 1 | Spalte 2 |\n|---|---|\n|  |  |';
    neuWert = v.slice(0, ende) + '\n' + block + v.slice(ende);
    a = ende + 1 + block.length;
    e = a;
  } else if (was === 'ein' || was === 'aus') {
    var neuZ = (was === 'ein') ? '  ' + zeile : zeile.replace(/^ {1,2}/, '');
    neuWert = v.slice(0, anfang) + neuZ + v.slice(anfang + zeile.length);
    a = Math.max(anfang, pos + (neuZ.length - zeile.length));
    e = a;
  } else {
    var einzug = (zeile.match(/^\s*/) || [''])[0];
    var ohne = zeile.slice(einzug.length).replace(/^(\[[ xX-]?\]|#{1,3}|[-•*]|\d{1,3}[.)])\s*/, '');
    var vorne = { kasten: '[] ', nicht: '[-] ', h: '## ', zahl: '1. ', punkt: '- ' }[was] || '- ';
    var schon = zeile.slice(einzug.length).indexOf(vorne.trim()) === 0 && !(was === 'kasten' && /^\[-\]/.test(zeile.slice(einzug.length)));
    var neu = einzug + (schon ? ohne : vorne + ohne);
    neuWert = v.slice(0, anfang) + neu + v.slice(anfang + zeile.length);
    a = anfang + neu.length;
    e = a;
  }
  f.value = neuWert;
  if (f.setSelectionRange) { f.setSelectionRange(a, e); }
  if (cl.app === 'checklisten') { clsTextGetippt(); } else { memoTextGetippt(); }
}

/* Tab rückt ein, Umschalt+Tab aus (am PC) */
function memoTaste(ev) {
  if (!ev || ev.key !== 'Tab') { return; }
  if (ev.preventDefault) { ev.preventDefault(); }
  memoZeichen(ev.shiftKey ? 'aus' : 'ein');
}

function memoFensterHtml() {

  if (f.modus === 'neu') {

    + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button></div></div></div>';
}

function memoSpeichern() {
  var f = memoFensterLesen();
  if (!f) { return; }
  var titel = String(f.titel || '').trim();
  if (!titel) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  if (f.modus === 'neu') {
    var art = (f.art === 'projekt' || f.art === 'ziel') ? 'vorhaben' : f.art;
    var s = kpSeiteAnlegen(art, titel, f.kontext, f.art === 'ziel' ? 'ziel' : '');
    if (!s) { melde('Das Memo ließ sich nicht anlegen.', 'warn'); return; }
    spaeterSichern();
    aufklappZu();
    cl.memo.id = s.id;
    cl.memo.schreiben = true;
    zeichne();
    return;
  }
  var seite = cl.memo.id ? kpSeiteFinden(cl.memo.id) : null;
  if (!seite) { aufklappZu(); return; }
  seite.titel = titel.slice(0, 200);
  if (f.kontext === 'beruflich' || f.kontext === 'privat') { seite.kontext = f.kontext; }
  if (seite.art === 'vorhaben') {
    if (['laeuft', 'ruht', 'erledigt'].indexOf(f.zustand) >= 0) { seite.zustand = f.zustand; }
    seite.termin = /^\d{4}-\d{2}-\d{2}$/.test(String(f.termin || '')) ? f.termin : '';
  }
  seite.geaendert = jetzt();
  spaeterSichern();
  aufklappZu();
  /* Ruht oder erledigt: gehört nicht mehr in die Liste der laufenden */
  if (seite.art === 'vorhaben' && seite.zustand !== 'laeuft') { memoZurListe(); }
}

/* ---------- Checklisten (seit 0.4) ----------

   Vorlagen zum Wiederverwenden und laufende Checklisten, die aus einer
   Vorlage gestartet werden (oder einmalig sind). Gespeichert als Notizen
   der workbench.json mit dem Kennzeichen „checkliste“:
     'vorlage'  — eine Vorlage; benutzt = wie oft gestartet
     'lauf'     — eine laufende Checkliste; vorlage = Kennung, gestartet = Datum
     'fertig'   — abgeschlossen; abgeschlossen = Datum
   Der Text folgt derselben Schreibweise wie überall: [] Punkt, ## Überschrift.
   So gehen Checklisten ohne Umbau der Workbench durch den Abgleich. */

cl.cls = { id: '', schreiben: false, fertigAuf: false, fenster: null };

function clsAlle(art) {
  return kpNachRang((DB.gedanken || []).filter(function (g) {
    return g && g.checkliste === art && kpPasstFilter(g, cl.filter);
  }));
}

function clsFinden(id) {
  var l = DB.gedanken || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i] && l[i].id === id && l[i].checkliste) { return l[i]; } }
  return null;
}

/* Fortschritt: erledigte (auch [-]) von allen Punkten */
function clsStand(g) {
  var n = 0, f = 0;
  String((g && g.text) || '').split('\n').forEach(function (z) {
    var a = kpAufgabe(z);
    if (a && a.text) { n++; if (a.erledigt) { f++; } }
  });
  return { alle: n, fertig: f };
}

/* Alle Kästchen leer — für Starten, Zurücksetzen, Vorlage aus Lauf */
function clsLeeren(text) {
  return String(text || '').split('\n').map(function (z) {
    return z.replace(/^(\s*)\[[ xX-]?\]/, '$1[]');
  }).join('\n');
}

function clsNeuerSatz(art, titel, text, kontext) {
  if (!Array.isArray(DB.gedanken)) { DB.gedanken = []; }
  var g = { id: neueKennung(), titel: String(titel || '').slice(0, 200), text: String(text || ''),
            kontext: (kontext === 'beruflich' || kontext === 'privat') ? kontext : (cl.filter === 'alle' ? 'privat' : cl.filter),
            ordnung: kpNaechsterRang(), checkliste: art, geaendert: jetzt() };
  if (art === 'vorlage') { g.benutzt = 0; }
  if (art === 'lauf') { g.gestartet = isoDatum(); }
  DB.gedanken.push(g);
  return g;
}

function clsBalkenHtml(st) {
  var p = st.alle ? Math.round(st.fertig * 100 / st.alle) : 0;
  return '<span class="balken"><i style="width:' + p + '%"></i></span><span class="cls-zahl">' + st.fertig + '/' + st.alle + '</span>';
}

function checklistenListeHtml() {
  var laufend = clsAlle('lauf');
  var vorlagen = clsAlle('vorlage');
  var fertig = clsAlle('fertig');
  var h = '<div class="gruppe">Laufend</div>';
  h += laufend.length ? laufend.map(function (g) {
    return '<button type="button" class="cls-zeile" onclick="clsOeffnen(\'' + esc(g.id) + '\')"><span class="tx">' + esc(g.titel)
      + '<small>seit ' + esc(clKurzDatum(g.gestartet || isoDatum())) + '</small></span>' + clsBalkenHtml(clsStand(g)) + '</button>';
  }).join('') : '<p class="leise">Keine laufende Checkliste.</p>';
  h += '<div class="gruppe">Vorlagen</div>';
  h += vorlagen.length ? vorlagen.map(function (g) {
    var st = clsStand(g);
    return '<div class="cls-zeile"><button type="button" class="tx" onclick="clsOeffnen(\'' + esc(g.id) + '\')">' + esc(g.titel)
      + '<small>' + st.alle + ' Punkte' + (g.benutzt ? ' · ' + g.benutzt + '× benutzt' : '') + '</small></button>'
      + '<button type="button" class="knopf" onclick="clsStarten(\'' + esc(g.id) + '\')">Starten</button></div>';
  }).join('') : '<p class="leise">Noch keine Vorlage — „Neu“ tippen.</p>';
  if (fertig.length) {
    h += '<button type="button" class="gruppe klapp" onclick="clsFertigUm()">' + (cl.cls.fertigAuf ? '▾' : '›') + ' Erledigt · ' + fertig.length + '</button>';
    if (cl.cls.fertigAuf) {
      h += fertig.map(function (g) {
        return '<button type="button" class="cls-zeile erl" onclick="clsOeffnen(\'' + esc(g.id) + '\')"><span class="tx">' + esc(g.titel)
          + '<small>abgeschlossen ' + esc(clKurzDatum(g.abgeschlossen || g.gestartet || isoDatum())) + '</small></span></button>';
      }).join('');
    }
  }
  return h;
}

/* Eine Checkliste oder Vorlage anzeigen */
function checklisteHtml(g) {
  if (cl.cls.schreiben) {
    return '<div class="schreibleiste">'
      + '<button type="button" onmousedown="event.preventDefault()" onclick="memoZeichen(\'kasten\')" aria-label="Punkt">[ ]</button>'
      + '<button type="button" onmousedown="event.preventDefault()" onclick="memoZeichen(\'h\')" aria-label="Überschrift">H</button></div>'
      + '<textarea id="memoFeld" class="memo-feld" spellcheck="true" oninput="clsTextGetippt()">' + esc(g.text) + '</textarea>';
  }
  var vorlage = g.checkliste === 'vorlage';
  var st = clsStand(g);
  var h = '<div class="cls-kopf leise">' + (vorlage ? 'Vorlage · ' + st.alle + ' Punkte'
        : (g.checkliste === 'fertig' ? 'Abgeschlossen ' + clKurzDatum(g.abgeschlossen || '') : 'Gestartet ' + clKurzDatum(g.gestartet || '')))
        + (vorlage ? '' : ' · ' + clsBalkenHtml(st)) + '</div>';
  var zeilen = String(g.text || '').split('\n');
  if (!zeilen.join('').trim()) { return h + '<p class="leise">Noch leer — „Schreiben“ tippen.</p>'; }
  zeilen.forEach(function (z, nr) {
    var a = kpAufgabe(z);
    if (a) {
      if (vorlage) {
        /* Abstand zum Stichtag (seit 0.16) als Marke statt im Text */
        var ab = clsAbstand(a.text);
        h += '<div class="aufg"><span class="k"></span><span class="tx">' + esc(ab ? ab.text : a.text) + '</span>'
           + (ab ? '<span class="plan-marke">' + esc(clsAbstandText(ab)) + '</span>' : '') + '</div>';
        return;
      }
      var lauf = g.checkliste === 'lauf';
      h += '<div class="aufg' + (a.erledigt ? ' erl' : '') + '">' + clKastenHtml(a.erledigt, 'clsHaken(\'' + esc(g.id) + '\',' + nr + ')')
         + (lauf ? '<button type="button" class="tx umbruch" onclick="clsPlanOeffnen(\'' + esc(g.id) + '\',' + nr + ')">' + esc(a.text) + '</button>'
                 : '<span class="tx">' + esc(a.text) + '</span>')
         + (lauf ? clPlanMarke(kpSeiteFinden(g.id), a) : '') + '</div>';
      return;
    }
    var m = z.match(/^\s*(#{1,3})\s+(.*)$/);
    if (m) { h += '<div class="memo-h2">' + esc(m[2]) + '</div>'; return; }
    h += z.trim() ? '<div class="memo-text">' + esc(z) + '</div>' : '';
  });
  if (g.checkliste === 'lauf' && st.alle && st.fertig === st.alle) {
    h += '<div class="knoepfe"><span class="leise">Alles erledigt.</span>'
       + '<button type="button" class="knopf voll" onclick="clsAbschliessen()">Abschließen</button></div>';
  }
  return h;
}

function checklistenHtml() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  return g ? checklisteHtml(g) : checklistenListeHtml();

function checklistenFussHtml() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;

  if (cl.cls.schreiben) { return '<button type="button" class="knopf voll" onclick="clsSchreibenUm()">Fertig</button>'; }

    + '<button type="button" class="knopf" onclick="clsSchreibenUm()">Schreiben</button>'

  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;

}

function clsHaken(id, nr) {
  var g = clsFinden(id);
  if (!g || g.checkliste === 'vorlage') { return; }
  /* Seit 0.16 über den Kern: eingeplante Punkte in Tag und Woche ziehen mit */
  if (!kpSeiteKastenUmKern(kpSeiteFinden(g.id), nr)) { return; }
  spaeterSichern();
  zeichne();
}

function clsStarten(id) {
  var v = clsFinden(id);
  if (!v || v.checkliste !== 'vorlage') { return; }
  /* Mit Abständen (@-1 …): erst nach dem Stichtag fragen */
  if (clsPlanVorschau(v.text, isoDatum()).length) {
    cl.cls.fenster = { modus: 'start', vorlage: v.id, titel: v.titel, stichtag: isoDatum() };
    cl.aufklapp = 'checkliste';
    aufklappNeu();
    return;
  }
  clsStartenMit(v, v.titel, '');
}

/* Startet eine Vorlage; mit Stichtag werden die @-Punkte eingeplant */
function clsStartenMit(v, titel, stichtag) {
  var plan = stichtag ? clsPlanVorschau(v.text, stichtag) : [];
  var g = clsNeuerSatz('lauf', titel, clsOhneAbstand(clsLeeren(v.text)), v.kontext);
  var seite = kpSeiteFinden(g.id);
  plan.forEach(function (p) { aufPlanAnwenden(seite, p.nr, p.datum, p.zeit); });
  if (stichtag) { g.stichtag = stichtag; }
  g.vorlage = v.id;
  v.benutzt = (Number(v.benutzt) || 0) + 1;
  v.geaendert = jetzt();
  spaeterSichern();
  melde('„' + g.titel + '“ gestartet' + (plan.length ? ' — ' + plan.length + ' Punkte eingeplant.' : '.'), 'gut');
  aufklappZuStill();
  clsOeffnen(g.id);
}

function clsStartOk(mitTerminen) {
  var f = clsFensterLesen();
  var v = f ? clsFinden(f.vorlage) : null;
  if (!f || !v) { aufklappZu(); return; }
  var titel = String(f.titel || '').trim();
  if (!titel) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  if (mitTerminen && !/^\d{4}-\d{2}-\d{2}$/.test(String(f.stichtag || ''))) { melde('Bitte einen Stichtag wählen.', 'warn'); return; }
  clsStartenMit(v, titel.slice(0, 200), mitTerminen ? f.stichtag : '');
}

/* ---- Termine an Checklisten-Punkten (seit 0.16) ----
   Stufe 1: Punkte einer laufenden Checkliste einplanen — derselbe Weg
   wie bei Aufgaben (Tag der Workbench), also in Heute und Kalender.
   Stufe 2: In der Vorlage steht hinter einem Punkt „@-1“, „@0 07:00“
   oder „@+2“ — der Abstand zum Stichtag, der beim Start erfragt wird. */
var CLS_ABSTAND = /^(.*\S)\s+@([+-]?\d{1,3})(?:\s+(\d{1,2}):(\d{2}))?\s*$/;

/* „Koffer packen @-1 18:00“ → { text, tage: -1, zeit: '18:00' } — sonst null */
function clsAbstand(text) {
  var m = String(text || '').match(CLS_ABSTAND);
  if (!m) { return null; }
  var tage = Number(m[2]);
  var zeit = m[3] ? (m[3].length < 2 ? '0' + m[3] : m[3]) + ':' + m[4] : '';
  if (Math.abs(tage) > 365 || (zeit && !/^([01]\d|2[0-3]):[0-5]\d$/.test(zeit))) { return null; }
  return { text: m[1], tage: tage, zeit: zeit };
}

function clsAbstandText(ab) {
  var t = ab.tage === 0 ? 'Stichtag' : (ab.tage > 0 ? '+' : '−') + Math.abs(ab.tage) + ' T.';
  return t + (ab.zeit ? ' ' + clZeitText(ab.zeit) : '');
}

/* Die Zeilen ohne „@…“ — für die laufende Checkliste */
function clsOhneAbstand(text) {
  return String(text || '').split('\n').map(function (z) {
    var a = kpAufgabe(z);
    var ab = a ? clsAbstand(a.text) : null;
    if (!ab) { return z; }
    var vorne = z.match(/^(\s*\[[ xX-]?\]\s*)/);
    return (vorne ? vorne[1] : '[] ') + ab.text;
  }).join('\n');
}

/* Was beim Start wohin kommt; Vergangenes landet auf heute */
function clsPlanVorschau(text, stichtag) {
  var heute = isoDatum();
  var aus = [];
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(stichtag || ''))) { return aus; }
  String(text || '').split('\n').forEach(function (z, nr) {
    var a = kpAufgabe(z);
    var ab = a ? clsAbstand(a.text) : null;
    if (!ab) { return; }
    var d = tagePlus(stichtag, ab.tage);
    aus.push({ nr: nr, text: ab.text, datum: d < heute ? heute : d, zeit: ab.zeit });
  });
  return aus;
}

/* Stufe 1: Fenster „Punkt einplanen“ */
function clsPlanOeffnen(id, nr) {
  var g = clsFinden(id);
  var seite = kpSeiteFinden(id);
  var a = g ? kpAufgabe(String(g.text || '').split('\n')[nr] || '') : null;
  if (!g || g.checkliste !== 'lauf' || !a || !a.text) { return; }
  var p = a.erledigt ? null : aufGeplant(seite, a.text);
  cl.cls.fenster = { modus: 'plan', punkt: nr, alt: a.text, erledigt: a.erledigt,
                     datum: p ? p.datum : '', mitZeit: !!(p && p.zeit), zeit: p ? p.zeit : '' };
  cl.aufklapp = 'checkliste';
  aufklappNeu();
}

function clsPlanZeitUm() {
  var f = clsFensterLesen();
  if (!f) { return; }
  f.mitZeit = !f.mitZeit;
  if (f.mitZeit && !f.datum) { f.datum = isoDatum(); }
  aufklappNeu();
}

function clsPlanWeg() {
  var f = clsFensterLesen();
  if (!f) { return; }
  f.datum = '';
  f.mitZeit = false;
  aufklappNeu();
}

function clsPlanOk() {
  var f = clsFensterLesen();
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!f || !g) { aufklappZu(); return; }
  var seite = kpSeiteFinden(g.id);
  var nr = aufZeileNr(seite, f.punkt, f.alt);
  if (nr < 0) { melde('Der Punkt hat sich inzwischen geändert.', 'warn'); aufklappZu(); return; }
  var datum = String(f.datum || '');
  var zeit = f.mitZeit ? String(f.zeit || '') : '';
  if (datum && (!/^\d{4}-\d{2}-\d{2}$/.test(datum) || datum < isoDatum())) { melde('Bitte heute oder einen späteren Tag wählen.', 'warn'); return; }
  if (f.mitZeit && !/^\d{2}:\d{2}$/.test(zeit)) { melde('Bitte eine Uhrzeit wählen.', 'warn'); return; }
  aufPlanAnwenden(seite, nr, datum, zeit);
  spaeterSichern();
  aufklappZu();
}

function clsSchreibenUm() {
  cl.cls.schreiben = !cl.cls.schreiben;
  zeichne();
  if (cl.cls.schreiben) {
    var f = document.getElementById('memoFeld');
    if (f && f.focus) { f.focus(); }
  }
}

function clsTextGetippt() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  var f = document.getElementById('memoFeld');
  if (!g || !f) { return; }
  g.text = String(f.value);
  g.geaendert = jetzt();
  spaeterSichern();
}

function clsAbschliessen() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g || g.checkliste !== 'lauf') { return; }
  g.checkliste = 'fertig';
  g.abgeschlossen = isoDatum();
  g.geaendert = jetzt();
  spaeterSichern();
  melde('„' + g.titel + '“ abgeschlossen.', 'gut');
  aufklappZuStill();
  clsZurListe();
}

/* Schließt ein offenes Fenster, ohne gleich alles neu zu zeichnen */
function aufklappZuStill() {
  cl.aufklapp = '';
  cl.cls.fenster = null;
}

/* ---- Fenster: Neu und Details ---- */

function clsNeu() {
  cl.cls.fenster = { modus: 'neu' };
  cl.aufklapp = 'checkliste';
  aufklappNeu();
}

function clsDetails() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g) { return; }
  cl.cls.fenster = { modus: 'details', titel: g.titel, kontext: g.kontext || 'privat' };
  cl.aufklapp = 'checkliste';
  aufklappNeu();
}

function clsFensterLesen() {
  var f = cl.cls.fenster;
  var t = document.getElementById('clsTitel');
  if (f && t && typeof t.value === 'string') { f.titel = t.value; }
  var d = document.getElementById('clsDatum');
  var z = document.getElementById('clsZeit');
  var st = document.getElementById('clsStichtag');
  if (f && f.modus === 'plan' && d && typeof d.value === 'string') { f.datum = d.value; }
  if (f && f.modus === 'plan' && f.mitZeit && z && typeof z.value === 'string') { f.zeit = z.value; }
  if (f && f.modus === 'start' && st && typeof st.value === 'string') { f.stichtag = st.value; }
  return f;
}

/* Neuer Stichtag: die Vorschau neu zeichnen */
function clsStartVorschau() {
  if (!clsFensterLesen()) { return; }
  aufklappNeu();
}

function clsKontext(k) {
  var f = clsFensterLesen();
  if (!f || (k !== 'beruflich' && k !== 'privat')) { return; }
  f.kontext = k;
  aufklappNeu();
}

function clsFensterSchritt(modus) {
  if (['neu', 'kopie', 'memo', 'loeschen', 'details'].indexOf(modus) < 0 || !cl.cls.fenster) { return; }
  clsFensterLesen();
  cl.cls.fenster.modus = modus;
  aufklappNeu();
}

function clsFensterHtml() {
  var f = cl.cls.fenster;
  if (!f) { return ''; }
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  var kopf = function (t) { return '<div class="fenster"><div class="titel">' + t + '</div><div class="rumpf">'; };
  var abbrechen = '<div class="knoepfe"><button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button></div></div></div>';

      + '<button type="button" class="wahl" onclick="clsFensterSchritt(\'memo\')">Aus einem Memo übernehmen …</button>'
      + '<button type="button" class="wahl" onclick="clsAnlegen(\'einmalig\',\'\')">Einmalige Checkliste (ohne Vorlage)</button>'
      + '<p class="leise">„Aus einem Memo“ übernimmt die Punkte und Überschriften einer Seite als neue Vorlage — das Memo bleibt, wie es ist.</p>'

    return kopf('Kopie einer Vorlage') + (v.length ? v.map(function (x) {

    }).join('') : '<p class="leise">Noch keine Vorlage.</p>') + abbrechen;
  }
  if (f.modus === 'memo') {
    var s = memoSeiten().filter(function (x) { return /\[[ xX-]?\]/.test(String(x.text || '')); });
    return kopf('Aus einem Memo') + (s.length ? s.map(function (x) {
      return '<button type="button" class="wahl" onclick="clsAnlegen(\'memo\',\'' + esc(x.id) + '\')">' + clSeitenZeichen(x) + ' ' + esc(x.titel) + '</button>';
    }).join('') : '<p class="leise">Kein Memo mit Punkten.</p>') + abbrechen;
  }
  if (f.modus === 'plan' && g) {
    return kopf('Punkt einplanen') + '<p>' + esc(f.alt) + '</p>'
      + (f.erledigt ? '<p class="leise">Der Punkt ist schon erledigt.</p>' + abbrechen
      : '<label for="clsDatum">Datum:</label><div class="zeitpaar">'
      + '<input id="clsDatum" class="eingabe" type="date" min="' + isoDatum() + '" value="' + esc(f.datum) + '">'
      + (f.datum ? '<button type="button" class="knopf" onclick="clsPlanWeg()" aria-label="nicht einplanen">✕</button>' : '') + '</div>'
      + '<div class="zeitpaar"><button type="button" class="knopf' + (f.mitZeit ? ' voll' : '') + '" onclick="clsPlanZeitUm()">Uhrzeit</button>'
      + (f.mitZeit ? '<input id="clsZeit" class="eingabe zeitfeld" type="time" value="' + esc(f.zeit) + '" aria-label="Uhrzeit">' : '') + '</div>'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="clsPlanOk()">OK</button>'
      + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button></div>'
      + '<p class="leise">Erscheint dann in „Heute“, im Kalender und im Tag der Workbench. ✕ nimmt ihn wieder heraus.</p></div></div>');
  }
  if (f.modus === 'start') {
    var v = clsFinden(f.vorlage);
    if (!v) { return ''; }
    var alle = clsStand(v).alle;
    var plan = clsPlanVorschau(v.text, f.stichtag);
    return kopf('„' + esc(v.titel) + '“ starten')
      + '<label for="clsTitel">Name:</label><input id="clsTitel" class="eingabe" type="text" autocomplete="off" value="' + esc(f.titel) + '">'
      + '<label for="clsStichtag">Stichtag:</label><input id="clsStichtag" class="eingabe" type="date" value="' + esc(f.stichtag) + '" onchange="clsStartVorschau()">'
      + '<label>Wird eingeplant (' + plan.length + ' von ' + alle + '):</label><div class="cls-vorschau">'
      + plan.map(function (p) { return '<div><b>' + esc(clPlanText(p.datum, p.zeit)) + '</b>' + esc(p.text) + '</div>'; }).join('') + '</div>'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="clsStartOk(true)">Starten</button>'
      + '<button type="button" class="knopf" onclick="clsStartOk(false)">Ohne Termine</button>'
      + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button></div>'
      + '<p class="leise">Liegt ein Tag schon zurück, wird der Punkt für heute eingeplant.</p></div></div>';
  }
  if (f.modus === 'loeschen' && g) {
    return kopf('Löschen') + '<p>„' + esc(g.titel) + '“ wirklich löschen?</p>'

      + '<button type="button" class="knopf" onclick="clsFensterSchritt(\'details\')">Abbrechen</button></div></div></div>';
  }
  if (!g) { return ''; }
  var h = kopf(g.checkliste === 'vorlage' ? 'Vorlage' : 'Checkliste')
    + '<label for="clsTitel">Name:</label><input id="clsTitel" class="eingabe" type="text" autocomplete="off" value="' + esc(f.titel) + '">'
    + '<label>Kategorie:</label><div class="wahlreihe">'
    + [['beruflich', 'Beruf'], ['privat', 'Privat']].map(function (k) {
        return '<button type="button"' + (f.kontext === k[0] ? ' class="an"' : '') + ' onclick="clsKontext(\'' + k[0] + '\')">' + k[1] + '</button>';
      }).join('') + '</div>'
    + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="clsSpeichern()">OK</button>'
    + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button></div><div class="knoepfe">';
  if (g.checkliste === 'vorlage') {
    h += '<button type="button" class="knopf" onclick="clsKopieren()">Kopieren</button>';
  } else {
    h += '<button type="button" class="knopf" onclick="clsZuruecksetzen()">Alles zurücksetzen</button>'
       + '<button type="button" class="knopf" onclick="clsAlsVorlage()">Als Vorlage speichern</button>'
       + (g.checkliste === 'lauf' ? '<button type="button" class="knopf" onclick="clsAbschliessen()">Abschließen</button>'
                                  : '<button type="button" class="knopf" onclick="clsWiederOeffnen()">Wieder öffnen</button>');
  }
  return h + '<button type="button" class="knopf" onclick="clsFensterSchritt(\'loeschen\')">Löschen…</button></div></div></div>';
}

/* Neu: leer, als Kopie, aus einem Memo oder einmalig */
function clsAnlegen(wie, quelleId) {
  var g = null;
  if (wie === 'leer') { g = clsNeuerSatz('vorlage', 'Neue Vorlage', '[] ', ''); }
  else if (wie === 'einmalig') { g = clsNeuerSatz('lauf', 'Checkliste ' + clKurzDatum(isoDatum()), '[] ', ''); }
  else if (wie === 'kopie') {
    var v = clsFinden(quelleId);
    if (v) { g = clsNeuerSatz('vorlage', 'Kopie von ' + v.titel, clsLeeren(v.text), v.kontext); }
  } else if (wie === 'memo') {
    var s = kpSeiteFinden(quelleId);
    if (s) {
      /* Nur Punkte und Überschriften — der übrige Text bleibt im Memo */
      var text = String(s.text || '').split('\n').filter(function (z) { return kpAufgabe(z) || /^\s*#{1,3}\s/.test(z); }).join('\n');
      g = clsNeuerSatz('vorlage', s.titel, clsLeeren(text), s.kontext);
    }
  }
  if (!g) { melde('Das ließ sich nicht anlegen.', 'warn'); return; }
  spaeterSichern();
  aufklappZuStill();
  cl.cls.id = g.id;
  cl.cls.schreiben = (wie === 'leer' || wie === 'einmalig');
  zeichne();
  /* Gleich den Namen vergeben */
  if (wie === 'leer' || wie === 'einmalig') { clsDetails(); }
}

function clsSpeichern() {
  var f = clsFensterLesen();
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!f || !g) { aufklappZu(); return; }
  var titel = String(f.titel || '').trim();
  if (!titel) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  g.titel = titel.slice(0, 200);
  if (f.kontext === 'beruflich' || f.kontext === 'privat') { g.kontext = f.kontext; }
  g.geaendert = jetzt();
  spaeterSichern();
  aufklappZu();
}

function clsKopieren() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g) { return; }
  clsAnlegen('kopie', g.id);
  melde('Kopie angelegt.', 'gut');
}

function clsZuruecksetzen() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g || g.checkliste === 'vorlage') { return; }
  /* Erst über den Kern zurück auf offen — eingeplante Punkte ziehen mit */
  var seite = kpSeiteFinden(g.id);
  String(g.text || '').split('\n').forEach(function (z, nr) {
    var a = kpAufgabe(z);
    if (a && a.erledigt) { kpSeiteKastenUmKern(seite, nr); }
  });
  g.text = clsLeeren(g.text);
  g.geaendert = jetzt();
  spaeterSichern();
  aufklappZu();
}

function clsAlsVorlage() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g || g.checkliste === 'vorlage') { return; }
  var v = clsNeuerSatz('vorlage', g.titel, clsLeeren(g.text), g.kontext);
  spaeterSichern();
  aufklappZu();
  melde('Als Vorlage „' + v.titel + '“ gespeichert.', 'gut');
}

function clsWiederOeffnen() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g || g.checkliste !== 'fertig') { return; }
  g.checkliste = 'lauf';
  delete g.abgeschlossen;
  g.geaendert = jetzt();
  spaeterSichern();
  aufklappZu();
}

function clsLoeschen() {
  var g = cl.cls.id ? clsFinden(cl.cls.id) : null;
  if (!g) { aufklappZu(); return; }
  /* Eingeplante Punkte erst aus Tag und Woche nehmen */
  String(g.text || '').split('\n').forEach(function (z) {
    var a = kpAufgabe(z);
    if (a && a.text) { kpEintraegeFinden(g.id, a.text).forEach(function (x) { kpAusplanenKern(x.woche.id, x.eintrag.id); }); }
  });
  DB.gedanken = (DB.gedanken || []).filter(function (x) { return x !== g; });
  grabsteinSetzen('gedanken', g.id);
  spaeterSichern();
  melde('„' + g.titel + '“ gelöscht.', null);
  aufklappZuStill();
  clsZurListe();
}

/* ---------- Sammlungen (seit 0.7) ----------

   Kleine Datenbanken im Stil von SmartList To Go: Jede Sammlung hat
   eigene Felder, Filter, eine Sortierung und auf Wunsch Gruppen mit
   Zwischensummen. Gespeichert in zwei Bereichen der workbench.json
   (seit Workbench 6.2.3), damit der Abgleich je Eintrag mischt:
     DB.sammlungen  — { id, name, art, vorlage, kontext, felder, rollen,
                        filter, gruppe, gruppenAn, sort, saetze (nur
                        Vorlagen), ordnung, geaendert }
     DB.datensaetze — { id, sammlung, werte: { feldId: Wert }, geaendert }
   art: 'budget' | 'abos' | 'buecher' | 'frei'. Die ersten drei bringen
   eigene Auswertungen mit; die „rollen“ sagen, welches Feld wofür steht. */

cl.sa = { id: '', ansicht: 'tabelle', fenster: null, wahl: {} };

var SA_FILTER_KEY = 'clie-sa-filter';
var SA_TYPEN = [['text', 'Text'], ['betrag', 'Betrag'], ['zahl', 'Zahl'], ['formel', 'Formel'], ['auswahl', 'Auswahl'],
                ['datum', 'Datum'], ['bewertung', 'Bewertung'], ['janein', 'Ja/Nein'], ['link', 'Link']];
var SA_SUMMEN = [['', 'nichts'], ['summe', 'Summe'], ['schnitt', 'Ø'], ['min', 'Min'], ['max', 'Max'], ['anzahl', 'Anzahl']];
var SA_BEDINGUNGEN = [['gleich', 'ist'], ['ungleich', 'ist nicht'], ['enthaelt', 'enthält'], ['leer', 'ist leer'],
                      ['nichtleer', 'ist nicht leer'], ['ja', 'ist ja'], ['nein', 'ist nein'],
                      ['diesesJahr', 'in diesem Jahr'], ['dieseWoche', 'in dieser Woche'], ['bald', 'in den nächsten 30 Tagen']];
var SA_TAKTE = ['monatlich', 'quartalsweise', 'halbjährlich', 'jährlich'];

}

/* ---- Zahlen und Daten ---- */

function saZahlLesen(t) {
  var s = String(t === null || t === undefined ? '' : t).replace(/[\s€]/g, '');
  if (!s) { return null; }
  if (s.indexOf(',') >= 0) { s = s.replace(/\./g, '').replace(',', '.'); }
  else if ((s.match(/\./g) || []).length > 1) { s = s.replace(/\./g, ''); }
  var n = Number(s);
  return isFinite(n) ? n : null;
}

function saZahlText(n, dez) {
  if (n === null || n === undefined || !isFinite(n)) { return ''; }
  var neg = n < 0;
  var t = Math.abs(n).toFixed(dez);
  var teile = t.split('.');
  var ganz = '';
  var i;
  for (i = 0; i < teile[0].length; i++) {
    if (i > 0 && (teile[0].length - i) % 3 === 0) { ganz += '.'; }
    ganz += teile[0].charAt(i);
  }
  return (neg ? '−' : '') + ganz + (teile[1] ? ',' + teile[1] : '');
}

function saBetragText(n) {
  if (n === null || n === undefined || !isFinite(n)) { return ''; }
  /* Ganze Euro ohne Nachkommastellen, sonst zwei */
  return saZahlText(n, (Math.round(n * 100) % 100 === 0) ? 0 : 2);
}

function saDatumText(is) {
  var m = String(is || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + '.' + m[2] + '.' + m[1] : '';
}

/* Ein Datum um n Monate verschieben (Monatsende bleibt Monatsende) */
function saMonatePlus(is, n) {
  var m = String(is || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) { return ''; }
  var j = Number(m[1]);
  var mo = Number(m[2]) - 1 + n;
  j += Math.floor(mo / 12);
  mo = ((mo % 12) + 12) % 12;
  var letzter = new Date(j, mo + 1, 0).getDate();
  var t = Math.min(Number(m[3]), letzter);
  return j + '-' + (mo < 9 ? '0' : '') + (mo + 1) + '-' + (t < 10 ? '0' : '') + t;
}

function saSterne(n) {
  var t = '';
  var i;
  for (i = 0; i < Math.max(0, Math.min(5, Math.round(n))); i++) { t += '★'; }
  return t;
}

/* ---- Links (seit 0.11) — nur http und https ---- */

function saLinkGueltig(t) { return /^https?:\/\/[^\s"'<>]+$/i.test(String(t || '').trim()); }

/* Kurz für die Liste: nur der Rechnername ohne www */
function saLinkKurz(t) {
  var m = String(t || '').match(/^https?:\/\/(?:www\.)?([^\/?#:]+)/i);
  return m ? m[1] : String(t || '').slice(0, 24);
}

function saLinkAufrufen(url) {
  if (!saLinkGueltig(url)) { melde('Das ist keine gültige Adresse (http:// oder https://).', 'warn'); return; }
  /* Ohne „noopener“ im Aufruf (sonst liefert window.open null) — die
     Verbindung zum neuen Fenster wird danach gekappt, wie beim Einkauf. */
  var fenster = window.open(String(url).trim(), '_blank');
  if (fenster) {
    try { fenster.opener = null; } catch (e) { /* fremdes Fenster */ }
  } else {
    melde('Der Link ließ sich nicht öffnen.\nBitte Pop-ups für CLIE erlauben.', 'warn');
  }
}

/* Aus der Liste: über Kennungen, nie über die Adresse im onclick */
function saLinkOeffnen(did, fid) {
  var d = saSatzFinden(did);
  if (d) { saLinkAufrufen((d.werte || {})[fid]); }
}

/* Aus dem Formular: die gerade eingetippte Adresse */
function saFormLinkOeffnen(fid) {
  saLinkAufrufen(saFeldWert('saF_' + fid));
}

/* Eine Zahl ohne überflüssige Nullen: 82 · 82,5 · 84,63 */
function saZahlKurz(n) {
  var t = saZahlText(n, 2);
  return (t.indexOf(',') >= 0) ? t.replace(/0+$/, '').replace(/,$/, '') : t;
}

/* Anzeige eines Werts in Liste und Formular */
function saWertText(f, w) {
  if (w === null || w === undefined || w === '') { return ''; }
  if (f.typ === 'formel') {
    var n = Number(w);
    if (!isFinite(n)) { return ''; }
    var t = saZahlText(n, (f.dez >= 0 && f.dez <= 3) ? f.dez : 2);
    /* Als Trend (seit 0.11): ▲ +0,2 · ▼ −0,7 · ► 0 */
    if (f.trend) { return (n > 0 ? '▲ +' : (n < 0 ? '▼ ' : '► ')) + t; }
    return (f.vorzeichen && n > 0) ? '+' + t : t;
  }
  if (f.typ === 'betrag') { return saBetragText(Number(w)); }
  if (f.typ === 'zahl') { return saZahlKurz(Number(w)); }
  if (f.typ === 'link') { return '↗ ' + saLinkKurz(w); }
  if (f.typ === 'datum') { return saDatumText(w); }
  if (f.typ === 'bewertung') { return w ? saSterne(Number(w)) : ''; }
  if (f.typ === 'janein') { return w ? 'ja' : 'nein'; }
  return String(w);
}

/* ---- Formeln (seit 0.8) ----
   Ein kleines eigenes Rechenwerk — kein eval: Zahlen, + − × ÷, Klammern
   und [Namen] von Feldern oder festen Werten der Sammlung. */

function saFormelTeile(text) {
  var teile = [];
  var s = String(text || '');
  var ops = { '+': '+', '-': '-', '−': '-', '*': '*', '×': '*', '·': '*', '/': '/', '÷': '/', ':': '/', '(': '(', ')': ')' };
  var i = 0;
  while (i < s.length) {
    var c = s.charAt(i);
    if (c === ' ' || c === '\t') { i++; continue; }
    /* vorher[Name] — der Wert im vorigen Eintrag (seit 0.11) */
    var vorher = s.slice(i).match(/^vorher\s*\[/i);
    if (c === '[' || vorher) {
      var k = vorher ? i + vorher[0].length - 1 : i;
      var j = s.indexOf(']', k);
      if (j < 0) { throw new Error('„]“ fehlt'); }
      teile.push({ art: 'name', w: s.slice(k + 1, j).trim(), vorher: !!vorher });
      i = j + 1;
      continue;
    }
    /* heute — als Tageszahl, für Tage bis oder seit einem Datum (seit 0.13) */
    if (/^heute\b/i.test(s.slice(i))) { teile.push({ art: 'heute' }); i += 5; continue; }
    var m = s.slice(i).match(/^[0-9]+([.,][0-9]+)?/);
    if (m) {
      teile.push({ art: 'zahl', w: Number(m[0].replace(',', '.')) });
      i += m[0].length;
      continue;
    }
    if (!ops[c]) { throw new Error('Zeichen „' + c + '“ ist nicht erlaubt'); }
    teile.push({ art: ops[c] });
    i++;
  }
  if (!teile.length) { throw new Error('Die Formel ist leer'); }
  return teile;
}

/* Rechnet eine Formel; wert(name) liefert Zahl oder null. Fehlt ein Wert,
   ist das Ergebnis null (leer). Falsche Schreibweise wirft einen Fehler. */
function saFormelAuswerten(text, wert) {
  var t = saFormelTeile(text);
  var p = 0;
  var rechne = function (a, o, b) {
    if (a === null || b === null) { return null; }
    if (o === '+') { return a + b; }
    if (o === '-') { return a - b; }
    if (o === '*') { return a * b; }
    return (b === 0) ? null : a / b;
  };
  var faktor;
  var term = function () {
    var a = faktor();
    while (p < t.length && (t[p].art === '*' || t[p].art === '/')) { var o = t[p++].art; a = rechne(a, o, faktor()); }
    return a;
  };
  var ausdruck = function () {
    var a = term();
    while (p < t.length && (t[p].art === '+' || t[p].art === '-')) { var o = t[p++].art; a = rechne(a, o, term()); }
    return a;
  };
  faktor = function () {
    var x = t[p];
    if (!x) { throw new Error('Die Formel endet zu früh'); }
    p++;
    if (x.art === '-') { var v = faktor(); return v === null ? null : -v; }
    if (x.art === '+') { return faktor(); }
    if (x.art === 'zahl') { return x.w; }
    if (x.art === 'heute') { return saTagNr(isoDatum()); }
    if (x.art === 'name') { return wert(x.w, !!x.vorher); }
    if (x.art === '(') {
      var r = ausdruck();
      if (!t[p] || t[p].art !== ')') { throw new Error('„)“ fehlt'); }
      p++;
      return r;
    }
    throw new Error('„' + x.art + '“ steht an falscher Stelle');
  };
  var e = ausdruck();
  if (p < t.length) { throw new Error('„' + (t[p].art === 'name' ? '[' + t[p].w + ']' : t[p].art) + '“ steht an falscher Stelle'); }
  return (e === null || !isFinite(e)) ? null : e;
}

/* Ein Datum als Tageszahl — so ergibt Datum minus Datum die Tage dazwischen (seit 0.13) */
/* Ein fester Wert zum Anzeigen: Datum als 31.12.2026, Zahl mit Einheit */
function saFesterWertText(w) {
  if (!w) { return '—'; }
  if (w.typ === 'datum') { return saDatumText(w.wert) || '—'; }
  return saZahlKurz(Number(w.wert)) + (w.einheit ? ' ' + w.einheit : '');
}

function saTagNr(is) {
  var m = String(is || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) { return null; }
  var t = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  /* Ungültiges (13. Monat, 31.02.) nicht stillschweigend weiterrechnen */
  if (t.getUTCMonth() !== Number(m[2]) - 1 || t.getUTCDate() !== Number(m[3])) { return null; }
  return Math.round(t.getTime() / 86400000);
}

/* Wert eines Namens: zuerst ein Feld des Eintrags, dann ein fester Wert */
function saNamensWert(s, d, name, ohne, tiefe) {
  var n = String(name || '').toLowerCase();
  var i;
  for (i = 0; i < (s.felder || []).length; i++) {
    var g = s.felder[i];
    if (g === ohne || String(g.name).toLowerCase() !== n) { continue; }
    if (g.typ === 'formel') { return (tiefe < 5) ? saFormelWert(s, d, g, tiefe + 1) : null; }
    var w = (d.werte || {})[g.id];
    if (g.typ === 'datum') { return saTagNr(w); }
    return (w === null || w === undefined || w === '' || typeof w === 'boolean') ? null : saZahlLesen(w);
  }
  for (i = 0; i < (s.werte || []).length; i++) {
    if (String(s.werte[i].name).toLowerCase() === n) {
      return (s.werte[i].typ === 'datum') ? saTagNr(s.werte[i].wert) : saZahlLesen(s.werte[i].wert);
    }
  }
  return null;
}

function saFormelWert(s, d, f, tiefe) {
  try {
    return saFormelAuswerten(f.formel, function (name, vorher) {
      var e = vorher ? saVorher(s, d) : d;
      /* [Sammlung: Wert] — aus einer anderen Sammlung, Stand zum Datum des Eintrags (seit 0.27) */
      if (e && saVerweisTeilen(name) && !saEigenerName(s, name)) { return saFremdZahl(name, saEintragDatum(s, e), (tiefe || 0) + 1); }
      if (!vorher) { return saNamensWert(s, d, name, f, tiefe || 0); }
      return e ? saNamensWert(s, e, name, null, (tiefe || 0) + 1) : null;
    });
  } catch (e) {
    return null;
  }
}

/* ---- Verweise auf andere Sammlungen (seit 0.27) ----
   [Sammlung: Name] in Formeln: Name ist ein Kopfwert, ein Feld oder ein
   fester Wert der anderen Sammlung. In Einträgen gilt der Stand zum Datum
   des Eintrags (beim „letzten Wert“ der letzte bis zu diesem Tag), als
   Kopfwert der aktuelle. */

function saVerweisTeilen(name) {
  var i = String(name || '').indexOf(':');
  if (i <= 0) { return null; }
  var a = String(name).slice(0, i).trim();
  var b = String(name).slice(i + 1).trim();
  return (a && b) ? { sammlung: a, wert: b } : null;
}

function saEigenerName(s, name) {
  var n = String(name || '').toLowerCase();
  return (s.felder || []).some(function (f) { return String(f.name).toLowerCase() === n; })
    || (s.werte || []).some(function (w) { return String(w.name).toLowerCase() === n; });
}

function saAlleEchten() {
  return (DB.sammlungen || []).filter(function (s) { return s && !s.vorlage; });
}

/* Datum eines Eintrags: erstes Datumsfeld, sonst Anlage */
function saEintragDatum(s, d) {
  var df = (s.felder || []).filter(function (f) { return f.typ === 'datum'; })[0];
  var w = df ? String((d.werte || {})[df.id] || '') : '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(w)) { return w; }
  var z = Number(d.angelegt || d.geaendert);
  return z ? isoDatum(new Date(z)) : isoDatum();
}

/* Zahl eines Felds in einem Eintrag (Formel gerechnet, Datum als Tageszahl) */
function saFeldZahl(s, d, f, tiefe) {
  if (f.typ === 'formel') { return (tiefe < 5) ? saFormelWert(s, d, f, tiefe) : null; }
  var w = (d.werte || {})[f.id];
  if (f.typ === 'datum') { return saTagNr(w); }
  return (w === null || w === undefined || w === '' || typeof w === 'boolean') ? null : saZahlLesen(w);
}

/* Letzter vorhandener Wert eines Felds bis einschließlich „bis“ (leer = bis heute und darüber hinaus) */
function saLetzterZahl(s, f, bis, tiefe) {
  var l = saSaetze(s).filter(function (d) { return !bis || saEintragDatum(s, d) <= bis; });
  l.sort(function (a, b) {
    var da = saEintragDatum(s, a);
    var db = saEintragDatum(s, b);
    if (da !== db) { return da < db ? -1 : 1; }
    return (Number(a.angelegt || a.geaendert) || 0) - (Number(b.angelegt || b.geaendert) || 0);
  });
  var i;
  for (i = l.length - 1; i >= 0; i--) {
    var z = saFeldZahl(s, l[i], f, tiefe);
    if (z !== null) { return z; }
  }
  return null;
}

/* Zahl eines Kopfwerts; „letzter Wert“ richtet sich nach „bis“, die übrigen nach ihrem Zeitraum */
function saKopfwertZahl(s, k, bis, tiefe) {
  if (k.art === 'wert') {
    var w = (s.werte || []).filter(function (x) { return x.id === k.wert; })[0];
    return w ? (w.typ === 'datum' ? saTagNr(w.wert) : saZahlLesen(w.wert)) : null;
  }
  if (k.art === 'fremd') { return (tiefe < 5) ? saFremdZahl(k.ref, bis, tiefe + 1) : null; }
  var l = saZeitraumListe(s, k.zeitraum || '');
  if (k.art === 'anzahl') { return l.length; }
  var f = saFeld(s, k.feld);
  if (!f) { return null; }
  if (k.art === 'letzter') { return saLetzterZahl(s, f, bis, tiefe); }
  return saAuswerten(k.art, l.map(function (d) { return saFeldZahl(s, d, f, tiefe); }));
}

function saFremdZahl(name, bis, tiefe) {
  var v = saVerweisTeilen(name);
  if (!v || tiefe > 5) { return null; }
  var sn = v.sammlung.toLowerCase();
  var s = saAlleEchten().filter(function (x) { return String(x.name).toLowerCase() === sn; })[0];
  if (!s) { return null; }
  var n = v.wert.toLowerCase();
  var k = (s.kopfwerte || []).filter(function (x) { return String(saKopfwertName(s, x)).toLowerCase() === n; })[0];
  if (k) { return saKopfwertZahl(s, k, bis, tiefe); }
  var f = (s.felder || []).filter(function (x) { return String(x.name).toLowerCase() === n; })[0];
  if (f) { return saLetzterZahl(s, f, bis, tiefe); }
  var w = (s.werte || []).filter(function (x) { return String(x.name).toLowerCase() === n; })[0];
  if (w) { return w.typ === 'datum' ? saTagNr(w.wert) : saZahlLesen(w.wert); }
  return null;
}

/* Alle Verweise, die es gibt: Kopfwerte, Zahlenfelder und feste Werte der anderen Sammlungen */
function saVerweisListe(ohne) {
  var aus = [];
  saAlleEchten().forEach(function (s) {
    if (ohne && s.id === ohne.id) { return; }
    var namen = [];
    (s.kopfwerte || []).forEach(function (k) { if (k.art !== 'fremd') { namen.push(saKopfwertName(s, k)); } });
    (s.felder || []).forEach(function (f) { if (['zahl', 'betrag', 'formel', 'datum'].indexOf(f.typ) >= 0) { namen.push(f.name); } });
    (s.werte || []).forEach(function (w) { namen.push(w.name); });
    namen.forEach(function (n) { var x = s.name + ': ' + n; if (aus.indexOf(x) < 0) { aus.push(x); } });
  });
  return aus;
}

function saVerweisBekannt(name, ohne) {
  var n = String(name || '').toLowerCase().replace(/\s*:\s*/, ': ');
  return saVerweisListe(ohne).some(function (x) { return x.toLowerCase() === n; });
}

/* Der vorige Eintrag: nach dem ersten Datumsfeld, sonst nach Anlage.
   Die Reihenfolge wird je Stand der Sammlung einmal gebildet (seit 0.11). */
var saVorherSpeicher = { schluessel: '', vor: {} };

function saVorher(s, d) {
  var l = saSaetze(s);
  var stand = l.reduce(function (n, x) { return Math.max(n, Number(x.geaendert) || 0); }, 0);
  var schluessel = s.id + ':' + l.length + ':' + stand + ':' + (Number(s.geaendert) || 0);
  if (saVorherSpeicher.schluessel !== schluessel) {
    var df = (s.felder || []).filter(function (f) { return f.typ === 'datum'; })[0];
    var zeit = function (x) { return Number(x.angelegt || x.geaendert) || 0; };
    l.sort(function (a, b) {
      var da = df ? String((a.werte || {})[df.id] || '') : '';
      var db = df ? String((b.werte || {})[df.id] || '') : '';
      if (da !== db) { return da < db ? -1 : 1; }
      return zeit(a) - zeit(b);
    });
    var vor = {};
    l.forEach(function (x, i) { vor[x.id] = i > 0 ? l[i - 1] : null; });
    saVorherSpeicher = { schluessel: schluessel, vor: vor };
  }
  return saVorherSpeicher.vor[d.id] || null;
}

/* Der Wert eines Felds — bei Formeln gerechnet */
function saRoh(s, d, f) {
  if (f.typ === 'formel') { return saFormelWert(s, d, f, 0); }
  return (d.werte || {})[f.id];
}

/* ---- Filter, Sortierung, Summen ---- */

function saFilterLaden() {
  try { cl.sa.wahl = JSON.parse(window.localStorage.getItem(SA_FILTER_KEY) || '{}') || {}; } catch (e) { cl.sa.wahl = {}; }
}

function saFilterWahl(s) {
  var w = cl.sa.wahl[s.id];
  if (w === undefined) { return (s.filter && s.filter.length && s.art === 'abos') ? s.filter[0].id : ''; }
  return (s.filter || []).some(function (f) { return f.id === w; }) ? w : '';
}

function saPasst(s, d, flt) {
  var f = saFeld(s, flt.feld);
  if (!f) { return true; }
  var w = saRoh(s, d, f);
  var leer = (w === null || w === undefined || w === '');
  var heute = isoDatum();
  switch (flt.op) {
    case 'gleich': return !leer && String(w).toLowerCase() === String(flt.wert || '').toLowerCase();
    case 'ungleich': return leer || String(w).toLowerCase() !== String(flt.wert || '').toLowerCase();
    case 'enthaelt': return !leer && String(w).toLowerCase().indexOf(String(flt.wert || '').toLowerCase()) >= 0;
    case 'leer': return leer;
    case 'nichtleer': return !leer;
    case 'ja': return !!w;
    case 'nein': return !w;
    case 'diesesJahr': return !leer && String(w).slice(0, 4) === heute.slice(0, 4);
    case 'bald': return !leer && String(w) >= heute && String(w) <= tagePlus(heute, 30);
    case 'dieseWoche': return !leer && String(w) >= montagVon(heute) && String(w) <= tagePlus(montagVon(heute), 6);
  }
  return true;
}

function saGefiltert(s) {
  var wahl = saFilterWahl(s);
  var flt = null;
  (s.filter || []).forEach(function (f) { if (f.id === wahl) { flt = f; } });
  var l = saSaetze(s).filter(function (d) { return !flt || saPasst(s, d, flt); });
  var so = s.sort || {};
  var f = so.feld ? saFeld(s, so.feld) : null;
  if (!f) { f = (s.felder || [])[0] || null; }
  if (f) {
    var zahl = saRechts(f);
    l.sort(function (a, b) {
      var x = saRoh(s, a, f);
      var y = saRoh(s, b, f);
      var lx = (x === null || x === undefined || x === '');
      var ly = (y === null || y === undefined || y === '');
      if (lx !== ly) { return lx ? 1 : -1; }   /* Leeres immer ans Ende */
      var r = zahl ? (Number(x) - Number(y)) : String(x).localeCompare(String(y), 'de');
      return so.ab ? -r : r;
    });
  }
  return l;
}

/* Die Auswertung unter einer Spalte */
function saAuswerten(art, werte) {
  var z = werte.filter(function (w) { return w !== null && w !== undefined && w !== '' && isFinite(Number(w)); }).map(Number);
  if (art === 'anzahl') { return werte.filter(function (w) { return w !== null && w !== undefined && w !== ''; }).length; }
  if (!z.length) { return null; }
  if (art === 'summe') { return z.reduce(function (a, b) { return a + b; }, 0); }
  if (art === 'schnitt') { return z.reduce(function (a, b) { return a + b; }, 0) / z.length; }
  if (art === 'min') { return Math.min.apply(null, z); }
  if (art === 'max') { return Math.max.apply(null, z); }
  return null;
}

function saAuswertungText(f, art, n) {
  if (n === null || n === undefined) { return ''; }
  if (art === 'anzahl') { return String(n); }
  if (f.typ === 'formel') { return saWertText(f, n); }
  if (art === 'schnitt' || f.typ === 'bewertung') { return saZahlText(n, 1); }
  return f.typ === 'betrag' ? saBetragText(n) : saZahlKurz(n);
}

/* ---- Abos ---- */

function saAboMonat(s, d) {
  var b = saZahlLesen(saWert(s, d, 'betrag'));
  if (b === null) { return null; }
  var m = SA_TAKT_MONATE[saWert(s, d, 'takt')] || 1;
  return b / m;
}

function saAboAktiv(s, d) { return saWert(s, d, 'status') !== 'gekündigt'; }

/* Die nächste Abbuchung ab heute — rollt mit dem Takt weiter */
function saAboNaechste(s, d) {
  var n = saWert(s, d, 'naechste');
  if (!n) { return ''; }
  var m = SA_TAKT_MONATE[saWert(s, d, 'takt')] || 1;
  var heute = isoDatum();
  var schutz = 0;
  while (n < heute && schutz < 600) { n = saMonatePlus(n, m); schutz++; }
  return n;
}

/* Kündbar bis: Laufzeitende minus Frist; eine abgelaufene Laufzeit
   verlängert sich (wie meist üblich) um je ein Jahr. */
function saAboKuendbar(s, d) {
  var l = saWert(s, d, 'laufzeit');
  if (!l) { return ''; }
  var frist = saZahlLesen(saWert(s, d, 'frist')) || 0;
  var heute = isoDatum();
  var schutz = 0;
  var kb = saMonatePlus(l, -Math.round(frist));
  while (kb < heute && schutz < 100) { l = saMonatePlus(l, 12); kb = saMonatePlus(l, -Math.round(frist)); schutz++; }
  return kb;
}

/* Hinweise: aktive Abos, die in den nächsten 30 Tagen kündbar enden */
function saHinweise() {
  var h = [];
  var heute = isoDatum();
  var grenze = tagePlus(heute, 30);
  saAlle(false).forEach(function (s) {
    if (s.art !== 'abos') { return; }
    saSaetze(s).forEach(function (d) {
      if (!saAboAktiv(s, d)) { return; }
      var kb = saAboKuendbar(s, d);
      if (kb && kb >= heute && kb <= grenze) {
        h.push({ s: s, d: d, bis: kb, name: String((d.werte || {})[(s.felder[0] || {}).id] || '') });
      }
    });
  });
  return h.sort(function (a, b) { return a.bis < b.bis ? -1 : 1; });
}

/* ---- Kennzahl einer Sammlung (Übersicht) ---- */

function saBudget(s, l) {
  var plan = 0, ist = 0;
  l.forEach(function (d) {
    plan += saZahlLesen(saWert(s, d, 'plan')) || 0;
    ist += saZahlLesen(saWert(s, d, 'ist')) || 0;
  });
  return { plan: plan, ist: ist, rest: plan - ist, proz: plan ? Math.round(ist * 100 / plan) : 0 };
}

/* Die Kennzahl rechts in der Liste: wie gewählt (seit 0.8.1), sonst nach der Vorlage */
/* Eine Kennzahl nach Wahl; null = keine Wahl getroffen */
function saKennzahlNach(s, kz, liste) {
  kz = kz || {};
  if (!kz.art) { return null; }
  var l = liste || saSaetze(s);
  if (kz.art === 'anzahl') { return String(l.length); }
  /* Aus anderer Sammlung: der aktuelle Stand (seit 0.27) */
  if (kz.art === 'fremd') { var fz = saFremdZahl(kz.ref, '', 0); return fz === null ? '—' : saZahlKurz(fz); }
  if (kz.art === 'wert') {
    var w = null;
    (s.werte || []).forEach(function (x) { if (x.id === kz.wert) { w = x; } });
    return saFesterWertText(w);
  }
  var f = kz.feld ? saFeld(s, kz.feld) : null;
  if (kz.art && f) {
    if (kz.art === 'letzter') {
      /* Der jüngste Eintrag: nach dem Datumsfeld, sonst nach Anlage (seit 0.11) */
      var df = (s.felder || []).filter(function (x) { return x.typ === 'datum'; })[0];
      var schl = function (d) { return (df ? String((d.werte || {})[df.id] || '') : '') + '|' + String(1e15 + (Number(d.angelegt || d.geaendert) || 0)); };
      var letzter = null;
      l.forEach(function (d) { if (!letzter || schl(d) > schl(letzter)) { letzter = d; } });
      return letzter ? (saWertText(f, saRoh(s, letzter, f)) || '—') : '—';
    }
    var n = saAuswerten(kz.art, l.map(function (d) { return saRoh(s, d, f); }));
    return (n === null) ? '—' : saAuswertungText(f, kz.art, n);
  }
  return null;
}

/* Kennzahl 1: wie gewählt, sonst nach der Vorlage */
function saKennzahl(s) {
  var t = saKennzahlNach(s, s.kennzahl);
  return (t === null) ? saKennzahlStandard(s) : t;
}

/* Kennzahl 2 (seit 0.11.1): nur, wenn gewählt */
function saKennzahl2(s) {
  return saKennzahlNach(s, s.kennzahl2) || '';
}

function saKennzahlStandard(s) {
  var l = saSaetze(s);
  if (s.art === 'training') { return saStunden(saTrainingWoche(s).ist) + ' h/Wo'; }
  if (s.art === 'budget') { return saBudget(s, l).proz + ' %'; }
  if (s.art === 'abos') {
    var m = 0;
    l.forEach(function (d) { if (saAboAktiv(s, d)) { m += saAboMonat(s, d) || 0; } });
    return saZahlText(m, 2) + ' €/Mon';
  }
  return String(l.length);
}

/* Die Gruppe in der Liste: frei gewählt (seit 0.8.1), sonst nach der Vorlage */
function saGruppeStandard(s) {
  var a = SA_ZEICHEN[s.art] ? s.art : 'frei';
  var i;
  for (i = 0; i < SA_ARTEN.length; i++) { if (SA_ARTEN[i][0] === a) { return SA_ARTEN[i][1]; } }
  return 'Eigene';
}

function saGruppeName(s) { return s.gruppeName || saGruppeStandard(s); }

/* Alle Gruppen: erst die der Vorlagen in fester Reihenfolge, dann eigene nach dem Alphabet */
function saGruppenNamen() {
  var fest = SA_ARTEN.map(function (a) { return a[1]; });
  var eigene = [];
  saAlle(false).forEach(function (s) {
    var g = saGruppeName(s);
    if (fest.indexOf(g) < 0 && eigene.indexOf(g) < 0) { eigene.push(g); }
  });
  eigene.sort(function (a, b) { return a.localeCompare(b, 'de'); });
  return fest.concat(eigene);
}

/* ---- Kopfwerte (seit 0.14) ----
   Bis zu 4 Werte, die oben fest über den Einträgen stehen: dieselben
   Arten wie die Kennzahl in der Liste, dazu ein Zeitraum. */

var SA_KOPF_MAX = 6;   /* seit 0.14.1 sechs (vorher vier) */
var SA_ZEITRAEUME = [['', 'alle'], ['woche', 'diese Woche'], ['monat', 'dieser Monat'], ['jahr', 'dieses Jahr'],
                     ['7', 'letzte 7 Tage'], ['30', 'letzte 30 Tage']];
var SA_KW_ARTEN = [['letzter', 'letzter Wert'], ['summe', 'Summe'], ['schnitt', 'Ø'], ['min', 'Min'], ['max', 'Max'],
                   ['anzahl', 'Anzahl der Einträge'], ['wert', 'fester Wert'], ['fremd', 'aus anderer Sammlung']];

/* Die Einträge eines Zeitraums — nach dem ersten Datumsfeld, sonst nach Anlage */
function saZeitraumListe(s, zr) {
  var l = saSaetze(s);
  if (!zr) { return l; }
  var df = (s.felder || []).filter(function (f) { return f.typ === 'datum'; })[0];
  var heute = isoDatum();
  var von;
  var bis = heute;
  if (zr === 'woche') { von = montagVon(heute); bis = tagePlus(von, 6); }
  else if (zr === 'monat') { von = heute.slice(0, 8) + '01'; bis = heute.slice(0, 8) + '31'; }
  else if (zr === 'jahr') { von = heute.slice(0, 4) + '-01-01'; bis = heute.slice(0, 4) + '-12-31'; }
  else { von = tagePlus(heute, -(Math.max(1, Number(zr) || 1) - 1)); }
  return l.filter(function (d) {
    var t = df ? String((d.werte || {})[df.id] || '') : ((d.angelegt || d.geaendert) ? isoDatum(new Date(Number(d.angelegt || d.geaendert))) : '');
    return t && t >= von && t <= bis;
  });
}

function saKopfwertText(s, k) {
  var t = saKennzahlNach(s, k, (k.art === 'wert') ? null : saZeitraumListe(s, k.zeitraum || ''));
  return (t === null || t === '') ? '—' : t;
}

/* Eine Bezeichnung, wenn keine eigene vergeben ist: „Ø kg · 30 Tage“ */
function saKopfwertName(s, k) {
  if (k.name) { return k.name; }
  var art = (SA_KW_ARTEN.filter(function (a) { return a[0] === k.art; })[0] || ['', ''])[1];
  var f = saFeld(s, k.feld);
  var w = (s.werte || []).filter(function (x) { return x.id === k.wert; })[0];
  var zr = (SA_ZEITRAEUME.filter(function (z) { return z[0] === (k.zeitraum || ''); })[0] || ['', ''])[1];
  if (k.art === 'wert') { return w ? w.name : art; }
  if (k.art === 'fremd') { return String(k.ref || '').replace(/^.*?:\s*/, '') || art; }
  return art + (k.art !== 'anzahl' && f ? ' ' + f.name : '') + (k.zeitraum ? ' · ' + zr : '');
}

function saKopfwerteHtml(s) {
  var l = (s.kopfwerte || []).slice(0, SA_KOPF_MAX);
  if (!l.length) { return ''; }
  /* Ab fünf Kacheln drei nebeneinander — der Kopf bleibt flach */
  return '<div class="sa-kw' + (l.length > 4 ? ' sa-kw3' : '') + '">' + l.map(function (k) {
    return '<div><small>' + esc(saKopfwertName(s, k)) + '</small><b>' + esc(saKopfwertText(s, k)) + '</b></div>';
  }).join('') + '</div>';
}

function saKopfListeHtml(s) {
  var h = '<p class="leise">Bis zu ' + SA_KOPF_MAX + ' Werte, die oben fest über den Einträgen stehen. Antippen zum Ändern.</p>';
  (s.kopfwerte || []).forEach(function (k, i) {
    h += '<div class="sa-feldzeile"><button type="button" class="tx" onclick="saKopfOeffnen(' + i + ')">' + esc(saKopfwertName(s, k))
       + '<small>' + esc(saKopfwertText(s, k)) + '</small></button>'
       + '<button type="button" class="knopf" onclick="saKopfSchieben(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + ' aria-label="nach oben">▲</button>'
       + '<button type="button" class="knopf" onclick="saKopfSchieben(' + i + ',1)"' + (i === s.kopfwerte.length - 1 ? ' disabled' : '') + ' aria-label="nach unten">▼</button></div>';
  });
  if (!(s.kopfwerte || []).length) { h += '<p class="leise">Noch kein Kopfwert — „+ Kopfwert“ tippen.</p>'; }
  return h;
}

function saKopfOeffnen(i) { saFensterAuf({ modus: 'kopf', nr: i }); }

function saKopfSchieben(i, r) {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s || !s.kopfwerte || !s.kopfwerte[i] || !s.kopfwerte[i + r]) { return; }
  var k = s.kopfwerte[i];
  s.kopfwerte[i] = s.kopfwerte[i + r];
  s.kopfwerte[i + r] = k;
  saGeaendert(s);
  spaeterSichern();
  zeichne();
}

function saKopfSpeichern() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  var art = saFeldWert('saKwArt');
  if (!SA_KW_ARTEN.some(function (a) { return a[0] === art; })) { melde('Bitte eine Art wählen.', 'warn'); return; }
  var feld = saFeldWert('saKwFeld');
  var wert = saFeldWert('saKwWert');
  if (art === 'wert' && !(s.werte || []).some(function (w) { return w.id === wert; })) { melde('Bitte einen festen Wert wählen.', 'warn'); return; }
  var ref = saFeldWert('saKwRef');
  if (art === 'fremd' && saVerweisListe(s).indexOf(ref) < 0) { melde('Bitte einen Wert aus einer anderen Sammlung wählen.', 'warn'); return; }
  if (art !== 'wert' && art !== 'anzahl' && art !== 'fremd' && !saFeld(s, feld)) { melde('Bitte ein Feld wählen.', 'warn'); return; }
  var zr = saFeldWert('saKwZr');
  var k = { name: String(saFeldWert('saKwName') || '').trim().slice(0, 24), art: art };
  if (art === 'wert') { k.wert = wert; } else if (art === 'fremd') { k.ref = ref; } else if (art !== 'anzahl') { k.feld = feld; }
  if (art !== 'wert' && art !== 'fremd' && SA_ZEITRAEUME.some(function (z) { return z[0] === zr; }) && zr) { k.zeitraum = zr; }
  if (!Array.isArray(s.kopfwerte)) { s.kopfwerte = []; }
  if (f.nr >= 0 && s.kopfwerte[f.nr]) { s.kopfwerte[f.nr] = k; }
  else if (s.kopfwerte.length < SA_KOPF_MAX) { s.kopfwerte.push(k); }
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

function saKopfLoeschen() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s || !s.kopfwerte) { aufklappZu(); return; }
  s.kopfwerte.splice(f.nr, 1);
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

/* ---- Zeichnen ---- */

function saListeHtml() {
  var alle = saAlle(false);
  var h = '';
  var hinweise = saHinweise();
  saGruppenNamen().forEach(function (g) {
    var l = alle.filter(function (s) { return saGruppeName(s) === g; });
    if (!l.length) { return; }
    h += '<div class="gruppe">' + esc(g) + '</div>';
    l.forEach(function (s) {
      h += '<button type="button" class="sa-zeile" onclick="saOeffnen(\'' + esc(s.id) + '\')"><span class="sa-sym">' + (SA_ZEICHEN[s.art] || '≡') + '</span>'
         + '<span class="tx">' + esc(s.name) + '</span><span class="sa-kz">' + esc(saKennzahl(s))
         + (saKennzahl2(s) ? '<small>' + esc(saKennzahl2(s)) + '</small>' : '') + '</span></button>';
    });
  });
  if (!alle.length) { h += '<p class="leise">Noch keine Sammlung — „Neu…“ tippen und eine Vorlage wählen.</p>'; }
  hinweise.forEach(function (x) {
    h += '<button type="button" class="sa-hinweis" onclick="saOeffnen(\'' + esc(x.s.id) + '\')">⚠ Abo „' + esc(x.name) + '“ — kündbar bis ' + esc(saDatumText(x.bis)) + '</button>';
  });
  return h;
}

/* Die Spalten der Tabelle: höchstens vier Felder (seit 0.11.1, vorher drei),
   bei Abos dazu „/Mon“ als letzte Spalte */
var SA_SPALTEN_MAX = 4;

function saSpalten(s) {
  var sp = (s.felder || []).filter(function (f) { return f.spalte; }).slice(0, SA_SPALTEN_MAX);
  if (!sp.length && s.felder && s.felder.length) { sp = [s.felder[0]]; }
  if (s.art === 'abos' && saFeld(s, (s.rollen || {}).betrag)) {
    sp = sp.slice(0, SA_SPALTEN_MAX - 1).concat([{ id: '_mon', name: '/Mon', typ: 'betrag', summe: '', virtuell: true }]);
  }
  return sp;
}

function saZelle(s, f, d) {
  if (f.id === '_mon') { var m = saAboMonat(s, d); return m === null ? '' : saZahlText(m, 2); }
  var t = saWertText(f, saRoh(s, d, f));
  if (s.art === 'abos' && f.id === (s.rollen || {}).betrag && t) {
    var b = saZahlLesen((d.werte || {})[f.id]);
    t = saZahlText(b, 2) + ' ' + (SA_TAKT_KURZ[saWert(s, d, 'takt')] || 'M');
  }
  /* Datum in der Liste kurz: im laufenden Jahr ohne Jahreszahl (seit 0.9.1) */
  if (f.typ === 'datum' && t && String(saRoh(s, d, f)).slice(0, 4) === isoDatum().slice(0, 4)) { t = t.slice(0, 6); }
  if (s.art === 'training' && f.id === (s.rollen || {}).ergebnis) { t = SA_ERGEBNIS[t] || t; }
  if (s.art === 'training' && f.id === (s.rollen || {}).einheit && saWert(s, d, 'sport')) { t = saWert(s, d, 'sport') + (t ? ' · ' + t : ''); }
  return t;
}

function saRechts(f) { return f.typ === 'betrag' || f.typ === 'zahl' || f.typ === 'bewertung' || f.typ === 'formel'; }

function saSummenZeile(s, sp, l, klasse, titel) {
  var werte = sp.map(function (f, i) {
    if (i === 0) { return '<td>' + esc(titel) + '</td>'; }
    var art = f.summe || '';
    if (f.id === '_mon') { art = ''; }
    var n = art ? saAuswerten(art, l.map(function (d) { return saRoh(s, d, f); })) : null;
    return '<td class="' + (saRechts(f) ? 'r' : '') + '">' + esc(saAuswertungText(f, art, n)) + '</td>';
  });
  return '<tr class="' + klasse + '">' + werte.join('') + '</tr>';
}

function saTabelleHtml(s) {
  var sp = saSpalten(s);
  var l = saGefiltert(s);
  var klasse = 'sa-tab' + ((sp[0] && sp[0].typ === 'datum') ? ' sa-dat' : '') + (sp.length >= 4 ? ' sa-vier' : '');
  /* Seit 0.14: Überschrift und Kopfwerte stehen fest, nur die Einträge scrollen.
     Zwei Tabellen mit gleichen Spaltenbreiten — so bleibt alles bündig. */
  var h = '<div class="sa-fest">' + saKopfwerteHtml(s)
    + '<table class="' + klasse + ' sa-kopf"><tr>' + sp.map(function (f) {
        return '<th class="' + (saRechts(f) ? 'r' : '') + '">' + esc(f.name) + '</th>';
      }).join('') + '</tr></table></div>'
    + '<table class="' + klasse + '">';
  var zeile = function (d) {
    return '<tr class="sa-z" onclick="saEintrag(\'' + esc(d.id) + '\')">' + sp.map(function (f) {
      if (f.typ === 'link' && saLinkGueltig((d.werte || {})[f.id])) {
        return '<td class=""><button type="button" class="sa-link" onclick="event.stopPropagation();saLinkOeffnen(\'' + esc(d.id) + '\',\'' + esc(f.id) + '\')">'
          + esc(saZelle(s, f, d)) + '</button></td>';
      }
      return '<td class="' + (saRechts(f) ? 'r' : '') + '">' + esc(saZelle(s, f, d)) + '</td>';
    }).join('') + '</tr>';
  };
  var gf = (s.gruppenAn && s.gruppe) ? saFeld(s, s.gruppe) : null;
  if (gf) {
    var namen = [];
    l.forEach(function (d) { var g = String((d.werte || {})[gf.id] || ''); if (namen.indexOf(g) < 0) { namen.push(g); } });
    var ordnung = (gf.werte || []);
    namen.sort(function (a, b) {
      var ia = ordnung.indexOf(a), ib = ordnung.indexOf(b);
      if (a === '' || b === '') { return a === '' ? 1 : -1; }
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, 'de');
    });
    namen.forEach(function (g) {
      var teil = l.filter(function (d) { return String((d.werte || {})[gf.id] || '') === g; });
      h += saSummenZeile(s, sp, teil, 'sa-gr', g || 'ohne ' + gf.name);
      h += teil.map(zeile).join('');
    });
  } else {
    h += l.map(zeile).join('');
  }
  if (!l.length) { h += '<tr><td colspan="' + sp.length + '" class="leise">Keine Einträge' + (saFilterWahl(s) ? ' für diesen Filter' : '') + '.</td></tr>'; }
  var mitSumme = sp.some(function (f, i) { return i > 0 && f.summe; });
  if (mitSumme && l.length) { h += saSummenZeile(s, sp, l, 'sa-sum', 'Σ ' + l.length); }
  return h + '</table>';
}

function saBudgetHtml(s, l) {
  var b = saBudget(s, l);
  var h = '<div class="sa-box"><div class="reihe"><span>Plan</span><span>' + saBetragText(b.plan) + ' €</span></div>'
    + '<div class="reihe"><span>Ausgegeben</span><span>' + saBetragText(b.ist) + ' €</span></div>'
    + '<div class="reihe"><span>Rest</span><span>' + saBetragText(b.rest) + ' €</span></div>'
    + '<div class="sa-balken"><i style="width:' + Math.min(100, Math.max(0, b.proz)) + '%"></i></div>'
    + '<div class="leise">' + b.proz + ' % verbraucht' + (b.rest < 0 ? ' · ' + saBetragText(-b.rest) + ' € über Plan' : '') + '</div>';
  var gf = s.gruppe ? saFeld(s, s.gruppe) : null;
  if (gf) {
    var gruppen = {};
    l.forEach(function (d) {
      var g = String((d.werte || {})[gf.id] || '');
      if (!gruppen[g]) { gruppen[g] = []; }
      gruppen[g].push(d);
    });
    Object.keys(gruppen).forEach(function (g) {
      var t = saBudget(s, gruppen[g]);
      if (t.ist > t.plan) { h += '<div class="leise">' + esc(g || 'ohne ' + gf.name) + ' +' + saBetragText(t.ist - t.plan) + ' € über Plan</div>'; }
    });
  }
  return h + '</div>';
}

function saAbosHtml(s, l) {
  var m = 0;
  var aktiv = l.filter(function (d) { return saAboAktiv(s, d); });
  aktiv.forEach(function (d) { m += saAboMonat(s, d) || 0; });
  var h = '<div class="sa-box"><div class="reihe"><span>pro Monat</span><span>' + saZahlText(m, 2) + ' €</span></div>'
    + '<div class="reihe"><span>pro Jahr</span><span>' + saZahlText(m * 12, 2) + ' €</span></div></div>';
  var heute = isoDatum();
  var bald = aktiv.map(function (d) { return { d: d, n: saAboNaechste(s, d) }; })
    .filter(function (x) { return x.n && x.n <= tagePlus(heute, 30); })
    .sort(function (a, b) { return a.n < b.n ? -1 : 1; });
  h += '<div class="abschnitt">Demnächst · 30 Tage</div>';
  h += bald.length ? bald.map(function (x) {
    var name = String((x.d.werte || {})[(s.felder[0] || {}).id] || '');
    var b = saZahlLesen(saWert(s, x.d, 'betrag'));
    return '<div class="reihe"><span>' + esc(saDatumText(x.n).slice(0, 6)) + '</span><span>' + esc(name) + (b === null ? '' : ' · ' + saZahlText(b, 2)) + '</span></div>';
  }).join('') : '<p class="leise">Keine Abbuchung.</p>';
  saHinweise().forEach(function (x) {
    if (x.s === s) { h += '<div class="sa-hinweis">⚠ ' + esc(x.name) + ' kündbar bis ' + esc(saDatumText(x.bis)) + '</div>'; }
  });
  return h;
}

function saBuecherHtml(s, l) {
  var alle = saSaetze(s);
  var jahr = isoDatum().slice(0, 4);
  var gelesen = alle.filter(function (d) { var g = saWert(s, d, 'gelesen'); return g && String(g).slice(0, 4) === jahr; });
  var noten = l.map(function (d) { return saWert(s, d, 'bewertung'); }).filter(function (w) { return Number(w) > 0; });
  var schnitt = saAuswerten('schnitt', noten);
  var lese = alle.filter(function (d) { return saWert(s, d, 'status') === 'Lese gerade'; }).length;
  var wunsch = alle.filter(function (d) { return saWert(s, d, 'status') === 'Wunschliste'; });
  var wPreis = 0;
  wunsch.forEach(function (d) { wPreis += saZahlLesen(saWert(s, d, 'preis')) || 0; });
  var h = '<div class="sa-box"><div class="reihe"><span>gelesen ' + jahr + '</span><span>' + gelesen.length + '</span></div>'
    + '<div class="reihe"><span>Ø Bewertung</span><span>' + (schnitt === null ? '—' : saZahlText(schnitt, 1)) + '</span></div>'
    + '<div class="reihe"><span>lese gerade</span><span>' + lese + '</span></div>'
    + '<div class="reihe"><span>Wunschliste</span><span>' + wunsch.length + (wPreis ? ' · ' + saBetragText(wPreis) + ' €' : '') + '</span></div></div>';
  var autoren = {};
  alle.forEach(function (d) {
    var a = String(saWert(s, d, 'autor') || '').trim();
    if (a && saWert(s, d, 'status') === 'Gelesen') { autoren[a] = (autoren[a] || 0) + 1; }
  });
  var top = Object.keys(autoren).sort(function (a, b) { return autoren[b] - autoren[a] || a.localeCompare(b, 'de'); }).slice(0, 3);
  if (top.length) {
    h += '<div class="abschnitt">Meistgelesen</div>' + top.map(function (a) { return reihe(a, String(autoren[a])); }).join('');
  }
  return h;
}

/* ---- Training (seit 0.9.1) ---- */

/* Minuten als Stunden: 330 → 5:30 */
function saStunden(min) {
  var m = Math.round(Number(min) || 0);
  return Math.floor(m / 60) + ':' + ((m % 60) < 10 ? '0' : '') + (m % 60);
}

/* Die laufende Woche (Mo–So): je Sportart Plan- und Ist-Minuten, Ist-km,
   dazu die Ergebnisse. Unabhängig vom gewählten Filter. */
function saTrainingWoche(s) {
  var von = montagVon(isoDatum());
  var bis = tagePlus(von, 6);
  var w = { sport: {}, reihe: [], plan: 0, ist: 0, erg: { geschafft: 0, teilweise: 0, ausgefallen: 0, offen: 0 } };
  saSaetze(s).forEach(function (d) {
    var dat = String(saWert(s, d, 'datum') || '');
    if (dat < von || dat > bis) { return; }
    var sp = String(saWert(s, d, 'sport') || 'ohne Sport');
    if (!w.sport[sp]) { w.sport[sp] = { plan: 0, ist: 0, km: 0 }; w.reihe.push(sp); }
    var pm = saZahlLesen(saWert(s, d, 'pmin')) || 0;
    var im = saZahlLesen(saWert(s, d, 'imin')) || 0;
    w.sport[sp].plan += pm;
    w.sport[sp].ist += im;
    w.sport[sp].km += saZahlLesen(saWert(s, d, 'ikm')) || 0;
    w.plan += pm;
    w.ist += im;
    var e = String(saWert(s, d, 'ergebnis') || '');
    if (w.erg[e] !== undefined && e !== 'offen') { w.erg[e]++; } else { w.erg.offen++; }
  });
  var f = saFeld(s, (s.rollen || {}).sport);
  var ordnung = (f && f.werte) || [];
  w.reihe.sort(function (a, b) {
    var ia = ordnung.indexOf(a), ib = ordnung.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, 'de');
  });
  return w;
}

function saTrainingHtml(s, l) {
  var w = saTrainingWoche(s);
  var h = '<div class="sa-box"><div class="leise">Diese Woche · KW ' + kalenderwoche(isoDatum()) + ' · Ist / Plan</div>';
  if (!w.reihe.length) { h += '<p class="leise">Diese Woche ist noch nichts geplant.</p>'; }
  w.reihe.forEach(function (sp) {
    var x = w.sport[sp];
    h += reihe(sp, saStunden(x.ist) + ' / ' + saStunden(x.plan) + ' h' + (x.km ? ' · ' + saZahlKurz(x.km) + ' km' : ''));
  });
  /* Balken: gegen das Wochenziel (fester Wert), sonst gegen den Plan */
  var ziel = null;
  (s.werte || []).forEach(function (x) { if (x.id === (s.rollen || {}).wochenziel) { ziel = saZahlLesen(x.wert); } });
  var soll = (ziel !== null && ziel > 0) ? ziel * 60 : w.plan;
  var proz = soll ? Math.round(w.ist * 100 / soll) : 0;
  h += '<div class="sa-balken"><i style="width:' + Math.min(100, proz) + '%"></i></div>'
     + '<div class="leise">' + saStunden(w.ist) + ' von ' + saStunden(soll) + ' h ' + ((ziel !== null && ziel > 0) ? 'Wochenziel' : 'geplant') + ' · ' + proz + ' %</div>';
  h += reihe('✓ ' + w.erg.geschafft + ' · ◐ ' + w.erg.teilweise + ' · ✗ ' + w.erg.ausgefallen + ' · offen ' + w.erg.offen, saTrainingQuote(s, l));
  return h + '</div>';
}

/* Quote: geschafft von allen bewerteten Einheiten — für den gewählten Filter */
function saTrainingQuote(s, l) {
  var g = 0, n = 0;
  l.forEach(function (d) {
    var e = saWert(s, d, 'ergebnis');
    if (e === 'geschafft' || e === 'teilweise' || e === 'ausgefallen') { n++; if (e === 'geschafft') { g++; } }
  });
  return n ? 'Quote ' + Math.round(g * 100 / n) + ' %' : '';
}

function saSammlungHtml(s) {
  if (cl.sa.ansicht === 'felder') { return saFelderHtml(s); }
  if (cl.sa.ansicht === 'filter') { return saFilterListeHtml(s); }
  if (cl.sa.ansicht === 'werte') { return saWerteHtml(s); }
  if (cl.sa.ansicht === 'kopf') { return saKopfListeHtml(s); }
  var l = saGefiltert(s);
  var h = saTabelleHtml(s);
  if ((s.werte || []).length) {
    h += '<div class="sa-box"><div class="leise">Feste Werte</div>' + s.werte.map(function (x) {
      return reihe(x.name, saFesterWertText(x));
    }).join('') + '</div>';
  }
  if (s.art === 'budget') { h += saBudgetHtml(s, l); }
  else if (s.art === 'abos') { h += saAbosHtml(s, l); }
  else if (s.art === 'buecher') { h += saBuecherHtml(s, l); }
  else if (s.art === 'training') { h += saTrainingHtml(s, l); }
  return h;
}

function saFelderHtml(s) {
  var h = '<p class="leise">Antippen zum Ändern. ▲▼ ändern die Reihenfolge.</p>';
  (s.felder || []).forEach(function (f, i) {
    var rollen = [];
    if (f.spalte) { rollen.push('Spalte'); }
    if (s.gruppe === f.id) { rollen.push('Gruppe'); }
    if ((s.filter || []).some(function (x) { return x.feld === f.id; })) { rollen.push('Filter'); }
    if (f.summe) { rollen.push((SA_SUMMEN.filter(function (x) { return x[0] === f.summe; })[0] || ['', ''])[1]); }
    if (f.standard === 'heute') { rollen.push('Neu: heute'); }
    if (f.standard === 'zuletzt') { rollen.push('Neu: wie zuletzt'); }
    if (f.standard === 'fest') { rollen.push('Neu: ' + String(f.standardWert || '')); }
    h += '<div class="sa-feldzeile"><button type="button" class="tx" onclick="saFeldOeffnen(\'' + esc(f.id) + '\')">' + esc(f.name)
       + '<small>' + esc(saTypName(f.typ)) + (f.typ === 'formel' ? ' ' + esc(f.formel || '') : '') + (rollen.length ? ' · ' + esc(rollen.join(', ')) : '') + '</small></button>'
       + '<button type="button" class="knopf" onclick="saFeldSchieben(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + ' aria-label="nach oben">▲</button>'
       + '<button type="button" class="knopf" onclick="saFeldSchieben(' + i + ',1)"' + (i === s.felder.length - 1 ? ' disabled' : '') + ' aria-label="nach unten">▼</button></div>';
  });
  return h;
}

/* Feste Werte einer Sammlung (seit 0.8) — in Formeln mit [Name] */
function saWerteHtml(s) {
  var h = '<p class="leise">Werte, die für die ganze Sammlung gelten. In Formeln mit [Name].</p>';
  (s.werte || []).forEach(function (x) {
    h += '<button type="button" class="sa-zeile" onclick="saWertOeffnen(\'' + esc(x.id) + '\')"><span class="tx">' + esc(x.name) + '</span>'
       + '<span class="sa-kz">' + esc(saFesterWertText(x)) + '</span></button>';
  });
  if (!(s.werte || []).length) { h += '<p class="leise">Noch kein fester Wert — „+ Wert“ tippen.</p>'; }
  return h;
}

function saTypName(t) {
  var i;
  for (i = 0; i < SA_TYPEN.length; i++) { if (SA_TYPEN[i][0] === t) { return SA_TYPEN[i][1]; } }
  return t;
}

function saFilterListeHtml(s) {
  var h = '<p class="leise">Diese Filter stehen oben rechts im ▼. Antippen zum Ändern.</p>';
  (s.filter || []).forEach(function (x) {
    var f = saFeld(s, x.feld);
    var b = (SA_BEDINGUNGEN.filter(function (y) { return y[0] === x.op; })[0] || ['', x.op])[1];
    h += '<button type="button" class="sa-zeile" onclick="saFilterOeffnen(\'' + esc(x.id) + '\')"><span class="tx">' + esc(x.name)
       + '<small>' + esc((f ? f.name : '?') + ' ' + b + (x.wert ? ' „' + x.wert + '“' : '')) + '</small></span></button>';
  });
  if (!(s.filter || []).length) { h += '<p class="leise">Noch kein Filter.</p>'; }
  return h;
}

function sammlungenHtml() {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  return s ? saSammlungHtml(s) : saListeHtml();
}

function sammlungenFussHtml() {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return '<button type="button" class="knopf" onclick="saNeu()">Neu…</button>'; }
  if (cl.sa.ansicht === 'felder') {
    return '<button type="button" class="knopf voll" onclick="saAnsicht(\'tabelle\')">Fertig</button>'
      + '<button type="button" class="knopf" onclick="saFeldNeu()">+ Feld</button>'
      + '<button type="button" class="knopf" onclick="saAnsicht(\'filter\')">Filter…</button>';
  }
  if (cl.sa.ansicht === 'filter') {
    return '<button type="button" class="knopf voll" onclick="saAnsicht(\'tabelle\')">Fertig</button>'
      + '<button type="button" class="knopf" onclick="saFilterOeffnen(\'\')">+ Filter</button>';
  }
  if (cl.sa.ansicht === 'werte') {
    return '<button type="button" class="knopf voll" onclick="saAnsicht(\'tabelle\')">Fertig</button>'
      + '<button type="button" class="knopf" onclick="saWertOeffnen(\'\')">+ Wert</button>';
  }
  if (cl.sa.ansicht === 'kopf') {
    return '<button type="button" class="knopf voll" onclick="saAnsicht(\'tabelle\')">Fertig</button>'
      + '<button type="button" class="knopf" onclick="saKopfOeffnen(-1)"' + ((s.kopfwerte || []).length >= SA_KOPF_MAX ? ' disabled' : '') + '>+ Kopfwert</button>';
  }
  return '<button type="button" class="knopf" onclick="saZurListe()">Fertig</button>'
    + '<button type="button" class="knopf" onclick="saEintrag(\'\')">Neu</button>'
    + (s.gruppe && saFeld(s, s.gruppe) ? '<button type="button" class="knopf' + (s.gruppenAn ? ' voll' : '') + '" onclick="saGruppenUm()">Gruppen</button>' : '')
    + '<button type="button" class="knopf" onclick="saSortOeffnen()">Sortieren</button>';
}

function saReiter() {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return 'Sammlungen'; }
  if (cl.sa.ansicht === 'felder') { return 'Felder'; }
  if (cl.sa.ansicht === 'filter') { return 'Filter'; }
  if (cl.sa.ansicht === 'werte') { return 'Feste Werte'; }
  if (cl.sa.ansicht === 'kopf') { return 'Kopfwerte'; }
  return s.name;
}

/* Der Text im ▼ oben rechts */
function saKatText() {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s || cl.sa.ansicht !== 'tabelle') { return null; }
  var w = saFilterWahl(s);
  var t = 'Alle';
  (s.filter || []).forEach(function (f) { if (f.id === w) { t = f.name; } });
  return t;
}

function saFilterAufklappHtml() {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return ''; }
  var w = saFilterWahl(s);
  return '<div class="aufklapp" style="top:49px;right:6px">'
    + '<button type="button"' + (w === '' ? ' class="an"' : '') + ' onclick="saFilterSetzen(\'\')">Alle</button>'
    + (s.filter || []).map(function (f) {
        return '<button type="button"' + (f.id === w ? ' class="an"' : '') + ' onclick="saFilterSetzen(\'' + esc(f.id) + '\')">' + esc(f.name) + '</button>';
      }).join('') + '<div class="trenn"></div><button type="button" onclick="saFilterVerwalten()">Filter bearbeiten…</button></div>';
}

function saSortAufklappHtml() {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return ''; }
  var so = s.sort || {};
  return '<div class="aufklapp" style="bottom:4px;left:6px"><div class="zw">Sortieren nach</div>'
    + (s.felder || []).map(function (f) {
        var an = (so.feld === f.id);
        return '<button type="button"' + (an ? ' class="an"' : '') + ' onclick="saSortSetzen(\'' + esc(f.id) + '\')">' + esc(f.name) + (an ? (so.ab ? ' ↓' : ' ↑') : '') + '</button>';
      }).join('') + '</div>';
}

/* ---- Bedienen ---- */

function saOeffnen(id) {
  if (!saFinden(id)) { return; }
  cl.sa.id = id;
  cl.sa.ansicht = 'tabelle';
  var el = document.getElementById('inhalt');
  if (el) { el.scrollTop = 0; }
  zeichne();
}

function saZurListe() {
  cl.sa.id = '';
  cl.sa.ansicht = 'tabelle';
  zeichne();
}

function saAnsicht(a) {
  if (['tabelle', 'felder', 'filter', 'werte', 'kopf'].indexOf(a) < 0) { return; }
  cl.sa.ansicht = a;
  cl.aufklapp = '';
  zeichne();
}

function saFilterSetzen(id) {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return; }
  cl.sa.wahl[s.id] = id;
  try { window.localStorage.setItem(SA_FILTER_KEY, JSON.stringify(cl.sa.wahl)); } catch (e) { /* nur für jetzt */ }
  cl.aufklapp = '';
  zeichne();
}

function saFilterVerwalten() { saAnsicht('filter'); }

function saGruppenUm() {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return; }
  s.gruppenAn = !s.gruppenAn;
  saGeaendert(s);
  spaeterSichern();
  zeichne();
}
