/* ---- Bestand ---- */

function saKopie(x) { return JSON.parse(JSON.stringify(x)); }

function saAlle(vorlagen) {
  return (DB.sammlungen || []).filter(function (s) {
    return s && !!s.vorlage === !!vorlagen && (vorlagen || kpPasstFilter(s, cl.filter));
  }).sort(function (a, b) { return (a.ordnung || 0) - (b.ordnung || 0) || String(a.name).localeCompare(String(b.name)); });
}

function saFinden(id) {
  var l = DB.sammlungen || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i] && l[i].id === id) { return l[i]; } }
  return null;
}

function saSaetze(s) {
  return (DB.datensaetze || []).filter(function (d) { return d && d.sammlung === s.id; });
}

function saSatzFinden(id) {
  var l = DB.datensaetze || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i] && l[i].id === id) { return l[i]; } }
  return null;
}

function saFeld(s, id) {
  var i;
  for (i = 0; i < (s.felder || []).length; i++) { if (s.felder[i].id === id) { return s.felder[i]; } }
  return null;
}

/* Wert eines Felds — nur wenn es das Feld (noch) gibt */
function saWert(s, d, rolle) {
  var id = (s.rollen || {})[rolle];
  if (!id || !saFeld(s, id)) { return null; }
  var w = (d.werte || {})[id];
  return (w === undefined) ? null : w;
}

function saGeaendert(s) { s.geaendert = jetzt(); }

/* ---- Zahlen und Daten ---- */

function saZahlLesen(t) {
  var s = String(t === null || t === undefined ? '' : t).replace(/[\s€]/g, '');
  if (!s) { return null; }
  if (s.indexOf(',') >= 0) { s = s.replace(/\./g, '').replace(',', '.'); }
  else if ((s.match(/\./g) || []).length > 1) { s = s.replace(/\./g, ''); }
  var n = Number(s);
  return isFinite(n) ? n : null;
}

function saZahlText(n, dez) {
  if (n === null || n === undefined || !isFinite(n)) { return ''; }
  var neg = n < 0;
  var t = Math.abs(n).toFixed(dez);
  var teile = t.split('.');
  var ganz = '';
  var i;
  for (i = 0; i < teile[0].length; i++) {
    if (i > 0 && (teile[0].length - i) % 3 === 0) { ganz += '.'; }
    ganz += teile[0].charAt(i);
  }
  return (neg ? '−' : '') + ganz + (teile[1] ? ',' + teile[1] : '');
}

function saBetragText(n) {
  if (n === null || n === undefined || !isFinite(n)) { return ''; }
  /* Ganze Euro ohne Nachkommastellen, sonst zwei */
  return saZahlText(n, (Math.round(n * 100) % 100 === 0) ? 0 : 2);
}

function saDatumText(is) {
  var m = String(is || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + '.' + m[2] + '.' + m[1] : '';
}

/* Ein Datum um n Monate verschieben (Monatsende bleibt Monatsende) */
function saMonatePlus(is, n) {
  var m = String(is || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) { return ''; }
  var j = Number(m[1]);
  var mo = Number(m[2]) - 1 + n;
  j += Math.floor(mo / 12);
  mo = ((mo % 12) + 12) % 12;
  var letzter = new Date(j, mo + 1, 0).getDate();
  var t = Math.min(Number(m[3]), letzter);
  return j + '-' + (mo < 9 ? '0' : '') + (mo + 1) + '-' + (t < 10 ? '0' : '') + t;
}

function saSterne(n) {
  var t = '';
  var i;
  for (i = 0; i < Math.max(0, Math.min(5, Math.round(n))); i++) { t += '★'; }
  return t;
}

/* ---- Links (seit 0.11) — nur http und https ---- */

function saLinkGueltig(t) { return /^https?:\/\/[^\s"'<>]+$/i.test(String(t || '').trim()); }

/* Kurz für die Liste: nur der Rechnername ohne www */
function saLinkKurz(t) {
  var m = String(t || '').match(/^https?:\/\/(?:www\.)?([^\/?#:]+)/i);
  return m ? m[1] : String(t || '').slice(0, 24);
}

function saLinkAufrufen(url) {
  if (!saLinkGueltig(url)) { melde('Das ist keine gültige Adresse (http:// oder https://).', 'warn'); return; }
  /* Ohne „noopener“ im Aufruf (sonst liefert window.open null) — die
     Verbindung zum neuen Fenster wird danach gekappt, wie beim Einkauf. */
  var fenster = window.open(String(url).trim(), '_blank');
  if (fenster) {
    try { fenster.opener = null; } catch (e) { /* fremdes Fenster */ }
  } else {
    melde('Der Link ließ sich nicht öffnen.\nBitte Pop-ups für CLIE erlauben.', 'warn');
  }
}

/* Aus der Liste: über Kennungen, nie über die Adresse im onclick */
function saLinkOeffnen(did, fid) {
  var d = saSatzFinden(did);
  if (d) { saLinkAufrufen((d.werte || {})[fid]); }
}

/* Aus dem Formular: die gerade eingetippte Adresse */
function saFormLinkOeffnen(fid) {
  saLinkAufrufen(saFeldWert('saF_' + fid));
}

/* Eine Zahl ohne überflüssige Nullen: 82 · 82,5 · 84,63 */
function saZahlKurz(n) {
  var t = saZahlText(n, 2);
  return (t.indexOf(',') >= 0) ? t.replace(/0+$/, '').replace(/,$/, '') : t;
}

/* Anzeige eines Werts in Liste und Formular */
function saWertText(f, w) {
  if (w === null || w === undefined || w === '') { return ''; }
  if (f.typ === 'formel') {
    var n = Number(w);
    if (!isFinite(n)) { return ''; }
    var t = saZahlText(n, (f.dez >= 0 && f.dez <= 3) ? f.dez : 2);
    /* Als Trend (seit 0.11): ▲ +0,2 · ▼ −0,7 · ► 0 */
    if (f.trend) { return (n > 0 ? '▲ +' : (n < 0 ? '▼ ' : '► ')) + t; }
    return (f.vorzeichen && n > 0) ? '+' + t : t;
  }
  if (f.typ === 'betrag') { return saBetragText(Number(w)); }
  if (f.typ === 'zahl') { return saZahlKurz(Number(w)); }
  if (f.typ === 'link') { return '↗ ' + saLinkKurz(w); }
  if (f.typ === 'datum') { return saDatumText(w); }
  if (f.typ === 'bewertung') { return w ? saSterne(Number(w)) : ''; }
  if (f.typ === 'janein') { return w ? 'ja' : 'nein'; }
  return String(w);
}

/* ---- Formeln (seit 0.8) ----
   Ein kleines eigenes Rechenwerk — kein eval: Zahlen, + − × ÷, Klammern
   und [Namen] von Feldern oder festen Werten der Sammlung. */

function saFormelTeile(text) {
  var teile = [];
  var s = String(text || '');
  var ops = { '+': '+', '-': '-', '−': '-', '*': '*', '×': '*', '·': '*', '/': '/', '÷': '/', ':': '/', '(': '(', ')': ')' };
  var i = 0;
  while (i < s.length) {
    var c = s.charAt(i);
    if (c === ' ' || c === '\t') { i++; continue; }
    /* vorher[Name] — der Wert im vorigen Eintrag (seit 0.11) */
    var vorher = s.slice(i).match(/^vorher\s*\[/i);
    if (c === '[' || vorher) {
      var k = vorher ? i + vorher[0].length - 1 : i;
      var j = s.indexOf(']', k);
      if (j < 0) { throw new Error('„]“ fehlt'); }
      teile.push({ art: 'name', w: s.slice(k + 1, j).trim(), vorher: !!vorher });
      i = j + 1;
      continue;
    }
    /* heute — als Tageszahl, für Tage bis oder seit einem Datum (seit 0.13) */
    if (/^heute\b/i.test(s.slice(i))) { teile.push({ art: 'heute' }); i += 5; continue; }
    var m = s.slice(i).match(/^[0-9]+([.,][0-9]+)?/);
    if (m) {
      teile.push({ art: 'zahl', w: Number(m[0].replace(',', '.')) });
      i += m[0].length;
      continue;
    }
    if (!ops[c]) { throw new Error('Zeichen „' + c + '“ ist nicht erlaubt'); }
    teile.push({ art: ops[c] });
    i++;
  }
  if (!teile.length) { throw new Error('Die Formel ist leer'); }
  return teile;
}

/* Rechnet eine Formel; wert(name) liefert Zahl oder null. Fehlt ein Wert,
   ist das Ergebnis null (leer). Falsche Schreibweise wirft einen Fehler. */
function saFormelAuswerten(text, wert) {
  var t = saFormelTeile(text);
  var p = 0;
  var rechne = function (a, o, b) {
    if (a === null || b === null) { return null; }
    if (o === '+') { return a + b; }
    if (o === '-') { return a - b; }
    if (o === '*') { return a * b; }
    return (b === 0) ? null : a / b;
  };
  var faktor;
  var term = function () {
    var a = faktor();
    while (p < t.length && (t[p].art === '*' || t[p].art === '/')) { var o = t[p++].art; a = rechne(a, o, faktor()); }
    return a;
  };
  var ausdruck = function () {
    var a = term();
    while (p < t.length && (t[p].art === '+' || t[p].art === '-')) { var o = t[p++].art; a = rechne(a, o, term()); }
    return a;
  };
  faktor = function () {
    var x = t[p];
    if (!x) { throw new Error('Die Formel endet zu früh'); }
    p++;
    if (x.art === '-') { var v = faktor(); return v === null ? null : -v; }
    if (x.art === '+') { return faktor(); }
    if (x.art === 'zahl') { return x.w; }
    if (x.art === 'heute') { return saTagNr(isoDatum()); }
    if (x.art === 'name') { return wert(x.w, !!x.vorher); }
    if (x.art === '(') {
      var r = ausdruck();
      if (!t[p] || t[p].art !== ')') { throw new Error('„)“ fehlt'); }
      p++;
      return r;
    }
    throw new Error('„' + x.art + '“ steht an falscher Stelle');
  };
  var e = ausdruck();
  if (p < t.length) { throw new Error('„' + (t[p].art === 'name' ? '[' + t[p].w + ']' : t[p].art) + '“ steht an falscher Stelle'); }
  return (e === null || !isFinite(e)) ? null : e;
}

/* Ein Datum als Tageszahl — so ergibt Datum minus Datum die Tage dazwischen (seit 0.13) */
/* Ein fester Wert zum Anzeigen: Datum als 31.12.2026, Zahl mit Einheit */
function saFesterWertText(w) {
  if (!w) { return '—'; }
  if (w.typ === 'datum') { return saDatumText(w.wert) || '—'; }
  return saZahlKurz(Number(w.wert)) + (w.einheit ? ' ' + w.einheit : '');
}

function saTagNr(is) {
  var m = String(is || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) { return null; }
  var t = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  /* Ungültiges (13. Monat, 31.02.) nicht stillschweigend weiterrechnen */
  if (t.getUTCMonth() !== Number(m[2]) - 1 || t.getUTCDate() !== Number(m[3])) { return null; }
  return Math.round(t.getTime() / 86400000);
}

/* Wert eines Namens: zuerst ein Feld des Eintrags, dann ein fester Wert */
function saNamensWert(s, d, name, ohne, tiefe) {
  var n = String(name || '').toLowerCase();
  var i;
  for (i = 0; i < (s.felder || []).length; i++) {
    var g = s.felder[i];
    if (g === ohne || String(g.name).toLowerCase() !== n) { continue; }
    if (g.typ === 'formel') { return (tiefe < 5) ? saFormelWert(s, d, g, tiefe + 1) : null; }
    var w = (d.werte || {})[g.id];
    if (g.typ === 'datum') { return saTagNr(w); }
    return (w === null || w === undefined || w === '' || typeof w === 'boolean') ? null : saZahlLesen(w);
  }
  for (i = 0; i < (s.werte || []).length; i++) {
    if (String(s.werte[i].name).toLowerCase() === n) {
      return (s.werte[i].typ === 'datum') ? saTagNr(s.werte[i].wert) : saZahlLesen(s.werte[i].wert);
    }
  }
  return null;
}

function saFormelWert(s, d, f, tiefe) {
  try {
    return saFormelAuswerten(f.formel, function (name, vorher) {
      if (!vorher) { return saNamensWert(s, d, name, f, tiefe || 0); }
      var v = saVorher(s, d);
      return v ? saNamensWert(s, v, name, null, (tiefe || 0) + 1) : null;
    });
  } catch (e) {
    return null;
  }
}

/* Der vorige Eintrag: nach dem ersten Datumsfeld, sonst nach Anlage.
   Die Reihenfolge wird je Stand der Sammlung einmal gebildet (seit 0.11). */
var saVorherSpeicher = { schluessel: '', vor: {} };

function saVorher(s, d) {
  var l = saSaetze(s);
  var stand = l.reduce(function (n, x) { return Math.max(n, Number(x.geaendert) || 0); }, 0);
  var schluessel = s.id + ':' + l.length + ':' + stand + ':' + (Number(s.geaendert) || 0);
  if (saVorherSpeicher.schluessel !== schluessel) {
    var df = (s.felder || []).filter(function (f) { return f.typ === 'datum'; })[0];
    var zeit = function (x) { return Number(x.angelegt || x.geaendert) || 0; };
    l.sort(function (a, b) {
      var da = df ? String((a.werte || {})[df.id] || '') : '';
      var db = df ? String((b.werte || {})[df.id] || '') : '';
      if (da !== db) { return da < db ? -1 : 1; }
      return zeit(a) - zeit(b);
    });
    var vor = {};
    l.forEach(function (x, i) { vor[x.id] = i > 0 ? l[i - 1] : null; });
    saVorherSpeicher = { schluessel: schluessel, vor: vor };
  }
  return saVorherSpeicher.vor[d.id] || null;
}

/* Der Wert eines Felds — bei Formeln gerechnet */
function saRoh(s, d, f) {
  if (f.typ === 'formel') { return saFormelWert(s, d, f, 0); }
  return (d.werte || {})[f.id];
}

/* ---- Filter, Sortierung, Summen ---- */

function saFilterLaden() {
  try { cl.sa.wahl = JSON.parse(window.localStorage.getItem(SA_FILTER_KEY) || '{}') || {}; } catch (e) { cl.sa.wahl = {}; }
}

function saFilterWahl(s) {
  var w = cl.sa.wahl[s.id];
  if (w === undefined) { return (s.filter && s.filter.length && s.art === 'abos') ? s.filter[0].id : ''; }
  return (s.filter || []).some(function (f) { return f.id === w; }) ? w : '';
}

function saPasst(s, d, flt) {
  var f = saFeld(s, flt.feld);
  if (!f) { return true; }
  var w = saRoh(s, d, f);
  var leer = (w === null || w === undefined || w === '');
  var heute = isoDatum();
  switch (flt.op) {
    case 'gleich': return !leer && String(w).toLowerCase() === String(flt.wert || '').toLowerCase();
    case 'ungleich': return leer || String(w).toLowerCase() !== String(flt.wert || '').toLowerCase();
    case 'enthaelt': return !leer && String(w).toLowerCase().indexOf(String(flt.wert || '').toLowerCase()) >= 0;
    case 'leer': return leer;
    case 'nichtleer': return !leer;
    case 'ja': return !!w;
    case 'nein': return !w;
    case 'diesesJahr': return !leer && String(w).slice(0, 4) === heute.slice(0, 4);
    case 'bald': return !leer && String(w) >= heute && String(w) <= tagePlus(heute, 30);
    case 'dieseWoche': return !leer && String(w) >= montagVon(heute) && String(w) <= tagePlus(montagVon(heute), 6);
  }
  return true;
}

function saGefiltert(s) {
  var wahl = saFilterWahl(s);
  var flt = null;
  (s.filter || []).forEach(function (f) { if (f.id === wahl) { flt = f; } });
  var l = saSaetze(s).filter(function (d) { return !flt || saPasst(s, d, flt); });
  var so = s.sort || {};
  var f = so.feld ? saFeld(s, so.feld) : null;
  if (!f) { f = (s.felder || [])[0] || null; }
  if (f) {
    var zahl = saRechts(f);
    l.sort(function (a, b) {
      var x = saRoh(s, a, f);
      var y = saRoh(s, b, f);
      var lx = (x === null || x === undefined || x === '');
      var ly = (y === null || y === undefined || y === '');
      if (lx !== ly) { return lx ? 1 : -1; }   /* Leeres immer ans Ende */
      var r = zahl ? (Number(x) - Number(y)) : String(x).localeCompare(String(y), 'de');
      return so.ab ? -r : r;
    });
  }
  return l;
}

/* Die Auswertung unter einer Spalte */
function saAuswerten(art, werte) {
  var z = werte.filter(function (w) { return w !== null && w !== undefined && w !== '' && isFinite(Number(w)); }).map(Number);
  if (art === 'anzahl') { return werte.filter(function (w) { return w !== null && w !== undefined && w !== ''; }).length; }
  if (!z.length) { return null; }
  if (art === 'summe') { return z.reduce(function (a, b) { return a + b; }, 0); }
  if (art === 'schnitt') { return z.reduce(function (a, b) { return a + b; }, 0) / z.length; }
  if (art === 'min') { return Math.min.apply(null, z); }
  if (art === 'max') { return Math.max.apply(null, z); }
  return null;
}

function saAuswertungText(f, art, n) {
  if (n === null || n === undefined) { return ''; }
  if (art === 'anzahl') { return String(n); }
  if (f.typ === 'formel') { return saWertText(f, n); }
  if (art === 'schnitt' || f.typ === 'bewertung') { return saZahlText(n, 1); }
  return f.typ === 'betrag' ? saBetragText(n) : saZahlKurz(n);
}

/* ---- Abos ---- */

function saAboMonat(s, d) {
  var b = saZahlLesen(saWert(s, d, 'betrag'));
  if (b === null) { return null; }
  var m = SA_TAKT_MONATE[saWert(s, d, 'takt')] || 1;
  return b / m;
}

function saAboAktiv(s, d) { return saWert(s, d, 'status') !== 'gekündigt'; }

/* Die nächste Abbuchung ab heute — rollt mit dem Takt weiter */
function saAboNaechste(s, d) {
  var n = saWert(s, d, 'naechste');
  if (!n) { return ''; }
  var m = SA_TAKT_MONATE[saWert(s, d, 'takt')] || 1;
  var heute = isoDatum();
  var schutz = 0;
  while (n < heute && schutz < 600) { n = saMonatePlus(n, m); schutz++; }
  return n;
}

/* Kündbar bis: Laufzeitende minus Frist; eine abgelaufene Laufzeit
   verlängert sich (wie meist üblich) um je ein Jahr. */
function saAboKuendbar(s, d) {
  var l = saWert(s, d, 'laufzeit');
  if (!l) { return ''; }
  var frist = saZahlLesen(saWert(s, d, 'frist')) || 0;
  var heute = isoDatum();
  var schutz = 0;
  var kb = saMonatePlus(l, -Math.round(frist));
  while (kb < heute && schutz < 100) { l = saMonatePlus(l, 12); kb = saMonatePlus(l, -Math.round(frist)); schutz++; }
  return kb;
}

/* Hinweise: aktive Abos, die in den nächsten 30 Tagen kündbar enden */
function saHinweise() {
  var h = [];
  var heute = isoDatum();
  var grenze = tagePlus(heute, 30);
  saAlle(false).forEach(function (s) {
    if (s.art !== 'abos') { return; }
    saSaetze(s).forEach(function (d) {
      if (!saAboAktiv(s, d)) { return; }
      var kb = saAboKuendbar(s, d);
      if (kb && kb >= heute && kb <= grenze) {
        h.push({ s: s, d: d, bis: kb, name: String((d.werte || {})[(s.felder[0] || {}).id] || '') });
      }
    });
  });
  return h.sort(function (a, b) { return a.bis < b.bis ? -1 : 1; });
}

/* ---- Kennzahl einer Sammlung (Übersicht) ---- */

function saBudget(s, l) {
  var plan = 0, ist = 0;
  l.forEach(function (d) {
    plan += saZahlLesen(saWert(s, d, 'plan')) || 0;
    ist += saZahlLesen(saWert(s, d, 'ist')) || 0;
  });
  return { plan: plan, ist: ist, rest: plan - ist, proz: plan ? Math.round(ist * 100 / plan) : 0 };
}

/* Die Kennzahl rechts in der Liste: wie gewählt (seit 0.8.1), sonst nach der Vorlage */
/* Eine Kennzahl nach Wahl; null = keine Wahl getroffen */
function saKennzahlNach(s, kz, liste) {
  kz = kz || {};
  if (!kz.art) { return null; }
  var l = liste || saSaetze(s);
  if (kz.art === 'anzahl') { return String(l.length); }
  if (kz.art === 'wert') {
    var w = null;
    (s.werte || []).forEach(function (x) { if (x.id === kz.wert) { w = x; } });
    return saFesterWertText(w);
  }
  var f = kz.feld ? saFeld(s, kz.feld) : null;
  if (kz.art && f) {
    if (kz.art === 'letzter') {
      /* Der jüngste Eintrag: nach dem Datumsfeld, sonst nach Anlage (seit 0.11) */
      var df = (s.felder || []).filter(function (x) { return x.typ === 'datum'; })[0];
      var schl = function (d) { return (df ? String((d.werte || {})[df.id] || '') : '') + '|' + String(1e15 + (Number(d.angelegt || d.geaendert) || 0)); };
      var letzter = null;
      l.forEach(function (d) { if (!letzter || schl(d) > schl(letzter)) { letzter = d; } });
      return letzter ? (saWertText(f, saRoh(s, letzter, f)) || '—') : '—';
    }
    var n = saAuswerten(kz.art, l.map(function (d) { return saRoh(s, d, f); }));
    return (n === null) ? '—' : saAuswertungText(f, kz.art, n);
  }
  return null;
}

/* Kennzahl 1: wie gewählt, sonst nach der Vorlage */
function saKennzahl(s) {
  var t = saKennzahlNach(s, s.kennzahl);
  return (t === null) ? saKennzahlStandard(s) : t;
}

/* Kennzahl 2 (seit 0.11.1): nur, wenn gewählt */
function saKennzahl2(s) {
  return saKennzahlNach(s, s.kennzahl2) || '';
}

function saKennzahlStandard(s) {
  var l = saSaetze(s);
  if (s.art === 'training') { return saStunden(saTrainingWoche(s).ist) + ' h/Wo'; }
  if (s.art === 'budget') { return saBudget(s, l).proz + ' %'; }
  if (s.art === 'abos') {
    var m = 0;
    l.forEach(function (d) { if (saAboAktiv(s, d)) { m += saAboMonat(s, d) || 0; } });
    return saZahlText(m, 2) + ' €/Mon';
  }
  return String(l.length);
}

/* Die Gruppe in der Liste: frei gewählt (seit 0.8.1), sonst nach der Vorlage */
function saGruppeStandard(s) {
  var a = SA_ZEICHEN[s.art] ? s.art : 'frei';
  var i;
  for (i = 0; i < SA_ARTEN.length; i++) { if (SA_ARTEN[i][0] === a) { return SA_ARTEN[i][1]; } }
  return 'Eigene';
}

function saGruppeName(s) { return s.gruppeName || saGruppeStandard(s); }

/* Alle Gruppen: erst die der Vorlagen in fester Reihenfolge, dann eigene nach dem Alphabet */
function saGruppenNamen() {
  var fest = SA_ARTEN.map(function (a) { return a[1]; });
  var eigene = [];
  saAlle(false).forEach(function (s) {
    var g = saGruppeName(s);
    if (fest.indexOf(g) < 0 && eigene.indexOf(g) < 0) { eigene.push(g); }
  });
  eigene.sort(function (a, b) { return a.localeCompare(b, 'de'); });
  return fest.concat(eigene);
}

/* ---- Kopfwerte (seit 0.14) ----
   Bis zu 4 Werte, die oben fest über den Einträgen stehen: dieselben
   Arten wie die Kennzahl in der Liste, dazu ein Zeitraum. */

var SA_KOPF_MAX = 6;   /* seit 0.14.1 sechs (vorher vier) */
var SA_ZEITRAEUME = [['', 'alle'], ['woche', 'diese Woche'], ['monat', 'dieser Monat'], ['jahr', 'dieses Jahr'],
                     ['7', 'letzte 7 Tage'], ['30', 'letzte 30 Tage']];
var SA_KW_ARTEN = [['letzter', 'letzter Wert'], ['summe', 'Summe'], ['schnitt', 'Ø'], ['min', 'Min'], ['max', 'Max'],
                   ['anzahl', 'Anzahl der Einträge'], ['wert', 'fester Wert']];

/* Die Einträge eines Zeitraums — nach dem ersten Datumsfeld, sonst nach Anlage */
function saZeitraumListe(s, zr) {
  var l = saSaetze(s);
  if (!zr) { return l; }
  var df = (s.felder || []).filter(function (f) { return f.typ === 'datum'; })[0];
  var heute = isoDatum();
  var von;
  var bis = heute;
  if (zr === 'woche') { von = montagVon(heute); bis = tagePlus(von, 6); }
  else if (zr === 'monat') { von = heute.slice(0, 8) + '01'; bis = heute.slice(0, 8) + '31'; }
  else if (zr === 'jahr') { von = heute.slice(0, 4) + '-01-01'; bis = heute.slice(0, 4) + '-12-31'; }
  else { von = tagePlus(heute, -(Math.max(1, Number(zr) || 1) - 1)); }
  return l.filter(function (d) {
    var t = df ? String((d.werte || {})[df.id] || '') : ((d.angelegt || d.geaendert) ? isoDatum(new Date(Number(d.angelegt || d.geaendert))) : '');
    return t && t >= von && t <= bis;
  });
}

function saKopfwertText(s, k) {
  var t = saKennzahlNach(s, k, (k.art === 'wert') ? null : saZeitraumListe(s, k.zeitraum || ''));
  return (t === null || t === '') ? '—' : t;
}

/* Eine Bezeichnung, wenn keine eigene vergeben ist: „Ø kg · 30 Tage“ */
function saKopfwertName(s, k) {
  if (k.name) { return k.name; }
  var art = (SA_KW_ARTEN.filter(function (a) { return a[0] === k.art; })[0] || ['', ''])[1];
  var f = saFeld(s, k.feld);
  var w = (s.werte || []).filter(function (x) { return x.id === k.wert; })[0];
  var zr = (SA_ZEITRAEUME.filter(function (z) { return z[0] === (k.zeitraum || ''); })[0] || ['', ''])[1];
  if (k.art === 'wert') { return w ? w.name : art; }
  return art + (k.art !== 'anzahl' && f ? ' ' + f.name : '') + (k.zeitraum ? ' · ' + zr : '');
}

function saKopfwerteHtml(s) {
  var l = (s.kopfwerte || []).slice(0, SA_KOPF_MAX);
  if (!l.length) { return ''; }
  /* Ab fünf Kacheln drei nebeneinander — der Kopf bleibt flach */
  return '<div class="sa-kw' + (l.length > 4 ? ' sa-kw3' : '') + '">' + l.map(function (k) {
    return '<div><small>' + esc(saKopfwertName(s, k)) + '</small><b>' + esc(saKopfwertText(s, k)) + '</b></div>';
  }).join('') + '</div>';
}

function saKopfListeHtml(s) {
  var h = '<p class="leise">Bis zu ' + SA_KOPF_MAX + ' Werte, die oben fest über den Einträgen stehen. Antippen zum Ändern.</p>';
  (s.kopfwerte || []).forEach(function (k, i) {
    h += '<div class="sa-feldzeile"><button type="button" class="tx" onclick="saKopfOeffnen(' + i + ')">' + esc(saKopfwertName(s, k))
       + '<small>' + esc(saKopfwertText(s, k)) + '</small></button>'
       + '<button type="button" class="knopf" onclick="saKopfSchieben(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + ' aria-label="nach oben">▲</button>'
       + '<button type="button" class="knopf" onclick="saKopfSchieben(' + i + ',1)"' + (i === s.kopfwerte.length - 1 ? ' disabled' : '') + ' aria-label="nach unten">▼</button></div>';
  });
  if (!(s.kopfwerte || []).length) { h += '<p class="leise">Noch kein Kopfwert — „+ Kopfwert“ tippen.</p>'; }
  return h;
}

function saKopfOeffnen(i) { saFensterAuf({ modus: 'kopf', nr: i }); }

function saKopfSchieben(i, r) {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s || !s.kopfwerte || !s.kopfwerte[i] || !s.kopfwerte[i + r]) { return; }
  var k = s.kopfwerte[i];
  s.kopfwerte[i] = s.kopfwerte[i + r];
  s.kopfwerte[i + r] = k;
  saGeaendert(s);
  spaeterSichern();
  zeichne();
}

function saKopfSpeichern() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  var art = saFeldWert('saKwArt');
  if (!SA_KW_ARTEN.some(function (a) { return a[0] === art; })) { melde('Bitte eine Art wählen.', 'warn'); return; }
  var feld = saFeldWert('saKwFeld');
  var wert = saFeldWert('saKwWert');
  if (art === 'wert' && !(s.werte || []).some(function (w) { return w.id === wert; })) { melde('Bitte einen festen Wert wählen.', 'warn'); return; }
  if (art !== 'wert' && art !== 'anzahl' && !saFeld(s, feld)) { melde('Bitte ein Feld wählen.', 'warn'); return; }
  var zr = saFeldWert('saKwZr');
  var k = { name: String(saFeldWert('saKwName') || '').trim().slice(0, 24), art: art };
  if (art === 'wert') { k.wert = wert; } else if (art !== 'anzahl') { k.feld = feld; }
  if (art !== 'wert' && SA_ZEITRAEUME.some(function (z) { return z[0] === zr; }) && zr) { k.zeitraum = zr; }
  if (!Array.isArray(s.kopfwerte)) { s.kopfwerte = []; }
  if (f.nr >= 0 && s.kopfwerte[f.nr]) { s.kopfwerte[f.nr] = k; }
  else if (s.kopfwerte.length < SA_KOPF_MAX) { s.kopfwerte.push(k); }
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

function saKopfLoeschen() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s || !s.kopfwerte) { aufklappZu(); return; }
  s.kopfwerte.splice(f.nr, 1);
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

/* ---- Zeichnen ---- */

function saListeHtml() {
  var alle = saAlle(false);
  var h = '';
  var hinweise = saHinweise();
  saGruppenNamen().forEach(function (g) {
    var l = alle.filter(function (s) { return saGruppeName(s) === g; });
    if (!l.length) { return; }
    h += '<div class="gruppe">' + esc(g) + '</div>';
    l.forEach(function (s) {
      h += '<button type="button" class="sa-zeile" onclick="saOeffnen(\'' + esc(s.id) + '\')"><span class="sa-sym">' + (SA_ZEICHEN[s.art] || '≡') + '</span>'
         + '<span class="tx">' + esc(s.name) + '</span><span class="sa-kz">' + esc(saKennzahl(s))
         + (saKennzahl2(s) ? '<small>' + esc(saKennzahl2(s)) + '</small>' : '') + '</span></button>';
    });
  });
  if (!alle.length) { h += '<p class="leise">Noch keine Sammlung — „Neu…“ tippen und eine Vorlage wählen.</p>'; }
  hinweise.forEach(function (x) {
    h += '<button type="button" class="sa-hinweis" onclick="saOeffnen(\'' + esc(x.s.id) + '\')">⚠ Abo „' + esc(x.name) + '“ — kündbar bis ' + esc(saDatumText(x.bis)) + '</button>';
  });
  return h;
}

/* Die Spalten der Tabelle: höchstens vier Felder (seit 0.11.1, vorher drei),
   bei Abos dazu „/Mon“ als letzte Spalte */
var SA_SPALTEN_MAX = 4;

function saSpalten(s) {
  var sp = (s.felder || []).filter(function (f) { return f.spalte; }).slice(0, SA_SPALTEN_MAX);
  if (!sp.length && s.felder && s.felder.length) { sp = [s.felder[0]]; }
  if (s.art === 'abos' && saFeld(s, (s.rollen || {}).betrag)) {
    sp = sp.slice(0, SA_SPALTEN_MAX - 1).concat([{ id: '_mon', name: '/Mon', typ: 'betrag', summe: '', virtuell: true }]);
  }
  return sp;
}

function saZelle(s, f, d) {
  if (f.id === '_mon') { var m = saAboMonat(s, d); return m === null ? '' : saZahlText(m, 2); }
  var t = saWertText(f, saRoh(s, d, f));
  if (s.art === 'abos' && f.id === (s.rollen || {}).betrag && t) {
    var b = saZahlLesen((d.werte || {})[f.id]);
    t = saZahlText(b, 2) + ' ' + (SA_TAKT_KURZ[saWert(s, d, 'takt')] || 'M');
  }
  /* Datum in der Liste kurz: im laufenden Jahr ohne Jahreszahl (seit 0.9.1) */
  if (f.typ === 'datum' && t && String(saRoh(s, d, f)).slice(0, 4) === isoDatum().slice(0, 4)) { t = t.slice(0, 6); }
  if (s.art === 'training' && f.id === (s.rollen || {}).ergebnis) { t = SA_ERGEBNIS[t] || t; }
  if (s.art === 'training' && f.id === (s.rollen || {}).einheit && saWert(s, d, 'sport')) { t = saWert(s, d, 'sport') + (t ? ' · ' + t : ''); }
  return t;
}

function saRechts(f) { return f.typ === 'betrag' || f.typ === 'zahl' || f.typ === 'bewertung' || f.typ === 'formel'; }

function saSummenZeile(s, sp, l, klasse, titel) {
  var werte = sp.map(function (f, i) {
    if (i === 0) { return '<td>' + esc(titel) + '</td>'; }
    var art = f.summe || '';
    if (f.id === '_mon') { art = ''; }
    var n = art ? saAuswerten(art, l.map(function (d) { return saRoh(s, d, f); })) : null;
    return '<td class="' + (saRechts(f) ? 'r' : '') + '">' + esc(saAuswertungText(f, art, n)) + '</td>';
  });
  return '<tr class="' + klasse + '">' + werte.join('') + '</tr>';
}

function saTabelleHtml(s) {
  var sp = saSpalten(s);
  var l = saGefiltert(s);
  var klasse = 'sa-tab' + ((sp[0] && sp[0].typ === 'datum') ? ' sa-dat' : '') + (sp.length >= 4 ? ' sa-vier' : '');
  /* Seit 0.14: Überschrift und Kopfwerte stehen fest, nur die Einträge scrollen.
     Zwei Tabellen mit gleichen Spaltenbreiten — so bleibt alles bündig. */
  var h = '<div class="sa-fest">' + saKopfwerteHtml(s)
    + '<table class="' + klasse + ' sa-kopf"><tr>' + sp.map(function (f) {
        return '<th class="' + (saRechts(f) ? 'r' : '') + '">' + esc(f.name) + '</th>';
      }).join('') + '</tr></table></div>'
    + '<table class="' + klasse + '">';
  var zeile = function (d) {
    return '<tr class="sa-z" onclick="saEintrag(\'' + esc(d.id) + '\')">' + sp.map(function (f) {
      if (f.typ === 'link' && saLinkGueltig((d.werte || {})[f.id])) {
        return '<td class=""><button type="button" class="sa-link" onclick="event.stopPropagation();saLinkOeffnen(\'' + esc(d.id) + '\',\'' + esc(f.id) + '\')">'
          + esc(saZelle(s, f, d)) + '</button></td>';
      }
      return '<td class="' + (saRechts(f) ? 'r' : '') + '">' + esc(saZelle(s, f, d)) + '</td>';
    }).join('') + '</tr>';
  };
  var gf = (s.gruppenAn && s.gruppe) ? saFeld(s, s.gruppe) : null;
  if (gf) {
    var namen = [];
    l.forEach(function (d) { var g = String((d.werte || {})[gf.id] || ''); if (namen.indexOf(g) < 0) { namen.push(g); } });
    var ordnung = (gf.werte || []);
    namen.sort(function (a, b) {
      var ia = ordnung.indexOf(a), ib = ordnung.indexOf(b);
      if (a === '' || b === '') { return a === '' ? 1 : -1; }
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, 'de');
    });
    namen.forEach(function (g) {
      var teil = l.filter(function (d) { return String((d.werte || {})[gf.id] || '') === g; });
      h += saSummenZeile(s, sp, teil, 'sa-gr', g || 'ohne ' + gf.name);
      h += teil.map(zeile).join('');
    });
  } else {
    h += l.map(zeile).join('');
  }
  if (!l.length) { h += '<tr><td colspan="' + sp.length + '" class="leise">Keine Einträge' + (saFilterWahl(s) ? ' für diesen Filter' : '') + '.</td></tr>'; }
  var mitSumme = sp.some(function (f, i) { return i > 0 && f.summe; });
  if (mitSumme && l.length) { h += saSummenZeile(s, sp, l, 'sa-sum', 'Σ ' + l.length); }
  return h + '</table>';
}

function saBudgetHtml(s, l) {
  var b = saBudget(s, l);
  var h = '<div class="sa-box"><div class="reihe"><span>Plan</span><span>' + saBetragText(b.plan) + ' €</span></div>'
    + '<div class="reihe"><span>Ausgegeben</span><span>' + saBetragText(b.ist) + ' €</span></div>'
    + '<div class="reihe"><span>Rest</span><span>' + saBetragText(b.rest) + ' €</span></div>'
    + '<div class="sa-balken"><i style="width:' + Math.min(100, Math.max(0, b.proz)) + '%"></i></div>'
    + '<div class="leise">' + b.proz + ' % verbraucht' + (b.rest < 0 ? ' · ' + saBetragText(-b.rest) + ' € über Plan' : '') + '</div>';
  var gf = s.gruppe ? saFeld(s, s.gruppe) : null;
  if (gf) {
    var gruppen = {};
    l.forEach(function (d) {
      var g = String((d.werte || {})[gf.id] || '');
      if (!gruppen[g]) { gruppen[g] = []; }
      gruppen[g].push(d);
    });
    Object.keys(gruppen).forEach(function (g) {
      var t = saBudget(s, gruppen[g]);
      if (t.ist > t.plan) { h += '<div class="leise">' + esc(g || 'ohne ' + gf.name) + ' +' + saBetragText(t.ist - t.plan) + ' € über Plan</div>'; }
    });
  }
  return h + '</div>';
}

function saAbosHtml(s, l) {
  var m = 0;
  var aktiv = l.filter(function (d) { return saAboAktiv(s, d); });
  aktiv.forEach(function (d) { m += saAboMonat(s, d) || 0; });
  var h = '<div class="sa-box"><div class="reihe"><span>pro Monat</span><span>' + saZahlText(m, 2) + ' €</span></div>'
    + '<div class="reihe"><span>pro Jahr</span><span>' + saZahlText(m * 12, 2) + ' €</span></div></div>';
  var heute = isoDatum();
  var bald = aktiv.map(function (d) { return { d: d, n: saAboNaechste(s, d) }; })
    .filter(function (x) { return x.n && x.n <= tagePlus(heute, 30); })
    .sort(function (a, b) { return a.n < b.n ? -1 : 1; });
  h += '<div class="abschnitt">Demnächst · 30 Tage</div>';
  h += bald.length ? bald.map(function (x) {
    var name = String((x.d.werte || {})[(s.felder[0] || {}).id] || '');
    var b = saZahlLesen(saWert(s, x.d, 'betrag'));
    return '<div class="reihe"><span>' + esc(saDatumText(x.n).slice(0, 6)) + '</span><span>' + esc(name) + (b === null ? '' : ' · ' + saZahlText(b, 2)) + '</span></div>';
  }).join('') : '<p class="leise">Keine Abbuchung.</p>';
  saHinweise().forEach(function (x) {
    if (x.s === s) { h += '<div class="sa-hinweis">⚠ ' + esc(x.name) + ' kündbar bis ' + esc(saDatumText(x.bis)) + '</div>'; }
  });
  return h;
}

function saBuecherHtml(s, l) {
  var alle = saSaetze(s);
  var jahr = isoDatum().slice(0, 4);
  var gelesen = alle.filter(function (d) { var g = saWert(s, d, 'gelesen'); return g && String(g).slice(0, 4) === jahr; });
  var noten = l.map(function (d) { return saWert(s, d, 'bewertung'); }).filter(function (w) { return Number(w) > 0; });
  var schnitt = saAuswerten('schnitt', noten);
  var lese = alle.filter(function (d) { return saWert(s, d, 'status') === 'Lese gerade'; }).length;
  var wunsch = alle.filter(function (d) { return saWert(s, d, 'status') === 'Wunschliste'; });
  var wPreis = 0;
  wunsch.forEach(function (d) { wPreis += saZahlLesen(saWert(s, d, 'preis')) || 0; });
  var h = '<div class="sa-box"><div class="reihe"><span>gelesen ' + jahr + '</span><span>' + gelesen.length + '</span></div>'
    + '<div class="reihe"><span>Ø Bewertung</span><span>' + (schnitt === null ? '—' : saZahlText(schnitt, 1)) + '</span></div>'
    + '<div class="reihe"><span>lese gerade</span><span>' + lese + '</span></div>'
    + '<div class="reihe"><span>Wunschliste</span><span>' + wunsch.length + (wPreis ? ' · ' + saBetragText(wPreis) + ' €' : '') + '</span></div></div>';
  var autoren = {};
  alle.forEach(function (d) {
    var a = String(saWert(s, d, 'autor') || '').trim();
    if (a && saWert(s, d, 'status') === 'Gelesen') { autoren[a] = (autoren[a] || 0) + 1; }
  });
  var top = Object.keys(autoren).sort(function (a, b) { return autoren[b] - autoren[a] || a.localeCompare(b, 'de'); }).slice(0, 3);
  if (top.length) {
    h += '<div class="abschnitt">Meistgelesen</div>' + top.map(function (a) { return reihe(a, String(autoren[a])); }).join('');
  }
  return h;
}

/* ---- Training (seit 0.9.1) ---- */

/* Minuten als Stunden: 330 → 5:30 */
function saStunden(min) {
  var m = Math.round(Number(min) || 0);
  return Math.floor(m / 60) + ':' + ((m % 60) < 10 ? '0' : '') + (m % 60);
}

/* Die laufende Woche (Mo–So): je Sportart Plan- und Ist-Minuten, Ist-km,
   dazu die Ergebnisse. Unabhängig vom gewählten Filter. */
function saTrainingWoche(s) {
  var von = montagVon(isoDatum());
  var bis = tagePlus(von, 6);
  var w = { sport: {}, reihe: [], plan: 0, ist: 0, erg: { geschafft: 0, teilweise: 0, ausgefallen: 0, offen: 0 } };
  saSaetze(s).forEach(function (d) {
    var dat = String(saWert(s, d, 'datum') || '');
    if (dat < von || dat > bis) { return; }
    var sp = String(saWert(s, d, 'sport') || 'ohne Sport');
    if (!w.sport[sp]) { w.sport[sp] = { plan: 0, ist: 0, km: 0 }; w.reihe.push(sp); }
    var pm = saZahlLesen(saWert(s, d, 'pmin')) || 0;
    var im = saZahlLesen(saWert(s, d, 'imin')) || 0;
    w.sport[sp].plan += pm;
    w.sport[sp].ist += im;
    w.sport[sp].km += saZahlLesen(saWert(s, d, 'ikm')) || 0;
    w.plan += pm;
    w.ist += im;
    var e = String(saWert(s, d, 'ergebnis') || '');
    if (w.erg[e] !== undefined && e !== 'offen') { w.erg[e]++; } else { w.erg.offen++; }
  });
  var f = saFeld(s, (s.rollen || {}).sport);
  var ordnung = (f && f.werte) || [];
  w.reihe.sort(function (a, b) {
    var ia = ordnung.indexOf(a), ib = ordnung.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, 'de');
  });
  return w;
}

function saTrainingHtml(s, l) {
  var w = saTrainingWoche(s);
  var h = '<div class="sa-box"><div class="leise">Diese Woche · KW ' + kalenderwoche(isoDatum()) + ' · Ist / Plan</div>';
  if (!w.reihe.length) { h += '<p class="leise">Diese Woche ist noch nichts geplant.</p>'; }
  w.reihe.forEach(function (sp) {
    var x = w.sport[sp];
    h += reihe(sp, saStunden(x.ist) + ' / ' + saStunden(x.plan) + ' h' + (x.km ? ' · ' + saZahlKurz(x.km) + ' km' : ''));
  });
  /* Balken: gegen das Wochenziel (fester Wert), sonst gegen den Plan */
  var ziel = null;
  (s.werte || []).forEach(function (x) { if (x.id === (s.rollen || {}).wochenziel) { ziel = saZahlLesen(x.wert); } });
  var soll = (ziel !== null && ziel > 0) ? ziel * 60 : w.plan;
  var proz = soll ? Math.round(w.ist * 100 / soll) : 0;
  h += '<div class="sa-balken"><i style="width:' + Math.min(100, proz) + '%"></i></div>'
     + '<div class="leise">' + saStunden(w.ist) + ' von ' + saStunden(soll) + ' h ' + ((ziel !== null && ziel > 0) ? 'Wochenziel' : 'geplant') + ' · ' + proz + ' %</div>';
  h += reihe('✓ ' + w.erg.geschafft + ' · ◐ ' + w.erg.teilweise + ' · ✗ ' + w.erg.ausgefallen + ' · offen ' + w.erg.offen, saTrainingQuote(s, l));
  return h + '</div>';
}

/* Quote: geschafft von allen bewerteten Einheiten — für den gewählten Filter */
function saTrainingQuote(s, l) {
  var g = 0, n = 0;
  l.forEach(function (d) {
    var e = saWert(s, d, 'ergebnis');
    if (e === 'geschafft' || e === 'teilweise' || e === 'ausgefallen') { n++; if (e === 'geschafft') { g++; } }
  });
  return n ? 'Quote ' + Math.round(g * 100 / n) + ' %' : '';
}

function saSammlungHtml(s) {
  if (cl.sa.ansicht === 'felder') { return saFelderHtml(s); }
  if (cl.sa.ansicht === 'filter') { return saFilterListeHtml(s); }
  if (cl.sa.ansicht === 'werte') { return saWerteHtml(s); }
  if (cl.sa.ansicht === 'kopf') { return saKopfListeHtml(s); }
  var l = saGefiltert(s);
  var h = saTabelleHtml(s);
  if ((s.werte || []).length) {
    h += '<div class="sa-box"><div class="leise">Feste Werte</div>' + s.werte.map(function (x) {
      return reihe(x.name, saFesterWertText(x));
    }).join('') + '</div>';
  }
  if (s.art === 'budget') { h += saBudgetHtml(s, l); }
  else if (s.art === 'abos') { h += saAbosHtml(s, l); }
  else if (s.art === 'buecher') { h += saBuecherHtml(s, l); }
  else if (s.art === 'training') { h += saTrainingHtml(s, l); }
  return h;
}

function saFelderHtml(s) {
  var h = '<p class="leise">Antippen zum Ändern. ▲▼ ändern die Reihenfolge.</p>';
  (s.felder || []).forEach(function (f, i) {
    var rollen = [];
    if (f.spalte) { rollen.push('Spalte'); }
    if (s.gruppe === f.id) { rollen.push('Gruppe'); }
    if ((s.filter || []).some(function (x) { return x.feld === f.id; })) { rollen.push('Filter'); }
    if (f.summe) { rollen.push((SA_SUMMEN.filter(function (x) { return x[0] === f.summe; })[0] || ['', ''])[1]); }
    if (f.standard === 'heute') { rollen.push('Neu: heute'); }
    if (f.standard === 'zuletzt') { rollen.push('Neu: wie zuletzt'); }
    if (f.standard === 'fest') { rollen.push('Neu: ' + String(f.standardWert || '')); }
    h += '<div class="sa-feldzeile"><button type="button" class="tx" onclick="saFeldOeffnen(\'' + esc(f.id) + '\')">' + esc(f.name)
       + '<small>' + esc(saTypName(f.typ)) + (f.typ === 'formel' ? ' ' + esc(f.formel || '') : '') + (rollen.length ? ' · ' + esc(rollen.join(', ')) : '') + '</small></button>'
       + '<button type="button" class="knopf" onclick="saFeldSchieben(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + ' aria-label="nach oben">▲</button>'
       + '<button type="button" class="knopf" onclick="saFeldSchieben(' + i + ',1)"' + (i === s.felder.length - 1 ? ' disabled' : '') + ' aria-label="nach unten">▼</button></div>';
  });
  return h;
}

/* Feste Werte einer Sammlung (seit 0.8) — in Formeln mit [Name] */
function saWerteHtml(s) {
  var h = '<p class="leise">Werte, die für die ganze Sammlung gelten. In Formeln mit [Name].</p>';

    h += '<button type="button" class="sa-zeile" onclick="saWertOeffnen(\'' + esc(x.id) + '\')"><span class="tx">' + esc(x.name) + '</span>'
       + '<span class="sa-kz">' + esc(saFesterWertText(x)) + '</span></button>';
  });

}

function saTypName(t) {
  var i;
  for (i = 0; i < SA_TYPEN.length; i++) { if (SA_TYPEN[i][0] === t) { return SA_TYPEN[i][1]; } }

}

function saFilterListeHtml(s) {

/* ---- Bedienen ---- */

function saOeffnen(id) {
  if (!saFinden(id)) { return; }
  cl.sa.id = id;
  cl.sa.ansicht = 'tabelle';
  var el = document.getElementById('inhalt');
  if (el) { el.scrollTop = 0; }
  zeichne();
}

function saZurListe() {
  cl.sa.id = '';
  cl.sa.ansicht = 'tabelle';
  zeichne();
}

function saAnsicht(a) {
  if (['tabelle', 'felder', 'filter', 'werte', 'kopf'].indexOf(a) < 0) { return; }
  cl.sa.ansicht = a;
  cl.aufklapp = '';
  zeichne();
}

function saFilterSetzen(id) {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return; }
  cl.sa.wahl[s.id] = id;
  try { window.localStorage.setItem(SA_FILTER_KEY, JSON.stringify(cl.sa.wahl)); } catch (e) { /* nur für jetzt */ }
  cl.aufklapp = '';
  zeichne();
}

function saFilterVerwalten() { saAnsicht('filter'); }

function saGruppenUm() {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return; }
  s.gruppenAn = !s.gruppenAn;
  saGeaendert(s);
  spaeterSichern();
  zeichne();
}

function saSortOeffnen() {
  cl.aufklapp = (cl.aufklapp === 'sasort') ? '' : 'sasort';
  aufklappZeichnen();
}

function saSortSetzen(feld) {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return; }
  var so = s.sort || {};
  s.sort = (so.feld === feld) ? { feld: feld, ab: !so.ab } : { feld: feld, ab: false };
  saGeaendert(s);
  spaeterSichern();
  cl.aufklapp = '';
  zeichne();
}

function saFeldSchieben(i, r) {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s || !s.felder[i] || !s.felder[i + r]) { return; }
  var f = s.felder[i];
  s.felder[i] = s.felder[i + r];
  s.felder[i + r] = f;
  saGeaendert(s);
  spaeterSichern();
  zeichne();
}

/* ---- Fenster ----
   Ein Fenster für alles: neue Sammlung, Eintrag, Feld, Filter,
   Kopieren, Details. Eingaben werden erst beim Speichern gelesen. */

function saFensterAuf(f) {
  cl.sa.fenster = f;
  cl.aufklapp = 'sa';
  aufklappNeu();
}

function saFeldWert(id) {
  var el = document.getElementById(id);
  return (el && typeof el.value === 'string') ? el.value : '';
}

function saNeu() { saFensterAuf({ modus: 'neu', quelle: '', name: '' }); }

function saNeuWahl(quelle) {
  var f = cl.sa.fenster;
  if (!f) { return; }
  f.name = saFeldWert('saName') || f.name;
  f.quelle = quelle;
  if (!f.name) {
    var v = SA_VORLAGEN[quelle] || saFinden(quelle);
    f.name = v && quelle !== 'frei' ? v.name : '';
  }
  aufklappNeu();
}

function saEintrag(id) {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return; }
  if (id && !saSatzFinden(id)) { return; }
  saFensterAuf({ modus: 'eintrag', id: id });
}

function saFeldOeffnen(id) { saFensterAuf({ modus: 'feld', id: id }); }
function saFeldNeu() { saFensterAuf({ modus: 'feld', id: '' }); }
function saFilterOeffnen(id) { saFensterAuf({ modus: 'filter', id: id }); }
function saWertOeffnen(id) { saFensterAuf({ modus: 'wert', id: id }); }

function saWertArt(art) {
  var f = cl.sa.fenster;
  if (!f || (art !== 'zahl' && art !== 'datum')) { return; }
  f.name = saFeldWert('saWertName');
  f.art = art;
  aufklappNeu();
}
function saKopierenOeffnen() { saFensterAuf({ modus: 'kopie', als: 'vorlage', mit: 'geruest' }); }
function saDetailsOeffnen() {
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!s) { return; }
  var kz = s.kennzahl || {};
  saFensterAuf({ modus: 'details', name: s.name, kontext: s.kontext || 'privat', gruppe: s.gruppeName || '',
                 kzArt: kz.art || '', kzFeld: kz.feld || ((s.felder || [])[0] || {}).id || '', kzWert: kz.wert || ((s.werte || [])[0] || {}).id || '',
                 kz2Art: (s.kennzahl2 || {}).art || '', kz2Feld: (s.kennzahl2 || {}).feld || ((s.felder || [])[0] || {}).id || '',
                 kz2Wert: (s.kennzahl2 || {}).wert || ((s.werte || [])[0] || {}).id || '' });

/* Getipptes und Gewähltes ins Fenster-Objekt, bevor neu gezeichnet wird */
function saDetailsLesen(f) {
  var el = document.getElementById('saName');
  if (el && typeof el.value === 'string') { f.name = el.value; }
  ['saGruppe:gruppe', 'saKzArt:kzArt', 'saKzFeld:kzFeld', 'saKzWert:kzWert', 'saKz2Art:kz2Art', 'saKz2Feld:kz2Feld', 'saKz2Wert:kz2Wert'].forEach(function (x) {
    var t = x.split(':');
    var e = document.getElementById(t[0]);
    if (e && typeof e.value === 'string') { f[t[1]] = e.value; }
  });
  return f;

function saFensterSchritt(modus) {
  var f = cl.sa.fenster;
  if (!f || ['loeschen', 'eintrag', 'feld', 'feld-loeschen', 'filter', 'details', 'sammlung-loeschen', 'vorlage-loeschen'].indexOf(modus) < 0) { return; }

  aufklappNeu();
}

function saKopieWahl(feld, wert) {

  f.name = saFeldWert('saName') || f.name;
  f[feld] = wert;

function saKnoepfe(innen) {

}

function saEingabeHtml(f, w) {
  var id = 'saF_' + f.id;
  var wert = (w === null || w === undefined) ? '' : w;
  if (f.typ === 'auswahl') {
    var werte = (f.werte || []).slice();
    if (wert && werte.indexOf(wert) < 0) { werte.push(wert); }
    return '<select id="' + id + '" class="eingabe"><option value=""></option>' + werte.map(function (x) {
      return '<option' + (x === wert ? ' selected' : '') + '>' + esc(x) + '</option>';
    }).join('') + '</select>';
  }
  if (f.typ === 'bewertung') {
    return '<select id="' + id + '" class="eingabe"><option value="0">—</option>' + [1, 2, 3, 4, 5].map(function (n) {
      return '<option value="' + n + '"' + (Number(wert) === n ? ' selected' : '') + '>' + saSterne(n) + '</option>';
    }).join('') + '</select>';
  }
  if (f.typ === 'janein') {
    return '<select id="' + id + '" class="eingabe"><option value="">nein</option><option value="1"' + (wert ? ' selected' : '') + '>ja</option></select>';
  }
  if (f.typ === 'datum') { return '<input id="' + id + '" class="eingabe" type="date" value="' + esc(wert) + '">'; }
  if (f.typ === 'link') {
    return '<div class="sa-linkzeile"><input id="' + id + '" class="eingabe" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://…" value="' + esc(wert) + '">'
      + '<button type="button" class="knopf" onclick="saFormLinkOeffnen(\'' + esc(f.id) + '\')">↗ Öffnen</button></div>';
  }
  if (f.typ === 'betrag' || f.typ === 'zahl') {

    return '<input id="' + id + '" class="eingabe" type="text" inputmode="decimal" autocomplete="off" value="' + esc(t) + '">';
  }
  return '<input id="' + id + '" class="eingabe" type="text" autocomplete="off" value="' + esc(wert) + '">';

  if (f.modus === 'vorlage-loeschen') {
    var vl = saFinden(f.id);
    return kopf('Vorlage löschen') + '<p>Vorlage „' + esc(vl ? vl.name : '') + '“ löschen? Sammlungen daraus bleiben.</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saVorlageLoeschen()">Löschen</button><button type="button" class="knopf" onclick="saNeu()">Abbrechen</button>');
  }

  if (!s) { return ''; }

  if (f.modus === 'eintrag') {
    var d = f.id ? saSatzFinden(f.id) : null;
    /* Neu: mit den Standardwerten der Felder vorbelegt (seit 0.8) */
    var werte = d ? (d.werte || {}) : saStandardWerte(s);
    var e = kopf(d ? s.name : 'Neu · ' + s.name);
    (s.felder || []).forEach(function (fe) {
      if (fe.typ === 'formel') {
        /* Formeln tippt man nicht ein — sie werden gerechnet */
        if (d) { e += reihe('→ ' + fe.name, saWertText(fe, saRoh(s, d, fe)) || '—'); }
        return;
      }
      e += '<label for="saF_' + esc(fe.id) + '">' + esc(fe.name) + ':</label>' + saEingabeHtml(fe, werte[fe.id]);
    });
    if (s.art === 'abos' && d) {
      var kb = saAboKuendbar(s, d);
      var mo = saAboMonat(s, d);
      if (kb) { e += reihe('→ kündbar bis', saDatumText(kb)); }
      if (mo !== null) { e += reihe('→ pro Monat', saZahlText(mo, 2) + ' €'); }
    }
    return e + saKnoepfe('<button type="button" class="knopf voll" onclick="saEintragSpeichern()">Fertig</button>' + abbrechen
      + (d ? '<button type="button" class="knopf" onclick="saEintragKopieren()">Kopieren</button>'
           + '<button type="button" class="knopf" onclick="saFensterSchritt(\'loeschen\')">Löschen…</button>' : ''));
  }

  if (f.modus === 'loeschen') {
    return kopf('Löschen') + '<p>Diesen Eintrag wirklich löschen?</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saEintragLoeschen()">Löschen</button>'
        + '<button type="button" class="knopf" onclick="saFensterSchritt(\'eintrag\')">Abbrechen</button>');
  }

  if (f.modus === 'feld') {
    var fe2 = f.id ? saFeld(s, f.id) : null;
    var x = fe2 || { name: '', typ: 'text', spalte: false, summe: '', werte: [] };
    var spalten = (s.felder || []).filter(function (y) { return y.spalte && y !== fe2; }).length;
    var g = kopf(fe2 ? 'Feld „' + fe2.name + '“' : 'Neues Feld')
      + '<label for="saFeldName">Name:</label><input id="saFeldName" class="eingabe" type="text" autocomplete="off" value="' + esc(x.name) + '">'
      + '<label for="saFeldTyp">Typ:</label><select id="saFeldTyp" class="eingabe">' + SA_TYPEN.map(function (t) {
          return '<option value="' + t[0] + '"' + (t[0] === x.typ ? ' selected' : '') + '>' + t[1] + '</option>';
        }).join('') + '</select>'
      + '<label for="saFeldWerte">Werte (nur bei Auswahl, je Zeile einer):</label>'
      + '<textarea id="saFeldWerte" class="eingabe" rows="3">' + esc((x.werte || []).join('\n')) + '</textarea>'
      + '<label class="haken"><input id="saFeldSpalte" type="checkbox"' + (x.spalte ? ' checked' : '') + (!x.spalte && spalten >= SA_SPALTEN_MAX ? ' disabled' : '') + '> als Spalte in der Liste' + (!x.spalte && spalten >= SA_SPALTEN_MAX ? ' (schon ' + SA_SPALTEN_MAX + ')' : '') + '</label>'
      + '<label class="haken"><input id="saFeldGruppe" type="checkbox"' + (fe2 && s.gruppe === fe2.id ? ' checked' : '') + '> danach gruppieren</label>'
      + '<label for="saFeldSumme">Darunter (bei Zahlen):</label><select id="saFeldSumme" class="eingabe">' + SA_SUMMEN.map(function (t) {
          return '<option value="' + t[0] + '"' + (t[0] === (x.summe || '') ? ' selected' : '') + '>' + t[1] + '</option>';
        }).join('') + '</select>'
      /* Formel (seit 0.8) */
      + '<label for="saFeldFormel">Formel (nur bei Typ Formel):</label>'
      + '<input id="saFeldFormel" class="eingabe sa-formel" type="text" autocomplete="off" spellcheck="false" value="' + esc(x.formel || '') + '">'
      + '<p class="leise sa-formel">Erlaubt: + − × ÷ ( ) und Zahlen. Namen: ' + esc(saFormelNamen(s, fe2).join(' '))
      + '. vorher[Name] = Wert im vorigen Eintrag, z. B. [kg] - vorher[kg]. Daten zählen in Tagen, heute = heutiges Datum, z. B. [Ziel] - heute</p>'
      + '<label for="saFeldDez">Nachkommastellen:</label><select id="saFeldDez" class="eingabe">' + [0, 1, 2, 3].map(function (n) {
          return '<option value="' + n + '"' + (n === ((x.dez >= 0 && x.dez <= 3) ? x.dez : 2) ? ' selected' : '') + '>' + n + '</option>';
        }).join('') + '</select>'
      + '<label class="haken"><input id="saFeldVz" type="checkbox"' + (x.vorzeichen ? ' checked' : '') + '> mit Vorzeichen (+2,6)</label>'
      + '<label class="haken"><input id="saFeldTrend" type="checkbox"' + (x.trend ? ' checked' : '') + '> als Trend ▲ ▼ ►</label>'
      /* Standardwert bei Neu (seit 0.8) */
      + '<label for="saFeldStd">Bei Neu:</label><select id="saFeldStd" class="eingabe">'
      + [['', 'leer'], ['heute', 'heute (nur Datum)'], ['fest', 'fester Wert'], ['zuletzt', 'wie zuletzt']].map(function (t) {
          return '<option value="' + t[0] + '"' + (t[0] === (x.standard || '') ? ' selected' : '') + '>' + t[1] + '</option>';
        }).join('') + '</select>'
      + '<label for="saFeldStdWert">Fester Wert bei Neu:</label>'
      + '<input id="saFeldStdWert" class="eingabe" type="text" autocomplete="off" value="' + esc(x.standardWert || '') + '">';
    return g + saKnoepfe('<button type="button" class="knopf voll" onclick="saFeldSpeichern()">OK</button>' + abbrechen
      + (fe2 ? '<button type="button" class="knopf" onclick="saFensterSchritt(\'feld-loeschen\')">Feld löschen…</button>' : ''));
  }

  if (f.modus === 'wert') {
    var fw = null;
    (s.werte || []).forEach(function (y) { if (y.id === f.id) { fw = y; } });
    var wv = fw || { name: '', wert: '', einheit: '' };
    /* Art: Zahl oder Datum (seit 0.13) — die Wahl im Fenster gilt vor dem Gespeicherten */
    var art = f.art || (wv.typ === 'datum' ? 'datum' : 'zahl');
    var name = (f.name !== undefined) ? f.name : wv.name;
    return kopf(fw ? 'Fester Wert' : 'Neuer fester Wert')
      + '<label for="saWertName">Name:</label><input id="saWertName" class="eingabe" type="text" autocomplete="off" value="' + esc(name) + '">'
      + '<label>Art:</label><div class="wahlreihe">'
      + [['zahl', 'Zahl'], ['datum', 'Datum']].map(function (a) {
          return '<button type="button"' + (art === a[0] ? ' class="an"' : '') + ' onclick="saWertArt(\'' + a[0] + '\')">' + a[1] + '</button>';
        }).join('') + '</div>'
      + (art === 'datum'
        ? '<label for="saWertDatum">Datum:</label><input id="saWertDatum" class="eingabe" type="date" value="' + esc(wv.typ === 'datum' ? wv.wert : '') + '">'
          + '<p class="leise sa-formel">In Formeln zählt ein Datum in Tagen: [' + esc(name || 'Datum') + '] - heute = Tage bis dahin.</p>'
        : '<label for="saWertZahl">Wert:</label><input id="saWertZahl" class="eingabe" type="text" inputmode="decimal" autocomplete="off" value="'
          + esc((wv.wert === '' || wv.typ === 'datum') ? '' : String(wv.wert).replace('.', ',')) + '">'
          + '<label for="saWertEinheit">Einheit (z. B. kg, €):</label><input id="saWertEinheit" class="eingabe" type="text" autocomplete="off" value="' + esc(wv.einheit || '') + '">')
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saWertSpeichern()">OK</button>' + abbrechen
        + (fw ? '<button type="button" class="knopf" onclick="saWertLoeschen()">Löschen</button>' : ''));
  }

  if (f.modus === 'kopf') {
    var kw = (f.nr >= 0 && s.kopfwerte) ? s.kopfwerte[f.nr] : null;
    var kv = kw || { name: '', art: 'letzter', feld: ((s.felder || [])[0] || {}).id, zeitraum: '' };
    var wahl = function (id, an, liste) {
      return '<select id="' + id + '" class="eingabe">' + liste.map(function (x) {
        return '<option value="' + esc(x[0]) + '"' + (x[0] === an ? ' selected' : '') + '>' + esc(x[1]) + '</option>';
      }).join('') + '</select>';
    };
    return kopf(kw ? 'Kopfwert' : 'Neuer Kopfwert')
      + '<label for="saKwName">Bezeichnung (leer = automatisch):</label><input id="saKwName" class="eingabe" type="text" autocomplete="off" value="' + esc(kv.name || '') + '">'
      + '<label for="saKwArt">Art:</label>' + wahl('saKwArt', kv.art, SA_KW_ARTEN.filter(function (a) { return a[0] !== 'wert' || (s.werte || []).length; }))
      + '<label for="saKwFeld">… von Feld:</label>' + wahl('saKwFeld', kv.feld || '', (s.felder || []).map(function (x) { return [x.id, x.name]; }))
      + ((s.werte || []).length ? '<label for="saKwWert">… fester Wert:</label>' + wahl('saKwWert', kv.wert || '', s.werte.map(function (x) { return [x.id, x.name]; })) : '')
      + '<label for="saKwZr">Zeitraum:</label>' + wahl('saKwZr', kv.zeitraum || '', SA_ZEITRAEUME)
      + '<p class="leise">Der Zeitraum richtet sich nach dem ersten Datumsfeld, ohne Datumsfeld nach dem Anlegen.</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saKopfSpeichern()">OK</button>' + abbrechen
        + (kw ? '<button type="button" class="knopf" onclick="saKopfLoeschen()">Löschen</button>' : ''));
  }

  if (f.modus === 'feld-loeschen') {
    var fl = saFeld(s, f.id);
    return kopf('Feld löschen') + '<p>Feld „' + esc(fl ? fl.name : '') + '“ löschen? Die Werte darin sind dann nicht mehr zu sehen.</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saFeldLoeschen()">Löschen</button>'
        + '<button type="button" class="knopf" onclick="saFensterSchritt(\'feld\')">Abbrechen</button>');
  }

  if (f.modus === 'filter') {
    var fi = null;
    (s.filter || []).forEach(function (y) { if (y.id === f.id) { fi = y; } });
    var z = fi || { name: '', feld: (s.felder[0] || {}).id, op: 'gleich', wert: '' };
    return kopf(fi ? 'Filter „' + fi.name + '“' : 'Neuer Filter')
      + '<label for="saFiName">Name:</label><input id="saFiName" class="eingabe" type="text" autocomplete="off" value="' + esc(z.name) + '">'
      + '<label for="saFiFeld">Feld:</label><select id="saFiFeld" class="eingabe">' + (s.felder || []).map(function (y) {
          return '<option value="' + esc(y.id) + '"' + (y.id === z.feld ? ' selected' : '') + '>' + esc(y.name) + '</option>';
        }).join('') + '</select>'
      + '<label for="saFiOp">Bedingung:</label><select id="saFiOp" class="eingabe">' + SA_BEDINGUNGEN.map(function (y) {
          return '<option value="' + y[0] + '"' + (y[0] === z.op ? ' selected' : '') + '>' + y[1] + '</option>';
        }).join('') + '</select>'
      + '<label for="saFiWert">Wert (bei „ist“, „ist nicht“, „enthält“):</label><input id="saFiWert" class="eingabe" type="text" autocomplete="off" value="' + esc(z.wert || '') + '">'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saFilterSpeichern()">OK</button>' + abbrechen
        + (fi ? '<button type="button" class="knopf" onclick="saFilterLoeschen()">Löschen</button>' : ''));
  }

  if (f.modus === 'kopie') {
    var wahl = function (feld, wert, text) {
      return '<button type="button" class="wahl' + (f[feld] === wert ? ' sa-gewaehlt' : '') + '" onclick="saKopieWahl(\'' + feld + '\',\'' + wert + '\')">' + (f[feld] === wert ? '● ' : '○ ') + text + '</button>';
    };
    return kopf(s.name + ' kopieren')
      + wahl('als', 'sammlung', 'als neue Sammlung') + wahl('als', 'vorlage', 'als Vorlage')
      + '<label for="saName">Name:</label><input id="saName" class="eingabe" type="text" autocomplete="off" value="' + esc(f.name || (f.als === 'vorlage' ? s.name + ' (Vorlage)' : 'Kopie von ' + s.name)) + '">'
      + '<div class="gruppe">Mitnehmen</div>'
      + wahl('mit', 'nichts', 'nur Felder, Gruppen und Filter')
      + wahl('mit', 'geruest', 'dazu die Einträge ohne Zahlen und Daten')
      + wahl('mit', 'alle', 'dazu alle Einträge mit allen Werten')
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saKopieren()">Speichern</button>' + abbrechen);
  }

  if (f.modus === 'details') {
    var feldWahl = function (id, an, liste) {
      return '<select id="' + id + '" class="eingabe">' + liste.map(function (x) {
        return '<option value="' + esc(x[0]) + '"' + (x[0] === an ? ' selected' : '') + '>' + esc(x[1]) + '</option>';
      }).join('') + '</select>';
    };
    var kzArten = [['', 'wie die Vorlage (' + saKennzahlStandard(s) + ')'], ['anzahl', 'Anzahl der Einträge'], ['letzter', 'letzter Wert eines Felds'],
                   ['summe', 'Summe eines Felds'], ['schnitt', 'Ø eines Felds'], ['min', 'Min eines Felds'], ['max', 'Max eines Felds']];
    if ((s.werte || []).length) { kzArten.push(['wert', 'ein fester Wert']); }
    return kopf('Sammlung') + '<label for="saName">Name:</label><input id="saName" class="eingabe" type="text" autocomplete="off" value="' + esc(f.name) + '">'
      + '<label>Kategorie:</label><div class="wahlreihe">'
      + [['beruflich', 'Beruf'], ['privat', 'Privat']].map(function (k) {
          return '<button type="button"' + (f.kontext === k[0] ? ' class="an"' : '') + ' onclick="saKontext(\'' + k[0] + '\')">' + k[1] + '</button>';
        }).join('') + '</div>'
      /* Gruppe und Kennzahl in der Liste der Sammlungen (seit 0.8.1) */
      + '<label for="saGruppe">Gruppe in der Liste (leer = ' + esc(saGruppeStandard(s)) + '):</label>'
      + '<input id="saGruppe" class="eingabe" type="text" autocomplete="off" list="saGruppen" value="' + esc(f.gruppe) + '">'
      + '<datalist id="saGruppen">' + saGruppenNamen().map(function (g) { return '<option value="' + esc(g) + '">'; }).join('') + '</datalist>'
      + '<label for="saKzArt">Kennzahl rechts in der Liste:</label>' + feldWahl('saKzArt', f.kzArt, kzArten)
      + '<label for="saKzFeld">… von Feld:</label>' + feldWahl('saKzFeld', f.kzFeld, (s.felder || []).map(function (x) { return [x.id, x.name]; }))
      + ((s.werte || []).length ? '<label for="saKzWert">… fester Wert:</label>' + feldWahl('saKzWert', f.kzWert, s.werte.map(function (x) { return [x.id, x.name]; })) : '')
      /* Kennzahl 2 (seit 0.11.1): klein unter der ersten */
      + '<label for="saKz2Art">Kennzahl 2 (darunter, klein):</label>' + feldWahl('saKz2Art', f.kz2Art, [['', 'keine']].concat(kzArten.slice(1)))
      + '<label for="saKz2Feld">… von Feld:</label>' + feldWahl('saKz2Feld', f.kz2Feld, (s.felder || []).map(function (x) { return [x.id, x.name]; }))
      + ((s.werte || []).length ? '<label for="saKz2Wert">… fester Wert:</label>' + feldWahl('saKz2Wert', f.kz2Wert, s.werte.map(function (x) { return [x.id, x.name]; })) : '')
      + '<p class="leise">Jetzt: ' + esc(saKennzahl(s)) + ' · ' + saSaetze(s).length + ' Einträge · ' + (s.felder || []).length + ' Felder</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saDetailsSpeichern()">OK</button>' + abbrechen
        + '<button type="button" class="knopf" onclick="saFensterSchritt(\'sammlung-loeschen\')">Löschen…</button>');
  }

  if (f.modus === 'sammlung-loeschen') {
    return kopf('Sammlung löschen') + '<p>„' + esc(s.name) + '“ mit allen ' + saSaetze(s).length + ' Einträgen löschen?</p>'
      + saKnoepfe('<button type="button" class="knopf voll" onclick="saSammlungLoeschen()">Löschen</button>'
        + '<button type="button" class="knopf" onclick="saFensterSchritt(\'details\')">Abbrechen</button>');
  }
  return '';
}

/* ---- Anlegen, Speichern, Löschen ---- */

function saNaechsterRang() {
  return (DB.sammlungen || []).reduce(function (n, s) { return Math.max(n, s.ordnung || 0); }, 0) + 1;
}

/* Eine Sammlung (oder Vorlage) aus einer Vorlage bauen */
function saAusVorlage(v, name, alsVorlage, saetze) {
  if (!Array.isArray(DB.sammlungen)) { DB.sammlungen = []; }
  if (!Array.isArray(DB.datensaetze)) { DB.datensaetze = []; }
  var s = { id: neueKennung(), name: String(name || v.name).slice(0, 120), art: v.art || 'frei', vorlage: !!alsVorlage,
            kontext: (cl.filter === 'beruflich' || cl.filter === 'privat') ? cl.filter : (v.kontext || 'privat'),
            felder: saKopie(v.felder || []), rollen: saKopie(v.rollen || {}), filter: saKopie(v.filter || []),
            gruppe: v.gruppe || '', gruppenAn: !!v.gruppenAn, sort: saKopie(v.sort || {}), werte: saKopie(v.werte || []),
            kopfwerte: saKopie(v.kopfwerte || []),
            ordnung: saNaechsterRang(), geaendert: jetzt() };
  if (alsVorlage) { s.saetze = saKopie(saetze || []); }
  DB.sammlungen.push(s);
  if (!alsVorlage) {
    (saetze || []).forEach(function (w) {
      DB.datensaetze.push({ id: neueKennung(), sammlung: s.id, werte: saKopie(w), angelegt: jetzt(), geaendert: jetzt() });
    });
  }
  return s;
}

function saAnlegen() {
  var f = cl.sa.fenster;
  if (!f || !f.quelle) { melde('Bitte eine Vorlage wählen.', 'warn'); return; }
  var name = String(saFeldWert('saName') || '').trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  var v = SA_VORLAGEN[f.quelle] || saFinden(f.quelle);
  if (!v) { return; }
  var s = saAusVorlage(v, name, false, v.saetze || []);
  spaeterSichern();
  cl.aufklapp = '';
  cl.sa.fenster = null;
  melde('„' + s.name + '“ angelegt.', 'gut');
  saOeffnen(s.id);
}

/* Die Formularwerte eines Eintrags lesen */
function saWerteLesen(s) {
  var w = {};
  (s.felder || []).forEach(function (f) {
    if (f.typ === 'formel') { return; }
    var t = saFeldWert('saF_' + f.id);
    if (f.typ === 'betrag' || f.typ === 'zahl') {
      var n = saZahlLesen(t);
      if (n !== null) { w[f.id] = n; }
    } else if (f.typ === 'bewertung') {
      if (Number(t) > 0) { w[f.id] = Number(t); }
    } else if (f.typ === 'janein') {
      if (t) { w[f.id] = true; }
    } else if (String(t).trim()) {
      w[f.id] = String(t).trim().slice(0, 500);
    }
  });
  return w;
}

function saEintragSpeichern() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  var werte = saWerteLesen(s);
  if (!Object.keys(werte).length) { melde('Der Eintrag ist leer.', 'warn'); return; }
  var falsch = (s.felder || []).filter(function (fe) { return fe.typ === 'link' && werte[fe.id] && !saLinkGueltig(werte[fe.id]); })[0];
  if (falsch) { melde('„' + falsch.name + '“ ist keine gültige Adresse.\nSie muss mit http:// oder https:// beginnen.', 'warn'); return; }
  var d = f.id ? saSatzFinden(f.id) : null;
  if (d) {
    /* Werte unbekannter (gelöschter) Felder bleiben erhalten */
    (s.felder || []).forEach(function (fe) { delete d.werte[fe.id]; });
    Object.keys(werte).forEach(function (k) { d.werte[k] = werte[k]; });
    d.geaendert = jetzt();
  } else {
    if (!Array.isArray(DB.datensaetze)) { DB.datensaetze = []; }
    DB.datensaetze.push({ id: neueKennung(), sammlung: s.id, werte: werte, angelegt: jetzt(), geaendert: jetzt() });
  }
  spaeterSichern();
  aufklappZu();
}

function saEintragKopieren() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  var d = (f && f.id) ? saSatzFinden(f.id) : null;
  if (!s || !d) { return; }
  var neu = { id: neueKennung(), sammlung: s.id, werte: saWerteLesen(s), angelegt: jetzt(), geaendert: jetzt() };
  DB.datensaetze.push(neu);
  spaeterSichern();
  melde('Kopie angelegt.', 'gut');
  cl.sa.fenster = { modus: 'eintrag', id: neu.id };
  zeichne();
  aufklappNeu();
}

function saEintragLoeschen() {
  var f = cl.sa.fenster;
  var d = (f && f.id) ? saSatzFinden(f.id) : null;
  if (!d) { aufklappZu(); return; }
  DB.datensaetze = (DB.datensaetze || []).filter(function (x) { return x !== d; });
  grabsteinSetzen('datensaetze', d.id);
  spaeterSichern();
  aufklappZu();
}

function saFeldSpeichern() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  var name = String(saFeldWert('saFeldName') || '').trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  if (/[\[\]]/.test(name)) { melde('Der Name darf keine eckigen Klammern enthalten.', 'warn'); return; }
  var fe = f.id ? saFeld(s, f.id) : null;
  var typ = saFeldWert('saFeldTyp');
  typ = SA_TYPEN.some(function (t) { return t[0] === typ; }) ? typ : 'text';
  var formel = String(saFeldWert('saFeldFormel') || '').trim();
  if (typ === 'formel') {
    var fehler = saFormelPruefen(s, formel, fe);
    if (fehler) { melde('Die Formel stimmt nicht: ' + fehler, 'warn'); return; }
  }
  if (!fe) {
    fe = { id: 'f' + neueKennung() };
    s.felder.push(fe);
  }
  fe.name = name.slice(0, 60);
  fe.typ = typ;
  fe.werte = String(saFeldWert('saFeldWerte') || '').split('\n').map(function (x) { return x.trim(); }).filter(function (x) { return x; });
  if (fe.typ !== 'auswahl') { delete fe.werte; }
  var sp = document.getElementById('saFeldSpalte');
  var gr = document.getElementById('saFeldGruppe');
  fe.spalte = !!(sp && sp.checked);
  var summe = saFeldWert('saFeldSumme');
  fe.summe = (saRechts(fe) || summe === 'anzahl') ? summe : '';
  if (gr && gr.checked) { s.gruppe = fe.id; }
  else if (s.gruppe === fe.id) { s.gruppe = ''; s.gruppenAn = false; }
  /* Formel und Standardwert (seit 0.8) */
  if (fe.typ === 'formel') {
    var vz = document.getElementById('saFeldVz');
    var dez = Number(saFeldWert('saFeldDez'));
    fe.formel = formel.slice(0, 200);
    fe.dez = (dez >= 0 && dez <= 3) ? dez : 2;
    fe.vorzeichen = !!(vz && vz.checked);
    var tr = document.getElementById('saFeldTrend');
    fe.trend = !!(tr && tr.checked);
    delete fe.standard;
    delete fe.standardWert;
  } else {
    delete fe.formel;
    delete fe.dez;
    delete fe.vorzeichen;
    delete fe.trend;
    var std = saFeldWert('saFeldStd');
    if (std === 'heute' && fe.typ !== 'datum') { std = ''; }
    if (['heute', 'fest', 'zuletzt'].indexOf(std) < 0) { std = ''; }
    fe.standard = std;
    fe.standardWert = (std === 'fest') ? String(saFeldWert('saFeldStdWert') || '').trim().slice(0, 200) : '';
    if (!std) { delete fe.standard; delete fe.standardWert; }
  }
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

/* Die Namen, die eine Formel verwenden darf — ohne das Feld selbst */
function saFormelNamen(s, ohne) {
  var n = (s.felder || []).filter(function (f) { return f !== ohne; }).map(function (f) { return '[' + f.name + ']'; });
  return n.concat((s.werte || []).map(function (w) { return '[' + w.name + ']'; }));
}

/* Prüft die Schreibweise und ob es alle Namen gibt. Ergebnis: Fehlertext oder '' */
function saFormelPruefen(s, formel, ohne) {
  var namen = saFormelNamen(s, ohne).map(function (x) { return x.toLowerCase(); });
  var alleFelder = saFormelNamen(s, null).map(function (x) { return x.toLowerCase(); });
  try {
    saFormelAuswerten(formel, function (name, vorher) {
      /* vorher[…] darf auch das Feld selbst meinen (etwa den vorigen Trend) */
      if ((vorher ? alleFelder : namen).indexOf('[' + String(name).toLowerCase() + ']') < 0) { throw new Error('[' + name + '] gibt es nicht'); }
      return 1;
    });
  } catch (e) {
    return e.message;
  }
  return '';
}

/* Die Vorbelegung bei Neu: heute, ein fester Wert oder wie im jüngsten Eintrag */
function saStandardWerte(s) {
  var w = {};
  var letzter = null;
  saSaetze(s).forEach(function (d) {
    if (!letzter || (d.angelegt || d.geaendert || 0) > (letzter.angelegt || letzter.geaendert || 0)) { letzter = d; }
  });
  (s.felder || []).forEach(function (f) {
    if (f.standard === 'heute' && f.typ === 'datum') { w[f.id] = isoDatum(); }
    else if (f.standard === 'fest' && String(f.standardWert || '') !== '') {
      var t = String(f.standardWert);
      if (f.typ === 'betrag' || f.typ === 'zahl') { var n = saZahlLesen(t); if (n !== null) { w[f.id] = n; } }
      else if (f.typ === 'bewertung') { w[f.id] = Number(t) || 0; }
      else if (f.typ === 'janein') { w[f.id] = /^(ja|1|x)$/i.test(t); }
      else { w[f.id] = t; }
    } else if (f.standard === 'zuletzt' && letzter && (letzter.werte || {})[f.id] !== undefined) {
      w[f.id] = letzter.werte[f.id];
    }
  });
  return w;
}

function saFeldLoeschen() {
  var f = cl.sa.fenster;

  s.filter = (s.filter || []).filter(function (x) { return x.feld !== f.id; });

}

function saWertSpeichern() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  var name = String(saFeldWert('saWertName') || '').trim();
  var vorher = null;
  (s.werte || []).forEach(function (y) { if (y.id === f.id) { vorher = y; } });
  var art = f.art || ((vorher && vorher.typ === 'datum') ? 'datum' : 'zahl');
  var zahl = (art === 'datum') ? null : saZahlLesen(saFeldWert('saWertZahl'));
  var datum = (art === 'datum') ? String(saFeldWert('saWertDatum') || '') : '';
  if (!name || /[\[\]]/.test(name)) { melde('Bitte einen Namen ohne eckige Klammern eingeben.', 'warn'); return; }
  if (art === 'zahl' && zahl === null) { melde('Bitte eine Zahl eingeben, z. B. 82,5.', 'warn'); return; }
  if (art === 'datum' && saTagNr(datum) === null) { melde('Bitte ein Datum wählen.', 'warn'); return; }
  var doppelt = (s.felder || []).concat(s.werte || []).some(function (y) { return y.id !== f.id && String(y.name).toLowerCase() === name.toLowerCase(); });
  if (doppelt) { melde('Den Namen „' + name + '“ gibt es in dieser Sammlung schon.', 'warn'); return; }
  if (!Array.isArray(s.werte)) { s.werte = []; }
  var w = null;
  s.werte.forEach(function (y) { if (y.id === f.id) { w = y; } });
  if (!w) { w = { id: 'w' + neueKennung() }; s.werte.push(w); }
  w.name = name.slice(0, 40);
  if (art === 'datum') {
    w.typ = 'datum';
    w.wert = datum;
    delete w.einheit;
  } else {
    delete w.typ;
    w.wert = zahl;
    w.einheit = String(saFeldWert('saWertEinheit') || '').trim().slice(0, 12);

  spaeterSichern();
  aufklappZu();
}

/* Einträge für eine Kopie: nichts, Gerüst (ohne Zahlen und Daten) oder alles */
function saKopieSaetze(s, mit) {
  if (mit === 'nichts') { return []; }
  return saSaetze(s).map(function (d) {
    var w = saKopie(d.werte || {});
    if (mit === 'geruest') {
      (s.felder || []).forEach(function (f) {
        if (['betrag', 'zahl', 'datum', 'bewertung', 'janein'].indexOf(f.typ) >= 0) { delete w[f.id]; }
      });
    }
    return w;
  }).filter(function (w) { return Object.keys(w).length; });
}

function saKopieren() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  var name = String(saFeldWert('saName') || '').trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  var neu = saAusVorlage(s, name, f.als === 'vorlage', saKopieSaetze(s, f.mit));
  neu.kontext = s.kontext || neu.kontext;
  spaeterSichern();
  cl.aufklapp = '';
  cl.sa.fenster = null;
  if (f.als === 'vorlage') {
    melde('Vorlage „' + neu.name + '“ gespeichert — zu finden unter „Neu…“.', 'gut');
    zeichne();
  } else {
    melde('„' + neu.name + '“ angelegt.', 'gut');
    saOeffnen(neu.id);
  }
}

function saKontext(k) {
  var f = cl.sa.fenster;
  if (!f || (k !== 'beruflich' && k !== 'privat')) { return; }
  saDetailsLesen(f);
  f.kontext = k;
  aufklappNeu();
}

function saDetailsSpeichern() {
  var f = cl.sa.fenster;
  var s = cl.sa.id ? saFinden(cl.sa.id) : null;
  if (!f || !s) { aufklappZu(); return; }
  saDetailsLesen(f);
  var name = String(f.name || '').trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  s.name = name.slice(0, 120);
  if (f.kontext === 'beruflich' || f.kontext === 'privat') { s.kontext = f.kontext; }
  var gruppe = String(f.gruppe || '').trim().slice(0, 40);
  if (gruppe && gruppe !== saGruppeStandard(s)) { s.gruppeName = gruppe; } else { delete s.gruppeName; }
  var kz1 = saKennzahlWahl(f.kzArt, f.kzFeld, f.kzWert);
  var kz2 = saKennzahlWahl(f.kz2Art, f.kz2Feld, f.kz2Wert);
  if (kz1) { s.kennzahl = kz1; } else { delete s.kennzahl; }
  if (kz2) { s.kennzahl2 = kz2; } else { delete s.kennzahl2; }
  saGeaendert(s);
  spaeterSichern();
  aufklappZu();
}

/* Aus der Wahl im Fenster eine gespeicherte Kennzahl; null = keine */
function saKennzahlWahl(art, feld, wert) {
  if (['anzahl', 'letzter', 'summe', 'schnitt', 'min', 'max', 'wert'].indexOf(art) < 0) { return null; }
  var kz = { art: art };
  if (art === 'wert') { kz.wert = wert; } else if (art !== 'anzahl') { kz.feld = feld; }
  return kz;
}

function saSammlungLoeschen() {

  cl.aufklapp = '';
  cl.sa.fenster = null;

}

}

}

/* ---------- Routinen (seit 0.5) ----------

   Routinen pflegen wie in der Workbench — dieselben Sätze in
   DB.aufgaben mit „wiederholung“: wöchentlich an Tagen oder monatlich
   an einem Tag, alle n Wochen/Monate, mit Uhrzeit, Start und Pause.
   Fällig, erledigt, auslassen und verlegen kommen wörtlich aus der
   Workbench. Das 14-Tage-Raster bleibt dort. */

cl.rt = { wahl: '', pausiertAuf: false, fenster: null };
var RT_WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

function rtAlle() {
  return (DB.aufgaben || []).filter(function (a) {
    return a && a.wiederholung && (cl.filter === 'alle' || !a.kontext || a.kontext === cl.filter);
  }).sort(function (x, y) { return String(x.titel || '').localeCompare(String(y.titel || ''), 'de'); });
}

function rtFinden(id) {
  var l = DB.aufgaben || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i] && l[i].id === id && l[i].wiederholung) { return l[i]; } }
  return null;
}

/* Die nächste offene Ausführung — heute, wenn fällig, sonst die nächste */
function rtDiesmalTag(a) {
  var d = isoDatum();
  var i;
  for (i = 0; i < 400; i++) {
    if (aufgabeFaelligAn(a, d) && !istErledigtAn(a, d)) { return d; }
    d = tagePlus(d, 1);
  }
  return '';
}

function routinenHtml() {
  var heute = isoDatum();
  var alle = rtAlle();
  var faellig = clRoutinenAm(heute).sort(function (x, y) {
    var zx = aufgabeZeitAn(x, heute) || '99:99';
    var zy = aufgabeZeitAn(y, heute) || '99:99';
    return zx < zy ? -1 : (zx > zy ? 1 : 0);
  });
  var h = '<div class="gruppe">Heute</div>';
  h += faellig.length ? faellig.map(function (a) {
    var erl = istErledigtAn(a, heute);
    var zt = aufgabeZeitAn(a, heute);
    return '<div class="aufg' + (erl ? ' erl' : '') + '">' + clKastenHtml(erl, 'clRoutineUm(\'' + esc(a.id) + '\',\'' + heute + '\')')
      + '<span class="tx">' + esc(a.titel) + '</span>' + (zt ? '<span class="zeit">' + esc(clZeitText(zt)) + '</span>' : '') + '</div>';
  }).join('') : '<p class="leise">Heute keine Routine.</p>';
  var zeile = function (a) {
    var rhythmus = kpFrequenz(a.wiederholung) + (a.uhrzeit ? ' · ' + clZeitText(a.uhrzeit) : '');
    var ab = (a.ab && a.ab > heute) ? ' · ab ' + clKurzDatum(a.ab) : '';
    return '<button type="button" class="rt-zeile' + (cl.rt.wahl === a.id ? ' gewaehlt' : '') + (a.pausiert ? ' pause' : '')
      + '" onclick="rtTippen(\'' + esc(a.id) + '\')"><span class="tx">' + esc(a.titel || 'Routine') + '<small>' + esc(rhythmus + ab) + '</small></span>'
      + (cl.filter === 'alle' && a.kontext === 'beruflich' ? '<span class="marke">Beruf</span>' : '') + '</button>';
  };
  var laufend = alle.filter(function (a) { return !a.pausiert; });
  var pausiert = alle.filter(function (a) { return a.pausiert; });
  h += '<div class="gruppe">Alle Routinen</div>' + (laufend.length ? laufend.map(zeile).join('') : '<p class="leise">Noch keine Routine — „Neu“ tippen.</p>');
  if (pausiert.length) {
    h += '<button type="button" class="gruppe klapp" onclick="rtPausiertUm()">' + (cl.rt.pausiertAuf ? '▾' : '›') + ' Pausiert · ' + pausiert.length + '</button>';
    if (cl.rt.pausiertAuf) { h += pausiert.map(zeile).join(''); }
  }
  return h;
}

function routinenFussHtml() {
  return '<button type="button" class="knopf" onclick="rtNeu()">Neu</button>'
    + '<button type="button" class="knopf" onclick="rtDetailsGewaehlt()">Details…</button>'
    + '<button type="button" class="knopf" onclick="rtDiesmal()">Nur diesmal…</button>';
}

function rtPausiertUm() {
  cl.rt.pausiertAuf = !cl.rt.pausiertAuf;
  inhaltZeichnen();
}

function rtTippen(id) {
  if (cl.rt.wahl === id) { rtDetails(id); return; }
  cl.rt.wahl = id;

}

function rtDetailsGewaehlt() {
