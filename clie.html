/* Zu wenig Material: K–K, K+L–K, K+S–K, K+L–K+L (gleichfarbige Läufer) */
function schZuWenig(p) {
  var rest = [];
  var i;
  for (i = 0; i < 64; i++) {
    var f = p.b[i];
    if (f === '' || schArt(f) === 'k') { continue; }
    if ('bn'.indexOf(schArt(f)) < 0) { return false; }
    rest.push({ a: schArt(f), farbe: (Math.floor(i / 8) + i % 8) % 2, w: schWeiss(f) });
  }
  if (rest.length <= 1) { return true; }
  return rest.length === 2 && rest[0].a === 'b' && rest[1].a === 'b' && rest[0].w !== rest[1].w && rest[0].farbe === rest[1].farbe;
}

/* ---- CLIE als Gegner ---- */

function schBewerten(p) {
  var s = 0;
  var i;
  for (i = 0; i < 64; i++) {
    var f = p.b[i];
    if (f === '') { continue; }
    var a = schArt(f);
    if (schWeiss(f)) { s += SCH_WERT[a] + SCH_FELD[a][i]; }
    else { s -= SCH_WERT[a] + SCH_FELD[a][(7 - Math.floor(i / 8)) * 8 + i % 8]; }
  }
  return p.w ? s : -s;
}

/* Schlagzüge zuerst: wertvolles Opfer mit billigem Täter */
function schOrdnen(p, l) {
  return l.map(function (m) {
    var opfer = p.b[m.t] !== '' ? SCH_WERT[schArt(p.b[m.t])] : (m.art === 'ep' ? 100 : 0);
    var w = opfer ? 10 * opfer - SCH_WERT[schArt(p.b[m.f])] / 10 : 0;
    if (m.pr) { w += SCH_WERT[schArt(m.pr)]; }
    return { m: m, w: w };
  }).sort(function (a, b) { return b.w - a.w; }).map(function (x) { return x.m; });
}

/* Ruhesuche: nur Schlagzüge, bis die Stellung ruhig ist */
function schRuhe(p, alpha, beta, tiefe, ki) {
  ki.knoten++;
  var steht = schBewerten(p);
  if (steht >= beta) { return beta; }
  if (steht > alpha) { alpha = steht; }
  if (tiefe <= 0) { return alpha; }
  var l = schOrdnen(p, schZuege(p).filter(function (m) { return p.b[m.t] !== '' || m.art === 'ep' || m.pr; }));
  var i;
  for (i = 0; i < l.length; i++) {
    var u = schMachen(p, l[i]);
    var w = -schRuhe(p, -beta, -alpha, tiefe - 1, ki);
    schZurueck(p, l[i], u);
    if (w >= beta) { return beta; }
    if (w > alpha) { alpha = w; }
  }
  return alpha;
}

function schSuche(p, tiefe, alpha, beta, ki, abstand) {
  ki.knoten++;
  var l = schZuege(p);
  if (!l.length) { return schImSchach(p) ? -100000 + abstand : 0; }
  if (p.hm >= 100) { return 0; }
  if (tiefe <= 0) { return ki.ruhe ? schRuhe(p, alpha, beta, 4, ki) : schBewerten(p); }
  l = schOrdnen(p, l);
  var i;
  for (i = 0; i < l.length; i++) {
    var u = schMachen(p, l[i]);
    var w = -schSuche(p, tiefe - 1, -beta, -alpha, ki, abstand + 1);
    schZurueck(p, l[i], u);
    if (w >= beta) { return beta; }
    if (w > alpha) { alpha = w; }
  }
  return alpha;
}

/* Bester Zug für die Seite am Zug. Leicht: 1 Halbzug, mit Zufall unter
   ähnlich guten Zügen. Mittel: 2 Halbzüge + Ruhesuche. Stark: 3. */
function schKiZug(p, stufe, zufall) {
  var tiefe = stufe === 'stark' ? 3 : (stufe === 'mittel' ? 2 : 1);
  var ki = { knoten: 0, ruhe: stufe !== 'leicht' };
  var l = schOrdnen(p, schZuege(p));
  if (!l.length) { return null; }
  var spanne = stufe === 'leicht' ? 60 : (stufe === 'mittel' ? 15 : 0);
  /* Wer schlechter als „Bester − Spanne“ ist, interessiert nicht —
     das Fenster der Suche wird damit enger und die Suche schneller */
  var best = -1000000;
  var bewertet = l.map(function (m) {
    var u = schMachen(p, m);
    var w = -schSuche(p, tiefe - 1, -1000000, -(best - spanne - 1), ki, 1);
    schZurueck(p, m, u);
    if (w > best) { best = w; }
    return { m: m, w: w };
  });
  var kandidaten = bewertet.filter(function (x) { return x.w >= best - spanne; });
  var r = (typeof zufall === 'number') ? zufall : Math.random();
  return kandidaten[Math.min(kandidaten.length - 1, Math.floor(r * kandidaten.length))].m;
}

/* ---- Partie ---- */

/* Seit 0.22: vier Bereiche — Spielen, Partien, Schule, Eröffnungen.
   Gespeicherte Partien und der Lernstand bleiben nur auf dem Gerät. */
var SCH_PARTIEN_KEY = 'clie-schach-partien';
var SCH_SCHULE_KEY = 'clie-schach-schule';
var SCH_BEREICHE = [['spielen', 'Spielen'], ['partien', 'Partien'], ['schule', 'Schule'], ['eroeffnungen', 'Eröffnungen']];
var SCH_ENGLISCH = { K: 'K', D: 'Q', T: 'R', L: 'B', S: 'N' };

cl.sch = { p: null, zuege: [], schluessel: [], geschlagen: [], wahl: -1, gegner: 'clie', stufe: 'mittel', farbe: 'w',
           dreh: false, ende: '', fenster: '', umw: null, denkt: false, letzt: null, neu: { gegner: 'clie', stufe: 'mittel', farbe: 'w' },
           bereich: 'spielen', tipp: '', pv: { id: '', k: 0, laeuft: false, stand: 0 },
           sv: { kapitel: '', lektion: '', schritt: 0, aufgabe: -1 }, ev: { id: '', k: 0 }, ue: null };

/* Baut die Partie aus der Zugliste neu auf — für Laden und Zurücknehmen */
function schAufbauen(liste, startFen) {
  var p = schAusFen(startFen || SCH_START);
  cl.sch.p = p;
  cl.sch.zuege = [];
  cl.sch.schluessel = [schSchluessel(p)];
  cl.sch.geschlagen = [];
  cl.sch.letzt = null;
  cl.sch.ende = '';
  cl.sch.tipp = '';
  (liste || []).every(function (z) {
    var m = null;
    schZuege(p).forEach(function (x) { if (x.f === z.f && x.t === z.t && (x.pr || '') === (z.pr || '')) { m = x; } });
    if (!m) { return false; }
    schZugAusfuehren(m, true);
    return true;
  });
}

function schZugAusfuehren(m, still) {
  var p = cl.sch.p;
  var kurz = schKurz(p, m);
  var u = schMachen(p, m);
  if (u.cap) { cl.sch.geschlagen.push(u.cap); }
  cl.sch.zuege.push({ f: m.f, t: m.t, pr: m.pr || '', kurz: kurz });
  cl.sch.schluessel.push(schSchluessel(p));
  cl.sch.letzt = [m.f, m.t];
  cl.sch.wahl = -1;
  cl.sch.tipp = '';
  cl.sch.ende = schEndeText();
  if (!still) {
    schSichern();
    if (cl.sch.ende) { schBilanz(); }
  }
}

/* Spielende? Text oder '' — für die Partie oder eine Übungsstellung */
function schEndeText(p, schluessel) {
  p = p || cl.sch.p;
  schluessel = schluessel || cl.sch.schluessel;
  if (!schZuege(p).length) {
    if (schImSchach(p)) { return 'Schachmatt — ' + (p.w ? 'Schwarz' : 'Weiß') + ' gewinnt.'; }
    return 'Patt — remis.';
  }
  if (p.hm >= 100) { return 'Remis (50-Züge-Regel).'; }
  var k = schluessel[schluessel.length - 1];
  if (schluessel.filter(function (x) { return x === k; }).length >= 3) { return 'Remis (dreifache Wiederholung).'; }
  if (schZuWenig(p)) { return 'Remis (zu wenig Material).'; }
  return '';
}

/* Bilanz gegen CLIE: gewonnen, verloren, remis (nur dieses Gerät) */
function schBilanzLesen() {
  var b = null;
  try { b = JSON.parse(window.localStorage.getItem(SCH_BILANZ_KEY) || 'null'); } catch (e) { b = null; }
  return (b && typeof b.g === 'number') ? b : { g: 0, v: 0, r: 0 };
}

function schBilanz() {
  if (cl.sch.gegner !== 'clie') { return; }
  var b = schBilanzLesen();
  var matt = /^Schachmatt/.test(cl.sch.ende);
  if (!matt) { b.r++; }
  else if ((cl.sch.p.w ? 'b' : 'w') === cl.sch.farbe) { b.g++; } else { b.v++; }
  try { window.localStorage.setItem(SCH_BILANZ_KEY, JSON.stringify(b)); } catch (e) { /* nur für jetzt */ }
}

function schSichern() {
  var d = { zuege: cl.sch.zuege.map(function (z) { return { f: z.f, t: z.t, pr: z.pr }; }),
            gegner: cl.sch.gegner, stufe: cl.sch.stufe, farbe: cl.sch.farbe, dreh: cl.sch.dreh };
  try { window.localStorage.setItem(SCH_KEY, JSON.stringify(d)); } catch (e) { /* nur für jetzt */ }
}

function schLaden() {
  var d = null;
  try { d = JSON.parse(window.localStorage.getItem(SCH_KEY) || 'null'); } catch (e) { d = null; }
  if (d && Array.isArray(d.zuege)) {
    cl.sch.gegner = d.gegner === 'zwei' ? 'zwei' : 'clie';
    cl.sch.stufe = ['leicht', 'mittel', 'stark'].indexOf(d.stufe) >= 0 ? d.stufe : 'mittel';
    cl.sch.farbe = d.farbe === 'b' ? 'b' : 'w';
    cl.sch.dreh = !!d.dreh;
    schAufbauen(d.zuege);
  } else {
    schAufbauen([]);
  }
}

/* Wer am Zug ist: Mensch oder CLIE */
function schClieAmZug() {
  return cl.sch.gegner === 'clie' && !cl.sch.ende && (cl.sch.p.w ? 'w' : 'b') !== cl.sch.farbe;
}

/* ---- Eröffnungsbuch (seit 0.22) ---- */

/* Züge eines Buchs als Liste: „e4 e5 Sf3“ → ['e4','e5','Sf3'] */
function schBuchListe(e) {
  return String(e.zuege || '').split(/\s+/).filter(function (x) { return !!x; });
}

function schOhneZeichen(k) {
  return String(k || '').replace(/[+#!?]+$/g, '');
}

/* Welche Eröffnung steht auf dem Brett? Die längste gemeinsame Zugfolge zählt (mind. 2 Halbzüge). */
function schBuchName(kurzListe) {
  var best = null;
  var bestN = 1;
  (typeof SCH_EROEFFNUNGEN !== 'undefined' ? SCH_EROEFFNUNGEN : []).forEach(function (e) {
    var l = schBuchListe(e);
    var n = 0;
    while (n < l.length && n < kurzListe.length && schOhneZeichen(l[n]) === schOhneZeichen(kurzListe[n])) { n++; }
    if (n > bestN && (n === kurzListe.length || n === l.length)) { best = e; bestN = n; }
  });
  return best ? best.name : '';
}

/* Buchzüge, die auf die bisherige Folge passen */
function schBuchFortsetzungen(kurzListe) {
  var aus = [];
  (typeof SCH_EROEFFNUNGEN !== 'undefined' ? SCH_EROEFFNUNGEN : []).forEach(function (e) {
    var l = schBuchListe(e);
    if (l.length <= kurzListe.length) { return; }
    var i;
    for (i = 0; i < kurzListe.length; i++) { if (schOhneZeichen(l[i]) !== schOhneZeichen(kurzListe[i])) { return; } }
    if (aus.indexOf(l[kurzListe.length]) < 0) { aus.push(l[kurzListe.length]); }
  });
  return aus;
}

/* Zug aus Kurzschrift (deutsch) in einer Stellung finden */
function schAusKurz(p, kurz) {
  var ziel = schOhneZeichen(kurz);
  var m = null;
  schZuege(p).forEach(function (x) { if (!m && schOhneZeichen(schKurz(p, x)) === ziel) { m = x; } });
  return m;
}

/* CLIE zieht — kurz verzögert, damit „CLIE denkt …“ zu sehen ist.
   Am Anfang spielt CLIE abwechselnd verschiedene Buchzüge. */
function schClieZiehen() {
  if (!schClieAmZug() || cl.sch.denkt) { return; }
  cl.sch.denkt = true;
  schZeichnen();
  setTimeout(function () {
    var m = schClieAmZug() ? schClieWahl() : null;
    cl.sch.denkt = false;
    if (m) { schZugAusfuehren(m, false); }
    schZeichnen();
  }, 60);
}

function schClieWahl() {
  var buch = schBuchFortsetzungen(cl.sch.zuege.map(function (z) { return z.kurz; }));
  if (buch.length && cl.sch.stufe !== 'leicht') {
    var m = schAusKurz(cl.sch.p, buch[Math.floor(Math.random() * buch.length)]);
    if (m) { return m; }
  }
  return schKiZug(cl.sch.p, cl.sch.stufe);
}

/* „Tipp“: welchen Zug CLIE an deiner Stelle spielen würde */
function schTippZeigen() {
  var s = cl.sch;
  if (!s.p || s.ende || s.denkt || schClieAmZug()) { return; }
  var m = schKiZug(s.p, 'stark', 0);
  if (!m) { return; }
  s.tipp = 'Tipp: CLIE würde ' + schKurz(s.p, m) + ' spielen.';
  s.wahl = m.f;
  schZeichnen();
}

/* Tipp auf ein Feld (in Brett-Koordinaten) */
function schTipp(i) {
  var s = cl.sch;
  if (!s.p || s.ende || s.denkt || s.fenster || schClieAmZug()) { return; }
  var fig = s.p.b[i];
  if (s.wahl >= 0) {
    var passend = schZuege(s.p).filter(function (m) { return m.f === s.wahl && m.t === i; });
    if (passend.length) {
      if (passend.length > 1) { s.umw = { f: s.wahl, t: i, wo: 'spiel' }; s.fenster = 'umwandeln'; schZeichnen(); return; }
      schZugAusfuehren(passend[0], false);
      schZeichnen();
      schClieZiehen();
      return;
    }
  }
  s.wahl = (fig !== '' && schWeiss(fig) === s.p.w && s.wahl !== i) ? i : -1;
  schZeichnen();
}

/* Umwandlung: für die Partie und für Übungsstellungen */
function schUmwandeln(art) {
  var s = cl.sch;
  if (!s.umw || 'qrbn'.indexOf(art) < 0) { return; }
  var ue = s.umw.wo === 'ue';
  var p = ue ? s.ue.p : s.p;
  var pr = p.w ? art.toUpperCase() : art;
  var m = null;
  schZuege(p).forEach(function (x) { if (x.f === s.umw.f && x.t === s.umw.t && x.pr === pr) { m = x; } });
  s.umw = null;
  s.fenster = '';
  if (ue) { if (m) { schUeZug(m); } schZeichnen(); return; }
  if (m) { schZugAusfuehren(m, false); }
  schZeichnen();
  schClieZiehen();
}

/* Zurück: gegen CLIE bis wieder du am Zug bist, zu zweit ein Halbzug */
function schZurueckNehmen() {
  var s = cl.sch;
  if (s.denkt || !s.zuege.length) { return; }
  var l = s.zuege.slice(0, -1);
  if (s.gegner === 'clie') {
    while (l.length && ((l.length % 2 === 0 ? 'w' : 'b') !== s.farbe)) { l.pop(); }
  }
  schAufbauen(l.map(function (z) { return { f: z.f, t: z.t, pr: z.pr }; }));
  s.fenster = '';
  schSichern();
  schZeichnen();
  schClieZiehen();
}

function schDrehen() {
  cl.sch.dreh = !cl.sch.dreh;
  schSichern();
  schZeichnen();
}

function schNeuOeffnen() {
  cl.sch.bereich = 'spielen';
  cl.sch.neu = { gegner: cl.sch.gegner, stufe: cl.sch.stufe, farbe: cl.sch.farbe };
  cl.sch.fenster = 'neu';
  schZeichnen();
}

function schNeuWahl(feld, wert) {
  if (['gegner', 'stufe', 'farbe'].indexOf(feld) < 0) { return; }
  cl.sch.neu[feld] = wert;
  schZeichnen();
}

function schNeuLos() {
  var n = cl.sch.neu;
  cl.sch.gegner = n.gegner === 'zwei' ? 'zwei' : 'clie';
  cl.sch.stufe = n.stufe;
  cl.sch.farbe = n.farbe === 'zufall' ? (Math.random() < 0.5 ? 'w' : 'b') : n.farbe;
  cl.sch.dreh = false;
  cl.sch.fenster = '';
  cl.sch.denkt = false;
  schAufbauen([]);
  schSichern();
  kopfZeichnen();
  schZeichnen();
  schClieZiehen();
}

function schFensterZu() {
  cl.sch.fenster = '';
  cl.sch.umw = null;
  schZeichnen();
}

/* ---- Partien speichern (seit 0.22) ---- */

function schPartienLesen() {
  var l = [];
  try { l = JSON.parse(window.localStorage.getItem(SCH_PARTIEN_KEY) || '[]'); } catch (e) { l = []; }
  return Array.isArray(l) ? l.filter(function (x) { return x && x.id && Array.isArray(x.zuege); }) : [];
}

function schPartienSchreiben(l) {
  try { window.localStorage.setItem(SCH_PARTIEN_KEY, JSON.stringify(l)); } catch (e) { melde('Speichern ging nicht — Speicher voll?', 'warn'); }
}

function schPartieFinden(id) {
  return schPartienLesen().filter(function (x) { return x.id === id; })[0] || null;
}

/* Ergebnis wie in PGN: 1-0, 0-1, 1/2-1/2 oder * (läuft) */
function schErgebnis(ende) {
  if (!ende) { return '*'; }
  if (/Weiß gewinnt/.test(ende)) { return '1-0'; }
  if (/Schwarz gewinnt/.test(ende)) { return '0-1'; }
  return '1/2-1/2';
}

function schErgebnisText(e) {
  return e === '1/2-1/2' ? '½–½' : (e === '*' ? 'läuft' : e.replace('-', '–'));
}

function schStandardName() {
  var s = cl.sch;
  return s.gegner === 'zwei' ? '2 Spieler' : 'Gegen CLIE (' + schKopfStufe() + ')';
}

function schSpeichernOeffnen() {
  if (!cl.sch.p) { schLaden(); }
  if (!cl.sch.zuege.length) { melde('Noch kein Zug — nichts zu speichern.', null); return; }
  cl.sch.bereich = 'spielen';
  cl.sch.fenster = 'speichern';
  schZeichnen();
}

function schSpeichernOk() {
  var s = cl.sch;
  var feld = document.getElementById('schName');
  var name = String((feld && feld.value) || '').trim() || schStandardName();
  var l = schPartienLesen();
  l.unshift({ id: neueKennung(), name: name.slice(0, 80), datum: isoDatum(), gegner: s.gegner, stufe: s.stufe, farbe: s.farbe,
              zuege: s.zuege.map(function (z) { return { f: z.f, t: z.t, pr: z.pr }; }), kurz: s.zuege.map(function (z) { return z.kurz; }),
              ergebnis: schErgebnis(s.ende), eroeffnung: schBuchName(s.zuege.map(function (z) { return z.kurz; })), analyse: null });
  schPartienSchreiben(l.slice(0, 200));
  s.fenster = s.ende ? 'ansehen' : '';
  melde('Partie gespeichert: „' + name + '“', 'gut');
  schZeichnen();
}

/* Eine Partie bis zum Halbzug k nachgestellt: Stellung, letzter Zug */
function schNachStellung(partie, k) {
  var p = schAusFen(SCH_START);
  var letzt = null;
  partie.zuege.slice(0, k).every(function (z) {
    var m = null;
    schZuege(p).forEach(function (x) { if (x.f === z.f && x.t === z.t && (x.pr || '') === (z.pr || '')) { m = x; } });
    if (!m) { return false; }
    schMachen(p, m);
    letzt = [m.f, m.t];
    return true;
  });
  return { p: p, letzt: letzt };
}

function schPartieOeffnen(id) {
  cl.sch.pv = { id: id, k: 0, laeuft: false, stand: 0 };
  schZeichnen();
}

function schNachGehe(k) {
  var partie = schPartieFinden(cl.sch.pv.id);
  if (!partie) { return; }
  cl.sch.pv.k = Math.max(0, Math.min(partie.zuege.length, k));
  schZeichnen();
}

function schNachSchritt(d) {
  if (d === -99) { schNachGehe(0); return; }
  if (d === 99) { schNachGehe(1e6); return; }
  schNachGehe(cl.sch.pv.k + d);
}

/* „Ab hier spielen“: die Partie bis zum gezeigten Zug wird die laufende Partie */
function schAbHier() {
  var partie = schPartieFinden(cl.sch.pv.id);
  if (!partie) { return; }
  cl.sch.gegner = partie.gegner === 'zwei' ? 'zwei' : 'clie';
  cl.sch.stufe = partie.stufe || 'mittel';
  cl.sch.farbe = partie.farbe === 'b' ? 'b' : 'w';
  cl.sch.dreh = false;
  schAufbauen(partie.zuege.slice(0, cl.sch.pv.k));
  schSichern();
  cl.sch.bereich = 'spielen';
  cl.sch.pv.id = '';
  kopfZeichnen();
  schZeichnen();
  schClieZiehen();
}

function schMehrOeffnen() {
  cl.sch.fenster = 'mehr';
  schZeichnen();
}

function schUmbenennen() {
  var feld = document.getElementById('schName');
  var name = String((feld && feld.value) || '').trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  var l = schPartienLesen();
  l.forEach(function (x) { if (x.id === cl.sch.pv.id) { x.name = name.slice(0, 80); } });
  schPartienSchreiben(l);
  cl.sch.fenster = '';
  schZeichnen();
}

function schPartieLoeschen() {
  schPartienSchreiben(schPartienLesen().filter(function (x) { return x.id !== cl.sch.pv.id; }));
  cl.sch.fenster = '';
  cl.sch.pv.id = '';
  melde('Partie gelöscht.', null);
  schZeichnen();
}

/* PGN — das Austauschformat, mit englischen Figurenbuchstaben */
function schPgn(partie) {
  var eng = function (k) { return String(k).replace(/^[KDTLS]/, function (b) { return SCH_ENGLISCH[b]; }).replace(/=([DTLS])/, function (g, b) { return '=' + SCH_ENGLISCH[b]; }); };
  var ich = partie.gegner === 'zwei' ? 'Spieler' : 'Ich';
  var clie = 'CLIE (' + (partie.stufe || 'mittel') + ')';
  var weiss = partie.gegner === 'zwei' ? 'Weiß' : (partie.farbe === 'b' ? clie : ich);
  var schwarz = partie.gegner === 'zwei' ? 'Schwarz' : (partie.farbe === 'b' ? ich : clie);
  var kopf = '[Event "' + partie.name.replace(/"/g, "'") + '"]\n[Site "CLIE"]\n[Date "' + String(partie.datum || '').replace(/-/g, '.') + '"]\n'
    + '[White "' + weiss + '"]\n[Black "' + schwarz + '"]\n[Result "' + partie.ergebnis + '"]\n\n';
  var t = '';
  (partie.kurz || []).forEach(function (k, i) { t += (i % 2 === 0 ? (i / 2 + 1) + '. ' : '') + eng(k) + ' '; });
  return kopf + t + partie.ergebnis + '\n';
}

function schPgnTeilen() {
  var partie = schPartieFinden(cl.sch.pv.id);
  if (!partie) { return; }
  var text = schPgn(partie);
  var name = 'clie-partie-' + partie.datum + '.pgn';
  cl.sch.fenster = '';
  if (window.navigator && typeof window.navigator.share === 'function') {
    window.navigator.share({ title: partie.name, text: text }).catch(function () { dateiAnbieten(name, text); });
  } else if (dateiAnbieten(name, text)) { melde('PGN bereitgestellt: ' + name, 'gut'); }
  schZeichnen();
}

/* ---- Fehleranalyse (seit 0.22) ---- */

/* Wie viel kostet Zug m gegenüber dem besten Zug? (Bauerneinheiten × 100, aus Sicht des Ziehenden) */
function schAnalyseZug(p, m) {
  var ki = { knoten: 0, ruhe: true };
  var best = -1000000;
  var bester = null;
  var gespielt = null;
  schOrdnen(p, schZuege(p)).forEach(function (x) {
    var u = schMachen(p, x);
    var w = -schSuche(p, 1, -1000000, 1000000, ki, 1);
    schZurueck(p, x, u);
    if (w > best) { best = w; bester = x; }
    if (x.f === m.f && x.t === m.t && (x.pr || '') === (m.pr || '')) { gespielt = w; }
  });
  if (gespielt === null) { return null; }
  return { verlust: Math.max(0, best - gespielt), besser: bester ? schKurz(p, bester) : '' };
}

function schFen(p) {
  var t = '';
  var r;
  for (r = 0; r < 8; r++) {
    var leer = 0;
    var c;
    for (c = 0; c < 8; c++) {
      var f = p.b[r * 8 + c];
      if (f === '') { leer++; } else { t += (leer ? String(leer) : '') + f; leer = 0; }
    }
    t += (leer ? String(leer) : '') + (r < 7 ? '/' : '');
  }
  return t + ' ' + (p.w ? 'w' : 'b') + ' ' + (p.cr || '-') + ' ' + (p.ep >= 0 ? schFeldName(p.ep) : '-') + ' ' + p.hm + ' ' + p.fm;
}

/* Prüft eine Partie Zug für Zug — in kleinen Schritten, damit die Anzeige mitkommt */
function schAnalysieren() {
  var partie = schPartieFinden(cl.sch.pv.id);
  if (!partie || cl.sch.pv.laeuft) { return; }
  cl.sch.pv.laeuft = true;
  cl.sch.pv.stand = 0;
  var funde = [];
  var p = schAusFen(SCH_START);
  var i = 0;
  var schritt = function () {
    if (i >= partie.zuege.length || cl.sch.pv.id !== partie.id) {
      schAnalyseFertig(partie.id, funde);
      return;
    }
    var z = partie.zuege[i];
    var m = null;
    schZuege(p).forEach(function (x) { if (x.f === z.f && x.t === z.t && (x.pr || '') === (z.pr || '')) { m = x; } });
    if (!m) { i = partie.zuege.length; setTimeout(schritt, 0); return; }
    var meins = partie.gegner === 'zwei' || (p.w ? 'w' : 'b') === partie.farbe;
    if (meins) {
      var a = schAnalyseZug(p, m);
      if (a && a.verlust >= 100) {
        funde.push({ ply: i, kurz: schKurz(p, m), besser: a.besser, verlust: a.verlust, fen: schFen(p) });
      }
    }
    schMachen(p, m);
    i++;
    cl.sch.pv.stand = i;
    if (cl.app === 'schach') { inhaltZeichnen(); }
    setTimeout(schritt, 0);
  };
  schZeichnen();
  setTimeout(schritt, 30);
}

function schAnalyseFertig(id, funde) {
  var l = schPartienLesen();
  l.forEach(function (x) { if (x.id === id) { x.analyse = funde; } });
  schPartienSchreiben(l);
  cl.sch.pv.laeuft = false;
  schZeichnen();
}

/* ---- Lernstand (Schule, Eröffnungen) ---- */

function schStand() {
  var s = null;
  try { s = JSON.parse(window.localStorage.getItem(SCH_SCHULE_KEY) || 'null'); } catch (e) { s = null; }
  s = (s && typeof s === 'object') ? s : {};
  if (!s.a) { s.a = {}; }
  if (!s.l) { s.l = {}; }
  if (!s.e) { s.e = {}; }
  return s;
}

function schStandMerken(feld, id) {
  var s = schStand();
  s[feld][id] = 1;
  try { window.localStorage.setItem(SCH_SCHULE_KEY, JSON.stringify(s)); } catch (e) { /* nur für jetzt */ }
}

/* Kapitel 7: Fehler aus eigenen (analysierten) Partien als Aufgaben */
function schEigeneAufgaben() {
  var aus = [];
  schPartienLesen().forEach(function (pt) {
    (pt.analyse || []).forEach(function (f) {
      aus.push({ id: 'eigen-' + pt.id + '-' + f.ply, typ: 'beste', fen: f.fen, besser: f.besser,
                 frage: 'Aus „' + pt.name + '“: Du spieltest ' + f.kurz + (f.verlust >= 300 ? '??' : '?') + ' — finde einen besseren Zug.' });
    });
  });
  return aus.slice(0, 60);
}

function schKapitelListe() {
  var l = (typeof SCH_SCHULE !== 'undefined' ? SCH_SCHULE : []).slice();
  var eigen = schEigeneAufgaben();
  l.push({ id: 'k7', titel: 'Aus eigenen Partien lernen',
           lektionen: [{ id: 'eigen', titel: 'Deine Fehler', schritte: [{ fen: SCH_START.split(' ')[0] + ' w - - 0 1',
             text: 'Gespeicherte Partien lassen sich unter „Partien“ analysieren. Jeder Fehler (?) und grobe Fehler (??) landet hier als Aufgabe: Finde einen besseren Zug.' }],
             aufgaben: eigen }] });
  return l;
}

function schKapitelFinden(id) {
  return schKapitelListe().filter(function (k) { return k.id === id; })[0] || null;
}

function schLektionFinden(id) {
  var aus = null;
  schKapitelListe().forEach(function (k) { k.lektionen.forEach(function (l) { if (l.id === id) { aus = l; } }); });
  return aus;
}

function schLektionenAlle() {
  var l = [];
  (typeof SCH_SCHULE !== 'undefined' ? SCH_SCHULE : []).forEach(function (k) { l = l.concat(k.lektionen); });
  return l;
}

/* Fertig = alle Aufgaben gelöst (Lektionen ohne Aufgaben: gelesen) */
function schLektionFertig(l, st) {
  if (!l.aufgaben || !l.aufgaben.length) { return !!st.l[l.id]; }
  return l.aufgaben.every(function (a) { return !!st.a[a.id]; });
}

function schWeiterlernen() {
  var st = schStand();
  var offen = schLektionenAlle().filter(function (l) { return !schLektionFertig(l, st); })[0];
  if (!offen) { melde('Alle Lektionen sind erledigt — stark!', 'gut'); return; }
  var kap = '';
  (SCH_SCHULE || []).forEach(function (k) { if (k.lektionen.indexOf(offen) >= 0) { kap = k.id; } });
  cl.sch.sv = { kapitel: kap, lektion: offen.id, schritt: 0, aufgabe: -1 };
  cl.sch.ue = null;
  schZeichnen();
}

function schKapitelOeffnen(id) {
  cl.sch.sv = { kapitel: id, lektion: '', schritt: 0, aufgabe: -1 };
  schZeichnen();
}

function schLektionOeffnen(id) {
  cl.sch.sv.lektion = id;
  cl.sch.sv.schritt = 0;
  cl.sch.sv.aufgabe = -1;
  cl.sch.ue = null;
  schZeichnen();
}

function schSchrittGehe(d) {
  var l = schLektionFinden(cl.sch.sv.lektion);
  if (!l) { return; }
  cl.sch.sv.schritt = Math.max(0, Math.min(l.schritte.length - 1, cl.sch.sv.schritt + d));
  if (cl.sch.sv.schritt === l.schritte.length - 1) { schStandMerken('l', l.id); }
  schZeichnen();
}

/* ---- Übungsbrett: Aufgaben, Endspiele, Eröffnungen üben ---- */

function schAufgabeOeffnen(n) {
  var l = schLektionFinden(cl.sch.sv.lektion);
  if (!l || !l.aufgaben || n < 0 || n >= l.aufgaben.length) { return; }
  schStandMerken('l', l.id);
  cl.sch.sv.aufgabe = n;
  schUeStart(l.aufgaben[n], 'aufgabe');
  schZeichnen();
}

/* Stellung einer Aufgabe: aus FEN oder aus Zügen ab der Grundstellung („vorher“) */
function schStellungAus(a) {
  if (!a.vorher) { return schAusFen(a.fen); }
  var p = schAusFen(SCH_START);
  String(a.vorher).split(/\s+/).forEach(function (k) {
    var m = k ? schAusKurz(p, k) : null;
    if (m) { schMachen(p, m); }
  });
  return p;
}

function schUeStart(a, art) {
  var p = schStellungAus(a);
  cl.sch.ue = { art: art, a: a, p: p, idx: 0, ich: p.w ? 'w' : 'b', meldung: '', ok: null, fehler: 0,
                wahl: -1, letzt: null, denkt: false, verlauf: [], schl: [schSchluessel(p)], zugZahl: 0, antwort: -1 };
}

function schUeLinie() {
  var ue = cl.sch.ue;
  if (!ue) { return []; }
  if (ue.art === 'ueben') { return schBuchListe(ue.a); }
  return ue.a.loesung || [];
}

/* Tipp auf ein Feld des Übungsbretts */
function schUeTipp(i) {
  var ue = cl.sch.ue;
  if (!ue || ue.ok === true || ue.denkt || cl.sch.fenster || ue.a.typ === 'frage') { return; }
  if (ue.art === 'ueben' && (ue.p.w ? 'w' : 'b') !== ue.ich) { return; }
  var fig = ue.p.b[i];
  if (ue.wahl >= 0) {
    var passend = schZuege(ue.p).filter(function (m) { return m.f === ue.wahl && m.t === i; });
    if (passend.length) {
      if (passend.length > 1) { cl.sch.umw = { f: ue.wahl, t: i, wo: 'ue' }; cl.sch.fenster = 'umwandeln'; schZeichnen(); return; }
      schUeZug(passend[0]);
      schZeichnen();
      return;
    }
  }
  ue.wahl = (fig !== '' && schWeiss(fig) === ue.p.w && ue.wahl !== i) ? i : -1;
  schZeichnen();
}

function schUeMachen(m) {
  var ue = cl.sch.ue;
  var u = schMachen(ue.p, m);
  ue.verlauf.push({ m: m, u: u });
  ue.schl.push(schSchluessel(ue.p));
  ue.letzt = [m.f, m.t];
  ue.wahl = -1;
}

/* Material aus Sicht der Seite „ich“ (Bauerneinheiten × 100) */
function schMaterial(p, ich) {
  var s = 0;
  p.b.forEach(function (f) {
    if (f === '' || schArt(f) === 'k') { return; }
    s += (schWeiss(f) === (ich === 'w') ? 1 : -1) * SCH_WERT[schArt(f)];
  });
  return s;
}

/* Ein Zug auf dem Übungsbrett — je nach Art geprüft */
function schUeZug(m) {
  var ue = cl.sch.ue;
  var typ = ue.a.typ || 'zug';
  var kurz = schKurz(ue.p, m);
  if (ue.art === 'ueben' || typ === 'zug') {
    var linie = schUeLinie();
    var soll = linie[ue.idx];
    var u = schMachen(ue.p, m);
    var matt = !schZuege(ue.p).length && schImSchach(ue.p);
    schZurueck(ue.p, m, u);
    var richtig = soll && schOhneZeichen(kurz) === schOhneZeichen(soll);
    /* Bei Matt-Aufgaben zählt jedes Matt im letzten Zug */
    if (!richtig && matt && ue.a.matt && ue.idx === linie.length - 1) { richtig = true; }
    if (!richtig) {
      ue.fehler++;
      ue.ok = false;
      ue.wahl = -1;
      ue.meldung = 'Nicht ganz. ' + schUeWiderlegung(m, kurz);
      if (ue.art === 'ueben') { ue.meldung = 'Hier spielt man ' + soll + '. ' + (schUebenErkl(ue.a, ue.idx + 1) || 'Nochmal?'); }
      return;
    }
    schUeMachen(m);
    ue.idx++;
    var meinPly = ue.idx;
    ue.ok = null;
    ue.meldung = '';
    if (ue.idx >= linie.length) { schUeGeloest(); return; }
    /* Antwort des Gegners aus der Lösung */
    var gegen = schAusKurz(ue.p, linie[ue.idx]);
    if (gegen) { schUeMachen(gegen); ue.idx++; }
    if (ue.idx >= linie.length) { schUeGeloest(); return; }
    if (ue.art === 'ueben') { ue.meldung = schUebenErkl(ue.a, meinPly) || schUebenErkl(ue.a, meinPly + 1) || ''; }
    else { ue.meldung = 'Gut! Weiter …'; }
    return;
  }
  if (typ === 'beste') {
    var a = schAnalyseZug(ue.p, m);
    if (a && a.verlust <= 30) {
      schUeMachen(m);
      schUeGeloest();
      ue.meldung = 'Richtig! ' + kurz + ' ist gut' + (schOhneZeichen(a.besser) === schOhneZeichen(kurz) ? '.' : ' (CLIE hätte ' + a.besser + ' gespielt).')
        + (typeof ue.a.erkl === 'string' ? ' ' + ue.a.erkl : '');
    } else {
      ue.fehler++;
      ue.ok = false;
      ue.meldung = 'Nicht ganz — ' + kurz + ' kostet etwa ' + (Math.round((a ? a.verlust : 0) / 10) / 10).toString().replace('.', ',') + ' Bauern. Nochmal?';
    }
    return;
  }
  if (typ === 'endspiel') {
    schUeMachen(m);
    ue.zugZahl++;
    if (schUeEndspielPruefen()) { return; }
    ue.denkt = true;
    ue.meldung = 'CLIE denkt …';
    setTimeout(schUeClieZug, 60);
  }
}

/* Endspiel: CLIE verteidigt (oder greift an) mit voller Stärke */
function schUeClieZug() {
  var ue = cl.sch.ue;
  if (!ue || !ue.denkt) { return; }
  var m = schKiZug(ue.p, 'stark', 0);
  ue.denkt = false;
  ue.meldung = '';
  if (m) { schUeMachen(m); }
  schUeEndspielPruefen();
  if (cl.app === 'schach') { schZeichnen(); }
}

/* Ziel erreicht oder verfehlt? true = Aufgabe ist zu Ende */
function schUeEndspielPruefen() {
  var ue = cl.sch.ue;
  var ziel = ue.a.ziel || 'matt';
  var ende = schEndeText(ue.p, ue.schl);
  var ichDran = (ue.p.w ? 'w' : 'b') === ue.ich;
  var mat = schMaterial(ue.p, ue.ich);
  if (/^Schachmatt/.test(ende)) {
    if (!ichDran) { schUeGeloest(); ue.meldung = 'Matt! Geschafft in ' + ue.zugZahl + ' Zügen.'; }
    else { ue.ok = false; ue.meldung = 'Du wurdest matt gesetzt. Neu starten?'; }
    return true;
  }
  if (ende) {
    if (ziel === 'remis') { schUeGeloest(); ue.meldung = ende + ' Ziel erreicht: Remis gehalten.'; }
    else { ue.ok = false; ue.meldung = ende + ' Das reicht nicht — neu starten?'; }
    return true;
  }
  if (ziel === 'remis' && mat <= -400) { ue.ok = false; ue.meldung = 'Zu viel Material verloren — das ist nicht mehr zu halten.'; return true; }
  if (ziel === 'umwandeln' && ichDran && mat >= 500) { schUeGeloest(); ue.meldung = 'Umgewandelt und gesichert — gewonnen!'; return true; }
  if (ue.a.limit && ue.zugZahl >= ue.a.limit && ichDran) {
    if (ziel === 'remis') { schUeGeloest(); ue.meldung = ue.a.limit + ' Züge gehalten — Remis!'; }
    else { ue.ok = false; ue.meldung = 'Mehr als ' + ue.a.limit + ' Züge — versuch es nochmal.'; }
    return true;
  }
  return false;
}

/* Warum ein Zug nicht klappt: die beste Antwort des Gegners */
function schUeWiderlegung(m, kurz) {
  var ue = cl.sch.ue;
  var u = schMachen(ue.p, m);
  var antwort = schZuege(ue.p).length ? schKiZug(ue.p, 'mittel', 0) : null;
  var text = antwort ? 'Auf ' + kurz + ' folgt ' + schKurz(ue.p, antwort) + '.' : '';
  schZurueck(ue.p, m, u);
  return text + ' Nochmal?';
}

function schUebenErkl(e, ply) {
  return (e.erkl && e.erkl[String(ply)]) || '';
}

function schUeGeloest() {
  var ue = cl.sch.ue;
  ue.ok = true;
  ue.wahl = -1;
  ue.meldung = (ue.a.erkl && typeof ue.a.erkl === 'string') ? 'Richtig! ' + ue.a.erkl : 'Richtig!';
  if (ue.art === 'ueben') {
    ue.meldung = ue.fehler ? 'Durchgespielt mit ' + ue.fehler + ' Fehler' + (ue.fehler > 1 ? 'n' : '') + '. Nochmal ohne Fehler?' : 'Fehlerfrei durchgespielt — ★ geübt!';
    if (!ue.fehler) { schStandMerken('e', ue.a.id); }
    return;
  }
  if (ue.a.id) { schStandMerken('a', ue.a.id); }
}

/* Frage mit Auswahl */
function schUeAntwort(n) {
  var ue = cl.sch.ue;
  if (!ue || ue.a.typ !== 'frage' || ue.ok === true) { return; }
  ue.antwort = n;
  if (n === ue.a.richtig) { schUeGeloest(); }
  else { ue.fehler++; ue.ok = false; ue.meldung = 'Leider nicht. Nochmal?'; }
  schZeichnen();
}

function schUeHilfe() {
  var ue = cl.sch.ue;
  if (!ue || ue.ok === true) { return; }
  var typ = ue.a.typ || 'zug';
  if (typ === 'frage') { ue.meldung = ue.a.tipp || 'Schau genau auf die markierten Felder.'; schZeichnen(); return; }
  var m = null;
  if (typ === 'zug' || ue.art === 'ueben') { m = schAusKurz(ue.p, schUeLinie()[ue.idx]); }
  else { m = schKiZug(ue.p, 'stark', 0); }
  if (m) { ue.wahl = m.f; ue.meldung = ue.a.tipp || 'Diese Figur ist dran.'; }
  schZeichnen();
}

function schUeLoesung() {
  var ue = cl.sch.ue;
  if (!ue || ue.ok === true) { return; }
  var typ = ue.a.typ || 'zug';
  if (typ === 'frage') { ue.meldung = 'Lösung: ' + ue.a.optionen[ue.a.richtig] + '. ' + (ue.a.erkl || ''); ue.ok = false; schZeichnen(); return; }
  if (typ === 'beste') {
    var bm = schKiZug(ue.p, 'stark', 0);
    ue.meldung = 'Ein guter Zug ist ' + (bm ? schKurz(ue.p, bm) : (ue.a.besser || '')) + '. ' + (typeof ue.a.erkl === 'string' ? ue.a.erkl : '');
    schZeichnen();
    return;
  }
  if (typ === 'endspiel') { ue.meldung = ue.a.erkl || ''; schZeichnen(); return; }
  ue.meldung = 'Lösung: ' + schUeLinie().slice(ue.idx).join(' ') + '. ' + (typeof ue.a.erkl === 'string' ? ue.a.erkl : '');
  schZeichnen();
}

/* Endspiel: Zug zurück (deiner und CLIEs Antwort) oder neu starten */
function schUeZurueck() {
  var ue = cl.sch.ue;
  if (!ue || ue.denkt || !ue.verlauf.length) { return; }
  var n = ((ue.p.w ? 'w' : 'b') === ue.ich) ? 2 : 1;
  while (n-- > 0 && ue.verlauf.length) {
    var v = ue.verlauf.pop();
    schZurueck(ue.p, v.m, v.u);
    ue.schl.pop();
  }
  ue.zugZahl = Math.max(0, ue.zugZahl - 1);
  ue.ok = null;
  ue.meldung = '';
  ue.letzt = null;
  schZeichnen();
}

function schUeNeu() {
  var ue = cl.sch.ue;
  if (!ue) { return; }
  schUeStart(ue.a, ue.art);
  schZeichnen();
}

function schUeWeiter() {
  var l = schLektionFinden(cl.sch.sv.lektion);
  if (!l) { return; }
  if (cl.sch.sv.aufgabe + 1 < l.aufgaben.length) { schAufgabeOeffnen(cl.sch.sv.aufgabe + 1); return; }
  cl.sch.sv.aufgabe = -1;
  cl.sch.sv.lektion = '';
  cl.sch.ue = null;
  melde('Lektion „' + l.titel + '“ abgeschlossen.', 'gut');
  schZeichnen();
}

/* ---- Eröffnungen: durchspielen und üben ---- */

function schEroeffnungFinden(id) {
  return (typeof SCH_EROEFFNUNGEN !== 'undefined' ? SCH_EROEFFNUNGEN : []).filter(function (e) { return e.id === id; })[0] || null;
}

function schEroeffnungOeffnen(id) {
  cl.sch.ev = { id: id, k: 0 };
  cl.sch.ue = null;
  schZeichnen();
}

function schEroeffnungGehe(d) {
  var e = schEroeffnungFinden(cl.sch.ev.id);
  if (!e) { return; }
  var n = schBuchListe(e).length;
  cl.sch.ev.k = (d === -99) ? 0 : (d === 99 ? n : Math.max(0, Math.min(n, cl.sch.ev.k + d)));
  schZeichnen();
}

function schEroeffnungUeben() {
  var e = schEroeffnungFinden(cl.sch.ev.id);
  if (!e) { return; }
  schUeStart({ id: e.id, fen: SCH_START, zuege: e.zuege, erkl: e.erkl, typ: 'zug', name: e.name }, 'ueben');
  cl.sch.ue.ich = e.seite === 'b' ? 'b' : 'w';
  /* Spielst du Schwarz, zieht CLIE den ersten Buchzug */
  if (cl.sch.ue.ich === 'b') {
    var m = schAusKurz(cl.sch.ue.p, schBuchListe(e)[0]);
    if (m) { schUeMachen(m); cl.sch.ue.idx = 1; }
  }
  schZeichnen();
}

/* Stellung nach k Buchzügen */
function schBuchStellung(e, k) {
  var p = schAusFen(SCH_START);
  var letzt = null;
  schBuchListe(e).slice(0, k).every(function (z) {
    var m = schAusKurz(p, z);
    if (!m) { return false; }
    schMachen(p, m);
    letzt = [m.f, m.t];
    return true;
  });
  return { p: p, letzt: letzt };
}

/* ---- Zeichnen ---- */

var schBildCache = {};

function schFigurSvg(f) {
  if (schBildCache[f]) { return schBildCache[f]; }
  var m = SCH_BILD[schArt(f)];
  var weiss = schWeiss(f);
  var h = '<svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">';
  var y;
  var x;
  for (y = 0; y < 12; y++) {
    for (x = 0; x < 12; x++) {
      if (m[y].charAt(x) !== '#') { continue; }
      var innen = weiss && y > 0 && y < 11 && x > 0 && x < 11 && m[y - 1].charAt(x) === '#' && m[y + 1].charAt(x) === '#'
                  && m[y].charAt(x - 1) === '#' && m[y].charAt(x + 1) === '#';
      h += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + (innen ? '#E3E9D6' : '#1C2116') + '"/>';
    }
  }
  schBildCache[f] = h + '</svg>';
  return schBildCache[f];
}

/* Unten steht, wer am Gerät spielt; „Drehen“ kehrt das um */
function schGedreht() {
  var unten = (cl.sch.gegner === 'clie') ? cl.sch.farbe : 'w';
  return (unten === 'b') !== cl.sch.dreh;
}

/* Ein Brett — für Partie, Nachspielen, Lektion und Übung.
   o: { wahl, letzt, dreh, klick (Name der Funktion), marken: ['f1', …] } */
function schBrettHtml(p, o) {
  o = o || {};
  var ziele = {};
  if (o.wahl >= 0) { schZuege(p).forEach(function (m) { if (m.f === o.wahl) { ziele[m.t] = 1; } }); }
  var marken = {};
  (o.marken || []).forEach(function (n) { marken[n] = 1; });
  var schach = schImSchach(p) ? schKoenig(p, p.w) : -1;
  var h = '';
  var vr;
  var vc;
  for (vr = 0; vr < 8; vr++) {
    var r = o.dreh ? 7 - vr : vr;
    h += '<span class="sch-ko">' + (8 - r) + '</span>';
    for (vc = 0; vc < 8; vc++) {
      var c = o.dreh ? 7 - vc : vc;
      var i = r * 8 + c;
      var f = p.b[i];
      var kl = 'sch-f ' + ((r + c) % 2 ? 'd' : 'h') + (o.wahl === i ? ' wahl' : '')
             + (o.letzt && (o.letzt[0] === i || o.letzt[1] === i) ? ' letzt' : '') + (i === schach ? ' schach' : '')
             + (marken[schFeldName(i)] ? ' feldmarke' : '');
      h += (o.klick ? '<button type="button" class="' + kl + '" onclick="' + o.klick + '(' + i + ')"' : '<span class="' + kl + '"')
         + ' aria-label="' + schFeldName(i) + '">'
         + (ziele[i] ? (f !== '' || (schArt(p.b[o.wahl]) === 'p' && i === p.ep) ? '<span class="sch-schlag"></span>' : '<span class="sch-ziel"></span>') : '')
         + (f ? schFigurSvg(f) : '') + (o.klick ? '</button>' : '</span>');
    }
  }
  h += '<span></span>';
  for (vc = 0; vc < 8; vc++) { h += '<span class="sch-ko">' + 'abcdefgh'.charAt(o.dreh ? 7 - vc : vc) + '</span>'; }
  return '<div class="sch-rahmen' + (o.ruht ? ' ruht' : '') + '"><div class="sch-brett">' + h + '</div></div>';
}

function schStatusText() {
  var s = cl.sch;
  if (s.ende) { return s.ende; }
  var farbe = s.p.w ? 'Weiß' : 'Schwarz';
  var schach = schImSchach(s.p) ? ' — Schach!' : '';
  var buch = schBuchName(s.zuege.map(function (z) { return z.kurz; }));
  var vorn = buch ? buch + ' · ' : '';
  if (s.gegner === 'zwei') { return vorn + farbe + ' am Zug' + schach; }
  if (s.denkt || schClieAmZug()) { return vorn + 'CLIE denkt …'; }
  return vorn + 'Du (' + farbe + ') am Zug' + schach;
}

function schWahlReihe(feld, werte) {
  var s = cl.sch;
  return '<div class="wahlreihe">' + werte.map(function (x) {
    return '<button type="button"' + (s.neu[feld] === x[0] ? ' class="an"' : '') + ' onclick="schNeuWahl(\'' + feld + '\',\'' + x[0] + '\')">' + x[1] + '</button>';
  }).join('') + '</div>';
}

function schFensterHtml() {
  var s = cl.sch;
  if (s.fenster === 'neu') {
    return '<div class="sto-fenster"><div class="titel">Neue Partie</div><div class="rumpf">'
      + '<label>Gegner:</label>' + schWahlReihe('gegner', [['clie', 'CLIE'], ['zwei', '2 Spieler']])
      + (s.neu.gegner === 'clie' ? '<label>Stufe:</label>' + schWahlReihe('stufe', SCH_STUFEN)
         + '<label>Du spielst:</label>' + schWahlReihe('farbe', [['w', 'Weiß'], ['b', 'Schwarz'], ['zufall', 'Zufall']]) : '')
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="schNeuLos()">Los</button>'
      + '<button type="button" class="knopf" onclick="schFensterZu()">Abbrechen</button></div>'
      + (s.zuege.length && !s.ende ? '<p class="leise">Die laufende Partie wird dabei beendet. Speichern geht vorher über das Menü ▾.</p>' : '') + '</div></div>';
  }
  if (s.fenster === 'umwandeln') {
    var w = (s.umw && s.umw.wo === 'ue') ? s.ue.p.w : s.p.w;
    return '<div class="sto-fenster"><div class="titel">Umwandeln in</div><div class="rumpf"><div class="sch-umw">'
      + 'qrbn'.split('').map(function (a) {
          return '<button type="button" onclick="schUmwandeln(\'' + a + '\')" aria-label="' + SCH_DEUTSCH[a] + '">' + schFigurSvg(w ? a.toUpperCase() : a) + '</button>';
        }).join('') + '</div><div class="knoepfe"><button type="button" class="knopf" onclick="schFensterZu()">Abbrechen</button></div></div></div>';
  }
  if (s.fenster === 'speichern') {
    return '<div class="sto-fenster"><div class="titel">Partie speichern</div><div class="rumpf">'
      + '<label for="schName">Name:</label><input id="schName" class="eingabe" type="text" autocomplete="off" value="' + esc(schStandardName()) + '">'
      + '<p class="leise">' + s.zuege.length + ' Halbzüge · ' + esc(schErgebnisText(schErgebnis(s.ende))) + ' · nur auf diesem Gerät</p>'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="schSpeichernOk()">Speichern</button>'
      + '<button type="button" class="knopf" onclick="schFensterZu()">Abbrechen</button></div></div></div>';
  }
  if (s.fenster === 'mehr') {
    var pt = schPartieFinden(s.pv.id);
    if (!pt) { return ''; }
    return '<div class="sto-fenster"><div class="titel">Partie</div><div class="rumpf">'
      + '<label for="schName">Name:</label><input id="schName" class="eingabe" type="text" autocomplete="off" value="' + esc(pt.name) + '">'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="schUmbenennen()">Umbenennen</button>'
      + '<button type="button" class="knopf" onclick="schPgnTeilen()">PGN teilen</button></div>'
      + '<div class="knoepfe"><button type="button" class="knopf" onclick="schPartieLoeschen()">Löschen</button>'
      + '<button type="button" class="knopf" onclick="schFensterZu()">Abbrechen</button></div></div></div>';
  }
  if (s.bereich === 'spielen' && s.ende && s.fenster !== 'ansehen') {
    return '<div class="sto-fenster"><div class="titel">' + (/^Schachmatt/.test(s.ende) ? 'Schachmatt' : 'Remis') + '</div><div class="rumpf">'
      + '<p>' + esc(s.ende.replace(/^Schachmatt — /, '')) + ' Nach ' + Math.ceil(s.zuege.length / 2) + ' Zügen.</p>'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="schNeuOeffnen()">Neue Partie</button>'
      + '<button type="button" class="knopf" onclick="schSpeichernOeffnen()">Speichern</button>'
      + '<button type="button" class="knopf" onclick="schAnsehen()">Ansehen</button></div></div></div>';
  }
  return '';
}

function schAnsehen() {
  cl.sch.fenster = 'ansehen';
  schZeichnen();
}

function schZugListeHtml(kurz, aktiv, klick) {
  var zl = '';
  var i;
  for (i = 0; i < kurz.length; i += 2) {
    var zug = function (j) {
      if (j >= kurz.length) { return ''; }
      var t = esc(kurz[j]);
      if (j + 1 === aktiv) { t = '<b>' + t + '</b>'; }
      return klick ? '<button type="button" class="sch-zk" onclick="' + klick + '(' + (j + 1) + ')">' + t + '</button>' : t;
    };
    zl += '<div><span>' + (i / 2 + 1) + '.</span><span>' + zug(i) + ' ' + zug(i + 1) + '</span></div>';
  }
  return zl ? '<div class="sch-zuege">' + zl + '</div>' : '';
}

function schBereichLeiste() {
  return '<div class="auf-leiste"><div class="schalter">' + SCH_BEREICHE.map(function (b) {
    return '<button type="button"' + (cl.sch.bereich === b[0] ? ' class="an"' : '') + ' onclick="schBereich(\'' + b[0] + '\')">' + b[1] + '</button>';
  }).join('') + '</div></div>';
}

function schBereich(b) {
  if (!SCH_BEREICHE.some(function (x) { return x[0] === b; })) { return; }
  cl.sch.bereich = b;
  cl.sch.fenster = '';
  var el = document.getElementById('inhalt');
  if (el) { el.scrollTop = 0; }
  kopfZeichnen();
  schZeichnen();
}

/* Bereich Spielen: die laufende Partie */
function schSpielenHtml() {
  var s = cl.sch;
  var geschlagen = s.geschlagen.map(function (f) { return '<span class="sch-mini">' + schFigurSvg(f) + '</span>'; }).join('');
  return '<div class="sch-geschlagen">' + (geschlagen || '&nbsp;') + '</div>'
    + schBrettHtml(s.p, { wahl: s.wahl, letzt: s.letzt, dreh: schGedreht(), klick: 'schTipp', ruht: !!(s.fenster && s.fenster !== 'ansehen') })
    + '<div class="sch-status"><span>' + esc(schStatusText()) + '</span><b>Zug ' + s.p.fm + '</b></div>'
    + (s.tipp ? '<div class="sch-hinweis">' + esc(s.tipp) + '</div>' : '')
    + (schZugListeHtml(s.zuege.map(function (z) { return z.kurz; }), -1, '') || '<p class="leise">Tippe eine Figur an, dann ihr Ziel.</p>');
}

/* Bereich Partien: Liste, Nachspielen, Analyse */
function schPartienHtml() {
  var s = cl.sch;
  var pt = s.pv.id ? schPartieFinden(s.pv.id) : null;
  if (!pt) {
    var l = schPartienLesen();
    if (!l.length) { return '<p class="leise">Noch keine gespeicherte Partie. Speichern geht im Menü ▾ („Partie speichern…“) oder am Ende einer Partie.</p>'; }
    return l.map(function (x) {
      return '<button type="button" class="sch-zeile" onclick="schPartieOeffnen(\'' + esc(x.id) + '\')"><span>' + esc(x.name)
        + '<small>' + esc(clKurzDatum(x.datum)) + ' · ' + (x.gegner === 'zwei' ? '2 Spieler' : (x.farbe === 'b' ? 'Schwarz' : 'Weiß'))
        + (x.eroeffnung ? ' · ' + esc(x.eroeffnung) : '') + ' · ' + Math.ceil(x.zuege.length / 2) + ' Züge'
        + (x.analyse ? ' · ' + x.analyse.length + ' Fehler' : '') + '</small></span><b>' + esc(schErgebnisText(x.ergebnis)) + '</b></button>';
    }).join('') + '<p class="leise">Gespeichert nur auf diesem Gerät.</p>';
  }
  var st = schNachStellung(pt, s.pv.k);
  var dreh = pt.gegner !== 'zwei' && pt.farbe === 'b';
  var h = schBrettHtml(st.p, { letzt: st.letzt, dreh: dreh })
    + '<div class="sch-nav"><button type="button" onclick="schNachSchritt(-99)" aria-label="Anfang">⏮</button>'
    + '<button type="button" onclick="schNachSchritt(-1)" aria-label="zurück">◀</button>'
    + '<button type="button" onclick="schNachSchritt(1)" aria-label="vor">▶</button>'
    + '<button type="button" onclick="schNachSchritt(99)" aria-label="Ende">⏭</button></div>'
    + '<div class="sch-status"><span>' + esc(pt.name) + '</span><b>' + s.pv.k + ' / ' + pt.zuege.length + '</b></div>';
  if (s.pv.laeuft) { h += '<div class="sch-hinweis">Analysiere … ' + s.pv.stand + ' / ' + pt.zuege.length + '</div>'; }
  else if (pt.analyse) {
    h += '<div class="sch-analyse">' + (pt.analyse.length ? pt.analyse.map(function (f) {
      return '<button type="button" class="sch-zeile" onclick="schNachGehe(' + f.ply + ')"><span>' + (Math.floor(f.ply / 2) + 1) + (f.ply % 2 ? '… ' : '. ')
        + esc(f.kurz) + (f.verlust >= 300 ? '??' : '?') + '<small>besser: ' + esc(f.besser) + '</small></span><b>−'
        + (Math.round(f.verlust / 10) / 10).toFixed(1).replace('.', ',') + '</b></button>';
    }).join('') : '<p class="leise">Keine Fehler gefunden — sauber gespielt!</p>') + '</div>';
  }
  return h + schZugListeHtml(pt.kurz || [], s.pv.k, 'schNachGehe');
}

/* Bereich Schule: Kapitel, Lektionen, Schritte, Aufgaben */
function schSchuleHtml() {
  var s = cl.sch;
  var st = schStand();
  if (s.sv.lektion) {
    var l = schLektionFinden(s.sv.lektion);
    if (!l) { s.sv.lektion = ''; return schSchuleHtml(); }
    if (s.sv.aufgabe >= 0 && s.ue) { return schUeHtml(l); }
    var sc = l.schritte[Math.min(s.sv.schritt, l.schritte.length - 1)];
    var p = schStellungAus(sc);
    return schBrettHtml(p, { marken: sc.marken, dreh: !!sc.schwarz })
      + '<div class="sch-erkl">' + clAuszeichnungKurz(sc.text) + '</div>'
      + (l.schritte.length > 1 ? '<div class="sch-nav"><button type="button" onclick="schSchrittGehe(-1)" aria-label="zurück">◀</button>'
        + '<span class="leise">' + (s.sv.schritt + 1) + ' / ' + l.schritte.length + '</span>'
        + '<button type="button" onclick="schSchrittGehe(1)" aria-label="weiter">▶</button></div>' : '')
      + (l.aufgaben && l.aufgaben.length ? '<div class="sch-aufg-liste">' + l.aufgaben.map(function (a, n) {
          return '<button type="button" class="knopf' + (st.a[a.id] ? ' voll' : '') + '" onclick="schAufgabeOeffnen(' + n + ')">' + (st.a[a.id] ? '✓ ' : '') + 'Aufgabe ' + (n + 1) + '</button>';
        }).join('') + '</div>' : '');
  }
  if (s.sv.kapitel) {
    var k = schKapitelFinden(s.sv.kapitel);
    if (!k) { s.sv.kapitel = ''; return schSchuleHtml(); }
    return '<div class="sch-kapitel-titel">' + esc(k.titel) + '</div>' + k.lektionen.map(function (x) {
      var n = (x.aufgaben || []).length;
      var g = (x.aufgaben || []).filter(function (a) { return st.a[a.id]; }).length;
      return '<button type="button" class="sch-zeile" onclick="schLektionOeffnen(\'' + esc(x.id) + '\')"><span>' + esc(x.titel)
        + '<small>' + (n ? g + ' / ' + n + ' Aufgaben gelöst' : (st.l[x.id] ? 'gelesen' : 'noch offen')) + '</small></span><b>' + (schLektionFertig(x, st) ? '✓' : '') + '</b></button>';
    }).join('');
  }
  return schBereichLeiste() + schKapitelListe().map(function (k, i) {
    var lekt = k.lektionen;
    var aufg = 0;
    var gel = 0;
    lekt.forEach(function (x) { (x.aufgaben || []).forEach(function (a) { aufg++; if (st.a[a.id]) { gel++; } }); });
    var anteil = aufg ? Math.round(gel * 100 / aufg) : 0;
    return '<button type="button" class="sch-zeile" onclick="schKapitelOeffnen(\'' + esc(k.id) + '\')"><span>' + (i + 1) + '. ' + esc(k.titel)
      + '<small>' + (k.id === 'k7' ? aufg + ' Fehler aus deinen Partien zum Üben' : lekt.length + ' Lektionen · ' + aufg + ' Aufgaben') + '</small></span>'
      + (k.id === 'k7' ? '<b>' + aufg + '</b>' : '<span class="sch-balken"><i style="width:' + anteil + '%"></i></span>') + '</button>';
  }).join('');
}

/* Kleine Auszeichnung für Lektionstexte: **fett**, Zeilen mit • */
function clAuszeichnungKurz(t) {
  return esc(String(t || '')).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
}

/* Das Übungsbrett */
function schUeHtml(l) {
  var ue = cl.sch.ue;
  var a = ue.a;
  var typ = a.typ || 'zug';
  var titel = ue.art === 'ueben' ? 'Üben: ' + a.name : (l ? l.titel + ' · Aufgabe ' + (cl.sch.sv.aufgabe + 1) + ' / ' + l.aufgaben.length : '');
  var frage = a.frage || (typ === 'endspiel' ? 'Spiele gegen CLIE.' : (ue.p.w ? 'Weiß' : 'Schwarz') + ' am Zug.');
  if (ue.art === 'ueben') { frage = 'Du spielst ' + (ue.ich === 'w' ? 'Weiß' : 'Schwarz') + ' — ziehe die Buchzüge.'; }
  var h = '<div class="sch-kapitel-titel">' + esc(titel) + '</div>'
    + schBrettHtml(ue.p, { wahl: ue.wahl, letzt: ue.letzt, dreh: ue.ich === 'b', klick: typ === 'frage' ? '' : 'schUeTipp', marken: a.marken, ruht: !!cl.sch.fenster })
    + '<div class="sch-status"><span>' + esc(frage) + '</span>'
    + (typ === 'endspiel' && a.limit ? '<b>Zug ' + ue.zugZahl + ' / ' + a.limit + '</b>' : (ue.fehler ? '<b>Fehler ' + ue.fehler + '</b>' : '')) + '</div>';
  if (typ === 'frage') {
    h += '<div class="sch-optionen">' + a.optionen.map(function (o, n) {
      var kl = (ue.antwort === n) ? (n === a.richtig ? ' voll' : ' falsch') : '';
      return '<button type="button" class="knopf' + kl + '" onclick="schUeAntwort(' + n + ')">' + esc(o) + '</button>';
    }).join('') + '</div>';
  }
  if (ue.meldung) { h += '<div class="sch-hinweis' + (ue.ok === true ? ' gut' : '') + '">' + esc(ue.meldung) + '</div>'; }
  return h + (ue.art === 'ueben' ? schZugListeHtml(schBuchListe(a).slice(0, ue.idx), ue.idx, '') : '');
}

/* Bereich Eröffnungen: Liste, Durchspielen, Üben */
function schEroeffnungenHtml() {
  var s = cl.sch;
  var st = schStand();
  if (s.ue && s.ue.art === 'ueben') { return schUeHtml(null); }
  var e = s.ev.id ? schEroeffnungFinden(s.ev.id) : null;
  if (!e) {
    var gruppe = '';
    return schBereichLeiste() + (typeof SCH_EROEFFNUNGEN !== 'undefined' ? SCH_EROEFFNUNGEN : []).map(function (x) {
      var g = x.gruppe !== gruppe ? '<div class="sch-gruppe">' + esc(x.gruppe) + '</div>' : '';
      gruppe = x.gruppe;
      return g + '<button type="button" class="sch-zeile" onclick="schEroeffnungOeffnen(\'' + esc(x.id) + '\')"><span>' + esc(x.name)
        + '<small>' + esc(schBuchListe(x).slice(0, 6).join(' ')) + ' · du übst ' + (x.seite === 'b' ? 'Schwarz' : 'Weiß') + '</small></span><b>' + (st.e[x.id] ? '★' : '') + '</b></button>';
    }).join('');
  }
  var liste = schBuchListe(e);
  var stell = schBuchStellung(e, s.ev.k);
  var erkl = s.ev.k ? schUebenErkl(e, s.ev.k) : '';
  return schBrettHtml(stell.p, { letzt: stell.letzt, dreh: e.seite === 'b' })
    + '<div class="sch-nav"><button type="button" onclick="schEroeffnungGehe(-99)" aria-label="Anfang">⏮</button>'
    + '<button type="button" onclick="schEroeffnungGehe(-1)" aria-label="zurück">◀</button>'
    + '<button type="button" onclick="schEroeffnungGehe(1)" aria-label="vor">▶</button>'
    + '<button type="button" onclick="schEroeffnungGehe(99)" aria-label="Ende">⏭</button></div>'
    + '<div class="sch-erkl">' + (s.ev.k ? '<b>' + esc((Math.floor((s.ev.k - 1) / 2) + 1) + ((s.ev.k - 1) % 2 ? '… ' : '. ') + liste[s.ev.k - 1]) + '</b> — ' + clAuszeichnungKurz(erkl || '') + '<br>' : '')
    + '<b>Idee:</b> ' + clAuszeichnungKurz(e.idee) + '<br><b>Achtung:</b> ' + clAuszeichnungKurz(e.falle) + '</div>'
    + schZugListeHtml(liste, s.ev.k, 'schEroeffnungSetze');
}

function schEroeffnungSetze(k) {
  cl.sch.ev.k = k;
  schZeichnen();
}

function schachHtml() {
  var s = cl.sch;
  if (!s.p) { schLaden(); }
  var h;
  if (s.bereich === 'partien') { h = (s.pv.id ? '' : schBereichLeiste()) + schPartienHtml(); }
  else if (s.bereich === 'schule') { h = schSchuleHtml(); }
  else if (s.bereich === 'eroeffnungen') { h = schEroeffnungenHtml(); }
  else { h = schBereichLeiste() + schSpielenHtml(); }
  return h + schFensterHtml();
}

function schachFussHtml() {
  var s = cl.sch;
  var k = function (text, aufruf, voll, aus) {
    return '<button type="button" class="knopf' + (voll ? ' voll' : '') + '" onclick="' + aufruf + '"' + (aus ? ' disabled' : '') + '>' + text + '</button>';
  };
  if (s.bereich === 'partien' && s.pv.id) {
    return k('Ab hier spielen', 'schAbHier()', true) + k('Analyse', 'schAnalysieren()', false, s.pv.laeuft) + k('Mehr…', 'schMehrOeffnen()') + k('Fertig', 'schEbeneHoch()');
  }
  if ((s.bereich === 'schule' || s.bereich === 'eroeffnungen') && s.ue) {
    var typ = s.ue.a.typ || 'zug';
    if (s.ue.ok === true) {
      return s.ue.art === 'ueben' ? k('Nochmal', 'schEroeffnungUeben()', true) + k('Fertig', 'schEbeneHoch()')
        : k('Nächste', 'schUeWeiter()', true) + k('Fertig', 'schEbeneHoch()');
    }
    if (typ === 'endspiel') { return k('↶ Zurück', 'schUeZurueck()') + k('Tipp', 'schUeHilfe()') + k('Neu starten', 'schUeNeu()') + k('Fertig', 'schEbeneHoch()'); }
    return k('Tipp', 'schUeHilfe()') + k('Lösung', 'schUeLoesung()') + k('Fertig', 'schEbeneHoch()');
  }
  if (s.bereich === 'schule' && s.sv.lektion) {
    var l = schLektionFinden(s.sv.lektion);
    var hat = l && l.aufgaben && l.aufgaben.length;
    return (hat ? k('Zur Aufgabe', 'schAufgabeOeffnen(0)', true) : '') + k('Fertig', 'schEbeneHoch()');
  }
  if (s.bereich === 'schule') { return (s.sv.kapitel ? '' : k('Weiterlernen', 'schWeiterlernen()', true)) + (s.sv.kapitel ? k('Fertig', 'schEbeneHoch()') : ''); }
  if (s.bereich === 'eroeffnungen' && s.ev.id) { return k('Üben', 'schEroeffnungUeben()', true) + k('Fertig', 'schEbeneHoch()'); }
  if (s.bereich === 'spielen') {
    return k('Neu…', 'schNeuOeffnen()') + k('↶ Zurück', 'schZurueckNehmen()', false, !(s.zuege.length && !s.denkt))
      + k('Tipp', 'schTippZeigen()', false, !!(s.ende || s.denkt)) + k('⇅ Drehen', 'schDrehen()');
  }
  return '';
}

/* Eine Ebene zurück (Fertig-Knopf und Android-Zurück). true = etwas getan */
function schEbeneHoch() {
  var s = cl.sch;
  if (s.fenster === 'neu' || s.fenster === 'umwandeln' || s.fenster === 'speichern' || s.fenster === 'mehr') { schFensterZu(); return true; }
  if (s.bereich === 'partien' && s.pv.id) { s.pv.id = ''; schZeichnen(); return true; }
  if (s.ue) { s.ue = null; s.sv.aufgabe = -1; schZeichnen(); return true; }
  if (s.bereich === 'schule' && s.sv.lektion) { s.sv.lektion = ''; schZeichnen(); return true; }
  if (s.bereich === 'schule' && s.sv.kapitel) { s.sv.kapitel = ''; schZeichnen(); return true; }
  if (s.bereich === 'eroeffnungen' && s.ev.id) { s.ev.id = ''; schZeichnen(); return true; }
  return false;
}

function schZeichnen() {
  if (cl.app !== 'schach') { return; }
  inhaltZeichnen();
  fussZeichnen();
  kopfZeichnen();
}

function schKopfStufe() {
  return (SCH_STUFEN.filter(function (x) { return x[0] === cl.sch.stufe; })[0] || ['', 'Mittel'])[1];
}

function schKopfText() {
  if (!cl.sch.p) { schLaden(); }
  var s = cl.sch;
  if (s.bereich === 'partien') { return s.pv.id ? 'Nachspielen' : String(schPartienLesen().length); }
  if (s.bereich === 'schule') {
    var st = schStand();
    var alle = schLektionenAlle();
    return alle.filter(function (l) { return schLektionFertig(l, st); }).length + ' / ' + alle.length;
  }
  if (s.bereich === 'eroeffnungen') { return (typeof SCH_EROEFFNUNGEN !== 'undefined' ? SCH_EROEFFNUNGEN.length : 0) + ' Eröffnungen'; }
  return s.gegner === 'zwei' ? '2 Spieler' : schKopfStufe();
}

/* ---------- Lernkartei (seit 0.23) ----------

   Karteikarten nach dem Fächer-Prinzip (Leitner): Fach 1 täglich, dann
   2, 4, 8 und 16 Tage. Gewusst → ein Fach weiter, Teilweise → bleibt,
   Nicht gewusst → zurück in Fach 1 (und heute noch einmal).
   Rückseiten mit Absätzen, Aufzählungen und **fett**; Listen lassen sich
   Punkt für Punkt aufdecken. Kästen entstehen von Hand, aus eingefügtem
   Text, aus einem Memo oder aus einem Kartenpaket (JSON-Datei). Alles
   bleibt nur auf diesem Gerät. */

var LK_KEY = 'clie-lernkartei';
var LK_INTERVALL = [0, 1, 2, 4, 8, 16];
var LK_RICHTUNGEN = [['vor', 'Vorder → Rück'], ['rueck', 'Rück → Vorder'], ['gemischt', 'Gemischt']];

cl.lk = { ansicht: 'liste', id: '', fenster: '', karte: '', suche: '', sitzung: null, paket: null, ziel: '' };

function lkDaten() {
  var d = null;
  try { d = JSON.parse(window.localStorage.getItem(LK_KEY) || 'null'); } catch (e) { d = null; }
  d = (d && typeof d === 'object') ? d : {};
  if (!Array.isArray(d.kaesten)) { d.kaesten = []; }
  if (!d.neu || typeof d.neu !== 'object') { d.neu = { datum: '', z: {} }; }
  if (d.neu.datum !== isoDatum()) { d.neu = { datum: isoDatum(), z: {} }; }
  return d;
}

function lkSichern(d) {
  try { window.localStorage.setItem(LK_KEY, JSON.stringify(d)); return true; }
  catch (e) { melde('Speichern ging nicht — der Speicher ist voll.', 'warn'); return false; }
}

function lkKasten(d, id) {
  return d.kaesten.filter(function (k) { return k.id === id; })[0] || null;
}

/* Wie viele neue Karten heute noch dazukommen dürfen */
function lkNeuFrei(d, k) {
  var schon = Number(d.neu.z[k.id]) || 0;
  var neu = k.karten.filter(function (c) { return !c.fach; }).length;
  return Math.max(0, Math.min(neu, (Number(k.neuProTag) || 20) - schon));
}

function lkFaellig(k) {
  var heute = isoDatum();
  return k.karten.filter(function (c) { return c.fach >= 1 && (!c.faellig || c.faellig <= heute); });
}

function lkHeuteZahl(d, k) {
  return lkFaellig(k).length + lkNeuFrei(d, k);
}

function lkAlleHeute() {
  var d = lkDaten();
  return d.kaesten.reduce(function (n, k) { return n + lkHeuteZahl(d, k); }, 0);
}

/* ---- Text der Karten: Absätze, Aufzählungen, fett ---- */

function lkListenZeile(z) {
  return /^\s*([•\-*]|\d{1,2}[.)])\s+/.test(z);
}

/* k = wie viele Listenpunkte schon aufgedeckt sind (-1 = alle) */
function lkTextHtml(t, k) {
  var n = 0;
  return String(t || '').split('\n').map(function (z) {
    var fett = function (x) { return esc(x).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); };
    if (lkListenZeile(z)) {
      var m = z.match(/^\s*([•\-*]|\d{1,2}[.)])\s+(.*)$/);
      var zeichen = /\d/.test(m[1]) ? m[1].replace(')', '.') : '•';
      var zu = k >= 0 && n >= k;
      n++;
      return '<div class="lk-punkt' + (zu ? ' zu' : '') + '"><span>' + esc(zeichen) + '</span><span>' + (zu ? '…………' : fett(m[2])) + '</span></div>';
    }
    return z.trim() ? '<div class="lk-zeile">' + fett(z) + '</div>' : '<div class="lk-leer"></div>';
  }).join('');
}

function lkPunkte(t) {
  return String(t || '').split('\n').filter(lkListenZeile).length;
}

/* ---- Lernen ---- */

function lkMischen(l) {
  var i;
  for (i = l.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = l[i]; l[i] = l[j]; l[j] = t; }
  return l;
}

/* Sitzung: fällige Karten (gemischt) und die neuen für heute — aus einem Kasten oder allen */
function lkLernen(kastenId) {
  var d = lkDaten();
  var schlange = [];
  d.kaesten.forEach(function (k) {
    if (kastenId && k.id !== kastenId) { return; }
    var faellig = lkMischen(lkFaellig(k).slice());
    var neu = k.karten.filter(function (c) { return !c.fach; }).slice(0, lkNeuFrei(d, k));
    faellig.concat(neu).forEach(function (c) {
      var r = k.richtung === 'rueck' || (k.richtung === 'gemischt' && Math.random() < 0.5);
      schlange.push({ k: k.id, c: c.id, r: r });
    });
  });
  if (!schlange.length) { melde('Heute ist nichts fällig. Gut gemacht!', 'gut'); return; }
  cl.lk.sitzung = { schlange: schlange, i: 0, um: false, auf: 0, stat: { g: 0, t: 0, n: 0 }, wieder: {} };
  cl.lk.ansicht = 'lernen';
  cl.lk.fenster = '';
  lkZeichnen();
}

function lkAktuell() {
  var s = cl.lk.sitzung;
  if (!s || s.i >= s.schlange.length) { return null; }
  var e = s.schlange[s.i];
  var d = lkDaten();
  var k = lkKasten(d, e.k);
  var c = k ? k.karten.filter(function (x) { return x.id === e.c; })[0] : null;
  return c ? { d: d, k: k, c: c, e: e } : null;
}

/* Frage und Antwort je nach Richtung */
function lkSeiten(c, rueck) {
  if (!rueck) { return { frage: c.v, antwort: c.r }; }
  return { frage: c.w || String(c.r || '').split('\n')[0], antwort: c.v + (c.w ? '\n' + c.r : '') };
}

function lkUmdrehen() {
  var s = cl.lk.sitzung;
  if (!s) { return; }
  s.um = true;
  s.auf = 0;
  lkZeichnen();
}

function lkNaechsterPunkt() {
  var s = cl.lk.sitzung;
  var a = lkAktuell();
  if (!s || !a) { return; }
  s.auf = Math.min(lkPunkte(lkSeiten(a.c, a.e.r).antwort), s.auf + 1);
  lkZeichnen();
}

function lkAllesZeigen() {
  var s = cl.lk.sitzung;
  if (!s) { return; }
  s.auf = -1;
  lkZeichnen();
}

/* Bewertung: g = gewusst, t = teilweise, n = nicht gewusst */
function lkBewerten(was) {
  var s = cl.lk.sitzung;
  var a = lkAktuell();
  if (!s || !a || ['g', 't', 'n'].indexOf(was) < 0) { return; }
  var c = a.c;
  var heute = isoDatum();
  if (!c.fach) { a.d.neu.z[a.k.id] = (Number(a.d.neu.z[a.k.id]) || 0) + 1; c.fach = 1; }
  if (was === 'g') { c.fach = Math.min(5, c.fach + 1); c.faellig = tagePlus(heute, LK_INTERVALL[c.fach]); }
  else if (was === 't') { c.faellig = tagePlus(heute, 1); }
  else {
    c.fach = 1;
    c.faellig = heute;
    /* heute noch einmal — aber nur einmal */
    if (!s.wieder[c.id]) { s.wieder[c.id] = 1; s.schlange.push({ k: a.e.k, c: c.id, r: a.e.r }); }
  }
  c.gesehen = (Number(c.gesehen) || 0) + 1;
  s.stat[was]++;
  lkSichern(a.d);
  s.i++;
  s.um = false;
  s.auf = 0;
  lkZeichnen();
}

/* ---- Kästen und Karten ---- */

function lkKastenNeu(name) {
  var d = lkDaten();
  var k = { id: neueKennung(), name: String(name || 'Neuer Kasten').slice(0, 80), karten: [], neuProTag: 20, richtung: 'vor', angelegt: isoDatum() };
  d.kaesten.push(k);
  lkSichern(d);
  return k.id;
}

function lkKartenAusText(t) {
  return String(t || '').replace(/\r/g, '').split(/\n\s*\n/).map(function (b) {
    var z = b.split('\n').filter(function (x, i) { return i > 0 || x.trim(); });
    var v = (z.shift() || '').trim();
    return v ? { id: neueKennung(), v: v.slice(0, 500), r: z.join('\n').trim().slice(0, 4000), fach: 0, faellig: '' } : null;
  }).filter(function (c) { return !!c; });
}

/* Memo: jede Überschrift (#) wird eine Karte, der Text darunter die Rückseite */
function lkKartenAusMemo(text) {
  var karten = [];
  var akt = null;
  String(text || '').split('\n').forEach(function (z) {
    var m = z.match(/^\s*#{1,3}\s+(.*)$/);
    if (m) { akt = { id: neueKennung(), v: m[1].trim().slice(0, 500), r: '', fach: 0, faellig: '' }; karten.push(akt); return; }
    if (akt) { akt.r += (akt.r ? '\n' : '') + z.replace(/^\s*\[[ xX-]?\]\s*/, '- '); }
  });
  karten.forEach(function (c) { c.r = c.r.trim(); });
  return karten.filter(function (c) { return c.v && c.r; });
}

function lkFensterAuf(f) {
  cl.lk.fenster = f;
  lkZeichnen();
}

function lkFensterZu() {
  cl.lk.fenster = '';
  cl.lk.karte = '';
  cl.lk.paket = null;
  lkZeichnen();
}

function lkKastenOeffnen(id) {
  cl.lk.id = id;
  cl.lk.ansicht = 'kasten';
  cl.lk.fenster = '';
  lkZeichnen();
}

function lkNeuerKastenOk() {
  var f = document.getElementById('lkName');
  var name = String((f && f.value) || '').trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  cl.lk.fenster = '';
  lkKastenOeffnen(lkKastenNeu(name));
}

/* Text einfügen: in den gewählten Kasten (oder einen neuen) */
function lkEinfuegenOk() {
  var t = document.getElementById('lkText');
  var n = document.getElementById('lkName');
  var karten = lkKartenAusText(t && t.value);
  if (!karten.length) { melde('Keine Karte erkannt — erste Zeile Vorderseite, Leerzeile trennt Karten.', 'warn'); return; }
  var d = lkDaten();
  var k = cl.lk.id ? lkKasten(d, cl.lk.id) : null;
  if (!k) {
    var name = String((n && n.value) || '').trim() || 'Meine Karten';
    lkKastenNeu(name);
    d = lkDaten();
    k = d.kaesten[d.kaesten.length - 1];
  }
  k.karten = k.karten.concat(karten);
  lkSichern(d);
  melde(karten.length + ' Karten in „' + k.name + '“ übernommen.', 'gut');
  cl.lk.fenster = '';
  lkKastenOeffnen(k.id);
}

function lkMemoUebernehmen(seiteId) {
  var s = kpSeiteFinden(seiteId);
  var karten = s ? lkKartenAusMemo(s.text) : [];
  if (!karten.length) { melde('In diesem Memo gibt es keine Überschrift mit Text darunter.', 'warn'); return; }
  var d = lkDaten();
  var k = cl.lk.id ? lkKasten(d, cl.lk.id) : null;
  if (!k) { lkKastenNeu(s.titel); d = lkDaten(); k = d.kaesten[d.kaesten.length - 1]; }
  k.karten = k.karten.concat(karten);
  lkSichern(d);
  melde(karten.length + ' Karten aus „' + s.titel + '“ übernommen.', 'gut');
  cl.lk.fenster = '';
  lkKastenOeffnen(k.id);
}

/* Karte bearbeiten / neu */
function lkKarteOeffnen(id) {
  cl.lk.karte = id || '';
  lkFensterAuf('karte');
}

function lkKarteSpeichern() {
  var v = String((document.getElementById('lkV') || {}).value || '').trim();
  var r = String((document.getElementById('lkR') || {}).value || '').trim();
  if (!v) { melde('Die Vorderseite ist leer.', 'warn'); return; }
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k) { lkFensterZu(); return; }
  var c = cl.lk.karte ? k.karten.filter(function (x) { return x.id === cl.lk.karte; })[0] : null;
  if (!c) { c = { id: neueKennung(), fach: 0, faellig: '' }; k.karten.push(c); }
  c.v = v.slice(0, 500);
  c.r = r.slice(0, 4000);
  lkSichern(d);
  lkFensterZu();
}

function lkKarteLoeschen() {
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k) { lkFensterZu(); return; }
  k.karten = k.karten.filter(function (x) { return x.id !== cl.lk.karte; });
  lkSichern(d);
  lkFensterZu();
}

/* Während des Lernens: die aktuelle Karte bearbeiten */
function lkAktuelleBearbeiten() {
  var a = lkAktuell();
  if (!a) { return; }
  cl.lk.id = a.k.id;
  lkKarteOeffnen(a.c.id);
}

/* Details eines Kastens */
function lkDetailsSpeichern() {
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k) { lkFensterZu(); return; }
  var n = String((document.getElementById('lkName') || {}).value || '').trim();
  var t = Math.round(Number((document.getElementById('lkNeuTag') || {}).value));
  if (n) { k.name = n.slice(0, 80); }
  if (t >= 0 && t <= 200) { k.neuProTag = t; }
  lkSichern(d);
  lkFensterZu();
}

function lkRichtung(r) {
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k || !LK_RICHTUNGEN.some(function (x) { return x[0] === r; })) { return; }
  k.richtung = r;
  lkSichern(d);
  lkZeichnen();
}

function lkZuruecksetzen() {
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k) { return; }
  k.karten.forEach(function (c) { c.fach = 0; c.faellig = ''; });
  lkSichern(d);
  melde('Alle Karten sind wieder neu.', null);
  lkFensterZu();
}

function lkKastenLoeschen() {
  var d = lkDaten();
  d.kaesten = d.kaesten.filter(function (k) { return k.id !== cl.lk.id; });
  lkSichern(d);
  cl.lk.id = '';
  cl.lk.ansicht = 'liste';
  lkFensterZu();
}

/* ---- Kartenpakete (JSON-Dateien) ---- */

function lkPaketWaehlen() {
  var f = document.getElementById('lkDatei');
  if (f && f.click) { f.value = ''; f.click(); }
}

function lkPaketGewaehlt(feld) {
  var datei = feld && feld.files && feld.files[0];
  if (!datei || typeof window.FileReader !== 'function') { return; }
  var leser = new window.FileReader();
  leser.onload = function () { lkPaketPruefen(String(leser.result || ''), datei.name); };
  leser.readAsText(datei);
}

/* Prüft und zeigt ein Paket vor dem Übernehmen */
function lkPaketPruefen(text, dateiname) {
  var p = null;
  try { p = JSON.parse(text); } catch (e) { p = null; }
  if (!p || p.format !== 'clie-lernkartei' || !p.paket || !p.paket.id || !Array.isArray(p.karten)) {
    melde('Das ist kein Kartenpaket für CLIE.', 'warn');
    return false;
  }
  var karten = p.karten.filter(function (c) { return c && c.id && c.v; });
  cl.lk.paket = { id: String(p.paket.id), name: String(p.paket.name || dateiname || 'Paket'), version: Number(p.paket.version) || 1,
                  beschreibung: String(p.paket.beschreibung || ''), richtung: p.paket.richtung, datei: dateiname || '',
                  karten: karten.map(function (c) { return { id: String(c.id), v: String(c.v).slice(0, 500), r: String(c.r || '').slice(0, 4000), w: c.w ? String(c.w).slice(0, 200) : '' }; }) };
  cl.lk.fenster = 'paket';
  lkZeichnen();
  return true;
}

/* Übernehmen: neuer Kasten oder Aktualisierung — der Lernstand bleibt */
function lkPaketUebernehmen() {
  var p = cl.lk.paket;
  if (!p) { return; }
  var d = lkDaten();
  var k = d.kaesten.filter(function (x) { return x.paket && x.paket.id === p.id; })[0];
  var neu = 0;
  var geaendert = 0;
  if (!k) {
    k = { id: neueKennung(), name: p.name, karten: [], neuProTag: 20, richtung: ['vor', 'rueck', 'gemischt'].indexOf(p.richtung) >= 0 ? p.richtung : 'vor', angelegt: isoDatum() };
    d.kaesten.push(k);
  }
  k.paket = { id: p.id, version: p.version };
  var vorhanden = {};
  k.karten.forEach(function (c) { if (c.q) { vorhanden[c.q] = c; } });
  p.karten.forEach(function (x) {
    var c = vorhanden[x.id];
    if (c) {
      if (c.v !== x.v || c.r !== x.r || (c.w || '') !== x.w) { c.v = x.v; c.r = x.r; c.w = x.w; geaendert++; }
      return;
    }
    k.karten.push({ id: neueKennung(), q: x.id, v: x.v, r: x.r, w: x.w, fach: 0, faellig: '' });
    neu++;
  });
  if (!lkSichern(d)) { return; }
  melde('„' + k.name + '“: ' + neu + ' neue' + (geaendert ? ', ' + geaendert + ' aktualisierte' : '') + ' Karten.', 'gut');
  cl.lk.paket = null;
  cl.lk.fenster = '';
  lkKastenOeffnen(k.id);
}

/* ---- Zeichnen ---- */

function lkFaecher(k) {
  var f = [0, 0, 0, 0, 0, 0];
  k.karten.forEach(function (c) { f[Math.max(0, Math.min(5, Number(c.fach) || 0))]++; });
  return f;
}

function lkFaecherHtml(k) {
  var f = lkFaecher(k);
  var max = Math.max(1, f[1], f[2], f[3], f[4], f[5]);
  var h = '<div class="lk-faecher">';
  var i;
  for (i = 1; i <= 5; i++) {
    h += '<div><span class="lk-saeule"><i style="height:' + Math.round(f[i] * 100 / max) + '%"></i></span><b>' + f[i] + '</b><small>Fach ' + i + '</small></div>';
  }
  return h + '</div>';
}

function lkListeHtml() {
  var d = lkDaten();
  if (!d.kaesten.length) {
    return '<p>Noch keine Lernkartei.</p><p class="leise">Mit „Neu…“ legst du einen Kasten an, fügst Karten als Text ein, übernimmst ein Memo oder lädst ein Kartenpaket.</p>';
  }
  return d.kaesten.map(function (k) {
    var heute = lkHeuteZahl(d, k);
    var neu = k.karten.filter(function (c) { return !c.fach; }).length;
    return '<button type="button" class="lk-kasten" onclick="lkKastenOeffnen(\'' + esc(k.id) + '\')"><span class="lk-k1"><span>' + esc(k.name) + '</span><b>'
      + (heute ? heute + ' fällig' : '—') + '</b></span><small>' + (k.paket ? 'Paket · ' : '') + k.karten.length + ' Karten'
      + (neu ? ' · ' + neu + ' neu' : '') + ' · ' + lkFaecher(k)[5] + ' in Fach 5</small></button>';
  }).join('');
}

function lkKastenHtml() {
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k) { cl.lk.ansicht = 'liste'; return lkListeHtml(); }
  var faellig = lkFaellig(k).length;
  var neu = lkNeuFrei(d, k);
  return '<div class="lk-titel">' + esc(k.name) + '</div>'
    + lkFaecherHtml(k)
    + '<div class="lk-info">' + faellig + ' fällig · ' + neu + ' neue für heute · ' + k.karten.filter(function (c) { return !c.fach; }).length + ' noch nicht gelernt</div>'
    + '<div class="lk-info leise">Abfrage: ' + esc((LK_RICHTUNGEN.filter(function (x) { return x[0] === (k.richtung || 'vor'); })[0] || ['', ''])[1])
    + ' · bis zu ' + (Number(k.neuProTag) || 20) + ' neue pro Tag' + (k.paket ? ' · Paket v' + k.paket.version : '') + '</div>';
}

function lkKartenHtml() {
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  if (!k) { return ''; }
  var q = suNorm(cl.lk.suche || '');
  var l = k.karten.filter(function (c) { return !q || suNorm(c.v + ' ' + c.r + ' ' + (c.w || '')).indexOf(q) >= 0; });
  return '<div class="su-feld"><span>⌕</span><input id="lkSuche" type="search" autocomplete="off" placeholder="In den Karten suchen …" value="' + esc(cl.lk.suche) + '" oninput="lkSucheGetippt()"></div>'
    + '<div id="lkKartenListe">' + lkKartenListeHtml(l) + '</div>';
}

function lkKartenListeHtml(l) {
  return l.slice(0, 300).map(function (c) {
    return '<button type="button" class="lk-karte-zeile" onclick="lkKarteOeffnen(\'' + esc(c.id) + '\')"><span>' + esc(c.v)
      + '<small>' + esc(String(c.w || c.r || '').split('\n')[0].replace(/\*\*/g, '').slice(0, 70)) + '</small></span><b>' + (c.fach ? 'F' + c.fach : 'neu') + '</b></button>';
  }).join('') + (l.length > 300 ? '<p class="leise">… und ' + (l.length - 300) + ' weitere — die Suche grenzt ein.</p>' : '') + (l.length ? '' : '<p class="leise">Keine Karte gefunden.</p>');
}

function lkSucheGetippt() {
  var f = document.getElementById('lkSuche');
  cl.lk.suche = f ? String(f.value || '') : '';
  var d = lkDaten();
  var k = lkKasten(d, cl.lk.id);
  var ziel = document.getElementById('lkKartenListe');
  if (!k || !ziel) { return; }
  var q = suNorm(cl.lk.suche);
  ziel.innerHTML = lkKartenListeHtml(k.karten.filter(function (c) { return !q || suNorm(c.v + ' ' + c.r + ' ' + (c.w || '')).indexOf(q) >= 0; }));
}

function lkLernenHtml() {
  var s = cl.lk.sitzung;
  var a = lkAktuell();
  if (!s || !a) {
    var st = s ? s.stat : { g: 0, t: 0, n: 0 };
    return '<div class="lk-titel">Geschafft!</div><p>' + (st.g + st.t + st.n) + ' Karten gelernt: ' + st.g + ' gewusst, ' + st.t + ' teilweise, ' + st.n + ' nicht gewusst.</p>'
      + '<p class="leise">Nicht Gewusstes kommt morgen wieder, Gewusstes rückt ein Fach weiter.</p>';
  }
  var seite = lkSeiten(a.c, a.e.r);
  var punkte = lkPunkte(seite.antwort);
  var h = '<div class="lk-kopfzeile"><span>' + esc(a.k.name) + '</span><span>' + (s.i + 1) + ' / ' + s.schlange.length + '</span></div>'
    + '<button type="button" class="lk-seite vorn" onclick="lkUmdrehen()"><small>' + (a.e.r ? 'Rückseite → Vorderseite' : 'Vorderseite') + ' · ' + (a.c.fach ? 'Fach ' + a.c.fach : 'neu') + '</small>'
    + lkTextHtml(seite.frage, -1) + '</button>';
  if (!s.um) { return h + '<p class="leise lk-mitte">Erst selbst überlegen — dann umdrehen.</p>'; }
  var k = (punkte && s.auf >= 0) ? s.auf : -1;
  h += '<div class="lk-seite hinten"><small>Antwort' + (k >= 0 ? ' · ' + k + ' von ' + punkte + ' aufgedeckt' : '') + '</small>' + lkTextHtml(seite.antwort, k) + '</div>';
  if (k >= 0 && k < punkte) {
    h += '<div class="knoepfe lk-mitte"><button type="button" class="knopf voll" onclick="lkNaechsterPunkt()">Nächster Punkt</button>'
       + '<button type="button" class="knopf" onclick="lkAllesZeigen()">Alles zeigen</button></div>';
  }
  return h + '<div class="lk-bewerten"><button type="button" class="knopf" onclick="lkBewerten(\'n\')">✗ Nicht</button>'
    + '<button type="button" class="knopf" onclick="lkBewerten(\'t\')">~ Teilweise</button>'
    + '<button type="button" class="knopf voll" onclick="lkBewerten(\'g\')">✓ Gewusst</button></div>';
}
