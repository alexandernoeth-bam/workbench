/* ---- Lesezeichen (seit 0.29) ----
   Je Dokument in der Datenbank (d.marken, reist mit): von/bis als Satznummern, dazu
   der Anfang des ersten Satzes — passt die Nummer nach neuem Auslesen nicht mehr,
   findet CLIE die Stelle über diesen Text wieder. */

function vlMarken() {
  var d = vlDokument(cl.vl.id);
  return (d && Array.isArray(d.marken)) ? d.marken.slice().sort(function (a, b) { return a.von - b.von; }) : [];
}

function vlMarkeBei(i, doc) {
  var a = doc.absatz[i];
  return vlMarken().filter(function (m) {
    var k;
    for (k = m.von; k <= m.bis; k++) { if (doc.absatz[k] === a) { return true; } }
    return false;
  })[0] || null;
}

/* Bereich um einen Satz: nur der Satz, der Absatz oder der Satz mit den zwei davor */
function vlMarkeBereich(anker, umfang) {
  var doc = cl.vl.doc;
  if (!doc) { return { von: anker, bis: anker }; }
  if (umfang === 'satz') { return { von: anker, bis: anker }; }
  if (umfang === 'davor') { return { von: Math.max(0, anker - 2), bis: anker }; }
  var a = doc.absatz[anker];
  var von = anker;
  var bis = anker;
  while (von > 0 && doc.absatz[von - 1] === a) { von--; }
  while (bis < doc.saetze.length - 1 && doc.absatz[bis + 1] === a) { bis++; }
  return { von: von, bis: bis };
}

function vlMerkenDruck() {
  cl.vl.druck = jetzt();
}

/* Kurzer Tipp: Absatz merken, ohne anzuhalten. Langer Tipp (ab ½ s): Fenster. */
function vlMerkenTipp() {
  var lang = cl.vl.druck && jetzt() - cl.vl.druck >= 500;
  cl.vl.druck = 0;
  if (!cl.vl.doc) { return; }
  if (lang) { cl.vl.marke = { id: '', anker: cl.vl.i, umfang: 'absatz', notiz: '' }; vlFensterAuf('marke'); return; }
  var schon = vlMarkeBei(cl.vl.i, cl.vl.doc);
  if (schon) { melde('Dieser Absatz ist schon gemerkt — Tipp auf 🔖 am Absatz zum Bearbeiten.', null); return; }
  vlMarkeAnlegen(cl.vl.i, 'absatz', '');
  melde('🔖 Gemerkt.', 'gut');
}

function vlMarkeAnlegen(anker, umfang, notiz) {
  var d = vlDokument(cl.vl.id);
  var doc = cl.vl.doc;
  if (!d || !doc) { return null; }
  var b = vlMarkeBereich(anker, umfang);
  if (!Array.isArray(d.marken)) { d.marken = []; }
  var m = { id: neueKennung(), anker: anker, umfang: umfang, von: b.von, bis: b.bis, seite: doc.seite[b.von] || 1,
            anfang: String(doc.saetze[b.von] || '').slice(0, 60), notiz: String(notiz || '').slice(0, 300), angelegt: isoDatum() };
  d.marken.push(m);
  d.geaendert = jetzt();
  spaeterSichern();
  if (!cl.vl.laeuft || cl.vl.ansicht !== 'lesen') { vlZeichnen(); }
  else { var alt = document.getElementById('vlText'); var r = alt ? alt.scrollTop : 0; vlZeichnen(); var neu = document.getElementById('vlText'); if (neu) { neu.scrollTop = r; } }
  return m;
}

function vlMarkeOeffnen(id) {
  var m = vlMarken().filter(function (x) { return x.id === id; })[0];
  if (!m) { return; }
  cl.vl.marke = { id: m.id, anker: typeof m.anker === 'number' ? m.anker : m.von, umfang: m.umfang || 'absatz', notiz: m.notiz || '' };
  vlFensterAuf('marke');
}

function vlMarkeUmfang(u) {
  if (!cl.vl.marke) { return; }
  var n = document.getElementById('vlNotiz');
  if (n) { cl.vl.marke.notiz = String(n.value || ''); }
  cl.vl.marke.umfang = u;
  vlZeichnen();
}

function vlMarkeSpeichern() {
  var m = cl.vl.marke;
  var d = vlDokument(cl.vl.id);
  if (!m || !d || !cl.vl.doc) { vlFensterZu(); return; }
  var n = document.getElementById('vlNotiz');
  var notiz = n ? String(n.value || '').trim() : m.notiz;
  if (!m.id) { cl.vl.fenster = ''; vlMarkeAnlegen(m.anker, m.umfang, notiz); cl.vl.marke = null; return; }
  var b = vlMarkeBereich(m.anker, m.umfang);
  (d.marken || []).forEach(function (x) {
    if (x.id !== m.id) { return; }
    x.umfang = m.umfang; x.von = b.von; x.bis = b.bis; x.seite = cl.vl.doc.seite[b.von] || 1;
    x.anfang = String(cl.vl.doc.saetze[b.von] || '').slice(0, 60); x.notiz = notiz.slice(0, 300);
  });
  d.geaendert = jetzt();
  spaeterSichern();
  cl.vl.marke = null;
  vlFensterZu();
}

function vlMarkeLoeschen() {
  var d = vlDokument(cl.vl.id);
  if (d && cl.vl.marke) { d.marken = (d.marken || []).filter(function (x) { return x.id !== cl.vl.marke.id; }); d.geaendert = jetzt(); spaeterSichern(); }
  cl.vl.marke = null;
  vlFensterZu();
}

/* Nach dem Laden: Stimmt der Text an der Stelle nicht mehr, über den Satzanfang wiederfinden */
function vlMarkenAnpassen(d, t) {
  if (!d || !Array.isArray(d.marken) || !d.marken.length) { return; }
  var anders = false;
  d.marken.forEach(function (m) {
    if (!m.anfang || String(t.saetze[m.von] || '').slice(0, 60) === m.anfang) { return; }
    var probe = m.anfang.slice(0, 40);
    var beste = -1;
    var i;
    for (i = 0; i < t.saetze.length; i++) {
      if (t.saetze[i].indexOf(probe) === 0 && (beste < 0 || Math.abs(i - m.von) < Math.abs(beste - m.von))) { beste = i; }
    }
    if (beste < 0) { return; }
    var diff = beste - m.von;
    m.von += diff;
    m.bis = Math.min(t.saetze.length - 1, m.bis + diff);
    if (typeof m.anker === 'number') { m.anker += diff; }
    anders = true;
  });
  if (anders) { d.geaendert = jetzt(); spaeterSichern(); }
}

function vlMarkenZeigen() {
  cl.vl.ansicht = 'marken';

function vlMarkeHoeren(id) {
  var m = vlMarken().filter(function (x) { return x.id === id; })[0];

  cl.vl.ansicht = 'lesen';

}

}

function vlMarkenHtml() {

      + (m.notiz ? '<i>✎ ' + esc(m.notiz) + '</i>' : '') + '</button></div>';
  }).join('') + '<p class="leise">▶ hört genau dieses Stück und hält danach an. „Alle anhören“ spielt alle nacheinander — deine Zusammenfassung. Tipp auf den Text: bearbeiten.</p>';
}

/* Zurück: Fenster zu, dann aus dem Dokument zur Bibliothek (das Vorlesen läuft weiter) */
function vlEbeneHoch() {

  spaeterSichern();
}

/* Beim ersten Öffnen: die sieben Lebensbereiche anlegen (feste Kennungen) */
function krAnfangen() {
  if (krAlle('bereich').length) { return; }
  KR_BEREICHE.forEach(function (b, i) {
    krSpeichern({ id: b[0], typ: 'bereich', name: b[1], leitsatz: '', ist: 5, soll: 7, rang: i + 1, mehr: '', aus: false });
  });
}

function krBereiche(mitAusgeblendeten) {
  return krAlle('bereich').filter(function (b) { return mitAusgeblendeten || !b.aus; }).sort(function (a, b) {
    return (Number(a.rang) || 99) - (Number(b.rang) || 99) || String(a.name).localeCompare(String(b.name));
  });
}

function krPrinzipien() {
  return krAlle('prinzip').sort(function (a, b) { return (Number(a.rang) || 99) - (Number(b.rang) || 99) || (a.geaendert || 0) - (b.geaendert || 0); });
}

/* Fokus: wichtig (vorderer Rang) und große Lücke zwischen Ist und Soll — die zwei stärksten */
function krFokus() {
  var l = krBereiche(false);
  var n = l.length;
  return l.map(function (b, i) { return { id: b.id, w: ((Number(b.soll) || 0) - (Number(b.ist) || 0)) * (n - i) }; })
    .filter(function (x) { return x.w > 0; }).sort(function (a, b) { return b.w - a.w; }).slice(0, 2).map(function (x) { return x.id; });
}

/* ---- Woche ---- */

function krWochenId(is) {
  var mo = montagVon(is || isoDatum());
  var donnerstag = tagePlus(mo, 3);
  return 'kw-' + donnerstag.slice(0, 4) + '-' + zwei(kalenderwoche(mo));
}

function krWoche(anlegen) {
  var id = krWochenId();
  var w = krFinden(id);
  if (!w && anlegen) {
    w = { id: id, typ: 'woche', montag: montagVon(isoDatum()), wesentliche: [], rueckblick: null };
    if (!Array.isArray(DB.kurs)) { DB.kurs = []; }
    DB.kurs.push(w);
  }
  return w;
}

function krEntscheidungen(vonIso) {
  return krAlle('entscheidung').filter(function (e) { return !vonIso || String(e.datum || '') >= vonIso; })
    .sort(function (a, b) { return String(b.datum || '').localeCompare(String(a.datum || '')) || (b.geaendert || 0) - (a.geaendert || 0); });
}

function krWahlName(w) {
  return (KR_WAHL.filter(function (x) { return x[0] === w; })[0] || ['', '—'])[1];
}

/* Verlauf eines Bereichs aus den Wochenrückblicken (älteste zuerst) */
function krVerlauf(bereichId) {
  return krAlle('woche').filter(function (w) { return w.rueckblick && typeof w.rueckblick[bereichId] === 'number'; })
    .sort(function (a, b) { return String(a.id).localeCompare(String(b.id)); })
    .map(function (w) { return w.rueckblick[bereichId]; });
}

function krKurveSvg(werte, soll, gross) {
  var b = gross ? 300 : 100;
  var h = gross ? 60 : 26;
  if (!werte.length) { return gross ? '<p class="leise">Noch kein Rückblick — der Verlauf entsteht mit den Sonntagen.</p>' : '<span class="leise kr-leer">—</span>'; }
  var l = werte.slice(-12);
  var y = function (v) { return Math.round(h - 4 - (Math.max(1, Math.min(10, v)) - 1) * (h - 8) / 9); };
  var pkt = l.map(function (v, i) { return Math.round(4 + (l.length > 1 ? i * (b - 8) / (l.length - 1) : (b - 8) / 2)) + ',' + y(v); }).join(' ');
  return '<svg class="kr-kurve' + (gross ? ' gross' : '') + '" viewBox="0 0 ' + b + ' ' + h + '" preserveAspectRatio="none">'
    + (soll ? '<line x1="0" y1="' + y(soll) + '" x2="' + b + '" y2="' + y(soll) + '" class="kr-soll"/>' : '')
    + '<polyline points="' + pkt + '" class="kr-linie"/></svg>';
}

/* ---- Vorab-Check ---- */

function krCheckNeu() {
  var f = krFokus();
  cl.kr.check = { schritt: 1, was: '', bereich: '', stunden: '', geld: '', energie: 'mittel', zulasten: '', regeln: {}, wollen: 0, wahl: '', fokus: f };
  cl.kr.ansicht = 'check';
  cl.kr.fenster = '';
  krZeichnen();
}

/* Felder des aktuellen Schritts in den Zustand übernehmen */
function krCheckLesen() {
  var c = cl.kr.check;
  if (!c) { return; }
  var w = function (id) { var e = document.getElementById(id); return e && typeof e.value === 'string' ? e.value : null; };
  if (c.schritt === 1 && w('krWas') !== null) { c.was = String(w('krWas')).trim().slice(0, 160); }
  if (c.schritt === 2) {
    if (w('krStunden') !== null) { c.stunden = w('krStunden'); }
    if (w('krGeld') !== null) { c.geld = w('krGeld'); }
    if (w('krZulasten') !== null) { c.zulasten = w('krZulasten'); }
  }
}

function krCheckSetzen(feld, wert) {
  var c = cl.kr.check;
  if (!c) { return; }
  krCheckLesen();
  if (feld === 'regel') {
    var alt = c.regeln[wert] || '';
    c.regeln[wert] = alt === '' ? 'ok' : (alt === 'ok' ? 'nein' : (alt === 'nein' ? 'unklar' : 'ok'));
  } else if (feld === 'wollen') { c.wollen = Number(wert) || 0; }
  else { c[feld] = wert; }
  krZeichnen();
}

function krCheckSchritt(d) {
  var c = cl.kr.check;
  if (!c) { return; }
  krCheckLesen();
  if (d > 0 && c.schritt === 1 && !c.was) { melde('Worum geht es? Bitte kurz beschreiben.', 'warn'); return; }
  if (d > 0 && c.schritt === 3 && !c.wollen) { melde('Wie sehr willst du es? Bitte 1–10 wählen.', 'warn'); return; }
  c.schritt = Math.max(1, Math.min(4, c.schritt + d));
  if (c.schritt === 4 && !c.wahl) { c.wahl = krEmpfehlung(c).wahl; }
  krZeichnen();
}

/* Die Empfehlung: ein Spiegel, keine Vorschrift */
function krEmpfehlung(c) {
  var verletzt = Object.keys(c.regeln || {}).filter(function (k) { return c.regeln[k] === 'nein' && krFinden(k); }).length;
  var fokusLast = !!c.zulasten && (c.fokus || []).indexOf(c.zulasten) >= 0;
  var gruende = [];
  if (verletzt) { gruende.push(verletzt === 1 ? 'verletzt eine deiner Regeln' : 'verletzt ' + verletzt + ' deiner Regeln'); }
  if (c.wollen && c.wollen < 9) { gruende.push('kein klares Ja (' + c.wollen + '/10)'); }
  if (fokusLast) { gruende.push('geht zu Lasten eines Fokus-Bereichs'); }
  var wahl = 'ja';
  if ((verletzt && c.wollen < 9) || (c.wollen && c.wollen <= 4)) { wahl = 'nein'; }
  else if (fokusLast || (c.wollen && c.wollen < 9)) { wahl = 'kleiner'; }
  return { wahl: wahl, gruende: gruende };
}

/* Formulierung für eine Absage oder ein kleineres Ja */
function krAntwortText(c) {
  var was = c.was || 'das';
  var regel = krPrinzipien().filter(function (p) { return c.regeln[p.id] === 'nein'; })[0];
  var grund = regel ? 'Ich habe mir vorgenommen: „' + regel.text.replace(/\.$/, '') + '“' : 'Ich habe mir vorgenommen, mich auf weniger Dinge zu konzentrieren und die richtig zu machen';
  if (c.wahl === 'nein') {
    return 'Danke, dass du an mich denkst — das freut mich. ' + grund + ', deshalb sage ich bei „' + was + '“ diesmal ab. Ich hoffe, du verstehst das.';
  }
  if (c.wahl === 'kleiner') {
    return 'Danke für die Anfrage zu „' + was + '“. Ganz kann ich es gerade nicht übernehmen — ' + grund.charAt(0).toLowerCase() + grund.slice(1)
      + '. Einen kleineren Teil mache ich aber gern: [hier eintragen, was du anbietest].';
  }
  if (c.wahl === 'spaeter') {
    return 'Danke für „' + was + '“ — im Moment passt es nicht. Lass uns in ein paar Wochen noch einmal darüber sprechen.';
  }
  return '';
}

function krCheckMerken() {
  var c = cl.kr.check;
  if (!c || !c.wahl) { return; }
  var e = krSpeichern({ id: 'ke-' + neueKennung(), typ: 'entscheidung', datum: isoDatum(), was: c.was, bereich: c.bereich, stunden: c.stunden,
                        geld: c.geld, energie: c.energie, zulasten: c.zulasten, regeln: c.regeln, wollen: c.wollen,
                        empfehlung: krEmpfehlung(c).wahl, wahl: c.wahl, antwort: krAntwortText(c) });
  melde('Entscheidung gemerkt: ' + krWahlName(e.wahl) + '.', 'gut');
  cl.kr.check = null;
  cl.kr.ansicht = 'heute';
  krZeichnen();
}

function krKopieren(text) {
  var n = window.navigator;
  if (n && n.clipboard && typeof n.clipboard.writeText === 'function') {
    n.clipboard.writeText(text).then(function () { melde('Text kopiert.', 'gut'); }).catch(function () { melde('Kopieren ging nicht — Text bitte markieren.', 'warn'); });
  } else { melde('Kopieren ging nicht — Text bitte markieren.', 'warn'); }
}

function krAntwortKopieren() {
  if (cl.kr.check) { krKopieren(krAntwortText(cl.kr.check)); }
}

/* ---- Bereiche bearbeiten ---- */

function krBereichOeffnen(id) {
  cl.kr.bereich = id || '';
  cl.kr.ansicht = 'bereich';
  cl.kr.fenster = '';
  krZeichnen();
}

function krReglerZeigen(id, ziel) {
  var e = document.getElementById(id);
  var z = document.getElementById(ziel);
  if (e && z) { z.textContent = e.value; }
}

function krBereichSpeichern() {
  var b = cl.kr.bereich ? krFinden(cl.kr.bereich) : null;
  var w = function (id) { var e = document.getElementById(id); return e && typeof e.value === 'string' ? e.value : ''; };
  var name = String(w('krName')).trim();
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  if (!b) {
    b = { id: 'kb-' + neueKennung(), typ: 'bereich', rang: krBereiche(true).length + 1, aus: false };
  }
  b.name = name.slice(0, 40);
  b.leitsatz = String(w('krLeitsatz')).trim().slice(0, 300);
  b.mehr = String(w('krMehr')).trim().slice(0, 200);
  var ist = Math.round(Number(w('krIst')));
  var soll = Math.round(Number(w('krSoll')));
  if (ist >= 1 && ist <= 10) { b.ist = ist; }
  if (soll >= 1 && soll <= 10) { b.soll = soll; }
  var aus = document.getElementById('krAus');
  b.aus = !!(aus && aus.checked);
  krSpeichern(b);
  cl.kr.ansicht = 'bilanz';
  krZeichnen();
}

/* Rang verschieben (−1 = nach oben) */
function krRang(id, d) {
  var l = krBereiche(true);
  var i = l.map(function (b) { return b.id; }).indexOf(id);
  var j = i + d;
  if (i < 0 || j < 0 || j >= l.length) { return; }
  var t = l[i];
  l[i] = l[j];
  l[j] = t;
  l.forEach(function (b, k) { if (b.rang !== k + 1) { b.rang = k + 1; krSpeichern(b); } });
  krZeichnen();
}

/* ---- Prinzipien ---- */

function krPrinzipOeffnen(id) {
  cl.kr.nr = id || '';
  cl.kr.fenster = 'prinzip';
  krZeichnen();
}

function krPrinzipSpeichern() {
  var w = function (id) { var e = document.getElementById(id); return e && typeof e.value === 'string' ? e.value : ''; };
  var text = String(w('krPText')).trim();
  if (!text) { melde('Bitte die Regel eingeben.', 'warn'); return; }
  var p = cl.kr.nr ? krFinden(cl.kr.nr) : null;
  if (!p) { p = { id: 'kp-' + neueKennung(), typ: 'prinzip', rang: krPrinzipien().length + 1 }; }
  p.text = text.slice(0, 120);
  p.konkret = String(w('krPKonkret')).trim().slice(0, 200);
  var art = String(w('krPArt'));
  var zeit = String(w('krPZeit'));
  if ((art === 'ab' || art === 'bis') && /^\d{2}:\d{2}$/.test(zeit)) { p.zeitArt = art; p.zeit = zeit; } else { p.zeitArt = ''; p.zeit = ''; }
  krSpeichern(p);
  cl.kr.fenster = '';
  krZeichnen();
}

function krPrinzipLoeschen() {
  if (cl.kr.nr) { krLoeschen(cl.kr.nr); }
  cl.kr.fenster = '';
  krZeichnen();
}

function krVorschlagNehmen(i) {
  var v = KR_VORSCHLAEGE[i];
  if (!v) { return; }
  krSpeichern({ id: 'kp-' + neueKennung(), typ: 'prinzip', rang: krPrinzipien().length + 1, text: v[0], konkret: v[1] });
  melde('Übernommen — tippe darauf, um es in deine Worte zu fassen.', 'gut');
  cl.kr.fenster = '';
  krZeichnen();
}

/* ---- Woche: Wesentliches und Rückblick ---- */

function krWesentlichOeffnen() {
  var w = krWoche(false);
  if (w && (w.wesentliche || []).length >= 3) { melde('Höchstens drei — weniger ist mehr.', 'warn'); return; }
  cl.kr.fenster = 'wesentlich';
  cl.kr.nr = (krFokus()[0]) || '';
  krZeichnen();
}

function krWesentlichBereich(id) {
  cl.kr.nr = id;
  var e = document.getElementById('krWText');
  var text = e ? e.value : '';
  krZeichnen();
  var e2 = document.getElementById('krWText');
  if (e2) { e2.value = text; }
}

function krWesentlichSpeichern() {
  var e = document.getElementById('krWText');
  var text = String((e && e.value) || '').trim();
  if (!text) { melde('Was ist diese Woche wesentlich?', 'warn'); return; }
  var w = krWoche(true);
  if (!Array.isArray(w.wesentliche)) { w.wesentliche = []; }
  if (w.wesentliche.length >= 3) { melde('Höchstens drei.', 'warn'); return; }
  w.wesentliche.push({ id: neueKennung(), text: text.slice(0, 120), bereich: cl.kr.nr || '', erledigt: false });
  krSpeichern(w);
  cl.kr.fenster = '';
  krZeichnen();
}

function krWesentlichUm(id) {
  var w = krWoche(false);
  if (!w) { return; }
  (w.wesentliche || []).forEach(function (x) { if (x.id === id) { x.erledigt = !x.erledigt; } });
  krSpeichern(w);
  krZeichnen();
}

function krWesentlichWeg(id) {
  var w = krWoche(false);
  if (!w) { return; }
  w.wesentliche = (w.wesentliche || []).filter(function (x) { return x.id !== id; });
  krSpeichern(w);
  krZeichnen();
}

function krRueckblickSpeichern() {
  var w = krWoche(true);
  var rb = {};
  krBereiche(false).forEach(function (b) {
    var e = document.getElementById('krRb-' + b.id);
    var v = Math.round(Number(e && e.value));
    if (v >= 1 && v <= 10) { rb[b.id] = v; if (b.ist !== v) { b.ist = v; krSpeichern(b); } }
  });
  w.rueckblick = rb;
  w.rueckblickAm = isoDatum();
  var notiz = document.getElementById('krRbNotiz');
  if (notiz) { w.notiz = String(notiz.value || '').trim().slice(0, 600); }
  krSpeichern(w);
  cl.kr.fenster = '';
  melde('Rückblick gespeichert.', 'gut');
  krZeichnen();
}

/* Hinweis unter „Heute“: sonntags, solange der Rückblick fehlt */
function krRueckblickFaellig() {
  if (new Date().getDay() !== 0 || !krAlle('bereich').length) { return false; }
  var w = krWoche(false);
  return !(w && w.rueckblick);
}

/* ---- Zeichnen ---- */

function krBilanzHtml() {
  krAnfangen();
  var fokus = krFokus();
  var h = '<div class="abschnitt kr-ab"><span>Lebensbereiche</span><span class="leise">Ist ▮ · Soll ┃</span></div>';
  krBereiche(false).forEach(function (b, i) {
    var ist = Math.max(0, Math.min(10, Number(b.ist) || 0));
    var soll = Math.max(0, Math.min(10, Number(b.soll) || 0));
    var luecke = soll > ist ? '<s style="left:' + ist * 10 + '%;width:' + (soll - ist) * 10 + '%"></s>' : '';
    h += '<button type="button" class="kr-ber" onclick="krBereichOeffnen(\'' + esc(b.id) + '\')"><span class="kr-t"><span>' + (i + 1) + ' ' + esc(b.name)
      + (fokus.indexOf(b.id) >= 0 ? '<em class="kr-fokus">Fokus</em>' : '') + '</span><b>' + ist + ' → ' + soll + '</b></span>'
      + '<span class="kr-skala"><i style="width:' + ist * 10 + '%"></i>' + luecke + '<u style="left:calc(' + soll * 10 + '% - 2px)"></u></span>'
      + (b.leitsatz ? '<small>' + esc(b.leitsatz) + '</small>' : '') + '</button>';
  });
  var w = krWoche(false);
  var wes = (w && w.wesentliche) || [];
  var ent = krEntscheidungen(montagVon(isoDatum()));
  h += '<div class="kr-box"><b>Diese Woche:</b> ' + wes.filter(function (x) { return x.erledigt; }).length + ' von ' + wes.length + ' Wesentlichen erledigt · '
    + ent.length + ' Vorab-Check' + (ent.length === 1 ? '' : 's') + (ent.length ? ', davon ' + ent.filter(function (e) { return e.wahl === 'nein'; }).length + '× Nein' : '')
    + (krRueckblickFaellig() ? '<br>◎ Heute ist Sonntag — Zeit für den Rückblick.' : '') + '</div>';
  if (!krPrinzipien().length) { h += '<p class="leise">Tipp: Lege unter „Prinzipien“ 3–7 eigene Spielregeln an — der Vorab-Check prüft daran.</p>'; }
  return h;
}

function krBereichHtml() {
  var b = cl.kr.bereich ? krFinden(cl.kr.bereich) : null;
  var x = b || { name: '', leitsatz: '', ist: 5, soll: 7, mehr: '', aus: false };
  var l = krBereiche(true);
  var i = b ? l.indexOf(b) : -1;
  return '<div class="abschnitt kr-ab"><span>' + (b ? esc(b.name) : 'Neuer Bereich') + '</span>'
    + (b ? '<span><button type="button" class="kr-pfeil" onclick="krRang(\'' + esc(b.id) + '\',-1)"' + (i <= 0 ? ' disabled' : '') + ' aria-label="wichtiger">▲</button>Rang ' + (i + 1)
      + '<button type="button" class="kr-pfeil" onclick="krRang(\'' + esc(b.id) + '\',1)"' + (i >= l.length - 1 ? ' disabled' : '') + ' aria-label="weniger wichtig">▼</button></span>' : '') + '</div>'
    + '<label for="krName">Name:</label><input id="krName" class="eingabe" type="text" autocomplete="off" value="' + esc(x.name) + '">'
    + '<label for="krLeitsatz">Leitsatz — wer will ich hier sein?</label><textarea id="krLeitsatz" class="eingabe kr-feld">' + esc(x.leitsatz || '') + '</textarea>'
    + '<label for="krIst">Ist: <b id="krIstW">' + (x.ist || 5) + '</b></label><input id="krIst" class="vl-regler" type="range" min="1" max="10" step="1" value="' + (x.ist || 5) + '" oninput="krReglerZeigen(\'krIst\',\'krIstW\')">'
    + '<label for="krSoll">Soll: <b id="krSollW">' + (x.soll || 7) + '</b></label><input id="krSoll" class="vl-regler" type="range" min="1" max="10" step="1" value="' + (x.soll || 7) + '" oninput="krReglerZeigen(\'krSoll\',\'krSollW\')">'
    + '<label for="krMehr">Was hieße ein Punkt mehr? (optional)</label><input id="krMehr" class="eingabe" type="text" autocomplete="off" value="' + esc(x.mehr || '') + '">'
    + '<label class="haken"><input id="krAus" type="checkbox"' + (x.aus ? ' checked' : '') + '> ausblenden (zählt nicht mit)</label>'
    + (b ? '<label>Verlauf (aus den Wochenrückblicken)</label>' + krKurveSvg(krVerlauf(b.id), b.soll, true) : '');
}

function krPrinzipienHtml() {
  var l = krPrinzipien();
  return '<div class="abschnitt kr-ab"><span>Meine Spielregeln</span><span class="leise">' + l.length + '</span></div>'
    + (l.length ? l.map(function (p) {
      return '<button type="button" class="kr-prinz" onclick="krPrinzipOeffnen(\'' + esc(p.id) + '\')"><b>' + esc(p.text) + '</b>' + (p.konkret ? '<small>' + esc(p.konkret) + '</small>' : '') + '</button>';
    }).join('') : '<p class="leise">Noch keine. 3–7 eigene Grundsätze genügen — „+ Prinzip“ oder „Vorschläge…“ aus deinen Büchern.</p>')
    + (l.length > 7 ? '<p class="leise">Mehr als sieben Regeln merkt sich niemand — vielleicht lassen sich welche zusammenfassen?</p>' : '');
}

function krCheckHtml() {
  var c = cl.kr.check;
  if (!c) { cl.kr.ansicht = 'bilanz'; return krBilanzHtml(); }
  var h = '<div class="kr-schritte">' + [1, 2, 3, 4].map(function (n) { return '<span' + (n <= c.schritt ? ' class="an"' : '') + '></span>'; }).join('') + '</div>';
  var bereiche = krBereiche(false);
  var chip = function (feld, id, text, an) { return '<button type="button"' + (an ? ' class="an"' : '') + ' onclick="krCheckSetzen(\'' + feld + '\',\'' + esc(id) + '\')">' + esc(text) + '</button>'; };
  if (c.schritt === 1) {
    return h + '<div class="kr-frage">Worum geht es?</div>'
      + '<input id="krWas" class="eingabe" type="text" autocomplete="off" placeholder="z. B. Vereinsvorstand übernehmen" value="' + esc(c.was) + '">'
      + '<div class="kr-frage">Welcher Bereich?</div><div class="wahlreihe">' + bereiche.map(function (b) { return chip('bereich', b.id, b.name, c.bereich === b.id); }).join('') + '</div>'
      + '<p class="leise">Anfrage, Projekt, Kauf, Zusage — alles, was Zeit, Geld oder Kraft kostet. Erst prüfen, dann zusagen.</p>';
  }
  if (c.schritt === 2) {
    return h + '<div class="kr-frage">Was kostet es?</div>'
      + '<label for="krStunden">Stunden pro Woche (ungefähr):</label><input id="krStunden" class="eingabe" type="number" min="0" step="0.5" value="' + esc(c.stunden) + '">'
      + '<label for="krGeld">Geld (einmalig oder pro Monat, €):</label><input id="krGeld" class="eingabe" type="text" inputmode="decimal" autocomplete="off" value="' + esc(c.geld) + '">'

function krTagId(is) { return 'kt-' + (is || isoDatum()); }

function krTag(anlegen, is) {
  var id = krTagId(is);
  var t = krFinden(id);
  if (!t && anlegen) {
    t = { id: id, typ: 'tag', datum: is || isoDatum(), energie: 0, eines: null, hindernisse: [], planB: '', regel: '', morgenAm: '', abend: null };
    if (!Array.isArray(DB.kurs)) { DB.kurs = []; }
    DB.kurs.push(t);
  }
  return t;
}

function krStunde() { return new Date().getHours(); }

/* ---- Pfade ---- */

function krPfadDaten(id) {
  return (typeof KR_PFADE !== 'undefined' ? KR_PFADE : []).filter(function (p) { return p.id === id; })[0] || null;
}

function krPfadStaende() { return krAlle('pfad'); }

function krAktiverPfad() {
  var s = krPfadStaende().filter(function (x) { return x.aktiv; })[0];
  var p = s ? krPfadDaten(s.pfad) : null;
  return (s && p) ? { stand: s, pfad: p, schritt: p.schritte[Math.min(p.schritte.length - 1, Number(s.tag) || 0)], nr: Math.min(p.schritte.length, (Number(s.tag) || 0) + 1) } : null;
}

function krPfadStarten(id) {
  var p = krPfadDaten(id);
  if (!p) { return; }
  krPfadStaende().forEach(function (s) { if (s.aktiv && s.pfad !== id) { s.aktiv = false; krSpeichern(s); } });
  var s = krFinden('kpf-' + id);
  if (!s) { s = { id: 'kpf-' + id, typ: 'pfad', pfad: id, tag: 0, gestartet: isoDatum() }; }
  s.aktiv = true;
  krSpeichern(s);
  melde('Pfad „' + p.name + '“ ist aktiv — morgen früh geht es los, oder gleich mit der Morgen-Runde.', 'gut');
  krZeichnen();
}

function krPfadPause(id) {
  var s = krFinden('kpf-' + id);
  if (s) { s.aktiv = false; krSpeichern(s); }
  krZeichnen();
}

/* ---- Morgen-Runde ---- */

function krMorgenStarten() {
  var t = krTag(true);
  cl.kr.runde = { art: 'morgen', schritt: 1, energie: t.energie || 0, wahl: t.eines ? 'gewaehlt' : '', eigen: '', wennDann: t.eines ? t.eines.wennDann || '' : '',
                  aufgabe: true, hindernisse: (t.hindernisse || []).slice(), planB: t.planB || '' };
  cl.kr.ansicht = 'morgen';
  cl.kr.fenster = '';
  krZeichnen();
}

/* Vorschläge für „das Eine“: Pfad (bei wenig Energie die kleine Form), offene Wesentliche der Woche */
function krEinesVorschlaege(energie) {
  var l = [];
  var ap = krAktiverPfad();
  if (ap && ap.schritt) {
    l.push({ text: (energie && energie <= 2 && ap.schritt.klein) ? ap.schritt.klein : ap.schritt.eines, bereich: ap.pfad.bereich,
             quelle: 'Pfad ' + ap.pfad.name + ' · Tag ' + ap.nr + (energie && energie <= 2 ? ' · kleine Form' : '') });
  }
  var w = krWoche(false);
  ((w && w.wesentliche) || []).filter(function (x) { return !x.erledigt; }).forEach(function (x) {
    l.push({ text: x.text, bereich: x.bereich, quelle: 'Wesentliches der Woche' });
  });
  /* Nächste Schritte aus der Ideenwerkstatt (seit 0.31) */
  return l.concat(iwVorschlaege());
}

function krRundeLesen() {
  var r = cl.kr.runde;
  if (!r) { return; }
  var w = function (id) { var e = document.getElementById(id); return e && typeof e.value === 'string' ? e.value : null; };
  if (w('krEigen') !== null) { r.eigen = String(w('krEigen')); }
  if (w('krWennDann') !== null) { r.wennDann = String(w('krWennDann')); }
  if (w('krPlanB') !== null) { r.planB = String(w('krPlanB')); }
  var a = document.getElementById('krAufgabe');
  if (a && typeof a.checked === 'boolean') { r.aufgabe = a.checked; }
}

function krRundeSetzen(feld, wert) {
  var r = cl.kr.runde;
  if (!r) { return; }
  krRundeLesen();
  if (feld === 'hindernis') {
    var i = r.hindernisse.indexOf(wert);
    if (i >= 0) { r.hindernisse.splice(i, 1); } else { r.hindernisse.push(wert); }
    r.planB = krPlanBVorschlag(r);
  } else if (feld === 'energie') { r.energie = Number(wert) || 0; }
  else { r[feld] = wert; }
  krZeichnen();
}

function krPlanBVorschlag(r) {
  if (!r.hindernisse.length) { return ''; }
  var h = KR_HINDERNISSE.filter(function (x) { return x[0] === r.hindernisse[0]; })[0];
  var ap = krAktiverPfad();
  var klein = (ap && ap.schritt && ap.schritt.klein) ? ap.schritt.klein : 'die kleinste Form davon';
  return h ? h[2] + klein + '.' : '';
}

/* Gewähltes „Eines“ aus der Runde */
function krEinesAusRunde(r) {
  var t = krTag(false);
  if (r.wahl === 'gewaehlt' && t && t.eines) { return { text: t.eines.text, bereich: t.eines.bereich, quelle: t.eines.quelle, idee: t.eines.idee }; }
  if (r.wahl === '' || r.wahl === null || r.wahl === undefined) { return null; }
  if (r.wahl === 'eigen') { return r.eigen.trim() ? { text: r.eigen.trim().slice(0, 120), bereich: '', quelle: 'eigen' } : null; }
  var v = krEinesVorschlaege(r.energie)[Number(r.wahl)];
  return v || null;
}

function krRundeSchritt(d) {
  var r = cl.kr.runde;
  if (!r) { return; }
  krRundeLesen();
  if (d > 0 && r.schritt === 1 && !r.energie) { melde('Wie viel Energie hast du heute? Bitte 1–5 wählen.', 'warn'); return; }
  if (d > 0 && r.schritt === 3) {
    var e = krEinesAusRunde(r);
    if (!e) { melde('Was ist heute das Eine? Bitte wählen oder eintragen.', 'warn'); return; }
    if (!String(r.wennDann || '').trim()) { r.wennDann = ''; }
    var t = krTag(true);
    var neu = !t.eines || t.eines.text !== e.text;
    t.eines = { text: e.text, bereich: e.bereich || '', quelle: e.quelle || '', wennDann: String(r.wennDann || '').trim().slice(0, 200),
                erledigt: neu ? false : !!t.eines.erledigt, idee: e.idee || (neu ? '' : t.eines.idee || '') };
    if (r.aufgabe && neu) { krAlsAufgabe(e.text); }
    r.wahl = 'gewaehlt';
    krSpeichern(t);
  }
  r.schritt = Math.max(1, Math.min(5, r.schritt + d));
  krZeichnen();
}

/* Als Aufgabe für heute: in die Liste „Kurs“ (wird bei Bedarf angelegt) */
function krAlsAufgabe(text, listeName, zeit) {
  var name = listeName || 'Kurs';
  var s = kpSeitenAlle().filter(function (x) { return x.art === 'liste' && x.titel === name; })[0];
  if (!s) { s = kpSeiteAnlegen('liste', name, 'privat', ''); }
  if (!s) { return false; }
  var zeilen = String(s.text || '').split('\n');
  var nr = -1;
  zeilen.forEach(function (z, i) { var a = kpAufgabe(z); if (a && !a.erledigt && a.text === text) { nr = i; } });
  if (nr < 0) { nr = aufZeileAnhaengen(s, text); }
  aufPlanAnwenden(s, nr, isoDatum(), zeit || '');
  spaeterSichern();
  return true;
}

function krMorgenFertig() {
  var r = cl.kr.runde;
  var t = krTag(true);
  if (r) {
    krRundeLesen();
    t.energie = r.energie;
    t.hindernisse = r.hindernisse.slice();
    t.planB = String(r.planB || '').trim().slice(0, 240);
  }
  t.regel = (krRegelDesTages() || {}).id || '';
  t.morgenAm = isoZeitJetzt();
  krSpeichern(t);
  cl.kr.runde = null;
  cl.kr.ansicht = 'heute';
  melde('Guten Tag — auf Kurs!', 'gut');
  krZeichnen();
}

function isoZeitJetzt() {
  var d = new Date();
  return zwei(d.getHours()) + ':' + zwei(d.getMinutes());
}

/* Regel des Tages: deine Prinzipien im Wechsel, Tag für Tag eine andere */
function krRegelDesTages() {
  var p = krPrinzipien();
  if (!p.length) { return null; }
  return p[Math.abs(saTagNr(isoDatum()) || 0) % p.length];
}

function krImpuls() {
  var ap = krAktiverPfad();
  if (ap && ap.schritt) { return { titel: ap.schritt.titel, text: ap.schritt.impuls, uebung: ap.schritt.uebung, quelle: ap.schritt.quelle, kopf: 'Pfad ' + ap.pfad.name + ' · Tag ' + ap.nr }; }
  var i = KR_IMPULSE[Math.abs(saTagNr(isoDatum()) || 0) % KR_IMPULSE.length];
  return { titel: i[0], text: i[1], uebung: '', quelle: '', kopf: 'Impuls · noch kein Pfad aktiv' };
}

/* ---- Das Eine erledigen ---- */

function krEinesErledigt() {
  var t = krTag(false);
  if (!t || !t.eines) { return; }
  t.eines.erledigt = !t.eines.erledigt;
  if (t.eines.erledigt && t.eines.idee) { iwSchrittAbhaken(t.eines.idee, t.eines.text); }
  krSpeichern(t);
  if (t.eines.erledigt) { melde('Stark — eine Stimme für den, der du sein willst.', 'gut'); }
  krZeichnen();
}

/* ---- Abend-Runde ---- */

function krAbendStarten() {
  var t = krTag(true);
  var a = t.abend || {};
  cl.kr.runde = { art: 'abend', ergebnis: a.ergebnis || (t.eines && t.eines.erledigt ? 'ja' : ''), grund: a.grund || '', notiz: a.notiz || '' };
  cl.kr.ansicht = 'abend';
  cl.kr.fenster = '';
  krZeichnen();
}

function krAbendSetzen(feld, wert) {
  var r = cl.kr.runde;
  if (!r) { return; }
  var n = document.getElementById('krNotiz');
  if (n) { r.notiz = String(n.value || ''); }
  r[feld] = wert;
  if (feld === 'ergebnis' && wert === 'ja') { r.grund = ''; }
  krZeichnen();
}

function krAbendVorschlag(r) {
  var g = KR_GRUENDE.filter(function (x) { return x[0] === r.grund; })[0];
  return g ? g[2] : '';
}

function krAbendSpeichern() {
  var r = cl.kr.runde;
  if (!r || !r.ergebnis) { melde('Geschafft? Bitte Ja, Teilweise oder Nein wählen.', 'warn'); return; }
  var n = document.getElementById('krNotiz');
  if (n) { r.notiz = String(n.value || ''); }
  var t = krTag(true);
  var vorher = t.abend && t.abend.ergebnis;
  t.abend = { ergebnis: r.ergebnis, grund: r.ergebnis === 'ja' ? '' : r.grund, notiz: String(r.notiz || '').trim().slice(0, 400), vorschlag: krAbendVorschlag(r), am: isoZeitJetzt() };
  if (t.eines) {
    if (r.ergebnis === 'ja' && !t.eines.erledigt && t.eines.idee) { iwSchrittAbhaken(t.eines.idee, t.eines.text); }
    t.eines.erledigt = r.ergebnis === 'ja';
  }
  /* Der Pfad rückt nur weiter, wenn der Schritt (ganz oder teilweise) getan ist — und nur einmal am Tag */
  var ap = krAktiverPfad();
  var pfadSchritt = ap && t.eines && /^Pfad /.test(t.eines.quelle || '');
  if (pfadSchritt && (r.ergebnis === 'ja' || r.ergebnis === 'teil') && !(vorher === 'ja' || vorher === 'teil')) {
    ap.stand.tag = Math.min(ap.pfad.schritte.length, (Number(ap.stand.tag) || 0) + 1);
    if (ap.stand.tag >= ap.pfad.schritte.length) { ap.stand.aktiv = false; ap.stand.fertig = isoDatum(); melde('Pfad „' + ap.pfad.name + '“ geschafft — Glückwunsch!', 'gut'); }
    krSpeichern(ap.stand);
  }
  krSpeichern(t);
  cl.kr.runde = null;
  cl.kr.ansicht = 'heute';
  krZeichnen();
}

/* Kette: die letzten sieben Tage (✓ geschafft, ~ teilweise, · nicht/nichts) */
function krKette() {
  var l = [];
  var i;
  for (i = 6; i >= 0; i--) {
    var is = tagePlus(isoDatum(), -i);
    var t = krFinden(krTagId(is));
    var e = t && t.abend ? t.abend.ergebnis : (t && t.eines && t.eines.erledigt ? 'ja' : '');
    l.push({ datum: is, e: e, heute: i === 0 });
  }
  return l;
}

/* Hinweise unter „Heute“: Morgen bis 11 Uhr, Abend ab 18 Uhr — solange offen */
function krTagesHinweis() {
  if (!krAlle('bereich').length) { return ''; }
  var t = krTag(false);
  var h = krStunde();
  if (h >= 5 && h < 11 && !(t && t.morgenAm)) { return 'morgen'; }
  if (h >= 18 && !(t && t.abend) && (t && (t.morgenAm || t.eines))) { return 'abend'; }
  return '';
}

/* ---- Zeichnen ---- */

function krHeuteHtml() {
  krAnfangen();
  var t = krTag(false);
  var ap = krAktiverPfad();
  var h = '';
  /* Morgen */
  if (t && t.morgenAm) {

      + '<small>Energie ' + (t.energie || '—') + (regel ? ' · Regel: ' + esc(regel.text) : '') + '</small></button>';

      + (t.planB ? '<small>Plan B: ' + esc(t.planB) + '</small>' : '')
      + '<div class="knoepfe"><button type="button" class="knopf' + (t.eines.erledigt ? '' : ' voll') + '" onclick="krEinesErledigt()">' + (t.eines.erledigt ? '↶ doch nicht' : '✓ Erledigt') + '</button></div></div>';
  }
  /* Abend */
  if (t && t.abend) {
    var erg = { ja: '✓ geschafft', teil: '~ teilweise', nein: '✗ nicht geschafft' }[t.abend.ergebnis] || '';
    h += '<button type="button" class="kr-karte fertig" onclick="krAbendStarten()"><span class="kr-kh"><b>☾ Abend-Runde</b><span>✓ ' + esc(t.abend.am || '') + '</span></span>'
      + '<small>' + esc(erg) + (t.abend.vorschlag ? ' · Für morgen: ' + esc(t.abend.vorschlag) : '') + '</small></button>';
  } else {
    h += '<button type="button" class="kr-karte' + (krStunde() >= 17 ? ' jetzt' : '') + '" onclick="krAbendStarten()"><span class="kr-kh"><b>☾ Abend-Runde</b><span>' + (krStunde() >= 17 ? 'jetzt' : 'ab 18 Uhr') + '</span></span>'
      + '<small>2 Minuten: Wie lief’s, was war im Weg, was nehme ich mit?</small></button>';
  }
  /* Pfad und Kette */
  var kette = krKette();
  var auf = kette.filter(function (k) { return k.e === 'ja' || k.e === 'teil'; }).length;
  h += '<div class="abschnitt kr-ab"><span>' + (ap ? 'Pfad: ' + esc(ap.pfad.name) : 'Kein Pfad aktiv') + '</span><span class="leise">' + (ap ? 'Tag ' + ap.nr + ' / ' + ap.pfad.schritte.length : '') + '</span></div>'
    + '<div class="kr-kette">' + kette.map(function (k) {
      return '<i class="' + (k.e === 'ja' ? 'an' : (k.e === 'teil' ? 'halb' : '')) + (k.heute ? ' heute' : '') + '">' + (k.e === 'ja' ? '✓' : (k.e === 'teil' ? '~' : (k.heute ? '·' : ''))) + '</i>';
    }).join('') + '</div><p class="leise">' + auf + ' von 7 Tagen auf Kurs.' + (ap ? '' : ' Unter „Pfade“ wählst du einen Pfad — er führt dich Tag für Tag.') + '</p>';
  if (krRueckblickFaellig()) { h += '<div class="kr-box">◎ Heute ist Sonntag — Zeit für den Wochenrückblick (unter „Woche“).</div>'; }
  return h;
}

function krMorgenHtml() {
  var r = cl.kr.runde;
  if (!r) { cl.kr.ansicht = 'heute'; return krHeuteHtml(); }
  var namen = ['Energie', 'Impuls', 'Das Eine', 'Vorweg', 'Regel'];
  var h = '<div class="kr-stufen">' + namen.map(function (n, i) { return '<span' + (i < r.schritt ? ' class="an"' : '') + '>' + n + '</span>'; }).join('') + '</div>';
  if (r.schritt === 1) {
    return h + '<div class="kr-gross">Guten Morgen. Wie viel Energie hast du heute?</div><div class="kr-zahlen">'
      + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button"' + (r.energie === n ? ' class="an"' : '') + ' onclick="krRundeSetzen(\'energie\',' + n + ')">' + n + '</button>'; }).join('')
      + '</div><p class="leise">Bei 1–2 schlägt Kurs heute bewusst einen kleineren Schritt vor. Auch kleine Schritte zählen.</p>';
  }
  if (r.schritt === 2) {
    var im = krImpuls();
    return h + '<div class="leise">' + esc(im.kopf) + '</div><div class="kr-gross"><b>' + esc(im.titel) + '</b><br>' + esc(im.text) + '</div>'

    };

    return h + '<div class="kr-gross">Was ist heute <b>das Eine</b>?</div>'

      + v.map(function (x, i) { return (t && t.eines && t.eines.text === x.text) ? '' : opt(i, x.text, x.quelle + bn(x.bereich)); }).join('')
      + opt('eigen', 'Eigenes …', '') + (r.wahl === 'eigen' ? '<input id="krEigen" class="eingabe" type="text" autocomplete="off" value="' + esc(r.eigen) + '" placeholder="Was ist heute das Eine?">' : '')
      + '<label for="krWennDann">Wann und wo genau? (Wenn …, dann …)</label><input id="krWennDann" class="eingabe" type="text" autocomplete="off" value="' + esc(r.wennDann) + '" placeholder="Wenn ich …, dann …">'
      + '<label class="haken"><input id="krAufgabe" type="checkbox"' + (r.aufgabe ? ' checked' : '') + '> als Aufgabe für heute einplanen (Liste „Kurs“)</label>';
  }
  if (r.schritt === 4) {
    return h + '<div class="kr-gross">Was könnte heute dazwischenkommen?</div><div class="kr-chips">'
      + KR_HINDERNISSE.map(function (x) { return '<button type="button"' + (r.hindernisse.indexOf(x[0]) >= 0 ? ' class="an"' : '') + ' onclick="krRundeSetzen(\'hindernis\',\'' + x[0] + '\')">' + esc(x[1]) + '</button>'; }).join('')
      + '</div><label for="krPlanB">Dein Plan B:</label><textarea id="krPlanB" class="eingabe kr-feld" placeholder="Wenn …, dann …">' + esc(r.planB) + '</textarea>'
      + '<p class="leise">Wer Hindernisse vorher bedenkt, setzt Vorsätze deutlich öfter um (mentales Kontrastieren, Schweinehund).</p>';
  }
  var regel = krRegelDesTages();

    + (regel ? '<div class="kr-karte jetzt"><b>' + esc(regel.text) + '</b>' + (regel.konkret ? '<small>' + esc(regel.konkret) + '</small>' : '') + '</div>'
      : '<p class="leise">Noch keine Prinzipien — unter „Bilanz → Prinzipien“ legst du 3–7 eigene Spielregeln an.</p>')
    + '<p class="leise">Einen guten Tag! Am Abend schaust du in zwei Minuten zurück.</p>';
}

function krAbendHtml() {
  var r = cl.kr.runde;
  if (!r) { cl.kr.ansicht = 'heute'; return krHeuteHtml(); }
  var t = krTag(false);
  var chip = function (feld, wert, text) { return '<button type="button"' + (r[feld] === wert ? ' class="an"' : '') + ' onclick="krAbendSetzen(\'' + feld + '\',\'' + wert + '\')">' + text + '</button>'; };
  var h = '<div class="kr-gross">' + (t && t.eines ? 'Das Eine heute: <b>' + esc(t.eines.text) + '</b> — geschafft?' : 'Wie war dein Tag — warst du auf Kurs?') + '</div>'
    + '<div class="kr-ergebnis">' + chip('ergebnis', 'ja', '✓ Ja') + chip('ergebnis', 'teil', '~ Teilweise') + chip('ergebnis', 'nein', '✗ Nein') + '</div>';
  if (r.ergebnis === 'nein' || r.ergebnis === 'teil') {
    h += '<div class="kr-frage">Was war im Weg?</div><div class="kr-chips">' + KR_GRUENDE.map(function (g) { return chip('grund', g[0], esc(g[1])); }).join('') + '</div>';
    if (r.grund) { h += '<div class="kr-hinweis"><b>Vorschlag für morgen:</b> ' + esc(krAbendVorschlag(r)) + '</div>'; }
  }
  if (r.ergebnis === 'ja') { h += '<div class="kr-hinweis">Gut gemacht. Kleine Schritte, oft wiederholt, verändern am meisten.</div>'; }
  return h + '<label for="krNotiz">Was nehme ich mit? (optional)</label><textarea id="krNotiz" class="eingabe kr-feld">' + esc(r.notiz || '') + '</textarea>';
}

function krPfadeHtml() {
  var l = (typeof KR_PFADE !== 'undefined' ? KR_PFADE : []);
  return '<div class="abschnitt kr-ab"><span>Pfade</span><span class="leise">einer aktiv</span></div>' + l.map(function (p) {
    var s = krFinden('kpf-' + p.id);
    var tag = s ? Number(s.tag) || 0 : 0;
    var b = krFinden(p.bereich);
    return '<div class="kr-pfad' + (s && s.aktiv ? ' an' : '') + '"><span class="kr-kh"><b>' + esc(p.name) + '</b><span>' + (s && s.fertig ? '✓ geschafft' : (s ? tag + ' / ' + p.schritte.length : p.schritte.length + ' Schritte')) + '</span></span>'
      + '<small>' + esc(p.beschreibung || '') + (b ? ' · ' + esc(b.name) : '') + '</small>'

        : '<button type="button" class="knopf voll" onclick="krPfadStarten(\'' + esc(p.id) + '\')">' + (s ? 'Fortsetzen' : 'Starten') + '</button>') + '</div></div>';
  }).join('') + '<p class="leise">Ein Pfad führt dich Tag für Tag: Impuls am Morgen, ein konkreter Schritt, und er rückt nur weiter, wenn du den Schritt getan hast.</p>';
}

function kursHtml() {
  /* Die sieben Bereiche gibt es immer — egal, über welche Ansicht Kurs geöffnet wird (seit 0.33) */
  krAnfangen();
  var v = cl.kr.ansicht;
  var h = v === 'bereich' ? krBereichHtml() : v === 'prinzipien' ? krPrinzipienHtml() : v === 'check' ? krCheckHtml()
    : v === 'woche' ? krWocheHtml() : v === 'buch' ? krBuchHtml() : v === 'bilanz' ? krBilanzHtml()
    : v === 'morgen' ? krMorgenHtml() : v === 'abend' ? krAbendHtml() : v === 'pfade' ? krPfadeHtml() : krHeuteHtml();
  return '<div class="kr-form kr-app">' + h + '</div>' + krFensterHtml();
}

function kursFussHtml() {
  var k = function (t, a, voll) { return '<button type="button" class="knopf' + (voll ? ' voll' : '') + '" onclick="' + a + '">' + t + '</button>'; };
  var v = cl.kr.ansicht;
  if (v === 'bereich') { return k('OK', 'krBereichSpeichern()', true) + k('Abbrechen', 'krEbeneHoch()'); }

  if (v === 'check') {
    var c = cl.kr.check;
    if (c && c.schritt === 4) {
      return k('Entscheidung merken', 'krCheckMerken()', true) + (krAntwortText(c) ? k('Text kopieren', 'krAntwortKopieren()') : '') + k('◀ Zurück', 'krCheckSchritt(-1)');
    }

  }
  if (v === 'buch') { return k('Vorab-Check', 'krCheckNeu()', true) + k('Fertig', 'krEbeneHoch()'); }
  if (v === 'bilanz') { return k('Prinzipien', 'krAnsicht(\'prinzipien\')') + k('Buch', 'krAnsicht(\'buch\')') + k('+ Bereich', 'krBereichOeffnen(\'\')') + k('Fertig', 'krEbeneHoch()'); }
  if (v === 'morgen') {
    var r = cl.kr.runde;
