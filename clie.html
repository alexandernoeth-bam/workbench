  { id: 'familie', name: 'Zeit für die Familie', bereich: 'kb-beziehungen', beschreibung: 'Mit kleinen Ritualen und klaren Grenzen wirklich da sein für die Menschen, die dir am wichtigsten sind.', schritte: [
    { titel: 'Wo bist du gerade?', impuls: 'Oft bist du zu Hause, aber mit dem Kopf noch im Büro. Präsenz beginnt mit dem Bemerken: Bin ich gerade wirklich hier? Ohne Vorwurf, nur hinsehen.', uebung: 'Notiere drei Momente von gestern, in denen du körperlich bei der Familie warst, gedanklich aber woanders.', eines: 'Beim Abendessen das Handy in einen anderen Raum legen', klein: 'Beim nächsten Gespräch das Handy umdrehen', quelle: '' },
    { titel: 'Was zählt für dich?', impuls: 'Familie ist dir wichtig – aber was genau? Gemeinsames Lachen, Gespräche, Verlässlichkeit? Wenn du es benennst, kannst du gezielter Zeit dafür freihalten.', uebung: 'Schreib auf: Woran sollen sich deine Kinder später erinnern, wenn sie an diese Jahre denken?', eines: 'Jedem Kind heute 10 Minuten ungeteilte Aufmerksamkeit schenken', klein: 'Jedem Kind eine echte Frage zum Tag stellen', quelle: 'Essentialismus: das Wesentliche erkennen' },
    { titel: 'Fang mit fünf Minuten an', impuls: 'Du musst keinen Familientag planen, um etwas zu verändern. Fünf Minuten volle Zuwendung wirken mehr als eine Stunde mit halbem Kopf. Klein anfangen gilt auch hier.', uebung: 'Wann am Tag hättest du realistisch fünf ungestörte Minuten mit Partnerin, Partner oder Kindern?', eines: '5 Minuten ungeteilte Zeit mit einem Familienmitglied', klein: 'Eine Umarmung mit voller Aufmerksamkeit', quelle: '1%-Methode: Zwei-Minuten-Regel' },
    { titel: 'Ankommen nach der Arbeit', impuls: 'Der Wechsel vom Büro zur Familie passiert oft in einer Sekunde an der Haustür. Ein kurzes Übergangsritual hilft dir, den Arbeitstag abzulegen, bevor du hereinkommst.', uebung: 'Entwirf ein Ritual für die letzten zwei Minuten vor der Haustür oder nach dem Zuklappen des Laptops.', eines: 'Vor dem Heimkommen 2 Minuten bewusst durchatmen', klein: 'An der Tür einmal tief durchatmen', quelle: '' },
    { titel: 'Handyfreie Zonen', impuls: 'Das Handy zieht Aufmerksamkeit an, auch wenn es still daliegt. Feste Zeiten und Orte ohne Bildschirm – Esstisch, Zubettbringen – schaffen Raum, in dem die Familie Vorrang hat.', uebung: 'Wähle eine Zeit und einen Ort, die ab heute handyfrei sind. Schreib die Regel auf.', eines: 'Den Esstisch heute komplett handyfrei halten', klein: 'Beim Zubettbringen das Handy draußen lassen', quelle: '1%-Methode: Umgebung gestalten' },
    { titel: 'Wenn ich heimkomme, dann …', impuls: 'Gute Absichten verpuffen im Trubel. Ein fester Wenn-dann-Plan macht Zuwendung zum Automatismus: Wenn ich zur Tür hereinkomme, begrüße ich zuerst jeden persönlich.', uebung: 'Formuliere einen Wenn-dann-Plan für den Moment, in dem du heimkommst oder den Arbeitstag beendest.', eines: 'Beim Heimkommen jeden einzeln begrüßen, Handy in der Tasche', klein: 'Zuerst „Hallo“ sagen, dann alles andere', quelle: 'Schweinehund: Wenn-dann-Pläne' },
    { titel: 'Ein kleines Ritual', impuls: 'Rituale geben Kindern Halt und dir einen festen Anker. Es muss nichts Großes sein: die Gutenachtgeschichte, der Sonntagsspaziergang, Pfannkuchen am Samstag.', uebung: 'Welche Rituale gibt es schon? Welches kleine Ritual würdest du gern einführen? Notiere eines.', eines: 'Ein neues kleines Ritual heute zum ersten Mal ausprobieren', klein: 'Beim Zubettgehen fragen: „Was war heute schön?“', quelle: '1%-Methode: Gewohnheiten stapeln' },
    { titel: 'Gute Dinge am Tisch', impuls: 'Gemeinsames Erzählen verbindet. Wenn beim Abendessen jeder kurz sagt, was heute gut war, entsteht ein Ritual, das Aufmerksamkeit und Dankbarkeit verbindet.', uebung: 'Überlege, wie du die Frage einführst, ohne dass sie wie eine Pflicht klingt.', eines: 'Beim Abendessen jeden fragen: Was war heute gut?', klein: 'Selbst ein gutes Erlebnis des Tages erzählen', quelle: '' },
    { titel: 'Was dich wegzieht', impuls: 'Stell dir einen gelungenen Familienabend vor – und dann das, was ihn meistens verhindert: Mails, Müdigkeit, Hausprojekte. Wer das Hindernis kennt, kann es einplanen.', uebung: 'Wunsch, bestes Ergebnis, Hindernis, Plan: Schreib je ein Stichwort für einen ungestörten Familienabend.', eines: 'Heute 30 Minuten ohne Arbeit und Handy für die Familie', klein: '10 Minuten nur für die Familie, ohne Ablenkung', quelle: 'Schweinehund: mentales Kontrastieren' },
    { titel: 'Eine klare Grenze zur Arbeit', impuls: 'Wenn die Arbeit kein Ende hat, frisst sie die Familienzeit. Ein klarer Feierabend – Laptop zu, Mail-App aus – ist kein Mangel an Einsatz, sondern Schutz für das Wichtige.', uebung: 'Lege eine feste Feierabendzeit fest und notiere, was du tust, wenn danach noch etwas hereinkommt.', eines: 'Zur festgelegten Zeit Laptop zuklappen, Mail-App schließen', klein: 'Mail-Benachrichtigungen heute Abend ausschalten', quelle: 'Essentialismus: Grenzen setzen' },
    { titel: 'Wenn das Telefon klingelt', impuls: 'Ein dienstlicher Anruf, eine Nachricht – und schon bist du weg. Lege vorher fest, was wirklich sofort sein muss und was bis morgen warten kann. Meist ist es sehr wenig.', uebung: 'Schreib auf: Welche Anrufe oder Nachrichten rechtfertigen es, die Familienzeit zu unterbrechen?', eines: 'Eine Nachricht heute Abend bewusst erst morgen beantworten', klein: 'Eine Benachrichtigung liegen lassen, bis die Kinder schlafen', quelle: 'Schweinehund: Hindernisse vorwegnehmen' },
    { titel: 'Müde und trotzdem da', impuls: 'Nach einem langen Tag ist die Geduld knapp. Plane für solche Abende eine Mini-Version ein, die dich nicht überfordert und trotzdem Nähe schafft.', uebung: 'Was könntest du an einem erschöpften Abend mit den Kindern tun, das wenig Energie braucht? Sammle drei Ideen.', eines: 'Gemeinsam auf dem Sofa ein Buch lesen', klein: 'Fünf Minuten nebeneinander sitzen und zuhören', quelle: '' },
    { titel: 'Wenn es nicht klappt', impuls: 'Es wird Abende geben, an denen du ungeduldig oder abgelenkt warst. Statt dich zu verurteilen: Entschuldige dich, wenn es passt, und fang morgen neu an.', uebung: 'Denk an einen Moment, in dem du nicht so warst, wie du sein wolltest. Was würdest du einem Freund in derselben Lage sagen?', eines: 'Einen schwierigen Moment ansprechen und neu anfangen', klein: 'Dir selbst einen freundlichen Satz sagen', quelle: 'Schweinehund: Selbstmitgefühl' },
    { titel: 'Ein Vater, der da ist', impuls: 'Statt „Ich sollte mehr Zeit mit der Familie verbringen“ versuch es mit: „Ich bin ein Vater, der zuhört und da ist.“ Jede kleine Zuwendung bestätigt dieses Bild.', uebung: 'Schreib deinen Identitätssatz für deine Rolle in der Familie. Welche kleine Handlung würde ihn heute beweisen?', eines: 'Genau diese eine Handlung heute ausführen', klein: 'Einem Kind sagen, was du an ihm magst', quelle: '1%-Methode: Identität' },
    { titel: 'Richtig zuhören', impuls: 'Zuhören heißt nicht, auf die eigene Antwort zu warten. Schau dein Gegenüber an, frag nach, fass zusammen. Kinder und Partner spüren sofort, ob du wirklich bei ihnen bist.', uebung: 'Überlege dir zwei offene Fragen, die du heute stellen willst – statt „Wie war’s?“.', eines: 'Ein Gespräch führen, in dem du nur fragst und zuhörst', klein: 'Einmal nachfragen statt sofort zu antworten', quelle: 'Gentleman-Prinzip: Aufmerksamkeit' },
    { titel: 'Zeit zu zweit', impuls: 'Die Partnerschaft ist das Fundament der Familie und kommt im Alltag oft zu kurz. Schon eine regelmäßige halbe Stunde zu zweit hält die Verbindung lebendig.', uebung: 'Wann hättet ihr in den nächsten zwei Wochen Zeit nur für euch? Notiere zwei Möglichkeiten.', eines: 'Einen festen Abend zu zweit im Kalender eintragen', klein: 'Heute 10 Minuten reden, ohne Orga-Themen', quelle: '' },
    { titel: 'Ein Erlebnis planen', impuls: 'Gemeinsame Erlebnisse bleiben in Erinnerung, der Alltag verschwimmt. Plane etwas Besonderes – es muss nicht teuer sein: Lagerfeuer, Ausflug, Nachtwanderung.', uebung: 'Sammle mit der Familie drei Ideen für ein Erlebnis in den nächsten vier Wochen.', eines: 'Ein Familienerlebnis mit Datum in den Kalender eintragen', klein: 'Beim Essen nach Ausflugsideen fragen', quelle: 'Essentialismus: bewusst planen' },
    { titel: 'Einzelzeit mit jedem Kind', impuls: 'In der Gruppe geht jedes Kind ein wenig unter. Exklusive Zeit nur mit dir – auch kurz – zeigt jedem: Du bist mir wichtig, so wie du bist.', uebung: 'Was macht jedes deiner Kinder gerade besonders gern? Notiere für jedes eine Idee für Zeit zu zweit.', eines: '20 Minuten Einzelzeit mit einem Kind, das sie gestaltet', klein: '5 Minuten spielen, was ein Kind aussucht', quelle: '' },
    { titel: 'Respekt im Kleinen', impuls: 'Höflichkeit gilt nicht nur draußen. Bitte, Danke, Ausredenlassen, Versprechen halten – gerade zu Hause zeigen kleine Gesten, wie viel dir die anderen wert sind.', uebung: 'Wo bist du zu Hause weniger aufmerksam als im Büro? Notiere eine Geste, die du heute bewusst einsetzt.', eines: 'Heute ein kleines Versprechen geben und halten', klein: 'Jedem heute einmal ausdrücklich danken', quelle: 'Gentleman-Prinzip: Haltung im Alltag' },
    { titel: 'Dankbarkeit aussprechen', impuls: 'Vieles, was die anderen für dich tun, wird selbstverständlich. Ausgesprochene Dankbarkeit stärkt die Beziehung – und deinen Blick für das Gute.', uebung: 'Schreib für jedes Familienmitglied eine Sache auf, für die du dankbar bist.', eines: 'Einem Familienmitglied heute konkret danken', klein: 'Einen Dankessatz auf einen Zettel schreiben', quelle: '' },
    { titel: 'Was hat sich verändert?', impuls: 'Nach drei Wochen lohnt ein Blick zurück. Welche Abende waren anders? Was haben die Kinder bemerkt? Kleine Veränderungen sind oft größer, als sie sich anfühlen.', uebung: 'Notiere: Was mache ich jetzt anders? Was hat die Familie davon gespürt?', eines: 'Die Familie fragen, was ihr in letzter Zeit gefallen hat', klein: 'Eine gute Veränderung aufschreiben', quelle: '' },
