<html lang="de">

<style>

   kommen 0–9 und der Doppelpunkt aus VT323 (SIL Open Font License),
   eingebettet, damit sie auch ohne Netz da sind. */

  unicode-range:U+0030-0039,U+003A;size-adjust:128%;font-display:block}
/* Optik A: grünes LCD, Pixelschrift, Knöpfe mit runden Ecken — wie der Palm */
:root{--lcd:#B9C4A6;--lcd-hell:#C9D3B7;--px:#1C2116;--px-mitte:#56604A;--px-zart:#8E9A7C;--gehaeuse:#1E1E1E}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--gehaeuse);color:var(--px);overflow:hidden;
  font-family:"CLIE Ziffern","Pixelify Sans",ui-monospace,Menlo,Consolas,monospace;font-size:21px;line-height:1.25;-webkit-font-smoothing:none}
button{font:inherit;color:inherit;cursor:pointer;background:transparent;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;color:var(--px-zart)}
button:focus-visible{outline:2px dotted var(--px);outline-offset:1px}

.geraet{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--lcd);position:relative;overflow:hidden;
  padding-top:env(safe-area-inset-top)}
.kopf{display:flex;align-items:center;gap:8px;padding:8px 8px 6px;border-bottom:2px solid var(--px);flex:0 0 auto}
.reiter{background:var(--px);color:var(--lcd);font-weight:600;padding:3px 9px 2px;border-radius:5px 5px 0 0;font-size:22.5px;max-width:62%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.luecke{flex:1}
.uhr{font-size:20px}
.kat{font-size:20px;padding:2px 2px 2px 6px;white-space:nowrap}
.kat.an{background:var(--px);color:var(--lcd);border-radius:3px}

.anmeldebanner{display:none;align-items:center;gap:8px;padding:7px 8px;border-bottom:2px solid var(--px);background:var(--px);color:var(--lcd);font-size:18.5px}
.anmeldebanner.sichtbar{display:flex}
#anmeldeText{flex:1;min-width:0}
.anmeldebanner button{border:2px solid var(--lcd);border-radius:12px;padding:1px 9px;font-size:18.5px;white-space:nowrap}
.neustreifen{display:none;align-items:center;gap:8px;padding:6px 8px;border-bottom:2px dotted var(--px);font-size:18.5px;width:100%;text-align:left}
.neustreifen.sichtbar{display:flex}
#neuText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neu-wort{border:2px solid var(--px);border-radius:12px;padding:0 8px}

.inhalt{flex:1;min-height:0;overflow:auto;padding:6px 10px 14px;position:relative}

/* Silkscreen: die festen Tasten unten (seit 0.8 wieder da — die Android-
   Taste ◀ geht zusätzlich zurück, der Reiter öffnet ebenfalls das Menü) */
.silk{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--lcd-hell);border-top:2px solid var(--px-mitte);
  padding:6px 4px calc(8px + env(safe-area-inset-bottom));text-align:center;font-size:16px;color:var(--px-mitte)}
.silk button{color:var(--px-mitte);font-size:16px;padding:2px 0}
.silk button b{display:block;font-size:28px;line-height:1.05;color:var(--px)}
.silk button:disabled b{color:var(--px-zart)}
/* Die einzige Zahl: an „Heute“ — auf der Übersicht und unten (seit 0.9) */
.silk button{position:relative}
.zahl{position:absolute;top:-4px;right:-8px;background:var(--px);color:var(--lcd);border-radius:10px;font-size:16px;padding:0 7px;line-height:22px}
.silk .zahl{top:0;right:12%}
.zahl.leer{display:none}
/* Suchen (seit 0.10) */
.su-feld{display:flex;gap:6px;align-items:center;border:2px solid var(--px);background:var(--lcd-hell);padding:2px 8px;margin:4px 0 8px;font-size:21px}
.su-feld input{flex:1;min-width:0;font:inherit;font-size:19px;color:var(--px);background:transparent;border:0;padding:6px 2px;outline:none}
.su-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.su-chip{border:2px solid var(--px);border-radius:12px;padding:0 9px;font-size:18px}
.su-gruppe{display:flex;justify-content:space-between;font-weight:600;font-size:18.5px;border-bottom:2px solid var(--px);margin:10px 0 2px}
.su-treffer{display:block;width:100%;text-align:left;border-bottom:2px dotted var(--px-zart);padding:5px 0;font-size:19.5px;overflow-wrap:anywhere}
.su-treffer small{display:block;font-size:16px;color:var(--px-mitte)}
.su-treffer mark,.su-treffer small mark{background:var(--px);color:var(--lcd);padding:0 2px}
.su-mehr{font-size:16.5px;color:var(--px-mitte);text-decoration:underline;padding:4px 0}
.heute-kopf{background:var(--px);color:var(--lcd);padding:6px 9px;margin:4px 0 8px;font-size:19.5px}
.heute-kopf b{font-weight:400;white-space:nowrap}
.hz{display:flex;gap:9px;align-items:center;width:100%;text-align:left;border-bottom:2px dotted var(--px-zart);padding:4px 0;min-height:38px}
.hz .zt{flex:0 0 52px;text-align:right;color:var(--px-mitte);font-size:19px}
.hz .tx{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere}
.hz.erl .tx,.hz.erl .zt{color:var(--px-zart);text-decoration:line-through}
.reiter::after{content:" ▾";font-size:.75em}

/* Übersicht */
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 4px;padding:16px 0 6px}
.app{text-align:center;font-size:20px;display:flex;flex-direction:column;align-items:center}
.sym{width:76px;height:76px;margin:0 auto 4px;position:relative;display:block}
.sym svg{width:76px;height:76px;display:block}
.app:active .sym svg{filter:invert(1)}
.fassung{display:block;width:100%;text-align:center;font-size:16px;color:var(--px-mitte);margin:10px 0 0;padding:6px 0}
.fassung u{color:var(--px)}
/* Statistik (seit 0.7.1) */
.st-kopf{display:flex;gap:7px;align-items:center;width:100%;text-align:left;font-weight:600;font-size:18.5px;border-bottom:2px solid var(--px);margin:10px 0 2px;padding:2px 0}
.st-kopf svg{width:26px;height:26px;flex:0 0 26px}
.st .reihe span:first-child{flex:1 1 auto}
.st .reihe span:last-child{flex:0 0 auto;white-space:nowrap}

/* Aufklapplisten: Kategorie und Menü */
.aufklapp{position:absolute;z-index:20;background:var(--lcd);border:2px solid var(--px);box-shadow:3px 3px 0 var(--px);min-width:150px}
.aufklapp button{display:block;width:100%;text-align:left;padding:5px 12px;font-size:21px}
.aufklapp button.an,.aufklapp button:active{background:var(--px);color:var(--lcd)}
.aufklapp .trenn{border-top:2px dotted var(--px-zart);margin:2px 0}
.menue-zeile{display:flex;gap:0;border-bottom:2px solid var(--px);background:var(--px);color:var(--lcd)}
.menue-zeile span{padding:3px 12px;font-weight:600}
.schleier{position:absolute;inset:0;z-index:15;display:none}
.schleier.auf{display:block}

/* Platzhalter späterer Apps */
.spaeter-text{margin:18px 6px;font-size:20px;line-height:1.45}
.spaeter-text .gross{text-align:center;margin:10px 0 14px}
.spaeter-text .gross svg{width:110px;height:110px}

/* Abgleich (HotSync) */
.hs{text-align:center;padding:14px 0 6px}
.hs-knopf{width:112px;height:112px;border:2px solid var(--px);border-radius:50%;font-size:66.5px;background:var(--lcd-hell);box-shadow:3px 3px 0 var(--px)}
.hs-knopf:active{background:var(--px);color:var(--lcd);box-shadow:none;transform:translate(3px,3px)}
.hs-knopf.laeuft{animation:hs-dreh 1.2s steps(8) infinite}
@keyframes hs-dreh{to{transform:rotate(360deg)}}
.hs-wort{margin-top:8px;font-size:22.5px;font-weight:600}
.hs-stand{font-size:18.5px;color:var(--px-mitte);margin-top:2px}
.abschnitt{font-weight:600;margin:12px 0 2px;font-size:18.5px;border-bottom:2px solid var(--px)}
.reihe{display:flex;gap:8px;border-bottom:2px dotted var(--px-zart);padding:4px 0;font-size:19px}
.reihe span:first-child{flex:0 0 42%;color:var(--px-mitte)}
.reihe span:last-child{flex:1;min-width:0;overflow-wrap:anywhere;text-align:right}
.reihe .warn{font-weight:600}
.knoepfe{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.knopf{border:2px solid var(--px);border-radius:12px;padding:2px 10px;font-size:19px}
.knopf.voll{background:var(--px);color:var(--lcd)}
.knopf:disabled{border-color:var(--px-zart)}
.leise{font-size:17.5px;color:var(--px-mitte);margin:6px 0 0;line-height:1.4}

/* Rechner */
.anzeige{border:2px solid var(--px);background:var(--lcd-hell);padding:6px 10px;margin:4px 0 8px;text-align:right;position:relative}
.verlauf-zeile{font-size:17.5px;color:var(--px-mitte);min-height:22px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.m-marke{position:absolute;left:10px;bottom:8px;font-size:17.5px;color:var(--px-mitte)}
.zahl-gross{font-size:44px;line-height:1.1;overflow:hidden;white-space:nowrap}
.tasten{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.taste{border:2px solid var(--px);border-radius:14px;height:58px;font-size:27px;background:var(--lcd)}
.taste:active{background:var(--px);color:var(--lcd)}
.taste.op{background:var(--lcd-hell)}
.taste.gl{background:var(--px);color:var(--lcd)}
.taste.klein{height:44px;font-size:20px}
.rt-verlauf{border:2px dotted var(--px-mitte);padding:6px 8px;font-size:19px;min-height:200px}
.rt-verlauf div{padding:3px 0;border-bottom:2px dotted var(--px-zart);text-align:right}

/* Untere Knopfzeile einer App (Neu, Gehe zu, T/W/M) */
.fuss{display:none;flex:0 0 auto;gap:6px;padding:7px 8px;border-top:2px solid var(--px);align-items:center}
.fuss.auf{display:flex}
.ansicht{display:inline-flex;gap:4px;margin-left:auto}
.ansicht button{width:34px;height:32px;border:2px solid var(--px);border-radius:3px;font-size:17.5px}
.ansicht button.an{background:var(--px);color:var(--lcd)}

/* Kalender */
.wochenleiste{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--px);padding:2px 0 5px;margin-bottom:4px;font-size:19px}
.wochenleiste button{min-width:30px;height:32px;text-align:center}
.wochenleiste .wt.heute{text-decoration:underline}
.wochenleiste .wt.an{background:var(--px);color:var(--lcd);border-radius:3px}
.ganztags{display:block;width:100%;text-align:left;border:2px solid var(--px);padding:2px 6px;margin:3px 0;font-size:19px}
/* Aus der Workbench (seit 0.8.2): Feiertag kräftig, Ferien leise */
.ganztags.gz-feiertag{background:var(--px);color:var(--lcd)}
.ganztags.gz-ferien{border-style:dashed;color:var(--px-mitte)}
.std{display:flex;gap:8px;border-bottom:2px dotted var(--px-zart);min-height:36px;align-items:center}
.std .z{width:60px;flex:0 0 60px;color:var(--px-mitte);font-size:19px}
.std .t{flex:1;min-width:0;display:flex;gap:8px;align-items:center;min-height:34px}
.std .tx{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.std.vorbei .tx,.std.vorbei .z{color:var(--px-zart)}
/* Titel laufender und kommender Einträge brechen um (höchstens 3 Zeilen), Vergangenes bleibt einzeilig (seit 0.6.2) */
.std:not(.vorbei) .tx{white-space:normal;overflow-wrap:anywhere;line-height:1.2;max-height:3.6em;padding:3px 0}
.std.ende .t{min-height:28px}
.k{width:20px;height:20px;border:2px solid var(--px);flex:0 0 20px;display:inline-block;background:transparent}
/* Priorität (seit 0.12): 1 gefüllt, 2 umrandet, 3 gepunktet, ohne = leerer Platz */
.prio{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 22px;font-size:15.5px;font-weight:600;margin-right:6px;vertical-align:-3px;border:2px solid transparent}
.prio.p1{background:var(--px);color:var(--lcd);border-color:var(--px)}
.prio.p2{border-color:var(--px)}
.prio.p3{border:2px dotted var(--px);color:var(--px-mitte)}
.aufg .prio{margin-right:0}
.aufg .prio.p0{border:2px dotted var(--px-zart)}
.k.an{background:var(--px)}
.aufg{display:flex;gap:9px;align-items:center;border-bottom:2px dotted var(--px-zart);padding:4px 0;min-height:36px}
.aufg .tx{flex:1;min-width:0}
.aufg .q{font-size:17.5px;color:var(--px-mitte);white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.aufg.erl .tx{color:var(--px-zart);text-decoration:line-through}
.unterabschnitt{font-weight:600;margin:6px 0 2px}
.notiz{padding:3px 0;border-bottom:2px dotted var(--px-zart)}
.erl-knopf{margin:10px 0 0;font-size:17.5px;color:var(--px-mitte);text-decoration:underline}
.wochenkopf{font-size:19px;color:var(--px-mitte);margin:2px 0 4px}
.wtag{display:flex;gap:8px;width:100%;text-align:left;border-bottom:2px dotted var(--px-zart);padding:4px 0}
.wtag b{flex:0 0 72px;font-weight:600}
.wtag.heute b{background:var(--px);color:var(--lcd);padding:0 4px}
.wtag .e{flex:1;min-width:0;font-size:19px}
.wtag .e div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monat{display:grid;grid-template-columns:repeat(7,1fr);border-left:2px solid var(--px);border-top:2px solid var(--px);margin-top:4px}
.monat .mk,.monat .mt{border-right:2px solid var(--px);border-bottom:2px solid var(--px)}
.monat .mk{text-align:center;font-weight:600;background:var(--lcd-hell);font-size:17.5px}
.monat .mt{height:66px;padding:2px 3px;font-size:17.5px;text-align:left;display:flex;flex-direction:column;align-items:stretch}
.monat .mt.aus{color:var(--px-zart)}
.monat .mt.heute{background:var(--px);color:var(--lcd)}
.monat .mt.an{outline:2px dotted var(--px);outline-offset:-5px}
.monat .mt i{display:block;height:5px;background:currentColor;margin-top:3px;opacity:.8}

/* Zeitklammern im Tag (seit 0.2.2) */
.kl{flex:0 0 18px;align-self:stretch;display:flex;gap:2px;margin-right:-4px}
.kl i{width:8px;display:block;font-style:normal}
.kl i.oben{border-left:2px solid var(--px);border-top:2px solid var(--px);margin-top:10px}
.kl i.mitte{border-left:2px solid var(--px)}
.kl i.unten{border-left:2px solid var(--px);border-bottom:2px solid var(--px);margin-bottom:10px}
.kl i.einzel{border:2px solid var(--px);border-right:0;margin:10px 0}
.std.vorbei .kl i{border-color:var(--px-zart)}

/* Woche als Blöcke (seit 0.2.2) */
.tagwahl{display:flex;margin:2px 0 6px;border:2px solid var(--px);width:max-content}
.tagwahl button{padding:1px 10px;font-size:18px}
.tagwahl button.an{background:var(--px);color:var(--lcd)}
.wb{display:grid;position:relative}
.wb .kz{text-align:center;font-weight:600;font-size:17.5px;border-bottom:2px solid var(--px);padding-bottom:2px;line-height:1.1}
.wb .kz.heute{background:var(--px);color:var(--lcd)}
.wb-uhr{position:relative;font-size:18px;color:var(--px-mitte)}
.wb-uhr span{position:absolute;right:5px;transform:translateY(-50%)}
.wb-sp{position:relative;border-left:2px dotted var(--px-zart)}
.wb-sp.heute{background:rgba(28,33,22,.07)}
.wb-tag{position:absolute;inset:0;width:100%}
.wb-blk{position:absolute;border-radius:2px;color:var(--lcd);font-size:15.5px;line-height:1.05;padding:1px 2px;overflow:hidden;
  white-space:nowrap;text-align:left;vertical-align:top;display:block}
.wb-blk.s1{background:var(--px)}
.wb-blk.s2{background:#4A5440}
.wb-blk.s3{background:#7A8668;color:var(--px)}
.wb-blk.vorbei{opacity:.55}
.wb.breit .wb-blk{font-size:17.5px;white-space:normal}
.wb-ganz-z{text-align:center;font-size:16px;color:var(--px-mitte);border-bottom:2px solid var(--px);padding-top:2px}
.wb-ganz-sp{border-left:2px dotted var(--px-zart);border-bottom:2px solid var(--px);padding:2px 2px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wb-ganz{display:block;width:100%;border:2px solid var(--px);border-radius:2px;font-size:15.5px;line-height:1.1;padding:1px 2px;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:clip}
.wb.breit .wb-ganz{font-size:17.5px;white-space:normal}
.wb-jetzt{position:absolute;left:0;right:0;border-top:3px solid var(--px);pointer-events:none;z-index:1}

/* Aufgaben (seit 0.3) */
.aufg .tx{background:none;border:0;padding:4px 0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aufg.gewaehlt{background:var(--px);color:var(--lcd)}
.aufg.gewaehlt .q{color:var(--lcd-hell)}
.aufg.gewaehlt .k{border-color:var(--lcd)}
.aufg.hervor{outline:3px dotted var(--px);outline-offset:-1px}
.plan-marke{flex:0 0 auto;font-size:17.5px;border:2px solid currentColor;border-radius:6px;padding:0 5px;white-space:nowrap}
/* Checklisten-Punkte in Heute und Kalender (seit 0.16) */
.herkunft{display:block;font-size:15.5px;color:var(--px-mitte);line-height:1.2}
.cls-vorschau div{display:flex;gap:8px;font-size:17.5px;padding:2px 0;border-bottom:2px dotted var(--px-zart)}
.cls-vorschau b{font-weight:400;flex:0 0 auto;min-width:6.5em}
.aufklapp .schalter{display:flex;margin:6px 8px;border:2px solid var(--px)}
.aufklapp .schalter button{flex:1;text-align:center;padding:2px 0;font-size:18px;width:auto}
.aufklapp .schalter button.an{background:var(--px);color:var(--lcd)}
.aufklapp .zw{font-size:16px;color:var(--px-mitte);padding:6px 12px 0}
.liste-aufklapp{left:40px;max-height:calc(100% - 120px);overflow:auto}
.liste-aufklapp button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wahlreihe{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.wahlreihe button{border:2px solid var(--px);border-radius:3px;padding:1px 9px;font-size:18px}
.wahlreihe button.an{background:var(--px);color:var(--lcd)}
.wahlfeld{text-align:left;cursor:pointer}
.wahlfeld.pflicht{outline:2px solid var(--px);color:var(--px-mitte)}
.zeitfeld{width:140px;margin-top:6px}
.fenster .wahl{display:block;width:100%;text-align:left;border-bottom:2px dotted var(--px-zart);padding:6px 4px}
.fenster .gruppe{font-size:17px;font-weight:600;border-bottom:2px solid var(--px);margin:10px 0 2px}
.knopf:disabled{color:var(--px-zart);border-color:var(--px-zart)}

/* Memo (seit 0.3) */
.gruppe{font-size:17.5px;font-weight:600;border-bottom:2px solid var(--px);margin:12px 0 2px}
.memo-zeile{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border-bottom:2px dotted var(--px-zart);padding:6px 0;min-height:40px}
.memo-zeile .mz{flex:0 0 22px;text-align:center}
/* Seit 0.12.1: bis zu zwei Zeilen, erst dann abgeschnitten */
.memo-zeile .tx{flex:1;min-width:0;white-space:normal;overflow:hidden;overflow-wrap:anywhere;line-height:1.25;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;max-height:2.5em}
.memo-zeile .q{color:var(--px-mitte);font-size:18px}
.memo-kopf{margin:2px 0 6px;font-size:17.5px}
.memo-h1{font-size:23px;font-weight:600;border-bottom:2px solid var(--px);margin:12px 0 4px}
.memo-h2{font-size:21px;font-weight:600;margin:10px 0 2px}
.memo-h3{font-weight:600;color:var(--px-mitte);margin:8px 0 2px}
.memo-trenn{border-top:2px solid var(--px);margin:8px 0}
.memo-punkt,.memo-text{padding:3px 0}
.memo-leer{height:10px}
.schreibleiste{display:flex;gap:6px;margin:2px 0 6px}
.schreibleiste button{min-width:44px;height:36px;border:2px solid var(--px);border-radius:3px;font-size:18px}
.memo-feld{display:block;width:100%;min-height:60vh;font:17.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--px);background:var(--lcd-hell);
  border:2px solid var(--px);padding:8px;resize:vertical}

/* Checklisten (seit 0.4) */
.cls-zeile{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border-bottom:2px dotted var(--px-zart);padding:5px 0;min-height:44px}
.cls-zeile .tx{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis}
.cls-zeile .tx small{display:block;font-size:16px;color:var(--px-mitte)}
.cls-zeile.erl .tx{color:var(--px-mitte)}
.balken{display:inline-block;width:64px;height:12px;border:2px solid var(--px);position:relative;flex:0 0 64px;vertical-align:middle}
.balken i{position:absolute;left:0;top:0;bottom:0;background:var(--px)}
.cls-zahl{font-size:18px;white-space:nowrap;margin-left:6px}
.cls-kopf{margin:2px 0 6px;font-size:17.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gruppe.klapp{display:block;width:100%;text-align:left;color:var(--px-mitte)}
/* Aufgaben: Ansicht und „1. Nächste“ (seit 0.17) */
/* Drive (seit 0.19) */
.drv-pfad{font-size:15.5px;color:var(--px-mitte);margin:2px 0 4px;overflow-wrap:anywhere}
.drv-zeile{display:flex;align-items:center;gap:6px;border-bottom:2px dotted var(--px-zart)}
.drv-n{flex:1;display:flex;gap:8px;align-items:center;text-align:left;padding:6px 0;min-width:0}
.drv-sym{width:26px;text-align:center;flex:0 0 26px;font-size:22px;line-height:1;font-family:ui-monospace,Menlo,monospace}
.drv-n .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.drv-n small{display:block;font-size:15.5px;color:var(--px-mitte)}
.drv-n mark{background:var(--px);color:var(--lcd);padding:0 2px}
.drv-stern{font-size:28px;line-height:1;padding:4px 8px;flex:0 0 auto;font-family:ui-monospace,Menlo,monospace}
.drv-hoch{display:block;width:100%;text-align:left;padding:6px 0;border-bottom:2px dotted var(--px-zart)}
/* Schach (seit 0.20) */
.sch-geschlagen{min-height:20px;display:flex;flex-wrap:wrap;gap:1px;margin-bottom:2px}
.sch-mini svg{width:16px;height:16px;display:block}
.sch-rahmen{border:2px solid var(--px);padding:2px;width:max-content;margin:0 auto;--q:min(calc((min(100vw,480px) - 60px) / 8),calc((100vh - 400px) / 8),52px)}
.sch-rahmen.ruht{opacity:.4}
.sch-brett{display:grid;grid-template-columns:16px repeat(8,var(--q));grid-template-rows:repeat(8,var(--q)) 18px}
.sch-ko{font-size:15.5px;color:var(--px-mitte);display:flex;align-items:center;justify-content:center}
.sch-f{position:relative;display:flex;align-items:center;justify-content:center;padding:0;width:var(--q);height:var(--q)}
.sch-f.h{background:var(--lcd-hell)}
.sch-f.d{background:var(--px-zart)}
.sch-f.wahl{box-shadow:inset 0 0 0 3px var(--px)}
.sch-f.letzt{box-shadow:inset 0 0 0 2px var(--px-mitte)}
.sch-f.schach{box-shadow:inset 0 0 0 3px var(--px),inset 0 0 0 6px var(--lcd-hell)}
.sch-f svg{width:84%;height:84%;position:relative;display:block}
.sch-ziel{position:absolute;width:26%;height:26%;background:var(--px);border-radius:50%}
.sch-schlag{position:absolute;inset:6%;border:3px solid var(--px);border-radius:50%}
.sch-status{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 4px;font-size:17.5px}
.sch-status b{background:var(--px);color:var(--lcd);font-weight:400;padding:0 6px;white-space:nowrap}
.sch-zuege{font-size:16px;border-top:2px solid var(--px);padding-top:4px;column-count:2;column-gap:14px}
.sch-zuege div{display:flex;gap:6px;break-inside:avoid}
.sch-zuege span:first-child{color:var(--px-mitte);min-width:2em}
.sch-umw{display:flex;gap:8px;justify-content:center;margin:4px 0}
.sch-umw button{border:2px solid var(--px);padding:4px;background:var(--lcd)}
.sch-umw svg{width:40px;height:40px;display:block}
.sto-fenster .wahlreihe{margin-bottom:4px}
/* Schach: Bereiche, Partien, Schule, Eröffnungen (seit 0.22) */
.sch-f.feldmarke{box-shadow:inset 0 0 0 3px var(--px),inset 0 0 0 5px var(--lcd-hell),inset 0 0 0 8px var(--px)}
.sch-hinweis{background:var(--px);color:var(--lcd);padding:5px 8px;margin:6px 0;font-size:17px;line-height:1.3}
.sch-hinweis.gut{background:var(--lcd-hell);color:var(--px);border:2px solid var(--px)}
.sch-erkl{border:2px solid var(--px);background:var(--lcd-hell);padding:6px 8px;margin:6px 0;font-size:17px;line-height:1.35}
.sch-nav{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0}
.sch-nav button{border:2px solid var(--px);border-radius:50%;width:44px;height:44px;font-size:20px;background:var(--lcd-hell);display:flex;align-items:center;justify-content:center}
.sch-zeile{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 0;border-bottom:2px dotted var(--px-zart)}
.sch-zeile small{display:block;font-size:15.5px;color:var(--px-mitte)}
.sch-zeile b{font-weight:600;white-space:nowrap}
.sch-balken{flex:0 0 72px;height:12px;border:2px solid var(--px);position:relative}
.sch-balken i{position:absolute;left:0;top:0;bottom:0;background:var(--px)}
.sch-kapitel-titel{font-weight:600;border-bottom:2px solid var(--px);margin:2px 0 6px;font-size:18px}
.sch-gruppe{font-weight:600;border-bottom:2px solid var(--px);margin:10px 0 2px;font-size:16px}
.sch-aufg-liste,.sch-optionen{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sch-optionen .knopf{white-space:normal;text-align:left;border-radius:8px}
.knopf.falsch{text-decoration:line-through}
.sch-zk{padding:0 2px}
.sch-analyse{margin:4px 0}
/* Stones (seit 0.18) */
.sto-spiel{display:flex;gap:10px;justify-content:center;--z:min(calc((min(100vw,480px) - 150px) / 10),calc((100vh - 360px) / 18),30px)}
.sto-feld{display:grid;grid-template-columns:repeat(10,var(--z));grid-template-rows:repeat(18,var(--z));gap:1px;border:2px solid var(--px);padding:2px;background:var(--lcd-hell);touch-action:none;flex:0 0 auto}
.sto-feld i{display:block}
.sto-feld i.f{background:var(--px)}
.sto-feld i.s{background:var(--px);box-shadow:inset 0 0 0 3px var(--px),inset 0 0 0 5px var(--lcd-hell)}
.sto-feld i.g{box-shadow:inset 0 0 0 2px var(--px-zart)}
.sto-spiel.ruht .sto-feld{opacity:.45}
.sto-seite{display:flex;flex-direction:column;gap:10px;font-size:17.5px;min-width:96px}
.sto-seite b{display:block;font-size:24px}
.sto-vorschau{display:grid;grid-template-columns:repeat(4,13px);grid-template-rows:repeat(2,13px);gap:1px;border:2px solid var(--px);padding:3px;width:max-content;margin-top:2px}
.sto-vorschau i.s{background:var(--px)}
.sto-fenster{position:absolute;left:24px;right:24px;top:90px;border:2px solid var(--px);background:var(--lcd-hell);box-shadow:3px 3px 0 var(--px);z-index:5}
.sto-fenster .titel{background:var(--px);color:var(--lcd);padding:3px 8px;font-weight:600}
.sto-fenster .rumpf{padding:8px 10px}
.sto-fenster p{margin:0 0 6px}
.sto-liste div{display:flex;justify-content:space-between;border-bottom:2px dotted var(--px-zart);padding:2px 0}
.sto-liste div.neu{background:var(--px);color:var(--lcd);padding:2px 4px}
.sto-tasten{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.sto-tasten button{border:2px solid var(--px);border-radius:50%;aspect-ratio:1/1;max-height:64px;font-size:24px;background:var(--lcd-hell);display:flex;align-items:center;justify-content:center;margin:0 auto;width:min(64px,100%)}
.sto-tasten button:active{background:var(--px);color:var(--lcd)}
.auf-leiste{display:flex;gap:6px;margin:2px 0 4px}
.auf-leiste .schalter{display:flex;flex:1;border:2px solid var(--px)}
.auf-leiste .schalter button{flex:1;text-align:center;padding:2px 0;font-size:17.5px;border-right:2px solid var(--px)}
.auf-leiste .schalter button:last-child{border-right:0}
.auf-leiste .schalter button.an,.auf-leiste .naechste.an{background:var(--px);color:var(--lcd)}
.auf-leiste .naechste{border:2px solid var(--px);padding:2px 6px;font-size:17.5px;white-space:nowrap}
.gruppe.klick{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;text-align:left}
.gruppe.klick small{font-weight:400;font-size:15.5px;color:var(--px-mitte);white-space:nowrap}
.aufg .mehr{flex:0 0 auto;font-size:15.5px;color:var(--px-mitte);border:2px dotted var(--px-mitte);border-radius:6px;padding:0 4px}
#inhalt > .zw{font-size:15.5px;color:var(--px-mitte);border-bottom:2px solid var(--px-mitte);margin:10px 0 2px}
.fuss{flex-wrap:wrap}

/* Routinen (seit 0.5) */
.rt-zeile{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border-bottom:2px dotted var(--px-zart);padding:5px 0;min-height:44px}
.rt-zeile .tx{flex:1;min-width:0}
.rt-zeile .tx small{display:block;font-size:16px;color:var(--px-mitte)}
.rt-zeile.pause .tx{color:var(--px-mitte)}
.rt-zeile.gewaehlt{background:var(--px);color:var(--lcd)}
.rt-zeile.gewaehlt small{color:var(--lcd-hell)}
.aufg .zeit{color:var(--px-mitte);font-size:19px}
.marke{font-size:15.5px;border:2px solid var(--px-mitte);border-radius:6px;padding:0 4px;color:var(--px-mitte);white-space:nowrap}
.wahlreihe.tage button{min-width:40px;padding:1px 0;text-align:center}
.zahlfeld{width:64px;text-align:center}

/* 0.6: umbrechende Titel, Auszeichnungen, Tabellen, Verweise */
.tx.umbruch{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}
.tx.umbruch small{display:block;font-size:16px;color:var(--px-mitte);-webkit-line-clamp:1}
.tx.umbruch.drei{-webkit-line-clamp:3}
.aufg.gewaehlt .tx small{color:var(--lcd-hell)}
.memo-punkt .nr{color:var(--px-mitte)}
.memo-text a,.memo-punkt a,.memo-tabelle a{color:inherit;text-decoration:underline}
.verweis{text-decoration:underline dotted;font:inherit;color:inherit;padding:0}
.verweis.tot{color:var(--px-mitte);text-decoration:none}
.fl-kap{font-variant:small-caps}
.memo-tabelle{overflow-x:auto;margin:6px 0}
.memo-tabelle table{border-collapse:collapse;font-size:18px}
.memo-tabelle th,.memo-tabelle td{border:2px solid var(--px);padding:2px 6px;text-align:left;vertical-align:top}
.memo-tabelle th{background:var(--lcd-hell)}
.wb-blk{display:flex;align-items:flex-start}

/* Fenster wie die Dialoge des Palm */
/* Sammlungen (seit 0.7) */
.sa-zeile{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border-bottom:2px dotted var(--px-zart);padding:6px 0;min-height:46px}
.sa-zeile .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sa-zeile .tx small{display:block;font-size:16px;color:var(--px-mitte)}
.sa-sym{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#3B4433;color:var(--lcd-hell);display:flex;align-items:center;justify-content:center;font-size:18px}
.sa-kz{color:var(--px-mitte);font-size:19px;white-space:nowrap;text-align:right;line-height:1.15}
/* Kennzahl 2 klein darunter (seit 0.11.1) */
.sa-kz small{display:block;font-size:16px}
.sa-hinweis{display:block;width:100%;text-align:left;border:2px dashed var(--px);padding:3px 7px;margin:8px 0;font-size:18px}
.sa-tab{width:100%;border-collapse:collapse;table-layout:fixed;font-size:19px}
.sa-tab th{font-size:16px;font-weight:600;text-align:left;border-bottom:2px solid var(--px);padding:2px 3px}
.sa-tab td{border-bottom:2px dotted var(--px-zart);padding:5px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sa-tab th:first-child,.sa-tab td:first-child{width:46%}
.sa-tab.sa-dat th:first-child,.sa-tab.sa-dat td:first-child{width:22%}
.sa-tab.sa-vier{font-size:17.5px}
/* Kopf der Sammlung steht fest, nur die Einträge scrollen (seit 0.14) */
.sa-fest{position:sticky;top:-6px;z-index:5;background:var(--lcd);margin:-6px -10px 0;padding:6px 10px 0}
.sa-tab.sa-kopf{margin:0}
.sa-tab.sa-kopf + .sa-tab{margin-top:0}
.sa-kw{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:2px solid var(--px);padding:4px;margin:0 0 6px;background:var(--lcd-hell)}
.sa-kw div{border:2px solid var(--px-zart);padding:2px 6px;line-height:1.15;min-width:0}
.sa-kw small{display:block;font-size:15.5px;color:var(--px-mitte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sa-kw b{display:block;font-weight:400;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sa-kw.sa-kw3{grid-template-columns:1fr 1fr 1fr}
.sa-kw.sa-kw3 div{padding:2px 4px}
.sa-kw.sa-kw3 b{font-size:20px}
.sa-tab.sa-vier th:first-child,.sa-tab.sa-vier td:first-child{width:34%}
.sa-tab.sa-vier.sa-dat th:first-child,.sa-tab.sa-vier.sa-dat td:first-child{width:20%}
.sa-tab .r{text-align:right}
.sa-tab tr.sa-z{cursor:pointer}
.sa-tab tr.sa-gr td{font-weight:600;border-bottom:2px solid var(--px-mitte);padding-top:8px}
.sa-tab tr.sa-sum td{font-weight:600;border-top:2px solid var(--px);border-bottom:0}
.sa-box{border:2px solid var(--px);margin:10px 0 4px;padding:3px 8px 6px}
.sa-box .reihe:last-of-type{border-bottom:0}
.sa-balken{height:14px;border:2px solid var(--px);margin:6px 0 2px;position:relative}
.sa-balken i{position:absolute;left:0;top:0;bottom:0;background:var(--px)}
.sa-feldzeile{display:flex;gap:6px;align-items:center;border-bottom:2px dotted var(--px-zart);padding:4px 0}
.sa-feldzeile .tx{flex:1;min-width:0;text-align:left}
.sa-feldzeile .tx small{display:block;font-size:16px;color:var(--px-mitte)}
.sa-feldzeile .knopf{padding:0 8px}
.sa-vzeile{display:flex;gap:6px;align-items:center}
.sa-vzeile .wahl{flex:1}
.fenster .wahl.sa-gewaehlt{font-weight:600}
/* Links (seit 0.11) */
.sa-link{text-decoration:underline;font-size:inherit;padding:0;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa-linkzeile{display:flex;gap:6px;align-items:center}
.sa-linkzeile .eingabe{flex:1;min-width:0}
/* In der Pixelschrift sehen [ ] fast wie ( ) aus — Formeln deshalb in klarer Schrift (seit 0.8) */
.fenster .sa-formel{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px}
.fenster select.eingabe,.fenster textarea.eingabe{font:inherit;font-size:17.5px}
.fenster{position:absolute;z-index:20;left:10px;right:10px;top:60px;max-height:calc(100% - 150px);overflow:auto;background:var(--lcd);border:2px solid var(--px);box-shadow:4px 4px 0 var(--px)}
.fenster .titel{background:var(--px);color:var(--lcd);font-weight:600;padding:4px 10px;text-align:center}
.fenster .rumpf{padding:10px 12px;font-size:20px}
.eingabe{display:block;width:100%;font:inherit;font-size:17.5px;color:var(--px);background:var(--lcd-hell);border:0;border-bottom:2px dotted var(--px);padding:6px 4px;margin:6px 0 4px}
.eingabe:focus{outline:2px solid var(--px)}
.fenster label{display:block;margin-top:6px;color:var(--px-mitte);font-size:17.5px}
.fenster label.haken{display:flex;gap:8px;align-items:center;color:var(--px)}
.fenster .zeitpaar{display:flex;gap:8px;align-items:center}
.fenster .zeitpaar .eingabe{flex:1}
.fenster .feld{display:flex;gap:10px;padding:4px 0}
.fenster .feld b{font-weight:400;color:var(--px-mitte);flex:0 0 92px;text-align:right}
.fenster .notiz-text{white-space:pre-line}

/* Hinweis wie ein Palm-Alarm */
.toast{position:absolute;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:40;display:none;gap:10px;align-items:center;
  background:var(--lcd);border:2px solid var(--px);box-shadow:3px 3px 0 var(--px);padding:8px 10px;font-size:19px;white-space:pre-line}
.toast.auf{display:flex}
.toast.warn{background:var(--px);color:var(--lcd);box-shadow:3px 3px 0 var(--px-mitte)}
#toastText{flex:1}
.toast button{border:2px solid currentColor;border-radius:12px;padding:0 8px;font-size:18.5px}
/* Lernkartei (seit 0.23) */
.lk-kasten{display:block;width:100%;text-align:left;border-bottom:2px dotted var(--px-zart);padding:8px 2px}
.lk-k1{display:flex;justify-content:space-between;gap:8px;font-size:20px}
.lk-k1 b{font-weight:400;background:var(--px);color:var(--lcd);padding:0 6px;white-space:nowrap}
.lk-kasten small,.lk-karte-zeile small{display:block;font-size:16px;color:var(--px-mitte)}
.lk-titel{font-size:21px;font-weight:600;border-bottom:2px solid var(--px);margin:2px 0 8px}
.lk-faecher{display:flex;gap:8px;align-items:flex-end;margin:6px 0 10px}
.lk-faecher div{flex:1;display:flex;flex-direction:column;align-items:center;font-size:17px}
.lk-faecher small{font-size:15.5px;color:var(--px-mitte)}
.lk-saeule{display:flex;align-items:flex-end;width:100%;height:70px;border:2px solid var(--px)}
.lk-saeule i{display:block;width:100%;background:var(--px)}

<script>
'use strict';

/* ============================================================
   Grunddaten

   CLIE arbeitet auf der workbench.json — mit den Sammlungen der
   Workbench. Gerätespeicher, Dateigriff und Anmeldemerker heißen
   eigen: Liegen die Apps unter derselben Adresse, kommen sie sich
   lokal nicht in die Quere; zusammen kommen sie über Google Drive.
   ============================================================ */

var APP_VERSION = '0.23.0';
var DATEINAME   = 'workbench.json';
var IDB_NAME    = 'clie-speicher';
var IDB_STORE   = 'handles';
var IDB_KEY     = 'datendatei';
var LS_KEY      = 'clie-daten';
var OPFS_NAME   = 'clie-workbench.json';
/* Dieselbe Google-Anwendung wie die Workbench: Nur so ist deren
   workbench.json mit dem Recht drive.file sichtbar. Dazu das Lesen
   des Kalenders. */
var CLIENT_ID   = '347268246401-9ktgd8q5caq6v5nma36i3e38u9c37bre.apps.googleusercontent.com';
var REDIRECT_URI = 'https://alexandernoeth-bam.github.io/workbench/workbench.html';
/* Seit 0.2: Termine lesen und schreiben (calendar.events); die Liste
   der Kalender braucht weiter calendar.readonly. */
var SCOPES = 'https://www.googleapis.com/auth/drive.file '
           + 'https://www.googleapis.com/auth/calendar.readonly '
           + 'https://www.googleapis.com/auth/calendar.events';
var GIS_URL   = 'https://accounts.google.com/gsi/client';
var TOKEN_KEY = 'clie-zugriff';
var ANMELDE_MERKER = 'clie-war-angemeldet';
var ABGLEICH_VERZUG  = 4000;
var ABGLEICH_MINDEST = 20000;
var ABGLEICH_TAKT    = 30000;
var DRIVE_DATEI = 'workbench.json';
var VORLAUF_MS = 5 * 60 * 1000;
var GRABSTEIN_TAGE = 180;

/* Wörtlich aus der Workbench — sonst gingen beim Abgleich Sammlungen verloren. */
var SAMMLUNGEN = ['aufgaben','ziele','themen','projekte','ablaeufe','durchlaeufe',
                  'jahrestermine','ferien','einfaelle','gedanken','pinnwand',
                  'kalenderzuordnung','notizbuecher','notizseiten','wochen','tage',
                  /* seit v6.2.3: die App „Sammlungen“ im CLIE — die Workbench
                     bewahrt und gleicht sie nur ab, sie zeigt sie nicht an */
                  'sammlungen','datensaetze',
                  /* seit v6.3.1: Favoriten der App „Drive“ im CLIE — ebenso */
                  'drivefavoriten'];

/* Aus der Workbench: nummerierte Zeilen */
var NUMMER_MUSTER = /^(\d{1,3})[.)]\s+(.*)$/;

var speicherWeg = 'keiner';
var dateiHandle = null;
var dateiName = '';
var rechteStand = 'unbekannt';
var letzterSchreibvorgang = null;
var tokenClient = null;
var zugriffToken = null;
var tokenAblauf = 0;
var erneuerungsUhr = null;
var erneuerungVersuche = 0;
var ERNEUERUNG_MAX = 6;
var ERNEUERUNG_ABSTAND = 60000;
var ANMELDE_ZEITGRENZE_MS = 60 * 1000;
var anmeldungLaeuft = false;
var letzteErneuerung = null;
var gisBereit = false;
var driveDateiId = '';
var driveStand = '';
var letzteUebertragung = null;
var letzterAbgleich = null;
var letzterBericht = null;
var abgleichUhr = null;
var abgleichLaeuft = false;
var abgleichZuletztMs = 0;
var verbindungOk = null;
var verbindungUhr = null;
var VERBINDUNG_TAKT = 60000;
var abgleichFehler = '';
var lokalOffen = false;
var taktUhr = null;

/* Termine gehören Google: nur im Arbeitsspeicher, nie in der Datei. */
var kalenderListe = [];
var termineNachTag = {};
var kalenderStand = '';
var kalenderFehler = '';
var kalenderLaeuft = false;
var kalenderUhr = null;

/* ============================================================
   Unterbau aus der Workbench 6.3.1 — wörtlich übernommen:
   Speicher, Google-Anmeldung, Drive, Abgleich, Löschvermerke,
   Kalender lesen, leere Datenbank und der Aktivitäten-Kern (kp…).
   ============================================================ */

function zwei(n) { return (n < 10 ? '0' : '') + n; }

function isoDatum(d) {
  var x = d || new Date();
  return x.getFullYear() + '-' + zwei(x.getMonth() + 1) + '-' + zwei(x.getDate());
}

function isoZeit(d) {
  var x = d || new Date();
  return isoDatum(x) + ' ' + zwei(x.getHours()) + ':' + zwei(x.getMinutes()) + ':' + zwei(x.getSeconds());
}

function esc(text) {
  return String(text === null || text === undefined ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function ausIso(is) {
  var p = String(is).split('-');
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}

function tagePlus(is, n) {
  var d = ausIso(is);
  d.setDate(d.getDate() + n);
  return isoDatum(d);
}

function montagVon(is) {
  var d = ausIso(is);
  var wt = (d.getDay() === 0) ? 7 : d.getDay();
  return tagePlus(is, 1 - wt);
}

function kalenderwoche(is) {
  var d = ausIso(is);
  var ziel = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  ziel.setDate(ziel.getDate() + 3 - ((ziel.getDay() + 6) % 7));
  var ersterDonnerstag = new Date(ziel.getFullYear(), 0, 4);
  ersterDonnerstag.setDate(ersterDonnerstag.getDate() + 3 - ((ersterDonnerstag.getDay() + 6) % 7));
  return 1 + Math.round((ziel - ersterDonnerstag) / (7 * 86400000));
}

function fsApiDa()   { return (typeof window.showOpenFilePicker === 'function'); }

function opfsDa()    { return !!(navigator.storage && navigator.storage.getDirectory); }

function idbDa()     { return !!window.indexedDB; }

function localDa() {
  try {
    window.localStorage.setItem('__probe__', '1');
    window.localStorage.removeItem('__probe__');
    return true;
  } catch (e) {
    return false;
  }
}

function idbOeffnen() {
  return new Promise(function (fertig, fehler) {
    if (!idbDa()) { fehler(new Error('IndexedDB nicht verfügbar')); return; }
    var anfrage = window.indexedDB.open(IDB_NAME, 1);
    anfrage.onupgradeneeded = function () {
      var db = anfrage.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) { db.createObjectStore(IDB_STORE); }
    };
    anfrage.onsuccess = function () { fertig(anfrage.result); };
    anfrage.onerror   = function () { fehler(anfrage.error); };
  });
}

function idbSchreiben(schluessel, wert) {
  return idbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(IDB_STORE, 'readwrite');
      t.objectStore(IDB_STORE).put(wert, schluessel);
      t.oncomplete = function () { db.close(); fertig(true); };
      t.onerror    = function () { db.close(); fehler(t.error); };
    });
  });
}

function idbLesen(schluessel) {
  return idbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(IDB_STORE, 'readonly');
      var a = t.objectStore(IDB_STORE).get(schluessel);
      a.onsuccess = function () { db.close(); fertig(a.result || null); };
      a.onerror   = function () { db.close(); fehler(a.error); };
    });
  });
}

function rechtePruefen(handle) {
  if (!handle || typeof handle.queryPermission !== 'function') {
    return Promise.resolve('unbekannt');
  }
  return handle.queryPermission({ mode: 'readwrite' })
    .then(function (stand) { return stand; })
    .catch(function () { return 'unbekannt'; });
}

function rechteAnfragen(handle) {
  if (!handle || typeof handle.requestPermission !== 'function') {
    return Promise.resolve('unbekannt');
  }
  return handle.requestPermission({ mode: 'readwrite' })
    .then(function (stand) { return stand; })
    .catch(function () { return 'denied'; });
}

function dateiSchreiben(handle, text) {
  return handle.createWritable().then(function (strom) {
    return strom.write(text).then(function () { return strom.close(); });
  });
}

function dateiLesen(handle) {
  return handle.getFile().then(function (f) { return f.text(); });
}

function opfsHandle(anlegen) {
  return navigator.storage.getDirectory().then(function (ordner) {
    return ordner.getFileHandle(OPFS_NAME, { create: !!anlegen });
  });
}

function opfsSchreiben(text) {
  return opfsHandle(true).then(function (h) { return dateiSchreiben(h, text); });
}

function opfsLesen() {
  return opfsHandle(false).then(function (h) { return dateiLesen(h); });
}

function localSchreiben(text) {
  window.localStorage.setItem(LS_KEY, text);
  return Promise.resolve(true);
}

function localLesen() {
  return Promise.resolve(window.localStorage.getItem(LS_KEY));
}

function jetzt() { return Date.now(); }

function neueKennung() {
  return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function grabsteinSetzen(sammlung, id) {
  if (!Array.isArray(DB.grabsteine)) { DB.grabsteine = []; }
  var i;
  for (i = 0; i < DB.grabsteine.length; i++) {
    if (DB.grabsteine[i].s === sammlung && DB.grabsteine[i].id === id) {
      DB.grabsteine[i].z = jetzt();
      return DB.grabsteine[i];
    }
  }
  var g = { s: sammlung, id: id, z: jetzt() };
  DB.grabsteine.push(g);
  return g;
}

function grabsteinZeit(steine, sammlung, id) {
  var i;
  for (i = 0; i < steine.length; i++) {
    if (steine[i].s === sammlung && steine[i].id === id) { return steine[i].z || 0; }
  }
  return 0;
}

function grabsteineAufraeumen(steine) {
  var grenze = jetzt() - (GRABSTEIN_TAGE * 24 * 60 * 60 * 1000);
  var frisch = [];
  var i;
  for (i = 0; i < steine.length; i++) {
    if ((steine[i].z || 0) >= grenze) { frisch.push(steine[i]); }
  }
  return frisch;
}

function zusammenfuehren(lokal, fremd) {
  var bericht = { neu: 0, ersetzt: 0, behalten: 0, entfernt: 0, konflikte: [] };
  var ergebnis = leereDatenbank();

  var steine = grabsteineAufraeumen(
    (Array.isArray(lokal.grabsteine) ? lokal.grabsteine : [])
      .concat(Array.isArray(fremd.grabsteine) ? fremd.grabsteine : [])
  );
  /* Doppelte Vermerke auf den jüngsten zusammenziehen */
  var karteS = {};
  var i, s, k;
  for (i = 0; i < steine.length; i++) {
    var sl = steine[i].s + '|' + steine[i].id;
    if (!karteS[sl] || (steine[i].z || 0) > karteS[sl].z) {
      karteS[sl] = { s: steine[i].s, id: steine[i].id, z: steine[i].z || 0 };
    }
  }
  var steineFrisch = [];
  for (k in karteS) {
    if (Object.prototype.hasOwnProperty.call(karteS, k)) { steineFrisch.push(karteS[k]); }
  }
  ergebnis.grabsteine = steineFrisch;

  for (i = 0; i < SAMMLUNGEN.length; i++) {
    s = SAMMLUNGEN[i];

    if (s === 'kalenderzuordnung') {
      var a = lokal[s] || {};
      var b = fremd[s] || {};
      var alle = {};
      for (k in a) { if (Object.prototype.hasOwnProperty.call(a, k)) { alle[k] = true; } }
      for (k in b) { if (Object.prototype.hasOwnProperty.call(b, k)) { alle[k] = true; } }
      for (k in alle) {
        if (!Object.prototype.hasOwnProperty.call(alle, k)) { continue; }
        var wa = a[k] || null;
        var wb = b[k] || null;
        var tot = grabsteinZeit(steineFrisch, s, k);
        var neuster = Math.max(wa ? (wa.geaendert || 0) : 0, wb ? (wb.geaendert || 0) : 0);
        if (tot && tot >= neuster) { bericht.entfernt++; continue; }
        if (wa && wb) {
          if ((wb.geaendert || 0) > (wa.geaendert || 0)) {
            ergebnis[s][k] = wb; bericht.ersetzt++;
            if (wa.art !== wb.art) { bericht.konflikte.push({ s: s, id: k, gewaehlt: 'fremd' }); }
          } else {
            ergebnis[s][k] = wa; bericht.behalten++;
            if (wa.art !== wb.art) { bericht.konflikte.push({ s: s, id: k, gewaehlt: 'lokal' }); }
          }
        } else if (wb) {
          ergebnis[s][k] = wb; bericht.neu++;
        } else {
          ergebnis[s][k] = wa; bericht.behalten++;
        }
      }
      continue;
    }

    var listeA = Array.isArray(lokal[s]) ? lokal[s] : [];
    var listeB = Array.isArray(fremd[s]) ? fremd[s] : [];
    var karte = {};
    var j;
    for (j = 0; j < listeA.length; j++) { karte[listeA[j].id] = { a: listeA[j], b: null }; }
    for (j = 0; j < listeB.length; j++) {
      if (karte[listeB[j].id]) { karte[listeB[j].id].b = listeB[j]; }
      else { karte[listeB[j].id] = { a: null, b: listeB[j] }; }
    }

    var kennung;
    for (kennung in karte) {
      if (!Object.prototype.hasOwnProperty.call(karte, kennung)) { continue; }
      var paar = karte[kennung];
      var za = paar.a ? (paar.a.geaendert || 0) : 0;
      var zb = paar.b ? (paar.b.geaendert || 0) : 0;
      var totZeit = grabsteinZeit(steineFrisch, s, kennung);

      if (totZeit && totZeit >= Math.max(za, zb)) { bericht.entfernt++; continue; }

      if (paar.a && paar.b) {
        if (zb > za) {
          ergebnis[s].push(paar.b); bericht.ersetzt++;
          if (za > 0 && zb > 0) { bericht.konflikte.push({ s: s, id: kennung, gewaehlt: 'fremd' }); }
        } else if (za > zb) {
          ergebnis[s].push(paar.a); bericht.behalten++;
          if (zb > 0) { bericht.konflikte.push({ s: s, id: kennung, gewaehlt: 'lokal' }); }
        } else {
          ergebnis[s].push(paar.a); bericht.behalten++;
        }
      } else if (paar.b) {
        ergebnis[s].push(paar.b); bericht.neu++;
      } else {
        ergebnis[s].push(paar.a); bericht.behalten++;
      }
    }
  }

  /* Einstellungen wurden bisher als Ganzes ersetzt: Wer den jüngeren
     Stempel hatte, bestimmte alles. Damit verschwand eine Einstellung,
     die das andere Gerät gar nicht kannte — etwa eine neu freigegebene
     Art fürs Jahresraster. Jetzt wird je Schlüssel zusammengeführt:
     Der jüngere Stand gewinnt, aber er löscht nichts, was er nicht
     kennt. */
  var ea = (lokal.einstellungen && lokal.einstellungen.stempel) || 0;
  var eb = (fremd.einstellungen && fremd.einstellungen.stempel) || 0;
  var aelter = (eb > ea) ? (lokal.einstellungen || {}) : (fremd.einstellungen || {});
  var juenger = (eb > ea) ? (fremd.einstellungen || {}) : (lokal.einstellungen || {});

  /* Diese Einstellungen sind Verzeichnisse: Dort wird je Eintrag
     verschmolzen, sonst verlöre man die Wahl des anderen Geräts. */
  var VERZEICHNISSE = ['artenImJahr', 'flaecheOben', 'skizzenVorschau'];

  var e;
  for (e in aelter) {
    if (Object.prototype.hasOwnProperty.call(aelter, e)) {
      ergebnis.einstellungen[e] = aelter[e];
    }
  }
  for (e in juenger) {
    if (!Object.prototype.hasOwnProperty.call(juenger, e)) { continue; }
    if (VERZEICHNISSE.indexOf(e) >= 0) {
      var zus = {};
      var q, k2;
      for (q = 0; q < 2; q++) {
        var vz = (q === 0) ? (aelter[e] || {}) : (juenger[e] || {});
        for (k2 in vz) {
          if (Object.prototype.hasOwnProperty.call(vz, k2)) { zus[k2] = vz[k2]; }
        }
      }
      ergebnis.einstellungen[e] = zus;
      continue;
    }
    ergebnis.einstellungen[e] = juenger[e];
  }
  ergebnis.einstellungen.clientId = CLIENT_ID;
  ergebnis.einstellungen.redirectUri = REDIRECT_URI;
  ergebnis.version = APP_VERSION;

  return { db: ergebnis, bericht: bericht };
}

function alsText() {
  DB.version = APP_VERSION;
  if (!DB.einstellungen) { DB.einstellungen = leereDatenbank().einstellungen; }
  DB.einstellungen.gespeichert = isoZeit();
  if (!DB.einstellungen.stempel) { DB.einstellungen.stempel = jetzt(); }
  if (!Array.isArray(DB.grabsteine)) { DB.grabsteine = []; }
  return JSON.stringify(DB, null, 2);
}

function uebernehmen(text) {
  if (!text) { return false; }
  var gelesen;
  try {
    gelesen = JSON.parse(text);
  } catch (e) {
    melde('Die Datei enthält kein gültiges JSON: ' + e.message, 'warn');
    return false;
  }
  if (!gelesen || typeof gelesen !== 'object') { return false; }

  var frisch = leereDatenbank();
  var i;
  for (i = 0; i < SAMMLUNGEN.length; i++) {
    var name = SAMMLUNGEN[i];
    if (name === 'kalenderzuordnung') {
      if (gelesen[name] && typeof gelesen[name] === 'object') { frisch[name] = gelesen[name]; }
    } else if (Array.isArray(gelesen[name])) {
      frisch[name] = gelesen[name];
    }
  }
  if (gelesen.einstellungen && typeof gelesen.einstellungen === 'object') {
    var e;
    for (e in gelesen.einstellungen) {
      if (Object.prototype.hasOwnProperty.call(gelesen.einstellungen, e)) {
        frisch.einstellungen[e] = gelesen.einstellungen[e];
      }
    }
  }
  if (Array.isArray(gelesen.grabsteine)) { frisch.grabsteine = gelesen.grabsteine; }
  frisch.einstellungen.clientId    = CLIENT_ID;
  frisch.einstellungen.redirectUri = REDIRECT_URI;
  bestandStempeln(frisch);
  DB = frisch;
  return true;
}

function speichern() {
  var text = alsText();

  if (speicherWeg === 'datei' && dateiHandle) {
    return dateiSchreiben(dateiHandle, text).then(function () {
      letzterSchreibvorgang = isoZeit();
      return 'datei';
    }).catch(function (f) {
      melde('Schreiben in die Datei fehlgeschlagen, weiche auf den Notweg aus.\n' + f.message, 'warn');
      return notwegSchreiben(text);
    });
  }
  return notwegSchreiben(text);
}

function notwegSchreiben(text) {
  if (opfsDa()) {
    return opfsSchreiben(text).then(function () {
      speicherWeg = 'opfs';
      letzterSchreibvorgang = isoZeit();
      return 'opfs';
    }).catch(function () {
      return localNotweg(text);
    });
  }
  return localNotweg(text);
}

function localNotweg(text) {
  if (!localDa()) {
    speicherWeg = 'keiner';
    return Promise.reject(new Error('Kein Speicherweg verfügbar'));
  }
  return localSchreiben(text).then(function () {
    speicherWeg = 'local';
    letzterSchreibvorgang = isoZeit();
    return 'local';
  });
}

function laden() {
  if (dateiHandle) {
    return rechtePruefen(dateiHandle).then(function (stand) {
      rechteStand = stand;
      if (stand !== 'granted') { return null; }
      return dateiLesen(dateiHandle).then(function (text) {
        if (uebernehmen(text)) { speicherWeg = 'datei'; return 'datei'; }
        return null;
      });
    }).then(function (ergebnis) {
      if (ergebnis) { return ergebnis; }
      return notwegLesen();
    }).catch(function () {
      return notwegLesen();
    });
  }
  return notwegLesen();
}

function notwegLesen() {
  if (opfsDa()) {
    return opfsLesen().then(function (text) {
      if (uebernehmen(text)) { speicherWeg = 'opfs'; return 'opfs'; }
      return localNotwegLesen();
    }).catch(function () {
      return localNotwegLesen();
    });
  }
  return localNotwegLesen();
}

function localNotwegLesen() {
  if (!localDa()) { speicherWeg = 'keiner'; return Promise.resolve(null); }
  return localLesen().then(function (text) {
    if (uebernehmen(text)) { speicherWeg = 'local'; return 'local'; }
    speicherWeg = localDa() ? 'local' : 'keiner';
    return null;
  });
}

function gisLaden() {
  if (gisBereit) { return Promise.resolve(true); }
  if (window.google && window.google.accounts && window.google.accounts.oauth2) {
    gisBereit = true;
    return Promise.resolve(true);
  }
  return new Promise(function (fertig, fehler) {
    var vorhanden = document.getElementById('gisSkript');
    if (vorhanden) {
      vorhanden.addEventListener('load', function () { gisBereit = true; fertig(true); });
      return;
    }
    var s = document.createElement('script');
    s.id = 'gisSkript';
    s.src = GIS_URL;
    s.async = true;
    s.onload = function () { gisBereit = true; fertig(true); };
    s.onerror = function () { fehler(new Error('Die Anmeldebibliothek ließ sich nicht laden.')); };
    document.head.appendChild(s);
  });
}

function tokenMerken(token, gueltigSek) {
  zugriffToken = token;
  tokenAblauf = Date.now() + (gueltigSek * 1000);
  try {
    window.sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ t: token, a: tokenAblauf }));
  } catch (e) {
    /* ohne sessionStorage lebt der Schlüssel nur bis zum Neuladen */
  }
  erneuerungPlanen();
}

function tokenAusSitzung() {
  try {
    var roh = window.sessionStorage.getItem(TOKEN_KEY);
    if (!roh) { return false; }
    var w = JSON.parse(roh);
    if (!w || !w.t || !w.a || w.a <= Date.now()) { return false; }
    zugriffToken = w.t;
    tokenAblauf = w.a;
    erneuerungPlanen();
    return true;
  } catch (e) {
    return false;
  }
}

function tokenVergessen() {
  zugriffToken = null;
  tokenAblauf = 0;
  if (erneuerungsUhr) { window.clearTimeout(erneuerungsUhr); erneuerungsUhr = null; }
  try { window.sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* egal */ }
}

function tokenGueltig() {
  return !!zugriffToken && tokenAblauf > Date.now();
}

function restMinuten() {
  if (!tokenGueltig()) { return 0; }
  return Math.max(0, Math.round((tokenAblauf - Date.now()) / 60000));
}

function erneuerungPlanen() {
  if (erneuerungsUhr) { window.clearTimeout(erneuerungsUhr); erneuerungsUhr = null; }
  if (!tokenAblauf) { return; }
  erneuerungVersuche = 0;
  var wartezeit = tokenAblauf - Date.now() - VORLAUF_MS;
  if (wartezeit < 1000) { wartezeit = 1000; }
  erneuerungsUhr = window.setTimeout(erneuerungLaufen, wartezeit);
}

function erneuerungLaufen() {
  erneuerungsUhr = null;
  erneuerungVersuche++;
  anmelden(true).then(function (gut) {
    if (gut) { return; }
    if (erneuerungVersuche >= ERNEUERUNG_MAX) { return; }
    erneuerungsUhr = window.setTimeout(erneuerungLaufen, ERNEUERUNG_ABSTAND);
  });
}

function erneuerungPruefen() {
  if (!tokenGueltig()) { return; }
  if (erneuerungsUhr) { return; }
  if (restMinuten() > 10) { return; }
  erneuerungVersuche = 0;
  erneuerungLaufen();
}

function klientVorbereiten() {
  if (tokenClient) { return Promise.resolve(tokenClient); }
  return gisLaden().then(function () {
    tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: function () { /* wird je Anfrage überschrieben */ },
      /* Scheitert das Anmeldefenster selbst — blockiert, geschlossen —,
         meldet Google das nur hier, nicht über callback. */
      error_callback: function () { /* wird je Anfrage überschrieben */ }
    });
    return tokenClient;
  });
}

function anmelden(still) {
  return anmeldeVersuch(still, still ? '' : '').then(function (gut) {
    if (gut || still) { return gut; }
    return anmeldeVersuch(false, 'consent');
  });
}

function anmeldeVersuch(still, aufforderung) {
  return klientVorbereiten().then(function (klient) {
    return new Promise(function (fertig) {
      anmeldeAnfragen(klient, still, aufforderung, fertig);
    });
  }).catch(function (f) {
    anmeldungLaeuft = false;
    melde('Anmeldung nicht möglich.\n' + (f ? f.message : ''), 'warn');
    zeichne();
    return false;
  });
}

function abmelden() {
  var alt = zugriffToken;
  try { window.localStorage.removeItem(ANMELDE_MERKER); } catch (e) { /* egal */ }
  tokenVergessen();
  driveDateiId = '';
  driveStand = '';
  if (alt && window.google && window.google.accounts && window.google.accounts.oauth2) {
    try { window.google.accounts.oauth2.revoke(alt, function () { return null; }); }
    catch (e) { /* Widerruf ist Beiwerk */ }
  }
  melde('Abgemeldet. Die lokalen Daten bleiben erhalten.', null);
  anmeldeStreifenPruefen();
  zeichne();
}

function warAngemeldet() {
  try { return window.localStorage.getItem(ANMELDE_MERKER) === '1'; }
  catch (e) { return false; }
}

function driveKopf(zusatz) {
  var k = { 'Authorization': 'Bearer ' + zugriffToken };
  if (zusatz) {
    var n;
    for (n in zusatz) {
      if (Object.prototype.hasOwnProperty.call(zusatz, n)) { k[n] = zusatz[n]; }
    }
  }
  return k;
}

function dienstAusAdresse(url) {
  var text = String(url || '');
  if (text.indexOf('/calendar/') >= 0) { return 'Der Kalender'; }
  if (text.indexOf('/drive/') >= 0 || text.indexOf('/upload/drive/') >= 0) { return 'Drive'; }
  return 'Google';
}

function antwortPruefen(a) {
  if (a.ok) { return a; }
  var dienst = dienstAusAdresse(a.url);
  if (a.status === 401) {
    tokenVergessen();
    throw new Error('Der Zugriff ist abgelaufen. Bitte neu anmelden.');
  }
  return a.text().then(function (t) {
    /* Eine nicht freigeschaltete Schnittstelle sieht aus wie ein
       Rechtefehler, ist aber eine Einstellung im Google-Projekt. */
    if (a.status === 403 && /has not been used|is disabled|SERVICE_DISABLED/i.test(t)) {
      throw new Error(dienst + ' ist im Google-Projekt noch nicht freigeschaltet.\n'
        + 'Cloud Console öffnen, Projekt wählen, unter „APIs & Dienste – Bibliothek" '
        + 'die passende Schnittstelle aktivieren und ein bis zwei Minuten warten.');
    }
    if (a.status === 403) {
      throw new Error(dienst + ' verweigert den Zugriff (403).\n' + t.slice(0, 200));
    }
    throw new Error(dienst + ' antwortete mit ' + a.status + ': ' + t.slice(0, 200));
  });
}

function driveSuchen() {
  var url = 'https://www.googleapis.com/drive/v3/files'
          + '?q=' + encodeURIComponent("name='" + DRIVE_DATEI + "' and trashed=false")
          + '&fields=' + encodeURIComponent('files(id,name,modifiedTime)')
          + '&pageSize=10';
  return window.fetch(url, { headers: driveKopf() })
    .then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      var liste = (d && d.files) ? d.files : [];
      if (!liste.length) { return null; }
      driveDateiId = liste[0].id;
      driveStand = liste[0].modifiedTime || '';
      return liste[0];
    });
}

function driveAnlegen() {
  return window.fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: driveKopf({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ name: DRIVE_DATEI, mimeType: 'application/json' })
  }).then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      driveDateiId = d.id;
      return d.id;
    });
}

function driveHochladen() {
  var text = alsText();
  var los = driveDateiId ? Promise.resolve(driveDateiId)
                         : driveSuchen().then(function (t) { return t ? t.id : driveAnlegen(); });
  return los.then(function (id) {
    return window.fetch('https://www.googleapis.com/upload/drive/v3/files/' + id
                        + '?uploadType=media&fields=id,modifiedTime', {
      method: 'PATCH',
      headers: driveKopf({ 'Content-Type': 'application/json' }),
      body: text
    });
  }).then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      driveStand = d.modifiedTime || '';
      letzteUebertragung = isoZeit();
      return true;
    });
}

function driveHerunterladen() {
  var los = driveDateiId ? Promise.resolve(driveDateiId)
                         : driveSuchen().then(function (t) { return t ? t.id : null; });
  return los.then(function (id) {
    if (!id) { return null; }
    return window.fetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media', {
      headers: driveKopf()
    }).then(antwortPruefen)
      .then(function (a) { return a.text(); });
  });
}

function textZuBestand(text) {
  var gelesen;
  try {
    gelesen = JSON.parse(text);
  } catch (e) {
    return null;
  }
  if (!gelesen || typeof gelesen !== 'object') { return null; }
  var frisch = leereDatenbank();
  var i, name;
  for (i = 0; i < SAMMLUNGEN.length; i++) {
    name = SAMMLUNGEN[i];
    if (name === 'kalenderzuordnung') {
      if (gelesen[name] && typeof gelesen[name] === 'object') { frisch[name] = gelesen[name]; }
    } else if (Array.isArray(gelesen[name])) {
      frisch[name] = gelesen[name];
    }
  }
  if (Array.isArray(gelesen.grabsteine)) { frisch.grabsteine = gelesen.grabsteine; }
  if (gelesen.einstellungen && typeof gelesen.einstellungen === 'object') {
    var e;
    for (e in gelesen.einstellungen) {
      if (Object.prototype.hasOwnProperty.call(gelesen.einstellungen, e)) {
        frisch.einstellungen[e] = gelesen.einstellungen[e];
      }
    }
  }
  bestandStempeln(frisch);
  return frisch;
}

function berichtText(b) {
  if (!b) { return 'kein Abgleich gelaufen'; }
  var t = b.neu + ' neu · ' + b.ersetzt + ' ersetzt · ' + b.behalten + ' behalten · '
        + b.entfernt + ' entfernt';
  if (b.konflikte.length) { t += ' · ' + b.konflikte.length + ' Konflikt(e)'; }
  return t;
}

function abgleichen() {
  if (!tokenGueltig()) { return Promise.reject(new Error('Nicht angemeldet.')); }
  bestandStempeln(DB);
  return driveHerunterladen().then(function (text) {
    var fremd = text ? textZuBestand(text) : null;
    if (!fremd) {
      letzterBericht = { neu: 0, ersetzt: 0, behalten: 0, entfernt: 0, konflikte: [] };
      return driveHochladen();
    }
    var ergebnis = zusammenfuehren(DB, fremd);
    DB = ergebnis.db;
    letzterBericht = ergebnis.bericht;
    return speichern().then(function () { return driveHochladen(); });
  }).then(function () {
    letzterAbgleich = isoZeit();
    return letzterBericht;
  });
}

function abgleichPlanen(sofort) {
  if (!tokenGueltig()) { return; }
  if (abgleichUhr) { window.clearTimeout(abgleichUhr); }
  abgleichUhr = window.setTimeout(abgleichStill, sofort ? 300 : ABGLEICH_VERZUG);
}

function taktPruefen() {
  if (document.hidden) { return; }
  anmeldeStreifenPruefen();
  if (!tokenGueltig() || abgleichLaeuft) { return; }
  if (lokalOffen) { abgleichStill(); return; }
  var vorher = driveStand;
  driveSuchen().then(function (treffer) {
    if (treffer && treffer.modifiedTime && treffer.modifiedTime !== vorher) {
      abgleichStill();
    }
  }).catch(function () {
    return null;
  });
}

function taktStarten() {
  if (taktUhr) { window.clearInterval(taktUhr); }
  taktUhr = window.setInterval(taktPruefen, ABGLEICH_TAKT);
}

function verbindungTaktStarten() {
  if (verbindungUhr) { window.clearInterval(verbindungUhr); }
  verbindungUhr = window.setInterval(function () {
    if (document.hidden) { return; }
    verbindungPruefen();
  }, VERBINDUNG_TAKT);
}

function wegText(weg) {
  if (weg === 'datei') { return 'Datei auf dem Gerät'; }
  if (weg === 'opfs')  { return 'geräteeigener Speicher'; }
  if (weg === 'local') { return 'lokaler Browserspeicher'; }
  return 'keiner';
}

function dateiWaehlen() {
  if (!fsApiDa()) {
    melde('Dieser Browser kennt die Datei-Schnittstelle nicht. '
        + 'Es wird ' + (opfsDa() ? 'der geräteeigene Speicher' : 'der lokale Speicher') + ' benutzt.', 'warn');
    return;
  }
  window.showOpenFilePicker({
    multiple: false,
    types: [{ description: 'Workbench-Daten', accept: { 'application/json': ['.json'] } }]
  }).then(function (liste) {
    dateiHandle = liste[0];
    dateiName = dateiHandle.name;
    return rechteAnfragen(dateiHandle);
  }).then(function (stand) {
    rechteStand = stand;
    if (stand !== 'granted') {
      melde('Zugriff auf die Datei wurde nicht erteilt.', 'warn');
      zeichne();
      return null;
    }
    return idbSchreiben(IDB_KEY, dateiHandle).then(function () { return laden(); });
  }).then(function (weg) {
    if (weg) {
      melde('Datei geöffnet und gelesen: ' + dateiName + '\nSpeicherweg: ' + wegText(weg), 'gut');
    }
    zeichne();
  }).catch(function (f) {
    if (f && f.name === 'AbortError') { melde('Auswahl abgebrochen.'); return; }
    melde('Datei konnte nicht geöffnet werden.\n' + (f ? f.message : ''), 'warn');
  });
}

function dateiAnbieten(name, text) {
  try {
    var brocken = new window.Blob([text], { type: 'application/json' });
    var adresse = window.URL.createObjectURL(brocken);
    var a = document.createElement('a');
    a.href = adresse;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function () { window.URL.revokeObjectURL(adresse); }, 4000);
    return true;
  } catch (e) {
    return false;
  }
}

function klickErneuern(e) {
  if (anmeldungLaeuft || tokenGueltig() || !warAngemeldet()) { return; }
  var ziel = e ? e.target : null;
  if (ziel && ziel.closest && ziel.closest('[onclick^="anmelden"]')) { return; }
  var schluessel = String(tokenAblauf || 'start');
  if (klickErneuerungFuer === schluessel) { return; }
  klickErneuerungFuer = schluessel;
  anmeldeVersuch(true, '').then(function (gut) {
    if (gut) { melde('Verbindung zu Google wiederhergestellt.', 'gut'); }
  });
}

/* ---------- Google-Kalender lesen (aus der Workbench) ---------- */

var ART_MUSTER = /#([A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß0-9_-]{1,23})/;

var KAL_SEITEN_MAX = 40;

function kalenderListeHolen() {
  if (!tokenGueltig()) { return Promise.resolve([]); }
  var adresse = 'https://www.googleapis.com/calendar/v3/users/me/calendarList'
              + '?fields=' + encodeURIComponent('items(id,summary,backgroundColor,selected)')
              + '&maxResults=50';
  return window.fetch(adresse, { headers: driveKopf() })
    .then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      var roh = (d && d.items) ? d.items : [];
      kalenderListe = [];
      var i;
      for (i = 0; i < roh.length; i++) {
        kalenderListe.push({
          id: roh[i].id,
          name: roh[i].summary || roh[i].id,
          farbe: roh[i].backgroundColor || ''
        });
      }
      return kalenderListe;
    });
}

function kalenderGewaehlt(id) {
  var gewaehlt = (DB.einstellungen && DB.einstellungen.kalender) || [];
  var i;
  for (i = 0; i < gewaehlt.length; i++) {
    if (gewaehlt[i].id === id) { return gewaehlt[i].aktiv !== false; }
  }
  return true;   /* noch nie entschieden: lesen */
}

function kalenderKontext(id) {
  var gewaehlt = (DB.einstellungen && DB.einstellungen.kalender) || [];
  var i;
  for (i = 0; i < gewaehlt.length; i++) {
    if (gewaehlt[i].id === id) { return gewaehlt[i].kontext || 'privat'; }
  }
  return 'privat';
}

function zeitAusEintrag(wert) {
  /* Google liefert dateTime mit Zeitzone. Die lokale Uhrzeit ist das,
     was auf dem Blatt stehen soll. */
  if (typeof wert !== 'string' || wert.length === 0) { return ''; }
  var d = new Date(wert);
  if (isNaN(d.getTime())) { return ''; }
  return zwei(d.getHours()) + ':' + zwei(d.getMinutes());
}

function tagAusEintrag(wert) {
  if (typeof wert !== 'string' || wert.length === 0) { return ''; }
  var d = new Date(wert);
  if (isNaN(d.getTime())) { return ''; }
  return isoDatum(d);
}

function titelOhneArt(titel) {
  if (typeof titel !== 'string') { return ''; }
  return titel.replace(ART_MUSTER, '').replace(/\s{2,}/g, ' ').trim();
}

function praktischGanztags(tag, von, endTag, bis) {
  if (!von || von > '00:30') { return false; }
  if (endTag === tag) { return !!bis && bis >= '23:30'; }
  /* Ende um Mitternacht des Folgetags */
  return endTag === tagePlus(tag, 1) && !!bis && bis <= '00:30';
}

function terminKontextUeber(t) {
  if (!t) { return ''; }
  var z = DB.kalenderzuordnung || {};
  if (t.id && z[t.id] && z[t.id].kontext) { return z[t.id].kontext; }
  if (t.serieId && z['serie:' + t.serieId] && z['serie:' + t.serieId].kontext) {
    return z['serie:' + t.serieId].kontext;
  }
  return '';
}

function merkeTermin(tag, satz, ziel) {
  var wohin = ziel || termineNachTag;
  if (!wohin[tag]) { wohin[tag] = []; }
  var vorhanden = wohin[tag];
  var i;
  for (i = 0; i < vorhanden.length; i++) {
    if (vorhanden[i].id === satz.id) { return; }
  }
  /* Der Kalender gibt den Kontext vor, eine eigene Zuordnung kann ihn
     überstimmen. Der vom Kalender bleibt gemerkt. */
  satz.kalKontext = satz.kontext;
  satz.kontext = terminKontextUeber(satz) || satz.kontext;
  vorhanden.push(satz);
}

function eintraegeEinsortieren(eintraege, quelle, kontext, ziel) {
  var welcher = kontext || 'privat';
  var wohin = ziel || termineNachTag;
  var i;
  for (i = 0; i < eintraege.length; i++) {
    var e = eintraege[i];
    if (e.status === 'cancelled') { continue; }
    /* Das Kürzel gehört nicht in die Anzeige — der rohe Titel bleibt
       daneben erhalten, denn aus ihm wird die Art gelesen. */
    var rohTitel = e.summary || '(ohne Titel)';
    var titel = titelOhneArt(rohTitel) || rohTitel;

    if (e.start && e.start.date) {
      /* Ganztägig: das Ende ist bei Google der Folgetag. */
      var von = e.start.date;
      var bis = e.end && e.end.date ? tagePlus(e.end.date, -1) : von;
      var lauf = von;
      var schutz = 0;
      while (lauf <= bis && schutz < 400) {
        merkeTermin(lauf, { id: e.id, titel: titel, rohTitel: rohTitel,
                            zeit: '', bis: '',
                            ort: e.location || '', ganztags: true, quelle: quelle,
                            kontext: welcher, beschreibung: e.description || '',
                            serieId: e.recurringEventId || '' }, wohin);
        lauf = tagePlus(lauf, 1);
        schutz++;
      }
      continue;
    }

    if (!e.start || !e.start.dateTime) { continue; }
    var tag = tagAusEintrag(e.start.dateTime);
    if (!tag) { continue; }

    /* Wer von 00:00 bis 23:55 einträgt, meint den ganzen Tag — auch ohne
       das Häkchen „ganztägig". Solche Termine werden von hier an wie
       ganztägige behandelt, überall. Die Uhrzeiten bleiben erhalten. */
    var zVon = zeitAusEintrag(e.start.dateTime);
    var zBis = (e.end && e.end.dateTime) ? zeitAusEintrag(e.end.dateTime) : '';
    var endTag = (e.end && e.end.dateTime) ? tagAusEintrag(e.end.dateTime) : tag;
    if (praktischGanztags(tag, zVon, endTag, zBis)) {
      merkeTermin(tag, { id: e.id, titel: titel, rohTitel: rohTitel,
                         zeit: '', bis: '', ausZeit: zVon + '–' + zBis,
