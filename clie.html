  var z = kpSeiteFinden(zielId);
  if (!s || !z || s.id === z.id || kpGruppenSchluessel(s) !== kpGruppenSchluessel(z)) { return false; }
  var gruppe = kpGruppe(kpGruppenSchluessel(s));
  var raenge = gruppe.map(function (x) { return x.rang; });
  var eindeutig = raenge.every(function (r, i) { return typeof r === 'number' && (i === 0 || r > raenge[i - 1]); });
  if (!eindeutig) {
    var basis = kpNaechsterRang();
    raenge = gruppe.map(function (x, i) { return basis + i * 10; });
  }
  var neu = gruppe.filter(function (x) { return x.id !== s.id; });
  var stelle = neu.map(function (x) { return x.id; }).indexOf(z.id) + (wo === 'nach' ? 1 : 0);
  neu.splice(stelle, 0, s);
  neu.forEach(function (x, i) {
    if (x.rang !== raenge[i]) { x.rang = raenge[i]; x.geaendert = jetzt(); }
  });
  return true;
}

function kpSchluessel(text) {
  return String(text || '').replace(/\s+/g, ' ').trim();
}

function kpAufgabe(zeile) {
  var m = String(zeile).match(KP_KASTEN);
  if (!m) { return null; }
  /* „Nicht relevant“ ([-]) gilt als nicht offen — wie erledigt, nur anders gezeigt. */
  return { erledigt: (m[2] === 'x' || m[2] === 'X' || m[2] === '-'), nichtRelevant: (m[2] === '-'), text: kpSchluessel(m[3]) };
}

function kpPrio(text) {
  var t = String(text || '');
  var m = t.match(KP_PRIO);
  return m ? { p: Number(m[1]), text: m[2] } : { p: 0, text: t };
}

function kpPrioText(text, p) {
  var rest = kpPrio(text).text;
  return (p >= 1 && p <= 3) ? 'P' + p + ' ' + rest : rest;
}

function kpPrioHtml(text) {
  var x = kpPrio(text);
  return x.p ? '<span class="prio p' + x.p + '">' + x.p + '</span>' + kpAuszeichnen(x.text) : kpAuszeichnen(text);
}

function kpPrioSetzenKern(seite, nr, p) {
  if (!seite) { return false; }
  var zeilen = String(seite.text || '').split('\n');
  var vorne = String(zeilen[nr] || '').match(/^(\s*\[[ xX-]?\]\s*)/);
  var a = kpAufgabe(zeilen[nr] || '');
  if (!vorne || !a) { return false; }
  var alt = a.text;
  var neu = kpPrioText(alt, p);
  if (neu === alt) { return false; }
  kpEintraegeFinden(seite.id, alt).forEach(function (f) {
    var z = kpZeileSuchen(f.woche, f.eintrag.text);
    if (z) {
      var bz = String(f.woche.text || '').split('\n');
      var bm = String(bz[z.nr]).match(/^(\s*\[[ xX-]?\]\s*)/);
      var rest = String(bz[z.nr]).slice(bm ? bm[1].length : 0);
      /* Was hinten angehängt ist („(Fr)“), bleibt stehen */
      if (bm && rest.indexOf(alt) === 0) { bz[z.nr] = bm[1] + neu + rest.slice(alt.length); f.woche.text = bz.join('\n'); }
    }
    f.eintrag.text = neu;
    f.woche.geaendert = jetzt();
  });
  zeilen[nr] = vorne[1] + neu;
  seite.text = zeilen.join('\n');
  seite.geaendert = jetzt();
  return true;
}

function kpOffeneZahl(seite) {
  var zeilen = String((seite && seite.text) || '').split('\n');
  var n = 0;
  var i;
  for (i = 0; i < zeilen.length; i++) {
    var a = kpAufgabe(zeilen[i]);
    if (a && !a.erledigt && a.text) { n++; }
  }
  return n;
}

function kpPasst(zeilenText, gemerkt) {
  var z = String(zeilenText || '');
  var g = String(gemerkt || '');
  if (!g) { return 0; }
  if (z === g) { return 2; }
  if (z.length > g.length && z.indexOf(g) === 0 && /[\s(\[,.;:!?\-–—✔→]/.test(z.charAt(g.length))) { return 1; }
  return 0;
}

function kpHatWoertlich(seite, text) {
  if (!seite) { return false; }
  return String(seite.text || '').split('\n').some(function (z) {
    var a = kpAufgabe(z);
    return !!(a && a.text === text);
  });
}

function kpZeileSuchen(seite, text, vorzug) {
  if (!seite) { return null; }
  var zeilen = String(seite.text || '').split('\n');
  var beste = null;
  var besteWert = 0;
  var i;
  for (i = 0; i < zeilen.length; i++) {
    var a = kpAufgabe(zeilen[i]);
    var p = a ? kpPasst(a.text, text) : 0;
    if (!p) { continue; }
    var wert = p * 2 + ((typeof vorzug !== 'boolean' || a.erledigt === vorzug) ? 1 : 0);
    if (wert > besteWert) { beste = { nr: i, erledigt: a.erledigt }; besteWert = wert; }
  }
  return beste;
}

function kpKastenSetzen(seite, nr, erledigt, nichtRelevant) {
  var zeilen = String(seite.text || '').split('\n');
  if (nr < 0 || nr >= zeilen.length) { return false; }
  var vorne = zeilen[nr].match(/^(\s*)\[([ xX-]?)\]/);
  if (!vorne) { return false; }
  zeilen[nr] = vorne[1] + (nichtRelevant ? '[-]' : (erledigt ? '[x]' : '[]')) + zeilen[nr].slice(vorne[0].length);
  seite.text = zeilen.join('\n');
  seite.geaendert = jetzt();
  return true;
}

function kpHeuteMontag() { return montagVon(isoDatum()); }

function kpWocheKennung(montag) { return 'kw-' + montag; }

function kpKurz(is) {
  var d = ausIso(is);
  return d.getDate() + '.' + (d.getMonth() + 1) + '.';
}

function kpWochenTitel(montag) {
  return 'KW ' + kalenderwoche(montag) + ' · ' + kpKurz(montag) + ' – ' + kpKurz(tagePlus(montag, 6));
}

function kpAbschnitteUmbenennen() {
  var n = 0;
  (DB.wochen || []).forEach(function (w) {
    if (!w || typeof w.text !== 'string') { return; }
    var neu = w.text
      .replace(/^(\s*#{1,3}\s+)Bringt mich substanziell weiter\s*$/gm, '$1' + KP_ABSCHNITTE.s)
      .replace(/^(\s*#{1,3}\s+)Verbindlichkeiten\s*$/gm, '$1' + KP_ABSCHNITTE.v);
    if (neu !== w.text) { w.text = neu; w.geaendert = jetzt(); n++; }
  });
  return n;
}

function kpWocheGeruest() {
  return '## ' + KP_ABSCHNITTE.s + '\n\n## ' + KP_ABSCHNITTE.v + '\n';
}

function kpWochen() {
  return (DB.wochen || []).filter(function (w) { return w && w.montag; })
    .sort(function (a, b) { return (a.montag < b.montag) ? 1 : ((a.montag > b.montag) ? -1 : 0); });
}

function kpWocheFinden(montag) {
  var l = DB.wochen || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i].montag === montag) { return l[i]; } }
  return null;
}

function kpWocheAnlegen(montag) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(montag || ''))) { return null; }
  var w = kpWocheFinden(montag);
  if (w) {
    if (typeof w.text !== 'string') { w.text = kpWocheTextAus(w); w.geaendert = jetzt(); }
    if (!Array.isArray(w.eintraege)) { w.eintraege = []; }
    return w;
  }
  if (!Array.isArray(DB.wochen)) { DB.wochen = []; }
  w = { id: kpWocheKennung(montag), montag: montag, text: kpWocheGeruest(), eintraege: [], geaendert: jetzt() };
  DB.wochen.push(w);
  grabsteinWeg('wochen', w.id);
  return w;
}

function kpWocheTextAus(w) {
  var l = Array.isArray(w && w.eintraege) ? w.eintraege : [];
  var zeile = function (text, erledigt) { return (erledigt ? '[x] ' : '[] ') + text; };
  var s = l.filter(function (e) { return e.abschnitt === 's'; }).map(function (e) { return zeile(e.text, e.erledigt); });
  var v = l.filter(function (e) { return e.abschnitt === 'v'; }).map(function (e) { return zeile(e.text, e.erledigt); });
  (Array.isArray(w && w.ziele) ? w.ziele : []).forEach(function (z) {
    var t = kpSchluessel(z && z.text);
    if (t) { s.push(zeile(t, !!z.erreicht)); }
  });
  return '## ' + KP_ABSCHNITTE.s + '\n' + (s.length ? s.join('\n') + '\n' : '')
       + '\n## ' + KP_ABSCHNITTE.v + '\n' + (v.length ? v.join('\n') + '\n' : '');
}

function kpWochenUmstellen() {
  var n = 0;
  (DB.wochen || []).forEach(function (w) {
    if (typeof w.text === 'string') { return; }
    w.text = kpWocheTextAus(w);
    if (!Array.isArray(w.eintraege)) { w.eintraege = []; }
    delete w.ziele;
    delete w.verbindlich;
    w.geaendert = jetzt();
    n++;
  });
  if (n) { spaeterSichern(); }
  return n;
}

function kpAbschnittZeile(zeilen, ab) {
  var muster = (ab === 's') ? /substanz|dauerhaft/i : /verbindlich|verpflicht/i;
  var i;
  for (i = 0; i < zeilen.length; i++) {
    var m = zeilen[i].match(/^\s*#{1,3}\s+(.*)$/);
    if (m && muster.test(m[1])) { return i; }
  }
  return -1;
}

function kpInAbschnitt(w, ab, zeile) {
  var zeilen = String(w.text || '').split('\n');
  if (ab !== 's' && ab !== 'v') {
    while (zeilen.length && !zeilen[zeilen.length - 1].trim()) { zeilen.pop(); }
    zeilen.push(zeile);
  } else {
    var h = kpAbschnittZeile(zeilen, ab);
    if (h < 0) {
      while (zeilen.length && !zeilen[zeilen.length - 1].trim()) { zeilen.pop(); }
      zeilen.push('', '## ' + KP_ABSCHNITTE[ab], zeile);
    } else {
      var ende = h + 1;
      while (ende < zeilen.length && !/^\s*#{1,3}\s/.test(zeilen[ende])) { ende++; }
      var stelle = ende;
      while (stelle - 1 > h && !zeilen[stelle - 1].trim()) { stelle--; }
      zeilen.splice(stelle, 0, zeile);
    }
  }
  w.text = zeilen.join('\n');
  w.geaendert = jetzt();
}

function kpTagKennung(datum) { return 'tag-' + datum; }

function kpTagFinden(datum) {
  var l = DB.tage || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i].datum === datum) { return l[i]; } }
  return null;
}

function kpTagAnlegen(datum) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(datum || ''))) { return null; }
  var t = kpTagFinden(datum);
  if (t) { if (!Array.isArray(t.eintraege)) { t.eintraege = []; } return t; }
  if (!Array.isArray(DB.tage)) { DB.tage = []; }
  t = { id: kpTagKennung(datum), datum: datum, text: '', eintraege: [], geaendert: jetzt() };
  DB.tage.push(t);
  grabsteinWeg('tage', t.id);
  return t;
}

function kpBehaelterAb() {
  var heute = isoDatum();
  var montag = kpHeuteMontag();
  return (DB.wochen || []).filter(function (w) { return w && w.montag && w.montag >= montag; })
    .concat((DB.tage || []).filter(function (t) { return t && t.datum && t.datum >= heute; }));
}

function kpBehaelterFinden(id) {
  var l = (DB.wochen || []).concat(DB.tage || []);
  var i;
  for (i = 0; i < l.length; i++) { if (l[i] && l[i].id === id) { return l[i]; } }
  return null;
}

function kpEintraegeFinden(seiteId, text) {
  var seite = kpSeiteFinden(seiteId);
  var aus = [];
  kpBehaelterAb().forEach(function (b) {
    var beste = null;
    var besteWert = 0;
    (b.eintraege || []).forEach(function (e) {
      if (e.quelle !== seiteId) { return; }
      var p = kpPasst(text, e.text);
      if (p === 1 && kpHatWoertlich(seite, e.text)) { p = 0; }
      if (p > besteWert && kpZeileSuchen(b, e.text)) { beste = e; besteWert = p; }
    });
    if (beste) { aus.push({ woche: b, eintrag: beste }); }
  });
  return aus;
}

function kpEintragFinden(seiteId, text) {
  return kpEintraegeFinden(seiteId, text)[0] || null;
}

function kpEintragHolen(behaelterId, id) {
  var b = kpBehaelterFinden(behaelterId);
  if (!b) { return null; }
  var l = b.eintraege || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i].id === id) { return { woche: b, eintrag: l[i] }; } }
  return null;
}

function kpWocheEintrag(w, text) {
  var l = (w && w.eintraege) || [];
  var beste = null;
  var besteWert = 0;
  var i;
  for (i = 0; i < l.length; i++) {
    if (!l[i].quelle || !kpSeiteFinden(l[i].quelle)) { continue; }
    var p = kpPasst(text, l[i].text);
    if (p === 1 && kpHatWoertlich(w, l[i].text)) { p = 0; }
    var wert = p ? p * 1000 + String(l[i].text).length : 0;
    if (wert > besteWert) { beste = l[i]; besteWert = wert; }
  }
  return beste;
}

function kpPlanenKern(seite, nr, abschnitt, datum) {
  if (!seite || ['s', 'v', 'h'].indexOf(abschnitt) < 0) { return null; }
  var zeilen = String(seite.text || '').split('\n');
  var a = (nr >= 0 && nr < zeilen.length) ? kpAufgabe(zeilen[nr]) : null;
  if (!a || !a.text || a.erledigt) { return null; }
  var b = (abschnitt === 'h') ? kpTagAnlegen(datum) : kpWocheAnlegen(montagVon(datum));
  if (!b) { return null; }
  var schon = kpEintraegeFinden(seite.id, a.text).some(function (f) { return f.woche === b; });
  if (schon) { return null; }
  if (!Array.isArray(b.eintraege)) { b.eintraege = []; }
  b.eintraege = b.eintraege.filter(function (e) { return !(e.quelle === seite.id && e.text === a.text); });
  kpInAbschnitt(b, abschnitt, '[] ' + a.text);
  b.eintraege.push({ id: neueKennung(), abschnitt: abschnitt, text: a.text, quelle: seite.id, erledigt: false });
  b.geaendert = jetzt();
  return b;
}

function kpAusplanenKern(behaelterId, id) {
  var f = kpEintragHolen(behaelterId, id);
  if (!f) { return false; }
  var b = f.woche;
  var z = kpZeileSuchen(b, f.eintrag.text);
  if (z) {
    var zeilen = String(b.text || '').split('\n');
    zeilen.splice(z.nr, 1);
    b.text = zeilen.join('\n');
  }
  b.eintraege = b.eintraege.filter(function (e) { return e.id !== id; });
  b.geaendert = jetzt();
  return true;
}

function kpBehaelterAngleichen(seiteId, text, erledigt, ausser) {
  kpEintraegeFinden(seiteId, text).forEach(function (f) {
    if (f.woche === ausser) { return; }
    var z = kpZeileSuchen(f.woche, f.eintrag.text, !erledigt);
    if (z && z.erledigt !== erledigt) { kpKastenSetzen(f.woche, z.nr, erledigt); }
    f.eintrag.erledigt = erledigt;
    f.woche.geaendert = jetzt();
  });
}

function kpBehaelterZeileUmKern(b, nr) {
  if (!b) { return false; }
  var zeilen = String(b.text || '').split('\n');
  var a = (nr >= 0 && nr < zeilen.length) ? kpAufgabe(zeilen[nr]) : null;
  if (!a) { return false; }
  var neu = !a.erledigt;
  kpKastenSetzen(b, nr, neu);
  var e = a.text ? kpWocheEintrag(b, a.text) : null;
  if (e) {
    var quelle = kpSeiteFinden(e.quelle);
    var z = kpZeileSuchen(quelle, e.text, a.erledigt);
    if (z && z.erledigt !== neu) { kpKastenSetzen(quelle, z.nr, neu); }
    e.erledigt = neu;
    kpBehaelterAngleichen(quelle.id, e.text, neu, b);
  }
  return true;
}

function kpSeiteKastenUmKern(s, nr) {
  if (!s) { return false; }
  var zeilen = String(s.text || '').split('\n');
  var a = (nr >= 0 && nr < zeilen.length) ? kpAufgabe(zeilen[nr]) : null;
  if (!a) { return false; }
  kpKastenSetzen(s, nr, !a.erledigt);
  if (a.text) { kpBehaelterAngleichen(s.id, a.text, !a.erledigt, null); }
  return true;
}

function kpAuszeichnen(text) {
  var t = esc(text);
  KP_VERWEIS.lastIndex = 0;
  t = t.replace(KP_VERWEIS, function (ganz, art, id, titel) { return kpVerweisHtml(art, id, titel); });
  t = t.replace(/\[([^\]]{1,200})\] ?\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  t = t.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  t = t.replace(/(^|[\s(>])\*\*([^*\n\s](?:[^*\n]{0,198}[^*\n\s])?)\*\*(?=$|[\s.,;:!?)<])/g, '$1<b>$2</b>');
  t = t.replace(/(^|[\s(>])__([^_\n\s](?:[^_\n]{0,198}[^_\n\s])?)__(?=$|[\s.,;:!?)<])/g, '$1<u>$2</u>');
  t = t.replace(/(^|[\s(>])~~([^~\n\s](?:[^~\n]{0,198}[^~\n\s])?)~~(?=$|[\s.,;:!?)<])/g, '$1<s>$2</s>');
  var paar = function (zeichen, auf, zu) {
    var z = zeichen.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(^|[\\s(>])' + z + '([^' + z + '\\s\\n](?:[^' + z + '\\n]{0,118}[^' + z + '\\s\\n])?)' + z
                      + '(?=$|[\\s.,;:!?)<])', 'g');
    t = t.replace(re, '$1' + auf + '$2' + zu);
  };
  paar('*', '<b>', '</b>');
  paar('_', '<i>', '</i>');
  paar('~', '<s>', '</s>');
  paar('+', '<u>', '</u>');
  paar('^', '<span class="fl-kap">', '</span>');
  return t;
}

function kpUeberschriftStufe(zeile) {
  var m = String(zeile).replace(/^\s+/, '').match(/^(#{1,3})\s*(.*)$/);
  return m ? m[1].length : 0;
}

function kpAbschnittSchluessel(seiteId, zeile) {
  return String(seiteId) + '|' + String(zeile).trim().toLowerCase();
}

function kpAbschnittZu(seiteId, zeile) {
  return KP_ZU[kpAbschnittSchluessel(seiteId, zeile)] === true;
}

function kpAbschnittSetzen(seiteId, zeile, zu) {
  var k = kpAbschnittSchluessel(seiteId, zeile);
  if (zu) { KP_ZU[k] = true; } else { delete KP_ZU[k]; }
}

function kpHatUeberschriften(seite) {
  return String((seite && seite.text) || '').split('\n').some(function (z) { return kpUeberschriftStufe(z) > 0; });
}

function kpAlleAbschnitte(seite, zu) {
  if (!seite) { return; }
  String(seite.text || '').split('\n').forEach(function (z) {
    if (kpUeberschriftStufe(z)) { kpAbschnittSetzen(seite.id, z, zu); }
  });
}

function kpAbschnitteOeffnenBis(seite, nr) {
  if (!seite) { return; }
  var zeilen = String(seite.text || '').split('\n');
  var stufe = 9;
  var i;
  for (i = Math.min(nr, zeilen.length) - 1; i >= 0 && stufe > 1; i--) {
    var s = kpUeberschriftStufe(zeilen[i]);
    if (s && s < stufe) { kpAbschnittSetzen(seite.id, zeilen[i], false); stufe = s; }
  }
}

function kpFeldHolen() {
  var f = (typeof document.querySelector === 'function') ? document.querySelector('.schirm.aktiv #kpFeld') : null;
  return f || document.getElementById('kpFeld');
}

function kpMarkeAnZeile(feld, nr, rolle) {
  var zeilen = String(feld.value || '').split('\n');
  if (nr < 0 || nr >= zeilen.length) { return; }
  var a = 0;
  var i;
  for (i = 0; i < nr; i++) { a += zeilen[i].length + 1; }
  if (typeof feld.setSelectionRange === 'function') { feld.setSelectionRange(a, a + zeilen[nr].length); }
  if (!rolle || typeof feld.getBoundingClientRect !== 'function' || typeof window.getComputedStyle !== 'function') { return; }
  var zeilenHoehe = parseFloat(window.getComputedStyle(feld).lineHeight) || 24;
  var oben = parseFloat(window.getComputedStyle(feld).paddingTop) || 0;
  var r = feld.getBoundingClientRect();
  rolle.scrollTop += r.top + oben + nr * zeilenHoehe - (window.innerHeight || 800) / 2;
}

function kpFrequenz(w) {
  if (!w) { return ''; }
  var kz = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  var n = Math.max(1, Number(w.intervall) || 1);
  var namen = [];
  var i;
  if (w.takt === 'woche' || w.typ === 'woechentlich') {
    var tage = Array.isArray(w.tage) ? w.tage : [];
    if (!w.takt) {
      tage = (Array.isArray(w.wochentage) ? w.wochentage : []).map(function (t) { return Number(t) === 7 ? 0 : Number(t); });
    }
    for (i = 1; i <= 7; i++) {
      var nr = (i === 7) ? 0 : i;
      if (tage.indexOf(nr) >= 0) { namen.push(kz[nr]); }
    }
    var liste = (namen.length === 7) ? 'täglich' : (namen.join(', ') || 'wöchentlich');
    return (n === 1) ? liste : ('alle ' + n + ' Wochen: ' + liste);
  }
  if (w.takt === 'monat' || w.typ === 'monatlich') {
    var tag = Number(w.tag) || 1;
    return (n === 1) ? ('monatlich am ' + tag + '.') : ('alle ' + n + ' Monate am ' + tag + '.');
  }
  return '';
}

/* Aus der Workbench — termineHolen heißt hier clTermineHolen; dazu
   merkt CLIE Schlüssel und Konto (seit 0.7.1). */
function anmeldeAnfragen(klient, still, aufforderung, fertig) {
  var erledigt = false;
  var uhr = null;
  anmeldungLaeuft = true;
  var abschliessen = function (gut) {
    if (erledigt) { return; }
    erledigt = true;
    anmeldungLaeuft = false;
    if (uhr) { window.clearTimeout(uhr); }
    fertig(gut);
  };
  var gescheitert = function (grund) {
    if (erledigt) { return; }
    letzteErneuerung = { zeit: isoZeit(),
                         ergebnis: still ? 'still fehlgeschlagen' : 'abgebrochen',
                         grund: grund };
    if (still) {
      melde('Die stille Erneuerung ist fehlgeschlagen (' + grund + ').\n'
          + 'Der nächste Klick in der App verbindet neu.', 'warn');
    } else {
      melde('Anmeldung nicht abgeschlossen (' + grund + ').', 'warn');
    }
    zeichne();
    abschliessen(false);
  };
  klient.callback = function (antwort) {
    if (antwort && antwort.access_token) {
      tokenMerken(antwort.access_token, Number(antwort.expires_in) || 3600);
      clTokenSichern();
      clKontoMerken();
      try { window.localStorage.setItem(ANMELDE_MERKER, '1'); } catch (e) { /* egal */ }
      verbindungOk = true;
      letzteErneuerung = { zeit: isoZeit(), ergebnis: still ? 'still erneuert' : 'angemeldet',
                           grund: '' };
      abgleichPlanen(true);
      clTermineHolen(false);
      verbindungPruefen();
      if (!still) { melde('Angemeldet. Gültig für ' + restMinuten() + ' Minuten.', 'gut'); }
      zeichne();
      abschliessen(true);
      return;
    }
    gescheitert((antwort && antwort.error) ? antwort.error : 'unbekannt');
  };
  klient.error_callback = function (fehler) {
    gescheitert((fehler && fehler.type) ? fehler.type : 'fenster_fehler');
  };
  /* Von Hand darf es länger dauern — wer ein Konto wählt, braucht Zeit. */
  uhr = window.setTimeout(function () { gescheitert('keine_antwort'); },
                          still ? ANMELDE_ZEITGRENZE_MS : 5 * ANMELDE_ZEITGRENZE_MS);
  /* Auch von Hand zuerst ohne Rückfrage: Wer schon zugestimmt hat,
     soll die Zustimmung nicht jedes Mal wieder erteilen müssen. */
  klient.requestAccessToken(clAnfrage(aufforderung));
}

/* ---------- Bestand ---------- */

/* Nur Kennung und Stempel nachtragen — alles andere gehört der Workbench.
   (Wie im Wochenkompass; die Unterbau-Funktion uebernehmen ruft das.) */
function bestandStempeln(db) {
  var i, s, k;
  var nachgetragen = 0;
  for (i = 0; i < SAMMLUNGEN.length; i++) {
    s = SAMMLUNGEN[i];
    /* Die Kalenderzuordnung ist ein Verzeichnis, keine Liste. */
    if (s === 'kalenderzuordnung') {
      if (!db[s] || typeof db[s] !== 'object' || Array.isArray(db[s])) { db[s] = {}; }
      for (k in db[s]) {
        if (!Object.prototype.hasOwnProperty.call(db[s], k)) { continue; }
        if (typeof db[s][k] === 'string') { db[s][k] = { art: db[s][k], geaendert: 0 }; nachgetragen++; }
        else if (db[s][k] && !db[s][k].geaendert) { db[s][k].geaendert = 0; nachgetragen++; }
      }
      continue;
    }
    if (!Array.isArray(db[s])) { db[s] = []; }
    var liste = db[s];
    var j;
    for (j = 0; j < liste.length; j++) {
      if (!liste[j].id) { liste[j].id = neueKennung(); nachgetragen++; }
      if (typeof liste[j].geaendert !== 'number') { liste[j].geaendert = 0; nachgetragen++; }
    }
  }
  if (!Array.isArray(db.grabsteine)) { db.grabsteine = []; }
  if (!db.einstellungen || typeof db.einstellungen !== 'object') { db.einstellungen = {}; }
  return nachgetragen;
}

/* ---------- Kategorie: Alle, Beruf, Privat ---------- */

function clFilterLaden() {
  var f = null;
  try { f = window.localStorage.getItem(CL_FILTER_KEY); } catch (e) { f = null; }
  if (f === 'alle' || f === 'beruflich' || f === 'privat') { cl.filter = f; }
}

function katSetzen(f) {
  if (f !== 'alle' && f !== 'beruflich' && f !== 'privat') { return; }
  cl.filter = f;
  try { window.localStorage.setItem(CL_FILTER_KEY, f); } catch (e) { /* ohne Speicher eben nur für jetzt */ }
  cl.aufklapp = '';
  zeichne();
}

function katName(f) {
  var i;
  for (i = 0; i < CL_KATEGORIEN.length; i++) { if (CL_KATEGORIEN[i][0] === f) { return CL_KATEGORIEN[i][1]; } }
  return 'Alle';
}

function clPasstTermin(t) {
  return cl.filter === 'alle' || !t.kontext || t.kontext === cl.filter;
}

/* ---------- Kalender ---------- */

/* Wie termineHolen der Workbench, nur schlanker: ein Fenster um heute,
   kein Jahresarchiv, kein Ladebalken. Erst am Ende eingesetzt, damit
   die Übersicht während des Abrufs gefüllt bleibt. */
function clTermineHolen(laut) {
  if (!tokenGueltig()) {
    if (laut) { melde('Nicht mit Google verbunden — bitte erst verbinden.', 'warn'); }
    return Promise.resolve(false);
  }
  if (kalenderLaeuft) { return Promise.resolve(false); }
  kalenderLaeuft = true;
  kalenderFehler = '';
  /* Das Fenster umfasst heute und den Tag, den der Kalender zeigt. */
  var heute = isoDatum();
  var mitte = clKalDatum();
  var von = tagePlus(mitte < heute ? mitte : heute, -KAL_VOR);
  var bis = tagePlus(mitte > heute ? mitte : heute, KAL_NACH);
  var vorbereitung = kalenderListe.length ? Promise.resolve(kalenderListe) : kalenderListeHolen();
  return vorbereitung.then(function () {
    var neu = {};
    var reihe = Promise.resolve(true);
    kalenderListe.forEach(function (kal) {
      if (!kalenderGewaehlt(kal.id)) { return; }
      /* Je Kalender in ein eigenes Verzeichnis — so bekommt jeder Termin
         die Kennung seines Kalenders, die das Ändern und Löschen braucht. */
      var eigen = {};
      reihe = reihe.then(function () { return einenKalenderHolen(kal, von, bis, eigen); }).then(function () {
        clKalenderEinsetzen(eigen, kal, neu);
      });
    });
    return reihe.then(function () { return neu; });
  }).then(function (neu) {
    termineNachTag = neu || {};
    kalVon = von;
    kalBis = bis;
    kalenderStand = isoZeit();
    if (laut) {
      if (kalenderFehler) { melde('Termine teilweise geholt.\n' + kalenderFehler, 'warn'); }
      else { melde('Termine geholt: ' + termineZahl() + '.', 'gut'); }
    }
    return true;
  }).catch(function (f) {
    kalenderFehler = f ? f.message : 'unbekannter Fehler';
    if (laut) { melde('Termine konnten nicht geholt werden.\n' + kalenderFehler, 'warn'); }
    return false;
  }).then(function (wert) {
    kalenderLaeuft = false;
    zeichne();
    return wert;
  });
}

function clKalenderEinsetzen(eigen, kal, ziel) {
  var tag, i, j;
  for (tag in eigen) {
    if (!Object.prototype.hasOwnProperty.call(eigen, tag)) { continue; }
    if (!ziel[tag]) { ziel[tag] = []; }
    for (i = 0; i < eigen[tag].length; i++) {
      var t = eigen[tag][i];
      var da = false;
      for (j = 0; j < ziel[tag].length; j++) { if (ziel[tag][j].id === t.id) { da = true; } }
      if (da) { continue; }
      t.kalId = kal.id;
      ziel[tag].push(t);
    }
  }
}

function clKalenderTaktStarten() {
  if (kalenderUhr) { window.clearInterval(kalenderUhr); }
  kalenderUhr = window.setInterval(function () {
    if (document.hidden || !tokenGueltig()) { return; }
    clTermineHolen(false);
  }, KAL_TAKT);
}

function clUhrzeit() {
  var d = new Date();
  return zwei(d.getHours()) + ':' + zwei(d.getMinutes());
}

/* Termine von heute mit Uhrzeit, die noch nicht vorbei sind. */
function clTermineRest() {
  var t = termineFuerTag(isoDatum()).zeit;
  var nun = clUhrzeit();
  return t.filter(function (x) { return clPasstTermin(x) && (x.bis || x.zeit) > nun; });
}

/* ---------- Zahlen für die Übersicht ---------- */

function clSeitenAktiv(art, typ) {
  return kpSeitenAlle().filter(function (s) {
    if (s.art !== art || !kpPasstFilter(s, cl.filter)) { return false; }
    if (typ && s.typ !== typ) { return false; }
    return s.art !== 'vorhaben' || s.zustand === 'laeuft';
  });
}

function clOffeneAufgaben() {
  var seiten = clSeitenAktiv('vorhaben', '').concat(clSeitenAktiv('liste', ''));
  return seiten.reduce(function (n, s) { return n + kpOffeneZahl(s); }, 0);
}

/* ---------- Heute (seit 0.9) ----------
   Alles, was heute noch offen ist — eine Liste, die im Lauf des Tages
   kürzer wird. Die Zahl an der App und unten in der Leiste zählt: Termine,
   die noch nicht begonnen haben, offene Aufgaben für heute (mit und ohne
   Uhrzeit) und offene Routinen. Nicht: Ganztägiges, Begonnenes, Vorbei. */

cl.heute = { erlZeigen: false };

function clHeuteDaten() {
  var is = isoDatum();
  var nun = clUhrzeit();
  var t = clTermineAm(is);
  var d = { is: is, nun: nun, ganztags: t.ganztags, posten: [], vorgenommen: [], routinen: [], erledigt: [] };
  t.zeit.forEach(function (x) {
    if (x.zeit > nun) { d.posten.push({ art: 'termin', zeit: x.zeit, titel: x.titel, x: x }); }
  });
  clTagZeilen(is).forEach(function (z) {
    if (!z.a || !z.a.text) { return; }
    var p = { art: 'aufgabe', zeit: z.zeit, titel: z.a.text, nr: z.nr, cls: z.cls };
    if (z.a.erledigt) { d.erledigt.push(p); }
    else if (z.zeit) { d.posten.push(p); }
    else { d.vorgenommen.push(p); }
  });
  clRoutinenAm(is).forEach(function (a) {
    if (a.pausiert) { return; }
    var p = { art: 'routine', zeit: aufgabeZeitAn(a, is) || '', titel: a.titel, id: a.id };
    if (istErledigtAn(a, is)) { d.erledigt.push(p); }
    else if (p.zeit) { d.posten.push(p); }
    else { d.routinen.push(p); }
  });
  d.posten.sort(function (a, b) { return a.zeit < b.zeit ? -1 : (a.zeit > b.zeit ? 1 : 0); });
  /* Vorgenommenes nach Priorität: P1, P2, P3, dann ohne (seit 0.12) */
  d.vorgenommen = clNachPrio(d.vorgenommen, function (p) { return p.titel; });
  d.zahl = d.posten.length + d.vorgenommen.length + d.routinen.length;
  return d;
}

function clHeuteZahl() { return clHeuteDaten().zahl; }

function clHeuteZahlHtml() {
  var n = clHeuteZahl();
  return n ? '<span class="zahl">' + n + '</span>' : '';
}

/* Die Zahl auch unten in der Leiste */
function silkZeichnen() {
  var el = document.getElementById('heuteZahl');
  if (!el) { return; }
  var n = clHeuteZahl();
  el.textContent = n ? String(n) : '';
  el.className = 'zahl' + (n ? '' : ' leer');

function clHeuteZeile(d, p) {
  var zt = p.zeit ? '<span class="zt">' + esc(clZeitText(p.zeit)) + '</span>' : '';
  if (p.art === 'termin') {

/* ---------- Suchen (seit 0.10) ----------
   Wie „Find“ am Palm: ein Feld, alles durchsuchen, nach App gruppiert.
   Groß/klein, ä/ae und ß/ss sind egal. Der Filter ▼ gilt hier nicht —
   gesucht wird immer in allem. Termine nur im geholten Zeitraum. */

var SU_ZULETZT_KEY = 'clie-suche-zuletzt';
var SU_GRUPPEN = [['termine', 'Termine'], ['jahr', 'Jahrestermine'], ['aufgaben', 'Aufgaben'], ['memo', 'Memo'],
                  ['checklisten', 'Checklisten'], ['sammlungen', 'Sammlungen'], ['routinen', 'Routinen']];
var SU_JE_GRUPPE = 3;

cl.su = { text: '', erl: false, auf: {}, zuletzt: [] };

function suLaden() {
  try { cl.su.zuletzt = JSON.parse(window.localStorage.getItem(SU_ZULETZT_KEY) || '[]') || []; } catch (e) { cl.su.zuletzt = []; }
  if (!Array.isArray(cl.su.zuletzt)) { cl.su.zuletzt = []; }
}

function suMerken(t) {
  var w = String(t || '').trim();
  if (w.length < 2) { return; }
  cl.su.zuletzt = [w].concat(cl.su.zuletzt.filter(function (x) { return x.toLowerCase() !== w.toLowerCase(); })).slice(0, 6);
  try { window.localStorage.setItem(SU_ZULETZT_KEY, JSON.stringify(cl.su.zuletzt)); } catch (e) { /* nur für jetzt */ }
}

/* Ein Zeichen vereinheitlicht: klein, ä→ae, ö→oe, ü→ue, ß→ss */
function suZeichen(c) {
  var k = String(c).toLowerCase();
  return { 'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'ß': 'ss' }[k] || k;
}

function suNorm(t) {
  var s = String(t || '');
  var aus = '';
  var i;
  for (i = 0; i < s.length; i++) { aus += suZeichen(s.charAt(i)); }
  return aus;
}

/* Wo steht der Suchbegriff im Original? { a, e, wort } oder null.
   wort = true, wenn der Treffer an einem Wortanfang steht. */
function suFinde(orig, q) {
  var s = String(orig || '');
  var norm = '';
  var start = [];
  var i;
  for (i = 0; i < s.length; i++) {
    var z = suZeichen(s.charAt(i));
    var k;
    for (k = 0; k < z.length; k++) { start.push(i); }
    norm += z;
  }
  var p = norm.indexOf(suNorm(q));
  if (p < 0 || !q) { return null; }
  var a = start[p];
  var ende = p + suNorm(q).length - 1;
  var e = start[ende] + 1;
  return { a: a, e: e, wort: (a === 0 || /[^0-9A-Za-zÄÖÜäöüß]/.test(s.charAt(a - 1))) };
}

/* Text mit hervorgehobenem Treffer; lang = Ausschnitt um den Treffer */
function suMarkiert(orig, q, lang) {
  var s = String(orig || '').replace(/\s+/g, ' ');
  var f = suFinde(s, q);
  if (!f) { return esc(lang ? s.slice(0, 60) : s); }
  var von = 0, bis = s.length;
  if (lang) {
    von = Math.max(0, f.a - 24);
    bis = Math.min(s.length, f.e + 36);
  }
  return (von > 0 ? '… ' : '') + esc(s.slice(von, f.a)) + '<mark>' + esc(s.slice(f.a, f.e)) + '</mark>' + esc(s.slice(f.e, bis)) + (bis < s.length ? ' …' : '');
}

/* Alle Treffer: { gruppe, titel (HTML), unter (HTML), aufruf, rang: [Zahlen/Text] } */
function suTreffer(q) {
  var aus = [];
  if (suNorm(q).length < 2) { return aus; }
  var heute = isoDatum();
  var wort = function (t) { var f = suFinde(t, q); return f ? (f.wort ? 0 : 1) : 2; };

  /* Termine: jeder nur einmal — mehrtägige stehen an mehreren Tagen und
     zählen am ersten kommenden Tag, sonst am letzten */
  var termine = {};
  Object.keys(termineNachTag).sort().forEach(function (tag) {
    (termineNachTag[tag] || []).forEach(function (t) {
      if (!suFinde([t.titel, t.ort || '', t.beschreibung || ''].join(' '), q)) { return; }
      if (!termine[t.id]) { termine[t.id] = { t: t, tage: [] }; }
      termine[t.id].tage.push(tag);
    });
  });
  Object.keys(termine).forEach(function (id) {
    var t = termine[id].t;
    var tage = termine[id].tage;
    var tag = tage.filter(function (x) { return x >= heute; })[0] || tage[tage.length - 1];
    var text = [t.titel, t.ort || '', t.beschreibung || ''].join(' ');
    var vorbei = (tag < heute) || (tag === heute && !t.ganztags && (t.bis || t.zeit) <= clUhrzeit());
    aus.push({ gruppe: 'termine',
      titel: suMarkiert(t.titel, q, false),
      unter: esc(clWt(tag) + ' ' + clKurzDatum(tag) + ' · ' + (t.ganztags ? 'ganztägig' : clZeitText(t.zeit)) + (vorbei ? ' · vorbei' : ''))
             + (suFinde(t.titel, q) ? '' : ' · ' + suMarkiert(text, q, true)),
      aufruf: 'suTermin(\'' + esc(tag) + '\',\'' + esc(t.id) + '\')',
      rang: [vorbei ? 1 : 0, (vorbei ? -1 : 1) * Number(tag.replace(/-/g, '')), (vorbei ? '' : (t.ganztags ? '' : t.zeit)), wort(t.titel)] });
  });

  /* Jahrestermine: nach dem nächsten Vorkommen */
  (DB.jahrestermine || []).forEach(function (e) {
    if (!e || !e.von || !suFinde(e.titel, q)) { return; }
    var naechst = e.von;
    if (e.jaehrlich) {
      naechst = heute.slice(0, 4) + e.von.slice(4);
      if ((heute.slice(0, 4) + (e.bis || e.von).slice(4)) < heute) { naechst = (Number(heute.slice(0, 4)) + 1) + e.von.slice(4); }
    }
    aus.push({ gruppe: 'jahr', titel: suMarkiert(e.titel, q, false),
      unter: esc(clKurzDatum(naechst) + naechst.slice(0, 4) + (e.jaehrlich ? ' · jährlich' : '')),
      aufruf: 'suTag(\'' + esc(naechst) + '\')', rang: [naechst < heute ? 1 : 0, Number(naechst.replace(/-/g, '')), wort(e.titel)] });
  });

  /* Aufgaben aus Projekten, Zielen und Listen */
  kpSeitenAlle().forEach(function (sei) {
    if (sei.art !== 'vorhaben' && sei.art !== 'liste') { return; }
    String(sei.text || '').split('\n').forEach(function (z, nr) {
      var a = kpAufgabe(z);
      if (!a || !a.text || !suFinde(a.text, q)) { return; }
      if (a.erledigt && !cl.su.erl) { return; }
      var g = a.erledigt ? null : aufGeplant(sei, a.text);
      var pr = kpPrio(a.text);
      aus.push({ gruppe: 'aufgaben', titel: (a.erledigt ? '✓ ' : '') + (pr.p ? '<span class="prio p' + pr.p + '">' + pr.p + '</span>' : '') + suMarkiert(pr.text, q, false),
        unter: esc(clSeitenZeichen(sei) + ' ' + sei.titel + (g ? ' · ' + clPlanText(g.datum, g.zeit) : '')),
        aufruf: 'suAufgabe(\'' + esc(sei.id) + '\',' + nr + ')',
        rang: [a.erledigt ? 1 : 0, g ? 0 : 1, g ? g.datum + (g.zeit || '') : '', wort(a.text), suNorm(a.text)] });
    });
  });

  /* Memos: Titel vor Text, dann zuletzt geändert */
  kpSeitenAlle().forEach(function (sei) {
    if (sei.art === 'liste' || (sei.art === 'notiz' && sei.__satz && sei.__satz.checkliste)) { return; }
    var imTitel = !!suFinde(sei.titel, q);
    if (!imTitel && !suFinde(sei.text, q)) { return; }
    aus.push({ gruppe: 'memo', titel: clSeitenZeichen(sei) + ' ' + suMarkiert(sei.titel, q, false),
      unter: imTitel ? esc(String(sei.text || '').replace(/\s+/g, ' ').slice(0, 50)) : suMarkiert(sei.text, q, true),
      aufruf: 'suMemo(\'' + esc(sei.id) + '\')', rang: [imTitel ? 0 : 1, -(Number(sei.geaendert) || 0)] });
  });

  /* Checklisten: laufend, Vorlagen, erledigt */
  (DB.gedanken || []).forEach(function (g) {
    if (!g || !g.checkliste) { return; }
    if (g.checkliste === 'fertig' && !cl.su.erl) { return; }
    var imTitel = !!suFinde(g.titel, q);
    if (!imTitel && !suFinde(g.text, q)) { return; }
    var art = { lauf: 'laufend', vorlage: 'Vorlage', fertig: 'erledigt' }[g.checkliste] || '';
    aus.push({ gruppe: 'checklisten', titel: suMarkiert(g.titel, q, false),
      unter: esc(art) + (imTitel ? '' : ' · ' + suMarkiert(g.text, q, true)),
      aufruf: 'suCheckliste(\'' + esc(g.id) + '\')', rang: [{ lauf: 0, vorlage: 1, fertig: 2 }[g.checkliste], wort(g.titel)] });
  });

  /* Sammlungen: erst die Sammlung selbst, dann ihre Einträge */
  (DB.sammlungen || []).forEach(function (sa) {
    if (!sa || sa.vorlage) { return; }
    if (suFinde(sa.name, q)) {
      aus.push({ gruppe: 'sammlungen', titel: esc(SA_ZEICHEN[sa.art] || '≡') + ' ' + suMarkiert(sa.name, q, false),
        unter: esc('Sammlung · ' + saSaetze(sa).length + (saSaetze(sa).length === 1 ? ' Eintrag' : ' Einträge')), aufruf: 'suSammlung(\'' + esc(sa.id) + '\',\'\')', rang: [0, 0] });
    }
    saSaetze(sa).forEach(function (d) {
      var treffer = null;
      (sa.felder || []).forEach(function (f) {
        if (treffer || f.typ === 'formel') { return; }
        var w = (d.werte || {})[f.id];
        if (w === null || w === undefined || w === '' || typeof w === 'boolean') { return; }
        if (suFinde(f.typ === 'link' ? String(w) : saWertText(f, w), q)) { treffer = f; }
      });
      if (!treffer) { return; }
      var sp = saSpalten(sa).filter(function (f) { return f.id !== '_mon'; }).slice(0, 2);
      var titel = sp.map(function (f) { return saZelle(sa, f, d); }).filter(function (t) { return t; }).join(' · ');
      aus.push({ gruppe: 'sammlungen', titel: suMarkiert(titel || saWertText(treffer, d.werte[treffer.id]), q, false),
        unter: esc(sa.name + ' · ' + treffer.name) + (suFinde(titel, q) ? '' : ': ' + suMarkiert(saWertText(treffer, d.werte[treffer.id]), q, true)),
        aufruf: 'suSammlung(\'' + esc(sa.id) + '\',\'' + esc(d.id) + '\')', rang: [1, -(Number(d.angelegt || d.geaendert) || 0)] });
    });
  });

  /* Routinen: alphabetisch */
  (DB.aufgaben || []).forEach(function (a) {
    if (!a || !a.wiederholung || !suFinde(a.titel, q)) { return; }
    aus.push({ gruppe: 'routinen', titel: suMarkiert(a.titel, q, false), unter: esc(a.pausiert ? 'Routine · pausiert' : 'Routine'),
      aufruf: 'suRoutine(\'' + esc(a.id) + '\')', rang: [a.pausiert ? 1 : 0, wort(a.titel), suNorm(a.titel)] });
  });

  var vgl = function (x, y) {
    var i;
    for (i = 0; i < Math.max(x.rang.length, y.rang.length); i++) {
      var a = x.rang[i], b = y.rang[i];
      if (a === b) { continue; }
      if (typeof a === 'number' && typeof b === 'number') { return a - b; }
      return String(a).localeCompare(String(b), 'de');
    }
    return 0;
  };
  return aus.sort(vgl);
}

function suErgebnisHtml() {
  var q = cl.su.text;
  if (suNorm(q).length < 2) {
    var h = '';
    if (cl.su.zuletzt.length) {
      h += '<div class="leise">Zuletzt gesucht</div><div class="su-chips">' + cl.su.zuletzt.map(function (w, i) {
        return '<button type="button" class="su-chip" onclick="suZuletzt(' + i + ')">' + esc(w) + '</button>';
      }).join('') + '</div>';
    }
    return h + '<p class="leise">Durchsucht Termine, Jahrestermine, Aufgaben, Memos, Checklisten, Sammlungen und Routinen — ab 2 Buchstaben. Groß/klein und ä/ae sind egal.</p>';
  }
  var alle = suTreffer(q);
  if (!alle.length) { return '<p class="leise">Nichts gefunden' + (cl.su.erl ? '' : ' — vielleicht bei „auch Erledigtes“') + '.</p>'; }
  var h2 = '';
  SU_GRUPPEN.forEach(function (g) {
    var l = alle.filter(function (x) { return x.gruppe === g[0]; });
    if (!l.length) { return; }
    var zeigen = cl.su.auf[g[0]] ? l : l.slice(0, SU_JE_GRUPPE);
    h2 += '<div class="su-gruppe"><span>' + g[1] + '</span><span>' + l.length + '</span></div>'
       + zeigen.map(function (x) {
           return '<button type="button" class="su-treffer" onclick="suMerken(cl.su.text);' + x.aufruf + '">' + x.titel + '<small>' + x.unter + '</small></button>';
         }).join('');
    if (l.length > zeigen.length) {
      h2 += '<button type="button" class="su-mehr" onclick="suGruppeAuf(\'' + g[0] + '\')">+' + (l.length - zeigen.length) + ' weitere</button>';
    }
  });
  return h2;
}

function suchenHtml() {
  return '<div class="su-feld">⌕<input id="suchFeld" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search"'
    + ' placeholder="Suchen …" value="' + esc(cl.su.text) + '" oninput="suGetippt()" onkeydown="suTaste(event)"></div>'

/* ---------- Statistik (seit 0.7.1) ----------
   Statt Zahlen an den Symbolen: je App ihre Datensätze, nach dem
   Filter ▼ (Alle, Beruf, Privat). Antippen eines Blocks öffnet die App. */

function clStatAufgaben() {
  var st = { offen: 0, geplant: 0 };
  aufSeiten().forEach(function (s) {
    String(s.text || '').split('\n').forEach(function (z) {
      var a = kpAufgabe(z);
      if (!a || !a.text || a.erledigt) { return; }
      st.offen++;
      if (aufGeplant(s, a.text)) { st.geplant++; }
    });
  });
  return st;
}

function clStatTermine(von, tage) {
  var n = 0;
  var i;
  for (i = 0; i < tage; i++) {
    var t = clTermineAm(tagePlus(von, i));
    n += t.zeit.length + t.ganztags.length;
  }
  return n;
}

function clStatBlock(id, name, zeilen) {
  return '<button type="button" class="st-kopf" onclick="oeffne(\'' + id + '\')">' + clSymbol(id) + esc(name) + '</button>'
    + '<div class="st">' + zeilen.map(function (z) { return reihe(z[0], z[1]); }).join('') + '</div>';
}

function statistikHtml() {
  var heute = isoDatum();
  var au = clStatAufgaben();
  var vorhaben = clSeitenAktiv('vorhaben', '');
  var rt = rtAlle();
  var rtPause = rt.filter(function (a) { return a.pausiert; }).length;
  var rtOffen = clRoutinenAm(heute).filter(function (a) { return !a.pausiert && !istErledigtAn(a, heute); }).length;
  var sammlungen = saAlle(false);
  var eintraege = sammlungen.reduce(function (n, s) { return n + saSaetze(s).length; }, 0);
  var kb = Math.max(1, Math.round(alsText().length / 1024));
  var h = clStatBlock('kalender', 'Kalender', [
      ['Termine heute · diese Woche', clStatTermine(heute, 1) + ' · ' + clStatTermine(montagVon(heute), 7)],
      ['Termine geholt', String(termineZahl())]])
    + clStatBlock('aufgaben', 'Aufgaben', [
      ['offen · davon eingeplant', au.offen + ' · ' + au.geplant],
      ['Listen · Projekte · Ziele', clSeitenAktiv('liste', '').length + ' · '
        + vorhaben.filter(function (s) { return s.typ !== 'ziel'; }).length + ' · '
        + vorhaben.filter(function (s) { return s.typ === 'ziel'; }).length]])
    + clStatBlock('memo', 'Memo', [['Seiten', String(memoSeiten().length)]])
    + clStatBlock('checklisten', 'Checklisten', [
      ['Vorlagen · laufend · erledigt', clsAlle('vorlage').length + ' · ' + clsAlle('lauf').length + ' · ' + clsAlle('fertig').length]])
    + clStatBlock('sammlungen', 'Sammlungen', [
      ['Sammlungen · Einträge', sammlungen.length + ' · ' + eintraege],
      ['eigene Vorlagen · Hinweise', saAlle(true).length + ' · ' + saHinweise().length]])

      ['aktiv · pausiert · heute offen', (rt.length - rtPause) + ' · ' + rtPause + ' · ' + rtOffen]])
    + clStatBlock('drive', 'Drive', [['Favoriten', String(drvFavoriten().length)]])
    + clStatBlock('schach', 'Schach', [['gegen CLIE: gewonnen · verloren · remis', schBilanzLesen().g + ' · ' + schBilanzLesen().v + ' · ' + schBilanzLesen().r]])

/* ---------- Zeichnen ---------- */

function clApp(id) {
  var i;
  for (i = 0; i < CL_APPS.length; i++) { if (CL_APPS[i].id === id) { return CL_APPS[i]; } }
  return null;
}

function uebersichtHtml() {
  var h = '<div class="apps">';
  CL_APPS.forEach(function (a) {
    h += '<button type="button" class="app" onclick="oeffne(\'' + a.id + '\')">'
       + '<span class="sym">' + clSymbol(a.id) + (a.id === 'heute' ? clHeuteZahlHtml() : '') + '</span>'
       + esc(a.name) + '</button>';
  });
  /* Seit 0.7.1 keine Zahlen an den Symbolen — außer an „Heute“ (seit 0.9) */
  return h + '</div><button type="button" class="fassung" onclick="oeffne(\'statistik\')">CLIE v' + esc(APP_VERSION) + ' · <u>Statistik</u></button>';
}

function spaeterHtml(a) {
  return '<div class="spaeter-text"><div class="gross">' + clSymbol(a.id) + '</div>'
    + '<p><b>' + esc(a.name) + '</b> kommt mit CLIE ' + esc(a.stufe) + '.</p>'
    + '<p>' + esc(a.was) + '</p>'
    + '<div class="knoepfe"><button type="button" class="knopf" onclick="oeffne(\'uebersicht\')">Zurück</button></div></div>';
}

function reihe(name, wert, warn) {
  return '<div class="reihe"><span>' + esc(name) + '</span><span' + (warn ? ' class="warn"' : '') + '>' + esc(wert) + '</span></div>';
}

/* Die Abgleich-App: ein großer Knopf wie HotSync, darunter der Stand. */
function abgleichHtml() {

     + (clKonto() ? reihe('Konto', clKonto()) : '')
     + reihe('Anmeldung', an ? 'noch ' + restMinuten() + ' Min.' : (warAngemeldet() ? 'abgelaufen' : 'nicht angemeldet'), !an)
     + reihe('Datei', DRIVE_DATEI)
     + reihe('Letzter Abgleich', letzterAbgleich ? letzterAbgleich.slice(0, 16) : '—')

  h += '<div class="abschnitt">Fassung</div>'
     + reihe('Läuft', 'CLIE ' + APP_VERSION)
     + (neueVersion ? reihe('Neu', neueVersion + ' liegt bereit') : '');

     + '<p class="leise">CLIE arbeitet auf ' + esc(DATEINAME) + ' — derselben Datei wie die Workbench. Abgeglichen wird von selbst, '
     + 'bei jeder Änderung, beim Zurückkehren und alle 30 Sekunden. Die Termine kommen alle 2 Minuten neu.</p>';
  return h;
}

function inhaltZeichnen() {
  var el = document.getElementById('inhalt');
  if (!el) { return; }
  var a = clApp(cl.app);
  if (cl.app === 'abgleich') { el.innerHTML = abgleichHtml(); }
  else if (cl.app === 'rechner') { el.innerHTML = rechnerHtml(); }
  else if (cl.app === 'stones') { el.innerHTML = stonesHtml(); }
  else if (cl.app === 'schach') { el.innerHTML = schachHtml(); }
  else if (cl.app === 'lernkartei') { el.innerHTML = lernkarteiHtml(); }
  else if (cl.app === 'drive') {
    /* Beim Suchen bleibt das Feld stehen — nur die Liste kommt neu */
    if (cl.drv.tab === 'suche' && el.innerHTML.indexOf('drvFeld') >= 0) { drvZeichnen(); return; }
    el.innerHTML = driveHtml();
  }
  else if (cl.app === 'kalender') { el.innerHTML = kalenderHtml(); }
  else if (cl.app === 'aufgaben') { el.innerHTML = aufgabenHtml(); }
  else if (cl.app === 'memo') {
    /* Beim Schreiben nicht neu zeichnen — sonst ginge Getipptes verloren. */
    if (cl.memo.schreiben && el.innerHTML.indexOf('memoFeld') >= 0) { return; }
    el.innerHTML = memoHtml();
  }
  else if (cl.app === 'routinen') { el.innerHTML = routinenHtml(); }
  else if (cl.app === 'sammlungen') { el.innerHTML = sammlungenHtml(); }
  else if (cl.app === 'statistik') { el.innerHTML = statistikHtml(); }
  else if (cl.app === 'heute') { el.innerHTML = heuteHtml(); }
  else if (cl.app === 'suchen') {
    /* Beim Neuzeichnen (Abgleich, Uhr) bleibt das Feld stehen — nur die Treffer kommen neu */
    if (el.innerHTML.indexOf('suchFeld') >= 0) { suErgebnisZeichnen(); return; }
    el.innerHTML = suchenHtml();
  }
  else if (cl.app === 'checklisten') {
    if (cl.cls.schreiben && el.innerHTML.indexOf('memoFeld') >= 0) { return; }
    el.innerHTML = checklistenHtml();
  }
  else if (a && a.stufe) { el.innerHTML = spaeterHtml(a); }
  else { el.innerHTML = uebersichtHtml(); }
}

  if (reiter) {
