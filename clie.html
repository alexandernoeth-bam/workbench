/* ---------- Kalender (seit 0.2) ----------

   Wie das Datebook des Palm: Tag mit Uhrzeiten, Woche, Monat.
   Termine kommen aus dem Google-Kalender und werden dort auch angelegt,
   geändert und gelöscht. Dazu aus der workbench.json: der Tag
   („Vorgenommen“, mit Uhrzeit eingeplante Aufgaben), die Routinen und
   die beiden Abschnitte der Woche. */

var KAL_ZULETZT_KEY = 'clie-kalender-zuletzt';
var KAL_WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
var KAL_MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
var schreibKalender = [];       /* Kalender, in die geschrieben werden darf: {id, name} */
var wischStart = null;

function clKalDatum() {
  return (cl.kal && cl.kal.datum) || isoDatum();
}

function clWt(is) { return KAL_WT[ausIso(is).getDay()]; }

function clKurzDatum(is) { return String(is).slice(8, 10) + '.' + String(is).slice(5, 7) + '.'; }

function clMinuten(z) {
  var m = String(z || '').match(/^(\d{1,2}):(\d{2})$/);
  return m ? Number(m[1]) * 60 + Number(m[2]) : -1;
}

function clZeitText(z) { return String(z || '').replace(/^0(\d)/, '$1'); }

/* Der Kopf des Kalenders: Tag, KW oder Monat */
function clKalReiter() {
  var d = clKalDatum();
  if (cl.kal.ansicht === 'jahr') { return 'Jahr'; }
  if (cl.kal.ansicht === 'bloecke' && cl.kal.tage === 3) { return clWt(d) + '–' + clWt(tagePlus(d, 2)); }
  if (cl.kal.ansicht === 'woche' || cl.kal.ansicht === 'bloecke') { return 'KW ' + kalenderwoche(d); }
  if (cl.kal.ansicht === 'monat') { return KAL_MONATE[Number(d.slice(5, 7)) - 1] + ' ' + d.slice(0, 4); }
  return clWt(d) + ' ' + clKurzDatum(d);
}

/* ---- Was an einem Tag steht ---- */

/* Ganztägiges eines Tages: Feiertag, Google-Termine, eigene Jahrestermine
   der Workbench, Ferien (seit 0.8.2). Doppelte fallen weg — welche Fassung
   bleibt, sagt die Einstellung der Workbench (doppelBehalten). */
function clTermineAm(is) {
  var t = termineFuerTag(is);
  var google = t.ganztags.filter(clPasstTermin);
  var jahr = clJahrAm(is);
  var art = function (a) { return jahr.filter(function (x) { return x.jahr === a; }); };
  var feiertag = art('feiertag');
  var eigene = art('jahrestermin');
  google = google.filter(function (g) { return !feiertag.some(function (f) { return jtDoppelt(g, f); }); });
  if (jtDoppelWahl() === 'kalender') {
    eigene = eigene.filter(function (e) { return !google.some(function (g) { return jtDoppelt(e, g); }); });
  } else {
    google = google.filter(function (g) { return !eigene.some(function (e) { return jtDoppelt(g, e); }); });
  }
  return { zeit: t.zeit.filter(clPasstTermin), ganztags: feiertag.concat(google, eigene, art('ferien')) };
}

/* Was die Workbench im Jahreskalender selbst kennt: Feiertage (berechnet
   oder eingelesen), eigene Jahrestermine (auch jährlich und mehrtägig)
   und Ferien. Die Kennung beginnt mit fei-, jt- oder fer-. */
function clJahrAm(is) {
  var aus = [];
  var fei = feiertagAn(is);
  if (fei) { aus.push({ id: 'fei-' + is, titel: fei, ganztags: true, jahr: 'feiertag', zeichen: '★' }); }
  (DB.jahrestermine || []).forEach(function (e) {
    if (!e || !e.von) { return; }
    var von = e.von;
    var bis = e.bis || e.von;
    if (e.jaehrlich) {
      von = is.slice(0, 4) + von.slice(4);
      bis = is.slice(0, 4) + (e.bis || e.von).slice(4);
    }
    if (is < von || is > bis) { return; }
    var k = jtKontext(e);
    if (cl.filter !== 'alle' && k !== cl.filter) { return; }
    aus.push({ id: 'jt-' + e.id, titel: String(e.titel || ''), ganztags: true, jahr: 'jahrestermin', zeichen: '◆',
               kontext: k, von: von, bis: bis });
  });
  var fer = ferienAn(is);
  if (fer) { aus.push({ id: 'fer-' + is, titel: fer, ganztags: true, jahr: 'ferien', zeichen: '·' }); }
  return aus;
}

/* Antippen: Google-Termine öffnen ihr Fenster, Workbench-Einträge
   zeigen nur, was sie sind — ändern geht in der Workbench. */
function clGanzAufruf(is, x) {
  return x.jahr ? 'clJahrZeigen(\'' + esc(is) + '\',\'' + esc(x.id) + '\')' : 'terminZeigen(\'' + esc(is) + '\',\'' + esc(x.id) + '\')';
}

function clJahrZeigen(is, id) {
  var x = clJahrAm(is).filter(function (y) { return y.id === id; })[0];
  if (!x) { return; }
  var was = { feiertag: 'Feiertag', jahrestermin: 'Jahrestermin aus der Workbench', ferien: 'Ferien' }[x.jahr];
  var zeit = (x.von && x.bis && x.von !== x.bis) ? '\n' + clKurzDatum(x.von) + ' – ' + clKurzDatum(x.bis) : '';
  melde(x.zeichen + ' ' + x.titel + zeit + '\n' + was, null);
}

/* Routinen eines Tages: fällig oder an diesem Tag erledigt. */
function clRoutinenAm(is) {
  return (DB.aufgaben || []).filter(function (a) {
    if (!a || !a.wiederholung) { return false; }
    if (cl.filter !== 'alle' && a.kontext && a.kontext !== cl.filter) { return false; }
    return aufgabeFaelligAn(a, is) || istErledigtAn(a, is);
  });
}

/* Die Zeilen des Tages aus der workbench.json — mit Uhrzeit, wenn der
   Eintrag eine hat (in CLIE eingeplant, seit 0.3). */
function clTagZeilen(is) {
  var b = kpTagFinden(is);
  if (!b) { return []; }
  return String(b.text || '').split('\n').map(function (z, nr) {
    var a = kpAufgabe(z);
    var e = (a && a.text) ? kpWocheEintrag(b, a.text) : null;
    var quelle = e ? kpSeiteFinden(e.quelle) : null;
    if (quelle && !kpPasstFilter(quelle, cl.filter)) { return null; }
    return { nr: nr, roh: z, a: a, zeit: (e && /^\d{1,2}:\d{2}$/.test(String(e.zeit || ''))) ? e.zeit : '',
             quelle: quelle ? quelle.titel : '',
             cls: (quelle && quelle.__satz && quelle.__satz.checkliste) ? quelle.titel : '' };
  }).filter(function (x) { return x && x.roh.trim(); });
}

function clVorbei(is, ende) {
  var heute = isoDatum();
  if (is < heute) { return true; }
  if (is > heute) { return false; }
  return !!ende && ende <= clUhrzeit();
}

/* Seit 0.16: eingeplante Checklisten-Punkte zeigen, woher sie kommen */
function clHerkunftHtml(zeichen, name) {
  return name ? '<small class="herkunft">' + esc(zeichen) + ' ' + esc(name) + '</small>' : '';
}

function clKastenHtml(an, aufruf) {
  return '<button type="button" class="k' + (an ? ' an' : '') + '" onclick="' + aufruf + '" aria-label="abhaken"></button>';
}

/* ---- Tag ---- */

function kalTagHtml(is) {
  var t = clTermineAm(is);
  var zeilen = clTagZeilen(is);
  var routinen = clRoutinenAm(is);
  var posten = [];   /* alles mit Uhrzeit: {zeit, bis, html} */
  var h = clWochenleisteHtml(is);

  t.ganztags.forEach(function (x) {
    h += '<button type="button" class="ganztags' + (x.jahr ? ' gz-' + x.jahr : '') + '" onclick="' + clGanzAufruf(is, x) + '">' + (x.zeichen || '◆') + ' ' + esc(x.titel) + '</button>';
  });
  t.zeit.forEach(function (x) {
    posten.push({ zeit: x.zeit, bis: x.bis || x.zeit, termin: true, vorbei: clVorbei(is, x.bis || x.zeit), html: '<button type="button" class="tx" onclick="terminZeigen(\'' + esc(is) + '\',\'' + esc(x.id) + '\')">'
      + esc(x.titel) + '</button>' });
  });
  zeilen.forEach(function (z) {
    if (!z.a || !z.zeit) { return; }
    if (z.a.erledigt && !cl.kal.erlZeigen) { return; }
    posten.push({ zeit: z.zeit, bis: z.zeit, erl: z.a.erledigt, vorbei: clVorbei(is, z.zeit),
      html: clKastenHtml(z.a.erledigt, 'clTagZeileUm(\'' + is + '\',' + z.nr + ')') + '<span class="tx">' + clPrioHtml(z.a.text) + clHerkunftHtml('☑', z.cls) + '</span>' });
  });
  routinen.forEach(function (a) {
    var zt = aufgabeZeitAn(a, is);
    var erl = istErledigtAn(a, is);
    if (!zt || (erl && !cl.kal.erlZeigen)) { return; }
    posten.push({ zeit: zt, bis: zt, erl: erl, vorbei: clVorbei(is, zt),
      html: clKastenHtml(erl, 'clRoutineUm(\'' + esc(a.id) + '\',\'' + is + '\')') + '<span class="tx">' + esc(a.titel) + '</span>' });
  });
  posten.sort(function (x, y) { return clMinuten(x.zeit) - clMinuten(y.zeit); });

  /* Seit 0.6 nur noch Belegtes: Termine, Aufgaben und Routinen mit
     Uhrzeit. Leere Stunden entfallen — Neues geht über den Knopf „Neu“. */
  /* Seit 0.6.2 wie im Datebook: ein Termin hat eine Zeile für den Beginn
     und eine für das Ende, die Klammer verbindet beide. Vergangene Termine
     stehen einzeilig ohne Klammer. Kein Strich mehr für „jetzt“. */
  var reihen = clTagReihen(posten);
  var klammern = clKlammern(reihen);
  if (!reihen.length && !t.ganztags.length) { h += '<p class="leise">Keine Termine.</p>'; }
  reihen.forEach(function (r, nr) {
    var kl = '<span class="kl">' + klammern[nr].map(function (x) { return '<i class="' + x + '"></i>'; }).join('') + '</span>';
    if (r.ende) {
      h += '<div class="std ende">' + kl + '<span class="z">' + esc(clZeitText(r.zeit)) + '</span><span class="t"></span></div>';
      return;
    }
    h += '<div class="std' + (r.p.vorbei || r.p.erl ? ' vorbei' : '') + '">' + kl + '<span class="z">' + esc(clZeitText(r.zeit)) + '</span>'
       + '<span class="t">' + r.p.html + '</span></div>';
  });

  /* Vorgenommen: was ohne Uhrzeit für den Tag geplant ist */
  var ohne = zeilen.filter(function (z) { return !z.zeit; });
  var erlWeg = 0;
  var v = '';
  ohne.forEach(function (z) {
    if (z.a) {
      if (z.a.erledigt && !cl.kal.erlZeigen) { erlWeg++; return; }
      v += '<div class="aufg' + (z.a.erledigt ? ' erl' : '') + '">' + clKastenHtml(z.a.erledigt, 'clTagZeileUm(\'' + is + '\',' + z.nr + ')')
         + '<span class="tx">' + clPrioHtml(z.a.text) + clHerkunftHtml('☑', z.cls) + '</span></div>';
    } else if (/^\s*#/.test(z.roh)) {
      v += '<div class="unterabschnitt">' + esc(z.roh.replace(/^\s*#+\s*/, '')) + '</div>';
    } else {
      v += '<div class="notiz">' + esc(z.roh) + '</div>';
    }
  });
  h += '<div class="abschnitt">Vorgenommen</div>' + (v || (erlWeg ? '' : '<div class="leise">Nichts vorgenommen.</div>'));

  /* Routinen ohne Uhrzeit */
  var r = '';
  routinen.forEach(function (a) {
    if (aufgabeZeitAn(a, is)) { return; }
    var erl = istErledigtAn(a, is);
    if (erl && !cl.kal.erlZeigen) { erlWeg++; return; }
    r += '<div class="aufg' + (erl ? ' erl' : '') + '">' + clKastenHtml(erl, 'clRoutineUm(\'' + esc(a.id) + '\',\'' + is + '\')')
       + '<span class="tx">' + esc(a.titel) + '</span></div>';
  });
  h += '<div class="abschnitt">Routinen</div>' + (r || '<div class="leise">Keine offenen Routinen.</div>');
  posten.forEach(function (p) { if (p.erl) { erlWeg++; } });
  if (erlWeg || cl.kal.erlZeigen) {
    h += '<button type="button" class="erl-knopf" onclick="clErlUm()">' + (cl.kal.erlZeigen ? 'Erledigtes verbergen' : erlWeg + ' erledigt · zeigen') + '</button>';
  }
  return h;
}

/* Klammer bekommt ein Termin, der noch nicht vorbei ist und eine Dauer hat
   (seit 0.6.2 auch kurze). Aufgaben und Routinen haben keine Dauer. */
function clMitKlammer(p) {
  return !!p && !!p.termin && !p.vorbei && clMinuten(p.bis) > clMinuten(p.zeit);
}

/* Die Zeilen des Tages: je Posten eine Zeile für den Beginn, dazu je
   Termin mit Klammer eine Endzeile — außer dort beginnt ohnehin etwas
   oder ein anderer Termin endet zur selben Zeit (dann eine gemeinsame). */
function clTagReihen(posten) {
  var reihen = posten.map(function (p) { return { beginn: clMinuten(p.zeit), zeit: p.zeit, p: p, ende: false }; });
  var anfaenge = reihen.map(function (r) { return r.beginn; });
  posten.forEach(function (p) {
    if (!clMitKlammer(p)) { return; }
    var e = clMinuten(p.bis);
    if (anfaenge.indexOf(e) >= 0) { return; }
    if (reihen.some(function (r) { return r.ende && r.beginn === e; })) { return; }
    reihen.push({ beginn: e, zeit: p.bis, p: null, ende: true });
  });
  reihen.sort(function (x, y) { return x.beginn - y.beginn; });
  return reihen;
}

/* Zeitklammern wie im Datebook: von der Zeile des Beginns bis zur Zeile
   des Endes (Endzeile oder der nächste Posten, der genau dann beginnt).
   Überschneiden sich zwei, steht die zweite daneben (höchstens zwei).
   Ergebnis: je Zeile zwei Felder, '' | 'oben' | 'mitte' | 'unten' | 'einzel'. */
function clKlammern(reihen) {
  var feld = reihen.map(function () { return ['', '']; });
  var belegt = [[], []];   /* je Spalte: Zeilennummern */
  reihen.forEach(function (start, s) {
    if (start.ende || !clMitKlammer(start.p)) { return; }
    var e = clMinuten(start.p.bis);
    var nr = [s];
    var fertig = false;
    reihen.forEach(function (r, i) {
      if (i <= s || fertig) { return; }
      if (r.beginn < e) { nr.push(i); } else if (r.beginn === e) { nr.push(i); fertig = true; }
    });
    var sp = belegt[0].some(function (i) { return nr.indexOf(i) >= 0; }) ? 1 : 0;
    if (sp === 1 && belegt[1].some(function (i) { return nr.indexOf(i) >= 0; })) { return; }
    nr.forEach(function (i, k) {
      belegt[sp].push(i);
      feld[i][sp] = (nr.length === 1) ? 'einzel' : (k === 0 ? 'oben' : (k === nr.length - 1 ? 'unten' : 'mitte'));
    });
  });
  return feld;
}

/* Die Leiste mit den Wochentagen, wie oben im Datebook */
function clWochenleisteHtml(is) {
  var montag = montagVon(is);
  var h = '<div class="wochenleiste"><button type="button" onclick="clBlaettern(-1)" aria-label="zurück">◀</button>';
  var i;
  for (i = 0; i < 7; i++) {
    var d = tagePlus(montag, i);
    h += '<button type="button" class="wt' + (d === is ? ' an' : '') + (d === isoDatum() ? ' heute' : '') + '" onclick="clKalGehe(\'' + d + '\',\'tag\')">'
       + clWt(d).charAt(0) + '</button>';
  }
  return h + '<button type="button" onclick="clBlaettern(1)" aria-label="vor">▶</button></div>';
}

/* ---- Woche ---- */

function kalWocheHtml(is) {
  var montag = montagVon(is);
  var h = '<div class="wochenkopf">' + clKurzDatum(montag) + ' – ' + clKurzDatum(tagePlus(montag, 6)) + '</div>';
  var i;
  for (i = 0; i < 7; i++) {
    var d = tagePlus(montag, i);
    var t = clTermineAm(d);
    var e = t.ganztags.map(function (x) { return '<div>' + (x.zeichen || '◆') + ' ' + esc(x.titel) + '</div>'; })
      .concat(t.zeit.map(function (x) { return '<div>' + esc(clZeitText(x.zeit)) + ' ' + esc(x.titel) + '</div>'; }));
    h += '<button type="button" class="wtag' + (d === isoDatum() ? ' heute' : '') + '" onclick="clKalGehe(\'' + d + '\',\'tag\')">'
       + '<b>' + clWt(d) + ' ' + Number(d.slice(8, 10)) + '</b><span class="e">' + (e.join('') || '<div class="leise">—</div>') + '</span></button>';
  }
  /* Die beiden Abschnitte der Woche aus der Workbench */
  var w = kpWocheFinden(montag);
  var text = w ? ((typeof w.text === 'string') ? w.text : kpWocheTextAus(w)) : kpWocheGeruest();
  var bedienbar = !!(w && typeof w.text === 'string');
  String(text).split('\n').forEach(function (z, nr) {
    if (!z.trim()) { return; }
    var a = kpAufgabe(z);
    if (/^\s*##?\s/.test(z)) { h += '<div class="abschnitt">' + esc(z.replace(/^\s*#+\s*/, '')) + '</div>'; return; }
    if (!a) { h += '<div class="notiz">' + esc(z) + '</div>'; return; }
    h += '<div class="aufg' + (a.erledigt ? ' erl' : '') + '">'
       + (bedienbar ? clKastenHtml(a.erledigt, 'clWocheZeileUm(\'' + montag + '\',' + nr + ')') : '<span class="k' + (a.erledigt ? ' an' : '') + '"></span>')
       + '<span class="tx">' + clPrioHtml(a.text) + '</span></div>';
  });
  return h;
}

/* ---- Monat ---- */

function kalMonatHtml(is) {
  var erster = is.slice(0, 8) + '01';
  var start = montagVon(erster);
  var monat = is.slice(0, 7);
  var h = '<div class="monat">' + ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(function (t) { return '<div class="mk">' + t + '</div>'; }).join('');
  var i;
  for (i = 0; i < 42; i++) {
    var d = tagePlus(start, i);
    if (i === 35 && d.slice(0, 7) !== monat) { break; }
    var t = clTermineAm(d);
    var balken = '';
    var j;
    for (j = 0; j < Math.min(3, t.zeit.length); j++) { balken += '<i></i>'; }
    h += '<button type="button" class="mt' + (d.slice(0, 7) !== monat ? ' aus' : '') + (d === isoDatum() ? ' heute' : '') + (d === is ? ' an' : '')
       + '" onclick="clKalGehe(\'' + d + '\',\'tag\')"><span>' + Number(d.slice(8, 10)) + (t.ganztags.length ? ' ◆' : '') + '</span>' + balken + '</button>';
  }
  return h + '</div>';
}

/* ---- Woche als Blöcke (seit 0.2.2) ----
   Spalten je Tag, oben früh, unten spät; jeder Termin ein Block in
   seiner Länge — ohne Titel, die wären zu klein zum Lesen. */

var BLOCK_VON = 7;
var BLOCK_BIS = 20;
var BLOCK_HOEHE = 560;
var KAL_TAGE_KEY = 'clie-woche-tage';

function clWocheTageLaden() {
  var t = null;
  try { t = window.localStorage.getItem(KAL_TAGE_KEY); } catch (e) { t = null; }
  cl.kal.tage = (t === '3') ? 3 : ((t === '5') ? 5 : 7);
}

/* 3 Tage (ab dem gezeigten Tag) | Arbeitswoche | Woche */
function clWocheTageSetzen(n) {
  cl.kal.tage = (n === 3 || n === 5) ? n : 7;
  try { window.localStorage.setItem(KAL_TAGE_KEY, String(cl.kal.tage)); } catch (e) { /* nur für jetzt */ }
  zeichne();
}

function clBlockTage(is) {
  var start = (cl.kal.tage === 3) ? is : montagVon(is);
  var tage = [];
  var i;
  for (i = 0; i < cl.kal.tage; i++) { tage.push(tagePlus(start, i)); }
  return tage;
}

/* Überschneidungen: Termine, die sich zeitlich berühren, bilden eine
   Gruppe; in ihr bekommt jeder eine Spalte. Ergebnis je Termin:
   {spalte, spalten}. */
function clUeberlappung(liste) {
  var l = liste.map(function (t) {
    var a = clMinuten(t.zeit);
    var e = clMinuten(t.bis);
    return { t: t, a: a, e: (e > a) ? e : Math.min(a + 30, 24 * 60), spalte: 0, spalten: 1 };
  }).sort(function (x, y) { return (x.a - y.a) || (y.e - x.e); });
  var gruppe = [];
  var gruppenEnde = -1;
  var abschliessen = function () {
    var n = gruppe.reduce(function (m, x) { return Math.max(m, x.spalte + 1); }, 1);
    gruppe.forEach(function (x) { x.spalten = n; });
    gruppe = [];
  };
  l.forEach(function (x) {
    if (gruppe.length && x.a >= gruppenEnde) { abschliessen(); gruppenEnde = -1; }
    var belegt = gruppe.filter(function (y) { return y.e > x.a; }).map(function (y) { return y.spalte; });
    var sp = 0;
    while (belegt.indexOf(sp) >= 0) { sp++; }
    x.spalte = sp;
    gruppe.push(x);
    gruppenEnde = Math.max(gruppenEnde, x.e);
  });
  if (gruppe.length) { abschliessen(); }
  return l;
}

function kalBloeckeHtml(is) {
  var tage = clBlockTage(is);
  /* Der Bereich wächst, wenn Termine früher oder später liegen */
  var von = BLOCK_VON * 60;
  var bis = BLOCK_BIS * 60;
  tage.forEach(function (d) {
    clTermineAm(d).zeit.forEach(function (t) {
      var a = clMinuten(t.zeit);
      var e = clMinuten(t.bis);
      if (a >= 0 && a < von) { von = Math.floor(a / 60) * 60; }
      if (e > bis) { bis = Math.ceil(e / 60) * 60; }
    });
  });
  var proMin = BLOCK_HOEHE / (bis - von);
  var jetzt = clMinuten(clUhrzeit());
  var jetztLinie = (tage.indexOf(isoDatum()) >= 0 && jetzt >= von && jetzt <= bis)
    ? '<span class="wb-jetzt" style="top:' + Math.round((jetzt - von) * proMin) + 'px"></span>' : '';
  var h = '<div class="tagwahl">' + [[3, '3 Tage'], [5, 'Arbeitswoche'], [7, 'Woche']].map(function (x) {
    return '<button type="button"' + (cl.kal.tage === x[0] ? ' class="an"' : '') + ' onclick="clWocheTageSetzen(' + x[0] + ')">' + x[1] + '</button>';
  }).join('') + '</div>';
  h += '<div class="wb' + (tage.length === 3 ? ' breit' : '') + '" style="grid-template-columns:36px repeat(' + tage.length + ',1fr)"><div class="kz"></div>';
  tage.forEach(function (d) {
    h += '<button type="button" class="kz' + (d === isoDatum() ? ' heute' : '') + '" onclick="clKalGehe(\'' + d + '\',\'tag\')">'
       + clWt(d) + '<br>' + Number(d.slice(8, 10)) + '</button>';
  });
  /* Ganztägiges: eine eigene Zeile unter den Wochentagen (seit 0.6.1) */
  if (tage.some(function (d) { return clTermineAm(d).ganztags.length; })) {
    h += '<div class="wb-ganz-z">◆</div>';
    tage.forEach(function (d) {
      h += '<div class="wb-ganz-sp">' + clTermineAm(d).ganztags.map(function (x) {
        return '<button type="button" class="wb-ganz" onclick="' + clGanzAufruf(d, x) + '">' + esc(x.titel) + '</button>';
      }).join('') + '</div>';
    });
  }
  h += '<div class="wb-uhr" style="height:' + BLOCK_HOEHE + 'px">';
  var st;
  for (st = von / 60; st <= bis / 60; st += 2) { h += '<span style="top:' + Math.round((st * 60 - von) * proMin) + 'px">' + st + '</span>'; }
  h += '</div>';
  tage.forEach(function (d) {
    var t = clTermineAm(d);
    h += '<div class="wb-sp' + (d === isoDatum() ? ' heute' : '') + '" style="height:' + BLOCK_HOEHE + 'px">'
       + '<button type="button" class="wb-tag" onclick="clKalGehe(\'' + d + '\',\'tag\')" aria-label="' + clWt(d) + ' öffnen"></button>';
    h += jetztLinie;
    clUeberlappung(t.zeit).forEach(function (x) {
      var oben = Math.round((x.a - von) * proMin);
      var hoch = Math.max(14, Math.round((x.e - x.a) * proMin) - 2);
      var breite = 100 / x.spalten;
      /* Abgestuft: jede Spalte einer Überschneidung eine eigene Stufe */
      h += '<button type="button" class="wb-blk s' + ((x.spalte % 3) + 1) + (clVorbei(d, x.t.bis || x.t.zeit) ? ' vorbei' : '') + '"'
         + ' style="top:' + oben + 'px;height:' + hoch + 'px;left:calc(' + (x.spalte * breite) + '% + 2px);width:calc(' + breite + '% - 4px)"'
         + ' onclick="terminZeigen(\'' + d + '\',\'' + esc(x.t.id) + '\')" aria-label="' + esc(clZeitText(x.t.zeit) + ' ' + x.t.titel) + '">'
         + esc(x.t.titel) + '</button>';
    });
    h += '</div>';
  });
  return h + '</div>';
}

function kalenderHtml() {
  var d = clKalDatum();
  if (cl.kal.ansicht === 'jahr') { return jahrHtml(); }
  if (cl.kal.ansicht === 'woche') { return kalWocheHtml(d); }
  if (cl.kal.ansicht === 'bloecke') { return kalBloeckeHtml(d); }
  if (cl.kal.ansicht === 'monat') { return kalMonatHtml(d); }
  return kalTagHtml(d);
}

function kalFussHtml() {
  var a = cl.kal.ansicht;
  return (a === 'jahr' ? jaFussHtml() : '<button type="button" class="knopf" onclick="terminNeu(\'\',\'\')">Neu</button>'
    + '<button type="button" class="knopf" onclick="clGeheZuOeffnen()">Gehe zu</button>')
    + '<span class="ansicht">'
    + [['tag', 'T'], ['woche', 'W'], ['bloecke', '▥'], ['monat', 'M'], ['jahr', 'J']].map(function (x) {
        return '<button type="button"' + (a === x[0] ? ' class="an"' : '') + ' onclick="clKalAnsicht(\'' + x[0] + '\')">' + x[1] + '</button>';
      }).join('') + '</span>';
}

/* ---- Bedienen ---- */

function clKalAnsicht(a) {
  if (a !== 'tag' && a !== 'woche' && a !== 'bloecke' && a !== 'monat' && a !== 'jahr') { return; }
  cl.kal.ansicht = a;
  zeichne();
  /* Das Jahr holt seine Termine einmal ganz (seit 0.37) */
  if (a === 'jahr') { jaJahrHolen(jaJahr(), false); }
}

function clKalGehe(is, ansicht) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(is || ''))) { return; }
  cl.kal.datum = (is === isoDatum()) ? '' : is;
  if (ansicht) { cl.kal.ansicht = ansicht; }
  cl.aufklapp = '';
  var el = document.getElementById('inhalt');
  if (el) { el.scrollTop = 0; }
  zeichne();
  /* Außerhalb des geholten Fensters: neu holen */
  if (tokenGueltig() && (!kalVon || is < kalVon || is > kalBis)) { clTermineHolen(false); }
}

function clBlaettern(richtung) {
  if (cl.kal.ansicht === 'jahr') { jaJahrUm(richtung); return; }
  var d = clKalDatum();
  var neu;
  if (cl.kal.ansicht === 'monat') {
    var j = Number(d.slice(0, 4));
    var m = Number(d.slice(5, 7)) + richtung;
    if (m < 1) { m = 12; j--; }
    if (m > 12) { m = 1; j++; }
    neu = j + '-' + zwei(m) + '-01';
  } else {
    var schritt = (cl.kal.ansicht === 'woche') ? 7 : ((cl.kal.ansicht === 'bloecke') ? (cl.kal.tage === 3 ? 3 : 7) : 1);
    neu = tagePlus(d, schritt * richtung);
  }
  clKalGehe(neu, '');
}

function clErlUm() {
  cl.kal.erlZeigen = !cl.kal.erlZeigen;
  inhaltZeichnen();
}

/* Abhaken im Tag: über den Kern, damit die Seite mitzieht */
function clTagZeileUm(is, nr) {
  var b = kpTagFinden(is);
  if (!b || !kpBehaelterZeileUmKern(b, nr)) { return; }
  spaeterSichern();
  zeichne();
}

function clWocheZeileUm(montag, nr) {
  var w = kpWocheFinden(montag);
  if (!w || typeof w.text !== 'string' || !kpBehaelterZeileUmKern(w, nr)) { return; }
  spaeterSichern();
  zeichne();
}

function clRoutineUm(id, is) {
  var a = null;
  (DB.aufgaben || []).forEach(function (x) { if (x && x.id === id) { a = x; } });
  if (!a || !a.wiederholung) { return; }
  wiederholungSetzen(a, is, !istErledigtAn(a, is));
  a.geaendert = jetzt();
  spaeterSichern();
  zeichne();
}

/* Wischen: links / rechts blättert Tag, Woche oder Monat */
function wischAnfang(e) {
  var p = e && e.touches && e.touches[0];
  wischStart = (p && cl.app === 'kalender' && !cl.aufklapp) ? { x: p.clientX, y: p.clientY } : null;
}

function wischEnde(e) {
  var p = e && e.changedTouches && e.changedTouches[0];
  if (!wischStart || !p) { wischStart = null; return; }
  var dx = p.clientX - wischStart.x;
  var dy = p.clientY - wischStart.y;
  wischStart = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50) { clBlaettern(dx < 0 ? 1 : -1); }
}

/* ---- Gehe zu ---- */

function clGeheZuOeffnen() {
  cl.aufklapp = 'gehezu';
  aufklappZeichnen();
}

function geheZuHtml() {
  return '<div class="fenster"><div class="titel">Gehe zu</div><div class="rumpf">'
    + '<label for="geheFeld">Datum:</label><input id="geheFeld" class="eingabe" type="date" value="' + esc(clKalDatum()) + '">'
    + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="clGeheZu()">OK</button>'
    + '<button type="button" class="knopf" onclick="clKalGehe(\'' + isoDatum() + '\',\'tag\')">Heute</button>'
    + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button></div></div></div>';
}

function clGeheZu() {
  var f = document.getElementById('geheFeld');
  var d = f ? String(f.value || '') : '';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { melde('Bitte ein Datum wählen.', 'warn'); return; }
  clKalGehe(d, '');
}

/* ---------- Termine schreiben: direkt im Google-Kalender ---------- */

function clTerminFinden(is, id) {
  var l = termineNachTag[is] || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i].id === id) { return l[i]; } }
  return null;
}

/* Die Kalender, in die geschrieben werden darf — einmal geholt */
function schreibKalenderHolen() {
  if (schreibKalender.length) { return Promise.resolve(schreibKalender); }
  var adresse = 'https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=writer'
              + '&fields=' + encodeURIComponent('items(id,summary,primary)') + '&maxResults=50';
  return window.fetch(adresse, { headers: driveKopf() }).then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      schreibKalender = ((d && d.items) || []).map(function (k) { return { id: k.id, name: k.summary || k.id, primary: !!k.primary }; });
      return schreibKalender;
    });
}

/* Vorgewählt: der zuletzt benutzte — sonst einer, der zu Beruf/Privat passt */
function clKalenderVorschlag() {
  var zuletzt = '';
  try { zuletzt = window.localStorage.getItem(KAL_ZULETZT_KEY) || ''; } catch (e) { zuletzt = ''; }
  var ids = schreibKalender.map(function (k) { return k.id; });
  if (zuletzt && ids.indexOf(zuletzt) >= 0 && (cl.filter === 'alle' || kalenderKontext(zuletzt) === cl.filter)) { return zuletzt; }
  var passend = schreibKalender.filter(function (k) { return cl.filter !== 'alle' && kalenderKontext(k.id) === cl.filter; });
  if (passend.length) { return passend[0].id; }
  if (zuletzt && ids.indexOf(zuletzt) >= 0) { return zuletzt; }
  var haupt = schreibKalender.filter(function (k) { return k.primary; });
  return haupt.length ? haupt[0].id : (ids[0] || '');
}

function terminNeu(is, zeit) {
  var d = is || clKalDatum();
  /* Ohne Google keine Termine — eine Aufgabe geht aber immer */
  if (!tokenGueltig()) {
    melde('Termine gehen nur mit Verbindung zu Google.\nHier kannst du eine Aufgabe anlegen.', null);
    aufNeuAm(d, '');
    return;
  }
  var z = zeit;
  if (!z) {
    var std = (d === isoDatum()) ? Math.min(new Date().getHours() + 1, 23) : 9;
    z = zwei(std) + ':00';
  }
  var ende = clMinuten(z) + 60;
  var bis = ende >= 24 * 60 ? '23:59' : zwei(Math.floor(ende / 60)) + ':' + zwei(ende % 60);
  cl.termin = { modus: 'neu', t: null, vorschlag: { titel: '', datum: d, von: z, bis: bis, ganztags: false, kalId: '', ort: '', notiz: '' } };
  cl.aufklapp = 'termin';
  aufklappZeichnen();
  schreibKalenderHolen().then(function () {
    if (cl.termin && cl.termin.modus === 'neu') { cl.termin.vorschlag.kalId = clKalenderVorschlag(); clTerminFensterNeu(); }
  }).catch(function (f) {
    melde('Die Kalender ließen sich nicht holen.\n' + (f ? f.message : ''), 'warn');
  });
}

function terminZeigen(is, id) {
  var t = clTerminFinden(is, id);
  if (!t) { return; }
  cl.termin = { modus: 'zeigen', t: t, tag: is };
  cl.aufklapp = 'termin';
  aufklappZeichnen();
}

function terminAendern() {
  var t = cl.termin && cl.termin.t;
  if (!t) { return; }
  if (!tokenGueltig()) { melde('Ändern geht nur mit Verbindung zu Google.', 'warn'); return; }
  cl.termin = { modus: 'aendern', t: t, tag: cl.termin.tag, vorschlag: {
    titel: t.rohTitel || t.titel, datum: cl.termin.tag, von: t.ganztags ? '09:00' : t.zeit, bis: t.ganztags ? '10:00' : (t.bis || t.zeit),
    ganztags: !!t.ganztags, kalId: t.kalId || '', ort: t.ort || '', notiz: t.beschreibung || '' } };
  clTerminFensterNeu();
  schreibKalenderHolen().then(clTerminFensterNeu).catch(function () { return null; });
}

function terminLoeschenFragen() {
  if (!cl.termin || !cl.termin.t) { return; }
  cl.termin.modus = 'loeschen';
  clTerminFensterNeu();
}

function clTerminFensterNeu() {
  var el = document.getElementById('aufklapp');
  if (el) { el.innerHTML = ''; }
  aufklappZeichnen();
}

function clKalenderName(id) {
  var i;
  for (i = 0; i < kalenderListe.length; i++) { if (kalenderListe[i].id === id) { return kalenderListe[i].name; } }
  for (i = 0; i < schreibKalender.length; i++) { if (schreibKalender[i].id === id) { return schreibKalender[i].name; } }

}

      }).join('') + '</select>'
    : '<span class="leise" id="terminKalWarte">Kalender werden geholt …</span>';

}

/* Im Fenster „Neu“ vom Termin zur Aufgabe — für den gezeigten Tag */
function aufgabeStatt() {
  var d = clFeldWert('terminDatum') || (cl.termin && cl.termin.vorschlag && cl.termin.vorschlag.datum) || clKalDatum();
  cl.termin = null;
  aufNeuAm(d, '');
}

function clFeldWert(id) {
  var f = document.getElementById(id);
  return f ? String(f.value || '') : '';
}

/* Aus dem Fenster wird, was Google erwartet. Gibt {fehler} oder {koerper, kalId}. */
function terminAusFenster() {
  var titel = clFeldWert('terminTitel').trim();
  var datum = clFeldWert('terminDatum');
  var von = clFeldWert('terminVon');
  var bis = clFeldWert('terminBis');
  var ganz = !!(document.getElementById('terminGanz') || {}).checked;
  var kalId = (cl.termin && cl.termin.modus === 'aendern') ? cl.termin.vorschlag.kalId : clFeldWert('terminKal');
  if (!titel) { return { fehler: 'Bitte einen Titel eingeben.' }; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(datum)) { return { fehler: 'Bitte ein Datum wählen.' }; }
  if (!kalId) { return { fehler: 'Bitte einen Kalender wählen.' }; }
  var k = { summary: titel, location: clFeldWert('terminOrt').trim(), description: clFeldWert('terminNotiz') };
  if (ganz) {
    k.start = { date: datum, dateTime: null };
    k.end = { date: tagePlus(datum, 1), dateTime: null };
  } else {
    if (clMinuten(von) < 0 || clMinuten(bis) < 0) { return { fehler: 'Bitte Beginn und Ende angeben.' }; }
    if (clMinuten(bis) <= clMinuten(von)) { return { fehler: 'Das Ende liegt vor dem Beginn.' }; }
    var zone = '';
    try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { zone = ''; }
    k.start = { dateTime: datum + 'T' + von + ':00', timeZone: zone || 'Europe/Berlin', date: null };
    k.end = { dateTime: datum + 'T' + bis + ':00', timeZone: zone || 'Europe/Berlin', date: null };
  }
  return { koerper: k, kalId: kalId, datum: datum };
}

/* Fehlt die Erlaubnis zum Schreiben (Anmeldung noch aus 0.1), muss
   Google einmal neu fragen. */
function clSchreibFehler(f) {
  var text = f ? f.message : 'unbekannter Fehler';
  if (/403|insufficient|Berechtigung|verweigert/i.test(text)) {
    melde('CLIE darf noch keine Termine schreiben.\nBitte einmal neu verbinden und zustimmen.', 'warn');
    tokenVergessen();
    anmelden(false);
    return;
  }
  melde('Google hat den Termin nicht angenommen.\n' + text, 'warn');
}

function terminSpeichern() {
  if (!cl.termin) { return; }
  var e = terminAusFenster();
  if (e.fehler) { melde(e.fehler, 'warn'); return; }
  if (!tokenGueltig()) { melde('Keine Verbindung zu Google — der Termin wurde nicht gespeichert.', 'warn'); return; }
  var aendern = cl.termin.modus === 'aendern' && cl.termin.t;
  var adresse = 'https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(e.kalId) + '/events'
              + (aendern ? '/' + encodeURIComponent(cl.termin.t.id) : '');
  try { window.localStorage.setItem(KAL_ZULETZT_KEY, e.kalId); } catch (x) { /* egal */ }
  melde(aendern ? 'Termin wird geändert …' : 'Termin wird angelegt …', null);
  return window.fetch(adresse, { method: aendern ? 'PATCH' : 'POST', headers: driveKopf({ 'Content-Type': 'application/json' }),
                                 body: JSON.stringify(e.koerper) })
    .then(antwortPruefen)
    .then(function (a) { return (a && typeof a.json === 'function') ? a.json().catch(function () { return null; }) : null; })
    .then(function (r) {
      cl.termin = null;
      aufklappZu();
      melde(aendern ? 'Termin geändert.' : 'Termin im Google-Kalender angelegt.', 'gut');
      if (e.datum !== clKalDatum() && cl.kal.ansicht === 'tag') { cl.kal.datum = (e.datum === isoDatum()) ? '' : e.datum; }
      /* Ein Termin ab einer Stunde: der Coach fragt nach (seit 0.33) */
      var von = e.koerper.start && e.koerper.start.dateTime ? String(e.koerper.start.dateTime).slice(11, 16) : '';
      var bis = e.koerper.end && e.koerper.end.dateTime ? String(e.koerper.end.dateTime).slice(11, 16) : '';
      var dauer = (von && bis) ? clMinuten(bis) - clMinuten(von) : 0;
      if (!aendern && r && r.id && dauer >= 60) {
        coVorabAuf({ art: 'termin', text: String(e.koerper.summary || 'Termin'), dauer: (dauer >= 120 ? Math.round(dauer / 30) / 2 + ' Std.' : dauer + ' Min.'), kalId: e.kalId, terminId: r.id, datum: e.datum });
      }
      return clTermineHolen(false);
    }).catch(clSchreibFehler);
}

function terminLoeschen() {
  var t = cl.termin && cl.termin.t;
  if (!t || !t.kalId) { return; }
  if (!tokenGueltig()) { melde('Löschen geht nur mit Verbindung zu Google.', 'warn'); return; }
  var adresse = 'https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(t.kalId) + '/events/' + encodeURIComponent(t.id);
  return window.fetch(adresse, { method: 'DELETE', headers: driveKopf() })
    .then(antwortPruefen)
    .then(function () {
      cl.termin = null;
      aufklappZu();
      melde('Termin gelöscht.', 'gut');
      return clTermineHolen(false);
    }).catch(clSchreibFehler);
}

/* ---------- Jahr (seit 0.37) ----------

   Das Highlight der Workbench, schlank in CLIE: der Jahreskalender als
   Ansicht „J“ im Kalender — 12 Monate × 31 Tage, farbig nach Art, Ferien
   schraffiert — und als Liste je Art: Geburtstage nach dem nächsten
   Datum, Besuche und alles andere rückwärts mit Suche („Wann haben wir
   Sabine zuletzt getroffen?“). Jahrestermine werden hier gepflegt, einem
   Google-Termin lässt sich eine Art zuordnen. Die Arten sind dieselben
   wie in der Workbench: #Kürzel im Termin oder Zuordnung in der App. */

/* Seit 0.38 ohne Farben — drei Abstufungen wie am LCD: weg (dunkel),
   Termin/Treffen (mittel), Geburtstag (hell). Reduktion statt Regenbogen. */
var JA_DUNKEL = '#1C2116';
var JA_MITTEL = '#56604A';
var JA_HELL = '#8E9A7C';
var JA_ARTEN = {
  urlaub: { n: 'Urlaub', f: JA_DUNKEL }, krank: { n: 'Krank', f: JA_DUNKEL }, dienstreise: { n: 'Dienstreise', f: JA_DUNKEL },
  besuche: { n: 'Besuche', f: JA_MITTEL }, abwesend: { n: 'Abwesend', f: JA_DUNKEL }, termin: { n: 'Termin', f: JA_MITTEL },
  geburtstag: { n: 'Geburtstag', f: JA_HELL }, feier: { n: 'Feier', f: JA_MITTEL }, sonstiges: { n: 'Sonstiges', f: JA_MITTEL }
};
var JA_REIHE = ['urlaub', 'krank', 'dienstreise', 'besuche', 'abwesend', 'termin', 'geburtstag', 'feier', 'sonstiges'];
var JA_GLEICH = { besuch: 'besuche', geburtstage: 'geburtstag', feiern: 'feier', urlaube: 'urlaub', dienstreisen: 'dienstreise', termine: 'termin' };
var JA_MONATE = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];

cl.ja = { jahr: 0, filter: '', ansicht: 'raster', suche: '', tag: '', jt: null, termine: {}, geladen: {}, laeuft: false, ab: 0 };

function jaJahr() {
  if (!cl.ja.jahr) { cl.ja.jahr = Number(isoDatum().slice(0, 4)); }
  return cl.ja.jahr;
}

function jaArtName(k) {
  if (JA_ARTEN[k]) { return JA_ARTEN[k].n; }
  if (!k) { return 'Ohne Art'; }
  return k.charAt(0).toUpperCase() + k.slice(1);
}

function jaArtFarbe(k) {
  if (JA_ARTEN[k]) { return JA_ARTEN[k].f; }
  /* Eigene Arten und Termine ohne Art: mittlere Stufe */
  return JA_MITTEL;
}

/* #Besuch im Titel oder in der Beschreibung — wie in der Workbench */
function jaArtenAusText(text) {
  if (typeof text !== 'string' || !text) { return []; }
  var re = /#([A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß0-9_-]{1,23})/g;
  var aus = [];
  var m;
  while ((m = re.exec(text)) !== null) {
    var a = m[1].toLowerCase();
    a = JA_GLEICH[a] || a;
    if (aus.indexOf(a) < 0) { aus.push(a); }
  }
  return aus;
}

function jaZuordnung(id) {
  var z = (DB.kalenderzuordnung || {})[id];
  return (z && z.art) ? z.art : '';
}

function jaTerminArten(t) {
  var eigen = t && t.id ? jaZuordnung(t.id) : '';
  if (eigen) { return [eigen]; }
  var aus = jaArtenAusText(t.rohTitel || t.titel);
  jaArtenAusText(t.beschreibung).forEach(function (a) { if (aus.indexOf(a) < 0) { aus.push(a); } });
  return aus;
}

/* Zuordnung einer Art zu einem Google-Termin (wie die Workbench: dieselbe Art nochmals hebt sie auf) */
function jaZuordnen(id, art) {
  if (!DB.kalenderzuordnung || typeof DB.kalenderzuordnung !== 'object') { DB.kalenderzuordnung = {}; }
  var z = DB.kalenderzuordnung[id] || {};
  var neu = (art && art !== z.art) ? art : '';
  if (neu) { z.art = neu; } else { delete z.art; }
  if (!z.art && !z.vorhaben && !z.kontext) {
    delete DB.kalenderzuordnung[id];
    grabsteinSetzen('kalenderzuordnung', id);
  } else {
    z.geaendert = jetzt();
    DB.kalenderzuordnung[id] = z;
  }
  spaeterSichern();
  jaZeichnen();
}

/* Google-Termine eines Tages: aus dem Jahresabruf, sonst aus dem normalen Fenster */
function jaGoogleAm(is) {
  var l = (cl.ja.termine[is] || []).slice();
  (termineNachTag[is] || []).forEach(function (t) { if (!l.some(function (x) { return x.id === t.id; })) { l.push(t); } });
  return l.filter(function (t) { return !coIstCoachTermin(t) && clPasstTermin(t); });
}

/* Alles, was an einem Tag ins Jahr gehört: Jahrestermine und Google-Termine mit Art (oder ganztägig) */
function jaAn(is) {
  var aus = [];
  (DB.jahrestermine || []).forEach(function (e) {
    if (!e || !e.von) { return; }
    var von = e.von;
    var bis = e.bis || e.von;
    if (e.jaehrlich) { von = is.slice(0, 4) + von.slice(4); bis = is.slice(0, 4) + (e.bis || e.von).slice(4); }
    if (is < von || is > bis) { return; }
    var k = jtKontext(e);
    if (cl.filter !== 'alle' && k !== cl.filter) { return; }
    aus.push({ id: e.id, titel: String(e.titel || ''), art: e.art || '', arten: e.art ? [e.art] : [], jt: e });
  });
  jaGoogleAm(is).forEach(function (t) {
    var arten = jaTerminArten(t);
    if (!arten.length && !t.ganztags) { return; }
    aus.push({ id: t.id, titel: String(t.titel || ''), art: arten[0] || '', arten: arten, google: t, zeit: t.zeit || '' });
  });
  return aus;
}

function jaPasst(x) {
  var f = cl.ja.filter;
  if (!f) { return true; }
  if (f === 'ferien') { return false; }
  return x.arten.indexOf(f) >= 0;
}

/* Die Arten, die es gibt: eingebaute, aus Jahresterminen, Zuordnungen und geladenen Terminen */
function jaArtenAlle() {
  var aus = JA_REIHE.slice();
  var dazu = function (a) { if (a && aus.indexOf(a) < 0) { aus.push(a); } };
  (DB.jahrestermine || []).forEach(function (e) { dazu(e && e.art); });
  var z = DB.kalenderzuordnung || {};
  Object.keys(z).forEach(function (k) { dazu(z[k] && z[k].art); });
  [cl.ja.termine, termineNachTag].forEach(function (m) {
    Object.keys(m || {}).forEach(function (tag) { (m[tag] || []).forEach(function (t) { jaArtenAusText(t.rohTitel || t.titel).forEach(dazu); }); });
  });
  return aus;
}

/* Ein ganzes Jahr aus Google holen (für Raster und Liste), je Jahr einmal */
function jaJahrHolen(jahr, laut) {
  if (cl.ja.geladen[jahr] || cl.ja.laeuft || !tokenGueltig()) {
    if (laut && !tokenGueltig()) { melde('Für ältere Termine bitte mit Google verbinden.', 'warn'); }
    return Promise.resolve(false);
  }
  cl.ja.laeuft = true;
  var vorbereitung = kalenderListe.length ? Promise.resolve(kalenderListe) : kalenderListeHolen();
  return vorbereitung.then(function () {
    var reihe = Promise.resolve(true);
    kalenderListe.forEach(function (kal) {
      if (!kalenderGewaehlt(kal.id)) { return; }
      var eigen = {};
      reihe = reihe.then(function () { return einenKalenderHolen(kal, jahr + '-01-01', jahr + '-12-31', eigen); })
        .then(function () { clKalenderEinsetzen(eigen, kal, cl.ja.termine); });
    });
    return reihe;
  }).then(function () {
    cl.ja.geladen[jahr] = true;
    if (!cl.ja.ab || jahr < cl.ja.ab) { cl.ja.ab = jahr; }
    if (laut) { melde('Termine ' + jahr + ' geholt.', 'gut'); }
    return true;
  }).catch(function () {
    if (laut) { melde('Termine ' + jahr + ' ließen sich nicht holen.', 'warn'); }
    return false;
  }).then(function (r) {
    cl.ja.laeuft = false;
    jaZeichnen();
    return r;
  });
}

/* ---- Liste je Art ---- */

/* Nächstes Datum eines jährlichen Termins ab heute */
function jaNaechstes(e, heute) {
  var t = heute.slice(0, 4) + String(e.von).slice(4);
  if (t < heute) { t = (Number(heute.slice(0, 4)) + 1) + String(e.von).slice(4); }
  return t;
}

/* Jahrgang: eigenes Feld, sonst eine Jahreszahl im Titel („Moni *1974“) */
function jaJahrgang(e) {
  if (/^\d{4}$/.test(String(e.jahrgang || ''))) { return Number(e.jahrgang); }
  var m = String(e.titel || '').match(/\b(19\d{2}|20\d{2})\b/);
  return m ? Number(m[1]) : 0;
}

function jaListe(art, heute) {
  var such = String(cl.ja.suche || '').trim().toLowerCase();
  var passt = function (t) { return !such || String(t).toLowerCase().indexOf(such) >= 0; };
  var jaehrlich = [];
  var termine = [];
  (DB.jahrestermine || []).forEach(function (e) {
    if (!e || !e.von || (e.art || '') !== art || !passt(e.titel)) { return; }
    if (cl.filter !== 'alle' && jtKontext(e) !== cl.filter) { return; }
    if (e.jaehrlich) {
      var n = jaNaechstes(e, heute);
      var jg = jaJahrgang(e);
      jaehrlich.push({ datum: n, titel: e.titel, alter: jg ? Number(n.slice(0, 4)) - jg : 0, jt: e });
    } else {
      termine.push({ datum: e.von, titel: e.titel, jt: e });
    }
  });
  var gesehen = {};
  [cl.ja.termine, termineNachTag].forEach(function (m) {
    Object.keys(m || {}).forEach(function (tag) {
      (m[tag] || []).forEach(function (t) {
        if (gesehen[t.id + tag] || coIstCoachTermin(t) || !clPasstTermin(t)) { return; }
        gesehen[t.id + tag] = true;
        if (jaTerminArten(t).indexOf(art) < 0 || !passt(t.titel)) { return; }
        termine.push({ datum: tag, titel: t.titel, zeit: t.zeit || '', google: t });
      });
    });
  });
  jaehrlich.sort(function (a, b) { return a.datum < b.datum ? -1 : (a.datum > b.datum ? 1 : 0); });
  var kommend = termine.filter(function (x) { return x.datum >= heute; }).sort(function (a, b) { return a.datum < b.datum ? -1 : 1; });
  var vorbei = termine.filter(function (x) { return x.datum < heute; }).sort(function (a, b) { return a.datum > b.datum ? -1 : 1; });
  return { jaehrlich: jaehrlich, kommend: kommend, vorbei: vorbei };
}

function jaAbstand(datum, heute) {
  var n = (saTagNr(datum) || 0) - (saTagNr(heute) || 0);
  if (n === 0) { return 'heute'; }
  if (n > 0) { return 'in ' + n + ' T.'; }
  n = -n;
  if (n < 31) { return 'vor ' + n + ' T.'; }
  if (n < 365) { return 'vor ' + Math.round(n / 30.4) + ' Mon.'; }
  return 'vor ' + (Math.round(n / 36.5) / 10).toString().replace('.', ',') + ' J.';
}

/* ---------- Aufgaben (seit 0.3, überarbeitet 0.6) ----------

   Wie der To-Do-Bildschirm des Palm: alle offenen Aufgaben ([]-Zeilen)
   aus laufenden Projekten, Zielen und Listen. Seit 0.6 nach Liste
   gruppiert („Kategorien“), abschaltbar zur flachen Liste; Eingeplantes
   steht oben. Oben rechts wählt man eine einzelne Liste — darüber steht
   der Filter Alle / Beruf / Privat; zur Auswahl die zuletzt benutzten
   Listen und „Weitere…“ (mit „Neue Liste…“). Ziele erscheinen dort nicht.
   Eingeplant wird für einen Tag (heute oder später), wahlweise mit
   Uhrzeit. Abhaken, Einplanen und Ändern gehen über den Kern, damit
   Seite, Tag und Woche zusammenbleiben — wie in der Workbench. */

var AUF_LISTE_KEY = 'clie-aufgaben-liste';
/* Seit 0.17: Ansicht Gruppiert | Prio | Geplant und „1. Nächste“ */
var AUF_ANSICHT_KEY = 'clie-aufgaben-ansicht';
var AUF_NAECHSTE_KEY = 'clie-aufgaben-naechste';
var AUF_ANSICHTEN = [['gruppiert', 'Gruppiert'], ['prio', 'Prio'], ['geplant', 'Geplant']];
var ZULETZT_KEY = 'clie-zuletzt';
var ZULETZT_ZAHL = 5;

cl.auf = { liste: '', wahl: '', frisch: {}, erlZeigen: false, ansicht: 'gruppiert', naechste: false, ganz: {}, fenster: null, wahlFuer: '', neueListe: null };
cl.memo = { id: '', schreiben: false, hervor: '', fenster: null, ausListe: '', bereich: '' };

/* Seiten, deren Aufgaben in „Aufgaben“ stehen: laufende Projekte und
   Ziele, alle Listen. Notizen (und damit Checklisten) nicht. */
function aufSeiten() {
  return kpNachRang(kpSeitenAlle().filter(function (s) {
    if (s.art === 'notiz') { return false; }
    if (s.art === 'vorhaben' && s.zustand !== 'laeuft') { return false; }
    return kpPasstFilter(s, cl.filter);
  }));
}

/* Was in der Auswahl stehen darf: Projekte und Listen, keine Ziele. */
function aufWaehlbar(mitLeeren) {
  return aufSeiten().filter(function (s) {
    if (s.art === 'vorhaben' && s.typ === 'ziel') { return false; }
    return mitLeeren || kpOffeneZahl(s) > 0;
  });
}

function aufAnsichtLaden() {
  var a = '';
  var n = '';
  try { a = window.localStorage.getItem(AUF_ANSICHT_KEY) || ''; n = window.localStorage.getItem(AUF_NAECHSTE_KEY) || ''; } catch (e) { a = ''; }
  cl.auf.ansicht = AUF_ANSICHTEN.some(function (x) { return x[0] === a; }) ? a : 'gruppiert';
  cl.auf.naechste = (n === 'an');
}

function aufListeLaden() {
  var l = '';
  try { l = window.localStorage.getItem(AUF_LISTE_KEY) || ''; } catch (e) { l = ''; }
  cl.auf.liste = l;
}

function zuletztListe() {
  var l = [];
  try { l = JSON.parse(window.localStorage.getItem(ZULETZT_KEY) || '[]'); } catch (e) { l = []; }
  return Array.isArray(l) ? l.filter(function (x) { return typeof x === 'string'; }) : [];
}

function zuletztMerken(id) {
  if (!id) { return; }
  var l = zuletztListe().filter(function (x) { return x !== id; });
  l.unshift(id);
  try { window.localStorage.setItem(ZULETZT_KEY, JSON.stringify(l.slice(0, 12))); } catch (e) { /* nur für jetzt */ }
}

/* Die gewählte Liste — nur wenn es sie noch gibt und sie zum Filter passt. */
function aufListe() {
  var s = cl.auf.liste ? kpSeiteFinden(cl.auf.liste) : null;
  if (!s || !kpPasstFilter(s, cl.filter)) { return null; }
  return s;

function aufListeSetzen(id) {

function clSeitenZeichen(s) {
  if (!s) { return ''; }

/* Text ohne Auszeichnung — für Zeilen, die selbst bedienbar sind */
/* Aufgabentext mit Prioritätszeichen statt Kürzel (seit 0.12) */
function clPrioHtml(text) {
  var x = kpPrio(text);
  return (x.p ? '<span class="prio p' + x.p + '">' + x.p + '</span>' : '') + esc(clSchlicht(x.text));

function clSchlicht(text) {
  return String(text || '')
    .replace(KP_VERWEIS, function (g, art, id, titel) { return titel; })
    .replace(/\[([^\]]{1,200})\] ?\((https?:\/\/[^\s)]+)\)/g, '$1')
    .replace(/(^|[\s(])(\*\*|~~|_{2})([^\s](?:[^\n]*?[^\s])?)\2(?=$|[\s.,;:!?)])/g, '$1$3')
    .replace(/(^|[\s(])([*_~+^])([^\s](?:[^*_~+^\n]*[^\s])?)\2(?=$|[\s.,;:!?)])/g, '$1$3');
}

/* Für wann ist die Aufgabe eingeplant? Der früheste Tag ab heute. */
function aufGeplant(seite, text) {
  var beste = null;
  kpEintraegeFinden(seite.id, text).forEach(function (f) {
    if (!f.woche.datum) { return; }
    if (!beste || f.woche.datum < beste.datum) {
      beste = { datum: f.woche.datum, zeit: f.eintrag.zeit || '', eintrag: f.eintrag, behaelter: f.woche };
    }
  });
  return beste;
}

/* „heute“, „15:00“, „Mi 21.10.“ oder „Mi 21.10. 15:00“ */
function clPlanText(datum, zeit) {
  if (!datum) { return ''; }
  if (datum === isoDatum()) { return zeit ? clZeitText(zeit) : 'heute'; }
  return clWt(datum) + ' ' + clKurzDatum(datum) + (zeit ? ' ' + clZeitText(zeit) : '');
}

function aufSchluessel(seite, nr) { return seite.id + '|' + nr; }

/* Woher die Aufgaben in „Alle Aufgaben“ kommen (seit 0.17): erst
   laufende Projekte und Ziele, dann Listen, dann laufende Checklisten —
   von diesen nur die eingeplanten Punkte. */
function aufQuellen() {
  var seiten = aufSeiten();
  var art = function (s) { return s.art === 'vorhaben' ? 0 : 1; };
  var l = seiten.map(function (s, i) { return { s: s, i: i }; })
    .sort(function (a, b) { return (art(a.s) - art(b.s)) || (a.i - b.i); })
    .map(function (x) { return x.s; });
  return l.concat(clsAlle('lauf').map(function (g) { return kpSeiteFinden(g.id); }).filter(function (s) { return !!s; }));
}

function aufIstCheckliste(s) {
  return !!(s && s.__satz && s.__satz.checkliste);
}

/* Alle Aufgaben der Ansicht — offene, dazu gerade Abgehakte (bleiben
   bis zum Verlassen der App durchgestrichen stehen). */
function aufAufgaben() {
  var liste = aufListe();
  var seiten = liste ? [liste] : aufQuellen();
  var aus = [];
  seiten.forEach(function (s) {
    var cls = aufIstCheckliste(s);
    String(s.text || '').split('\n').forEach(function (z, nr) {
      var a = kpAufgabe(z);
      if (!a || !a.text) { return; }
      var key = aufSchluessel(s, nr);
      var frisch = !!cl.auf.frisch[key];
      if (a.erledigt && !frisch && !cl.auf.erlZeigen) { return; }
      var g = a.erledigt ? null : aufGeplant(s, a.text);
      /* Checklisten: nur Eingeplantes (oder gerade hier Abgehaktes) */
      if (cls && !g && !frisch) { return; }
      aus.push({ seite: s, nr: nr, a: a, key: key, datum: g ? g.datum : '', zeit: g ? g.zeit : '', cls: cls });
    });
  });
  return aus;
}

/* Sortierschlüssel: Tag + Uhrzeit (ohne Datum ans Ende) und Priorität */
function aufPlanSchluessel(x) { return x.datum ? x.datum + ' ' + (x.zeit || '99:99') : '9999'; }
function aufPrioRang(x) { return kpPrio(x.a.text).p || 9; }

/* Prio: P1 → P3 → ohne, bei gleicher Prio das frühere Datum zuerst.
   Geplant: nach Tag und Uhrzeit, dann Prio; ohne Datum am Ende. */
function aufSortiert(l, ansicht) {
  return l.map(function (x, i) { return { x: x, i: i }; }).sort(function (p, q) {
    var pp = aufPrioRang(p.x) - aufPrioRang(q.x);
    var pd = aufPlanSchluessel(p.x) < aufPlanSchluessel(q.x) ? -1 : (aufPlanSchluessel(p.x) > aufPlanSchluessel(q.x) ? 1 : 0);
    return (ansicht === 'prio' ? (pp || pd) : (pd || pp)) || (p.i - q.i);
  }).map(function (y) { return y.x; });
}

/* „1. Nächste“: je Seite nur die nächste offene Aufgabe — die am frühesten
   fällige (Datum, dann Uhrzeit); hat keine ein Datum, die oberste (seit 0.29.1
   für alle Seiten, vorher nur bei Checklisten). Gerade Abgehaktes bleibt
   stehen. Ergebnis: die Zeilen und je Seite, wie viele noch warten. */
function aufNaechste(l) {
  var rest = {};
  var nimm = {};
  l.forEach(function (x) {
    if (x.a.erledigt) { return; }
    var id = x.seite.id;
    rest[id] = (rest[id] || 0) + 1;
    var b = nimm[id];
    if (!b || aufPlanSchluessel(x) < aufPlanSchluessel(b)) { nimm[id] = x; }
  });
  var aus = l.filter(function (x) {
    return x.a.erledigt || cl.auf.ganz[x.seite.id] || nimm[x.seite.id] === x;
  });
  Object.keys(rest).forEach(function (id) { rest[id] = cl.auf.ganz[id] ? 0 : rest[id] - 1; });
  return { zeilen: aus, rest: rest };
}

/* Eine Zeile. o.herkunft: Seite klein darunter; o.ohneTag: nur die
   Uhrzeit als Marke (der Tag steht schon in der Zwischenzeile);
   o.mehr: „+n“ — so viele warten noch (tippen klappt die Seite auf). */
function aufZeileHtml(x, o) {
  o = o || {};
  var plan = o.ohneTag ? (x.zeit ? clZeitText(x.zeit) : '') : clPlanText(x.datum, x.zeit);
  var marke = plan ? '<span class="plan-marke">' + esc(plan) + '</span>' : '';
  var pr = kpPrio(x.a.text);
  return '<div class="aufg' + (x.a.erledigt ? ' erl' : '') + (cl.auf.wahl === x.key ? ' gewaehlt' : '') + '">'
    /* Priorität (seit 0.12): antippen schaltet – → 1 → 2 → 3 → – */
    + '<button type="button" class="prio p' + pr.p + '" onclick="aufPrioUm(\'' + esc(x.seite.id) + '\',' + x.nr + ')" aria-label="Priorität">' + (pr.p || '') + '</button>'
    + clKastenHtml(x.a.erledigt, 'aufHaken(\'' + esc(x.seite.id) + '\',' + x.nr + ')')
    /* Mit Herkunft darf der Text zwei Zeilen haben, die Herkunft eine dritte */
    + '<button type="button" class="tx umbruch' + (o.herkunft ? ' drei' : '') + '" onclick="aufTippen(\'' + esc(x.seite.id) + '\',' + x.nr + ')">' + esc(clSchlicht(pr.text))
    + (o.herkunft ? clHerkunftHtml(clSeitenZeichen(x.seite), x.seite.titel) : '') + '</button>'
    + marke
    + (o.mehr ? '<button type="button" class="mehr" onclick="aufGanzUm(\'' + esc(x.seite.id) + '\')" aria-label="alle zeigen">+' + o.mehr + '</button>' : '')
    + '</div>';
}

/* ---- Priorität (seit 0.12) — als Kürzel „P1 “ vor dem Text, Kern der Workbench ---- */

/* Stabil sortieren: P1, P2, P3, dann ohne — sonst bleibt die Reihenfolge */
function clNachPrio(l, text) {
  var rang = function (x) { var p = kpPrio(text(x)).p; return p || 9; };
  return l.map(function (x, i) { return { x: x, i: i }; })
    .sort(function (a, b) { return (rang(a.x) - rang(b.x)) || (a.i - b.i); })
    .map(function (y) { return y.x; });
}

function aufPrioUm(seiteId, nr) {
  var s = kpSeiteFinden(seiteId);
  var a = s ? kpAufgabe(String(s.text || '').split('\n')[nr] || '') : null;
  if (!a) { return; }
  if (kpPrioSetzenKern(s, nr, (kpPrio(a.text).p + 1) % 4)) {
    spaeterSichern();
    zeichne();
  }
}

function aufPrioWahl(p) {
  var f = aufFensterLesen();
  if (!f || p < 0 || p > 3) { return; }
  f.prio = p;
  f.prioGesetzt = true;
  aufklappNeu();
}

function aufgabenHtml() {
  var liste = aufListe();
  var ansicht = cl.auf.ansicht;
  var h = '<div class="auf-leiste"><div class="schalter">' + AUF_ANSICHTEN.map(function (a) {
      return '<button type="button"' + (a[0] === ansicht ? ' class="an"' : '') + ' onclick="aufAnsicht(\'' + a[0] + '\')">' + a[1] + '</button>';
    }).join('') + '</div>'
    + '<button type="button" class="naechste' + (cl.auf.naechste ? ' an' : '') + '" onclick="aufNaechsteUm()">1. Nächste</button></div>';
  var l = aufAufgaben();
  if (!l.length) {
    return h + '<p class="leise">' + (liste ? 'In „' + esc(liste.titel) + '“ ist nichts offen.' : 'Keine offenen Aufgaben.') + '</p>';
  }
  var rest = {};
  if (cl.auf.naechste) { var n = aufNaechste(l); l = n.zeilen; rest = n.rest; }
  var herkunft = !liste;
  if (ansicht === 'prio') {
    return h + aufSortiert(l, 'prio').map(function (x) { return aufZeileHtml(x, { herkunft: herkunft }); }).join('');
  }
  if (ansicht === 'geplant') {
    var tag = null;
    aufSortiert(l, 'geplant').forEach(function (x) {
      if (x.datum !== tag) {
        tag = x.datum;
        h += '<div class="zw">' + (!tag ? 'Ohne Datum' : (tag === isoDatum() ? 'Heute' : esc(clWt(tag) + ' ' + clKurzDatum(tag)))) + '</div>';
      }
      h += aufZeileHtml(x, { herkunft: herkunft, ohneTag: true });
    });
    return h;
  }
  /* Gruppiert: je Seite ihre Aufgaben in der Reihenfolge der Seite */
  var seitenId = '';
  l.forEach(function (x) {
    if (!liste && x.seite.id !== seitenId) {
      seitenId = x.seite.id;
      h += '<button type="button" class="gruppe klick" onclick="aufGanzUm(\'' + esc(x.seite.id) + '\')"><span>'
         + esc(clSeitenZeichen(x.seite) + ' ' + x.seite.titel) + '</span><small>' + esc(aufGruppenZahl(x.seite)) + '</small></button>';
    }
    h += aufZeileHtml(x, { mehr: rest[x.seite.id] && !x.a.erledigt ? rest[x.seite.id] : 0 });
  });
  return h;
}

/* Zahl rechts an der Gruppe: offene Aufgaben — bei Checklisten Stand und Geplantes */
function aufGruppenZahl(s) {
  if (!aufIstCheckliste(s)) { return String(kpOffeneZahl(s)); }
  var st = clsStand(s.__satz);
  var geplant = String(s.text || '').split('\n').filter(function (z) {
    var a = kpAufgabe(z);
    return a && a.text && !a.erledigt && !!aufGeplant(s, a.text);
  }).length;
  return st.fertig + '/' + st.alle + ' · ' + geplant + ' geplant';
}

function aufAnsicht(a) {
  if (!AUF_ANSICHTEN.some(function (x) { return x[0] === a; })) { return; }
  cl.auf.ansicht = a;
  try { window.localStorage.setItem(AUF_ANSICHT_KEY, a); } catch (e) { /* nur für jetzt */ }
  zeichne();
}

function aufNaechsteUm() {
  cl.auf.naechste = !cl.auf.naechste;
  cl.auf.ganz = {};
  try { window.localStorage.setItem(AUF_NAECHSTE_KEY, cl.auf.naechste ? 'an' : 'aus'); } catch (e) { /* nur für jetzt */ }
  zeichne();
}

/* Bei „1. Nächste“: eine Seite ganz zeigen (und wieder einklappen) */
function aufGanzUm(id) {
  if (!cl.auf.naechste) { return; }
  if (cl.auf.ganz[id]) { delete cl.auf.ganz[id]; } else { cl.auf.ganz[id] = true; }
  inhaltZeichnen();
}

function aufFussHtml() {
  return '<button type="button" class="knopf" onclick="aufNeu()">Neu</button>'
    + '<button type="button" class="knopf" onclick="aufDetailsGewaehlt()">Details…</button>';
}

function aufErlUm() {
  cl.auf.erlZeigen = !cl.auf.erlZeigen;
  cl.aufklapp = '';
  zeichne();
}

function aufHaken(seiteId, nr) {
  var s = kpSeiteFinden(seiteId);
  if (!s || !kpSeiteKastenUmKern(s, nr)) { return; }
  cl.auf.frisch[aufSchluessel(s, nr)] = true;
  spaeterSichern();
  zeichne();
}

/* Erster Tipp wählt aus, zweiter öffnet die Details */
function aufTippen(seiteId, nr) {
  var key = seiteId + '|' + nr;
  if (cl.auf.wahl === key) { aufDetails(seiteId, nr); return; }
  cl.auf.wahl = key;
  inhaltZeichnen();
}

function aufDetailsGewaehlt() {
  var t = String(cl.auf.wahl || '').split('|');
  if (t.length !== 2) { melde('Erst eine Aufgabe antippen, dann „Details…“.', null); return; }
  aufDetails(t[0], Number(t[1]));
}

/* ---- Fenster: Neu und Details ---- */

function aufNeu() {
  var liste = aufListe();
  cl.auf.fenster = { modus: 'neu', seite: liste ? liste.id : '', nr: -1, text: '', datum: '', zeit: '', mitZeit: false, ausKalender: false };
  cl.aufklapp = 'aufgabe';
  aufklappNeu();
}

/* Aus dem Kalender: neue Aufgabe für den gezeigten Tag */
function aufNeuAm(datum, zeit) {
  var liste = aufListe();
  cl.auf.fenster = { modus: 'neu', seite: liste ? liste.id : '', nr: -1, text: '', datum: (datum >= isoDatum()) ? datum : isoDatum(),
                     zeit: zeit || '', mitZeit: !!zeit, ausKalender: true };
  cl.aufklapp = 'aufgabe';
  aufklappNeu();
}

function aufDetails(seiteId, nr) {
  var s = kpSeiteFinden(seiteId);
  /* Checklisten-Punkt (seit 0.17): dort einplanen und bearbeiten */
  if (aufIstCheckliste(s)) { aufklappZuStill(); oeffne('checklisten'); clsOeffnen(s.id); return; }
  var zeilen = s ? String(s.text || '').split('\n') : [];
  var a = (nr >= 0 && nr < zeilen.length) ? kpAufgabe(zeilen[nr]) : null;
  if (!a) { return; }
  var g = a.erledigt ? null : aufGeplant(s, a.text);
  cl.auf.wahl = seiteId + '|' + nr;
  cl.auf.fenster = { modus: 'details', seite: s.id, quelle: s.id, nr: nr, alt: a.text, text: kpPrio(a.text).text, prio: kpPrio(a.text).p, erledigt: a.erledigt,
                     datum: g ? g.datum : '', zeit: g ? g.zeit : '', mitZeit: !!(g && g.zeit), ausKalender: false };
  cl.aufklapp = 'aufgabe';
  aufklappNeu();
}

function aufklappNeu() {
  var el = document.getElementById('aufklapp');
  if (el) { el.innerHTML = ''; }
  kopfZeichnen();
  aufklappZeichnen();
}

/* Getipptes ins Fenster-Objekt übernehmen, bevor neu gezeichnet wird */
function aufFensterLesen() {
  var f = cl.auf.fenster;
  if (!f) { return null; }
  var t = document.getElementById('aufText');
  var d = document.getElementById('aufDatum');
  var z = document.getElementById('aufZeit');
  if (t && typeof t.value === 'string') { f.text = t.value; }
  if (d && typeof d.value === 'string') { f.datum = d.value; }
  if (z && typeof z.value === 'string') { f.zeit = z.value; }
  return f;
}

/* „Uhrzeit“ blendet das Feld ein; ohne Datum gilt heute */
function aufUhrzeitUm() {
  var f = aufFensterLesen();
  if (!f) { return; }
  f.mitZeit = !f.mitZeit;
  if (f.mitZeit) {
    if (!f.datum) { f.datum = isoDatum(); }
    if (!f.zeit) { f.zeit = zwei(Math.min(new Date().getHours() + 1, 23)) + ':00'; }
  } else {
    f.zeit = '';
  }
  aufklappNeu();
}

function aufDatumWeg() {
  var f = aufFensterLesen();
  if (!f) { return; }
  f.datum = '';
  f.zeit = '';
  f.mitZeit = false;
  aufklappNeu();
}

function aufFensterHtml() {
  var f = cl.auf.fenster;
  if (!f) { return ''; }
  if (f.modus === 'loeschen') {
    return '<div class="fenster"><div class="titel">Aufgabe löschen</div><div class="rumpf">'
      + '<p>„' + esc(f.alt) + '“ aus „' + esc((kpSeiteFinden(f.quelle) || {}).titel || '') + '“ löschen?</p>'
      + '<div class="knoepfe"><button type="button" class="knopf voll" onclick="aufLoeschen()">Löschen</button>'
      + '<button type="button" class="knopf" onclick="aufZurueckZuDetails()">Abbrechen</button></div></div></div>';
  }
  var seite = f.seite ? kpSeiteFinden(f.seite) : null;
  var ok = !!(seite && String(f.text || '').trim());
  var plan = f.erledigt ? '' : '<label for="aufDatum">Datum:</label><div class="zeitpaar">'
    + '<input id="aufDatum" class="eingabe" type="date" min="' + isoDatum() + '" value="' + esc(f.datum) + '">'
    + (f.datum ? '<button type="button" class="knopf" onclick="aufDatumWeg()" aria-label="nicht einplanen">✕</button>' : '') + '</div>'
    + '<div class="zeitpaar"><button type="button" class="knopf' + (f.mitZeit ? ' voll' : '') + '" onclick="aufUhrzeitUm()">Uhrzeit</button>'
    + (f.mitZeit ? '<input id="aufZeit" class="eingabe zeitfeld" type="time" value="' + esc(f.zeit) + '" aria-label="Uhrzeit">'
                 + '<button type="button" class="knopf" onclick="aufUhrzeitUm()" aria-label="ohne Uhrzeit">✕</button>' : '') + '</div>';
  return '<div class="fenster"><div class="titel">' + (f.modus === 'neu' ? (f.ausKalender ? 'Neu' : 'Neue Aufgabe') : 'Aufgabe') + '</div><div class="rumpf">'
    + (f.ausKalender ? '<div class="wahlreihe"><button type="button" onclick="terminStatt()">Termin</button><button type="button" class="an">Aufgabe</button></div>' : '')
    + '<label for="aufText">Aufgabe:</label><input id="aufText" class="eingabe" type="text" autocomplete="off" value="' + esc(f.text) + '"'
    + ' oninput="aufTextGetippt()">'
    + '<label>Priorität:</label><div class="wahlreihe">' + [0, 1, 2, 3].map(function (p) {
        return '<button type="button"' + ((f.prio || 0) === p ? ' class="an"' : '') + ' onclick="aufPrioWahl(' + p + ')">' + (p || '–') + '</button>';
      }).join('') + '</div>'
    + '<label>Liste:' + (f.modus === 'neu' ? ' (Pflicht)' : '') + '</label>'
    + '<button type="button" class="eingabe wahlfeld' + (seite ? '' : ' pflicht') + '" onclick="listenwahlOeffnen(\'aufgabe\')">'
    + (seite ? clSeitenZeichen(seite) + ' ' + esc(seite.titel) : '▼ bitte wählen') + '</button>'
    + plan
    + '<div class="knoepfe"><button type="button" id="aufOk" class="knopf voll"' + (ok ? '' : ' disabled') + ' onclick="aufSpeichern()">OK</button>'
    + '<button type="button" class="knopf" onclick="aufklappZu()">Abbrechen</button></div>'
    + (f.modus === 'details' ? '<div class="knoepfe"><button type="button" class="knopf" onclick="memoZeile(\'' + esc(f.quelle) + '\',' + f.nr + ')">'
      + (((kpSeiteFinden(f.quelle) || {}).art === 'liste') ? 'Liste zeigen' : 'Im Memo zeigen') + '</button>'
      + '<button type="button" class="knopf" onclick="aufLoeschenFragen()">Löschen…</button></div>' : '')
    + (f.modus === 'neu' && !seite ? '<p class="leise">OK geht erst, wenn eine Liste gewählt ist.</p>' : '')
    + '</div></div>';
}

/* Im Kalender-Fenster „Neu“ zurück zum Termin */
function terminStatt() {
  if (!tokenGueltig()) { melde('Termine gehen nur mit Verbindung zu Google.\nBitte oben „Verbinden“ tippen.', 'warn'); return; }
  var f = aufFensterLesen();
  var d = (f && f.datum) || clKalDatum();
  var z = (f && f.mitZeit && f.zeit) ? f.zeit : '';
  cl.auf.fenster = null;
  terminNeu(d, z);
}

/* OK wird erst bedienbar, wenn Text und Liste da sind */
function aufTextGetippt() {
  var f = aufFensterLesen();
  var ok = document.getElementById('aufOk');
  if (f && ok) { ok.disabled = !(f.seite && String(f.text || '').trim()); }
}

function aufLoeschenFragen() {
  var f = aufFensterLesen();
  if (!f) { return; }
  f.modus = 'loeschen';
  aufklappNeu();
}

function aufZurueckZuDetails() {
  var f = cl.auf.fenster;
  if (!f) { return; }
  f.modus = 'details';
  aufklappNeu();
}

/* Die Zeile einer Seite finden, auch wenn sich die Nummer verschoben hat */
function aufZeileNr(seite, nr, text) {
  var zeilen = String(seite.text || '').split('\n');
  var a = (nr >= 0 && nr < zeilen.length) ? kpAufgabe(zeilen[nr]) : null;
  if (a && a.text === text) { return nr; }
  var z = kpZeileSuchen(seite, text);
  return z ? z.nr : -1;
}

function aufZeileAnhaengen(seite, text) {
  var t = String(seite.text || '');
  if (t && !/\n$/.test(t)) { t += '\n'; }
  seite.text = t + '[] ' + text;
  seite.geaendert = jetzt();
  return String(seite.text).split('\n').length - 1;
}

/* Einplanen für einen Tag — mit oder ohne Uhrzeit — oder herausnehmen.
   Ein Tag statt eines anderen: am alten Tag heraus, am neuen hinein. */
function aufPlanAnwenden(seite, nr, datum, zeit) {
  var zeilen = String(seite.text || '').split('\n');
  var a = kpAufgabe(zeilen[nr] || '');
  if (!a || !a.text) { return; }
  var tage = kpEintraegeFinden(seite.id, a.text).filter(function (f) { return !!f.woche.datum; });
  var bleibt = null;
  tage.forEach(function (f) {
    if (datum && f.woche.datum === datum && !bleibt) { bleibt = f; return; }
    kpAusplanenKern(f.woche.id, f.eintrag.id);
  });
  if (!datum) { return; }
  if (!bleibt) {
    var b = kpPlanenKern(seite, nr, 'h', datum);
    if (!b) { return; }
    bleibt = { woche: b, eintrag: b.eintraege[b.eintraege.length - 1] };
  }
  if (/^\d{2}:\d{2}$/.test(String(zeit || ''))) { bleibt.eintrag.zeit = zeit; }
  else { delete bleibt.eintrag.zeit; }
  bleibt.woche.geaendert = jetzt();
}

/* Neuer Text einer Aufgabe: in der Seite und in Tag und Woche */
function aufTextAendern(seite, nr, alt, neu) {
  var zeilen = String(seite.text || '').split('\n');
  var m = String(zeilen[nr] || '').match(/^(\s*\[[ xX-]?\]\s*)/);
  if (!m) { return; }
  kpEintraegeFinden(seite.id, alt).forEach(function (f) {
    var z = kpZeileSuchen(f.woche, f.eintrag.text);
    if (z) {
      var bz = String(f.woche.text || '').split('\n');
      var bm = String(bz[z.nr]).match(/^(\s*\[[ xX-]?\]\s*)/);
      if (bm) { bz[z.nr] = bm[1] + neu; f.woche.text = bz.join('\n'); }
    }
    f.eintrag.text = neu;
    f.woche.geaendert = jetzt();
  });
  zeilen[nr] = m[1] + neu;
  seite.text = zeilen.join('\n');
  seite.geaendert = jetzt();
}

/* In eine andere Liste: Zeile umziehen, Planung zieht mit */
function aufVerschieben(von, nr, nach) {
  var zeilen = String(von.text || '').split('\n');
  var a = kpAufgabe(zeilen[nr] || '');
  if (!a) { return -1; }
  var funde = a.text ? kpEintraegeFinden(von.id, a.text) : [];
  var zeile = zeilen.splice(nr, 1)[0];
  von.text = zeilen.join('\n');
  von.geaendert = jetzt();
  var t = String(nach.text || '');
  if (t && !/\n$/.test(t)) { t += '\n'; }
  nach.text = t + zeile.replace(/^\s+/, '');
  nach.geaendert = jetzt();
  funde.forEach(function (f) { f.eintrag.quelle = nach.id; f.woche.geaendert = jetzt(); });
  return String(nach.text).split('\n').length - 1;
}

function aufSpeichern() {
  var f = aufFensterLesen();
  if (!f) { return; }
  /* Priorität: aus der Wahl im Fenster — oder wie getippt („P2 …“) */
  var getippt = kpPrio(kpSchluessel(f.text));
  var text = kpSchluessel(getippt.text) ? kpPrioText(kpSchluessel(getippt.text), f.prioGesetzt ? f.prio : (getippt.p || f.prio || 0)) : '';
  var seite = f.seite ? kpSeiteFinden(f.seite) : null;
  if (!seite) { melde('Bitte eine Liste wählen.', 'warn'); return; }
  if (!text) { melde('Bitte die Aufgabe eingeben.', 'warn'); return; }
  var datum = String(f.datum || '');
  var zeit = f.mitZeit ? String(f.zeit || '') : '';
  if (datum && (!/^\d{4}-\d{2}-\d{2}$/.test(datum) || datum < isoDatum())) { melde('Bitte heute oder einen späteren Tag wählen.', 'warn'); return; }
  if (f.mitZeit && !/^\d{2}:\d{2}$/.test(zeit)) { melde('Bitte eine Uhrzeit wählen.', 'warn'); return; }
  var nr;
  if (f.modus === 'neu') {
    nr = aufZeileAnhaengen(seite, text);
    melde('Aufgabe in „' + seite.titel + '“ angelegt.', 'gut');
  } else {
    var quelle = kpSeiteFinden(f.quelle);
    if (!quelle) { aufklappZu(); return; }
    nr = aufZeileNr(quelle, f.nr, f.alt);
    if (nr < 0) { melde('Die Aufgabe hat sich inzwischen geändert.', 'warn'); aufklappZu(); return; }
    if (text !== f.alt) { aufTextAendern(quelle, nr, f.alt, text); }
    if (seite.id !== quelle.id) { nr = aufVerschieben(quelle, nr, seite); }
  }
  if (!f.erledigt && nr >= 0) { aufPlanAnwenden(seite, nr, datum, zeit); }
  zuletztMerken(seite.id);
  cl.auf.wahl = '';
  spaeterSichern();
  aufklappZu();
  /* Größeres hinterfragt der Coach gleich (seit 0.33) */
  if (f.modus === 'neu' && coVorabNoetig(text, datum)) { coVorabAuf({ art: 'aufgabe', text: text, seite: seite.id, datum: datum }); }
}

function aufLoeschen() {
  var f = cl.auf.fenster;
  var s = f ? kpSeiteFinden(f.quelle) : null;
  if (!s) { aufklappZu(); return; }
  var nr = aufZeileNr(s, f.nr, f.alt);
  if (nr < 0) { aufklappZu(); return; }
  /* Erst aus Tag und Woche nehmen, dann aus der Seite */
  kpEintraegeFinden(s.id, f.alt).forEach(function (x) { kpAusplanenKern(x.woche.id, x.eintrag.id); });
  var zeilen = String(s.text || '').split('\n');
  zeilen.splice(nr, 1);
  s.text = zeilen.join('\n');
  s.geaendert = jetzt();
  cl.auf.wahl = '';
  spaeterSichern();
  aufklappZu();
  melde('Aufgabe gelöscht.', null);
}

function listeLoeschen() {
  var n = cl.auf.neueListe;

  try { window.localStorage.setItem(ZULETZT_KEY, JSON.stringify(zuletztListe().filter(function (x) { return x !== s.id; }))); } catch (e) { /* nur für jetzt */ }

  spaeterSichern();

}

  cl.auf.neueListe = null;
  zuletztMerken(s.id);
  spaeterSichern();

    cl.auf.fenster.seite = s.id;
    cl.aufklapp = 'aufgabe';
    aufklappNeu();
    return;
  }
  aufListeSetzen(s.id);
}

/* ---------- Memo (seit 0.3) ----------

   Alle Seiten der Workbench als Memos: Projekte, Ziele, Listen und
   Notizen. Lesen, abhaken, schreiben, Details. Gerade laufende Seiten;
   Ruhendes und Erledigtes bleibt der Workbench. */

/* Seit 0.6 ohne Listen — die sind Kategorien der Aufgaben. */
/* Seit 0.12.2 auch ruhende und abgeschlossene Projekte und Ziele —
   die Liste gruppiert sie (Ruhend, Abgeschlossen eingeklappt). */
function memoSeiten() {
  return kpNachRang(kpSeitenAlle().filter(function (s) {
    if (s.art === 'liste') { return false; }
    if (s.art === 'notiz' && s.__satz && s.__satz.checkliste) { return false; }
    return kpPasstFilter(s, cl.filter);
  }));
}

/* Seit 0.36: Bereiche als Auswahl (▼) statt einer langen Liste */
var MEMO_BEREICHE = [['projekte', 'Projekte'], ['ziele', 'Ziele'], ['notizen', 'Notizen'], ['ruhend', 'Ruhend'], ['fertig', 'Abgeschlossen']];
var MEMO_BEREICH_KEY = 'clie-memo-bereich';

function memoBereichLaden() {
  var b = '';
  try { b = window.localStorage.getItem(MEMO_BEREICH_KEY) || ''; } catch (e) { b = ''; }
  return MEMO_BEREICHE.some(function (x) { return x[0] === b; }) ? b : 'projekte';
}

/* Die Seiten eines Bereichs (nach Filter ▼ Alle/Beruf/Privat) */
function memoBereichSeiten(b) {
  return memoSeiten().filter(function (s) {
    if (b === 'notizen') { return s.art === 'notiz'; }
    if (s.art !== 'vorhaben') { return false; }
    if (b === 'ruhend') { return s.zustand === 'ruht'; }
    if (b === 'fertig') { return s.zustand === 'erledigt'; }
    return s.zustand === 'laeuft' && (b === 'ziele' ? s.typ === 'ziel' : s.typ !== 'ziel');
  });
}

function memoBereichName(b) {
  return (MEMO_BEREICHE.filter(function (x) { return x[0] === b; })[0] || ['', 'Projekte'])[1];
}

function memoListeHtml() {
  /* Erst beim ersten Zeichnen laden — die Bereiche stehen weiter unten im Code */
  if (!cl.memo.bereich) { cl.memo.bereich = memoBereichLaden(); }
  var b = cl.memo.bereich;
  var l = memoBereichSeiten(b);
  var h = '<button type="button" class="memo-bereich' + (cl.aufklapp === 'memobereich' ? ' an' : '') + '" onclick="memoBereichAuf()">▼ ' + esc(memoBereichName(b)) + ' <span>' + l.length + '</span></button>';
  if (!l.length) { return h + '<p class="leise">Keine ' + esc(memoBereichName(b)) + '.</p>'; }
  return h + l.map(function (s) {
    var n = kpOffeneZahl(s);
    return '<button type="button" class="memo-zeile" onclick="memoOeffnen(\'' + esc(s.id) + '\')"><span class="mz">' + clSeitenZeichen(s) + '</span>'
      + '<span class="tx">' + esc(s.titel) + '</span><span class="q">' + (n ? n : '') + '</span></button>';
  }).join('');
}

function memoBereichAuf() {
  cl.aufklapp = (cl.aufklapp === 'memobereich') ? '' : 'memobereich';
  aufklappZeichnen();
  /* Die Auswahl hängt direkt unter dem Knopf — egal, wie hoch der Kopf gerade ist */
  var knopf = document.querySelector('.memo-bereich');
  var liste = document.querySelector('.memo-bereich-auf');
  if (knopf && liste && typeof knopf.getBoundingClientRect === 'function' && typeof window.getComputedStyle === 'function') {
    var oben = parseFloat(window.getComputedStyle(liste).top) || 0;
    liste.style.top = (oben + knopf.getBoundingClientRect().bottom - liste.getBoundingClientRect().top + 2) + 'px';
  }
}

function memoBereichHtml() {
  return '<div class="aufklapp memo-bereich-auf">' + MEMO_BEREICHE.map(function (x) {
    return '<button type="button"' + (x[0] === cl.memo.bereich ? ' class="an"' : '') + ' onclick="memoBereichSetzen(\'' + x[0] + '\')">' + x[1]
      + ' <span class="leise">' + memoBereichSeiten(x[0]).length + '</span></button>';
  }).join('') + '</div>';
}

function memoBereichSetzen(b) {
  if (!MEMO_BEREICHE.some(function (x) { return x[0] === b; })) { return; }
  cl.memo.bereich = b;
  try { window.localStorage.setItem(MEMO_BEREICH_KEY, b); } catch (e) { /* nur für jetzt */ }
  cl.aufklapp = '';
  zeichne();
}

/* Eine Seite lesen: Überschriften, Text, Aufgaben zum Abhaken */
function memoSeiteHtml(s) {
  var h = '';
  if (s.art === 'vorhaben') {
    var zt = s.termin ? (s.typ === 'ziel' ? 'Zieltermin ' : 'Ende ') + clKurzDatum(s.termin) + s.termin.slice(0, 4) : '';
    h += '<div class="memo-kopf leise">' + (s.typ === 'ziel' ? 'Ziel' : 'Projekt') + (zt ? ' · ' + esc(zt) : '') + '</div>';
  }
  if (cl.memo.schreiben) {
    /* Seit 0.38 die volle Leiste: wie die Workbench, aber nur das Nötige */
    return h + '<div class="schreibleiste">' + MEMO_LEISTE.map(function (k) {
        return '<button type="button" onmousedown="event.preventDefault()" onclick="memoZeichen(\'' + k[0] + '\')" aria-label="' + k[2] + '">' + k[1] + '</button>';
      }).join('') + '</div>'
      + '<textarea id="memoFeld" class="memo-feld" spellcheck="true" oninput="memoTextGetippt()" onkeydown="memoTaste(event)">' + esc(s.text) + '</textarea>';
  }
  var zeilen = String(s.text || '').split('\n');
  if (!zeilen.join('').trim()) { return h + '<p class="leise">Noch leer — „Schreiben“ tippen.</p>'; }
  var tabelle = [];
  var tabelleAus = function () {
    if (!tabelle.length) { return; }
    h += memoTabelleHtml(tabelle);
    tabelle = [];
  };
  zeilen.forEach(function (z, nr) {
    /* Tabellen: aufeinanderfolgende Zeilen mit | */
    if (/^\s*\|.*\|\s*$/.test(z)) { tabelle.push(z); return; }
    tabelleAus();
    var a = kpAufgabe(z);
    var hervor = (cl.memo.hervor && a && a.text === cl.memo.hervor) ? ' hervor' : '';
    if (a) {
      h += '<div class="aufg' + (a.erledigt ? ' erl' : '') + hervor + '" id="memoZ' + nr + '">'
         + clKastenHtml(a.erledigt, 'memoHaken(\'' + esc(s.id) + '\',' + nr + ')')
         + '<button type="button" class="tx umbruch" onclick="aufDetails(\'' + esc(s.id) + '\',' + nr + ')">' + (clPrioHtml(a.text) || ' ') + '</button>'
         + clPlanMarke(s, a) + '</div>';
      return;
    }
    var m = z.match(/^\s*(#{1,3})\s+(.*)$/);
    if (m) { h += '<div class="memo-h' + m[1].length + '">' + kpAuszeichnen(m[2]) + '</div>'; return; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(z)) { h += '<div class="memo-trenn"></div>'; return; }
    var p = z.match(/^(\s*)[-•*]\s+(.*)$/);
    if (p) { h += '<div class="memo-punkt" style="padding-left:' + Math.min(4, Math.floor(p[1].length / 2)) * 16 + 'px">▪ ' + kpAuszeichnen(p[2]) + '</div>'; return; }
    var n = z.match(/^(\s*)(\d{1,3})[.)]\s+(.*)$/);
    if (n) { h += '<div class="memo-punkt" style="padding-left:' + Math.min(4, Math.floor(n[1].length / 2)) * 16 + 'px"><span class="nr">' + n[2] + '.</span> ' + kpAuszeichnen(n[3]) + '</div>'; return; }
    h += z.trim() ? '<div class="memo-text">' + kpAuszeichnen(z) + '</div>' : '<div class="memo-leer"></div>';
  });
  tabelleAus();
  return h;
}

/* Eine Tabelle aus |-Zeilen; die Trennzeile |---|---| fällt weg */
function memoTabelleHtml(zeilen) {
  var trenn = function (z) { return /^\s*\|?[\s:|-]+\|?\s*$/.test(z) && /-{2,}/.test(z); };
  var zellen = function (z) { return z.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); }); };
  var kopf = (zeilen.length > 1 && trenn(zeilen[1])) ? zellen(zeilen[0]) : null;
  var reihen = zeilen.slice(kopf ? 2 : 0).filter(function (z) { return !trenn(z); }).map(zellen);
  return '<div class="memo-tabelle"><table>'
    + (kopf ? '<tr>' + kopf.map(function (c) { return '<th>' + kpAuszeichnen(c) + '</th>'; }).join('') + '</tr>' : '')
    + reihen.map(function (row) { return '<tr>' + row.map(function (c) { return '<td>' + kpAuszeichnen(c) + '</td>'; }).join('') + '</tr>'; }).join('')
    + '</table></div>';
}
