    sd.sicht = 'fach';
    sd.seiteId = s.id;
    sdFensterZu();
    zeichne();
    melde('Seite „' + name + '“ in „' + fach.name + '“ angelegt.', 'gut');
    return;
  }

  var seite = sdSeite(fach, w.seiteId);
  if (!seite) { melde('Keine Seite gewählt, unter die die Unterseite gehört.', 'warn'); return; }
  sdUnterNeu(seite, name, i.onenote, i.web);
  sd.fachId = fach.id;
  sd.sicht = 'fach';
  sd.seiteId = seite.id;
  sdFensterZu();
  zeichne();
  melde('Unterseite „' + name + '“ unter „' + seite.name + '“ angelegt.', 'gut');
}

/* Der Griff am Fenster: Strg+V. Nicht, während ein Fenster offen ist
   oder in einem Eingabefeld — dort soll Einfügen einfügen. */
function sdEingefuegt(ereignis) {
  if (sd.fenster) { return; }
  var z = ereignis.target;
  var tag = z && z.tagName ? String(z.tagName).toLowerCase() : '';
  if (tag === 'input' || tag === 'textarea' || (z && z.isContentEditable)) { return; }
  var daten = ereignis.clipboardData;
  if (!daten) { return; }
  var text = '';
  try { text = daten.getData('text/plain') || daten.getData('text/uri-list') || ''; }
  catch (e) { text = ''; }
  var i = sdLinkLesen(text);
  if (!i.onenote && !i.web) {
    melde('In der Zwischenablage steht keine onenote:- oder https-Adresse.', 'warn');
    return;
  }
  ereignis.preventDefault();
  sdEinfuegenFenster(i);
}

/* ---------- Steller ---------- */

function sdTeile(schluessel) { return String(schluessel || '').split('|'); }

/* Fächer verschieben — innerhalb ihrer Reihe. „Eigene Fächer“ und
   „Zusammenarbeit“ sind zwei Reihen, aber eine Liste: Geschoben wird
   gegen den Nachbarn derselben Reihe, sonst spränge ein Fach beim
   Verschieben unversehens in die andere Reihe. */
function sdFachStellen(id, was) {
  var f = sdFach(id);
  if (!f) { return; }
  if (was === 'aendern') { sdFachFenster(id, ''); return; }
  if (was === 'weg') {
    sdEntfernen(DB.faecher, id);
    if (sd.fachId === id) { sd.fachId = ''; sd.sicht = 'tisch'; }
    zeichne();
    return;
  }
  var reihe = sdFaecher(f.reihe);
  var i = reihe.map(function (x) { return x.id; }).indexOf(id);
  var j = i + (was === 'hoch' ? -1 : 1);
  if (j < 0 || j >= reihe.length) { return; }
  var g = reihe[j];
  /* Getauscht wird mit dem Nachbarn derselben Reihe, auch wenn in der
     Gesamtliste eines der anderen Reihe dazwischenliegt. Darum hier
     nicht sdSchieben: das bewegt immer nur eine Stelle in der ganzen
     Liste und träfe dann den falschen. */
  var o = f.ordnung;
  f.ordnung = g.ordnung;
  g.ordnung = o;
  sdStempeln(f);
  sdStempeln(g);
  var ia = DB.faecher.indexOf(f);
  var ib = DB.faecher.indexOf(g);
  DB.faecher[ia] = g;
  DB.faecher[ib] = f;
  sdGeaendert();
  zeichne();
}

function sdSeiteStellen(schluessel, was) {
  var t = sdTeile(schluessel);
  var f = sdFach(t[0]);
  if (!f) { return; }
  if (was === 'aendern') { sdSeiteFenster(t[1]); return; }
  if (was === 'weg') { sdEntfernen(f.seiten, t[1]); if (sd.seiteId === t[1]) { sd.seiteId = ''; } }
  else { sdSchieben(f.seiten, t[1], was === 'hoch' ? -1 : 1); }
  sdFlaecheZeichnen();
}

function sdUnterStellen(schluessel, was) {
  var t = sdTeile(schluessel);
  var f = sdFach(t[0]);
  var s = sdSeite(f, t[1]);
  if (!s) { return; }
  if (was === 'aendern') { sdUnterFenster(t[1], t[2]); return; }
  if (was === 'weg') { sdEntfernen(s.unter, t[2]); }
  else { sdSchieben(s.unter, t[2], was === 'hoch' ? -1 : 1); }
  sdFlaecheZeichnen();
}

function sdLeisteStellen(schluessel, was) {
  var t = sdTeile(schluessel);
  var f = sdFach(t[0]);
  if (!f) { return; }
  if (was === 'aendern') { sdLeisteFenster(t[1]); return; }
  if (was === 'weg') { sdEntfernen(f.leiste, t[1]); }
  else { sdSchieben(f.leiste, t[1], was === 'hoch' ? -1 : 1); }
  zeichne();
}

/* ---------- Start ---------- */

/* Die fünf Einträge der Planungsleiste bekommen feste Kennungen statt
   gewürfelter. Sonst legte jedes Gerät beim ersten Start seine eigenen
   fünf an, und der Abgleich hätte am Ende zehn. Und sie tragen den
   Stempel 0: Sie sind eine Voreinstellung, keine Eingabe — ein von Hand
   eingetragener Link gewinnt deshalb immer gegen sie. Einen gelöschten
   Eintrag legt die App nicht wieder an; dafür ist der Grabstein da. */
function sdPlanungSichern() {
  if (DB.planung.length) { return; }
  var tot = DB.grabsteine || {};
  DB.planung = SD_PLANUNG_VOR.filter(function (n) {
    return !tot['pl-' + sdSchluessel(n)];
  }).map(function (n, i) {
    return { id: 'pl-' + sdSchluessel(n), name: n, link: '', ordnung: i, geaendert: 0 };
  });
}

/* Aus „Offene Fragen“ wird „offene-fragen“ — eine feste, lesbare Kennung. */
function sdSchluessel(text) {
  return String(text).toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function sdStart() {
  sdZoomLesen();
  sdBreite();
  return sdLaden().then(function () {
    sdPlanungSichern();
    zeichne();
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('resize', function () { sdBreite(); zeichne(); });
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { sdFensterZu(); }
      });
      document.addEventListener('paste', sdEingefuegt);
    }
    if (sdHaken.beimStart) { sdHaken.beimStart(); }
    return true;
  });
}

if (typeof window !== 'undefined' && typeof document !== 'undefined' && document.getElementById('flaeche')) {
  sdStart();
}


/* ============================================================
   sd_wolke.js — Google Drive für die private Fassung

   Diese Datei wird NUR in schreibtisch.html eingebaut. Die berufliche
   Fassung enthält sie nicht: nicht abgeschaltet, nicht versteckt, nicht
   vorhanden. bauen.py baut sie dort gar nicht erst ein, und SD-14 prüft
   das an der fertigen Datei nach.

   Muster und Formulierungen aus der WorkBench, bis hin zu den Namen —
   derselbe Google-Klient, dasselbe Vorgehen, nur eine eigene Datei
   (schreibtisch.json) und nur das Recht drive.file.

   Nahtlos heißt hier: kein Knopf. Beim Start wird geholt, nach jeder
   Änderung mit Verzug hochgeladen, im Takt nachgesehen. Reibung gibt es
   nur, wenn etwas schiefgeht.
   ============================================================ */

'use strict';

var SW_CLIENT_ID = '347268246401-9ktgd8q5caq6v5nma36i3e38u9c37bre.apps.googleusercontent.com';
var SW_SCOPES = 'https://www.googleapis.com/auth/drive.file';
var SW_GIS_URL = 'https://accounts.google.com/gsi/client';
var SW_DATEI = 'schreibtisch.json';
var SW_TOKEN_KEY = 'schreibtisch-zugriff';
var SW_ANMELDE_MERKER = 'schreibtisch-war-angemeldet';

var SW_VERZUG = 4000;        /* so lange nach der letzten Änderung wird gewartet */
var SW_MINDEST = 20000;      /* nicht öfter als alle 20 Sekunden von selbst */
var SW_TAKT = 30000;         /* alle 30 Sekunden bei Drive nachsehen */
var SW_VORLAUF = 5 * 60 * 1000;   /* so lange vor Ablauf wird still erneuert */
var SW_ERNEUERUNG_MAX = 5;
var SW_ERNEUERUNG_ABSTAND = 30000;

var swToken = null;
var swAblauf = 0;
var swKlient = null;
var swDateiId = '';
var swStand = '';
var swUhr = null;
var swTaktUhr = null;
var swLetzter = 0;
var swLaeuft = false;
var swErneuerungsUhr = null;
var swErneuerungVersuche = 0;
var swZustand = 'aus';       /* aus | an | laeuft | fehler */
var swText = '';

/* ---------- Anmeldung ---------- */

function swGisLaden() {
  if (window.google && window.google.accounts && window.google.accounts.oauth2) {
    return Promise.resolve(true);
  }
  return new Promise(function (ja, nein) {
    var s = document.createElement('script');
    s.src = SW_GIS_URL;
    s.async = true;
    s.onload = function () { ja(true); };
    s.onerror = function () { nein(new Error('Google ließ sich nicht laden.')); };
    document.head.appendChild(s);
  });
}

function swTokenGueltig() {
  return !!swToken && swAblauf > Date.now();
}

function swRestMinuten() {
  if (!swTokenGueltig()) { return 0; }
  return Math.max(0, Math.round((swAblauf - Date.now()) / 60000));
}

function swTokenMerken(token, sekunden) {
  swToken = token;
  swAblauf = Date.now() + (sekunden || 3600) * 1000 - 30000;
  try {
    window.sessionStorage.setItem(SW_TOKEN_KEY, JSON.stringify({ t: swToken, a: swAblauf }));
    window.localStorage.setItem(SW_ANMELDE_MERKER, '1');
  } catch (e) { /* egal */ }
  swErneuerungPlanen();
}

function swTokenHolen() {
  try {
    var roh = window.sessionStorage.getItem(SW_TOKEN_KEY);
    if (!roh) { return false; }
    var d = JSON.parse(roh);
    if (d && d.t && d.a > Date.now()) { swToken = d.t; swAblauf = d.a; return true; }
  } catch (e) { /* egal */ }
  return false;
}

function swTokenVergessen() {
  swToken = null;
  swAblauf = 0;
  if (swErneuerungsUhr) { window.clearTimeout(swErneuerungsUhr); swErneuerungsUhr = null; }
  try { window.sessionStorage.removeItem(SW_TOKEN_KEY); } catch (e) { /* egal */ }
}

/* Still erneuern, bevor die Stunde um ist. Ein einziger Versuch reicht
   nicht: Schlägt er fehl — schlafender Rechner, kurz kein Netz —, war es
   das sonst. Deshalb wird mehrfach nachgesetzt. */
function swErneuerungPlanen() {
  if (swErneuerungsUhr) { window.clearTimeout(swErneuerungsUhr); swErneuerungsUhr = null; }
  if (!swAblauf) { return; }
  swErneuerungVersuche = 0;
  var warten = swAblauf - Date.now() - SW_VORLAUF;
  if (warten < 1000) { warten = 1000; }
  swErneuerungsUhr = window.setTimeout(swErneuerungLaufen, warten);
}

function swErneuerungLaufen() {
  swErneuerungsUhr = null;
  swErneuerungVersuche++;
  swAnmelden(true).then(function (gut) {
    if (gut) { return; }
    if (swErneuerungVersuche >= SW_ERNEUERUNG_MAX) { return; }
    swErneuerungsUhr = window.setTimeout(swErneuerungLaufen, SW_ERNEUERUNG_ABSTAND);
  });
}

/* Beim Zurückkehren an den Rechner: läuft der Zugriff bald ab, gleich
   erneuern statt auf die Uhr zu warten. Ein schlafender Rechner hält
   auch die Uhr an. */
function swErneuerungPruefen() {
  if (!swTokenGueltig()) { return; }
  if (swErneuerungsUhr) { return; }
  if (swRestMinuten() > 10) { return; }
  swErneuerungVersuche = 0;
  swErneuerungLaufen();
}

function swKlientVorbereiten() {
  if (swKlient) { return Promise.resolve(swKlient); }
  return swGisLaden().then(function () {
    swKlient = window.google.accounts.oauth2.initTokenClient({
      client_id: SW_CLIENT_ID,
      scope: SW_SCOPES,
      callback: function () { /* wird je Anfrage überschrieben */ },
      error_callback: function () { /* wird je Anfrage überschrieben */ }
    });
    return swKlient;
  });
}

/* Eine Anfrage an Google, mit drei Ausgängen: Schlüssel bekommen,
   abgelehnt (callback) oder das Fenster scheiterte (error_callback).
   Bleibt jede Antwort aus, entscheidet die Zeitgrenze. fertig wird genau
   einmal gerufen. */
function swAnmeldeAnfragen(klient, still, aufforderung, fertig) {
  var erledigt = false;
  var uhr = null;
  var abschliessen = function (gut) {
    if (erledigt) { return; }
    erledigt = true;
    if (uhr) { window.clearTimeout(uhr); }
    fertig(gut);
  };
  klient.callback = function (antwort) {
    if (antwort && antwort.access_token) {
      swTokenMerken(antwort.access_token, Number(antwort.expires_in) || 3600);
      abschliessen(true);
    } else {
      abschliessen(false);
    }
  };
  klient.error_callback = function () { abschliessen(false); };
  uhr = window.setTimeout(function () { abschliessen(false); }, still ? 12000 : 120000);
  try {
    klient.requestAccessToken({ prompt: aufforderung || '' });
  } catch (e) {
    abschliessen(false);
  }
}

function swAnmeldeVersuch(still, aufforderung) {
  return swKlientVorbereiten().then(function (klient) {
    return new Promise(function (fertig) {
      swAnmeldeAnfragen(klient, still, aufforderung, fertig);
    });
  }).catch(function () { return false; });
}

function swAnmelden(still) {
  return swAnmeldeVersuch(still, '').then(function (gut) {
    if (gut || still) { return gut; }
    return swAnmeldeVersuch(false, 'consent');
  });
}

function swAbmelden() {
  swTokenVergessen();
  swDateiId = '';
  try { window.localStorage.removeItem(SW_ANMELDE_MERKER); } catch (e) { /* egal */ }
  swZustand = 'aus';
  swText = '';
  zeichne();
}

function swAnmeldenVonHand() {
  swAnmelden(false).then(function (gut) {
    if (!gut) { melde('Die Anmeldung bei Google hat nicht geklappt.', 'warn'); zeichne(); return; }
    swAbgleichen(true);
  });
}

/* ---------- Drive ---------- */

function swKopf(zusatz) {
  var k = { 'Authorization': 'Bearer ' + swToken };
  if (zusatz) {
    Object.keys(zusatz).forEach(function (n) { k[n] = zusatz[n]; });
  }
  return k;
}

function swAntwortPruefen(a) {
  if (a.ok) { return a; }
  if (a.status === 401) {
    swTokenVergessen();
    throw new Error('Der Zugriff ist abgelaufen. Bitte neu anmelden.');
  }
  return a.text().then(function (t) {
    if (a.status === 403 && /has not been used|is disabled|SERVICE_DISABLED/i.test(t)) {
      throw new Error('Drive ist im Google-Projekt noch nicht freigeschaltet.\n'
        + 'Cloud Console öffnen, Projekt wählen, unter „APIs & Dienste – Bibliothek“ '
        + 'die Drive-Schnittstelle aktivieren und ein bis zwei Minuten warten.');
    }
    if (a.status === 403) {
      throw new Error('Drive verweigert den Zugriff (403).\n' + t.slice(0, 200));
    }
    throw new Error('Drive antwortete mit ' + a.status + ': ' + t.slice(0, 200));
  });
}

function swSuchen() {
  var url = 'https://www.googleapis.com/drive/v3/files'
          + '?q=' + encodeURIComponent("name='" + SW_DATEI + "' and trashed=false")
          + '&fields=' + encodeURIComponent('files(id,name,modifiedTime)')
          + '&pageSize=10';
  return window.fetch(url, { headers: swKopf() })
    .then(swAntwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      var liste = (d && d.files) ? d.files : [];
      if (!liste.length) { return null; }
      swDateiId = liste[0].id;
      swStand = liste[0].modifiedTime || '';
      return liste[0];
    });
}

function swAnlegen() {
  return window.fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: swKopf({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ name: SW_DATEI, mimeType: 'application/json' })
  }).then(swAntwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) { swDateiId = d.id; return d.id; });
}

function swHochladen() {
  var text = sdAlsText();
  var los = swDateiId ? Promise.resolve(swDateiId)
                      : swSuchen().then(function (t) { return t ? t.id : swAnlegen(); });
  return los.then(function (id) {
    return window.fetch('https://www.googleapis.com/upload/drive/v3/files/' + id
                        + '?uploadType=media&fields=id,modifiedTime', {
      method: 'PATCH',
      headers: swKopf({ 'Content-Type': 'application/json' }),
      body: text
    });
  }).then(swAntwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) { swStand = d.modifiedTime || ''; return true; });
}

function swHerunterladen() {
  var los = swDateiId ? Promise.resolve(swDateiId)
                      : swSuchen().then(function (t) { return t ? t.id : null; });
  return los.then(function (id) {
    if (!id) { return null; }
    return window.fetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media', {
      headers: swKopf()
    }).then(swAntwortPruefen).then(function (a) { return a.text(); });
  });
}

/* ---------- Abgleich ---------- */

/* Holen, zusammenführen, zurückschreiben. Hochgeladen wird nur, wenn der
   Abgleich wirklich etwas geändert hat — sonst wäre jede Sitzung eine
   Schreiboperation und jeder Takt ein Risiko. */
function swAbgleichen(vonHand) {
  if (swLaeuft) { return Promise.resolve(false); }
  if (!swTokenGueltig()) {
    if (vonHand) { melde('Nicht bei Google angemeldet.', 'warn'); }
    return Promise.resolve(false);
  }
  swLaeuft = true;
  swZustand = 'laeuft';
  swLetzter = Date.now();
  swZeileNachziehen();

  return swHerunterladen().then(function (text) {
    if (text === null) {
      /* Es gibt noch keine Datei in Drive — dann ist der lokale Stand der
         erste, und er wird angelegt. */
      return swHochladen().then(function () { return { neu: 0, ersetzt: 0, behalten: 0, entfernt: 0 }; });
    }
    var fremd = sdAusText(text);
    if (!fremd) { throw new Error('Die Datei in Drive ist nicht lesbar.'); }
    var vorher = sdAlsText();
    var e = sdZusammenfuehren(DB, fremd);
    DB = e.db;
    var nachher = sdAlsText();
    if (nachher !== vorher) {
      sdSichernOhneHaken();
      zeichne();
    }
    if (nachher !== text) { return swHochladen().then(function () { return e.bericht; }); }
    return e.bericht;
  }).then(function (bericht) {
    swLaeuft = false;
    swZustand = 'an';
    swText = sdUhrzeit();
    swZeileNachziehen();
    if (vonHand) {
      melde('Abgeglichen: ' + bericht.neu + ' neu · ' + bericht.ersetzt + ' ersetzt · '
        + bericht.behalten + ' behalten · ' + bericht.entfernt + ' entfernt', 'gut');
    }
    return true;
  }).catch(function (f) {
    swLaeuft = false;
    swZustand = 'fehler';
    swText = (f && f.message) ? f.message : 'unbekannt';
    swZeileNachziehen();
    if (vonHand) { melde('Abgleich: ' + swText, 'warn'); }
    return false;
  });
}

function swSpaeterAbgleichen() {
  if (swUhr) { window.clearTimeout(swUhr); }
  swUhr = window.setTimeout(function () {
    swUhr = null;
    if (Date.now() - swLetzter < SW_MINDEST) {
      swUhr = window.setTimeout(function () { swUhr = null; swAbgleichen(false); },
        SW_MINDEST - (Date.now() - swLetzter));
      return;
    }
    swAbgleichen(false);
  }, SW_VERZUG);
}

function swZeileNachziehen() {
  if (sd.sicht === 'fach' || sdIstSchmal()) { sdFlaecheZeichnen(); } else { sdMappeZeichnen(); }
}

/* ---------- Die Zeile in der Ablage ---------- */

function swZeile() {
  if (!swTokenGueltig()) {
    return '<br>Drive: nicht angemeldet'
      + ' · <button type="button" onclick="swAnmeldenVonHand()">Anmelden</button>';
  }
  var wo = 'Drive: angemeldet';
  if (swZustand === 'laeuft') { wo = 'Drive: gleicht ab …'; }
  else if (swZustand === 'fehler') { wo = 'Drive: ' + esc(swText); }
  else if (swText) { wo = 'Drive: abgeglichen ' + esc(swText); }
  return '<br>' + wo
    + ' · <button type="button" onclick="swAbgleichen(true)">Jetzt abgleichen</button>'
    + ' · <button type="button" onclick="swAbmelden()">Abmelden</button>';
}

/* ---------- Einhängen ---------- */

sdHaken.ablageZeile = swZeile;

sdHaken.nachSichern = function () { swSpaeterAbgleichen(); };

sdHaken.beimStart = function () {
  var warAngemeldet = false;
  try { warAngemeldet = window.localStorage.getItem(SW_ANMELDE_MERKER) === '1'; } catch (e) { /* egal */ }
  if (swTokenHolen()) {
    swErneuerungPlanen();
    swAbgleichen(false);
  } else if (warAngemeldet) {
    /* Still versuchen. Klappt es nicht, steht „nicht angemeldet“ in der
       Ablagezeile — ohne Fenster, ohne Meldung, ohne Reibung. */
    swAnmelden(true).then(function (gut) {
      if (gut) { swAbgleichen(false); } else { zeichne(); }
    });
  }
  if (swTaktUhr) { window.clearInterval(swTaktUhr); }
  swTaktUhr = window.setInterval(function () {
    if (document.hidden) { return; }
    swErneuerungPruefen();
    if (!swLaeuft && swTokenGueltig() && Date.now() - swLetzter >= SW_TAKT) {
      swAbgleichen(false);
    }
  }, SW_TAKT);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { return; }
    swErneuerungPruefen();
    if (swTokenGueltig()) { swAbgleichen(false); }
  });
};


/* ============================================================
   sd_pwa.js — Installierbar machen, nur in der privaten Fassung

   Die berufliche Fassung ist eine Datei auf dem Rechner. Dort gibt es
   keinen Ursprung, von dem ein Service Worker laden könnte, und nichts
   zu puffern: Die Datei IST schon offline. Deshalb enthält sie dieses
   Stück nicht.

   Für das Fenster ohne Adresszeile braucht es auf dem Arbeitsrechner
   keine PWA — eine Verknüpfung genügt:
     msedge --app="file:///C:/Pfad/schreibtisch-beruf.html"
   ============================================================ */

'use strict';

var SP_DATEI = './sw-schreibtisch.js';
var spWartend = null;

function spMoeglich() {
  if (typeof navigator === 'undefined' || !navigator.serviceWorker) { return false; }
  if (sdImRahmen()) { return false; }
  var p = window.location.protocol;
  return p === 'https:' || p === 'http:';
}

/* Eine wartende Fassung drängt sich nicht auf. Sie sagt Bescheid und
   wartet, bis man sie holt — mitten in einer Eingabe neu zu laden wäre
   genau der falsche Moment. */
function spHinweisZeigen() {
  var el = document.getElementById('meldung');
  if (!el) { return; }
  el.innerHTML = '<span class="wort">Eine neue Fassung liegt bereit.</span>'
    + '<button type="button" class="jetzt" onclick="spJetztLaden()">Jetzt laden</button>'
    + '<button type="button" class="zu" onclick="sdMeldungZu()" aria-label="Später">&#215;</button>';
  el.className = 'meldung neu';
  el.hidden = false;
}

function spJetztLaden() {
  if (spWartend) { spWartend.postMessage('sofort-uebernehmen'); }
  window.setTimeout(function () { window.location.reload(); }, 300);
}

function spAnmelden() {
  if (!spMoeglich()) { return; }
  navigator.serviceWorker.register(SP_DATEI).then(function (anmeldung) {
    if (anmeldung.waiting) { spWartend = anmeldung.waiting; spHinweisZeigen(); }
    anmeldung.addEventListener('updatefound', function () {
      var frisch = anmeldung.installing;
      if (!frisch) { return; }
      frisch.addEventListener('statechange', function () {
        if (frisch.state === 'installed' && navigator.serviceWorker.controller) {
          spWartend = frisch;
          spHinweisZeigen();
        }
      });
    });
  }).catch(function () {
    /* Kein Service Worker, kein Drama: Die App läuft auch ohne ihn,
       nur eben nicht offline. */
    return null;
  });
}

/* Hängt sich hinter den Haken, den sd_wolke.js schon gesetzt hat,
   statt ihn zu überschreiben — sonst verlöre die private Fassung
   ihren Abgleich beim Start. */
(function () {
  var vorher = sdHaken.beimStart;
  sdHaken.beimStart = function () {
    if (vorher) { vorher(); }
    spAnmelden();
  };
}());

</script>
