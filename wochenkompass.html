  }
  return '';
}

function modusKnoepfe() {
  return '<span class="umschalter" role="group" aria-label="Ansicht oder Schreiben">'
       + '<button type="button" class="' + (kp.modus === 'ansicht' ? 'an' : '') + '" onclick="modusSetzen(\'ansicht\')">Ansicht</button>'
       + '<button type="button" class="' + (kp.modus === 'schreiben' ? 'an' : '') + '" onclick="modusSetzen(\'schreiben\')">Schreiben</button></span>';
}

function eigenschaftenHtml(s) {
  var v = s.satz;
  var istZiel = (s.va === 'ziel');
  var termin = istZiel ? (v.zieltermin || '') : (v.ende || '');
  var st = v.status || 'laufend';
  return '<div class="eigen">' + (istZiel ? 'Ziel' : 'Projekt')
    + '<span class="gruppe-knopf"><button type="button" class="' + (v.kontext === 'beruflich' ? 'an' : '') + '" onclick="kpFeld(\'kontext\',\'beruflich\')">Beruf</button>'
    + '<button type="button" class="' + (v.kontext !== 'beruflich' ? 'an' : '') + '" onclick="kpFeld(\'kontext\',\'privat\')">Privat</button></span>'
    + '<label>' + (istZiel ? 'Zieltermin' : 'bis') + ' <input type="date" value="' + esc(termin) + '" onchange="kpFeld(\'termin\',this.value)"></label>'
    + '<span class="gruppe-knopf"><button type="button" class="' + (st === 'laufend' ? 'an' : '') + '" onclick="kpFeld(\'status\',\'laufend\')">aktiv</button>'
    + '<button type="button" class="' + (st === 'ruht' ? 'an' : '') + '" onclick="kpFeld(\'status\',\'ruht\')">ruhend</button>'
    + '<button type="button" class="' + (st === 'abgeschlossen' ? 'an' : '') + '" onclick="kpFeld(\'status\',\'abgeschlossen\')">' + (istZiel ? 'erreicht' : 'abgeschlossen') + '</button></span>'
    + '</div>';
}

function archivHtml(montagOffen) {
  var heute = kpHeuteMontag();
  var alte = kpWochen().filter(function (g) { return g.woche < heute; });
  if (!alte.length && montagOffen === heute) { return ''; }
  if (!alte.length) {
    return '<div class="archiv"><button type="button" onclick="oeffne(\'woche\',\'\')">← zurück zu dieser Woche</button></div>';
  }
  var h = '<details class="archiv"' + (montagOffen < heute ? ' open' : '') + '><summary>Frühere Wochen · ' + alte.length + '</summary>';
  if (montagOffen !== heute) { h += '<button type="button" onclick="oeffne(\'woche\',\'\')">← zurück zu dieser Woche</button>'; }
  alte.forEach(function (g) {
    h += '<button type="button" class="' + (g.woche === montagOffen ? 'an' : '') + '" onclick="oeffne(\'woche\',\'' + esc(g.id) + '\')">'
       + esc(kpWochenTitel(g.woche)) + '</button>';
  });
  return h + '</details>';
}

/* zeichnen: Ein offenes Schreibfeld wird nicht überschrieben, solange
   darin getippt wird — es sei denn, es ist ausdrücklich verlangt. */
function seiteZeichnen(erzwingen) {
  var el = document.getElementById('seite');
  if (!el) { return; }
  var aktiv = document.activeElement;
  if (!erzwingen && aktiv && (aktiv.id === 'kpFeld' || aktiv.id === 'kpTitel')) { return; }
  if (kp.art === 'einst') { el.innerHTML = einstHtml(); return; }
  var s = kpSeite();
  var h = '';

  if (s.art === 'woche') {
    var heute = kpHeuteMontag();
    var istJetzt = (s.montag === heute);
    var istNaechste = (s.montag === tagePlus(heute, 7));
    h += '<div class="seitenkopf"><h1>' + (istJetzt ? '★ Diese Woche' : (istNaechste ? '→ Nächste Woche' : 'Frühere Woche'))
       + '<span class="unter">' + esc(kpWochenTitel(s.montag)) + '</span></h1>';
    if (istJetzt && !kpWocheFinden(tagePlus(heute, 7))) {
      h += '<button type="button" class="pille" onclick="naechsteWocheAufsetzen()">Nächste Woche aufsetzen</button>';
    }
    if (s.satz) { h += modusKnoepfe() + mehrHtml(s); }
    h += '</div>';
    if (s.satz && kp.frage) { h += frageHtml(s); }
    if (!s.satz) {
      h += '<div class="blatt leer-blatt"><p>Diese Woche ist noch nicht aufgesetzt.</p>'
         + '<button type="button" class="pille voll" onclick="dieseWocheAufsetzen()">Woche aufsetzen</button>'
         + '<p class="klein">Mit Gerüst: „Was diese Woche Substanz schafft“ und „Verbindlichkeiten“ — je höchstens drei Zeilen.</p></div>';
    } else {
      h += blattHtml(s, true);
      h += '<div class="hinweis"><b>Regel:</b> je höchstens drei Zeilen, keine Unteraufgaben. Erledigtes durchstreichen.</div>';
    }
    h += archivHtml(s.montag);
    el.innerHTML = h;
    return;
  }

  if (!s.satz) {
    el.innerHTML = '<div class="blatt leer-blatt"><p>Diese Seite gibt es nicht mehr.</p>'
                 + '<button type="button" class="pille" onclick="oeffne(\'woche\',\'\')">Zur Woche</button></div>';
    return;
  }
  var name = (s.art === 'vorhaben') ? (s.satz.name || '') : (s.satz.titel || '');
  h += '<div class="seitenkopf"><input id="kpTitel" class="titelfeld" type="text" maxlength="200" value="' + esc(name) + '" '
     + 'aria-label="Name" onchange="kpTitelSetzen(this.value)" onkeydown="if(event.key===\'Enter\'){this.blur();}">'
     + modusKnoepfe() + mehrHtml(s) + '</div>';
  if (s.art === 'vorhaben') { h += eigenschaftenHtml(s); }
  else { h += '<div class="eigen">Stille Liste</div>'; }
  if (kp.frage) { h += frageHtml(s); }
  if (s.art === 'vorhaben' && !kpText(s).trim() && kp.modus === 'ansicht') {
    h += '<div class="blatt leer-blatt"><p>Diese Seite ist noch leer.</p>'
       + '<button type="button" class="pille" onclick="geruestEinfuegen()">Gerüst einfügen: Phase · Etappen · Eckdaten · Kontakte · Notizen</button></div>';
  } else {
    h += blattHtml(s, false);
  }
  h += '<div class="hinweis">' + ((s.art === 'vorhaben')
       ? 'Nutzt du auch die Workbench, steht diese Seite dort als Gedanken des Vorhabens.'
       : 'Nutzt du auch die Workbench, steht diese Liste dort unter Gedanken.') + '</div>';
  el.innerHTML = h;
}

function blattHtml(s, istWoche) {
  if (kp.modus === 'schreiben') {
    return werkzeugHtml()
         + '<textarea id="kpFeld" class="feld" spellcheck="true" aria-label="Seite schreiben" '
         + 'oninput="kpTextSetzen(this.value)" onkeydown="feldTaste(event)">' + esc(kpText(s)) + '</textarea>';
  }
  var text = kpText(s);
  if (!text.trim()) {
    return '<div class="blatt leer-blatt"><p>Noch leer. „Schreiben“ füllt die Seite.</p></div>';
  }
  return '<div class="blatt">' + kpAnsichtHtml(text, istWoche) + '</div>';
}

function geruestEinfuegen() {
  var s = kpSeite();
  if (s.art !== 'vorhaben' || !s.satz) { return; }
  if (!String(s.satz.flaeche || '').trim()) {
    s.satz.flaeche = KP_GERUEST_PROJEKT;
    s.satz.geaendert = jetzt();
    spaeterSichern();
  }
  modusSetzen('schreiben');
}

/* ---------- Einstellungen ---------- */

function einstHtml() {
  var angemeldet = tokenGueltig();
  return '<div class="einst"><div class="seitenkopf"><h1>Einstellungen'
    + '<span class="unter">Der Wochenkompass arbeitet allein — die Workbench ist nicht nötig.</span></h1>'
    + '<button type="button" class="pille" onclick="oeffne(\'woche\',\'\')">Zurück</button></div>'
    + '<section class="karte"><h3>Speicher</h3>'
    + '<div class="reihe"><span>Gespeichert über</span><span>' + esc(wegText(speicherWeg)) + '</span></div>'
    + (dateiName ? '<div class="reihe"><span>Datei</span><span>' + esc(dateiName) + '</span></div>' : '')
    + '<div class="reihe"><span>Zuletzt gespeichert</span><span>' + esc(letzterSchreibvorgang || '—') + '</span></div>'
    + '<div class="knoepfe">'
    + (fsApiDa() ? '<button type="button" class="pille" onclick="dateiWaehlen()">Datei öffnen …</button>'
                 + '<button type="button" class="pille" onclick="dateiAnlegen()">Neue Datei anlegen …</button>' : '')
    + '<button type="button" class="pille" onclick="sicherungLaden()">Sicherung herunterladen</button></div>'
    + '<p>Ohne Datei speichert der Wochenkompass im geräteeigenen Speicher. Eine Datei heißt wie bei der Workbench '
    + DATEINAME + ' — beide Apps können sie lesen.</p></section>'
    + '<section class="karte"><h3>Google Drive</h3>'
    + '<div class="reihe"><span>Anmeldung</span><span class="' + (angemeldet ? 'gut' : 'warn') + '">'
    + (angemeldet ? 'angemeldet · noch ' + restMinuten() + ' Min.' : (warAngemeldet() ? 'abgelaufen' : 'nicht angemeldet')) + '</span></div>'
    + '<div class="reihe"><span>Letzter Abgleich</span><span>' + esc(letzterAbgleich || '—') + '</span></div>'
    + '<div class="reihe"><span>Ergebnis</span><span>' + esc(berichtText(letzterBericht)) + '</span></div>'
    + (abgleichFehler ? '<div class="reihe"><span>Letzter Fehler</span><span class="warn">' + esc(abgleichFehler) + '</span></div>' : '')
    + '<div class="knoepfe">'
    + '<button type="button" class="pille' + (angemeldet ? '' : ' voll') + '" onclick="anmelden(false)">Anmelden</button>'
    + '<button type="button" class="pille" onclick="abgleichenJetzt()"' + (angemeldet ? '' : ' disabled') + '>Jetzt abgleichen</button>'
    + '<button type="button" class="pille" onclick="abmelden()"' + (angemeldet ? '' : ' disabled') + '>Abmelden</button></div>'
    + '<p>Gibt es in deinem Drive noch keine ' + DRIVE_DATEI + ', legt der Wochenkompass sie an. '
    + 'Nutzt du auch die Workbench, teilen sich beide diese Datei.</p></section>'
    + '<section class="karte"><h3>Über</h3><div class="reihe"><span>Version</span><span>Wochenkompass ' + APP_VERSION + '</span></div></section>'
    + '</div>';
}

function sicherungLaden() {
  var name = 'wochenkompass-sicherung-' + isoDatum() + '.json';
  if (dateiAnbieten(name, alsText())) { melde('Sicherung bereitgestellt: ' + name, 'gut'); }
  else { melde('Die Sicherung ließ sich nicht bereitstellen.', 'warn'); }
}

/* ---------- Stand und Rückmeldungen ---------- */

var toastZeit = 0;

function melde(text, art, mitRueckgaengig) {
  var t = document.getElementById('toast');
  var tt = document.getElementById('toastText');
  var tr = document.getElementById('toastRueck');
  if (!t || !tt) { return; }
  tt.textContent = String(text || '');
  if (tr) { tr.style.display = mitRueckgaengig ? '' : 'none'; }
  t.className = 'toast auf' + (art ? ' ' + art : '');
  if (toastZeit) { window.clearTimeout(toastZeit); }
  toastZeit = window.setTimeout(function () {
    var el = document.getElementById('toast');
    if (el) { el.className = 'toast'; }
    toastZeit = 0;
  }, mitRueckgaengig ? 9000 : ((art === 'warn') ? 7000 : 4000));
}

function standText() {
  if (!tokenGueltig()) {
    return warAngemeldet() ? { text: 'Anmeldung abgelaufen — neu anmelden', warn: true }
                           : { text: 'nur auf diesem Gerät', warn: false };
  }
  if (abgleichFehler) { return { text: 'Abgleich fehlgeschlagen', warn: true }; }
  if (verbindungOk === false) { return { text: 'keine Verbindung — lokal gespeichert', warn: true }; }
  if (abgleichLaeuft) { return { text: 'gleicht ab …', warn: false }; }
  if (letzterAbgleich) { return { text: DRIVE_DATEI + ' · abgeglichen ' + letzterAbgleich.slice(11, 16), warn: false }; }
  return { text: 'angemeldet', warn: false };
}

function standZeichnen() {
  var el = document.getElementById('standPille');
  if (!el) { return; }
  var s = standText();
  el.textContent = s.text;
  el.className = 'stand' + (s.warn ? ' warn' : '');
}

/* Die Workbench-Funktionen rufen diesen Namen — hier ist es die Pille. */
function anmeldeStreifenPruefen() { standZeichnen(); }

function standGeklickt() {
  if (!tokenGueltig()) { anmelden(false); return; }
  abgleichenJetzt();
}

function zeichne(erzwingen) {
  leisteZeichnen();
  seiteZeichnen(erzwingen === true);
  standZeichnen();
  document.title = 'Wochenkompass ' + APP_VERSION;
}

/* ---------- Speichern und Abgleich ---------- */

function spaeterSichern() {
  if (speicherUhr) { window.clearTimeout(speicherUhr); }
  lokalOffen = true;
  speicherUhr = window.setTimeout(function () {
    speicherUhr = null;
    speichern().then(function () {
      standZeichnen();
      abgleichPlanen(false);
    }).catch(function () { return null; });
  }, 1500);
}

/* Wie in der Workbench — nur ohne deren Termine und Wochenumstellung. */
function abgleichStill() {
  abgleichUhr = null;
  if (!tokenGueltig() || abgleichLaeuft) { return; }
  abgleichLaeuft = true;
  standZeichnen();
  abgleichen().then(function (b) {
    abgleichZuletztMs = Date.now();
    abgleichFehler = '';
    lokalOffen = false;
    verbindungOk = true;
    if (b && (b.neu || b.ersetzt || b.entfernt)) { melde('Abgeglichen: ' + berichtText(b), 'gut'); }
    abgleichLaeuft = false;
    zeichne();
  }).catch(function (f) {
    abgleichFehler = f ? f.message : 'unbekannter Fehler';
    abgleichLaeuft = false;
    standZeichnen();
  });
}

function verbindungPruefen() {
  if (!tokenGueltig()) { verbindungOk = false; standZeichnen(); return; }
  window.fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)', { headers: driveKopf() })
    .then(function (a) {
      if (a.ok) { verbindungOk = true; }
      else if (a.status === 401 || a.status === 403) { tokenVergessen(); verbindungOk = false; }
      standZeichnen();
    }).catch(function () {
      verbindungOk = false;
      standZeichnen();
    });
}

function rueckkehrPruefen() {
  erneuerungPruefen();
  if (document.hidden) { return; }
  zeichne();
  if (!tokenGueltig()) { return; }
  if (Date.now() - abgleichZuletztMs < ABGLEICH_MINDEST) { return; }
  abgleichPlanen(true);
}

/* Nach abgelaufener Anmeldung erneuert der nächste Klick still — einmal. */
function klickErneuern() {
  if (tokenGueltig() || klickVersucht || anmeldungLaeuft || !warAngemeldet()) { return; }
  klickVersucht = true;
  anmelden(true).then(function (gut) { if (gut) { klickVersucht = false; } });
}

/* ---------- Start ---------- */

function breiteSetzen() {
  document.body.classList.toggle('breit', (window.innerWidth || 0) >= 900);
}

function swAnmelden() {
  if (!navigator.serviceWorker || typeof navigator.serviceWorker.register !== 'function') { return; }
  if (!/^https?:/.test(String(window.location && window.location.protocol))) { return; }
  /* Eigener Bereich: Der Service Worker der Workbench (Bereich ./)
     bleibt unberührt. */
  navigator.serviceWorker.register('./sw-wochenkompass.js', { scope: './wochenkompass' })
    .catch(function () { return null; });
}

function start() {
  breiteSetzen();
  window.addEventListener('resize', breiteSetzen);
  tokenAusSitzung();
  var los = idbDa()
    ? idbLesen(IDB_KEY).then(function (h) { if (h) { dateiHandle = h; dateiName = h.name || ''; } }).catch(function () { return null; })
    : Promise.resolve(null);
  los.then(function () { return laden(); }).then(function () {
    zeichne(true);
    if (tokenGueltig()) { abgleichPlanen(true); verbindungPruefen(); }
    taktStarten();
    verbindungTaktStarten();
  }).catch(function (f) {
    melde('Laden fehlgeschlagen: ' + (f ? f.message : ''), 'warn');
    zeichne(true);
  });
  document.addEventListener('visibilitychange', rueckkehrPruefen);
  document.addEventListener('click', klickErneuern, true);
  swAnmelden();
}

window.addEventListener('DOMContentLoaded', start);

</script>
</body>
</html>
