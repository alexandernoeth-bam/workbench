function kpMarkeAnZeile(feld, nr, rolle) {
  var zeilen = String(feld.value || '').split('\n');
  if (nr < 0 || nr >= zeilen.length) { return; }
  var a = 0;
  var i;
  for (i = 0; i < nr; i++) { a += zeilen[i].length + 1; }
  if (typeof feld.setSelectionRange === 'function') { feld.setSelectionRange(a, a + zeilen[nr].length); }
  if (!rolle || typeof feld.getBoundingClientRect !== 'function' || typeof window.getComputedStyle !== 'function') { return; }
  var zeilenHoehe = parseFloat(window.getComputedStyle(feld).lineHeight) || 24;
  var oben = parseFloat(window.getComputedStyle(feld).paddingTop) || 0;
  var r = feld.getBoundingClientRect();
  rolle.scrollTop += r.top + oben + nr * zeilenHoehe - (window.innerHeight || 800) / 2;
}

function kpFrequenz(w) {
  if (!w) { return ''; }
  var kz = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  var n = Math.max(1, Number(w.intervall) || 1);
  var namen = [];
  var i;
  if (w.takt === 'woche' || w.typ === 'woechentlich') {
    var tage = Array.isArray(w.tage) ? w.tage : [];
    if (!w.takt) {
      tage = (Array.isArray(w.wochentage) ? w.wochentage : []).map(function (t) { return Number(t) === 7 ? 0 : Number(t); });
    }
    for (i = 1; i <= 7; i++) {
      var nr = (i === 7) ? 0 : i;
      if (tage.indexOf(nr) >= 0) { namen.push(kz[nr]); }
    }
    var liste = (namen.length === 7) ? 'täglich' : (namen.join(', ') || 'wöchentlich');
    return (n === 1) ? liste : ('alle ' + n + ' Wochen: ' + liste);
  }
  if (w.takt === 'monat' || w.typ === 'monatlich') {
    var tag = Number(w.tag) || 1;
    return (n === 1) ? ('monatlich am ' + tag + '.') : ('alle ' + n + ' Monate am ' + tag + '.');
  }
  return '';
}

/* Aus der Workbench — ohne termineHolen: Der Wochenkompass hat keine Termine. */
function anmeldeAnfragen(klient, still, aufforderung, fertig) {
  var erledigt = false;
  var uhr = null;
  anmeldungLaeuft = true;
  var abschliessen = function (gut) {
    if (erledigt) { return; }
    erledigt = true;
    anmeldungLaeuft = false;
    if (uhr) { window.clearTimeout(uhr); }
    fertig(gut);
  };
  var gescheitert = function (grund) {
    if (erledigt) { return; }
    letzteErneuerung = { zeit: isoZeit(),
                         ergebnis: still ? 'still fehlgeschlagen' : 'abgebrochen',
                         grund: grund };
    if (still) {
      melde('Die stille Erneuerung ist fehlgeschlagen (' + grund + ').\n'
          + 'Der nächste Klick in der App verbindet neu.', 'warn');
    } else {
      melde('Anmeldung nicht abgeschlossen (' + grund + ').', 'warn');
    }
    zeichne();
    abschliessen(false);
  };
  klient.callback = function (antwort) {
    if (antwort && antwort.access_token) {
      tokenMerken(antwort.access_token, Number(antwort.expires_in) || 3600);
      try { window.localStorage.setItem(ANMELDE_MERKER, '1'); } catch (e) { /* egal */ }
      verbindungOk = true;
      letzteErneuerung = { zeit: isoZeit(), ergebnis: still ? 'still erneuert' : 'angemeldet',
                           grund: '' };
      abgleichPlanen(true);
      verbindungPruefen();
      if (!still) { melde('Angemeldet. Gültig für ' + restMinuten() + ' Minuten.', 'gut'); }
      zeichne();
      abschliessen(true);
      return;
    }
    gescheitert((antwort && antwort.error) ? antwort.error : 'unbekannt');
  };
  klient.error_callback = function (fehler) {
    gescheitert((fehler && fehler.type) ? fehler.type : 'fenster_fehler');
  };
  /* Von Hand darf es länger dauern — wer ein Konto wählt, braucht Zeit. */
  uhr = window.setTimeout(function () { gescheitert('keine_antwort'); },
                          still ? ANMELDE_ZEITGRENZE_MS : 5 * ANMELDE_ZEITGRENZE_MS);
  /* Auch von Hand zuerst ohne Rückfrage: Wer schon zugestimmt hat,
     soll die Zustimmung nicht jedes Mal wieder erteilen müssen. */
  klient.requestAccessToken({ prompt: aufforderung });
}

/* ============================================================
   Wochenkompass 3 — eigener Teil

   Seit 3.0 arbeitet der Wochenkompass auf derselben Datei wie die
   Workbench (workbench.json) und mit ihren Sammlungen. Vorhaben sind
   Projekte und Ziele, Listen sind Themen, Notizen sind Gedanken — die
   Hüllen und alle Funktionen dafür (kp…) kommen wörtlich aus der
   Workbench. Die Wochen sind dieselben wie im Tag der Workbench.

   Hier steht nur, was der Kompass selbst zeigt: die ruhige Woche, die
   Seitenleiste mit Vorhaben, Listen und Notizen, die Seite mit dem
   Fenster „Offene Aufgaben“ (S und V) und die Einstellungen.

   Die Umstellung der Aufgaben auf Zeilen geschieht einmal in der
   Workbench. Vorher zeigt der Kompass nur einen Hinweis.
   ============================================================ */

var speicherUhr = null;
var zurueckHolen = null;
var klickErneuerungFuer = '';   /* für welchen Ablauf schon einmal per Klick erneuert wurde */
var stillVersuchtMs = 0;        /* wann zuletzt still angemeldet wurde */
var STILL_ABSTAND = 60000;

/* Was gerade offen ist und wie */
var kp = {
  art: 'woche',          /* woche | seite | einst */
  id: '',                /* Seite: Kennung · Woche: Montag, leer = laufende Woche */
  modus: 'ansicht',      /* ansicht | schreiben */
  leisteAuf: false,
  neuIn: '',             /* vorhaben | liste | notiz — offenes Eingabefeld */
  menueAuf: false,
  frage: '',             /* loeschen */
  fertigAuf: false,
  ruhtAuf: false,
  notizenAuf: false,     /* beim Start eingeklappt */
  sortieren: '',         /* Gruppe im Sortiermodus (Handy): vorhaben-laeuft | … | liste | notiz */
  hervor: '',            /* Aufgabentext, der nach einem Sprung hervorgehoben wird */
  zielWoche: 'diese',    /* diese | naechste — wohin S und V planen */
  oaAuf: false,          /* Fenster „Offene Aufgaben“ */
  filter: 'alle'         /* alle | beruflich | privat — Seitenleiste */
};

var KP_FILTER_KEY = 'kompass-filter';
var KP_KONTEXTE = [['beruflich', 'Beruf'], ['privat', 'Privat']];

/* ---------- Bestand ---------- */

/* Nur Kennung und Stempel nachtragen — alles andere gehört der Workbench. */
function bestandStempeln(db) {
  var i, s, k;
  var nachgetragen = 0;
  for (i = 0; i < SAMMLUNGEN.length; i++) {
    s = SAMMLUNGEN[i];
    /* Die Kalenderzuordnung ist ein Verzeichnis, keine Liste — die
       Workbench braucht sie unverändert. */
    if (s === 'kalenderzuordnung') {
      if (!db[s] || typeof db[s] !== 'object' || Array.isArray(db[s])) { db[s] = {}; }
      for (k in db[s]) {
        if (!Object.prototype.hasOwnProperty.call(db[s], k)) { continue; }
        if (typeof db[s][k] === 'string') { db[s][k] = { art: db[s][k], geaendert: 0 }; nachgetragen++; }
        else if (db[s][k] && !db[s][k].geaendert) { db[s][k].geaendert = 0; nachgetragen++; }
      }
      continue;
    }
    if (!Array.isArray(db[s])) { db[s] = []; }
    var liste = db[s];
    var j;
    for (j = 0; j < liste.length; j++) {
      if (!liste[j].id) { liste[j].id = neueKennung(); nachgetragen++; }
      if (typeof liste[j].geaendert !== 'number') { liste[j].geaendert = 0; nachgetragen++; }
    }
  }
  if (!Array.isArray(db.grabsteine)) { db.grabsteine = []; }
  if (!db.einstellungen || typeof db.einstellungen !== 'object') { db.einstellungen = {}; }
  return nachgetragen;
}

/* ---------- Wochen ---------- */

function kpOffenerMontag() {
  return (kp.art === 'woche' && kp.id) ? kp.id : kpHeuteMontag();
}

function kpZielMontag() {
  var heute = kpHeuteMontag();
  return (kp.zielWoche === 'naechste') ? tagePlus(heute, 7) : heute;
}

/* ---------- Beruf und Privat ---------- */

function kpSichtbar(s) {
  return kpPasstFilter(s, kp.filter);
}

/* Ist die Workbench umgestellt? Erst dann sind Aufgaben Zeilen. */
function kpUmgestellt() {
  return !!(DB.einstellungen && DB.einstellungen.aktivitaetenUmgestellt);
}

function kpFilterSetzen(f) {
  if (f !== 'alle' && f !== 'beruflich' && f !== 'privat') { return; }
  kp.filter = f;
  try { window.localStorage.setItem(KP_FILTER_KEY, f); } catch (e) { /* ohne Speicher eben nur für jetzt */ }
  leisteZeichnen();
}

function kpFilterLaden() {
  var f = null;
  try { f = window.localStorage.getItem(KP_FILTER_KEY); } catch (e) { f = null; }
  if (f === 'alle' || f === 'beruflich' || f === 'privat') { kp.filter = f; }
}

function kpKontext(wert) {
  var s = kpSeite();
  if (!s || (wert !== 'beruflich' && wert !== 'privat')) { return; }
  s.kontext = wert;
  s.geaendert = jetzt();
  spaeterSichern();
  zeichne(true);
}

/* ---------- Planen ---------- */

/* S oder V auf einer Seite: Die Aufgabe kommt als Zeile unter die
   passende Überschrift der gewählten Woche — wie in der Workbench. */
function kpEinplanen(nr, abschnitt) {
  if (abschnitt !== 's' && abschnitt !== 'v') { return; }
  var s = kpSeite();
  if (!s) { return; }
  var a = kpAufgabe(String(s.text || '').split('\n')[nr] || '');
  if (!a || !a.text || a.erledigt) { return; }
  var montag = kpZielMontag();
  var b = kpPlanenKern(s, nr, abschnitt, montag);
  if (!b) {
    var schon = kpEintraegeFinden(s.id, a.text).filter(function (f) { return f.woche.montag === montag; })[0];
    melde(schon ? ('Steht schon in KW ' + kalenderwoche(montag) + '.') : 'Ließ sich nicht planen.', null);
    return;
  }
  spaeterSichern();
  seiteZeichnen(true);
  melde('In KW ' + kalenderwoche(montag) + ' · ' + KP_ABSCHNITTE[abschnitt], 'gut');
}

/* Nimmt eine Aufgabe wieder aus der Woche (oder dem Tag der Workbench)
   — auch ihre Zeile dort. Die Zeile in der Quelle bleibt. */
function kpAusplanen(bid, id) {
  if (!kpAusplanenKern(bid, id)) { return; }
  spaeterSichern();
  zeichne(true);
}

/* Hebt eine Aufgabe in der Ansicht hervor und rollt sie in die Mitte.
   Wechselt man danach auf „Schreiben“, steht die Schreibmarke dort. */
function kpHervorZeigen(text) {
  kp.hervor = text;
  seiteZeichnen(true);
  var el = document.getElementById('kpHervor');
  if (el && typeof el.scrollIntoView === 'function') { el.scrollIntoView({ block: 'center' }); }
}

/* Anschlüsse für den Kern: Klick und ↗ in einem Behälter, Kästchen in Zellen. */
function kpBzUm(bid, nr) {
  if (!kpBehaelterZeileUmKern(kpBehaelterFinden(bid), nr)) { return; }
  spaeterSichern();
  zeichne(true);
}

function kpBzSprung(bid, nr) {
  var b = kpBehaelterFinden(bid);
  if (!b) { return; }
  var a = kpAufgabe(String(b.text || '').split('\n')[nr] || '');
  var e = (a && a.text) ? kpWocheEintrag(b, a.text) : null;
  if (!e) { melde('Die Seite dieser Aufgabe gibt es nicht mehr.', 'warn'); return; }
  var seite = kpSeiteFinden(e.quelle);
  oeffne('seite', seite.id);
  if (!kpZeileSuchen(seite, e.text)) {
    melde('Die Zeile wurde umformuliert — sie steht nicht mehr wörtlich auf der Seite.', null);
    return;
  }
  kpHervorZeigen(e.text);
}

function kpZelleUm(zeileNr, spalte) {
  var z = kpTextZiel(false);
  if (!z) { return; }
  var neu = kpZelleSetzen(z.text, zeileNr, spalte);
  if (neu === null) { return; }
  z.text = neu;
  z.geaendert = jetzt();
  spaeterSichern();
  seiteZeichnen(true);
}

/* Ein Kästchen auf der Seite: Woche und Tag ziehen mit. */
function kpKastenUm(nr) {
  if (!kpSeiteKastenUmKern(kpSeite(), nr)) { return; }
  spaeterSichern();
  zeichne(true);
}

function kpZielWocheSetzen(w) {
  if (w !== 'diese' && w !== 'naechste') { return; }
  kp.zielWoche = w;
  seiteZeichnen(true);
}

/* ---------- Die offene Seite ---------- */

function kpSeite() {
  if (kp.art === 'seite') { return kpSeiteFinden(kp.id); }
  return null;
}

/* Wohin der Text des Schreibfelds gehört: Seite oder Woche. Eine Woche
   entsteht erst, wenn man in ihr schreibt. */
function kpTextZiel(anlegen) {
  if (kp.art === 'seite') { return kpSeite(); }
  if (kp.art === 'woche') {
    var montag = kpOffenerMontag();
    return anlegen ? kpWocheAnlegen(montag) : kpWocheFinden(montag);
  }
  return null;
}

function kpTextSetzen(text) {
  var s = kpTextZiel(true);
  if (!s) { return; }
  s.text = String(text);
  s.geaendert = jetzt();
  spaeterSichern();
}

function kpTitelSetzen(wert) {
  var s = kpSeite();
  var t = String(wert || '').trim().slice(0, 200);
  if (!s || !t) { leisteZeichnen(); return; }
  s.titel = t;
  s.geaendert = jetzt();
  spaeterSichern();
  leisteZeichnen();
}

function kpZustand(wert) {
  var s = kpSeite();
  if (!s || s.art !== 'vorhaben') { return; }
  if (['laeuft', 'ruht', 'erledigt'].indexOf(wert) < 0) { return; }
  if (s.zustand !== wert) { s.rang = kpNaechsterRang(); }   /* in der neuen Gruppe unten */
  s.zustand = wert;
  s.geaendert = jetzt();
  kp.frage = '';
  spaeterSichern();
  zeichne(true);
}

function oeffne(art, id) {
  kp.art = art;
  kp.id = id || '';
  kp.modus = 'ansicht';
  kp.menueAuf = false;
  kp.frage = '';
  kp.hervor = '';
  kp.oaAuf = false;
  kp.leisteAuf = false;
  zeichne(true);
  var rolle = (typeof document.querySelector === 'function') ? document.querySelector('.seite') : null;
  if (rolle) { rolle.scrollTop = 0; }
}

function modusSetzen(m) {
  if (m !== 'ansicht' && m !== 'schreiben') { return; }
  var merk = kp.hervor;
  var s = kpSeite();
  var z = (merk && s) ? kpZeileSuchen(s, merk) : null;
  kp.modus = m;
  kp.hervor = '';
  kp.oaAuf = false;
  seiteZeichnen(true);
  if (m === 'schreiben') {
    var f = document.getElementById('kpFeld');
    if (f && f.focus) { f.focus(); }
    if (f && z) { kpMarkeAnZeile(f, z.nr, document.querySelector('.seite')); }
  }
}

/* ---------- Anlegen ---------- */

function neuOeffnen(was) {
  if (!KP_ARTEN[was]) { return; }
  kp.neuIn = (kp.neuIn === was) ? '' : was;
  leisteZeichnen();
  var f = document.getElementById('neuName');
  if (f && f.focus) { f.focus(); }
}

function anlegen() {
  var f = document.getElementById('neuName');
  var name = f ? String(f.value || '').trim() : '';
  if (!name) { melde('Bitte einen Namen eingeben.', 'warn'); return; }
  /* Unter einem Filter gehört die neue Seite dorthin; sonst wie in der
     Workbench beruflich. */
  var s = kpSeiteAnlegen(kp.neuIn, name, kp.filter);
  kp.neuIn = '';
  if (s) { spaeterSichern(); oeffne('seite', s.id); modusSetzen('schreiben'); }
}

function neuTaste(e) {
  if (e.key === 'Enter') { e.preventDefault(); anlegen(); }
  if (e.key === 'Escape') { kp.neuIn = ''; leisteZeichnen(); }
}

/* ---------- Löschen, Rückgängig ---------- */

function menueUm() { kp.menueAuf = !kp.menueAuf; seiteZeichnen(true); }

function fragen(was) { kp.frage = was; kp.menueAuf = false; seiteZeichnen(true); }

function frageWeg() { kp.frage = ''; seiteZeichnen(true); }

/* Löscht die offene Seite oder eine frühere Woche. Was eine Seite in
   eine Woche gegeben hat, bleibt dort stehen — ohne ↗. */
function kpLoeschen() {
  var satz, sammlung, name;
  if (kp.art === 'seite') {
    var s = kpSeite();
    satz = s ? s.__satz : null;
    sammlung = kpSammlungVon(s);
    name = s ? (s.titel || 'ohne Titel') : '';
  } else if (kp.art === 'woche') {
    var montag = kpOffenerMontag();
    if (montag === kpHeuteMontag()) { return; }
    satz = kpWocheFinden(montag);
    sammlung = 'wochen';
    name = satz ? kpWochenTitel(satz.montag) : '';
  }
  if (!satz) { return; }
  var liste = DB[sammlung];
  var stelle = liste.indexOf(satz);
  if (stelle < 0) { return; }
  liste.splice(stelle, 1);
  grabsteinSetzen(sammlung, satz.id);
  zurueckHolen = { sammlung: sammlung, satz: satz, stelle: stelle };
  spaeterSichern();
  oeffne('woche', '');
  melde('Gelöscht: ' + name, null, true);
}

function rueckgaengig() {
  var z = zurueckHolen;
  if (!z) { return; }
  zurueckHolen = null;
  var liste = DB[z.sammlung];
  liste.splice(Math.min(z.stelle, liste.length), 0, z.satz);
  grabsteinWeg(z.sammlung, z.satz.id);
  z.satz.geaendert = jetzt();
  spaeterSichern();
  var t = document.getElementById('toast');
  if (t) { t.className = 'toast'; }
  if (z.sammlung === 'wochen') { oeffne('woche', z.satz.montag); }
  else { oeffne('seite', z.satz.id); }
}

/* ---------- Ansicht: Editor und Darstellung kommen aus dem Kern ---------- */

/* Verweise aus der Workbench: Gibt es die Seite hier, führt er hin. */
function kpVerweisHtml(art, id, titel) {
  var kennung = String(id).replace(/^g:/, '');
  var s = (art === 'projekt' || art === 'ziel' || art === 'flaeche') ? kpSeiteFinden(kennung) : null;
  if (!s) { return '<span class="wb-tot">' + esc(titel) + '</span>'; }
  return '<button class="wb-link" type="button" onclick="oeffne(\'seite\',\'' + esc(s.id) + '\')">' + esc(s.titel || titel) + '</button>';
}

/* S und V — oder die Marken, wo die Aufgabe steht: in einer Woche
   oder, in der Workbench vorgenommen, an einem Tag. */
function kpPlanHtml(seite, nr, a) {
  if (!a.text) { return ''; }
  var h = '';
  var hatWoche = false;
  kpEintraegeFinden(seite.id, a.text).forEach(function (f) {
    var istTag = !!f.woche.datum;
    if (!istTag) { hatWoche = true; }
    var name = istTag ? ((f.woche.datum === isoDatum()) ? 'Heute' : kpKurz(f.woche.datum))
                      : ('KW ' + kalenderwoche(f.woche.montag) + ' · ' + (f.eintrag.abschnitt === 's' ? 'S' : 'V'));
    h += '<button type="button" class="drin' + (istTag ? ' h' : '') + '" onclick="kpAusplanen(\'' + esc(f.woche.id) + '\',\'' + esc(f.eintrag.id) + '\')" '
       + 'title="Wieder herausnehmen">' + esc(name) + ' ×</button>';
  });
  if (!a.erledigt && !hatWoche) {
    var kw = 'KW ' + kalenderwoche(kpZielMontag());
    h += '<button type="button" class="sv" onclick="kpEinplanen(' + nr + ',\'s\')" title="In ' + kw + ': Substanz" aria-label="In ' + kw + ': Substanz">S</button>'
       + '<button type="button" class="sv" onclick="kpEinplanen(' + nr + ',\'v\')" title="In ' + kw + ': Verbindlichkeit" aria-label="In ' + kw + ': Verbindlichkeit">V</button>';
  }
  return h ? '<span class="plan">' + h + '</span>' : '';
}

/* ---------- Fenster „Offene Aufgaben“ ---------- */

function kpOaUm() {
  kp.oaAuf = !kp.oaAuf;
  seiteZeichnen(true);
}

function kpOaSchleier(e) {
  if (e && e.target && e.currentTarget && e.target !== e.currentTarget) { return; }
  kp.oaAuf = false;
  seiteZeichnen(true);
}

/* ↘ im Fenster: schließen und zur Zeile im Text. */
function kpOaSprung(nr) {
  var s = kpSeite();
  if (!s) { return; }
  var a = kpAufgabe(String(s.text || '').split('\n')[nr] || '');
  kp.oaAuf = false;
  if (kp.modus === 'schreiben') {
    seiteZeichnen(true);
    var f = document.getElementById('kpFeld');
    if (f && f.focus) { f.focus(); }
    if (f) { kpMarkeAnZeile(f, nr, document.querySelector('.seite')); }
    return;
  }
  kpHervorZeigen(a ? a.text : '');
}

function kpOaKnopfHtml() {
  return '<div class="oa"><button type="button" class="oa-knopf" onclick="kpOaUm()" aria-haspopup="dialog" aria-expanded="' + kp.oaAuf + '">'
       + '☐ Offene Aufgaben</button></div>';
}

function kpOaHtml(s) {
  var zeilen = String(s.text || '').split('\n');
  var heute = kpHeuteMontag();
  var h = '<div class="oa-schleier" onclick="kpOaSchleier(event)"><div class="oa-fenster" role="dialog" aria-label="Offene Aufgaben">'
        + '<div class="oa-kopf"><h3>Offene Aufgaben · ' + esc(s.titel || '') + '</h3>'
        + '<button type="button" class="oa-zu" onclick="kpOaUm()" aria-label="Schließen">×</button></div>'
        + '<div class="oa-zw">Planen in <span class="gruppe-knopf" role="group" aria-label="S und V planen in">'
        + '<button type="button" class="' + (kp.zielWoche === 'diese' ? 'an' : '') + '" onclick="kpZielWocheSetzen(\'diese\')">KW ' + kalenderwoche(heute) + '</button>'
        + '<button type="button" class="' + (kp.zielWoche === 'naechste' ? 'an' : '') + '" onclick="kpZielWocheSetzen(\'naechste\')">KW ' + kalenderwoche(tagePlus(heute, 7)) + '</button>'
        + '</span></div><div class="oa-liste">';
  var n = 0;
  var i;
  for (i = 0; i < zeilen.length; i++) {
    var a = kpAufgabe(zeilen[i]);
    if (!a || a.erledigt || !a.text) { continue; }
    n++;
    h += '<div class="oa-zeile"><button class="tkasten" type="button" onclick="kpKastenUm(' + i + ')" aria-label="Abhaken"></button>'
       + '<span class="oa-text">' + kpAuszeichnen(a.text) + '</span>' + kpPlanHtml(s, i, a)
       + '<button type="button" class="oa-hin" onclick="kpOaSprung(' + i + ')" title="Zur Stelle im Text" aria-label="Zur Stelle im Text">↘</button></div>';
  }
  if (!n) { h += '<p class="oa-leer">Keine offenen Aufgaben. Eine Zeile mit [] davor ist eine Aufgabe.</p>'; }
  return h + '</div></div></div>';
}

/* ---------- Seitenleiste ---------- */

function eintragHtml(an, aufruf, zeichen, name, extra, klasse) {
  return '<button type="button" class="eintrag' + (an ? ' an' : '') + (klasse ? ' ' + klasse : '') + '" onclick="' + aufruf + '"'
       + (an ? ' aria-current="page"' : '') + '>'
       + '<span class="zeichen">' + zeichen + '</span><span class="name">' + esc(name) + '</span>' + (extra || '') + '</button>';
}

function neuFeldHtml() {
  return '<div class="neu-feld"><input id="neuName" type="text" maxlength="200" '
       + 'placeholder="' + esc(KP_ARTEN[kp.neuIn].neu) + '" onkeydown="neuTaste(event)">'
       + '<button type="button" class="pille" onclick="anlegen()">Anlegen</button></div>';
}

/* Ein Eintrag der Seitenleiste. Am PC lässt er sich innerhalb seiner
   Gruppe ziehen; im Sortiermodus (Handy) bekommt er ▲ ▼. */
function seitenEintragHtml(s, klasse) {
  var id = esc(s.id);
  var h = eintragHtml(kp.art === 'seite' && kp.id === s.id, 'oeffne(\'seite\',\'' + id + '\')',
                      KP_ARTEN[s.art].zeichen, s.titel || 'ohne Titel', '', klasse);
  h = h.replace('<button type="button" class="eintrag', '<button type="button" draggable="true" data-id="' + id + '" '
      + 'ondragstart="kpZiehStart(event,\'' + id + '\')" ondragover="kpZiehUeber(event,\'' + id + '\')" '
      + 'ondragleave="kpZiehWeg(event)" ondrop="kpZiehAb(event,\'' + id + '\')" ondragend="kpZiehEnde()" class="eintrag');
  if (kp.sortieren !== kpGruppenSchluessel(s)) { return h; }
  return '<div class="sort-zeile">' + h
       + '<button type="button" class="sort-pfeil" onclick="kpSchieben(\'' + id + '\',-1)" aria-label="Nach oben">▲</button>'
       + '<button type="button" class="sort-pfeil" onclick="kpSchieben(\'' + id + '\',1)" aria-label="Nach unten">▼</button></div>';
}

/* ---------- Manuell sortieren ----------

   Sortiert wird nur innerhalb einer Gruppe: Vorhaben „läuft“, „ruht“,
   „erledigt“, Listen, Notizen. Die Ränge der Gruppe werden unter ihren
   Einträgen neu verteilt — die anderen Gruppen bleiben unberührt. */

/* Setzt „id“ vor oder hinter „zielId“ (wo: 'vor' | 'nach'). */
function kpVerschieben(id, zielId, wo) {
  if (!kpVerschiebenKern(id, zielId, wo)) { return false; }
  spaeterSichern();
  leisteZeichnen();
  return true;
}

/* ▲ ▼: mit dem nächsten sichtbaren Eintrag der Gruppe tauschen — unter
   einem Filter bleiben die ausgeblendeten an ihrem Platz. */
function kpSchieben(id, richtung) {
  var s = kpSeiteFinden(id);
  if (!s || (richtung !== -1 && richtung !== 1)) { return; }
  var sichtbar = kpGruppe(kpGruppenSchluessel(s)).filter(kpSichtbar);
  var i = sichtbar.indexOf(s);
  var nachbar = sichtbar[i + richtung];
  if (i < 0 || !nachbar) { return; }
  kpVerschieben(id, nachbar.id, richtung < 0 ? 'vor' : 'nach');
}

function kpSortierenUm(schluessel) {
  kp.sortieren = (kp.sortieren === schluessel) ? '' : schluessel;
  leisteZeichnen();
}

function sortierKnopfHtml(schluessel) {
  var an = (kp.sortieren === schluessel);
  return '<button type="button" class="sortier-knopf' + (an ? ' an' : '') + '" onclick="kpSortierenUm(\'' + schluessel + '\')">'
       + (an ? 'Fertig' : 'Sortieren') + '</button>';
}

var kpGezogen = '';

function kpZiehStart(e, id) {
  kpGezogen = id;
  if (e && e.dataTransfer) {
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', id); } catch (f) { /* manche Browser wollen das nicht */ }
  }
}

function kpZiehMarkeWeg() {
  var alle = (typeof document.querySelectorAll === 'function') ? document.querySelectorAll('.zieh-vor, .zieh-nach') : [];
  var i;
  for (i = 0; i < alle.length; i++) { alle[i].classList.remove('zieh-vor'); alle[i].classList.remove('zieh-nach'); }
}

/* Wohin es fällt: obere Hälfte davor, untere dahinter. */
function kpZiehStelle(e) {
  var el = e.currentTarget;
  if (!el || typeof el.getBoundingClientRect !== 'function') { return 'nach'; }
  var r = el.getBoundingClientRect();
  return (e.clientY - r.top < r.height / 2) ? 'vor' : 'nach';
}

function kpZiehUeber(e, id) {
  var s = kpSeiteFinden(kpGezogen);
  var z = kpSeiteFinden(id);
  if (!s || !z || s === z || kpGruppenSchluessel(s) !== kpGruppenSchluessel(z)) { return; }
  e.preventDefault();
  if (e.dataTransfer) { e.dataTransfer.dropEffect = 'move'; }
  kpZiehMarkeWeg();
  if (e.currentTarget && e.currentTarget.classList) { e.currentTarget.classList.add(kpZiehStelle(e) === 'vor' ? 'zieh-vor' : 'zieh-nach'); }
}

function kpZiehWeg(e) {
  if (e.currentTarget && e.currentTarget.classList) {
    e.currentTarget.classList.remove('zieh-vor');
    e.currentTarget.classList.remove('zieh-nach');
  }
}

function kpZiehAb(e, id) {
  e.preventDefault();
  var wo = kpZiehStelle(e);
  var gezogen = kpGezogen;
  kpZiehEnde();
  kpVerschieben(gezogen, id, wo);
}

function kpZiehEnde() {
  kpGezogen = '';
  kpZiehMarkeWeg();
}

/* Eine einklappbare Gruppe: Kopf mit Pfeil, offen auch dann, wenn die
   offene Seite darin liegt. */
function klappGruppeHtml(was, titel, seiten, klasse) {
  if (!seiten.length) { return ''; }
  var feld = { ruht: 'ruhtAuf', fertig: 'fertigAuf' }[was];
  var auf = kp[feld] || (kp.art === 'seite' && seiten.some(function (s) { return s.id === kp.id; }));
  var schluessel = (was === 'ruht') ? 'vorhaben-ruht' : 'vorhaben-erledigt';
  var h = '<div class="gruppe leise"><button type="button" class="klapp-kopf" onclick="klappUm(\'' + was + '\')" aria-expanded="' + auf + '">'
        + (auf ? '⌄ ' : '› ') + titel + ' · ' + seiten.length + '</button>'
        + (auf && seiten.length > 1 ? sortierKnopfHtml(schluessel) : '') + '</div>';
  if (auf) { seiten.forEach(function (s) { h += seitenEintragHtml(s, klasse); }); }
  return h;
}

function klappUm(was) {
  var feld = { ruht: 'ruhtAuf', fertig: 'fertigAuf', notiz: 'notizenAuf' }[was];
  if (!feld) { return; }
  kp[feld] = !kp[feld];
  leisteZeichnen();
}

function gruppeKopfHtml(art) {
  var titel = KP_ARTEN[art].gruppe;
  if (art === 'notiz') {
    var auf = kpNotizenAuf();
    titel = '<button type="button" class="klapp-kopf" onclick="klappUm(\'notiz\')" aria-expanded="' + auf + '">'
          + (auf ? '⌄ ' : '› ') + titel + '</button>';
  }
  var schluessel = (art === 'vorhaben') ? 'vorhaben-laeuft' : art;
  var sortierbar = (art !== 'notiz' || kpNotizenAuf()) && kpGruppe(schluessel).filter(kpSichtbar).length > 1;
  return '<div class="gruppe"><span>' + titel + '</span>' + (sortierbar ? sortierKnopfHtml(schluessel) : '')
       + '<button type="button" class="plus" onclick="neuOeffnen(\'' + art + '\')" '
       + 'title="Neu: ' + KP_ARTEN[art].name + '" aria-label="Neu: ' + KP_ARTEN[art].name + '" aria-expanded="' + (kp.neuIn === art) + '">+</button></div>'
       + (kp.neuIn === art ? neuFeldHtml() : '');
}

function leisteZeichnen() {
  var el = document.getElementById('leiste');
  if (!el) { return; }
  var heute = kpHeuteMontag();
  var naechste = tagePlus(heute, 7);
  var offen = (kp.art === 'woche') ? kpOffenerMontag() : '';
  var h = eintragHtml(offen === heute, 'oeffne(\'woche\',\'\')', '<span class="stern">★</span>', 'Diese Woche',
                      '<span class="marke-klein">KW ' + kalenderwoche(heute) + '</span>');
  h += eintragHtml(offen === naechste, 'oeffne(\'woche\',\'' + naechste + '\')', '→', 'Nächste Woche',
                   '<span class="marke-klein">KW ' + kalenderwoche(naechste) + '</span>');

  h += '<div class="filter" role="group" aria-label="Beruf oder Privat">'
     + [['alle', 'Alle'], ['beruflich', 'Beruf'], ['privat', 'Privat']].map(function (p) {
       return '<button type="button" class="' + (kp.filter === p[0] ? 'an' : '') + '" onclick="kpFilterSetzen(\'' + p[0] + '\')">' + p[1] + '</button>';
     }).join('') + '</div>';
  var leerText = function (wort) {
    return '<div class="leer-hinweis">' + (kp.filter === 'alle' ? 'Noch keine ' + wort + '.' : 'Keine ' + wort + ' unter diesem Filter.') + '</div>';
  };
  h += gruppeKopfHtml('vorhaben');
  var vh = kpSeiten('vorhaben').filter(kpSichtbar);
  var laeuft = vh.filter(function (s) { return (s.zustand || 'laeuft') === 'laeuft'; });
  var ruht = vh.filter(function (s) { return s.zustand === 'ruht'; });
  var fertig = vh.filter(function (s) { return s.zustand === 'erledigt'; });
  if (!vh.length) { h += leerText('Vorhaben'); }
  laeuft.forEach(function (s) { h += seitenEintragHtml(s, ''); });
  h += klappGruppeHtml('ruht', 'Ruht', ruht, 'ruht');
  h += klappGruppeHtml('fertig', 'Erledigt', fertig, 'ruht');

  h += gruppeKopfHtml('liste');
  var listen = kpSeiten('liste').filter(kpSichtbar);
  if (!listen.length) { h += leerText('Listen'); }
  listen.forEach(function (s) { h += seitenEintragHtml(s, ''); });

  h += gruppeKopfHtml('notiz');
  var notizen = kpSeiten('notiz').filter(kpSichtbar);
  if (kpNotizenAuf()) {
    if (!notizen.length) { h += leerText('Notizen'); }
    notizen.forEach(function (s) { h += seitenEintragHtml(s, ''); });
  }

  el.innerHTML = h;
  el.classList.toggle('auf', kp.leisteAuf);
  var schleier = document.getElementById('schleier');
  if (schleier) { schleier.classList.toggle('auf', kp.leisteAuf); }
}

/* Notizen sind beim Start eingeklappt — offen, wenn man sie aufklappt
   oder gerade eine Notiz offen hat. */
function kpNotizenAuf() {
  var s = (kp.art === 'seite') ? kpSeite() : null;
  return kp.notizenAuf || kp.neuIn === 'notiz' || !!(s && s.art === 'notiz');
}

function leisteUm() {
  kp.leisteAuf = !kp.leisteAuf;
  leisteZeichnen();
}

/* ---------- Die ruhige Woche ---------- */

function wocheHtml(montag) {
  var heute = kpHeuteMontag();
  var w = kpWocheFinden(montag);
  var text = (w && typeof w.text === 'string') ? w.text : (w ? kpWocheTextAus(w) : kpWocheGeruest());
  var titel = (montag === heute) ? 'Diese Woche' : ((montag === tagePlus(heute, 7)) ? 'Nächste Woche' : 'Frühere Woche');
  var h = '<div class="ruhig"><div class="r-kopf"><span class="r-kw">' + titel + ' · ' + esc(kpWochenTitel(montag)) + '</span>'
        + modusKnoepfe() + mehrHtml() + '</div>';
  if (kp.frage) { h += frageHtml(); }
  if (!kpUmgestellt()) { h += umHinweisHtml(); }
  if (kp.modus === 'schreiben') {
    h += kpLeisteHtml()
       + '<textarea id="kpFeld" class="feld" spellcheck="true" aria-label="Woche schreiben" '
       + 'oninput="kpTextSetzen(this.value)" onkeydown="kpTaste(event)" onbeforeinput="kpVorEingabe(event)">' + esc(text) + '</textarea>';
  } else {
    h += '<div class="w-text">' + kpAnsichtHtml({ id: w ? w.id : '', text: text, eintraege: w ? w.eintraege : [] }, true, '') + '</div>';
    var aufgaben = text.split('\n').some(function (z) { return !!kpAufgabe(z); });
    if (!aufgaben && montag >= heute) {
      h += '<p class="r-hinweis">Geplant wird auf einer Liste, einem Vorhaben oder einer Notiz: '
         + '„Offene Aufgaben“ öffnen, dort S oder V. Schreiben kannst du hier alles andere.</p>';
    }
  }
  return h + '</div>' + archivHtml(montag);
}

/* Solange die Workbench nicht umgestellt ist, sind ihre Aufgaben noch
   keine Zeilen — dann gibt es hier wenig zu planen. */
function umHinweisHtml() {
  return '<p class="r-hinweis um-hinweis"><b>Erst in der Workbench umstellen.</b> Deine Aufgaben stehen dort noch nicht '
       + 'als Zeilen in Vorhaben und Listen. Öffne die Workbench (ab 6.0) und tippe im Tag auf „Ansehen“ beim Hinweis '
       + '„Umstellung auf Aktivitäten“. Danach siehst du hier alles.</p>';
}

function archivHtml(montagOffen) {
  var heute = kpHeuteMontag();
  var alte = kpWochen().filter(function (w) { return w.montag < heute; });
  if (!alte.length) { return ''; }
  var h = '<details class="archiv"' + (montagOffen < heute ? ' open' : '') + '><summary>Frühere Wochen · ' + alte.length + '</summary>';
  alte.forEach(function (w) {
    h += '<button type="button" class="' + (w.montag === montagOffen ? 'an' : '') + '" onclick="oeffne(\'woche\',\'' + w.montag + '\')">'
       + esc(kpWochenTitel(w.montag)) + '</button>';
  });
  return h + '</details>';
}

/* ---------- Seite ---------- */

function mehrHtml() {
  var kann = (kp.art === 'seite' && kpSeite())
          || (kp.art === 'woche' && kpOffenerMontag() !== kpHeuteMontag() && kpWocheFinden(kpOffenerMontag()));
  if (!kann) { return ''; }
  var h = '<span class="mehr-h"><button type="button" class="mehr" onclick="menueUm()" aria-label="Weitere Aktionen" '
        + 'aria-expanded="' + kp.menueAuf + '">⋯</button>';
  if (kp.menueAuf) {
    h += '<span class="mehr-menue"><button type="button" class="weg" onclick="fragen(\'loeschen\')">Löschen …</button></span>';
  }
  return h + '</span>';
}

function frageHtml() {
  if (kp.frage !== 'loeschen') { return ''; }
  var s = kpSeite();
  var name, folge;
  if (s) {
    name = s.titel || 'ohne Titel';
    folge = 'Die Seite ist weg. Was sie in eine Woche gegeben hat, bleibt dort stehen.';
  } else {
    name = kpWochenTitel(kpOffenerMontag());
    folge = 'Die Woche ist weg, die Seiten bleiben unberührt.';
  }
  return '<div class="frage" role="alertdialog"><p><b>„' + esc(name) + '“ löschen?</b> ' + folge + '</p><div class="knoepfe">'
       + '<button type="button" class="pille weg" onclick="kpLoeschen()">Löschen</button>'
       + ((s && s.art === 'vorhaben' && s.zustand !== 'erledigt') ? '<button type="button" class="pille" onclick="kpZustand(\'erledigt\')">Lieber auf erledigt</button>' : '')
       + '<button type="button" class="pille" onclick="frageWeg()">Abbrechen</button></div></div>';
}

function modusKnoepfe() {
  return '<span class="umschalter" role="group" aria-label="Ansicht oder Schreiben">'
       + '<button type="button" class="' + (kp.modus === 'ansicht' ? 'an' : '') + '" onclick="modusSetzen(\'ansicht\')">Ansicht</button>'
       + '<button type="button" class="' + (kp.modus === 'schreiben' ? 'an' : '') + '" onclick="modusSetzen(\'schreiben\')">Schreiben</button></span>';
}

function eigenschaftenHtml(s) {
  var h = '<div class="eigen"><span class="art-marke">' + KP_ARTEN[s.art].name + '</span>';
  h += '<span class="gruppe-knopf" role="group" aria-label="Beruf oder Privat">' + KP_KONTEXTE.map(function (p) {
    return '<button type="button" class="' + (s.kontext === p[0] ? 'an' : '') + '" onclick="kpKontext(\'' + p[0] + '\')">' + p[1] + '</button>';
  }).join('') + '</span>';
  if (s.art === 'vorhaben') {
    var z = s.zustand || 'laeuft';
    if (s.typ || s.termin) {
      h += '<span class="leise">' + (s.typ === 'ziel' ? 'Ziel' : (s.typ === 'projekt' ? 'Projekt' : ''))
         + (s.termin ? (s.typ ? ' · ' : '') + 'bis ' + esc(kpKurz(s.termin)) + s.termin.slice(0, 4) : '') + '</span>';
    }
    h += '<span class="gruppe-knopf" role="group" aria-label="Zustand">' + KP_ZUSTAENDE.map(function (p) {
      return '<button type="button" class="' + (z === p[0] ? 'an' : '') + '" onclick="kpZustand(\'' + p[0] + '\')">' + p[1] + '</button>';
    }).join('') + '</span>';
  }
  return h + '</div>';
}

function blattHtml(s) {
  if (kp.modus === 'schreiben') {
    return kpLeisteHtml()
         + '<textarea id="kpFeld" class="feld" spellcheck="true" aria-label="Seite schreiben" '
         + 'placeholder="Fließtext — eine Zeile mit [] davor ist eine Aufgabe" '
         + 'oninput="kpTextSetzen(this.value)" onkeydown="kpTaste(event)" onbeforeinput="kpVorEingabe(event)">' + esc(s.text || '') + '</textarea>';
  }
  if (!String(s.text || '').trim()) {
    return '<div class="blatt leer-blatt"><p>Noch leer. „Schreiben“ füllt die Seite — eine Zeile mit [] davor ist eine Aufgabe.</p></div>';
  }
  return '<div class="blatt">' + kpAnsichtHtml(s, null, kp.hervor) + '</div>';
}

/* zeichnen: Ein offenes Schreibfeld wird nicht überschrieben, solange
   darin getippt wird — es sei denn, es ist ausdrücklich verlangt. */
function seiteZeichnen(erzwingen) {
  var el = document.getElementById('seite');
  if (!el) { return; }
  var aktiv = document.activeElement;
  if (!erzwingen && aktiv && (aktiv.id === 'kpFeld' || aktiv.id === 'kpTitel')) { return; }
  if (kp.art === 'einst') { el.innerHTML = einstHtml(); return; }
  if (kp.art === 'woche') { el.innerHTML = wocheHtml(kpOffenerMontag()); return; }
  var s = kpSeite();
  if (!s) {
    el.innerHTML = '<div class="blatt leer-blatt"><p>Diese Seite gibt es nicht mehr.</p>'
                 + '<button type="button" class="pille" onclick="oeffne(\'woche\',\'\')">Zur Woche</button></div>';
    return;
  }
  var h = '<div class="seitenkopf"><input id="kpTitel" class="titelfeld" type="text" maxlength="200" value="' + esc(s.titel || '') + '" '
        + 'aria-label="Name" onchange="kpTitelSetzen(this.value)" onkeydown="titelTaste(event)">'
        + modusKnoepfe() + mehrHtml() + '</div>';
  h += eigenschaftenHtml(s);
  if (kp.frage) { h += frageHtml(); }
  h += kpOaKnopfHtml();
  h += blattHtml(s);
  if (kp.oaAuf) { h += kpOaHtml(s); }
  el.innerHTML = h;
}

function titelTaste(e) {
  if (e.key === 'Enter' && e.target && e.target.blur) { e.target.blur(); }
}

    + (fsApiDa() ? '<button type="button" class="pille" onclick="dateiWaehlen()">Datei öffnen …</button>'

    + '<section class="karte"><h3>Über</h3><div class="reihe"><span>Version</span><span>Wochenkompass ' + APP_VERSION + '</span></div>'
    + (neueVersion ? '<div class="reihe"><span>Neue Fassung</span><span class="gut">' + esc(neueVersion) + ' liegt bereit</span></div>' : '')
    + '<div class="knoepfe"><button type="button" class="pille" onclick="versionPruefen(true)">Auf neue Fassung prüfen</button>'
    + (neueVersion ? '<button type="button" class="pille voll" onclick="neuLaden()">Jetzt laden</button>' : '') + '</div>'
    + '<p>Die App fragt außerdem beim Start, beim Zurückkehren und alle 15 Minuten selbst nach. Vor dem Laden wird gesichert.</p></section>'

}

function sicherungLaden() {
  var name = 'workbench-sicherung-' + isoDatum() + '.json';
  if (dateiAnbieten(name, alsText())) { melde('Sicherung bereitgestellt: ' + name, 'gut'); }
  else { melde('Die Sicherung ließ sich nicht bereitstellen.', 'warn'); }
}

/* ---------- Stand und Rückmeldungen ---------- */

var toastZeit = 0;

function melde(text, art, mitRueckgaengig) {
  var t = document.getElementById('toast');
  var tt = document.getElementById('toastText');
  var tr = document.getElementById('toastRueck');
  if (!t || !tt) { return; }
  tt.textContent = String(text || '');
  if (tr) { tr.style.display = mitRueckgaengig ? '' : 'none'; }
  t.className = 'toast auf' + (art ? ' ' + art : '');
  if (toastZeit) { window.clearTimeout(toastZeit); }
  toastZeit = window.setTimeout(function () {
    var el = document.getElementById('toast');
    if (el) { el.className = 'toast'; }
    toastZeit = 0;
  }, mitRueckgaengig ? 9000 : ((art === 'warn') ? 7000 : 4000));
}

function standText() {
  if (!tokenGueltig()) {
    return warAngemeldet() ? { text: 'Anmeldung abgelaufen — neu anmelden', warn: true }
                           : { text: 'nur auf diesem Gerät', warn: false };
  }
  if (abgleichFehler) { return { text: 'Abgleich fehlgeschlagen', warn: true }; }
  if (verbindungOk === false) { return { text: 'keine Verbindung — lokal gespeichert', warn: true }; }
  if (abgleichLaeuft) { return { text: 'gleicht ab …', warn: false }; }
  if (letzterAbgleich) { return { text: DRIVE_DATEI + ' · abgeglichen ' + letzterAbgleich.slice(11, 16), warn: false }; }
  return { text: 'angemeldet', warn: false };
}

function standZeichnen() {
  var el = document.getElementById('standPille');
  if (el) {
    var s = standText();
    el.textContent = s.text;
    el.className = 'stand' + (s.warn ? ' warn' : '');
  }
  anmeldebannerZeichnen();
}

/* Wie in der Workbench: Ein Streifen oben meldet sich nur, wenn keine
   Verbindung zu Google besteht — mit „Neu verbinden". */
function anmeldebannerZeichnen() {
  var streifen = document.getElementById('anmeldeStreifen');
  var text = document.getElementById('anmeldeText');
  if (!streifen || !text) { return; }
  if (tokenGueltig() && verbindungOk !== false) {
    streifen.classList.remove('sichtbar');
    return;
  }
  if (!tokenGueltig()) {
    text.textContent = warAngemeldet()
      ? 'Die Anmeldung bei Google ist abgelaufen — bitte neu anmelden.'
      : 'Noch nicht bei Google angemeldet — es wird nur lokal gespeichert.';
  } else {
    text.textContent = 'Keine Verbindung zu Google — es wird nur lokal gespeichert.';
  }
  streifen.classList.add('sichtbar');
}

/* Die Workbench-Funktionen rufen diesen Namen. */
function anmeldeStreifenPruefen() { standZeichnen(); }

/* Wer schon einmal angemeldet war, wird still neu angemeldet: beim Start
   und sobald die App merkt, dass sie nicht verbunden ist. Google erneuert
   ohne Nachfrage, solange die Sitzung im Browser besteht; erst wenn das
   misslingt, bleibt der Streifen mit „Neu verbinden". Höchstens einmal
   je Minute, damit kein Fenster flackert. */
function stillAnmelden(grund) {
  if (anmeldungLaeuft || tokenGueltig() || !warAngemeldet()) { return Promise.resolve(false); }
  if (Date.now() - stillVersuchtMs < STILL_ABSTAND) { return Promise.resolve(false); }
  stillVersuchtMs = Date.now();
  return anmelden(true).then(function (gut) {
    if (gut) {
      verbindungOk = true;
      if (grund !== 'start') { melde('Verbindung zu Google wiederhergestellt.', 'gut'); }
      else { melde('Anmeldung im Hintergrund erneuert.', 'gut'); }
      abgleichPlanen(true);
    } else {
      verbindungOk = false;
      melde('Die Anmeldung ließ sich nicht im Hintergrund erneuern.\nBitte oben auf „Neu verbinden“ tippen.', 'warn');
    }
    zeichne();
    return gut;
  });
}

function standGeklickt() {

/* ---------- Speichern und Abgleich ---------- */

  if (!tokenGueltig()) { verbindungOk = false; standZeichnen(); stillAnmelden('verbindung'); return; }

/* ---------- Neue Fassung suchen und laden — wie in der Workbench ----------

   Der Service Worker holt alles zuerst aus dem Netz. Zusätzlich fragt die
   App aktiv nach, damit ein offenes Fenster nicht tagelang auf einem
   alten Stand bleibt. */

var VERSION_TAKT = 15 * 60 * 1000;
var neueVersion = '';
var versionUhr = null;

function versionPruefen(laut) {
  if (typeof window.fetch !== 'function') { return Promise.resolve(null); }
  var adresse = './wochenkompass.html?stand=' + Date.now();
  return window.fetch(adresse, { cache: 'no-store' }).then(function (a) {
    if (!a.ok) { throw new Error('Abruf mit Status ' + a.status); }
    return a.text();
  }).then(function (text) {
    var treffer = text.match(/APP_VERSION\s*=\s*'([\d.]+)'/);
    if (!treffer) { throw new Error('Im Abruf steht keine Versionsnummer.'); }
    var dort = treffer[1];
    if (dort !== APP_VERSION) {
      neueVersion = dort;
      neuStreifenZeigen(dort);
      if (laut) { melde('Neue Fassung ' + dort + ' gefunden.', 'gut'); }
    } else {
      neueVersion = '';
      neuStreifenVerbergen();
      if (laut) { melde('Die laufende Fassung ' + APP_VERSION + ' ist die neueste.', 'gut'); }
    }
    if (kp.art === 'einst') { seiteZeichnen(true); }
    return dort;
  }).catch(function (f) {
    if (laut) { melde('Versionsprüfung nicht möglich.\n' + (f ? f.message : ''), 'warn'); }
    return null;
  });
}

function neuStreifenZeigen(dort) {
  var streifen = document.getElementById('neuStreifen');
  var text = document.getElementById('neuText');
  if (!streifen || !text) { return; }
  text.textContent = 'Neue Fassung ' + dort + ' verfügbar (läuft: ' + APP_VERSION + ')';
  streifen.classList.add('sichtbar');
}

function neuStreifenVerbergen() {
  var streifen = document.getElementById('neuStreifen');
  if (streifen) { streifen.classList.remove('sichtbar'); }
}

/* Vor dem Neuladen wird alles Wartende gesichert, sonst geht die
   letzte Änderung beim Austausch verloren. */
function neuLaden() {
  neuStreifenVerbergen();
  melde('Neue Fassung wird geladen …', null);
  speichern().catch(function () { return null; }).then(function () {
    if (!navigator.serviceWorker || typeof navigator.serviceWorker.getRegistration !== 'function') { return null; }
    return navigator.serviceWorker.getRegistration('./wochenkompass').then(function (anmeldung) {
      if (!anmeldung) { return null; }
      if (anmeldung.waiting) { anmeldung.waiting.postMessage('sofort-uebernehmen'); }
      return anmeldung.update().catch(function () { return null; });
    }).catch(function () { return null; });
  }).then(function () {
    window.setTimeout(function () { window.location.reload(); }, 600);
  });
}

function versionTaktStarten() {
  if (versionUhr) { window.clearInterval(versionUhr); }
  versionUhr = window.setInterval(function () {
    if (document.hidden) { return; }
    versionPruefen(false);
  }, VERSION_TAKT);
}

/* ---------- Start ---------- */

function breiteSetzen() {
  document.body.classList.toggle('breit', (window.innerWidth || 0) >= 900);
}

function swAnmelden() {
  if (!navigator.serviceWorker || typeof navigator.serviceWorker.register !== 'function') { return; }
  if (!/^https?:/.test(String(window.location && window.location.protocol))) { return; }
  /* Eigener Bereich: Der Service Worker der Workbench (Bereich ./)
     bleibt unberührt. */
  navigator.serviceWorker.register('./sw-wochenkompass.js', { scope: './wochenkompass' })
    .catch(function () { return null; });
}

function tasteGlobal(e) {
  if (e && e.key === 'Escape' && kp.oaAuf) { kp.oaAuf = false; seiteZeichnen(true); }
}

function start() {

    ? idbLesen(IDB_KEY).then(function (h) { if (h) { dateiHandle = h; dateiName = h.name || ''; } }).catch(function () { return null; })
    : Promise.resolve(null);

       Workbench zu Text — vorher hätten sie keine Zeilen als Quelle. */
    if (kpUmgestellt()) { kpWochenUmstellen(); }
    zeichne(true);
    if (tokenGueltig()) { abgleichPlanen(true); verbindungPruefen(); }
    taktStarten();
    verbindungTaktStarten();
  }).catch(function (f) {
    melde('Laden fehlgeschlagen: ' + (f ? f.message : ''), 'warn');
    zeichne(true);
  });
  document.addEventListener('visibilitychange', rueckkehrPruefen);
  document.addEventListener('click', klickErneuern, true);
  window.addEventListener('focus', standZeichnen);
  window.addEventListener('focus', erneuerungPruefen);
  window.setInterval(standZeichnen, 15000);
  swAnmelden();
  versionPruefen(false);
  versionTaktStarten();
}

window.addEventListener('DOMContentLoaded', start);
