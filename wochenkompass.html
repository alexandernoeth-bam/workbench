}

/* In der Woche: Überschriften als ruhige Abschnittsköpfe, Aufgaben ohne
   Kästchen — ein Klick streicht durch, ↗ nur mit Quelle. */
function kpWochenZeileHtml(w, rest, nr, stil) {
  var ueber = rest.match(/^(#{1,3})\s*(.*)$/);
  if (ueber) {
    return (ueber[1].length < 3 ? '<h2 class="r-h"' : '<div class="fl-h3"') + stil + '>' + kpAuszeichnen(ueber[2])
         + (ueber[1].length < 3 ? '</h2>' : '</div>');
  }
  var a = kpAufgabe(rest);
  if (!a) { return ''; }
  var kasten = rest.match(KP_KASTEN);
  var e = (w && a.text) ? kpWocheEintrag(w, a.text) : null;
  var name = e ? (kpSeiteFinden(e.quelle).titel || 'ohne Titel') : '';
  return '<div class="wz' + (a.erledigt ? ' erl' : '') + '"' + stil + '>'
       + '<button type="button" class="wt" onclick="kpWocheZeileUm(' + nr + ')" aria-pressed="' + a.erledigt + '">' + kpAuszeichnen(kasten[3]) + '</button>'
       + (e ? '<button type="button" class="hin" onclick="kpWocheSprung(' + nr + ')" title="Zu „' + esc(name) + '“" aria-label="Zu „' + esc(name) + '“">↗</button>' : '')
       + '</div>';
}

function kpZeileHtml(seite, zeile, nr, nummer, woche) {
  var roh = String(zeile);
  var tiefe = 0;
  var rest = roh;
  while (rest.indexOf('  ') === 0) { tiefe++; rest = rest.slice(2); }
  if (tiefe > 6) { tiefe = 6; }
  rest = rest.replace(/^\t+/, '');
  var stil = tiefe ? (' style="padding-left:' + (tiefe * 18) + 'px"') : '';
  if (/^!skizze:/.test(rest)) { return '<div class="fl-absatz leise"' + stil + '>Skizze — nur in der Workbench zu sehen</div>'; }
  if (/^---+\s*$/.test(rest)) { return '<div class="fl-trenner"' + stil + '></div>'; }
  if (rest.length === 0) { return '<div class="fl-leer"></div>'; }
  if (woche) {
    var wz = kpWochenZeileHtml(seite, rest, nr, stil);
    if (wz) { return wz; }
  }
  var ueber = rest.match(/^(#{1,3})\s*(.*)$/);
  if (ueber) { return '<div class="fl-h' + ueber[1].length + '"' + stil + '>' + kpAuszeichnen(ueber[2]) + '</div>'; }
  var a = kpAufgabe(rest);
  if (a) {
    var kasten = rest.match(KP_KASTEN);
    var hervor = !!(kp.hervor && kpZeileSuchen(seite, kp.hervor) && kpZeileSuchen(seite, kp.hervor).nr === nr);
    return '<div class="fl-zeile aufgabe' + (hervor ? ' hervor' : '') + '"' + (hervor ? ' id="kpHervor"' : '') + stil + '>'
         + '<button class="tkasten' + (a.erledigt ? ' an' : '') + '" type="button" onclick="kpKastenUm(' + nr + ')" aria-label="Abhaken"></button>'
         + '<span class="fl-text' + (a.erledigt ? ' fertig' : '') + '">' + kpAuszeichnen(kasten[3]) + '</span></div>';
  }
  var nummeriert = rest.match(NUMMER_MUSTER);
  if (nummeriert) {
    return '<div class="fl-zeile"' + stil + '><span class="fl-nr">' + (nummer || Number(nummeriert[1])) + '.</span>'
         + '<span class="fl-text">' + kpAuszeichnen(nummeriert[2]) + '</span></div>';
  }
  var punkt = rest.match(/^[-•*]\s+(.*)$/);
  if (punkt) {
    return '<div class="fl-zeile"' + stil + '><span class="fl-punkt"></span><span class="fl-text">' + kpAuszeichnen(punkt[1]) + '</span></div>';
  }
  return '<div class="fl-absatz"' + stil + '>' + kpAuszeichnen(rest) + '</div>';
}

function kpAnsichtHtml(seite, woche) {
  var zeilen = String((seite && seite.text) || '').split('\n');
  var nummern = listenNummern(zeilen);
  var h = '';
  var i;
  for (i = 0; i < zeilen.length; i++) {
    if (istTabellenzeile(zeilen[i])) {
      var tab = tabelleHtml(zeilen, i, kpAuszeichnen, null);
      if (tab.zahl) { h += tab.html; i += tab.zahl - 1; continue; }
    }
    h += kpZeileHtml(seite, zeilen[i], i, nummern[i], !!woche);
  }
  return h;
}

/* ---------- Seitenleiste ---------- */

function eintragHtml(an, aufruf, zeichen, name, extra, klasse) {
  return '<button type="button" class="eintrag' + (an ? ' an' : '') + (klasse ? ' ' + klasse : '') + '" onclick="' + aufruf + '"'
       + (an ? ' aria-current="page"' : '') + '>'
       + '<span class="zeichen">' + zeichen + '</span><span class="name">' + esc(name) + '</span>' + (extra || '') + '</button>';
}

function neuFeldHtml() {
  return '<div class="neu-feld"><input id="neuName" type="text" maxlength="200" '
       + 'placeholder="' + esc(KP_ARTEN[kp.neuIn].neu) + '" onkeydown="neuTaste(event)">'
       + '<button type="button" class="pille" onclick="anlegen()">Anlegen</button></div>';
}

/* Ein Eintrag der Seitenleiste. Am PC lässt er sich innerhalb seiner
   Gruppe ziehen; im Sortiermodus (Handy) bekommt er ▲ ▼. */
function seitenEintragHtml(s, klasse) {
  var id = esc(s.id);
  var h = eintragHtml(kp.art === 'seite' && kp.id === s.id, 'oeffne(\'seite\',\'' + id + '\')',
                      KP_ARTEN[s.art].zeichen, s.titel || 'ohne Titel', '', klasse);
  h = h.replace('<button type="button" class="eintrag', '<button type="button" draggable="true" data-id="' + id + '" '
      + 'ondragstart="kpZiehStart(event,\'' + id + '\')" ondragover="kpZiehUeber(event,\'' + id + '\')" '
      + 'ondragleave="kpZiehWeg(event)" ondrop="kpZiehAb(event,\'' + id + '\')" ondragend="kpZiehEnde()" class="eintrag');
  if (kp.sortieren !== kpGruppenSchluessel(s)) { return h; }
  return '<div class="sort-zeile">' + h
       + '<button type="button" class="sort-pfeil" onclick="kpSchieben(\'' + id + '\',-1)" aria-label="Nach oben">▲</button>'
       + '<button type="button" class="sort-pfeil" onclick="kpSchieben(\'' + id + '\',1)" aria-label="Nach unten">▼</button></div>';
}

/* ---------- Manuell sortieren ----------

   Sortiert wird nur innerhalb einer Gruppe: Vorhaben „läuft“, „ruht“,
   „erledigt“, Listen, Notizen. Die Ränge der Gruppe werden unter ihren
   Einträgen neu verteilt — die anderen Gruppen bleiben unberührt. */

function kpGruppenSchluessel(s) {
  return (s.art === 'vorhaben') ? 'vorhaben-' + (s.zustand || 'laeuft') : s.art;
}

function kpGruppe(schluessel) {
  return (DB.seiten || []).filter(function (s) { return kpGruppenSchluessel(s) === schluessel; })
    .sort(function (a, b) { return (Number(a.rang) || 0) - (Number(b.rang) || 0); });
}

/* Setzt „id“ vor oder hinter „zielId“ (wo: 'vor' | 'nach'). */
function kpVerschieben(id, zielId, wo) {
  var s = kpSeiteFinden(id);
  var z = kpSeiteFinden(zielId);
  if (!s || !z || s === z || kpGruppenSchluessel(s) !== kpGruppenSchluessel(z)) { return false; }
  var gruppe = kpGruppe(kpGruppenSchluessel(s));
  var raenge = gruppe.map(function (x) { return Number(x.rang) || 0; });
  /* Gleiche oder fehlende Ränge (alte Daten) erst auseinanderziehen. */
  var eindeutig = raenge.every(function (r, i) { return i === 0 || r > raenge[i - 1]; });
  if (!eindeutig) {
    var basis = kpNaechsterRang();
    raenge = gruppe.map(function (x, i) { return basis + i; });
  }
  var neu = gruppe.filter(function (x) { return x !== s; });
  var stelle = neu.indexOf(z) + (wo === 'nach' ? 1 : 0);
  neu.splice(stelle, 0, s);
  neu.forEach(function (x, i) {
    if (x.rang !== raenge[i]) { x.rang = raenge[i]; x.geaendert = jetzt(); }
  });
  spaeterSichern();
  leisteZeichnen();
  return true;
}

/* ▲ ▼: mit dem nächsten sichtbaren Eintrag der Gruppe tauschen — unter
   einem Filter bleiben die ausgeblendeten an ihrem Platz. */
function kpSchieben(id, richtung) {
  var s = kpSeiteFinden(id);
  if (!s || (richtung !== -1 && richtung !== 1)) { return; }
  var sichtbar = kpGruppe(kpGruppenSchluessel(s)).filter(kpSichtbar);
  var i = sichtbar.indexOf(s);
  var nachbar = sichtbar[i + richtung];
  if (i < 0 || !nachbar) { return; }
  kpVerschieben(id, nachbar.id, richtung < 0 ? 'vor' : 'nach');
}

function kpSortierenUm(schluessel) {
  kp.sortieren = (kp.sortieren === schluessel) ? '' : schluessel;
  leisteZeichnen();
}

function sortierKnopfHtml(schluessel) {
  var an = (kp.sortieren === schluessel);
  return '<button type="button" class="sortier-knopf' + (an ? ' an' : '') + '" onclick="kpSortierenUm(\'' + schluessel + '\')">'
       + (an ? 'Fertig' : 'Sortieren') + '</button>';
}

var kpGezogen = '';

function kpZiehStart(e, id) {
  kpGezogen = id;
  if (e && e.dataTransfer) {
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', id); } catch (f) { /* manche Browser wollen das nicht */ }
  }
}

function kpZiehMarkeWeg() {
  var alle = (typeof document.querySelectorAll === 'function') ? document.querySelectorAll('.zieh-vor, .zieh-nach') : [];
  var i;
  for (i = 0; i < alle.length; i++) { alle[i].classList.remove('zieh-vor'); alle[i].classList.remove('zieh-nach'); }
}

/* Wohin es fällt: obere Hälfte davor, untere dahinter. */
function kpZiehStelle(e) {
  var el = e.currentTarget;
  if (!el || typeof el.getBoundingClientRect !== 'function') { return 'nach'; }
  var r = el.getBoundingClientRect();
  return (e.clientY - r.top < r.height / 2) ? 'vor' : 'nach';
}

function kpZiehUeber(e, id) {
  var s = kpSeiteFinden(kpGezogen);
  var z = kpSeiteFinden(id);
  if (!s || !z || s === z || kpGruppenSchluessel(s) !== kpGruppenSchluessel(z)) { return; }
  e.preventDefault();
  if (e.dataTransfer) { e.dataTransfer.dropEffect = 'move'; }
  kpZiehMarkeWeg();
  if (e.currentTarget && e.currentTarget.classList) { e.currentTarget.classList.add(kpZiehStelle(e) === 'vor' ? 'zieh-vor' : 'zieh-nach'); }
}

function kpZiehWeg(e) {
  if (e.currentTarget && e.currentTarget.classList) {
    e.currentTarget.classList.remove('zieh-vor');
    e.currentTarget.classList.remove('zieh-nach');
  }
}

function kpZiehAb(e, id) {
  e.preventDefault();
  var wo = kpZiehStelle(e);
  var gezogen = kpGezogen;
  kpZiehEnde();
  kpVerschieben(gezogen, id, wo);
}

function kpZiehEnde() {
  kpGezogen = '';
  kpZiehMarkeWeg();
}

/* Eine einklappbare Gruppe: Kopf mit Pfeil, offen auch dann, wenn die
   offene Seite darin liegt. */
function klappGruppeHtml(was, titel, seiten, klasse) {
  if (!seiten.length) { return ''; }
  var feld = { ruht: 'ruhtAuf', fertig: 'fertigAuf' }[was];
  var auf = kp[feld] || (kp.art === 'seite' && seiten.some(function (s) { return s.id === kp.id; }));
  var schluessel = (was === 'ruht') ? 'vorhaben-ruht' : 'vorhaben-erledigt';
  var h = '<div class="gruppe leise"><button type="button" class="klapp-kopf" onclick="klappUm(\'' + was + '\')" aria-expanded="' + auf + '">'
        + (auf ? '⌄ ' : '› ') + titel + ' · ' + seiten.length + '</button>'
        + (auf && seiten.length > 1 ? sortierKnopfHtml(schluessel) : '') + '</div>';
  if (auf) { seiten.forEach(function (s) { h += seitenEintragHtml(s, klasse); }); }
  return h;
}

function klappUm(was) {
  var feld = { ruht: 'ruhtAuf', fertig: 'fertigAuf', notiz: 'notizenAuf' }[was];
  if (!feld) { return; }
  kp[feld] = !kp[feld];
  leisteZeichnen();
}

function gruppeKopfHtml(art) {
  var titel = KP_ARTEN[art].gruppe;
  if (art === 'notiz') {
    var auf = kpNotizenAuf();
    titel = '<button type="button" class="klapp-kopf" onclick="klappUm(\'notiz\')" aria-expanded="' + auf + '">'
          + (auf ? '⌄ ' : '› ') + titel + '</button>';
  }
  var schluessel = (art === 'vorhaben') ? 'vorhaben-laeuft' : art;
  var sortierbar = (art !== 'notiz' || kpNotizenAuf()) && kpGruppe(schluessel).filter(kpSichtbar).length > 1;
  return '<div class="gruppe"><span>' + titel + '</span>' + (sortierbar ? sortierKnopfHtml(schluessel) : '')
       + '<button type="button" class="plus" onclick="neuOeffnen(\'' + art + '\')" '
       + 'title="Neu: ' + KP_ARTEN[art].name + '" aria-label="Neu: ' + KP_ARTEN[art].name + '" aria-expanded="' + (kp.neuIn === art) + '">+</button></div>'
       + (kp.neuIn === art ? neuFeldHtml() : '');
}

function leisteZeichnen() {
  var el = document.getElementById('leiste');
  if (!el) { return; }
  var heute = kpHeuteMontag();
  var naechste = tagePlus(heute, 7);
  var offen = (kp.art === 'woche') ? kpOffenerMontag() : '';
  var h = eintragHtml(offen === heute, 'oeffne(\'woche\',\'\')', '<span class="stern">★</span>', 'Diese Woche',
                      '<span class="marke-klein">KW ' + kalenderwoche(heute) + '</span>');
  h += eintragHtml(offen === naechste, 'oeffne(\'woche\',\'' + naechste + '\')', '→', 'Nächste Woche',
                   '<span class="marke-klein">KW ' + kalenderwoche(naechste) + '</span>');

  h += '<div class="filter" role="group" aria-label="Beruf oder Privat">'
     + [['alle', 'Alle'], ['beruflich', 'Beruf'], ['privat', 'Privat']].map(function (p) {
       return '<button type="button" class="' + (kp.filter === p[0] ? 'an' : '') + '" onclick="kpFilterSetzen(\'' + p[0] + '\')">' + p[1] + '</button>';
     }).join('') + '</div>';
  var leerText = function (wort) {
    return '<div class="leer-hinweis">' + (kp.filter === 'alle' ? 'Noch keine ' + wort + '.' : 'Keine ' + wort + ' unter diesem Filter.') + '</div>';
  };
  h += gruppeKopfHtml('vorhaben');
  var vh = kpSeiten('vorhaben').filter(kpSichtbar);
  var laeuft = vh.filter(function (s) { return (s.zustand || 'laeuft') === 'laeuft'; });
  var ruht = vh.filter(function (s) { return s.zustand === 'ruht'; });
  var fertig = vh.filter(function (s) { return s.zustand === 'erledigt'; });
  if (!vh.length) { h += leerText('Vorhaben'); }
  laeuft.forEach(function (s) { h += seitenEintragHtml(s, ''); });
  h += klappGruppeHtml('ruht', 'Ruht', ruht, 'ruht');
  h += klappGruppeHtml('fertig', 'Erledigt', fertig, 'ruht');

  h += gruppeKopfHtml('liste');
  var listen = kpSeiten('liste').filter(kpSichtbar);
  if (!listen.length) { h += leerText('Listen'); }
  listen.forEach(function (s) { h += seitenEintragHtml(s, ''); });

  h += gruppeKopfHtml('notiz');
  var notizen = kpSeiten('notiz').filter(kpSichtbar);
  if (kpNotizenAuf()) {
    if (!notizen.length) { h += leerText('Notizen'); }
    notizen.forEach(function (s) { h += seitenEintragHtml(s, ''); });
  }

  el.innerHTML = h;
  el.classList.toggle('auf', kp.leisteAuf);
  var schleier = document.getElementById('schleier');
  if (schleier) { schleier.classList.toggle('auf', kp.leisteAuf); }
}

/* Notizen sind beim Start eingeklappt — offen, wenn man sie aufklappt
   oder gerade eine Notiz offen hat. */
function kpNotizenAuf() {
  var s = (kp.art === 'seite') ? kpSeite() : null;
  return kp.notizenAuf || kp.neuIn === 'notiz' || !!(s && s.art === 'notiz');
}

function leisteUm() {
  kp.leisteAuf = !kp.leisteAuf;
  leisteZeichnen();
}

/* ---------- Die ruhige Woche ---------- */

function wocheHtml(montag) {
  var heute = kpHeuteMontag();
  var w = kpWocheFinden(montag);
  var text = (w && typeof w.text === 'string') ? w.text : (w ? kpWocheTextAus(w.eintraege) : kpWocheGeruest());
  var titel = (montag === heute) ? 'Diese Woche' : ((montag === tagePlus(heute, 7)) ? 'Nächste Woche' : 'Frühere Woche');
  var h = '<div class="ruhig"><div class="r-kopf"><span class="r-kw">' + titel + ' · ' + esc(kpWochenTitel(montag)) + '</span>'
        + modusKnoepfe() + mehrHtml() + '</div>';
  if (kp.frage) { h += frageHtml(); }
  if (kp.modus === 'schreiben') {
    h += kpLeisteHtml()
       + '<textarea id="kpFeld" class="feld" spellcheck="true" aria-label="Woche schreiben" '
       + 'oninput="kpTextSetzen(this.value)" onkeydown="kpTaste(event)" onbeforeinput="kpVorEingabe(event)">' + esc(text) + '</textarea>';
  } else {
    h += '<div class="w-text">' + kpAnsichtHtml({ text: text, eintraege: w ? w.eintraege : [] }, true) + '</div>';
    var aufgaben = text.split('\n').some(function (z) { return !!kpAufgabe(z); });
    if (!aufgaben && montag >= heute) {
      h += '<p class="r-hinweis">Geplant wird auf einer Liste, einem Vorhaben oder einer Notiz: '
         + '„Offene Aufgaben“ öffnen, dort S oder V. Schreiben kannst du hier alles andere.'
         + (!(DB.seiten || []).length ? ' <button type="button" class="pille klein" onclick="oeffne(\'einst\',\'\')">Aus der Workbench übernehmen</button>' : '')
         + '</p>';
    }
  }
  return h + '</div>' + archivHtml(montag);
}

function archivHtml(montagOffen) {
  var heute = kpHeuteMontag();
  var alte = kpWochen().filter(function (w) { return w.montag < heute; });
  if (!alte.length) { return ''; }
  var h = '<details class="archiv"' + (montagOffen < heute ? ' open' : '') + '><summary>Frühere Wochen · ' + alte.length + '</summary>';
  alte.forEach(function (w) {
    h += '<button type="button" class="' + (w.montag === montagOffen ? 'an' : '') + '" onclick="oeffne(\'woche\',\'' + w.montag + '\')">'
       + esc(kpWochenTitel(w.montag)) + '</button>';
  });
  return h + '</details>';
}

/* ---------- Seite ---------- */

function mehrHtml() {
  var kann = (kp.art === 'seite' && kpSeite())
          || (kp.art === 'woche' && kpOffenerMontag() !== kpHeuteMontag() && kpWocheFinden(kpOffenerMontag()));
  if (!kann) { return ''; }
  var h = '<span class="mehr-h"><button type="button" class="mehr" onclick="menueUm()" aria-label="Weitere Aktionen" '
        + 'aria-expanded="' + kp.menueAuf + '">⋯</button>';
  if (kp.menueAuf) {
    h += '<span class="mehr-menue"><button type="button" class="weg" onclick="fragen(\'loeschen\')">Löschen …</button></span>';
  }
  return h + '</span>';
}

function frageHtml() {
  if (kp.frage !== 'loeschen') { return ''; }
  var s = kpSeite();
  var name, folge;
  if (s) {
    name = s.titel || 'ohne Titel';
    folge = 'Die Seite ist weg. Was sie in eine Woche gegeben hat, bleibt dort stehen.';
  } else {
    name = kpWochenTitel(kpOffenerMontag());
    folge = 'Die Woche ist weg, die Seiten bleiben unberührt.';
  }
  return '<div class="frage" role="alertdialog"><p><b>„' + esc(name) + '“ löschen?</b> ' + folge + '</p><div class="knoepfe">'
       + '<button type="button" class="pille weg" onclick="kpLoeschen()">Löschen</button>'
       + ((s && s.art === 'vorhaben' && s.zustand !== 'erledigt') ? '<button type="button" class="pille" onclick="kpZustand(\'erledigt\')">Lieber auf erledigt</button>' : '')
       + '<button type="button" class="pille" onclick="frageWeg()">Abbrechen</button></div></div>';
}

function modusKnoepfe() {
  return '<span class="umschalter" role="group" aria-label="Ansicht oder Schreiben">'
       + '<button type="button" class="' + (kp.modus === 'ansicht' ? 'an' : '') + '" onclick="modusSetzen(\'ansicht\')">Ansicht</button>'
       + '<button type="button" class="' + (kp.modus === 'schreiben' ? 'an' : '') + '" onclick="modusSetzen(\'schreiben\')">Schreiben</button></span>';
}

function eigenschaftenHtml(s) {
  var h = '<div class="eigen"><span class="art-marke">' + KP_ARTEN[s.art].name + '</span>';
  h += '<span class="gruppe-knopf" role="group" aria-label="Beruf oder Privat">' + KP_KONTEXTE.map(function (p) {
    return '<button type="button" class="' + (s.kontext === p[0] ? 'an' : '') + '" onclick="kpKontext(\'' + p[0] + '\')">' + p[1] + '</button>';
  }).join('') + '</span>';
  if (s.art === 'vorhaben') {
    var z = s.zustand || 'laeuft';
    if (s.typ || s.termin) {
      h += '<span class="leise">' + (s.typ === 'ziel' ? 'Ziel' : (s.typ === 'projekt' ? 'Projekt' : ''))
         + (s.termin ? (s.typ ? ' · ' : '') + 'bis ' + esc(kpKurz(s.termin)) + s.termin.slice(0, 4) : '') + '</span>';
    }
    h += '<span class="gruppe-knopf" role="group" aria-label="Zustand">' + KP_ZUSTAENDE.map(function (p) {
      return '<button type="button" class="' + (z === p[0] ? 'an' : '') + '" onclick="kpZustand(\'' + p[0] + '\')">' + p[1] + '</button>';
    }).join('') + '</span>';
  }
  return h + '</div>';
}

function blattHtml(s) {
  if (kp.modus === 'schreiben') {
    return kpLeisteHtml()
         + '<textarea id="kpFeld" class="feld" spellcheck="true" aria-label="Seite schreiben" '
         + 'placeholder="Fließtext — eine Zeile mit [] davor ist eine Aufgabe" '
         + 'oninput="kpTextSetzen(this.value)" onkeydown="kpTaste(event)" onbeforeinput="kpVorEingabe(event)">' + esc(s.text || '') + '</textarea>';
  }
  if (!String(s.text || '').trim()) {
    return '<div class="blatt leer-blatt"><p>Noch leer. „Schreiben“ füllt die Seite — eine Zeile mit [] davor ist eine Aufgabe.</p></div>';
  }
  return '<div class="blatt">' + kpAnsichtHtml(s) + '</div>';
}

/* zeichnen: Ein offenes Schreibfeld wird nicht überschrieben, solange
   darin getippt wird — es sei denn, es ist ausdrücklich verlangt. */
function seiteZeichnen(erzwingen) {
  var el = document.getElementById('seite');
  if (!el) { return; }
  var aktiv = document.activeElement;
  if (!erzwingen && aktiv && (aktiv.id === 'kpFeld' || aktiv.id === 'kpTitel')) { return; }
  if (kp.art === 'einst') { el.innerHTML = einstHtml(); return; }
  if (kp.art === 'woche') { el.innerHTML = wocheHtml(kpOffenerMontag()); return; }
  var s = kpSeite();
  if (!s) {
    el.innerHTML = '<div class="blatt leer-blatt"><p>Diese Seite gibt es nicht mehr.</p>'
                 + '<button type="button" class="pille" onclick="oeffne(\'woche\',\'\')">Zur Woche</button></div>';
    return;
  }
  var h = '<div class="seitenkopf"><input id="kpTitel" class="titelfeld" type="text" maxlength="200" value="' + esc(s.titel || '') + '" '
        + 'aria-label="Name" onchange="kpTitelSetzen(this.value)" onkeydown="titelTaste(event)">'
        + modusKnoepfe() + mehrHtml() + '</div>';
  h += eigenschaftenHtml(s);
  if (kp.frage) { h += frageHtml(); }
  h += kpOaKnopfHtml();
  h += blattHtml(s);
  if (kp.oaAuf) { h += kpOaHtml(s); }
  el.innerHTML = h;
}

function titelTaste(e) {
  if (e.key === 'Enter' && e.target && e.target.blur) { e.target.blur(); }
}

/* ---------- Übernahme aus der Workbench ----------

   Einmalig und auf Wunsch. Die Workbench-Daten werden nur gelesen.
   Feste Kennungen: Ein Vorhaben behält die Kennung aus der Workbench,
   eine Notiz die ihrer Fläche — so führen Verweise im Text weiter hin,
   und eine zweite Übernahme legt nichts doppelt an. */

var KP_OFFEN_NICHT = ['erledigt', 'cancelled', 'verworfen'];

function kpMigOffen(a) {
  return a && KP_OFFEN_NICHT.indexOf(a.status || 'offen') < 0;
}

function kpMigZeile(t) {
  return String(t || '').replace(/[\r\n]+/g, ' ').trim();
}

function kpMigKontext(k) {
  return (k === 'beruflich' || k === 'privat') ? k : '';
}

function kpMigZustand(status) {
  if (status === 'ruht') { return 'ruht'; }
  if (['abgeschlossen', 'erreicht', 'erledigt', 'verworfen', 'cancelled'].indexOf(status) >= 0) { return 'erledigt'; }
  return 'laeuft';
}

/* Wiederholung → Frequenzzeile: „Mo, Mi, Fr" · „alle 2 Wochen: Mo, Do" ·
   „monatlich am 15." · „alle 3 Monate am 1." */
function kpFrequenz(w) {
  if (!w) { return ''; }
  var kz = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  var n = Math.max(1, Number(w.intervall) || 1);
  var namen = [];
  var i;
  if (w.takt === 'woche' || w.typ === 'woechentlich') {
    var tage = Array.isArray(w.tage) ? w.tage : [];
    if (!w.takt) {
      /* alte Schreibweise: 1 = Montag bis 7 = Sonntag */
      tage = (Array.isArray(w.wochentage) ? w.wochentage : []).map(function (t) { return Number(t) === 7 ? 0 : Number(t); });
    }
    for (i = 1; i <= 7; i++) {
      var nr = (i === 7) ? 0 : i;
      if (tage.indexOf(nr) >= 0) { namen.push(kz[nr]); }
    }
    var liste = namen.join(', ') || 'wöchentlich';
    return (n === 1) ? liste : ('alle ' + n + ' Wochen: ' + liste);
  }
  if (w.takt === 'monat' || w.typ === 'monatlich') {
    var tag = Number(w.tag) || 1;
    return (n === 1) ? ('monatlich am ' + tag + '.') : ('alle ' + n + ' Monate am ' + tag + '.');
  }
  return '';
}

function kpMigReihe(l) {
  return (Array.isArray(l) ? l : []).map(function (x, i) { return { x: x, i: i }; })
    .sort(function (a, b) {
      var oa = (typeof a.x.ordnung === 'number') ? a.x.ordnung : 1e9 + a.i;
      var ob = (typeof b.x.ordnung === 'number') ? b.x.ordnung : 1e9 + b.i;
      return oa - ob;
    }).map(function (p) { return p.x; });
}

/* Eine Wochenseite aus Kompass 1.0 (Text) → Einträge. */
function kpMigWoche(text) {
  var aus = [];
  var abschnitt = '';
  String(text || '').split('\n').forEach(function (zeile) {
    var u = zeile.match(/^\s*#{2,3}\s+(.*)$/);
    if (u) {
      abschnitt = /substanz/i.test(u[1]) ? 's' : (/verbindlich/i.test(u[1]) ? 'v' : '');
      return;
    }
    if (!abschnitt) { return; }
    var m = zeile.match(/^\s*(?:[-•*]|\d{1,3}[.)]|\[([ xX]?)\])\s+(.*)$/);
    if (!m) { return; }
    var t = kpMigZeile(m[2]);
    var erledigt = /x/i.test(m[1] || '');
    var d = t.match(/^~~(.*)~~$/);
    if (d) { t = kpMigZeile(d[1]); erledigt = true; }
    if (!t) { return; }
    aus.push({ id: neueKennung(), abschnitt: abschnitt, text: t, quelle: '', erledigt: erledigt });
  });
  return aus;
}

function kpMigPlan(wb) {
  var aufgaben = (Array.isArray(wb.aufgaben) ? wb.aufgaben : []).filter(kpMigOffen);
  var projekte = kpMigReihe(wb.projekte);
  var ziele = kpMigReihe(wb.ziele);
  var themen = kpMigReihe(wb.themen);
  var gedanken = Array.isArray(wb.gedanken) ? wb.gedanken : [];
  var plan = {
    vorhaben: { seiten: [], aufgaben: 0 },
    verteilen: { seiten: [], aufgaben: 0, listen: 0 },
    routine: { seiten: [], zahl: 0 },
    notizen: { seiten: [] },
    listen: { seiten: [] },
    wochen: { wochen: [] }
  };
  var vhIds = {};
  projekte.concat(ziele).forEach(function (v) { if (v && v.id) { vhIds[v.id] = true; } });

  var routine = aufgaben.filter(function (a) { return !!a.wiederholung; });
  var einmal = aufgaben.filter(function (a) { return !a.wiederholung && kpMigZeile(a.titel); });

  var vorhabenSeite = function (v, typ) {
    var eigene = einmal.filter(function (a) { return (typ === 'ziel') ? a.zielId === v.id : a.projektId === v.id; });
    var text = String(v.flaeche || '').replace(/\s+$/, '');
    if (eigene.length) {
      text += (text ? '\n\n' : '') + '## Aufgaben\n' + eigene.map(function (a) { return '[] ' + kpMigZeile(a.titel); }).join('\n');
    }
    plan.vorhaben.aufgaben += eigene.length;
    plan.vorhaben.seiten.push({ id: v.id, art: 'vorhaben', titel: kpMigZeile(v.name) || 'ohne Namen', text: text,
                                zustand: kpMigZustand(v.status), typ: typ, kontext: kpMigKontext(v.kontext),
                                termin: String((typ === 'ziel' ? v.zieltermin : v.ende) || '') });
  };
  projekte.forEach(function (v) { if (v && v.id) { vorhabenSeite(v, 'projekt'); } });
  ziele.forEach(function (v) { if (v && v.id) { vorhabenSeite(v, 'ziel'); } });

  var frei = einmal.filter(function (a) {
    return !((a.projektId && vhIds[a.projektId]) || (a.zielId && vhIds[a.zielId]));
  });
  /* Verteilen und Routine je für Beruf und Privat — nach dem Kontext der
     einzelnen Aufgabe; ohne Angabe gilt Privat. */
  var KONTEXTE = [['beruflich', 'Beruf', 'beruf'], ['privat', 'Privat', 'privat']];
  var vonKontext = function (l, k) {
    return l.filter(function (a) { return ((a.kontext === 'beruflich') ? 'beruflich' : 'privat') === k; });
  };
  KONTEXTE.forEach(function (k) {
    var teil = vonKontext(frei, k[0]);
    if (!teil.length) { return; }
    var bloecke = [];
    var verbraucht = {};
    themen.forEach(function (t) {
      var drin = teil.filter(function (a) { return a.themaId === t.id; });
      if (!drin.length) { return; }
      drin.forEach(function (a) { verbraucht[a.id] = true; });
      bloecke.push('## ' + (kpMigZeile(t.name) || 'Liste') + '\n' + drin.map(function (a) { return '[] ' + kpMigZeile(a.titel); }).join('\n'));
    });
    var rest = teil.filter(function (a) { return !verbraucht[a.id]; });
    if (rest.length) {
      bloecke.push('## Ohne Liste\n' + rest.map(function (a) { return '[] ' + kpMigZeile(a.titel); }).join('\n'));
    }
    plan.verteilen.aufgaben += teil.length;
    plan.verteilen.listen += bloecke.length;
    plan.verteilen.seiten.push({ id: 'wb-verteilen-' + k[2], art: 'liste', titel: 'Verteilen · ' + k[1], kontext: k[0], text: bloecke.join('\n\n') });
  });

  KONTEXTE.forEach(function (k) {
    var teil = vonKontext(routine, k[0]);
    if (!teil.length) { return; }
    plan.routine.zahl += teil.length;
    plan.routine.seiten.push({ id: 'wb-routine-' + k[2], art: 'liste', titel: 'Routine · ' + k[1], kontext: k[0], text: teil.map(function (a) {
      var f = kpFrequenz(a.wiederholung);
      return (kpMigZeile(a.titel) || 'ohne Namen') + (f ? '\n' + f : '');
    }).join('\n\n') });
  });

  gedanken.forEach(function (g) {
    if (!g || !g.id) { return; }
    if (g.kompass === 'liste') {
      plan.listen.seiten.push({ id: g.id, art: 'liste', titel: kpMigZeile(g.titel) || 'Liste', text: String(g.text || ''), kontext: kpMigKontext(g.kontext) });
    } else if (g.kompass === 'woche') {
      var mo = String(g.woche || '');
      var e = kpMigWoche(g.text);
      if (/^\d{4}-\d{2}-\d{2}$/.test(mo) && e.length) { plan.wochen.wochen.push({ montag: mo, eintraege: e }); }
    } else if (!g.kompass && String(g.text || '').trim()) {
      var erste = kpMigZeile(String(g.text || '').split('\n')[0]).replace(/^#{1,3}\s*/, '').slice(0, 80);
      plan.notizen.seiten.push({ id: g.id, art: 'notiz', titel: kpMigZeile(g.titel) || erste || 'Notiz', text: String(g.text || ''), kontext: kpMigKontext(g.kontext) });
    }
  });
  return plan;
}

var KP_MIG_TEILE = [
  ['vorhaben', 'Vorhaben'],
  ['verteilen', 'Liste „Verteilen“'],
  ['routine', 'Liste „Routine“'],
  ['notizen', 'Notizen'],
  ['listen', 'Listen aus Kompass 1.0'],
  ['wochen', 'Wochen aus Kompass 1.0']
];

function kpZahlWort(n, eins, viele) { return n + ' ' + (n === 1 ? eins : viele); }

function kpMigBeschreibung(teil, p) {
  if (teil === 'vorhaben') {
    return kpZahlWort(p.seiten.length, 'Seite', 'Seiten') + ' mit ' + kpZahlWort(p.aufgaben, 'offenen Aufgabe', 'offenen Aufgaben');
  }
  if (teil === 'verteilen') {
    return kpZahlWort(p.aufgaben, 'Aufgabe', 'Aufgaben') + ' ohne Vorhaben, unter ' + kpZahlWort(p.listen, 'Überschrift', 'Überschriften');
  }
  if (teil === 'routine') { return kpZahlWort(p.zahl, 'wiederkehrende Aufgabe', 'wiederkehrende Aufgaben') + ' mit Frequenz'; }
  if (teil === 'wochen') { return kpZahlWort(p.wochen.length, 'Woche', 'Wochen'); }
  return kpZahlWort(p.seiten.length, 'Seite', 'Seiten');
}

/* „Verteilen“ und „Routine“ aus 2.0 waren ungeteilt. Gibt es sie noch,
   wird nicht zusätzlich aufgeteilt — sonst stünden Aufgaben doppelt. */
function kpMigAltDa(id) {
  if (String(id).indexOf('wb-verteilen-') === 0) { return !!kpSeiteFinden('wb-verteilen'); }
  if (String(id).indexOf('wb-routine-') === 0) { return !!kpSeiteFinden('wb-routine'); }
  return false;
}

function kpMigSchonDa(teil, p) {
  if (teil === 'wochen') { return p.wochen.filter(function (w) { return !!kpWocheFinden(w.montag); }).length; }
  return p.seiten.filter(function (s) { return !!kpSeiteFinden(s.id); }).length;
}

function kpMigAusText(text, quelle) {
  var wb;
  try { wb = JSON.parse(String(text || '')); } catch (f) { wb = null; }
  if (!wb || typeof wb !== 'object' || (!Array.isArray(wb.aufgaben) && !Array.isArray(wb.projekte) && !Array.isArray(wb.gedanken))) {
    melde('Das ist keine Workbench-Datei.', 'warn');
    return false;
  }
  var plan = kpMigPlan(wb);
  var wahl = {};
  KP_MIG_TEILE.forEach(function (t) { wahl[t[0]] = true; });
  kp.mig = { quelle: quelle, plan: plan, wahl: wahl };
  kp.art = 'einst';
  seiteZeichnen(true);
  return true;
}

function kpMigWahlUm(teil) {
  if (!kp.mig || !Object.prototype.hasOwnProperty.call(kp.mig.wahl, teil)) { return; }
  kp.mig.wahl[teil] = !kp.mig.wahl[teil];
  seiteZeichnen(true);
}

function kpMigAbbrechen() {
  kp.mig = null;
  seiteZeichnen(true);
}

function kpMigAusfuehren() {
  if (!kp.mig) { return { seiten: 0, wochen: 0 }; }
  var plan = kp.mig.plan;
  var wahl = kp.mig.wahl;
  var zahl = { seiten: 0, wochen: 0, kontext: 0, alt: 0 };
  if (!Array.isArray(DB.seiten)) { DB.seiten = []; }
  if (!Array.isArray(DB.wochen)) { DB.wochen = []; }
  var rang = kpNaechsterRang();
  KP_MIG_TEILE.forEach(function (t) {
    if (!wahl[t[0]]) { return; }
    if (t[0] === 'wochen') {
      plan.wochen.wochen.forEach(function (w) {
        if (kpWocheFinden(w.montag)) { return; }
        DB.wochen.push({ id: kpWocheKennung(w.montag), montag: w.montag, text: kpWocheTextAus(w.eintraege), eintraege: w.eintraege, geaendert: jetzt() });
        grabsteinWeg('wochen', kpWocheKennung(w.montag));
        zahl.wochen++;
      });
      return;
    }
    plan[t[0]].seiten.forEach(function (s) {
      var da = kpSeiteFinden(s.id);
      if (da) {
        /* Schon übernommen (2.0 kannte Beruf/Privat noch nicht): nur nachtragen. */
        if (!da.kontext && s.kontext) { da.kontext = s.kontext; da.geaendert = jetzt(); zahl.kontext++; }
        return;
      }
      if (kpMigAltDa(s.id)) { zahl.alt++; return; }
      var neu = { id: s.id, art: s.art, titel: s.titel, text: s.text, rang: rang++, kontext: s.kontext || '', geaendert: jetzt() };
      if (s.art === 'vorhaben') {
        neu.zustand = s.zustand || 'laeuft';
        if (s.typ) { neu.typ = s.typ; }
        if (/^\d{4}-\d{2}-\d{2}$/.test(s.termin || '')) { neu.termin = s.termin; }
      }
      DB.seiten.push(neu);
      grabsteinWeg('seiten', s.id);
      zahl.seiten++;
    });
  });
  kp.mig = null;
  spaeterSichern();
  zeichne(true);
  melde('Übernommen: ' + kpZahlWort(zahl.seiten, 'Seite', 'Seiten') + ', ' + kpZahlWort(zahl.wochen, 'Woche', 'Wochen')
        + (zahl.kontext ? ' · Beruf/Privat bei ' + kpZahlWort(zahl.kontext, 'Seite', 'Seiten') + ' nachgetragen' : '') + '.', 'gut');
  return zahl;
}

/* Quelle 1: workbench.json aus Drive — dieselbe Google-Anwendung,
   also sichtbar mit dem Recht drive.file. */
function kpMigDrive() {
  if (!tokenGueltig()) { melde('Bitte zuerst anmelden.', 'warn'); anmelden(false); return; }
  var url = 'https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent("name='workbench.json' and trashed=false")
          + '&fields=' + encodeURIComponent('files(id,modifiedTime)') + '&pageSize=10';
  window.fetch(url, { headers: driveKopf() }).then(antwortPruefen)
    .then(function (a) { return a.json(); })
    .then(function (d) {
      var f = (d && d.files && d.files.length) ? d.files[0] : null;
      if (!f) { throw new Error('In Drive gibt es keine workbench.json.'); }
      return window.fetch('https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media', { headers: driveKopf() })
        .then(antwortPruefen).then(function (a) { return a.text(); });
    })
    .then(function (text) { kpMigAusText(text, 'workbench.json aus Drive'); })
    .catch(function (f) { melde('Übernahme aus Drive: ' + (f ? f.message : 'fehlgeschlagen'), 'warn'); });
}

/* Quelle 2: eine Datei vom Gerät. */
function kpMigDatei(feld) {
  var datei = (feld && feld.files && feld.files.length) ? feld.files[0] : null;
  if (!datei) { return; }
  var name = datei.name || 'Datei';
  var lesen = (typeof datei.text === 'function') ? datei.text() : Promise.reject(new Error('Datei nicht lesbar'));
  lesen.then(function (text) { kpMigAusText(text, name); })
    .catch(function (f) { melde('Die Datei ließ sich nicht lesen: ' + (f ? f.message : ''), 'warn'); });
  feld.value = '';
}

/* Quelle 3: was Kompass 1.0 auf diesem Gerät gespeichert hat. */
function kpMigGeraet() {
  var text = null;
  try { text = window.localStorage.getItem(KP_ALT_LS); } catch (f) { text = null; }
  if (text) { kpMigAusText(text, 'Kompass 1.0 auf diesem Gerät'); return; }
  if (!opfsDa()) { melde('Auf diesem Gerät liegen keine Daten von Kompass 1.0.', 'warn'); return; }
  navigator.storage.getDirectory().then(function (ordner) {
    return ordner.getFileHandle(KP_ALT_OPFS, { create: false });
  }).then(function (h) { return dateiLesen(h); })
    .then(function (t) { kpMigAusText(t, 'Kompass 1.0 auf diesem Gerät'); })
    .catch(function () { melde('Auf diesem Gerät liegen keine Daten von Kompass 1.0.', 'warn'); });
}

/* ---------- Stand und Rückmeldungen ---------- */

var toastZeit = 0;

function melde(text, art, mitRueckgaengig) {
  var t = document.getElementById('toast');
  var tt = document.getElementById('toastText');
  var tr = document.getElementById('toastRueck');
  if (!t || !tt) { return; }
  tt.textContent = String(text || '');
  if (tr) { tr.style.display = mitRueckgaengig ? '' : 'none'; }
  t.className = 'toast auf' + (art ? ' ' + art : '');
  if (toastZeit) { window.clearTimeout(toastZeit); }
  toastZeit = window.setTimeout(function () {
    var el = document.getElementById('toast');
    if (el) { el.className = 'toast'; }
    toastZeit = 0;
  }, mitRueckgaengig ? 9000 : ((art === 'warn') ? 7000 : 4000));
}

function standText() {
  if (!tokenGueltig()) {
    return warAngemeldet() ? { text: 'Anmeldung abgelaufen — neu anmelden', warn: true }
                           : { text: 'nur auf diesem Gerät', warn: false };
  }
  if (abgleichFehler) { return { text: 'Abgleich fehlgeschlagen', warn: true }; }
  if (verbindungOk === false) { return { text: 'keine Verbindung — lokal gespeichert', warn: true }; }
  if (abgleichLaeuft) { return { text: 'gleicht ab …', warn: false }; }
  if (letzterAbgleich) { return { text: DRIVE_DATEI + ' · abgeglichen ' + letzterAbgleich.slice(11, 16), warn: false }; }
  return { text: 'angemeldet', warn: false };
}

function standZeichnen() {
  var el = document.getElementById('standPille');
  if (el) {
    var s = standText();
    el.textContent = s.text;
    el.className = 'stand' + (s.warn ? ' warn' : '');
  }
  anmeldebannerZeichnen();
}

/* Wie in der Workbench: Ein Streifen oben meldet sich nur, wenn keine
   Verbindung zu Google besteht — mit „Neu verbinden". */
function anmeldebannerZeichnen() {
  var streifen = document.getElementById('anmeldeStreifen');
  var text = document.getElementById('anmeldeText');
  if (!streifen || !text) { return; }
  if (tokenGueltig() && verbindungOk !== false) {
    streifen.classList.remove('sichtbar');
    return;
  }
  if (!tokenGueltig()) {
    text.textContent = warAngemeldet()
      ? 'Die Anmeldung bei Google ist abgelaufen — bitte neu anmelden.'
      : 'Noch nicht bei Google angemeldet — es wird nur lokal gespeichert.';
  } else {
    text.textContent = 'Keine Verbindung zu Google — es wird nur lokal gespeichert.';
  }
  streifen.classList.add('sichtbar');
}

/* Die Workbench-Funktionen rufen diesen Namen. */
function anmeldeStreifenPruefen() { standZeichnen(); }

/* Wer schon einmal angemeldet war, wird still neu angemeldet: beim Start
   und sobald die App merkt, dass sie nicht verbunden ist. Google erneuert
   ohne Nachfrage, solange die Sitzung im Browser besteht; erst wenn das
   misslingt, bleibt der Streifen mit „Neu verbinden". Höchstens einmal
   je Minute, damit kein Fenster flackert. */
function stillAnmelden(grund) {
  if (anmeldungLaeuft || tokenGueltig() || !warAngemeldet()) { return Promise.resolve(false); }
  if (Date.now() - stillVersuchtMs < STILL_ABSTAND) { return Promise.resolve(false); }
  stillVersuchtMs = Date.now();
  return anmelden(true).then(function (gut) {
    if (gut) {
      verbindungOk = true;
      if (grund !== 'start') { melde('Verbindung zu Google wiederhergestellt.', 'gut'); }
      else { melde('Anmeldung im Hintergrund erneuert.', 'gut'); }
      abgleichPlanen(true);
    } else {
      verbindungOk = false;
      melde('Die Anmeldung ließ sich nicht im Hintergrund erneuern.\nBitte oben auf „Neu verbinden“ tippen.', 'warn');
    }
    zeichne();
    return gut;
  });
}

function standGeklickt() {
  if (!tokenGueltig()) { anmelden(false); return; }

}

function zeichne(erzwingen) {
  leisteZeichnen();
  seiteZeichnen(erzwingen === true);
  standZeichnen();

}

/* ---------- Speichern und Abgleich ---------- */

function spaeterSichern() {
  if (speicherUhr) { window.clearTimeout(speicherUhr); }
  lokalOffen = true;
  speicherUhr = window.setTimeout(function () {
    speicherUhr = null;
    speichern().then(function () {
      standZeichnen();
      abgleichPlanen(false);
    }).catch(function () { return null; });
  }, 1500);
}

function abgleichStill() {
  abgleichUhr = null;
  if (!tokenGueltig() || abgleichLaeuft) { return; }
  abgleichLaeuft = true;
  standZeichnen();
  abgleichen().then(function (b) {
    abgleichZuletztMs = Date.now();
    abgleichFehler = '';
    lokalOffen = false;
    verbindungOk = true;
    if (b && (b.neu || b.ersetzt || b.entfernt)) { melde('Abgeglichen: ' + berichtText(b), 'gut'); }
    abgleichLaeuft = false;
    kpWochenUmstellen();
    zeichne();
  }).catch(function (f) {
    abgleichFehler = f ? f.message : 'unbekannter Fehler';
    abgleichLaeuft = false;
    standZeichnen();
  });
}

function verbindungPruefen() {
  if (!tokenGueltig()) { verbindungOk = false; standZeichnen(); stillAnmelden('verbindung'); return; }
  window.fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)', { headers: driveKopf() })
    .then(function (a) {
      if (a.ok) { verbindungOk = true; }
      else if (a.status === 401 || a.status === 403) { tokenVergessen(); verbindungOk = false; stillAnmelden('verbindung'); }
      standZeichnen();
    }).catch(function () {
      verbindungOk = false;
      standZeichnen();
    });
}

function rueckkehrPruefen() {
  erneuerungPruefen();
  if (document.hidden) { return; }
  versionPruefen(false);
  zeichne();
  if (!tokenGueltig()) { stillAnmelden('rueckkehr'); return; }
  if (Date.now() - abgleichZuletztMs < ABGLEICH_MINDEST) { return; }
  abgleichPlanen(true);
}


/* ---------- Neue Fassung suchen und laden — wie in der Workbench ----------

   Der Service Worker holt alles zuerst aus dem Netz. Zusätzlich fragt die
   App aktiv nach, damit ein offenes Fenster nicht tagelang auf einem
   alten Stand bleibt. */

var VERSION_TAKT = 15 * 60 * 1000;
var neueVersion = '';
var versionUhr = null;

function versionPruefen(laut) {
  if (typeof window.fetch !== 'function') { return Promise.resolve(null); }
  var adresse = './wochenkompass.html?stand=' + Date.now();
  return window.fetch(adresse, { cache: 'no-store' }).then(function (a) {
    if (!a.ok) { throw new Error('Abruf mit Status ' + a.status); }
    return a.text();
  }).then(function (text) {
    var treffer = text.match(/APP_VERSION\s*=\s*'([\d.]+)'/);
    if (!treffer) { throw new Error('Im Abruf steht keine Versionsnummer.'); }
    var dort = treffer[1];
    if (dort !== APP_VERSION) {
      neueVersion = dort;
      neuStreifenZeigen(dort);
      if (laut) { melde('Neue Fassung ' + dort + ' gefunden.', 'gut'); }
    } else {
      neueVersion = '';
      neuStreifenVerbergen();
      if (laut) { melde('Die laufende Fassung ' + APP_VERSION + ' ist die neueste.', 'gut'); }
    }
    if (kp.art === 'einst') { seiteZeichnen(true); }
    return dort;
  }).catch(function (f) {
    if (laut) { melde('Versionsprüfung nicht möglich.\n' + (f ? f.message : ''), 'warn'); }
    return null;
  });
}

function neuStreifenZeigen(dort) {
  var streifen = document.getElementById('neuStreifen');
  var text = document.getElementById('neuText');
  if (!streifen || !text) { return; }
  text.textContent = 'Neue Fassung ' + dort + ' verfügbar (läuft: ' + APP_VERSION + ')';
  streifen.classList.add('sichtbar');
}

function neuStreifenVerbergen() {
  var streifen = document.getElementById('neuStreifen');
  if (streifen) { streifen.classList.remove('sichtbar'); }
}

/* Vor dem Neuladen wird alles Wartende gesichert, sonst geht die
   letzte Änderung beim Austausch verloren. */
function neuLaden() {
  neuStreifenVerbergen();
  melde('Neue Fassung wird geladen …', null);
  speichern().catch(function () { return null; }).then(function () {
    if (!navigator.serviceWorker || typeof navigator.serviceWorker.getRegistration !== 'function') { return null; }
    return navigator.serviceWorker.getRegistration('./wochenkompass').then(function (anmeldung) {
      if (!anmeldung) { return null; }
      if (anmeldung.waiting) { anmeldung.waiting.postMessage('sofort-uebernehmen'); }
      return anmeldung.update().catch(function () { return null; });
    }).catch(function () { return null; });
  }).then(function () {
    window.setTimeout(function () { window.location.reload(); }, 600);
  });
}

function versionTaktStarten() {
  if (versionUhr) { window.clearInterval(versionUhr); }
  versionUhr = window.setInterval(function () {
    if (document.hidden) { return; }
    versionPruefen(false);
  }, VERSION_TAKT);
}

/* ---------- Start ---------- */

function breiteSetzen() {
  document.body.classList.toggle('breit', (window.innerWidth || 0) >= 900);
}

function swAnmelden() {
  if (!navigator.serviceWorker || typeof navigator.serviceWorker.register !== 'function') { return; }
  if (!/^https?:/.test(String(window.location && window.location.protocol))) { return; }
  /* Eigener Bereich: Der Service Worker der Workbench (Bereich ./)
     bleibt unberührt. */
  navigator.serviceWorker.register('./sw-wochenkompass.js', { scope: './wochenkompass' })
    .catch(function () { return null; });
}

function tasteGlobal(e) {
  if (e && e.key === 'Escape' && kp.oaAuf) { kp.oaAuf = false; seiteZeichnen(true); }
}

function start() {
  breiteSetzen();
  kpFilterLaden();
  document.addEventListener('keydown', tasteGlobal);
  window.addEventListener('resize', breiteSetzen);
  standZeichnen();
  if (tokenAusSitzung()) {
    melde('Anmeldung aus dieser Sitzung übernommen, noch ' + restMinuten() + ' Minuten gültig.', null);
  } else {
    stillAnmelden('start');
  }
  var los = idbDa()
    ? idbLesen(IDB_KEY).then(function (h) { if (h) { dateiHandle = h; dateiName = h.name || ''; } }).catch(function () { return null; })
    : Promise.resolve(null);
  los.then(function () { return laden(); }).then(function () {
    kpWochenUmstellen();
    zeichne(true);
    if (tokenGueltig()) { abgleichPlanen(true); verbindungPruefen(); }
    taktStarten();
    verbindungTaktStarten();
  }).catch(function (f) {
    melde('Laden fehlgeschlagen: ' + (f ? f.message : ''), 'warn');
    zeichne(true);
  });
  document.addEventListener('visibilitychange', rueckkehrPruefen);
  document.addEventListener('click', klickErneuern, true);
  window.addEventListener('focus', standZeichnen);
  window.addEventListener('focus', erneuerungPruefen);
  window.setInterval(standZeichnen, 15000);
  swAnmelden();
  versionPruefen(false);
  versionTaktStarten();
}

window.addEventListener('DOMContentLoaded', start);
