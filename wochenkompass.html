<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wochenkompass 3.0.1</title>
<meta name="theme-color" content="#F4F2EE">
<link rel="manifest" href="./wochenkompass.webmanifest">
<link rel="icon" href="./wochenkompass-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./wochenkompass-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
:root{--papier:#EFEDE8;--leiste:#F4F2EE;--karte:#FFFFFF;--blatt:#FDFCFA;--tinte:#2E2C29;--grau:#645F58;
  --linie:#D4D0C8;--zart:#EEEBE5;--weinrot:#8A0B22;--petrol:#19525A;--gruen:#3F6B3A;--fs:16px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);
  background:var(--papier);color:var(--tinte);overflow:hidden}
button{font:inherit;cursor:pointer;color:var(--tinte)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--weinrot);outline-offset:2px}

.app{display:grid;grid-template-rows:auto auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100%}
.app>.kopf{grid-row:1}
.app>.anmeldebanner{grid-row:2}
.app>.neustreifen{grid-row:3}
.app>.rumpf{grid-row:4}
.anmeldebanner{display:none;align-items:center;gap:12px;padding:11px 16px 11px 20px;background:var(--weinrot);color:#fff;font-size:13.5px;line-height:1.35}
.anmeldebanner.sichtbar{display:flex}
#anmeldeText{flex:1;min-width:0}
.anmeldebanner button{flex:0 0 auto;font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border:1px solid rgba(255,255,255,.75);
  border-radius:6px;background:transparent;color:#fff;white-space:nowrap}
.neustreifen{display:none;align-items:center;gap:10px;padding:10px 20px;background:var(--petrol);border:0;font:inherit;font-size:13.5px;
  color:#fff;width:100%;text-align:left;cursor:pointer}
.neustreifen.sichtbar{display:flex}
#neuText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neu-wort{flex:0 0 auto;font-weight:500;text-decoration:underline}
.kopf{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px, env(safe-area-inset-top));
  border-bottom:1px solid var(--linie);background:var(--papier)}
.marke{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;white-space:nowrap;min-width:0;overflow:hidden}
.marke svg{flex:0 0 22px}
.marke svg{width:22px;height:22px;stroke:var(--weinrot);fill:none;stroke-width:1.8}
.marke small{font-weight:400;color:var(--grau);font-size:12px}
.marke .titel{min-width:0;overflow:hidden;text-overflow:ellipsis}
body:not(.breit) .marke{flex:0 0 auto}
body:not(.breit) .marke svg{display:none}
body:not(.breit) .marke small{display:block;line-height:1.1}
.luecke{flex:1}
.stand{font-size:12px;color:var(--grau);border:1px solid var(--linie);border-radius:14px;padding:3px 10px;background:var(--karte);
  max-width:46vw;min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stand.warn{color:var(--weinrot);border-color:var(--weinrot)}
.knopf-rund{flex:0 0 auto;border:1px solid var(--linie);background:var(--karte);border-radius:8px;min-width:36px;height:32px;font-size:17px;line-height:1}
#leisteKnopf{display:inline-block}
body.breit #leisteKnopf{display:none}

.rumpf{display:grid;grid-template-columns:minmax(0,1fr);min-height:0;position:relative}
body.breit .rumpf{grid-template-columns:280px minmax(0,1fr)}

/* Seitenleiste — am Handy eine Schublade */
.leiste{overflow:auto;padding:12px 10px 40px;background:var(--leiste);border-right:1px solid var(--linie);
  position:absolute;z-index:30;top:0;bottom:0;left:0;width:300px;max-width:86vw;box-shadow:4px 0 20px rgba(0,0,0,.18);
  transform:translateX(-105%);transition:transform .2s ease}
.leiste.auf{transform:none}
body.breit .leiste{position:static;transform:none;box-shadow:none;width:auto;max-width:none}
.schleier{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:25;display:none}
.schleier.auf{display:block}
body.breit .schleier{display:none}
.gruppe{display:flex;align-items:center;margin:16px 6px 4px;font-size:11px;letter-spacing:.07em;font-weight:600;
  text-transform:uppercase;color:var(--tinte);border:0;background:none;padding:0;width:calc(100% - 12px);text-align:left}
.gruppe span{flex:1}
.gruppe.leise{color:var(--grau);margin-top:12px}
.plus{border:0;background:none;color:var(--grau);font-size:19px;line-height:1;padding:0 6px;border-radius:6px}
.plus:hover{color:var(--weinrot);background:var(--karte)}
.eintrag{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:8px 8px;border-radius:8px;font-size:14px}
.eintrag:hover{background:var(--karte)}
.eintrag.an{background:var(--karte);box-shadow:inset 3px 0 0 var(--weinrot);font-weight:500}
.eintrag .zeichen{width:18px;text-align:center;color:var(--weinrot);flex:0 0 18px}
.eintrag .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eintrag.ruht{color:var(--grau)}
.eintrag.ruht .zeichen{color:var(--grau)}
/* Manuell sortieren: am PC ziehen, am Handy ▲ ▼ im Sortiermodus */
.eintrag[draggable="true"]{cursor:pointer}
.eintrag.zieh-vor{box-shadow:inset 0 2px 0 var(--weinrot)}
.eintrag.zieh-nach{box-shadow:inset 0 -2px 0 var(--weinrot)}
.sortier-knopf{border:0;background:none;color:var(--grau);font:inherit;font-size:10.5px;letter-spacing:.04em;text-transform:none;
  font-weight:500;padding:2px 6px;border-radius:6px}
.sortier-knopf.an{color:var(--weinrot);background:var(--karte)}
body.breit .sortier-knopf{display:none}
.sort-zeile{display:flex;align-items:center;gap:2px}
.sort-zeile .eintrag{flex:1;min-width:0}
.sort-pfeil{flex:0 0 34px;height:34px;border:1px solid var(--linie);background:var(--karte);border-radius:7px;font-size:12px;color:var(--grau)}
.gruppe .klapp-kopf{flex:1;text-align:left}
.stern{font-size:15px}
.marke-klein{font-size:10px;padding:0 6px;border-radius:8px;border:1px solid var(--linie);color:var(--grau);white-space:nowrap}
.leer-hinweis{font-size:12px;color:var(--grau);padding:4px 8px 6px;line-height:1.6}
.neu-feld{display:flex;gap:6px;margin:4px 6px 6px}
.neu-feld input{flex:1;min-width:0;font:inherit;font-size:14px;border:1px solid var(--weinrot);border-radius:7px;padding:5px 8px;background:var(--karte);color:var(--tinte)}
.wahlzeile{display:flex;gap:6px;flex-wrap:wrap;margin:0 6px 8px}

/* Seite */
.seite{overflow:auto;padding:16px 22px 60px;min-width:0}
body:not(.breit) .seite{padding:12px 12px 60px}
.innen{max-width:860px}
.seitenkopf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.seitenkopf h1{margin:0;font-size:20px;font-weight:600;flex:1 1 240px}
.seitenkopf .unter{display:block;font-size:12px;font-weight:400;color:var(--grau);margin-top:2px}
.titelfeld{flex:1 1 240px;min-width:0;font:inherit;font-size:20px;font-weight:600;color:var(--tinte);
  border:1px solid transparent;border-radius:6px;padding:2px 6px;background:transparent}
.titelfeld:hover{border-color:var(--linie)}
.titelfeld:focus{border-color:var(--weinrot);background:var(--karte)}
.pille{font-size:13px;padding:4px 12px;border:1px solid var(--linie);border-radius:14px;background:var(--karte)}
.pille.voll{background:var(--tinte);color:#fff;border-color:var(--tinte)}
.pille.weg{border-color:var(--weinrot);color:var(--weinrot)}
.pille.klein{font-size:12px;padding:2px 10px;margin-top:4px}
.umschalter,.gruppe-knopf{display:inline-flex;border:1px solid var(--linie);border-radius:14px;overflow:hidden}
.umschalter button,.gruppe-knopf button{border:0;background:var(--karte);font-size:13px;padding:4px 11px;color:var(--grau)}
.gruppe-knopf button{font-size:12px;padding:3px 10px}
.umschalter button.an{background:#FBF1F3;color:var(--weinrot);font-weight:500}
.gruppe-knopf button.an{background:var(--tinte);color:#fff}
.eigen{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px 6px;font-size:13px;color:var(--grau)}
.eigen input[type=date]{font:inherit;font-size:12px;border:1px solid var(--linie);border-radius:14px;padding:2px 8px;background:var(--karte);color:var(--tinte)}
.mehr-h{position:relative}
.mehr{border:1px solid var(--linie);background:var(--karte);border-radius:8px;width:36px;height:30px;font-size:17px;line-height:1}
.mehr-menue{position:absolute;right:0;top:34px;z-index:20;background:var(--karte);border:1px solid var(--linie);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px;min-width:240px;display:flex;flex-direction:column}
.mehr-menue button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;font-size:14px}
.mehr-menue button:hover{background:var(--papier)}
.mehr-menue .weg{color:var(--weinrot)}
.mehr-menue small{display:block;font-size:11px;color:var(--grau)}
.frage{border:1px solid var(--weinrot);border-radius:10px;background:var(--karte);padding:10px 12px;margin-bottom:10px;font-size:14px}
.frage p{margin:0 0 8px}
.knoepfe{display:flex;gap:6px;flex-wrap:wrap}

/* Werkzeugleiste — dieselbe wie auf der Fläche der Workbench */
.fl-leiste{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#E8E5DF;border:1px solid var(--linie);border-radius:10px;margin-bottom:8px}
.fl-knopf{width:34px;height:34px;padding:0;border:1px solid var(--linie);border-radius:7px;background:var(--karte);color:var(--tinte);
  display:inline-flex;align-items:center;justify-content:center}
.fl-knopf svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fl-knopf svg text{fill:currentColor;stroke:none;font-family:inherit}
.fl-knopf:hover{border-color:var(--grau)}
.fl-teiler{width:1px;background:var(--linie);margin:3px 2px}
.feld{display:block;width:100%;min-height:62vh;field-sizing:content;font:15px/1.65 ui-monospace,Menlo,Consolas,monospace;
  border:1px solid var(--linie);border-radius:6px;padding:12px;background:var(--karte);color:var(--tinte);resize:vertical}

/* Blatt: Ansicht wie auf der Fläche der Workbench */
.blatt{background:var(--blatt);border:1px solid var(--linie);border-radius:6px;padding:20px 28px 28px;font-size:16px;line-height:1.6;
  overflow-wrap:anywhere}
body:not(.breit) .blatt{padding:14px 14px 22px}
.blatt a{color:var(--weinrot)}
.fl-h1{font-size:19px;font-weight:600;line-height:1.3;padding:14px 0 4px;border-bottom:1px solid var(--linie);margin-bottom:4px}
.fl-h1:first-child,.fl-h2:first-child{padding-top:0}
.fl-h2{font-size:16.5px;font-weight:600;line-height:1.3;padding:12px 0 2px}
.fl-h3{font-size:15px;font-weight:500;line-height:1.3;padding:8px 0 2px;color:var(--grau)}
.fl-absatz{font-size:15px;line-height:1.6;padding:2px 0}
.fl-absatz.leise{color:var(--grau);font-style:italic}
.fl-zeile{display:flex;align-items:baseline;gap:9px;padding:2px 0;border-radius:6px}
.fl-text{flex:1;min-width:0;font-size:15px;line-height:1.6}
.fl-text.fertig{color:var(--grau);text-decoration:line-through}
.fl-punkt{flex:0 0 17px;height:17px;position:relative;align-self:flex-start;margin-top:4px}
.fl-punkt::before{content:"";position:absolute;left:6px;top:6px;width:5px;height:5px;background:var(--tinte)}
.fl-nr{flex:0 0 auto;min-width:18px;color:var(--grau);font-size:14px}
.fl-trenner{border-top:1px solid var(--linie);margin:12px 0}
.fl-leer{height:10px}
.fl-kap{font-variant:small-caps;letter-spacing:.03em}
.tkasten{flex:0 0 17px;width:17px;height:17px;border:1.5px solid var(--grau);border-radius:2px;background:transparent;
  padding:0;position:relative;align-self:flex-start;margin-top:4px}
.tkasten.an{background:var(--tinte);border-color:var(--tinte)}
.tkasten.an::after{content:"";position:absolute;left:4.5px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(42deg)}
.fl-zeile.aufgabe:hover{background:#F6F3EE}
.fl-zeile.hervor{background:#FFF4C2;box-shadow:0 0 0 4px #FFF4C2}
.plan{display:inline-flex;gap:4px;flex:0 0 auto;align-self:center;flex-wrap:wrap;justify-content:flex-end}
.sv{min-width:28px;height:26px;border:1px solid var(--linie);border-radius:6px;background:var(--karte);font-size:12px;font-weight:600;color:var(--grau);padding:0 6px}
.sv:hover{border-color:var(--weinrot);color:var(--weinrot)}
.drin{flex:0 0 auto;align-self:center;font-size:11.5px;border:1px solid var(--gruen);color:var(--gruen);border-radius:9px;padding:1px 8px;
  background:#F2F7F1;white-space:nowrap}
.drin:hover{border-color:var(--weinrot);color:var(--weinrot);background:var(--karte)}
/* Seit 3.0: in der Workbench für einen Tag vorgenommen */
.drin.h{border-color:var(--petrol,#2E6670);color:var(--petrol,#2E6670);background:#EAF2F3}
.wb-link{border:0;background:none;padding:0;color:var(--weinrot);text-decoration:underline;font:inherit}
.wb-tot{color:var(--grau)}
.fl-tab-rahmen{overflow-x:auto;margin:9px 0}
.fl-tab{border-collapse:collapse;font-size:14px;min-width:100%}
.fl-tab th,.fl-tab td{border:1px solid var(--linie);padding:5px 9px;text-align:left;vertical-align:top}
.fl-tab th{background:var(--karte);font-weight:500}
.fl-tab td .tkasten{display:inline-block;margin:0 6px 0 0;vertical-align:-3px}
.fl-tab td .fl-text{display:inline}
.leer-blatt{color:var(--grau)}
.leer-blatt p{margin:0 0 10px}
.art-marke{font-size:11px;border:1px solid var(--linie);border-radius:8px;padding:1px 8px;background:var(--karte)}
.eigen .leise{font-size:12px}
.filter{display:flex;border:1px solid var(--linie);border-radius:14px;overflow:hidden;margin:12px 6px 4px}
.filter button{flex:1;border:0;background:var(--karte);font-size:12.5px;padding:5px 0;color:var(--grau)}
.filter button.an{background:var(--tinte);color:#fff}

/* Offene Aufgaben: Knopf über dem Text, Fenster darüber */
.oa{margin:0 0 8px}
.oa-knopf{border:1.5px solid var(--weinrot);color:var(--weinrot);background:var(--karte);border-radius:16px;padding:5px 14px;font-size:13.5px;font-weight:500}
.oa-schleier{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28);display:flex;align-items:flex-start;justify-content:center;
  padding:max(60px, env(safe-area-inset-top)) 12px 12px}
.oa-fenster{background:var(--karte);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.3);width:580px;max-width:100%;max-height:80vh;
  display:flex;flex-direction:column;overflow:hidden}
.oa-kopf{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--linie)}
.oa-kopf h3{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oa-zu{border:0;background:none;font-size:22px;line-height:1;color:var(--grau);padding:0 4px}
.oa-zw{display:flex;align-items:center;gap:8px;padding:9px 16px;background:#F7F5F1;font-size:12.5px;color:var(--grau);border-bottom:1px solid var(--zart)}
.oa-liste{overflow:auto}
.oa-zeile{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--zart);font-size:15px}
.oa-zeile .tkasten{margin-top:0;align-self:center}
.oa-text{flex:1;min-width:0;overflow-wrap:anywhere}
.oa-hin{border:0;background:none;color:var(--grau);font-size:15px;padding:2px 6px;border-radius:6px}
.oa-hin:hover{color:var(--weinrot);background:#FBF1F3}
.oa-leer{padding:14px 16px;color:var(--grau);font-size:14px;margin:0}

/* Die ruhige Woche */
.ruhig{max-width:680px;margin:0 auto;padding:8px 6px 32px}
body:not(.breit) .ruhig{padding:4px 2px 22px}
.ruhig .fl-absatz,.ruhig .fl-text{font-size:16px}
.ruhig .feld{margin-top:4px}
.ruhig .fl-leiste{margin-top:10px}
.r-kopf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.r-kw{flex:1;font-size:12px;color:var(--grau);letter-spacing:.08em;text-transform:uppercase}
.r-h{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--weinrot);margin:22px 0 4px;font-weight:600}
.r-h:first-child{margin-top:6px}
.wz{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--linie)}
.wt{flex:0 1 auto;border:0;background:none;text-align:left;padding:8px 0;font-size:18px;line-height:1.45;color:var(--tinte)}
body:not(.breit) .wt{font-size:16.5px}
.wz.erl .wt{color:#9B958B;text-decoration:line-through;text-decoration-thickness:1.5px}
.hin{flex:0 0 auto;border:0;background:none;color:var(--grau);font-size:15px;padding:2px 6px;border-radius:6px}
.hin:hover{color:var(--weinrot);background:#FBF1F3}
.r-hinweis{font-size:13px;color:var(--grau);margin:22px 0 0;line-height:1.6}
.r-hinweis.um-hinweis{margin:0 0 14px;padding:10px 14px;border:1px solid var(--weinrot);border-radius:10px;background:var(--karte);color:var(--tinte)}
.archiv{max-width:640px;margin:14px auto 0;font-size:14px}
.archiv summary{cursor:pointer;color:var(--grau);padding:4px 0}
.archiv button{display:block;border:0;background:none;padding:5px 0;font-size:14px;text-align:left}
.archiv button.an{color:var(--weinrot);font-weight:500}
.klapp-kopf{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;font-weight:inherit}


/* Einstellungen */
.einst .karte{background:var(--karte);border:1px solid var(--linie);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.einst h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.einst .reihe{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--zart);font-size:14px}
.einst .reihe:first-of-type{border-top:0}
.einst .reihe span:last-child{color:var(--grau);text-align:right;overflow-wrap:anywhere}
.einst .reihe .gut{color:var(--gruen)}
.einst .reihe .warn{color:var(--weinrot)}
.einst .knoepfe{margin-top:8px}
.einst p{font-size:13px;color:var(--grau);margin:8px 0 0}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tinte);color:#fff;
  border-radius:10px;padding:9px 14px;font-size:13px;display:none;gap:14px;align-items:center;z-index:50;max-width:92vw;white-space:pre-line}
.toast.auf{display:flex}
.toast.warn{background:var(--weinrot)}
.toast button{border:0;background:none;color:#F3C9D1;font-weight:600;padding:0}
</style>
</head>
<body>
<div class="app">
  <header class="kopf">
    <button type="button" class="knopf-rund" id="leisteKnopf" onclick="leisteUm()" aria-label="Seitenleiste">☰</button>
    <span class="marke"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span class="titel">Wochenkompass <small>v3.0.1</small></span></span>
    <span class="luecke"></span>
    <button type="button" class="stand" id="standPille" onclick="standGeklickt()" title="Anmelden oder abgleichen">nur auf diesem Gerät</button>
    <button type="button" class="knopf-rund" onclick="oeffne('einst','')" aria-label="Einstellungen" title="Speicher, Anmeldung, Abgleich">⚙</button>
  </header>
  <div class="anmeldebanner" id="anmeldeStreifen">
    <span id="anmeldeText">Keine Verbindung zu Google.</span>
    <button type="button" onclick="anmelden(false)">Neu verbinden</button>
  </div>
  <button class="neustreifen" id="neuStreifen" type="button" onclick="neuLaden()">
    <span id="neuText"></span>

<script>
'use strict';

/* ============================================================
   Grunddaten

   Seit 3.0 arbeitet der Wochenkompass auf der workbench.json — mit den
   Sammlungen der Workbench. Gerätespeicher und Dateigriff heißen
   eigen: Liegen beide Apps unter derselben Adresse, kommen sie sich
   lokal nicht in die Quere; zusammen kommen sie über Google Drive.
   ============================================================ */

var APP_VERSION = '3.0.1';
var DATEINAME   = 'workbench.json';
var IDB_NAME    = 'kompass3-speicher';
var IDB_STORE   = 'handles';
var IDB_KEY     = 'datendatei';
var LS_KEY      = 'kompass3-daten';
var OPFS_NAME   = 'kompass3-workbench.json';
/* Dieselbe Google-Anwendung wie die Workbench: Nur so ist deren
   workbench.json mit dem Recht drive.file sichtbar. */
var CLIENT_ID   = '347268246401-9ktgd8q5caq6v5nma36i3e38u9c37bre.apps.googleusercontent.com';
var REDIRECT_URI = 'https://alexandernoeth-bam.github.io/workbench/workbench.html';
var SCOPES = 'https://www.googleapis.com/auth/drive.file';
var GIS_URL   = 'https://accounts.google.com/gsi/client';
var TOKEN_KEY = 'wochenkompass-zugriff';
var ANMELDE_MERKER = 'wochenkompass-war-angemeldet';
var ABGLEICH_VERZUG  = 4000;
var ABGLEICH_MINDEST = 20000;
var ABGLEICH_TAKT    = 30000;
var DRIVE_DATEI = 'workbench.json';
var VORLAUF_MS = 5 * 60 * 1000;
var GRABSTEIN_TAGE = 180;

/* Wörtlich aus der Workbench — sonst gingen beim Abgleich Sammlungen verloren. */
var SAMMLUNGEN = ['aufgaben','ziele','themen','projekte','ablaeufe','durchlaeufe',
                  'jahrestermine','ferien','einfaelle','gedanken','pinnwand',
                  'kalenderzuordnung','notizbuecher','notizseiten','wochen','tage'];

/* Aus der Workbench: nummerierte Zeilen */
var NUMMER_MUSTER = /^(\d{1,3})[.)]\s+(.*)$/;

var speicherWeg = 'keiner';
var dateiHandle = null;
var dateiName = '';
var rechteStand = 'unbekannt';
var letzterSchreibvorgang = null;
var tokenClient = null;
var zugriffToken = null;
var tokenAblauf = 0;
var erneuerungsUhr = null;
var erneuerungVersuche = 0;
var ERNEUERUNG_MAX = 6;
var ERNEUERUNG_ABSTAND = 60000;
var ANMELDE_ZEITGRENZE_MS = 60 * 1000;
var anmeldungLaeuft = false;
var letzteErneuerung = null;
var gisBereit = false;
var driveDateiId = '';
var driveStand = '';
var letzteUebertragung = null;
var letzterAbgleich = null;
var letzterBericht = null;
var abgleichUhr = null;
var abgleichLaeuft = false;
var abgleichZuletztMs = 0;
var verbindungOk = null;
var verbindungUhr = null;
var VERBINDUNG_TAKT = 60000;
var abgleichFehler = '';
var lokalOffen = false;
var taktUhr = null;

/* ============================================================
   Unterbau aus der Workbench 6.0.1 — wörtlich übernommen:
   Speicher, Google-Anmeldung, Drive, Abgleich, Löschvermerke,
   Bausteine des Editors und der Ansicht der Fläche, leere
   Datenbank und der Aktivitäten-Kern (kp…).
   ============================================================ */

function zwei(n) { return (n < 10 ? '0' : '') + n; }

function isoDatum(d) {
  var x = d || new Date();
  return x.getFullYear() + '-' + zwei(x.getMonth() + 1) + '-' + zwei(x.getDate());
}

function isoZeit(d) {
  var x = d || new Date();
  return isoDatum(x) + ' ' + zwei(x.getHours()) + ':' + zwei(x.getMinutes()) + ':' + zwei(x.getSeconds());
}

function esc(text) {
  return String(text === null || text === undefined ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function ausIso(is) {
  var p = String(is).split('-');
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}

function tagePlus(is, n) {
  var d = ausIso(is);
  d.setDate(d.getDate() + n);
  return isoDatum(d);
}

function montagVon(is) {
  var d = ausIso(is);
  var wt = (d.getDay() === 0) ? 7 : d.getDay();
  return tagePlus(is, 1 - wt);
}

function kalenderwoche(is) {
  var d = ausIso(is);
  var ziel = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  ziel.setDate(ziel.getDate() + 3 - ((ziel.getDay() + 6) % 7));
  var ersterDonnerstag = new Date(ziel.getFullYear(), 0, 4);
  ersterDonnerstag.setDate(ersterDonnerstag.getDate() + 3 - ((ersterDonnerstag.getDay() + 6) % 7));
  return 1 + Math.round((ziel - ersterDonnerstag) / (7 * 86400000));
}

function fsApiDa()   { return (typeof window.showOpenFilePicker === 'function'); }

function opfsDa()    { return !!(navigator.storage && navigator.storage.getDirectory); }

function idbDa()     { return !!window.indexedDB; }

function localDa() {
  try {
    window.localStorage.setItem('__probe__', '1');
    window.localStorage.removeItem('__probe__');
    return true;
  } catch (e) {
    return false;
  }
}

function idbOeffnen() {
  return new Promise(function (fertig, fehler) {
    if (!idbDa()) { fehler(new Error('IndexedDB nicht verfügbar')); return; }
    var anfrage = window.indexedDB.open(IDB_NAME, 1);
    anfrage.onupgradeneeded = function () {
      var db = anfrage.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) { db.createObjectStore(IDB_STORE); }
    };
    anfrage.onsuccess = function () { fertig(anfrage.result); };
    anfrage.onerror   = function () { fehler(anfrage.error); };
  });
}

function idbSchreiben(schluessel, wert) {
  return idbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(IDB_STORE, 'readwrite');
      t.objectStore(IDB_STORE).put(wert, schluessel);
      t.oncomplete = function () { db.close(); fertig(true); };
      t.onerror    = function () { db.close(); fehler(t.error); };
    });
  });
}

function idbLesen(schluessel) {
  return idbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(IDB_STORE, 'readonly');
      var a = t.objectStore(IDB_STORE).get(schluessel);
      a.onsuccess = function () { db.close(); fertig(a.result || null); };
      a.onerror   = function () { db.close(); fehler(a.error); };
    });
  });
}

function idbLoeschen(schluessel) {
  return idbOeffnen().then(function (db) {
    return new Promise(function (fertig, fehler) {
      var t = db.transaction(IDB_STORE, 'readwrite');
      t.objectStore(IDB_STORE).delete(schluessel);
      t.oncomplete = function () { db.close(); fertig(true); };
      t.onerror    = function () { db.close(); fehler(t.error); };
    });
  });
}

function rechtePruefen(handle) {
  if (!handle || typeof handle.queryPermission !== 'function') {
    return Promise.resolve('unbekannt');
  }
  return handle.queryPermission({ mode: 'readwrite' })
    .then(function (stand) { return stand; })
    .catch(function () { return 'unbekannt'; });
}

function rechteAnfragen(handle) {
  if (!handle || typeof handle.requestPermission !== 'function') {
    return Promise.resolve('unbekannt');
  }
  return handle.requestPermission({ mode: 'readwrite' })
    .then(function (stand) { return stand; })
    .catch(function () { return 'denied'; });
}

function dateiSchreiben(handle, text) {
  return handle.createWritable().then(function (strom) {
    return strom.write(text).then(function () { return strom.close(); });
  });
}

function dateiLesen(handle) {
  return handle.getFile().then(function (f) { return f.text(); });
}

function opfsHandle(anlegen) {
  return navigator.storage.getDirectory().then(function (ordner) {
    return ordner.getFileHandle(OPFS_NAME, { create: !!anlegen });
  });
}

function opfsSchreiben(text) {
  return opfsHandle(true).then(function (h) { return dateiSchreiben(h, text); });
}

function opfsLesen() {
  return opfsHandle(false).then(function (h) { return dateiLesen(h); });
}

function localSchreiben(text) {
  window.localStorage.setItem(LS_KEY, text);
  return Promise.resolve(true);
}

function localLesen() {
  return Promise.resolve(window.localStorage.getItem(LS_KEY));
}

function jetzt() { return Date.now(); }

function neueKennung() {
  return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function grabsteinSetzen(sammlung, id) {
  if (!Array.isArray(DB.grabsteine)) { DB.grabsteine = []; }
  var i;
  for (i = 0; i < DB.grabsteine.length; i++) {
    if (DB.grabsteine[i].s === sammlung && DB.grabsteine[i].id === id) {
      DB.grabsteine[i].z = jetzt();
      return DB.grabsteine[i];
    }
  }
  var g = { s: sammlung, id: id, z: jetzt() };
  DB.grabsteine.push(g);
  return g;
}

function grabsteinZeit(steine, sammlung, id) {
  var i;
  for (i = 0; i < steine.length; i++) {
    if (steine[i].s === sammlung && steine[i].id === id) { return steine[i].z || 0; }
  }
  return 0;
}

function grabsteineAufraeumen(steine) {
  var grenze = jetzt() - (GRABSTEIN_TAGE * 24 * 60 * 60 * 1000);
  var frisch = [];
  var i;
  for (i = 0; i < steine.length; i++) {
    if ((steine[i].z || 0) >= grenze) { frisch.push(steine[i]); }
  }
  return frisch;
}

function zusammenfuehren(lokal, fremd) {
  var bericht = { neu: 0, ersetzt: 0, behalten: 0, entfernt: 0, konflikte: [] };
  var ergebnis = leereDatenbank();

  var steine = grabsteineAufraeumen(
    (Array.isArray(lokal.grabsteine) ? lokal.grabsteine : [])
      .concat(Array.isArray(fremd.grabsteine) ? fremd.grabsteine : [])
  );
  /* Doppelte Vermerke auf den jüngsten zusammenziehen */
  var karteS = {};
  var i, s, k;
  for (i = 0; i < steine.length; i++) {
    var sl = steine[i].s + '|' + steine[i].id;
    if (!karteS[sl] || (steine[i].z || 0) > karteS[sl].z) {
      karteS[sl] = { s: steine[i].s, id: steine[i].id, z: steine[i].z || 0 };
    }
  }
  var steineFrisch = [];
  for (k in karteS) {
    if (Object.prototype.hasOwnProperty.call(karteS, k)) { steineFrisch.push(karteS[k]); }
  }
  ergebnis.grabsteine = steineFrisch;

  for (i = 0; i < SAMMLUNGEN.length; i++) {
    s = SAMMLUNGEN[i];

    if (s === 'kalenderzuordnung') {
      var a = lokal[s] || {};
      var b = fremd[s] || {};
      var alle = {};
      for (k in a) { if (Object.prototype.hasOwnProperty.call(a, k)) { alle[k] = true; } }
      for (k in b) { if (Object.prototype.hasOwnProperty.call(b, k)) { alle[k] = true; } }
      for (k in alle) {
        if (!Object.prototype.hasOwnProperty.call(alle, k)) { continue; }
        var wa = a[k] || null;
        var wb = b[k] || null;
        var tot = grabsteinZeit(steineFrisch, s, k);
        var neuster = Math.max(wa ? (wa.geaendert || 0) : 0, wb ? (wb.geaendert || 0) : 0);
        if (tot && tot >= neuster) { bericht.entfernt++; continue; }
        if (wa && wb) {
          if ((wb.geaendert || 0) > (wa.geaendert || 0)) {
            ergebnis[s][k] = wb; bericht.ersetzt++;
            if (wa.art !== wb.art) { bericht.konflikte.push({ s: s, id: k, gewaehlt: 'fremd' }); }
          } else {
            ergebnis[s][k] = wa; bericht.behalten++;
            if (wa.art !== wb.art) { bericht.konflikte.push({ s: s, id: k, gewaehlt: 'lokal' }); }
          }
        } else if (wb) {
          ergebnis[s][k] = wb; bericht.neu++;
        } else {
          ergebnis[s][k] = wa; bericht.behalten++;
        }
      }
      continue;
    }

    var listeA = Array.isArray(lokal[s]) ? lokal[s] : [];
    var listeB = Array.isArray(fremd[s]) ? fremd[s] : [];
    var karte = {};
    var j;
    for (j = 0; j < listeA.length; j++) { karte[listeA[j].id] = { a: listeA[j], b: null }; }
    for (j = 0; j < listeB.length; j++) {
      if (karte[listeB[j].id]) { karte[listeB[j].id].b = listeB[j]; }
      else { karte[listeB[j].id] = { a: null, b: listeB[j] }; }
    }

    var kennung;
    for (kennung in karte) {
      if (!Object.prototype.hasOwnProperty.call(karte, kennung)) { continue; }
      var paar = karte[kennung];
      var za = paar.a ? (paar.a.geaendert || 0) : 0;
      var zb = paar.b ? (paar.b.geaendert || 0) : 0;
      var totZeit = grabsteinZeit(steineFrisch, s, kennung);

      if (totZeit && totZeit >= Math.max(za, zb)) { bericht.entfernt++; continue; }

      if (paar.a && paar.b) {
        if (zb > za) {
          ergebnis[s].push(paar.b); bericht.ersetzt++;
          if (za > 0 && zb > 0) { bericht.konflikte.push({ s: s, id: kennung, gewaehlt: 'fremd' }); }
        } else if (za > zb) {
          ergebnis[s].push(paar.a); bericht.behalten++;
          if (zb > 0) { bericht.konflikte.push({ s: s, id: kennung, gewaehlt: 'lokal' }); }
        } else {
          ergebnis[s].push(paar.a); bericht.behalten++;
        }
      } else if (paar.b) {
        ergebnis[s].push(paar.b); bericht.neu++;
      } else {
        ergebnis[s].push(paar.a); bericht.behalten++;
      }
    }
  }

  /* Einstellungen wurden bisher als Ganzes ersetzt: Wer den jüngeren
     Stempel hatte, bestimmte alles. Damit verschwand eine Einstellung,
     die das andere Gerät gar nicht kannte — etwa eine neu freigegebene
     Art fürs Jahresraster. Jetzt wird je Schlüssel zusammengeführt:
     Der jüngere Stand gewinnt, aber er löscht nichts, was er nicht
     kennt. */
  var ea = (lokal.einstellungen && lokal.einstellungen.stempel) || 0;
  var eb = (fremd.einstellungen && fremd.einstellungen.stempel) || 0;
  var aelter = (eb > ea) ? (lokal.einstellungen || {}) : (fremd.einstellungen || {});
  var juenger = (eb > ea) ? (fremd.einstellungen || {}) : (lokal.einstellungen || {});

  /* Diese Einstellungen sind Verzeichnisse: Dort wird je Eintrag
     verschmolzen, sonst verlöre man die Wahl des anderen Geräts. */
  var VERZEICHNISSE = ['artenImJahr', 'flaecheOben', 'skizzenVorschau'];

  var e;
  for (e in aelter) {
    if (Object.prototype.hasOwnProperty.call(aelter, e)) {
      ergebnis.einstellungen[e] = aelter[e];
    }
  }
  for (e in juenger) {
    if (!Object.prototype.hasOwnProperty.call(juenger, e)) { continue; }
    if (VERZEICHNISSE.indexOf(e) >= 0) {
      var zus = {};
      var q, k2;
      for (q = 0; q < 2; q++) {
        var vz = (q === 0) ? (aelter[e] || {}) : (juenger[e] || {});
        for (k2 in vz) {
          if (Object.prototype.hasOwnProperty.call(vz, k2)) { zus[k2] = vz[k2]; }
        }
      }
      ergebnis.einstellungen[e] = zus;
      continue;
    }
    ergebnis.einstellungen[e] = juenger[e];
  }
  ergebnis.einstellungen.clientId = CLIENT_ID;
  ergebnis.einstellungen.redirectUri = REDIRECT_URI;
  ergebnis.version = APP_VERSION;

  return { db: ergebnis, bericht: bericht };
}

function alsText() {
  DB.version = APP_VERSION;
  if (!DB.einstellungen) { DB.einstellungen = leereDatenbank().einstellungen; }
  DB.einstellungen.gespeichert = isoZeit();
  if (!DB.einstellungen.stempel) { DB.einstellungen.stempel = jetzt(); }
  if (!Array.isArray(DB.grabsteine)) { DB.grabsteine = []; }
  return JSON.stringify(DB, null, 2);
}

function uebernehmen(text) {
  if (!text) { return false; }
  var gelesen;
  try {
    gelesen = JSON.parse(text);
  } catch (e) {
    melde('Die Datei enthält kein gültiges JSON: ' + e.message, 'warn');
    return false;
  }
  if (!gelesen || typeof gelesen !== 'object') { return false; }

  var frisch = leereDatenbank();
  var i;
  for (i = 0; i < SAMMLUNGEN.length; i++) {
    var name = SAMMLUNGEN[i];
    if (name === 'kalenderzuordnung') {
      if (gelesen[name] && typeof gelesen[name] === 'object') { frisch[name] = gelesen[name]; }
    } else if (Array.isArray(gelesen[name])) {
      frisch[name] = gelesen[name];
    }
  }
  if (gelesen.einstellungen && typeof gelesen.einstellungen === 'object') {
    var e;
    for (e in gelesen.einstellungen) {
      if (Object.prototype.hasOwnProperty.call(gelesen.einstellungen, e)) {
        frisch.einstellungen[e] = gelesen.einstellungen[e];
      }
    }
  }
  if (Array.isArray(gelesen.grabsteine)) { frisch.grabsteine = gelesen.grabsteine; }
  frisch.einstellungen.clientId    = CLIENT_ID;
  frisch.einstellungen.redirectUri = REDIRECT_URI;
  bestandStempeln(frisch);
  DB = frisch;
  return true;
}

function speichern() {
  var text = alsText();

  if (speicherWeg === 'datei' && dateiHandle) {
    return dateiSchreiben(dateiHandle, text).then(function () {
      letzterSchreibvorgang = isoZeit();
      return 'datei';
    }).catch(function (f) {
      melde('Schreiben in die Datei fehlgeschlagen, weiche auf den Notweg aus.\n' + f.message, 'warn');
      return notwegSchreiben(text);
    });
  }
  return notwegSchreiben(text);
}

function notwegSchreiben(text) {
  if (opfsDa()) {
    return opfsSchreiben(text).then(function () {
      speicherWeg = 'opfs';
      letzterSchreibvorgang = isoZeit();
      return 'opfs';
    }).catch(function () {
      return localNotweg(text);
    });
  }
  return localNotweg(text);
}

function localNotweg(text) {
  if (!localDa()) {
    speicherWeg = 'keiner';
    return Promise.reject(new Error('Kein Speicherweg verfügbar'));
  }
  return localSchreiben(text).then(function () {
    speicherWeg = 'local';
    letzterSchreibvorgang = isoZeit();
    return 'local';
  });
}

function laden() {
  if (dateiHandle) {
    return rechtePruefen(dateiHandle).then(function (stand) {
      rechteStand = stand;
      if (stand !== 'granted') { return null; }
      return dateiLesen(dateiHandle).then(function (text) {
        if (uebernehmen(text)) { speicherWeg = 'datei'; return 'datei'; }
        return null;
      });
    }).then(function (ergebnis) {
      if (ergebnis) { return ergebnis; }
      return notwegLesen();
    }).catch(function () {
      return notwegLesen();
    });
  }
  return notwegLesen();
}

function notwegLesen() {
  if (opfsDa()) {
    return opfsLesen().then(function (text) {
      if (uebernehmen(text)) { speicherWeg = 'opfs'; return 'opfs'; }
      return localNotwegLesen();
    }).catch(function () {
      return localNotwegLesen();
    });
  }
  return localNotwegLesen();
}

function localNotwegLesen() {
  if (!localDa()) { speicherWeg = 'keiner'; return Promise.resolve(null); }
  return localLesen().then(function (text) {
    if (uebernehmen(text)) { speicherWeg = 'local'; return 'local'; }
    speicherWeg = localDa() ? 'local' : 'keiner';
    return null;
  });
}

function gisLaden() {
  if (gisBereit) { return Promise.resolve(true); }
  if (window.google && window.google.accounts && window.google.accounts.oauth2) {
    gisBereit = true;
    return Promise.resolve(true);
  }
  return new Promise(function (fertig, fehler) {
    var vorhanden = document.getElementById('gisSkript');
    if (vorhanden) {
      vorhanden.addEventListener('load', function () { gisBereit = true; fertig(true); });
      return;
    }
    var s = document.createElement('script');
    s.id = 'gisSkript';
    s.src = GIS_URL;
    s.async = true;
    s.onload = function () { gisBereit = true; fertig(true); };
    s.onerror = function () { fehler(new Error('Die Anmeldebibliothek ließ sich nicht laden.')); };
    document.head.appendChild(s);
  });
}

function tokenMerken(token, gueltigSek) {
  zugriffToken = token;
  tokenAblauf = Date.now() + (gueltigSek * 1000);
  try {
    window.sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ t: token, a: tokenAblauf }));
  } catch (e) {
    /* ohne sessionStorage lebt der Schlüssel nur bis zum Neuladen */
  }
  erneuerungPlanen();
}

function tokenAusSitzung() {
  try {
    var roh = window.sessionStorage.getItem(TOKEN_KEY);
    if (!roh) { return false; }
    var w = JSON.parse(roh);
    if (!w || !w.t || !w.a || w.a <= Date.now()) { return false; }
    zugriffToken = w.t;
    tokenAblauf = w.a;
    erneuerungPlanen();
    return true;
  } catch (e) {
    return false;
  }
}

function tokenVergessen() {
  zugriffToken = null;
  tokenAblauf = 0;
  if (erneuerungsUhr) { window.clearTimeout(erneuerungsUhr); erneuerungsUhr = null; }
  try { window.sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* egal */ }
}

function tokenGueltig() {

function antwortPruefen(a) {
  if (a.ok) { return a; }
  var dienst = dienstAusAdresse(a.url);
  if (a.status === 401) {
    tokenVergessen();
    throw new Error('Der Zugriff ist abgelaufen. Bitte neu anmelden.');

  return a.text().then(function (t) {
    /* Eine nicht freigeschaltete Schnittstelle sieht aus wie ein
       Rechtefehler, ist aber eine Einstellung im Google-Projekt. */
    if (a.status === 403 && /has not been used|is disabled|SERVICE_DISABLED/i.test(t)) {
      throw new Error(dienst + ' ist im Google-Projekt noch nicht freigeschaltet.\n'
        + 'Cloud Console öffnen, Projekt wählen, unter „APIs & Dienste – Bibliothek" '
        + 'die passende Schnittstelle aktivieren und ein bis zwei Minuten warten.');
    }
    if (a.status === 403) {
      throw new Error(dienst + ' verweigert den Zugriff (403).\n' + t.slice(0, 200));
    }
    throw new Error(dienst + ' antwortete mit ' + a.status + ': ' + t.slice(0, 200));
  });
}

  if (typeof document.execCommand === 'function') {

  }
  var alt = String(feld.value || '');
  feld.value = alt.slice(0, a) + text + alt.slice(b);

  return false;

function wortUmDieMarke(text, a, b) {
  if (a !== b) { return { a: a, b: b }; }
  var links = a;
  var rechts = a;
  while (links > 0 && !/\s/.test(text.charAt(links - 1))) { links--; }
  while (rechts < text.length && !/\s/.test(text.charAt(rechts))) { rechts++; }
  if (rechts > links) { return { a: links, b: rechts }; }
  return { a: a, b: b };
}

function istTabellenzeile(zeile) {
  var z = String(zeile).replace(/^\s+/, '');
  return z.indexOf('|') === 0 && z.length > 1;
}

function istTrennzeile(zeile) {
  var z = String(zeile).replace(/^\s+/, '');
  if (!istTabellenzeile(z)) { return false; }
  return /^\|(\s*:?-{2,}:?\s*\|)+\s*$/.test(z);
}

function tabellenZellen(zeile) {
  var z = String(zeile).replace(/^\s+/, '').replace(/\s+$/, '');
  if (z.charAt(0) === '|') { z = z.slice(1); }
  if (z.charAt(z.length - 1) === '|') { z = z.slice(0, -1); }
  var roh = z.split('|');
  var aus = [];
  var i;
  for (i = 0; i < roh.length; i++) { aus.push(roh[i].trim()); }
  return aus;
}

function tabellenRichtung(trennzeile) {
  var zellen = tabellenZellen(trennzeile);
  var aus = [];
  var i;
  for (i = 0; i < zellen.length; i++) {
    var z = zellen[i];
    var links = z.charAt(0) === ':';
    var rechts = z.charAt(z.length - 1) === ':';
    if (links && rechts) { aus.push('center'); }
    else if (rechts) { aus.push('right'); }
    else { aus.push('left'); }
  }
  return aus;
}

function listenNummern(zeilen) {
  var aus = [];
  var zaehler = {};
  var i;
  var k;
  for (i = 0; i < zeilen.length; i++) {
    var roh = String(zeilen[i]);
    var tiefe = 0;
    var rest = roh;
    while (rest.indexOf('  ') === 0) { tiefe++; rest = rest.slice(2); }
    if (!rest.trim().length) { aus.push(0); continue; }
    var m = rest.match(NUMMER_MUSTER);
    for (k in zaehler) {
      if (Number(k) > tiefe || (!m && Number(k) >= tiefe)) { delete zaehler[k]; }
    }
    if (!m) { aus.push(0); continue; }
    zaehler[tiefe] = (zaehler[tiefe] === undefined) ? Number(m[1]) : zaehler[tiefe] + 1;
    aus.push(zaehler[tiefe]);
  }
  return aus;
}

function leereDatenbank() {
  return {
    version:           APP_VERSION,
    aufgaben:          [],
    ziele:             [],
    themen:            [],
    projekte:          [],

}

/* ---------- Aktivitäten-Kern der Workbench ---------- */

var KP_KASTEN = /^(\s*)\[([ xX]?)\]\s*(.*)$/;

var KP_ABSCHNITTE = { s: 'Bringt mich substanziell weiter', v: 'Verbindlichkeiten' };

var KP_ZUSTAENDE = [['laeuft', 'läuft'], ['ruht', 'ruht'], ['erledigt', 'erledigt']];

var KP_ARTEN = {
  vorhaben: { zeichen: '◎', name: 'Vorhaben', gruppe: 'Vorhaben', neu: 'Name des Vorhabens' },
  liste:    { zeichen: '≡', name: 'Liste',    gruppe: 'Listen',   neu: 'Name der Liste' },
  notiz:    { zeichen: '✎', name: 'Notiz',    gruppe: 'Notizen',  neu: 'Titel der Notiz' }
};

var KP_VERWEIS = /\[\[(projekt|ziel|flaeche|aufgabe|notiz):([A-Za-z0-9:_-]{1,40})\|([^\]]{0,80})\]\]/g;

function grabsteinWeg(sammlung, id) {
  DB.grabsteine = (DB.grabsteine || []).filter(function (g) { return !(g.s === sammlung && g.id === id); });
}

function kpEigenschaft(h, name, lesen, schreiben) {
  Object.defineProperty(h, name, { get: lesen, set: schreiben, enumerable: true, configurable: true });
}

function kpHuelle(satz, art, typ) {
  if (!satz) { return null; }
  var alt = satz.__huelle;
  if (alt && alt.__satz === satz && alt.art === art) { return alt; }
  var h = {};
  Object.defineProperty(h, '__satz', { value: satz });
  Object.defineProperty(h, 'art', { value: art, enumerable: true });
  Object.defineProperty(h, 'typ', { value: typ || '', enumerable: true });
  kpEigenschaft(h, 'id', function () { return satz.id; }, function (w) { satz.id = w; });
  var namensFeld = (art === 'notiz') ? 'titel' : 'name';
  kpEigenschaft(h, 'titel', function () { return satz[namensFeld] || ''; }, function (w) { satz[namensFeld] = w; });
  var textFeld = (art === 'vorhaben') ? 'flaeche' : 'text';
  kpEigenschaft(h, 'text', function () { return String(satz[textFeld] || ''); }, function (w) { satz[textFeld] = String(w); });
  kpEigenschaft(h, 'kontext', function () { return satz.kontext || ''; }, function (w) { satz.kontext = w; });
  kpEigenschaft(h, 'rang', function () { return satz.ordnung; }, function (w) { satz.ordnung = w; });
  kpEigenschaft(h, 'geaendert', function () { return satz.geaendert; }, function (w) { satz.geaendert = w; });
  if (art === 'vorhaben') {
    kpEigenschaft(h, 'zustand', function () {
      if (satz.status === 'ruht') { return 'ruht'; }
      if (satz.status === 'abgeschlossen') { return 'erledigt'; }
      return 'laeuft';
    }, function (w) {
      satz.status = (w === 'ruht') ? 'ruht' : ((w === 'erledigt') ? 'abgeschlossen' : 'laufend');
    });
    kpEigenschaft(h, 'termin', function () { return (typ === 'ziel') ? (satz.zieltermin || '') : (satz.ende || ''); },
                  function (w) { if (typ === 'ziel') { satz.zieltermin = w; } else { satz.ende = w; } });
  }
  Object.defineProperty(satz, '__huelle', { value: h, enumerable: false, configurable: true, writable: true });
  return h;
}

function kpSammlungVon(s) {
  if (!s) { return ''; }
  if (s.art === 'vorhaben') { return (s.typ === 'ziel') ? 'ziele' : 'projekte'; }
  return (s.art === 'liste') ? 'themen' : 'gedanken';
}

function kpSeitenAlle() {
  var aus = [];
  (DB.projekte || []).forEach(function (p) { aus.push(kpHuelle(p, 'vorhaben', 'projekt')); });
  (DB.ziele || []).forEach(function (z) { aus.push(kpHuelle(z, 'vorhaben', 'ziel')); });
  (DB.themen || []).forEach(function (t) { aus.push(kpHuelle(t, 'liste', '')); });
  (DB.gedanken || []).forEach(function (g) { if (g && !g.kompass) { aus.push(kpHuelle(g, 'notiz', '')); } });
  return aus;
}

function kpNachRang(liste) {
  return liste.map(function (s, i) { return { s: s, i: i }; }).sort(function (a, b) {
    var ra = (typeof a.s.rang === 'number') ? a.s.rang : 1e12;
    var rb = (typeof b.s.rang === 'number') ? b.s.rang : 1e12;
    return (ra !== rb) ? ra - rb : a.i - b.i;
  }).map(function (x) { return x.s; });
}

function kpSeiten(art) {
  return kpNachRang(kpSeitenAlle().filter(function (s) { return s.art === art; }));
}

function kpSeiteFinden(id) {
  if (!id) { return null; }
  var l = kpSeitenAlle();
  var i;
  for (i = 0; i < l.length; i++) { if (l[i].id === id) { return l[i]; } }
  return null;
}

function kpNaechsterRang() {
  return kpSeitenAlle().reduce(function (m, s) { return Math.max(m, (typeof s.rang === 'number') ? s.rang : 0); }, 0) + 10;
}

function kpSeiteAnlegen(art, name, kontext) {
  var titel = String(name || '').trim().slice(0, 200);
  if (!titel || !KP_ARTEN[art]) { return null; }
  var k = (kontext === 'privat' || kontext === 'beruflich') ? kontext : 'beruflich';
  var rang = kpNaechsterRang();
  var satz;
  if (art === 'vorhaben') {
    satz = { id: neueKennung(), name: titel, kontext: k, beschreibung: '', start: '', ende: '',
             status: 'laufend', meilensteine: [], zielzustaende: [], anlagen: [], flaeche: '',
             ordnung: rang, geaendert: jetzt() };
    if (!Array.isArray(DB.projekte)) { DB.projekte = []; }
    DB.projekte.push(satz);
    return kpHuelle(satz, 'vorhaben', 'projekt');
  }
  if (art === 'liste') {
    satz = { id: neueKennung(), name: titel, kontext: k, text: '', ordnung: rang, geaendert: jetzt() };
    if (!Array.isArray(DB.themen)) { DB.themen = []; }
    DB.themen.push(satz);
    return kpHuelle(satz, 'liste', '');
  }
  satz = { id: neueKennung(), titel: titel, text: '', kontext: k, ordnung: rang, geaendert: jetzt() };
  if (!Array.isArray(DB.gedanken)) { DB.gedanken = []; }
  DB.gedanken.push(satz);
  return kpHuelle(satz, 'notiz', '');
}

function kpPasstFilter(s, filter) {
  return !filter || filter === 'alle' || !s.kontext || s.kontext === filter;
}

function kpGruppenSchluessel(s) {
  return (s.art === 'vorhaben') ? 'vorhaben-' + (s.zustand || 'laeuft') : s.art;
}

function kpGruppe(schluessel) {
  return kpNachRang(kpSeitenAlle().filter(function (s) { return kpGruppenSchluessel(s) === schluessel; }));
}

function kpVerschiebenKern(id, zielId, wo) {
  var s = kpSeiteFinden(id);
  var z = kpSeiteFinden(zielId);
  if (!s || !z || s.id === z.id || kpGruppenSchluessel(s) !== kpGruppenSchluessel(z)) { return false; }
  var gruppe = kpGruppe(kpGruppenSchluessel(s));
  var raenge = gruppe.map(function (x) { return x.rang; });
  var eindeutig = raenge.every(function (r, i) { return typeof r === 'number' && (i === 0 || r > raenge[i - 1]); });
  if (!eindeutig) {
    var basis = kpNaechsterRang();
    raenge = gruppe.map(function (x, i) { return basis + i * 10; });
  }
  var neu = gruppe.filter(function (x) { return x.id !== s.id; });
  var stelle = neu.map(function (x) { return x.id; }).indexOf(z.id) + (wo === 'nach' ? 1 : 0);
  neu.splice(stelle, 0, s);
  neu.forEach(function (x, i) {
    if (x.rang !== raenge[i]) { x.rang = raenge[i]; x.geaendert = jetzt(); }
  });
  return true;
}

function kpSchluessel(text) {
  return String(text || '').replace(/\s+/g, ' ').trim();
}

function kpAufgabe(zeile) {
  var m = String(zeile).match(KP_KASTEN);
  if (!m) { return null; }
  return { erledigt: (m[2] === 'x' || m[2] === 'X'), text: kpSchluessel(m[3]) };
}

function kpOffeneZahl(seite) {
  var zeilen = String((seite && seite.text) || '').split('\n');
  var n = 0;
  var i;
  for (i = 0; i < zeilen.length; i++) {
    var a = kpAufgabe(zeilen[i]);
    if (a && !a.erledigt && a.text) { n++; }
  }
  return n;
}

function kpPasst(zeilenText, gemerkt) {
  var z = String(zeilenText || '');
  var g = String(gemerkt || '');
  if (!g) { return 0; }
  if (z === g) { return 2; }
  if (z.length > g.length && z.indexOf(g) === 0 && /[\s(\[,.;:!?\-–—✔→]/.test(z.charAt(g.length))) { return 1; }
  return 0;
}

function kpHatWoertlich(seite, text) {
  if (!seite) { return false; }
  return String(seite.text || '').split('\n').some(function (z) {
    var a = kpAufgabe(z);
    return !!(a && a.text === text);
  });
}

function kpZeileSuchen(seite, text, vorzug) {
  if (!seite) { return null; }
  var zeilen = String(seite.text || '').split('\n');
  var beste = null;
  var besteWert = 0;
  var i;
  for (i = 0; i < zeilen.length; i++) {
    var a = kpAufgabe(zeilen[i]);
    var p = a ? kpPasst(a.text, text) : 0;
    if (!p) { continue; }
    var wert = p * 2 + ((typeof vorzug !== 'boolean' || a.erledigt === vorzug) ? 1 : 0);
    if (wert > besteWert) { beste = { nr: i, erledigt: a.erledigt }; besteWert = wert; }
  }
  return beste;
}

function kpKastenSetzen(seite, nr, erledigt) {
  var zeilen = String(seite.text || '').split('\n');
  if (nr < 0 || nr >= zeilen.length) { return false; }
  var vorne = zeilen[nr].match(/^(\s*)\[([ xX]?)\]/);
  if (!vorne) { return false; }
  zeilen[nr] = vorne[1] + (erledigt ? '[x]' : '[]') + zeilen[nr].slice(vorne[0].length);
  seite.text = zeilen.join('\n');
  seite.geaendert = jetzt();
  return true;
}

function kpHeuteMontag() { return montagVon(isoDatum()); }

function kpWocheKennung(montag) { return 'kw-' + montag; }

function kpKurz(is) {
  var d = ausIso(is);
  return d.getDate() + '.' + (d.getMonth() + 1) + '.';
}

function kpWochenTitel(montag) {
  return 'KW ' + kalenderwoche(montag) + ' · ' + kpKurz(montag) + ' – ' + kpKurz(tagePlus(montag, 6));
}

function kpWocheGeruest() {
  return '## ' + KP_ABSCHNITTE.s + '\n\n## ' + KP_ABSCHNITTE.v + '\n';
}

function kpWochen() {
  return (DB.wochen || []).filter(function (w) { return w && w.montag; })
    .sort(function (a, b) { return (a.montag < b.montag) ? 1 : ((a.montag > b.montag) ? -1 : 0); });
}

function kpWocheFinden(montag) {
  var l = DB.wochen || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i].montag === montag) { return l[i]; } }
  return null;
}

function kpWocheAnlegen(montag) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(montag || ''))) { return null; }
  var w = kpWocheFinden(montag);
  if (w) {
    if (typeof w.text !== 'string') { w.text = kpWocheTextAus(w); w.geaendert = jetzt(); }
    if (!Array.isArray(w.eintraege)) { w.eintraege = []; }
    return w;
  }
  if (!Array.isArray(DB.wochen)) { DB.wochen = []; }
  w = { id: kpWocheKennung(montag), montag: montag, text: kpWocheGeruest(), eintraege: [], geaendert: jetzt() };
  DB.wochen.push(w);
  grabsteinWeg('wochen', w.id);
  return w;
}

function kpWocheTextAus(w) {
  var l = Array.isArray(w && w.eintraege) ? w.eintraege : [];
  var zeile = function (text, erledigt) { return (erledigt ? '[x] ' : '[] ') + text; };
  var s = l.filter(function (e) { return e.abschnitt === 's'; }).map(function (e) { return zeile(e.text, e.erledigt); });
  var v = l.filter(function (e) { return e.abschnitt === 'v'; }).map(function (e) { return zeile(e.text, e.erledigt); });
  (Array.isArray(w && w.ziele) ? w.ziele : []).forEach(function (z) {
    var t = kpSchluessel(z && z.text);
    if (t) { s.push(zeile(t, !!z.erreicht)); }
  });
  return '## ' + KP_ABSCHNITTE.s + '\n' + (s.length ? s.join('\n') + '\n' : '')
       + '\n## ' + KP_ABSCHNITTE.v + '\n' + (v.length ? v.join('\n') + '\n' : '');
}

function kpWochenUmstellen() {
  var n = 0;
  (DB.wochen || []).forEach(function (w) {
    if (typeof w.text === 'string') { return; }
    w.text = kpWocheTextAus(w);
    if (!Array.isArray(w.eintraege)) { w.eintraege = []; }
    delete w.ziele;
    delete w.verbindlich;
    w.geaendert = jetzt();
    n++;
  });
  if (n) { spaeterSichern(); }
  return n;
}

function kpAbschnittZeile(zeilen, ab) {
  var muster = (ab === 's') ? /substanz/i : /verbindlich/i;
  var i;
  for (i = 0; i < zeilen.length; i++) {
    var m = zeilen[i].match(/^\s*#{1,3}\s+(.*)$/);
    if (m && muster.test(m[1])) { return i; }
  }
  return -1;
}

function kpInAbschnitt(w, ab, zeile) {
  var zeilen = String(w.text || '').split('\n');
  if (ab !== 's' && ab !== 'v') {
    while (zeilen.length && !zeilen[zeilen.length - 1].trim()) { zeilen.pop(); }
    zeilen.push(zeile);
  } else {
    var h = kpAbschnittZeile(zeilen, ab);
    if (h < 0) {
      while (zeilen.length && !zeilen[zeilen.length - 1].trim()) { zeilen.pop(); }
      zeilen.push('', '## ' + KP_ABSCHNITTE[ab], zeile);
    } else {
      var ende = h + 1;
      while (ende < zeilen.length && !/^\s*#{1,3}\s/.test(zeilen[ende])) { ende++; }
      var stelle = ende;
      while (stelle - 1 > h && !zeilen[stelle - 1].trim()) { stelle--; }
      zeilen.splice(stelle, 0, zeile);
    }
  }
  w.text = zeilen.join('\n');
  w.geaendert = jetzt();
}

function kpTagKennung(datum) { return 'tag-' + datum; }

function kpTagFinden(datum) {
  var l = DB.tage || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i].datum === datum) { return l[i]; } }
  return null;
}

function kpTagAnlegen(datum) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(datum || ''))) { return null; }
  var t = kpTagFinden(datum);
  if (t) { if (!Array.isArray(t.eintraege)) { t.eintraege = []; } return t; }
  if (!Array.isArray(DB.tage)) { DB.tage = []; }
  t = { id: kpTagKennung(datum), datum: datum, text: '', eintraege: [], geaendert: jetzt() };
  DB.tage.push(t);
  grabsteinWeg('tage', t.id);
  return t;
}

function kpBehaelterAb() {
  var heute = isoDatum();
  var montag = kpHeuteMontag();
  return (DB.wochen || []).filter(function (w) { return w && w.montag && w.montag >= montag; })
    .concat((DB.tage || []).filter(function (t) { return t && t.datum && t.datum >= heute; }));
}

function kpBehaelterFinden(id) {
  var l = (DB.wochen || []).concat(DB.tage || []);
  var i;
  for (i = 0; i < l.length; i++) { if (l[i] && l[i].id === id) { return l[i]; } }
  return null;
}

function kpEintraegeFinden(seiteId, text) {
  var seite = kpSeiteFinden(seiteId);
  var aus = [];
  kpBehaelterAb().forEach(function (b) {
    var beste = null;
    var besteWert = 0;
    (b.eintraege || []).forEach(function (e) {
      if (e.quelle !== seiteId) { return; }
      var p = kpPasst(text, e.text);
      if (p === 1 && kpHatWoertlich(seite, e.text)) { p = 0; }
      if (p > besteWert && kpZeileSuchen(b, e.text)) { beste = e; besteWert = p; }
    });
    if (beste) { aus.push({ woche: b, eintrag: beste }); }
  });
  return aus;
}

function kpEintragFinden(seiteId, text) {
  return kpEintraegeFinden(seiteId, text)[0] || null;
}

function kpEintragHolen(behaelterId, id) {
  var b = kpBehaelterFinden(behaelterId);
  if (!b) { return null; }
  var l = b.eintraege || [];
  var i;
  for (i = 0; i < l.length; i++) { if (l[i].id === id) { return { woche: b, eintrag: l[i] }; } }
  return null;
}

function kpWocheEintrag(w, text) {
  var l = (w && w.eintraege) || [];
  var beste = null;
  var besteWert = 0;
  var i;
  for (i = 0; i < l.length; i++) {
    if (!l[i].quelle || !kpSeiteFinden(l[i].quelle)) { continue; }
    var p = kpPasst(text, l[i].text);
    if (p === 1 && kpHatWoertlich(w, l[i].text)) { p = 0; }
    var wert = p ? p * 1000 + String(l[i].text).length : 0;
    if (wert > besteWert) { beste = l[i]; besteWert = wert; }
  }
  return beste;
}

function kpPlanenKern(seite, nr, abschnitt, datum) {
  if (!seite || ['s', 'v', 'h'].indexOf(abschnitt) < 0) { return null; }
  var zeilen = String(seite.text || '').split('\n');
  var a = (nr >= 0 && nr < zeilen.length) ? kpAufgabe(zeilen[nr]) : null;
  if (!a || !a.text || a.erledigt) { return null; }
  var b = (abschnitt === 'h') ? kpTagAnlegen(datum) : kpWocheAnlegen(montagVon(datum));
  if (!b) { return null; }
  var schon = kpEintraegeFinden(seite.id, a.text).some(function (f) { return f.woche === b; });
  if (schon) { return null; }
  if (!Array.isArray(b.eintraege)) { b.eintraege = []; }
  b.eintraege = b.eintraege.filter(function (e) { return !(e.quelle === seite.id && e.text === a.text); });
  kpInAbschnitt(b, abschnitt, '[] ' + a.text);
  b.eintraege.push({ id: neueKennung(), abschnitt: abschnitt, text: a.text, quelle: seite.id, erledigt: false });
  b.geaendert = jetzt();
  return b;
}

function kpAusplanenKern(behaelterId, id) {
  var f = kpEintragHolen(behaelterId, id);
  if (!f) { return false; }
  var b = f.woche;
  var z = kpZeileSuchen(b, f.eintrag.text);
  if (z) {
    var zeilen = String(b.text || '').split('\n');
    zeilen.splice(z.nr, 1);
    b.text = zeilen.join('\n');
  }
  b.eintraege = b.eintraege.filter(function (e) { return e.id !== id; });
  b.geaendert = jetzt();
  return true;
}

function kpBehaelterAngleichen(seiteId, text, erledigt, ausser) {
  kpEintraegeFinden(seiteId, text).forEach(function (f) {
    if (f.woche === ausser) { return; }
    var z = kpZeileSuchen(f.woche, f.eintrag.text, !erledigt);
    if (z && z.erledigt !== erledigt) { kpKastenSetzen(f.woche, z.nr, erledigt); }
    f.eintrag.erledigt = erledigt;
    f.woche.geaendert = jetzt();
  });
}

function kpBehaelterZeileUmKern(b, nr) {
  if (!b) { return false; }
  var zeilen = String(b.text || '').split('\n');
  var a = (nr >= 0 && nr < zeilen.length) ? kpAufgabe(zeilen[nr]) : null;
  if (!a) { return false; }
  var neu = !a.erledigt;
  kpKastenSetzen(b, nr, neu);
  var e = a.text ? kpWocheEintrag(b, a.text) : null;
  if (e) {
    var quelle = kpSeiteFinden(e.quelle);
    var z = kpZeileSuchen(quelle, e.text, a.erledigt);
    if (z && z.erledigt !== neu) { kpKastenSetzen(quelle, z.nr, neu); }
    e.erledigt = neu;
    kpBehaelterAngleichen(quelle.id, e.text, neu, b);
  }
  return true;
}

function kpSeiteKastenUmKern(s, nr) {
  if (!s) { return false; }
  var zeilen = String(s.text || '').split('\n');
  var a = (nr >= 0 && nr < zeilen.length) ? kpAufgabe(zeilen[nr]) : null;
  if (!a) { return false; }
  kpKastenSetzen(s, nr, !a.erledigt);
  if (a.text) { kpBehaelterAngleichen(s.id, a.text, !a.erledigt, null); }
  return true;
}

function kpAuszeichnen(text) {
  var t = esc(text);
  KP_VERWEIS.lastIndex = 0;
  t = t.replace(KP_VERWEIS, function (ganz, art, id, titel) { return kpVerweisHtml(art, id, titel); });
  t = t.replace(/\[([^\]]{1,200})\] ?\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  t = t.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  t = t.replace(/(^|[\s(>])\*\*([^*\n\s](?:[^*\n]{0,198}[^*\n\s])?)\*\*(?=$|[\s.,;:!?)<])/g, '$1<b>$2</b>');
  t = t.replace(/(^|[\s(>])__([^_\n\s](?:[^_\n]{0,198}[^_\n\s])?)__(?=$|[\s.,;:!?)<])/g, '$1<u>$2</u>');
  t = t.replace(/(^|[\s(>])~~([^~\n\s](?:[^~\n]{0,198}[^~\n\s])?)~~(?=$|[\s.,;:!?)<])/g, '$1<s>$2</s>');
  var paar = function (zeichen, auf, zu) {
    var z = zeichen.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(^|[\\s(>])' + z + '([^' + z + '\\s\\n](?:[^' + z + '\\n]{0,118}[^' + z + '\\s\\n])?)' + z
                      + '(?=$|[\\s.,;:!?)<])', 'g');
    t = t.replace(re, '$1' + auf + '$2' + zu);
  };
  paar('*', '<b>', '</b>');
  paar('_', '<i>', '</i>');
  paar('~', '<s>', '</s>');
  paar('+', '<u>', '</u>');
  paar('^', '<span class="fl-kap">', '</span>');
  return t;
}

function kpTabelleHtml(zeilen, von) {
  var bis = von;
  while (bis < zeilen.length && istTabellenzeile(zeilen[bis])) { bis++; }
  var reihen = zeilen.slice(von, bis);
  if (!reihen.length) { return { html: '', zahl: 0 }; }
  var kopf = null;
  var richtung = [];
  var ab = 0;
  if (reihen.length >= 2 && istTrennzeile(reihen[1])) {
    kopf = tabellenZellen(reihen[0]);
    richtung = tabellenRichtung(reihen[1]);
    ab = 2;
  }
  var breite = kopf ? kopf.length : 0;
  var i, j;
  for (i = ab; i < reihen.length; i++) { breite = Math.max(breite, tabellenZellen(reihen[i]).length); }
  var stil = function (nr) {
    var r = richtung[nr] || 'left';
    return (r === 'left') ? '' : (' style="text-align:' + r + '"');
  };
  var zelle = function (text, zeileNr, spalte) {
    var m = String(text).match(/^\[([ xX]?)\]\s*(.*)$/);
    if (!m) { return kpAuszeichnen(text); }
    var an = (m[1] === 'x' || m[1] === 'X');
    return '<button class="tkasten' + (an ? ' an' : '') + '" type="button" onclick="kpZelleUm(' + zeileNr + ',' + spalte + ')" '
         + 'aria-label="Abhaken"></button><span class="fl-text' + (an ? ' fertig' : '') + '">' + kpAuszeichnen(m[2]) + '</span>';
  };
  var h = '<div class="fl-tab-rahmen"><table class="fl-tab">';
  if (kopf) {
    h += '<thead><tr>';
    for (j = 0; j < breite; j++) { h += '<th' + stil(j) + '>' + kpAuszeichnen(kopf[j] || '') + '</th>'; }
    h += '</tr></thead>';
  }
  h += '<tbody>';
  for (i = ab; i < reihen.length; i++) {
    var zellen = tabellenZellen(reihen[i]);
    h += '<tr>';
    for (j = 0; j < breite; j++) { h += '<td' + stil(j) + '>' + zelle(zellen[j] || '', von + i, j) + '</td>'; }
    h += '</tr>';
  }
  return { html: h + '</tbody></table></div>', zahl: bis - von };
}

function kpZelleSetzen(text, zeileNr, spalte) {
  var zeilen = String(text || '').split('\n');
  if (zeileNr < 0 || zeileNr >= zeilen.length) { return null; }
  var roh = zeilen[zeileNr];
  var vorn = roh.replace(/^(\s*)\|[\s\S]*$/, '$1');
  var zellen = tabellenZellen(roh);
  if (spalte < 0 || spalte >= zellen.length) { return null; }
  var m = String(zellen[spalte]).match(/^\[([ xX]?)\]\s*(.*)$/);
  if (!m) { return null; }
  var an = (m[1] === 'x' || m[1] === 'X');
  zellen[spalte] = (an ? '[] ' : '[x] ') + m[2];
  zeilen[zeileNr] = vorn + '| ' + zellen.join(' | ') + ' |';
  return zeilen.join('\n');
}

function kpBehaelterZeileHtml(b, rest, nr, stil) {

}

function kpZeileHtml(seite, zeile, nr, nummer, behaelter, hervor) {
  var roh = String(zeile);
  var tiefe = 0;
  var rest = roh;
  while (rest.indexOf('  ') === 0) { tiefe++; rest = rest.slice(2); }
  if (tiefe > 6) { tiefe = 6; }
  rest = rest.replace(/^\t+/, '');
  var stil = tiefe ? (' style="padding-left:' + (tiefe * 18) + 'px"') : '';
  if (/^!skizze:/.test(rest)) { return '<div class="fl-absatz leise"' + stil + '>Skizze — nur auf der Fläche der Workbench zu sehen</div>'; }
  if (/^---+\s*$/.test(rest)) { return '<div class="fl-trenner"' + stil + '></div>'; }
  if (rest.length === 0) { return '<div class="fl-leer"></div>'; }
  if (behaelter) {
    var wz = kpBehaelterZeileHtml(seite, rest, nr, stil);
    if (wz) { return wz; }
  }
  var ueber = rest.match(/^(#{1,3})\s*(.*)$/);
  if (ueber) { return '<div class="fl-h' + ueber[1].length + '"' + stil + '>' + kpAuszeichnen(ueber[2]) + '</div>'; }
  var a = kpAufgabe(rest);
  if (a) {
    var kasten = rest.match(KP_KASTEN);
    var z = hervor ? kpZeileSuchen(seite, hervor) : null;
    var istHervor = !!(z && z.nr === nr);
    return '<div class="fl-zeile aufgabe' + (istHervor ? ' hervor' : '') + '"' + (istHervor ? ' id="kpHervor"' : '') + stil + '>'
         + '<button class="tkasten' + (a.erledigt ? ' an' : '') + '" type="button" onclick="kpKastenUm(' + nr + ')" aria-label="Abhaken"></button>'
         + '<span class="fl-text' + (a.erledigt ? ' fertig' : '') + '">' + kpAuszeichnen(kasten[3]) + '</span></div>';
  }
  var nummeriert = rest.match(NUMMER_MUSTER);
  if (nummeriert) {
    return '<div class="fl-zeile"' + stil + '><span class="fl-nr">' + (nummer || Number(nummeriert[1])) + '.</span>'
         + '<span class="fl-text">' + kpAuszeichnen(nummeriert[2]) + '</span></div>';
  }
  var punkt = rest.match(/^[-•*]\s+(.*)$/);
  if (punkt) {
    return '<div class="fl-zeile"' + stil + '><span class="fl-punkt"></span><span class="fl-text">' + kpAuszeichnen(punkt[1]) + '</span></div>';
  }
  return '<div class="fl-absatz"' + stil + '>' + kpAuszeichnen(rest) + '</div>';
}

function kpAnsichtHtml(seite, behaelter, hervor) {
  var zeilen = String((seite && seite.text) || '').split('\n');
  var nummern = listenNummern(zeilen);
  var h = '';
  var i;
  for (i = 0; i < zeilen.length; i++) {
    if (istTabellenzeile(zeilen[i])) {
      var tab = kpTabelleHtml(zeilen, i);
      if (tab.zahl) { h += tab.html; i += tab.zahl - 1; continue; }
    }
    h += kpZeileHtml(seite, zeilen[i], i, nummern[i], !!behaelter, hervor || '');
  }
  return h;
}

function kpFeldHolen() {
  var f = (typeof document.querySelector === 'function') ? document.querySelector('.schirm.aktiv #kpFeld') : null;
  return f || document.getElementById('kpFeld');
}

function kpListeWeiter(feld) {
  if (!feld) { return false; }
  var text = String(feld.value || '');
  var a = (typeof feld.selectionStart === 'number') ? feld.selectionStart : text.length;
  var b = (typeof feld.selectionEnd === 'number') ? feld.selectionEnd : a;
  if (a !== b) { return false; }
  var anfang = text.lastIndexOf('\n', a - 1) + 1;
  var ende = text.indexOf('\n', a);
  if (ende < 0) { ende = text.length; }
  var zeile = text.slice(anfang, ende);
  var kasten = zeile.match(/^(\s*)(\[[ xX]?\])(\s*)(.*)$/);
  var punkt = kasten ? null : zeile.match(/^(\s*)([-•*])(\s+)(.*)$/);
  var nummer = (kasten || punkt) ? null : zeile.match(/^(\s*)(\d{1,3}[.)])(\s+)(.*)$/);
  var m = kasten || punkt || nummer;
  if (!m) { return false; }
  var vorne = m[1].length + m[2].length + m[3].length;
  if (a - anfang < m[1].length + m[2].length) { return false; }
  if (!m[4].trim().length && a >= anfang + vorne) {
    feldErsetzen(feld, anfang, ende, '');
    if (typeof feld.setSelectionRange === 'function') { feld.setSelectionRange(anfang, anfang); }
    return true;
  }
  var zeichen = kasten ? '[] ' : (nummer ? ((parseInt(m[2], 10) + 1) + m[2].slice(-1) + ' ') : (m[2] + ' '));
  var neu = '\n' + m[1] + zeichen;
  feldErsetzen(feld, a, a, neu);
  if (typeof feld.setSelectionRange === 'function') { feld.setSelectionRange(a + neu.length, a + neu.length); }
  return true;
}

function kpTaste(e) {
  if (!e || e.key !== 'Enter' || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey || e.isComposing) { return; }
  if (kpListeWeiter(e.target)) {
    e.preventDefault();
    kpTextSetzen(e.target.value);
  }
}

function kpVorEingabe(e) {
  if (!e || (e.inputType !== 'insertLineBreak' && e.inputType !== 'insertParagraph')) { return; }
  if (kpListeWeiter(e.target)) {
    e.preventDefault();
    kpTextSetzen(e.target.value);
  }
}

function kpUmschliessen(zeichen) {
  var feld = kpFeldHolen();
  if (!feld) { return; }
  var text = String(feld.value || '');
  var a = (typeof feld.selectionStart === 'number') ? feld.selectionStart : text.length;
  var b = (typeof feld.selectionEnd === 'number') ? feld.selectionEnd : a;
  var w = wortUmDieMarke(text, a, b);
  var mitte = text.slice(w.a, w.b);
  feldErsetzen(feld, w.a, w.b, zeichen + mitte + zeichen);
  kpTextSetzen(feld.value);
  if (typeof feld.setSelectionRange === 'function') {
    if (mitte.length) { feld.setSelectionRange(w.a, w.b + 2 * zeichen.length); }
    else { feld.setSelectionRange(w.a + zeichen.length, w.a + zeichen.length); }
  }
}

function kpEinfuegen(zeichen) {
  var feld = kpFeldHolen();
  if (!feld) { return; }
  var text = String(feld.value || '');
  var a = (typeof feld.selectionStart === 'number') ? feld.selectionStart : text.length;
  var b = (typeof feld.selectionEnd === 'number') ? feld.selectionEnd : a;
  feldErsetzen(feld, a, b, zeichen);
  kpTextSetzen(feld.value);
}

function kpLink() {
  var feld = kpFeldHolen();
  if (!feld) { return; }
  var text = String(feld.value || '');
  var a0 = (typeof feld.selectionStart === 'number') ? feld.selectionStart : text.length;
  var b0 = (typeof feld.selectionEnd === 'number') ? feld.selectionEnd : a0;
  var w = wortUmDieMarke(text, a0, b0);
  var mitte = text.slice(w.a, w.b) || 'Text';
  var neu = '[' + mitte + '](https://)';
  feldErsetzen(feld, w.a, w.b, neu);
  kpTextSetzen(feld.value);
  var stelle = w.a + neu.length - 1;
  if (typeof feld.setSelectionRange === 'function') { feld.setSelectionRange(stelle, stelle); }
}

function kpZeichen(was) {
  var feld = kpFeldHolen();
  if (!feld) { return; }
  var text = String(feld.value || '');
  var stelle = (typeof feld.selectionStart === 'number') ? feld.selectionStart : text.length;
  var anfang = text.lastIndexOf('\n', stelle - 1) + 1;
  var ende = text.indexOf('\n', stelle);
  if (ende < 0) { ende = text.length; }
  var zeile = text.slice(anfang, ende);
  var einzug = (zeile.match(/^\s*/) || [''])[0];
  var ohne = zeile.slice(einzug.length).replace(/^(#{1,3}\s*|\[[ xX]?\]\s*|[-•*]\s+|\d{1,3}[.)]\s+)/, '');
  var neu;
  if (was === 'einzug')        { neu = '  ' + zeile; }
  else if (was === 'ausrueck') { neu = zeile.replace(/^ {1,2}/, ''); }
  else if (was === 'trenner')  { neu = '---'; }
  else if (was === 'datum')    { neu = einzug + langDatum(isoDatum()) + ' — ' + ohne; }
  else if (was === 'h1')       { neu = einzug + '# ' + ohne; }
  else if (was === 'h2')       { neu = einzug + '## ' + ohne; }
  else if (was === 'h3')       { neu = einzug + '### ' + ohne; }
  else if (was === 'kasten')   { neu = einzug + '[] ' + ohne; }
  else if (was === 'punkt')    { neu = einzug + '- ' + ohne; }
  else { return; }
  feldErsetzen(feld, anfang, ende, neu);
  kpTextSetzen(feld.value);
  if (typeof feld.setSelectionRange === 'function') { feld.setSelectionRange(anfang + neu.length, anfang + neu.length); }
}

function kpNummerieren() {
  var feld = kpFeldHolen();
  if (!feld) { return; }
  var text = String(feld.value || '');
  var von = (typeof feld.selectionStart === 'number') ? feld.selectionStart : text.length;
  var bis = (typeof feld.selectionEnd === 'number') ? feld.selectionEnd : von;
  var anfang = text.lastIndexOf('\n', von - 1) + 1;
  var ende = text.indexOf('\n', bis);
  if (ende < 0) { ende = text.length; }
  var n = 0;
  var block = text.slice(anfang, ende).split('\n').map(function (zeile) {
    if (!zeile.trim().length) { return zeile; }
    var einzug = (zeile.match(/^\s*/) || [''])[0];
    n++;
    return einzug + n + '. ' + zeile.slice(einzug.length).replace(/^(#{1,3}\s*|\[[ xX]?\]\s*|[-•*]\s+|\d{1,3}[.)]\s+)/, '');
  }).join('\n');
  feldErsetzen(feld, anfang, ende, block);
  kpTextSetzen(feld.value);
  if (typeof feld.setSelectionRange === 'function') { feld.setSelectionRange(anfang + block.length, anfang + block.length); }
}

function kpTabelle() {
  var feld = kpFeldHolen();
  if (!feld) { return; }
  var text = String(feld.value || '');
  var a = (typeof feld.selectionStart === 'number') ? feld.selectionStart : text.length;
  var davor = (a === 0 || text.charAt(a - 1) === '\n') ? '' : '\n';
  feldErsetzen(feld, a, a, davor + '| Was | Wer | Wann |\n|---|---|---|\n|  |  |  |\n');
  kpTextSetzen(feld.value);
}
