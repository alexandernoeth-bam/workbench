<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- Zum Home-Bildschirm hinzufügen: startet ohne Adress- und Tableiste.
     Ohne diese Angaben bleibt iOS im normalen Browserfenster.        -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>TimeAssist 1.4.0 · Gruppen</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   TIMEASSIST · Mockup M1 · 0.1.0
   Ringbuch im Hochformat, Zielgerät iPad Air 10,9" (820 × 1180 pt).
   Sieben Register rechts, Unterregister als Karteireiter über dem Blatt.
   Datenmodell nach Time/system-Formblättern: minimal, kein Auto-Status.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  --papier:   #faf8f4;
  --papier-2: #f2efe8;
  --karte:    #ffffff;
  --tinte:    #23211e;
  --tinte-2:  #57524a;
  --tinte-3:  #8c857a;
  --leder:    #6b6459;
  --linie:    #ddd8ce;
  --linie-2:  #ebe6dc;
  --marke:    #7d6b53;
  --marke-h:  #efe9df;
  --rot:      #8c3b2f;
  /* Weinrot des gedruckten Satzes, RGB 144/12/36 — Formulartitel,
     Kopflinie, Spaltenueberschriften, Formularnummer im Fuss.       */
  --wein:     #900c24;
  --wein-h:   #f6e9ec;
  --gruen:    #4e6b52;
  --r-kl: 7px;
  --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: var(--sans); background: #cdc6b8; color: var(--tinte);
       font-size: 16.8px; overflow: hidden; overscroll-behavior: none;
       -webkit-text-size-adjust: 100%; }
/* Im Vollbild (zum Home-Bildschirm hinzugefuegt) sitzt das Blatt buendig */
@media (display-mode: standalone) {
  .buehne { padding: env(safe-area-inset-top) env(safe-area-inset-right)
                    env(safe-area-inset-bottom) env(safe-area-inset-left); }
}
button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
input, textarea { font: inherit; color: inherit; }

/* ── Geräterahmen: 820 × 1180 pt, auf kleineren Fenstern skaliert ──── */
.buehne { position: fixed; inset: 0; display: flex; align-items: center;
          justify-content: center; }
.geraet { width: 820px; height: 1180px; flex-shrink: 0; transform-origin: center center;
          background: var(--papier-2); display: flex; flex-direction: column;
          overflow: hidden; box-shadow: 0 8px 40px rgba(35,33,30,.3); }

/* ── Kopf ─────────────────────────────────────────────────────────── */
/* Keine App-Leiste mehr: Auf Papier gibt es keine. Die Bedienung sitzt
   im Blattkopf, wo rechts ohnehin Platz frei war. Gewinn: rund 55 px. */
.bk-werkzeug { display: flex; gap: 7px; align-items: center; flex-shrink: 0; }
.k-btn { min-height: 34px; border: 1px solid var(--linie); border-radius: var(--r-kl);
         padding: 0 11px; font-size: 14.4px; color: var(--tinte-2); background: var(--karte);
         display: flex; align-items: center; gap: 6px; }
.k-btn:active { background: var(--papier-2); }
.k-btn.pri { background: var(--wein); border-color: var(--wein); color: var(--papier);
             font-weight: 600; }

/* ── Ringbuch ─────────────────────────────────────────────────────── */
.buch { flex: 1; min-height: 0; display: flex; padding: 10px 0 10px 12px; }
.blatt-flaeche { flex: 1; min-width: 0; background: var(--papier);
  border: 1px solid #c4bdae; border-right: none; border-radius: 3px 0 0 3px;
  box-shadow: 0 2px 10px rgba(35,33,30,.13);
  display: flex; flex-direction: column; overflow: hidden; position: relative; }
.lochung { position: absolute; left: 0; top: 0; bottom: 0; width: 20px;
           background: var(--papier-2); border-right: 1px solid var(--linie-2);
           display: flex; flex-direction: column; justify-content: space-around;
           align-items: center; padding: 30px 0; z-index: 2; }
.loch { width: 8px; height: 8px; border-radius: 50%; background: #d8d2c6;
        box-shadow: inset 0 1px 2px rgba(0,0,0,.18); }

/* Karteireiter für Unterregister */
.unterreiter { flex-shrink: 0; display: flex; gap: 2px; padding: 7px 16px 0 32px;
               background: var(--papier-2); border-bottom: 1px solid #c4bdae; }
.unterreiter.aus { display: none; }
.ur { min-height: 30px; border: 1px solid #c4bdae; border-bottom: none;
      border-radius: var(--r-kl) var(--r-kl) 0 0; background: #e8e3d9;
      padding: 0 12px; font-size: 13.2px; color: var(--tinte-2);
      display: flex; align-items: center; gap: 6px; margin-bottom: -1px; }
.ur.aktiv { background: var(--papier); color: var(--tinte); font-weight: 700; }
.ur-punkt { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.ur-zahl { font-size: 11.4px; color: var(--tinte-3); }

.blatt-kopf { flex-shrink: 0; padding: 12px 18px 7px 32px;
              border-bottom: 2.5px double var(--wein); background: var(--papier);
              display: flex; align-items: flex-end; gap: 12px; }
.bk-namen { flex: 1; min-width: 0; margin-right: auto; }
.bk-titel { font-size: 17px; font-weight: 700; line-height: 1.1;
            font-family: var(--serif); color: var(--wein); }
.bk-sub { font-size: 11px; color: var(--tinte-3); margin-top: 2px; }
.bk-akt { display: flex; gap: 6px; flex-shrink: 0; }
.blatt-koerper { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
                 padding: 0 18px 18px 32px; }
.blatt-fuss { flex-shrink: 0; display: flex; gap: 12px; align-items: baseline;
              padding: 5px 18px 7px 32px; border-top: 1px solid var(--linie);
              font-size: 10.2px; letter-spacing: .12em; color: #a9a294;
              text-transform: uppercase; background: var(--papier); }
#bf-mitte { flex: 1; text-align: center; }
#bf-nr { color: var(--wein); font-weight: 700; }

/* ── Register rechts ──────────────────────────────────────────────── */
/* Register hochkant: Schrift um 90° gedreht, Unterseite links.
   Spart gegenüber der liegenden Beschriftung rund 84 px Blattbreite.  */
/* Passen nicht alle Reiter in die Spalte, wird der naechste schlicht
   nicht mehr gezeigt — er bleibt ueber die Uebersicht erreichbar.
   Ohne overflow:hidden wuerden die Reiter stattdessen gestaucht.     */
.reiter { width: 38px; flex-shrink: 0; display: flex; flex-direction: column;
          gap: 5px; padding: 6px 0; overflow: hidden; }
.rt { flex: 0 0 auto; border: 1px solid #c4bdae; border-left: none;
      border-radius: 0 var(--r-kl) var(--r-kl) 0; background: var(--papier-2);
      color: var(--tinte-2); font-size: 13px; letter-spacing: .08em;
      text-transform: uppercase; padding: 14px 0;
      display: flex; align-items: center; justify-content: center;
      writing-mode: vertical-rl;
      box-shadow: 2px 1px 5px rgba(35,33,30,.1); white-space: nowrap; }
.rt.aktiv { background: var(--papier); color: var(--wein); font-weight: 700;
            box-shadow: 3px 2px 8px rgba(35,33,30,.14); }

/* ── Bausteine ────────────────────────────────────────────────────── */
.abschnitt { margin-top: 14px; }
.ab-kopf { display: flex; align-items: baseline; gap: 8px; padding: 0 0 4px;
           border-bottom: 1px solid var(--linie); margin-bottom: 6px; }
.ab-titel { font-size: 11.4px; letter-spacing: .13em; text-transform: uppercase;
            font-weight: 700; color: var(--wein); }
.ab-sub { font-size: 12.6px; color: var(--tinte-3); margin-left: auto; }
.hinweis { font-size: 12.6px; color: var(--tinte-3); margin-top: 12px; line-height: 1.55; }

/* Tagesblatt: zwei Spalten wie das gedruckte Formblatt */
.doppel { display: grid; grid-template-columns: 1fr 1.15fr; height: 100%; }
.doppel > div:first-child { padding-right: 14px; border-right: 1px dashed var(--linie); }
.doppel > div:last-child { padding-left: 14px; display: flex; flex-direction: column; }

/* Chronik mit Belegt-Markierung */
.cz { display: flex; gap: 5px; border-top: 1px solid var(--linie-2); height: 24px; }
.cz.voll { border-top-color: var(--linie); }
.cz-zeit { width: 30px; flex-shrink: 0; font-size: 11.4px; color: var(--tinte-3);
           font-variant-numeric: tabular-nums; padding-top: 2px; }
/* Markierungsspalte: ein Strich je belegendem Termin. Zwei Striche =
   Überschneidung. Der Konflikt wird gezeigt, nicht vorher aufgelöst. */
.cz-mark { width: 11px; flex-shrink: 0; border-left: 1px solid var(--linie-2);
           border-right: 1px solid var(--linie-2); display: flex; gap: 1px;
           padding: 0 1px; align-items: stretch; }
.cz-strich { flex: 1; background: var(--leder); }
.cz-inhalt { flex: 1; min-width: 0; position: relative; }
.termin { position: absolute; left: 0; right: 0; background: var(--karte);
          border: 1px solid var(--linie); border-left: 3px solid var(--leder);
          padding: 1px 6px; border-radius: 0 4px 4px 0; overflow: hidden; z-index: 1; }
.termin.kollision { right: 50%; }
.termin.kollision2 { left: 50%; right: 0; z-index: 2; }
.t-titel { font-size: 13.8px; line-height: 1.2; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
.t-meta { font-size: 10.8px; color: var(--tinte-3); overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
/* Ganztags-Band: quer über der Chronik, wie von Hand oben hingeschrieben */
.gt-band { margin-bottom: 3px; }
.ganztags { background: var(--marke-h); border-left: 3px solid var(--marke);
            padding: 2px 7px; margin-bottom: 2px; border-radius: 0 3px 3px 0;
            font-size: 13.8px; display: flex; align-items: center; gap: 6px; }
.gt-quelle { margin-left: auto; font-size: 10.2px; letter-spacing: .08em;
             text-transform: uppercase; color: var(--marke); }

/* Sphäre als Kürzel B / P — lesbar auf einen Blick, wie ein Stempel */
/* ── Aktivitätentabelle: echte Tabelle mit festen Spaltenbreiten ──── */
.atab { width: 100%; border-collapse: collapse; table-layout: fixed; }
.atab th { font-size: 9.6px; letter-spacing: .12em; text-transform: uppercase;
           color: var(--wein); font-weight: 400; text-align: left;
           padding: 0 4px 4px; border-bottom: 1.2px solid var(--wein); }
.atab th.r { text-align: right; }
.atab td { border-bottom: 1px solid var(--linie); padding: 4px; vertical-align: top;
           font-size: 16.2px; line-height: 1.25; }
.atab td.r { text-align: right; font-variant-numeric: tabular-nums;
             font-size: 13.8px; color: var(--leder); }
.atab td.dat { text-align: right; font-variant-numeric: tabular-nums;
               font-size: 13.8px; color: var(--tinte-3); }
.atab td.wer { font-size: 13.8px; color: var(--marke); overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
.atab td.mitte { text-align: center; padding: 4px 2px; }
/* Angedeutete Spaltenlinien — das Blatt bleibt ein Formular */
.atab th, .atab td { border-right: 1px solid var(--linie-2); }
.atab th:last-child, .atab td:last-child { border-right: none; }
/* Jede Zelle ist Klickfläche: bearbeiten oder weiterschalten */
.atab td.z:active { background: var(--marke-h); }
.atab td.z { cursor: pointer; }
.atab td.offen { background: var(--karte); box-shadow: inset 0 0 0 1.4px var(--marke); }
.atab .zf { width: 100%; border: none; background: transparent; outline: none;
            font: inherit; color: var(--tinte); padding: 0; }
.atab .zf.r { text-align: right; }
.atab .zs { width: 100%; border: none; background: transparent; outline: none;
            font-size: 13.8px; color: var(--tinte); }
/* Priorität: nur der Buchstabe, keine Auszeichnung */
.a-prio { font-family: var(--serif); font-size: 15.6px; font-weight: 700;
          color: var(--tinte-2); }
.atab tr.leer td { height: 24px; }
.atab tr.neu td { border-bottom: 1.4px dashed var(--marke); }
.atab tr.neu:active td { background: var(--marke-h); }
.atab tr.bearbeitet td { background: var(--karte); border-bottom-color: var(--marke); }
.atab tr.klick:active td { background: var(--papier-2); }
/* Die Zustandsklassen sitzen seit dem Tabellenumbau auf der Zelle
   selbst, nicht mehr auf einem inneren span.                          */
.atab td.durch { text-decoration: line-through; color: var(--tinte-3); }
.atab td.blass { color: var(--tinte-3); }
.a-titel.durch { text-decoration: line-through; color: var(--tinte-3); }
.a-titel.blass { color: var(--tinte-3); }
.a-neu { color: var(--marke); font-size: 13.8px; }
.a-bereich { display: block; font-size: 11.4px; color: var(--tinte-3);
             letter-spacing: .02em; margin-top: 1px; }

/* Erledigt-Kästchen: leer → ✕ erledigt → › verschoben → – gestrichen.
   Feste Breite, weil die Flex-Angabe in einer Tabellenzelle nicht greift
   und das leere Kästchen sonst auf zwei Rahmenstriche zusammenfällt.   */
.hak { width: 19px; height: 19px; flex: 0 0 19px; border: 1px solid var(--tinte-3);
       border-radius: 2px; background: var(--karte); display: inline-flex;
       align-items: center; justify-content: center; font-size: 15.6px;
       line-height: 1; color: var(--tinte); padding: 0; }
.hak:active { background: var(--papier-2); }

/* ── Inline-Erfassung: die Zeile wird zum Feld, kein Dialog ───────── */
.tz.bearbeitet { background: var(--karte); box-shadow: inset 0 0 0 1.4px var(--marke);
                 border-radius: 4px; }
.ef { border: none; border-bottom: 1px solid var(--marke); background: transparent;
      padding: 1px 3px; font-size: 16.2px; outline: none; min-width: 0;
      font-family: var(--sans); color: var(--tinte); }
.ef:focus { background: var(--marke-h); }
.ef.titel { flex: 1; }
.ef.zahl  { width: 100%; text-align: right; font-variant-numeric: tabular-nums; }
.ef.dat   { width: 100%; text-align: right; font-size: 13.8px; }
.ef.wer   { width: 100%; font-size: 13.8px; }
.es { border: 1px solid var(--linie); border-radius: 4px; background: var(--karte);
      font-size: 13.2px; padding: 1px 2px; outline: none; max-width: 100%;
      font-family: var(--sans); color: var(--tinte); }
.es:focus { border-color: var(--marke); }
.ef-hilfe { font-size: 11.4px; color: var(--tinte-3); padding: 3px 2px 0;
            letter-spacing: .02em; }
.neu-hinweis { font-size: 12.6px; color: var(--marke); padding-left: 26px;
               line-height: 22px; }
/* Termin-Erfassung im Raster */
.termin.bearbeitet { box-shadow: 0 0 0 1.4px var(--marke); z-index: 5; height: auto !important;
                     min-height: 44px; right: 0 !important; left: 0 !important; }
.te-zeile { display: flex; gap: 4px; align-items: center; margin-top: 2px; }
/* Rückfragen beginnen fest auf halber Blatthöhe, damit der Block immer
   an derselben Stelle steht — wie ein vorgedruckter Abschnitt.        */
.rf-block { margin-top: 14px; }
.kontakt-z { display: flex; align-items: center; gap: 7px; height: 30px;
             border-bottom: 1px solid var(--linie-2); }
.kontakt-z .hak { flex: 0 0 17px; width: 17px; height: 17px; font-size: 14.4px; }
.kontakt-t.durch { text-decoration: line-through; color: var(--tinte-3); }
.kontakt-t.blass { color: var(--tinte-3); }
.kontakt-z .ef { flex: 1; font-size: 16.2px; }
.kontakt-t { flex: 1; font-size: 16.2px; padding-left: 3px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Wichtigste Aufgabe */
.wichtig { border: 1.4px solid var(--wein); border-radius: 4px; padding: 7px 9px;
           background: var(--karte); margin-bottom: 4px; }
.wichtig-l { font-size: 10.2px; letter-spacing: .13em; text-transform: uppercase;
             color: var(--tinte-3); margin-bottom: 3px; }

/* Formblatt-Zeilen */
.tz-kopf, .tz { display: flex; align-items: flex-start; gap: 7px; padding: 0 2px; }
.tz-kopf { align-items: center; font-size: 9.6px; letter-spacing: .12em;
           text-transform: uppercase; color: #a9a294; padding-bottom: 4px;
           border-bottom: 1.2px solid var(--tinte); }
.tz { min-height: 34px; border-bottom: 1px solid var(--linie); padding: 5px 2px; }
.tz.leer { min-height: 24px; padding: 0; }
.tz-nr { flex: 0 0 17px; text-align: right; font-size: 11.4px; color: #b0a99c;
         line-height: 1.7; font-variant-numeric: tabular-nums; }
.tz-glyph { flex: 0 0 18px; text-align: center; font-size: 20.4px; line-height: 1.1; }
.tz-prio { flex: 0 0 18px; font-family: var(--serif); font-size: 14.4px;
           font-weight: 700; color: var(--tinte-2); text-align: center; }
.tz-titel { flex: 1; min-width: 0; font-size: 16.8px; line-height: 1.25; }
.tz-titel.durch { text-decoration: line-through; color: var(--tinte-3); }
.tz-titel.blass { color: var(--tinte-3); }
/* Die letzte Zeile ist immer leer und wartet auf Eingabe */
.tz.leer.neu { border-bottom: 1.4px dashed var(--marke); }
.tz-wer { flex: 0 0 62px; font-size: 12.6px; color: var(--marke); line-height: 1.7;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tz-min { flex: 0 0 34px; text-align: right; font-size: 12.6px; color: var(--leder);
          font-variant-numeric: tabular-nums; line-height: 1.7; }
.tz-dat { flex: 0 0 44px; text-align: right; font-size: 12.6px; color: var(--tinte-3);
          font-variant-numeric: tabular-nums; line-height: 1.7; }
.tz-dat.spaet { color: var(--rot); font-weight: 600; }
/* Feste Breite, nicht nur flex-basis: in einer Tabellenzelle greift die
   Flex-Angabe nicht und der Punkt faellt auf null Breite zusammen.    */
.tz-punkt { width: 9px; flex: 0 0 9px; height: 9px; border-radius: 2px;
            display: inline-block; vertical-align: middle; }
.atab td.mitte .tz-punkt { margin: 4px 0; }
.atab tr.grp .tz-punkt { margin-right: 7px; }
.tz-heute { flex: 0 0 58px; min-height: 26px; border: 1px solid var(--linie);
            border-radius: 6px; padding: 0 7px; font-size: 12.6px; color: var(--tinte-2);
            background: var(--karte); white-space: nowrap; align-self: center; }
.tz-heute:active { background: var(--tinte); color: var(--papier); }

/* Freie Schreiblinien */
.frei-l { height: 28px; border-bottom: 1px solid var(--linie-2); }

/* Tagesmotto: zwei Linien über die volle Blattbreite, ohne Rahmen —
   sonst konkurrieren zwei Kästen um Aufmerksamkeit.                  */
.motto { margin: 0 0 10px; }
.motto-l { font-size: 10.2px; letter-spacing: .13em; text-transform: uppercase;
           color: var(--tinte-3); margin-bottom: 3px; }
.motto-z { height: 29px; border-bottom: 1px solid var(--linie);
           display: flex; align-items: center; padding-left: 3px; }
.motto-z .zf { font-size: 16.8px; }
.motto-t { font-size: 16.8px; color: var(--tinte); }
.motto-z.offen { background: var(--karte); box-shadow: inset 0 0 0 1.4px var(--marke); }

/* Wiederkehrend heute: eigener Block, nicht unter die geplanten
   Aktivitaeten gemischt. Sie stehen dort, weil der Rhythmus sie
   hinstellt — nicht weil du sie heute frueh dorthin gehoben hast.   */
.wk-z { display: flex; align-items: center; gap: 7px; height: 25px;
        border-bottom: 1px solid var(--linie-2); }
.wk-z .hak { flex: 0 0 17px; width: 17px; height: 17px; font-size: 14.4px; }
.wk-t { flex: 1; min-width: 0; font-size: 15.6px; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
.wk-t.durch { text-decoration: line-through; color: var(--tinte-3); }
.wk-t.blass { color: var(--tinte-3); }
.wk-min { flex: 0 0 34px; text-align: right; font-size: 13.2px; color: var(--leder);
          font-variant-numeric: tabular-nums; }

/* Ein wiederkehrender Vorgang darf auf sein Blatt fuehren */
.wk-t.fuehrt { color: var(--wein); text-decoration: underline;
               text-decoration-style: dotted; }

/* Reflexion: gerahmt, damit sie sich vom Formularteil absetzt */
.refl { border: 1px solid var(--wein); border-radius: 4px; padding: 7px 9px;
        margin-top: 14px; background: var(--karte); }
.refl-l { font-size: 10.2px; letter-spacing: .13em; text-transform: uppercase;
          color: var(--wein); font-weight: 700; margin-bottom: 4px; }
.refl-z { height: 29px; border-bottom: 1px dotted var(--linie);
          display: flex; align-items: center; padding-left: 2px; }
.refl-z:last-child { border-bottom: none; }
.refl-z .zf { font-size: 16.2px; }
.refl-t { font-size: 16.2px; color: var(--tinte); }
.refl-z.offen { background: var(--papier-2); box-shadow: inset 0 0 0 1.4px var(--marke); }

/* Move-Vorschau */
.move-l { font-size: 7.8px; letter-spacing: .1em; text-transform: uppercase;
          color: #a9a294; margin-top: 4px; }
.move-linie { height: 9px; border-bottom: .5px solid #d8d2ce; }
.move-refl { border: .5px solid #8c857a; border-radius: 2px; padding: 3px 4px;
             margin-top: 4px; }

/* Wochenblatt */
.wb-tag { border-bottom: 1px solid var(--linie); padding: 5px 0; display: flex; gap: 10px; }
.wb-tag.heute { background: var(--marke-h); }
.wb-name { flex: 0 0 74px; font-size: 13.2px; font-weight: 700; color: var(--leder);
           text-transform: uppercase; letter-spacing: .06em; padding-top: 3px; }
.wb-sp { flex: 1; min-width: 0; }
.wb-l { height: 27px; border-bottom: 1px dotted var(--linie); font-size: 15.6px;
        padding-left: 3px; color: var(--tinte); }

/* Streifen für Wiederkehrend und Gewohnheiten */
.str { display: flex; gap: 3px; }
.str-t { width: 25px; height: 25px; border: 1px solid var(--linie); border-radius: 4px;
         display: flex; align-items: center; justify-content: center; font-size: 16.8px;
         background: var(--karte); color: var(--tinte-2); }
.str-t.aus { background: var(--papier-2); color: #cbc4b7; }
.str-t.heute { border-color: var(--tinte); border-width: 1.6px; }
.str-kopf { display: flex; gap: 3px; margin-bottom: 3px; }
.str-k { width: 25px; text-align: center; font-size: 9.6px; color: #a9a294;
         letter-spacing: .06em; text-transform: uppercase; }


/* Notizregister */
.nz { display: flex; align-items: center; gap: 10px; padding: 8px 2px;
      border-bottom: 1px solid var(--linie); }
.nz-nr { flex: 0 0 26px; height: 26px; border: 1px solid var(--linie); border-radius: 4px;
         display: flex; align-items: center; justify-content: center; font-size: 13.2px;
         font-family: var(--serif); color: var(--leder); background: var(--karte); }
.nz-t { flex: 1; min-width: 0; font-size: 16.2px; }
.nz-m { font-size: 12px; color: var(--tinte-3); }
.nz-art { font-size: 10.8px; letter-spacing: .1em; text-transform: uppercase;
          color: var(--marke); border: 1px solid var(--marke-h); background: var(--marke-h);
          border-radius: 3px; padding: 1px 5px; }

/* ── Monatsvorausplanung (CMP 11) ─────────────────────────────────
   Zwei Spalten zu je 16 bzw. 15 Tagen, darunter der undatierte Teil
   und die Reflexion. Nur bewusst hierher gehobene Eintraege.        */
.mon-raster { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.mon-t { display: flex; align-items: stretch; gap: 6px; min-height: 30px;
         border-bottom: 1px solid var(--linie-2); }
.mon-t.we { background: var(--papier-2); }
.mon-t.heute { box-shadow: inset 3px 0 0 var(--wein); }
.mon-nr { flex: 0 0 34px; font-size: 13.2px; color: var(--tinte-3); padding-top: 5px;
          font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.mon-t.we .mon-nr { color: var(--leder); }
.mon-inhalt { flex: 1; min-width: 0; display: flex; flex-direction: column;
              justify-content: center; padding: 2px 0; cursor: pointer; }
.mon-e { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
.mon-e .hak { flex: 0 0 15px; width: 15px; height: 15px; font-size: 13.2px; }
.mon-t2 { flex: 1; min-width: 0; font-size: 15px; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
.mon-t2.durch { text-decoration: line-through; color: var(--tinte-3); }
.mon-t2.blass { color: var(--tinte-3); }
.mon-t2 .zf { font-size: 15px; }
.mon-herkunft { font-size: 10.2px; letter-spacing: .1em; text-transform: uppercase;
                color: var(--wein); flex-shrink: 0; }
.mon-offen { background: var(--karte); box-shadow: inset 0 0 0 1.4px var(--marke); }

/* ── Jahrestermine (CMP 21) ───────────────────────────────────────
   Zwoelf Monatsspalten, 31 Tagzeilen. Ein mehrtaegiger Eintrag wird
   zum durchgehenden Balken — so sieht man Abwesenheit als Flaeche.  */
.jt-tab { width: 100%; border-collapse: collapse; table-layout: fixed; }
.jt-tab th { font-size: 10.2px; letter-spacing: .1em; text-transform: uppercase;
             color: var(--wein); font-weight: 400; padding: 0 0 4px;
             border-bottom: 1.2px solid var(--wein); }
.jt-tab td { height: 24px; padding: 0; border-right: 1px solid var(--linie-2);
             border-bottom: 1px solid var(--linie-2); position: relative; }
.jt-tab td.tagnr { border-right: 1px solid var(--linie); text-align: right;
                   padding-right: 5px; font-size: 11.4px; color: var(--tinte-3);
                   font-variant-numeric: tabular-nums; }
.jt-tab td.we { background: var(--papier-2); }
.jt-tab td.leer { background: repeating-linear-gradient(135deg,
                  transparent, transparent 4px, var(--linie-2) 4px, var(--linie-2) 5px); }
.jt-tab td.heute { box-shadow: inset 0 0 0 1.5px var(--wein); }
.jt-tab td.frei:active { background: var(--marke-h); }
.jt-bal { position: absolute; inset: 2px 3px; }
.jt-bal.start { border-radius: 4px 4px 0 0; }
.jt-bal.ende  { border-radius: 0 0 4px 4px; }
.jt-bal.eintag { border-radius: 4px; }
.jt-kuerzel { position: absolute; inset: 2px 3px; display: flex; align-items: center;
              justify-content: center; font-size: 10.2px; color: #fff;
              overflow: hidden; pointer-events: none; }

/* ── Eintragsdialog für Woche und Monat ──────────────────────────
   Ein Weg statt zweier: die Zeile sagt nicht, was man eintraegt —
   der Dialog fragt es.                                             */
.ed-l { font-size: 10.2px; letter-spacing: .12em; text-transform: uppercase;
        color: var(--tinte-3); margin: 12px 0 5px; }
.ed-l:first-child { margin-top: 0; }
.ed-art { display: flex; gap: 6px; }
.ed-a { flex: 1; min-height: 40px; border: 1px solid var(--linie); border-radius: 6px;
        background: var(--karte); font-size: 13.2px; color: var(--tinte-2); }
.ed-a.aktiv { background: var(--wein); border-color: var(--wein); color: var(--papier);
              font-weight: 700; }
.ed-f { width: 100%; font: inherit; font-size: 15.6px; border: 1px solid var(--linie);
        border-radius: 6px; padding: 8px 10px; background: var(--karte);
        color: var(--tinte); }
.ed-f:focus { outline: none; border-color: var(--marke); }
.ed-zeile { display: flex; gap: 8px; align-items: center; }
.ed-tage { display: flex; gap: 5px; flex-wrap: wrap; }
.ed-t { min-width: 42px; min-height: 40px; border: 1px solid var(--linie);
        border-radius: 6px; background: var(--karte); font-size: 13.2px;
        color: var(--tinte-2); }
.ed-t.aktiv { background: var(--wein); border-color: var(--wein); color: var(--papier);
              font-weight: 700; }
.ed-hin { font-size: 12.6px; color: var(--tinte-3); margin-top: 10px; line-height: 1.5; }
.ed-zu { margin-top: 12px; font-size: 13.2px; color: var(--wein);
         text-decoration: underline; text-decoration-style: dotted; }

/* Speicherzustand als Punkt im Datenknopf */
.sp-punkt { width: 8px; height: 8px; border-radius: 50%; background: #c9c2b4;
            flex-shrink: 0; display: inline-block; }
.sp-punkt.bereit { background: var(--gruen); }
.sp-punkt.fehler { background: var(--wein); }
.sp-punkt.fluechtig { background: var(--marke); }
.dt-z { display: flex; align-items: baseline; gap: 10px; padding: 6px 2px;
        border-bottom: 1px solid var(--linie-2); font-size: 13.2px; }
.dt-l { flex: 0 0 150px; color: var(--tinte-3); font-size: 12px;
        letter-spacing: .06em; text-transform: uppercase; }
.dt-w { flex: 1; font-variant-numeric: tabular-nums; }
/* Bereichsauswahl */
.bw-t { font-size: 15.6px; padding: 2px 2px 4px; border-bottom: 1px solid var(--linie); }
.bw-gk { font-size: 10.2px; letter-spacing: .12em; text-transform: uppercase;
         color: var(--wein); background: var(--papier-2); padding: 5px 6px;
         margin-top: 8px; border-radius: 3px; }
.bw-z { display: flex; align-items: center; gap: 9px; padding: 8px 6px;
        border-bottom: 1px solid var(--linie-2); cursor: pointer; }
.bw-z:active { background: var(--marke-h); }
.bw-z.aktiv { background: var(--wein-h); box-shadow: inset 2px 0 0 var(--wein); }
.bw-n { flex: 1; min-width: 0; font-size: 14.4px; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
.bw-g { font-size: 11.4px; color: var(--tinte-3); flex-shrink: 0; }

/* Gruppen- und Bereichsverwaltung */
.gr-z { display: flex; align-items: center; gap: 8px; padding: 5px 0;
        border-bottom: 1px solid var(--linie-2); }
.gr-z .ed-f { flex: 1; min-width: 0; padding: 6px 8px; font-size: 14.4px; }
.gr-n { flex: 0 0 84px; text-align: right; font-size: 12px; color: var(--tinte-3); }
.gr-o { flex: 0 0 58px; text-align: right; font-size: 12px; color: var(--leder);
        font-variant-numeric: tabular-nums; }
.gr-s { flex: 0 0 150px; min-height: 34px; font-size: 13.2px; }
.gr-z.neu-z { border-bottom: 1.4px dashed var(--marke); cursor: pointer;
              padding: 9px 0; }
.gr-z.neu-z:active { background: var(--marke-h); }
.grp-n { float: right; font-size: 11px; color: var(--tinte-3); letter-spacing: 0;
         text-transform: none; }
.dt-warn { border: 1px solid var(--wein); background: var(--wein-h); border-radius: 5px;
           padding: 9px 11px; margin-bottom: 12px; font-size: 13.2px;
           color: var(--tinte); line-height: 1.5; }
.k-btn.warn { background: var(--wein); border-color: var(--wein); color: var(--papier);
              font-weight: 700; }

/* Ferientoenung und Feiertagsname im Monatsraster */
.mon-t.ferien { background: #f0ebe1; }
.mon-t.ferien.we { background: #e8e2d5; }
.mon-fei { font-size: 10.2px; letter-spacing: .06em; color: var(--wein);
           text-transform: uppercase; }

/* Ferien als Toenung, Feiertag als Punkt — Hintergrund, kein Eintrag */
.jt-tab td.ferien { background: #ece7dc; }
.jt-tab td.ferien.we { background: #e3ddd0; }
.jt-tab td.feiertag::before { content: ''; position: absolute; left: 2px; top: 2px;
                              width: 4px; height: 4px; border-radius: 50%;
                              background: var(--wein); z-index: 3; }
.jt-fei { position: absolute; inset: 0; }

/* Legende: die vollen Titel, die im Raster keinen Platz haben */
.jt-leg { display: flex; align-items: center; gap: 9px; padding: 5px 2px;
          border-bottom: 1px solid var(--linie); }
.jt-leg:active { background: var(--marke-h); }
.jt-farbe { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
.jt-lt { flex: 1; min-width: 0; font-size: 15.6px; }
.jt-lm { font-size: 12.6px; color: var(--tinte-3); }
.jt-ldat { font-size: 13.2px; color: var(--leder); font-variant-numeric: tabular-nums;
           flex-shrink: 0; }
.jt-feld { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.jt-feld label { flex: 0 0 62px; font-size: 12px; letter-spacing: .1em;
                 text-transform: uppercase; color: var(--tinte-3); }
.jt-feld input, .jt-feld select { flex: 1; min-width: 0; font: inherit; font-size: 15.6px;
        border: 1px solid var(--linie); border-radius: 5px; padding: 6px 8px;
        background: var(--karte); color: var(--tinte); }
.jt-feld input:focus, .jt-feld select:focus { outline: none; border-color: var(--marke); }

/* ── Wochenblatt (CMP 10) ─────────────────────────────────────────
   Sieben Tagzeilen, gleiche Bedienung wie das Monatsraster.        */
.wo-t { display: flex; align-items: stretch; gap: 8px; min-height: 74px;
        border-bottom: 1px solid var(--linie); }
.wo-t.we { background: var(--papier-2); }
.wo-t.heute { box-shadow: inset 3px 0 0 var(--wein); }
.wo-nr { flex: 0 0 92px; font-size: 14.4px; font-weight: 700; color: var(--leder);
         text-transform: uppercase; letter-spacing: .06em; padding-top: 7px; }
.wo-t.we .wo-nr { color: var(--tinte-3); }
.wo-dat { font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--tinte-3);
          text-transform: none; margin-top: 1px; }
.wo-inhalt { flex: 1; min-width: 0; display: flex; flex-direction: column;
             justify-content: center; padding: 4px 0; cursor: pointer; }

/* Tageswahl in der Auswahlliste */
.wahl-tage { display: flex; gap: 3px; margin-top: 6px; }
.wahl-d { min-width: 32px; height: 30px; border: 1px solid var(--linie);
          border-radius: 5px; background: var(--karte); font-size: 13.2px;
          color: var(--tinte-2); }
.wahl-d.vor { border-color: var(--wein); color: var(--wein); font-weight: 700;
              background: var(--wein-h); }
.wahl-d:active { background: var(--wein); border-color: var(--wein); color: var(--papier); }
/* Zeitspalte und Pluszeichen im Wochenblatt */
.wo-zeit { flex: 0 0 44px; font-size: 13.2px; color: var(--leder);
           font-variant-numeric: tabular-nums; cursor: pointer; }
.wo-zeit.mon-offen { padding: 0 2px; }
.wo-plus { flex: 0 0 26px; align-self: center; height: 26px; border-radius: 5px;
           border: 1px solid var(--linie); background: var(--karte); color: var(--wein);
           font-size: 16px; line-height: 1; }
.wo-plus:active { background: var(--wein); border-color: var(--wein); color: var(--papier); }

/* ── Planblatt (CMP 32) ───────────────────────────────────────────
   Zwei Kopfzeilen wie im gedruckten Satz, darunter die Aktivitaeten. */
.p-kopf { border-bottom: 1px solid var(--linie); padding-bottom: 6px; margin-bottom: 4px; }
.p-kz { min-height: 24px; border-bottom: 1px dotted var(--linie-2); font-size: 15.6px;
        color: var(--tinte-2); padding: 3px 2px; cursor: pointer; }
.p-kz:last-child { border-bottom: none; }
.p-kz:empty::before { content: 'antippen und schreiben'; color: var(--tinte-3);
                      font-size: 13.8px; }
.p-kz.offen { background: var(--karte); box-shadow: inset 0 0 0 1.4px var(--marke); }
.p-kz .zf { font-size: 15.6px; }
/* Der Pfeil auf der Checkliste: hier wird die Aktivitaet gefuehrt */
.p-pfeil { display: block; font-size: 11.4px; color: var(--wein); margin-top: 1px;
           letter-spacing: .02em; }
/* Uebersicht */
.ptab td { vertical-align: top; }
.ptab tr.grp td { background: var(--papier-2); font-size: 10.8px; letter-spacing: .12em;
                  text-transform: uppercase; color: var(--leder); padding: 5px 4px;
                  border-bottom: 1px solid var(--linie); }
.p-titel { font-size: 16.2px; display: block; }
.p-link { color: var(--wein); text-decoration: underline;
          text-decoration-style: dotted; text-underline-offset: 2px; }
.p-chev { color: var(--wein); font-size: 20.4px; line-height: 1; }
.p-besch { display: block; font-size: 12.6px; color: var(--tinte-3); margin-top: 1px;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Zweite Registerebene: eigene, schmalere Spalte zwischen Blatt und
   Hauptregistern. Beide Ebenen sind gleichzeitig sichtbar — so ist ein
   Ringbuch mit Haupt- und Unterregister aufgebaut.                    */
.reiter-innen { width: 38px; padding: 18px 0 6px; margin-right: 9px; }
.reiter-innen.aus { display: none; }
/* Wiederkehrend und Gewohnheiten sitzen fest am unteren Ende der Spalte;
   laufen die Gruppen über, werden diese abgeschnitten, nicht jene.    */
.rt-fest { margin-top: auto; display: flex; flex-direction: column; gap: 5px;
           padding-top: 8px; flex-shrink: 0; }
.reiter-innen .rt { box-shadow: 1px 1px 3px rgba(35,33,30,.09); }
.reiter-innen .rt.aktiv { box-shadow: 2px 1px 5px rgba(35,33,30,.12); }
/* Gleiche Schriftgroesse wie die Hauptregister — der Platz ist es wert.
   Dunklerer Grund, damit sich die innere Ebene absetzt.               */
.rt-plan { font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
           padding: 14px 0; color: var(--tinte-2); background: #ddd6c8; }
.rt-plan.aktiv { color: var(--wein); background: var(--papier); font-weight: 700; }

/* ── Zielblatt (CMP 30) ───────────────────────────────────────────
   Vier Abschnitte fuer die einzahlenden Bestaende, darunter die
   Meilensteine als abgesetzter Block.                              */
.zl-z { display: flex; align-items: center; gap: 8px; min-height: 28px;
        border-bottom: 1px solid var(--linie-2); padding: 2px 0; }
.zl-t { flex: 1; min-width: 0; font-size: 16.2px; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
.zl-t.durch { text-decoration: line-through; color: var(--tinte-3); }
.zl-t.blass { color: var(--tinte-3); }
.zl-link { color: var(--wein); text-decoration: underline;
           text-decoration-style: dotted; text-underline-offset: 2px; cursor: pointer; }
.zl-m { flex: 0 0 auto; min-width: 52px; text-align: right; font-size: 13.2px;
        color: var(--leder); font-variant-numeric: tabular-nums; cursor: pointer; }
.zl-z .hak { flex: 0 0 17px; width: 17px; height: 17px; font-size: 14.4px; }
.zl-z .zf { font-size: 16.2px; }
.zl-z.neu-z { border-bottom: 1.4px dashed var(--marke); cursor: pointer; }
.zl-z.neu-z:active { background: var(--marke-h); }
.ms-block { border: 1px solid var(--wein); border-radius: 4px; padding: 7px 9px;
            margin-top: 16px; background: var(--karte); }

/* ── Ziele im Jahr (CMP 22) ───────────────────────────────────────*/
.zj-tab { width: 100%; border-collapse: collapse; table-layout: fixed; }
.zj-tab th { font-size: 10.2px; letter-spacing: .1em; text-transform: uppercase;
             color: var(--wein); font-weight: 400; padding: 0 0 4px;
             border-bottom: 1.2px solid var(--wein); text-align: center; }
.zj-tab td { height: 30px; padding: 0; border-bottom: 1px solid var(--linie-2);
             position: relative; }
.zj-t { font-size: 15px; padding-right: 10px; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.zj-c { border-right: 1px solid var(--linie-2); }
.zj-bal { position: absolute; inset: 10px 0; opacity: .55; }
.zj-bal.erste { left: 3px; border-radius: 4px 0 0 4px; }
/* Das Fristende ist der Punkt, an dem sich Ziele stauen */
.zj-bal.frist { right: 3px; border-radius: 0 4px 4px 0; opacity: 1; }
.zj-bal.frist::after { content: ''; position: absolute; right: 0; top: -5px; bottom: -5px;
                       width: 3px; background: var(--wein); border-radius: 2px; }

/* Summierung je Art */
.jt-sum { display: flex; align-items: center; gap: 9px; padding: 4px 2px;
          border-bottom: 1px solid var(--linie-2); }
.jt-sum-n { font-size: 12.6px; color: var(--tinte-3); font-variant-numeric: tabular-nums; }
.jt-sum-t { flex: 0 0 74px; text-align: right; font-size: 13.2px; color: var(--leder);
            font-variant-numeric: tabular-nums; }
.jt-sum-g { border-bottom: none; border-top: 1.2px solid var(--wein); margin-top: 2px;
            padding-top: 6px; font-weight: 700; }
.jt-sum-g .jt-sum-t { color: var(--wein); }

/* Laufzeitzeile auf dem Zielblatt */
.zl-lauf { display: flex; align-items: center; gap: 8px; margin: 8px 0 2px; }
.zl-lauf-l { font-size: 10.2px; letter-spacing: .13em; text-transform: uppercase;
             color: var(--wein); font-weight: 700; }
.zl-lauf-b { font-size: 13.2px; color: var(--tinte-3); }
.zl-lauf-f { min-width: 92px; font-size: 15.6px; padding: 3px 6px; cursor: pointer;
             border-bottom: 1px solid var(--linie); font-variant-numeric: tabular-nums; }
.zl-lauf-f.offen { background: var(--karte); box-shadow: inset 0 0 0 1.4px var(--marke); }

/* Loeschkreuz: Umsortieren heisst loeschen und neu schreiben */
.mon-x { flex: 0 0 17px; width: 17px; height: 17px; border-radius: 3px;
         color: var(--tinte-3); font-size: 18px; line-height: 1; padding: 0;
         display: flex; align-items: center; justify-content: center; opacity: .45; }
.mon-x:active { background: var(--wein-h); color: var(--wein); opacity: 1; }

/* Auswahl aus den Bestaenden */
.wahl-l { padding: 8px 4px; border-bottom: 1px solid var(--linie); display: flex;
          align-items: center; gap: 9px; cursor: pointer; }
.wahl-l:active { background: var(--marke-h); }
.wahl-t { flex: 1; min-width: 0; font-size: 15.6px; }
.wahl-m { font-size: 12px; color: var(--tinte-3); }
.wahl-art { font-size: 10.2px; letter-spacing: .1em; text-transform: uppercase;
            color: var(--wein); border: 1px solid var(--wein-h); background: var(--wein-h);
            border-radius: 3px; padding: 1px 5px; flex-shrink: 0; }
.wahl-tag { flex: 0 0 52px; }
.wahl-tag select { width: 100%; font-size: 13.2px; border: 1px solid var(--linie);
                   border-radius: 4px; background: var(--karte); padding: 2px; }

/* Platzhalterblatt für spätere Stufen */
.stub { margin-top: 40px; text-align: center; color: var(--tinte-3); }

/* Jahrestermin: t, von, bis, ort, art. Die Art faerbt den Balken —

/* ═══════════════════════════════════════════════════════════════════
   FEIERTAGE UND SCHULFERIEN BAYERN — nur Anhaltspunkt, keine Einträge.
   Sie sind nicht löschbar und zählen nicht in die Summierung: Sie
   beantworten die Frage, warum eine Woche schwierig ist, mehr nicht.

   Feiertage werden gerechnet, nicht gepflegt — die beweglichen folgen
   dem Osterdatum (Formel nach Meeus), geprüft gegen 2024 bis 2030.
   Ferien legt das Kultusministerium fest und müssen hinterlegt werden;
   die Liste reicht bis Sommer 2027 (BayMBl. 2022 Nr. 747).
   ═══════════════════════════════════════════════════════════════════ */
function ostersonntag(jahr) {
  const a = jahr % 19, b = Math.floor(jahr / 100), c = jahr % 100;
  const d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const monat = Math.floor((h + l - 7 * m + 114) / 31);
  const tag = ((h + l - 7 * m + 114) % 31) + 1;
  return Date.UTC(jahr, monat - 1, tag);
}
function isoVon(ms) { return new Date(ms).toISOString().slice(0, 10); }
function feiertageBayern(jahr) {
  const o = ostersonntag(jahr);
  const tg = 86400000;
  const l = [
    { d:isoVon(Date.UTC(jahr, 0, 1)),   t:'Neujahr' },
    { d:isoVon(Date.UTC(jahr, 0, 6)),   t:'Heilige Drei Könige' },
    { d:isoVon(o - 2 * tg),             t:'Karfreitag' },
    { d:isoVon(o + 1 * tg),             t:'Ostermontag' },
    { d:isoVon(Date.UTC(jahr, 4, 1)),   t:'Tag der Arbeit' },
    { d:isoVon(o + 39 * tg),            t:'Christi Himmelfahrt' },
    { d:isoVon(o + 50 * tg),            t:'Pfingstmontag' },
    { d:isoVon(o + 60 * tg),            t:'Fronleichnam' },
    { d:isoVon(Date.UTC(jahr, 7, 15)),  t:'Mariä Himmelfahrt' },
    { d:isoVon(Date.UTC(jahr, 9, 3)),   t:'Tag der Deutschen Einheit' },
    { d:isoVon(Date.UTC(jahr, 10, 1)),  t:'Allerheiligen' },
    { d:isoVon(Date.UTC(jahr, 11, 25)), t:'1. Weihnachtstag' },
    { d:isoVon(Date.UTC(jahr, 11, 26)), t:'2. Weihnachtstag' },
  ];
  return l;
}
const FERIEN_BAYERN = [
  { t:'Weihnachtsferien', von:'2025-12-22', bis:'2026-01-05' },

];
/* Zwischenspeicher, damit die Formel nicht je Zelle neu läuft */
const feiertagCache = {};
function feiertagAn(iso) {
  const jahr = parseInt(iso.slice(0, 4), 10);
  if (!feiertagCache[jahr]) {
    const m = {};
    feiertageBayern(jahr).forEach(function (f) { m[f.d] = f.t; });
    feiertagCache[jahr] = m;
  }
  return feiertagCache[jahr][iso] || null;
}
function ferienAn(iso) {
  const f = FERIEN_BAYERN.find(x => iso >= x.von && iso <= x.bis);
  return f ? f.t : null;
}

/* Fehlende Felder ergaenzen, statt an ihnen zu scheitern. Jede kuenftige
   Schemaaenderung bekommt hier ihren eigenen Block.                   */
function migriereDB(d) {
  if (!d || typeof d !== 'object') { return saatDB(); }
  const s = saatDB();
  Object.keys(s).forEach(function (k) {
    if (d[k] === undefined || d[k] === null) { d[k] = s[k]; }
  });
  if (!Array.isArray(d.bereiche) || !d.bereiche.length) { d.bereiche = s.bereiche; }
  /* Version 1 → 2: Gruppen kamen dazu. Bereiche ohne Zuordnung bleiben
     ohne — sie landen im Register "Ohne Gruppe" und lassen sich dort
     einsortieren.                                                      */
  if (!Array.isArray(d.gruppen)) { d.gruppen = []; }
  d.bereiche.forEach(function (b) {
    if (b.gruppeId === undefined) { b.gruppeId = null; }
  });
  d.version = DB_VERSION;
  return d;
}

/* ═══════════════════════════════════════════════════════════════════
   SPEICHER — IndexedDB
   Liegt im App-eigenen Speicher, ist beim Start sofort da und braucht
   keine Dateiauswahl. Bewusst nicht OPFS: dessen Schreibpfad ist in
   Safari erst spaet und unvollstaendig gelandet, IndexedDB laeuft dort
   seit Jahren zuverlaessig, auch als Home-Bildschirm-App.
   ═══════════════════════════════════════════════════════════════════ */
const SP_NAME = 'timeassist';
const SP_STORE = 'daten';
const SP_KEY = 'db';
let spDatenbank = null;
let spZustand = 'unbekannt';   // 'bereit' | 'fehler' | 'fluechtig'
let spFehler = '';

function spOeffnen() {
  return new Promise(function (fertig, fehl) {
    if (spDatenbank) { fertig(spDatenbank); return; }
    if (!window.indexedDB) { fehl(new Error('IndexedDB nicht verfügbar')); return; }
    const a = indexedDB.open(SP_NAME, 1);
    a.onupgradeneeded = function () {
      const d = a.result;
      if (!d.objectStoreNames.contains(SP_STORE)) { d.createObjectStore(SP_STORE); }
    };
    a.onsuccess = function () { spDatenbank = a.result; fertig(spDatenbank); };
    a.onerror = function () { fehl(a.error || new Error('IndexedDB-Fehler')); };
  });
}
function spLesen() {
  return spOeffnen().then(function (d) {
    return new Promise(function (fertig, fehl) {
      const t = d.transaction(SP_STORE, 'readonly').objectStore(SP_STORE).get(SP_KEY);
      t.onsuccess = function () { fertig(t.result || null); };
      t.onerror = function () { fehl(t.error); };
    });
  });
}
function spSchreiben(wert) {
  return spOeffnen().then(function (d) {
    return new Promise(function (fertig, fehl) {
      const tx = d.transaction(SP_STORE, 'readwrite');
      tx.objectStore(SP_STORE).put(wert, SP_KEY);
      tx.oncomplete = function () { fertig(true); };
      tx.onerror = function () { fehl(tx.error); };
    });
  });
}

/* Gespeichert wird gebuendelt kurz nach der letzten Aenderung, nicht bei
   jedem Tastendruck — sonst schreibt die App im Sekundentakt.        */
let spTimer = null;
let spOffen = false;
function speichern() {
  spOffen = true;
  clearTimeout(spTimer);
  spTimer = setTimeout(function () {
    DB.naechsteId = neuId;
    DB.version = DB_VERSION;
    spSchreiben(JSON.parse(JSON.stringify(DB))).then(function () {
      spOffen = false;
      spZustand = 'bereit';
      spStandZeigen();
    }).catch(function (e) {
      spOffen = false;
      spZustand = 'fehler';
      spFehler = String(e && e.message ? e.message : e);
      spStandZeigen();
    });
  }, 400);
}
function spStandZeigen() {
  const e = $('spstand');
  if (!e) { return; }
  e.className = 'sp-punkt ' + spZustand;
  e.title = spZustand === 'bereit' ? 'Lokal gespeichert'
          : spZustand === 'fehler' ? 'Speichern fehlgeschlagen: ' + spFehler
          : 'Daten liegen nur im Arbeitsspeicher';
}

function regDef(k) { return REGISTER.find(r => r.k === k) || REGISTER[0]; }

/* Liefert die Liste der Unterregister eines Hauptregisters, oder null.   */
function unterListe(k) {
  const d = regDef(k);
  if (!d.unter) { return null; }
  if (d.unter === 'akt') {
    /* Ein Register je Gruppe — im Ringbuch liegt hinter jedem Reiter ein
       eigenes Checklistenblatt.                                        */
    const l = [{ k:'uebersicht', n:'Alle' }];
    GRUPPEN.forEach(function (g) { l.push({ k:'g:' + g.id, n:g.name }); });
    if (BEREICHE.some(b => !b.gruppeId)) { l.push({ k:'g:0', n:'Ohne Gruppe' }); }
    l.push({ k:'wied', n:'Wiederkehrend' });
    l.push({ k:'gew', n:'Gewohnheiten' });
    return l;
  }
  if (d.unter === 'ziele') {
    const l = [{ k:'uebersicht', n:'Übersicht' }, { k:'zjahr', n:'Jahr' }];
    ZIELE.filter(z => !z.archiviert).forEach(function (z) { l.push({ k:z.id, n:z.t }); });
    return l;
  }
  if (d.unter === 'plaene') {
    /* Ein Reiter ist ein Plan, nicht ein Bereich. Sie stehen senkrecht
       rechts unter den Hauptregistern, auf zehn Zeichen gekürzt. Was
       nicht mehr in die Spalte passt, ist über die Übersicht erreichbar. */
    const l = [{ k:'uebersicht', n:'Übersicht' }];
    PLAENE.filter(p => !p.archiviert).forEach(function (p) {
      l.push({ k:p.id, n:p.t });
    });
    return l;
  }
  return d.unter;
}
/* Reiterlasche: 12 Zeichen, hart abgeschnitten. Keine Auslassung —
   auf einer beschrifteten Lasche steht auch keine.                   */
function reiterKurz(t) {
  return t.length > 12 ? t.slice(0, 12).trim() : t;
}
/* Der Pfeil auf der Checkliste ist Fließtext und behält die Auslassung */
function pfeilKurz(t) {
  return t.length > 12 ? t.slice(0, 12).trim() + '…' : t;
}

/* Aktives Blatt = Unterregister, falls vorhanden, sonst Hauptregister.   */
function blattKey() {
  const l = unterListe(reg);
  if (!l) { return reg; }
  return unterAktiv[reg];
}

function regZahl() {
  /* Auf einem Registerreiter steht keine Zahl. Bewusst leer gelassen. */
  return null;
}

function renderRegister() {
  $('reiter').innerHTML = REGISTER.map(function (r) {
    return '<button class="rt ' + (reg === r.k ? 'aktiv' : '') +
           '" onclick="zeigeReg(\'' + r.k + '\')">' + esc(r.n) + '</button>';
  }).join('');

  /* Reiter der inneren Spalte. Bei den Aktivitäten stehen Wiederkehrend
     und Gewohnheiten am Ende und dürfen nie abgeschnitten werden — sie
     werden deshalb zuerst gesetzt und die Gruppen füllen den Rest.    */
  const el = $('reiter-plan');
  if (reg !== 'plaene' && reg !== 'ziele' && reg !== 'akt') {
    el.classList.add('aus'); el.innerHTML = ''; return;
  }
  el.classList.remove('aus');
  const l = unterListe(reg) || [];
  const a = unterAktiv[reg];
  const knopf = function (u) {
    return '<button class="rt rt-plan ' + (a === u.k ? 'aktiv' : '') +
           '" onclick="zeigeUnter(\'' + u.k + '\')">' +
           esc(reiterKurz(u.n)) + '</button>';
  };
  if (reg === 'akt') {
    const fest = l.filter(u => u.k === 'wied' || u.k === 'gew');
    const rest = l.filter(u => u.k !== 'wied' && u.k !== 'gew');
    el.innerHTML = rest.map(knopf).join('') +
      '<div class="rt-fest">' + fest.map(knopf).join('') + '</div>';
    return;
  }
  el.innerHTML = l.map(knopf).join('');
}

function renderUnterreiter() {
  const l = unterListe(reg);
  const el = $('unterreiter');
  /* Pläne führen ihre Reiter senkrecht rechts — die waagerechte Leiste
     bleibt dort leer.                                                  */
  if (!l || reg === 'plaene' || reg === 'ziele' || reg === 'akt') {
    el.classList.add('aus'); el.innerHTML = ''; return;
  }
  el.classList.remove('aus');
  const a = unterAktiv[reg];
  el.innerHTML = l.map(function (u) {
    let z = '';
    if (reg === 'akt') {
      const n = u.k === 'akt' ? AKTIVITAETEN.filter(offen).length
              : u.k === 'wied' ? WIEDER.length : GEWOHNHEIT.length;
      z = '<span class="ur-zahl">' + n + '</span>';
    }
    return '<button class="ur ' + (a === u.k ? 'aktiv' : '') +
           '" onclick="zeigeUnter(\'' + u.k + '\')">' + esc(u.n) + z + '</button>';
  }).join('');
}

function zeigeReg(k)   { reg = k; renderAlles(); }
function zeigeUnter(k) { unterAktiv[reg] = k; renderAlles(); }
/* Springt auf ein bestimmtes Blatt, auch ueber Registergrenzen hinweg */
function blattOeffnen(hauptK, unterK) {
  reg = hauptK;
  if (unterK) { unterAktiv[hauptK] = unterK; }
  renderAlles();
}

/* ═══ BLATTKOPF ═══ */
/* Bei Plänen und Zielen ist der Unterschlüssel eine ID — die Nummer
   kommt dort vom Hauptregister.                                       */
function formNr() {
  if (reg === 'akt') {
    const u = unterAktiv.akt;
    return u === 'wied' ? FORM_NR.wied : (u === 'gew' ? FORM_NR.gew : FORM_NR.akt);
  }
  if (reg === 'plaene') { return FORM_NR.plaene; }
  if (reg === 'ziele')  {
    return unterAktiv.ziele === 'zjahr' ? FORM_NR.zjahr : FORM_NR.ziele;
  }
  return FORM_NR[blattKey()] || 'CMP 05';
}
function kopf(titel, sub, akt) {
  $('bk-titel').textContent = titel;
  $('bk-sub').textContent = sub || '';
  $('bk-akt').innerHTML = akt || '';
  $('bf-nr').textContent = formNr();
  $('bf-mitte').textContent = 'TimeAssist ' + APP_VERSION;
  /* bf-rechts traegt den Massstab, gesetzt in skaliere() */
  skaliere();
}

/* ═══ GEMEINSAME BAUSTEINE ═══ */
function abschnitt(titel, sub) {
  return '<div class="ab-kopf"><span class="ab-titel">' + esc(titel) + '</span>' +
         (sub ? '<span class="ab-sub">' + esc(sub) + '</span>' : '') + '</div>';
}
function freieZeilen(n) {
  let h = '';
  for (let i = 0; i < n; i++) { h += '<div class="frei-l"></div>'; }
  return h;
}
function leerZeilen(belegt, gesamt) {
  let h = '';
  for (let i = belegt; i < gesamt; i++) {
    h += '<div class="tz leer"><span class="tz-nr">' + (i + 1) + '</span></div>';
  }
  return h;
}
function glyphWeiter(id) {
  const a = AKTIVITAETEN.find(x => x.id === id);
  if (!a) { return; }
  a.glyph = naechsterGlyph(a.glyph);
  renderAlles();
}
function naechsterGlyph(g) {
  const folge = { '\u2022':'\u2715', '\u2715':'>', '>':'\u2013', '\u2013':'\u2022' };
  return folge[g] || '\u2022';
}
function kontaktGlyph(id) {
  const k = KONTAKTE.find(x => x.id === id);
  if (!k) { return; }
  k.glyph = naechsterGlyph(k.glyph);
  renderAlles();
}
function prioWeiter(id) {
  const a = AKTIVITAETEN.find(x => x.id === id);
  if (!a) { return; }
  const folge = { 'A':'B', 'B':'C', 'C':'A' };
  a.prio = folge[a.prio] || 'B';
  renderAlles();
}
/* Fruehere Durchschaltung durch alle Bereiche ersetzt: bei siebzehn
   Bereichen waere das siebzehnmal tippen, und man saehe nicht, in
   welcher Gruppe man landet.                                          */
let bwId = null;
function bereichWeiter(id) {
  bwId = id;
  const a = AKTIVITAETEN.find(x => x.id === id);
  if (!a) { return; }
  let h = '<div class="ed-l">Aktivit\u00e4t</div><div class="bw-t">' + esc(a.t) + '</div>';
  const zeile = function (b) {
    const g = b.gruppeId ? GRUPPEN.find(x => x.id === b.gruppeId) : null;
    return '<div class="bw-z ' + (b.id === a.b ? 'aktiv' : '') +
      '" onclick="bereichSetzen(\'' + b.id + '\')">' +
      '<span class="tz-punkt" style="background:' + b.farbe + '"></span>' +
      '<span class="bw-n">' + esc(b.name) + '</span>' +
      '<span class="bw-g">' + esc(g ? g.name : 'ohne Gruppe') + '</span></div>';
  };
  h += '<div class="ed-l">Bereich w\u00e4hlen</div>';
  /* Nach Gruppen sortiert — so ist beim Umhaengen sichtbar, hinter
     welche Lasche die Aktivitaet wandert.                             */
  GRUPPEN.forEach(function (g) {
    const l = BEREICHE.filter(b => b.gruppeId === g.id);
    if (!l.length) { return; }
    h += '<div class="bw-gk">' + esc(g.name) + '</div>' + l.map(zeile).join('');
  });
  const ohne = BEREICHE.filter(b => !b.gruppeId);
  if (ohne.length) {
    h += '<div class="bw-gk">Ohne Gruppe</div>' + ohne.map(zeile).join('');
  }
  if (!BEREICHE.length) { h += '<div class="hinweis">Noch keine Bereiche.</div>'; }
  $('bw-inhalt').innerHTML = h;
  $('bw').classList.add('auf');
}
function bereichSetzen(bid) {
  const a = AKTIVITAETEN.find(x => x.id === bwId);
  if (a) { a.b = bid; }
  bereichZu();
  renderAlles();
  melde('Nach ' + bName(bid) + ' verschoben');
}
function bereichZu() { $('bw').classList.remove('auf'); bwId = null; }

/* Kästchen statt Glyph: leer = offen, ✕ erledigt, › verschoben,
   – gestrichen. Der Zustand sitzt im Kästchen, der Text bleibt Text.  */
function hakFeld(glyph, aktion) {
  const zeichen = { '\u2022':'', '\u2715':'\u2715', '>':'\u203a', '\u2013':'\u2013' };
  return '<button class="hak" onclick="event.stopPropagation(); ' + aktion + '">' +
         (zeichen[glyph] || '') + '</button>';
}
function titelKlasse(o) {
  if (o.glyph === '\u2715' || o.glyph === '\u2013') { return 'durch'; }
  if (o.glyph === '>') { return 'blass'; }
  return '';
}
/* Sphäre wird über den Bereich geerbt; Termine tragen sie selbst.      */
/* Ganztägige Einträge des Tages: eigene Termine plus alle mehrtägigen
   Jahrestermine, in deren Zeitraum der Tag fällt.                      */
function ganztagsEintraege() {
  const l = TERMINE.filter(t => t.tag === HEUTE_WT && t.ganztags)
    .map(function (t) { return { t:t.t, ort:t.ort, quelle:'' }; });
  /* Feiertag und Ferien stehen als Anhaltspunkt oben mit im Band */
  if (zeigeKalender) {
    const fei = feiertagAn(HEUTE_ISO);
    if (fei) { l.push({ t:fei, ort:'', quelle:'Feiertag' }); }
    const fer = ferienAn(HEUTE_ISO);
    if (fer) { l.push({ t:fer + ' (Bayern)', ort:'', quelle:'Ferien' }); }
  }
  JAHRESTERMINE.forEach(function (j) {
    if (HEUTE_ISO >= j.von && HEUTE_ISO <= j.bis) {
      l.push({ t:j.t, ort:j.ort, quelle:'Jahrestermin' });
    }
  });
  return l;
}
/* ═══════════════════════════════════════════════════════════════════
   INLINE-ERFASSUNG
   Die Zeile wird zum Feld. Tab springt weiter, Enter speichert und
   öffnet die nächste Leerzeile, Escape verwirft. Kein Dialog.
   ═══════════════════════════════════════════════════════════════════ */
let editAkt = null;      // id der Aktivität in Bearbeitung
let editTermin = null;   // id des Termins in Bearbeitung
let editKontakt = null;  // id des Kontakts in Bearbeitung
let neuId = 900;
function naechsteId() { neuId += 1; return neuId; }

/* Nach dem Rendern: Feld fokussieren und über die Tastatur schieben.
   Auf dem iPad verdeckt die Tastatur sonst das untere Blattdrittel.  */
let fokusZiel = null;
function fokusSetzen() {
  if (!fokusZiel) { return; }
  const el = $(fokusZiel);
  fokusZiel = null;
  if (!el) { return; }
  el.focus();
  if (el.select) { el.select(); }
  if (el.scrollIntoView) { el.scrollIntoView({ block:'center' }); }
}

function tastatur(ev, speichern, weiter) {
  if (ev.key === 'Enter')  { ev.preventDefault(); speichern(true);  }
  if (ev.key === 'Escape') { ev.preventDefault(); abbrechen(); }
  if (weiter) { weiter(ev); }
}
function abbrechen() {
  aufraeumen();
  editZelle = null; editTermin = null;
  renderAlles();
}
/* Leer angelegte Zeilen verschwinden wieder, wenn nichts geschrieben wurde */
function aufraeumen() {
  /* Die gerade angelegte Zeile ist zwangsläufig leer. Sie darf nicht
     mitgelöscht werden, sonst räumt die Aufräumlogik genau den Eintrag
     weg, der eben zum Schreiben geöffnet wurde.                        */
  const schonen = editZelle ? editZelle.id : null;
  for (let i = AKTIVITAETEN.length - 1; i >= 0; i--) {
    if (!AKTIVITAETEN[i].t && AKTIVITAETEN[i].id !== schonen) { AKTIVITAETEN.splice(i, 1); }
  }
  for (let i = TERMINE.length - 1; i >= 0; i--) {
    if (!TERMINE[i].t && TERMINE[i].id !== editTermin) { TERMINE.splice(i, 1); }
  }
  for (let i = KONTAKTE.length - 1; i >= 0; i--) {
    if (!KONTAKTE[i].t && KONTAKTE[i].id !== schonen) { KONTAKTE.splice(i, 1); }
  }
}
const wert = (id, fallback) => { const e = $(id); return e ? e.value.trim() : (fallback || ''); };

/* ── Aktivität ───────────────────────────────────────────────────── */
function aktNeu(heute, feld) {
  aufraeumen();
  const a = { id:naechsteId(), t:'', b:ersterBereichId(), prio:'B', min:30,
              wer:'', beginn:'', ende:'', glyph:'\u2022', heute:!!heute };
  AKTIVITAETEN.push(a);
  zelleOeffnen('akt', a.id, feld || 't');
}

/* ═══════════════════════════════════════════════════════════════════
   ZELLBEARBEITUNG
   Jede Zelle ist Klickfläche. Textzellen öffnen ein Feld, Kästchen und
   Priorität schalten weiter. Tab springt zur nächsten Zelle derselben
   Zeile, Tab in der letzten Zelle legt eine neue Zeile an.
   ═══════════════════════════════════════════════════════════════════ */
const FELDFOLGE = {
  tag:  ['t', 'ende', 'min'],
  voll: ['t', 'wer', 'beginn', 'ende', 'min'],
};
let editZelle = null;   // { art, id, feld }
let wahlModus = 'ereignis';   // 'ereignis' oder 'vorhaben'

function zelleOffen(art, id, feld) {
  return editZelle !== null && editZelle.art === art &&
         editZelle.id === id && editZelle.feld === feld;
}
function zelleOeffnen(art, id, feld) {
  editZelle = { art:art, id:id, feld:feld };
  editTermin = null;
  aufraeumen();
  fokusZiel = 'ez';
  renderAlles();
}
function zelleWert() {
  const e = $('ez');
  return e ? e.value.trim() : '';
}
function zelleSchreiben() {
  if (!editZelle) { return; }
  const v = zelleWert();
  if (editZelle.art === 'kontakt') {
    const k = KONTAKTE.find(x => x.id === editZelle.id);
    if (k) { k.t = v; }
    return;
  }
  const a = AKTIVITAETEN.find(x => x.id === editZelle.id);
  if (!a) { return; }
  if (editZelle.feld === 'min') { a.min = parseInt(v, 10) || 0; }
  else { a[editZelle.feld] = v; }
}
function zelleSchliessen(sofort) {
  zelleSchreiben();
  if (sofort) {
    editZelle = null;
    aufraeumen();
    renderAlles();
    return;
  }
  /* Beim Verlassen per Blur kurz warten: klickt der Finger auf eine
     Nachbarzelle, hat diese das Feld längst neu gesetzt und der Neuaufbau
     darf sie nicht wieder schließen.                                    */
  const merk = editZelle;
  setTimeout(function () {
    if (editZelle === merk) {
      editZelle = null;
      aufraeumen();
      renderAlles();
    }
  }, 120);
}
function zelleWeiter(folgeName) {
  if (!editZelle) { return; }
  zelleSchreiben();
  const folge = FELDFOLGE[folgeName] || FELDFOLGE.tag;
  const i = folge.indexOf(editZelle.feld);
  const art = editZelle.art;
  const id = editZelle.id;
  if (art === 'kontakt' || i === -1 || i === folge.length - 1) {
    editZelle = null;
    aufraeumen();
    if (art === 'kontakt') { kontaktNeu(); }
    else {
      const a = AKTIVITAETEN.find(x => x.id === id);
      aktNeu(a ? a.heute : false, folge[0]);
    }
    return;
  }
  zelleOeffnen(art, id, folge[i + 1]);
}
function zelleTaste(ev, folgeName) {
  if (ev.key === 'Enter')  { ev.preventDefault(); zelleSchliessen(true); }
  if (ev.key === 'Escape') { ev.preventDefault(); abbrechen(); }
  if (ev.key === 'Tab')    { ev.preventDefault(); zelleWeiter(folgeName); }
}

/* ── Freitextzeilen: Motto und Reflexion ─────────────────────────── */
function freiOeffnen(art, i) {
  editZelle = { art:art, id:i, feld:'zeile' };
  editTermin = null;
  aufraeumen();
  fokusZiel = 'ez';
  renderAlles();
}
function freiSchreiben() {
  if (!editZelle) { return; }
  const e = $('ez');
  if (!e) { return; }
  if (editZelle.art === 'motto')      { TAG.motto[editZelle.id] = e.value; }
  if (editZelle.art === 'reflexion')  { TAG.reflexion[editZelle.id] = e.value; }
  if (editZelle.art === 'mreflexion') { monatBlatt().reflexion[editZelle.id] = e.value; }
  if (editZelle.art === 'wreflexion') { wocheBlatt().reflexion[editZelle.id] = e.value; }
}
function freiSchliessen(sofort) {
  freiSchreiben();
  if (sofort) { editZelle = null; renderAlles(); return; }
  const merk = editZelle;
  setTimeout(function () {
    if (editZelle === merk) { editZelle = null; renderAlles(); }
  }, 120);
}
function freiTaste(ev, art, i, anzahl) {
  if (ev.key === 'Escape') { ev.preventDefault(); editZelle = null; renderAlles(); }
  if (ev.key === 'Enter' || ev.key === 'Tab') {
    ev.preventDefault();
    freiSchreiben();
    if (i + 1 < anzahl) { freiOeffnen(art, i + 1); }
    else { editZelle = null; renderAlles(); }
  }
}
/* Eine Schreibzeile: Anzeige oder offenes Feld */
function freiZeile(art, i, text, anzahl, klasseZ, klasseT) {
  if (editZelle && editZelle.art === art && editZelle.id === i) {
    return '<div class="' + klasseZ + ' offen"><input class="zf" id="ez" value="' +
      esc(text) + '" onblur="freiSchliessen()" onkeydown="freiTaste(event, \'' + art +
      '\',' + i + ',' + anzahl + ')"></div>';
  }
  return '<div class="' + klasseZ + '" onclick="freiOeffnen(\'' + art + '\',' + i + ')">' +
    '<span class="' + klasseT + '">' + esc(text) + '</span></div>';
}

/* Erzeugt eine Tabellenzelle: entweder Anzeige oder offenes Eingabefeld */
function zelle(art, id, feld, wertText, folgeName, klasse, platzhalter) {
  const kl = 'z ' + (klasse || '');
  if (zelleOffen(art, id, feld)) {
    const rechts = (klasse || '').indexOf('r') !== -1 ||
                   (klasse || '').indexOf('dat') !== -1;
    return '<td class="' + kl + ' offen"><input class="zf ' + (rechts ? 'r' : '') +
      '" id="ez" value="' + esc(wertText) + '" placeholder="' + esc(platzhalter || '') +
      '" onblur="zelleSchliessen()" onkeydown="zelleTaste(event, \'' + folgeName + '\')"></td>';
  }
  return '<td class="' + kl + '" onclick="zelleOeffnen(\'' + art + '\',' + id + ',\'' +
    feld + '\')">' + esc(wertText) + '</td>';
}
/* ── Termin ──────────────────────────────────────────────────────── */
function minZuZeit(m) {
  return String(Math.floor(m / 60)).padStart(2,'0') + ':' + String(m % 60).padStart(2,'0');
}
function terminNeu(min) {
  aufraeumen();
  editAkt = null; editKontakt = null;
  const t = { id:naechsteId(), tag:HEUTE_WT, von:minZuZeit(min), bis:minZuZeit(min + 60),
              ganztags:false, ort:'', t:'' };
  TERMINE.push(t);
  editTermin = t.id;
  fokusZiel = 'et-t';
  renderAlles();
}
function terminOeffnen(id) {
  aufraeumen();
  editAkt = null; editKontakt = null;
  editTermin = id;
  fokusZiel = 'et-t';
  renderAlles();
}
function terminSpeichern() {
  const t = TERMINE.find(x => x.id === editTermin);
  if (!t) { return; }
  t.t   = wert('et-t');
  t.von = wert('et-v', t.von) || t.von;
  t.bis = wert('et-b', t.bis) || t.bis;
  t.ort = wert('et-o');
  if (!t.t) { abbrechen(); return; }
  editTermin = null;
  aufraeumen();
  renderAlles();
}
function terminEdit(t) {
  /* Ort steht auf einer eigenen Zeile mit Mindestbreite. Vorher teilte er
     sich die Zeile mit Von, Bis und Auswahlfeld und wurde auf null Breite
     zusammengedrückt — dadurch war er nicht beschreibbar.               */
  return '<div class="termin bearbeitet">' +
    '<input class="ef titel" id="et-t" value="' + esc(t.t) + '" placeholder="Termin" ' +
    'style="width:100%" onkeydown="tastatur(event, terminSpeichern)">' +
    '<div class="te-zeile">' +
    '<input class="ef" id="et-v" value="' + esc(t.von) + '" style="width:44px" ' +
    'inputmode="numeric" onkeydown="tastatur(event, terminSpeichern)">' +
    '<span class="t-meta">bis</span>' +
    '<input class="ef" id="et-b" value="' + esc(t.bis) + '" style="width:44px" ' +
    'inputmode="numeric" onkeydown="tastatur(event, terminSpeichern)">' +
    '<button class="tz-heute" style="flex:0 0 auto;margin-left:auto" ' +
    'onclick="terminSpeichern()">\u2713 fertig</button></div>' +
    '<div class="te-zeile">' +
    '<input class="ef" id="et-o" value="' + esc(t.ort) + '" placeholder="Ort" ' +
    'style="width:100%;min-width:120px" onkeydown="tastatur(event, terminSpeichern)">' +
    '</div></div>';
}

/* ── Kontakt ─────────────────────────────────────────────────────── */
function kontaktNeu() {
  aufraeumen();
  editTermin = null;
  const k = { id:naechsteId(), tag:HEUTE_WT, t:'', glyph:'\u2022' };
  KONTAKTE.push(k);
  zelleOeffnen('kontakt', k.id, 't');
}
function prioFeld(p) {
