/* ═══════════════════════════════════════════════════════════════════
   MONATSVORAUSPLANUNG (CMP 11)
   Bullet-Journal-Logik: das Blatt sammelt nicht automatisch ein. Ein
   Eintrag erscheint hier, weil du ihn aus den Beständen gehoben oder
   direkt auf dieses Blatt geschrieben hast.
   ═══════════════════════════════════════════════════════════════════ */

/* Löst einen Verweis auf. Fehlt das Ziel, bleibt der Eintrag stehen —
   mit Hinweis statt leerer Zeile.                                      */
function monatText(e) {
  if (!e.refArt) { return { t:e.t || '', herkunft:'', zusatz:'' }; }
  if (e.refArt === 'aktivitaet') {
    const a = AKTIVITAETEN.find(x => x.id === e.refId);
    return { t:a ? a.t : 'entfallen', herkunft:'Aktivität', zusatz:'' };
  }
  if (e.refArt === 'plan') {
    const p = PLAENE.find(x => x.id === e.refId);
    return { t:p ? p.t : 'entfallen', herkunft:'Plan', zusatz:'' };
  }
  if (e.refArt === 'ziel') {
    const z = ZIELE.find(x => x.id === e.refId);
    return { t:z ? z.t : 'entfallen', herkunft:'Ziel', zusatz:'' };
  }
  if (e.refArt === 'jahrestermin') {
    const j = JAHRESTERMINE.find(x => x.id === e.refId);
    if (!j) { return { t:'entfallen', herkunft:'Termin', zusatz:'' }; }
    /* Mehrtägiges steht am Anfangstag mit Hinweis auf das Ende — eine
       Zeile, nicht vierzehn.                                            */
    const bis = j.bis.slice(8) + '.' + j.bis.slice(5, 7) + '.';
    return { t:j.t, herkunft:'Termin', zusatz:(j.von !== j.bis ? 'bis ' + bis : '') };
  }
  return { t:e.t || '', herkunft:'', zusatz:'' };
}
/* Findet einen Eintrag in beiden Beständen */
function monatFinde(id) {
  const b = monatBlatt();
  return b.ereignisse.find(x => x.id === id) ||
         b.vorhaben.find(x => x.id === id) || null;
}
/* Liefert das offene Blatt; fehlt es, wird es leer angelegt. So entsteht
   jeder Monat beim ersten Betreten von selbst.                         */
function monatBlatt() {
  const jahr = parseInt(monatOffen.slice(0, 4), 10);
  const monat = parseInt(monatOffen.slice(5), 10);
  let b = MONATSBLAETTER.find(x => x.jahr === jahr && x.monat === monat);
  if (!b) {
    b = { jahr:jahr, monat:monat, ereignisse:[], vorhaben:[], reflexion:['', '', ''] };
    MONATSBLAETTER.push(b);
  }
  return b;
}
function monatSchluessel(jahr, monat) {
  return jahr + '-' + String(monat).padStart(2, '0');
}
function monatTage() {
  const b = monatBlatt();
  return new Date(Date.UTC(b.jahr, b.monat, 0)).getUTCDate();
}
/* Wochentag aus dem Kalender, nicht hinterlegt — sonst stimmt er nur
   fuer den einen Monat, fuer den er eingetragen wurde.                 */
function monatWochentag(tag) {
  const b = monatBlatt();
  const d = new Date(Date.UTC(b.jahr, b.monat - 1, tag)).getUTCDay();
  return (d + 6) % 7;          // 0 = Montag
}
function monatBlaettern(schritt) {
  const b = monatBlatt();
  let jahr = b.jahr, monat = b.monat + schritt;
  if (monat > 12) { monat = 1; jahr += 1; }
  if (monat < 1)  { monat = 12; jahr -= 1; }
  monatOffen = monatSchluessel(jahr, monat);
  editZelle = null;
  renderAlles();
}
/* Loescht einen Eintrag aus beiden Bestaenden. Umsortieren heisst
   loeschen und an anderer Stelle neu schreiben.                        */
function monatLoeschen(id) {
  const b = monatBlatt();
  [b.ereignisse, b.vorhaben].forEach(function (liste) {
    const i = liste.findIndex(x => x.id === id);
    if (i !== -1) { liste.splice(i, 1); }
  });
  editZelle = null;
  renderAlles();
}
function monatGlyph(id) {
  const e = monatFinde(id);
  if (!e) { return; }
  e.glyph = naechsterGlyph(e.glyph);
  renderAlles();
}
function monatEintragZeile(e) {
  const info = monatText(e);
  const kreuz = '<button class="mon-x" onclick="event.stopPropagation(); ' +
                'monatLoeschen(' + e.id + ')" title="Eintrag l\u00f6schen">\u00d7</button>';
  return '<div class="mon-e">' + hakFeld(e.glyph, 'monatGlyph(' + e.id + ')') +
    '<span class="mon-t2 ' + titelKlasse(e) +
    '" onclick="event.stopPropagation(); eintragOeffnen(\'monat\',' +
    (e.tag || 0) + ',' + e.id + ')">' + esc(info.t) +
    (info.zusatz ? ' <span class="mon-herkunft">' + esc(info.zusatz) + '</span>' : '') +
    '</span>' +
    (info.herkunft ? '<span class="mon-herkunft">' + esc(info.herkunft) + '</span>' : '') +
    kreuz + '</div>';
}
function blattMonat() {
  const b = monatBlatt();
  const tage = monatTage();
  const heutigerMonat = (b.jahr === 2026 && b.monat === 8);

  kopf(MONATE_LANG[b.monat - 1] + ' ' + b.jahr,
       'Monatsvorausplanung \u00b7 ' + b.ereignisse.length + ' Ereignisse, ' +
       b.vorhaben.length + ' Vorhaben',
       '<button class="k-btn" onclick="monatBlaettern(-1)">\u2039</button>' +
       '<button class="k-btn" onclick="monatBlaettern(1)">\u203a</button>' +
       '<button class="k-btn' + (zeigeKalender ? ' pri' : '') +
       '" onclick="kalenderUm()">Kalender</button>' +
       '<button class="k-btn" onclick="wahlAuf(\'ereignis\')">Termin</button>' +
       '<button class="k-btn" onclick="wahlAuf(\'vorhaben\')">Vorhaben</button>');

  const proTag = {};
  b.ereignisse.forEach(function (e) {
    if (!proTag[e.tag]) { proTag[e.tag] = []; }
    proTag[e.tag].push(e);
  });

  const haelfte = Math.ceil(tage / 2);
  function spalte(von, bis) {
    let h = '';
    for (let t = von; t <= bis; t++) {
      const wt = monatWochentag(t);
      const we = wt >= 5;
      const heute = heutigerMonat && (t === 19);
      const iso = isoDatum(b.jahr, b.monat, t);
      const fer = zeigeKalender ? ferienAn(iso) : null;
      const fei = zeigeKalender ? feiertagAn(iso) : null;
      h += '<div class="mon-t ' + (we ? 'we ' : '') + (heute ? 'heute ' : '') +
        (fer ? 'ferien' : '') + '">' +
        '<span class="mon-nr">' + String(t).padStart(2, '0') + ' ' + WOKURZ[wt] + '</span>' +
        '<span class="mon-inhalt" onclick="eintragOeffnen(\'monat\',' + t + ',null)">' +
        (fei ? '<div class="mon-fei">' + esc(fei) + '</div>' : '') +
        (proTag[t] || []).map(monatEintragZeile).join('') + '</span></div>';
    }
    return h;
  }

  let h = '<div class="mon-raster"><div>' + spalte(1, haelfte) + '</div>' +
          '<div>' + spalte(haelfte + 1, tage) + '</div></div>';

  h += '<div class="abschnitt">' + abschnitt('Vorhaben im Monat', 'ohne festen Tag');
  h += b.vorhaben.map(monatEintragZeile).join('');
  for (let i = 0; i < 2; i++) {
    h += '<div class="mon-t"><span class="mon-nr"></span>' +
         '<span class="mon-inhalt" onclick="eintragOeffnen(\'monat\',0,null)"></span></div>';
  }
  h += '</div>';

  h += '<div class="refl"><div class="refl-l">Reflexion des Monats</div>';
  for (let ri = 0; ri < b.reflexion.length; ri++) {
    h += freiZeile('mreflexion', ri, b.reflexion[ri], b.reflexion.length,
                   'refl-z', 'refl-t');
  }
  h += '</div>';

  $('blatt').innerHTML = h;
  fokusSetzen();
}

/* ── Auswahl aus den Beständen ───────────────────────────────────── */
function wahlAuf(modus) {
  wahlModus = modus;
  const fuerWoche = (modus === 'wtermin' || modus === 'waktivitaet');
  const b = fuerWoche ? wocheBlatt() : monatBlatt();
  const bestand = fuerWoche ? b.eintraege.concat(b.wichtig)
                            : b.ereignisse.concat(b.vorhaben);
  const drin = function (art, id) {
    return bestand.some(e => e.refArt === art && e.refId === id);
  };
  /* Auf dem Wochenblatt wird der Tag gleich mitgewählt — ein Tippen
     statt aufnehmen, suchen, verschieben.                              */
  const tagKnoepfe = function (art, id) {
    let t = '<div class="wahl-tage">';
    for (let d = 0; d < 7; d++) {
      t += '<button class="wahl-d ' + (wahlTag === d ? 'vor' : '') +
        '" onclick="event.stopPropagation(); wahlNehmen(\'' +
        art + '\',\'' + id + '\',' + d + ')">' + WOKURZ[d] + '</button>';
    }
    t += '<button class="wahl-d" onclick="event.stopPropagation(); wahlNehmen(\'' +
      art + '\',\'' + id + '\',-1)">\u2014</button></div>';
    return t;
  };
  const zeile = function (art, id, titel, meta, artName) {
    if (drin(art, id)) { return ''; }
    const klick = fuerWoche ? '' :
      ' onclick="wahlNehmen(\'' + art + '\',\'' + id + '\')"';
    return '<div class="wahl-l"' + klick + '>' +
      '<span class="wahl-art">' + esc(artName) + '</span>' +
      '<span class="wahl-t">' + esc(titel) +
      '<div class="wahl-m">' + esc(meta) + '</div>' +
      (fuerWoche ? tagKnoepfe(art, id) : '') + '</span></div>';
  };
  let h = '';
  if (modus === 'ereignis' || modus === 'wtermin') {
    const monat = fuerWoche ? 0 : b.monat;
    JAHRESTERMINE.forEach(function (j) {
      if (!fuerWoche &&
          parseInt(j.von.slice(5, 7), 10) !== monat &&
          parseInt(j.bis.slice(5, 7), 10) !== monat) { return; }
      if (fuerWoche) {
        /* Nur Termine, die diese Woche berühren */
        const so = tagPlus(b.montag, 6);
        if (j.bis < b.montag || j.von > so) { return; }
      }
      h += zeile('jahrestermin', j.id, j.t,
                 j.von.slice(8) + '.' + j.von.slice(5,7) + '. bis ' +
                 j.bis.slice(8) + '.' + j.bis.slice(5,7) + '.', 'Termin');
    });
    $('wahl-titel').textContent = fuerWoche ? 'Termin auf die Woche legen'
                                            : 'Termin aufs Monatsblatt heben';
    $('wahl-fuss').textContent = 'Alles Weitere schreibst du direkt in die Tagzeile.';
    if (!h) { h = '<div class="hinweis">Keine passenden Jahrestermine, ' +
                  'die nicht schon auf dem Blatt stehen.</div>'; }
  } else if (modus === 'zielzu') {
    const zid = unterAktiv.ziele;
    PLAENE.filter(p => !p.archiviert && !p.zielId).forEach(function (p) {
      h += '<div class="wahl-l" onclick="zielZuordnen(\'plan\',\'' + p.id + '\')">' +
        '<span class="wahl-art">Plan</span><span class="wahl-t">' + esc(p.t) +
        '<div class="wahl-m">' + esc(bName(p.b)) + '</div></span></div>';
    });
    AKTIVITAETEN.filter(a => offen(a) && !a.planId && !a.zielId).forEach(function (a) {
      h += '<div class="wahl-l" onclick="zielZuordnen(\'akt\',' + a.id + ')">' +
        '<span class="wahl-art">Aktivit\u00e4t</span><span class="wahl-t">' + esc(a.t) +
        '<div class="wahl-m">' + esc(bName(a.b)) + ' \u00b7 ' + a.min + ' Min</div></span></div>';
    });
    WIEDER.filter(w => !w.zielId).forEach(function (w) {
      h += '<div class="wahl-l" onclick="zielZuordnen(\'wied\',' + w.id + ')">' +
        '<span class="wahl-art">Wiederkehrend</span><span class="wahl-t">' + esc(w.t) +
        '<div class="wahl-m">' + esc(w.muster) + '</div></span></div>';
    });
    GEWOHNHEIT.filter(g => !g.zielId).forEach(function (g) {
      h += '<div class="wahl-l" onclick="zielZuordnen(\'gew\',' + g.id + ')">' +
        '<span class="wahl-art">Gewohnheit</span><span class="wahl-t">' + esc(g.t) +
        '<div class="wahl-m">' + esc(g.ziel) + '</div></span></div>';
    });
    $('wahl-titel').textContent = 'Diesem Ziel zuordnen';
    $('wahl-fuss').textContent = 'Planaktivit\u00e4ten zahlen \u00fcber ihren Plan ein.';
    if (!h) { h = '<div class="hinweis">Nichts Freies mehr vorhanden \u2014 alles ist ' +
                  'bereits einem Ziel zugeordnet.</div>'; }
  } else if (modus === 'planakt') {
    AKTIVITAETEN.filter(a => offen(a) && !a.planId).forEach(function (a) {
      h += '<div class="wahl-l" onclick="planZuordnen(' + a.id + ')">' +
        '<span class="wahl-art">Aktivit\u00e4t</span>' +
        '<span class="wahl-t">' + esc(a.t) +
        '<div class="wahl-m">' + esc(bName(a.b)) + ' \u00b7 ' + a.min + ' Min</div></span></div>';
    });
    $('wahl-titel').textContent = 'Aktivit\u00e4t diesem Plan zuordnen';
    $('wahl-fuss').textContent = 'Die Aktivit\u00e4t bleibt in der Checkliste und tr\u00e4gt dort ein \u2192.';
    if (!h) { h = '<div class="hinweis">Keine freien offenen Aktivit\u00e4ten \u2014 ' +
                  'alle sind bereits einem Plan zugeordnet.</div>'; }
  } else if (modus === 'waktivitaet') {
    AKTIVITAETEN.filter(offen).forEach(function (a) {
      h += zeile('aktivitaet', a.id, a.t,
                 bName(a.b) + ' \u00b7 ' + a.min + ' Min' +
                 (a.ende ? ' \u00b7 Ende ' + a.ende : ''), 'Aktivit\u00e4t');
    });
    $('wahl-titel').textContent = wahlTag >= 0
      ? 'Aktivit\u00e4t auf ' + WOTAGE[wahlTag] + ' legen'
      : 'Aktivit\u00e4t auf die Woche verteilen';
    $('wahl-fuss').textContent = 'Der Eintrag bleibt ein Verweis \u2014 einmal abhaken gen\u00fcgt.';
    if (!h) { h = '<div class="hinweis">Alle offenen Aktivit\u00e4ten liegen ' +
                  'bereits auf dieser Woche.</div>'; }
  } else {
    AKTIVITAETEN.filter(offen).forEach(function (a) {
      h += zeile('aktivitaet', a.id, a.t, bName(a.b), 'Aktivit\u00e4t');
    });
    PLAENE.forEach(function (p) { h += zeile('plan', p.id, p.t, bName(p.b), 'Plan'); });
    ZIELE.forEach(function (z) { h += zeile('ziel', z.id, z.t, 'Frist ' + z.frist, 'Ziel'); });
    $('wahl-titel').textContent = 'Vorhaben f\u00fcr diesen Monat';
    $('wahl-fuss').textContent = 'Vorhaben bekommen bewusst keinen Tag.';
    if (!h) { h = '<div class="hinweis">Alles bereits auf dem Monatsblatt.</div>'; }
  }
  $('wahl-inhalt').innerHTML = h;
  $('wahl').classList.add('auf');
}
function wahlZu() { $('wahl').classList.remove('auf'); }
/* Das + einer Tagzeile oeffnet die Auswahl mit diesem Tag vorbelegt —
   der Umweg ueber den Blattkopf entfaellt.                            */
let wahlTag = -1;
function wocheWahl(tag) {
  wahlTag = tag;
  wahlAuf('waktivitaet');
}
function zielZuordnen(art, id) {
  const zid = unterAktiv.ziele;
  const l = art === 'plan' ? PLAENE : art === 'akt' ? AKTIVITAETEN
          : art === 'wied' ? WIEDER : GEWOHNHEIT;
  const x = l.find(y => y.id === id);
  if (x) { x.zielId = zid; }
  wahlZu();
  renderAlles();
  melde('Dem Ziel zugeordnet');
}
function planZuordnen(aid) {
  const a = AKTIVITAETEN.find(x => x.id === aid);
  if (a) { a.planId = unterAktiv.plaene; }
  wahlZu();
  renderAlles();
  melde('Dem Plan zugeordnet');
}
function wahlNehmen(art, id, tag) {
  const echteId = (art === 'aktivitaet' || art === 'jahrestermin') ? parseInt(id, 10) : id;
  if (wahlModus === 'wtermin' || wahlModus === 'waktivitaet') {
    const b = wocheBlatt();
    const e = { id:naechsteId(), refArt:art, refId:echteId };
    if (art !== 'aktivitaet') { e.glyph = '\u2022'; }
    if (tag >= 0) { e.tag = tag; b.eintraege.push(e); melde('Auf ' + WOTAGE[tag] + ' gelegt'); }
    else { b.wichtig.push(e); melde('Als wichtig f\u00fcr diese Woche gesetzt'); }
    wahlTag = -1;
    wahlZu();
    renderAlles();
    return;
  }
  const b = monatBlatt();
  if (wahlModus === 'ereignis') {
    const j = JAHRESTERMINE.find(x => x.id === echteId);
    let t = 1;
    if (j && parseInt(j.von.slice(5, 7), 10) === b.monat) { t = parseInt(j.von.slice(8), 10); }
    b.ereignisse.push({ id:naechsteId(), tag:t, glyph:'\u2022', refArt:art, refId:echteId });
    melde('Als Ereignis am ' + t + '. eingetragen');
  } else {
    b.vorhaben.push({ id:naechsteId(), glyph:'\u2022', refArt:art, refId:echteId });
    melde('Als Vorhaben f\u00fcr diesen Monat gesetzt');
  }
  wahlZu();
  renderAlles();
}

/* ═══════════════════════════════════════════════════════════════════
   JAHRESTERMINE (CMP 21)
   Zwoelf Monatsspalten, 31 Tagzeilen. Abwesenheit wird als Flaeche
   sichtbar — das ist der Zweck des Blattes.
   ═══════════════════════════════════════════════════════════════════ */

function isoDatum(jahr, monat, tag) {
  return jahr + '-' + String(monat).padStart(2, '0') + '-' + String(tag).padStart(2, '0');
}
function tageImMonat(jahr, monat) {
  return new Date(Date.UTC(jahr, monat, 0)).getUTCDate();
}
function wochentagVon(jahr, monat, tag) {
  return (new Date(Date.UTC(jahr, monat - 1, tag)).getUTCDay() + 6) % 7;
}
/* Alle Termine, die diesen Tag beruehren. Der Vergleich laeuft ueber
   ISO-Zeichenketten — damit stimmt auch der Jahreswechsel.            */
function jtAnTag(iso) {
  return JAHRESTERMINE.filter(j => iso >= j.von && iso <= j.bis);
}
function jtKuerzel(t) {
  const w = t.split(' ');
  if (w.length === 1) { return t.slice(0, 6); }
  return w.map(x => x.charAt(0)).join('').slice(0, 4);
}
function jahrBlaettern(schritt) { jahrOffen += schritt; renderAlles(); }
function kalenderUm() { zeigeKalender = !zeigeKalender; renderAlles(); }

function blattJahrestermine() {
  const anzahl = JAHRESTERMINE.filter(function (j) {
    return j.von.slice(0, 4) === String(jahrOffen) || j.bis.slice(0, 4) === String(jahrOffen);
  }).length;
  kopf('Jahrestermine ' + jahrOffen, anzahl + ' Eintr\u00e4ge \u00b7 Tag antippen zum Erfassen',
       '<button class="k-btn" onclick="jahrBlaettern(-1)">\u2039</button>' +
       '<button class="k-btn" onclick="jahrBlaettern(1)">\u203a</button>' +
       '<button class="k-btn' + (zeigeKalender ? ' pri' : '') +
       '" onclick="kalenderUm()">Ferien &amp; Feiertage</button>');

  let h = '<table class="jt-tab"><colgroup><col style="width:30px">';
  for (let m = 0; m < 12; m++) { h += '<col>'; }
  h += '</colgroup><thead><tr><th></th>' +
       MONATE.map(function (m) { return '<th>' + m + '</th>'; }).join('') +
       '</tr></thead><tbody>';

  for (let tag = 1; tag <= 31; tag++) {
    h += '<tr><td class="tagnr">' + tag + '</td>';
    for (let monat = 1; monat <= 12; monat++) {
      if (tag > tageImMonat(jahrOffen, monat)) { h += '<td class="leer"></td>'; continue; }
      const iso = isoDatum(jahrOffen, monat, tag);
      const wt = wochentagVon(jahrOffen, monat, tag);
      const treffer = jtAnTag(iso);
      const heute = (iso === HEUTE_ISO);
      const fer = zeigeKalender ? ferienAn(iso) : null;
      const fei = zeigeKalender ? feiertagAn(iso) : null;
      let kl = 'frei ' + (wt >= 5 ? 'we ' : '') + (heute ? 'heute ' : '') +
               (fer ? 'ferien ' : '') + (fei ? 'feiertag' : '');
      /* Ueberschneidungen werden gezeigt, nicht verdeckt: liegen mehrere
         Termine auf einem Tag, teilen sie sich die Zellenbreite. Ein
         einzelner Balken darf sonst einen zweiten verschlucken.        */
      let inhalt = fei ? '<span class="jt-fei" title="' + esc(fei) +
                         (fer ? ' \u00b7 ' + esc(fer) : '') + '"></span>' : '';
      const anz = Math.min(treffer.length, 3);
      treffer.slice(0, 3).forEach(function (j, i) {
        const start = (iso === j.von);
        const ende = (iso === j.bis);
        const eintag = start && ende;
        const form = eintag ? 'eintag' : (start ? 'start' : (ende ? 'ende' : ''));
        const breite = 100 / anz;
        const stil = anz > 1
          ? 'left:' + (i * breite) + '%;right:' + ((anz - 1 - i) * breite) + '%;'
          : '';
        inhalt += '<span class="jt-bal ' + form + '" style="' + stil + 'background:' +
          (JT_ARTEN[j.art] || JT_ARTEN.termin).f + '" onclick="event.stopPropagation(); ' +
          'jtOeffnen(' + j.id + ')" title="' + esc(j.t) + '"></span>';
      });
      if (anz === 1 && treffer[0].von === iso) {
        inhalt += '<span class="jt-kuerzel">' + esc(jtKuerzel(treffer[0].t)) + '</span>';
      }
      h += '<td class="' + kl + '" onclick="jtNeu(' + monat + ',' + tag + ')">' +
           inhalt + '</td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table>';

  const liste = JAHRESTERMINE.filter(function (j) {
    return j.von.slice(0, 4) === String(jahrOffen) || j.bis.slice(0, 4) === String(jahrOffen);
  }).sort(function (a, b) { return a.von < b.von ? -1 : 1; });

  h += '<div class="abschnitt">' + abschnitt('Eintr\u00e4ge', jahrOffen + '');
  h += liste.map(function (j) {
    const a = JT_ARTEN[j.art] || JT_ARTEN.termin;
    const tage = Math.round(
      (Date.parse(j.bis) - Date.parse(j.von)) / 86400000) + 1;
    return '<div class="jt-leg" onclick="jtOeffnen(' + j.id + ')">' +
      '<span class="jt-farbe" style="background:' + a.f + '"></span>' +
      '<span class="jt-lt">' + esc(j.t) +
      '<div class="jt-lm">' + esc(a.n) + (j.ort ? ' \u00b7 ' + esc(j.ort) : '') +
      ' \u00b7 ' + tage + (tage === 1 ? ' Tag' : ' Tage') + '</div></span>' +
      '<span class="jt-ldat">' + esc(jtKurz(j.von)) +
      (j.von !== j.bis ? ' \u2013 ' + esc(jtKurz(j.bis)) : '') + '</span></div>';
  }).join('');
  if (!liste.length) {
    h += '<div class="hinweis">Noch keine Eintr\u00e4ge in diesem Jahr. ' +
         'Tippe einen Tag im Raster an.</div>';
  }
  h += '</div>';

  /* Summierung je Art. Gezaehlt werden Kalendertage, und nur die, die
     tatsaechlich in dieses Jahr fallen — ein Eintrag ueber den
     Jahreswechsel zaehlt in beiden Jahren nur seinen Anteil.          */
  const summen = {};
  Object.keys(JT_ARTEN).forEach(function (k) { summen[k] = { n:0, tage:0 }; });
  JAHRESTERMINE.forEach(function (j) {
    const a = j.von.slice(0, 4) === String(jahrOffen) ? j.von : jahrOffen + '-01-01';
    const e = j.bis.slice(0, 4) === String(jahrOffen) ? j.bis : jahrOffen + '-12-31';
    if (j.von.slice(0, 4) > String(jahrOffen) || j.bis.slice(0, 4) < String(jahrOffen)) { return; }
    const tage = Math.round((Date.parse(e) - Date.parse(a)) / 86400000) + 1;
    const art = JT_ARTEN[j.art] ? j.art : 'termin';
    summen[art].n += 1;
    summen[art].tage += tage;
  });
  const zeilen = Object.keys(JT_ARTEN).filter(k => summen[k].n > 0);
  if (zeilen.length) {
    h += '<div class="abschnitt">' + abschnitt('Summe je Art', 'Kalendertage ' + jahrOffen);
    h += zeilen.map(function (k) {
      const a = JT_ARTEN[k], su = summen[k];
      return '<div class="jt-sum"><span class="jt-farbe" style="background:' + a.f +
        '"></span><span class="jt-lt">' + esc(a.n) + '</span>' +
        '<span class="jt-sum-n">' + su.n + (su.n === 1 ? ' Eintrag' : ' Eintr\u00e4ge') + '</span>' +
        '<span class="jt-sum-t">' + su.tage + (su.tage === 1 ? ' Tag' : ' Tage') + '</span></div>';
    }).join('');
    const gesamt = zeilen.reduce(function (n, k) { return n + summen[k].tage; }, 0);
    h += '<div class="jt-sum jt-sum-g"><span class="jt-farbe" style="background:none"></span>' +
      '<span class="jt-lt">Zusammen</span><span class="jt-sum-n"></span>' +
      '<span class="jt-sum-t">' + gesamt + ' Tage</span></div>';
    h += '</div>';
  }

  if (zeigeKalender) {
    h += '<div class="hinweis">Get\u00f6nte Zellen sind bayerische Schulferien, der ' +
      'kleine Punkt markiert einen gesetzlichen Feiertag. Beides ist nur ' +
      'Anhaltspunkt \u2014 nicht bearbeitbar und nicht in der Summierung. ' +
      'Feiertage werden gerechnet, die Ferienliste reicht bis Sommer 2027.</div>';
  }
  $('blatt').innerHTML = h;
}
function jtKurz(iso) { return iso.slice(8) + '.' + iso.slice(5, 7) + '.'; }

/* ── Erfassen und Bearbeiten ─────────────────────────────────────── */
let jtOffen = null;
function jtNeu(monat, tag) {
  const iso = isoDatum(jahrOffen, monat, tag);
  const j = { id:naechsteId(), t:'', von:iso, bis:iso, ort:'', art:'termin' };
  JAHRESTERMINE.push(j);
  jtOeffnen(j.id);
}
function jtOeffnen(id) {
  jtOffen = id;
  const j = JAHRESTERMINE.find(x => x.id === id);
  if (!j) { return; }
  const artOpt = Object.keys(JT_ARTEN).map(function (k) {
    return '<option value="' + k + '"' + (k === j.art ? ' selected' : '') + '>' +
           JT_ARTEN[k].n + '</option>';
  }).join('');
  $('jt-inhalt').innerHTML =
    '<div style="width:100%">' +
    '<div class="jt-feld"><label>Titel</label>' +
    '<input id="jt-t" value="' + esc(j.t) + '" placeholder="Bezeichnung"></div>' +
    '<div class="jt-feld"><label>Von</label>' +
    '<input id="jt-von" value="' + esc(j.von) + '" placeholder="JJJJ-MM-TT"></div>' +
    '<div class="jt-feld"><label>Bis</label>' +
    '<input id="jt-bis" value="' + esc(j.bis) + '" placeholder="JJJJ-MM-TT"></div>' +
    '<div class="jt-feld"><label>Ort</label>' +
    '<input id="jt-ort" value="' + esc(j.ort) + '" placeholder="optional"></div>' +
    '<div class="jt-feld"><label>Art</label>' +
    '<select id="jt-art">' + artOpt + '</select></div></div>';
  $('jt').classList.add('auf');
  setTimeout(function () { const e = $('jt-t'); if (e) { e.focus(); } }, 60);
}
function jtZu() {
  /* Ein ohne Titel geschlossener Eintrag war ein Fehlgriff und geht wieder */
  const j = JAHRESTERMINE.find(x => x.id === jtOffen);
  if (j && !j.t) { jtLoeschen(true); return; }
  $('jt').classList.remove('auf');
  jtOffen = null;
  renderAlles();
}
function jtSpeichern() {
  const j = JAHRESTERMINE.find(x => x.id === jtOffen);
  if (!j) { jtZu(); return; }
  j.t = $('jt-t').value.trim();
  j.ort = $('jt-ort').value.trim();
  j.art = $('jt-art').value;
  let von = $('jt-von').value.trim();
  let bis = $('jt-bis').value.trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(von)) { von = j.von; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(bis)) { bis = von; }
  /* Ende vor Anfang waere ein Balken ins Nichts */
  if (bis < von) { const x = von; von = bis; bis = x; }
  j.von = von;
  j.bis = bis;
  if (!j.t) { jtLoeschen(true); return; }
  $('jt').classList.remove('auf');
  jtOffen = null;
  renderAlles();
}
function jtLoeschen(still) {
  const i = JAHRESTERMINE.findIndex(x => x.id === jtOffen);
  if (i !== -1) { JAHRESTERMINE.splice(i, 1); }
  $('jt').classList.remove('auf');
  jtOffen = null;
  if (!still) { melde('Jahrestermin gel\u00f6scht'); }
  renderAlles();
}

/* ═══════════════════════════════════════════════════════════════════
   EINTRAGSDIALOG für Wochen- und Monatsblatt
   Die Zeile allein sagt nicht, ob ein Termin, eine Aufgabe oder eine
   Notiz gemeint ist. Der Dialog fragt es und blendet nur die Felder
   ein, die zur gewählten Art gehören.
   ═══════════════════════════════════════════════════════════════════ */
let edKontext = null;   // { blatt, id, art, tag, titel, zeit }

function eintragOeffnen(blatt, tag, id) {
  let e = null;
  if (id) { e = (blatt === 'woche') ? wocheFinde(id) : monatFinde(id); }
  let art;
  if (e && e.refArt) { art = 'verweis'; }
  else if (blatt === 'woche') { art = (e && e.zeit) ? 'termin' : (e ? 'notiz' : 'termin'); }
  else { art = (e && typeof e.tag === 'number' && e.tag > 0) ? 'ereignis'
                                                            : (e ? 'vorhaben' : 'ereignis'); }
  if (blatt === 'monat' && !e) { art = tag > 0 ? 'ereignis' : 'vorhaben'; }
  edKontext = {
    blatt: blatt,
    id: id || null,
    art: art,
    tag: (e && typeof e.tag === 'number') ? e.tag : tag,
    titel: e ? (e.refArt ? (blatt === 'woche' ? wocheText(e).t : monatText(e).t) : (e.t || '')) : '',
    zeit: e ? (e.zeit || '') : '',
  };
  eintragRender();
  $('eintrag').classList.add('auf');
  setTimeout(function () { const f = $('ed-titel'); if (f && edKontext.art !== 'verweis') { f.focus(); } }, 60);
}
function eintragArt(a) {
  eintragMerken();
  edKontext.art = a;
  if (edKontext.blatt === 'monat') {
    /* Ein Vorhaben trägt bewusst keinen Tag */
    if (a === 'vorhaben') { edKontext.tag = 0; }
    else if (edKontext.tag < 1) { edKontext.tag = 1; }
  }
  eintragRender();
}
function eintragTag(t) { eintragMerken(); edKontext.tag = t; eintragRender(); }
function eintragMerken() {
  const f = $('ed-titel'); if (f) { edKontext.titel = f.value; }
  const z = $('ed-zeit');  if (z) { edKontext.zeit = z.value.trim(); }
  const m = $('ed-mtag');  if (m) { edKontext.tag = parseInt(m.value, 10) || edKontext.tag; }
}
function eintragRender() {
  const k = edKontext;
  const woche = (k.blatt === 'woche');
  $('eintrag-titel').textContent = (k.id ? 'Eintrag bearbeiten' : 'Neuer Eintrag') +
    (woche ? ' \u00b7 Woche' : ' \u00b7 Monat');
  $('eintrag-loeschen').style.display = k.id ? '' : 'none';

  let h = '';
  if (k.art === 'verweis') {
    h += '<div class="ed-l">Verweis</div><input class="ed-f" value="' + esc(k.titel) +
      '" disabled>';
    h += '<div class="ed-hin">Dieser Eintrag verweist auf einen anderen Bestand. ' +
      'Titel und Zustand werden dort gepflegt \u2014 hier l\u00e4sst sich nur der Tag ' +
      '\u00e4ndern oder der Verweis entfernen.</div>';
  } else {
    const arten = woche
      ? [['termin', 'Termin'], ['aufgabe', 'Aufgabe'], ['notiz', 'Notiz']]
      : [['ereignis', 'Ereignis'], ['vorhaben', 'Vorhaben']];
    h += '<div class="ed-l">Was ist es?</div><div class="ed-art">';
    h += arten.map(function (a) {
      return '<button class="ed-a ' + (k.art === a[0] ? 'aktiv' : '') +
        '" onclick="eintragArt(\'' + a[0] + '\')">' + a[1] + '</button>';
    }).join('') + '</div>';

    h += '<div class="ed-l">Bezeichnung</div>';
    if (k.art === 'termin') {
      h += '<div class="ed-zeile">' +
        '<input class="ed-f" id="ed-zeit" value="' + esc(k.zeit) +
        '" placeholder="hh:mm" inputmode="numeric" style="width:88px;flex:0 0 88px">' +
        '<input class="ed-f" id="ed-titel" value="' + esc(k.titel) +
        '" placeholder="Worum geht es?"></div>';
    } else {
      h += '<input class="ed-f" id="ed-titel" value="' + esc(k.titel) +
        '" placeholder="Worum geht es?">';
    }
    if (k.art === 'aufgabe') {
      h += '<div class="ed-hin">Eine Aufgabe wird als echte Aktivit\u00e4t angelegt und ' +
        'steht danach auch in der Checkliste. Der Eintrag hier ist ein Verweis darauf \u2014 ' +
        'einmal abhaken gen\u00fcgt.</div>';
    }
  }

  const ohneTag = (!woche && k.art === 'vorhaben');
  if (!ohneTag) {
    h += '<div class="ed-l">' + (woche ? 'Welcher Tag?' : 'Welcher Tag im Monat?') + '</div>';
    if (woche) {
      h += '<div class="ed-tage">';
      for (let d = 0; d < 7; d++) {
        h += '<button class="ed-t ' + (k.tag === d ? 'aktiv' : '') +
          '" onclick="eintragTag(' + d + ')">' + WOKURZ[d] + '</button>';
      }
      h += '<button class="ed-t ' + (k.tag === -1 ? 'aktiv' : '') +
        '" onclick="eintragTag(-1)">ohne</button></div>';
    } else {
      h += '<input class="ed-f" id="ed-mtag" value="' + (k.tag > 0 ? k.tag : 1) +
        '" inputmode="numeric" style="width:88px">';
    }
  }

  if (!k.id) {
    h += '<div class="ed-zu" onclick="eintragZuordnen()">Stattdessen Vorhandenes ' +
      'zuordnen \u2026</div>';
  }
  $('eintrag-inhalt').innerHTML = h;
}
function eintragZu() { $('eintrag').classList.remove('auf'); edKontext = null; }
function eintragZuordnen() {
  const k = edKontext;
  const blatt = k.blatt, tag = k.tag;
  eintragZu();
  if (blatt === 'woche') { wocheWahl(tag >= 0 ? tag : -1); }
  else { wahlAuf(k.art === 'vorhaben' ? 'vorhaben' : 'ereignis'); }
}
function eintragLoeschen() {
  const k = edKontext;
  if (!k || !k.id) { return; }
  if (k.blatt === 'woche') { wocheLoeschen(k.id); } else { monatLoeschen(k.id); }
  eintragZu();
}
function eintragSpeichern() {
  eintragMerken();
  const k = edKontext;
  const titel = (k.titel || '').trim();

  if (k.art === 'verweis') {
    const e = (k.blatt === 'woche') ? wocheFinde(k.id) : monatFinde(k.id);
    if (e) {
      if (k.blatt === 'woche') { if (k.tag >= 0) { e.tag = k.tag; } }
      else if (k.tag > 0) { e.tag = k.tag; }
    }
    eintragZu(); renderAlles(); return;
  }
  if (!titel) { melde('Ohne Bezeichnung geht es nicht'); return; }

  if (k.blatt === 'woche') {
    const b = wocheBlatt();
    let e = k.id ? wocheFinde(k.id) : null;
    if (k.art === 'aufgabe' && !k.id) {
      /* Eine Aufgabe entsteht als echte Aktivitaet; das Wochenblatt
         traegt nur den Verweis darauf.                              */
      const a = { id:naechsteId(), t:titel, b:ersterBereichId(), prio:'B', min:0, wer:'',
                  beginn:'', ende:'', glyph:'\u2022', heute:false, planId:null, zielId:null };
      AKTIVITAETEN.push(a);
      e = { id:naechsteId(), refArt:'aktivitaet', refId:a.id };
      if (k.tag >= 0) { e.tag = k.tag; b.eintraege.push(e); } else { b.wichtig.push(e); }
      eintragZu(); renderAlles(); melde('Als Aktivit\u00e4t angelegt und verwiesen'); return;
    }
    if (!e) {
      e = { id:naechsteId(), glyph:'\u2022', zeit:'', t:'' };
      if (k.tag >= 0) { e.tag = k.tag; b.eintraege.push(e); } else { b.wichtig.push(e); }
    } else if (k.tag >= 0 && typeof e.tag === 'number') { e.tag = k.tag; }
    e.t = titel;
    e.zeit = (k.art === 'termin') ? (k.zeit || '') : '';
    eintragZu(); renderAlles(); return;
  }

  const b = monatBlatt();
  let e = k.id ? monatFinde(k.id) : null;
  if (!e) {
    e = { id:naechsteId(), glyph:'\u2022', t:'' };
    if (k.art === 'ereignis') { e.tag = Math.min(Math.max(k.tag, 1), monatTage());
                                b.ereignisse.push(e); }
    else { b.vorhaben.push(e); }
  } else if (k.art === 'ereignis' && typeof e.tag === 'number') {
    e.tag = Math.min(Math.max(k.tag, 1), monatTage());
  }
  e.t = titel;
  eintragZu(); renderAlles();
}

/* ═══ ARCHIV (CMP 41) ═══════════════════════════════════════════════
   Archivierte Pläne werden nicht kopiert, sondern nur ausgeblendet.
   Von hier aus lassen sie sich öffnen und wieder aktivieren.
   ═══════════════════════════════════════════════════════════════════ */
function blattArchiv() {
  const l = PLAENE.filter(p => p.archiviert);
  const lz = ZIELE.filter(z => z.archiviert);
  kopf('Archiv', l.length + ' Pl\u00e4ne \u00b7 ' + lz.length + ' Ziele', '');
  if (!l.length && !lz.length) {
    $('blatt').innerHTML = '<div class="hinweis">Noch nichts archiviert. ' +
      'Auf einem Planblatt legt der Knopf Archivieren den Plan hierher.</div>';
    return;
  }
  let h = '';
  h += l.map(function (p) {
    const f = planFortschritt(p.id);
    return '<div class="nz"><span class="tz-punkt" style="background:' + bFarbe(p.b) +
      '"></span><span class="nz-t">' + esc(p.t) +
      '<div class="nz-m">' + esc(bName(p.b)) +
      (p.zieldatum ? ' \u00b7 Zieldatum ' + esc(p.zieldatum) : '') +
      ' \u00b7 ' + f.fertig + ' von ' + f.gesamt + ' erledigt</div>' +
      '<div class="nz-m">' + esc(p.beschreibung[0] || '') + '</div></span>' +
      '<button class="k-btn" onclick="planReaktivieren(\'' + p.id + '\')">Reaktivieren</button>' +
      '</div>';
  }).join('');
  h += lz.map(function (z) {
    return '<div class="nz"><span class="tz-punkt" style="background:' + bFarbe(z.b) +
      '"></span><span class="nz-t">' + esc(z.t) +
      '<div class="nz-m">Ziel \u00b7 ' + esc(bName(z.b)) +
      (z.frist ? ' \u00b7 Frist ' + esc(z.frist) : '') + '</div>' +
      '<div class="nz-m">' + esc(z.zustand[0] || '') + '</div></span>' +
      '<button class="k-btn" onclick="zielReaktivieren(\'' + z.id + '\')">Reaktivieren</button>' +
      '</div>';
  }).join('');
  h += '<div class="hinweis">Ein reaktivierter Plan oder ein reaktiviertes Ziel bekommt ' +
       'seinen Reiter zur\u00fcck. Das Zugeordnete war nie weg \u2014 es steht weiterhin ' +
       'in seinen Best\u00e4nden.</div>';
  $('blatt').innerHTML = h;
}

function blattStub(nr, titel, sub, text) {

/* ═══ DISPATCHER ═══ */
function renderBlatt() {
  /* Register mit frei benannten Unterblättern zuerst: bei ihnen ist der
     Unterschlüssel eine Plan- oder Ziel-ID und trägt keine Bedeutung für
     den Dispatcher. 'uebersicht' kommt in beiden vor und wäre mehrdeutig. */
  if (reg === 'plaene') { blattPlaene(); return; }
  if (reg === 'ziele')  { blattZiele(); return; }
  if (reg === 'akt') {
    const u = unterAktiv.akt;
    if (u === 'wied') { blattWieder(); return; }
    if (u === 'gew')  { blattGewohnheit(); return; }
    blattAktivitaeten();
    return;
  }

  const k = blattKey();
  if (k === 'tag')      { blattTag(); return; }
  if (k === 'woche')    { blattWoche(); return; }
  if (k === 'notiz')    { blattNotiz(); return; }
  if (k === 'monat')    { blattMonat(); return; }
  if (k === 'jtermine') { blattJahrestermine(); return; }
  if (k === 'archiv')   { blattArchiv(); return; }
  /* Kein stiller Rückfall mehr auf ein beliebiges Blatt: ein unbekannter
     Schlüssel soll auffallen, statt ein fremdes Blatt zu zeichnen. */
  kopf('Unbekanntes Blatt', 'Schl\u00fcssel: ' + k, '');
  $('blatt').innerHTML = '<div class="hinweis">F\u00fcr diesen Registerschl\u00fcssel ' +
    'ist kein Blatt hinterlegt.</div>';
}

function renderAlles() {
  renderRegister();
  renderUnterreiter();
  renderBlatt();
  spStandZeigen();
  /* Gespeichert wird bei jeder Neuzeichnung. Das ist grob, aber
     lueckenlos: es gibt keine Aenderung ohne anschliessendes Rendern. */
  speichern();
}

function exportAuf() {
  const k = blattKey();
  const titel = $('bk-titel').textContent;

  if (k === 'tag') {
    /* Auf dem Move wird mit dem Stift geschrieben. Deshalb bekommt die
       Reflexion dort fuenf Linien statt der drei am Bildschirm, und die
       Zeilen sind hoeher. Bereits Eingetragenes wird uebernommen.       */
    const mottoText = TAG.motto.filter(z => z).join(' ');
    inhalt += '<div class="move-l">Tagesmotto</div>' +
      '<div class="move-z">' + esc(mottoText) + '</div>';

    inhalt += '<div class="move-l">Termine</div>';
    inhalt += ganztagsEintraege().map(function (g) {
      return '<div class="move-z">ganztags  ' + esc(g.t) + '</div>';
    }).join('');
    inhalt += TERMINE.filter(t => t.tag === HEUTE_WT && !t.ganztags)
      .sort(function (a, b) { return a.von < b.von ? -1 : 1; })
      .map(function (t) {
        return '<div class="move-z">' + esc(t.von) + '  ' + esc(t.t) + '</div>';
      }).join('');

    inhalt += '<div class="move-l">Aktivitaeten</div>';
    inhalt += AKTIVITAETEN.filter(a => a.heute).map(function (a) {
      const z = { '\u2022':'\u25a1', '\u2715':'\u2715', '>':'\u203a', '\u2013':'\u2013' };
      return '<div class="move-z">' + (z[a.glyph] || '\u25a1') + ' ' + esc(a.prio) +
             '  ' + esc(a.t) + '</div>';
    }).join('');

    const wk = WIEDER.filter(x => x.tage.indexOf(HEUTE_WT) !== -1);
    if (wk.length) {
      inhalt += '<div class="move-l">Wiederkehrend</div>';
      inhalt += wk.map(function (x) {
        const g = x.log[HEUTE_WT] || '\u2022';
        const z = { '\u2022':'\u25a1', '\u2715':'\u2715', '>':'\u203a', '\u2013':'\u2013' };
        return '<div class="move-z">' + (z[g] || '\u25a1') + ' ' + esc(x.t) + '</div>';
      }).join('');
    }

    const kont = KONTAKTE.filter(x => x.tag === HEUTE_WT);
    inhalt += '<div class="move-l">Kontakte / Rueckfragen</div>';
    inhalt += kont.map(function (x) {
      const z = { '\u2022':'\u25a1', '\u2715':'\u2715', '>':'\u203a', '\u2013':'\u2013' };
      return '<div class="move-z">' + (z[x.glyph] || '\u25a1') + ' ' + esc(x.t) + '</div>';
    }).join('');
    for (let i = kont.length; i < 3; i++) { inhalt += '<div class="move-linie"></div>'; }

    inhalt += '<div class="move-refl"><div class="move-l" style="margin-top:0">Reflexion</div>';
    const refl = TAG.reflexion.filter(z => z);
    refl.forEach(function (z) { inhalt += '<div class="move-z">' + esc(z) + '</div>'; });
    for (let i = refl.length; i < 5; i++) { inhalt += '<div class="move-linie"></div>'; }
    inhalt += '</div>';
  } else {
    inhalt += '<div class="move-z">Blattinhalt massstabsgetreu</div>';
  }

  $('export-inhalt').innerHTML = '<div class="move">' + inhalt +
    '<div class="move-f">' + esc(FORM_NR[k] || 'CMP') + ' \u00b7 TimeAssist</div></div>';
  $('export-hinweis').textContent = 'Blatt ' + (FORM_NR[k] || 'CMP') + ' \u00b7 82,6 \u00d7 132,2 mm';
  $('export').classList.add('auf');
}

function datenImport(ev) {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) { return; }
  const leser = new FileReader();
  leser.onload = function () {
    let neu;
    try { neu = JSON.parse(leser.result); }
    catch (e) { melde('Datei ist kein g\u00fcltiges JSON'); return; }
    /* Ein unvollstaendiger Import darf den Bestand nicht zerlegen */
    if (istWorkAssist(neu)) { waVorschau(neu, f.name); return; }
    if (!neu || typeof neu !== 'object' || !Array.isArray(neu.aktivitaeten)) {
      melde('Datei enth\u00e4lt weder einen TimeAssist- noch einen WorkAssist-Bestand');
      return;
    }
    dbUebernehmen(neu);
    datenZu();
    renderAlles();
    melde('Bestand geladen');
  };
  leser.onerror = function () { melde('Datei konnte nicht gelesen werden'); };
  leser.readAsText(f);
}

/* ═══════════════════════════════════════════════════════════════════
   IMPORT AUS WORKASSIST
   Einbahnstraße: liest WorkAssist, schreibt TimeAssist, rührt die
   Quelldatei nicht an. Er fügt hinzu, statt zu ersetzen — beide
   Dateien laufen nacheinander in denselben Bestand.

   Regeln (abgestimmt):
     · nur offene und in Arbeit befindliche Aufgaben, kein Erledigtes
     · Bereiche ohne Unterbereiche werden übernommen; hängt eine Aufgabe
       direkt an einem Oberbereich, entsteht "<Name> – Allgemein"
     · archivierte Bereiche samt ihrer Aufgaben bleiben draußen
     · Planschritte ohne Aufgabenbezug nur bei aktiven Plänen
     · zeitnah → Priorität A, sonst B
   ═══════════════════════════════════════════════════════════════════ */
const WA_FARBEN = ['#6b6459', '#7d6b53', '#4e6b52', '#8c3b2f', '#57524a',
                   '#3f5d73', '#a8622c', '#5a5f4a', '#7a5568', '#46605c'];

function istWorkAssist(d) {
  return !!(d && Array.isArray(d.bereiche) && Array.isArray(d.aufgaben) &&
            !Array.isArray(d.aktivitaeten));
}
function waDatum(iso) {
  /* WorkAssist speichert JJJJ-MM-TT, das Formblatt zeigt TT.MM. */
  if (!iso || typeof iso !== 'string' || iso.length < 10) { return ''; }
  return iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.';
}
function waPrio(a) { return a.zeitnah === true ? 'A' : 'B'; }
function waGlyph(st) { return st === 'erledigt' ? '\u2715' : '\u2022'; }

/* Wandelt einen WorkAssist-Stand in TimeAssist-Bestände um. Liefert die
   neuen Sätze und einen Bericht, ohne DB anzufassen.                  */
function waUmwandeln(d) {
  const bericht = { gruppen:0, bereiche:0, aktivitaeten:0, wieder:0, gewohnheiten:0,
                    plaene:0, planarchiv:0, notizen:0, schritte:0,
                    uebersprungen:{ erledigt:0, archiviert:0, schritte:0 } };
  const quelle = {};
  d.bereiche.forEach(function (b) { quelle[b.id] = b; });
  const hatKinder = {};
  d.bereiche.forEach(function (b) {
    if (b.oberbereich) { hatKinder[b.oberbereich] = true; }
  });
  const archiviert = function (b) {
    /* Ein Bereich gilt als archiviert, wenn er es ist oder sein
       Oberbereich es ist.                                            */
    let x = b, tiefe = 0;
    while (x && tiefe < 6) {
      if (x.archiviert === true) { return true; }
      x = x.oberbereich ? quelle[x.oberbereich] : null;
      tiefe += 1;
    }
    return false;
  };

  const bereiche = [], gruppen = [];
  const abbild = {};          // WorkAssist-Bereichs-ID → TimeAssist-ID
  const gAbbild = {};         // WorkAssist-Oberbereichs-ID → Gruppen-ID
  let farbe = BEREICHE.length;

  /* Der Oberbereich verschwindet nicht, er wird zur Gruppe — genau die
     Ebene, die als Register über den Checklisten sitzt. Vorhandene
     Gruppen gleichen Namens werden wiederverwendet.                    */
  const gruppeFuer = function (name) {
    const da = GRUPPEN.concat(gruppen).find(g => g.name === name);
    if (da) { return da.id; }
    const id = 'g' + naechsteId();
    gruppen.push({ id:id, name:name });
    bericht.gruppen += 1;
    return id;
  };
  d.bereiche.forEach(function (b) {
    if (archiviert(b)) { return; }
    if (hatKinder[b.id]) { gAbbild[b.id] = gruppeFuer(b.name); }
  });

  const neuerBereich = function (name, gid) {
    const id = 'b' + naechsteId();
    bereiche.push({ id:id, name:name, farbe:WA_FARBEN[farbe % WA_FARBEN.length],
                    gruppeId:gid || null });
    farbe += 1;
    bericht.bereiche += 1;
    return id;
  };
  d.bereiche.forEach(function (b) {
    if (archiviert(b)) { bericht.uebersprungen.archiviert += 1; return; }
    if (hatKinder[b.id]) { return; }          // Oberbereich ist jetzt Gruppe
    /* Ein Bereich ohne Oberbereich bildet seine eigene Gruppe — sonst
       laegen die privaten Bereiche alle unter "Ohne Gruppe".           */
    const gid = b.oberbereich ? (gAbbild[b.oberbereich] || null)
                              : gruppeFuer(b.name);
    abbild[b.id] = neuerBereich(b.name, gid);
  });
  /* Oberbereiche, an denen direkt Aufgaben hängen, bekommen ein Allgemein */
  d.aufgaben.forEach(function (a) {
    const b = a.bereichId ? quelle[a.bereichId] : null;
    if (!b || abbild[b.id] || archiviert(b)) { return; }
    if (hatKinder[b.id]) {
      abbild[b.id] = neuerBereich(b.name + ' \u2013 Allgemein', gAbbild[b.id] || null);
    }
  });
  /* Beim zweiten Dateiimport soll kein zweites "Ohne Bereich" entstehen —
     erst im bestehenden Bestand nachsehen.                             */
  let ohneId = null;
  const vorhanden = BEREICHE.find(x => x.name === 'Ohne Bereich');
  if (vorhanden) { ohneId = vorhanden.id; }
  const bereichVon = function (a) {
    const b = a.bereichId ? quelle[a.bereichId] : null;
    if (b && abbild[b.id]) { return abbild[b.id]; }
    if (!ohneId) { ohneId = neuerBereich('Ohne Bereich'); }
    return ohneId;
  };

  const aktivitaeten = [], wieder = [], plaene = [], notizen = [], gewohnheiten = [];
  const aufgabeZuAkt = {};    // WorkAssist-Aufgaben-ID → neue Aktivitäts-ID

  d.aufgaben.forEach(function (a) {
    const b = a.bereichId ? quelle[a.bereichId] : null;
    if (b && archiviert(b)) { bericht.uebersprungen.archiviert += 1; return; }
    if (a.status === 'erledigt') { bericht.uebersprungen.erledigt += 1; return; }
    if (a.wiederholung) {
      /* Ein wiederkehrender Vorgang, kein Einzelvorgang */
      const w = a.wiederholung;
      let tage = Array.isArray(w.wochentage) ? w.wochentage.slice() : [];
      /* WorkAssist zählt 0 = Sonntag, TimeAssist 0 = Montag */
      tage = tage.map(function (t) { return (t + 6) % 7; }).sort();
      let muster;
      if (w.typ === 'monatlich') { muster = 'monatlich'; }
      else if (!tage.length) {
        /* Kein Wochentag hinterlegt: das Intervall ist die Aussage.
           Sieben Tage anzunehmen wäre erfunden.                       */
        const iv = parseInt(w.intervall, 10) || 1;
        muster = (iv > 1) ? ('alle ' + iv + ' Wochen') : 'wöchentlich';
        tage = [0];
      } else {
        const iv = parseInt(w.intervall, 10) || 1;
        muster = tage.map(t => WOKURZ[t]).join(' \u00b7 ') +
                 (iv > 1 ? ' \u00b7 alle ' + iv + ' Wochen' : '');
      }
      wieder.push({ id:naechsteId(), t:a.titel, b:bereichVon(a),
                    min:parseInt(a.groesse, 10) || 0,
                    muster:muster, tage:tage, log:{}, zielId:null });
      bericht.wieder += 1;
      return;
    }
    const id = naechsteId();
    aufgabeZuAkt[a.id] = id;
    aktivitaeten.push({ id:id, t:a.titel, b:bereichVon(a), prio:waPrio(a),
                        min:parseInt(a.groesse, 10) || 0, wer:'',
                        beginn:waDatum(a.startdatum), ende:waDatum(a.faellig),
                        glyph:waGlyph(a.status), heute:false,
                        planId:null, zielId:null });
    bericht.aktivitaeten += 1;
  });

  d.plaene.forEach(function (p) {
    const b = p.bereichId ? quelle[p.bereichId] : null;
    if (b && archiviert(b)) { return; }
    const fertig = (p.status === 'abgeschlossen');
    const pid = 'p' + naechsteId();
    plaene.push({ id:pid, t:p.titel, b:(b && abbild[b.id]) ? abbild[b.id] : bereichVon(p),
                  zielId:null, zieldatum:'', archiviert:fertig,
                  beschreibung:[(p.notiz || '').split('\n')[0] || '', ''] });
    if (fertig) { bericht.planarchiv += 1; } else { bericht.plaene += 1; }
    (p.schritte || []).forEach(function (sch) {
      if (sch.aufgabeId && aufgabeZuAkt[sch.aufgabeId]) {
        const a = aktivitaeten.find(x => x.id === aufgabeZuAkt[sch.aufgabeId]);
        if (a) { a.planId = pid; bericht.schritte += 1; }
        return;
      }
      if (fertig || sch.status === 'erledigt') {
        bericht.uebersprungen.schritte += 1;
        return;
      }
      aktivitaeten.push({ id:naechsteId(), t:sch.titel,
                          b:(b && abbild[b.id]) ? abbild[b.id] : bereichVon(p),
                          prio:'B', min:0, wer:sch.delegiertAn || '',
                          beginn:'', ende:'', glyph:'\u2022', heute:false,
                          planId:pid, zielId:null });
      bericht.aktivitaeten += 1;
      bericht.schritte += 1;
    });
  });

  (d.habits || []).forEach(function (g) {
    if (g.aktiv === false) { return; }
    let tage = (g.ziel && Array.isArray(g.ziel.tage)) ? g.ziel.tage.slice() : [];
    tage = tage.map(function (t) { return (t + 6) % 7; }).sort();
    if (!tage.length) { tage = [0, 1, 2, 3, 4, 5, 6]; }
    gewohnheiten.push({ id:naechsteId(), t:g.titel,
                        ziel:tage.length + '\u00d7 pro Woche', soll:tage.length,
                        tage:tage, log:{}, zielId:null });
    bericht.gewohnheiten += 1;
  });

  let nr = NOTIZEN.length;
  const alsNotiz = function (titel, datum, art, bid) {
    nr += 1;
    notizen.push({ id:naechsteId(), nr:nr, t:titel, art:art,
                   b:bid || (bereiche[0] ? bereiche[0].id : 'b1'),
                   datum:datum || '', seiten:1, quelle:'aus WorkAssist' });
    bericht.notizen += 1;
  };
  (d.notizen || []).forEach(function (n) {
    const b = n.bereichId ? quelle[n.bereichId] : null;
    alsNotiz(n.titel || 'Ohne Titel', waDatum(n.geaendert),
             'liniert', (b && abbild[b.id]) ? abbild[b.id] : null);
  });
  (d.dokumente || []).forEach(function (dok) {
    const b = dok.bereichId ? quelle[dok.bereichId] : null;
    alsNotiz(dok.titel || dok.name || 'Dokument', '',
             'liniert', (b && abbild[b.id]) ? abbild[b.id] : null);
  });

  return { gruppen:gruppen, bereiche:bereiche, aktivitaeten:aktivitaeten, wieder:wieder,
           gewohnheiten:gewohnheiten, plaene:plaene, notizen:notizen,
           bericht:bericht };
}

let waErgebnis = null;
function waVorschau(d, dateiname) {
  waErgebnis = waUmwandeln(d);
  const b = waErgebnis.bericht;
  const z = [
    ['Gruppen', b.gruppen], ['Bereiche', b.bereiche], ['Aktivitäten', b.aktivitaeten],
    ['davon aus Planschritten', b.schritte],
    ['Wiederkehrende Vorgänge', b.wieder], ['Gewohnheiten', b.gewohnheiten],
    ['Pläne aktiv', b.plaene], ['Pläne archiviert', b.planarchiv],
    ['Notizen', b.notizen],
  ];
  let h = '<div class="dt-z"><span class="dt-l">Datei</span><span class="dt-w">' +
    esc(dateiname) + '</span></div>' +
    '<div class="dt-z"><span class="dt-l">Erkannt als</span>' +
    '<span class="dt-w">WorkAssist ' + esc(d.version || '?') + '</span></div>';
  h += z.map(function (x) {
    return '<div class="dt-z"><span class="dt-l">' + esc(x[0]) + '</span>' +
      '<span class="dt-w">' + x[1] + '</span></div>';
  }).join('');
  h += '<div class="dt-z"><span class="dt-l">Übersprungen</span><span class="dt-w">' +
    b.uebersprungen.erledigt + ' erledigt \u00b7 ' +
    b.uebersprungen.archiviert + ' archiviert \u00b7 ' +
    b.uebersprungen.schritte + ' Schritte</span></div>';
  h += '<div class="hinweis">Der Bestand wird <b>hinzugef\u00fcgt</b>, nichts wird ' +
    'ersetzt \u2014 beide WorkAssist-Dateien laufen nacheinander hinein. ' +
    'Dieselbe Datei zweimal einzulesen erzeugt allerdings Dubletten.</div>';
  $('wa-inhalt').innerHTML = h;
  $('wa').classList.add('auf');
}
function waZu() { $('wa').classList.remove('auf'); waErgebnis = null; }
function waUebernehmen() {
  if (!waErgebnis) { return; }
  const r = waErgebnis;
  r.gruppen.forEach(g => GRUPPEN.push(g));
  r.bereiche.forEach(b => BEREICHE.push(b));
  r.aktivitaeten.forEach(a => AKTIVITAETEN.push(a));
  r.wieder.forEach(w => WIEDER.push(w));
  r.gewohnheiten.forEach(g => GEWOHNHEIT.push(g));
  r.plaene.forEach(p => PLAENE.push(p));
  r.notizen.forEach(n => NOTIZEN.push(n));
  const b = r.bericht;
  waZu();
  datenZu();
  reg = 'akt';
  unterAktiv.akt = 'akt';
  renderAlles();
  melde(b.aktivitaeten + ' Aktivit\u00e4ten in ' + b.bereiche + ' Bereichen, ' +
        b.gruppen + ' Gruppen \u00fcbernommen');
}

/* ═══════════════════════════════════════════════════════════════════
   GRUPPEN UND BEREICHE
   Die Gruppe ist die Registerebene über dem Bereich. Gepflegte Liste
   statt Freitext: sonst stehen "Organisation" und "Organisatorisch"
   als zwei Register nebeneinander.
   ═══════════════════════════════════════════════════════════════════ */
function gruppenAuf() { gruppenRender(); $('gruppen').classList.add('auf'); }
function gruppenZu() { $('gruppen').classList.remove('auf'); renderAlles(); }

function gruppeNeu() {
  GRUPPEN.push({ id:'g' + naechsteId(), name:'Neue Gruppe' });
  gruppenRender();
}
function gruppeName2(id, wert) {
  const g = GRUPPEN.find(x => x.id === id);
  if (g) { g.name = wert.trim() || g.name; }
  gruppenRender();
}
function gruppeLoeschen(id) {
  /* Die Bereiche bleiben — sie rutschen nur in "Ohne Gruppe". */
  BEREICHE.forEach(function (b) { if (b.gruppeId === id) { b.gruppeId = null; } });
  const i = GRUPPEN.findIndex(x => x.id === id);
  if (i !== -1) { GRUPPEN.splice(i, 1); }
  if (unterAktiv.akt === 'g:' + id) { unterAktiv.akt = 'uebersicht'; }
  gruppenRender();
}
function bereichGruppe(bid, gid) {
  const b = BEREICHE.find(x => x.id === bid);
  if (b) { b.gruppeId = gid || null; }
  gruppenRender();
}
function bereichNameSetzen(bid, wert) {
  const b = BEREICHE.find(x => x.id === bid);
  if (b) { b.name = wert.trim() || b.name; }
  gruppenRender();
}
function gruppenRender() {
  let h = '<div class="ed-l">Gruppen</div>';
  h += GRUPPEN.map(function (g) {
    const n = BEREICHE.filter(b => b.gruppeId === g.id).length;
    return '<div class="gr-z"><input class="ed-f" value="' + esc(g.name) +
      '" onchange="gruppeName2(\'' + g.id + '\', this.value)">' +
      '<span class="gr-n">' + n + (n === 1 ? ' Bereich' : ' Bereiche') + '</span>' +
      '<button class="mon-x" onclick="gruppeLoeschen(\'' + g.id + '\')" ' +
      'title="Gruppe l\u00f6schen, Bereiche bleiben">\u00d7</button></div>';
  }).join('');
  if (!GRUPPEN.length) {
    h += '<div class="hinweis">Noch keine Gruppe angelegt.</div>';
  }
  h += '<div class="gr-z neu-z" onclick="gruppeNeu()">' +
       '<span class="a-neu">+ Gruppe anlegen</span></div>';

  h += '<div class="ed-l">Bereiche zuordnen</div>';
  const opt = function (bid, gid) {
    let o = '<option value=""' + (!gid ? ' selected' : '') + '>\u2014 ohne \u2014</option>';
    o += GRUPPEN.map(function (g) {
      return '<option value="' + g.id + '"' + (g.id === gid ? ' selected' : '') + '>' +
        esc(g.name) + '</option>';
    }).join('');
    return '<select class="es gr-s" onchange="bereichGruppe(\'' + bid +
      '\', this.value)">' + o + '</select>';
  };
  h += BEREICHE.map(function (b) {
    const n = AKTIVITAETEN.filter(a => a.b === b.id && offen(a)).length;
    return '<div class="gr-z"><span class="tz-punkt" style="background:' + b.farbe +
      '"></span><input class="ed-f" value="' + esc(b.name) +
      '" onchange="bereichNameSetzen(\'' + b.id + '\', this.value)">' +
      '<span class="gr-o">' + n + ' offen</span>' +
      opt(b.id, b.gruppeId) + '</div>';
  }).join('');
  if (!BEREICHE.length) {
    h += '<div class="hinweis">Noch keine Bereiche vorhanden.</div>';
  }
  $('gruppen-inhalt').innerHTML = h;
}

/* ═══ SKALIERUNG DES GERÄTERAHMENS ═══ */
function skaliere() {
  const g = $('geraet');
  /* Der Massstab kommt aus dem Layout-Viewport, NICHT aus visualViewport.
     Letzteres schrumpft, sobald die Bildschirmtastatur aufgeht — daraus
     wuerde ein Massstab von etwa 60 % gerechnet und das Formular waere
     unlesbar klein. Die Tastatur soll das Blatt ueberdecken, nicht
     verkleinern.                                                        */
  const s = Math.min(window.innerWidth / 820, window.innerHeight / 1180, 1);
  g.style.transform = 'scale(' + s + ')';
  const f = $('bf-rechts');
  if (f) { f.textContent = '2026 \u00b7 ' + Math.round(s * 100) + '%'; }
}

/* ═══ START ═══ */
(function () {
  skaliere();
  window.addEventListener('resize', skaliere);
  window.addEventListener('orientationchange', function () { setTimeout(skaliere, 250); });

  /* Erst den gespeicherten Bestand holen, dann zeichnen. Faellt der
     Speicher aus, laeuft die App mit der Saat weiter — fluechtig, aber
     bedienbar, und der Punkt im Datenknopf sagt es.                   */
  spLesen().then(function (gespeichert) {
    if (gespeichert) { dbUebernehmen(gespeichert); spZustand = 'bereit'; }
    else { spZustand = 'bereit'; }
    renderAlles();
  }).catch(function (e) {
    spZustand = 'fluechtig';
    spFehler = String(e && e.message ? e.message : e);
    renderAlles();
    melde('Kein dauerhafter Speicher \u2014 Daten nur in dieser Sitzung');
  });
}());
</script>
