}

/* ═══ BLATT: TAG (CMP 01) ═══ */
function blattTag() {
  kopf(WOTAGE[HEUTE_WT] + ', 19. August 2026', 'Tagesplan \u00b7 KW 34', '');

  const fest = TERMINE.filter(t => t.tag === HEUTE_WT && !t.ganztags);
  const inMin = z => parseInt(z.slice(0,2),10) * 60 + parseInt(z.slice(3),10);

  const spur = {};
  fest.slice().sort(function (a, b) { return inMin(a.von) - inMin(b.von); })
    .forEach(function (t, i, alle) {
      spur[t.id] = alle.slice(0, i).some(function (v) {
        return inMin(v.bis) > inMin(t.von) && inMin(v.von) < inMin(t.bis);
      }) ? 1 : 0;
    });

  let links = abschnitt('Termine', '6 \u2013 23 Uhr');
  const gt = ganztagsEintraege();
  if (gt.length) {
    links += '<div class="gt-band">' + gt.map(function (g) {
      return '<div class="ganztags"><span>' + esc(g.t) +
        (g.ort ? ' \u00b7 ' + esc(g.ort) : '') + '</span>' +
        (g.quelle ? '<span class="gt-quelle">' + esc(g.quelle) + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  }

  for (let st = 6; st <= 23; st++) {
    for (let hs = 0; hs < 2; hs++) {
      const min = st * 60 + hs * 30;
      const belegend = fest.filter(t => min >= inMin(t.von) && min < inMin(t.bis));
      /* Ein Termin gehoert in das Halbstundenfenster, in das seine
         Startzeit faellt. Der frueher benutzte Gleichheitstest liess
         krumme Zeiten wie 19:15 durchs Raster fallen: die Belegt-Striche
         standen, der Block wurde nie gezeichnet.                        */
      const start = fest.filter(function (t) {
        const v = inMin(t.von);
        return v >= min && v < min + 30;
      });
      let striche = '';
      for (let i = 0; i < Math.min(belegend.length, 3); i++) {
        striche += '<span class="cz-strich"></span>';
      }
      const leer = start.length === 0;
      links += '<div class="cz ' + (hs === 0 ? 'voll' : '') + '">' +
        '<span class="cz-zeit">' + (hs === 0 ? String(st).padStart(2,'0') + ':00' : '') + '</span>' +
        '<span class="cz-mark">' + striche + '</span>' +
        '<span class="cz-inhalt"' + (leer ? ' onclick="terminNeu(' + min + ')"' : '') + '>' +
        start.map(function (t) {
          if (editTermin === t.id) { return terminEdit(t); }
          const versatz = inMin(t.von) - min;          // 0, wenn glatt
          const krumm = versatz !== 0;
          const hoehe = Math.max(18,
            Math.round((inMin(t.bis) - inMin(t.von)) / 30 * 24) - 3);
          const kl = spur[t.id] === 1 ? 'kollision2' : (belegend.length > 1 ? 'kollision' : '');
          return '<div class="termin ' + kl + '" style="height:' + hoehe +
            'px;top:' + Math.round(versatz / 30 * 24) + 'px" ' +
            'onclick="terminOeffnen(' + t.id + ')">' +
            '<div class="t-titel">' + esc(t.t) + '</div>' +
            '<div class="t-meta">' + (krumm ? esc(t.von) + ' ' : '') + esc(t.ort) + '</div></div>';
        }).join('') + '</span></div>';
    }
  }

  const w = AKTIVITAETEN.find(a => a.id === TAG.wichtigste);
  let rechts = '<div class="wichtig"><div class="wichtig-l">Wichtigste Aufgabe heute</div>' +
    '<div class="tz-titel">' + (w ? esc(w.t) : '\u2014') + '</div></div>';

  const liste = AKTIVITAETEN.filter(a => a.heute);
  rechts += '<div class="abschnitt">' + abschnitt('Aktivit\u00e4ten', '') +
    '<table class="atab"><colgroup><col style="width:28px"><col style="width:26px">' +
    '<col><col style="width:48px"><col style="width:38px"></colgroup>' +
    '<thead><tr><th></th><th>Pri</th><th>Beschreibung</th><th class="r">Ende</th>' +
    '<th class="r">Min</th></tr></thead><tbody>';

  rechts += liste.map(function (a) {
    return '<tr>' +
      '<td class="mitte">' + hakFeld(a.glyph, 'glyphWeiter(' + a.id + ')') + '</td>' +
      '<td class="mitte z" onclick="prioWeiter(' + a.id + ')">' + prioFeld(a.prio) + '</td>' +
      zelle('akt', a.id, 't', a.t, 'tag', 'a-titel-zelle ' + titelKlasse(a), 'Beschreibung') +
      zelle('akt', a.id, 'ende', a.ende, 'tag', 'dat', 'TT.MM') +
      zelle('akt', a.id, 'min', String(a.min), 'tag', 'r', '') + '</tr>';
  }).join('');

  /* Das Blatt ist bis zur H\u00e4lfte durchliniert \u2014 14 Zeilen, damit die
     R\u00fcckfragen immer an derselben Stelle beginnen.                     */
  const ZEILEN_TAG = 14;
  if (liste.length < ZEILEN_TAG) {
    rechts += '<tr class="neu" onclick="aktNeu(true)"><td colspan="5">' +
      '<span class="a-neu">antippen und schreiben</span></td></tr>';
    for (let i = liste.length + 1; i < ZEILEN_TAG; i++) {
      rechts += '<tr class="leer"><td></td><td></td><td></td><td></td><td></td></tr>';
    }
  }
  rechts += '</tbody></table>';

  /* Heute faellige wiederkehrende Vorgaenge. Sie kosten Zeit und gehoeren
     deshalb auf den Tagesplan — aber in einen eigenen Block, damit sie
     sich nicht unter die bewusst gehobenen Aktivitaeten mischen.       */
  const wk = WIEDER.filter(x => x.tage.indexOf(HEUTE_WT) !== -1);
  if (wk.length) {
    const summe = wk.reduce(function (n, x) { return n + x.min; }, 0);
    rechts += '<div class="abschnitt">' +
      abschnitt('Wiederkehrend heute', summe + ' Min');
    rechts += wk.map(function (x) {
      const g = x.log[HEUTE_WT] || '\u2022';
      const fuehrt = x.fuehrtZu
        ? ' fuehrt" onclick="blattOeffnen(\'akt\',\'' + x.fuehrtZu + '\')'
        : '';
      return '<div class="wk-z">' +
        hakFeld(g, 'wiederWeiter(' + x.id + ',' + HEUTE_WT + ')') +
        '<span class="wk-t ' + titelKlasse({ glyph:g }) + fuehrt + '">' +
        esc(x.t) + '</span>' +
        '<span class="wk-min">' + x.min + '</span></div>';
    }).join('');
    rechts += '</div>';
  }
  rechts += '</div>';

  const kont = KONTAKTE.filter(k => k.tag === HEUTE_WT);
  rechts += '<div class="abschnitt rf-block">' +
    abschnitt('Kontakte / R\u00fcckfragen', 'antippen und schreiben');
  rechts += kont.map(function (k) {
    let inhalt;
    if (zelleOffen('kontakt', k.id, 't')) {
      inhalt = '<input class="ef" id="ez" value="' + esc(k.t) +
        '" placeholder="Anruf, Mail, delegiertes Thema" onblur="zelleSchliessen()" ' +
        'onkeydown="zelleTaste(event, \'kontakt\')">';
    } else {
      inhalt = '<span class="kontakt-t ' + titelKlasse(k) +
        '" onclick="zelleOeffnen(\'kontakt\',' + k.id + ',\'t\')">' + esc(k.t) + '</span>';
    }
    return '<div class="kontakt-z">' +
      hakFeld(k.glyph, 'kontaktGlyph(' + k.id + ')') + inhalt + '</div>';
  }).join('');

  const ZEILEN_RF = 7;
  let rest = ZEILEN_RF - kont.length;
  if (rest < 1) { rest = 1; }
  for (let i = 0; i < rest; i++) {
    rechts += '<div class="kontakt-z" onclick="kontaktNeu()">' +
      '<span class="hak" style="border-color:var(--linie)"></span>' +
      '<span class="kontakt-t"></span></div>';
  }
  rechts += '</div>';

  /* Reflexion schliesst den Tag ab: gerahmt, damit sie sich vom
     Formularteil darueber absetzt. */
  rechts += '<div class="refl"><div class="refl-l">Reflexion</div>';
  for (let ri = 0; ri < TAG.reflexion.length; ri++) {
    rechts += freiZeile('reflexion', ri, TAG.reflexion[ri], TAG.reflexion.length,
                        'refl-z', 'refl-t');
  }
  rechts += '</div>';


  /* Motto ueber die volle Blattbreite: es gilt fuer den ganzen Tag,
     nicht nur fuer die Terminspalte. */
  let motto = '<div class="motto"><div class="motto-l">Tagesmotto</div>';
  for (let mi = 0; mi < TAG.motto.length; mi++) {
    motto += freiZeile('motto', mi, TAG.motto[mi], TAG.motto.length, 'motto-z', 'motto-t');
  }
  motto += '</div>';

  $('blatt').innerHTML = motto +
    '<div class="doppel"><div>' + links + '</div><div>' + rechts + '</div></div>';
  fokusSetzen();
}

/* ═══ BLATT: WOCHE (CMP 10) ═══ */
function wocheBlatt() {
  let b = WOCHENBLAETTER.find(x => x.montag === wocheOffen);
  if (!b) {
    b = { montag:wocheOffen, eintraege:[], wichtig:[], reflexion:['', '', ''] };
    WOCHENBLAETTER.push(b);
  }
  return b;
}
function tagPlus(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
/* Kalenderwoche nach ISO 8601 — der Donnerstag entscheidet das Jahr */
function kalenderwoche(iso) {
  const d = new Date(iso + 'T00:00:00Z');
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  t.setUTCDate(t.getUTCDate() + 4 - ((t.getUTCDay() + 6) % 7 + 1));
  const j = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - j) / 86400000 + 1) / 7);
}
function wocheBlaettern(schritt) {
  wocheOffen = tagPlus(wocheOffen, schritt * 7);
  editZelle = null;
  renderAlles();
}
function wocheFinde(id) {
  const b = wocheBlatt();
  return b.eintraege.find(x => x.id === id) || b.wichtig.find(x => x.id === id) || null;
}
/* Bei einem Verweis auf eine Aktivität sitzt der Zustand an der
   Aktivität selbst. Sonst trägt der Eintrag ihn.                       */
function wocheGlyph(e) {
  if (e.refArt === 'aktivitaet') {
    const a = AKTIVITAETEN.find(x => x.id === e.refId);
    return a ? a.glyph : '\u2013';
  }
  return e.glyph || '\u2022';
}
function wocheGlyphWeiter(id) {
  const e = wocheFinde(id);
  if (!e) { return; }
  if (e.refArt === 'aktivitaet') {
    const a = AKTIVITAETEN.find(x => x.id === e.refId);
    if (a) { a.glyph = naechsterGlyph(a.glyph); }
  } else {
    e.glyph = naechsterGlyph(e.glyph || '\u2022');
  }
  renderAlles();
}
function wocheText(e) {
  if (!e.refArt) { return { t:e.t || '', herkunft:'' }; }
  if (e.refArt === 'aktivitaet') {
    const a = AKTIVITAETEN.find(x => x.id === e.refId);
    return { t:a ? a.t : 'entfallen', herkunft:a && a.min ? a.min + ' Min' : 'Aktivität' };
  }
  if (e.refArt === 'jahrestermin') {
    const j = JAHRESTERMINE.find(x => x.id === e.refId);
    return { t:j ? j.t : 'entfallen', herkunft:'Termin' };
  }
  return { t:e.t || '', herkunft:'' };
}
function wocheLoeschen(id) {
  const b = wocheBlatt();
  [b.eintraege, b.wichtig].forEach(function (liste) {
    const i = liste.findIndex(x => x.id === id);
    if (i !== -1) { liste.splice(i, 1); }
  });
  editZelle = null;
  renderAlles();
}
function wocheZeile(e) {
  const info = wocheText(e);
  const g = wocheGlyph(e);
  const kreuz = '<button class="mon-x" onclick="event.stopPropagation(); ' +
                'wocheLoeschen(' + e.id + ')" title="Eintrag l\u00f6schen">\u00d7</button>';
  const zeit = '<span class="wo-zeit">' + esc(e.refArt ? '' : (e.zeit || '')) + '</span>';
  return '<div class="mon-e">' + hakFeld(g, 'wocheGlyphWeiter(' + e.id + ')') + zeit +
    '<span class="mon-t2 ' + titelKlasse({ glyph:g }) +
    '" onclick="event.stopPropagation(); eintragOeffnen(\'woche\',' +
    (typeof e.tag === 'number' ? e.tag : -1) + ',' + e.id + ')">' + esc(info.t) + '</span>' +
    (info.herkunft ? '<span class="mon-herkunft">' + esc(info.herkunft) + '</span>' : '') +
    kreuz + '</div>';
}

function blattWoche() {
  const b = wocheBlatt();
  const kw = kalenderwoche(b.montag);
  const so = tagPlus(b.montag, 6);
  kopf('Woche ' + kw,
       jtKurz(b.montag) + ' \u2013 ' + jtKurz(so) + ' \u00b7 ' +
       b.eintraege.length + ' Eintr\u00e4ge',
       '<button class="k-btn" onclick="wocheBlaettern(-1)">\u2039</button>' +
       '<button class="k-btn" onclick="wocheBlaettern(1)">\u203a</button>' +
       '<button class="k-btn" onclick="wahlAuf(\'wtermin\')">Termin</button>' +
       '<button class="k-btn" onclick="wahlAuf(\'waktivitaet\')">Aktivit\u00e4t</button>');

  const proTag = {};
  b.eintraege.forEach(function (e) {
    if (!proTag[e.tag]) { proTag[e.tag] = []; }
    proTag[e.tag].push(e);
  });

  let h = '';
  for (let d = 0; d < 7; d++) {
    const iso = tagPlus(b.montag, d);
    const heute = (iso === HEUTE_ISO);
    h += '<div class="wo-t ' + (d >= 5 ? 'we' : '') + ' ' + (heute ? 'heute' : '') + '">' +
      '<span class="wo-nr">' + WOTAGE[d] + '<div class="wo-dat">' + jtKurz(iso) + '</div></span>' +
      '<span class="wo-inhalt" onclick="eintragOeffnen(\'woche\',' + d + ',null)">' +
      (proTag[d] || []).map(wocheZeile).join('') + '</span>' +
      '<button class="wo-plus" onclick="event.stopPropagation(); wocheWahl(' + d + ')" ' +
      'title="Vorhandenes auf diesen Tag legen">+</button></div>';
  }

  h += '<div class="abschnitt">' + abschnitt('Diese Woche wichtig', 'ohne festen Tag');
  h += b.wichtig.map(wocheZeile).join('');
  for (let i = 0; i < 2; i++) {
    h += '<div class="mon-t"><span class="mon-nr"></span>' +
         '<span class="mon-inhalt" onclick="eintragOeffnen(\'woche\',-1,null)"></span></div>';
  }
  h += '</div>';

  h += '<div class="refl"><div class="refl-l">Reflexion der Woche</div>';
  for (let ri = 0; ri < b.reflexion.length; ri++) {
    h += freiZeile('wreflexion', ri, b.reflexion[ri], b.reflexion.length,
                   'refl-z', 'refl-t');
  }
  h += '</div>';

  $('blatt').innerHTML = h;
  fokusSetzen();
}

/* ═══ BLATT: AKTIVITÄTEN (CMP 31) ═══ */
/* Welche Gruppe zeigt das offene Blatt? '' bedeutet alle. */
function offeneGruppe() {
  const u = unterAktiv.akt || 'uebersicht';
  if (u.indexOf('g:') !== 0) { return null; }
  return u.slice(2);          // '0' = ohne Gruppe
}
function gruppeName(id) {
  if (!id) { return 'Ohne Gruppe'; }
  const g = GRUPPEN.find(x => x.id === id);
  return g ? g.name : 'Ohne Gruppe';
}
function bereicheDerGruppe(gid) {
  if (gid === null) { return BEREICHE; }
  if (gid === '0') { return BEREICHE.filter(b => !b.gruppeId); }
  return BEREICHE.filter(b => b.gruppeId === gid);
}

function blattAktivitaeten() {
  const gid = offeneGruppe();
  const bl = bereicheDerGruppe(gid);
  const bIds = {};
  bl.forEach(function (b) { bIds[b.id] = true; });
  const liste = AKTIVITAETEN.filter(a => bIds[a.b]);
  const offenN = liste.filter(offen).length;

  kopf(gid === null ? 'Aktivit\u00e4ten \u2014 alle'
                    : 'Aktivit\u00e4ten \u2014 ' + gruppeName(gid === '0' ? null : gid),
       offenN + ' offen von ' + liste.length +
       ' \u00b7 ' + bl.length + (bl.length === 1 ? ' Bereich' : ' Bereiche'),
       '<button class="k-btn" onclick="gruppenAuf()">Gruppen</button>' +
       '<button class="k-btn pri" onclick="aktNeu(false)">+ Aktivit\u00e4t</button>');

  let h = '<table class="atab"><colgroup><col style="width:28px"><col style="width:20px">' +
    '<col style="width:26px"><col><col style="width:78px"><col style="width:54px">' +
    '<col style="width:54px"><col style="width:40px"><col style="width:68px"></colgroup>' +
    '<thead><tr><th></th><th></th><th>Pri</th><th>Aktivit\u00e4tenbeschreibung</th>' +
    '<th>Wer</th><th class="r">Beginn</th><th class="r">Ende</th><th class="r">Min</th>' +
    '<th></th></tr></thead><tbody>';

  /* Nach Bereich gruppiert — das entspricht dem Stapel Checklistenblätter
     hinter dem Register.                                                */
  let gezeigt = 0;
  bl.forEach(function (b) {
    const l = liste.filter(a => a.b === b.id);
    if (!l.length) { return; }
    h += '<tr class="grp"><td colspan="9"><span class="tz-punkt" style="background:' +
      b.farbe + '"></span>' + esc(b.name) +
      '<span class="grp-n">' + l.filter(offen).length + ' offen</span></td></tr>';
    h += l.map(function (a) {
      if (editAkt === a.id) { return ''; }
      gezeigt += 1;
      const knopf = a.heute
        ? '<button class="tz-heute" onclick="event.stopPropagation(); heuteWeg(' + a.id + ')">\u2713 heute</button>'
        : '<button class="tz-heute" onclick="event.stopPropagation(); heuteHin(' + a.id + ')">\u2192 heute</button>';
      return '<tr>' +
        '<td class="mitte">' + hakFeld(a.glyph, 'glyphWeiter(' + a.id + ')') + '</td>' +
        '<td class="mitte z" onclick="bereichWeiter(' + a.id + ')" title="' + esc(bName(a.b)) + '">' +
        '<span class="tz-punkt" style="background:' + bFarbe(a.b) + '"></span></td>' +
        '<td class="mitte z" onclick="prioWeiter(' + a.id + ')">' + prioFeld(a.prio) + '</td>' +
        planPfeilZelle(a) +
        zelle('akt', a.id, 'wer', a.wer || '', 'voll', 'wer', '\u2014') +
        zelle('akt', a.id, 'beginn', a.beginn, 'voll', 'dat', 'TT.MM') +
        zelle('akt', a.id, 'ende', a.ende, 'voll', 'dat', 'TT.MM') +
        zelle('akt', a.id, 'min', String(a.min), 'voll', 'r', '') +
        '<td class="mitte">' + knopf + '</td></tr>';
    }).join('');
  });

  if (!gezeigt) {
    h += '<tr class="leer"><td colspan="9"><span class="a-neu">Noch nichts in dieser ' +
      'Gruppe</span></td></tr>';
  }
  if (editZelle === null) {
    h += '<tr class="neu" onclick="aktNeu(false)"><td colspan="9">' +
         '<span class="a-neu">antippen und schreiben</span></td></tr>';
  }
  h += '</tbody></table>';
  h += '<div class="hinweis">Jede Zelle ist Klickfl\u00e4che. K\u00e4stchen, Bereichspunkt und ' +
       'Priorit\u00e4t schalten weiter, Textzellen \u00f6ffnen sich zum Schreiben. Die Reiter ' +
       'rechts f\u00fchren je Gruppe ein eigenes Blatt \u2014 wie ein Stapel Checklisten ' +
       'hinter einem Register.</div>';
  $('blatt').innerHTML = h;
  fokusSetzen();
}
/* Auf der Checkliste steht statt eines zweiten Eintrags ein Pfeil mit
   dem Plannamen — genau der Vermerk, den man auf Papier hinschreibt. */
function planPfeilZelle(a) {
  const inner = zelle('akt', a.id, 't', a.t, 'voll', titelKlasse(a),
                      'Aktivit\u00e4tenbeschreibung');
  const p = a.planId ? PLAENE.find(x => x.id === a.planId) : null;
  if (!p) { return inner; }
  const pfeil = '<span class="p-pfeil" onclick="event.stopPropagation(); ' +
    'blattOeffnen(\'plaene\',\'' + p.id + '\')">\u2192 ' + esc(pfeilKurz(p.t)) + '</span>';
  return inner.replace('</td>', pfeil + '</td>');
}
function heuteHin(id) {
  const a = AKTIVITAETEN.find(x => x.id === id);
  if (a) { a.heute = true; melde('Auf den Tagesplan gehoben'); renderAlles(); }
}
function heuteWeg(id) {
  const a = AKTIVITAETEN.find(x => x.id === id);
  if (a) { a.heute = false; renderAlles(); }
}

/* ═══ BLATT: WIEDERKEHREND (CMP 03) ═══ */
function streifen(obj, klickbar, fn) {
  let h = '<div class="str">';
  for (let d = 0; d < 7; d++) {
    const moeglich = obj.tage.indexOf(d) !== -1;
    const z = obj.log[d] || (moeglich ? '•' : '');
    const kl = 'str-t ' + (moeglich ? '' : 'aus') + ' ' + (d === HEUTE_WT ? 'heute' : '');
    const klick = (klickbar && moeglich) ? ' onclick="' + fn + '(' + obj.id + ',' + d + ')"' : '';
    h += '<span class="' + kl + '"' + klick + '>' + z + '</span>';
  }
  return h + '</div>';
}
function wiederWeiter(id, tag) {
  const w = WIEDER.find(x => x.id === id);
  if (!w) { return; }
  const folge = { '•':'✕', '✕':'–', '–':'•' };
  w.log[tag] = folge[w.log[tag] || '•'];
  renderAlles();
}
function blattWieder() {
  kopf('Wiederkehrende Aktivitäten', WIEDER.length + ' Vorgänge · KW 34', '');
  let h = '<div class="str-kopf"><span style="flex:1"></span>' +
    WOKURZ.map(function (t) { return '<span class="str-k">' + t + '</span>'; }).join('') + '</div>';
  h += WIEDER.map(function (w) {
    return '<div class="tz" style="align-items:center">' +
      '<span class="tz-punkt" style="background:' + bFarbe(w.b) + '"></span>' +
      '<span class="tz-titel">' + esc(w.t) +
      '<div class="t-meta">' + esc(w.muster) + ' · ' + w.min + ' Min</div></span>' +
      streifen(w, true, 'wiederWeiter') + '</div>';
  }).join('');
  h += '<div class="hinweis">Ein wiederkehrender Vorgang wird erledigt — deshalb ein Rhythmus ' +
       'und ein Erledigt-Zeichen je Tag, keine Quote.</div>';
  $('blatt').innerHTML = h;
}

/* ═══ BLATT: GEWOHNHEITEN (CMP 04) ═══ */
function gewWeiter(id, tag) {
  const g = GEWOHNHEIT.find(x => x.id === id);
  if (!g) { return; }
  const folge = { '•':'✕', '✕':'–', '–':'•' };
  g.log[tag] = folge[g.log[tag] || '•'];
  renderAlles();
}
function blattGewohnheit() {
  kopf('Gewohnheiten', GEWOHNHEIT.length + ' · KW 34', '');
  let h = '<div class="str-kopf"><span style="flex:1"></span>' +
    WOKURZ.map(function (t) { return '<span class="str-k">' + t + '</span>'; }).join('') +
    '<span class="str-k" style="width:44px">Quote</span></div>';
  h += GEWOHNHEIT.map(function (g) {
    const erf = [0,1,2,3,4,5,6].filter(d => g.log[d] === '✕').length;
    return '<div class="tz" style="align-items:center">' +
      '<span class="tz-titel">' + esc(g.t) +
      '<div class="t-meta">' + esc(g.ziel) + '</div></span>' +
      streifen(g, true, 'gewWeiter') +
      '<span class="tz-min" style="flex:0 0 44px">' + erf + '/' + g.soll + '</span></div>';
  }).join('');
  h += '<div class="hinweis">Eine Gewohnheit wird gehalten, nicht erledigt — deshalb ein ' +
       'Wochenziel und eine Quote statt eines Rhythmus.</div>';
  $('blatt').innerHTML = h;
}

/* ═══ BLATT: PLÄNE (CMP 32) ═══ */
/* Aktivitäten eines Plans — der Planinhalt ist kein eigener Bestand */
function planAktivitaeten(pid) {
  return AKTIVITAETEN.filter(a => a.planId === pid);
}
function planFortschritt(pid) {
  const l = planAktivitaeten(pid);
  return { fertig:l.filter(a => a.glyph === '\u2715').length, gesamt:l.length };
}
function planNeu() {
  const p = { id:'p' + naechsteId(), t:'Neuer Plan', b:ersterBereichId(), zielId:null,
              von:1, bis:12, zieldatum:'', archiviert:false, beschreibung:['', ''] };
  PLAENE.push(p);
  unterAktiv.plaene = p.id;
  reg = 'plaene';
  renderAlles();
  melde('Plan angelegt \u2014 Titel und Beschreibung antippen');
}
function planArchivieren(pid) {
  const p = PLAENE.find(x => x.id === pid);
  if (!p) { return; }
  p.archiviert = true;
  unterAktiv.plaene = 'uebersicht';
  renderAlles();
  melde('Archiviert \u2014 zu finden unter Datenbank \u203a Archiv');
}
function planReaktivieren(pid) {
  const p = PLAENE.find(x => x.id === pid);
  if (!p) { return; }
  p.archiviert = false;
  reg = 'plaene';
  unterAktiv.plaene = pid;
  renderAlles();
  melde('Plan reaktiviert');
}
function planLoeschen(pid) {
  const i = PLAENE.findIndex(x => x.id === pid);
  if (i === -1) { return; }
  /* Die Aktivitäten bleiben bestehen und verlieren nur ihre Zuordnung —
     gelöscht wird der Plan, nicht die Arbeit.                           */
  AKTIVITAETEN.forEach(function (a) { if (a.planId === pid) { a.planId = null; } });
  PLAENE.splice(i, 1);
  unterAktiv.plaene = 'uebersicht';
  renderAlles();
  melde('Plan gel\u00f6scht, Aktivit\u00e4ten bleiben in der Checkliste');
}
function planFeld(pid, feld, i) {
  editZelle = { art:'plan', id:pid, feld:feld, zeile:i };
  fokusZiel = 'ez';
  renderAlles();
}
function planSchreiben() {
  if (!editZelle || editZelle.art !== 'plan') { return; }
  const p = PLAENE.find(x => x.id === editZelle.id);
  const f = $('ez');
  if (!p || !f) { return; }
  if (editZelle.feld === 'beschreibung') { p.beschreibung[editZelle.zeile] = f.value; }
  else if (editZelle.feld === 'titel') { p.t = f.value.trim() || p.t; }
  else if (editZelle.feld === 'zieldatum') { p.zieldatum = f.value.trim(); }
}
function planSchliessen(sofort) {
  planSchreiben();
  if (sofort) { editZelle = null; renderAlles(); return; }
  const merk = editZelle;
  setTimeout(function () {
    if (editZelle === merk) { editZelle = null; renderAlles(); }
  }, 120);
}
function planTaste(ev) {
  if (ev.key === 'Escape') { ev.preventDefault(); editZelle = null; renderAlles(); }
  if (ev.key === 'Enter' || ev.key === 'Tab') { ev.preventDefault(); planSchliessen(true); }
}
function planOffen(pid, feld, i) {
  return editZelle && editZelle.art === 'plan' && editZelle.id === pid &&
         editZelle.feld === feld && (i === undefined || editZelle.zeile === i);
}

/* ── Übersicht: tabellarisch, nach Bereich gruppiert ──────────────── */
function blattPlanUebersicht() {
  const aktive = PLAENE.filter(p => !p.archiviert);
  kopf('Pl\u00e4ne \u2014 \u00dcbersicht', aktive.length + ' Pl\u00e4ne',
       '<button class="k-btn pri" onclick="planNeu()">+ Plan</button>');

  let h = '<table class="atab ptab"><colgroup><col><col style="width:88px">' +
    '<col style="width:52px"><col style="width:26px"></colgroup>' +
    '<thead><tr><th>Plan</th><th class="r">Zieldatum</th><th class="r">Stand</th>' +
    '<th></th></tr></thead><tbody>';

  BEREICHE.forEach(function (b) {
    const l = aktive.filter(p => p.b === b.id);
    if (!l.length) { return; }
    /* Pläne desselben Bereichs stehen hintereinander — das entspricht
       dem Abheften im Ringbuch.                                        */
    h += '<tr class="grp"><td colspan="4"><span class="tz-punkt" style="background:' +
      b.farbe + '"></span>' + esc(b.name) + '</td></tr>';
    l.forEach(function (p) {
      const f = planFortschritt(p.id);
      /* Sichtbarer Verweis aufs Planblatt — die Zeile ist die Navigation
         zu den Reitern, die nicht mehr in die Spalte passen.          */
      h += '<tr class="klick" onclick="zeigeUnter(\'' + p.id + '\')">' +
        '<td><span class="p-titel p-link">' + esc(p.t) + '</span>' +
        '<span class="p-besch">' + esc(p.beschreibung[0] || '\u2014') + '</span></td>' +
        '<td class="dat">' + esc(p.zieldatum) + '</td>' +
        '<td class="r">' + f.fertig + '/' + f.gesamt + '</td>' +
        '<td class="mitte p-chev">\u203a</td></tr>';
    });
  });
  h += '</tbody></table>';
  h += '<div class="hinweis">Ein Reiter rechts je Plan. Passen nicht alle in die ' +
       'Spalte, erreichst du die \u00fcbrigen \u00fcber diese Zeilen \u2014 ' +
       'wie \u00fcber ein Inhaltsverzeichnis.</div>';
  $('blatt').innerHTML = h;
}

/* ── Planblatt: zwei Kopfzeilen, darunter die Aktivitätentabelle ──── */
function blattPlan(pid) {
  const p = PLAENE.find(x => x.id === pid);
  if (!p) { unterAktiv.plaene = 'uebersicht'; blattPlanUebersicht(); return; }
  const f = planFortschritt(p.id);
  const ziel = ZIELE.find(z => z.id === p.zielId);

  kopf(p.t, esc(bName(p.b)) + (ziel ? ' \u00b7 Ziel: ' + ziel.t : '') +
       ' \u00b7 ' + f.fertig + ' von ' + f.gesamt + ' erledigt',
       '<button class="k-btn" onclick="planArchivieren(\'' + p.id + '\')">Archivieren</button>' +
       '<button class="k-btn" onclick="planLoeschen(\'' + p.id + '\')">L\u00f6schen</button>');

  /* Die zwei Kopfzeilen des Formblatts: worum es in diesem Plan geht */
  let h = '<div class="p-kopf">';
  for (let i = 0; i < 2; i++) {
    if (planOffen(p.id, 'beschreibung', i)) {
      h += '<div class="p-kz offen"><input class="zf" id="ez" value="' +
        esc(p.beschreibung[i] || '') + '" placeholder="' +
        (i === 0 ? 'Worum geht es in diesem Plan?' : 'Zweite Zeile, optional') +
        '" onblur="planSchliessen()" onkeydown="planTaste(event)"></div>';
    } else {
      h += '<div class="p-kz" onclick="planFeld(\'' + p.id + '\',\'beschreibung\',' + i +
        ')">' + esc(p.beschreibung[i] || '') + '</div>';
    }
  }
  h += '</div>';

  const liste = planAktivitaeten(p.id);
  h += '<div class="abschnitt">' + abschnitt('Aktivit\u00e4ten', '') +
    '<table class="atab"><colgroup><col style="width:28px"><col style="width:26px">' +
    '<col><col style="width:78px"><col style="width:54px"><col style="width:40px">' +
    '<col style="width:30px"></colgroup>' +
    '<thead><tr><th></th><th>Pri</th><th>Aktivit\u00e4tenbeschreibung</th>' +
    '<th>Wer</th><th class="r">Ende</th><th class="r">Min</th><th></th></tr></thead><tbody>';

  h += liste.map(function (a) {
    return '<tr>' +
      '<td class="mitte">' + hakFeld(a.glyph, 'glyphWeiter(' + a.id + ')') + '</td>' +
      '<td class="mitte z" onclick="prioWeiter(' + a.id + ')">' + prioFeld(a.prio) + '</td>' +
      zelle('akt', a.id, 't', a.t, 'voll', titelKlasse(a), 'Aktivit\u00e4tenbeschreibung') +
      zelle('akt', a.id, 'wer', a.wer || '', 'voll', 'wer', '\u2014') +
      zelle('akt', a.id, 'ende', a.ende, 'voll', 'dat', 'TT.MM') +
      zelle('akt', a.id, 'min', String(a.min), 'voll', 'r', '') +
      '<td class="mitte"><button class="mon-x" onclick="event.stopPropagation(); ' +
      'planLoesen(' + a.id + ')" title="Aus dem Plan l\u00f6sen">\u00d7</button></td></tr>';
  }).join('');

  if (editZelle === null) {
    h += '<tr class="neu" onclick="planAktNeu(\'' + p.id + '\')"><td colspan="7">' +
         '<span class="a-neu">antippen und schreiben</span></td></tr>';
    h += '<tr class="leer"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
  }
  h += '</tbody></table>';

  h += '<div style="margin-top:10px"><button class="k-btn" onclick="wahlAuf(\'planakt\')">' +
       'Vorhandene Aktivit\u00e4t zuordnen</button></div>';

  h += '<div class="hinweis">Aktivit\u00e4ten geh\u00f6ren diesem Plan an, existieren aber nur ' +
       'einmal. Auf der Checkliste tr\u00e4gt jede von ihnen ein \u2192 mit dem Plannamen. ' +
       'Das Kreuz l\u00f6st die Zuordnung, l\u00f6scht die Aktivit\u00e4t aber nicht.</div>';
  $('blatt').innerHTML = h;
  fokusSetzen();
}
function planLoesen(aid) {
  const a = AKTIVITAETEN.find(x => x.id === aid);
  if (a) { a.planId = null; renderAlles(); melde('Aus dem Plan gel\u00f6st'); }
}
function planAktNeu(pid) {
  const p = PLAENE.find(x => x.id === pid);
  aufraeumen();
  const a = { id:naechsteId(), t:'', b:p ? p.b : ersterBereichId(), prio:'B', min:0,
              wer:'', beginn:'', ende:'', glyph:'\u2022', heute:false, planId:pid };
  AKTIVITAETEN.push(a);

}

function blattPlaene() {
  const u = unterAktiv.plaene;
  if (u === 'uebersicht') { blattPlanUebersicht(); return; }
  blattPlan(u);
}

/* ═══ BLATT: JAHRESPLAN (CMP 20) ═══ */
/* ═══ BLATT: ZIELE (CMP 30) ═══ */
/* ═══════════════════════════════════════════════════════════════════
   ZIELE (CMP 30)
   Ein Ziel ist ein konkretes Vorhaben mit definiertem Zustand, immer
   einem Bereich zugeordnet. Einzahlen können Pläne, einzelne
   Aktivitäten, wiederkehrende Vorgänge und Gewohnheiten.
   ═══════════════════════════════════════════════════════════════════ */

/* Planaktivitäten zahlen mittelbar über ihren Plan ein — sie hier noch
   einmal zu zeigen, hiesse dieselbe Zeile zweimal aufs Blatt zu setzen. */
function zielAktivitaeten(zid) {
  return AKTIVITAETEN.filter(a => a.zielId === zid && !a.planId);
}
function zielPlaene(zid)  { return PLAENE.filter(p => p.zielId === zid && !p.archiviert); }
function zielWieder(zid)  { return WIEDER.filter(w => w.zielId === zid); }
function zielGewohnheit(zid) { return GEWOHNHEIT.filter(g => g.zielId === zid); }
function zielAnzahl(zid) {
  return zielPlaene(zid).length + zielAktivitaeten(zid).length +
         zielWieder(zid).length + zielGewohnheit(zid).length;
}
function zielNeu() {
  const z = { id:'z' + naechsteId(), t:'Neues Ziel', b:ersterBereichId(),
              start:HEUTE_DMY, frist:'', archiviert:false,
              zustand:['', ''], meilensteine:[] };
  ZIELE.push(z);
  reg = 'ziele';
  unterAktiv.ziele = z.id;
  renderAlles();
  melde('Ziel angelegt \u2014 Titel und Zustand antippen');
}
function zielArchivieren(zid) {
  const z = ZIELE.find(x => x.id === zid);
  if (!z) { return; }
  z.archiviert = true;
  unterAktiv.ziele = 'uebersicht';
  renderAlles();
  melde('Archiviert \u2014 zu finden unter Datenbank \u203a Archiv');
}
function zielReaktivieren(zid) {
  const z = ZIELE.find(x => x.id === zid);
  if (!z) { return; }
  z.archiviert = false;
  reg = 'ziele';
  unterAktiv.ziele = zid;
  renderAlles();
  melde('Ziel reaktiviert');
}
function zielLoeschen(zid) {
  const i = ZIELE.findIndex(x => x.id === zid);
  if (i === -1) { return; }
  /* Nur die Zuordnungen fallen weg — Pläne und Aktivitäten bleiben. */
  PLAENE.forEach(function (p) { if (p.zielId === zid) { p.zielId = null; } });
  [AKTIVITAETEN, WIEDER, GEWOHNHEIT].forEach(function (l) {
    l.forEach(function (x) { if (x.zielId === zid) { x.zielId = null; } });
  });
  ZIELE.splice(i, 1);
  unterAktiv.ziele = 'uebersicht';
  renderAlles();
  melde('Ziel gel\u00f6scht, alles Zugeordnete bleibt bestehen');
}
function zielLoesen(art, id) {
  const l = art === 'plan' ? PLAENE : art === 'akt' ? AKTIVITAETEN
          : art === 'wied' ? WIEDER : GEWOHNHEIT;
  const x = l.find(y => y.id === id);
  if (x) { x.zielId = null; renderAlles(); melde('Vom Ziel gel\u00f6st'); }
}

/* ── Kopfzeilen und Frist ────────────────────────────────────────── */
function zielFeld(zid, feld, i) {
  editZelle = { art:'ziel', id:zid, feld:feld, zeile:i };
  fokusZiel = 'ez';
  renderAlles();
}
function zielSchreiben() {
  if (!editZelle || editZelle.art !== 'ziel') { return; }
  const z = ZIELE.find(x => x.id === editZelle.id);
  const f = $('ez');
  if (!z || !f) { return; }
  if (editZelle.feld === 'zustand') { z.zustand[editZelle.zeile] = f.value; }
  else if (editZelle.feld === 'frist') { z.frist = f.value.trim(); }
  else if (editZelle.feld === 'start') { z.start = f.value.trim() || z.start; }
}
function zielSchliessen(sofort) {
  zielSchreiben();
  if (sofort) { editZelle = null; renderAlles(); return; }
  const merk = editZelle;
  setTimeout(function () { if (editZelle === merk) { editZelle = null; renderAlles(); } }, 120);
}
function zielTaste(ev) {
  if (ev.key === 'Escape') { ev.preventDefault(); editZelle = null; renderAlles(); }
  if (ev.key === 'Enter' || ev.key === 'Tab') { ev.preventDefault(); zielSchliessen(true); }
}
function zielOffen(zid, feld, i) {
  return editZelle && editZelle.art === 'ziel' && editZelle.id === zid &&
         editZelle.feld === feld && (i === undefined || editZelle.zeile === i);
}

/* ── Meilensteine: informativ, aber abhakbar ─────────────────────── */
function msFinde(id) {
  for (let i = 0; i < ZIELE.length; i++) {
    const m = ZIELE[i].meilensteine.find(x => x.id === id);
    if (m) { return m; }
  }
  return null;
}
function msGlyph(id) {
  const m = msFinde(id);
  if (m) { m.glyph = naechsterGlyph(m.glyph); renderAlles(); }
}
function msNeu(zid) {
  const z = ZIELE.find(x => x.id === zid);
  if (!z) { return; }
  const m = { id:naechsteId(), t:'', dat:'', glyph:'\u2022' };
  z.meilensteine.push(m);
  editZelle = { art:'ms', id:m.id, feld:'t' };
  fokusZiel = 'ez';
  renderAlles();
}
function msLoeschen(id) {
  ZIELE.forEach(function (z) {
    const i = z.meilensteine.findIndex(x => x.id === id);
    if (i !== -1) { z.meilensteine.splice(i, 1); }
  });
  editZelle = null;
  renderAlles();
}
function msOeffnen(id, feld) {
  msAufraeumen();
  editZelle = { art:'ms', id:id, feld:feld };
  fokusZiel = 'ez';
  renderAlles();
}
function msAufraeumen() {
  const schonen = editZelle ? editZelle.id : null;
  ZIELE.forEach(function (z) {
    for (let i = z.meilensteine.length - 1; i >= 0; i--) {
      if (!z.meilensteine[i].t && z.meilensteine[i].id !== schonen) {
        z.meilensteine.splice(i, 1);
      }
    }
  });
}
function msSchreiben() {
  if (!editZelle || editZelle.art !== 'ms') { return; }
  const m = msFinde(editZelle.id);
  const f = $('ez');
  if (m && f) { m[editZelle.feld] = f.value.trim(); }
}
function msSchliessen(sofort) {
  msSchreiben();
  if (sofort) { editZelle = null; msAufraeumen(); renderAlles(); return; }
  const merk = editZelle;
  setTimeout(function () {
    if (editZelle === merk) { editZelle = null; msAufraeumen(); renderAlles(); }
  }, 120);
}
function msTaste(ev, zid) {
  if (ev.key === 'Escape') { ev.preventDefault(); editZelle = null; msAufraeumen(); renderAlles(); }
  if (ev.key === 'Tab' && editZelle && editZelle.feld === 't') {
    ev.preventDefault();
    msSchreiben();
    msOeffnen(editZelle.id, 'dat');
    return;
  }
  if (ev.key === 'Enter' || ev.key === 'Tab') {
    ev.preventDefault();
    msSchreiben();
    const leer = !$('ez') || !$('ez').value.trim();
    editZelle = null;
    msAufraeumen();
    if (leer && editZelle === null) { renderAlles(); } else { msNeu(zid); }
  }
}

/* ── Übersicht ───────────────────────────────────────────────────── */
function blattZielUebersicht() {
  const aktive = ZIELE.filter(z => !z.archiviert);
  kopf('Ziele \u2014 \u00dcbersicht', aktive.length + (aktive.length === 1 ? ' Ziel' : ' Ziele'),
       '<button class="k-btn pri" onclick="zielNeu()">+ Ziel</button>');

  let h = '<table class="atab ptab"><colgroup><col><col style="width:88px">' +
    '<col style="width:52px"><col style="width:26px"></colgroup>' +
    '<thead><tr><th>Ziel</th><th class="r">Laufzeit</th><th class="r">Zahlt ein</th>' +
    '<th></th></tr></thead><tbody>';

  BEREICHE.forEach(function (b) {
    const l = aktive.filter(z => z.b === b.id);
    if (!l.length) { return; }
    h += '<tr class="grp"><td colspan="4"><span class="tz-punkt" style="background:' +
      b.farbe + '"></span>' + esc(b.name) + '</td></tr>';
    l.forEach(function (z) {
      h += '<tr class="klick" onclick="zeigeUnter(\'' + z.id + '\')">' +
        '<td><span class="p-titel p-link">' + esc(z.t) + '</span>' +
        '<span class="p-besch">' + esc(z.zustand[0] || '\u2014') + '</span></td>' +
        '<td class="dat">' + esc(z.start) + '<div>' +
        esc(z.frist || 'offen') + '</div></td>' +
        '<td class="r">' + zielAnzahl(z.id) + '</td>' +
        '<td class="mitte p-chev">\u203a</td></tr>';
    });
  });
  h += '</tbody></table>';
  h += '<div class="hinweis">Die Spalte Zahlt ein z\u00e4hlt, wie viele Pl\u00e4ne, ' +
       'Aktivit\u00e4ten, wiederkehrende Vorg\u00e4nge und Gewohnheiten diesem Ziel ' +
       'zugeordnet sind. Bewusst kein Prozentwert \u2014 ein Ziel ist ein Zustand, ' +
       'kein Bruchteil.</div>';
  $('blatt').innerHTML = h;
}

/* ── Zielblatt ───────────────────────────────────────────────────── */
function zielZeile(art, id, glyph, titel, meta, aktion) {
  return '<div class="zl-z">' + hakFeld(glyph, aktion) +
    '<span class="zl-t">' + esc(titel) + '</span>' +
    (meta ? '<span class="zl-m">' + esc(meta) + '</span>' : '') +
    '<button class="mon-x" onclick="event.stopPropagation(); zielLoesen(\'' + art +
    '\',' + (typeof id === 'string' ? '\'' + id + '\'' : id) +
    ')" title="Vom Ziel l\u00f6sen">\u00d7</button></div>';
}

function blattZiel(zid) {
  const z = ZIELE.find(x => x.id === zid);
  if (!z) { unterAktiv.ziele = 'uebersicht'; blattZielUebersicht(); return; }

  kopf(z.t, bName(z.b) + (z.frist ? ' \u00b7 Frist ' + z.frist : ''),
       '<button class="k-btn" onclick="wahlAuf(\'zielzu\')">Zuordnen</button>' +
       '<button class="k-btn" onclick="zielArchivieren(\'' + z.id + '\')">Archivieren</button>' +
       '<button class="k-btn" onclick="zielLoeschen(\'' + z.id + '\')">L\u00f6schen</button>');

  /* Zwei Kopfzeilen: der Zustand, der gilt, wenn das Ziel erreicht ist */
  let h = '<div class="p-kopf">';
  for (let i = 0; i < 2; i++) {
    if (zielOffen(z.id, 'zustand', i)) {
      h += '<div class="p-kz offen"><input class="zf" id="ez" value="' +
        esc(z.zustand[i] || '') + '" placeholder="' +
        (i === 0 ? 'Welcher Zustand gilt, wenn es erreicht ist?' : 'Warum lohnt es sich?') +
        '" onblur="zielSchliessen()" onkeydown="zielTaste(event)"></div>';
    } else {
      h += '<div class="p-kz" onclick="zielFeld(\'' + z.id + '\',\'zustand\',' + i +
        ')">' + esc(z.zustand[i] || '') + '</div>';
    }
  }
  /* Laufzeit: Start ist Pflicht, die Frist darf offen bleiben. */
  h += '<div class="zl-lauf"><span class="zl-lauf-l">Laufzeit</span>';
  ['start', 'frist'].forEach(function (feld) {
    if (zielOffen(z.id, feld)) {
      h += '<span class="zl-lauf-f offen"><input class="zf" id="ez" value="' +
        esc(z[feld] || '') + '" placeholder="TT.MM.JJJJ" onblur="zielSchliessen()" ' +
        'onkeydown="zielTaste(event)"></span>';
    } else {
      h += '<span class="zl-lauf-f" onclick="zielFeld(\'' + z.id + '\',\'' + feld +
        '\')">' + esc(z[feld] || (feld === 'frist' ? 'offen' : '\u2014')) + '</span>';
    }
    if (feld === 'start') { h += '<span class="zl-lauf-b">bis</span>'; }
  });
  h += '</div>';

  const pl = zielPlaene(z.id), ak = zielAktivitaeten(z.id);
  const wi = zielWieder(z.id), gw = zielGewohnheit(z.id);

  if (pl.length) {
    h += '<div class="abschnitt">' + abschnitt('Pl\u00e4ne', pl.length + '');
    h += pl.map(function (p) {
      const f = planFortschritt(p.id);
      const g = (f.gesamt > 0 && f.fertig === f.gesamt) ? '\u2715' : '\u2022';
      return '<div class="zl-z">' + hakFeld(g, 'blattOeffnen(\'plaene\',\'' + p.id + '\')') +
        '<span class="zl-t zl-link" onclick="blattOeffnen(\'plaene\',\'' + p.id +
        '\')">' + esc(p.t) + '</span>' +
        '<span class="zl-m">' + f.fertig + '/' + f.gesamt + '</span>' +
        '<button class="mon-x" onclick="event.stopPropagation(); zielLoesen(\'plan\',\'' +
        p.id + '\')" title="Vom Ziel l\u00f6sen">\u00d7</button></div>';
    }).join('') + '</div>';
  }
  if (ak.length) {
    h += '<div class="abschnitt">' + abschnitt('Einzelne Aktivit\u00e4ten', 'ohne Plan');
    h += ak.map(function (a) {
      return zielZeile('akt', a.id, a.glyph, a.t,
                       a.prio + ' \u00b7 ' + a.min + ' Min',
                       'glyphWeiter(' + a.id + ')');
    }).join('') + '</div>';
  }
  if (wi.length) {
    h += '<div class="abschnitt">' + abschnitt('Wiederkehrend', 'Verhalten anpassen');
    h += wi.map(function (w) {
      return zielZeile('wied', w.id, w.log[HEUTE_WT] || '\u2022', w.t, w.muster,
                       'wiederWeiter(' + w.id + ',' + HEUTE_WT + ')');
    }).join('') + '</div>';
  }
  if (gw.length) {
    h += '<div class="abschnitt">' + abschnitt('Gewohnheiten', 'einüben');
    h += gw.map(function (g) {
      const erf = [0,1,2,3,4,5,6].filter(d => g.log[d] === '\u2715').length;
      return zielZeile('gew', g.id, g.log[HEUTE_WT] || '\u2022', g.t,
                       erf + '/' + g.soll, 'gewWeiter(' + g.id + ',' + HEUTE_WT + ')');
    }).join('') + '</div>';
  }
  if (!pl.length && !ak.length && !wi.length && !gw.length) {
    h += '<div class="hinweis">Noch nichts zugeordnet. \u00dcber Zuordnen holst du ' +
         'Pl\u00e4ne, Aktivit\u00e4ten, wiederkehrende Vorg\u00e4nge oder Gewohnheiten hierher.</div>';
  }

  /* Meilensteine: informativ, aber abhakbar — geplantes Datum und
     tatsächliches Erreichen fallen auseinander.                       */
  h += '<div class="ms-block"><div class="refl-l">Meilensteine</div>';
  h += z.meilensteine.map(function (m) {
    const kreuz = '<button class="mon-x" onclick="event.stopPropagation(); msLoeschen(' +
      m.id + ')" title="Meilenstein l\u00f6schen">\u00d7</button>';
    let titel;
    if (editZelle && editZelle.art === 'ms' && editZelle.id === m.id && editZelle.feld === 't') {
      titel = '<span class="zl-t mon-offen"><input class="zf" id="ez" value="' + esc(m.t) +
        '" placeholder="Zwischenstand" onblur="msSchliessen()" onkeydown="msTaste(event,\'' +
        z.id + '\')"></span>';
    } else {
      titel = '<span class="zl-t ' + titelKlasse(m) + '" onclick="msOeffnen(' + m.id +
        ',\'t\')">' + esc(m.t) + '</span>';
    }
    let dat;
    if (editZelle && editZelle.art === 'ms' && editZelle.id === m.id && editZelle.feld === 'dat') {
      dat = '<span class="zl-m mon-offen"><input class="zf r" id="ez" value="' + esc(m.dat) +
        '" placeholder="TT.MM.JJJJ" onblur="msSchliessen()" onkeydown="msTaste(event,\'' +
        z.id + '\')"></span>';
    } else {
      dat = '<span class="zl-m" onclick="msOeffnen(' + m.id + ',\'dat\')">' +
        esc(m.dat || '\u2014') + '</span>';
    }
    return '<div class="zl-z">' + hakFeld(m.glyph, 'msGlyph(' + m.id + ')') +
      titel + dat + kreuz + '</div>';
  }).join('');
  h += '<div class="zl-z neu-z" onclick="msNeu(\'' + z.id + '\')">' +
       '<span class="a-neu">antippen und schreiben</span></div></div>';

  $('blatt').innerHTML = h;
  fokusSetzen();
}

/* ── Ziele über das Jahr (CMP 22) ─────────────────────────────────
   Der Erkenntniswert steckt in den Enden: laufen vier Fristen im selben
   Monat zusammen, hat man sich zu viel gleichzeitig vorgenommen.
   Deshalb ist das Fristende kräftig markiert, nicht der Balken.      */
function dmyTeile(d) {
  const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec((d || '').trim());
  if (!m) { return null; }
  return { tag:parseInt(m[1], 10), monat:parseInt(m[2], 10), jahr:parseInt(m[3], 10) };
}
function blattZielJahr() {
  const l = ZIELE.filter(z => !z.archiviert);
  kopf('Ziele im Jahr ' + jahrOffen, l.length + (l.length === 1 ? ' Ziel' : ' Ziele'),
       '<button class="k-btn" onclick="jahrBlaettern(-1)">\u2039</button>' +
       '<button class="k-btn" onclick="jahrBlaettern(1)">\u203a</button>');

  let h = '<table class="zj-tab"><colgroup><col style="width:168px">';
  for (let m = 0; m < 12; m++) { h += '<col>'; }
  h += '</colgroup><thead><tr><th></th>' +
       MONATE.map(function (m) { return '<th>' + m + '</th>'; }).join('') +
       '</tr></thead><tbody>';

  let sichtbar = 0;
  h += l.map(function (z) {
    const a = dmyTeile(z.start);
    const e = dmyTeile(z.frist);
    if (!a) { return ''; }
    /* Ein Ziel erscheint, wenn seine Spanne dieses Jahr berührt. Ohne
       Frist läuft der Balken bis zum Jahresende weiter.               */
    const vonM = (a.jahr < jahrOffen) ? 1 : (a.jahr === jahrOffen ? a.monat : 99);
    let bisM;
    if (!e) { bisM = 12; }
    else { bisM = (e.jahr > jahrOffen) ? 12 : (e.jahr === jahrOffen ? e.monat : 0); }
    if (vonM > 12 || bisM < 1 || vonM > bisM) { return ''; }
    sichtbar++;
    let z2 = '<tr class="klick" onclick="zeigeUnter(\'' + z.id + '\')">' +
      '<td class="zj-t"><span class="tz-punkt" style="background:' + bFarbe(z.b) +
      '"></span>' + esc(z.t) + '</td>';
    for (let m = 1; m <= 12; m++) {
      const an = m >= vonM && m <= bisM;
      const ende = an && e && e.jahr === jahrOffen && m === e.monat;
      const start = an && a.jahr === jahrOffen && m === a.monat;
      z2 += '<td class="zj-c">' + (an ?
        '<span class="zj-bal' + (start ? ' erste' : '') + (ende ? ' frist' : '') +
        '" style="background:' + bFarbe(z.b) + '"></span>' : '') + '</td>';
    }
    return z2 + '</tr>';
  }).join('');
  h += '</tbody></table>';

  if (!sichtbar) {
    h += '<div class="hinweis">Kein Ziel ber\u00fchrt dieses Jahr.</div>';
  } else {
    /* Häufungen an den Fristenden sichtbar machen */
    const proMonat = [];
    for (let m = 0; m < 12; m++) { proMonat.push(0); }
    l.forEach(function (z) {
      const e = dmyTeile(z.frist);
      if (e && e.jahr === jahrOffen) { proMonat[e.monat - 1] += 1; }
    });
    const eng = [];
    proMonat.forEach(function (n, i) { if (n > 1) { eng.push(MONATE[i] + ' (' + n + ')'); } });
    h += '<div class="hinweis">Die kr\u00e4ftige Kante markiert das Fristende. ' +
      (eng.length
        ? 'Mehrere Fristen fallen zusammen: ' + eng.join(', ') + '.'
        : 'Derzeit f\u00e4llt keine Frist mit einer anderen zusammen.') + '</div>';
  }
  $('blatt').innerHTML = h;
}

function blattZiele() {
  const u = unterAktiv.ziele;
  if (u === 'uebersicht') { blattZielUebersicht(); return; }
  if (u === 'zjahr') { blattZielJahr(); return; }
  blattZiel(u);
}
